        args:
          template: "Løs følgende matematikproblem trin for trin. Sæt det endelige numeriske svar (uden enheder, valutasymboler eller procenttegn) i \\boxed{{}}, for eksempel: \\boxed{{42}}.\n\n{prompt}"
      - name: generate

    scorers:
      - name: math

  - id: synthetic_dan
