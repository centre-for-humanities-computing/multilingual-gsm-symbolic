name: Multilingual GSM-Symbolic
description: >
  Multilingual symbolic math benchmark derived from GSM8K. Evaluating on both the
  original concrete problems and symbolically-generated variants lets you measure
  how much a model relies on memorisation vs. genuine arithmetic reasoning.
evaluation_framework: inspect-ai

tasks:
  - id: original_eng
    config: eng
    split: test_original

    field_spec:
      input: question
      target: target
      metadata:
        - answer
        - language
        - source_id

    solvers:
      - name: prompt_template
        args:
          template: "Solve the following math problem step by step. Put your final numeric answer (without units, currency symbols, or percentage signs) in \\boxed{{}}, for example: \\boxed{{42}}.\n\n{prompt}"
      - name: generate

    scorers:
      - name: math

  - id: synthetic_eng
    config: eng
    split: test_synthetic

    field_spec:
      input: question
      target: target
      metadata:
        - answer
        - language
        - source_id

    solvers:
      - name: prompt_template
        args:
          template: "Solve the following math problem step by step. Put your final numeric answer (without units, currency symbols, or percentage signs) in \\boxed{{}}, for example: \\boxed{{42}}.\n\n{prompt}"
      - name: generate

    scorers:
      - name: math

  - id: original_dan
    config: dan
    split: test_original

    field_spec:
