question = "Sunny uyaokuthengisa ingobhoqo kanye no-iphule uphayi ngomcimbi wokuhlanganisa imali. NgeUMqibelo, wathengisa 10 amabhokisi e-ingobhoqo namabhokisi angu-4 ambalwa e-iphule uphayi, kunalokho kwakunikezwe ngeiSonto. NgeiSonto, wathengisa amabhokisi angu-5 amaningi e-ingobhoqo kunalokho kwakunikezwe ngeUMqibelo namabhokisi angu-15 e-iphule uphayi. Uma i-ingobhoqo ibiza $6 futhi u-iphule uphayi ubiza $15, imali engakanani u-Sunny azitholayo ezinsukwini ezimbili?"
answer = "Wathengisa 10 + 5 = <<10+5=15>>15 amabhokisi e-ingobhoqo ngeiSonto.\nInani eliphelele lamabhokisi e-ingobhoqo u-Sunny azithengisile lingu-10 + 15 = <<10+15=25>>25.\nU-Sunny wathola 25*$6 = $<<25*6=150>>150 ngokuthengisa i-ingobhoqo.\nWathengisa 15 - 4 = <<15-4=11>>11 amabhokisi e-iphule uphayi ngeUMqibelo.\nInani eliphelele lamabhokisi e-iphule uphayi u-Sunny azithengisile lingu-15 + 11 = <<15+11=26>>26.\nWathola 26*$15 = $<<26*15=390>>390 ngokuthengisa u-iphule uphayi.\nNgakho-ke, u-Sunny wathola $150 + $390 = $<<150+390=540>>540 ezinsukwini ezimbili.\n#### 540\n"
