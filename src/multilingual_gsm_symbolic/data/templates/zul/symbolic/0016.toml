answer_annotated = "Wathengisa {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} amabhokisi e-{food} nge{d2}.\nInani eliphelele lamabhokisi e-{food} u-{name} azithengisile lingu-{n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\nu-{name} wathola {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} ngokuthengisa i-{food}.\nWathengisa {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} amabhokisi e-{fruit} uphayi nge{d1}.\nInani eliphelele lamabhokisi e-{fruit} uphayi u-{name} azithengisile lingu-{m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nWathola {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} ngokuthengisa u-{fruit} uphayi.\nNgakho-ke, u-{name} wathola {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} ezinsukwini ezimbili.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
