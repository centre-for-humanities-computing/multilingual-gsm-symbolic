question = "Ngokwemininingwane yayo yokudla, isikhwama se-ichips sines 250 amakhilori ngesihlalo. Uma isikhwama se-300 igremu sines 5 izingcezu, ungadla kangakanani igremus uma umgomo wakho wamakhilori wansuku zonke engu-2000 futhi usudliwe 1800 amakhilori?"
answer = "Uma umgomo ophelele wamakhilori engu-2000 futhi ngidliwe 1800 amakhilori nginawo 2000-1800 = <<2000-1800=200>>200 amakhilori okusele ukudla\nUma ingxenye ngayinye se-ichips sines 250 amakhilori futhi nginawo kuphela 200 amakhilori okusele ukudla, ngingadla kuphela 200/250 yengxenye = 4/5 yengxenye\nSiyazi futhi ukuthi isikhwama se-300 igremu se-ichips sines 5 izingcezu, ngakho-ke ingxenye ngayinye sines 300 igremu/5 = <<300/5=60>>60 igremus\nUma ngingadla kuphela 4/5 yengxenye, ngingadla kuphela 60 igremu * 4/5 = 48 igremus\n#### 48\n"
