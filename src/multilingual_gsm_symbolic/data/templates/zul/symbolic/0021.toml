question = "Frankie ubuka i-TV ngemuva kokuba ephelele umsebenzi wasekhaya nsuku zonke. Kusuku luka-Imvulo no-Lwesibili, wabukela iqoqo elilodwa le-1 yehora lombukiso wakhe owuthandayo ngalinye. Kusuku luka-Lwesithathu, wabukela amaqoqo ambalwa ombukiso we-30 wemizuzu. Kusuku luka-Lwesine, waphothula umsebenzi wasekhaya ngaphambi kokuba kufanele wabe esebukela iqoqo le-1 yehora kanye nombukiso we-30 wemizuzu. Kusuku luka-Lwesihlanu, wahlala evuke kambe, ngakho wabukela kubili amaqoqo e-1 yehora. Uma ebuke izinhora ezi-7 ze-TV kuyo yonke, wabukela mangaki amaqoqo e-30 wemizuzu ku-Lwesithathu?"
