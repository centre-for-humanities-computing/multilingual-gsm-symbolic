question = "Endlini ka-Allan, kukhona kabili amaningi umbila kunama-i-cannoli. Unenani eliphelele lama-40 i-cannoli endlini yakhe. Allan wathenga ama-60 i-cannoli amaningi esitolo namanye ama-40 umbila amancane kunenani lama-i-cannoli. Thola inani eliphelele lama-umbila nama-i-cannoli Allan anawo endlini?"
answer = "Ngaphambi kokuthenga noma yikuphi umbila no-i-cannoli, Allan wayenama-umbila kabili kunama-i-cannoli, okuyi-40 i-cannolis*2 umbila/i-cannoli = <<40*2=80>>80 ama-umbila\nInani eliphelele lama-umbila nama-i-cannoli Allan alinawo ngaphandle lilingana no-80 ama-umbila + 40 i-cannolis = <<80+40=120>>120 izinto\nLapho ethenga ama-40 umbila amancane kunama-i-cannoli, wathenga ama-60 umbilas - ama-40 umbilas = <<60-40=20>>20 ama-umbila\nNgokuphelele, wathenga ama-20 ama-umbila + ama-60 i-cannolis = <<20+60=80>>80 izinto\nNgemuva kwezibalo, Allan unama-120 izinto + ama-80 izinto = <<120+80=200>>200 ama-umbila nama-i-cannoli aphelele.\n#### 200\n"
