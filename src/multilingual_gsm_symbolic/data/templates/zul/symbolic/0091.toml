answer_annotated = "Ngaphambi kokuthenga noma yikuphi {food1} no-{food2}, {name} wayenama-{food1} {mult_txt} kunama-{food2}, okuyi-{n} {food2}s*{mult_val} {food1}/{food2} = <<{n}*{mult_val}={n*mult_val}>>{n*mult_val} ama-{food1}\nInani eliphelele lama-{food1} nama-{food2} {name} alinawo ngaphandle lilingana no-{n*mult_val} ama-{food1} + {n} {food2}s = <<{n*mult_val}+{n}={n*mult_val+n}>>{n*mult_val+n} izinto\nLapho ethenga ama-{k} {food1} amancane kunama-{food2}, wathenga ama-{m} {food1}s - ama-{k} {food1}s = <<{m}-{k}={m-k}>>{m-k} ama-{food1}\nNgokuphelele, wathenga ama-{m-k} ama-{food1} + ama-{m} {food2}s = <<{m-k}+{m}={2*m-k}>>{2*m-k} izinto\nNgemuva kwezibalo, {name} unama-{n*mult_val+n} izinto + ama-{2*m-k} izinto = <<{n*mult_val+n}+{2*m-k}={n*mult_val+n+2*m-k}>>{n*mult_val+n+2*m-k} ama-{food1} nama-{food2} aphelele.\n#### {n*mult_val+n+2*m-k}\n"
