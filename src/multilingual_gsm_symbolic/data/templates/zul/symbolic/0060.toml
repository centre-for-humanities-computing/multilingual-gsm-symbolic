question = "Watson use ishintshi yamahora angu-10 nsuku zonke, hlanu izinsuku ngesonto. Uthola R10 ngehora futhi uthola ibhonasi engu-R300 ngesonto uma inkampani isebenza kahle. Imali engakanani eyenzile u-Watson ngo-Apreli uma inkampani isebenza kahle kakhulu impela yonke inyanga?"
