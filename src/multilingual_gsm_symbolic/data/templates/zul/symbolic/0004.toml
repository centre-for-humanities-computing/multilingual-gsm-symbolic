question = "Garrett uphoshela ipopcorn yokudla okuncane. Njengoba isitsha sezikhaba zishisa, izikhaba ziqala ukuphuma ngokushesha. 20 ziphuma emizuzwini yokuqala engu-30 yokupheka, bese kuthi okuthathu izikhathi leyo nqobo emizuzwini elandelayo engu-30. Izikhaba zenyuka zaba okune izikhathi isivinini sokuqala sokuphuma emizuzwini elandelayo engu-30, kodwa emizuzwini yokugcina engu-30, ukuphuma kuyancipha kube yingxenye yesivinini njengasezinsukwini ezidlule zengama-30. Ngemuva kokuthi Garrett ethathe isitsha esitsheni esishisayo, ingxenye yesine yenani lezikhaba ezaphuma emizuzwini yokugcina engu-30 yokupheka ziphuma ngenxa yokushisa okusele. Zingaki izingcezu zepopcorn Garrett azidinga ukuzidla?"
