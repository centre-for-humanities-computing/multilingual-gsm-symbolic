question = "Kukhona manje 3 amabola bomvu, 11 amabola blu kanye no-25 amabola luhlaza kwi-isitolo. Amabola bomvu abiza R9, amabola blu abiza R5 kanye namabola luhlaza abiza R3. Ngakanani okuzotholwa yi-isitolo emva kokuthi zonke izibola zithengisiwe?"
