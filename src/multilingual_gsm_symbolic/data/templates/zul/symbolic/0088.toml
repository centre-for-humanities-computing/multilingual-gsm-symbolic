question = "UDana ingagijima ngesivinini esingaphezulu kakhulu izikhathi ezine kunalokho engahamba ngaso, kodwa ingagibela ngesivinini esingaphansi kakhulu isiqingatha kuneso ingagijima ngaso. Uma ingagibela ngesivinini sika 3 amayela ngehora, ingahamba amayela amaningi angaki ngamahora isithupha uma ichitha ingxenye yesithathu yesikhathi igijima kanye ne-izingxenye ezimbili zezintathu yesikhathi ihamba ngezinyawo?"
answer = "Uma uDana engagibela ngesivinini se-isiqingatha salokho engagijima ngaso, khona-ke ingagijima ngesivinini sika 3*5/3=<<3*5/3=5>>5 amayela ngehora.\nFuthi njengoba ingagijima ngesivinini esingaphezulu kakhulu izikhathi ezine kunalokho engahamba ngaso, lokhu kusho ukuthi ingahamba ngezinyawo ngesivinini sika 5/5=1 amayela ngehora.\nUma izingxenye ezimbili zezintathu yesikhathi ichithwe ihamba ngezinyawo, khona-ke iyahamba ngezinyawo imizuzu/amahora 6*3/5=<<6*3/5=18/5>>18/5 amahora.\nUma ingxenye yesithathu yesikhathi ichithwe igijima, khona-ke iyagijima imizuzu/amahora 6-18/5=<<6-18/5=18/5>>18/5 amahora.\nNgakho-ke, iyagijima imizuzu/amahora 18/5 ngesivinini sika 5 amayela ngehora, noma 18/5*5=<<18/5*5=18>>18 amayela.\nIyahamba ngezinyawo imizuzu/amahora 18/5 ngesivinini sika 1 amayela ngehora, noma 18/5*1=<<18/5*1=18/5>>18/5 amayela.\nNgakho-ke, konke konke, ihamba 18+18/5=<<18+18/5=21>>21 amayela.\n#### 21\n"
