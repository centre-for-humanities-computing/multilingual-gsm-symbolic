question = "يمكن لدانا الركض بسرعة أربعة أضعاف سرعة مشيها، لكنها يمكنها القفز بسرعة تساوي نصف سرعة ركضها. إذا كانت تقفز بسرعة 3 كيلومترات في الساعة، فكم كيلومترًا يمكنها قطعها في ست ساعات إذا قضت ثلث الوقت في الركض وثلثي الوقت في المشي؟"
answer = "إذا كانت دانا تقفز بنصف سرعة ركضها، فإنها يمكنها الركض بسرعة 3*2=<<3*2=6>>6 كيلومترات في الساعة.\nوبما أنها يمكنها الركض بسرعة أربعة أضعاف سرعة مشيها، فهذا يعني أنها يمكنها المشي بسرعة 6/4=1.5 كيلومتر في الساعة.\nإذا قضت ثلثي الوقت في المشي، فإنها تمشي لمدة 6*2/3=<<6*2/3=4>>4 ساعات.\nإذا قضت ثلث الوقت في الركض، فإنها تركض لمدة 6-4=<<6-4=2>>2 ساعة.\nوبالتالي، فإنها تركض لمدة ساعتين بسرعة 6 كيلومترات في الساعة، أي 2*6=<<2*6=12>>12 كيلومترًا.\nوتمشي لمدة 4 ساعات بسرعة 1.5 كيلومتر في الساعة، أي 4*1.5=<<4*1.5=6>>6 كيلومترات.\nوبالتالي، فإنها تقطع معًا 12+6=<<12+6=18>>18 كيلومترًا.\n#### 18\n"
