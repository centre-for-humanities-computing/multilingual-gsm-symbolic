question = "ذهبت سارة إلى الشاطئ لقضاء العطلة. أعطتها والديها $15 لشراء ما تريد. في متجر التذكارات، كانت الحلوى اللزجة معروضة بخصم \"اشترِ 500 جرام مقابل $3، احصل على 500 جرام مقابل 1/2 السعر.\" جمعت 2000 جرام. كما اشترت كيسًا مختلطًا من أصداف البحر مقابل $1.5 و 4 مغناطيسًا بسعر $0.25 لكل منها. كم من المال تبقى لـسارة؟"
answer = "تكلف الحلوى اللزجة $3 مقابل 500 جرام وتحصل على 500 جرام مقابل 1/2 السعر. إذن 1/2 من سعر 500 جرام هو 500/500*1/2*$3 = $1.5.\nمعًا، هذا يكلف $1.5 + $3 = $4.5.\nالجرامات المتبقية 1000 لا تخضع للخصم وتكلف $6، لذا السعر الإجمالي هو $3 + $1.5 + $6 = $<<3 + 1.5 + 6 = 10.5>>10.5\n4 مغناطيسًا بسعر $0.25 لكل منها هو 4*$0.25=$<<4*0.25=1>>1\nعند جمع كل مشترياتها، $10.5 + $1.5 + $1 = $<<10.5+1.5+1=13>>13\nكان لديها $15 وأنفقت $13، لذا لديها $15 - $13 = $<<15-13=2>>2 متبقية\n#### 2\n"
