question = "وفقًا لمعلوماتها الغذائية، تحتوي حبة من رقائق البطاطس على 250 سعرة حرارية لكل حصة. إذا كانت الحبة 300 جرام تحتوي على 5 حصص، فكم جرام يمكنك أكلها إذا كان هدفك اليومي من السعرات الحرارية 2000 وقد استهلكت بالفعل 1800 سعرة حرارية؟"
answer = "إذا كان هدف السعرات الحرارية الإجمالي 2000 وقد استهلكت 1800 سعرة حرارية، إذن لدي 2000-1800 = <<2000-1800=200>>200 سعرة حرارية متبقية للأكل\nإذا كانت كل حصة من رقائق البطاطس تحتوي على 250 سعرة حرارية ولدي فقط 200 سعرة حرارية متبقية للأكل، إذن يمكنني أكل 200/250 من الحصة = 4/5 من الحصة\nنعلم أيضًا أن حبة رقائق البطاطس 300 جرام تحتوي على 5 حصص، إذن كل حصة تحتوي على 300 جرام/5 = <<300/5=60>>60 جرام\nإذا كان يمكنني أكل 4/5 من الحصة فقط، إذن يمكنني أكل 60 جرام * 4/5 = 48 جرام\n#### 48\n"
