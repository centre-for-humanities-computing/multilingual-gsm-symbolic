question = "Frankie يشاهد التلفاز بعد أن ينهي واجباته المدرسية كل ليلة. في الاثنين والثلاثاء، شاهد حلقة مدتها 1-ساعة من مسلسله المفضل كل ليلة. في الأربعاء، شاهد بضع حلقات من مسلسل مدته 30-دقيقة. في الخميس، أنهى واجباته مبكرًا وشاهد حلقة مدتها 1-ساعة ومسلسل مدته 30-دقيقة. في الجمعة، سمح له بالبقاء مستيقظًا متأخرًا، لذا شاهد اثنين حلقات مدتها 1-ساعة. إذا كان قد شاهد 7 ساعات من التلفاز في المجمل، فكم عدد حلقات المسلسل الذي مدته 30-دقيقة التي شاهدها في الأربعاء؟"
answer = "لنفترض أن E هو عدد الحلقات التي شاهدها في الأربعاء.\nبعد الاثنين، كان لديه 7 - 1 = <<7-1=6>>6 ساعة من التلفاز متبقية.\nبعد الثلاثاء، كان لديه 6 - 1 = <<6-1=5>>5 ساعة من التلفاز متبقية.\nبعد الخميس، كان لديه 5 - 1 - 0.5 = 3.5 ساعة من التلفاز متبقية.\nبعد الجمعة، كان لديه 3.5 - 2 = 1.5 ساعة من التلفاز متبقية.\nكل حلقة مدتها 30-دقيقة تساوي 1/2 ساعة.\nوبالتالي، E = 1.5/0.5 = 3 حلقات.\n#### 3\n"
