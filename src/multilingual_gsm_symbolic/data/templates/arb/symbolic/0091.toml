question = "في منزل آلان، يوجد ضعف من الذرةs كما يوجد الكانوليs. لديه إجمالي 40 الكانوليs في منزله. آلان اشترى 60 الكانوليs إضافية في المتجر و 40 الذرةs أقل من عدد الكانوليs. أوجد المجموع الكلي لعدد الذرةs و الكانوليs التي يمتلكها آلان في المنزل؟"
answer = "قبل شراء أي ذرة و كانولي، كان لدى آلان ضعف من الذرةs كما يوجد الكانوليs، وهو 40 الكانوليs*2 الذرة/الكانولي = <<40*2=80>>80 الذرةs\nإجمالي عدد الذرةs و الكانوليs التي كانت لدى آلان سابقاً هو 80 الذرةs + 40 الكانوليs = <<80+40=120>>120 قطعة\nعندما اشترى 40 الذرةs أقل من الكانوليs، اشترى 60 الذرةs - 40 الذرةs = <<60-40=20>>20 الذرةs\nبشكل إجمالي، اشترى 20 الذرةs + 60 الكانوليs = <<20+60=80>>80 قطعة\nبعد المشتريات، لدى آلان 120 قطعة + 80 قطعة = <<120+80=200>>200 إجمالي الذرةs و الكانوليs مجتمعة.\n#### 200\n"
