question = "Sally akapita kumugwagwa wekuzorora. Vabereki vake vakapa $15 kutenga zvaaida. PaShopu yezvinhu zvekukumbira, taffy yaive nezvishandiso \"Tenga 1 paundi pa$3 pa paundi, uwane 1 paundi 1/2 pasi.\" Akabata 4 paundi. Akawo kutenga bhodhi yematombo emugwagwa pa$1.5 uye 4 magineti aiva $0.25 pa se. Mari ingani yaSally yasara?"
answer = "Sally ari kutenga 1 paundi pa$3 uye anowana 1 paundi 1/2 pasi. Saka 1/2 pasi pa 1 paundi ndiyo $3*1/2 = $1.5. Chiripo che 2 paundi hachina kuderedzwa uye inodhura 2*$3 = $6, saka mutengo wese ndiwo $3+$3/2+$6=$21/2\n4 magineti pa$0.25 pa se ndiwo 4*0.25=$<<4*0.25=1>>1\nPaunowedzera zvese zvaaive nazo, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nAiva ne$15 uye akashandisa $13 saka aiva ne$15-$13 = $<<15-13=2>>2 yasara\n#### 2\n"
