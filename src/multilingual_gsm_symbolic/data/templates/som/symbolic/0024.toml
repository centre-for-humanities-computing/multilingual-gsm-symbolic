question = "Sida xogta nafaqada ah ee ku xusan, qoryo buufi waxay leedahay 250 kalori hal qeyb. Haddii qoryo 300 gram ay leedahay 5 qeybood, waxaad cuni kartaa gram intee haddii hadafkaaga maalinlaha ah ee kalooriyuhu yahay 2000 oo aad horey u isticmaashay 1800 kalori?"
