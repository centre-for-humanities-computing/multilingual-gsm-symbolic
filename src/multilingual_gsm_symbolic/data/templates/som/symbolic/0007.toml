question = "Beeraley ayaa iibinaya cunto u qeybinaya farasin. Wuxuu iibiyaa noocyo kala duwan oo heey, rooti, karooto iyo kubbadaha sonkorta. Maadaama kubbadaha sonkorta ay yihiin macmacaan gaar ah, wuxuu iibiyaa kaliya laba 1-libin sanduuqyo ka mid ah iyaga oo u qeybinaya xero guud. Wuxuu rabaa kaliya karooto ku filan si uu u quudiyo farasin inta khudaarta ay cusub yihiin, sidaas darteed wuxuu iibiyaa afar 12-libin bacaha. Heey waa cuntada ugu weyn ee farasindiisa, sidaas darteed wuxuu iibiyaa kow iyo afartan 75-libin baakadaha. Rooti waa cunto aasaasi ah oo ku darsata heey, sidaas darteed wuxuu iibiyaa laba iyo labaatan 65-libin sacadaha. Haddii gaadiidkiisa beeraha uu qaadi karo 2250 libin mar kasta, wuxuu u baahan yahay beeraley inta safar si uu u qaado dhammaan cuntada?"
