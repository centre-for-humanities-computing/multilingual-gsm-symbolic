question = "Garrett wuxuu shidanayaa popkorn ah cunto fudud. Marka baanda unugyada kululaato, unugyadu waxay u bilaabaan inay si degdeg ah u shidaan. 20 ayaa shidaa muddada ugu horreysa ee 30 ilbiriqsi ee karinta, kadibna saddex jeer intaas oo kale muddada 30 ilbiriqsi ee xigta. Unugyadu waxay kordhaan ilaa afar jeer xawaaraha shididaa ee hore muddada 30 ilbiriqsi ee xigta, laakiin muddada 30 ilbiriqsi ee ugu dambeysa, shididaa waxay yaraataa ilaa kala badh xawaaraha muddadii 30 ilbiriqsi ee hore. Kadib markii Garrett uu ka qaado baanda kulaylka, afar-meelood kow ah tirada unugyada ee shidaayay muddadii 30 ilbiriqsi ee ugu dambeysa ee karinta sidoo kale way shidaan kulaylka hadhaaga ah. Waa intee qaybo popkorn ah oo Garrett u baahan yahay inuu cunto?"
