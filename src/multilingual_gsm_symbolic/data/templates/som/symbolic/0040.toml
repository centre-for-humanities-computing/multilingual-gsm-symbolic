question_annotated = "{name,Saali} waxay tagtay xeebta fasaxa. Waalidiinteeda waxay siiyeen ${total,15} si ay iibsato wax kasta oo ay rabto. Dukaanka xusuusta, taffy waxay ahayd iib gaar ah oo leh \"Iibso {n1,1} pound oo ah ${p1,3} pound kasta, helay {n2,1} pound {discount,1/2} dhimis.\" Waxay qaaday {n12,4} pounds. Waxay sidoo kale iibsatay kiis isku dhaf ah oo qolof badeed ah oo ah ${p2,1.5} iyo {n3,4} magneto oo ${p3,0.25} midkiiba. Miya lacagta {name,Saali} ka harsan?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
