question = "Saali waxay tagtay xeebta fasaxa. Waalidiinteeda waxay siiyeen $15 si ay iibsato wax kasta oo ay rabto. Dukaanka xusuusta, taffy waxay ahayd iib gaar ah oo leh \"Iibso 1 pound oo ah $3 pound kasta, helay 1 pound 1/2 dhimis.\" Waxay qaaday 4 pounds. Waxay sidoo kale iibsatay kiis isku dhaf ah oo qolof badeed ah oo ah $1.5 iyo 4 magneto oo $0.25 midkiiba. Miya lacagta Saali ka harsan?"
answer = "Saali waxay iibsanaysaa 1 pound oo ah $3 waxayna haysaa 1 pound 1/2 dhimis. Sidaas darteed 1/2 dhimis oo ah 1 pound waa $3*1/2 = $1.5. Kaliyaha kale ee 2 pounds ma lahan dhimis waxayna ku kici kartaa 2*$3 = $6, sidaas darteed guud waa $3+$3/2+$6=$21/2\n4 magneto oo ah $0.25 midkiiba waa 4*0.25=$<<4*0.25=1>>1\nMarkaad wax kasta oo ay iibsatay ku darto, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nWaxay haysatay $15 waxayna ku bixisay $13 sidaas darteed waxay haysatay $15-$13 = $<<15-13=2>>2 ka harsan\n#### 2\n"
