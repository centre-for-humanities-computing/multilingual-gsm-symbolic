answer_annotated = "Haddii {frac} ka mid ah awoodda guud ee {facility} {item}-yadu ay la isticmaalo, waa micnaheeda {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} ayaa bukaanno isticmaalaya.\nTirada guud ee {item}-yada ku jira {facility} aan la soo gelin cusub waa {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}.\nHaddii {daily} qof la soo galayo maalintii kasta, tirada guud ee bukaannada ee ku jira {facility} kadib hal todobaad waa {daily} bukaanno/maalintii * 7 maalmood/toddobaad = {daily*7} bukaanno.\nKadib {period} todobaadyo, tirada guud ee bukaannada la soo galay {facility} waa {daily*7} bukaanno/toddobaad * {period} todobaad = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} bukaanno, kuwaas oo midkiiba isticmaala hal {item}.\nHaddii ay jireen {total-int(total*frac)} {item} aan la isticmaalin oo ku jira {facility} ka hor soo gelista cusub, tirada guud waxay hoos u dhacaysaa ilaa {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item} aan la isticmaalin.\n#### {total - (total * frac + daily * period * 7)}\n"
