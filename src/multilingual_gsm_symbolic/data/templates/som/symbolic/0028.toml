question = "Isbitaal wuxuu leeyahay awood 1000 sariir oo 1/5 la isticmaalo. Sababtoo ah faafitaanka coronavirus, 50 bukaanno ayaa la soo galay isbitaal maalintii kasta. Xisaabi tirada guud ee sariir aan la isticmaalin ee ku jira isbitaal kadib 2 todobaadyo."
answer = "Haddii 1/5 ka mid ah awoodda guud ee isbitaal sariir-yadu ay la isticmaalo, waa micnaheeda 1/5 * 1000 = <<1000*1/5=200>>200 sariir ayaa bukaanno isticmaalaya.\nTirada guud ee sariir-yada ku jira isbitaal aan la soo gelin cusub waa 1000 sariir - 200 sariir = <<1000-200=800>>800 sariir.\nHaddii 50 qof la soo galayo maalintii kasta, tirada guud ee bukaannada ee ku jira isbitaal kadib hal todobaad waa 50 bukaanno/maalintii * 7 maalmood/toddobaad = 350 bukaanno.\nKadib 2 todobaadyo, tirada guud ee bukaannada la soo galay isbitaal waa 350 bukaanno/toddobaad * 2 todobaad = <<350*2=700>>700 bukaanno, kuwaas oo midkiiba isticmaala hal sariir.\nHaddii ay jireen 800 sariir aan la isticmaalin oo ku jira isbitaal ka hor soo gelista cusub, tirada guud waxay hoos u dhacaysaa ilaa 800 sariir - 700 sariir = <<800-700=100>>100 sariir aan la isticmaalin.\n#### 100\n"
