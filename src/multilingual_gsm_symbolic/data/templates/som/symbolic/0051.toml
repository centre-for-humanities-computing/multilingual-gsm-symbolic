question = "Artie wuxuu leeyahay goob ubax oo ku taal Suuqa Beeraleyda. Wuxuu iibiyaa saddex nooc oo ubaxs: ubaxa jaalaha, ubaxa petunia iyo ubaxa begonia. Wuxuu caadi ahaan iibiyaa ubaxa jaalaha ee $2.74 halkii qabool, ubaxa petunia ee $1.87 halkii qabool iyo ubaxa begonia ee $2.12 halkii qabool. Artie maanta ma haysto lacag beddel, sidaas darteed wuxuu go'aansaday inuu qiimayaashiisa dhammaantood u wareejiyo dollar-ka ugu dhow. Haddii Artie iibiyo 12 qabools oo ubaxa jaalaha ah, 9 qabools oo ubaxa petunia ah iyo 17 qabools oo ubaxa begonia ah, intuu ku samayn doonaa?"
