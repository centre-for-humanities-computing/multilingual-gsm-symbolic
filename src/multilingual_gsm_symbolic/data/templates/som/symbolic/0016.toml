question = "Cabdi wuu iibinayaa macmac qori iyo tufaax pit si uu u ururiyo lacag. Maalinta Sabti, wuu iibiyay 10 sanduuqyo macmac qori iyo 4 sanduuqyo ka yar tufaax pit intii Axad. Maalinta Axad, wuu iibiyay 5 sanduuqyo ka badan macmac qori intii Sabti iyo 15 sanduuqyo tufaax pit. Haddii macmac qori qiimuhu yahay $6 iyo tufaax pit qiimuhu yahay $15, waa maxay lacagta uu Cabdi kasbaday muddo laba maalmood ah?"
answer = "Wuu iibiyay 10 + 5 = <<10+5=15>>15 sanduuqyo macmac qori maalinta Axad.\nWadarta sanduuqyada macmac qori ee Cabdi iibiyay waa 10 + 15 = <<10+15=25>>25.\nCabdi wuu kasbaday 25*$6 = $<<25*6=150>>150 iibinta macmac qori.\nWuu iibiyay 15 - 4 = <<15-4=11>>11 sanduuqyo tufaax pit maalinta Sabti.\nWadarta sanduuqyada tufaax pit ee Cabdi iibiyay waa 15 + 11 = <<15+11=26>>26.\nWuu kasbaday 26*$15 = $<<26*15=390>>390 iibinta tufaax pit.\nSidaas darteed, Cabdi wuu kasbaday $150 + $390 = $<<150+390=540>>540 muddo laba maalmood ah.\n#### 540\n"
