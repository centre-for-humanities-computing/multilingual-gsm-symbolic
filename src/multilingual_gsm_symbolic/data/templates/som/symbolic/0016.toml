answer_annotated = "Wuu iibiyay {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} sanduuqyo {food} maalinta {d2}.\nWadarta sanduuqyada {food} ee {name} iibiyay waa {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} wuu kasbaday {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} iibinta {food}.\nWuu iibiyay {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} sanduuqyo {fruit} pit maalinta {d1}.\nWadarta sanduuqyada {fruit} pit ee {name} iibiyay waa {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nWuu kasbaday {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} iibinta {fruit} pit.\nSidaas darteed, {name} wuu kasbaday {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} muddo laba maalmood ah.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
