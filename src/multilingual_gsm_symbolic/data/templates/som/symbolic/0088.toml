question = "Dana waxay ku oroddaa afar jeer ka dhaqsan inta ay ku socoto, laakiin waxay ku tuman kartaa xawaare ah nus sida ay ku oroddo. Haddii ay ku tuman karto 3 miles saacadkii, miles intee ayay socotaa lix saacadood haddii ay waqtiga saddex meelood meel ku oroddo iyo laba meelood saddex waqtiga ay ku socoto?"
