question = "Sally devās uz jūras krastu atvaļinājumā. Viņas vecāki deva viņai $15 $, lai nopirktu to, ko vēlas. Suvenīru veikalā karamelle bija akcijā: \"Pērc 1 mārciņu par $3 par mārciņu, saņem 1 mārciņu ar 1/2 atlaidi.\" Viņa paņēma 4 mārciņas. Viņa arī nopirka maisiņu ar gliemežvākiem par $1.5 un 4 magnētus, kas maksāja $0.25 katrs. Cik naudas Sally ir palikusi?"
answer = "Sally pērk 1 mārciņu par $3 un saņem 1 mārciņu ar 1/2 atlaidi. Tātad 1/2 no 1 mārciņas ir $3*1/2 = $1.5. Atlikušās 2 mārciņas nav ar atlaidi un maksā 2*$3 = $6, tātad kopā ir $3+$3/2+$6=$21/2\n4 magnēti pa $0.25 katrs ir 4*0.25=$<<4*0.25=1>>1\nKad saskaita visus tēriņus, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nViņai bija $15 un viņa iztērēja $13, tātad viņai palika $15-$13 = $<<15-13=2>>2\n#### 2\n"
