question = "Sally het vir vakansie na die strand gegaan. Haar ouers het haar $15 gegee om te koop wat ookal sy wou. By die geskenkwinkel was taffie op aksie vir \"Koop 1 pond vir $3 per pond, kry 1 pond 1/2 af.\" Sy het 4 pond opgeskep. Sy het ook 'n gemengde sak seeskulpies vir $1.5 en 4 magnete gekoop wat $0.25 elkeen was. Hoeveel geld het Sally oor?"
answer = "Sally koop 1 pond vir $3 en kry 1 pond 1/2 af. So 1/2 van 1 pond is $3*1/2 = $1.5. Die res van 2 pond het geen korting nie en kos 2*$3 = $6, so totaal is $3+$3/2+$6=$21/2\n4 magnete teen $0.25 elkeen is 4*0.25=$<<4*0.25=1>>1\nWanneer jy al haar aankope optel, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nSy het $15 gehad en $13 spandeer, so sy het $15-$13 = $<<15-13=2>>2 oor\n#### 2\n"
