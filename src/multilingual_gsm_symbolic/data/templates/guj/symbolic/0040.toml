question = "સોલી વેકેશન માટે સમુદ્ર કિનારે ગઈ. તેના પિતા-માતાએ તેને $15 આપ્યા જેથી તે જે ઈચ્છે તે ખરીદી શકે. સોવિનીયરની દુકાન પર, ટેફીની સેલ હતી \"ખરીદો 1 પાઉન્ડ $3 પ્રતિ પાઉન્ડ દરે, 1 પાઉન્ડ 1/2 ઓફ મેળવો.\" તેણે 4 પાઉન્ડ લીધા. તેણે $1.5 ની મિશ્ર શેલ્સની થેલી અને 4 મેગ્નેટ્સ પણ ખરીદ્યા જે દરેક $0.25 ના હતા. સોલી પાસે કેટલા પૈસા બાકી રહ્યા?"
