question = "માર્થા તેના 3 નાતિઓ માટે શિયાળાના વસ્ત્રો ગૂંથણી કરી રહી છે. તેઓ ત્રિજાત છે, તેથી તેઓ બધા સમાન કદના છે. તે તેમના દરેક માટે ટોપી, સ્કાર્ફ, સ્વેટર, મિટિન્સ, અને મોજડાં બનાવવા માંગે છે. ટોપી બનાવવા માટે 2 લૂંટા ઊન લાગે છે, સ્કાર્ફ માટે 4, સ્વેટર માટે 12, એક જોડી મિટિન્સ માટે 1, અને એક જોડી મોજડાં માટે 2. તેને કેટલા લૂંટા ઊન ખરીદવાની જરૂર પડશે?"
answer = "દરેક બાળક માટેનું સંપૂર્ણ કપડું ટોપી માટે 2 લૂંટા + સ્કાર્ફ માટે 4 લૂંટા + સ્વેટર માટે 12 લૂંટા + એક જોડી મિટિન્સ માટે 1 લૂંટા + એક જોડી મોજડાં માટે 2 લૂંટા = <<2+4+12+1+2=21>>21 લૂંટા ઊન.\nતેથી તેના બધા નાતિઓ માટે કપડાં ગૂંથવા માટે, તેને 3*21 = <<3*21=63>>63 લૂંટા ઊન જરૂર પડશે.\n#### 63\n"
