question = "શ્રી તાન ને તેમનું ઘર $400,000 ની કિંમતે વેચ્યું. તેમણે વેચાણ કિંમતના 3% જેટલી હસ્તાંતરણ ફી ચૂકવ્યા અને વેચાણ કિંમતના 5% જેટલી બ્રોકરેજ ફી પણ ચૂકવ્યા. જો તેમણે ઘર ની બાકીની લોન રકમ માટે $250,000 પણ ચૂકવ્યા હોય, તો શ્રી તાન ને ઘર વેચવા પરથી કેટલી શુદ્ધ રકમ મળે છે?"
answer = "શ્રી તાન ને હસ્તાંતરણ ફી માટે $400,000*3/100 = <<400000*3/100=12000>>$12,000 ચૂકવ્યા.\nતેમણે બ્રોકરેજ ફી માટે $400,000*5/100 = <<400000*5/100=20000>>$20,000 ચૂકવ્યા.\nતેથી, શ્રી તાન ને હસ્તાંતરણ, બ્રોકરેજ, અને લોન ફી માટે કુલ $12,000 + $20,000 + $250,000 = <<12000+20000+250000=282000>>$282,000 ચૂકવ્યા.\nઆમ, શ્રી તાન ની શુદ્ધ રકમ $400,000 - $282,000 = <<400000-282000=118000>>$118,000 છે.\n#### 118000\n"
