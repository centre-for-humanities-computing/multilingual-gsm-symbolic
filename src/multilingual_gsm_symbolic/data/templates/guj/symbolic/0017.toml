question = "દાદી દરરોજ તેના પસંદગીના ચાલવાના માર્ગ પર 3 માઈલ ચાલે છે, જેમાં સમુદ્ર કિનારા પર 2 માઈલ ચાલવા અને ફુટપાથ પર 1 માઈલ ચાલવાનો સમાવેશ થાય છે. ફુટપાથ પર, દાદી સમુદ્ર કિનારા કરતાં બે ગણી ગતિના દરે ચાલે છે. જો તેના ચાલવાના સમયમાં 40 મિનિટ સમુદ્ર કિનારા પર ખર્ચાય, તો તેને સંપૂર્ણ 3-માઈલ ચાલ પૂર્ણ કરવા માટે કેટલો સમય લાગશે, મિનિટમાં?"
answer = "સમુદ્ર કિનારા પર, દાદી નો દર 40 મિનિટમાં 2 માઈલ છે, અથવા 2/40 = 1/20 માઈલ પ્રતિ મિનિટ.\nફુટપાથ પર, તે સમુદ્ર કિનારા પર હોય ત્યારે કરતાં બે ગણી ગતિના દરે ચાલે છે, અથવા 5*1/20 = 0.25 માઈલ પ્રતિ મિનિટ.\nફુટપાથ પર 1 માઈલ ચાલવા માટે, તેને 1/0.25 = <<1/0.25=4>>4 મિનિટ લાગે છે.\nઆમ, કુલ મળીને, તેને તેના પસંદગીના માર્ગ પર ચાલવા માટે દાદી ને 40+4 = <<40+4=44>>44 મિનિટ લાગે છે.\n#### 44\n"
