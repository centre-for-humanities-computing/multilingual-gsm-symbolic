answer = "કોઈપણ મકાઈ અને કેનનોલી ખરીદતા પહેલા, અલ્લન પાસે કેનનોલી ની સંખ્યા કરતાં મકાઈ બે ગણા હતા, જે 40 કેનનોલી*5 મકાઈ/કેનનોલી = <<40*5=200>>200 મકાઈ થાય છે\nઅલ્લન પાસે પહેલા મકાઈ અને કેનનોલી ની કુલ સંખ્યા છે 200 મકાઈ + 40 કેનનોલી = <<200+40=240>>240 વસ્તુઓ\nજ્યારે તેણે કેનનોલી કરતાં 40 ઓછા મકાઈ ખરીદ્યા, તેણે 60 મકાઈ - 40 મકાઈ = <<60-40=20>>20 મકાઈ ખરીદ્યા\nકુલ મળીને, તેણે 20 મકાઈ + 60 કેનનોલી = <<20+60=80>>80 વસ્તુઓ ખરીદી\nખરીદી પછી, અલ્લન પાસે 240 વસ્તુઓ + 80 વસ્તુઓ = <<240+80=320>>320 કુલ મકાઈ અને કેનનોલી મળીને છે.\n#### 320\n"
