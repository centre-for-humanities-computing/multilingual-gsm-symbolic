answer = "જો દાના તે દોડવાની ઝડપના આધું ભાગે કુદી શકે, તો તે 3*5/3=<<3*5/3=5>>5 માઈલ પ્રતિ કલાકે દોડી શકે છે.\nઅને કારણ કે તે ચાલવાની ઝડપ કરતાં ચાર ગણું ઝડપથી દોડી શકે છે, આનો અર્થ એ છે કે તે 5/5=1 માઈલ પ્રતિ કલાકે ચાલી શકે છે.\nજો બે તૃતીયાંશ સમય ચાલવામાં વિતાવવામાં આવે, તો તે 6*3/5=<<6*3/5=18/5>>18/5 કલાક ચાલે છે.\nજો એક તૃતીયાંશ સમય દોડવામાં વિતાવવામાં આવે, તો તે 6-18/5=<<6-18/5=18/5>>18/5 કલાક દોડે છે.\nઆમ, તે 5 માઈલ પ્રતિ કલાકે 18/5 કલાક દોડે છે, અથવા 18/5*5=<<18/5*5=18>>18 માઈલ.\nતે 1 માઈલ પ્રતિ કલાકે 18/5 કલાક ચાલે છે, અથવા 18/5*1=<<18/5*1=18/5>>18/5 માઈલ.\nઆમ, મળીને, તે 18+18/5=<<18+18/5=21>>21 માઈલ પ્રવાસ કરે છે.\n#### 21\n"
