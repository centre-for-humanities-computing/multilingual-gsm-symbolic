question = "સન્ની એ અદરકનું બિસ્કિટ અને સફરજન પાઈ ફંડરેઝર માટે વેચી રહ્યો છે. શનિવાર પર, તેણે 10 બોક્સ અદરકનું બિસ્કિટ અને રવિવાર કરતા 4 ઓછા સફરજન પાઈના બોક્સ વેચ્યા. રવિવાર પર, તેણે શનિવાર કરતા 5 વધુ અદરકનું બિસ્કિટના બોક્સ અને 15 સફરજન પાઈના બોક્સ વેચ્યા. જો અદરકનું બિસ્કિટનો ભાવ ₹6 હોય અને સફરજન પાઈનો ભાવ ₹15 હોય, તો સન્નીએ બે દિવસ માટે કેટલી કમાણી કરી?"
answer = "તેણે રવિવાર પર અદરકનું બિસ્કિટના 10 + 5 = <<10+5=15>>15 બોક્સ વેચ્યા.\nસન્ની દ્વારા વેચાયેલા અદરકનું બિસ્કિટના કુલ બોક્સની સંખ્યા 10 + 15 = <<10+15=25>>25 છે.\nસન્નીએ અદરકનું બિસ્કિટ વેચવા માટે 25*₹6 = ₹<<25*6=150>>150 કમાયા.\nતેણે શનિવાર પર સફરજન પાઈના 15 - 4 = <<15-4=11>>11 બોક્સ વેચ્યા.\nસન્ની દ્વારા વેચાયેલા સફરજન પાઈના કુલ બોક્સની સંખ્યા 15 + 11 = <<15+11=26>>26 છે.\nસફરજન પાઈ વેચવા માટે તેણે 26*₹15 = ₹<<26*15=390>>390 કમાયા.\nતેથી, સન્નીએ બે દિવસ માટે ₹150 + ₹390 = ₹<<150+390=540>>540 કમાયા.\n#### 540\n"
