question = "Sunny menjual kue jahe dan pie apel untuk penggalangan dana. Pada Sabtu, ia menjual 10 kotak kue jahe dan 4 kotak pie apel lebih sedikit daripada pada Minggu. Pada Minggu, ia menjual 5 kotak kue jahe lebih banyak daripada pada Sabtu dan 15 kotak pie apel. Jika kue jahe harganya $6 dan pie apel harganya $15, berapa banyak yang Sunny hasilkan selama dua hari?"
answer = "Ia menjual 10 + 5 = <<10+5=15>>15 kotak kue jahe pada Minggu.\nJumlah total kotak kue jahe yang dijual Sunny adalah 10 + 15 = <<10+15=25>>25.\nSunny menghasilkan 25*$6 = $<<25*6=150>>150 untuk menjual kue jahe.\nIa menjual 15 - 4 = <<15-4=11>>11 kotak pie apel pada Sabtu.\nJumlah total kotak pie apel yang dijual Sunny adalah 15 + 11 = <<15+11=26>>26.\nIa menghasilkan 26*$15 = $<<26*15=390>>390 untuk menjual pie apel.\nJadi, Sunny menghasilkan $150 + $390 = $<<150+390=540>>540 selama dua hari.\n#### 540\n"
