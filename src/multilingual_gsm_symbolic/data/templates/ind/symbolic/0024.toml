question_annotated = "Menurut informasi nutrisinya, sekantong {food,keripik} memiliki {cal,250} kalori per sajian. Jika sekantong {size,300} {unit,gram} memiliki {n,5} sajian, berapa {unit,gram} yang bisa Anda makan jika target kalori harian Anda adalah {total,2000} dan Anda sudah mengonsumsi {spent,1800} kalori?\n\n#init:\n- food = sample([\"popcorn\", \"breads\",  \"cookies\"])\n- unit = sample([\"gram\", \"g\"])\n- $cal = range(150, 500, 25)\n- $size = range(100, 400, 25)\n- $n = range(4, 8)\n- $total = range(1900, 2500, 5)\n- $spent = range(600, 1900, 25)\n\n#conditions:\n- spent < total\n- is_int( 5 * (total - spent) / cal)\n- divides(size, n)\n- divides(size//n, (total-spent)/cal)\n\n#answer: size//n * Fraction((total-spent)/cal)\n"
answer_annotated = "Jika target kalori total adalah {total} dan saya sudah mengonsumsi {spent} kalori, maka saya memiliki {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} kalori tersisa untuk dimakan\nJika setiap sajian {food} memiliki {cal} kalori dan saya hanya memiliki {total-spent} kalori tersisa untuk dimakan, maka saya hanya bisa makan {total-spent}/{cal} dari satu sajian = {Fraction((total-spent)/cal)} dari satu sajian\nKita juga tahu bahwa sekantong {food} {size} {unit} memiliki {n} sajian, maka setiap sajian memiliki {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit}\nJika saya hanya bisa makan {Fraction((total-spent)/cal)} dari satu sajian, maka saya hanya bisa makan {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit}\n#### {size//n * (total-spent)/cal}\n"
