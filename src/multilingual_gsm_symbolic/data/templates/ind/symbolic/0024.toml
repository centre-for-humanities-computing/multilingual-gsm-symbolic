question = "Menurut informasi nutrisinya, sekantong keripik memiliki 250 kalori per sajian. Jika sekantong 300 gram memiliki 5 sajian, berapa gram yang bisa Anda makan jika target kalori harian Anda adalah 2000 dan Anda sudah mengonsumsi 1800 kalori?"
answer = "Jika target kalori total adalah 2000 dan saya sudah mengonsumsi 1800 kalori, maka saya memiliki 2000-1800 = <<2000-1800=200>>200 kalori tersisa untuk dimakan\nJika setiap sajian keripik memiliki 250 kalori dan saya hanya memiliki 200 kalori tersisa untuk dimakan, maka saya hanya bisa makan 200/250 dari satu sajian = 4/5 dari satu sajian\nKita juga tahu bahwa sekantong keripik 300 gram memiliki 5 sajian, maka setiap sajian memiliki 300 gram/5 = <<300/5=60>>60 gram\nJika saya hanya bisa makan 4/5 dari satu sajian, maka saya hanya bisa makan 60 gram * 4/5 = 48 gram\n#### 48\n"
