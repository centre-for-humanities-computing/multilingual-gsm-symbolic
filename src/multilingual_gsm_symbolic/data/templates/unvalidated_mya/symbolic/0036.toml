question = "တုလာ သည် ကိတ်မုန့်ဆိုင် သို့သွားပြီး မုန့် အမျိုးအစားအမျိုးမျိုးကို ဝယ်ယူခဲ့သည်။ သူမသည် တစ်ဒိုဇင်လျှင် $68 ကျသင့်သော ဒေါနတ် 3 ဒိုဇင်၊ တစ်ဒိုဇင်လျှင် $80 ကျသင့်သော ကိတ်မုန့်အသေး 2 ဒိုဇင်နှင့် တစ်ဒိုဇင်လျှင် $55 ကျသင့်သော ချက်စ်ကိတ်အသေး 6 ဒိုဇင်ကို ဝယ်ယူခဲ့သည်။ စုစုပေါင်းကုန်ကျစရိတ် ဘယ်လောက်ရှိသလဲ။"
