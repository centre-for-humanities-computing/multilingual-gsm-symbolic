question = "Ο {name,Frankie} βλέπει τηλεόραση μετά το τέλος της σχολικής του εργασίας κάθε βράδυ. Την {d1,Δευτέρα} και την {d2,Τρίτη}, είδε ένα {h1,1}-ωρο επεισόδιο της αγαπημένης του σειράς κάθε βράδυ. Την {d3,Τετάρτη}, είδε μερικά επεισόδια μιας {m1,30}-λεπτης σειράς. Την {d4,Πέμπτη}, τελείωσε νωρίς την εργασία του και είδε ένα {h2,1}-ωρο επεισόδιο και μια {m2,30}-λεπτη σειρά. Την {d5,Παρασκευή}, κατάφερε να μείνει ξάγρυπνος αργά, οπότε είδε {n2_txt,δύο} {h3,1}-ωρα επεισόδια. Αν είδε {total,7} ώρες τηλεόρασης συνολικά, πόσα {m1,30}-λεπτα επεισόδια είδε την {d3,Τετάρτη}?\n\n#init:\n- name = sample(names_male)\n- d1, d2, d3, d4, d5 = sample_sequential(weekdays, 5)\n- $total = range(7, 33)\n- $h1 = range(1, 7)\n- $h3 = range(1, 6)\n- $m1 = range(5, 61, 5)\n- $m2 = range(5, 61, 5)\n- $h2 = range(1, 7)\n- n2_txt, n2_val = range_str(2, 5, 1, numbers)\n\n#conditions: \n- divides(m1, 15)\n- divides(m2, 15)\n- divides(total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60, m1)\n- (total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1 > 0\n- (total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1 < 8 \n\n#answer: int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)\n"
answer = "Έστω E ο αριθμός των επεισοδίων που είδε την {d3}.\nΜετά την {d1}, είχε {total} - {h1} = <<{total}-{h1}={total-h1}>>{total-h1} ώρες τηλεόρασης απομείνει.\nΜετά την {d2}, είχε {total-h1} - {h1} = <<{total-h1}-{h1}={total-2*h1}>>{total-2*h1} ώρες τηλεόρασης απομείνει.\nΜετά την {d4}, είχε {total-2*h1} - {h2} - {m2/60} = {total-2*h1-h2- m2/60} ώρες τηλεόρασης απομείνει.\nΜετά την {d5}, είχε {total-2*h1-h2-m2/60} - {n2_val*h3} = {total-2*h1-h2-m2/60-n2_val*h3} ώρες τηλεόρασης απομείνει.\nΚάθε {m1}-λεπτο επεισόδιο είναι {Fraction(m1/60)} ώρα.\nΕπομένως, E = {total-2*h1-h2-m2/60-n2_val*h3}/{m1/60} = {int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)} επεισόδια.\n#### {int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)}\n"
