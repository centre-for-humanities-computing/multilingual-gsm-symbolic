question = "Η {name,Sally} πήγε στην παραλία για διακοπές. Οι γονείς της έδωσαν ${total,15} για να αγοράσει ό,τι ήθελε. Στο κατάστημα αναμνηστικών, το ταφί ήταν σε προσφορά με \"Αγόρασε {n1,500} γραμμάρια για ${p1,3}, πάρτε {n2,500} γραμμάρια με {discount,1/2} τιμή.\" Πήρε {n12,2000} γραμμάρια. Αγόρασε επίσης μια μικτή σακούλα με κοχύλια για ${p2,1.5} και {n3,4} μαγνήτες που ήταν ${p3,0.25} ο καθένας. Πόσα χρήματα έχει απομείνει η {name,Sally};"
answer = "Το ταφί κοστίζει ${p1} για {n1} γραμμάρια και παίρνει {n2} γραμμάρια με {discount} τιμή. Άρα {discount} της τιμής των {n2} γραμμαρίων είναι {n2}/{n1}*{discount}*${p1} = ${(n2/n1)*discount*p1}.\nΜαζί, αυτό κοστίζει ${(n2/n1)*discount*p1} + ${p1} = ${(n2/n1)*discount*p1 + p1}.\nΤα υπόλοιπα {n12 - n1 - n2} γραμμάρια δεν έχουν έκπτωση και κοστίζουν ${(n12 - n1 - n2)/n1*p1}, οπότε η συνολική τιμή είναι ${p1} + ${n2/n1*discount*p1} + ${(n12 - n1 - n2)/n1*p1} = $<<{p1} + {n2/n1*discount*p1} + {(n12 - n1 - n2)/n1*p1} = {p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}>>{p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}\n{n3} μαγνήτες στα ${p3} ο καθένας είναι {n3}*${p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nΌταν προσθέσεις όλες τις αγορές της, ${p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1} + ${p2} + ${n3*p3} = $<<{p1+(n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}+{p2}+{n3*p3}={int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}>>{int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}\nΕίχε ${total} και ξόδεψε ${int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}, οπότε έχει ${total} - ${int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} = $<<{total}-{int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}={total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}>>{total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} απομεινάρια\n#### {total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}\n"
