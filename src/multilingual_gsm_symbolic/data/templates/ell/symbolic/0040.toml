question_annotated = "Η {name,Sally} πήγε στην παραλία για διακοπές. Οι γονείς της έδωσαν ${total,15} για να αγοράσει ό,τι ήθελε. Στο κατάστημα αναμνηστικών, το ταφί ήταν σε προσφορά με \"Αγόρασε {n1,500} γραμμάρια για ${p1,3}, πάρτε {n2,500} γραμμάρια με {discount,1/2} τιμή.\" Πήρε {n12,2000} γραμμάρια. Αγόρασε επίσης μια μικτή σακούλα με κοχύλια για ${p2,1.5} και {n3,4} μαγνήτες που ήταν ${p3,0.25} ο καθένας. Πόσα χρήματα έχει απομείνει η {name,Sally};\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(500, 3000, 500)\n- $n2 = range(500, 3000, 500)\n- $n12 = range(1000, 6000, 500)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1 + p2 + n3*p3)\n- p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1 + p2 + n3*p3 < total\n\n#answer: total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)\n"
