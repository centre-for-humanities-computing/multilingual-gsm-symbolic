question = "Η Αλίσον κατάφερε να εξασφαλίσει θέση στην ομάδα τρέξιμο, οπότε πήγε για ψώνια για αθλητικό εξοπλισμό. Αγόρασε ένα αθλητικό μπλουζάκι για €10, ένα ζευγάρι τρέξιμο κοντά παντελόνια για €5 περισσότερα από ό,τι κόστιζε το αθλητικό μπλουζάκι, και ένα ζευγάρι αθλητικά παπούτσια που αρχικά ήταν €48 αλλά ήταν σε προσφορά με μισή τιμή. Είχε ένα κουπόνι για €2 έκπτωση στο πακέτο με €8 αθλητικές κάλτσες που επίσης αγόρασε. Πόσα χρήματα ξόδευε για αθλητικό εξοπλισμό?"
