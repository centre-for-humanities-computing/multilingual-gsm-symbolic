question = "Sally lungo menyang pantai kanggo liburan. Wong tuwané menehi dheweke $15 kanggo tuku apa wae sing dikarepake. Ing toko suvenir, taffy didol kanthi tawaran spesial \"Tuku 1 pon kanthi rega $3 saben pon, entuk 1 pon 1/2 diskon.\" Dheweke ngambil 4 pon. Dheweke uga tuku tas campuran cangkang kerang kanthi rega $1.5 lan 4 magnet kanthi rega $0.25 saben siji. Dhuwit pira sing isih ana kanggo Sally?"
