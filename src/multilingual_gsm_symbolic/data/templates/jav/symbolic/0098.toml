question = "Siji wabah nularake sepuluh wong. Saben dina, saben wong sing nular nularake enam wong liya. Pira wong sing nular sawise telung dina?"
answer = "Ing dina pisanan, sepuluh wong wiwitane nularake enam wong saben siji, dadi 10*8 = <<10*8=80>>80 wong liya nular.\nAna 10+80 = <<10+80=90>>90 wong sing nular sawise dina pisanan.\nIng dina kapindho, 90*8 = <<90*8=720>>720 wong liya nular.\nAna 90 + 720 = <<90+720=810>>810 wong sing nular sawise dina kapindho.\nIng dina katelu, 810*8 = 6480 wong liya nular. Mula, ana 810 + 6480 = 7290 wong sing nular sawise telung dina.\n#### 7290\n"
