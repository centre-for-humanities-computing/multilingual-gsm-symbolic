question = "Sunny adol kue jahe lan pai apel kanggo penggalangan dana. Ing Sabtu, dheweke adol 10 kothak kue jahe lan 4 kothak pai apel kurang tinimbang ing Minggu. Ing Minggu, dheweke adol 5 kothak kue jahe luwih akeh tinimbang ing Sabtu lan 15 kothak pai apel. Yen kue jahe regane $6 lan pai apel regane $15, pira dhuwit sing Sunny entuk kanggo rong dina?"
answer = "Dheweke adol 10 + 5 = <<10+5=15>>15 kothak kue jahe ing Minggu.\nJumlah kothak kue jahe sing Sunny adol yaiku 10 + 15 = <<10+15=25>>25.\nSunny entuk 25*$6 = $<<25*6=150>>150 saka adol kue jahe.\nDheweke adol 15 - 4 = <<15-4=11>>11 kothak pai apel ing Sabtu.\nJumlah kothak pai apel sing Sunny adol yaiku 15 + 11 = <<15+11=26>>26.\nDheweke entuk 26*$15 = $<<26*15=390>>390 saka adol pai apel.\nMula, Sunny entuk $150 + $390 = $<<150+390=540>>540 kanggo rong dina.\n#### 540\n"
