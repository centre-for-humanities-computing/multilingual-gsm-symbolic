answer_annotated = "Dheweke adol {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} kothak {food} ing {d2}.\nJumlah kothak {food} sing {name} adol yaiku {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} entuk {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} saka adol {food}.\nDheweke adol {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} kothak pai {fruit} ing {d1}.\nJumlah kothak pai {fruit} sing {name} adol yaiku {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nDheweke entuk {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} saka adol pai {fruit}.\nMula, {name} entuk {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} kanggo rong dina.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
