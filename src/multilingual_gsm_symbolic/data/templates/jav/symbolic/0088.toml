question = "Dana bisa mlayu papat kali luwih cepet tinimbang dheweke bisa mlaku, nanging dheweke bisa mlayap kanthi kecepatan sing setengah saka kecepatan nalika mlayu. Yen dheweke bisa mlayap kanthi 3 mil per jam, pinten mil sing bisa dijangkuk ing enem jam yen dheweke nggunakake seper telu saka wektu kanggo mlayu lan loro per telu saka wektu kanggo mlaku?"
answer = "Yen Dana bisa mlayap kanthi setengah saka kecepatan nalika mlayu, mula dheweke bisa mlayu kanthi 3*2=<<3*2=6>>6 mil per jam.\nLan amarga dheweke bisa mlayu kanthi kecepatan sing papat kali luwih cepet tinimbang nalika mlaku, iki tegese dheweke bisa mlaku kanthi 6/5=1.2 mil per jam.\nYen loro per telu saka wektu digunakake kanggo mlaku, mula dheweke mlaku selama 6*3/5=<<6*3/5=18/5>>18/5 jam.\nYen seper telu saka wektu digunakake kanggo mlayu, mula dheweke mlayu selama 6-18/5=<<6-18/5=18/5>>18/5 jam.\nMula, dheweke mlayu selama 18/5 jam kanthi 6 mil per jam, utawa 18/5*6=<<18/5*6=108/5>>108/5 mil.\nDheweke mlaku selama 18/5 jam kanthi 1.2 mil per jam, utawa 18/5*1.2=<<18/5*1.2=108/25>>108/25 mil.\nMula, kabeh, dheweke nempuh 108/5+108/25=<<108/5+108/25=25>>25 mil.\n#### 25\n"
