question = "Artie duwe kios bunga ing Pasar Petani. Panjenengan adol telung jinis bunga: kembang mentul, kembang petunia lan kembang begonia. Biasane Panjenengan adol kembang mentul kanthi rega Rp2.74 saben pot, kembang petunia kanthi rega Rp1.87 saben pot lan kembang begonia kanthi rega Rp2.12 saben pot. Artie ora duwe uang receh dina iki, dadi panjenengan mutusake kanggo mbundhel kabeh regane dadi dollar paling cedhak. Yen Artie adol 12 pot kembang mentul, 9 pot kembang petunia lan 17 pot kembang begonia, pira dhuwit sing bakal dipikole?"
