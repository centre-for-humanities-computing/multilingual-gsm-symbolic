question = "Máire ceannaíonn 8 scaireanna stoc ar €8 an ceann. Méadaíonn praghas an stoc 50% an chéad bhliain a choinníonn {name} é, ansin laghdaíonn sé 25% sa dara bliain. Cad é luach deiridh na scaireanna go léir atá ag {name}?"
answer = "Ar dtús, faigh luach iomlán tosaigh ceannach Máire: 8 scaireanna * €8/scaire = €<<8*8=64>>64\nAnsin, faigh méid an chéad mhéadaithe ar an bpraghas: €64 * 0.5 = €<<64*0.5=32>>32\nCuir an méid sin leis an luach tosaigh chun an luach tar éis na céad bliana a fháil: €64 + €32 = €<<64+32=96>>96\nAnsin, iolraigh an méid sin faoi 25% chun méid an laghdaithe sa dara bliain a fháil: €96 * 25% = €<<96*25*.01=24>>24\nAnsin, dealaigh an méid sin ón luach tar éis na céad bliana chun an luach deiridh a fháil: €96 - €24 = €<<96-24=72>>72\n#### 72\n"
