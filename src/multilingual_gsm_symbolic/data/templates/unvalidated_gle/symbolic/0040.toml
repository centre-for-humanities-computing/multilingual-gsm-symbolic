question_annotated = "{name,Sally} chuaigh go dtí an trá ar saoire. Thug a tuismitheoirí ${total,15} di chun aon rud a theastaigh uirthi a cheannach. Sa siopa cuimhneachán, bhí taffaidh ar díol le \"Ceannaigh {n1,1} pound ag ${p1,3} in aghaidh an phoind, faigh {n2,1} pound {discount,1/2} as.\" Thóg sí {n12,4} pound. Cheannaigh sí mála measctha sceallóg ar ${p2,1.5} freisin agus {n3,4} maighnéid a bhí ${p3,0.25} an ceann. Cé mhéad airgid atá ag {name,Sally} fágtha?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "Tá {name} ag ceannach {n1} pound ar ${p1} agus faigheann sí {n2} pound {discount} as. Mar sin, tá {discount} as {n2} pound cothrom le ${p1}*{discount} = ${float(n2*discount*p1)}. Níl lascaine ar an gcuid eile de {n12-n1-n2} pound agus costann sé {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}, mar sin is é an t-iomlán ná ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} maighnéid ag ${p3} an ceann ná {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nNuair a chuirtear a ceannacháin go léir le chéile, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nBhí ${total} aici agus chaith sí ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} mar sin bhí ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} fágtha aici\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
