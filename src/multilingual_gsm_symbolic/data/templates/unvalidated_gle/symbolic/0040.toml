question = "Sally chuaigh go dtí an trá ar saoire. Thug a tuismitheoirí $15 di chun aon rud a theastaigh uirthi a cheannach. Sa siopa cuimhneachán, bhí taffaidh ar díol le \"Ceannaigh 1 pound ag $3 in aghaidh an phoind, faigh 1 pound 1/2 as.\" Thóg sí 4 pound. Cheannaigh sí mála measctha sceallóg ar $1.5 freisin agus 4 maighnéid a bhí $0.25 an ceann. Cé mhéad airgid atá ag Sally fágtha?"
answer = "Tá Sally ag ceannach 1 pound ar $3 agus faigheann sí 1 pound 1/2 as. Mar sin, tá 1/2 as 1 pound cothrom le $3*1/2 = $1.5. Níl lascaine ar an gcuid eile de 2 pound agus costann sé 2*$3 = $6, mar sin is é an t-iomlán ná $3+$3/2+$6=$21/2\n4 maighnéid ag $0.25 an ceann ná 4*0.25=$<<4*0.25=1>>1\nNuair a chuirtear a ceannacháin go léir le chéile, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nBhí $15 aici agus chaith sí $13 mar sin bhí $15-$13 = $<<15-13=2>>2 fágtha aici\n#### 2\n"
