question = "Sunny predáva perník a jablko koláč na charitatívnu zbierku. V sobota predal 10 krabíc perník a o 4 menej krabíc jablko koláča, než v nedeľa. V nedeľa predal o 5 viac krabíc perník než v sobota a 15 krabíc jablko koláča. Ak perník stojí $6 a jablko koláč stojí $15, koľko Sunny zarobil za dva dni?"
