question_annotated = "{name,Sally} išla na pobrežie na dovolenku. Jej rodičia jej dali ${total,15} na kúpu čohokoľvek, čo chcela. V suvenírovej predajni bola karamelka v akcii s ponukou \"Kúpiť {n1,1} libru za ${p1,3} za libru, získať {n2,1} libru {discount,1/2} zľavu.\" Nabrala {n12,4} libier. Tiež si kúpila miešané vrecko lastúr za ${p2,1.5} a {n3,4} magnetov, ktoré stáli ${p3,0.25} každý. Koľko peňazí má {name,Sally} ešte?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} kupuje {n1} libru za ${p1} a dostáva {n2} libru {discount} zľavu. Takže {discount} zľava na {n2} libru je ${p1}*{discount} = ${float(n2*discount*p1)}. Zvyšných {n12-n1-n2} libier nemá zľavu a stojí {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}, takže celkom je ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} magnetov po ${p3} každý je {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nKeď pripočítaš všetky jej nákupy, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nMala ${total} a minula ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}, takže mala ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} zostatok\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
