question = "Sally išla na pobrežie na dovolenku. Jej rodičia jej dali $15 na kúpu čohokoľvek, čo chcela. V suvenírovej predajni bola karamelka v akcii s ponukou \"Kúpiť 1 libru za $3 za libru, získať 1 libru 1/2 zľavu.\" Nabrala 4 libier. Tiež si kúpila miešané vrecko lastúr za $1.5 a 4 magnetov, ktoré stáli $0.25 každý. Koľko peňazí má Sally ešte?"
answer = "Sally kupuje 1 libru za $3 a dostáva 1 libru 1/2 zľavu. Takže 1/2 zľava na 1 libru je $3*1/2 = $1.5. Zvyšných 2 libier nemá zľavu a stojí 2*$3 = $6, takže celkom je $3+$3/2+$6=$21/2\n4 magnetov po $0.25 každý je 4*0.25=$<<4*0.25=1>>1\nKeď pripočítaš všetky jej nákupy, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nMala $15 a minula $13, takže mala $15-$13 = $<<15-13=2>>2 zostatok\n#### 2\n"
