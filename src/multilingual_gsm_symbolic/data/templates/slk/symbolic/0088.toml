question = "Dana dokáže bežať štyrikrát rýchlejšie než chodiť, ale dokáže preskakuvať rýchlosťou, ktorá je polovica rýchlosti, ktorou dokáže bežať. Ak sa dokáže preskakuvať rýchlosťou 3 míľ za hodinu, koľko míľ dokáže prejsť za šesť hodín, ak strávi jedna tretina času behom a dve tretiny času chôdzou?"
answer = "Ak sa Dana dokáže preskakuvať rýchlosťou polovica rýchlosti, ktorou beží, potom dokáže bežať rýchlosťou 3*2=<<3*2=6>>6 míľ za hodinu.\nA keďže dokáže bežať rýchlosťou, ktorá je štyrikrát rýchlejšia než jej chôdza, to znamená, že dokáže chodiť rýchlosťou 6/4=1.5 míľ za hodinu.\nAk sa dve tretiny času venuje chôdzi, potom chodí 6*2/3=<<6*2/3=4>>4 hodín.\nAk sa jedna tretina času venuje behu, potom beží 6-4=<<6-4=2>>2 hodín.\nTeda beží 2 hodín rýchlosťou 6 míľ za hodinu, alebo 2*6=<<2*6=12>>12 míľ.\nChodí 4 hodín rýchlosťou 1.5 míľ za hodinu, alebo 4*1.5=<<4*1.5=6>>6 míľ.\nTeda celkovo prejde 12+6=<<12+6=18>>18 míľ.\n#### 18\n"
