question = "En bonde köper foder till sina hästar. Han köper en variation av hö, havre, morötter och sockerbitar. Eftersom sockerbitar är en sällsynt lyx, köper han bara två 1-kilogramslådor av dem för hela stallet. Han vill bara ha tillräckligt med morötter för att mata hästarna medan grönsakerna är färska, så han köper fyra 12-kilogramspåsar. Hö är huvudfödan för hans hästar, så han köper fyrtiotvå 75-kilogramspaket. Havre är en basvara för att komplettera höet, så han köper tjugo 65-kilogramssäckar. Om hans gårdstruck kan bära 2250 kilogram i taget, hur många resor behöver bonden för att transportera allt foder?"
