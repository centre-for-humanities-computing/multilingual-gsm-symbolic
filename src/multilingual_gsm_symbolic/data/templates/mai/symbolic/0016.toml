question = "सन्नी एक धन संग्रह के लिए जिंजरब्रेड और सेब पाई बेच रहा है। शनिवार को, उसने 10 बक्से जिंजरब्रेड के और रविवार से सेब पाई के 4 कम बक्से बेचे। रविवार को, उसने शनिवार से 5 ज्यादा बक्से जिंजरब्रेड के और 15 बक्से सेब पाई के बेचे। अगर जिंजरब्रेड की कीमत $6 है और सेब पाई की कीमत $15 है, तो दो दिनों में सन्नी ने कितना कमाया?"
answer = "उसने 10 + 5 = <<10+5=15>>15 बक्से जिंजरब्रेड के रविवार पर बेचे।\nसन्नी द्वारा बेचे गए जिंजरब्रेड के बक्सों की कुल संख्या 10 + 15 = <<10+15=25>>25 है।\nसन्नी ने जिंजरब्रेड बेचने के लिए 25*$6 = $<<25*6=150>>150 कमाए।\nउसने शनिवार पर 15 - 4 = <<15-4=11>>11 बक्से सेब पाई के बेचे।\nसन्नी द्वारा बेचे गए सेब पाई के बक्सों की कुल संख्या 15 + 11 = <<15+11=26>>26 है।\nउसने सेब पाई बेचने के लिए 26*$15 = $<<26*15=390>>390 कमाए।\nतो, सन्नी ने दो दिनों में $150 + $390 = $<<150+390=540>>540 कमाए।\n#### 540\n"
