answer_annotated = "उसने {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} बक्से {food} के {d2} पर बेचे।\n{name} द्वारा बेचे गए {food} के बक्सों की कुल संख्या {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2} है।\n{name} ने {food} बेचने के लिए {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} कमाए।\nउसने {d1} पर {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} बक्से {fruit} पाई के बेचे।\n{name} द्वारा बेचे गए {fruit} पाई के बक्सों की कुल संख्या {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1} है।\nउसने {fruit} पाई बेचने के लिए {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} कमाए।\nतो, {name} ने दो दिनों में {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} कमाए।\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
