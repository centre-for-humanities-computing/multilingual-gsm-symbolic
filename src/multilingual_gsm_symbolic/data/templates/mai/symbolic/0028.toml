answer_annotated = "यदि {facility} {item} की कुल क्षमता का {frac} भरा हुआ है, तो इसका मतलब है {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} में मरीज उपयोग कर रहे हैं।\nनए भर्ती के बिना {facility} में {item} की कुल संख्या {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item} है।\nयदि प्रतिदिन {daily} लोग भर्ती किए जाते हैं, तो एक सप्ताह के बाद {facility} में मरीजों की कुल संख्या {daily} मरीज/दिन * 7 दिन/सप्ताह = {daily*7} मरीज है।\n{period} सप्ताह के बाद, {facility} में भर्ती किए गए मरीजों की कुल संख्या {daily*7} मरीज/सप्ताह * {period} सप्ताह = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} मरीज है, जो प्रत्येक एक {item} का उपयोग करते हैं।\nयदि नए भर्ती से पहले {facility} में {total-int(total*frac)} खाली {item} थे, तो कुल संख्या {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} खाली {item} तक कम हो जाती है।\n#### {total - (total * frac + daily * period * 7)}\n"
