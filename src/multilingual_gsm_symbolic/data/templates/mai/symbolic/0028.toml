question = "एक अस्पताल में 1000 बिस्तर की क्षमता है, जिनमें 1/5 भरे हुए हैं। कोराना वायरस महामारी के कारण, 50 मरीज प्रतिदिन अस्पताल में भर्ती किए जाते हैं। 2 सप्ताह के बाद अस्पताल में खाली बिस्तर की कुल संख्या की गणना करें।"
answer = "यदि अस्पताल बिस्तर की कुल क्षमता का 1/5 भरा हुआ है, तो इसका मतलब है 1/5 * 1000 = <<1000*1/5=200>>200 बिस्तर में मरीज उपयोग कर रहे हैं।\nनए भर्ती के बिना अस्पताल में बिस्तर की कुल संख्या 1000 बिस्तर - 200 बिस्तर = <<1000-200=800>>800 बिस्तर है।\nयदि प्रतिदिन 50 लोग भर्ती किए जाते हैं, तो एक सप्ताह के बाद अस्पताल में मरीजों की कुल संख्या 50 मरीज/दिन * 7 दिन/सप्ताह = 350 मरीज है।\n2 सप्ताह के बाद, अस्पताल में भर्ती किए गए मरीजों की कुल संख्या 350 मरीज/सप्ताह * 2 सप्ताह = <<350*2=700>>700 मरीज है, जो प्रत्येक एक बिस्तर का उपयोग करते हैं।\nयदि नए भर्ती से पहले अस्पताल में 800 खाली बिस्तर थे, तो कुल संख्या 800 बिस्तर - 700 बिस्तर = <<800-700=100>>100 खाली बिस्तर तक कम हो जाती है।\n#### 100\n"
