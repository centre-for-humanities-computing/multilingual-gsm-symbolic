question = "फ्रैंकी हर रात अपना घर का काम खत्म करने के बाद टीवी देखता है। सोमवार और मंगलवार को, उसने हर रात अपने पसंदीदा शो का एक 1-घंटे का एपिसोड देखा। बुधवार को, उसने एक 30-मिनट के शो के कुछ एपिसोड देखे। बृहस्पतिवार को, उसने घर का काम जल्दी खत्म किया और एक 1-घंटे का एपिसोड और एक 30-मिनट का शो देखा। शुक्रवार को, वह देर तक जाग सका, इसलिए उसने दो 1-घंटे के एपिसोड देखे। अगर उसने कुल 7 घंटे टीवी देखा, तो उसने बुधवार को कितने 30-मिनट के एपिसोड देखे?"
