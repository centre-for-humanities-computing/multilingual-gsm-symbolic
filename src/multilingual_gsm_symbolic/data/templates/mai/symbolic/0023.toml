question = "मार्था अपने 3 पोतों-पोतियों के लिए सर्दियों के कपड़े बुन रही है। वे तिगुने हैं, इसलिए उनके आकार सभी एक जैसे हैं। वह उनके लिए एक टोपी, स्कार्फ, स्वेटर, दस्ताने, और मोज़े बनाना चाहती है। एक टोपी बनाने में 2 ऊन के गुच्छे लगते हैं, 4 एक स्कार्फ के लिए, 12 एक स्वेटर के लिए, 1 एक जोड़ी दस्ताने के लिए, और 2 एक जोड़ी मोज़े के लिए। उसे कितने ऊन के गुच्छे खरीदने होंगे?"
answer = "प्रत्येक बच्चे के लिए एक पूर्ण पोशाक में चाहिए 2 ऊन के गुच्छे प्रति टोपी + 4 ऊन के गुच्छे प्रति स्कार्फ + 12 ऊन के गुच्छे प्रति स्वेटर + 1 ऊन के गुच्छे प्रति जोड़ी दस्ताने + 2 ऊन के गुच्छे प्रति जोड़ी मोज़े = <<2+4+12+1+2=21>>21 ऊन के गुच्छे।\nइसलिए अपने सभी पोतों-पोतियों के लिए पोशाक बुनने के लिए, उसे 3*21 = <<3*21=63>>63 ऊन के गुच्छे चाहिए।\n#### 63\n"
