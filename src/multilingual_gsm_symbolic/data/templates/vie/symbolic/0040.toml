question = "Sally đã đi nghỉ mát ở bãi biển. Bố mẹ cô ấy đã cho cô ấy $15 để mua bất cứ thứ gì cô ấy muốn. Tại cửa hàng lưu niệm, kẹo dẻo đang được khuyến mãi với ưu đãi \"Mua 1 pao với giá $3 mỗi pao, nhận thêm 1 pao giảm 1/2.\" Cô ấy đã xúc được 4 pao. Cô ấy cũng mua một túi hỗn hợp vỏ sò với giá $1.5 và 4 nam châm với giá $0.25 mỗi cái. Số tiền còn lại của Sally là bao nhiêu?"
answer = "Sally đang mua 1 pao với giá $3 và nhận thêm 1 pao giảm 1/2. Vậy giảm 1/2 cho 1 pao là $3*1/2 = $1.5. Phần còn lại 2 pao không được giảm giá và có giá 2*$3 = $6, nên tổng cộng là $3+$3/2+$6=$21/2\n4 nam châm với giá $0.25 mỗi cái là 4*0.25=$<<4*0.25=1>>1\nKhi cộng tất cả các món mua của cô ấy, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nCô ấy có $15 và đã chi $13 nên cô ấy còn lại $15-$13 = $<<15-13=2>>2\n#### 2\n"
