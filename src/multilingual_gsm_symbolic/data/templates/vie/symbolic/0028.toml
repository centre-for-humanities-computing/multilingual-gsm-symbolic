question = "Một bệnh viện có sức chứa 1000 giường với 1/5 đang được sử dụng. Do dịch coronavirus, 50 bệnh nhân được nhập viện vào bệnh viện mỗi ngày. Tính tổng số giường trống trong bệnh viện sau 2 tuần."
answer = "Nếu 1/5 tổng sức chứa của các giường tại bệnh viện đang được sử dụng, có nghĩa là 1/5 * 1000 = <<1000*1/5=200>>200 giường đang có bệnh nhân sử dụng.\nTổng số giường tại bệnh viện chưa có nhập viện mới là 1000 giường - 200 giường = <<1000-200=800>>800 giường.\nNếu 50 người được nhập viện mỗi ngày, tổng số bệnh nhân tại bệnh viện sau một tuần là 50 bệnh nhân/ngày * 7 ngày/tuần = 350 bệnh nhân.\nSau 2 tuần, tổng số bệnh nhân được nhập viện vào bệnh viện là 350 bệnh nhân/tuần * 2 tuần = <<350*2=700>>700 bệnh nhân, mỗi người sử dụng một giường.\nNếu trước khi nhập viện mới có 800 giường trống tại bệnh viện, tổng số giảm xuống còn 800 giường - 700 giường = <<800-700=100>>100 giường trống.\n#### 100\n"
