question = "Artie có một quầy bán hoa tại Chợ Nông Sản. Anh ấy bán ba loại hoa: cúc vạn thọ, thúy thảo và hoa thược dược. Anh ấy thường bán cúc vạn thọ với giá $2.74 mỗi chậu, thúy thảo với giá $1.87 mỗi chậu và hoa thược dược với giá $2.12 mỗi chậu. Artie không có tiền lẻ hôm nay, nên anh ấy đã quyết định làm tròn tất cả giá của mình đến số đô la gần nhất. Nếu Artie bán 12 chậu cúc vạn thọ, 9 chậu thúy thảo và 17 chậu hoa thược dược, anh ấy sẽ kiếm được bao nhiêu?"
