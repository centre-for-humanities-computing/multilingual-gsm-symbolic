question = "ക്രിഗ് യുടെ കയ്യിൽ 2 ₹20 നോട്ടുകൾ ഉണ്ട്. അവൻ ആറ് വെള്ള പീച്ചകകൾ ₹2 ഓരോന്നിന് വാങ്ങുന്നു. അവൻ കൂടാതെ 3 പാക്കറ്റുകൾ വെള്ള ബലൂൺകൾ ₹3 ഓരോന്നിന് വാങ്ങുന്നു. അവന് എത്ര പണം ബാക്കി ഉണ്ട്?"
answer = "ക്രിഗ് യുടെ കയ്യിൽ ആദ്യം 2 * ₹20 = ₹<<2*20=40>>40 ഉണ്ട്.\nക്രിഗ് 6*₹2 = ₹<<6*2=12>>12 വെള്ള പീച്ചകകൾ -ൽ ചെലവഴിക്കുന്നു.\nക്രിഗ് 3 പാക്കറ്റുകൾ വെള്ള ബലൂൺകൾ * ₹3 = ₹<<3*3=9>>9 വെള്ള ബലൂൺകൾ -ൽ ചെലവഴിക്കുന്നു.\nആകെ ക്രിഗ് ചെലവഴിച്ചത് ₹12 + ₹9 = ₹<<12+9=21>>21 ആണ്.\nക്രിഗ് യുടെ കയ്യിൽ ₹40 - ₹21 = ₹<<40-21=19>>19 ബാക്കി ഉണ്ട്.\n#### 19\n"
