question = "ആർട്ടി കർഷക വിപണി-ൽ ഒരു പൂവ് സ്റ്റാൻഡ് ഉണ്ട്. അവൻ മൂന്ന് തരം പൂവ്കൾ വിൽക്കുന്നു: മരീഗോൾഡ്സ്, പെടൂണിയകൾ എന്നിവയും ബെഗോണിയകൾ. അവൻ സാധാരണയായി മരീഗോൾഡ്സ് $2.74-ന് ഒരു തൊട്ടി-ന് വിലയായി, പെടൂണിയകൾ $1.87-ന് ഒരു തൊട്ടി-ന് വിലയായി, ബെഗോണിയകൾ $2.12-ന് ഒരു തൊട്ടി-ന് വിലയായി വിൽക്കുന്നു. ആർട്ടി ഇന്ന് മാറ്റിത്തരാനുള്ള പണമില്ലാത്തതിനാൽ, എല്ലാ വിലകളും ഏറ്റവും അടുത്ത ഡോളറിലേക്ക് റൗണ്ട് ചെയ്യാൻ അവൻ തീരുമാനിച്ചു. ആർട്ടി 12 തൊട്ടികൾ മരീഗോൾഡ്സ്, 9 തൊട്ടികൾ പെടൂണിയകൾ, 17 തൊട്ടികൾ ബെഗോണിയകൾ വിറ്റാൽ, അവന് എത്ര കിട്ടും?"
answer = "ആർട്ടി മരീഗോൾഡ്സ്-ന്റെ വില $2.74-ൽ നിന്ന് $3-ലേക്ക് മുകളിലേക്ക് റൗണ്ട് ചെയ്യും, കാരണം 2-ന് ശേഷം വരുന്ന സംഖ്യ 5 അല്ലെങ്കിൽ അതിലധികമാണ്.\nആർട്ടി പെടൂണിയകൾ-ന്റെ വില $1.87-ൽ നിന്ന് $2-ലേക്ക് up റൗണ്ട് ചെയ്യും, കാരണം 1-ന് ശേഷം വരുന്ന സംഖ്യ 5 or higher ആണ്.\nആർട്ടി ബെഗോണിയകൾ-ന്റെ വില $2.12-ൽ നിന്ന് $2-ലേക്ക് down റൗണ്ട് ചെയ്യും, കാരണം 2-ന് ശേഷം വരുന്ന സംഖ്യ less than 5 ആണ്.\nആർട്ടി 12 മരീഗോൾഡ്സ്*$3 = $<<12*3=36>>36\nആർട്ടി 9 പെടൂണിയകൾ*$2 = $<<9*2=18>>18\nആർട്ടി 17 ബെഗോണിയകൾ*$2 = $<<17*2=34>>34\nആകെ, ആർട്ടി $36 + $18 + $34 = $<<36+18+34=88>>88 കിട്ടും.\n#### 88\n"
