question = "ആശുപത്രി യ്ക്ക് 1000 കിടക്കകളുടെ ശേഷിയുണ്ട്, ഇതിൽ 1/5 ഭാഗം ഉപയോഗത്തിലാണ്. കൊറോണ വൈറസ് പടർപ്പ് മൂലം, ഓരോ ദിവസവും 50 രോഗികളെ ആശുപത്രി യിലേക്ക് പ്രവേശിപ്പിക്കുന്നു. 2 ആഴ്ചകൾക്ക് ശേഷം ആശുപത്രി യിലെ ഒഴിഞ്ഞ കിടക്കകളുടെ ആകെ എണ്ണം കണക്കാക്കുക."
answer = "ഒരു ആശുപത്രി യിലെ കിടക്കകളുടെ ആകെ ശേഷിയുടെ 1/5 ഭാഗം ഉപയോഗത്തിലാണെങ്കിൽ, അതിനർത്ഥം 1/5 * 1000 = <<1000*1/5=200>>200 കിടക്കകൾക്ക് രോഗികൾ ഉപയോഗിക്കുന്നു എന്നാണ്.\nപുതിയ പ്രവേശനങ്ങൾ ഇല്ലാതെ ആശുപത്രി യിലെ കിടക്കകളുടെ ആകെ എണ്ണം 1000 കിടക്കകൾ - 200 കിടക്കകൾ = <<1000-200=800>>800 കിടക്കകൾ ആണ്.\nഓരോ ദിവസവും 50 പേരെ പ്രവേശിപ്പിക്കുന്നുവെങ്കിൽ, ഒരു ആഴ്ചയ്ക്ക് ശേഷം ആശുപത്രി യിലെ രോഗികളുടെ ആകെ എണ്ണം 50 രോഗികൾ/ദിവസം * 7 ദിവസങ്ങൾ/ആഴ്ച = 350 രോഗികൾ ആണ്.\n2 ആഴ്ചകൾക്ക് ശേഷം, ആശുപത്രി യിലേക്ക് പ്രവേശിപ്പിക്കപ്പെടുന്ന രോഗികളുടെ ആകെ എണ്ണം 350 രോഗികൾ/ആഴ്ച * 2 ആഴ്ചകൾ = <<350*2=700>>700 രോഗികൾ ആണ്, ഇവർ ഓരോരുത്തരും ഒരു കിടക്ക ഉപയോഗിക്കുന്നു.\nപുതിയ പ്രവേശനങ്ങൾക്ക് മുമ്പ് ആശുപത്രി യിൽ 800 ഒഴിഞ്ഞ കിടക്കകൾ ഉണ്ടായിരുന്നുവെങ്കിൽ, ആകെ എണ്ണം 800 കിടക്കകൾ - 700 കിടക്കകൾ = <<800-700=100>>100 ഒഴിഞ്ഞ കിടക്കകളായി കുറയുന്നു.\n#### 100\n"
