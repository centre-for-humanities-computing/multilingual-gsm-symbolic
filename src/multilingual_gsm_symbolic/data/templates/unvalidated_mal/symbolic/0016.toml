question = "സണ്ണി ഒരു ഫണ്ട്റെയിസറിനായി ജിഞ്ചർബ്രെഡ്, ആപ്പിൾ പൈ വിൽക്കുന്നു. ശനിയാഴ്ച ന്, അവൻ 10 പെട്ടി ജിഞ്ചർബ്രെഡ്, ഞായറാഴ്ച നേക്കാൾ 4 പെട്ടി ആപ്പിൾ പൈ കുറവ് വിറ്റു. ഞായറാഴ്ച ന്, അവൻ ശനിയാഴ്ച നേക്കാൾ 5 കൂടുതൽ പെട്ടി ജിഞ്ചർബ്രെഡ്, 15 പെട്ടി ആപ്പിൾ പൈ വിറ്റു. ഒരു ജിഞ്ചർബ്രെഡ് ന്റെ വില ₹6 ഉം ഒരു ആപ്പിൾ പൈ ന്റെ വില ₹15 ഉം ആണെങ്കിൽ, സണ്ണി രണ്ട് ദിവസത്തിനായി എത്ര നേടി?"
answer = "അവൻ ഞായറാഴ്ച ന് 10 + 5 = <<10+5=15>>15 പെട്ടി ജിഞ്ചർബ്രെഡ് വിറ്റു.\nസണ്ണി വിറ്റ ജിഞ്ചർബ്രെഡ് പെട്ടികളുടെ ആകെ എണ്ണം 10 + 15 = <<10+15=25>>25 ആണ്.\nജിഞ്ചർബ്രെഡ് വിറ്റതിന് സണ്ണി 25*₹6 = ₹<<25*6=150>>150 നേടി.\nഅവൻ ശനിയാഴ്ച ന് 15 - 4 = <<15-4=11>>11 പെട്ടി ആപ്പിൾ പൈ വിറ്റു.\nസണ്ണി വിറ്റ ആപ്പിൾ പൈ പെട്ടികളുടെ ആകെ എണ്ണം 15 + 11 = <<15+11=26>>26 ആണ്.\nആപ്പിൾ പൈ വിറ്റതിന് അവൻ 26*₹15 = ₹<<26*15=390>>390 നേടി.\nഅതുകൊണ്ട്, സണ്ണി രണ്ട് ദിവസത്തിനായി ₹150 + ₹390 = ₹<<150+390=540>>540 നേടി.\n#### 540\n"
