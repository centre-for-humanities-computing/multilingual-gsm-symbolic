question = "കാർൾ ഉം ജെനിഫർ ഉം ലോസ് ആഞ്ചലസ് സ്വദേശികളായ സഹോദരിമാരാണ്, പ്രശസ്തർ യുടെ ഒപ്പുകൾ ശേഖരിക്കാൻ ഇഷ്ടപ്പെടുന്നവർ. പഠനത്തിലെ ഗ്രീഷ്മകാല അവധി സമയത്ത്, സഹോദരിമാർ ഓരോ വൈകുന്നേരവും ഒപ്പുകൾ ശേഖരിക്കാൻ ചിലവഴിക്കുന്നു. അഞ്ച് ആഴ്ചകൾക്ക് ശേഷം, കാർൾ ഉം ജെനിഫർ ഉം തങ്ങളുടെ ഓടോഗ്രാഫ് പുസ്തകങ്ങൾ താരതമ്യം ചെയ്യുകയും ഓരോ സഹോദരിയും ശേഖരിച്ച ഒപ്പുകളുടെ എണ്ണം കണക്കാക്കുകയും ചെയ്യുന്നു. കാർൾ യുടെ പുസ്തകത്തിൽ 20 ഒപ്പുകൾ ഉണ്ട്, ജെനിഫർ യുടെ പുസ്തകത്തിൽ 44 ഉണ്ട്. സഹോദരിമാർക്ക് മൂന്ന് കൂടിയ ആഴ്ചകളുടെ ഗ്രീഷ്മകാല അവധി ബാക്കിയുണ്ട്, അവർ അവധിക്കാല അവസാനത്തേക്കും തമ്മിൽ 100 ഒപ്പുകൾ എത്തിച്ചേരാൻ തീരുമാനിക്കുന്നു. തങ്ങളുടെ ലക്ഷ്യം നേടാൻ സഹോദരിമാർ എത്ര ഒപ്പുകൾ കൂടി ശേഖരിക്കേണ്ടതുണ്ട്?"
