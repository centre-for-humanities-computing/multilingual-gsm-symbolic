question = "Dana a ka matha makgetlo a mane ka potlako ho feta moo a ka tsamayang ka lona, empa a ka loha ka lebelo le halofo la moo a ka le mathang ka lona. Haeba a ka loha ka 3 dimele ka hora, o tla tsamaya dimele tse kae ka dihora tse tshela haeba a shetse karolo ya boraro ya nako a matha le dikarolo tse pedi tsa boraro ya nako a tsamaya?"
answer = "Haeba Dana a ka loha ka halofo lebelo leo a ka le mathang ka lona, joale a ka matha ka 3*5/3=<<3*5/3=5>>5 dimele ka hora.\nLe gonne a ka matha ka lebelo le makgetlo a mane ho feta moo a ka tsamayang ka lona, seno se raya gore a ka tsamaya ka 5/5=1 dimele ka hora.\nHaeba dikarolo tse pedi tsa boraro ya nako e shetswa a tsamaya, joale o tsamaya ka 10*2/3=<<10*2/3=20/3>>20/3 dihora.\nHaeba karolo ya boraro ya nako e shetswa a matha, joale o matha ka 10-20/3=<<10-20/3=10/3>>10/3 dihora.\nKa jalo, o matha ka dihora tse 10/3 ka lebelo la 5 dimele ka hora, kgotsa 10/3*5=<<10/3*5=50/3>>50/3 dimele.\nO tsamaya ka dihora tse 20/3 ka lebelo la 1 dimele ka hora, kgotsa 20/3*1=<<20/3*1=20/3>>20/3 dimele.\nKa jalo, kaofela, o tsamaya 50/3+20/3=<<50/3+20/3=23>>23 dimele.\n#### 23\n"
