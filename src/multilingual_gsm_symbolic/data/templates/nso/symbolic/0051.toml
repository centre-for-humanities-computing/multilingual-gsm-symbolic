question = "Artie o na le stand ya palesa kwa 'Maraakete wa Bakgadi. O rekisa mefuta e meraro ya dipalesa: dipalesa tsa letsatsi, dipalesa tsa petunia le dipalesa tsa begonia. O tlwaelegile go rekisa dipalesa tsa letsatsi ka $2.74 ka sekotlolo, dipalesa tsa petunia ka $1.87 ka sekotlolo le dipalesa tsa begonia ka $2.12 ka sekotlolo. Artie ga a na dipeelo lešatšini la kajeno, ka gona o šetše a phahamisetše theko yohle go ya ka dolara e haufi. Fa Artie a rekisa 12 ya sekotlolo tša dipalesa tsa letsatsi, 9 ya sekotlolo tša dipalesa tsa petunia le 17 ya sekotlolo tša dipalesa tsa begonia, o tla hwetša bokae?"
