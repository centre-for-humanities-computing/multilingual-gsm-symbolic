question = "John o bokella madi bakeng sa leeto la sekolo. O kile a kopa thuso go tswa go sekolo, e e ileng ya dumela go lefela sephatlo ya theko ya leeto la sekolo. Madi a makae a John a a tlhokang fa a na le $50 le ge leeto la sekolo e bitsa $300?"
