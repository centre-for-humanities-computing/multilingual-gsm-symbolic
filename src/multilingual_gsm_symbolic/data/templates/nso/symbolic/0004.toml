question = "Garrett o a tshwasa popokone go ja jaaka seswao. Fa sesepe ya dikgomo e futhumala, dikgomo di simolla go phatoha ka potlako. 20 di phatoha nakong ya metsotso ya ntlha ya 30 ya go pheha, e bile boraro dinako tseo nakong e latelang ya metsotso ya 30. Dikgomo di oketsega go ya go nne dinako tsa lebelo la go phatoha la ntlha nakong e latelang ya metsotso ya 30, empa nakong ya metsotso ya bofelo ya 30, go phatoha go fokotsega go ya go halofo ya lebelo la metsotso e fetileng ya 30. Morago ga gore Garrett a tlohele sesepe mo mollo, karolo ya bone ya palo ya dikgomo tse di phatohileng nakong ya metsotso ya bofelo ya 30 ya go pheha le tsona di phatoha ka lebaka la mocheso o setseng. Dikoto tse di kae tsa popokone Garrett a swanetse go di ja?"
