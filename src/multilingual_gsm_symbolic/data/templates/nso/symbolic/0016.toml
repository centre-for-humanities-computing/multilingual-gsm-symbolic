question = "Sunny o rekisa kuku ya jenjibred le apole pie bakeng sa motheo wa madi. Mo Mokibelo, o ne a rekisa 10 dibokose tsa kuku ya jenjibred le 4 dibokose tse di fokolang tsa apole pie, go feta mo Sontaga. Mo Sontaga, o ne a rekisa 5 dibokose tse di oketšegileng tsa kuku ya jenjibred go feta mo Mokibelo le 15 dibokose tsa apole pie. Ge kuku ya jenjibred e bitsa $6 le apole pie e bitsa $15, Sunny o ile a hwetša madi a makae bakeng sa matšatši a mabedi?"
answer = "O ne a rekisa 10 + 5 = <<10+5=15>>15 dibokose tsa kuku ya jenjibred mo Sontaga.\nPalogotlhe ya dibokose tsa kuku ya jenjibred tseo Sunny a di rekisitseng ke 10 + 15 = <<10+15=25>>25.\nSunny o ile a hwetša 25*$6 = $<<25*6=150>>150 bakeng sa go rekisa kuku ya jenjibred.\nO ne a rekisa 15 - 4 = <<15-4=11>>11 dibokose tsa apole pie mo Mokibelo.\nPalogotlhe ya dibokose tsa apole pie tseo Sunny a di rekisitseng ke 15 + 11 = <<15+11=26>>26.\nO ile a hwetša 26*$15 = $<<26*15=390>>390 bakeng sa go rekisa apole pie.\nKa jalo, Sunny o ile a hwetša $150 + $390 = $<<150+390=540>>540 bakeng sa matšatši a mabedi.\n#### 540\n"
