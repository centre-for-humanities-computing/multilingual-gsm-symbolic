question = "Ka ntlong ya Allan, go na le gabedi tsa mhoba go feta cannoli. O na le kakaretso ya 40 ya cannoli ka ntlong ya gagwe. Allan o rekile 60 tse dingwe tsa cannoli mabenkeleng le 40 tse fokolang tsa mhoba go feta palo ya cannoli. Batla kakaretso e kopaneng ya palo ya mhoba le cannoli tseo Allan a nang le tsona ka ntlong?"
