question = "Sally o ile a ya leleba la lewatle go ya phomolong. Barrala ba e neile $15 go reka seo a neng a se batla. Mo mabenkeleng a ditshwantsho, taffi e ne e le phokotso ya \"Reka 1 paunde ka $3 ka paunde, fumana 1 paunde 1/2 e theohile.\" O ile a ekgola 4 paunde. O ile a reka pase e tswakanyeditsweng ya dikgokwane tsa lewatle ya $1.5 le 4 dimagnet tse di neng di le $0.25 tse nngwe le tse nngwe. Ke bokae madi a Sally a setseng?"
answer = "Sally o reka 1 paunde ya $3 mme a fumana 1 paunde 1/2 e theohile. Ka jalo 1/2 e theohile ya 1 paunde ke $3*1/2 = $1.5. Sesala sa 2 paunde ga se na phokotso mme se bitsa 2*$3 = $6, ka jalo palogotlhe ke $3+$3/2+$6=$21/2\n4 dimagnet tse di neng di le $0.25 tse nngwe le tse nngwe ke 4*0.25=$<<4*0.25=1>>1\nFa o kopanya dipalo tsohle tsa tsa gagwe, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nE ne e le $15 mme e nyakile $13 ka jalo e ne e le $15-$13 = $<<15-13=2>>2 e setseng\n#### 2\n"
