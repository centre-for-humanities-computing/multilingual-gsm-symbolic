answer_annotated = "Haeba {frac} ya bokgoni jwa {facility} {item} e le e sebedisitswe, go raya gore {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} di na le barwedi ba di sebedisang.\nPalo ya {item} ka hara {facility} ntle le tsenyo e ntšhwa ke {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}.\nHaeba {daily} batho ba kenngwa ka letsatsi, palo ya barwedi ka hara {facility} morago ga beke e le nngwe ke {daily} barwedi/letsatsi * 7 matsatsi/beke = {daily*7} barwedi.\nMorago ga {period} dibeke, palo ya barwedi ba kenngwa ka hara {facility} ke {daily*7} barwedi/beke * {period} dibeke = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} barwedi, ba le mong le mong a sebedisa {item} se le seng.\nHaeba go ne go na le {total-int(total*frac)} {item} tse se sa sebediswang ka hara {facility} pele ga tsenyo e ntšhwa, palo yohle e fokotswa go ya go {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item} tse se sa sebediswang.\n#### {total - (total * frac + daily * period * 7)}\n"
