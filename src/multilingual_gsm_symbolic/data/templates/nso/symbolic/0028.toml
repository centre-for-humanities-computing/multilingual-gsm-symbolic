question = "Ngweti e na le bokgoni ba 1000 sepele ka 1/5 e sebedisitswe. Ka ntlha ya seoa sa coronavirus, 50 barwedi ba kenngwa ka hara ngweti ka letsatsi. Bala palogotlhe ya sepele tse se sa sebediswang ka hara ngweti morago ga 2 dibeke."
answer = "Haeba 1/5 ya bokgoni jwa ngweti sepele e le e sebedisitswe, go raya gore 1/5 * 1000 = <<1000*1/5=200>>200 sepele di na le barwedi ba di sebedisang.\nPalo ya sepele ka hara ngweti ntle le tsenyo e ntšhwa ke 1000 sepele - 200 sepele = <<1000-200=800>>800 sepele.\nHaeba 50 batho ba kenngwa ka letsatsi, palo ya barwedi ka hara ngweti morago ga beke e le nngwe ke 50 barwedi/letsatsi * 7 matsatsi/beke = 350 barwedi.\nMorago ga 2 dibeke, palo ya barwedi ba kenngwa ka hara ngweti ke 350 barwedi/beke * 2 dibeke = <<350*2=700>>700 barwedi, ba le mong le mong a sebedisa sepele se le seng.\nHaeba go ne go na le 800 sepele tse se sa sebediswang ka hara ngweti pele ga tsenyo e ntšhwa, palo yohle e fokotswa go ya go 800 sepele - 700 sepele = <<800-700=100>>100 sepele tse se sa sebediswang.\n#### 100\n"
