question = "دادی هر ڏينهن پنهنجي پسنديدہ پياده رستي تي 3 میلs چلندي آهي، جنهن ۾ ساحل تي 2 میلs پياده ٿيڻ ۽ سڪرڊ تي 1 میل(s) پياده ٿيڻ شامل آهي. سڪرڊ تي، دادی ساحل تي ڪيل رفتار جي ٻيڻي رفتار سان چلندي آهي. جيڪڏهن ساحل تي هن جي چلڻ جو وقت 40 منٽ آهي، ته ان کي مڪمل 3-میل چلڻ ۾ ڪيترو وقت لڳندو، منٽن ۾؟"
