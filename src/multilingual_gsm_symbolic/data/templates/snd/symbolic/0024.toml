question = "ان جي غذائي معلومات مطابق، چپس جي هڪ تھيل ۾ هر حصي لاءِ 250 ڪيلوريز آهن. جيڪڏهن 300 گرام واري تھيل ۾ 5 حصا آهن، تم ڪيترا گرام کائي سگهو ٿا جيڪڏهن توھان جو روزانو ڪيلوري جو هدف 2000 آهي ۽ توھان اڳ ۾ ئي 1800 ڪيلوريز کائي چڪا آھيو؟"
