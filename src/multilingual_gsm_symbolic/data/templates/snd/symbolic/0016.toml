question = "سنني جنگربريڊ ۽ سيف پائي هڪ فنڊ ريزر لاءِ وڪڻي رهيو آهي. ڇنڇر تي، انھن 10 ٻڪس جنگربريڊ جا وڪيا ۽ اتوار جي ڀيٽ ۾ 4 گهٽ ٻڪس سيف پائي جا وڪيا. اتوار تي، انھن ڇنڇر جي ڀيٽ ۾ 5 وڌيڪ ٻڪس جنگربريڊ جا ۽ 15 ٻڪس سيف پائي جا وڪيا. جيڪڏهن جنگربريڊ جي قيمت روپ6 آهي ۽ سيف پائي جي قيمت روپ15 آهي، تڏهن سنني ٻن ڏينهن ۾ ڪيترو ڪمائيندو؟"
answer = "اتوار تي انھن جنگربريڊ جا 10 + 5 = <<10+5=15>>15 ٻڪس وڪيا.\nسنني جي وڪيل جنگربريڊ جا ٻڪس جو ڪل تعداد 10 + 15 = <<10+15=25>>25 آهي.\nجنگربريڊ وڪڻڻ لاءِ سنني ڪمائيو 25*روپ6 = روپ<<25*6=150>>150.\nانھن ڇنڇر تي سيف پائي جا 15 - 4 = <<15-4=11>>11 ٻڪس وڪيا.\nسنني جي وڪيل سيف پائي جا ٻڪس جو ڪل تعداد 15 + 11 = <<15+11=26>>26 آهي.\nسيف پائي وڪڻڻ لاءِ انھن ڪمائيو 26*روپ15 = روپ<<26*15=390>>390.\nتنهنڪري، سنني ٻن ڏينهن لاءِ ڪمائيو روپ150 + روپ390 = روپ<<150+390=540>>540.\n#### 540\n"
