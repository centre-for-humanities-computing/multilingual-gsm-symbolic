question = "هڪ اسپتال جي گنجائش 1000 بسترن آهي جن مان 1/5 ڀريل آهن. ڪورونا وائرس جي وبا جي ڪري، هر ڏينهن 50 مريض اسپتال ۾ داخل ڪيا ويندا آهن. 2 هفتن کان پوءِ اسپتال ۾ خالي بسترن جو ڪل تعداد معلوم ڪريو."
answer = "جيڪڏهن اسپتال جي بسترن جي ڪل گنجائش جو 1/5 حصو ڀريل آهي، ان جو مطلب آهي ته 1/5 * 1000 = <<1000*1/5=200>>200 بسترن ۾ مريض استعمال ڪري رهيا آهن.\nنئين داخل ٿيڻ کان بغير اسپتال ۾ بسترن جو ڪل تعداد 1000 بسترن - 200 بسترن = <<1000-200=800>>800 بسترن آهي.\nجيڪڏهن هر ڏينهن 50 ماڻهو داخل ٿيندا آهن، هڪ هفتي کان پوءِ اسپتال ۾ مريضن جو ڪل تعداد 50 مريض/ڏينهن * 7 ڏينهن/هفتو = 350 مريض آهي.\n2 هفتن کان پوءِ، اسپتال ۾ داخل ٿيل مريضن جو ڪل تعداد 350 مريض/هفتو * 2 هفتا = <<350*2=700>>700 مريض آهي، جيڪي هر هڪ هڪ بستر استعمال ڪن ٿا.\nجيڪڏهن نئين داخل ٿيڻ کان اڳ اسپتال ۾ 800 خالي بسترن هئا، ڪل تعداد گهٽجي 800 بسترن - 700 بسترن = <<800-700=100>>100 خالي بسترن تائين اچي ٿو.\n#### 100\n"
