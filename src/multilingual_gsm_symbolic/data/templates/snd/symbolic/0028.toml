answer_annotated = "جيڪڏهن {facility} جي {item}ن جي ڪل گنجائش جو {frac} حصو ڀريل آهي، ان جو مطلب آهي ته {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item}ن ۾ مريض استعمال ڪري رهيا آهن.\nنئين داخل ٿيڻ کان بغير {facility} ۾ {item}ن جو ڪل تعداد {total} {item}ن - {int(total*frac)} {item}ن = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}ن آهي.\nجيڪڏهن هر ڏينهن {daily} ماڻهو داخل ٿيندا آهن، هڪ هفتي کان پوءِ {facility} ۾ مريضن جو ڪل تعداد {daily} مريض/ڏينهن * 7 ڏينهن/هفتو = {daily*7} مريض آهي.\n{period} هفتن کان پوءِ، {facility} ۾ داخل ٿيل مريضن جو ڪل تعداد {daily*7} مريض/هفتو * {period} هفتا = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} مريض آهي، جيڪي هر هڪ هڪ {item} استعمال ڪن ٿا.\nجيڪڏهن نئين داخل ٿيڻ کان اڳ {facility} ۾ {total-int(total*frac)} خالي {item}ن هئا، ڪل تعداد گهٽجي {total-int(total*frac)} {item}ن - {daily*period*7} {item}ن = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} خالي {item}ن تائين اچي ٿو.\n#### {total - (total * frac + daily * period * 7)}\n"
