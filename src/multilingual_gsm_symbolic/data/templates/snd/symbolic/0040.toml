question_annotated = "{name,سالي} چھٹیوں کے لیے ساحل سمندر گئی۔ اس کے والدین نے اسے ${total,15} دیے جو کچھ وہ چاہے خریدنے کے لیے۔ سوغات کی دکان پر، ٹافی سیل پر تھی \"{n1,1} پاؤنڈ فی پاؤنڈ ${p1,3} پر خریدیں، {n2,1} پاؤنڈ {discount,1/2} آف حاصل کریں۔\" اس نے {n12,4} پاؤنڈ اٹھا لیے۔ اس نے ${p2,1.5} میں ایک مکسڈ بیگ سمندری خول بھی خریدا اور {n3,4} مقناطیس جو کہ ${p3,0.25} فی کس تھے۔ {name,سالي} کے پاس کتنی رقم باقی بچتی ہے؟\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} {n1} پاؤنڈ ${p1} میں خرید رہی ہے اور {n2} پاؤنڈ {discount} آف حاصل کرتی ہے۔ تو {n2} پاؤنڈ کا {discount} آف ${p1}*{discount} = ${float(n2*discount*p1)} ہے۔ باقی {n12-n1-n2} پاؤنڈ کو کوئی رعایت نہیں ملتی اور اس کی قیمت {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1} ہے، اس طرح کل ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1} ہے\n{n3} مقناطیس فی کس ${p3} میں {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3} ہیں\nجب آپ اس کی تمام خریداری جمع کرتے ہیں، ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nاس کے پاس ${total} تھے اور اس نے ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} خرچ کیے تو اس کے پاس ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} باقی رہ گئے\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
