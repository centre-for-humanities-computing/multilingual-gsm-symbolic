question = "سالي چھٹیوں کے لیے ساحل سمندر گئی۔ اس کے والدین نے اسے $15 دیے جو کچھ وہ چاہے خریدنے کے لیے۔ سوغات کی دکان پر، ٹافی سیل پر تھی \"1 پاؤنڈ فی پاؤنڈ $3 پر خریدیں، 1 پاؤنڈ 1/2 آف حاصل کریں۔\" اس نے 4 پاؤنڈ اٹھا لیے۔ اس نے $1.5 میں ایک مکسڈ بیگ سمندری خول بھی خریدا اور 4 مقناطیس جو کہ $0.25 فی کس تھے۔ سالي کے پاس کتنی رقم باقی بچتی ہے؟"
answer = "سالي 1 پاؤنڈ $3 میں خرید رہی ہے اور 1 پاؤنڈ 1/2 آف حاصل کرتی ہے۔ تو 1 پاؤنڈ کا 1/2 آف $3*1/2 = $1.5 ہے۔ باقی 2 پاؤنڈ کو کوئی رعایت نہیں ملتی اور اس کی قیمت 2*$3 = $6 ہے، اس طرح کل $3+$3/2+$6=$21/2 ہے\n4 مقناطیس فی کس $0.25 میں 4*0.25=$<<4*0.25=1>>1 ہیں\nجب آپ اس کی تمام خریداری جمع کرتے ہیں، $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nاس کے پاس $15 تھے اور اس نے $13 خرچ کیے تو اس کے پاس $15-$13 = $<<15-13=2>>2 باقی رہ گئے\n#### 2\n"
