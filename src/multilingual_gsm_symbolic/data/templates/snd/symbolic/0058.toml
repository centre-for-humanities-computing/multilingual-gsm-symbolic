answer = "پهريان اهو ڳوليو ته هڪ گنوم ٽامي پڪس سان ڪيترو پاؤنڊ ڪن ڪڍي سگهي ٿو: 12 پاؤنڊ/day*5=<<12*5=60>>60 پاؤنڊ/day\nپوءِ ان مقدار کي 150% سان ضرب ڏيو ته معلوم ٿئي ته هڪ گنوم اسٽيل پڪس سان ڪيترو پاؤنڊ ڪڍي سگهي ٿو: 60 پاؤنڊ/day * 150% = <<60*150*.01=90>>90 پاؤنڊ/day\nپوءِ ان مقدار کي ضرب ڏيو جيڪو هڪ گنوم اسٽيل پڪس سان هڪ ڏينهن ۾ ڪڍي سگهي ٿو، گنومن جي تعداد سان: 90 پاؤنڊ/day/گنوم * 40 گنوم = <<90*40=3600>>3600 پاؤنڊ/day\nپوءِ ڏينهن وارو پاؤنڊ جو مقدار ڏينهنن جي تعداد سان ضرب ڏيو ته مهيني ۾ ڪڍيل ڪل پاؤنڊ معلوم ٿئي: 3600 پاؤنڊ/day * 30 days = <<3600*30=108000>>108,000 پاؤنڊ/day\n#### 108000\n"
