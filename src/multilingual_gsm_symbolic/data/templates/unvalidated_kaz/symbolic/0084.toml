answer_annotated = "Алдымен {name}'дың сатып алуының бастапқы жалпы құнын табыңыз: {n} акция * {cur}{p}/акция = {cur}<<{n}*{p}={n*p}>>{n*p}\nСодан кейін алғашқы баға өсуінің мөлшерін табыңыз: {cur}{n*p} * {r1/100} = {cur}<<{n*p}*{r1/100}={n*p*r1/100}>>{int(n*p*r1/100)}\nАлғашқы жылдан кейінгі құнды табу үшін сол мөлшерді бастапқы құнға қосыңыз: {cur}{n*p} + {cur}{n*p*r1/100} = {cur}<<{n*p}+{n*p*r1/100}={n*p*(1+r1/100)}>>{int(n*p*(1+r1/100))}\nЕкінші жылдағы төмендеу мөлшерін табу үшін сол мөлшерді {r2}%-ға көбейтіңіз: {cur}{n*p*(1+r1/100)} * {r2}% = {cur}<<{n*p*(1+r1/100)}*{r2}*.01={n*p*(1+r1/100)*r2/100}>>{int(n*p*(1+r1/100)*r2/100)}\nСоңғы құнды табу үшін сол мөлшерді бірінші жылдан кейінгі құннан шегеріңіз: {cur}{int(n*p*(1+r1/100))} - {cur}{int(n*p*(1+r1/100)*r2/100)} = {cur}<<{int(n*p*(1+r1/100))}-{int(n*p*(1+r1/100)*r2/100)}={ensure_int(n*p*(1+r1/100)*(1-r2/100))}>>{ensure_int(n*p*(1+r1/100)*(1-r2/100))}\n#### {ensure_int(n*p*(1+r1/100)*(1-r2/100))}\n"
