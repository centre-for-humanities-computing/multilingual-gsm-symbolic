question = "Мария 8 акцияны $8 бағамен сатып алады. Акция бағасы Мария ұстаған алғашқы жылы 50% өседі, кейін екінші жылы 25% төмендейді. Мария'дың барлық акцияларының соңғы құны қанша?"
answer = "Алдымен Мария'дың сатып алуының бастапқы жалпы құнын табыңыз: 8 акция * $8/акция = $<<8*8=64>>64\nСодан кейін алғашқы баға өсуінің мөлшерін табыңыз: $64 * 0.5 = $<<64*0.5=32>>32\nАлғашқы жылдан кейінгі құнды табу үшін сол мөлшерді бастапқы құнға қосыңыз: $64 + $32 = $<<64+32=96>>96\nЕкінші жылдағы төмендеу мөлшерін табу үшін сол мөлшерді 25%-ға көбейтіңіз: $96 * 25% = $<<96*25*.01=24>>24\nСоңғы құнды табу үшін сол мөлшерді бірінші жылдан кейінгі құннан шегеріңіз: $96 - $24 = $<<96-24=72>>72\n#### 72\n"
