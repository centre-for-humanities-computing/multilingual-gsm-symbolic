question = "Карол және Дженнифер Лос-Анджелес қаласынан туған апа-сіңлілер және олар жұлдыздардан қолтаңба жинауды жақсы көреді. Мектептен алынған жазғы демалыс кезінде қарындасылар әр күні кешке қолтаңба жинаумен өткізеді. бес аптадан кейін Карол мен Дженнифер қолтаңба кітаптарын салыстырады, әр қарындасының жинаған қолтаңбалар санын санап шығады. Карол кітабында 20 қолтаңбасы бар, ал Дженниферде 44 қолтаңба бар. Қарындасыларда тағы да үш апта жазғы демалыс бар және олар демалыс соңына дейін бірге 100 қолтаңба жинауды шешеді. Мақсатқа жету үшін қарындасыларға неше қолтаңба жинау керек?"
