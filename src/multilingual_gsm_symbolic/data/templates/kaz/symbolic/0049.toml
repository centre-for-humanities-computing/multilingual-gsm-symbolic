question = "Джон 3 әртүрлі пәтер кешендерінен қоқыс жинайды. Алғашқы екі әрқайсысында 200 пәтер бар, ал соңғысы қалған екі қосындысынан 60% үлкен. Ол әр жерден аптасына 3 рет қоқыс жинайды және әр пәтер үшін жинауға ₸0.4 алады. Ол аптасына қанша ақша табады?"
