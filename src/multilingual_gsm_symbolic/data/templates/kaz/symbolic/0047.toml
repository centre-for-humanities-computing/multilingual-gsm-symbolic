question = "Кол аулада Пасха жұмыртқаларын іздеу ойыны үшін 3 он екі дана жұмыртқа жасырды. Ламар 5 жұмыртқа тапты. Стейси Ламар-дан екі есе тапты. Чарли Стейси-ден 2 аз тапты, және Мэй Чарли-ден жарты есе тапты. Аулада әлі қанша жұмыртқа жасырылған?"
