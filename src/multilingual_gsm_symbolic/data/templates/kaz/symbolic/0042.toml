question = "Роджер дүкенге кофе сатып алуға барады. Ол сатып алатын кофе брендінің қалыпты бағасы $5 фунт үшін. Оның сүйікті бренді таусылып қалғандықтан, ол 20% қымбат брендті сатып алуға мәжбүр болды. Ол бір аптаға жететін кофе сатып алуға шешім қабылдады және ол күніне 1 фунт кофе жұмсайды. Ол сондай-ақ өзіне $2 тұратын пончик сатып алуға шешім қабылдады. Барлығы неге тұрды?"
