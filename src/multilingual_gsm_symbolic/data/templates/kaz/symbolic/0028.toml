answer = "Егер аурухана төсектерінің жалпы сыйымдылығының 1/5 бөлігі зандалған болса, бұл 1/5 * 1000 = <<1000*1/5=200>>200 төсек науқастарға берілген деген сөз.\nаурухана ішіндегі жаңа қабылдауларсыз төсектердің жалпы саны 1000 төсек - 200 төсек = <<1000-200=800>>800 төсек.\nЕгер әр күні 50 адам қабылданса, аурухана ішінде бір аптадан кейінгі науқастардың жалпы саны 50 науқас/күн * 7 күн/апта = 350 науқас.\n2 аптадан кейін, аурухана ішіне қабылданған науқастардың жалпы саны 350 науқас/апта * 2 апта = <<350*2=700>>700 науқас, әрқайсысы бір төсек алады.\nЕгер жаңа қабылдауларға дейін аурухана ішінде 800 бос төсек болса, жалпы саны 800 төсек - 700 төсек = <<800-700=100>>100 бос төсек болып азаяды.\n#### 100\n"
