question = "Ақылы телефон арқылы қоңырау шалу үшін, әр минуты үшін $0.25 төлеу керек. 16 минуттан кейін баға минутына $0.2 дейін төмендейді. 36 минуттық қоңырау қанша тұрады?"
answer = "Алдыменгі 16 минуттың құны 16 * 0.25 = $<<16*0.25=4>>4 болады.\nСодан кейін қоңыраудан 36 - 16 = <<36-16=20>>20 минут қалады.\nАл осы 20 минуттың құны 20 * 0.2 = $<<20*0.2=4>>4.\nСонымен, 36-минуттық қоңыраудың жалпы құны 4 + 4 = $8 болады.\n#### 8\n"
