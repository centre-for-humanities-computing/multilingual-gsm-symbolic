question = "Эмили минутына 6 шағала тазалап, 10 минутта 30 шағала қуыра алады. Оған 90 шағала тазалап, қуыру үшін қанша уақыт кетеді? Эмили бір уақытта тазалай және қуыра алмайды."
answer = "Алдымен Эмили-нің шағала тазалауына қанша уақыт кететінін табайық: 90 шағала / 6 шағала/минут = <<90/6=15>>15 минут\nСодан кейін оған қуыру үшін қанша партия шағала қажет екенін табайық: 90 шағала / 30 шағала/партия = <<90/30=3>>3 партия\nСодан кейін жалпы пісіру уақытын табу үшін партия санын бір партияға кететін уақытқа көбейтіңіз: 3 партия * 10 минут/партия = <<3*10=30>>30 минут\nСодан кейін Эмили жұмсайтын жалпы уақытты табу үшін тазалау уақытын қосыңыз: 30 минут + 15 минут = <<30+15=45>>45 минут\n#### 45"
