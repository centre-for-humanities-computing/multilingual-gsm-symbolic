question = "Марта өзінің 3 немерелеріне қыс киімі тоқып жатыр. Олар үш егіз, сондықтан олардың барлығының өлшемі бірдей. Ол әрқайсысына сәлде, шарф, свитер, қолғап және шұлық жасағысы келеді. сәлде жасауға 2 ирек жүн кетеді, шарф үшін 4, свитер үшін 12, қолғап жұбына 1, және шұлық жұбына 2. Ол қанша ирек жүн сатып алуы керек?"
