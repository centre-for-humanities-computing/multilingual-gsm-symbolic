question = "Ропер мырза мұғалімінің 30 оқушысы бар сыныбында, сыныптың 20% футболшылар. Қалған сыныптан оқушылардың 25% көркемдікшілер немесе оркестр мүшелері. Бұл 3 топ оқушы бүгін ерте кетіп, қала сыртындағы ойынға баруы керек. Ерте кететін оқушылар қанша?"
