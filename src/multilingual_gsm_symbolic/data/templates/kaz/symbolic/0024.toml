question = "Құрамы бойынша, чипс пакетінің әр порциясында 250 калория бар. Егер 300 грамм пакетінде 5 порция болса, сіздің күндік калория мақсатыңыз 2000 және сіз бұрын 1800 калория тұтынған болсаңыз, қанша грамм жей аласыз?"
answer = "Егер жалпы калория мақсаты 2000 болса және мен 1800 калория тұтынған болсам, онда менде тамақтануға 2000-1800 = <<2000-1800=200>>200 калория қалды\nЕгер чипс әр порциясы 250 калория болса және менде тамақтануға тек 200 калория қалса, онда мен порцияның тек 200/250 бөлігін ғана жей аламын = 4/5 порция\nСондай-ақ, 300 грамм чипс пакетінде 5 порция бар екенін білеміз, демек әр порцияда 300 грамм/5 = <<300/5=60>>60 грамм бар\nЕгер мен порцияның тек 4/5 бөлігін ғана жей алсам, онда мен тек 60 грамм * 4/5 = 48 грамм жей аламын\n#### 48\n"
