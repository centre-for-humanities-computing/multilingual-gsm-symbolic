question = "Фермер жылқылар үшін жем-шөп сатып алып жатыр. Ол түрлі шөп, сұлы, сәбіз және қант кесектері сатып алады. қант кесектері сирек тәтті болғандықтан, ол бүкіл қораға арнап тек екі 1-фунт қорап сатып алады. Ол сәбіз тек көкөністер жаңа болған кезде жылқылар тамақтандыруға жеткілікті болсын деп қалайды, сондықтан ол төрт 12-фунт қап сатып алады. шөп оның жылқылар негізгі азығы болғандықтан, ол қырық екі 75-фунт пачка сатып алады. сұлы шөп толықтырушы негізгі азық болғандықтан, ол жиырма 65-фунт меш сатып алады. Егер оның ферма көлігі бір уақытта 2250 фунт көтерсе, фермерге барлық жем-шөпті тасымалдау үшін неше рет қажет?"
