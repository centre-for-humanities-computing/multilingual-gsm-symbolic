question = "Арті гүл дүңгіршегі бар Фермерлер нарығында. Ол үш түрлі гүл сатады: қасқагүлдер, патунялар және бегониялар. Ол әдетте қасқагүлдер ₸2.74-ге қазан басына, патунялар ₸1.87-ге және бегониялар ₸2.12-ге қазан басына сатады. Арті-ның бүгін ақшасы жоқ, сондықтан ол барлық бағаларын ең жақын долларға дейін дөңгелектеуге шешім қабылдады. Егер Арті 12 қазан қасқагүлдер, 9 қазан патунялар және 17 қазан бегониялар сатса, ол неше ақша табады?"
answer = "Арті қасқагүлдер бағасын ₸2.74-ден ₸3-ге дейін жоғары дөңгелектеді, себебі 2-ден кейінгі сан 5 немесе одан жоғары.\nАрті патунялар бағасын ₸1.87-ден ₸2-ге дейін up дөңгелектеді, себебі 1-ден кейінгі сан 5 or higher.\nАрті бегониялар бағасын ₸2.12-ден ₸2-ге дейін down дөңгелектеді, себебі 2-ден кейінгі сан less than 5.\nАрті 12 қасқагүлдер сатты: ₸3 * 12 = ₸<<12*3=36>>36\nАрті 9 патунялар сатты: ₸2 * 9 = ₸<<9*2=18>>18\nАрті 17 бегониялар сатты: ₸2 * 17 = ₸<<17*2=34>>34\nБарлығы, Арті ₸36 + ₸18 + ₸34 = ₸<<36+18+34=88>>88\n#### 88\n"
