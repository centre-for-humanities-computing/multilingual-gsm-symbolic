question = "Элисон жүгіру командасына орын иеленді, сондықтан ол спорттық жабдық сатып алуға барды. Ол майка үшін $10, жүгіру шорты үшін майка бағасынан $5 артық, және бастапқыда $48 болған теннис аяқ киімі жарты бағаға сатып алды. Ол сондай-ақ сатып алған $8 құнындағы спорттық шұлық пакетіне $2 жеңілдік купоны болды. Ол спорттық жабдыққа қанша шығындады?"
answer = "Шорты майка бағасынан $5 артық болды, сондықтан олардың құны $5 + $10 = $<<5+10=15>>15 болды.\nОның теннис аяқ киімі бастапқы $48 бағасының жарты болды, сондықтан олардың құны $48*1/2=$24 болды.\nКупонымен, шұлық $8 - $2 = $<<8-2=6>>6 болды.\nмайка, шорты, теннис аяқ киімі және шұлық бірге $10 + $15 + $24 + $6 = $<<10+15+24+6=55>>55 құрады.\n#### 55\n"
