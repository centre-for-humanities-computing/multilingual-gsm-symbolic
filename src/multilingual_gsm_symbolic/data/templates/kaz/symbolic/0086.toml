question_annotated = "{name,Элисон} {sport,жүгіру} командасына орын иеленді, сондықтан ол спорттық жабдық сатып алуға барды. Ол {item1,майка} үшін {cur,$}{p1,10}, {sport, жүгіру} {item2,шорты} үшін {item1, майка} бағасынан {cur,$}{p2,5} артық, және бастапқыда {cur,$}{p3,48} болған {item3,теннис аяқ киімі} {frac_txt,жарты} бағаға сатып алды. Ол сондай-ақ сатып алған {cur,$}{p4,8} құнындағы спорттық {item4,шұлық} пакетіне {cur,$}{d,2} жеңілдік купоны болды. Ол спорттық жабдыққа қанша шығындады?\n\n#init:\n- name = sample(names_female)\n- sport = sample([\"жүзу\", \"велоспорт\", \"баскетбол\", \"футбол\", \"волейбол\"])\n- item1 = sample([\"майка\", \"футболка\", \"спорттық бюстгальтер\"])\n- item2 = sample([\"шорты\", \"леггинстер\", \"спортивтік шалбар\"])\n- item3 = sample([\"кроссовки\", \"айлақтар\", \"спорттық аяқ киім\"])\n- item4 = sample([\"шұлық\", \"маңдайлық\", \"білезіктер\"])\n- cur = sample(currencies_sym)\n- frac_txt, frac_val = sample(fraction_alnum)\n- $p1 = range(8, 25)\n- $p2 = range(3, 15)\n- $p3 = range(30, 80, 2)\n- $p4 = range(5, 15)\n- $d = range(1, 5)\n\n#conditions:\n- is_int(p3*frac_val)\n- p3 % 2 == 0\n- p4 > d\n\n#answer: p1 + (p1 + p2) + (p3 * frac_val) + (p4 - d)\n"
answer_annotated = "{item2} {item1} бағасынан {cur}{p2} артық болды, сондықтан олардың құны {cur}{p2} + {cur}{p1} = {cur}<<{p2}+{p1}={p1+p2}>>{p1+p2} болды.\nОның {item3} бастапқы {cur}{p3} бағасының {frac_txt} болды, сондықтан олардың құны {cur}{p3}*{frac_val}={cur}{p3*frac_val} болды.\nКупонымен, {item4} {cur}{p4} - {cur}{d} = {cur}<<{p4}-{d}={p4-d}>>{p4-d} болды.\n{item1}, {item2}, {item3} және {item4} бірге {cur}{p1} + {cur}{p1+p2} + {cur}{p3*frac_val} + {cur}{p4-d} = {cur}<<{p1}+{p1+p2}+{p3*frac_val}+{p4-d}={p1 + (p1 + p2) + (p3 * frac_val) + (p4 - d)}>>{p1 + (p1 + p2) + (p3 * frac_val) + (p4 - d)} құрады.\n#### {p1 + (p1 + p2) + (p3 * frac_val) + (p4 - d)}\n"
