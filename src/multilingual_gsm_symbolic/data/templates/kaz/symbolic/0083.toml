question = "Адамс отбасы печенье жасауға асығып жатыр. Әзірге олар 7995 дана печенье жасады. Оларда 2595 дана көп түсті печенье, 3075 дана арпа печенье және кейбір шоколад печенье бар. Олар неше шоколад печенье жасады?"
