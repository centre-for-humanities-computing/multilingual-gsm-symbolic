question = "Брендан қолында ішінде 10 сақиналар бар қалта бар. Ол оны алып жүрген кезде шақпақ тасға сүрінді және олардың жартысын төкті. Ол оларды іздеуге тырысты, бірақ тек 3 тапты. Үйге қайтып келгенде, ол сақиналар мұқият қарап шықты. Ол жинағандарының екіуі сақиналар емес, шын мәнінде моншақтар болғандықтан, олардан арылды. Нәтижесінде Брендан қолында неше сақиналар қалды?"
answer = "Брендан оның сақиналарды төкті және қолында 10*2/5=<<10*2/5=4>>4 сақиналар қалды.\nОл іздеп, жоғалған сақиналардың бір бөлігін тапты, нәтижесінде қолында 4+3=<<4+3=7>>7 сақиналар болды.\nОл үйге барып, екі моншақтарды алып тастады, оның қолында 7-2=<<7-2=5>>5 сақиналар қалды.\n#### 5\n"
