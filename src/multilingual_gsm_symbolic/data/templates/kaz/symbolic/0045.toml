question = "Пат-тың 111 фут ұзындығындағы гүлзары бар. Пат гүлзарын өсімдіктермен толтырғысы келеді. Пат-тың гүлдері 12 дюйм кең өседі, ал бағбаншылық нұсқаулықтары гүлзар бойымен әр 1.5 фут сайын бір гүл отырғызу керек дейді. Пат-тың қазірден 17 гүлі бар. Әр гүлді өсімдік дүкенде $6 тұрады. Гүлзарын толықтыру үшін дүкенде Пат қанша ақша жұмсайды?"
