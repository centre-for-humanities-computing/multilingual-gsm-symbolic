question = "Тоула пекарняға барды және әртүрлі тоқаштар сатып алды. Ол 3 ондаған донаттар сатып алды, олардың бағасы бір ондағанға $68, 2 ондаған мини-капкейктер сатып алды, олардың бағасы бір ондағанға $80, және 6 ондаған мини-чизкейктер сатып алды, олардың бағасы бір ондағанға $55. Жалпы құны қанша болды?"
answer = "Донаттар үшін жалпы төлем 3*$68 = $<<3*68=204>>204.\nмини-капкейктер үшін жалпы төлем 2*$80 = $<<2*80=160>>160.\nмини-чизкейктер үшін жалпы төлем 6*$55 = $<<6*55=330>>330.\nСондықтан Тоула тоқаштар үшін төлеген жалпы сома $204 + $160 + $330 = $<<204+160+330=694>>694.\n#### 694\n"
