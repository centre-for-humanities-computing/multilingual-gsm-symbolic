question = "Азамат Tan үй $400,000 сатты. Ол сатылым бағасының 3% құрайтын аударым ақысын төледі және сатылым бағасының 5% құрайтын брокерлік ақысын да төледі. Егер ол үй қалған несиесі үшін $250,000 төледі, азамат Tan'тың үй сатудан түскен таза табысы қанша?"
answer = "Азамат Tan аударым ақысы үшін $400,000*3/100 = <<400000*3/100=12000>>$12,000 төледі.\nОл брокерлік ақысы үшін $400,000*5/100 = <<400000*5/100=20000>>$20,000 төледі.\nСонымен, азамат Tan аударым, брокерлік және несие ақылары үшін барлығы $12,000 + $20,000 + $250,000 = <<12000+20000+250000=282000>>$282,000 төледі.\nДемек, азамат Tan'тың таза табысы $400,000 - $282,000 = <<400000-282000=118000>>$118,000.\n#### 118000\n"
