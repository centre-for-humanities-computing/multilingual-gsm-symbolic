question = "60 сұрақтық викторинада, сұрақтардың 40% оңай болып табылады, ал қалғандары тең бөлініп орташа және қиын сұрақтар болып бөлінеді. Егер Ариес оңай сұрақтардың 75% -ін анық алса, және жарты орташа және қиын сұрақтарды дұрыс шешсе, ол неше ұпай алатынына сенімді?"
answer = "Орташа және қиын сұрақтары викторинадағы 100% - 40% = 60% құрайды.\n60 сұрақ * 40/100 = <<60*40/100=24>>24 оңай сұрақ бар.\nБарлығы 60 сұрақ * 60/100 = <<60*60/100=36>>36 орташа және қиын сұрақ бар.\nЕгер Ариес оңай сұрақтардың 75% -ін анық алса, бұл оның 24 сұрақ * 75/100 = <<24*75/100=18>>18 ұпай алатынына сенімді деген сөз.\nорташа және қиын сұрақтарынан ол оның жарты бөлігін дұрыс шешетініне сенімді, яғни 36 сұрақ * 1/2 = <<36*1/2=18>>18 ұпай.\nСонымен, ол викторинада 18 ұпай + 18 ұпай = <<18+18=36>>36 ұпай алатынына сенімді.\n#### 36\n"
