question = "Джулия өз үйінде кешкі ас үшін дайындалып жатты, мұнда ол қуырдақ ұсынуды жоспарлаған. Ол пластик қасық таусылғанын байқады, сондықтан ол жаңа қасық пачкасын сатып алды. Кейін, оның күйеуі де 5 жаңа қасық пачкасын сатып алып, оны Джулияға берді. Джулия қуырдақ дайындап жатқанда, ол үш қасық қолданып, өз қуырдақын дәм татты. Кейін, ол үстел жинауға барғанда, оның барлығы 12 қасық болды. Джулия сатып алған пачкада қанша қасық болды?"
