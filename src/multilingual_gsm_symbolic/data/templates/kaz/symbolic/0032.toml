question = "Круз ханым өз $400,000 бюджетінен аспайтын үй іздеп жүр. Ол сату бағасы $350,000 болатын мүлікті көрді. Сонымен қатар, сатып алушы сату бағасының 5% құрайтын брокерлік алымды, және сату бағасының 12% құрайтын аударым ақысын төлеуі керек. үй жалпы бағасы круз ханым бюджетінен қанша артық?"
