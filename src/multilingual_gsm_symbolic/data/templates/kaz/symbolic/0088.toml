question = "Дана жаяу жүруден төрт есе жылдам жүгіре алады, бірақ жүгіру жылдамдығының жарты бөлігімен секіре алады. Егер ол 3 миль/сағат жылдамдықпен секіре алса, үштен бір уақытын жүгіруге, ал үштен екі уақытын жаяу жүруге жұмсаған жағдайда, алты сағатта қанша миль жүре алады?"
answer = "Егер Дана жүгіру жылдамдығының жарты бөлігімен секіре алса, онда ол 3*2=<<3*2=6>>6 миль/сағат жылдамдықпен жүгіре алады.\nАл ол жүгіру жылдамдығы жаяу жүру жылдамдығынан төрт есе есе жылдам болғандықтан, бұл оның 6/5=1.2 миль/сағат жылдамдықпен жаяу жүре алатынын білдіреді.\nЕгер үштен екі уақыт жаяу жүруге кетсе, онда ол 6*2/3=<<6*2/3=4>>4 сағат жаяу жүреді.\nЕгер үштен бір уақыт жүгіруге кетсе, онда ол 6-4=<<6-4=2>>2 сағат жүгіреді.\nОсылайша, ол 6 миль/сағат жылдамдықпен 2 сағат жүгіреді, бұл 2*6=<<2*6=12>>12 миль.\nОл 1.2 миль/сағат жылдамдықпен 4 сағат жаяу жүреді, бұл 4*1.2=<<4*1.2=24/5>>24/5 миль.\nОсылайша, барлығы ол 12+24/5=<<12+24/5=16>>16 миль жүреді.\n#### 16\n"
