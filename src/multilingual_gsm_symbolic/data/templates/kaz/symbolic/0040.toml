question_annotated = "{name,Салли} демалысқа теңіз жағалауына барды. Оның ата-анасы оған қалағанын сатып алу үшін ${total,15} берді. Сувенир дүкенінде тэффи сатылымында «{n1,1} фунтты ${p1,3} бағасына сатып алыңыз, {n2,1} фунтты {discount,1/2} жеңілдікпен алыңыз» деп жарияланды. Ол {n12,4} фунт сатып алды. Ол сондай-ақ ${p2,1.5} тұратын аралас теңіз қабықшаларын және әрқайсысы ${p3,0.25} тұратын {n3,4} магнитті сатып алды. {name,Салли} қанша ақша қалды?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} {n1} фунтты ${p1} бағасына сатып алып, {n2} фунтқа {discount} жеңілдік алады. Сонымен, {n2} фунттың {discount} жеңілдігі ${p1}*{discount} = ${float(n2*discount*p1)}. Қалған {n12-n1-n2} фунтқа жеңілдік қолданылмайды және {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1} тұрады, сондықтан жалпы сома ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} магнит әрқайсысы ${p3} тұрады, яғни {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nБарлық сатып алуларын қосқанда, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nОның қолында ${total} болды және ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} жұмсады, сондықтан оның қолында ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} қалды\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
