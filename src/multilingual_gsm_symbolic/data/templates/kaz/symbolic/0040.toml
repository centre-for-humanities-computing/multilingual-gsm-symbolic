question = "Салли демалысқа теңіз жағалауына барды. Оның ата-анасы оған қалағанын сатып алу үшін $15 берді. Сувенир дүкенінде тэффи сатылымында «1 фунтты $3 бағасына сатып алыңыз, 1 фунтты 1/2 жеңілдікпен алыңыз» деп жарияланды. Ол 4 фунт сатып алды. Ол сондай-ақ $1.5 тұратын аралас теңіз қабықшаларын және әрқайсысы $0.25 тұратын 4 магнитті сатып алды. Салли қанша ақша қалды?"
answer = "Салли 1 фунтты $3 бағасына сатып алып, 1 фунтқа 1/2 жеңілдік алады. Сонымен, 1 фунттың 1/2 жеңілдігі $3*1/2 = $1.5. Қалған 2 фунтқа жеңілдік қолданылмайды және 2*$3 = $6 тұрады, сондықтан жалпы сома $3+$3/2+$6=$21/2\n4 магнит әрқайсысы $0.25 тұрады, яғни 4*0.25=$<<4*0.25=1>>1\nБарлық сатып алуларын қосқанда, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nОның қолында $15 болды және $13 жұмсады, сондықтан оның қолында $15-$13 = $<<15-13=2>>2 қалды\n#### 2\n"
