question = "Айбек қайырымдылық жинау үшін имбирлі нан және алма пирогын сатуда. сенбіде ол 10 қорап имбирлі нан және жексенбідегіден 4 қорап аз алма пирогын сатты. жексенбіде ол сенбідегіден 5 қорап көп имбирлі нан және 15 қорап алма пирогын сатты. Егер имбирлі нан ₸6 тұрса және алма пирогы ₸15 тұрса, айбек екі күнде қанша тапты?"
answer = "Ол жексенбіде күні 10 + 5 = <<10+5=15>>15 қорап имбирлі нан сатты.\nайбек сатқан имбирлі нан қораптарының жалпы саны 10 + 15 = <<10+15=25>>25.\nайбек имбирлі нан сатқаны үшін 25*₸6 = ₸<<25*6=150>>150 тапты.\nОл сенбіде күні 15 - 4 = <<15-4=11>>11 қорап алма пирогын сатты.\nайбек сатқан алма пирогының қораптарының жалпы саны 15 + 11 = <<15+11=26>>26.\nОл алма пирогын сатқаны үшін 26*₸15 = ₸<<26*15=390>>390 тапты.\nСонымен, айбек екі күнде ₸150 + ₸390 = ₸<<150+390=540>>540 тапты.\n#### 540\n"
