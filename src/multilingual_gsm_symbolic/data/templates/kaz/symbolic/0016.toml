question_annotated = "{name, айбек} қайырымдылық жинау үшін {food, имбирлі нан} және {fruit, алма} пирогын сатуда. {d1, сенбіде} ол {n1, 10} қорап {food, имбирлі нан} және {d2, жексенбіде}гіден {m1, 4} қорап аз {fruit, алма} пирогын сатты. {d2, жексенбіде} ол {d1, сенбіде}гіден {n2, 5} қорап көп {food, имбирлі нан} және {m2, 15} қорап {fruit, алма} пирогын сатты. Егер {food, имбирлі нан} {cur, ₸}{cn, 6} тұрса және {fruit, алма} пирогы {cur, ₸}{cm, 15} тұрса, {name, айбек} екі күнде қанша тапты?\n\n#init:\n- name = sample(names_male)\n- fruit = sample(fruits)\n- cur = sample(currencies_sym)\n- food = sample([\"имбирлі нан\", \"печенье\", \"шоколадты торт\", \"маффин\", \"капкейк\"])\n- d1, d2 = sample_sequential(weekdays, 2)\n- $n1 = range(21, 30)\n- $n2 = range(11, 15)\n- $m1 = range(4, 20)\n- $m2 = range(15, 30)\n- $cn = range(7, 13)\n- $cm = range(20, 33)\n\n#conditions:\n- m1 < m2\n\n#answer: (2*n1+n2)*cn + (2*m2-m1)*cm\n"
answer_annotated = "Ол {d2} күні {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} қорап {food} сатты.\n{name} сатқан {food} қораптарының жалпы саны {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} {food} сатқаны үшін {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} тапты.\nОл {d1} күні {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} қорап {fruit} пирогын сатты.\n{name} сатқан {fruit} пирогының қораптарының жалпы саны {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nОл {fruit} пирогын сатқаны үшін {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} тапты.\nСонымен, {name} екі күнде {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} тапты.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
