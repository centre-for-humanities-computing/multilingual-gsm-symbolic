question = "Алан үйінде канноли санынан жүгері саны екі есе көп. Оның үйінде барлығы 40 канноли бар. Алан дүкеннен 60 қосымша канноли сатып алды және канноли санынан 40 аз жүгері сатып алды. Үйіндегі жүгері мен канноли санының жалпы қосындысын табыңыз?"
answer = "Жүгері мен канноли сатып алмас бұрын, Алан канноли санынан жүгері саны екі есе көп болды, яғни 40 канноли * 5 жүгері/канноли = <<40*5=200>>200 жүгері\nАлан алдындағы жүгері мен канноли санының жалпы саны 200 жүгері + 40 канноли = <<200+40=240>>240 зат\nОл канноли санынан 40 аз жүгері сатып алғанда, ол 60 жүгері - 40 жүгері сатып алды = <<60-40=20>>20 жүгері\nБарлығы ол 20 жүгері + 60 канноли сатып алды = <<20+60=80>>80 зат\nСатып алудан кейін Алан 240 зат + 80 затқа ие болады = <<240+80=320>>320 жалпы жүгері мен канноли саны.\n#### 320\n"
