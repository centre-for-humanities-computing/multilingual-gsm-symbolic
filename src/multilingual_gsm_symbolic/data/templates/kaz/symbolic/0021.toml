question_annotated = "{name,Фрэнки} күн сайын үй тапсырмасын орындаған соң теледидар көреді. {d1,дүйсенбі} және {d2,сейсенбі} күндері ол әр түнде сүйікті бағдарламасының {h1,1}-сағаттық бір эпизодын көрді. {d3,сәрсенбі} күні ол {m1,30}-минуттық бағдарламаның бірнеше эпизодын көрді. {d4,бейсенбі} күні ол үй тапсырмасын ерте бітіріп, {h2,1}-сағаттық бір эпизод пен {m2,30}-минуттық бағдарламаны көрді. {d5,жұма} күні ол кешке дейін ояу болуға рұқсат алды, сондықтан ол {n2_txt,екі} дана {h3,1}-сағаттық эпизод көрді. Егер ол барлығы {total,7} сағат теледидар көрсе, {d3,сәрсенбі} күні ол қанша {m1,30}-минуттық эпизод көрді?\n\n#init:\n- name = sample(names_male)\n- d1, d2, d3, d4, d5 = sample_sequential(weekdays, 5)\n- $total = range(7, 33)\n- $h1 = range(1, 7)\n- $h3 = range(1, 6)\n- $m1 = range(5, 61, 5)\n- $m2 = range(5, 61, 5)\n- $h2 = range(1, 7)\n- n2_txt, n2_val = range_str(2, 5, 1, numbers)\n\n#conditions: \n- divides(m1, 15)\n- divides(m2, 15)\n- divides(total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60, m1)\n- (total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1 > 0\n- (total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1 < 8 \n\n#answer: int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)\n"
answer_annotated = "{d3} күні ол көрген эпизодтар санын E деп алайық.\n{d1} күнінен кейін оның қалған теледидар көру уақыты {total} - {h1} = <<{total}-{h1}={total-h1}>>{total-h1} сағат болды.\n{d2} күнінен кейін оның қалған теледидар көру уақыты {total-h1} - {h1} = <<{total-h1}-{h1}={total-2*h1}>>{total-2*h1} сағат болды.\n{d4} күнінен кейін оның қалған теледидар көру уақыты {total-2*h1} - {h2} - {m2/60} = {total-2*h1-h2- m2/60} сағат болды.\n{d5} күнінен кейін оның қалған теледидар көру уақыты {total-2*h1-h2-m2/60} - {n2_val*h3} = {total-2*h1-h2-m2/60-n2_val*h3} сағат болды.\nӘрбір {m1}-минуттық эпизод {Fraction(m1/60)} сағатқа тең.\nСондықтан, E = {total-2*h1-h2-m2/60-n2_val*h3}/{m1/60} = {int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)} эпизод.\n#### {int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)}\n"
