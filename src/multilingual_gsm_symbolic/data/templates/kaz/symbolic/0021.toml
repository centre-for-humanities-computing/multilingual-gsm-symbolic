question = "Фрэнки күн сайын үй тапсырмасын орындаған соң теледидар көреді. дүйсенбі және сейсенбі күндері ол әр түнде сүйікті бағдарламасының 1-сағаттық бір эпизодын көрді. сәрсенбі күні ол 30-минуттық бағдарламаның бірнеше эпизодын көрді. бейсенбі күні ол үй тапсырмасын ерте бітіріп, 1-сағаттық бір эпизод пен 30-минуттық бағдарламаны көрді. жұма күні ол кешке дейін ояу болуға рұқсат алды, сондықтан ол екі дана 1-сағаттық эпизод көрді. Егер ол барлығы 7 сағат теледидар көрсе, сәрсенбі күні ол қанша 30-минуттық эпизод көрді?"
answer = "Сәрсенбі күні ол көрген эпизодтар санын E деп алайық.\nдүйсенбі күнінен кейін оның қалған теледидар көру уақыты 7 - 1 = <<7-1=6>>6 сағат болды.\nсейсенбі күнінен кейін оның қалған теледидар көру уақыты 6 - 1 = <<6-1=5>>5 сағат болды.\nбейсенбі күнінен кейін оның қалған теледидар көру уақыты 5 - 1 - 0.5 = 3.5 сағат болды.\nжұма күнінен кейін оның қалған теледидар көру уақыты 3.5 - 2 = 1.5 сағат болды.\nӘрбір 30-минуттық эпизод 1/2 сағатқа тең.\nСондықтан, E = 1.5/0.5 = 3 эпизод.\n#### 3\n"
