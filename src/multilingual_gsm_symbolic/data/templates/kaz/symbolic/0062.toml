question = "Сиқыршы карталарының жиынында 15 дана қызыл карта бар және 60% артық жасыл карта бар. сары карталар саны қызыл және жасыл карталардың қосындысына тең. Аталған түстердегі карталардың барлығы неше дана?"
answer = "Қызыл карталарынан жасыл карталары 60/100 * 15 = <<60/100*15=9>>9 дана артық.\nБұл дегеніміз жасыл карталарының саны 15 + 9 = <<15+9=24>>24 дана.\nсары карталарының саны 15 + 24 = <<15+24=39>>39 дана құрайды.\nСонымен барлығы, әртүрлі түсті карталардың жалпы саны 39 + 39 = <<39+39=78>>78 дана.\n#### 78"
