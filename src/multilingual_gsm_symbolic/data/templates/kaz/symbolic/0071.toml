question = "Nate малдарын шөп жемдеп жатыр. Әр ешкіге 5 фунт керек, ал әр ламаға әр ешкіге кететін мөлшердің екі есесінен 3 фунт кем керек. Егер 15 ешкілер және 12 ламалар болса, Nateге қанша фунт шөп керек?"
