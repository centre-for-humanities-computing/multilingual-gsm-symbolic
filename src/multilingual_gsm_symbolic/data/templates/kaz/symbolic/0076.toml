question = "Деандер өткен дүйсенбі 3 тунец ұстады, оның алғашқы тунецінің салмағы 56 килограмм, екінші тунецінің салмағы 46 килограмм, ал қалған тунецінің салмағы 26 килограмм. Егер 1 килограмм тунец ₸0.5 тұрса, нарыққа барлық тунецтерін сатқаннан кейін ол қанша табыс табады?"
