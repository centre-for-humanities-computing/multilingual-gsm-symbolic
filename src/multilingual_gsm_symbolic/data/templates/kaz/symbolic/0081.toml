question = "Жұмыртқа іздеу командасы 100 жұмыртқа жасырды. смит егіздері әрқайсысы 30 жұмыртқа тапты. Қалған жұмыртқалардың барлығы 10 данасын қоспағанда достары тапты. Достар қанша жұмыртқа тапты?"
