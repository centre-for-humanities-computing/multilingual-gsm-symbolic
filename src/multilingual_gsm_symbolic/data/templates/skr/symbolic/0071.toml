question = "نیت اپنے مویشیوں کو کھل کھلا رہا ہے۔ ہر بکری کو 5 پاؤنڈ درکار ہوتے ہیں، اور ہر لما کو ہر بکری کی ضرورت کی دگنی مقدار سے 3 پاؤنڈ کم درکار ہوتے ہیں۔ اگر 15 بکریاں اور 12 لمااں ہیں، تو نیت کو کتنے پاؤنڈ کھل درکار ہیں؟"
answer = "سب سے پہلے یہ معلوم کریں کہ ہر لما کو کتنا کھل درکار ہے: 5 پاؤنڈ * 2 - 3 = <<5*2-3=7>>7 پاؤنڈ/لما\nاب یہ معلوم کریں کہ لمااں کو کل کتنا کھل درکار ہے: 7 پاؤنڈ/لما * 12 لمااں = <<7*12=84>>84 پاؤنڈ\nاب یہ معلوم کریں کہ بکریاں کو کل کتنا کھل درکار ہے: 5 پاؤنڈ/بکری * 15 بکریاں = <<5*15=75>>75 پاؤنڈ\nاب کل معلوم کرنے کے لیے دونوں مقداروں کھل کو جمع کریں: 84 پاؤنڈ + 75 پاؤنڈ = <<84+75=159>>159 پاؤنڈ\n#### 159\n"
