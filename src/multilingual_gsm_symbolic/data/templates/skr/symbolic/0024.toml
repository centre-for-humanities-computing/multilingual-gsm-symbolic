answer_annotated = "جے کل کیلوری ٹارگٹ {total} اے تے میں {spent} کیلوریاں کھا چکا ہاں تے میرے پاس کھانے لئی {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} کیلوریاں بچدیاں نیں\nجے {food} دی ہر سرونگ وچ {cal} کیلوریاں نیں تے میرے پاس کھانے لئی صرف {total-spent} کیلوریاں بچیاں نیں، تے میں صرف {total-spent}/{cal} سرونگ کھا سکدا ہاں = {Fraction((total-spent)/cal)} سرونگ\nہمیں ایہہ وی پتہ اے کہ {food} دا {size} {unit} دا تھیلا {n} سرونگاں دا اے، تیں ہر سرونگ وچ {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit} ہوندے نیں\nجے میں صرف {Fraction((total-spent)/cal)} سرونگ کھا سکدا ہاں، تے میں صرف {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit} کھا سکدا ہاں\n#### {size//n * (total-spent)/cal}\n"
