question = "غذائی معلومات مطابق، چپس دے تھیلی وچ 250 کیلوریاں فی سرونگ ہوندیاں نیں۔ جے 300 گرام دا تھیلا 5 سرونگاں دا اے، تسیں گرام وچوں کتنے کھا سکدے او جے تہاڈا روزانہ کیلوری ٹارگٹ 2000 اے تے تسیں پہلے ہی 1800 کیلوریاں کھا چکے او؟"
answer = "جے کل کیلوری ٹارگٹ 2000 اے تے میں 1800 کیلوریاں کھا چکا ہاں تے میرے پاس کھانے لئی 2000-1800 = <<2000-1800=200>>200 کیلوریاں بچدیاں نیں\nجے چپس دی ہر سرونگ وچ 250 کیلوریاں نیں تے میرے پاس کھانے لئی صرف 200 کیلوریاں بچیاں نیں، تے میں صرف 200/250 سرونگ کھا سکدا ہاں = 4/5 سرونگ\nہمیں ایہہ وی پتہ اے کہ چپس دا 300 گرام دا تھیلا 5 سرونگاں دا اے، تیں ہر سرونگ وچ 300 گرام/5 = <<300/5=60>>60 گرام ہوندے نیں\nجے میں صرف 4/5 سرونگ کھا سکدا ہاں، تے میں صرف 60 گرام * 4/5 = 48 گرام کھا سکدا ہاں\n#### 48\n"
