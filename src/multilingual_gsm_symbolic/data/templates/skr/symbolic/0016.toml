question = "سنی جنگربریڈ اور سیب پائی ایک فنڈ ریزر کے لیے بیچ رہا ہے۔ ہفتہ کو، اس نے 10 باکس جنگربریڈ اور اتوار سے 4 کم باکس سیب پائی بیچے۔ اتوار کو، اس نے ہفتہ سے 5 زیادہ باکس جنگربریڈ اور 15 باکس سیب پائی بیچے۔ اگر جنگربریڈ کی قیمت $6 ہے اور سیب پائی کی قیمت $15 ہے، تو سنی نے دو دن کے لیے کتنی کمائی کی؟"
answer = "اس نے اتوار پر جنگربریڈ کے 10 + 5 = <<10+5=15>>15 باکس بیچے۔\nسنی کے بیچے ہوئے جنگربریڈ کے باکسوں کی کل تعداد 10 + 15 = <<10+15=25>>25 ہے۔\nجنگربریڈ بیچنے پر سنی نے 25*$6 = $<<25*6=150>>150 کمائے۔\nاس نے ہفتہ پر سیب پائی کے 15 - 4 = <<15-4=11>>11 باکس بیچے۔\nسنی کے بیچے ہوئے سیب پائی کے باکسوں کی کل تعداد 15 + 11 = <<15+11=26>>26 ہے۔\nسیب پائی بیچنے پر اس نے 26*$15 = $<<26*15=390>>390 کمائے۔\nتو، سنی نے دو دن کے لیے $150 + $390 = $<<150+390=540>>540 کمائے۔\n#### 540\n"
