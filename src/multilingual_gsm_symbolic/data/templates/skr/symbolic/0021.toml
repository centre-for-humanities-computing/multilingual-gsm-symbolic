question = "فرانکی ہر رات اپنا ہوم ورک مکمل کرن دے بعد ٹی وی ݙیکھدا ہے۔ سوموار تے منگل کوں، ہر رات اس نے اپنی پسندیدہ شو دی 1 گھنٹے دی ہک قسط ݙیکھی۔ بدھ کوں، اس نے 30 منٹ دے شو دی کجھ قسطیں ݙیکھیاں۔ جمعرات کوں، اس نے ہوم ورک جلدی مکمل کیتا تے 1 گھنٹے دی ہک قسط تے 30 منٹ دا شو ݙیکھیا۔ جمعہ کوں، اوہ دیر تک جاگ سگدا ہا، اس لئی اس نے دو 1 گھنٹے دی قسطیں ݙیکھیاں۔ جیکر اس نے کل 7 گھنٹے ٹی وی ݙیکھے، تاں اوہ بدھ کوں 30 منٹ دی کتنی قسطیں ݙیکھیاں؟"
