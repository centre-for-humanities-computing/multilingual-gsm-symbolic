question = "Allan de ghar te, kannolis nu mukable te makkis do guna hain. Usde ghar vich kul 40 kannolis han. Allan ne dukaan te 60 hor kannolis kharidye te kannolis di tadad nu mukable te 40 ghat makkis. Dikha'o ke Allan de ghar vich makkis te kannolis da kul milao kitna hai?"
answer = "Makki te kannoli kharidne ton pehlan, Allan de kol kannolis nu mukable te makkis do guna hain, jo ke 40 kannolis * 5 makki/kannoli = <<40*5=200>>200 makkis hain\nJo ke pehlan Allan de kol makkis te kannolis di kul tadad 200 makkis + 40 kannolis = <<200+40=240>>240 cheezan hai\nJadon usne kannolis nu mukable te 40 ghat makkis kharidye, usne 60 makkis - 40 makkis = <<60-40=20>>20 makkis kharidye\nKul milake, usne 20 makkis + 60 kannolis = <<20+60=80>>80 cheezan kharidye\nKharidari ton baad, Allan de kol 240 cheezan + 80 cheezan = <<240+80=320>>320 kul makkis te kannolis milke han.\n#### 320\n"
