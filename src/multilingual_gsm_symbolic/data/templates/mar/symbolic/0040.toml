question = "रिया सुट्टीसाठी समुद्रकिनारी गेली. तिच्या आई-वडिलांनी तिला हवे ते खरेदी करण्यासाठी ₹१५ दिले. स्मृतिचिन्हांच्या दुकानात टॉफीवर अशी सवलत होती: \"प्रत्येक १००० ग्रॅम ₹२ ला घेतल्यावर, पुढचे ५०० ग्रॅम १/२ किमतीत घ्या.\" उरलेली टॉफी नेहमीच्या किमतीत (₹२ ला १००० ग्रॅम) मिळते. तिने २००० ग्रॅम घेतले. तिने ₹१.५ ला शंख-शिंपल्यांची एक मिश्र पिशवीही घेतली आणि प्रत्येकी ₹०.२५ किमतीचे ४ मॅग्नेट घेतले. रियाकडे किती पैसे उरले?"

answer = """
टॉफीची किंमत १००० ग्रॅमसाठी ₹२ आहे, आणि प्रत्येक १००० ग्रॅमनंतर तिला पुढचे ५०० ग्रॅम १/२ किमतीत मिळतात. २००० ग्रॅममध्ये ही सवलत एकदाच लागू होते, त्यामुळे ५०० ग्रॅमच्या किमतीचे १/२ म्हणजे ५००/१०००*१/२*₹२ = ₹०.५.
एकूण, त्याची किंमत ₹०.५ + ₹२ = ₹२.५ होते.
उरलेल्या ५०० ग्रॅममधून पुढचे १००० ग्रॅम पूर्ण होत नाहीत, त्यामुळे त्यांवर सवलत नाही आणि त्याची किंमत ₹१ आहे, त्यामुळे एकूण किंमत ₹२ + ₹०.५ + ₹१ = ₹<<२ + ०.५ + १ = ३.५>>३.५
प्रत्येकी ₹०.२५ किमतीचे ४ मॅग्नेट म्हणजे ४*०.२५=₹<<४*०.२५=१>>१
तिच्या सर्व खरेदीची बेरीज केल्यावर, ₹३.५ + ₹१.५ + ₹१ = ₹<<३.५+१.५+१=६>>६
तिच्याकडे ₹१५ होते आणि तिने ₹६ खर्च केले, त्यामुळे तिच्याकडे ₹१५ - ₹६ = ₹<<१५-६=९>>९ उरले
#### ९
"""

