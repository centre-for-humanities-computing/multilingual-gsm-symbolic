टॉफीची किंमत {n1} ग्रॅमसाठी ₹{p1} आहे, आणि प्रत्येक {n1} ग्रॅमनंतर तिला पुढचे {n2} ग्रॅम {discount} किमतीत मिळतात. {n12} ग्रॅममध्ये ही सवलत एकदाच लागू होते, त्यामुळे {n2} ग्रॅमच्या किमतीचे {discount} म्हणजे {n2}/{n1}*{discount}*₹{p1} = ₹{(n2/n1)*discount*p1}.
एकूण, त्याची किंमत ₹{(n2/n1)*discount*p1} + ₹{p1} = ₹{(n2/n1)*discount*p1 + p1} होते.
उरलेल्या {n12 - n1 - n2} ग्रॅममधून पुढचे {n1} ग्रॅम पूर्ण होत नाहीत, त्यामुळे त्यांवर सवलत नाही आणि त्याची किंमत ₹{(n12 - n1 - n2)/n1*p1} आहे, त्यामुळे एकूण किंमत ₹{p1} + ₹{n2/n1*discount*p1} + ₹{(n12 - n1 - n2)/n1*p1} = ₹<<{p1} + {n2/n1*discount*p1} + {(n12 - n1 - n2)/n1*p1} = {p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}>>{p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}
प्रत्येकी ₹{p3} किमतीचे {n3} मॅग्नेट म्हणजे {n3}*{p3}=₹<<{n3}*{p3}={n3*p3}>>{n3*p3}
तिच्या सर्व खरेदीची बेरीज केल्यावर, ₹{p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1} + ₹{p2} + ₹{n3*p3} = ₹<<{p1+(n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}+{p2}+{n3*p3}={ensure_int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}>>{ensure_int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}
तिच्याकडे ₹{total} होते आणि तिने ₹{ensure_int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)} खर्च केले, त्यामुळे तिच्याकडे ₹{total} - ₹{ensure_int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} = ₹<<{total}-{ensure_int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}={total-ensure_int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}>>{total-ensure_int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} उरले
