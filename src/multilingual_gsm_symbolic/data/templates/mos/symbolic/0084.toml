question = "Maria yɩɩ 8 tɩɩ dɔgɩ kɔ $8 bɛɛ. Dɔgɩ tɩɩ yɩɩ 50% yɩɩɩ bɛɛ Maria tɩɩ, yɩɩ sɩɩ 25% yɩɩɩ pɛɛ. Bɛɛ tɩɩ bɛɛ Maria tɩɩ?"
