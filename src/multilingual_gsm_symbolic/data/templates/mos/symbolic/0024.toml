question = "Tɛɛ wɛɛ lɛɛ, baga pɛɛ yɛ 250 kalori tɔɔ tɛɛ. Sɔɔgɔ baga 300 gram yɛ 5 tɔɔ, bɛɛ gram yɛ sɔɔgɔ lɛɛ kalori wɛɛ yɛ 2000 lɛɛ yɛ 1800 kalori yɛ?"
