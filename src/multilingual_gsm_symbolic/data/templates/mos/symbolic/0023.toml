question = "Martha kɛrɛ bɛɛ tɛɛ pɛɛrɛ nɩ 3 yɛɛ. Ba wɛɛrɛ, waa ba bɛɛ bɛɛ bɛɛ. Ba wɛɛ kɛrɛ tɛɛ, sɛɛ, kɛɛ, yɛɛ tɛɛ, and bɛɛ tɛɛ nɩ ba bɛɛ. Bɛɛ 2 bɛɛ kɛrɛ tɛɛ, 4 nɩ sɛɛ, 12 nɩ kɛɛ, 1 nɩ bɛɛ yɛɛ tɛɛ, and 2 nɩ bɛɛ bɛɛ tɛɛ. Ka bɛɛ bɛɛ ba kɛrɛ?"
answer = "Bɛɛ tɛɛ bɛɛ nɩ yɛɛ bɛɛ kɛrɛ 2 bɛɛ nɩ tɛɛ + 4 bɛɛ nɩ sɛɛ + 12 bɛɛ nɩ kɛɛ + 1 bɛɛ nɩ bɛɛ yɛɛ tɛɛ + 2 bɛɛ nɩ bɛɛ bɛɛ tɛɛ = <<2+4+12+1+2=21>>21 bɛɛ bɛɛ.\nNɩ nɩ yɛɛ bɛɛ kɛrɛ nɩ 3*21 = <<3*21=63>>63 bɛɛ bɛɛ.\n#### 63\n"
