question = "Toula yaa fɛɛrɛ n bɔɔg kɩɩm bɛɛrɛ n bɛɛg. Yɛ bɔɔg 3 wɩɩdɩɩg dɔnɔɔt bɛ $68 n wɩɩdɩɩg, 2 wɩɩdɩɩg mini sɩɩkɛ bɛ $80 n wɩɩdɩɩg, n 6 wɩɩdɩɩg mini sɩɩkɛ sɛɛz bɛ $55 n wɩɩdɩɩg. Kɛɛg bɛ kɩɩm kɛɛg?"
answer = "Kɩɩm kɛɛg n dɔnɔɔt bɛ 3*$68 = $<<3*68=204>>204.\nKɩɩm kɛɛg n mini sɩɩkɛ bɛ 2*$80 = $<<2*80=160>>160.\nKɩɩm kɛɛg n mini sɩɩkɛ sɛɛz bɛ 6*$55 = $<<6*55=330>>330.\nLɛɛrɛ, kɩɩm kɛɛg Toula bɔɔg n bɛɛg bɛ $204 + $160 + $330 = $<<204+160+330=694>>694.\n#### 694\n"
