question_annotated = "{name,Toula} yaa {shop,fɛɛrɛ} n bɔɔg kɩɩm bɛɛrɛ n {item,bɛɛg}. Yɛ bɔɔg {n1,3} wɩɩdɩɩg {item1,dɔnɔɔt} bɛ ${p1,68} n wɩɩdɩɩg, {n2,2} wɩɩdɩɩg {item2,mini sɩɩkɛ} bɛ ${p2,80} n wɩɩdɩɩg, n {n3,6} wɩɩdɩɩg {item3,mini sɩɩkɛ sɛɛz} bɛ ${p3,55} n wɩɩdɩɩg. Kɛɛg bɛ kɩɩm kɛɛg?\n\n#init:\n- name = sample(names_female)\n- shop = sample([\"fɛɛrɛ\", \"patisserie\", \"bɛɛg fɛɛrɛ\", \"cafe\"])\n- item = sample([\"bɛɛg\", \"bɛɛg wɩɩdɩɩg\", \"sɩɩkɛ\", \"treats\"])\n- item1 = sample([\"dɔnɔɔt\", \"croissants\", \"eclairs\", \"danishes\"])\n- item2 = sample([\"mini sɩɩkɛ\", \"macarons\", \"cookies\", \"tarts\"])\n- item3 = sample([\"mini sɩɩkɛ sɛɛz\", \"brownies\", \"muffins\", \"scones\"])\n- $n1 = range(1, 10)\n- $n2 = range(4, 10)\n- $n3 = range(2, 10)\n- $p1 = range(11, 21)\n- $p2 = range(73, 90)\n- $p3 = range(112, 120)\n\n#answer: n1 * p1 + n2 * p2 + n3 * p3\n"
