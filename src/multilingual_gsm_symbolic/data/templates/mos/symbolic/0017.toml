question = "Yiim pà 3 kilomèètr sɛ̀mɛ̀ sɛ̀mɛ̀ lù pàdɔ̀gɔ̀ wɛ̀lɛ̀, tɛ̀ pɛ̀ 2 kilomèètr pà sɛ̀mɛ̀ wà 1 kilomèètr pà pàdɔ̀gɔ̀. Là pàdɔ̀gɔ̀, yiim pà lɛ̀ yà pàdɔ̀gɔ̀ yɛ̀ sɛ̀mɛ̀. Mɛ̀ 40 minit pàdɔ̀gɔ̀ yɛ̀ sɛ̀mɛ̀, bɛ̀rɛ̀ bɛ̀rɛ̀ yɛ̀ kɛ̀ bɛ̀rɛ̀ 3-kilomèètr pàdɔ̀gɔ̀, lɛ̀ minit?"
