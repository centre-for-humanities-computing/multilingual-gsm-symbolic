question = "Sunny y na gɛl gingerbread wã pomme tarte wã sɔrɛl. Lã Samedi, y sɔr 10 boîtes wã gingerbread wã 4 boîtes mɔɔg wã pomme tarte, mɔɔg lã Dimanche. Lã Dimanche, y sɔr 5 boîtes pɩɩ wã gingerbread pɩɩ lã Samedi wã 15 boîtes wã pomme tarte. Yɛ gingerbread yɛl $6 wã pomme tarte yɛl $15, kaŋa Sunny sɔr wã bɛɛ dɛm?"
