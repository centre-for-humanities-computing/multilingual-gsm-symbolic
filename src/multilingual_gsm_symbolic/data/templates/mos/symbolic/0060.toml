question = "Watson wàal 10-heure tã tã kã, pɔɔ tã sãmaã. Yà yã $10 heure kã tã yã $300 bɔnɔs sãmaã kã mɛ compagnie tʋʋm tɩɩ. Pɔgɔ tɩ Watson yã nɩ Avril mɛ compagnie tʋʋm tɩɩ tɩ nɩ mɔs tɩ?"
