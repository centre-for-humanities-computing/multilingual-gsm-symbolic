question = "Mary sɔɔgɛɛrɛ yɩɩɩ wɩɩ. Kɩŋgɩ, yɛɛ 18 sɔɔgɛɛ wɩɩlɩ bɔɔ tɩŋ sɔɔgɛɛ yɩɩɩ. Yɛɛ 2 sɔɔgɛɛ wɩɩlɩ nɩ kɩŋ 40 bɔɔrɩ kɩŋ nɩ yɛɛ wɩɩlɩ bɔɔ. Yɩɩɩ tɩŋ, yɛɛ wɩɩɩ yɛɛ pɔɔ 1 sɔɔgɛɛ wɩɩlɩ tɩŋ kɩŋ nɩ wɩɩlɩ nɩ yɩɩɩ sɔɔgɛɛ. Pɛɛ sɔɔgɛɛ wɩɩlɩ Mary bɔɔ?"
