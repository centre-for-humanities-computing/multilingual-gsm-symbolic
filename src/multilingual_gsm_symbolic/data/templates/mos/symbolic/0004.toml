question = "Garrett wɔɔlɩɛ bɔɔrɩ nɩɛ kɔɔrɩ. Bɛɛ sɔɔlɩ bɔɔrɩ bɛ wɔɔlɩɛ, bɔɔrɩ bɛ wɔɔlɩɛ wɔɔlɩɛ. 20 wɔɔlɩɛ bɛɛ 30 sekɛndi kɔɔrɩ, tɔɔ tɔɔ kɛɛ bɛɛ 30 sekɛndi. Bɔɔrɩ bɛ yɛɛ naani kɛɛ wɔɔlɩɛ bɛɛ bɛɛ 30 sekɛndi, ɛɛ bɛɛ 30 sekɛndi yɛlɛ, wɔɔlɩɛ bɛ yɛɛ yɛlɛ wɔɔlɩɛ bɛɛ 30 sekɛndi. Bɛɛ Garrett yɛɛ sɔɔlɩ bɛɛ wɔɔlɩɛ, naani wɔɔlɩɛ bɔɔrɩ bɛ wɔɔlɩɛ bɛɛ 30 sekɛndi kɔɔrɩ yɛlɛ bɛ wɔɔlɩɛ wɔɔlɩɛ. Waa bɔɔrɩ Garrett bɛɛ bɛɛ?"
answer = "Bɛɛ 30 sekɛndi kɔɔrɩ, 5*20=<<5*20=100>>100 bɔɔrɩ wɔɔlɩɛ.\nBɛɛ 30 sekɛndi, 6*20=<<6*20=120>>120 bɔɔrɩ wɔɔlɩɛ.\nYɛlɛ 30 sekɛndi, 120 / 2 = <<120/2=60>>60 bɔɔrɩ wɔɔlɩɛ.\nBɛɛ kɔɔrɩ, wɔɔlɩɛ bɛɛ bɛɛ 60 / 4 = <<60/4=15>>15 bɔɔrɩ wɔɔlɩɛ.\nMɔɔ, Garrett bɛɛ 20 + 100 + 120 + 60 + 15 = <<20+100+120+60+15=315>>315 bɔɔrɩ bɛɛ.\n#### 315\n"
