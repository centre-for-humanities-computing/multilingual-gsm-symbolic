question = "ゆうなは休暇に海辺へ行きました。両親は、好きなものを買えるように￥3000をくれました。お土産屋では、飴が1キロあたり￥300で売られています。1キロ買えば、次の1キロが1/2の値段になるので、合計4キロの飴を買いました。さらに、貝殻の詰め合わせ1袋を￥150で、あと￥50ずつの磁石を4個買いました。ゆうなの手元にはいくら残っていますか？"
answer = """飴は1キロあたりで￥300で、さらに1キロをその1/2の値段で買えます。したがって、1キロ分の値段の1/2は 1/2*￥300 = ￥150 です。
合わせると、￥150 + ￥300 = ￥450 です。
残りの2キロには割引がなく、￥600かかるので、合計金額は ￥300 + ￥150 + ￥600 = ￥<<300 + 150 + 600 = 1050>>1050
1個￥50の磁石4個は 4*￥50=￥<<4*50=200>>200
買ったもの全部を足すと、￥1050 + ￥150 + ￥200 = ￥<<1050+150+200=1400>>1400
￥3000持っていて￥1400使ったので、残りは ￥3000 - ￥1400 = ￥<<3000-1400=1600>>1600 です
#### 1600
"""
