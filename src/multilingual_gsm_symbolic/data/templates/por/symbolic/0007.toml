question = "Um agricultor compra ração para os seus cavalos. Ele compra vários tipos de feno, aveia, cenouras e cubos de açúcar. Como cubos de açúcar são um petisco raro, ele compra apenas duas caixas de 1-quilo para todo o estábulo. Ele quer apenas cenouras suficientes para alimentar os cavalos enquanto os legumes estão frescos, por isso compra quatro sacos de 12-quilo. O feno é a dieta principal dos cavalos, por isso compra quarenta e dois fardos de 75-quilo. A aveia é um alimento básico para complementar o feno, por isso compra vinte sacos de 65-quilo. Se a sua carrinha da quinta pode transportar 2250 quilos de cada vez, quantas viagens o agricultor precisará para transportar toda a ração?"
