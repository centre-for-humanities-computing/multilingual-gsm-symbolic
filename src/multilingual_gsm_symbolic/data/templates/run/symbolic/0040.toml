question = "Sally yagiye ku nkombe y'inyanja kugira ngo yiruhuke. Ababyeyi be bamuhaye $15 kugira ngo yagure ibyo yifuza. Mu butike y'ibikoresho byo kwibuka, taffy yari ifite igabanuka: \"Gura 1 paundi ku $3 buri paundi, ubone 1 paundi 1/2 y'igabanuku.\" Yafashe 4 paundi. Nanone yaguriye ikaramu y'ibuye by'inyanja ya $1.5 ndetse na 4 imyenge yari $0.25 buri imwe. Amafaranga angana iki Sally yasigaje?"
answer = "Sally yagura 1 paundi ku $3 kandi abona 1 paundi 1/2 y'igabanuku. Bityo 1/2 y'igabanuku ku 1 paundi ni $3*1/2 = $1.5. Iyindi 2 paundi ntiyigabanyijwe kandi igura 2*$3 = $6, bityo igiteranyo ni $3+$3/2+$6=$21/2\n4 imyenge ku $0.25 buri imwe ni 4*0.25=$<<4*0.25=1>>1\nIyo wongereye ibyo yaguzi byose, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nYari ifite $15 kandi yakoreshije $13 bityo yasigaje $15-$13 = $<<15-13=2>>2 yasigaye\n#### 2\n"
