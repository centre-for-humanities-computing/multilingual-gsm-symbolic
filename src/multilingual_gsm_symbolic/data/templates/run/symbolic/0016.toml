answer_annotated = "Yagurishije {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} imipaka za {food} ku {d2}.\nUmubare wose w'imipaka za {food} {name} yagurishije ni {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} yabonye {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} kugurisha {food}.\nYagurishije {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} imipaka za paya ya {fruit} ku {d1}.\nUmubare wose w'imipaka za paya ya {fruit} {name} yagurishije ni {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nYabonye {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} kugurisha paya ya {fruit}.\nBityo, {name} yabonye {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} mu minsi ibiri.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
