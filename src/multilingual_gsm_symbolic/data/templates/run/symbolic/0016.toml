question = "Sunny ari kugurisha gingerbread na paya ya apple kugira ngo atange inkunga. Ku wa ku wa gatandatu, yagurishije imipaka 10 za gingerbread n'imipaka 4 mike za paya ya apple, kurusha ku ku wa karindwi. Ku wa ku wa karindwi, yagurishije imipaka 5 z'inyongera za gingerbread kurusha ku ku wa gatandatu n'imipaka 15 za paya ya apple. Niba gingerbread yari ifite agaciro ka $6 kandi paya ya apple yari ifite agaciro ka $15, ni amafaranga angahe Sunny yabonye mu minsi ibiri?"
answer = "Yagurishije 10 + 5 = <<10+5=15>>15 imipaka za gingerbread ku ku wa karindwi.\nUmubare wose w'imipaka za gingerbread Sunny yagurishije ni 10 + 15 = <<10+15=25>>25.\nSunny yabonye 25*$6 = $<<25*6=150>>150 kugurisha gingerbread.\nYagurishije 15 - 4 = <<15-4=11>>11 imipaka za paya ya apple ku ku wa gatandatu.\nUmubare wose w'imipaka za paya ya apple Sunny yagurishije ni 15 + 11 = <<15+11=26>>26.\nYabonye 26*$15 = $<<26*15=390>>390 kugurisha paya ya apple.\nBityo, Sunny yabonye $150 + $390 = $<<150+390=540>>540 mu minsi ibiri.\n#### 540\n"
