answer_annotated = "Niba {frac} y'ubushobozi bwose bwa {facility} {item} zuzuye, bivuze ko {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} zifite abarwayi bariho.\nUmubare wose w' {item} mu {facility} utarabaho abarwayi bashya ni {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}.\nNiba abantu {daily} binjira buri munsi, umubare wose w'abarwayi mu {facility} nyuma y'indwi imwe ni {daily} abarwayi/umunsi * 7 imisi/indwi = {daily*7} abarwayi.\nNyuma y' {period} indwi, umubare wose w'abarwayi binjiye mu {facility} ni {daily*7} abarwayi/indwi * {period} indwi = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} abarwayi, buri wese akoresheje {item} imwe.\nNiba habayeho {total-int(total*frac)} {item} zitaruzuye mu {facility} mbere y'abashya, umubare wose ugabanuka ukagera kuri {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item} zitaruzuye.\n#### {total - (total * frac + daily * period * 7)}\n"
