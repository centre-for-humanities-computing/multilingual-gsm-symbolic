question = "Ibitaro bifite ubushobozi bwa 1000 ibati aho 1/5 zuzuye. Bitewe na ikwirakwiza rya coronavirus, abarwayi 50 binjira mu ibitaro buri munsi. Bara umubare wose w' ibati zitaruzuye mu ibitaro nyuma y' 2 indwi."
answer = "Niba 1/5 y'ubushobozi bwose bwa ibitaro ibati zuzuye, bivuze ko 1/5 * 1000 = <<1000*1/5=200>>200 ibati zifite abarwayi bariho.\nUmubare wose w' ibati mu ibitaro utarabaho abarwayi bashya ni 1000 ibati - 200 ibati = <<1000-200=800>>800 ibati.\nNiba abantu 50 binjira buri munsi, umubare wose w'abarwayi mu ibitaro nyuma y'indwi imwe ni 50 abarwayi/umunsi * 7 imisi/indwi = 350 abarwayi.\nNyuma y' 2 indwi, umubare wose w'abarwayi binjiye mu ibitaro ni 350 abarwayi/indwi * 2 indwi = <<350*2=700>>700 abarwayi, buri wese akoresheje ibati imwe.\nNiba habayeho 800 ibati zitaruzuye mu ibitaro mbere y'abashya, umubare wose ugabanuka ukagera kuri 800 ibati - 700 ibati = <<800-700=100>>100 ibati zitaruzuye.\n#### 100\n"
