question = "Dana is féidir léi rith ceithre huaire níos tapúla ná mar is féidir léi siúl, ach is féidir léi léim a dhéanamh ar luas atá leath chomh tapa agus is féidir léi rith. Má is féidir léi léim a dhéanamh ar 3 míle in aghaidh na huaire, cé mhéad míle is féidir léi taisteal i sé uair an chloig má chaitheann sí trian den am ag rith agus dá thrian den am ag siúl?"
answer = "Má is féidir le Dana léim a dhéanamh ar leath an luas is féidir léi rith, ansin is féidir léi rith ar 3*2=<<3*2=6>>6 míle in aghaidh na huaire.\nAgus ós rud é gur féidir léi rith ar luas atá ceithre huaire níos tapúla ná mar is féidir léi siúl, ciallaíonn sé seo gur féidir léi siúl ar 6/4=1.5 míle in aghaidh na huaire.\nMá chaitheann dá thrian den am ag siúl, ansin siúlann sí ar feadh 10*3/5=<<10*3/5=6>>6 uair an chloig.\nMá chaitheann trian den am ag rith, ansin ritheann sí ar feadh 10-6=<<10-6=6>>6 uair an chloig.\nDá bhrí sin, ritheann sí ar feadh 6 uair an chloig ar 6 míle in aghaidh na huaire, nó 6*6=<<6*6=36>>36 míle.\nSiúlann sí ar feadh 6 uair an chloig ar 1.5 míle in aghaidh na huaire, nó 6*1.5=<<6*1.5=9>>9 míle.\nDá bhrí sin, go hiomlán, taistealaíonn sí 36+9=<<36+9=45>>45 míle.\n#### 45\n"
