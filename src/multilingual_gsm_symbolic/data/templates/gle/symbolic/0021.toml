question = "Frankie féachann ar an teilifís tar éis dó a obair bhaile a chríochnú gach oíche. Ar luan agus máirt, fhéach sé ar eipeasóid 1-uair den chláir is fearr leis gach oíche. Ar céadaoin, fhéach sé ar cúpla eipeasóid de chláir 30-nóiméad. Ar déardaoin, chríochnaigh sé a obair bhaile go luath agus fhéach sé ar eipeasóid 1-uair agus ar chláir 30-nóiméad. Ar aoine, bhí sé in ann fanacht siúil go déanach, mar sin fhéach sé ar dhá eipeasóid 1-uair. Má fhéach sé 7 uair den teilifís san iomlán, cé mhéad eipeasóid 30-nóiméad a d'fhéach sé ar céadaoin?"
