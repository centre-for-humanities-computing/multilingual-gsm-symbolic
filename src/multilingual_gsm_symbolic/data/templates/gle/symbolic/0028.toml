answer_annotated = "Má tá {frac} d'acmhainn iomlán {item} san {facility} glactha, ciallaíonn sé sin {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} atá ag othair á n-úsáid.\nIs é líon iomlán na {item} san {facility} gan glacadh isteach nua ná {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}.\nMá ghlactar {daily} duine isteach gach lá, is é líon iomlán na n-othar san {facility} tar éis seachtaine ná {daily} othar/lá * 7 lá/seachtain = {daily*7} othar.\nTar éis {period} seachtaine, is é líon iomlán na n-othar a glacadh isteach sa {facility} ná {daily*7} othar/seachtain * {period} seachtain = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} othar, a úsáideann gach ceann acu {item} amháin.\nMá bhí {total-int(total*frac)} {item} neamhghlactha sa {facility} sula ndearnadh na glacthaí nua, laghdaítear an líon iomlán go {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item} neamhghlactha.\n#### {total - (total * frac + daily * period * 7)}\n"
