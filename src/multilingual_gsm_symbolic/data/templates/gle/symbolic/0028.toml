question = "Tá ospidéal le hacmhainn de 1000 leaba agus 1/5 glactha. Mar gheall ar an pléascadh coronavirus, glactar 50 othar isteach sa ospidéal gach lá. Ríomh líon iomlán na leaba neamhghlactha sa ospidéal tar éis 2 seachtaine."
answer = "Má tá 1/5 d'acmhainn iomlán leaba san ospidéal glactha, ciallaíonn sé sin 1/5 * 1000 = <<1000*1/5=200>>200 leaba atá ag othair á n-úsáid.\nIs é líon iomlán na leaba san ospidéal gan glacadh isteach nua ná 1000 leaba - 200 leaba = <<1000-200=800>>800 leaba.\nMá ghlactar 50 duine isteach gach lá, is é líon iomlán na n-othar san ospidéal tar éis seachtaine ná 50 othar/lá * 7 lá/seachtain = 350 othar.\nTar éis 2 seachtaine, is é líon iomlán na n-othar a glacadh isteach sa ospidéal ná 350 othar/seachtain * 2 seachtain = <<350*2=700>>700 othar, a úsáideann gach ceann acu leaba amháin.\nMá bhí 800 leaba neamhghlactha sa ospidéal sula ndearnadh na glacthaí nua, laghdaítear an líon iomlán go 800 leaba - 700 leaba = <<800-700=100>>100 leaba neamhghlactha.\n#### 100\n"
