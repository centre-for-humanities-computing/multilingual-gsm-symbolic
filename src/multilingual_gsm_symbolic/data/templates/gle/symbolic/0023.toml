question = "Martha atá ag sníomh éadaí geimhridh do a 3 mórchloinn. Is tríúir iad, mar sin tá siad go léir den mhéid céanna. Ba mhaith léi hata, scárf, geansai, míotaga, agus stocáin a dhéanamh do gach ceann acu. Tógann sé 2 snáithe olann chun hata a dhéanamh, 4 do scárf, 12 do geansai, 1 do phéire míotaga, agus 2 do phéire stocáin. Cá mhéad snáithe olann a bheidh ag teastáil uirthi a cheannach?"
