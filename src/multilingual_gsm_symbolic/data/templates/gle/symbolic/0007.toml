question = "Tá feirmeoir ag ceannach bia do capaill. Ceannaíonn sé raon de fainne, coirce, cairéid agus ciúbanna siúcra. Ós rud é go bhfuil ciúbanna siúcra ina mblaiseadh mion, ceannaíonn sé dhá 1-punt boscaí díobh don stábla go léir. Níl ach mian leis go leor cairéid chun na capaill a bheathú fad is atá an glasraí úr, mar sin ceannaíonn sé ceathair 12-punt málaí. Is é fainne an bhia príomhúil do capaill, mar sin ceannaíonn sé daichead agus dhá 75-punt pacáistí. Is stáplach é coirce chun an fainne a thacú, mar sin ceannaíonn sé fiche 65-punt ciseáin. Má tá cumas ag a thrucail feirme 2250 punts a iompar ag an am, cé mhéad turas atá ag teastáil ón bhfeirmeoir chun an bia go léir a iompar?"
