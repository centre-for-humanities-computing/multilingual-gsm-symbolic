question = "Seán oibríonn scíth 10-uair an chloig gach lá, cúig lá sa tseachtain. Tuilleann sé €10 in uair an chloig agus faigheann sé bonas €300 gach seachtain má éiríonn leis an gcuideachta go maith. Cé mhéad airgid a thuill seán i aibreán má éiríonn leis an gcuideachta go han-mhaith ar feadh na míosa ar fad?"
