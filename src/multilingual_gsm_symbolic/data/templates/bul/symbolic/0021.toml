question = "Frankie гледа телевизия след като завърши домашната си работа всяка вечер. На понеделник и вторник, той гледа 1-часов епизод от любимото си шоу всяка вечер. На сряда, той гледа няколко епизода от 30-минутно шоу. На четвъртък, той завърши домашната си работа рано и гледа 1-часов епизод и 30-минутно шоу. На петък, той можеше да остане буден до късно, така че гледа две 1-часови епизода. Ако той е гледал общо 7 часа телевизия, колко 30-минутни епизода гледа на сряда?"
