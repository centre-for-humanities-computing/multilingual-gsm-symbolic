question = "Sally отиде на морския бряг за ваканция. Родителите ѝ дадоха $15, за да купи каквото иска. В магазина за сувенири тафи беше на промоция \"Купи 500 грама за $3, вземи 500 грама на 1/2 цена.\" Тя набра 2000 грама. Тя също купи смесена торбичка с морски черупки за $1.5 и 4 магнита, които бяха по $0.25 всеки. Колко пари има Sally останали?"
answer = "Тафито струва $3 за 500 грама и тя получава 500 грама на 1/2 цена. Така 1/2 от цената на 500 грама е 500/500*1/2*$3 = $1.5.\nЗаедно това струва $1.5 + $3 = $4.5.\nОстаналите 1000 грама нямат отстъпка и струват $6, така че общата цена е $3 + $1.5 + $6 = $<<3 + 1.5 + 6 = 10.5>>10.5\n4 магнита по $0.25 всеки е 4*$0.25=$<<4*0.25=1>>1\nКогато добавиш всички покупки, $10.5 + $1.5 + $1 = $<<10.5+1.5+1=13>>13\nТя имаше $15 и похарчи $13, така че има $15 - $13 = $<<15-13=2>>2 останали\n#### 2\n"
id_orig = 410
id_shuffled = 40
question_annotated = "{name,Sally} отиде на морския бряг за ваканция. Родителите ѝ дадоха ${total,15}, за да купи каквото иска. В магазина за сувенири тафи беше на промоция \"Купи {n1,500} грама за ${p1,3}, вземи {n2,500} грама на {discount,1/2} цена.\" Тя набра {n12,2000} грама. Тя също купи смесена торбичка с морски черупки за ${p2,1.5} и {n3,4} магнита, които бяха по ${p3,0.25} всеки. Колко пари има {name,Sally} останали?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(500, 3000, 500)\n- $n2 = range(500, 3000, 500)\n- $n12 = range(1000, 6000, 500)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1 + p2 + n3*p3)\n- p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1 + p2 + n3*p3 < total\n\n#answer: total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)\n"
answer_annotated = "Тафито струва ${p1} за {n1} грама и тя получава {n2} грама на {discount} цена. Така {discount} от цената на {n2} грама е {n2}/{n1}*{discount}*${p1} = ${(n2/n1)*discount*p1}.\nЗаедно това струва ${(n2/n1)*discount*p1} + ${p1} = ${(n2/n1)*discount*p1 + p1}.\nОстаналите {n12 - n1 - n2} грама нямат отстъпка и струват ${(n12 - n1 - n2)/n1*p1}, така че общата цена е ${p1} + ${n2/n1*discount*p1} + ${(n12 - n1 - n2)/n1*p1} = $<<{p1} + {n2/n1*discount*p1} + {(n12 - n1 - n2)/n1*p1} = {p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}>>{p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}\n{n3} магнита по ${p3} всеки е {n3}*${p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nКогато добавиш всички покупки, ${p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1} + ${p2} + ${n3*p3} = $<<{p1+(n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}+{p2}+{n3*p3}={int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}>>{int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}\nТя имаше ${total} и похарчи ${int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}, така че има ${total} - ${int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} = $<<{total}-{int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}={total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}>>{total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} останали\n#### {total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}\n"
