question = "{name,Sally} отиде на морския бряг за ваканция. Родителите ѝ дадоха ${total,15}, за да купи каквото иска. В магазина за сувенири тафи беше на промоция \"Купи {n1,500} грама за ${p1,3}, вземи {n2,500} грама на {discount,1/2} цена.\" Тя набра {n12,2000} грама. Тя също купи смесена торбичка с морски черупки за ${p2,1.5} и {n3,4} магнита, които бяха по ${p3,0.25} всеки. Колко пари има {name,Sally} останали?"
answer = "Тафито струва ${p1} за {n1} грама и тя получава {n2} грама на {discount} цена. Така {discount} от цената на {n2} грама е {n2}/{n1}*{discount}*${p1} = ${(n2/n1)*discount*p1}.\nЗаедно това струва ${(n2/n1)*discount*p1} + ${p1} = ${(n2/n1)*discount*p1 + p1}.\nОстаналите {n12 - n1 - n2} грама нямат отстъпка и струват ${(n12 - n1 - n2)/n1*p1}, така че общата цена е ${p1} + ${n2/n1*discount*p1} + ${(n12 - n1 - n2)/n1*p1} = $<<{p1} + {n2/n1*discount*p1} + {(n12 - n1 - n2)/n1*p1} = {p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}>>{p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}\n{n3} магнита по ${p3} всеки е {n3}*${p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nКогато добавиш всички покупки, ${p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1} + ${p2} + ${n3*p3} = $<<{p1+(n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}+{p2}+{n3*p3}={int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}>>{int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}\nТя имаше ${total} и похарчи ${int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}, така че има ${total} - ${int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} = $<<{total}-{int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}={total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}>>{total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} останали\n#### {total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}\n"
