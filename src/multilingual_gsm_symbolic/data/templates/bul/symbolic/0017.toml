question = "Баба изминава 3 километра всеки ден по любимата си пешеходна пътека, която включва 2 километра ходене по плажа и 1 километър ходене по тротоара. По тротоара баба се движи с два пъти по-голяма скорост отколкото по плажа. Ако 40 минути от нейната разходка са прекарани на плажа, колко време ѝ отнема да извърви цялата 3-километрова разходка, в минути?"
