question = "Martha keur ngajait pakéan usum tiis pikeun 3 cucu. Aranjeunna kembar tilu, jadi aranjeunna sarua ukuran. Anjeunna hayang nyieun topi, syal, sweter, sarung tangan, jeung kaos kaki pikeun unggalana. Perlu 2 gulungan wol pikeun nyieun topi, 4 pikeun syal, 12 pikeun sweter, 1 pikeun sakeda sarung tangan, jeung 2 pikeun sakeda kaos kaki. Sabaraha gulungan wol anu anjeunna kedah tumbal?"
