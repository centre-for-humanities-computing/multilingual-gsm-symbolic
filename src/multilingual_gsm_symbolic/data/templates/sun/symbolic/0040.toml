question_annotated = "{name,Sally} indit ka basisir pikeun liburan. Kolotna masihan anjeunna ${total,15} pikeun meuli naon waé anu dipikahoyongna. Di toko suvenir, taffy didagangkeun kalayan harga \"Meuli {n1,1} pon di ${p1,3} per pon, meunang {n2,1} pon {discount,1/2} diskon.\" Anjeunna nyokot {n12,4} pon. Anjeunna ogé meuli kantong campuran cangkang laut pikeun ${p2,1.5} sarta {n3,4} magnet anu ${p3,0.25} unggalna. Kumaha loba artos anu sésana pikeun {name,Sally}?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} meuli {n1} pon pikeun ${p1} sarta meunang {n2} pon {discount} diskon. Jadi {discount} diskon tina {n2} pon nyaéta ${p1}*{discount} = ${float(n2*discount*p1)}. Sésana {n12-n1-n2} pon henteu gaduh diskon sarta hargana {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}, jadi totalna ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} magnet di ${p3} unggalna nyaéta {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nNalika ngagabungkeun sadaya beulianna, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nAnjeunna gaduh ${total} sareng ngahabiskeun ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} sahingga anjeunna gaduh ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} sésana\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
