question = "Sally indit ka basisir pikeun liburan. Kolotna masihan anjeunna $15 pikeun meuli naon waé anu dipikahoyongna. Di toko suvenir, taffy didagangkeun kalayan harga \"Meuli 1 pon di $3 per pon, meunang 1 pon 1/2 diskon.\" Anjeunna nyokot 4 pon. Anjeunna ogé meuli kantong campuran cangkang laut pikeun $1.5 sarta 4 magnet anu $0.25 unggalna. Kumaha loba artos anu sésana pikeun Sally?"
answer = "Sally meuli 1 pon pikeun $3 sarta meunang 1 pon 1/2 diskon. Jadi 1/2 diskon tina 1 pon nyaéta $3*1/2 = $1.5. Sésana 2 pon henteu gaduh diskon sarta hargana 2*$3 = $6, jadi totalna $3+$3/2+$6=$21/2\n4 magnet di $0.25 unggalna nyaéta 4*0.25=$<<4*0.25=1>>1\nNalika ngagabungkeun sadaya beulianna, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nAnjeunna gaduh $15 sareng ngahabiskeun $13 sahingga anjeunna gaduh $15-$13 = $<<15-13=2>>2 sésana\n#### 2\n"
