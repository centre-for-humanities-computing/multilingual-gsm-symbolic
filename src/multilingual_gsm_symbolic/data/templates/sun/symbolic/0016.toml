answer_annotated = "Manéhna ngajual {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} kotak {food} dina {d2}.\nTotal jumlah kotak {food} anu {name} ngajual nyaéta {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} meunangkeun {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} pikeun ngajual {food}.\nManéhna ngajual {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} kotak {fruit} pai dina {d1}.\nTotal jumlah kotak {fruit} pai anu {name} ngajual nyaéta {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nManéhna meunangkeun {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} pikeun ngajual {fruit} pai.\nJadi, {name} meunangkeun {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} dina dua poé.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
