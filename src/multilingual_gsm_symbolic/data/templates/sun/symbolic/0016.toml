question = "Sunny keur ngajual roti jahe jeung apel pai pikeun penggalangan dana. Dina Saptu, manéhna ngajual 10 kotak roti jahe jeung 4 kotak apel pai leuwih saeutik tibatan dina Minggu. Dina Minggu, manéhna ngajual 5 kotak roti jahe leuwih tibatan dina Saptu jeung 15 kotak apel pai. Upami roti jahena hargana $6 jeung apel paina hargana $15, kumaha loba Sunny meunangkeun dina dua poé?"
answer = "Manéhna ngajual 10 + 5 = <<10+5=15>>15 kotak roti jahe dina Minggu.\nTotal jumlah kotak roti jahe anu Sunny ngajual nyaéta 10 + 15 = <<10+15=25>>25.\nSunny meunangkeun 25*$6 = $<<25*6=150>>150 pikeun ngajual roti jahe.\nManéhna ngajual 15 - 4 = <<15-4=11>>11 kotak apel pai dina Saptu.\nTotal jumlah kotak apel pai anu Sunny ngajual nyaéta 15 + 11 = <<15+11=26>>26.\nManéhna meunangkeun 26*$15 = $<<26*15=390>>390 pikeun ngajual apel pai.\nJadi, Sunny meunangkeun $150 + $390 = $<<150+390=540>>540 dina dua poé.\n#### 540\n"
