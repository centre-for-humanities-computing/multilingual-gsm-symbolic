question = "S hiji petani keur meuli tuangeun pikeun kudana. Anjeunna meuli rupa-rupa hay, oat, wortel jeung gula dadu. Sabab gula dadu téh mangrupa panyieut anu jarang, anjeunna ngan ukur meuli dua 1-paun kotak pikeun sakabéh panti. Anjeunna ngan hayang cukup wortel pikeun tuangeun kuda nalika sayuran seger, jadi anjeunna meuli opat 12-paun karung. Hay téh mangrupa tuangeun utamana kudana, jadi anjeunna meuli opat puluh dua 75-paun bungkus. Oat téh mangrupa tuangeun tambahan pikeun hay, jadi anjeunna meuli dua puluh 65-paun karung. Upami truk tatanénna bisa ngangkut 2250 paun dina siji waktu, kumaha loba perjalanan anu dipikabutuh ku petani pikeun ngangkut sadayana tuangeun?"
