question = "Martha koobib talveriideid oma 3 lapselapsele. Nad on kolmikud, nii et nad on kõik ühesuurused. Ta tahab teha neile igaühele mütsi, salli, kampsuni, kindad ja sokid. Mütse valmimiseks kulub 2 tokki villa, salli jaoks 4, kampsuni jaoks 12, kinnaste paari jaoks 1 ja sokkide paari jaoks 2. Kui palju villa tokke ta peab ostma?"
