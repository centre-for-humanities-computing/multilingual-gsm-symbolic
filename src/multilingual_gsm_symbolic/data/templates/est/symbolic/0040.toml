question = "Sally läks puhkusele rannale. Tema vanemad andsid talle $15, et ta saaks osta mida tahes. Suveniiripoes oli taftil soodustus: \"Osta 500 grammi $3 eest, saada 500 grammi 1/2 hinnaga.\" Ta võttis kokku 2000 grammi. Ta ostis ka segapakendi merikarpe $1.5 eest ja 4 magnetit, mis maksid $0.25 tükk. Kui palju raha on Sallyl alles?"
answer = "Taft maksab $3 500 grammi eest ja ta saab 500 grammi 1/2 hinnaga. Seega 1/2 500 grammi hinnast on 500/500*1/2*$3 = $1.5.\nKokku maksab see $1.5 + $3 = $4.5.\nÜlejäänud 1000 grammi ei ole soodustusega ja maksab $6, nii et koguhind on $3 + $1.5 + $6 = $<<3 + 1.5 + 6 = 10.5>>10.5\n4 magnetit $0.25 tükk on 4*$0.25=$<<4*0.25=1>>1\nKui liidad kõik tema ostud, $10.5 + $1.5 + $1 = $<<10.5+1.5+1=13>>13\nTal oli $15 ja ta kulutas $13, nii et tal on $15 - $13 = $<<15-13=2>>2 alles\n#### 2\n"
