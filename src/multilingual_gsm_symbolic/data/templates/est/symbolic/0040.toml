question = "Sally läks puhkusele rannale. Tema vanemad andsid talle $15, et ta saaks osta mida tahes. Suveniiripoes oli taftil soodustus: \"Osta 1 nael $3 eest naela kohta, saa 1 nael 1/2 hinnaga.\" Ta võttis kokku 4 naela. Ta ostis ka segapakendi merikarpe $1.5 eest ja 4 magnetit, mis maksid $0.25 tükk. Kui palju raha on Sallyl alles?"
