question_annotated = "{name,Sally} läks puhkuseks mere äärde. Tema vanemad andsid talle ${total,15} dollarit, et ta saaks osta, mida iganes tahab. Suveniiripoes oli iiriskommide (taffy) sooduspakkumine: \"Osta {n1,500} grammi ${p1,3} dollari eest, ja saad {n2,500} grammi {discount,1/2} hinnaga.\" Ta võttis {n12,2000} grammi. Ta ostis ka segatud kestasid ${p2,1.5} dollari eest ja {n3,4} magnetit, mis maksid ${p3,0.25} dollarit tükk. Kui palju raha on {name,Sally}l pärast ostude tegemist alles?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(500, 3000, 500)\n- $n2 = range(500, 3000, 500)\n- $n12 = range(1000, 6000, 500)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1 + p2 + n3*p3)\n- p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1 + p2 + n3*p3 < total\n\n#answer: total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)\n"
answer_annotated = "Iiriskommid maksavad ${p1} dollarit {n1} grammi eest ja ta saab {n2} grammi {discount} hinnaga. Seega on {discount} {n2} grammi hinna soodushinnast {n2}/{n1}*{discount}*${p1} = ${(n2/n1)*discount*p1} dollarit.\nKokku maksab see ${(n2/n1)*discount*p1} + ${p1} = ${(n2/n1)*discount*p1 + p1}.\nÜlejäänud {n12 - n1 - n2} grammi ei ole soodustusega ja maksab ${(n12 - n1 - n2)/n1*p1}, seega on koguhind ${p1} + ${n2/n1*discount*p1} + ${(n12 - n1 - n2)/n1*p1} = $<<{p1} + {n2/n1*discount*p1} + {(n12 - n1 - n2)/n1*p1} = {p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}>>{p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}\n{n3} magnetit hinnaga ${p3} dollarit tükk on {n3}*${p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nKui liita kõik tema ostud, siis ${p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1} + ${p2} + ${n3*p3} = $<<{p1+(n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}+{p2}+{n3*p3}={int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}>>{int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}\nTal oli ${total} ja ta kulutas ${int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}, seega on tal alles ${total} - ${int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} = $<<{total}-{int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}={total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}>>{total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}\n#### {total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}\n"
