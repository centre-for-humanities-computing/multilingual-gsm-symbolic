question = "Sally läks puhkuseks mere äärde. Tema vanemad andsid talle 15 dollarit, et ta saaks osta, mida iganes tahab. Suveniiripoes oli iiriskommide (taffy) sooduspakkumine: \"Osta 500 grammi 3 dollari eest, ja saad 500 grammi poole hinnaga.\" Ta võttis 2000 grammi. Ta ostis ka segatud kestasid 1,5 dollari eest ja 4 magnetit, mis maksid 0,25 dollarit tükk. Kui palju raha on Sallyl pärast ostude tegemist alles?"
answer = "Iiriskommid maksavad 3 dollarit 500 grammi eest ja ta saab 500 grammi poole hinnaga. Seega on 1/2 500 grammi hinna soodushinnast 500/500*1/2*$3 = 1,5 dollarit.\nKokku maksab see 1,5 + 3 = 4,5.\nÜlejäänud 1000 grammi ei ole soodustusega ja maksab 6, seega on koguhind 3 + 1,5 + 6 = $<<3 + 1.5 + 6 = 10.5>>10,5\n4 magnetit hinnaga 0,25 dollarit tükk maksab 4*$0.25=$<<4*0.25=1>>1\nKui liita kõik tema ostud, siis 10,5 + 1,5 + 1 = $<<10.5+1.5+1=13>>13\nTal oli 15 dollarit ja ta kulutas 13 dollarit, seega on tal alles 15 - 13 = $<<15-13=2>>2\n#### 2\n"
