question = "Dana saab jooksma neli korda kiiremini kui ta suudab kõndida, kuid ta suudab hüppada pool kiirusel, mis on tema jooksukiirus. Kui ta suudab hüppada 3 kilomeetrit tunnis, mitu kilomeetrit saab ta läbida kuue tunni jooksul, kui ta veedab ühe kolmandiku ajast jooksu ja kaks kolmandikku ajast kõndides?"
answer = "Kui Dana suudab hüppada pool kiirusel, millega ta suudab joosta, siis ta suudab joosta 3*2=<<3*2=6>>6 kilomeetrit tunnis.\nJa kuna ta suudab joosta neli korda kiiremini kui ta suudab kõndida, tähendab see, et ta suudab kõndida 6/4=1.5 kilomeetrit tunnis.\nKui kaks kolmandikku ajast veetakse kõndides, siis ta kõnnib 6*2/3=<<6*2/3=4>>4 tundi.\nKui üks kolmandik ajast veetakse jookses, siis ta jookseb 6-4=<<6-4=2>>2 tundi.\nSeega ta jookseb 2 tundi 6 kilomeetrit tunnis, ehk 2*6=<<2*6=12>>12 kilomeetrit.\nTa kõnnib 4 tundi 1.5 kilomeetrit tunnis, ehk 4*1.5=<<4*1.5=6>>6 kilomeetrit.\nSeega kokku läbib ta 12+6=<<12+6=18>>18 kilomeetrit.\n#### 18\n"
