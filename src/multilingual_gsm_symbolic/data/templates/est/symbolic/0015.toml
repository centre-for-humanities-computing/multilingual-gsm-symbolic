question = "Jenniferi koeral on 8 kutsikat, kellest 3 on täpilised. Brandoni koeral on 12 kutsikat, kellest 4 on täpilised. Mis protsent kõigist kutsikatest on täpilised?"
answer = "Kõigepealt leia kutsikate koguarv: 8 kutsikat + 12 kutsikat = <<8+12=20>>20 kutsikat\nSeejärel leia täpilistega kutsikate koguarv: 3 kutsikat + 4 kutsikat = <<3+4=7>>7 kutsikat\nSeejärel jaga täpiliste kutsikate arv kõigi kutsikate arvuga ja korruta 100%-ga, et leida täpiliste kutsikate protsent: 7 kutsikat / 20 kutsikat * 100% = 35%\n#### 35\n"
