question_annotated = "Toitumisalase info järgi on {food,chips} kotis {cal,250} kalorit ühes portsjonis. Kui {size,300}-{unit,gram} suurune kott sisaldab {n,5} portsjonit, siis mitu {unit,gram}s saad sa süüa, kui sinu päevane kalorite eesmärk on {total,2000} ja sa oled juba ära söönud {spent,1800} kalorit?\n\n#init:\n- food = sample([\"popcorn\", \"breads\",  \"cookies\"])\n- unit = sample([\"gramm\", \"g\"])\n- $cal = range(150, 500, 25)\n- $size = range(100, 400, 25)\n- $n = range(4, 8)\n- $total = range(1900, 2500, 5)\n- $spent = range(600, 1900, 25)\n\n#conditions:\n- spent < total\n- is_int( 5 * (total - spent) / cal)\n- divides(size, n)\n- divides(size//n, (total-spent)/cal)\n\n#answer: size//n * Fraction((total-spent)/cal)\n"
answer_annotated = "Kui kogu kalorite eesmärk on {total} ja ma olen ära söönud {spent} kalorit, siis on mul {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} kalorit süüa\nKui iga {food} portsjon sisaldab {cal} kalorit ja mul on alles {total-spent} kalorit, siis saan süüa ainult {total-spent}/{cal} portsjonit = {Fraction((total-spent)/cal)} portsjonist\nTeame ka, et {size}-{unit} suurune {food} kott sisaldab {n} portsjonit, seega on üks portsjon {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit}s\nKui ma saan süüa ainult {Fraction((total-spent)/cal)} portsjonist, siis saan süüa ainult {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit}s\n#### {size//n * (total-spent)/cal}\n"
