question = "Toitumisalase info järgi on ühes portsjonis 250 kalorit krõpsukotis. Kui 300-grammine kott sisaldab 5 portsjonit, siis mitu grammi saad süüa, kui sinu päevane kalorite eesmärk on 2000 ja sa oled juba ära söönud 1800 kalorit?"
answer = "Kui kogu kalorite eesmärk on 2000 ja ma olen ära söönud 1800 kalorit, siis on mul veel 2000-1800 = <<2000-1800=200>>200 kalorit süüa\nKui iga krõpsuportsjon sisaldab 250 kalorit ja mul on alles 200 kalorit, siis saan süüa ainult 200/250 portsjonit = 4/5 portsjonist\nTeame ka, et 300-grammine krõpsukott sisaldab 5 portsjonit, seega on üks portsjon 300 grammi/5 = <<300/5=60>>60 grammi\nKui ma saan süüa ainult 4/5 portsjonist, siis saan süüa ainult 60 grammi * 4/5 = 48 grammi\n#### 48\n"
