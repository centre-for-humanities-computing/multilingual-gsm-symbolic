question = "Põllumees ostab sööta oma hobustele. Ta ostab mitmesugust heina, kaera, porgandeid ja suhkrukuubikuid. Kuna suhkrukuubikud on haruldane maius, ostab ta kogu talli jaoks ainult kaks 1-kilogrammist pakki. Ta tahab ainult nii palju porgandeid, et hobused saaksid neid süüa, kuni köögiviljad on värsked, nii et ta ostab neli 12-kilogrammist kotti. Heina on hobuste peamine toit, nii et ta ostab kakskümmend kaks 75-kilogrammist pakki. Kaer on heina täiendavaks põhitoit, nii et ta ostab kakskümmend 65-kilogrammist kotti. Kui tema farmi veoauto mahutab 2250 kilogrammi korraga, mitu reisi peab põllumees tegema kogu sööda transportimiseks?"
