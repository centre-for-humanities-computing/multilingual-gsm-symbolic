question = "Talunik ostab sööta oma hobustele. Ta ostab mitmesugust heina, kaera, porgandeid ja suhkrukuubikuid. Kuna suhkrukuubikud on haruldane maiuspala, ostab ta kogu talli jaoks ainult kaks 1-kilogrammist kasti. Ta tahab osta porgandeid ainult niipalju, et hobused saaksid neid süüa, kuni köögiviljad on värsked, seega ostab ta neli 12-kilogrammist kotti. Hein on hobuste põhisööt, nii et ta ostab nelikümmend kaks 75-kilogrammist pakki. Kaer on põhitoit, millega heina täiendada, nii et ta ostab kakskümmend 65-kilogrammist kotti. Kui tema farmi veoauto suudab korraga kanda 2250 kilogrammi, siis mitu reisi peab talunik tegema, et transportida kogu sööt?"
