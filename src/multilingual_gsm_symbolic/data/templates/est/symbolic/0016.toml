question = "Sunny müüb heategevusürituse jaoks piparkooke ja õunapirukat. Laupäeval müüs ta 10 kasti piparkooke ja 4 kasti võrra vähem õunapirukaid kui pühapäeval. Pühapäeval müüs ta 5 kasti piparkooke rohkem kui laupäeval ja 15 kasti õunapirukaid. Kui piparkook maksis 6 dollarit ja õunapirukas maksis 15 dollarit, siis kui palju teenis Sunny kahe päeva jooksul?"
