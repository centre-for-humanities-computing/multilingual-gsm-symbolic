question = "दादी हर दिन अपने पसंदीदा पैदल चलने वाले रास्ते पर ३ किलोमीटर चलती हैं, जिसमें समुद्र तट पर २ किलोमीटर चलना और फुटपाथ पर १ किलोमीटर चलना शामिल है। फुटपाथ पर, दादी समुद्र तट की तुलना में दोगुनी गति से चलती हैं। यदि उनकी सैर के ४० मिनट समुद्र तट पर बितते हैं, तो पूरे ३-किलोमीटर के रास्ते को पूरा करने में उन्हें कुल कितने मिनट लगते हैं?"
