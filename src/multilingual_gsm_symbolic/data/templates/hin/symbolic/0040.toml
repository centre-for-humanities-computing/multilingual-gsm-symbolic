question = "माया छुट्टियाँ मनाने समुद्र तट पर गई। उसके माता-पिता ने उसे अपनी मनचाही चीज़ें खरीदने के लिए ₹१५ दिए। स्मृति-चिह्नों की दुकान पर टॉफ़ी पर यह ऑफ़र था: \"हर १००० ग्राम ₹२ में खरीदने पर, अगले ५०० ग्राम १/२ कीमत पर पाएं।\" बाकी टॉफ़ी सामान्य कीमत (₹२ प्रति १००० ग्राम) पर मिलती है। उसने २००० ग्राम ले ली। उसने ₹१.५ में सीपियों का एक मिला-जुला थैला भी खरीदा और ४ चुंबक खरीदे, जिनमें से हर एक की कीमत ₹०.२५ थी। माया के पास कितने पैसे बचते हैं?"

answer = """
टॉफ़ी की कीमत १००० ग्राम के लिए ₹२ है, और हर १००० ग्राम के बाद उसे अगले ५०० ग्राम १/२ कीमत पर मिलते हैं। २००० ग्राम में यह ऑफ़र एक बार लागू होता है, इसलिए ५०० ग्राम की कीमत का १/२ है ५००/१०००*१/२*₹२ = ₹०.५.
कुल मिलाकर, इसकी कीमत ₹०.५ + ₹२ = ₹२.५ होती है।
बचे हुए ५०० ग्राम से अगले १००० ग्राम पूरे नहीं होते, इसलिए उन पर कोई छूट नहीं है और उसकी कीमत ₹१ है, इसलिए कुल कीमत ₹२ + ₹०.५ + ₹१ = ₹<<२ + ०.५ + १ = ३.५>>३.५
₹०.२५ प्रति चुंबक की दर से ४ चुंबकों की कीमत ४*०.२५=₹<<४*०.२५=१>>१ है
जब उसकी सभी खरीदों को जोड़ा जाता है, ₹३.५ + ₹१.५ + ₹१ = ₹<<३.५+१.५+१=६>>६
उसके पास ₹१५ थे और उसने ₹६ खर्च किए, इसलिए उसके पास ₹१५ - ₹६ = ₹<<१५-६=९>>९ बचते हैं
#### ९
"""

