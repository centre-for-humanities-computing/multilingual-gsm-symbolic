कुल मिलाकर, इसकी कीमत ₹{(n2/n1)*discount*p1} + ₹{p1} = ₹{(n2/n1)*discount*p1 + p1} होती है।
बचे हुए {n12 - n1 - n2} ग्राम से अगले {n1} ग्राम पूरे नहीं होते, इसलिए उन पर कोई छूट नहीं है और उसकी कीमत ₹{(n12 - n1 - n2)/n1*p1} है, इसलिए कुल कीमत ₹{p1} + ₹{n2/n1*discount*p1} + ₹{(n12 - n1 - n2)/n1*p1} = ₹<<{p1} + {n2/n1*discount*p1} + {(n12 - n1 - n2)/n1*p1} = {p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}>>{p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}
₹{p3} प्रति चुंबक की दर से {n3} चुंबकों की कीमत {n3}*{p3}=₹<<{n3}*{p3}={n3*p3}>>{n3*p3} है
जब उसकी सभी खरीदों को जोड़ा जाता है, ₹{p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1} + ₹{p2} + ₹{n3*p3} = ₹<<{p1+(n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}+{p2}+{n3*p3}={ensure_int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}>>{ensure_int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}
