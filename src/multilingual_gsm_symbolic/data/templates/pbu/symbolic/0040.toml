question = "سلي د استراحت لپاره د سمندر غاړې ته ولاړه. د هغې والدین ورته $15 ورکړل ترڅو هغه څه واخلي چې غواړي. په یادښت پلورنځي کې، ټافي په پلور کې و چې \"د هر پونډ $3 بیه، 1 پونډ واخلي او 1 پونډ 1/2 کمی ترلاسه کړي.\" هغې 4 پونډونه راټول کړل. هغې همدارنګه د سمندري صدفونو ګډه کیسه د $1.5 لپاره واخیسته او 4 مقناطیسونه چې هر یو یې $0.25 و. سلي څومره پیسې پاتې دي؟"
answer = "سلي د $3 لپاره 1 پونډ اخلي او 1 پونډ 1/2 کمی ترلاسه کوي. نو د 1 پونډ 1/2 کمی $3*1/2 = $1.5 دی. د 2 پونډونو پاتې برخه تخفیف نلري او قیمت یې 2*$3 = $6 دی، نو ټولیزه بیه $3+$3/2+$6=$21/2 ده. 4 مقناطیسونه په هر یو $0.25 قیمت 4*0.25=$<<4*0.25=1>>1 دي. کله چې تاسو ټولې د هغې خریدونه جمع کړئ، $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13. هغې $15 درلودل او $13 یې لګول، نو هغې $15-$13 = $<<15-13=2>>2 پاتې درلودل. #### 2\n"
