question_annotated = "{name,سلي} د استراحت لپاره د سمندر غاړې ته ولاړه. د هغې والدین ورته ${total,15} ورکړل ترڅو هغه څه واخلي چې غواړي. په یادښت پلورنځي کې، ټافي په پلور کې و چې \"د هر پونډ ${p1,3} بیه، {n1,1} پونډ واخلي او {n2,1} پونډ {discount,1/2} کمی ترلاسه کړي.\" هغې {n12,4} پونډونه راټول کړل. هغې همدارنګه د سمندري صدفونو ګډه کیسه د ${p2,1.5} لپاره واخیسته او {n3,4} مقناطیسونه چې هر یو یې ${p3,0.25} و. {name,سلي} څومره پیسې پاتې دي؟\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} د ${p1} لپاره {n1} پونډ اخلي او {n2} پونډ {discount} کمی ترلاسه کوي. نو د {n2} پونډ {discount} کمی ${p1}*{discount} = ${float(n2*discount*p1)} دی. د {n12-n1-n2} پونډونو پاتې برخه تخفیف نلري او قیمت یې {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1} دی، نو ټولیزه بیه ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1} ده. {n3} مقناطیسونه په هر یو ${p3} قیمت {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3} دي. کله چې تاسو ټولې د هغې خریدونه جمع کړئ، ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}. هغې ${total} درلودل او ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} یې لګول، نو هغې ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} پاتې درلودل. #### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
