question = "د خپل تغذیوي معلوماتو له مخې، د چپس یوه کیسه په هر برخه کې 250 کیلوري لري. که 300 ګرام کیسه 5 برخې ولري، تاسو څومره ګرام خوړلی شئ که ستاسو د ورځني کیلوري هدف 2000 وي او تاسو دمخه 1800 کیلوري مصرف کړي وي؟"
answer = "که ټول کیلوري هدف 2000 وي او ما 1800 کیلوري مصرف کړي دي نو ما 2000-1800 = <<2000-1800=200>>200 کیلوري پاتې دي چې وخړم\nکه د چپس هر برخه 250 کیلوري ولري او ما یوازې 200 کیلوري پاتې دي چې وخړم، نو ما یوازې د یوې برخې 200/250 خوړلی شئ = د یوې برخې 4/5\nموږ هم پوهیږو چې د چپس یوه 300 ګرام کیسه 5 برخې لري، نو هر برخه 300 ګرام/5 = <<300/5=60>>60 ګرام لري\nکه ما یوازې د یوې برخې 4/5 خوړلی شي، نو ما یوازې 60 ګرام * 4/5 = 48 ګرام خوړلی شي\n#### 48\n"
