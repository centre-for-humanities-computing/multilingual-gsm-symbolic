question = "سنی د مرستې لپاره جینګربرېډ او سیب پای پلوري. په شنبې کې، هغه د جینګربرېډ 10 بکسونه او د سیب پای 4 لږ بکسونه، له یکشنبې څخه پلورلي. په یکشنبې کې، هغه د جینګربرېډ 5 ډیر بکسونه له شنبې څخه او د سیب پای 15 بکسونه پلورلي. که جینګربرېډ قیمت ډالر6 وي او سیب پای قیمت ډالر15 وي، سنی د دوو ورځو لپاره څومره ګټه وکړه؟"
answer = "هغه په یکشنبې کې د جینګربرېډ 10 + 5 = <<10+5=15>>15 بکسونه پلورلي.\nد جینګربرېډ د پلورل شویو بکسونو ټولیز شمېر چې سنی یې پلورلي 10 + 15 = <<10+15=25>>25 دی.\nسنی د جینګربرېډ د پلورلو لپاره 25*ډالر6 = ډالر<<25*6=150>>150 ګټه وکړه.\nهغه په شنبې کې د سیب پای 15 - 4 = <<15-4=11>>11 بکسونه پلورلي.\nد سیب پای د پلورل شویو بکسونو ټولیز شمېر چې سنی یې پلورلي 15 + 11 = <<15+11=26>>26 دی.\nهغه د سیب پای د پلورلو لپاره 26*ډالر15 = ډالر<<26*15=390>>390 ګټه وکړه.\nنو، سنی د دوو ورځو لپاره ډالر150 + ډالر390 = ډالر<<150+390=540>>540 ګټه وکړه.\n#### 540\n"
