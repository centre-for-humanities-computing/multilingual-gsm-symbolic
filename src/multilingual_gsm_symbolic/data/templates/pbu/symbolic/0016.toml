answer_annotated = "هغه په {d2} کې د {food} {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} بکسونه پلورلي.\nد {food} د پلورل شویو بکسونو ټولیز شمېر چې {name} یې پلورلي {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2} دی.\n{name} د {food} د پلورلو لپاره {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} ګټه وکړه.\nهغه په {d1} کې د {fruit} پای {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} بکسونه پلورلي.\nد {fruit} پای د پلورل شویو بکسونو ټولیز شمېر چې {name} یې پلورلي {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1} دی.\nهغه د {fruit} پای د پلورلو لپاره {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} ګټه وکړه.\nنو، {name} د دوو ورځو لپاره {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} ګټه وکړه.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
