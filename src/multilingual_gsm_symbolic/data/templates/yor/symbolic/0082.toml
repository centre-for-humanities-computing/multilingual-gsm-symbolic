question = "Ní ìbẹ̀rẹ̀ pàtí, wà 25 okùnrin àti 15 obìnrin. Lẹ́yìn wákàtí kan, 1/4 ti àpapọ̀ ènìyàn kọ̀. Bí àwọn obìnrin wo tí kù tí 22 okùnrin wà sílẹ̀ ní pàtí?"
