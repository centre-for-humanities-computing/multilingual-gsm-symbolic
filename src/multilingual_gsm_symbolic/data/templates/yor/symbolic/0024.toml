question = "Gẹ́gẹ́ bí àlàyé ounjẹ ṣe sọ, oko ewéko ní 250 kalori fún ẹ̀yà kọ̀ọ̀kan. Bí oko 300 garamu bá ní 5 ẹ̀yà, iye garamu mélòó lè o jẹ tí àfojúsọ́nà kalori ọjọ́ rẹ̀ bá jẹ́ 2000 tí o sì ti jẹ 1800 kalori tẹ́lẹ̀?"
answer = "Tí àfojúsọ́nà kalori àpapọ̀ bá jẹ́ 2000 àti pé mo ti jẹ 1800 kalori, nígbà náà mo ní 2000-1800 = <<2000-1800=200>>200 kalori tí ó kù láti jẹ\nBí ẹ̀yà kọ̀ọ̀kan ewéko bá ní 250 kalori àti pé mo ní 200 kalori nìkan tí ó kù láti jẹ, nígbà náà mo lè jẹ 200/250 nínú ẹ̀yà = 4/5 nínú ẹ̀yà\nA tún mọ̀ pé oko 300 garamu ewéko ní 5 ẹ̀yà, nìtorí náà ẹ̀yà kọ̀ọ̀kan ní 300 garamu/5 = <<300/5=60>>60 garamus\nBí mo bá lè jẹ 4/5 nìkan nínú ẹ̀yà, nígbà náà mo lè jẹ 60 garamu * 4/5 = 48 garamus\n#### 48\n"
