question = "Sally lo si eti okun fun isinmi. Awon obi re fun un ni $15 lati ra ohun ti o fe. Ni ile itaja awon ohun iranti, taffy wa ni idiyele \"Ra 1 poun ni $3 fun poun kan, ri 1 poun 1/2 idinku.\" O gba 4 poun. O tun ra apo didapọ awon egungun eti okun fun $1.5 ati 4 awon magneti ti o jẹ $0.25 kọọkan. Owo melo ni Sally ni o ku?"
answer = "Sally n ra 1 poun fun $3 ati pe o gba 1 poun 1/2 idinku. Nitorinaa 1/2 idinku lori 1 poun jẹ $3*1/2 = $1.5. Ipoke ti 2 poun ko ni idinku ati pe owo rẹ jẹ 2*$3 = $6, nitorinaa apapọ ni $3+$3/2+$6=$21/2\n4 awon magneti ni $0.25 kọọkan jẹ 4*0.25=$<<4*0.25=1>>1\nNigba ti a ba ako awon ohun ti o ra, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nO ni $15 ati pe o lo $13 nitorinaa o ni $15-$13 = $<<15-13=2>>2 ku\n#### 2\n"
