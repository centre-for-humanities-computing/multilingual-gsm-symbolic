question = "Alison ti gba ipo lori ẹgbẹ ìjogùn, nítorí náà ó lọ ra ẹ̀rọ bọ́ọ̀lù. Ó ra blusa fún ₦10, ọ̀kan lára ìjogùn àwọ̀n fún ₦5 tó ju blusa lọ, àti ọ̀kan lára sneakers tí wọ́n fi bẹ́rẹ̀ ₦48 ṣùgbọ́n wọ́n ta ní àádọ́ta idiyele. Ó ní kúpọ̀n fún ₦2 lórí ẹ̀yà ₦8 bọ́ọ̀lù ìgbẹ̀rẹ̀ tí ó tún ra. Owo melo lo fi ra ẹ̀rọ bọ́ọ̀lù?"
answer = "Awọn àwọ̀n jẹ ₦5 tó ju blusa, nítorí náà wọ́n fi ₦5 + ₦10 = ₦<<5+10=15>>15.\nAwọn sneakers rẹ̀ jẹ àádọ́ta idiyele akọkọ ₦48, nítorí náà wọ́n fi ₦48*3/5=₦144/5.\nPẹlu kúpọ̀n rẹ̀, awọn ìgbẹ̀rẹ̀ jẹ ₦8 - ₦2 = ₦<<8-2=6>>6.\nAwọn blusa, àwọ̀n, sneakers, ati ìgbẹ̀rẹ̀ papọ fi ₦10 + ₦15 + ₦144/5 + ₦6 = ₦<<10+15+144/5+6=299/5>>299/5.\n#### 299/5\n"
