question = "Mọ́sẹ́ Cruz ń wá ilé tí kì yóò kọjá ìwọ̀n owó rẹ̀ `$400,000`. Ó rí ohun ìní kan tí ó ní ìye ọjà `$350,000`. Lórí èyí, olù ra gbọ́dọ̀ san ìsan ọ̀rẹ́ tí ó jẹ́ 5% ti ìye ọjà, àti pẹ̀lú ìsan ìgbésí tí ó jẹ́ 12% ti ìye ọjà. Bí iye wo ni ìye àpapọ̀ ilé náà pọ̀ sí i ju ìwọ̀n owó Mọ́sẹ́ Cruz?"
answer = "Ìsan ọ̀rẹ́ náà jẹ́ $350,000*5/100 = $<<350000*5/100=17500>>17,500.\nÌsan ìgbésí náà jẹ́ $350,000*12/100 = $<<350000*12/100=42000>>42,000.\nÌye àpapọ̀ ilé náà jẹ́ $350,000 + $17,500 + $42,000 = $409,500.\nNítorí náà, ó jẹ́ $409,500 - $400,000 = $<<409500-400000=9500>>9500 pọ̀ sí i ju ìwọ̀n owó Mọ́sẹ́ Cruz.\n#### 9500\n"
