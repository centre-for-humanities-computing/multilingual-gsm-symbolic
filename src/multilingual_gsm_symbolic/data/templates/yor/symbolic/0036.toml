question = "Toula lo si ile-iṣẹ ounjẹ ati lati ra awọn iru awọn ounjẹ-ẹlẹwa. O ra 3 dozen awọn donut ti o ni idiyele $68 fun dozen, 2 dozen awọn cupcake kekere ti o ni idiyele $80 fun dozen, ati 6 dozen awọn cheesecake kekere fun $55 fun dozen. Bawo ni idiyele lapapọ?"
