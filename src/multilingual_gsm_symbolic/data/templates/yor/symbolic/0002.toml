question = "Jẹ́rì ń ró 6-ẹ̀gbẹ́ dádìì. Kí ni ìyàtọ̀ ìṣeéṣe (tí a sọ ní ìpín ọgọ́run) láàárín pé ó yọ nọ́mbà tí ó tóbi ju 3 lọ àti pé ó yọ nọ́mbà ọ̀tún méjì ní ìtẹ̀lọ́rùn?"
answer = "Àwọn nọ́mbà 3 wà tí ó tóbi ju 3 lọ lórí dádìì náà, nítorí náà, ìṣeéṣe láti yọ ọ́n jẹ́ 3/6=50%.\nÌṣeéṣe láti yọ nọ́mbà ọ̀tún kan jẹ́ 50%, nítorí náà, ìṣeéṣe láti yọ méjì ní ìtẹ̀lọ́rùn jẹ́ 50% * 50% = 25%.\nÌyàtọ̀ láàárín ìṣeéṣe méjì yìí ni 50% - 25% = 25%.\n#### 25\n"
