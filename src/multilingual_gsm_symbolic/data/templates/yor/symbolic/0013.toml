question = "Mary jẹ́ olùkọ́lẹ̀ onífẹ̀ẹ́. Ọjọ́ tó kọjá, ó gba 18 ewéko tuntun ti a fi iná rọ́pọ̀ láti ibùgbé ewéko ti ó fẹ́ràn jùlọ. Ó ti ní 2 ewéko ti a fi iná rọ́pọ̀ lórí ẹ̀yà ìkùn window kọ̀ọ̀kan nínú 40 ìkùn window ti ilé ńlá rẹ̀ ní ìhà ńlá. Nítorí pé ó fẹ́ràn láti pín, ó pinnu pé yóò fún 1 lára àwọn ewéko ti a fi iná rọ́pọ̀ láti ẹ̀yà kọ̀ọ̀kan fún àwọn ọ̀rẹ́ àti ẹbí rẹ̀ ọ̀sàn ńlá. Èwo ni Mary yóò kù ní ewéko ti a fi iná rọ́pọ̀?"
