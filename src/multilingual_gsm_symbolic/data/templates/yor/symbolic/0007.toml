question = "Agbẹ kan n ra ounjẹ fun awọn ẹṣin rẹ. O ra ọpọlọpọ fẹnu, oti, karọt ati awọn ẹlẹgbẹ suga. Niwọn igba ti awọn ẹlẹgbẹ suga jẹ ounjẹ ti o ṣọwọn, o nikan ra meji 1-pawundi awọn ọbọ wọn fun ile-ẹṣin gbogbo. O fẹ karọt to peye lati jẹun awọn ẹṣin lakoko ti ẹfọ wa ni titun, nitorina o ra mẹrin 12-pawundi awọn apo. Fẹnu jẹ ounjẹ akọkọ fun awọn ẹṣin rẹ, nitorina o ra aadọta-ẹẹmeji 75-pawundi awọn ẹgbẹ. Oti jẹ ounjẹ pataki lati fi kun fẹnu, nitorina o ra ogun 65-pawundi awọn apo. Ti truck agbẹ rẹ ba le gbe 2250 pawundis ni akoko kan, awọn irin-ajo melo ni agbẹ nilo lati gbe ounjẹ gbogbo?"
