question = "Adé ní àtìlé ẹ̀gbẹ́ ní ọjà agbẹ̀. Ó ń ta ọ̀nà mẹ́ta ti ẹ̀gbẹ́: ẹ̀gbẹ́ marigold, ẹ̀gbẹ́ petunia àti ẹ̀gbẹ́ begonia. Ó máa ń ta ẹ̀gbẹ́ marigold fún ₦2.74 fún agbọn, ẹ̀gbẹ́ petunia fún ₦1.87 fún agbọn àti ẹ̀gbẹ́ begonia fún ₦2.12 fún agbọn. Adé kò ní owó ìyípadà ní òní, nítorí náà ó pinnu láti yí àwọn iye owó rẹ̀ pọ̀ sí iye owó tí ó sunmọ́ jùlọ. Tí Adé bá ta 12 agbọn ti ẹ̀gbẹ́ marigold, 9 agbọn ti ẹ̀gbẹ́ petunia àti 17 agbọn ti ẹ̀gbẹ́ begonia, ó yóò kó owó mélòó?"
answer = "Adé yóò yí ẹ̀gbẹ́ marigold rẹ̀ so láti ₦2.74 sí ₦3, nítorí pé nọ́mbà tí ó tẹ̀le 2 jẹ́ 5 tàbí ju bẹ́ẹ̀ lọ.\nAdé yóò yí ẹ̀gbẹ́ petunia up láti ₦1.87 sí ₦2, nítorí pé nọ́mbà tí ó tẹ̀le 1 jẹ́ 5 or higher.\nAdé yóò yí ẹ̀gbẹ́ begonia down láti ₦2.12 sí ₦2, nítorí pé nọ́mbà tí ó tẹ̀le 2 jẹ́ less than 5.\nAdé ta 12 ẹ̀gbẹ́ marigold*₦3 = ₦<<12*3=36>>36\nAdé ta 9 ẹ̀gbẹ́ petunia*₦2 = ₦<<9*2=18>>18\nAdé ta 17 ẹ̀gbẹ́ begonia*₦2 = ₦<<17*2=34>>34\nLápapọ̀, Adé yóò kó ₦36 + ₦18 + ₦34 = ₦<<36+18+34=88>>88\n#### 88\n"
