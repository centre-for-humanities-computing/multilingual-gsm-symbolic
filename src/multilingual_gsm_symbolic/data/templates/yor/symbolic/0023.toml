question = "Martha ń kọ́ ẹ̀ṣọ́ ooru fún àwọn ọmọ ọmọ rẹ̀ 3. Wọ́n jẹ́ awọn ọmọ ẹgbẹ́ mẹ́ta, nítorí náà wọ́n jọra ní ìwọ̀n. Ó fẹ́ ṣe ibọ̀rọ̀, fifi, igbẹ́, ìwọ̀ ọwọ́, àti soketi fún ọ̀kọ̀ọ̀kan wọn. Ó gba 2 ìwọ̀n oofa láti ṣe ibọ̀rọ̀, 4 fún fifi, 12 fún igbẹ́, 1 fún ẹgbẹ́ ìwọ̀ ọwọ́, àti 2 fún ẹgbẹ́ soketi. Ó ní láti ra ìwọ̀n oofa mélòó?"
