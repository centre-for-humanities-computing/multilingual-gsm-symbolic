question = "Sunny ń ta kuki eja ati ẹpọ pie fun ikojọpọ owó. Ni Ọjọ Abo, o ta 10 awọn igbe kuki eja ati awọn igbe ẹpọ pie 4 kere si ju Ọjọ Aiku lọ. Ni Ọjọ Aiku, o ta awọn igbe kuki eja 5 diẹ sii ju ti Ọjọ Abo lọ, ati awọn igbe ẹpọ pie 15. Ti idiyele kuki eja ba jẹ ₦6 ati idiyele ẹpọ pie jẹ ₦15, owó melo ni Sunny gba fun ọjọ meji?"
answer = "O ta 10 + 5 = <<10+5=15>>15 awọn igbe kuki eja ni Ọjọ Aiku.\nNọmba lapapọ awọn igbe kuki eja ti Sunny ta jẹ 10 + 15 = <<10+15=25>>25.\nSunny gba 25*₦6 = ₦<<25*6=150>>150 fun titaja kuki eja.\nO ta 15 - 4 = <<15-4=11>>11 awọn igbe ẹpọ pie ni Ọjọ Abo.\nNọmba lapapọ awọn igbe ẹpọ pie ti Sunny ta jẹ 15 + 11 = <<15+11=26>>26.\nO gba 26*₦15 = ₦<<26*15=390>>390 fun titaja ẹpọ pie.\nNitorinaa, Sunny gba ₦150 + ₦390 = ₦<<150+390=540>>540 fun ọjọ meji.\n#### 540\n"
