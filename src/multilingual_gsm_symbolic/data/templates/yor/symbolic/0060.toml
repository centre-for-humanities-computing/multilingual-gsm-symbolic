question = "Watson ṣiṣẹ ìgbà 10-wákàtí ní ọjọ kọ̀ọ̀kan, marun-un ọjọ ní ọsẹ kan. Ó gba $10 fún wákàtí kan àti gba $300 bọ́nù ní ọsẹ kọ̀ọ̀kan tí ilé-iṣẹ náà bá ṣe dáadáa. Bó ṣe pọ̀ tó ni Watson ṣe rí owó ní oṣù kẹrin tí ilé-iṣẹ náà bá ṣe dáadáa púpọ̀ fún ìgbà oṣù náà pátápátá?"
answer = "Ní ọjọ kan, Watson ṣe 10 * 10 = $<<10*10=100>>100\nTí ó bá ṣiṣẹ marun-un ọjọ ní ọsẹ kan, iye ọjọ fún oṣù náà pátápátá jẹ́ 6*4=<<6*4=24>>24 ọjọ.\nNíwọ̀n bí ó ti ń gba $100 ní ọjọ kọ̀ọ̀kan, iye àpapọ̀ fún oṣù náà pátápátá jẹ́ 24 * 100= $<<24*100=2400>>2400.\nÓ tún gba 300 * 4 = $<<300*4=1200>>1200 bọ́nù nítorí pé ilé-iṣẹ náà ṣe dáadáa ní gbogbo ọsẹ oṣù kẹrin.\nNí ìparí oṣù kẹrin, ó gbà 2400 + 1200 = $<<2400+1200=3600>>3600.\n#### 3600\n"
