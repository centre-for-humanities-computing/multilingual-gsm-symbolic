question = "Carol àti Jennifer jẹ́ àwọn arábìnrin láti Los Angeles tí wọ́n nífẹ̀ẹ́ láti kó àmì-ìfọwọ́sowọ́pọ̀ láti ọ̀dọ̀ àwọn ọlọ́fẹ́ẹ̀. Láàárín ìsinmi ìgbà ọ̀sán wọn láti ẹ̀kọ́, àwọn arábìnrin náà máa ń lo gbogbo ìgbà ọ̀sàn láti kó àmì-ìfọwọ́sowọ́pọ̀. Lẹ́yìn ẹ̀ẹ́ẹ́mẹ́ta ọ̀sẹ̀, Carol àti Jennifer ń fi àwọn ìwé ìfọwọ́sowọ́pọ̀ wọn wé ara wọn, wọ́n ń ka iye àmì-ìfọwọ́sowọ́pọ̀ tí arábìnrin kọ̀ọ̀kan ti kó. Carol ní 20 àmì-ìfọwọ́sowọ́pọ̀ nínú ìwé rẹ̀, àti pé Jennifer ní 44. Àwọn arábìnrin náà ní ọ̀ta ọ̀sẹ̀ míràn ti ìsinmi ìgbà ọ̀sán, wọ́n sì pinnu pé wọ́n fẹ́ dé 100 àmì-ìfọwọ́sowọ́pọ̀ láàárín wọn ní ìparí ìsinmi náà. Níwọ̀n bí àmì-ìfọwọ́sowọ́pọ̀ mélòó ni àwọn arábìnrin náà nílò láti kó láti dé àfojúsùn wọn?"
