question = "James sọ̀rọ̀ kẹ̀kẹ́ ẹlẹ́gbẹ́ láti 5 sánmọ́ sí 9 sánmọ́. Ó gba 1 wákàtí láì san owó. Wákàtí àkọ́kọ́ tí a ń san owó fún jẹ́ dọ́lá15, àti pé wákàtí tí a ń san owó fún lẹ́yìn náà ń san owó ìlọ́pọ̀ méjì ti wákàtí àkọ́kọ́ tí a ń san owó fún. Owó wo ni ó san?"
