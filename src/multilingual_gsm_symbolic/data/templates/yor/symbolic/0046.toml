question = "Ilé-ìwé-gíga Apple ń ṣe ìparí ìwé ní Ilé-ìṣẹ́ Ọ̀rọ̀-ọ̀rọ̀ Fine Arts ọdún yìí tí ó ní àyè fún 6000 ènìyàn. Lẹ́yìn tí a ti ka 950 àwọn ìtẹ́lẹ́ fún àwọn akẹ́kọ̀ọ́ tí ń parí àti 300 àwọn ìtẹ́lẹ́ fún àwọn olùkọ́ tí ń wà, ìwọ̀n bí àwọn tikẹ́ẹ̀tì wo ni ọ̀kọ̀ọ̀kan àwọn akẹ́kọ̀ọ́ tí ń parí yóò gba láti fún àwọn ọ̀rẹ́ àti ẹbí wọn tí àwọn tikẹ́ẹ̀tì bá pín ní dọ́gba?"
