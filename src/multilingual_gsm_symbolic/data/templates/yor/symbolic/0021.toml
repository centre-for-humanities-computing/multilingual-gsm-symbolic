question = "Frankie n wo TV lẹhin ti o pari iṣẹ ile rẹ ni gbogbo alẹ. Ni Ọjọ Ajọ ati Ọjọ Bọ, o wo episodi 1-wakati kan ti fihan ti o fẹran ni gbogbo alẹ. Ni Ọjọ Wẹnde, o wo diẹ ninu awọn episodi ti fihan 30-miniti kan. Ni Ọjọ Kẹrin, o pari iṣẹ ile ni kutukutu o si wo episodi 1-wakati kan ati fihan 30-miniti kan. Ni Ọjọ Jẹmọ, o gba laaye lati duro titi di alẹ, nitorinaa o wo awọn episodi 1-wakati méjì. Ti o ba wo wakati 7 ti TV lapapọ, iye awọn episodi 30-miniti wo ni o wo ni Ọjọ Wẹnde?"
