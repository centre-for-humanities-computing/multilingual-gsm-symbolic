question = "Mista Tan ta ile rẹ̀ fún $400,000. O san àwọn owo ìgbé tí ó tó 3% ti iye owo tita, ó sì tún san owo àgbàwòlé tí ó jẹ́ 5% ti iye owo tita. Bí ó bá tún san $250,000 fún owó òdó tí ó kù fún ile náà, iye wo ni owó tí Mista Tan yọ̀ látàrí tita ile náà?"
