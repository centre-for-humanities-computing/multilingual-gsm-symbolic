question = "Ìjẹ̀pà kan ń darapọ̀ mọ́ mẹ́wàá ènìyàn. Lọ́jọ́ kọ̀ọ̀kan, ènìyàn tí ó ti ní arun ọ̀kọ̀ọ̀kan ń darapọ̀ mọ́ mẹ́fà mìíràn. Ènìyàn mélòó ni ó ti ní arun lẹ́yìn ọjọ́ mẹ́ta?"
