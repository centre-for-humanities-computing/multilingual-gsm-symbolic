question = "Çandekarek ji bo hespan xurekê dibire. Ew cureyeke cûda ya xwarina hişk, jow, hûr û şekirê kûbik dibire. Ji ber ku şekirê kûbik xurekek kêm e, ew tenê du 1-funt qutiyên wan ji bo stûla hemû dibire. Ew tenê hewceyê hûr ye ku hespan bi xwarinê têr bike dema ku sebze taze ne, ji ber vê yekê ew çar 12-funt tûrikê dibire. Xwarina hişk xureka sereke ya hespan ye, ji ber vê yekê ew çil û du 75-funt pakêtan dibire. Jow bingehîn e ji bo temamkirina xwarina hişk, ji ber vê yekê ew bîst 65-funt tûran dibire. Heke kamyonê çandekarê wî di carekê de 2250 funt hilgire, çend seferan çandekar hewce dike ku hemû xurekê veguhazîne?"
