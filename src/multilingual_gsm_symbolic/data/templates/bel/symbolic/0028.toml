question = "Шпіталь мае ёмістасць {total,1000} {item,ляжко}ў з {frac,1/5} занятых. З-за {event,пандэміі каранавіруса}, {daily,50} пацыентаў прымаецца ў {facility,шпіталь} кожны дзень. Вылічыце агульную колькасць свабодных {item,ляжко}ў у {facility,шпіталі} пасля {period,2} тыдняў."
answer = "Калі {frac} агульнай ёмістасці {item}ў {facility} занятых, гэта азначае {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item}ў маюць пацыентаў.\nАгульная колькасць {item}ў у {facility} без новых прыёмаў складае {total} {item}ў - {int(total*frac)} {item}ў = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}ў.\nКалі {daily} чалавек прымаецца кожны дзень, агульная колькасць пацыентаў у {facility} пасля аднаго тыдня складае {daily} пацыентаў/дзень * 7 дзён/тыдзень = {daily*7} пацыентаў.\nПасля {period} тыдняў, агульная колькасць пацыентаў, прынятых у {facility}, складае {daily*7} пацыентаў/тыдзень * {period} тыдняў = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} пацыентаў, кожны з якіх выкарыстоўвае адзін {item}.\nКалі было {total-int(total*frac)} свабодных {item}ў у {facility} перад новымі прыёмамі, агульная колькасць зніжаецца да {total-int(total*frac)} {item}ў - {daily*period*7} {item}ў = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} свабодных {item}ў.\n#### {total - (total * frac + daily * period * 7)}\n"
