question = "Фрэнкі глядзіць тэлевізар пасля таго, як ён скончыць свае хатнія заданні кожны вечар. У панядзелак і аўторак, ён глядзеў 1-гадзінны эпізод сваёга любімага шоў кожны вечар. У серада, ён глядзеў некалькі эпізодаў 30-хвіліннага шоў. У чацвер, ён хутка скончыў хатнія заданні і глядзеў 1-гадзінны эпізод і 30-хвіліннае шоў. У пятніца, ён мог заставацца ўверх позна, таму ён глядзеў два 1-гадзінных эпізоды. Калі ён глядзеў 7 гадзін тэлебачання ў цэлым, колькі 30-хвілінных эпізодаў ён глядзеў у серада?"
answer = "Няхай E будзе колькасць эпізодаў, якія ён глядзеў у серада.\nПасля панядзелак, у яго засталося 7 - 1 = <<7-1=6>>6 гадзін тэлебачання.\nПасля аўторак, у яго засталося 6 - 1 = <<6-1=5>>5 гадзін тэлебачання.\nПасля чацвер, у яго засталося 5 - 1 - 0.5 = 3.5 гадзін тэлебачання.\nПасля пятніца, у яго засталося 3.5 - 2 = 1.5 гадзін тэлебачання.\nКожны 30-хвілінны эпізод гэта 1/2 гадзіны.\nТакім чынам, E = 1.5/0.5 = 3 эпізодаў.\n#### 3\n"
