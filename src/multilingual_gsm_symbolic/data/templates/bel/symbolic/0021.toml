question_annotated = "{name,Фрэнкі} глядзіць тэлевізар пасля таго, як ён скончыць свае хатнія заданні кожны вечар. У {d1,панядзелак} і {d2,аўторак}, ён глядзеў {h1,1}-гадзінны эпізод сваёга любімага шоў кожны вечар. У {d3,серада}, ён глядзеў некалькі эпізодаў {m1,30}-хвіліннага шоў. У {d4,чацвер}, ён хутка скончыў хатнія заданні і глядзеў {h2,1}-гадзінны эпізод і {m2,30}-хвіліннае шоў. У {d5,пятніца}, ён мог заставацца ўверх позна, таму ён глядзеў {n2_txt,два} {h3,1}-гадзінных эпізоды. Калі ён глядзеў {total,7} гадзін тэлебачання ў цэлым, колькі {m1,30}-хвілінных эпізодаў ён глядзеў у {d3,серада}?\n\n#init:\n- name = sample(names_male)\n- d1, d2, d3, d4, d5 = sample_sequential(weekdays, 5)\n- $total = range(7, 33)\n- $h1 = range(1, 7)\n- $h3 = range(1, 6)\n- $m1 = range(5, 61, 5)\n- $m2 = range(5, 61, 5)\n- $h2 = range(1, 7)\n- n2_txt, n2_val = range_str(2, 5, 1, numbers)\n\n#conditions: \n- divides(m1, 15)\n- divides(m2, 15)\n- divides(total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60, m1)\n- (total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1 > 0\n- (total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1 < 8 \n\n#answer: int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)\n"
answer_annotated = "Няхай E будзе колькасць эпізодаў, якія ён глядзеў у {d3}.\nПасля {d1}, у яго засталося {total} - {h1} = <<{total}-{h1}={total-h1}>>{total-h1} гадзін тэлебачання.\nПасля {d2}, у яго засталося {total-h1} - {h1} = <<{total-h1}-{h1}={total-2*h1}>>{total-2*h1} гадзін тэлебачання.\nПасля {d4}, у яго засталося {total-2*h1} - {h2} - {m2/60} = {total-2*h1-h2- m2/60} гадзін тэлебачання.\nПасля {d5}, у яго засталося {total-2*h1-h2-m2/60} - {n2_val*h3} = {total-2*h1-h2-m2/60-n2_val*h3} гадзін тэлебачання.\nКожны {m1}-хвілінны эпізод гэта {Fraction(m1/60)} гадзіны.\nТакім чынам, E = {total-2*h1-h2-m2/60-n2_val*h3}/{m1/60} = {int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)} эпізодаў.\n#### {int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)}\n"
