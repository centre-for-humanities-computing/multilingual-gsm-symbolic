answer_annotated = "Перш чым купляць {food1} і {food2}, {name} меў {mult_txt} больш {food1}, чым {food2}, гэта значыць {n} {food2} * {mult_val} {food1}/{food2} = <<{n}*{mult_val}={n*mult_val}>>{n*mult_val} {food1}\nАгульная колькасць {food1} і {food2}, якую меў {name} раней, складае {n*mult_val} {food1} + {n} {food2} = <<{n*mult_val}+{n}={n*mult_val+n}>>{n*mult_val+n} прадметаў\nКалі ён купіў {k} менш {food1}, чым {food2}, ён набыў {m} {food1} - {k} {food1} = <<{m}-{k}={m-k}>>{m-k} {food1}\nУ цэлым ён набыў {m-k} {food1} + {m} {food2} = <<{m-k}+{m}={2*m-k}>>{2*m-k} прадметаў\nПасля пакупак {name} мае {n*mult_val+n} прадметаў + {2*m-k} прадметаў = <<{n*mult_val+n}+{2*m-k}={n*mult_val+n+2*m-k}>>{n*mult_val+n+2*m-k} агульна {food1} і {food2} разам.\n#### {n*mult_val+n+2*m-k}\n"
