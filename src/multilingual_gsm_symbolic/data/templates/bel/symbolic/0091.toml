question = "У доме Алан ёсць у два разы больш кукурузы, чым канолі. У яго дома ўсяго 40 канолі. Алан купіў 60 яшчэ канолі ў краме і 40 менш кукурузы, чым канолі. Знойдзіце агульную колькасць кукурузы і канолі, якія Алан мае дома?"
answer = "Перш чым купляць кукурузы і канолі, Алан меў у два разы больш кукурузы, чым канолі, гэта значыць 40 канолі * 2 кукурузы/канолі = <<40*2=80>>80 кукурузы\nАгульная колькасць кукурузы і канолі, якую меў Алан раней, складае 80 кукурузы + 40 канолі = <<80+40=120>>120 прадметаў\nКалі ён купіў 40 менш кукурузы, чым канолі, ён набыў 60 кукурузы - 40 кукурузы = <<60-40=20>>20 кукурузы\nУ цэлым ён набыў 20 кукурузы + 60 канолі = <<20+60=80>>80 прадметаў\nПасля пакупак Алан мае 120 прадметаў + 80 прадметаў = <<120+80=200>>200 агульна кукурузы і канолі разам.\n#### 200\n"
