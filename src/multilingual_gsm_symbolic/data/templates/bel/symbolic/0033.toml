question = "Карал і Джэніфер — сястры з Лос-Анджэлес, якія любяць збіраць аўтографы ад знаменітасцей. Падчас летніх канікул з навучання сястры праводзяць кожны дзень пасля абеду, збіраючы аўтографы. Пасля пяці тыдняў Карал і Джэніфер параўноўваюць свае кнігі аўтографаў, падлічваючы колькасць аўтографаў, якія сабрала кожная сястра. Карал мае 20 аўтографаў у сваёй кнізе, а Джэніфер — 44. У сястраў яшчэ ёсць тры тыдні летніх канікул, і яны вырашаюць, што хочуць дайсці да 100 аўтографаў разам да канца канікул. Колькі аўтографаў трэба сабраць сястрам, каб дасягнуць сваёй мэты?"
