question_annotated = "{name, Сэні} прадае {food,імбірныя прянікі} і {fruit,яблычны} пирог для збору сродкаў. У {d1,суботу}, ён прадаў {n1,10} скрынак {food,імбірных прянікоў} і {m1,4} менш скрынак {fruit,яблычнага} пірага, чым у {d2,нядзелю}. У {d2,нядзелю}, ён прадаў {n2,5} больш скрынак {food,імбірных прянікоў}, чым у {d1,суботу}, і {m2,15} скрынак {fruit,яблычнага} пірага. Калі {food,імбірныя прянікі} каштуюць {cur,$}{cn,6}, а {fruit,яблычны} пирог {cur,$}{cm,15}, колькі {name,Сэні} зарабіў за два дні?\n\n#init:\n- name = sample(names_male)\n- fruit = sample(fruits)\n- cur = sample(currencies_sym)\n- food = sample([\"імбірныя прянікі\", \"печыва\", \"браўні\", \"мафіны\", \"капкейкі\"])\n- d1, d2 = sample_sequential(weekdays, 2)\n- $n1 = range(21, 30)\n- $n2 = range(11, 15)\n- $m1 = range(4, 20)\n- $m2 = range(15, 30)\n- $cn = range(7, 13)\n- $cm = range(20, 33)\n\n#conditions:\n- m1 < m2\n\n#answer: (2*n1+n2)*cn + (2*m2-m1)*cm\n"
answer_annotated = "Ён прадаў {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} скрынак {food} у {d2}.\nАгульная колькасць скрынак {food}, якія {name} прадаў, роўная {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} зарабіў {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} за продаж {food}.\nЁн прадаў {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} скрынак {fruit} пірага ў {d1}.\nАгульная колькасць скрынак {fruit} пірага, якія {name} прадаў, роўная {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nЁн зарабіў {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} за продаж {fruit} пірага.\nТакім чынам, {name} зарабіў {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} за два дні.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
