question = "Сэні прадае імбірныя прянікі і яблычны пирог для збору сродкаў. У суботу ён прадаў 10 скрынак імбірных прянікоў і на 4 скрынкі менш яблычнага пірага, чым у нядзелю. У нядзелю ён прадаў на 5 скрынак імбірных прянікоў больш, чым у суботу, і 15 скрынак яблычнага пірага. Калі імбірныя прянікі каштуюць $6, а яблычны пирог $15, колькі Сэні зарабіў за два дні?"
answer = "Ён прадаў 10 + 5 = <<10+5=15>>15 скрынак імбірных прянікоў у нядзелю.\nАгульная колькасць скрынак імбірных прянікоў, якія Сэні прадаў, роўная 10 + 15 = <<10+15=25>>25.\nСэні зарабіў 25*$6 = $<<25*6=150>>150 за продаж імбірных прянікоў.\nЁн прадаў 15 - 4 = <<15-4=11>>11 скрынак яблычнага пірага ў суботу.\nАгульная колькасць скрынак яблычнага пірага, якія Сэні прадаў, роўная 15 + 11 = <<15+11=26>>26.\nЁн зарабіў 26*$15 = $<<26*15=390>>390 за продаж яблычнага пірага.\nТакім чынам, Сэні зарабіў $150 + $390 = $<<150+390=540>>540 за два дні.\n#### 540\n"
