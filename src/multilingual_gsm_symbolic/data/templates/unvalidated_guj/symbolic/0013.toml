question = "મેરી એક ઉત્સાહી બગીચી છે. કલ, તેણે તેના પ્રિય છોડની નર્સરી પાસેથી 18 નવા કૂંડાવાળા છોડ મેળવ્યા. તે પહેલેથી જ તેના મોટા ગ્રામ્ય ઘરની 40 ખિડકીની જાંબીઓ પર દરેક પર 2 કૂંડાવાળા છોડ ધરાવે છે. દાનવીર ભાવનાથી, તેણે નક્કી કર્યું છે કે તે કાલે મિત્રો અને પરિવારને દરેક જાંબીમાંથી 1 કૂંડાવાળા છોડ આપશે. મેરી પાસે કેટલા કૂંડાવાળા છોડ બાકી રહેશે?"
