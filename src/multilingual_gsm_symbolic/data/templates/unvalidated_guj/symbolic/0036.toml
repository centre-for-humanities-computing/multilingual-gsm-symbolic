question = "તુલા બેકરી માં ગઈ અને વિવિધ પ્રકારની પેસ્ટ્રી ખરીદી. તેણે 3 ડઝન ડોનટ્સ ખરીદ્યા જેના ભાવ $68 પ્રતિ ડઝન હતા, 2 ડઝન માઈની કપકેક્સ જેના ભાવ $80 પ્રતિ ડઝન હતા, અને 6 ડઝન માઈની ચીઝકેક્સ $55 પ્રતિ ડઝન નિમિત્તે. કુલ ખર્ચ કેટલો હતો?"
