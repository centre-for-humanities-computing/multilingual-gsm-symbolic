question = "莎莉去海邊度假。她的父母給了她 $15，讓她買任何她想要的東西。在紀念品店，太妃糖正在特價：「以每磅 $3 購買 1 磅，另 1 磅可享 1/2 折扣。」此優惠每湊滿一組即可重複適用，不足一組的部分按原價計算。她裝了 4 磅。她另外還買了一袋混合貝殼，價格是 $1.5，還買了 4 個磁鐵，每個 $0.25。莎莉還剩下多少錢？"
answer = "莎莉每購買 1 磅就以每磅 $3 計價，另外 1 磅享有 1/2 折扣，所以每組 2 磅的價格是 1*$3 + 1*$3*(1-1/2) = $4.5\n她裝了 4 磅，可湊成 2 組，另有 0 磅按原價計算，所以太妃糖的費用是 2*$4.5 + 0*$3 = $9\n4 個磁鐵每個 $0.25，所以 4*0.25=$<<4*0.25=1>>1\n把她所有購買的東西加起來，$9+$1.5+$1 = $<<9+1.5+1=11.5>>11.5\n她原本有 $15，花了 $11.5，所以她還剩下 $15-$11.5 = $<<15-11.5=3.5>>3.5\n#### 3.5\n"
id_orig = 410
id_shuffled = 40
question_annotated = "{name,莎莉}去海邊度假。她的父母給了她 ${total,15}，讓她買任何她想要的東西。在紀念品店，太妃糖正在特價：「以每磅 ${p1,3} 購買 {n1,1} 磅，另 {n2,1} 磅可享 {discount,1/2} 折扣。」此優惠每湊滿一組即可重複適用，不足一組的部分按原價計算。她裝了 {n12,4} 磅。她另外還買了一袋混合貝殼，價格是 ${p2,1.5}，還買了 {n3,4} 個磁鐵，每個 ${p3,0.25}。{name,莎莉}還剩下多少錢？\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-((n12//(n1+n2))*(n1+n2*(1-discount))*p1+(n12%(n1+n2))*p1+p2+n3*p3)"
answer_annotated = "{name}每購買 {n1} 磅就以每磅 ${p1} 計價，另外 {n2} 磅享有 {discount} 折扣，所以每組 {n1+n2} 磅的價格是 {n1}*${p1} + {n2}*${p1}*(1-{discount}) = ${float((n1+n2*(1-discount))*p1)}\n她裝了 {n12} 磅，可湊成 {n12//(n1+n2)} 組，另有 {n12%(n1+n2)} 磅按原價計算，所以太妃糖的費用是 {n12//(n1+n2)}*${float((n1+n2*(1-discount))*p1)} + {n12%(n1+n2)}*${p1} = ${float(n12//(n1+n2)*(n1+n2*(1-discount))*p1+n12%(n1+n2)*p1)}\n{n3} 個磁鐵每個 ${p3}，所以 {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\n把她所有購買的東西加起來，${float(n12//(n1+n2)*(n1+n2*(1-discount))*p1+n12%(n1+n2)*p1)}+${p2}+${n3*p3} = $<<{float(n12//(n1+n2)*(n1+n2*(1-discount))*p1+n12%(n1+n2)*p1)}+{p2}+{n3*p3}={float((n12//(n1+n2))*(n1+n2*(1-discount))*p1+(n12%(n1+n2))*p1+p2+n3*p3)}>>{float((n12//(n1+n2))*(n1+n2*(1-discount))*p1+(n12%(n1+n2))*p1+p2+n3*p3)}\n她原本有 ${total}，花了 ${float((n12//(n1+n2))*(n1+n2*(1-discount))*p1+(n12%(n1+n2))*p1+p2+n3*p3)}，所以她還剩下 ${total}-${float((n12//(n1+n2))*(n1+n2*(1-discount))*p1+(n12%(n1+n2))*p1+p2+n3*p3)} = $<<{total}-{float((n12//(n1+n2))*(n1+n2*(1-discount))*p1+(n12%(n1+n2))*p1+p2+n3*p3)}={float(total-((n12//(n1+n2))*(n1+n2*(1-discount))*p1+(n12%(n1+n2))*p1+p2+n3*p3))}>>{float(total-((n12//(n1+n2))*(n1+n2*(1-discount))*p1+(n12%(n1+n2))*p1+p2+n3*p3))}\n#### {float(total-((n12//(n1+n2))*(n1+n2*(1-discount))*p1+(n12%(n1+n2))*p1+p2+n3*p3))}\n"
