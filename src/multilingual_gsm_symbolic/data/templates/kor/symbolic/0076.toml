question = "데안드레는 지난 월요일 3마리의 참치를 잡았습니다, 첫 번째 참치의 무게는 56 킬로그램이며, 두 번째 참치의 무게는 46 킬로그램이고, 나머지 참치의 무게는 26 킬로그램입니다. 만약 참치 1 킬로그램당 가격이 $0.5라면, 시장에 모든 참치를 판 후 그는 얼마를 벌게 될까요?"
