question_annotated = "{name,サリー}는 휴가를 위해 해변으로 갔다. 부모님은 그녀가 원하는 것을 살 수 있도록 ${total,15}를 주셨다. 기념품 가게에서 타피는 \"{n1,1} 파운드당 ${p1,3}에 구매 시, {n2,1} 파운드는 {discount,1/2} 할인\" 세일 중이었다. 그녀는 {n12,4} 파운드를 퍼 올렸다. 그녀는 또한 ${p2,1.5}의 조개껍질 꾸러미와 ${p3,0.25}씩 하는 {n3,4}개의 자석을 사기도 했다. {name,サリー}는 얼마의 돈을 남겼나요?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name}는 ${p1}에 {n1} 파운드를 구매하고 {n2} 파운드 {discount} 할인을 받는다. 그래서 {n2} 파운드의 {discount} 할인은 ${p1}*{discount} = ${float(n2*discount*p1)}이다. 나머지 {n12-n1-n2} 파운드는 할인이 적용되지 않아 {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}이고, 따라서 총액은 ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}이다.\n{n3}개의 자석은 각각 ${p3}로 {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}이다.\n모든 구매를 합하면, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}이다.\n그녀는 ${total}를 가지고 있었고 ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}를 썼으므로 ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} 남았다.\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
