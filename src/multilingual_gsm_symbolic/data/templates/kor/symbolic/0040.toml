question = "サリー는 휴가를 위해 해변으로 갔다. 부모님은 그녀가 원하는 것을 살 수 있도록 $15를 주셨다. 기념품 가게에서 타피는 \"1 파운드당 $3에 구매 시, 1 파운드는 1/2 할인\" 세일 중이었다. 그녀는 4 파운드를 퍼 올렸다. 그녀는 또한 $1.5의 조개껍질 꾸러미와 $0.25씩 하는 4개의 자석을 사기도 했다. サリー는 얼마의 돈을 남겼나요?"
answer = "サリー는 $3에 1 파운드를 구매하고 1 파운드 1/2 할인을 받는다. 그래서 1 파운드의 1/2 할인은 $3*1/2 = $1.5이다. 나머지 2 파운드는 할인이 적용되지 않아 2*$3 = $6이고, 따라서 총액은 $3+$3/2+$6=$21/2이다.\n4개의 자석은 각각 $0.25로 4*0.25=$<<4*0.25=1>>1이다.\n모든 구매를 합하면, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13이다.\n그녀는 $15를 가지고 있었고 $13를 썼으므로 $15-$13 = $<<15-13=2>>2 남았다.\n#### 2\n"
