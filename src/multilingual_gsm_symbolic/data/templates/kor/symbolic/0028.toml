question = "병원는 1000개의 침대 수용 능력을 가지고 있으며, 1/5가 점유되어 있습니다. 코로나 유행으로 인해 매일 50명의 환자가 병원에 입원합니다. 2 주 후 병원의 비어있는 침대 총수를 계산하십시오."
answer = "병원의 침대 총 수용 능력 중 1/5이 점유되어 있다면, 이는 1/5 * 1000 = <<1000*1/5=200>>200 개의 침대에 환자가 있다는 것을 의미합니다.\n새로운 입원이 없는 병원의 침대 총수는 1000개의 침대 - 200개의 침대 = <<1000-200=800>>800개의 침대입니다.\n매일 50명이 입원한다면, 병원의 1 주 후 환자 총수는 50명/일 * 7 일/주 = 350명입니다.\n2 주 후 병원에 입원한 환자 총수는 350명/주 * 2주 = <<350*2=700>>700명이며, 각자 하나의 침대을 사용합니다.\n새로운 입원 전 병원에 800개의 비어있는 침대이 있었다면, 총수는 800개의 침대 - 700개의 침대 = <<800-700=100>>100개의 비어있는 침대으로 줄어듭니다.\n#### 100\n"
