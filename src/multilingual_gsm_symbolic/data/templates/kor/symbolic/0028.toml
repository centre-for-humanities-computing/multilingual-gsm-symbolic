answer_annotated = "{facility}의 {item} 총 수용 능력 중 {frac}이 점유되어 있다면, 이는 {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} 개의 {item}에 환자가 있다는 것을 의미합니다.\n새로운 입원이 없는 {facility}의 {item} 총수는 {total}개의 {item} - {int(total*frac)}개의 {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)}개의 {item}입니다.\n매일 {daily}명이 입원한다면, {facility}의 1 주 후 환자 총수는 {daily}명/일 * 7 일/주 = {daily*7}명입니다.\n{period} 주 후 {facility}에 입원한 환자 총수는 {daily*7}명/주 * {period}주 = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7}명이며, 각자 하나의 {item}을 사용합니다.\n새로운 입원 전 {facility}에 {total-int(total*frac)}개의 비어있는 {item}이 있었다면, 총수는 {total-int(total*frac)}개의 {item} - {daily*period*7}개의 {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)}개의 비어있는 {item}으로 줄어듭니다.\n#### {total - (total * frac + daily * period * 7)}\n"
