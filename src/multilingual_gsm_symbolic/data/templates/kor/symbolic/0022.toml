question = "줄리아는 집에서 저녁 파티를 준비하고 있었으며, 그곳에서 스튜를 제공하려 했습니다. 그녀는 플라스틱 숟가락이 없다는 것을 알았으므로, 새로운 한 팩의 숟가락을 샀습니다. 나중에, 그녀의 남편도 5 개의 새로운 숟가락 팩을 사서 줄리아에게 주었습니다. 줄리아가 스튜를 만드는 동안, 그녀는 세 개의 숟가락를 사용하여 스튜를 시식했습니다. 나중에, 식탁을 차리러 갔을 때, 그녀는 총 12 개의 숟가락이 있었습니다. 줄리아가 산 팩에는 몇 개의 숟가락이 있었나요?"
