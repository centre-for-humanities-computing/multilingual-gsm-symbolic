question = "캐롤 과 제니퍼 는 로스앤젤레스 출신으로 유명인 들의 사인을 수집하는 것을 좋아하는 자매입니다. 학교에서 여름방학 동안, 자매들은 매일 오후에 사인을 수집합니다. 다섯 주 후, 캐롤 과 제니퍼 는 사인책을 비교하며 각자가 수집한 사인 수를 세어봅니다. 캐롤 의 책에는 20 개의 사인이 있고, 제니퍼 는 44 개입니다. 자매들에게는 세 주 더 남은 여름방학 이 있으며, 방학이 끝날 때까지 두 사람이 합쳐서 100 개의 사인에 도달하기로 결정했습니다. 목표를 달성하기 위해 자매들은 몇 개의 사인을 더 수집해야 합니까?"
