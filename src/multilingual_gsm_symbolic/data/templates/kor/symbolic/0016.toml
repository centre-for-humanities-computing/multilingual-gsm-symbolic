answer_annotated = "그는 {d2}에 {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2}상자의 {food}를 판매했습니다.\n{name}이 판매했던 {food}의 총 상자 수는 {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}입니다.\n{name}은 {food}를 팔아 {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn}을 벌었습니다.\n그는 {d1}에 {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1}상자의 {fruit} 파이를 판매했습니다.\n{name}이 판매했던 {fruit} 파이의 총 상자 수는 {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}입니다.\n그는 {fruit} 파이를 팔아 {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm}을 벌었습니다.\n따라서, {name}은 이틀 동안 {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm}을 벌었습니다.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
