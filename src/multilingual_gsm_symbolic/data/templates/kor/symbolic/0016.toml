question = "서니는 기금 마련을 위해 생강빵과 사과 파이를 팔고 있습니다. 토요일에 그는 10상자의 생강빵과 일요일보다 4상자 적은 사과 파이를 판매했습니다. 일요일에 그는 토요일보다 5상자 더 많은 생강빵과 15상자의 사과 파이를 판매했습니다. 만약 생강빵이 ₩6이고 사과 파이가 ₩15라면, 서니는 이틀 동안 얼마를 벌었습니까?"
answer = "그는 일요일에 10 + 5 = <<10+5=15>>15상자의 생강빵를 판매했습니다.\n서니이 판매했던 생강빵의 총 상자 수는 10 + 15 = <<10+15=25>>25입니다.\n서니은 생강빵를 팔아 25*₩6 = ₩<<25*6=150>>150을 벌었습니다.\n그는 토요일에 15 - 4 = <<15-4=11>>11상자의 사과 파이를 판매했습니다.\n서니이 판매했던 사과 파이의 총 상자 수는 15 + 11 = <<15+11=26>>26입니다.\n그는 사과 파이를 팔아 26*₩15 = ₩<<26*15=390>>390을 벌었습니다.\n따라서, 서니은 이틀 동안 ₩150 + ₩390 = ₩<<150+390=540>>540을 벌었습니다.\n#### 540\n"
