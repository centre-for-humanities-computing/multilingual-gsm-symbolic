question = "아티는 농산물 시장에서 꽃 노점을 운영하고 있습니다. 그는 세 가지 종류의 꽃을 팝니다: 금잔화, 페튜니아 및 베고니아입니다. 그는 보통 금잔화를 분당 $2.74에, 페튜니아를 분당 $1.87에, 베고니아를 분당 $2.12에 팝니다. 아티는 오늘 잔돈이 없어서, 모든 가격을 달러 단위에서 가장 가까운 정수로 반올림하기로 했습니다. 아티가 금잔화 12분, 페튜니아 9분, 베고니아 17분을 판다면, 얼마를 벌게 될까요?"
