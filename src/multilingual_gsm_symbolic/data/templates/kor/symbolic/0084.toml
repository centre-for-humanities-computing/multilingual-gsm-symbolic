question = "마리아는 8주의 주식을 $8에 각각 구매합니다. 주가는 마리아가 보유하는 첫 번째 해에 50% 상승하고, 그런 다음 두 번째 해에 25% 하락합니다. 마리아의 모든 주식의 최종 가치는 얼마입니까?"
