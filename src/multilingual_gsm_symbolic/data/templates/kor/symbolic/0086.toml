question = "앨리슨이 달리기 팀에 선정되어, 그녀는 운동 용품을 사러 쇼핑을 갔습니다. 그녀는 민소매 셔츠를 $10에, 민소매 셔츠 가격보다 $5 더 비싼 달리기 반바지 한 벌을, 그리고 원래 $48 이었지만 절반 가격에 세일 중인 테니스화 한 켤레를 샀습니다. 그녀가 함께 산 $8 운동 양말 패키지에 대해 $2 할인 쿠폰이 있었습니다. 그녀는 운동 용품에 총 얼마를 썼습니까?"
answer = "반바지는 민소매 셔츠보다 $5 더 비쌌으므로, 가격은 $5 + $10 = $<<5+10=15>>15입니다.\n그녀의 테니스화는 원래 $48 가격의 절반였으므로, 가격은 $48*1/2=$24입니다.\n쿠폰을 사용하면 양말는 $8 - $2 = $<<8-2=6>>6입니다.\n민소매 셔츠, 반바지, 테니스화, 양말를 합쳐서 총 $10 + $15 + $24 + $6 = $<<10+15+24+6=55>>55입니다.\n#### 55\n"
