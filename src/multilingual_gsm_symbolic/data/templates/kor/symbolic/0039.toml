question = "관리자는 80개의 교실이 있는 학교를 청소해야 합니다. 그들은 5일 안에 끝내야 합니다. 교실당 15분이 걸립니다. 하루에 8시간 일한다면, 하루 중 평균 몇 퍼센트를 교실 청소하는 데 보낼까요?"
