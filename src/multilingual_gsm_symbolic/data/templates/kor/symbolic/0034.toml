question = "씨 김 는 그의 집 을 400,000 달러에 판매했습니다. 그는 판매 가격의 3% 에 해당하는 이전 수수료를 지불했고, 판매 가격의 5% 인 중개 수수료도 지불했습니다. 만약 그가 집 의 잔여 대출 금액으로 250,000 달러도 지불했다면, 씨 김 의 집 판매 순수익은 얼마입니까?"
