question = "60문제 퀴즈에서, 문제의 40%는 쉬운 문제입니다. 나머지는 중간 문제와 어려운 문제로 균등하게 나뉩니다. 아리가 쉬운 문제의 75%를 확실히 맞춘다면, 중간 문제와 어려운 문제의 절반을 정확히 맞춘다면, 그녀는 몇 점을 확실히 받을 수 있습니까?"
answer = "중간와 어려운 문제는 퀴즈의 100% - 40% = 60%를 차지합니다.\n60 문제 * 40/100 = <<60*40/100=24>>24 개의 쉬운 문제가 있습니다.\n총 60 문제 * 60/100 = <<60*60/100=36>>36 개의 중간와 어려운 문제가 있습니다.\n아리이 쉬운 문제의 75%를 확실히 맞춘다면, 이는 24 문제 * 75/100 = <<24*75/100=18>>18 점을 확신한다는 뜻입니다.\n중간와 어려운 문제에서, 그녀는 절반을 정확히 맞춘 것이므로 36 문제 * 1/2 = <<36*1/2=18>>18 점입니다.\n따라서, 그녀는 퀴즈에서 18 점 + 18 점 = <<18+18=36>>36 점을 확실히 받습니다.\n#### 36\n"
