question = "영양 정보에 따르면, 감자칩 한 봉지에는 포션당 250 칼로리가 있습니다. 만약 300 그램 한 봉지에 5 포션이 있다면, 일일 칼로리 목표가 2000이고 이미 1800 칼로리를 섭취했다면 몇 그램을 먹을 수 있나요?"
answer = "총 칼로리 목표가 2000이고 1800 칼로리를 섭취했다면, 먹을 수 있는 칼로리는 2000-1800 = <<2000-1800=200>>200 칼로리입니다\n감자칩 한 포션당 250 칼로리가 있고 먹을 수 있는 칼로리가 200뿐이라면, 한 포션의 200/250만큼만 먹을 수 있습니다 = 4/5 포션\n감자칩 300 그램 한 봉지에는 5 포션이 들어있으므로, 한 포션당 300 그램/5 = <<300/5=60>>60 그램입니다\n한 포션의 4/5만큼만 먹을 수 있다면, 60 그램 * 4/5 = 48 그램만 먹을 수 있습니다\n#### 48\n"
