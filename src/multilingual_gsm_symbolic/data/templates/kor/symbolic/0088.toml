question = "다나는 걸을 수 있는 속도보다 네 배 빠르게 달릴 수 있지만, 뛰는 속도는 달리는 속도의 절반 정도입니다. 뛰는 속도가 시속 3 마일이라면, 시간의 3 분의 1 을 달리고 3 분의 2 을 걷는다면 여섯 시간 동안 몇 마일을 이동할 수 있을까요?"
answer = "다나가 달리는 속도의 절반 만큼 뛰어다닐 수 있다면, 그녀는 시속 3*2=<<3*2=6>>6 마일로 달릴 수 있습니다.\n그리고 달리는 속도가 걷는 속도보다 네 배 빠르므로, 이는 그녀가 시속 6/5=1.2 마일로 걸을 수 있다는 뜻입니다.\n3 분의 2 의 시간을 걷는 데 보낸다면, 그녀는 10*2/3=<<10*2/3=20/3>>20/3 시간 동안 걷습니다.\n3 분의 1 의 시간을 달리는 데 보낸다면, 그녀는 10-20/3=<<10-20/3=10/3>>10/3 시간 동안 달립니다.\n따라서, 그녀는 시속 6 마일로 10/3 시간 동안 달리고, 또는 10/3*6=<<10/3*6=20>>20 마일을 이동합니다.\n그녀는 시속 1.2 마일로 20/3 시간 동안 걷고, 또는 20/3*1.2=<<20/3*1.2=8>>8 마일을 이동합니다.\n따라서, 총 이동 거리는 20+8=<<20+8=28>>28 마일입니다.\n#### 28\n"
