question = "앨런의 집에는 카놀리보다 옥수수가 두 배 더 많습니다. 그는 집에 총 40개의 카놀리가 있습니다. 앨런은 상점에서 60개의 카놀리를 더 샀고 카놀리 수보다 40개 적은 옥수수를 샀습니다. 앨런이 집에 있는 옥수수와 카놀리의 총합을 구하세요?"
answer = "옥수수와 카놀리를 구매하기 전에, 앨런는 카놀리보다 옥수수가 두 배 더 있었습니다. 이는 40개의 카놀리 * 5 옥수수/카놀리 = <<40*5=200>>200개의 옥수수입니다\n앨런가 이전에 가지고 있던 옥수수와 카놀리의 총수는 200개의 옥수수 + 40개의 카놀리 = <<200+40=240>>240개입니다\n카놀리보다 40개 적은 옥수수를 샀을 때, 그는 60개의 옥수수 - 40개의 옥수수 = <<60-40=20>>20개의 옥수수를 샀습니다\n총합, 그는 20개의 옥수수 + 60개의 카놀리 = <<20+60=80>>80개를 샀습니다\n구매 후, 앨런는 240개 + 80개 = <<240+80=320>>320개의 총 옥수수와 카놀리를 가지고 있습니다.\n#### 320\n"
