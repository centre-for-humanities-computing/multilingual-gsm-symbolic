question = "모건의 아빠는 그녀가 생일 파티를 위해 $90의 예산을 마련했다고 말했다. 그녀는 그녀와 친구들이 모두 미니 골프를 한 번 하고, $5의 게임 센터 토큰을 가지고, 카트를 두 번 탈 수 있도록 하고 싶어 한다. 미니 골프 한 라운드는 $5이다. 카트는 한 번 타는데 $10이다. 그녀는 친구를 몇 명 초대할 수 있을까?"
