question = "마르타는 손주 3 명을 위해 겨울 옷을 뜨개질하고 있습니다. 그들은 세쌍둥이이므로 모두 같은 크기입니다. 그녀는 그들 각각을 위해 모자, 스카프, 스웨터, 목장갑, 그리고 양말을 만들려고 합니다. 모자를 만드는 데 2 권의 털실이, 스카프는 4 권, 스웨터는 12 권, 목장갑 한 켤레는 1 권, 그리고 양말 한 켤레는 2 권이 필요합니다. 그녀는 몇 권의 털실을 사야 할까요?"
