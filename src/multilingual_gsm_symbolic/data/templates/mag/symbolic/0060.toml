question = "वॉटसन प्रति दिन 10-घंटे की शिफ्ट काम करेला, सप्ताह मँ पाँच दिन। वो प्रति घंटा ₹10 कमावत छे और अगर कंपनी अच्छा काम करे त तो सप्ताह मँ ₹300 बोनस पावत छे। अगर कंपनी पूरा महीना बहुत अच्छा परफॉर्म करल, त वॉटसन ने अप्रैल मँ कितना पैसा कमाए?"
