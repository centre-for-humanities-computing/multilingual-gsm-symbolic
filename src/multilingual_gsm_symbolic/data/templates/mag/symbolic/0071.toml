question = "नैट अपने पशुओं को घास खिला रहा है। प्रत्येक बकरी को 5 पाउंड चाहिए, और प्रत्येक लामा को प्रत्येक बकरी की जरूरत से दोगुनी मात्रा से 3 पाउंड कम चाहिए। अगर 15 बकरी और 12 लामा हैं, तो नैट को कितने पाउंड घास चाहिए?"
