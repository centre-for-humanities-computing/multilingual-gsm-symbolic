question = "एक अस्पताल की क्षमता 1000 बिस्तर है जिसमें 1/5 भरे हुए हैं। कोरोनावायरस प्रकोप के कारण, अस्पताल में प्रति दिन 50 मरीज भर्ती होते हैं। 2 सप्ताह बाद अस्पताल में खाली बिस्तर की कुल संख्या की गणना करें।"
answer = "यदि अस्पताल की कुल क्षमता का 1/5 बिस्तर भरा हुआ है, तो इसका मतलब है 1/5 * 1000 = <<1000*1/5=200>>200 बिस्तर पर मरीज उपयोग कर रहे हैं।\nबिना नए भर्ती के अस्पताल में बिस्तर की कुल संख्या 1000 बिस्तर - 200 बिस्तर = <<1000-200=800>>800 बिस्तर है।\nयदि प्रति दिन 50 लोग भर्ती होते हैं, तो एक सप्ताह बाद अस्पताल में मरीजों की कुल संख्या 50 मरीज/दिन * 7 दिन/सप्ताह = 350 मरीज है।\n2 सप्ताह बाद, अस्पताल में भर्ती किए गए मरीजों की कुल संख्या 350 मरीज/सप्ताह * 2 सप्ताह = <<350*2=700>>700 मरीज है, जो प्रत्येक एक बिस्तर का उपयोग करते हैं।\nयदि नए भर्ती से पहले अस्पताल में 800 बिस्तर खाली थे, तो कुल संख्या घटकर 800 बिस्तर - 700 बिस्तर = <<800-700=100>>100 खाली बिस्तर रह जाता है।\n#### 100\n"
