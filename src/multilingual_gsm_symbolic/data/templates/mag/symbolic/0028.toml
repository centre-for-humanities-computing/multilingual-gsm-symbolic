answer_annotated = "यदि {facility} की कुल क्षमता का {frac} {item} भरा हुआ है, तो इसका मतलब है {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} पर मरीज उपयोग कर रहे हैं।\nबिना नए भर्ती के {facility} में {item} की कुल संख्या {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item} है।\nयदि प्रति दिन {daily} लोग भर्ती होते हैं, तो एक सप्ताह बाद {facility} में मरीजों की कुल संख्या {daily} मरीज/दिन * 7 दिन/सप्ताह = {daily*7} मरीज है।\n{period} सप्ताह बाद, {facility} में भर्ती किए गए मरीजों की कुल संख्या {daily*7} मरीज/सप्ताह * {period} सप्ताह = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} मरीज है, जो प्रत्येक एक {item} का उपयोग करते हैं।\nयदि नए भर्ती से पहले {facility} में {total-int(total*frac)} {item} खाली थे, तो कुल संख्या घटकर {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} खाली {item} रह जाता है।\n#### {total - (total * frac + daily * period * 7)}\n"
