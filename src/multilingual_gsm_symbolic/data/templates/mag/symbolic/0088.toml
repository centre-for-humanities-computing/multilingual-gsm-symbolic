answer = "जे दाना उछल सकत आधा रफ्तार से जितना दौर सकत, तब उ दौर सकत 3*2=<<3*2=6>>6 मील प्रति घंटा।\nआ जे उ दौर सकत चार गुना तेज चलल से, इ मतलब उ चल सकत 6/5=1.2 मील प्रति घंटा।\nजे दो तिहाई समय चलत में बिताबल जाए, तब उ चलत 6*2/3=<<6*2/3=4>>4 घंटा।\nजे एक तिहाई समय दौरत में बिताबल जाए, तब उ दौरत 6-4=<<6-4=2>>2 घंटा।\nएत, उ दौरत 2 घंटा 6 मील प्रति घंटा पर, या 2*6=<<2*6=12>>12 मील।\nउ चलत 4 घंटा 1.2 मील प्रति घंटा पर, या 4*1.2=<<4*1.2=24/5>>24/5 मील।\nएत, कुल, उ तय करत 12+24/5=<<12+24/5=16>>16 मील।\n#### 16\n"
