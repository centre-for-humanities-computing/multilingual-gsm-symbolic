question = "श्री तन ने अपना घर $400,000 पर बेच दिया। उसने हस्तांतरण शुल्क का भुगतान किया जो बिक्री मूल्य का 3% है और भी दलाली शुल्क का भुगतान किया जो बिक्री मूल्य का 5% है। यदि उसने $250,000 का भुगतान किया घर की शेष लोन राशि के लिए, तो श्री तन की घर बेचने से शुद्ध प्राप्ति कितनी होगी?"
