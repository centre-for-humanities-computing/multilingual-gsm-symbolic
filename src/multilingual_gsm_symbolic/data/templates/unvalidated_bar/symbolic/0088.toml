question = "Dana ko viermoi schnella renna wia gaung, owa sie ko a Tempo hupfn, des is halb so schnel wia sie renna ko. Wann sie bei 3 Kilometa pro Stund hupfn ko, wia vui Kilometa ko sie in sechs Stund zruagleegn, wann sie a drittel vo da Zeit rennt und zwoa drittel vo da Zeit gaungt?"
answer = "Wann Dana bei halb vo da Gschwindigkeit wos sie renna ko hupfn ko, daun ko sie bei 3*5/3=<<3*5/3=5>>5 Kilometa pro Stund renna.\nUnd weil sie a Gschwindigkeit renna ko, de viermoi schnella is wia gaung, des hoaßt sie ko bei 5/4=1.25 Kilometa pro Stund gaung.\nWann zwoa drittel vo da Zeit gaungt wird, daun gaungt sie 6*3/5=<<6*3/5=18/5>>18/5 Stund.\nWann a drittel vo da Zeit rennt wird, daun rennt sie 6-18/5=<<6-18/5=18/5>>18/5 Stund.\nAlso rennt sie 18/5 Stund bei 5 Kilometa pro Stund, oda 18/5*5=<<18/5*5=18>>18 Kilometa.\nSie gaungt 18/5 Stund bei 1.25 Kilometa pro Stund, oda 18/5*1.25=<<18/5*1.25=9/2>>9/2 Kilometa.\nAlso, gsamt, zruaglegt sie 18+9/2=<<18+9/2=22>>22 Kilometa.\n#### 22\n"
