question = "Sally wafika elwandle ukuze anakekele iholide. Abazali bayo bamnikeza $15 ukuthenga into ayayithanda. Kwiivenkile yezinto zokukhumbula, itaifi yayisasele nge-\"Thenga 1 ipawundi ku-$3 ngepawundi, fumana 1 ipawundi 1/2 yehlele.\" Yayithathe 4 zee-pawundi. Wathenga nakwibhegi elixutyiweyo lweemvulophu zolwandle ku-$1.5 kwaye 4 zee-magnets ezazingu-$0.25 nganye. Ingaba u-Sally unemali elingakanani esele?"
answer = "Sally uthenga 1 ipawundi ku-$3 kwaye ufumana 1 ipawundi 1/2 yehlele. Ngoko 1/2 yehlele kwi-1 ipawundi ngu-$3*1/2 = $1.5. Ezinye 2 zee-pawundi azinazo i-discount kwaye zibiza 2*$3 = $6, ngoko isambuku ngu-$3+$3/2+$6=$21/2\n4 zee-magnets ku-$0.25 nganye ngu-4*0.25=$<<4*0.25=1>>1\nXa uyidibanisa yonke imbuyekezo yakhe, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nWayenayo $15 kwaye yachitha $13 ngoko wayenayo $15-$13 = $<<15-13=2>>2 sele\n#### 2\n"
