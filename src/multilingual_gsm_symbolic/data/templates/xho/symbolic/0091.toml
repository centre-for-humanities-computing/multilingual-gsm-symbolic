question = "Ekhaya lika-Allan, kukho kabini zika-ukama kune-ikhanoli. Une-40 zika-ikhanoli zizonke ekhaya lakhe. U-Allan uthenge 60 zika-ikhanoli ezongezelelekileyo kwivenkile kwaye 40 zika-ukama ezincinane kuneenani le-ikhanoli. Fumana isixa sizonke senani le-ukama kunye ne-ikhanoli u-Allan anazo ekhaya?"
