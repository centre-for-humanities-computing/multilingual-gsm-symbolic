question = "Thabo ukondla izilwanyana zakhe umhlwa. I-inkonyane nganye idinga 5 iipawundi, kwaye i-ilama nganye idinga 3 iipawundi ngaphantsi kwe-kabini yobungakanani obudingwa yi-inkonyane nganye. Ukuba kukho 15 inkonyane kunye no-12 ilama, zama iipawundi ezininzi ze-umhlwa u-Thabo adinga?"
