question = "Frankie ubukela i-TV emva kokuba uphela neyomsebenzi wakhe wasekhaya ngalo lonke ubusuku. Kwi Mvulo kunye ne Lwesibini, wabukela umboniso we-1-yure womboniso wakhe oyintandokazi ngaloo busuku ngabunye. Kwi Lwesithathu, wabukela amaboniso ambalwa omboniso we-30-umzuzu. Kwi Lwesine, waphela neyomsebenzi wakhe wasekhaya ngaphambi kwexesha kwaye wabukela umboniso we-1-yure kunye nomboniso we-30-umzuzu. Kwi Lwesihlanu, wagcina ephumle ebusuku, ngoko wabukela iimboniso ezi-ezimbini ze-1-yure. Ukuba wabukela i-7 yure ze-TV zizonke, ingaphi iimboniso ze-30-umzuzu awazibukela kwi Lwesithathu?"
