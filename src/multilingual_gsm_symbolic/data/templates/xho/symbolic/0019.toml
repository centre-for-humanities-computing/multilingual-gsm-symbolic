question = "Kwiimvavanyo ezine-60, 40% yemibuzo zi-ilula, kwaye eziseleyo zahlulwe ngokulinganayo njenge-emaphakathi kunye ne-zinzima imibuzo. Ukuba u-Aries uqinisekile ukufumana 75% yemibuzo ye-ilula, kwaye isiqingatha yemibuzo ye-emaphakathi kunye ne-zinzima ngokuchanekileyo, ziyipoyinti ezingaphi aqinisekileyo ukuzifumana?"
answer = "Imibuzo ye-emaphakathi kunye ne-zinzima zimele 100% - 40% = 60% yemvavanyo.\nKukho imibuzo engu-60 * 40/100 = <<60*40/100=24>>24 imibuzo ye-ilula.\nKukho ngokubanzi imibuzo engu-60 * 60/100 = <<60*60/100=36>>36 imibuzo ye-emaphakathi kunye ne-zinzima.\nUkuba u-Aries uqinisekile ukufumana 75% yemibuzo ye-ilula, oku kuthetha ukuba uqinisekile nge-24 imibuzo * 75/100 = <<24*75/100=18>>18 iipoyinti.\nKwimibuzo ye-emaphakathi kunye ne-zinzima, uqinisekile ukufumana isiqingatha yayo ngokuchanekileyo ngoko oko kungu-36 imibuzo * 1/2 = <<36*1/2=18>>18 iipoyinti.\nNgoko ke, uqinisekile ukufumana 18 iipoyinti + 18 iipoyinti = <<18+18=36>>36 iipoyinti kwiimvavanyo zakhe.\n#### 36\n"
