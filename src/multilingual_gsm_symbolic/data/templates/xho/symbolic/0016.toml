question = "Sunny uyathengisa ijinja-bredi kunye neepayi ze-i-apile zokuhlanganisa imali. Ngosuku lwe-Mgqibelo, wathengisa 10 iibhokisi ze-ijinja-bredi kunye neebhokisi ezi-4 ngaphantsi zeepayi ze-i-apile kune-Cawe. Ngosuku lwe-Cawe, wathengisa 5 iibhokisi ezingaphezulu ze-ijinja-bredi kune-Mgqibelo kunye neebhokisi ezi-15 zeepayi ze-i-apile. Ukuba i-ijinja-bredi ibiza R6 kwaye ipayi ye-i-apile ibiza R15, wenzile malini u-Sunny ngemini emibini?"
answer = "Wathengisa 10 + 5 = <<10+5=15>>15 iibhokisi ze-ijinja-bredi ngosuku lwe-Cawe.\nInani elipheleleyo leebhokisi ze-ijinja-bredi ezithengiswe ngu-Sunny ngu-10 + 15 = <<10+15=25>>25.\nU-Sunny wenzile 25*R6 = R<<25*6=150>>150 ngokuthengisa i-ijinja-bredi.\nWathengisa 15 - 4 = <<15-4=11>>11 iibhokisi zeepayi ze-i-apile ngosuku lwe-Mgqibelo.\nInani elipheleleyo leebhokisi zeepayi ze-i-apile ezithengiswe ngu-Sunny ngu-15 + 11 = <<15+11=26>>26.\nWenzile 26*R15 = R<<26*15=390>>390 ngokuthengisa iipayi ze-i-apile.\nNgoko, u-Sunny wenzile R150 + R390 = R<<150+390=540>>540 ngemini emibini.\n#### 540\n"
