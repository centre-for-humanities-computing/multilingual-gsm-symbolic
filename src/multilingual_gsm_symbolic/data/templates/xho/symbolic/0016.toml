answer_annotated = "Wathengisa {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} iibhokisi ze-{food} ngosuku lwe-{d2}.\nInani elipheleleyo leebhokisi ze-{food} ezithengiswe ngu-{name} ngu-{n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\nU-{name} wenzile {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} ngokuthengisa i-{food}.\nWathengisa {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} iibhokisi zeepayi ze-{fruit} ngosuku lwe-{d1}.\nInani elipheleleyo leebhokisi zeepayi ze-{fruit} ezithengiswe ngu-{name} ngu-{m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nWenzile {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} ngokuthengisa iipayi ze-{fruit}.\nNgoko, u-{name} wenzile {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} ngemini emibini.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
