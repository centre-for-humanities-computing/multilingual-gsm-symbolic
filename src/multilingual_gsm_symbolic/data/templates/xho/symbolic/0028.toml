question = "I-isibhedlele inumthamo we-1000 ibhedi ne-1/5 zithathwe. Ngenxa ye-ukubhabha kwe-coronavirus, 50 abaguli bayafakwa kwi-isibhedlele ngemini nganye. Bala inani elipheleleyo le-ibhedi ezipheleleyo kwi-isibhedlele emva kweveki ezi-2."
answer = "Ukuba 1/5 yomthamo opheleleyo we-isibhedlele ibhedi zithathwe, okuthetha ukuthi 1/5 * 1000 = <<1000*1/5=200>>200 ibhedi zineziguli ezisebenzisa zazo.\nInani elipheleleyo le-ibhedi kwi-isibhedlele ngaphandle kwezigqibo ezintsha ngu 1000 ibhedi - 200 ibhedi = <<1000-200=800>>800 ibhedi.\nUkuba abantu abangama-50 bayafakwa ngemini nganye, inani elipheleleyo labaguli kwi-isibhedlele emva kweveki enye ngu 50 abaguli/ngemini * iintsuku eziyi-7/iveki = 350 abaguli.\nEmva kweveki ezi-2, inani elipheleleyo labaguli abafakiweyo kwi-isibhedlele ngu 350 abaguli/iveki * iiveki ezi-2 = <<350*2=700>>700 abaguli, abasebenzisa ibhedi enye ngamnye.\nUkuba kwakukho 800 ibhedi ezipheleleyo kwi-isibhedlele phambi kwezigqibo ezintsha, inani elipheleleyo linciphela kwi-800 ibhedi - 700 ibhedi = <<800-700=100>>100 ibhedi ezipheleleyo.\n#### 100\n"
