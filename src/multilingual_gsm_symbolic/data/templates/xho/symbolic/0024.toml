question = "Ngokwemininingwane yezondlo, ibhegi le-ichips line-250 iikhalori ngeisevisi. Ukuba ibhegi le-300 igram line-5 iisevisi, ungadla kangakanani igrams ukuba umgomo wakho wemihla ngemihla wekhalori ngu-2000 kwaye sele wasebenzisa 1800 iikhalori?"
