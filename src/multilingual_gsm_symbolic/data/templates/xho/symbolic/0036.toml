question = "Toula waya kwiibhakele kwaye wathenga iintlobo ngeentlobo zeziikhekhe. Wathenga 3 zeeduzini zeziidonuts ezixabisa $68 ngeduzini, 2 zeeduzini zeziikhekhe ezincinci ezixabisa $80 ngeduzini, kwaye 6 zeeduzini zeziicheesecake ezincinci ngama-$55 ngeduzini. Yimalini iindleko ezipheleleyo?"
