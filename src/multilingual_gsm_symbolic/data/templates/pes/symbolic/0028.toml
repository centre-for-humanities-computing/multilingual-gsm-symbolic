question = "Yek bimaristan ghooniyati az 1000 takht-ha darad ke 1/5 az an-ha shaghol ast. Ba khater-e shouroush-e coronavirus, 50 mariz har rooz be bimaristan qabool mishavand. Tedad-e kol-e takht-haye khali dar bimaristan bad az 2 hafteh ra hesab konid."
answer = "Agar 1/5 az ghooniyat-e kol-e takht-haye bimaristan shaghol bashad, in ma'ne-ye 1/5 * 1000 = <<1000*1/5=200>>200 takht-ha ast ke mariz-ha az an-ha estefade mikonand.\nTedad-e kol-e takht-haye bimaristan bedune-ye qabooli-ye jadid 1000 takht - 200 takht = <<1000-200=800>>800 takht-ha ast.\nAgar 50 nafar har rooz qabool shavand, tedad-e kol-e mariz-haye bimaristan bad az yek hafteh 50 mariz/rooz * 7 rooz/hafteh = 350 mariz ast.\nBad az 2 hafteh, tedad-e kol-e mariz-haye qabool shode dar bimaristan 350 mariz/hafteh * 2 hafteh = <<350*2=700>>700 mariz ast, ke har yek yek takht darand.\nAgar 800 takht-haye khali dar bimaristan qabl az qabooli-ye jadid bashad, tedad-e kol be 800 takht - 700 takht kam mishavad = <<800-700=100>>100 takht-haye khali.\n#### 100\n"
