answer_annotated = "Agar {frac} az ghooniyat-e kol-e {item}-haye {facility} shaghol bashad, in ma'ne-ye {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item}-ha ast ke mariz-ha az an-ha estefade mikonand.\nTedad-e kol-e {item}-haye {facility} bedune-ye qabooli-ye jadid {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}-ha ast.\nAgar {daily} nafar har rooz qabool shavand, tedad-e kol-e mariz-haye {facility} bad az yek hafteh {daily} mariz/rooz * 7 rooz/hafteh = {daily*7} mariz ast.\nBad az {period} hafteh, tedad-e kol-e mariz-haye qabool shode dar {facility} {daily*7} mariz/hafteh * {period} hafteh = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} mariz ast, ke har yek yek {item} darand.\nAgar {total-int(total*frac)} {item}-haye khali dar {facility} qabl az qabooli-ye jadid bashad, tedad-e kol be {total-int(total*frac)} {item} - {daily*period*7} {item} kam mishavad = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item}-haye khali.\n#### {total - (total * frac + daily * period * 7)}\n"
