question_annotated = "بر اساس اطلاعات تغذیه‌ای، یک بسته {food,چیپس} در هر وعده {cal,250} کالری دارد. اگر یک بسته {size,300} {unit,گرم} شامل {n,5} وعده باشد، شما چند {unit,گرم} می‌توانید بخورید اگر هدف کالری روزانه شما {total,2000} باشد و قبلاً {spent,1800} کالری مصرف کرده باشید؟\n\n#init:\n- food = sample([\"پاپ‌کورن\", \"نان\", \"کوکی\"])\n- unit = sample([\"گرم\", \"اونس\", \"اونس\"])\n- $cal = range(150, 500, 25)\n- $size = range(100, 400, 25)\n- $n = range(4, 8)\n- $total = range(1900, 2500, 5)\n- $spent = range(600, 1900, 25)\n\n#conditions:\n- spent < total\n- is_int( 5 * (total - spent) / cal)\n- divides(size, n)\n- divides(size//n, (total-spent)/cal)\n\n#answer: size//n * Fraction((total-spent)/cal)\n"
answer_annotated = "اگر هدف کالری کل {total} باشد و من {spent} کالری مصرف کرده باشم، پس {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} کالری برای خوردن باقی مانده دارم\nاگر هر وعده از {food} {cal} کالری داشته باشد و من فقط {total-spent} کالری برای خوردن باقی مانده داشته باشم، پس من فقط می‌توانم {total-spent}/{cal} از یک وعده بخورم = {Fraction((total-spent)/cal)} از یک وعده\nما همچنین می‌دانیم که یک بسته {size} {unit} از {food} دارای {n} وعده است، بنابراین هر وعده {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit} دارد\nاگر من فقط بتوانم {Fraction((total-spent)/cal)} از یک وعده بخورم، پس من فقط می‌توانم {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit} بخورم\n#### {size//n * (total-spent)/cal}\n"
