question = "بر اساس اطلاعات تغذیه‌ای، یک بسته چیپس در هر وعده 250 کالری دارد. اگر یک بسته 300 گرم شامل 5 وعده باشد، شما چند گرم می‌توانید بخورید اگر هدف کالری روزانه شما 2000 باشد و قبلاً 1800 کالری مصرف کرده باشید؟"
answer = "اگر هدف کالری کل 2000 باشد و من 1800 کالری مصرف کرده باشم، پس 2000-1800 = <<2000-1800=200>>200 کالری برای خوردن باقی مانده دارم\nاگر هر وعده از چیپس 250 کالری داشته باشد و من فقط 200 کالری برای خوردن باقی مانده داشته باشم، پس من فقط می‌توانم 200/250 از یک وعده بخورم = 4/5 از یک وعده\nما همچنین می‌دانیم که یک بسته 300 گرم از چیپس دارای 5 وعده است، بنابراین هر وعده 300 گرم/5 = <<300/5=60>>60 گرم دارد\nاگر من فقط بتوانم 4/5 از یک وعده بخورم، پس من فقط می‌توانم 60 گرم * 4/5 = 48 گرم بخورم\n#### 48\n"
