question = "یک کشاورز در حال خرید خوراک برای اسبهای خود است. او انواعی از کاه, جو, هویج و تکه‌های قند می‌خرد. از آنجا که تکه‌های قند یک خوراکی نادر است، او فقط دو جعبه 1-پوند از آن‌ها را برای کل اصطبل می‌خرد. او فقط به اندازه کافی هویج می‌خواهد تا اسبها را در حالی که سبزیجات تازه هستند تغذیه کند، بنابراین چهار کیسه 12-پوند می‌خرد. کاه غذای اصلی اسبهای او است، بنابراین او چهل و دو بسته 75-پوند می‌خرد. جو یک ماده غذایی اصلی برای تکمیل کاه است، بنابراین او بیست کیسه 65-پوند می‌خرد. اگر کامیون مزرعه او بتواند 2250 پوند را در هر بار حمل کند، کشاورز برای حمل تمام خوراک به چند سفر نیاز دارد؟"
answer = "کشاورز 2*1 = <<2*1=2>>2 پوند از تکه‌های قند می‌خرد.\nاو 4*12 = <<4*12=48>>48 پوند از هویج می‌خرد.\nاو 20*65 = <<20*65=1300>>1300 پوند از جو می‌خرد.\nاو 42*75 = <<42*75=3150>>3150 پوند از کاه می‌خرد.\nوزن تمام خوراک 2 + 48 + 1300 + 3150 = <<2+48+1300+3150=4500>>4500 پوند است.\nبنابراین، کشاورز برای حمل تمام خوراک در کامیون مزرعه خود به 4500 / 2250 = <<4500/2250=2>>2 سفر نیاز دارد.\n#### 2\n"
