question = "جکی در تلاش است تا تصمیم بگیرد که آیا مالیات‌های خود را خود انجام دهد یا یک حسابدار استخدام کند. اگر خودش انجام دهد، می‌تواند 3 ساعت کمتر کار فریلنسری انجام دهد و $35 در ساعت درآمد از دست می‌دهد. حسابدار مبلغ $90 دریافت می‌کند. اگر حسابدار را استخدام کند، چقدر پول بیشتری خواهد داشت؟"
