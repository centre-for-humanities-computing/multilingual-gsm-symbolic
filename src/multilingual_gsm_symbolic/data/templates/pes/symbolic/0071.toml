question = "نیت در حال تغذیه دام‌هایش با علوفه است. هر بز به 5 پوند نیاز دارد، و هر لاما به 3 پوند کمتر از دو برابر مقدار مورد نیاز هر بز نیاز دارد. اگر 15 بز و 12 لاما وجود داشته باشد، نیت به چند پوند از علوفه نیاز دارد؟"
