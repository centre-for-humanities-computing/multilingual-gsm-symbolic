question = "مادربزرگ هر روز 3 مایل در مسیر پیاده‌روی مورد علاقه‌اش راه می‌رود که شامل 2 مایل پیاده‌روی روی ساحل و 1 مایل(ها) پیاده‌روی روی پیاده‌رو است. روی پیاده‌رو، مادربزرگ با دو برابر سرعتی که روی ساحل طی می‌کند راه می‌رود. اگر 40 دقیقه از پیاده‌روی او روی ساحل سپری شود، چقدر طول می‌کشد تا کل 3-مایل مسیر را طی کند، به دقیقه؟"
