question = "کارول و جنیفر خواهرانی از لس آنجلس هستند که عاشق جمع‌آوری امضا از سلبریتی‌ها هستند. در طول تعطیلات تابستانی از مدرسه، خواهران هر بعدازظهر را به جمع‌آوری امضا می‌گذرانند. پس از پنج هفته، کارول و جنیفر دفترهای امضای خود را مقایسه می‌کنند و تعداد امضاهایی که هر خواهر جمع‌آوری کرده را می‌شمارند. کارول 20 امضا در دفتر خود دارد و جنیفر 44 امضا. خواهران سه هفته دیگر از تعطیلات تابستانی را دارند و تصمیم می‌گیرند که تا پایان تعطیلات به 100 امضا بین خود برسانند. خواهران برای رسیدن به هدف خود چند امضا باید جمع‌آوری کنند؟"
