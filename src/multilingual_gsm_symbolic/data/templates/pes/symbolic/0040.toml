question = "سالی برای تعطیلات به ساحل دریا رفت. والدینش به او $15 دادند تا هر چه می‌خواست بخرد. در فروشگاه سوغاتی، تافی با حراج بود «خرید 1 پوند به ازای هر پوند $3، دریافت 1 پوند با 1/2 تخفیف.» او 4 پوند برداشت. او همچنین یک بسته مخلوط صدف به قیمت $1.5 و 4 آهنربا که هر کدام $0.25 بودند خرید. چقدر پول برای سالی باقی می‌ماند؟"
answer = "سالی در حال خرید 1 پوند به قیمت $3 است و 1 پوند با 1/2 تخفیف دریافت می‌کند. بنابراین 1/2 تخفیف روی 1 پوند برابر است با $3*1/2 = $1.5. باقی‌مانده 2 پوند تخفیف ندارد و هزینه آن 2*$3 = $6 است، بنابراین مجموع برابر است با $3+$3/2+$6=$21/2\n4 آهنربا به قیمت $0.25 هر کدام برابر است با 4*0.25=$<<4*0.25=1>>1\nوقتی تمام خریدهایش را جمع می‌زنید، $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nاو $15 داشت و $13 خرج کرد، بنابراین $15-$13 = $<<15-13=2>>2 باقی ماند\n#### 2\n"
