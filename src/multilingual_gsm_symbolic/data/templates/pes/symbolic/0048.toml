question = "ایمی می‌تواند در هر دقیقه 6 میگو پوست بکند و 30 میگو را در 10 دقیقه تفت دهد. چقدر طول می‌کشد تا او 90 میگو را پوست بکند و تفت دهد؟ ایمی نمی‌تواند همزمان پوست بکند و تفت دهد."
answer = "ابتدا محاسبه کنید که چقدر طول می‌کشد تا ایمی میگو را پوست بکند: 90 میگو / 6 میگو/دقیقه = <<90/6=15>>15 دقیقه\nسپس محاسبه کنید که او به چند دسته میگو برای پختن نیاز دارد: 90 میگو / 30 میگو/دسته = <<90/30=3>>3 دسته\nسپس تعداد دسته‌ها را در زمان هر دسته ضرب کنید تا زمان پخت کل پیدا شود: 3 دسته * 10 دقیقه/دسته = <<3*10=30>>30 دقیقه\nسپس زمان پوست کندن را به زمان پخت اضافه کنید تا زمان کل صرف شده توسط ایمی پیدا شود: 30 دقیقه + 15 دقیقه = <<30+15=45>>45 دقیقه\n#### 45\n"
