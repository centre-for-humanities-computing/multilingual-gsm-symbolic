question = "آقا تان خانه خود را به مبلغ $400,000 فروخت. او هزینه‌های انتقال را پرداخت که معادل 3٪ از قیمت فروش است و همچنین هزینه کارگزاری را پرداخت که 5٪ از قیمت فروش است. اگر او همچنین $250,000 را برای باقی‌مانده وام خانه پرداخت کرد، مبلغ خالص دریافتی آقا تان از فروش خانه چقدر است؟"
