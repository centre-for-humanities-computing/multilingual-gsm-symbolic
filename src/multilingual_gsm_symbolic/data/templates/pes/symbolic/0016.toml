question = "سانی در حال فروش نان زنجبیلی و پای سیب برای یک جمع‌آوری کمک مالی است. در شنبه، او 10 جعبه نان زنجبیلی و 4 جعبه کمتر پای سیب نسبت به یکشنبه فروخت. در یکشنبه، او 5 جعبه بیشتر نان زنجبیلی نسبت به شنبه و 15 جعبه پای سیب فروخت. اگر قیمت نان زنجبیلی $6 و قیمت پای سیب $15 باشد، سانی در دو روز چقدر کسب کرد؟"
answer = "او در یکشنبه 10 + 5 = <<10+5=15>>15 جعبه نان زنجبیلی فروخت.\nتعداد کل جعبه‌های نان زنجبیلی که سانی فروخت 10 + 15 = <<10+15=25>>25 است.\nسانی برای فروش نان زنجبیلی 25*$6 = $<<25*6=150>>150 کسب کرد.\nاو در شنبه 15 - 4 = <<15-4=11>>11 جعبه پای سیب فروخت.\nتعداد کل جعبه‌های پای سیب که سانی فروخت 15 + 11 = <<15+11=26>>26 است.\nاو برای فروش پای سیب 26*$15 = $<<26*15=390>>390 کسب کرد.\nبنابراین، سانی در دو روز $150 + $390 = $<<150+390=540>>540 کسب کرد.\n#### 540\n"
