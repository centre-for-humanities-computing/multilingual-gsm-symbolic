answer_annotated = "او در {d2} {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} جعبه {food} فروخت.\nتعداد کل جعبه‌های {food} که {name} فروخت {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2} است.\n{name} برای فروش {food} {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} کسب کرد.\nاو در {d1} {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} جعبه پای {fruit} فروخت.\nتعداد کل جعبه‌های پای {fruit} که {name} فروخت {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1} است.\nاو برای فروش پای {fruit} {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} کسب کرد.\nبنابراین، {name} در دو روز {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} کسب کرد.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
