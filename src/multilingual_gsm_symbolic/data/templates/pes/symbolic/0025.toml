question = "در کلاس آقای رپر با 30 دانش‌آموز، 20% از کلاس بازیکنان فوتبال هستند. از دانش‌آموزان باقی‌مانده کلاس، 25% تیم‌های تشویق یا عضو گروه موسیقی هستند. این ۳ گروه از دانش‌آموزان باید امروز زودتر خارج شوند تا به یک بازی خارج از شهر سفر کنند. چند دانش‌آموز زودتر خارج می‌شوند؟"
answer = "20% از کلاس 30 نفره بازیکنان فوتبال هستند، پس 0.2*30 = <<0.2*30=6>>6 دانش‌آموز\n30 دانش‌آموز وجود دارد و 6 نفر بازیکنان فوتبال هستند، پس 30-6 = <<30-6=24>>24 دانش‌آموز باقی می‌ماند\n25% از 24 دانش‌آموز باقی‌مانده عضو گروه موسیقی یا تیم‌های تشویق هستند، پس 0.25*24 = <<0.25*24=6>>6 دانش‌آموز\n6 دانش‌آموز بازیکنان فوتبال هستند و 6 نفر عضو گروه موسیقی/تیم‌های تشویق هستند، پس 6+6 = <<6+6=12>>12 دانش‌آموز زودتر خارج می‌شوند\n#### 12\n"
