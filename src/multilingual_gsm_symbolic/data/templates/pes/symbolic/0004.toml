question = "گارنت در حال ترکاندن پاپ‌کورن برای یک میان‌وعده است. همانطور که تابه ذرت‌ها گرم می‌شود، دانه‌ها شروع به ترکیدن با سرعت بیشتر می‌کنند. 20 در 30 ثانیه اول پخت می‌ترکند، سپس سه برابر آن مقدار در 30 ثانیه بعدی. دانه‌ها به چهار برابر نرخ اولیه ترکیدن در 30 ثانیه بعدی افزایش می‌یابند، اما در 30 ثانیه آخر، سرعت ترکیدن به نصف نرخ 30 ثانیه گذشته کاهش می‌یابد. پس از اینکه گارنت تابه را از روی حرارت برمی‌دارد، یک چهارم تعداد دانه‌هایی که در 30 ثانیه آخر پخت ترکیدند نیز از گرمای باقی‌مانده می‌ترکند. گارنت باید چند تکه پاپ‌کورن بخورد؟"
answer = "در 30 ثانیه دوم پخت، 3*20=<<3*20=60>>60 دانه می‌ترکند.\nدر 30 ثانیه سوم، 4*20=<<4*20=80>>80 دانه می‌ترکند.\nدر 30 ثانیه آخر، 80 / 2 = <<80/2=40>>40 دانه می‌ترکند.\nپس از پخت، گرمای باقی‌مانده باعث می‌شود 40 / 4 = <<40/4=10>>10 دانه می‌ترکند.\nبنابراین، گارنت دارای 20 + 60 + 80 + 40 + 10 = <<20+60+80+40+10=210>>210 تکه پاپ‌کورن برای خوردن دارد.\n#### 210\n"
