question = "دانا می‌تواند چهار برابر سریع‌تر از آنکه راه برود بدود، اما می‌تواند با سرعتی به اندازه نصف سرعتی که می‌تواند بدود بپرد. اگر او بتواند با سرعت 3 مایل در ساعت بپرد، چند مایل می‌تواند در شش ساعت سفر کند اگر یک سوم از زمان را بدود و دو سوم از زمان را راه برود؟"
answer = "اگر دانا بتواند با سرعت نصف سرعتی که می‌تواند بدود بپرد، آنگاه او می‌تواند با سرعت 3*2=<<3*2=6>>6 مایل در ساعت بدود.\nو از آنجا که او می‌تواند با سرعتی به اندازه چهار برابر سریع‌تر از آنکه راه برود بدود، این بدان معناست که او می‌تواند با سرعت 6/5=1.2 مایل در ساعت راه برود.\nاگر دو سوم از زمان صرف راه رفتن شود، آنگاه او به مدت 6*2/3=<<6*2/3=4>>4 ساعت راه می‌رود.\nاگر یک سوم از زمان صرف دویدن شود، آنگاه او به مدت 6-4=<<6-4=2>>2 ساعت می‌دود.\nبنابراین، او به مدت 2 ساعت با سرعت 6 مایل در ساعت می‌دود، یا 2*6=<<2*6=12>>12 مایل.\nاو به مدت 4 ساعت با سرعت 1.2 مایل در ساعت راه می‌رود، یا 4*1.2=<<4*1.2=24/5>>24/5 مایل.\nبنابراین، در مجموع، او 12+24/5=<<12+24/5=16>>16 مایل سفر می‌کند.\n#### 16\n"
