question = "سارا برای یک جایگاه در تیم دو واجد شرایط شد، بنابراین برای خرید تجهیزات ورزشی به فروشگاه رفت. او یک تیشرت به قیمت تومان10 خرید، یک جفت دو شلوارک به مبلغ تومان5 بیشتر از هزینه تیشرت، و یک جفت کفش تنیس که در اصل تومان48 بود اما با تخفیف به قیمت نصف فروخته شد. او یک کوپن به مبلغ تومان2 تخفیف برای بسته تومان8 ورزشی جوراب داشت که او نیز خرید. او چقدر برای تجهیزات ورزشی خرج کرد؟"
answer = "شلوارک ها تومان5 بیشتر از تیشرت بودند، بنابراین هزینه آن‌ها تومان5 + تومان10 = تومان<<5+10=15>>15 شد.\nکفش تنیس های او نصف قیمت اصلی تومان48 بودند، بنابراین هزینه آن‌ها تومان48*1/2=تومان24 شد.\nبا کوپن او، جوراب ها تومان8 - تومان2 = تومان<<8-2=6>>6 بودند.\nتیشرت، شلوارک، کفش تنیس و جوراب با هم هزینه‌ای معادل تومان10 + تومان15 + تومان24 + تومان6 = تومان<<10+15+24+6=55>>55 دارند.\n#### 55\n"
