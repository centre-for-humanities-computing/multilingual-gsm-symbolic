question = "فرانکی هر شب بعد از اتمام تکالیفش تلویزیون تماشا می‌کند. در دوشنبه و سه‌شنبه، او هر شب یک قسمت 1-ساعته از سریال مورد علاقه‌اش تماشا کرد. در چهارشنبه، او چند قسمت از یک سریال 30-دقیقه‌ای تماشا کرد. در پنج‌شنبه، او تکالیفش را زود تمام کرد و یک قسمت 1-ساعته و یک سریال 30-دقیقه‌ای تماشا کرد. در جمعه، او دیرتر بیدار ماند، بنابراین دو قسمت 1-ساعته تماشا کرد. اگر او در مجموع 7 ساعت تلویزیون تماشا کرده باشد، چند قسمت 30-دقیقه‌ای را در چهارشنبه تماشا کرد؟"
answer = "فرض کنید E تعداد قسمت‌هایی باشد که او در چهارشنبه تماشا کرده است.\nبعد از دوشنبه، او 7 - 1 = <<7-1=6>>6 ساعت تلویزیون باقی‌مانده داشت.\nبعد از سه‌شنبه، او 6 - 1 = <<6-1=5>>5 ساعت تلویزیون باقی‌مانده داشت.\nبعد از پنج‌شنبه، او 5 - 1 - 0.5 = 3.5 ساعت تلویزیون باقی‌مانده داشت.\nبعد از جمعه، او 3.5 - 2 = 1.5 ساعت تلویزیون باقی‌مانده داشت.\nهر قسمت 30-دقیقه‌ای برابر با 1/2 ساعت است.\nبنابراین، E = 1.5/0.5 = 3 قسمت است.\n#### 3\n"
