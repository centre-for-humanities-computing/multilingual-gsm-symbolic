answer_annotated = "سوالات {s2} و {s3} شامل 100% - {p1}% = {100-p1}% از آزمون هستند.\n{n} سوال * {p1}/100 = <<{n}*{p1}/100={int(n * (p1/100))}>>{int(n * (p1/100))} سوال {s1} وجود دارد.\nمجموعاً {n} سوال * {100-p1}/100 = <<{n}*{100-p1}/100={int(n*(1-(p1/100)))}>>{int(n*(1-(p1/100)))} سوال {s2} و {s3} وجود دارد.\nاگر {name} مطمئن باشد که {r1}% از سوالات {s1} را می‌گیرد، این بدان معناست که او مطمئن است {int(n * (p1/100))} سوال * {r1}/100 = <<{int(n * (p1/100))}*{r1}/100={int(n * (p1/100) * (r1/100))}>>{int(n * (p1/100) * (r1/100))} امتیاز دارد.\nاز سوالات {s2} و {s3}، او مطمئن است که {frac_txt} آن را درست پاسخ می‌دهد، بنابراین {int(n*(1-(p1/100)))} سوال * {frac_val} = <<{int(n*(1-(p1/100)))}*{frac_val}={ensure_int(n*(1-(p1/100))*frac_val)}>>{ensure_int(n*(1-(p1/100))*frac_val)} امتیاز است.\nبنابراین، او مطمئن است که {int(n * (p1/100) * (r1/100))} امتیاز + {ensure_int(n*(1-(p1/100))*frac_val)} امتیاز = <<{int(n * (p1/100) * (r1/100))}+{ensure_int(n*(1-(p1/100))*frac_val)}={ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)}>>{ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)} امتیاز در آزمون خود خواهد گرفت.\n#### {ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)}\n"
