question = "در یک آزمون 60 سوالی، 40% از سوالات آسان هستند و بقیه به طور مساوی به سوالات متوسط و سخت تقسیم شده‌اند. اگر آریا مطمئن باشد که 75% از سوالات آسان و نصف از سوالات متوسط و سخت را درست پاسخ می‌دهد، او مطمئن است چند امتیاز خواهد گرفت؟"
answer = "سوالات متوسط و سخت شامل 100% - 40% = 60% از آزمون هستند.\n60 سوال * 40/100 = <<60*40/100=24>>24 سوال آسان وجود دارد.\nمجموعاً 60 سوال * 60/100 = <<60*60/100=36>>36 سوال متوسط و سخت وجود دارد.\nاگر آریا مطمئن باشد که 75% از سوالات آسان را می‌گیرد، این بدان معناست که او مطمئن است 24 سوال * 75/100 = <<24*75/100=18>>18 امتیاز دارد.\nاز سوالات متوسط و سخت، او مطمئن است که نصف آن را درست پاسخ می‌دهد، بنابراین 36 سوال * 1/2 = <<36*1/2=18>>18 امتیاز است.\nبنابراین، او مطمئن است که 18 امتیاز + 18 امتیاز = <<18+18=36>>36 امتیاز در آزمون خود خواهد گرفت.\n#### 36\n"
