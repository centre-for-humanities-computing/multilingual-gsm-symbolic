question = "جولیا در حال آماده‌سازی برای یک مهمانی شام در خانه‌اش بود، جایی که قصد داشت خورشت سرو کند. او متوجه شد که قاشق‌های پلاستیکی‌اش تمام شده است، بنابراین یک بسته جدید از قاشق خرید. بعداً، شوهرش هم یک بسته 5 قاشق جدید خرید و آن‌ها را به جولیا داد. در حالی که جولیا در حال درست کردن خورشت بود، او سه تا از قاشق‌ها را برای چشیدن خورشت‌اش استفاده کرد. بعداً، وقتی برای چیدن سفره رفت، او در مجموع 12 قاشق داشت. چند قاشق در بسته‌ای بود که جولیا خرید؟"
