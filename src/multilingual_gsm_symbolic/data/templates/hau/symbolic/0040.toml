question = "{name,Sally} ta tafi bakin teku don hutu. Yayayanta sun ba ta ${total,15} don ta siyan abin da take so. A shagon abubuwan tunawa, taffy yana sayarwa da \"Siya {n1,500} gram da ${p1,3}, samu {n2,500} gram da {discount,1/2} farashi.\" Ta ɗauki {n12,2000} gram. Ta kuma siya kwalin gungun conch da ${p2,1.5} da {n3,4} manyan abubuwan maganadisu waɗanda suka kasance ${p3,0.25} kowanne. Yawan kudin da {name,Sally} ta rage?"
answer = "Taffy yana farashin ${p1} ga {n1} gram kuma tana samun {n2} gram da {discount} farashi. Don haka {discount} na farashin {n2} gram shine {n2}/{n1}*{discount}*${p1} = ${(n2/n1)*discount*p1}.\nTare, wannan yana farashin ${(n2/n1)*discount*p1} + ${p1} = ${(n2/n1)*discount*p1 + p1}.\nSauran {n12 - n1 - n2} gram ba su da ragi kuma suna farashin ${(n12 - n1 - n2)/n1*p1}, don haka farashin gaba ɗaya shine ${p1} + ${n2/n1*discount*p1} + ${(n12 - n1 - n2)/n1*p1} = $<<{p1} + {n2/n1*discount*p1} + {(n12 - n1 - n2)/n1*p1} = {p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}>>{p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}\n{n3} manyan abubuwan maganadisu a ${p3} kowanne shine {n3}*${p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nLokacin da aka ƙara duk abubuwan da ta sayi, ${p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1} + ${p2} + ${n3*p3} = $<<{p1+(n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}+{p2}+{n3*p3}={int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}>>{int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}\nTana da ${total} kuma ta kashe ${int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}, don haka tana da ${total} - ${int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} = $<<{total}-{int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}={total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}>>{total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} ta rage\n#### {total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}\n"
