question = "A hospital yana da karfin karbar 1000 beds tare da 1/5 an cika. Saboda coronavirus outbreak, 50 marasa lafiya ana shigar su cikin hospital kowace rana. Lissafa jimlar adadin beds da ba a cika a hospital bayan 2 makonni."
answer = "Idan 1/5 na karfin karbar hospital beds an cika, yana nufin 1/5 * 1000 = <<1000*1/5=200>>200 beds marasa lafiya suna amfani da su.\nJimlar adadin beds a hospital ba tare da sabbin shigarwa ba shine 1000 beds - 200 beds = <<1000-200=800>>800 beds.\nIdan 50 mutane ana shigar su kowace rana, jimlar adadin marasa lafiya a hospital bayan makonni ɗaya shine 50 marasa lafiya/rana * 7 rana/mako = 350 marasa lafiya.\nBayan 2 makonni, jimlar adadin marasa lafiya da aka shigar cikin hospital shine 350 marasa lafiya/mako * 2 makonni = <<350*2=700>>700 marasa lafiya, waɗanda kowannensu yana amfani da bed ɗaya.\nIdan akwai 800 beds da ba a cika a hospital kafin sabbin shigarwa, jimlar ta ragu zuwa 800 beds - 700 beds = <<800-700=100>>100 beds da ba a cika.\n#### 100\n"
