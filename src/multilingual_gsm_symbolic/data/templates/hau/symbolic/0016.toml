question = "Sunny yana sayar da gingerbread da apple pie don taron taimako. A Saturday, ya sayar da 10 akwati na gingerbread da 4 akwati kaɗan na apple pie, fiye da Sunday. A Sunday, ya sayar da 5 akwati na gingerbread fiye da Saturday da 15 akwati na apple pie. Idan gingerbread yana da ƙimar $6 kuma apple pie yana da ƙimar $15, nawa ne Sunny ya samu a cikin kwanaki biyu?"
