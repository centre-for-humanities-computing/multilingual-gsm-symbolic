question = "Frankie yana kallo talabijin bayan ya kammala aikin gida kowace dare. A Litinin da Talata, ya kallo 1-awa shirin shirinsa na kowane dare. A Laraba, ya kallo wasu shirye-shiryen na 30-minti. A Alhamis, ya kammala aikin gida da wuri kuma ya kallo 1-awa shiri da 30-minti shiri. A Juma'a, ya yi iya zama da dare, don haka ya kallo biyu 1-awa shirye-shiryen. Idan ya kallo 7 awa na talabijin a duka, nawa 30-minti shirye-shiryen ya kallo a Laraba?"
