question = "జెర్రీ ఒక ఆరు-పక్కల దాడిని రోల్ చేస్తున్నాడు. అతను 3 కంటే ఎక్కువ సంఖ్యను రోల్ చేయడం, వరుసగా రెండు సరి సంఖ్యలను రోల్ చేయడం కంటే ఎంత ఎక్కువ అవకాశం కలిగి ఉంటుంది (శాతం అంకెలలో)?"
