question = "శ్రీమతి క్రూజ్ తన $400,000 బడ్జెట్‌ను మించిపోని ఒక ఇల్లు కోసం చూస్తున్నారు. ఆమె $350,000 విక్రయ ధర ఉన్న ఒక ఆస్తిని చూసింది. అంతేకాకుండా, కొనుగోలుదారుడు విక్రయ ధరలో 5% వరకు బ్రోకరేజీ ఫీజు చెల్లించాల్సి ఉంటుంది, మరియు విక్రయ ధరలో 12% వరకు ట్రాన్స్‌ఫర్ ఫీజు కూడా చెల్లించాల్సి ఉంటుంది. ఆ ఇల్లు యొక్క మొత్తం ధర, శ్రీమతి క్రూజ్ బడ్జెట్ కంటే ఎంత ఎక్కువ?"
