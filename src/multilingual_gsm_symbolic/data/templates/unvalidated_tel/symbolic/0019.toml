answer = "సరాసరి మరియు కష్టమైన ప్రశ్నలు క్విజ్‌లో 100% - 40% = 60% వాటాను కలిగి ఉంటాయి.\nమొత్తం 60 ప్రశ్నలలో 40/100 = <<60*40/100=24>>24 సులభమైన ప్రశ్నలు ఉన్నాయి.\nమొత్తం 60 ప్రశ్నలలో 60/100 = <<60*60/100=36>>36 సరాసరి మరియు కష్టమైన ప్రశ్నలు ఉన్నాయి.\nఒకవేళ Aries సులభమైన ప్రశ్నలలో 75% తప్పకుండా సరిగ్గా సమాధానం ఇస్తే, అంటే ఆమె తప్పకుండా 24 ప్రశ్నలలో 75/100 = <<24*75/100=18>>18 పాయింట్లు పొందుతుంది.\nసరాసరి మరియు కష్టమైన ప్రశ్నల నుండి, ఆమె సగం సరిగ్గా సమాధానం ఇస్తుంది, కాబట్టి అది 36 ప్రశ్నలు*1/2 = <<36*1/2=18>>18 పాయింట్లు.\nఅందువల్ల, ఆమె తప్పకుండా క్విజ్‌లో 18 పాయింట్లు + 18 పాయింట్లు = <<18+18=36>>36 పాయింట్లు పొందుతుంది.\n#### 36\n"
