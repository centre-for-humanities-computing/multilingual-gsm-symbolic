question = "কারল এবং জেনিফার ল'স এঞ্জেলস এর বোন যারা সেলিব্রিটি থেকে স্বাক্ষর সংগ্রহ করতে ভালবাসে। স্কুলের গরমকলের ছুটি এর সময়, বোনরা প্রতি বিকেলে স্বাক্ষর সংগ্রহ করে। পাঁচ সপ্তাহ পর, কারল এবং জেনিফার তাদের স্বাক্ষর বই তুলনা করে, প্রতিটি বোন কত স্বাক্ষর সংগ্রহ করেছে তা গণনা করে। কারল এর বইয়ে 20 টি স্বাক্ষর আছে, এবং জেনিফার এর আছে 44। বোনদের আরও তিন সপ্তাহ গরমকলের ছুটি আছে, এবং তারা ঠিক করে যে ছুটির শেষে তাদের মধ্যে মোট 100 টি স্বাক্ষর পৌঁছাতে চায়। তাদের লক্ষ্যে পৌঁছাতে বোনদের কতটি স্বাক্ষর সংগ্রহ করতে হবে?"
