question = "ওয়াটসন প্রতিদিন 10-ঘণ্টার শিফট কাজ করে, হপ্তায় পাঁচ দিন। সে প্রতি ঘণ্টায় ৳10 আয় করে এবং যদি কোম্পানি ভালো কাজ করে তবে হপ্তায় ৳300 বোনাস পায়। যদি পুরো মাসে কোম্পানি খুব ভালো কাজ করে তবে এপ্রিল-এ ওয়াটসন কত টাকা আয় করেছে?"
