answer = "সমুদ্র সৈকতে, দাদী 67 মিনিটে 2 কিলোমিটার হেঁটে, অর্থাৎ 2/67 = 2/67 কিলোমিটার প্রতি মিনিটে।\nফুটপাথে, সে বালিতে থাকার সময়ের মতো পাঁচবার বেগে হাঁটে, অর্থাৎ 5*2/67 = 0.14925373134328357 কিলোমিটার প্রতি মিনিটে।\nফুটপাথে 1 কিলোমিটার হাঁটতে তার সময় লাগে 1/0.14925373134328357 = <<1/0.14925373134328357=6.7>>6.7 মিনিট।\nতাই, মোটামুটি, দাদী তার পছন্দের পথে হাঁটতে 67+6.7 = <<67+6.7=73.7>>73.7 মিনিট সময় নেয়।\n#### 73.7\n"
