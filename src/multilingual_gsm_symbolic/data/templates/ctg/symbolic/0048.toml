question = "এমিলি প্রতি মিনিটে 6 টি চিংড়ি ছালা করতে পারে এবং 10 মিনিটে 30 টি চিংড়ি ভাজতে পারে। 90 টি চিংড়ি ছালা এবং ভাজতে তার কতো সময় লাগবে? এমিলি একসাথে ছালা এবং ভাজতে পারে না।"
