answer = "যদি মোট ক্যালোরি লক্ষ্য 2000 হয় এবং আমি 1800 ক্যালোরি খেয়ে ফেলি, তবে আমার 2000-1800 = <<2000-1800=200>>200 ক্যালোরি খেতে বাকি থাকে\nযদি প্রতিটি চিপস পোর্শনে 250 ক্যালোরি থাকে এবং আমার শুধু 200 ক্যালোরি খেতে বাকি থাকে, তবে আমি শুধু একটি পোর্শনের 200/250 অংশ খেতে পারি = একটি পোর্শনের 4/5 অংশ\nআমরা জানি যে একটি 300 গ্রাম প্যাকেট চিপস এর 5 পোর্শন হয়, তাই প্রতিটি পোর্শনে 300 গ্রাম/5 = <<300/5=60>>60 গ্রামs থাকে\nযদি আমি শুধু একটি পোর্শনের 4/5 অংশ খেতে পারি, তবে আমি শুধু 60 গ্রাম * 4/5 = 48 গ্রামs খেতে পারি\n#### 48\n"
