question_annotated = "পুষ্টি তথ্য অনুযায়ী, একটি {food,চিপস} প্যাকেটে প্রতি পোর্শন {cal,250} ক্যালোরি থাকে। যদি একটি {size,300} {unit,গ্রাম} প্যাকেটে {n,5} পোর্শন থাকে, তবে তোমার দৈনিক ক্যালোরি লক্ষ্য {total,2000} এবং তুমি ইতিমধ্যে {spent,1800} ক্যালোরি খেয়ে ফেললে তুমি কত {unit,গ্রাম}s খেতে পারবে?\n\n#init:\n- food = sample([\"পপকর্ন\", \"ব্রেড\", \"কুকিজ\"])\n- unit = sample([\"গ্রাম\", \"g\"])\n- $cal = range(150, 500, 25)\n- $size = range(100, 400, 25)\n- $n = range(4, 8)\n- $total = range(1900, 2500, 5)\n- $spent = range(600, 1900, 25)\n\n#conditions:\n- spent < total\n- is_int( 5 * (total - spent) / cal)\n- divides(size, n)\n- divides(size//n, (total-spent)/cal)\n\n#answer: size//n * Fraction((total-spent)/cal)\n"
answer_annotated = "যদি মোট ক্যালোরি লক্ষ্য {total} হয় এবং আমি {spent} ক্যালোরি খেয়ে ফেলি, তবে আমার {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} ক্যালোরি খেতে বাকি থাকে\nযদি প্রতিটি {food} পোর্শনে {cal} ক্যালোরি থাকে এবং আমার শুধু {total-spent} ক্যালোরি খেতে বাকি থাকে, তবে আমি শুধু একটি পোর্শনের {total-spent}/{cal} অংশ খেতে পারি = একটি পোর্শনের {Fraction((total-spent)/cal)} অংশ\nআমরা জানি যে একটি {size} {unit} প্যাকেট {food} এর {n} পোর্শন হয়, তাই প্রতিটি পোর্শনে {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit}s থাকে\nযদি আমি শুধু একটি পোর্শনের {Fraction((total-spent)/cal)} অংশ খেতে পারি, তবে আমি শুধু {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit}s খেতে পারি\n#### {size//n * (total-spent)/cal}\n"
