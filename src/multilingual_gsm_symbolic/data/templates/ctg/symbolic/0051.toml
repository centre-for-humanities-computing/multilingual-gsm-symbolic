question = "Artie এর কৃষক মার্কেট এ একটি ফুল স্ট্যান্ড আছে। তিনি ফুল এর তিন ধরণ বিক্রি করেন: গেন্দা, পেটুনিয়া এবং বেগোনিয়া। তিনি সাধারণত গেন্দা ৳2.74 প্রতি গামলা, পেটুনিয়া ৳1.87 প্রতি গামলা এবং বেগোনিয়া ৳2.12 প্রতি গামলা বিক্রি করেন। Artie এর আজ ছোট টাকা নেই, তাই তিনি তার সব দামকে নিকটতম টাকায় রাউন্ড করার সিদ্ধান্ত নিয়েছে। যদি Artie 12 গামলা গেন্দা, 9 গামলা পেটুনিয়া এবং 17 গামলা বেগোনিয়া বিক্রি করে, তবে তিনি কত আয় করবেন?"
