question = "সানি আদা কেক এবং আপেল পাই বিক্রি করছে একটি তহবিল সংগ্রহের জন্য। শনিবার, সে 10 বাক্স আদা কেক এবং রবিবার-এর চেয়ে 4 কম বাক্স আপেল পাই বিক্রি করল। রবিবার, সে শনিবার-এর চেয়ে 5 বেশি বাক্স আদা কেক এবং 15 বাক্স আপেল পাই বিক্রি করল। যদি আদা কেক-এর দাম ৳6 হয় এবং আপেল পাই-এর দাম ৳15 হয়, তবে দুই দিনে সানি কত আয় করল?"
answer = "সে রবিবার-এ 10 + 5 = <<10+5=15>>15 বাক্স আদা কেক বিক্রি করল।\nসানি যে মোট আদা কেক বাক্স বিক্রি করল তার সংখ্যা হল 10 + 15 = <<10+15=25>>25।\nআদা কেক বিক্রি করে সানি আয় করল 25*৳6 = ৳<<25*6=150>>150।\nসে শনিবার-এ 15 - 4 = <<15-4=11>>11 বাক্স আপেল পাই বিক্রি করল।\nসানি যে মোট আপেল পাই বাক্স বিক্রি করল তার সংখ্যা হল 15 + 11 = <<15+11=26>>26।\nসে আপেল পাই বিক্রি করে আয় করল 26*৳15 = ৳<<26*15=390>>390।\nসুতরাং, দুই দিনে সানি আয় করল ৳150 + ৳390 = ৳<<150+390=540>>540।\n#### 540\n"
