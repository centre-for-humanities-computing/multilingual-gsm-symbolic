question = "জুলিয়া তার বাড়িতে একটি রাতের পার্টি-এর প্রস্তুতি নিচ্ছিল, যেখানে সে স্টু পরিবেশন করতে চেয়েছিল। সে লক্ষ্য করল যে তার কাছে প্লাস্টিকের চামচ নেই, তাই সে চামচ-এর একটি নতুন প্যাকেট কিনল। পরে, তার স্বামীও 5টি নতুন চামচ-এর একটি প্যাকেট কিনে জুলিয়া-কে দিল। যখন জুলিয়া স্টু বানাচ্ছিল, সে তার স্টু টেস্ট করার জন্য চামচ-এর তিনটি ব্যবহার করল। পরে, যখন সে টেবিল সাজাতে গেল, তার কাছে মোট 12টি চামচ ছিল। জুলিয়া যে প্যাকেটটি কিনেছিল তাতে কতটি চামচ ছিল?"
