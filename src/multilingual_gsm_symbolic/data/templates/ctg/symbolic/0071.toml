answer_annotated = "প্রথমে বের করো প্রতিটি {animal2}-এর কত {food} লাগে: {n1} {unit} * 2 - {n2} = <<{n1}*2-{n2}={2*n1-n2}>>{2*n1-n2} {unit}/{animal2}\nএখন বের করো মোট {animal2}গুলো-এর কত {food} লাগে: {2*n1-n2} {unit}/{animal2} * {k2} {animal2}গুলো = <<{2*n1-n2}*{k2}={k2*(2*n1-n2)}>>{k2*(2*n1-n2)} {unit}\nএখন বের করো মোট {animal1}গুলো-এর কত {food} লাগে: {n1} {unit}/{animal1} * {k1} {animal1}গুলো = <<{n1}*{k1}={k1*n1}>>{k1*n1} {unit}\nএখন মোট বের করার জন্য দুটি {food}-এর পরিমাণ যোগ করো: {k2*(2*n1-n2)} {unit} + {k1*n1} {unit} = <<{k2*(2*n1-n2)}+{k1*n1}={k1*n1 + k2*(2*n1 - n2)}>>{k1*n1 + k2*(2*n1 - n2)} {unit}\n#### {k1*n1 + k2*(2*n1 - n2)}\n"
