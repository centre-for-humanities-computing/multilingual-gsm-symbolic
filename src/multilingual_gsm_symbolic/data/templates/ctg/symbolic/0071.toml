question = "Nate তার পশুপালকে খড় খাওয়াচ্ছেন। প্রতিটি ছাগল-এর 5 কেজি লাগে, এবং প্রতিটি লামা-এর প্রতিটি ছাগল-এর প্রয়োজনের দ্বিগুণের চেয়ে 3 কেজি কম লাগে। যদি 15টি ছাগল এবং 12টি লামা থাকে, Nate-এর কত কেজি খড় লাগবে?"
answer = "প্রথমে বের করো প্রতিটি লামা-এর কত খড় লাগে: 5 কেজি * 2 - 3 = <<5*2-3=7>>7 কেজি/লামা\nএখন বের করো মোট লামাগুলো-এর কত খড় লাগে: 7 কেজি/লামা * 12 লামাগুলো = <<7*12=84>>84 কেজি\nএখন বের করো মোট ছাগলগুলো-এর কত খড় লাগে: 5 কেজি/ছাগল * 15 ছাগলগুলো = <<5*15=75>>75 কেজি\nএখন মোট বের করার জন্য দুটি খড়-এর পরিমাণ যোগ করো: 84 কেজি + 75 কেজি = <<84+75=159>>159 কেজি\n#### 159\n"
