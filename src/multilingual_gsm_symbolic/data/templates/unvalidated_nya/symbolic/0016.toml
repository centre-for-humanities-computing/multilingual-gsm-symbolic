question = "Sunny agulitsa mkate wa mankhwala ndi pai ya apulo poyang'ira ndalama. Pa Latsabata, agulitsa 10 bokosi za mkate wa mankhwala ndi 4 bokosi zochepa za pai ya apulo, kuposa pa Lamulo. Pa Lamulo, agulitsa 5 bokosi zambiri za mkate wa mankhwala kuposa pa Latsabata ndi 15 bokosi za pai ya apulo. Ngati mkate wa mankhwala mtengo wake ndi $6 ndi pai ya apulo mtengo wake ndi $15, ndi ndalama zingati zomwe Sunny anapeza kwa masiku awiri?"
answer = "Anagulitsa 10 + 5 = <<10+5=15>>15 bokosi za mkate wa mankhwala pa Lamulo.\nNambala yonse ya bokosi za mkate wa mankhwala zomwe Sunny zagulitsa ndi 10 + 15 = <<10+15=25>>25.\nSunny anapeza 25*$6 = $<<25*6=150>>150 pogulitsa mkate wa mankhwala.\nAnagulitsa 15 - 4 = <<15-4=11>>11 bokosi za pai ya apulo pa Latsabata.\nNambala yonse ya bokosi za pai ya apulo zomwe Sunny zagulitsa ndi 15 + 11 = <<15+11=26>>26.\nAnapeza 26*$15 = $<<26*15=390>>390 pogulitsa pai ya apulo.\nChoncho, Sunny anapeza $150 + $390 = $<<150+390=540>>540 kwa masiku awiri.\n#### 540\n"
