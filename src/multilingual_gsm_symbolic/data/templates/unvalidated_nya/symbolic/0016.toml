answer_annotated = "Anagulitsa {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} bokosi za {food} pa {d2}.\nNambala yonse ya bokosi za {food} zomwe {name} zagulitsa ndi {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} anapeza {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} pogulitsa {food}.\nAnagulitsa {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} bokosi za pai ya {fruit} pa {d1}.\nNambala yonse ya bokosi za pai ya {fruit} zomwe {name} zagulitsa ndi {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nAnapeza {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} pogulitsa pai ya {fruit}.\nChoncho, {name} anapeza {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} kwa masiku awiri.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
