question = "Dana angathe kuthamanga nthawi zinayi mwaukulu kuposa momwe angagwire, koma angathe kugwira pa kasiyo yomwe ndi theka monga momwe angathere kuthamanga. Ngati angathe kugwira pa 3 maila pa ola, maila zingati angathe kuyenda mwa zisanu ndi chimodzi maola ngati amatha gawo limodzi mwa zitatu ya nthawi kuthamanga ndi magawo awiri mwa zitatu ya nthawi kuyenda?"
