question = "ಫ್ರಾಂಕಿ ಪ್ರತೀ ರಾತ್ರಿ ತನ್ನ ಹಾಕಮ್ ಮುಗಿಸಿದ ನಂತರ ಟಿವಿ ನೋಡುತ್ತಾನೆ. ಸೋಮವಾರ ಮತ್ತು ಮಂಗಳವಾರ ರಂದು, ಅವನು ತನ್ನ ಪ್ರಿಯ ಕಾರ್ಯಕ್ರಮದ 1-ಗಂಟೆಯ ಎಪಿಸೋಡ್ ಅನ್ನು ಪ್ರತೀ ರಾತ್ರಿ ನೋಡಿದನು. ಬುಧವಾರ ರಂದು, ಅವನು 30-ನಿಮಿಷದ ಕಾರ್ಯಕ್ರಮದ ಕೆಲವು ಎಪಿಸೋಡ್‌ಗಳನ್ನು ನೋಡಿದನು. ಗುರುವಾರ ರಂದು, ಅವನು ಹಾಕಮ್ ಬೇಗ ಮುಗಿಸಿದನು ಮತ್ತು 1-ಗಂಟೆಯ ಎಪಿಸೋಡ್ ಮತ್ತು 30-ನಿಮಿಷದ ಕಾರ್ಯಕ್ರಮವನ್ನು ನೋಡಿದನು. ಶುಕ್ರವಾರ ರಂದು, ಅವನು ನಂತರದವರೆಗೆ ಎದ್ದು ಕೂರಲು ಸಾಧ್ಯವಾಯಿತು, ಆದ್ದರಿಂದ ಅವನು ಎರಡು 1-ಗಂಟೆಯ ಎಪಿಸೋಡ್‌ಗಳನ್ನು ನೋಡಿದನು. ಅವನು ಒಟ್ಟಾರೆ 7 ಗಂಟೆಗಳ ಟಿವಿ ನೋಡಿದ್ದರೆ, ಅವನು ಬುಧವಾರ ರಂದು ಎಷ್ಟು 30-ನಿಮಿಷದ ಎಪಿಸೋಡ್‌ಗಳನ್ನು ನೋಡಿದನು?"
