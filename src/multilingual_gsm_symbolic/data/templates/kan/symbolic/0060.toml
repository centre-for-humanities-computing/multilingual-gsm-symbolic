question = "ವಾಟ್ಸನ್ ಪ್ರತಿದಿನ 10-ಗಂಟೆಗಳ ಶಿಫ್ಟ್ ಕೆಲಸ ಮಾಡುತ್ತಾನೆ, ವಾರಕ್ಕೆ ಐದು ದಿನಗಳು. ಅವನು ಪ್ರತಿ ಗಂಟೆಗೆ $10 ಸಂಪಾದಿಸುತ್ತಾನೆ ಮತ್ತು ಕಂಪನಿಯು ಚೆನ್ನಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸಿದರೆ ಪ್ರತಿ ವಾರಕ್ಕೆ $300 ಬೋನಸ್ ಪಡೆಯುತ್ತಾನೆ. ಕಂಪನಿಯು ಪೂರ್ತಿ ತಿಂಗಳಿನಾದ್ಯಂತ ತುಂಬಾ ಚೆನ್ನಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸಿದರೆ, ವಾಟ್ಸನ್ ಏಪ್ರಿಲ್ನಲ್ಲಿ ಎಷ್ಟು ಹಣ ಸಂಪಾದಿಸಿದನು?"
