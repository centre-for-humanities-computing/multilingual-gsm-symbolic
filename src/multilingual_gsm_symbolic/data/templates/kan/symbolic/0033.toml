question = "ಕಾರೋಲ್ ಮತ್ತು ಜೆನಿಫರ್ ಅವರು ಲಾಸ್ ಏಂಜಲೀಸ್ ನಲ್ಲಿರುವ ಸಹೋದರಿಯರು ಮತ್ತು ಪ್ರಸಿದ್ಧ ವ್ಯಕ್ತಿಗಳ ಬಳಿ ಸಹಿಗಳನ್ನು ಸಂಗ್ರಹಿಸಲು ಇಷ್ಟಪಡುತ್ತಾರೆ. ಶಾಲೆಯಿಂದ ಅವರ ಬೇಸಿಗೆ ರಜೆ ಸಮಯದಲ್ಲಿ, ಸಹೋದರಿಯರು ಪ್ರತಿದಿನ ಮಧ್ಯಾಹ್ನ ಸಹಿಗಳನ್ನು ಸಂಗ್ರಹಿಸಲು ಕಳೆಯುತ್ತಾರೆ. ಐದು ವಾರಗಳ ನಂತರ, ಕಾರೋಲ್ ಮತ್ತು ಜೆನಿಫರ್ ಅವರು ತಮ್ಮ ಆಟೋಗ್ರಾಫ್ ಪುಸ್ತಕಗಳನ್ನು ಹೋಲಿಸುತ್ತಾರೆ, ಪ್ರತಿ ಸಹೋದರಿಯು ಸಂಗ್ರಹಿಸಿದ ಸಹಿಗಳ ಸಂಖ್ಯೆಯನ್ನು ಎಣಿಸುತ್ತಾರೆ. ಕಾರೋಲ್ ಅವರ ಪುಸ್ತಕದಲ್ಲಿ 20 ಸಹಿಗಳಿವೆ ಮತ್ತು ಜೆನಿಫರ್ ಅವರಲ್ಲಿ 44 ಇವೆ. ಸಹೋದರಿಯರಿಗೆ ಮೂರು ಹೆಚ್ಚು ವಾರಗಳ ಬೇಸಿಗೆ ರಜೆ ಇದೆ, ಮತ್ತು ರಜೆಯ ಅಂತ್ಯದೊಳಗೆ ಅವರು ತಮ್ಮ ನಡುವೆ 100 ಸಹಿಗಳನ್ನು ತಲುಪಲು ನಿರ್ಧರಿಸುತ್ತಾರೆ. ಅವರ ಗುರಿಯನ್ನು ತಲುಪಲು ಸಹೋದರಿಯರು ಎಷ್ಟು ಸಹಿಗಳನ್ನು ಸಂಗ್ರಹಿಸಬೇಕು?"
