question = "ಅಜ್ಜಿ ಪ್ರತಿದಿನ 3 ಮೈಲ್ ನಡೆಯುತ್ತಾಳೆ, ಇದು ಅವಳ ಪ್ರಿಯ ನಡಿಗೆ ಮಾರ್ಗವಾಗಿದೆ, ಇದರಲ್ಲಿ 2 ಮೈಲ್ ಕರಾವಳಿಯಲ್ಲಿ ಮತ್ತು 1 ಮೈಲ್(ಗಳು) ಚೌಡದ ಮೇಲೆ ನಡೆಯುವುದು ಸೇರಿದೆ. ಚೌಡದ ಮೇಲೆ, ಅಜ್ಜಿ ಕರಾವಳಿಯಲ್ಲಿ ನಡೆಯುವ ವೇಗಕ್ಕಿಂತ ಎರಡು ಪಟ್ಟು ವೇಗದಲ್ಲಿ ನಡೆಯುತ್ತಾಳೆ. ನಡಿಗೆಯಲ್ಲಿ 40 ನಿಮಿಷಗಳನ್ನು ಕರಾವಳಿಯಲ್ಲಿ ಕಳೆಯಲಾಗುತ್ತದೆ, ಆಗ ಅವಳು ಸಂಪೂರ್ಣ 3-ಮೈಲ್ ನಡಿಗೆಯನ್ನು ಪೂರ್ಣಗೊಳಿಸಲು ಎಷ್ಟು ಸಮಯ ಬೇಕು, ನಿಮಿಷಗಳಲ್ಲಿ?"
