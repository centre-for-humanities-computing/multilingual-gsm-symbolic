question = "كارول وجنيفر أختان من لوس أنجلوس اللي بيحبوا يجمعوا توقيعات من مشاهير. خلال إجازة الصيف من المدرسة، الأختين بيقضوا كل بعد الظهر بيجمعوا توقيعات. بعد خمسة أسابيع، كارول وجنيفر بتقارنوا كتب التوقيعات بتاعتهن، وبتعدوا عدد التوقيعات اللي كل أخت جمعتها. كارول عندها 20 توقيع في كتابها، وجنيفر عندها 44. الأختين عندهن ثلاثة أسابيع إضافية من إجازة الصيف، وقرروا إنهم عايزين يوصلوا لـ100 توقيع بينهم بنهاية الإجازة. إيه عدد التوقيعات اللي الأختين محتاجين يجمعوا عشان يوصلوا لهدفهم؟"
