question = "فرانكي يشاهد التلفاز بعد ما يخلص واجباته كل ليلة. يوم الاثنين والثلاثاء, شاف حلقة من مسلسله المفضل مدتها 1 ساعة كل ليلة. يوم الأربعاء, شاف بضع حلقات من مسلسل مدته 30 دقيقة. يوم الخميس, خلص واجباته مبكر وشاف حلقة مدتها 1 ساعة ومسلسل مدته 30 دقيقة. يوم الجمعة, قدر ياخد وقت متأخر، فشاف اثنان حلقات مدتها 1 ساعة. لو شاف 7 ساعات تلفاز في المجموع، كام حلقة مدتها 30 دقيقة شافها يوم الأربعاء؟"
answer = "لنفترض أن E هو عدد الحلقات اللي شافها يوم الأربعاء. بعد الاثنين, عنده 7 - 1 = <<7-1=6>>6 ساعة تلفاز متبقية. بعد الثلاثاء, عنده 6 - 1 = <<6-1=5>>5 ساعة تلفاز متبقية. بعد الخميس, عنده 5 - 1 - 0.5 = 3.5 ساعة تلفاز متبقية. بعد الجمعة, عنده 3.5 - 2 = 1.5 ساعة تلفاز متبقية. كل حلقة مدتها 30 دقيقة هي 1/2 ساعة. إذن، E = 1.5/0.5 = 3 حلقات. #### 3"
