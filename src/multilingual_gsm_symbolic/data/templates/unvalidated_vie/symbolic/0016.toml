answer_annotated = "Anh ấy đã bán {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} hộp {food} vào {d2}.\nTổng số hộp {food} mà {name} đã bán là {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} đã kiếm được {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} từ việc bán {food}.\nAnh ấy đã bán {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} hộp bánh {fruit} vào {d1}.\nTổng số hộp bánh {fruit} mà {name} đã bán là {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nAnh ấy đã kiếm được {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} từ việc bán bánh {fruit}.\nVậy, {name} đã kiếm được {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} trong hai ngày.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
