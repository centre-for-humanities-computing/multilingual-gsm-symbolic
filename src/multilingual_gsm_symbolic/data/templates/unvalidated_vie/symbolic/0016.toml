question = "Sunny đang bán bánh gừng và bánh táo để gây quỹ. Vào Thứ Bảy, anh ấy đã bán 10 hộp bánh gừng và 4 hộp bánh táo ít hơn so với Chủ Nhật. Vào Chủ Nhật, anh ấy đã bán 5 hộp bánh gừng nhiều hơn so với Thứ Bảy và 15 hộp bánh táo. Nếu bánh gừng giá $6 và bánh táo giá $15, thì Sunny đã kiếm được bao nhiêu trong hai ngày?"
answer = "Anh ấy đã bán 10 + 5 = <<10+5=15>>15 hộp bánh gừng vào Chủ Nhật.\nTổng số hộp bánh gừng mà Sunny đã bán là 10 + 15 = <<10+15=25>>25.\nSunny đã kiếm được 25*$6 = $<<25*6=150>>150 từ việc bán bánh gừng.\nAnh ấy đã bán 15 - 4 = <<15-4=11>>11 hộp bánh táo vào Thứ Bảy.\nTổng số hộp bánh táo mà Sunny đã bán là 15 + 11 = <<15+11=26>>26.\nAnh ấy đã kiếm được 26*$15 = $<<26*15=390>>390 từ việc bán bánh táo.\nVậy, Sunny đã kiếm được $150 + $390 = $<<150+390=540>>540 trong hai ngày.\n#### 540\n"
