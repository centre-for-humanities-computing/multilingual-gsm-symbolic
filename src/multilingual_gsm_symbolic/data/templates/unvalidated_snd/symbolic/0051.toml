question = "آرٽي ڪسان بزار ۾ ڦول جو اسٽينڊ رکي ٿو. هو ڦول جا ٽي قسم وڪري ٿو: گيندا، پيٽونيا ۽ بيگونيا. هو عام طور تي گيندا هر گجر لاءِ $2.74 ۾ وڪري ٿو، پيٽونيا هر گجر لاءِ $1.87 ۾ ۽ بيگونيا هر گجر لاءِ $2.12 ۾. آرٽي وٽ اڄ ڦرڻي ناهي، تنهنڪري هن طئي ڪيو آهي ته پنهنجي سڀني اگهن کي ويجهي ڊالر تائين round ڪري. جيڪڏهن آرٽي گيندا جا 12 گجرs، پيٽونيا جا 9 گجرs ۽ بيگونيا جا 17 گجرs وڪري ٿو، ته هو ڪيترو ڪمائيندو؟"
