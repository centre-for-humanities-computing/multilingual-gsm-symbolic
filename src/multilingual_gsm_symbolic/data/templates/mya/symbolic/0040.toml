question = "စယ်လီ သည် အားလပ်ရက်အတွက် ကမ်းခြေသို့ သွားခဲ့သည်။ သူမ၏ မိဘများသည် သူမလိုချင်ရာ ဝယ်ယူရန် $15 ပေးခဲ့သည်။ ဆုလာဘ်ဆိုင်တွင် တာဖီသည် \"1 ပေါင်ကို ပေါင်တစ်ပေါင်လျှင် $3 ဈေးဖြင့် ဝယ်ပါက 1 ပေါင် 1/2 လျှော့ဈေးရရှိမည်\" ဟု အရောင်းရှိသည်။ သူမသည် 4 ပေါင် ယူခဲ့သည်။ သူမသည် ပင်လယ်ခွံ ရောထွေးအိတ်တစ်အိတ်ကို $1.5 ဖြင့် ဝယ်ခဲ့သည်။ နှင့် သံလိုက် 4 ခုကို တစ်လုံးလျှင် $0.25 ဖြင့် ဝယ်ခဲ့သည်။ စယ်လီ တွင် ဘယ်လောက်ပိုက်ဆံ ကျန်ရှိသေးသနည်း။"
answer = "စယ်လီ သည် $3 ဖြင့် 1 ပေါင် ဝယ်ယူနေသည်။ နှင့် 1 ပေါင် 1/2 လျှော့ဈေးရရှိသည်။ ထို့ကြောင့် 1 ပေါင်၏ 1/2 လျှော့ဈေးမှာ $3*1/2 = $1.5 ဖြစ်သည်။ ကျန်ရှိသော 2 ပေါင်သည် လျှော့ဈေးမရပါနှင့် 2*$3 = $6 ကုန်ကျသည်၊ ထို့ကြောင့် စုစုပေါင်းမှာ $3+$3/2+$6=$21/2 ဖြစ်သည်။\n4 သံလိုက်များကို တစ်လုံးလျှင် $0.25 ဖြင့် 4*0.25=$<<4*0.25=1>>1 ဖြစ်သည်။\nသူမဝယ်ယူထားသော အရာအားလုံးကို ပေါင်းလိုက်သောအခါ $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13 ဖြစ်သည်။\nသူမတွင် $15 ရှိပြီး $13 ကုန်ကျခဲ့သောကြောင့် သူမတွင် $15-$13 = $<<15-13=2>>2 ကျန်ရှိသည်။\n#### 2\n"
