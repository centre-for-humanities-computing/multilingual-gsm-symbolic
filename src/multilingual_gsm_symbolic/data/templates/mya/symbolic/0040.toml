question_annotated = "{name,စယ်လီ} သည် အားလပ်ရက်အတွက် ကမ်းခြေသို့ သွားခဲ့သည်။ သူမ၏ မိဘများသည် သူမလိုချင်ရာ ဝယ်ယူရန် ${total,15} ပေးခဲ့သည်။ ဆုလာဘ်ဆိုင်တွင် တာဖီသည် \"{n1,1} ပေါင်ကို ပေါင်တစ်ပေါင်လျှင် ${p1,3} ဈေးဖြင့် ဝယ်ပါက {n2,1} ပေါင် {discount,1/2} လျှော့ဈေးရရှိမည်\" ဟု အရောင်းရှိသည်။ သူမသည် {n12,4} ပေါင် ယူခဲ့သည်။ သူမသည် ပင်လယ်ခွံ ရောထွေးအိတ်တစ်အိတ်ကို ${p2,1.5} ဖြင့် ဝယ်ခဲ့သည်။ နှင့် သံလိုက် {n3,4} ခုကို တစ်လုံးလျှင် ${p3,0.25} ဖြင့် ဝယ်ခဲ့သည်။ {name,စယ်လီ} တွင် ဘယ်လောက်ပိုက်ဆံ ကျန်ရှိသေးသနည်း။\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
