question_annotated = "{name,အေမလီ} သည် တစ်မိနစ်လျှင် {n1,6} {food,ပုစွန်} ကို ခွာနိုင်ပြီး {t,10} မိနစ်အတွင်း {n2,30} {food,ပုစွန်} ကို ချက်ပြုတ်နိုင်သည်။ {total,90} {food,ပုစွန်} ကို ခွာပြီး ချက်ပြုတ်ရန် သူမအတွက် မည်မျှကြာမည်နည်း။ {name,အေမလီ} သည် ခွာခြင်းနှင့် ချက်ပြုတ်ခြင်းကို တစ်ပြိုင်နက်တည်း ပြုလုပ်၍ မရနိုင်ပါ။\n\n#init:\n- name = sample(names_female)\n- food = sample([\"ပုစွန်\", \"ကြက်သွန်\", \"ခရုသင်း\", \"မြှောင်\", \"ပုစွန်ပုလဲ\"])\n- $n1 = range(4, 15)\n- $n2 = range(20, 50, 5)\n- $t = range(5, 20)\n- $total = range(60, 200, 10)\n\n#conditions:\n- divides(total, n1)\n- divides(total, n2)\n\n#answer: total // n1 + (total // n2) * t\n"
answer_annotated = "ပထမဦးစွာ {name} သည် {food} များကို ခွာရန် အချိန်မည်မျှ ကြာသည်ကို ရှာပါ: {total} {food} / {n1} {food}/မိနစ် = <<{total}/{n1}={total//n1}>>{total//n1} မိနစ်\nထို့နောက် {food} ကို ချက်ပြုတ်ရန် လိုအပ်သော အပိုင်းအစ အရေအတွက်ကို ရှာပါ: {total} {food} / {n2} {food}/အပိုင်း = <<{total}/{n2}={total//n2}>>{total//n2} အပိုင်း\nထို့နောက် အပိုင်းအစ အရေအတွက်ကို အပိုင်းတစ်ခုစီ၏ အချိန်နှင့် မြှောက်၍ စုစုပေါင်း ချက်ပြုတ်ချိန်ကို ရှာပါ: {total//n2} အပိုင်း * {t} မိနစ်/အပိုင်း = <<{total//n2}*{t}={(total//n2)*t}>>{(total//n2)*t} မိနစ်\nထို့နောက် ခွာရန် ကြာချိန်ကို ပေါင်း၍ {name} ကုန်ဆုံးစေသော စုစုပေါင်း အချိန်ကို ရှာပါ: {(total//n2)*t} မိနစ် + {total//n1} မိနစ် = <<{(total//n2)*t}+{total//n1}={(total//n2)*t + total//n1}>>{(total//n2)*t + total//n1} မိနစ်\n#### {(total//n2)*t + total//n1}\n"
