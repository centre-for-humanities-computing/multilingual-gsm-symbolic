question = "အေမလီ သည် တစ်မိနစ်လျှင် 6 ပုစွန် ကို ခွာနိုင်ပြီး 10 မိနစ်အတွင်း 30 ပုစွန် ကို ချက်ပြုတ်နိုင်သည်။ 90 ပုစွန် ကို ခွာပြီး ချက်ပြုတ်ရန် သူမအတွက် မည်မျှကြာမည်နည်း။ အေမလီ သည် ခွာခြင်းနှင့် ချက်ပြုတ်ခြင်းကို တစ်ပြိုင်နက်တည်း ပြုလုပ်၍ မရနိုင်ပါ။"
answer = "ပထမဦးစွာ အေမလီ သည် ပုစွန် များကို ခွာရန် အချိန်မည်မျှ ကြာသည်ကို ရှာပါ: 90 ပုစွန် / 6 ပုစွန်/မိနစ် = <<90/6=15>>15 မိနစ်\nထို့နောက် ပုစွန် ကို ချက်ပြုတ်ရန် လိုအပ်သော အပိုင်းအစ အရေအတွက်ကို ရှာပါ: 90 ပုစွန် / 30 ပုစွန်/အပိုင်း = <<90/30=3>>3 အပိုင်း\nထို့နောက် အပိုင်းအစ အရေအတွက်ကို အပိုင်းတစ်ခုစီ၏ အချိန်နှင့် မြှောက်၍ စုစုပေါင်း ချက်ပြုတ်ချိန်ကို ရှာပါ: 3 အပိုင်း * 10 မိနစ်/အပိုင်း = <<3*10=30>>30 မိနစ်\nထို့နောက် ခွာရန် ကြာချိန်ကို ပေါင်း၍ အေမလီ ကုန်ဆုံးစေသော စုစုပေါင်း အချိန်ကို ရှာပါ: 30 မိနစ် + 15 မိနစ် = <<30+15=45>>45 မိနစ်\n#### 45\n"
