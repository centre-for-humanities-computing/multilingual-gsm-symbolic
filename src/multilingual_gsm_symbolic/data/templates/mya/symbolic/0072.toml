question = "မိုင်ကယ် သည် 5 လူ ဦးနှင့် စာပို့ဆွဲဖော်လုပ်ခဲ့သည်။ သူသည် ၎င်းတို့ထဲမှ 2 ဦး နှင့် စာပို့ဆွဲခြင်းကို ရပ်တန့်လိုက်သည်။ ၎င်းတို့တစ်ဦးစီသည် တစ်ပတ်လျှင် 2 စာစောင် ပို့လေ့ရှိပြီး ၎င်းတို့တွင် 5 စာမျက်နှာ ပါရှိသည်။ သူလည်း အလားတူ ပြန်လည်ရေးသားသည်။ သူသည် စာမျက်နှာတစ်မျက်နှာကို 6 မိနစ်တိုင်း ရေးနိုင်သည်။ သူသည် တစ်ပတ်လျှင် ရေးသားရန် နာရီမည်မျှ အချိန်ကုန်ဆုံးသနည်း။"
