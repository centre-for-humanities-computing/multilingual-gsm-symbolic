answer = "ပွဲ တွင် တက်ရောက်ခဲ့သူ စုစုပေါင်း 25 အမျိုးသား နှင့် 15 အမျိုးသမီး = <<25+15=40>>40 ဦး ရှိခဲ့သည်။\nတစ်နာရီ ကြာပြီးနောက် လူ 40 ဦး၏ 1/4 = <<40*1/4=10>>10 ဦးသည် ပွဲ မှ ထွက်ခွာသွားကြသည်။\nဆိုလိုသည်မှာ လူ 40 ဦးမှ 10 ဦးကို နုတ်လျှင် = <<40-10=30>>30 ဦး ကျန်ရှိခဲ့သည်။\nကျန်ရှိခဲ့သူ 30 ဦးထဲမှ လူ 30 ဦးမှ 22 အမျိုးသား ကို နုတ်လျှင် = <<30-22=8>>8 သည် အမျိုးသမီး ဖြစ်သည်။\n#### 8\n"
