question = "ဖရန့်ကီ သည် တစ်ညတိုင်း သူ့အိမ်စာပြီးသွားပြီးနောက် ရုပ်မြင်သံကြား ကြည့်လေ့ရှိသည်။ တနင်္လာနေ့ နှင့် အင်္ဂါနေ့ တွင် သူသည် သူ့အကြိုက်ဆုံး အစီအစဉ်၏ 1 နာရီ အစီအစဉ်တစ်ခုကို ညတိုင်း ကြည့်ခဲ့သည်။ ဗုဒ္ဓဟူးနေ့ တွင် သူသည် 30 မိနစ် အစီအစဉ်၏ အစီအစဉ်အနည်းငယ်ကို ကြည့်ခဲ့သည်။ ကြာသပတေးနေ့ တွင် သူသည် အိမ်စာကို စောစီးစွာ ပြီးစီးခဲ့ပြီး 1 နာရီ အစီအစဉ်တစ်ခုနှင့် 30 မိနစ် အစီအစဉ်တစ်ခုကို ကြည့်ခဲ့သည်။ သောကြာနေ့ တွင် သူသည် ညနက်အထိ နိုးနေခွင့်ရခဲ့သဖြင့် နှစ် ခုသော 1 နာရီ အစီအစဉ်များကို ကြည့်ခဲ့သည်။ သူသည် စုစုပေါင်း 7 နာရီ ရုပ်မြင်သံကြား ကြည့်ခဲ့လျှင် ဗုဒ္ဓဟူးနေ့ တွင် သူသည် 30 မိနစ် အစီအစဉ် မည်မျှ ကြည့်ခဲ့သနည်း။"
answer = "ဗုဒ္ဓဟူးနေ့ တွင် သူကြည့်ခဲ့သော အစီအစဉ်အရေအတွက်ကို E ဟု သတ်မှတ်ပါစို့။\nတနင်္လာနေ့ နောက်တွင် သူတွင် ရုပ်မြင်သံကြား ကြည့်ရန် ကျန်ရှိသော အချိန် 7 - 1 = <<7-1=6>>6 နာရီ ရှိသည်။\nအင်္ဂါနေ့ နောက်တွင် သူတွင် ရုပ်မြင်သံကြား ကြည့်ရန် ကျန်ရှိသော အချိန် 6 - 1 = <<6-1=5>>5 နာရီ ရှိသည်။\nကြာသပတေးနေ့ နောက်တွင် သူတွင် ရုပ်မြင်သံကြား ကြည့်ရန် ကျန်ရှိသော အချိန် 5 - 1 - 0.5 = 3.5 နာရီ ရှိသည်။\nသောကြာနေ့ နောက်တွင် သူတွင် ရုပ်မြင်သံကြား ကြည့်ရန် ကျန်ရှိသော အချိန် 3.5 - 2 = 1.5 နာရီ ရှိသည်။\nတစ်ခုစီ 30 မိနစ် အစီအစဉ်သည် 1/2 နာရီ ဖြစ်သည်။\nထို့ကြောင့်၊ E = 1.5/0.5 = 3 အစီအစဉ်။\n#### 3\n"
