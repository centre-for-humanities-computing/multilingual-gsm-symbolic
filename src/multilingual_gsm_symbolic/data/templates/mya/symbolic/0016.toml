answer = "သူသည် အတော တွင် ဂျင်းကိတ် အသေ့ 10 + 5 = <<10+5=15>>15 ကို ရောင်းချခဲ့သည်။\nစနီ ရောင်းချခဲ့သော ဂျင်းကိတ် အသေ့ စုစုပေါင်းအရေအတွက်မှာ 10 + 15 = <<10+15=25>>25 ဖြစ်သည်။\nစနီ သည် ဂျင်းကိတ် ရောင်းချရရှိသော ငွေမှာ 25*$6 = $<<25*6=150>>150 ဖြစ်သည်။\nသူသည် စနေ တွင် အာပေါ ပါး အသေ့ 15 - 4 = <<15-4=11>>11 ကို ရောင်းချခဲ့သည်။\nစနီ ရောင်းချခဲ့သော အာပေါ ပါး အသေ့ စုစုပေါင်းအရေအတွက်မှာ 15 + 11 = <<15+11=26>>26 ဖြစ်သည်။\nသူသည် အာပေါ ပါး ရောင်းချရရှိသော ငွေမှာ 26*$15 = $<<26*15=390>>390 ဖြစ်သည်။\nထို့ကြောင့် စနီ သည် နှစ်ရက်တာအတွက် $150 + $390 = $<<150+390=540>>540 ရရှိခဲ့သည်။\n#### 540\n"
