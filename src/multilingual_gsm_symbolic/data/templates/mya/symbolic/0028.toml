question = "ဆေးရုံ တစ်ခုတွင် စွမ်းဆောင်ရည် 1000 အိပ်ရာ များ ရှိပြီး ၎င်းတို့၏ 1/5 သည် နေရာယူထားသည်။ ကော်ရိုနာဗိုင်းရပ်စ် ဖြစ်ပွားမှု ကြောင့် နေ့စဉ် 50 ဦးသော လူနာများကို ဆေးရုံ သို့ လက်ခံယူထားသည်။ 2 ပတ်ပြီးနောက် ဆေးရုံ ရှိ နေရာလွတ် အိပ်ရာ များ စုစုပေါင်းအရေအတွက်ကို တွက်ချက်ပါ။"
answer = "ဆေးရုံ ၏ အိပ်ရာ များ၏ စုစုပေါင်း စွမ်းဆောင်ရည်၏ 1/5 သည် နေရာယူထားပါက၊ ၎င်းသည် 1/5 * 1000 = <<1000*1/5=200>>200 အိပ်ရာ များတွင် လူနာများ ရှိသည်ဟု ဆိုလိုသည်။\nအသစ်လက်ခံယူမှု မရှိသော ဆေးရုံ ရှိ အိပ်ရာ များ စုစုပေါင်းအရေအတွက်မှာ 1000 အိပ်ရာ များ - 200 အိပ်ရာ များ = <<1000-200=800>>800 အိပ်ရာ များ ဖြစ်သည်။\nနေ့စဉ် လူ 50 ဦး လက်ခံယူပါက၊ တစ်ပတ်အကြာတွင် ဆေးရုံ ရှိ လူနာ စုစုပေါင်းအရေအတွက်မှာ 50 ဦး/နေ့ * 7 နေ့/ပတ် = 350 ဦး ဖြစ်သည်။\n2 ပတ်ပြီးနောက်၊ ဆေးရုံ သို့ လက်ခံယူလိုက်သော လူနာ စုစုပေါင်းအရေအတွက်မှာ 350 ဦး/ပတ် * 2 ပတ် = <<350*2=700>>700 ဦး ဖြစ်ပြီး ၎င်းတို့ တစ်ဦးချင်းစီသည် အိပ်ရာ တစ်ခုစီကို အသုံးပြုကြသည်။\nအသစ်လက်ခံယူမှု မတိုင်မီ ဆေးရုံ တွင် နေရာလွတ် အိပ်ရာ များ 800 ရှိခဲ့ပါက၊ စုစုပေါင်းအရေအတွက်မှာ 800 အိပ်ရာ များ - 700 အိပ်ရာ များ = <<800-700=100>>100 နေရာလွတ် အိပ်ရာ များသို့ လျော့နည်းသွားသည်။\n#### 100\n"
