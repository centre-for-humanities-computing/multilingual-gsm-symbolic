answer_annotated = "{facility} ၏ {item} များ၏ စုစုပေါင်း စွမ်းဆောင်ရည်၏ {frac} သည် နေရာယူထားပါက၊ ၎င်းသည် {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} များတွင် လူနာများ ရှိသည်ဟု ဆိုလိုသည်။\nအသစ်လက်ခံယူမှု မရှိသော {facility} ရှိ {item} များ စုစုပေါင်းအရေအတွက်မှာ {total} {item} များ - {int(total*frac)} {item} များ = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item} များ ဖြစ်သည်။\nနေ့စဉ် လူ {daily} ဦး လက်ခံယူပါက၊ တစ်ပတ်အကြာတွင် {facility} ရှိ လူနာ စုစုပေါင်းအရေအတွက်မှာ {daily} ဦး/နေ့ * 7 နေ့/ပတ် = {daily*7} ဦး ဖြစ်သည်။\n{period} ပတ်ပြီးနောက်၊ {facility} သို့ လက်ခံယူလိုက်သော လူနာ စုစုပေါင်းအရေအတွက်မှာ {daily*7} ဦး/ပတ် * {period} ပတ် = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} ဦး ဖြစ်ပြီး ၎င်းတို့ တစ်ဦးချင်းစီသည် {item} တစ်ခုစီကို အသုံးပြုကြသည်။\nအသစ်လက်ခံယူမှု မတိုင်မီ {facility} တွင် နေရာလွတ် {item} များ {total-int(total*frac)} ရှိခဲ့ပါက၊ စုစုပေါင်းအရေအတွက်မှာ {total-int(total*frac)} {item} များ - {daily*period*7} {item} များ = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} နေရာလွတ် {item} များသို့ လျော့နည်းသွားသည်။\n#### {total - (total * frac + daily * period * 7)}\n"
