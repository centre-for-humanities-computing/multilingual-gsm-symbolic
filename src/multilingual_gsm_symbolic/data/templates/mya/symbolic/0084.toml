question = "မာရီယာ သည် စတော့ရှယ်ယာ 8 စုကို တစ်စုလျှင် ကျပ်8 ဖြင့် ဝယ်ယူသည်။ စတော့ဈေးနှုန်းသည် မာရီယာ ပိုင်ဆိုင်ထားသော ပထမနှစ်တွင် 50% တိုးလာပြီး၊ ထို့နောက် ဒုတိယနှစ်တွင် 25% လျော့ကျသည်။ မာရီယာ ၏ ရှယ်ယာအားလုံး၏ နောက်ဆုံးတန်ဖိုးမှာ အဘယ်နည်း။"
answer = "ပထမဦးစွာ မာရီယာ ၏ ဝယ်ယူမှု၏ အစပိုင်း စုစုပေါင်းတန်ဖိုးကို ရှာပါ: 8 စု * ကျပ်8/စု = ကျပ်<<8*8=64>>64\nထို့နောက် ပထမဈေးတိုးပမာဏကို ရှာပါ: ကျပ်64 * 0.5 = ကျပ်<<64*0.5=32>>32\nထိုပမာဏကို အစပိုင်းတန်ဖိုးနှင့် ပေါင်းထည့်၍ ပထမနှစ်အပြီး တန်ဖိုးကို ရှာပါ: ကျပ်64 + ကျပ်32 = ကျပ်<<64+32=96>>96\nထို့နောက် ထိုပမာဏကို 25% ဖြင့် မြှောက်၍ ဒုတိယနှစ်တွင် လျော့ကျသော ပမာဏကို ရှာပါ: ကျပ်96 * 25% = ကျပ်<<96*25*.01=24>>24\nထို့နောက် ထိုပမာဏကို ပထမနှစ်အပြီး တန်ဖိုးမှ နုတ်၍ နောက်ဆုံးတန်ဖိုးကို ရှာပါ: ကျပ်96 - ကျပ်24 = ကျပ်<<96-24=72>>72\n#### 72\n"
