question_annotated = "{name,မာရီယာ} သည် စတော့ရှယ်ယာ {n,8} စုကို တစ်စုလျှင် {cur,ကျပ်}{p,8} ဖြင့် ဝယ်ယူသည်။ စတော့ဈေးနှုန်းသည် {name,မာရီယာ} ပိုင်ဆိုင်ထားသော ပထမနှစ်တွင် {r1,50}% တိုးလာပြီး၊ ထို့နောက် ဒုတိယနှစ်တွင် {r2,25}% လျော့ကျသည်။ {name,မာရီယာ} ၏ ရှယ်ယာအားလုံး၏ နောက်ဆုံးတန်ဖိုးမှာ အဘယ်နည်း။\n\n#init:\n- name = sample(names_female)\n- cur = sample(currencies_sym)\n- $n = range(5, 20)\n- $p = range(5, 100)\n- $r1 = range(10, 100, 5)\n- $r2 = range(5, 50, 5)\n\n#conditions:\n- is_int(n * p * r1/100)\n- is_int(n * p * (1 + r1/100) * (1 - r2/100))\n\n#answer: ensure_int(n * p * (1 + r1/100) * (1 - r2/100))\n"
answer_annotated = "ပထမဦးစွာ {name} ၏ ဝယ်ယူမှု၏ အစပိုင်း စုစုပေါင်းတန်ဖိုးကို ရှာပါ: {n} စု * {cur}{p}/စု = {cur}<<{n}*{p}={n*p}>>{n*p}\nထို့နောက် ပထမဈေးတိုးပမာဏကို ရှာပါ: {cur}{n*p} * {r1/100} = {cur}<<{n*p}*{r1/100}={n*p*r1/100}>>{int(n*p*r1/100)}\nထိုပမာဏကို အစပိုင်းတန်ဖိုးနှင့် ပေါင်းထည့်၍ ပထမနှစ်အပြီး တန်ဖိုးကို ရှာပါ: {cur}{n*p} + {cur}{n*p*r1/100} = {cur}<<{n*p}+{n*p*r1/100}={n*p*(1+r1/100)}>>{int(n*p*(1+r1/100))}\nထို့နောက် ထိုပမာဏကို {r2}% ဖြင့် မြှောက်၍ ဒုတိယနှစ်တွင် လျော့ကျသော ပမာဏကို ရှာပါ: {cur}{n*p*(1+r1/100)} * {r2}% = {cur}<<{n*p*(1+r1/100)}*{r2}*.01={n*p*(1+r1/100)*r2/100}>>{int(n*p*(1+r1/100)*r2/100)}\nထို့နောက် ထိုပမာဏကို ပထမနှစ်အပြီး တန်ဖိုးမှ နုတ်၍ နောက်ဆုံးတန်ဖိုးကို ရှာပါ: {cur}{int(n*p*(1+r1/100))} - {cur}{int(n*p*(1+r1/100)*r2/100)} = {cur}<<{int(n*p*(1+r1/100))}-{int(n*p*(1+r1/100)*r2/100)}={ensure_int(n*p*(1+r1/100)*(1-r2/100))}>>{ensure_int(n*p*(1+r1/100)*(1-r2/100))}\n#### {ensure_int(n*p*(1+r1/100)*(1-r2/100))}\n"
