question = "စောဖီ သည် သူမ၏ မောင် ကို ကြည့်ရှုပေးသောအခါ သူအတွက် ကစားစရာ အမျိုးမျိုးကို ထုတ်ယူသည်။ တည်ဆောက်ကစားစရာ အုတ်ခဲအိတ်တွင် အုတ်ခဲ 31 ခု ပါရှိသည်။ အိမ်မွေးတိရစ္ဆာန် ပုံစံ ကစားစရာ အိတ်တွင် အိမ်မွေးတိရစ္ဆာန် ပုံစံ ကစားစရာ 8 ခု ပါရှိသည်။ စုပုံကစားသော ကွင်းများ အဆောက်အအုံတွင် အရောင်စုံ ကွင်း 9 ခု ရှိသည်။ စောဖီ သည် မကြာသေးမီက ဘောလုံးပုံစံ ကစားစရာ ပိုက်တစ်ပိုက်ကို ဝယ်ယူခဲ့ပြီး သူမ၏ မောင် အတွက် ကစားစရာ စုစုပေါင်း အရေအတွက်ကို 62 သို့ ရောက်ရှိစေခဲ့သည်။ ပိုက်ထဲတွင် ဘောလုံးပုံစံ ကစားစရာ မည်မျှ ပါရှိသနည်း။"
