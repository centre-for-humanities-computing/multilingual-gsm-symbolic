answer = "ကောက်ညှင်း နှင့် ကနိုလီ မည်သည့်အရာကိုမျှ ဝယ်ယူခြင်းမပြုမီ၊ အလန် တွင် ကနိုလီများ အရေအတွက်ထက် ကောက်ညှင်းများ အရေအတွက် နှစ်ဆ ပိုများခဲ့သည်၊ ဆိုလိုသည်မှာ 40 ကနိုလီများ*5 ကောက်ညှင်း/ကနိုလီ = <<40*5=200>>200 ကောက်ညှင်းများ\nအလန် တွင် ရှိခဲ့သော ကောက်ညှင်းများနှင့် ကနိုလီများ ၏ စုစုပေါင်းအရေအတွက်မှာ 200 ကောက်ညှင်းများ + 40 ကနိုလီများ = <<200+40=240>>240 လုံး ဖြစ်သည်။\nသူသည် ကနိုလီများ အရေအတွက်ထက် ကောက်ညှင်းများ 40 လုံး လျော့နည်းစွာ ဝယ်ယူသောအခါ၊ သူသည် 60 ကောက်ညှင်းများ - 40 ကောက်ညှင်းများ = <<60-40=20>>20 ကောက်ညှင်းများ ဝယ်ယူခဲ့သည်။\nစုစုပေါင်းအားဖြင့်၊ သူသည် 20 ကောက်ညှင်းများ + 60 ကနိုလီများ = <<20+60=80>>80 လုံး ဝယ်ယူခဲ့သည်။\nဝယ်ယူပြီးနောက်၊ အလန် တွင် 240 လုံး + 80 လုံး = <<240+80=320>>320 ကောက်ညှင်းများနှင့် ကနိုလီများ စုစုပေါင်း ပေါင်းစပ်အရေအတွက် ရှိသည်။\n#### 320"
