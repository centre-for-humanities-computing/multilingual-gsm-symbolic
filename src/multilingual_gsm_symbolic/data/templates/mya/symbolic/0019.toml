question = "60-ခုပါ စာစစ်ပွဲတစ်ခုတွင်၊ မေးခွန်းများ၏ 40% သည် လွယ်ကူသော ဖြစ်ပြီး၊ ကျန်ရှိသော မေးခွန်းများကို အလယ်အလတ် နှင့် ခက်ခဲသော မေးခွန်းများအဖြစ် တူညီစွာ ခွဲဝေထားသည်။ အကယ်၍ အာရီစ် သည် လွယ်ကူသော မေးခွန်းများ၏ 75% ကို သေချာစွာ ရရှိနိုင်ပါက၊ အလယ်အလတ် နှင့် ခက်ခဲသော မေးခွန်းများ၏ တစ်ဝက် ကို မှန်ကန်စွာ ဖြေဆိုနိုင်ပါက၊ သူမ သေချာစွာ ရရှိနိုင်မည့် အမှတ်ပေါင်း မည်မျှရှိသနည်း?"
answer = "အလယ်အလတ် နှင့် ခက်ခဲသော မေးခွန်းများသည် စာစစ်ပွဲ၏ 100% - 40% = 60% ပါဝင်သည်။\nမေးခွန်း 60 ခု * 40/100 = <<60*40/100=24>>24 ခု သည် လွယ်ကူသော မေးခွန်းများ ဖြစ်သည်။\nအလယ်အလတ် နှင့် ခက်ခဲသော မေးခွန်း စုစုပေါင်း အရေအတွက်မှာ 60 * 60/100 = <<60*60/100=36>>36 ခု ဖြစ်သည်။\nအာရီစ် သည် လွယ်ကူသော မေးခွန်းများ၏ 75% ကို သေချာစွာ ရရှိနိုင်ပါက၊ ဆိုလိုသည်မှာ သူမ၏ မေးခွန်း 24 ခု * 75/100 = <<24*75/100=18>>18 အမှတ် ရရှိနိုင်သည်။\nအလယ်အလတ် နှင့် ခက်ခဲသော မေးခွန်းများမှ သူမသည် တစ်ဝက် ကို မှန်ကန်စွာ ရရှိနိုင်သည်၊ ထို့ကြောင့် 36 မေးခွန်း * 1/2 = <<36*1/2=18>>18 အမှတ် ရရှိမည်။\nထို့ကြောင့် သူမသည် စာစစ်ပွဲတွင် 18 အမှတ် + 18 အမှတ် = <<18+18=36>>36 အမှတ် ရရှိနိုင်သည်။\n#### 36\n"
