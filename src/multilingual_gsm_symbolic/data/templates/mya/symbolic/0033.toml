question = "ကာရော့ နှင့် ဂျင်နီဖာ သည် လော့စ် အန်ဂျလိစ် မှ အစ်မနှစ်ယောက် ဖြစ်ကြပြီး ကျော်ကြားသူများ မှ လက်မှတ်များကို စုဆောင်းရန် နှစ်သက်ကြသည်။ ကျောင်းမှ နွေရာသီ နားရက် ကာလအတွင်း အစ်မနှစ်ယောက်သည် နေ့တိုင်း နေ့လယ်ခင်းတိုင်း လက်မှတ်များ စုဆောင်းကြသည်။ ငါး ပတ် ကြာပြီးနောက် ကာရော့ နှင့် ဂျင်နီဖာ သည် ၎င်းတို့၏ လက်မှတ်စာအုပ်များကို နှိုင်းယှဉ်ကြည့်ရှုကြပြီး အစ်မတစ်ယောက်စီ စုဆောင်းထားသော လက်မှတ်အရေအတွက်ကို ရေတွက်ကြသည်။ ကာရော့ သည် ၎င်း၏ စာအုပ်တွင် လက်မှတ် 20 ရှိပြီး ဂျင်နီဖာ တွင် 44 ရှိသည်။ အစ်မနှစ်ယောက်တွင် နွေရာသီ နားရက် အပတ် သုံး ပတ် ထပ်မံရှိပြီး နားရက်ကုန်ဆုံးချိန်တွင် ၎င်းတို့ကြား လက်မှတ် 100 ရရှိရန် ဆုံးဖြတ်ကြသည်။ ပန်းတိုင်သို့ ရောက်ရှိရန် အစ်မနှစ်ယောက်သည် လက်မှတ် မည်မျှ ထပ်မံစုဆောင်းရမည်နည်း"
answer = "ကာရော့ နှင့် ဂျင်နီဖာ တို့သည် လက်မှတ် 20 + 44 ကို စုဆောင်းပြီး ဖြစ်ကြသည် = <<20+44=64>>64 လက်မှတ်။\n၎င်းတို့၏ ပန်းတိုင်မှာ 100 ဖြစ်သောကြောင့် လက်မှတ် 100 - 64 ကို စုဆောင်းရန် လိုအပ်သည်။ 100 - 64 = <<100-64=36>>36 လက်မှတ်\n#### 36\n"
