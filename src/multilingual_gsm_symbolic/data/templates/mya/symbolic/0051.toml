question = "အာတီ သည် လယ်သမားဈေးကွက် တွင် ပန်း ဈေးဆိုင်တစ်ခု ရှိသည်။ သူသည် ပန်း အမျိုးအစား (၃) မျိုးကို ရောင်းချသည် - မာရီဂိုးဒ်ပန်း၊ ပီတူနီယာပန်း နှင့် ဘီဂိုနီယာပန်း။ သူသည် ပုံမှန်အားဖြင့် မာရီဂိုးဒ်ပန်း ကို ပန်းအိုး တစ်အိုးလျှင် $2.74၊ ပီတူနီယာပန်း ကို ပန်းအိုး တစ်အိုးလျှင် $1.87 နှင့် ဘီဂိုနီယာပန်း ကို ပန်းအိုး တစ်အိုးလျှင် $2.12 ဖြင့် ရောင်းလေ့ရှိသည်။ အာတီ တွင် ယနေ့ ငွေပြန်မပေးနိုင်သောကြောင့် သူ၏ဈေးနှုန်းများအားလုံးကို ဒေါ်လာအနီးဆုံးသို့ ယူရန် ဆုံးဖြတ်လိုက်သည်။ အကယ်၍ အာတီ သည် မာရီဂိုးဒ်ပန်း ပန်းအိုး 12 အိုး၊ ပီတူနီယာပန်း ပန်းအိုး 9 အိုး နှင့် ဘီဂိုနီယာပန်း ပန်းအိုး 17 အိုး ရောင်းချပါက သူသည် ဘယ်လောက် ရရှိမည်နည်း။"
answer = "အာတီ သည် မာရီဂိုးဒ်ပန်း ကို $2.74 မှ $3 သို့ အပေါ်သို့ ယူမည်၊ အဘယ်ကြောင့်ဆိုသော် 2 နောက်ကွယ်ရှိ ကိန်းဂဏန်းသည် ၅ သို့မဟုတ် ပိုများသောကြောင့် ဖြစ်သည်။\nအာတီ သည် ပီတူနီယာပန်း ကို $1.87 မှ $2 သို့ up ယူမည်၊ အဘယ်ကြောင့်ဆိုသော် 1 နောက်ကွယ်ရှိ ကိန်းဂဏန်းသည် 5 or higher သောကြောင့် ဖြစ်သည်။\nအာတီ သည် ဘီဂိုနီယာပန်း ကို $2.12 မှ $2 သို့ down ယူမည်၊ အဘယ်ကြောင့်ဆိုသော် 2 နောက်ကွယ်ရှိ ကိန်းဂဏန်းသည် less than 5 သောကြောင့် ဖြစ်သည်။\nအာတီ သည် မာရီဂိုးဒ်ပန်း 12 အိုးကို $3 ဖြင့် ရောင်းသည် = $<<12*3=36>>36\nအာတီ သည် ပီတူနီယာပန်း 9 အိုးကို $2 ဖြင့် ရောင်းသည် = $<<9*2=18>>18\nအာတီ သည် ဘီဂိုနီယာပန်း 17 အိုးကို $2 ဖြင့် ရောင်းသည် = $<<17*2=34>>34\nစုစုပေါင်းအနေဖြင့် အာတီ သည် $36 + $18 + $34 = $<<36+18+34=88>>88 ရရှိမည်။\n#### 88\n"
