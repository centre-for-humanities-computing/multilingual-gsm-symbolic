question = "ဗရန်ဒန် သည် အတွင်း၌ 10 ပါရှိသော ကျောက်လုံး အိတ်တစ်လုံးရှိသည်။ သူသည် ၎င်းကို သယ်ဆောင်နေစဉ် ကျောက်ခဲ တွင် လဲကျသွားပြီး ၎င်းတို့၏ တစ်ဝက် ကို လွတ်သွားစေခဲ့သည်။ သူသည် ၎င်းတို့ကို ရှာဖွေရန် ကြိုးစားခဲ့သော်လည်း 3 သာ ရရှိခဲ့သည်။ အိမ်ပြန်ရောက်သောအခါ သူသည် ကျောက်လုံး များကို ထပ်မံစစ်ဆေးခဲ့သည်။ သူ ယူလိုက်သော အရာများထဲမှ နှစ် သည် ကျောက်လုံး မဟုတ်ဘဲ တကယ်တမ်း ပုလဲ ဖြစ်သောကြောင့် ၎င်းတို့ကို စွန့်ပစ်လိုက်သည်။ ဗရန်ဒန် သည် နောက်ဆုံးတွင် ကျောက်လုံး မည်မျှရှိသနည်း?"
