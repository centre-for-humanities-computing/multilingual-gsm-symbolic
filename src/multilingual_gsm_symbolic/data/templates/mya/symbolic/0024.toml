question_annotated = "၎င်း၏ အာဟာရဆိုင်ရာ အချက်အလက်များအရ၊ {food,ချစ်ပ်} တစ်အိတ်တွင် {cal,250} ကယ်လိုရီ ပါဝင်သည်။ {size,300} {unit,ဂရမ်} အိတ်တွင် {n,5} ဆောင် ပါဝင်ပါက၊ သင့်နေ့စဉ် ကယ်လိုရီ ပစ်မှတ်မှာ {total,2000} ဖြစ်ပြီး သင်သည် {spent,1800} ကယ်လိုရီ ကို ကြိုတင်စားသုံးထားပြီးဖြစ်လျှင် {unit,ဂရမ်} မည်မျှ စားသုံးနိုင်မည်နည်း?\n\n#init:\n- food = sample([\"ပေါ့ကွန်း\", \"မုန့်\",  \"ကူကီ\"])\n- unit = sample([\"ဂရမ်\", \"အောင်စ\", \"oz\"])\n- $cal = range(150, 500, 25)\n- $size = range(100, 400, 25)\n- $n = range(4, 8)\n- $total = range(1900, 2500, 5)\n- $spent = range(600, 1900, 25)\n\n#conditions:\n- spent < total\n- is_int( 5 * (total - spent) / cal)\n- divides(size, n)\n- divides(size//n, (total-spent)/cal)\n\n#answer: size//n * Fraction((total-spent)/cal)\n"
answer_annotated = "စုစုပေါင်း ကယ်လိုရီ ပစ်မှတ်မှာ {total} ဖြစ်ပြီး ကျွန်တော်သည် {spent} ကယ်လိုရီ စားသုံးပြီးဖြစ်လျှင် စားသုံးရန် ကျန်ရှိသော ကယ်လိုရီမှာ {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} ဖြစ်သည်။\n{food} တစ်ဆောင်တွင် {cal} ကယ်လိုရီ ပါဝင်ပြီး ကျွန်တော်တွင် စားသုံးရန် ကယ်လိုရီ {total-spent} သာ ကျန်ရှိပါက၊ ထိုအခါ ကျွန်တော်သည် ဆောင်တစ်ခု၏ {total-spent}/{cal} ပိုင်းသာ စားနိုင်မည် = ဆောင်တစ်ခု၏ {Fraction((total-spent)/cal)} ပိုင်း ဖြစ်သည်။\nထို့အပြင် {food} {size} {unit} အိတ်တွင် {n} ဆောင် ပါဝင်ကြောင်း သိရှိရသည်၊ ထို့ကြောင့် ဆောင်တစ်ခုတွင် {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit}များ ပါဝင်သည်။\nကျွန်တော်သည် ဆောင်တစ်ခု၏ {Fraction((total-spent)/cal)} ပိုင်းသာ စားနိုင်ပါက၊ ထိုအခါ ကျွန်တော်သည် {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit}များ စားနိုင်မည် ဖြစ်သည်။\n#### {size//n * (total-spent)/cal}\n"
