question = "၎င်း၏ အာဟာရဆိုင်ရာ အချက်အလက်များအရ၊ ချစ်ပ် တစ်အိတ်တွင် 250 ကယ်လိုရီ ပါဝင်သည်။ 300 ဂရမ် အိတ်တွင် 5 ဆောင် ပါဝင်ပါက၊ သင့်နေ့စဉ် ကယ်လိုရီ ပစ်မှတ်မှာ 2000 ဖြစ်ပြီး သင်သည် 1800 ကယ်လိုရီ ကို ကြိုတင်စားသုံးထားပြီးဖြစ်လျှင် ဂရမ် မည်မျှ စားသုံးနိုင်မည်နည်း?"
answer = "စုစုပေါင်း ကယ်လိုရီ ပစ်မှတ်မှာ 2000 ဖြစ်ပြီး ကျွန်တော်သည် 1800 ကယ်လိုရီ စားသုံးပြီးဖြစ်လျှင် စားသုံးရန် ကျန်ရှိသော ကယ်လိုရီမှာ 2000-1800 = <<2000-1800=200>>200 ဖြစ်သည်။\nချစ်ပ် တစ်ဆောင်တွင် 250 ကယ်လိုရီ ပါဝင်ပြီး ကျွန်တော်တွင် စားသုံးရန် ကယ်လိုရီ 200 သာ ကျန်ရှိပါက၊ ထိုအခါ ကျွန်တော်သည် ဆောင်တစ်ခု၏ 200/250 ပိုင်းသာ စားနိုင်မည် = ဆောင်တစ်ခု၏ 4/5 ပိုင်း ဖြစ်သည်။\nထို့အပြင် ချစ်ပ် 300 ဂရမ် အိတ်တွင် 5 ဆောင် ပါဝင်ကြောင်း သိရှိရသည်၊ ထို့ကြောင့် ဆောင်တစ်ခုတွင် 300 ဂရမ်/5 = <<300/5=60>>60 ဂရမ်များ ပါဝင်သည်။\nကျွန်တော်သည် ဆောင်တစ်ခု၏ 4/5 ပိုင်းသာ စားနိုင်ပါက၊ ထိုအခါ ကျွန်တော်သည် 60 ဂရမ် * 4/5 = 48 ဂရမ်များ စားနိုင်မည် ဖြစ်သည်။\n#### 48\n"
