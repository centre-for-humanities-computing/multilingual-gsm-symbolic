question = "ဂရက် သည် အစာတစ်ခုအတွက် ပေါ့ကော့န့် ဖုတ်နေသည်။ ပန်းကန်ပြား တွင် အစေ့များ အပူတက်လာသောအခါ အစေ့များ ပေါက်ကွဲမှု ပိုမြန်လာသည်။ 20 သည် အစပိုင်း 30 စက္ကန့်တွင် ပေါက်ကွဲပြီး၊ ထို့နောက် နောက်ထပ် 30 စက္ကန့်တွင် ထိုပမာဏ၏ သုံး ဆ ပေါက်ကွဲသည်။ ထို့နောက် 30 စက္ကန့်အတွင်း အစေ့များသည် မူလပေါက်ကွဲနှုန်း၏ လေး ဆ အထိ မြင့်တက်လာသော်လည်း၊ နောက်ဆုံး 30 စက္ကန့်တွင် ပေါက်ကွဲနှုန်းသည် ယခင် 30 စက္ကန့်က နှုန်း၏ တစ်ဝက်သို့ လျော့ကျသွားသည်။ ဂရက် က ပန်းကန်ပြား ကို အပူမှ ဖယ်ရှားလိုက်ပြီးနောက်၊ နောက်ဆုံး 30 စက္ကန့်တွင် ပေါက်ကွဲသော အစေ့အရေအတွက်၏ လေးပုံတစ်ပုံသည်လည်း ကျန်ရှိသော အပူမှ ပေါက်ကွဲသွားသည်။ ဂရက် နေရမည့် ပေါ့ကော့န့် အစိတ်အပိုင်း အရေအတွက် မည်မျှရှိသနည်း။"
