answer_annotated = "ပထမဦးစွာ {animal2} တစ်ကောင်စီ လိုအပ်သော {food} ပမာဏကို တွက်ချက်ပါမည်။ {n1} {unit} * 2 - {n2} = <<{n1}*2-{n2}={2*n1-n2}>>{2*n1-n2} {unit}/{animal2}\nယခု {animal2} များ လိုအပ်သော {food} စုစုပေါင်း ပမာဏကို တွက်ချက်ပါမည်။ {2*n1-n2} {unit}/{animal2} * {k2} {animal2} များ = <<{2*n1-n2}*{k2}={k2*(2*n1-n2)}>>{k2*(2*n1-n2)} {unit}\nယခု {animal1} များ လိုအပ်သော {food} စုစုပေါင်း ပမာဏကို တွက်ချက်ပါမည်။ {n1} {unit}/{animal1} * {k1} {animal1} များ = <<{n1}*{k1}={k1*n1}>>{k1*n1} {unit}\nယခု {food} ပမာဏနှစ်ခုကို ပေါင်းထည့်၍ စုစုပေါင်းကို ရှာပါမည်။ {k2*(2*n1-n2)} {unit} + {k1*n1} {unit} = <<{k2*(2*n1-n2)}+{k1*n1}={k1*n1 + k2*(2*n1 - n2)}>>{k1*n1 + k2*(2*n1 - n2)} {unit}\n#### {k1*n1 + k2*(2*n1 - n2)}\n"
