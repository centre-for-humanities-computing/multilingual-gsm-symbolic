question = "နိတ် သည် သူ၏ တိရစ္ဆာန်များကို ခြံစာ ဖြင့် ကျွေးမွေးနေသည်။ ဆိတ် တစ်ကောင်စီသည် 5 ပေါင် လိုအပ်ပြီး၊ လားမား တစ်ကောင်စီသည် ဆိတ် တစ်ကောင်လိုအပ်သည့် ပမာဏ၏ နှစ်ဆထက် 3 ပေါင် လျော့နည်းသည်။ အကယ်၍ 15 ဆိတ် ကောင်နှင့် 12 လားမား ကောင်ရှိလျှင်၊ နိတ် လိုအပ်သော ခြံစာ ပေါင် မည်မျှ ရှိသနည်း။"
answer = "ပထမဦးစွာ လားမား တစ်ကောင်စီ လိုအပ်သော ခြံစာ ပမာဏကို တွက်ချက်ပါမည်။ 5 ပေါင် * 2 - 3 = <<5*2-3=7>>7 ပေါင်/လားမား\nယခု လားမား များ လိုအပ်သော ခြံစာ စုစုပေါင်း ပမာဏကို တွက်ချက်ပါမည်။ 7 ပေါင်/လားမား * 12 လားမား များ = <<7*12=84>>84 ပေါင်\nယခု ဆိတ် များ လိုအပ်သော ခြံစာ စုစုပေါင်း ပမာဏကို တွက်ချက်ပါမည်။ 5 ပေါင်/ဆိတ် * 15 ဆိတ် များ = <<5*15=75>>75 ပေါင်\nယခု ခြံစာ ပမာဏနှစ်ခုကို ပေါင်းထည့်၍ စုစုပေါင်းကို ရှာပါမည်။ 84 ပေါင် + 75 ပေါင် = <<84+75=159>>159 ပေါင်\n#### 159\n"
