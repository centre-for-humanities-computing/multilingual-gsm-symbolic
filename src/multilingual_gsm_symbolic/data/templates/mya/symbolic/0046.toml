question = "Apple အထက်တန်းကျောင်း သည် ၎င်းတို့၏ အနုပညာဗဟိုချက် တွင် ဤနှစ် ဘွဲ့နှင်းသဘင် ကျင်းပနေပါသည်။ ဤနေရာတွင် လူ 6000 ဦး ဝင်ရောက်နိုင်သော နေရာရှိသည်။ ဘွဲ့ယူသူများအတွက် နေရာ 950 နှင့် တက်ရောက်သော ဆရာနှင့်ဆရာမများအတွက် နေရာ 300 ကို ချေပြီးနောက်၊ လက်မှတ်များကို တူညီစွာ ခွဲဝေပေးပါက ဘွဲ့ယူသူတစ်ဦးစီသည် ၎င်းတို့၏ မိတ်ဆွေနှင့် မိသားစုကို ပေးရန် လက်မှတ် မည်မျှ ရရှိမည်နည်း။"
answer = "ဘွဲ့ယူသူနှင့် ဆရာနှင့်ဆရာမများ နေရာများကို ပေါင်းပါ။ 950 + 300 = <<950+300=1250>>1250 ဆရာနှင့်ဆရာမနှင့် ဘွဲ့ယူသူများအတွက် နေရာ\nခွင့်ပြုထားသော စုစုပေါင်းနေရာမှ ဆရာနှင့်ဆရာမနှင့် ဘွဲ့ယူသူများအတွက် နေရာကို နုတ်ပါ။ 6000 - 1250 = <<6000-1250=4750>>4750 ကျန်ရှိသော နေရာများ။\nကျန်ရှိသော နေရာများကို ဘွဲ့ယူသူအရေအတွက်ဖြင့် စားပါ။ 4750/950 = <<4750/950=5>>5 လက်မှတ်\n#### 5\n"
