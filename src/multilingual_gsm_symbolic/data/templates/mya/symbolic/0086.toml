question = "အလီဆန် qualified for a spot on the လွှား team, so she went shopping for some athletic gear. She bought a တင်ကပ်အင်္ကျီ for $10, a pair of လွှား အဝတ်အတို for $5 more than the တင်ကပ်အင်္ကျီ cost, and a pair of တင်းနစ်ဖိနပ် that were originally $48 but were on sale for တစ်ဝက် price. She had a coupon for $2 off the package of $8 athletic ဖိနပ်ခွံ that she also bought. How much did she spend on athletic gear?"
answer = "အဝတ်အတို များသည် တင်ကပ်အင်္ကျီ ထက် $5 ပိုပြီး ဈေးကြီးသောကြောင့် ၎င်းတို့၏ ဈေးမှာ $5 + $10 = $<<5+10=15>>15 ဖြစ်သည်။\nသူမ၏ တင်းနစ်ဖိနပ် များသည် မူလ $48 ဈေး၏ တစ်ဝက် ဖြစ်သောကြောင့် ၎င်းတို့၏ ဈေးမှာ $48*1/2=$24 ဖြစ်သည်။\nသူမ၏ ကပ်စာရင်းဖြင့် ဖိနပ်ခွံ များသည် $8 - $2 = $<<8-2=6>>6 ဖြစ်သည်။\nတင်ကပ်အင်္ကျီ, အဝတ်အတို, တင်းနစ်ဖိနပ် နှင့် ဖိနပ်ခွံ များ စုစုပေါင်း ဈေးမှာ $10 + $15 + $24 + $6 = $<<10+15+24+6=55>>55 ဖြစ်သည်။\n#### 55\n"
