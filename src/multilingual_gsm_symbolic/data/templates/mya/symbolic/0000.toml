question = "Benny က 10 ပေ အလျားရှိသော ငါးကြီး တစ်ကောင်ကို တွေ့မြင်ခဲ့သည်။ ၎င်းတွင် 2 ခု `6 လက်မ` အလျားရှိသော remora ငါးများ ကပ်နေသည်။ ငါးကြီး ၏ ကိုယ်အလျား၏ ရာခိုင်နှုန်း မည်မျှသည် remora ငါးများ၏ စုစုပေါင်းအလျား ဖြစ်သနည်း။"
answer = "ပထမဦးစွာ remora ငါးများ၏ စုစုပေါင်းအလျားကို လက်မဖြင့် ရှာဖွေပါ။ 6 လက်မ/remora * 2 remora များ = <<6*2=12>>12 လက်မ။\nထို့နောက် ထိုကိန်းဂဏန်းကို 12 ဖြင့် စား၍ ပေသို့ ပြောင်းလဲပါ။ 12 လက်မ / 12 လက်မ/ပေ = <<12/12=1>>1 ပေ။\nထို့နောက် ပေဖြင့် တွက်ချက်ထားသော remora ငါးများ၏ စုစုပေါင်းအလျားကို ငါးကြီး ၏ အလျားဖြင့် စားပြီး ရာခိုင်နှုန်းအဖြစ် ဖော်ပြရန် 100% ဖြင့် မြှောက်ပါ။ 1 ပေ / 10 ပေ * 100% = 10%\n\n#### 10\n"
