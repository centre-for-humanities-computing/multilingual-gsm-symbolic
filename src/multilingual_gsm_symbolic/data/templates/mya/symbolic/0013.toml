question = "မေရီ သည် စိုက်ပျိုးရေးကို အလွန်နှစ်သက်သူ တစ်ဦး ဖြစ်သည်။ မနေ့က၊ သူမသည် သူမ နှစ်သက်သော အပင်ရောင်းဆိုင်မှ 18 အပင်အသစ်များကို ရရှိခဲ့သည်။ သူမ၏ ကျေးလက်နေအိမ်ကြီးရှိ ခြစ်တန်း 40 ခုတစ်ခုစီတွင် အပင် 2 ပင် စီ ရှိပြီးဖြစ်သည်။ ပေးလှူလိုစိတ်ဖြင့်၊ သူမသည် နောက်နေ့တွင် ခြစ်တန်းတစ်ခုစီမှ အပင် 1 ပင်ကို မိတ်ဆွေများနှင့် မိသားစုအတွက် ပေးအပ်မည်ဟု ဆုံးဖြတ်လိုက်သည်။ မေရီ ပါ အပင် မည်မျှ ကျန်ရှိမည်နည်း။"
answer = "မနေ့က, အပင်များ ရရှိမီ မေရီ တွင် 2*40 = <<2*40=80>>80 အပင် ရှိခဲ့သည်။\nအပင် 18 ပင် ထပ်မံရရှိပြီးနောက်၊ သူမတွင် စုစုပေါင်း 80 + 18 = <<80+18=98>>98 အပင် ရှိခဲ့သည်။\nနောက်နေ့တွင်၊ မေရီ ၏ အပင်ပေးအပ်မှုမှာ 40*1 = <<40*1=40>>40 အပင် ဖြစ်လိမ့်မည်။\nသူမသည် ထို့ကြောင့် 98 - 40 = <<98-40=58>>58 အပင် ကျန်ရှိမည် ဖြစ်သည်။\n#### 58\n"
