answer = "20% သည် 30 ကျောင်းသား အတန်း၏ ဘောလုံး ကစားသမားများ ဖြစ်သောကြောင့် 0.2*30 = <<0.2*30=6>>6 ဦး ဖြစ်သည်။\nကျောင်းသား 30 ဦးရှိပြီး 6 ဦးသည် ဘောလုံး ကစားသမားများ ဖြစ်သောကြောင့် ကျန်ရှိသော 30-6 = <<30-6=24>>24 ဦး ကျန်ရှိသည်။\nကျန်ရှိသော ကျောင်းသား 24 ဦး၏ 25% သည် တေးဂီတအဖွဲ့ သို့မဟုတ် အားပေးသူများ ၏ အဖွဲ့ဝင်များ ဖြစ်သောကြောင့် 0.25*24 = <<0.25*24=6>>6 ဦး ဖြစ်သည်။\n6 ဦးသည် ဘောလုံး ကစားသမားများ ဖြစ်ပြီး 6 ဦးသည် တေးဂီတအဖွဲ့/အားပေးသူများ ၏ အဖွဲ့ဝင်များ ဖြစ်သောကြောင့် 6+6 = <<6+6=12>>12 ဦးသည် စောစောထွက်ကြမည်။\n#### 12\n"
