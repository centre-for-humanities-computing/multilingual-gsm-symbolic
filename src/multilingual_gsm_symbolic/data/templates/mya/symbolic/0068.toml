question = "Carmen က စာလုံးရှာဂိမ်း တစ်ခု ပြီးစေဖို့ 10 မိနစ် ကြာပြီး ဆူဒိုကူဂိမ်း တစ်ခု ပြီးစေဖို့ 5 မိနစ် ကြာပါတယ်။ စနေတနင်္ဂနွေ တစ်လျှောက် သူမက 3 ခုသော စာလုံးရှာဂိမ်း နှင့် 8 ခုသော ဆူဒိုကူဂိမ်း ကို ဖြေရှင်းခဲ့ပါတယ်။ သူမက ဂိမ်းတွေကစားဖို့ စုစုပေါင်း အချိန်ဘယ်လောက် သုံးခဲ့တာလဲ။"
answer = "စာလုံးရှာဂိမ်း တစ်ခု ပြီးစေဖို့ 10 မိနစ် ကြာပြီး သူမက 3 ခု ပြီးစေခဲ့လို့ စုစုပေါင်း 10*3 = <<10*3=30>>30 မိနစ်\nဆူဒိုကူဂိမ်း တစ်ခု ပြီးစေဖို့ 5 မိနစ် ကြာပြီး သူမက 8 ခု ပြီးစေခဲ့လို့ စုစုပေါင်း 5*8 = <<5*8=40>>40 မိနစ်\nသူမက စာလုံးရှာဂိမ်း များပေါ်မှာ 30 မိနစ်နှင့် ဆူဒိုကူဂိမ်း များပေါ်မှာ 40 မိနစ် သုံးခဲ့ပြီး စုစုပေါင်း 30+40 = <<30+40=70>>70 မိနစ်\n#### 70\n"
