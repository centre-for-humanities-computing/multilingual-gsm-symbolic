question = "Dana dikare çar car zûtir bizivire ji dema ku ew dimeşe, lê ew dikare bi lezeke ku nîv ji leza wê ya bizivirînê ye biqelqe. Heke ew dikare bi 3 mîl di saetekê de biqelqe, di şeş saetan de ew çend mîl dikare bimeşe heke ew yekem sêyem ji demê bizivire û du sêyem ji demê bimeşe?"
answer = "Heke Dana dikare bi nîv leza wê ya bizivirînê biqelqe, wê demê ew dikare bi 3*2=<<3*2=6>>6 mîl di saetekê de bizivire.\nJi ber ku ew dikare bi lezeke ku çar car ji leza wê ya meşînê zûtir bizivire, ev tê wê wateyê ku ew dikare bi 6/4=1.5 mîl di saetekê de bimeşe.\nHeke du sêyem ji demê were meşîn, wê demê ew 6*2/3=<<6*2/3=4>>4 saetan dimeşe.\nHeke yekem sêyem ji demê were bizivirîn, wê demê ew 6-4=<<6-4=18/5>>18/5 saetan bizivire.\nJi ber vê yekê, ew 18/5 saetan bi 6 mîl di saetekê de bizivire, ango 18/5*6=<<18/5*6=108/5>>108/5 mîl.\nEw 4 saetan bi 1.5 mîl di saetekê de dimeşe, ango 4*1.5=<<4*1.5=6>>6 mîl.\nJi ber vê yekê, bi tevahî, ew 108/5+6=<<108/5+6=27>>27 mîl diçe.\n#### 27\n"
