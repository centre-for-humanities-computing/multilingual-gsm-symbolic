question = "Sally ji bo betlaneyê çû beravê. Dê û bavê wê $15 dan wê ku çi dixwest bikire. Di dikanê bîranînê de, taffy hatibû firotin bi \"Bikire 1 pound bi $3 ji her poundekî, 1 pound 1/2 kêmtir bistîne.\" Ew 4 pound girt. Ew her wiha kîsek têkel a qalikên deryayê bi $1.5 kirî û 4 magnet ku her yek $0.25 bûn. Çend pare dimîne ji Sally?"
