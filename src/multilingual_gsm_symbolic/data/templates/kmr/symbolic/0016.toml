question = "Sunny difiroşe kêkê zencîrê û sêv pî ji bo komkirina pereyan. Li şemî, ew 10 qutiyên kêkê zencîrê û 4 qutiyên sêv pî kêmtir li gorî yekşem firot. Li yekşem, ew 5 qutiyên kêkê zencîrê zêdetir li gorî şemî û 15 qutiyên sêv pî firot. Heke kêkê zencîrê bihayê $6 bû û sêv pî bihayê $15 bû, Sunny ji bo du rojan çiqas qezenc kir?"
