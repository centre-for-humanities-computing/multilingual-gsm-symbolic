question_annotated = "{name,Sally} tətil üçün dəniz sahilinə getdi. Valideynləri ona istədiyi hər şeyi almaq üçün ${total,15} verdilər. Xatirə dükanında taffi endirimdə idi: \"{n1,1} funt ${p1,3} funt başına alın, {n2,1} funt {discount,1/2} endirimlə alın.\" O, {n12,4} funt götürdü. O, həmçinin ${p2,1.5} üçün qarışıq bir dəniz qabığı paketi və hər biri ${p3,0.25} olan {n3,4} maqnit aldı. {name,Sally} nə qədər pulu qaldı?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} {n1} funt ${p1} üçün alır və {n2} funt {discount} endirim alır. Beləliklə, {n2} funtun {discount} endirimi ${p1}*{discount} = ${float(n2*discount*p1)} edir. Qalan {n12-n1-n2} funt endirim yoxdur və {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1} durur, beləliklə ümumi ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} maqnit hər biri ${p3} olduqda {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nBütün alış-verişlərinizi topladığınızda, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nO, ${total} vardı və ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} xərclədi, beləliklə ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} qaldı\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
