question = "Sally tətil üçün dəniz sahilinə getdi. Valideynləri ona istədiyi hər şeyi almaq üçün $15 verdilər. Xatirə dükanında taffi endirimdə idi: \"1 funt $3 funt başına alın, 1 funt 1/2 endirimlə alın.\" O, 4 funt götürdü. O, həmçinin $1.5 üçün qarışıq bir dəniz qabığı paketi və hər biri $0.25 olan 4 maqnit aldı. Sally nə qədər pulu qaldı?"
answer = "Sally 1 funt $3 üçün alır və 1 funt 1/2 endirim alır. Beləliklə, 1 funtun 1/2 endirimi $3*1/2 = $1.5 edir. Qalan 2 funt endirim yoxdur və 2*$3 = $6 durur, beləliklə ümumi $3+$3/2+$6=$21/2\n4 maqnit hər biri $0.25 olduqda 4*0.25=$<<4*0.25=1>>1\nBütün alış-verişlərinizi topladığınızda, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nO, $15 vardı və $13 xərclədi, beləliklə $15-$13 = $<<15-13=2>>2 qaldı\n#### 2\n"
