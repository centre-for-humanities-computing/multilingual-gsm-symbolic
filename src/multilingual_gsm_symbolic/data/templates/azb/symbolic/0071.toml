question = "Nate heyvanlarına saman yedirir. Hər keçi 5 kiloqram ehtiyac duyur, və hər llama hər keçinin ehtiyac duyduğunun iki qatından 3 kiloqram az ehtiyac duyur. Əgər 15 keçilər və 12 llamalər varsa, Nate neçə kiloqram saman ehtiyac duyur?"
