question = "Xəstəxananin tutumu 1000 yataqladır və 1/5 hissəsi məşğuldur. Coronavirus yayılması səbəbindən, hər gün 50 xəstə xəstəxanayə qəbul olunur. 2 həftədən sonra xəstəxanadə boş qalan yataqların ümumi sayını hesablayın."
answer = "Əgər xəstəxananin ümumi tutumunun 1/5 hissəsi yataqlər tərəfindən işğal olunarsa, bu o deməkdir ki, 1/5 * 1000 = <<1000*1/5=200>>200 yataq xəstələr tərəfindən istifadə olunur.\nXəstəxanadə yeni qəbul olmadan yataqlərin ümumi sayı 1000 yataq - 200 yataq = <<1000-200=800>>800 yataqdir.\nƏgər hər gün 50 nəfər qəbul olunarsa, bir həftədən sonra xəstəxanadəki xəstələrin ümumi sayı 50 xəstə/gün * 7 gün/həftə = 350 xəstədir.\n2 həftədən sonra xəstəxanayə qəbul edilən xəstələrin ümumi sayı 350 xəstə/həftə * 2 həftə = <<350*2=700>>700 xəstədir, bunların hər biri bir yataq istifadə edir.\nƏgər yeni qəbuldan əvvəl xəstəxanadə 800 boş yataq varsa, ümumi say 800 yataq - 700 yataq = <<800-700=100>>100 boş yataqə qədər azalır.\n#### 100\n"
