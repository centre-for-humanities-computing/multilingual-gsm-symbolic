answer = "Əgər Dana qaçdığı sürətin yarım qədər tullanma sürətinə malikdirsə, onda o, 3*2=<<3*2=6>>6 saatda kilometr sürətlə qaça bilər.\nVə o, qaçdığı sürətin yürüyüşündən dörd dəfə daha sürətli olması səbəbindən, bu o deməkdir ki, o, 6/4=1.5 saatda kilometr sürətlə yürüyə bilər.\nƏgər vaxtın üçdə iki hissəsi yürüməyə sərf edilirsə, onda o, 6*2/3=<<6*2/3=4>>4 saat yürüyür.\nƏgər vaxtın üçdə bir hissəsi qaçmağa sərf edilirsə, onda o, 6-4=<<6-4=2>>2 saat qaçır.\nBeləliklə, o, 2 saat 6 saatda kilometr sürətlə qaçır, yəni 2*6=<<2*6=12>>12 kilometr.\nO, 4 saat 1.5 saatda kilometr sürətlə yürüyür, yəni 4*1.5=<<4*1.5=6>>6 kilometr.\nBeləliklə, ümumilikdə o, 12+6=<<12+6=18>>18 kilometr gedir.\n#### 18\n"
