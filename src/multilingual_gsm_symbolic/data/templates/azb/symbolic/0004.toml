question = "Əli qəlyanaltı üçün popkorn qızardır. Qazandakı dənələr qızdıqca, dənələr daha sürətlə partlayır. 20 dənə bişirmənin ilk 30 saniyəsində partlayır, sonra üç dəfə həmin miqdar növbəti 30 saniyədə. Dənələr növbəti 30 saniyədə ilkin partlayış sürətinin dörd qatına qədər artır, lakin son 30 saniyədə partlayış keçən 30 saniyənin sürətinin yarısına qədər yavaşlayır. Əli qazanı oddan götürdükdən sonra, bişirmənin son 30 saniyəsində partlayan dənələrin dörddə biri də qalan istilikdən partlayır. Əli neçə ədəd popkorn yeməlidir?"
