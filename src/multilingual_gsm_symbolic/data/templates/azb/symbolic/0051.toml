question = "Artie Kənd Bazarı-nda gül dükanı var. O, üç növ gül satır: balqabaq çiçəyi, petuniya və begoniya. O, adətən balqabaq çiçəyini hər qab üçün ₼2.74, petuniyanı ₼1.87 və begoniyanı ₼2.12 qiymətinə satır. Artienin bu gün dəyişməsi yoxdur, ona görə də bütün qiymətlərini ən yaxın manata yuvarlaqlaşdırmağa qərar verib. Əgər Artie 12 qab balqabaq çiçəyi, 9 qab petuniya və 17 qab begoniya satarsa, neçə qazanacaq?"
answer = "Artie balqabaq çiçəyi qiymətini ₼2.74-dən ₼3-ə yuxarı yuvarlaqlaşdıracaq, çünki 2-dən sonra gələn rəqəm 5 və ya daha böyükdür.\nArtie petuniya qiymətini ₼1.87-dən ₼2-ə up yuvarlaqlaşdıracaq, çünki 1-dən sonra gələn rəqəm 5 or higherdur.\nArtie begoniya qiymətini ₼2.12-dən ₼2-ə down yuvarlaqlaşdıracaq, çünki 2-dən sonra gələn rəqəm less than 5dur.\nArtie 12 balqabaq çiçəyi*₼3 satır = ₼<<12*3=36>>36\nArtie 9 petuniya*₼2 satır = ₼<<9*2=18>>18\nArtie 17 begoniya*₼2 satır = ₼<<17*2=34>>34\nÜmumilikdə, Artie ₼36 + ₼18 + ₼34 = ₼<<36+18+34=88>>88 qazanacaq.\n#### 88\n"
