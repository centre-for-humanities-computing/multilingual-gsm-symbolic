question = "Allan-ın evində, qarğıdalılar kannelilərdən iki dəfə çoxdur. Evinin içində ümumilikdə 40 kanneli var. Allan mağazadan 60 ədəd daha kanneli aldı və kannelilərin sayından 40 ədəd az qarğıdalı aldı. Evinin içində Allan-ın olan qarğıdalı və kannelilərin ümumi sayını tapın?"
