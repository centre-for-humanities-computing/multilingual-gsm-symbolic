question = "Eldar 3 fərqli yaşayış kompleksindən zibil yığır. İlk iki hər biri 200 mənzilə malikdir və sonuncusu digər iki nin cəmindən 60% daha böyükdür. O, hər yerdən həftədə 3 dəfə zibil yığır və hər mənzil üçün hər yığım üzrə ₼0.4 qazanır. O, həftədə nə qədər pul qazanır?"
