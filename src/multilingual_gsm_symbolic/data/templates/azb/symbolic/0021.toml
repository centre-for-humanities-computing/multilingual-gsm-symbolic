question = "Frankie hər gecə ev işini bitirdikdən sonra televiziya izləyir. Bazar ertəsi və çərşənbə axşamı günlərində o, hər gecə ən sevdiyi şoudan 1-saatlıq bir bölüm izlədi. çərşənbə günü o, 30-dəqiqəlik bir şoudan bir neçə bölüm izlədi. Cümə axşamı günü ev işini erkən bitirdi və 1-saatlıq bir bölüm və 30-dəqiqəlik bir şou izlədi. Cümə günü gecəyə qədər oyaq qala bildi, ona görə də o, iki 1-saatlıq bölüm izlədi. Əgər o, ümumilikdə 7 saat televiziya izləyibsə, çərşənbə günü neçə 30-dəqiqəlik bölüm izlədi?"
answer = "E-nin çərşənbə günü izlədiyi bölüm sayı olduğunu fərz edək.\nBazar ertəsi günündən sonra, onun 7 - 1 = <<7-1=6>>6 saat televiziya izləməyə qalan vaxtı oldu.\nçərşənbə axşamı günündən sonra, onun 6 - 1 = <<6-1=5>>5 saat televiziya izləməyə qalan vaxtı oldu.\nCümə axşamı günündən sonra, onun 5 - 1 - 0.5 = 3.5 saat televiziya izləməyə qalan vaxtı oldu.\nCümə günündən sonra, onun 3.5 - 2 = 1.5 saat televiziya izləməyə qalan vaxtı oldu.\nHər 30-dəqiqəlik bölüm 1/2 saata bərabərdir.\nBeləliklə, E = 1.5/0.5 = 3 bölümdür.\n#### 3\n"
