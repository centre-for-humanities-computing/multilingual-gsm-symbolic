question = "Qorannoo 60 gaaffii keessatti, gaaffiiwwan 40% fudhataa dha, kan hafe immoo wal qixa qoodamaa giddugaleessa fi dhiphina gaaffiiwwan ta'an. Yoo Aries 75% gaaffiiwwan fudhataa argachuuf amantii qabdu, fi bifaa gaaffiiwwan giddugaleessa fi dhiphina sirriitti, pookii meeqa argatu?"
answer = "Gaaffiiwwan giddugaleessa fi dhiphina %100 - 40% = 60% qorannoo kanaa qabu.\nGaaffiiwwan 60 * 40/100 = <<60*40/100=24>>24 fudhataa gaaffiiwwan jiru.\nYeroo guutuu 60 gaaffiiwwan * 60/100 = <<60*60/100=36>>36 giddugaleessa fi dhiphina gaaffiiwwan jiru.\nYoo Aries 75% gaaffiiwwan fudhataa argachuuf amantii qabdu, kun jechuun 24 gaaffiiwwan * 75/100 = <<24*75/100=18>>18 pookii amantii qabdu.\nGaaffiiwwan giddugaleessa fi dhiphina irraa, bifaa isaanii sirriitti argachuuf amantii qabdu, kana jechuun 36 gaaffiiwwan * 1/2 = <<36*1/2=18>>18 pookii dha.\nKanaafuu, pookii 18 + pookii 18 = <<18+18=36>>36 pookii qorannoo ishee keessatti argachuuf amantii qabdu.\n#### 36\n"
