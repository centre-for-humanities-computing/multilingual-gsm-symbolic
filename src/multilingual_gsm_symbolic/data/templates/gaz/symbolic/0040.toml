question = "Sally baha yaalaa deemte. Abbaa fi haadhaan ishee $15 kenne wanta barbaadde bituuf. Dukaana yaadannoo keessatti, taafi gatii xiqqoo ture \"Bitu 1 paawundi gatii $3 paawundi tokkotti, argu 1 paawundi 1/2 gad.\" Kakaafte 4 paawundi. Qaxxaamuu kooftii bishaan $1.5 fi 4 maagneetii tokkoon tokkoon $0.25 bitte. Maallaqa hangaammee Sally hafte?"
answer = "Sally 1 paawundi gatii $3 bitaa jirti fi 1 paawundi 1/2 gad argi. Kanaaf 1/2 gad 1 paawundi irraa $3*1/2 = $1.5. Dhumaa 2 paawundi gatii xiqqoo hin qabu fi kofa 2*$3 = $6, yeroo hunda $3+$3/2+$6=$21/2\n4 maagneetii tokkoon tokkoon $0.25 4*0.25=$<<4*0.25=1>>1\nYommuu bitamoota ishee hunda walitti qabdu, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nQabde $15 fi kaffalte $13 so qabde $15-$13 = $<<15-13=2>>2 hafte\n#### 2\n"
