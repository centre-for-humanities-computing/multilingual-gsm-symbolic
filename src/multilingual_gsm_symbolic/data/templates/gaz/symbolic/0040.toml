question_annotated = "{name,Sally} baha yaalaa deemte. Abbaa fi haadhaan ishee ${total,15} kenne wanta barbaadde bituuf. Dukaana yaadannoo keessatti, taafi gatii xiqqoo ture \"Bitu {n1,1} paawundi gatii ${p1,3} paawundi tokkotti, argu {n2,1} paawundi {discount,1/2} gad.\" Kakaafte {n12,4} paawundi. Qaxxaamuu kooftii bishaan ${p2,1.5} fi {n3,4} maagneetii tokkoon tokkoon ${p3,0.25} bitte. Maallaqa hangaammee {name,Sally} hafte?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} {n1} paawundi gatii ${p1} bitaa jirti fi {n2} paawundi {discount} gad argi. Kanaaf {discount} gad {n2} paawundi irraa ${p1}*{discount} = ${float(n2*discount*p1)}. Dhumaa {n12-n1-n2} paawundi gatii xiqqoo hin qabu fi kofa {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}, yeroo hunda ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} maagneetii tokkoon tokkoon ${p3} {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nYommuu bitamoota ishee hunda walitti qabdu, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nQabde ${total} fi kaffalte ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} so qabde ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} hafte\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
