question = "প্যাট এর একটি ফুলের খেত আছে যা 111 মিটার লম্বা। প্যাট তার ফুলের খেত গাছ দিয়ে ভরাট করতে চায়। প্যাট'র গাছগুলি 12 সেন্টিমিটার চওড়া হয়, এবং বাগান করার নিয়ম অনুযায়ী খেত ধরে প্রতি 1.5 মিটার অন্তর একটি ফুল লাগাতে বলা হয়। প্যাট এর কাছে আগেই 17 টি ফুল আছে। প্রতিটি ফুলের গাছ দোকানে টাকা6 দামে পাওয়া যায়। ফুলের খেতটি ভরাট করতে প্যাট দোকানে কত টাকা খরচ করবে?"
