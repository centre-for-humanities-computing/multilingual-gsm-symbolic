question = "স্যালি ছুটি কাটাতে সমুদ্র সৈকতে গেল। তার বাবা-মা তাকে $15 টাকা দিল যাতে সে যা ইচ্ছে কিনতে পারে। স্মারক দোকানে, টাফি সেলে ছিল \"Buy 1 pound at $3 per pound, get 1 pound 1/2 off।\" সে 4 পাউন্ড তুলে নিল। সে আরও $1.5 টাকায় একটি মিশ্র শাঁখের ব্যাগ কিনল এবং 4টি ম্যাগনেট কিনল যা প্রতিটি $0.25 টাকার। স্যালি এর কত টাকা বাকি থাকল?"
answer = "স্যালি 1 পাউন্ড কিনছে $3 টাকায় এবং পাচ্ছে 1 পাউন্ড 1/2 ছাড়। তাই 1/2 ছাড় 1 পাউন্ডের উপর হলো $3*1/2 = $1.5। বাকি 2 পাউন্ডের কোনো ছাড় নেই এবং খরচ হয় 2*$3 = $6, তাই মোট হলো $3+$3/2+$6=$21/2\n4টি ম্যাগনেট প্রতিটি $0.25 টাকায় হলো 4*0.25=$<<4*0.25=1>>1\nযখন তুমি তার সব কেনাকাটা যোগ করো, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nতার কাছে $15 টাকা ছিল এবং সে খরচ করেছে $13 টাকা, তাই তার কাছে $15-$13 = $<<15-13=2>>2 বাকি থাকল\n#### 2\n"
