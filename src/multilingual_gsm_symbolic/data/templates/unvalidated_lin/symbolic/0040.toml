question = "Sally akende na mboka ya likoló na liboso. Baboti na ye ba komyi ye $15 mpo na kozua biloko oyo alingi. Na ndako ya biloko ya komema, tafi ebeleaki mpo na \"Kozua 1 libala na $3 na libala, ozwa 1 libala 1/2 esepeli.\" Abongolaki 4 libala. Akoza mpe bokoti ya makoko ya mboka mpo na $1.5 na 4 magneti oyo ezalaki $0.25 ya libala. Makoki mangi Sally azali na yo kati?"
answer = "Sally azali kozua 1 libala mpo na $3 mpe azwa 1 libala 1/2 esepeli. Bongo 1/2 esepeli ya 1 libala ezali $3*1/2 = $1.5. Maboko ya 2 libala mpe ezali na esepeli te mpe ezali kosala 2*$3 = $6, bongo total ezali $3+$3/2+$6=$21/2\n4 magneti na $0.25 ya libala ezali 4*0.25=$<<4*0.25=1>>1\nNtango ozali kokanisa makambo nyonso oyo akotaki, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nAzalaki na $15 mpe akotaki $13 bongo azalaki na $15-$13 = $<<15-13=2>>2 kati\n#### 2\n"
