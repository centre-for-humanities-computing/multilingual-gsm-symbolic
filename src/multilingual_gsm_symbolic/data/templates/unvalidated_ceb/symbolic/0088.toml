question = "Dana makadagan og upat ka beses mas paspas kaysa sa paglakaw, pero makalukso siya og katunga sa bilis sa pagdagan niya. Kung makalukso siya og 3 kilometro sa oras, pila ka kilometro ang makadagan siya sa loob sa unom ka oras kung magamit niya usa ka ikatulo sa oras sa pagdagan ug duha ka ikatulo sa oras sa paglakaw?"
