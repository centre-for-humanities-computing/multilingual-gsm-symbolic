question = "آرٹی کا کسانوں کی منڈی میں پھولوں کا ایک اسٹال ہے۔ وہ تین قسم کے پھول بیچتا ہے: گیندوں، پیٹونیا اور بیگونیا۔ وہ عام طور پر گیندوں $2.74 فی گملے، پیٹونیا $1.87 فی گملے، اور بیگونیا $2.12 فی گملے کے حساب سے بیچتا ہے۔ آج آرٹی کے پاس کھلے پیسے نہیں ہیں، اس لیے اس نے اپنی تمام قیمتوں کو قریب ترین ڈالر تک گول کرنے کا فیصلہ کیا ہے۔ اگر آرٹی گیندوں کے 12 گملے، پیٹونیا کے 9 گملے، اور بیگونیا کے 17 گملے بیچتا ہے، تو وہ کتنی رقم کمائے گا؟"
