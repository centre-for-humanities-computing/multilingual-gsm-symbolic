question = "فرینکی ہر رات اپنا ہوم ورک ختم کرنے کے بعد ٹی وی دیکھتا ہے۔ پیر اور منگل کو، اس نے ہر رات اپنے پسندیدہ شو کی 1 گھنٹے کی ایک قسط دیکھی۔ بدھ کو، اس نے 30 منٹ کے ایک شو کی چند اقساط دیکھیں۔ جمعرات کو، اس نے ہوم ورک جلدی ختم کیا اور 1 گھنٹے کی ایک قسط اور 30 منٹ کا ایک شو دیکھا۔ جمعہ کو، اسے دیر تک جاگنے کی اجازت ملی، اس لیے اس نے 1 گھنٹے کی دو اقساط دیکھیں۔ اگر اس نے کل ملا کر 7 گھنٹے ٹی وی دیکھا، تو اس نے بدھ کو 30 منٹ کی کتنی اقساط دیکھیں؟"
answer = "فرض کریں E ان اقساط کی تعداد ہے جو اس نے بدھ کو دیکھیں۔\nپیر کے بعد، اس کے پاس 7 - 1 = <<7-1=6>>6 گھنٹے کا ٹی وی باقی تھا۔\nمنگل کے بعد، اس کے پاس 6 - 1 = <<6-1=5>>5 گھنٹے کا ٹی وی باقی تھا۔\nجمعرات کے بعد، اس کے پاس 5 - 1 - 0.5 = 3.5 گھنٹے کا ٹی وی باقی تھا۔\nجمعہ کے بعد، اس کے پاس 3.5 - 2 = 1.5 گھنٹے کا ٹی وی باقی تھا۔\nہر 30 منٹ کی قسط 1/2 گھنٹہ ہوتی ہے۔\nلہٰذا، E = 1.5/0.5 = 3 اقساط۔\n#### 3\n"
