question = "اس کی غذائی معلومات کے مطابق، چپس کی ایک تھیلی میں 250 کیلوریز فی سرونگ ہوتی ہیں۔ اگر ایک 300 گرام کی تھیلی میں 5 سرونگز ہیں، تو آپ کتنے گرام کھا سکتے ہیں اگر آپ کا روزانہ کیلوری ہدف 2000 ہے اور آپ نے پہلے ہی 1800 کیلوریز استعمال کر لی ہیں؟"
answer = "اگر کل کیلوری ہدف 2000 ہے اور میں نے 1800 کیلوریز استعمال کر لی ہیں تو میرے پاس کھانے کے لیے 2000-1800 = <<2000-1800=200>>200 کیلوریز باقی ہیں\nاگر چپس کی ہر سرونگ میں 250 کیلوریز ہیں اور میرے پاس کھانے کے لیے صرف 200 کیلوریز باقی ہیں، تو میں صرف 200/250 سرونگ کھا سکتا ہوں = 4/5 سرونگ\nہم یہ بھی جانتے ہیں کہ چپس کی ایک 300 گرام کی تھیلی میں 5 سرونگز ہیں، اس لیے ہر سرونگ میں 300 گرام/5 = <<300/5=60>>60 گرام ہوتے ہیں\nاگر میں صرف 4/5 سرونگ کھا سکتا ہوں، تو میں صرف 60 گرام * 4/5 = 48 گرام کھا سکتا ہوں\n#### 48\n"
