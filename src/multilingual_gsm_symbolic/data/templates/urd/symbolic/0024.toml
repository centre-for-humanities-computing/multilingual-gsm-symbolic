question = "اس کی غذائی معلومات کے مطابق، چپس کے ایک پیکٹ میں فی سرونگ 250 کیلوریز ہیں۔ اگر 300 گرام کے ایک پیکٹ میں 5 سرونگز ہوں، تو اگر آپ کا روزانہ کیلوری ہدف 2000 ہے اور آپ پہلے ہی 1800 کیلوریز استعمال کر چکے ہیں، تو آپ کتنے گرام کھا سکتے ہیں؟"
answer = "اگر کل کیلوری ہدف 2000 ہے اور میں 1800 کیلوریز استعمال کر چکا ہوں، تو میرے پاس کھانے کے لیے 2000-1800 = <<2000-1800=200>>200 کیلوریز باقی ہیں\nاگر چپس کی ہر سرونگ میں 250 کیلوریز ہیں اور میرے پاس کھانے کے لیے صرف 200 کیلوریز باقی ہیں، تو میں صرف 200/250 سرونگ کھا سکتا ہوں = ایک سرونگ کا 4/5 حصہ\nہم یہ بھی جانتے ہیں کہ 300 گرام کے ایک چپس کے پیکٹ میں 5 سرونگز ہیں، لہٰذا ہر سرونگ میں 300 گرام/5 = <<300/5=60>>60 گرام ہیں\nاگر میں صرف ایک سرونگ کا 4/5 حصہ کھا سکتا ہوں، تو میں صرف 60 گرام * 4/5 = 48 گرام کھا سکتا ہوں\n#### 48\n"
