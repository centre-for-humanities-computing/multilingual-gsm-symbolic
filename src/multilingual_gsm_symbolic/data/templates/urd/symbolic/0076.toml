question = "ڈیاندرے نے گزشتہ پیر کو 3 ٹونا مچھلیاں پکڑیں، اس کی پکڑی ہوئی پہلی ٹونا مچھلی کا وزن 56 کلوگرام ہے، دوسری ٹونا مچھلی کا وزن 46 کلوگرام ہے، اور باقی ٹونا مچھلی کا وزن 26 کلوگرام ہے۔ اگر ٹونا مچھلی کے ایک کلوگرام کی قیمت $0.5 ہو، تو وہ تمام ٹونا مچھلیاں بازار میں بیچنے کے بعد کتنی رقم کمائے گا؟"
