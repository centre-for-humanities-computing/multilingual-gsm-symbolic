question = "ایلیس لکھنا سیکھ رہی ہے اور فیصلہ کرتی ہے کہ جب تک اسے حروفِ تہجی یاد نہ ہو جائیں، وہ انہیں بار بار دوبارہ لکھتی رہے گی۔ وہ اسے مکمل طور پر دو بار لکھتی ہے، پھر اس کا آدھا ایک بار لکھتی ہے، اور پھر جو کچھ وہ پہلے ہی لکھ چکی ہے اسے دوبارہ لکھتی ہے۔ ایلیس نے کل کتنے حروف لکھے ہیں؟"
