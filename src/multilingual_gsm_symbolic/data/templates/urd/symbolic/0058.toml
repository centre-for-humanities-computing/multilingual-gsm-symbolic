question = "ایک بونا اپنے ننگے ہاتھوں سے روزانہ 12 پاؤنڈ معدنی پتھر نکال سکتا ہے۔ وہ کانسی کی کلہاڑی سے اس سے دو بار نکال سکتا ہے، اور فولادی کلہاڑی سے کانسی کی کلہاڑی کے مقابلے میں 50% زیادہ نکال سکتا ہے۔ 30 دنوں کے ایک مہینے میں فولادی کلہاڑیاں رکھنے والے 40 بونے کتنے پاؤنڈ معدنی پتھر نکال سکتے ہیں؟"
answer = "پہلے معلوم کریں کہ ایک بونا کانسی کی کلہاڑی سے کتنا معدنی پتھر نکال سکتا ہے: 12 پاؤنڈ/دن*2=<<12*2=24>>24 پاؤنڈ/دن\nپھر اس مقدار کو 150% سے ضرب دیں تاکہ معلوم ہو کہ ایک بونا فولادی کلہاڑی سے کتنا نکال سکتا ہے: 24 پاؤنڈ/دن * 150% = <<24*150*.01=36>>36 پاؤنڈ/دن\nپھر ایک بونا فولادی کلہاڑی سے ایک دن میں جتنا معدنی پتھر نکالتا ہے، اسے بونوں کی تعداد سے ضرب دیں: 36 پاؤنڈ/دن/بونا * 40 بونے = <<36*40=1440>>1440 پاؤنڈ/دن\nپھر روزانہ نکالے گئے معدنی پتھر کی مقدار کو دنوں کی تعداد سے ضرب دیں تاکہ ایک مہینے میں نکالی گئی کل مقدار معلوم ہو: 1440 پاؤنڈ/دن * 30 دن = <<1440*30=43200>>43,200 پاؤنڈ/دن\n#### 43200\n"
