question = "سنی چندہ جمع کرنے کے لیے جنجربریڈ اور سیب کی پائی بیچ رہا ہے۔ ہفتے، اس نے جنجربریڈ کے 10 ڈبے بیچے اور اتوار کے مقابلے میں سیب کی پائی کے 4 ڈبے کم بیچے۔ اتوار کو، اس نے ہفتے کے مقابلے میں جنجربریڈ کے 5 ڈبے زیادہ اور سیب کی پائی کے 15 ڈبے بیچے۔ اگر جنجربریڈ کی قیمت $6 تھی اور سیب کی پائی کی قیمت $15 تھی، تو سنی نے دو دنوں میں کتنی رقم کمائی؟"
answer = "اتوار کو اس نے جنجربریڈ کے 10 + 5 = <<10+5=15>>15 ڈبے بیچے۔\nجنجربریڈ کے ڈبوں کی کل تعداد جو سنی نے بیچی 10 + 15 = <<10+15=25>>25 ہے۔\nسنی نے جنجربریڈ بیچ کر 25*$6 = $<<25*6=150>>150 کمائے۔\nہفتے اس نے سیب کی پائی کے 15 - 4 = <<15-4=11>>11 ڈبے بیچے۔\nسیب کی پائی کے ڈبوں کی کل تعداد جو سنی نے بیچی 15 + 11 = <<15+11=26>>26 ہے۔\nاس نے سیب کی پائی بیچ کر 26*$15 = $<<26*15=390>>390 کمائے۔\nلہٰذا، سنی نے دو دنوں میں $150 + $390 = $<<150+390=540>>540 کمائے۔\n#### 540\n"
