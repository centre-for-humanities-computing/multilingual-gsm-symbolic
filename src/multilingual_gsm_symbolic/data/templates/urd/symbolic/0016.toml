question = "سنی فنڈ ریزر کے لیے جینجر بریڈ اور سیب پائی بیچ رہا ہے۔ ہفتہ کو، اس نے 10 باکس جینجر بریڈ اور اتوار سے 4 کم باکس سیب پائی بیچے۔ اتوار کو، اس نے ہفتہ سے 5 زیادہ باکس جینجر بریڈ اور 15 باکس سیب پائی بیچے۔ اگر جینجر بریڈ کی قیمت $6 ہے اور سیب پائی کی قیمت $15 ہے، تو سنی نے دو دن کے لیے کتنی کمائی کی؟"
answer = "اس نے 10 + 5 = <<10+5=15>>15 باکس جینجر بریڈ اتوار کو بیچے۔\nجینجر بریڈ کے کل باکسوں کی تعداد جو سنی نے بیچے 10 + 15 = <<10+15=25>>25 ہے۔\nسنی نے جینجر بریڈ بیچنے کے لیے 25*$6 = $<<25*6=150>>150 کمائے۔\nاس نے ہفتہ کو 15 - 4 = <<15-4=11>>11 باکس سیب پائی بیچے۔\nسیب پائی کے کل باکسوں کی تعداد جو سنی نے بیچے 15 + 11 = <<15+11=26>>26 ہے۔\nاس نے سیب پائی بیچنے کے لیے 26*$15 = $<<26*15=390>>390 کمائے۔\nلہذا، سنی نے دو دن کے لیے $150 + $390 = $<<150+390=540>>540 کمائے۔\n#### 540\n"
