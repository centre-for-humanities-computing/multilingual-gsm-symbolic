question = "سیلی چھٹیاں گزارنے کے لیے سمندر کے کنارے گئی۔ اس کے والدین نے اسے اپنی مرضی کی چیزیں خریدنے کے لیے $15 دیے۔ تحفوں کی دکان پر ٹافی پر یہ رعایت تھی: \"1 پاؤنڈ $3 فی پاؤنڈ کے حساب سے خریدیں، اور 1 پاؤنڈ پر 1/2 رعایت پائیں۔\" اس نے 4 پاؤنڈ لے لیں۔ اس نے سیپوں کا ایک ملا جلا تھیلا بھی $1.5 میں خریدا اور 4 مقناطیس بھی خریدے جن میں سے ہر ایک کی قیمت $0.25 تھی۔ سیلی کے پاس کتنے پیسے بچ گئے؟"
answer = "سیلی 1 پاؤنڈ $3 میں خرید رہی ہے اور اسے 1 پاؤنڈ پر 1/2 رعایت ملتی ہے۔ لہٰذا 1 پاؤنڈ پر 1/2 رعایت $3*1/2 = $1.5 بنتی ہے۔ باقی 2 پاؤنڈ پر کوئی رعایت نہیں ہے اور اس کی قیمت 2*$3 = $6 ہے، اس لیے کل $3+$3/2+$6=$21/2\n4 مقناطیس جن میں سے ہر ایک $0.25 کا ہے، ان کی قیمت 4*0.25=$<<4*0.25=1>>1 ہے\nجب ہم اس کی تمام خریداریوں کو جمع کرتے ہیں، $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nاس کے پاس $15 تھے اور اس نے $13 خرچ کیے، اس لیے اس کے پاس $15-$13 = $<<15-13=2>>2 بچے\n#### 2\n"
