question = "سلی چھٹیاں گزارنے کے لیے ساحل سمندر گئی۔ اس کے والدین نے اسے $15 دیے تاکہ وہ جیسا چاہے خرید سکے۔ سوغات کی دکان پر، ٹافی کی فروخت پر تھی \"خریدیں 1 پاؤنڈ فی پاؤنڈ $3 پر، حاصل کریں 1 پاؤنڈ 1/2 کی چھوٹ۔\" اس نے 4 پاؤنڈ اٹھائے۔ اس نے مزید $1.5 میں ساحل کے خولوں کی ایک مخلوط تھیلی بھی خریدی اور 4 مقناطیس جو فی ایک $0.25 تھے۔ سلی کے پاس کتنی رقم بچی ہے؟"
answer = "سلی 1 پاؤنڈ $3 میں خرید رہی ہے اور 1 پاؤنڈ 1/2 کی چھوٹ حاصل کرتی ہے۔ تو 1/2 کی چھوٹ 1 پاؤنڈ پر $3*1/2 = $1.5 بنتی ہے۔ باقی 2 پاؤنڈ پر کوئی چھوٹ نہیں ہے اور اس کی قیمت 2*$3 = $6 ہے، تو کل $3+$3/2+$6=$21/2 ہے\n4 مقناطیس فی ایک $0.25 پر 4*0.25=$<<4*0.25=1>>1 ہے\nجب آپ اس کی تمام خریداری جمع کریں، $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nاس کے پاس $15 تھے اور اس نے $13 خرچ کیے تو اس کے پاس $15-$13 = $<<15-13=2>>2 باقی بچے\n#### 2\n"
