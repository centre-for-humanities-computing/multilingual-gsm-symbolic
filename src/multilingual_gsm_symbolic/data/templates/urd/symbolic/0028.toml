question = "ایک ہسپتال میں 1000 بستروں کی گنجائش ہے جن میں سے 1/5 پر مریض موجود ہیں۔ کورونا وائرس کے پھیلاؤ کی وجہ سے ہر روز 50 مریض ہسپتال میں داخل کیے جاتے ہیں۔ 2 ہفتوں کے بعد ہسپتال میں خالی بستروں کی کل تعداد معلوم کریں۔"
answer = "اگر ہسپتال کے بستروں کی کل گنجائش کا 1/5 حصہ بھرا ہوا ہے، تو اس کا مطلب ہے کہ 1/5 * 1000 = <<1000*1/5=200>>200 بستروں پر مریض موجود ہیں۔\nنئے داخلوں کے بغیر ہسپتال میں بستروں کی کل خالی تعداد 1000 بستر - 200 بستر = <<1000-200=800>>800 بستر ہے۔\nاگر ہر روز 50 افراد داخل کیے جاتے ہیں، تو ایک ہفتے کے بعد ہسپتال میں مریضوں کی کل تعداد 50 مریض/دن * 7 دن/ہفتہ = 350 مریض ہوگی۔\n2 ہفتوں کے بعد ہسپتال میں داخل کیے گئے مریضوں کی کل تعداد 350 مریض/ہفتہ * 2 ہفتے = <<350*2=700>>700 مریض ہوگی، اور ہر مریض ایک بستر استعمال کرتا ہے۔\nاگر نئے داخلوں سے پہلے ہسپتال میں 800 خالی بستر تھے، تو یہ کل تعداد 800 بستر - 700 بستر = <<800-700=100>>100 خالی بستروں تک کم ہو جائے گی۔\n#### 100\n"
