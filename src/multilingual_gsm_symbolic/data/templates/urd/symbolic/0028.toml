answer_annotated = "اگر {facility} کے {item}وں کی کل گنجائش کا {frac} حصہ بھرا ہوا ہے، تو اس کا مطلب ہے کہ {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item}وں پر مریض موجود ہیں۔\nنئے داخلوں کے بغیر {facility} میں {item}وں کی کل خالی تعداد {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item} ہے۔\nاگر ہر روز {daily} افراد داخل کیے جاتے ہیں، تو ایک ہفتے کے بعد {facility} میں مریضوں کی کل تعداد {daily} مریض/دن * 7 دن/ہفتہ = {daily*7} مریض ہوگی۔\n{period} ہفتوں کے بعد {facility} میں داخل کیے گئے مریضوں کی کل تعداد {daily*7} مریض/ہفتہ * {period} ہفتے = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} مریض ہوگی، اور ہر مریض ایک {item} استعمال کرتا ہے۔\nاگر نئے داخلوں سے پہلے {facility} میں {total-int(total*frac)} خالی {item} تھے، تو یہ کل تعداد {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} خالی {item}وں تک کم ہو جائے گی۔\n#### {total - (total * frac + daily * period * 7)}\n"
