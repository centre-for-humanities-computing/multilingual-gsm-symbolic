answer = "اگر اسپتال کے بیڈs کی کل گنجائش کا 1/5 حصہ پر قبضہ ہے، تو اس کا مطلب ہے 1/5 * 1000 = <<1000*1/5=200>>200 بیڈs پر مریضوں کا قبضہ ہے۔\nنئے داخلوں کے بغیر اسپتال میں بیڈs کی کل تعداد 1000 بیڈs - 200 بیڈs = <<1000-200=800>>800 بیڈs ہے۔\nاگر روزانہ 50 لوگ داخل ہوتے ہیں، تو ایک ہفتے کے بعد اسپتال میں مریضوں کی کل تعداد 50 مریض/دن * 7 دن/ہفتہ = 350 مریض ہیں۔\n2 ہفتوں کے بعد، اسپتال میں داخل ہونے والے مریضوں کی کل تعداد 350 مریض/ہفتہ * 2 ہفتے = <<350*2=700>>700 مریض ہیں، جو ہر ایک ایک بیڈ استعمال کرتے ہیں۔\nاگر نئے داخلوں سے پہلے اسپتال میں 800 خالی بیڈs تھے، تو کل تعداد کم ہو کر 800 بیڈs - 700 بیڈs = <<800-700=100>>100 خالی بیڈs رہ جاتی ہے۔\n#### 100\n"
