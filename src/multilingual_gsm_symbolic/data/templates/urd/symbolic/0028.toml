answer_annotated = "اگر {facility} کے {item}s کی کل گنجائش کا {frac} حصہ پر قبضہ ہے، تو اس کا مطلب ہے {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item}s پر مریضوں کا قبضہ ہے۔\nنئے داخلوں کے بغیر {facility} میں {item}s کی کل تعداد {total} {item}s - {int(total*frac)} {item}s = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}s ہے۔\nاگر روزانہ {daily} لوگ داخل ہوتے ہیں، تو ایک ہفتے کے بعد {facility} میں مریضوں کی کل تعداد {daily} مریض/دن * 7 دن/ہفتہ = {daily*7} مریض ہیں۔\n{period} ہفتوں کے بعد، {facility} میں داخل ہونے والے مریضوں کی کل تعداد {daily*7} مریض/ہفتہ * {period} ہفتے = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} مریض ہیں، جو ہر ایک ایک {item} استعمال کرتے ہیں۔\nاگر نئے داخلوں سے پہلے {facility} میں {total-int(total*frac)} خالی {item}s تھے، تو کل تعداد کم ہو کر {total-int(total*frac)} {item}s - {daily*period*7} {item}s = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} خالی {item}s رہ جاتی ہے۔\n#### {total - (total * frac + daily * period * 7)}\n"
