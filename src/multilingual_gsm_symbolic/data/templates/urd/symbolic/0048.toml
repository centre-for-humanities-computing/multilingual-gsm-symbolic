question = "ایملی ایک منٹ میں 6 جھینگا چھیل سکتی ہے اور 10 منٹ میں 30 جھینگا بھون سکتی ہے۔ اسے 90 جھینگا چھیلنے اور بھوننے میں کتنا وقت لگے گا؟ ایملی ایک ہی وقت میں چھیل اور بھون نہیں سکتی۔"
answer = "سب سے پہلے یہ معلوم کریں کہ ایملی کو جھینگا چھیلنے میں کتنا وقت لگتا ہے: 90 جھینگا / 6 جھینگا/فی منٹ = <<90/6=15>>15 منٹ\nپھر معلوم کریں کہ اسے جھینگا کتنی بیچوں میں پکانے کی ضرورت ہے: 90 جھینگا / 30 جھینگا/بیچ = <<90/30=3>>3 بیچیں\nپھر کل پکانے کا وقت معلوم کرنے کے لیے بیچوں کی تعداد کو فی بیچ وقت سے ضرب دیں: 3 بیچیں * 10 منٹ/بیچ = <<3*10=30>>30 منٹ\nپھر چھیلنے کا وقت شامل کریں تاکہ ایملی کا خرچ کردہ کل وقت معلوم ہو: 30 منٹ + 15 منٹ = <<30+15=45>>45 منٹ\n#### 45\n"
