question = "مسٹر روپر کی 30 طلبہ کی کلاس میں، کلاس کے 20% فٹ بال کھلاڑی ہیں۔ باقی رہ جانے والی کلاس میں سے، 25% طلبہ چیئر لیڈر ہیں یا بینڈ کا حصہ ہیں۔ طلبہ کے یہ 3 گروہ آج باہر ہونے والے ایک کھیل میں جانے کے لیے جلدی نکلیں گے۔ کتنے طلبہ جلدی نکل رہے ہیں؟"
answer = "30 طلبہ کی کلاس کے 20% فٹ بال کھلاڑی ہیں، اس لیے یہ 0.2*30 = <<0.2*30=6>>6 طلبہ بنتے ہیں\n30 طلبہ ہیں اور 6 فٹ بال کھلاڑی ہیں، لہٰذا 30-6 = <<30-6=24>>24 طلبہ باقی رہ جاتے ہیں\nباقی 24 طلبہ میں سے 25% بینڈ کا حصہ ہیں یا چیئر لیڈر ہیں، اس لیے یہ 0.25*24 = <<0.25*24=6>>6 طلبہ بنتے ہیں\n6 طلبہ فٹ بال کھلاڑی ہیں اور 6 بینڈ/چیئر لیڈر کا حصہ ہیں، اس لیے 6+6 = <<6+6=12>>12 طلبہ جلدی نکلیں گے\n#### 12\n"
