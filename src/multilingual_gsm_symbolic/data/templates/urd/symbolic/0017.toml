question = "دادی اماں ہر روز اپنے پسندیدہ پیدل چلنے والے راستے پر 3 میل چلتی ہیں، جس میں 2 میل ساحل پر چلنا اور 1 میل فٹ پاتھ پر چلنا شامل ہے۔ فٹ پاتھ پر دادی اماں ساحل کے مقابلے میں دو بار رفتار سے چلتی ہیں۔ اگر ان کی چہل قدمی کے 40 منٹ ساحل پر گزرتے ہیں، تو پورے 3 میل کے راستے کو مکمل کرنے میں انہیں کل کتنے منٹ لگتے ہیں؟"
answer = "ساحل پر دادی اماں 40 منٹ میں 2 میل کی رفتار سے چلتی ہیں، یعنی 2/40 = 1/20 میل فی منٹ۔\nفٹ پاتھ پر وہ ریت پر چلنے کی رفتار سے دو بار رفتار سے چلتی ہیں، یعنی 2*1/20 = 0.1 میل فی منٹ۔\nفٹ پاتھ پر 1 میل چلنے میں انہیں 1/0.1 = <<1/0.1=10>>10 منٹ لگتے ہیں۔\nلہٰذا، کل ملا کر دادی اماں کو اپنے پسندیدہ راستے پر چلنے میں 40+10 = <<40+10=50>>50 منٹ لگتے ہیں۔\n#### 50\n"
