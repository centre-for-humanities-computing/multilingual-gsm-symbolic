question = "ایلن کے گھر میں، کینولی سے مکئی دو گنا زیادہ ہیں۔ اس کے گھر میں کل 40 کینولی ہیں۔ ایلن نے دکان پر 60 مزید کینولی خریدے اور کینولی کی تعداد سے 40 کم مکئی۔ یہ معلوم کریں کہ ایلن کے گھر میں مکئی اور کینولی کی کل مجموعی تعداد کیا ہے؟"
answer = "مکئی اور کینولی خریدنے سے پہلے، ایلن کے پاس کینولی سے دو گنا گنا زیادہ مکئی تھے، جو کہ 40 کینولی * 5 مکئی/کینولی = <<40*5=200>>200 مکئی ہیں\nایلن کے پاس پہلے مکئی اور کینولی کی کل تعداد یہ تھی 200 مکئی + 40 کینولی = <<200+40=240>>240 اشیاء\nجب اس نے کینولی سے 40 کم مکئی خریدے، اس نے 60 مکئی - 40 مکئی = <<60-40=20>>20 مکئی خریدے\nکل ملا کر، اس نے 20 مکئی + 60 کینولی = <<20+60=80>>80 اشیاء خریدیں\nخریداری کے بعد، ایلن کے پاس 240 اشیاء + 80 اشیاء = <<240+80=320>>320 کل مکئی اور کینولی مل کر ہیں۔\n#### 320\n"
