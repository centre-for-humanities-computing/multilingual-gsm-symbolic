question = "ایلن کے گھر میں کینولیوں کے مقابلے میں مکئی کے دانے دو بار ہیں۔ اس کے گھر میں کل 40 کینولیاں ہیں۔ ایلن نے دکان سے مزید 60 کینولیاں خریدیں اور کینولیوں کی تعداد سے 40 کم مکئی کے دانے خریدے۔ معلوم کریں کہ ایلن کے گھر میں مکئی کے دانےوں اور کینولیوں کی مجموعی کل تعداد کتنی ہے؟"
answer = "مکئی کے دانے اور کینولیاں خریدنے سے پہلے، ایلن کے پاس کینولیوں کے مقابلے میں مکئی کے دانے دو بار تھے، یعنی 40 کینولیاں*2 مکئی کے دانے/کینولی = <<40*2=80>>80 مکئی کے دانے\nایلن کے پاس پہلے مکئی کے دانے اور کینولیوں کی کل تعداد 80 مکئی کے دانے + 40 کینولیاں = <<80+40=120>>120 اشیا تھی\nجب اس نے کینولیوں سے 40 کم مکئی کے دانے خریدے، تو اس نے 60 مکئی کے دانے - 40 مکئی کے دانے = <<60-40=20>>20 مکئی کے دانے خریدے\nمجموعی طور پر، اس نے 20 مکئی کے دانے + 60 کینولیاں = <<20+60=80>>80 اشیا خریدیں\nخریداری کے بعد، ایلن کے پاس 120 اشیا + 80 اشیا = <<120+80=200>>200 مکئی کے دانے اور کینولیاں ملا کر ہیں۔\n#### 200\n"
