question = "نیٹ اپنے مویشیوں کو گھاس کھلا رہا ہے۔ ہر بکری کو 5 پاؤنڈ چاہیے، اور ہر لاما کو ہر بکری کی ضرورت کی مقدار کے دگنے سے 3 پاؤنڈ کم چاہیے۔ اگر 15 بکریاں اور 12 لاما ہیں، تو نیٹ کو کتنے پاؤنڈ گھاس چاہیے؟"
answer = "پہلے معلوم کریں کہ ہر لاما کو کتنی گھاس چاہیے: 5 پاؤنڈ * 2 - 3 = <<5*2-3=7>>7 پاؤنڈ/لاما\nاب معلوم کریں کہ تمام لاما کو کل کتنی گھاس چاہیے: 7 پاؤنڈ/لاما * 12 لاما = <<7*12=84>>84 پاؤنڈ\nاب معلوم کریں کہ تمام بکریوں کو کل کتنی گھاس چاہیے: 5 پاؤنڈ/بکری * 15 بکریاں = <<5*15=75>>75 پاؤنڈ\nاب گھاس کی دونوں مقداروں کو جمع کرکے کل معلوم کریں: 84 پاؤنڈ + 75 پاؤنڈ = <<84+75=159>>159 پاؤنڈ\n#### 159\n"
