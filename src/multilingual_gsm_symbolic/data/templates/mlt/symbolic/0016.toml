question_annotated = "{name, Sunny} qed ibejji {food,kukkija tal-ġinġer} u {fruit,tuffieħa} torta għal ġbir ta' fondi. Fuq {d1,Is-Sibt}, huwa bejja {n1,10} kaxxi ta' {food,kukkija tal-ġinġer} u {m1,4} kaxxi inqas ta' {fruit,tuffieħa} torta, minn {d2,Il-Ħadd}. Fuq {d2,Il-Ħadd}, huwa bejja {n2,5} kaxxi aktar ta' {food,kukkija tal-ġinġer} minn {d1,Is-Sibt} u {m2,15} kaxxi ta' {fruit,tuffieħa} torta. Jekk il-{food,kukkija tal-ġinġer} kienet tikkostja {cur,$}{cn,6} u l-{fruit,tuffieħa} torta kienet tikkostja {cur,$}{cm,15}, kemm għamel {name,Sunny} għal żewġ ijiem?\n\n#init:\n- name = sample(names_male)\n- fruit = sample(fruits)\n- cur = sample(currencies_sym)\n- food = sample([\"kukkija tal-ġinġer\", \"kukkiji\", \"brawni\", \"muffins\", \"kappiċċi\"])\n- d1, d2 = sample_sequential(weekdays, 2)\n- $n1 = range(21, 30)\n- $n2 = range(11, 15)\n- $m1 = range(4, 20)\n- $m2 = range(15, 30)\n- $cn = range(7, 13)\n- $cm = range(20, 33)\n\n#conditions:\n- m1 < m2\n\n#answer: (2*n1+n2)*cn + (2*m2-m1)*cm\n"
answer_annotated = "Huwa bejja {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} kaxxi ta' {food} fuq {d2}.\nIn-numru totali ta' kaxxi ta' {food} li {name} bejja huwa {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} għamel {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} għall-bejgħ ta' {food}.\nHuwa bejja {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} kaxxi ta' {fruit} torta fuq {d1}.\nIn-numru totali ta' kaxxi ta' {fruit} torta li {name} bejja huwa {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nHuwa għamel {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} għall-bejgħ ta' {fruit} torta.\nGħalhekk, {name} għamel {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} għal żewġ ijiem.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
