question = "Sunny qed ibejji kukkija tal-ġinġer u tuffieħa torta għal ġbir ta' fondi. Fuq Is-Sibt, huwa bejja 10 kaxxi ta' kukkija tal-ġinġer u 4 kaxxi inqas ta' tuffieħa torta, minn Il-Ħadd. Fuq Il-Ħadd, huwa bejja 5 kaxxi aktar ta' kukkija tal-ġinġer minn Is-Sibt u 15 kaxxi ta' tuffieħa torta. Jekk il-kukkija tal-ġinġer kienet tikkostja $6 u l-tuffieħa torta kienet tikkostja $15, kemm għamel Sunny għal żewġ ijiem?"
answer = "Huwa bejja 10 + 5 = <<10+5=15>>15 kaxxi ta' kukkija tal-ġinġer fuq Il-Ħadd.\nIn-numru totali ta' kaxxi ta' kukkija tal-ġinġer li Sunny bejja huwa 10 + 15 = <<10+15=25>>25.\nSunny għamel 25*$6 = $<<25*6=150>>150 għall-bejgħ ta' kukkija tal-ġinġer.\nHuwa bejja 15 - 4 = <<15-4=11>>11 kaxxi ta' tuffieħa torta fuq Is-Sibt.\nIn-numru totali ta' kaxxi ta' tuffieħa torta li Sunny bejja huwa 15 + 11 = <<15+11=26>>26.\nHuwa għamel 26*$15 = $<<26*15=390>>390 għall-bejgħ ta' tuffieħa torta.\nGħalhekk, Sunny għamel $150 + $390 = $<<150+390=540>>540 għal żewġ ijiem.\n#### 540\n"
