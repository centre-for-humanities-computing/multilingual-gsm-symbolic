question = "Frankie jara t-televiżjoni wara li jtemm l-istudji tad-dar tiegħu kull lejl. Fl-It-Tnejn u fl-It-Tlieta, ra episodju ta' 1-siegħa tas-serje favorit tiegħu kull lejl. Fl-Il-Erbgħa, ra ftit episodji ta' programm ta' 30-minuta. Fl-Il-Ħamis, temm l-istudji tad-dar tiegħu bikri u ra episodju ta' 1-siegħa u programm ta' 30-minuta. Fl-Il-Ġimgħa, kellu jibqa' jgħid tard, għalhekk ra tnejn episodji ta' 1-siegħa. Jekk ra 7 siegħat ta' televiżjoni flimkien, kemm-il episodju ta' 30-minuta ra fl-Il-Erbgħa?"
