question = "Artie għandu stand ta' fjuri fil-suq tal-bdiewa. Huwa jbigħ tliet tipi ta' fjuri: marigolds, petunjas u begonji. Normalment ibigħ marigolds għal $2.74 kull qawwa, petunjas għal $1.87 kull qawwa u begonji għal $2.12 kull qawwa. Artie m'għandux bidla llum, għalhekk deċieda li jirrenda l-prezzijiet kollha tiegħu għad-dollaru l-aktar qrib. Jekk Artie ibigħ 12 qawwa ta' marigolds, 9 qawwa ta' petunjas u 17 qawwa ta' begonji, kemm se jagħmel?"
