question = "Garrett qiegħed jgħolli popcorn għal snack. Meta l-pjanċa tal-għaġġa tisħan, l-għaġġa jibdew jinfetħu aktar malajr. 20 jinfetħu fil-ewwel 30 sekonda tas-sajjar, imbagħad tlieta darbiet dik il-kwantità fil-prossma 30 sekonda. L-għaġġa jiżdiedu għal erba' darbiet ir-rata inizjali tal-popping fil-prossma 30 sekonda, imma fl-aħħar 30 sekonda, il-popping jonqos għal nofs ir-rata tal-30 sekonda li għaddew. Wara li Garrett jieħu l-pjanċa 'l bogħod mis-sħana, kwart tan-numru ta' għaġġa li infetħu fl-aħħar 30 sekonda tas-sajjar jinfetħu wkoll mis-sħana residwa. Kemm biċċiet popcorn għandu Garrett jiekol?"
