question = "Dana tista' tiġri erba' darbiet aktar mgħaġġla milli tista' tmexxi bil-mixi, imma tista' taqbeż b'rata ta' veloċità li hija nofs kemm tista' tiġri. Jekk tista' taqbeż b'3 milja kull siegħa, kemm milia tista' tivvjaġġa f'sitta siegħat jekk tqatta' terz tal-ħin tiġri u tnejn terzi tal-ħin tmexxi bil-mixi?"
answer = "Jekk Dana tista' taqbeż b'nofs tal-veloċità li tista' tiġri, allura tista' tiġri b'3*2=<<3*2=6>>6 milja kull siegħa.\nU peress li tista' tiġri b'veloċità li hija erba' darbiet aktar mgħaġġla milli tista' tmexxi bil-mixi, dan ifisser li tista' tmexxi bil-mixi b'6/4=1.5 milja kull siegħa.\nJekk tnejn terzi tal-ħin jinqata' tmexxi bil-mixi, allura tmexxi bil-mixi għal 10*3/5=<<10*3/5=6>>6 siegħat.\nJekk terz tal-ħin jinqata' għat-tiġri, allura tiġri għal 10-6=<<10-6=10/3>>10/3 siegħat.\nGħalhekk, tiġri għal 10/3 siegħat b'6 milja kull siegħa, jew 10/3*6=<<10/3*6=20>>20 milja.\nTmexxi bil-mixi għal 6 siegħat b'1.5 milja kull siegħa, jew 6*1.5=<<6*1.5=9>>9 milja.\nGħalhekk, flimkien, tivvjaġġa 20+9=<<20+9=29>>29 milja.\n#### 29\n"
