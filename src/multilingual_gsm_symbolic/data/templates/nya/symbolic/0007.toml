question = "Mkulukulu akugula chakudya pa malonda. Iye amagula mitundu yosiyanasiyana ya mbewu, oats, mbatata ndi sukulu. Chifukwa sukulu ndi chakudya chosowa, amagula awiri 1-libulo mabokosi awo pa chigwa chonse. Amakonda mbatata zokwanira kudyetsa malonda pomwe mbewu zatsopano, amagula ina 12-libulo matabala. Mbewu ndi chakudya chachikulu cha malonda, amagula makumi ana ndi awiri 75-libulo mapakeji. Oats ndi chakudya chofunika kuthandizira mbewu, amagula makumi awiri 65-libulo matabala. Ngati galimoto yake ya faini ikhoza kuyamira 2250 libulos nthawi imodzi, zoyenda zingati zofunika kwa mkuluku kutumiza chakudya chonse?"
