question = "Watson amagwira ntchito ya 10-maawa tsiku lililonse, isanu tsiku pa sabata. Amalandira $10 pa maawa ndipo amapatsidwa $300 ya mphotho sabata iliyonse ngati kampani ikugwira ntchito bwino. Ndalama zingati Watson anapeza mu Epulo ngati kampani inagwira ntchito bwino kwambiri kwa mwezi wathunthu?"
