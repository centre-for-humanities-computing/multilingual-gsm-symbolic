question = "Poyang'anira zambiri za thanzi, khwala la chipisi li na 250 kalori pa gawo. Ngati khwala la 300 gramu likhala ndi 5 magawo, mudzaodya zingati gramu ngati cholinga chanu cha kalori tsiku lililonse ndi 2000 ndipo wadya kale 1800 kalori?"
answer = "Ngati cholinga chonse cha kalori ndi 2000 ndipo ndadya 1800 kalori, ndiye ndili ndi 2000-1800 = <<2000-1800=200>>200 kalori zotsala kudya\nNgati gawo lililonse la chipisi lina 250 kalori ndipo ndili ndi 200 kalori zotsala kudya, ndiye ndingadye ndiye 200/250 ya gawo = 4/5 ya gawo\nTikudziwanso kuti khwala la 300 gramu la chipisi likhala ndi 5 magawo, chifukwa chake gawo lililonse lili ndi 300 gramu/5 = <<300/5=60>>60 gramu\nNgati ndingadye ndiye 4/5 ya gawo, ndiye ndingadye ndiye 60 gramu * 4/5 = 48 gramu\n#### 48\n"
