question = "Chipatala ili ndi mphamvu ya 1000 bedis ndi 1/5 zochikidwa. Chifukwa cha mliri wa coronavirus, 50 odwala amalowa m'nyumba ya chipatala tsiku lililonse. Ganizirani kuchuluka kwa bedis osagwiritsidwa ntchito m'nyumba ya chipatala pambuyo pa 2 masabata."
answer = "Ngati 1/5 ya mphamvu yonse ya chipatala bedis zochikidwa, zikutanthauza 1/5 * 1000 = <<1000*1/5=200>>200 bedis ali ndi odwala.\nKuchuluka kwa bedis m'nyumba ya chipatala popanda kulowa kwa odwala atsopano ndi 1000 bedis - 200 bedis = <<1000-200=800>>800 bedis.\nNgati 50 anthu amalowa tsiku lililonse, kuchuluka kwa odwala m'nyumba ya chipatala pambuyo pa sabata limodzi ndi 50 odwala/tsiku * 7 masiku/sabata = 350 odwala.\nPambuyo pa 2 masabata, kuchuluka kwa odwala omwe apatsidwa chipatala m'nyumba ya chipatala ndi 350 odwala/sabata * 2 masabata = <<350*2=700>>700 odwala, omwe aliyense amagwiritsa ntchito bedi imodzi.\nNgati panali 800 bedis osagwiritsidwa ntchito m'nyumba ya chipatala patsogolo pa kulowa kwa odwala atsopano, kuchuluka kwake kuchepa kukhala 800 bedis - 700 bedis = <<800-700=100>>100 bedis osagwiritsidwa ntchito.\n#### 100\n"
