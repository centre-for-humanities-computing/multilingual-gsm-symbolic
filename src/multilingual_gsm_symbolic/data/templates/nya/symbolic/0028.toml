answer_annotated = "Ngati {frac} ya mphamvu yonse ya {facility} {item}s zochikidwa, zikutanthauza {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item}s ali ndi odwala.\nKuchuluka kwa {item}s m'nyumba ya {facility} popanda kulowa kwa odwala atsopano ndi {total} {item}s - {int(total*frac)} {item}s = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}s.\nNgati {daily} anthu amalowa tsiku lililonse, kuchuluka kwa odwala m'nyumba ya {facility} pambuyo pa sabata limodzi ndi {daily} odwala/tsiku * 7 masiku/sabata = {daily*7} odwala.\nPambuyo pa {period} masabata, kuchuluka kwa odwala omwe apatsidwa chipatala m'nyumba ya {facility} ndi {daily*7} odwala/sabata * {period} masabata = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} odwala, omwe aliyense amagwiritsa ntchito {item} imodzi.\nNgati panali {total-int(total*frac)} {item}s osagwiritsidwa ntchito m'nyumba ya {facility} patsogolo pa kulowa kwa odwala atsopano, kuchuluka kwake kuchepa kukhala {total-int(total*frac)} {item}s - {daily*period*7} {item}s = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item}s osagwiritsidwa ntchito.\n#### {total - (total * frac + daily * period * 7)}\n"
