question = "Sally anapita ku nyanja kwa chisangalalo. Aka ake anamupatsa $15 kugula zomwe angafune. Pa duka la zisopa, taffi inali pa mtengo wotsika wa \"Gulani 1 pauni pa $3 pa pauni, pepani 1 pauni 1/2 kuchepetsedwa.\" Inagula 4 pauni. Inagulanso kagawo ka mapamwamba a nyanja pa $1.5 ndi 4 maneti omwe anali $0.25 aliyense. Ndalama zingati zatsala kwa Sally?"
answer = "Sally ikugula 1 pauni pa $3 ndipo imapepala 1 pauni 1/2 kuchepetsedwa. Choncho 1/2 kuchepetsedwa pa 1 pauni ndi $3*1/2 = $1.5. Zotsalazo za 2 pauni sizingakhale ndi kuchepetsedwa ndipo zimatenga 2*$3 = $6, chifukwa chakuti zoonse ndi $3+$3/2+$6=$21/2\n4 maneti pa $0.25 aliyense ndi 4*0.25=$<<4*0.25=1>>1\nPamene mukumisa zomwe zagulidwa zonse, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nInali ndi $15 ndipo inagula $13 chifukwa chake inali ndi $15-$13 = $<<15-13=2>>2 zotsalira\n#### 2\n"
