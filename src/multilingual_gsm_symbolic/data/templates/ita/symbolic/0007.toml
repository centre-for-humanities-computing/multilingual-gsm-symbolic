question = "Un contadino compra mangime per i suoi cavalli. Compra diversi tipi di fieno, avena, carote e zollette di zucchero. Poiché le zollette di zucchero sono una leccornia rara, ne compra solo due scatole da 1 libbre per tutta la stalla. Vuole solo abbastanza carote per nutrire i cavalli finché le verdure restano fresche, quindi compra quattro sacchi da 12 libbre. Il fieno è il piatto principale della dieta dei cavalli, quindi compra quarantadue balle da 75 libbre. L'avena è un alimento base per integrare il fieno, quindi compra venti sacchi da 65 libbre. Se il suo camion agricolo può trasportare 2250 libbre alla volta, quanti viaggi deve fare il contadino per trasportare tutto il mangime?"
