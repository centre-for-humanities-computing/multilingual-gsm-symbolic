question = "Ospedale ha una capacità di 1000 lettos con 1/5 occupato. A causa dell'epidemia di coronavirus, 50 pazienti vengono ricoverati nel ospedale ogni giorno. Calcola il numero totale di lettos liberi nel ospedale dopo 2 settimane."
