question = "Silvia è andata al mare per le vacanze. I suoi genitori le hanno dato $15 euro da spendere come voleva. Nel negozio di souvenir, le caramelle erano in offerta: \"Compra 1 kg a $3 al kg e prendi 1 kg a 1/2 di sconto.\" Ne ha presi 4 kg. Ha comprato anche un sacchetto assortito di conchiglie per $1,5 e 4 calamite che costavano $0,25 ciascuna. Quanti soldi sono rimasti a Silvia?"
