question = "Sally pergi ke pantai untuk bercuti. Ibu bapanya memberinya $15 untuk membeli apa sahaja yang diinginkannya. Di kedai cenderahati, taffi sedang dijual dengan \"Beli 1 paun pada $3 per paun, dapatkan 1 paun 1/2 potongan.\" Dia mengambil 4 paun. Dia juga membeli sekantong campuran cengkerang untuk $1.5 dan 4 magnet yang berharga $0.25 setiap satu. Berapa banyak wang yang sally ada baki?"
answer = "Sally membeli 1 paun pada $3 dan mendapat 1 paun 1/2 potongan. Jadi 1/2 potongan daripada 1 paun ialah $3*1/2 = $1.5. Baki 2 paun tidak mempunyai diskaun dan kosnya 2*$3 = $6, jadi jumlah ialah $3+$3/2+$6=$21/2\n4 magnet pada $0.25 setiap satu ialah 4*0.25=$<<4*0.25=1>>1\nApabila anda menambah semua belanjanya, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nDia mempunyai $15 dan membelanjakan $13 jadi dia mempunyai $15-$13 = $<<15-13=2>>2 baki\n#### 2\n"
