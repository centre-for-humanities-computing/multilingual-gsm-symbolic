question = "จอห์น กำลังหาเงินสำหรับ การทัศนศึกษา. เขาได้ขอความช่วยเหลือจาก โรงเรียน, ซึ่งได้ตัดสินใจรับผิดชอบ ครึ่ง ของค่าใช้จ่ายของ การทัศนศึกษา. เงินจำนวนเท่าไหร่ที่ จอห์น ขาดหากเขาถือ ฿50 และ การทัศนศึกษา มีค่าใช้จ่าย ฿300?"
