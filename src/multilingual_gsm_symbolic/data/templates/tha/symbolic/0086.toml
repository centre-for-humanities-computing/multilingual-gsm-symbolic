question = "อลิสัน ผ่านการคัดเลือกให้เป็นนักกีฬาในทีม วิ่ง ดังนั้นเธอจึงไปซื้ออุปกรณ์กีฬา เธอซื้อ เสื้อกล้าม ราคา ฿10 คู่ของ วิ่ง กางเกงขาสั้น ราคา ฿5 มากกว่าราคาของ เสื้อกล้าม และ รองเท้าเทนนิส คู่หนึ่งซึ่งราคาเดิม ฿48 แต่ลดราคาเหลือ ครึ่ง ของราคาเดิม เธอมีคูปองส่วนลด ฿2 สำหรับแพ็กเกจ ฿8 ของ ถุงเท้า กีฬาที่เธอซื้อด้วย เธอใช้จ่ายไปทั้งหมดเท่าไหร่?"
answer = "กางเกงขาสั้น มีราคา ฿5 มากกว่า เสื้อกล้าม ดังนั้นราคาของมันคือ ฿5 + ฿10 = ฿<<5+10=15>>15.\nรองเท้าเทนนิส ของเธอเป็นราคา ครึ่ง ของราคาเดิม ฿48 ดังนั้นราคาของมันคือ ฿48*1/2=฿24.\nด้วยคูปองของเธอ ถุงเท้า มีราคา ฿8 - ฿2 = ฿<<8-2=6>>6.\nเสื้อกล้าม, กางเกงขาสั้น, รองเท้าเทนนิส, และ ถุงเท้า รวมกันมีราคา ฿10 + ฿15 + ฿24 + ฿6 = ฿<<10+15+24+6=55>>55.\n#### 55\n"
