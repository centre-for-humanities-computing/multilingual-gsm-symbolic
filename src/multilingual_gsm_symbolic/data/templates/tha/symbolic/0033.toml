question = "แคโรล และ เจนนิเฟอร์ เป็นพี่น้องกันมาจาก ลอสแองเจลิส ซึ่งชื่นชอบการเก็บลายเซ็นจาก คนดัง ในช่วง ปิดเทอมฤดูร้อน ของโรงเรียน พี่น้องทั้งสองใช้เวลาทุกบ่ายไปกับการเก็บลายเซ็น หลังจากผ่านไป ห้า สัปดาห์ แคโรล และ เจนนิเฟอร์ เปรียบเทียบสมุดลายเซ็นของพวกเธอ นับจำนวนลายเซ็นที่แต่ละคนเก็บได้ แคโรล มีลายเซ็น 20 ใบในสมุดของเธอ และ เจนนิเฟอร์ มี 44 ใบ พี่น้องทั้งสองมีเวลา สาม สัปดาห์ของ ปิดเทอมฤดูร้อน อีก และพวกเธอตัดสินใจว่าต้องการให้รวมกันมีลายเซ็น 100 ใบก่อนหมดวันหยุด พวกเธอต้องการเก็บลายเซ็นเพิ่มอีกกี่ใบเพื่อไปถึงเป้าหมาย?"
