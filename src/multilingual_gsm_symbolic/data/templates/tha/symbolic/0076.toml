question = "ดีแอนดรู จับ ปลาทูน่า 3 ตัว เมื่อ วันจันทร์, ปลาทูน่า ตัวแรกที่เขาจับได้มีน้ำหนัก 56 กิโลกรัม, ปลาทูน่า ตัวที่สองที่เขาจับได้มีน้ำหนัก 46 กิโลกรัม, และ ปลาทูน่า ที่เหลือที่เขาจับได้มีน้ำหนัก 26 กิโลกรัม. ถ้า กิโลกรัม ของ ปลาทูน่า ราคา ฿0.5, เขาจะหาเงินได้เท่าไหร่หลังจากขาย ปลาทูน่า ทั้งหมดให้ตลาด?"
answer = "ดีแอนดรู จะหาเงินได้ 56*฿0.5 = ฿<<56*0.5=28>>28 จาก ปลาทูน่า ตัวแรก.\nเขาจะหาเงินได้ 46*฿0.5 = ฿<<46*0.5=23>>23 สำหรับ ปลาทูน่า ตัวที่สอง.\nส่วนที่เหลือของ ปลาทูน่า คือ 3-2 = <<3-2=1>>1. เขาจะหาเงินได้ 26*฿0.5 = ฿<<26*0.5=13>>13 สำหรับแต่ละตัว. ดังนั้นเขาจะหาเงินได้ 1 * 13 = <<1*13>>=13\nดังนั้น จำนวนเงินรวมที่เขาจะหาได้สำหรับ ปลาทูน่า ทั้งหมดคือ ฿28 + ฿23 + ฿13= ฿<<28+23+13=64>>64.\n#### 64\n"
