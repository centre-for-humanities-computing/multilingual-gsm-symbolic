question = "เบรนแดน มีถุงบรรจุ ลูกแก้ว ภายในมี 10 ชิ้น เขาสะดุดกับ หินก้อนเล็ก ขณะกำลังถืออยู่และทำ ครึ่ง ของมันหล่น เขาพยายามค้นหาพวกมันแต่เจอเพียง 3 ชิ้น เมื่อเขากลับถึงบ้าน เขาตรวจสอบ ลูกแก้ว เพิ่มเติม สอง จากสิ่งที่เขาเก็บได้นั้นไม่ใช่ ลูกแก้ว แต่จริงๆ แล้วคือ ลูกปัด ดังนั้นเขาจึงทิ้งมันไป สุดท้ายแล้ว เบรนแดน มี ลูกแก้ว กี่ชิ้น?"
