question = "มารีอา ซื้อ 8 หุ้น ในราคาหุ้นละ $8 ราคาหุ้นเพิ่มขึ้น 50% ในปีแรก มารีอา ถือหุ้นนี้ จากนั้นลดลง 25% ในปีที่สอง มูลค่าสุดท้ายของหุ้นทั้งหมดของ มารีอา คือเท่าใด?"
answer = "ขั้นแรก หามูลค่ารวมเริ่มต้นของการซื้อของ มารีอา: 8 หุ้น * $8/หุ้น = $<<8*8=64>>64\nจากนั้นหาจำนวนการเพิ่มขึ้นของราคาครั้งแรก: $64 * 0.5 = $<<64*0.5=32>>32\nบวกจำนวนนั้นเข้ากับมูลค่าเริ่มต้นเพื่อหามูลค่าหลังจากปีแรก: $64 + $32 = $<<64+32=96>>96\nจากนั้นคูณจำนวนนั้นด้วย 25% เพื่อหาจำนวนการลดลงในปีที่สอง: $96 * 25% = $<<96*25*.01=24>>24\nจากนั้นลบจำนวนนั้นออกจากมูลค่าหลังจากปีแรกเพื่อหามูลค่าสุดท้าย: $96 - $24 = $<<96-24=72>>72\n#### 72\n"
