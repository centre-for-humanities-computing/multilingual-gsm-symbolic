question = "จากข้อมูลโภชนาการ ถุง มันฝรั่งทอด มี 250 แคลอรี ต่อหน่วยบริโภค หากถุง 300 กรัม มี 5 หน่วยบริโภค คุณจะกินได้กี่ กรัม หากเป้าหมายแคลอรีรายวันของคุณคือ 2000 และคุณบริโภคไปแล้ว 1800 แคลอรี?"
answer = "หากเป้าหมายแคลอรีรวมคือ 2000 และฉันบริโภคไปแล้ว 1800 แคลอรี ดังนั้นฉันเหลือ 2000-1800 = <<2000-1800=200>>200 แคลอรี ที่จะกิน\nหากแต่ละหน่วยบริโภคของ มันฝรั่งทอด มี 250 แคลอรี และฉันเหลือ 200 แคลอรี ที่จะกินได้ ดังนั้นฉันกินได้เพียง 200/250 ของหนึ่งหน่วยบริโภค = 4/5 ของหนึ่งหน่วยบริโภค\nเรายังทราบว่าถุง มันฝรั่งทอด ขนาด 300 กรัม มี 5 หน่วยบริโภค ดังนั้นแต่ละหน่วยบริโภคมี 300 กรัม/5 = <<300/5=60>>60 กรัม\nหากฉันกินได้เพียง 4/5 ของหนึ่งหน่วยบริโภค ดังนั้นฉันกินได้เพียง 60 กรัม * 4/5 = 48 กรัม\n#### 48\n"
