question = "เอมิลี่ สามารถปอกเปลือก 6 กุ้ง ต่อนาที และผัด 30 กุ้ง ในเวลา 10 นาที เธอจะต้องใช้เวลานานเท่าใดในการปอกเปลือกและผัด 90 กุ้ง? เอมิลี่ ไม่สามารถปอกเปลือกและผัดในเวลาเดียวกันได้"
answer = "ขั้นแรก หาว่า เอมิลี่ ใช้เวลาปอกเปลือก กุ้ง กี่นาที: 90 กุ้ง / 6 กุ้ง/นาที = <<90/6=15>>15 นาที\nจากนั้น หาว่าเธอต้องทำ กุ้ง เป็นกี่ชุด: 90 กุ้ง / 30 กุ้ง/ชุด = <<90/30=3>>3 ชุด\nจากนั้น คูณจำนวนชุดด้วยเวลาต่อชุดเพื่อหาเวลาปรุงอาหารทั้งหมด: 3 ชุด * 10 นาที/ชุด = <<3*10=30>>30 นาที\nจากนั้น บวกเวลาปอกเปลือกเพื่อหาเวลาทั้งหมดที่ เอมิลี่ ใช้: 30 นาที + 15 นาที = <<30+15=45>>45 นาที\n#### 45\n"
