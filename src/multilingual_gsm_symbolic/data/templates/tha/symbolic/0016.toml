answer_annotated = "เขาขาย {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} กล่องของ {food} ในวัน {d2}\nจำนวนกล่อง {food} ทั้งหมดที่ {name} ขายคือ {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}\n{name} หาเงินได้ {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} จากการขาย {food}\nเขาขาย {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} กล่องของ {fruit} พาย ในวัน {d1}\nจำนวนกล่อง {fruit} พาย ทั้งหมดที่ {name} ขายคือ {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}\nเขาหาเงินได้ {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} จากการขาย {fruit} พาย\nดังนั้น {name} หาเงินได้ {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} สำหรับสองวัน\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
