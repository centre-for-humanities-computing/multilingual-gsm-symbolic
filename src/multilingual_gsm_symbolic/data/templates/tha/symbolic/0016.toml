question = "สันนี่ กำลังขาย ขนมปังขิง และ แอปเปิล พาย เพื่อการระดมทุน ในวัน เสาร์, เขาขาย 10 กล่องของ ขนมปังขิง และขาย แอปเปิล พาย น้อยกว่าวัน อาทิตย์ อยู่ 4 กล่อง ในวัน อาทิตย์, เขาขาย ขนมปังขิง มากกว่าวัน เสาร์ อยู่ 5 กล่อง และขาย แอปเปิล พาย 15 กล่อง ถ้า ขนมปังขิง ราคา $6 และ แอปเปิล พาย ราคา $15 สันนี่ หาเงินได้ทั้งหมดเท่าไหร่สำหรับสองวัน?"
answer = "เขาขาย 10 + 5 = <<10+5=15>>15 กล่องของ ขนมปังขิง ในวัน อาทิตย์\nจำนวนกล่อง ขนมปังขิง ทั้งหมดที่ สันนี่ ขายคือ 10 + 15 = <<10+15=25>>25\nสันนี่ หาเงินได้ 25*$6 = $<<25*6=150>>150 จากการขาย ขนมปังขิง\nเขาขาย 15 - 4 = <<15-4=11>>11 กล่องของ แอปเปิล พาย ในวัน เสาร์\nจำนวนกล่อง แอปเปิล พาย ทั้งหมดที่ สันนี่ ขายคือ 15 + 11 = <<15+11=26>>26\nเขาหาเงินได้ 26*$15 = $<<26*15=390>>390 จากการขาย แอปเปิล พาย\nดังนั้น สันนี่ หาเงินได้ $150 + $390 = $<<150+390=540>>540 สำหรับสองวัน\n#### 540\n"
