answer = "ก่อนซื้อ ข้าวโพด และ คาโนลี่ ใดๆ อลัน มี ข้าวโพด จำนวน สองเท่า เท่าของ คาโนลี่ ซึ่งคือ 40 คาโนลี่*5 ข้าวโพด/คาโนลี่ = <<40*5=200>>200 ข้าวโพด\nจำนวน ข้าวโพด และ คาโนลี่ ทั้งหมดที่ อลัน มีอยู่เดิมคือ 200 ข้าวโพด + 40 คาโนลี่ = <<200+40=240>>240 รายการ\nเมื่อเขาซื้อ ข้าวโพด น้อยกว่า คาโนลี่ อยู่ 40 เขาซื้อ 60 ข้าวโพด - 40 ข้าวโพด = <<60-40=20>>20 ข้าวโพด\nทั้งหมด เขาซื้อ 20 ข้าวโพด + 60 คาโนลี่ = <<20+60=80>>80 รายการ\nหลังการซื้อ อลัน มี 240 รายการ + 80 รายการ = <<240+80=320>>320 ข้าวโพด และ คาโนลี่ รวมทั้งหมด\n#### 320\n"
