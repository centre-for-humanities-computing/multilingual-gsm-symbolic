question = "คุณยาย เดิน 3 ไมล์ ทุกวันบนเส้นทางเดินโปรดของเธอ ซึ่งรวมถึง 2 ไมล์ ของการเดินบนชายหาด และ 1 ไมล์ ของการเดินบนทางเท้า บนทางเท้า คุณยาย เดินด้วยความเร็ว สองเท่า ของความเร็วที่เธอเดินบนชายหาด หากใช้เวลาเดินบนชายหาด 40 นาที เธอจะใช้เวลานานเท่าใดในการเดินให้ครบ 3-ไมล์ ทั้งหมด เป็นนาที"
answer = "บนชายหาด คุณยาย เดินด้วยความเร็ว 2 ไมล์ ต่อ 40 นาที หรือ 2/40 = 1/20 ไมล์ ต่อ นาที\nบนทางเท้า เธอเดินด้วยความเร็ว สองเท่า เท่ากับเมื่อเธออยู่บนทราย หรือ 5*1/20 = 0.25 ไมล์ ต่อ นาที\nในการเดิน 1 ไมล์ บนทางเท้า เธอใช้เวลา 1/0.25 = <<1/0.25=4>>4 นาที\nดังนั้น โดยรวมแล้ว คุณยาย ใช้เวลา 40+4 = <<40+4=44>>44 นาที ในการเดินเส้นทางโปรดของเธอ\n#### 44\n"
