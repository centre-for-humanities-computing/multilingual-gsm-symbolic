question = "เนท กำลังให้อาหารปศุสัตว์ของเขา หญ้า แพะ แต่ละตัวต้องการ 5 ปอนด์ และ ลามะ แต่ละตัวต้องการ 3 ปอนด์ น้อยกว่าสองเท่าของปริมาณที่ แพะ แต่ละตัวต้องการ ถ้ามี 15 แพะ ตัว และ 12 ลามะ ตัว เนท ต้องการ หญ้า กี่ ปอนด์?"
answer = "ก่อนอื่นให้คำนวณว่า ลามะ แต่ละตัวต้องการ หญ้า เท่าไหร่: 5 ปอนด์ * 2 - 3 = <<5*2-3=7>>7 ปอนด์/ลามะ\nตอนนี้ให้คำนวณว่า ลามะ ทั้งหมดต้องการ หญ้า รวมเท่าไหร่: 7 ปอนด์/ลามะ * 12 ลามะ ตัว = <<7*12=84>>84 ปอนด์\nตอนนี้ให้คำนวณว่า แพะ ทั้งหมดต้องการ หญ้า รวมเท่าไหร่: 5 ปอนด์/แพะ * 15 แพะ ตัว = <<5*15=75>>75 ปอนด์\nตอนนี้บวกปริมาณ หญ้า ทั้งสองเพื่อหาผลรวม: 84 ปอนด์ + 75 ปอนด์ = <<84+75=159>>159 ปอนด์\n#### 159\n"
