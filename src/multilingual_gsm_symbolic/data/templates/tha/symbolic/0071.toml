question_annotated = "{name,เนท} กำลังให้อาหารปศุสัตว์ของเขา {food,หญ้า} {animal1,แพะ} แต่ละตัวต้องการ {n1,5} {unit,ปอนด์} และ {animal2,ลามะ} แต่ละตัวต้องการ {n2,3} {unit,ปอนด์} น้อยกว่าสองเท่าของปริมาณที่ {animal1,แพะ} แต่ละตัวต้องการ ถ้ามี {k1,15} {animal1,แพะ} ตัว และ {k2,12} {animal2,ลามะ} ตัว {name,เนท} ต้องการ {food,หญ้า} กี่ {unit,ปอนด์}?\n\n#init:\n- name = sample(names_male)\n- food = sample([\"หญ้า\", \"ธัญพืช\", \"อาหารสัตว์\", \"หญ้าหมัก\"])\n- animal1, animal2 = sample([\"แพะ\", \"วัว\", \"ม้า\", \"ลา\", \"ลามะ\", \"อัลปากา\", \"หมู\", \"ไก่งวง\", \"เป็ด\"], 2)\n- unit = sample([\"ปอนด์\", \"กิโลกรัม\", \"กก.\"])\n- $n1 = range(3, 15)\n- $n2 = range(1, 10)\n- $k1 = range(10, 50)\n- $k2 = range(10, 50)\n\n#conditions:\n- 2*n1 - n2 > 0\n\n#answer: k1*n1 + k2*(2*n1 - n2)\n"
answer_annotated = "ก่อนอื่นให้คำนวณว่า {animal2} แต่ละตัวต้องการ {food} เท่าไหร่: {n1} {unit} * 2 - {n2} = <<{n1}*2-{n2}={2*n1-n2}>>{2*n1-n2} {unit}/{animal2}\nตอนนี้ให้คำนวณว่า {animal2} ทั้งหมดต้องการ {food} รวมเท่าไหร่: {2*n1-n2} {unit}/{animal2} * {k2} {animal2} ตัว = <<{2*n1-n2}*{k2}={k2*(2*n1-n2)}>>{k2*(2*n1-n2)} {unit}\nตอนนี้ให้คำนวณว่า {animal1} ทั้งหมดต้องการ {food} รวมเท่าไหร่: {n1} {unit}/{animal1} * {k1} {animal1} ตัว = <<{n1}*{k1}={k1*n1}>>{k1*n1} {unit}\nตอนนี้บวกปริมาณ {food} ทั้งสองเพื่อหาผลรวม: {k2*(2*n1-n2)} {unit} + {k1*n1} {unit} = <<{k2*(2*n1-n2)}+{k1*n1}={k1*n1 + k2*(2*n1 - n2)}>>{k1*n1 + k2*(2*n1 - n2)} {unit}\n#### {k1*n1 + k2*(2*n1 - n2)}\n"
