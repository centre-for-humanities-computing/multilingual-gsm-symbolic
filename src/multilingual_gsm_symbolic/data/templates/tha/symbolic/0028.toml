question = "โรงพยาบาล มีความจุ 1000 เตียง โดยมี 1/5 ถูกใช้งาน เนื่องจาก การระบาดของไวรัสโคโรนา มีผู้ป่วย 50 คนเข้ารับการรักษาใน โรงพยาบาล ทุกวัน จงคำนวณจำนวน เตียง ที่ว่างทั้งหมดใน โรงพยาบาล หลังจาก 2 สัปดาห์"
answer = "หาก 1/5 ของความจุทั้งหมดของ โรงพยาบาล เตียง ถูกใช้งาน หมายความว่า 1/5 * 1000 = <<1000*1/5=200>>200 เตียง มีผู้ป่วยใช้งานอยู่\nจำนวน เตียง ทั้งหมดใน โรงพยาบาล โดยไม่มีการรับผู้ป่วยใหม่คือ 1000 เตียง - 200 เตียง = <<1000-200=800>>800 เตียง\nหากมี 50 คนเข้ารับการรักษาแต่ละวัน จำนวนผู้ป่วยทั้งหมดใน โรงพยาบาล หลังจากหนึ่งสัปดาห์คือ 50 คน/วัน * 7 วัน/สัปดาห์ = 350 คน\nหลังจาก 2 สัปดาห์ จำนวนผู้ป่วยทั้งหมดที่รับเข้า โรงพยาบาล คือ 350 คน/สัปดาห์ * 2 สัปดาห์ = <<350*2=700>>700 คน ซึ่งแต่ละคนใช้ เตียง หนึ่งหน่วย\nหากมี เตียง ที่ว่าง 800 หน่วยใน โรงพยาบาล ก่อนการรับผู้ป่วยใหม่ จำนวนทั้งหมดลดลงเหลือ 800 เตียง - 700 เตียง = <<800-700=100>>100 เตียง ที่ว่าง\n#### 100\n"
