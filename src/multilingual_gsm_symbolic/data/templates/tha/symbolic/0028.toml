answer_annotated = "หาก {frac} ของความจุทั้งหมดของ {facility} {item} ถูกใช้งาน หมายความว่า {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} มีผู้ป่วยใช้งานอยู่\nจำนวน {item} ทั้งหมดใน {facility} โดยไม่มีการรับผู้ป่วยใหม่คือ {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}\nหากมี {daily} คนเข้ารับการรักษาแต่ละวัน จำนวนผู้ป่วยทั้งหมดใน {facility} หลังจากหนึ่งสัปดาห์คือ {daily} คน/วัน * 7 วัน/สัปดาห์ = {daily*7} คน\nหลังจาก {period} สัปดาห์ จำนวนผู้ป่วยทั้งหมดที่รับเข้า {facility} คือ {daily*7} คน/สัปดาห์ * {period} สัปดาห์ = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} คน ซึ่งแต่ละคนใช้ {item} หนึ่งหน่วย\nหากมี {item} ที่ว่าง {total-int(total*frac)} หน่วยใน {facility} ก่อนการรับผู้ป่วยใหม่ จำนวนทั้งหมดลดลงเหลือ {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item} ที่ว่าง\n#### {total - (total * frac + daily * period * 7)}\n"
