question = "มาร์ธา กำลังถักเครื่องแต่งกายฤดูหนาวให้หลาน 3 คนของเธอ พวกเขาเป็น แฝดสาม ดังนั้นพวกเขาจึงมีขนาดเท่ากันหมด เธอต้องการทำ หมวก, ผ้าพันคอ, เสื้อกันหนาว, ถุงมือ, และ ถุงเท้า สำหรับแต่ละคนของพวกเขา ต้องใช้ 2 ม้วนไหมพรมเพื่อทำ หมวก, 4 สำหรับ ผ้าพันคอ, 12 สำหรับ เสื้อกันหนาว, 1 สำหรับคู่ของ ถุงมือ, และ 2 สำหรับคู่ของ ถุงเท้า เธอจะต้องซื้อไหมพรมกี่ม้วน?"
