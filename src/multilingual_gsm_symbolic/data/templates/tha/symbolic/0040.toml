question = "ซัลลี ไปพักผ่อนที่ชายหาด พ่อแม่ของเธอให้เงินเธอ $15 เพื่อซื้อสิ่งที่เธอต้องการ ที่ร้านของฝาก ทอฟฟี่มีโปรโมชั่น \"ซื้อ 1 ปอนด์ ในราคา $3 ต่อปอนด์ รับ 1 ปอนด์ ลด 1/2\" เธอตักทอฟฟี่มา 4 ปอนด์ เธอซื้อถุงหอยทะเลผสมราคา $1.5 และแม่เหล็ก 4 ชิ้น ราคาชิ้นละ $0.25 ซัลลี เหลือเงินเท่าไหร่?"
answer = "ซัลลี กำลังซื้อ 1 ปอนด์ ในราคา $3 และรับ 1 ปอนด์ ลด 1/2 ดังนั้น ลด 1/2 ของ 1 ปอนด์ คือ $3*1/2 = $1.5 ส่วนที่เหลือ 2 ปอนด์ ไม่มีส่วนลด และราคา 2*$3 = $6 ดังนั้นรวมเป็น $3+$3/2+$6=$21/2\nแม่เหล็ก 4 ชิ้น ราคาชิ้นละ $0.25 คือ 4*0.25=$<<4*0.25=1>>1\nเมื่อรวมการซื้อทั้งหมด $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nเธอมีเงิน $15 และใช้จ่ายไป $13 ดังนั้นเธอเหลือ $15-$13 = $<<15-13=2>>2\n#### 2\n"
