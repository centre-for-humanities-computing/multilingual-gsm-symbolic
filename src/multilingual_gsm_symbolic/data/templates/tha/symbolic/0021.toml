question = "ฟรังกี้ ดูทีวีหลังจากทำการบ้านเสร็จทุกคืน. ในวันวันจันทร์ และ วันอังคาร, เขาดูตอนละ 1 ชั่วโมงของรายการโปรดของเขาทุกคืน. ในวันวันพุธ, เขาดูรายการ 30 นาทีอยู่หลายตอน. ในวันวันพฤหัสบดี, เขาทำการบ้านเสร็จเร็วและดูตอนละ 1 ชั่วโมงหนึ่งตอนและรายการ 30 นาทีหนึ่งตอน. ในวันวันศุกร์, เขานอนดึกได้ ดังนั้นเขาดู สอง ตอนละ 1 ชั่วโมง. ถ้าเขาดูทีวีทั้งหมด 7 ชั่วโมง, เขาได้ดูรายการ 30 นาทีกี่ตอนในวันวันพุธ?"
answer = "ให้ E เป็นจำนวนตอนที่เขาดูในวันวันพุธ.\nหลังจากวันวันจันทร์ เขายังมีเวลาทีวีเหลือ 7 - 1 = <<7-1=6>>6 ชั่วโมง.\nหลังจากวันวันอังคาร เขายังมีเวลาทีวีเหลือ 6 - 1 = <<6-1=5>>5 ชั่วโมง.\nหลังจากวันวันพฤหัสบดี เขายังมีเวลาทีวีเหลือ 5 - 1 - 0.5 = 3.5 ชั่วโมง.\nหลังจากวันวันศุกร์ เขายังมีเวลาทีวีเหลือ 3.5 - 2 = 1.5 ชั่วโมง.\nแต่ละตอน 30 นาทีเท่ากับ 1/2 ชั่วโมง.\nดังนั้น E = 1.5/0.5 = 3 ตอน.\n#### 3"
