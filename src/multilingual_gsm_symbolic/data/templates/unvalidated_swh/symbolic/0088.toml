question = "Dana anaweza kukimbia nne mara kwa kasi zaidi kuliko inavyoweza kutembea, lakini anaweza kuruka kwa kasi ambayo ni nusu ya kasi inayoweza kukimbia. Ikiwa anaweza kuruka kwa 3 maili kwa saa, maili ngapi anaweza kusafiri katika sita saa ikiwa anatumia thetha moja ya wakati akikimbia na thetha mbili ya wakati akitembea?"
