answer = "คำถาม ปานกลาง และ ยาก ประกอบด้วย 100% - 40% = 60% ของการสอบ.\nมีคำถาม 60 ข้อ*40/100 = <<60*40/100=24>>24 ข้อที่เป็น ง่าย.\nมีคำถาม ปานกลาง และ ยาก ทั้งหมด 60 ข้อ*60/100 = <<60*60/100=36>>36 ข้อ.\nถ้า อารี ได้คะแนน 75% ของคำถาม ง่าย อย่างแน่นอน หมายความว่าเธอได้คะแนน 24 ข้อ*75/100 = <<24*75/100=18>>18 คะแนน.\nจากคำถาม ปานกลาง และ ยาก เธอได้คะแนน ครึ่ง อย่างถูกต้อง ดังนั้นคือ 36 ข้อ*1/2 = <<36*1/2=18>>18 คะแนน.\nดังนั้น เธอจะได้คะแนน 18 คะแนน + 18 คะแนน = <<18+18=36>>36 คะแนนในการสอบของเธอ.\n#### 36\n"
