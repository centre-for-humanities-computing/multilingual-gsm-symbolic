question = "มาลี เป็นคนรักการทำสวนตัวยง. เมื่อวานนี้, เธอได้รับต้นไม้ในกระถางใหม่ 18 ต้นจากเรือนเพาะชำต้นไม้สุดโปรดของเธอ เธอมีต้นไม้ในกระถางอยู่แล้ว 2 ต้นบนขอบหน้าต่างทั้ง 40 บานของบ้านชนบทขนาดใหญ่ของเธอ ด้วยความใจดี เธอตัดสินใจว่าจะมอบต้นไม้ในกระถาง 1 ต้นจากแต่ละขอบหน้าต่างให้เพื่อนและครอบครัวในวันพรุ่งนี้ ต้นไม้ในกระถาง มาลี จะเหลืออยู่กี่ต้น?"
answer = "เมื่อวานนี้, ก่อนที่จะได้รับต้นไม้, มาลี มีต้นไม้ในกระถาง 2*40 = <<2*40=80>>80 ต้น\nหลังจากได้รับต้นไม้เพิ่มอีก 18 ต้น ดังนั้นเธอจึงมีต้นไม้ในกระถางทั้งหมด 80 + 18 = <<80+18=98>>98 ต้น\nวันพรุ่งนี้, การมอบต้นไม้ของ มาลี จะเท่ากับ 40*1 = <<40*1=40>>40 ต้น\nดังนั้นเธอจะเหลือต้นไม้ในกระถาง 98 - 40 = <<98-40=58>>58 ต้น\n#### 58"
