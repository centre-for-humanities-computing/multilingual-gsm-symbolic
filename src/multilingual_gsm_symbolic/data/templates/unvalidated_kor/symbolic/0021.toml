question = "프랭키는 매일 숙제를 마친 후 TV 를 시청합니다. 월요일와 화요일에는, 그는每晚 그의 favorite show 의 1시간짜리 에피소드를 각각 시청했습니다. 수요일에는, 그는 30분짜리 프로그램의 몇 편의 에피소드를 시청했습니다. 목요일에는, 그는 숙제를 일찍 끝내고 1시간짜리 에피소드 하나와 30분짜리 프로그램을 시청했습니다. 금요일에는, 그는 늦게까지 깨어 있을 수 있어서 두 개의 1시간짜리 에피소드를 시청했습니다. 그가 총 7시간 동안 TV 를 시청했다면, 그는 수요일에 몇 개의 30분짜리 에피소드를 시청했습니까?"
answer = "수요일에 그가 시청한 에피소드의 수를 E 라고 합시다.\n월요일 이후, 그는 7 - 1 = <<7-1=6>>6 시간의 TV 시청 시간이 남았습니다.\n화요일 이후, 그는 6 - 1 = <<6-1=5>>5 시간의 TV 시청 시간이 남았습니다.\n목요일 이후, 그는 5 - 1 - 0.5 = 3.5 시간의 TV 시청 시간이 남았습니다.\n금요일 이후, 그는 3.5 - 5 = -1.5 시간의 TV 시청 시간이 남았습니다.\n각 30분짜리 에피소드는 1/2 시간입니다.\n따라서, E = -1.5/0.5 = -3 개입니다.\n#### -3\n"
