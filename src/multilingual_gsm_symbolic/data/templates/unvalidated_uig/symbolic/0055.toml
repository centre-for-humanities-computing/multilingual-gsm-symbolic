question = "ئېلىسە يېزىشنى ئۆگىنىۋاتىدۇ ۋە ئۇنى بىلىۋالغۇچە ئەلىبە نى قايتا-قايتا يېزىشقا قارار قىلدى. ئۇ ئۇنى تولۇق ئىككى قېتىم يازدى، ئاندىن ئۇنىڭ يېرىم قىسمىنى بىر قېتىم يازدى، ئاندىن ئاللىبۇرۇن يازغان ھەممە نەرسىنى قايتا يازدى. ئېلىسە جەمئىي قانچە ھەرپ يازدى؟"
