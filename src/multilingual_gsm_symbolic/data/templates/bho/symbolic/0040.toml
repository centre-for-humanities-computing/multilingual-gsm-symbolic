question = "सली छुट्टी खातिर समुद्र तट पर गइल। उक माता-पिता उक $15 देलखें जेकरा से ओ जे चाहे ओकरा खरीद सकत। सूवनियर दुकान पर, ताफी सेल पर थी \"1 पाउंड $3 प्रति पाउंड क दर से खरीदो, 1 पाउंड 1/2 छूट पावो।\" ओ 4 पाउंड उठा लेली। ओ $1.5 क शंख क मिश्रित थैला भी खरीदल। आरू 4 चुंबक जेकरा क दर $0.25 प्रति थाना। सली क कितना पैसा बचल?"
answer = "सली 1 पाउंड $3 क खरीद रहल बा आरू 1 पाउंड 1/2 छूट पावत बा। इसलें 1 पाउंड क 1/2 छूट $3*1/2 = $1.5 बा। बचल 2 पाउंड पर छूट नइखे आरू दाम बा 2*$3 = $6, इसलें कूल बा $3+$3/2+$6=$21/2\n4 चुंबक $0.25 प्रति थाना बा 4*0.25=$<<4*0.25=1>>1\nजेकरा सभ क जोड़ल जाय, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nउक $15 रहल आरू उने $13 खर्च कइल, इसलें उक $15-$13 = $<<15-13=2>>2 बचल\n#### 2\n"
