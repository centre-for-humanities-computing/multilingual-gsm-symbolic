question_annotated = "{name,सली} छुट्टी खातिर समुद्र तट पर गइल। उक माता-पिता उक ${total,15} देलखें जेकरा से ओ जे चाहे ओकरा खरीद सकत। सूवनियर दुकान पर, ताफी सेल पर थी \"{n1,1} पाउंड ${p1,3} प्रति पाउंड क दर से खरीदो, {n2,1} पाउंड {discount,1/2} छूट पावो।\" ओ {n12,4} पाउंड उठा लेली। ओ ${p2,1.5} क शंख क मिश्रित थैला भी खरीदल। आरू {n3,4} चुंबक जेकरा क दर ${p3,0.25} प्रति थाना। {name,सली} क कितना पैसा बचल?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} {n1} पाउंड ${p1} क खरीद रहल बा आरू {n2} पाउंड {discount} छूट पावत बा। इसलें {n2} पाउंड क {discount} छूट ${p1}*{discount} = ${float(n2*discount*p1)} बा। बचल {n12-n1-n2} पाउंड पर छूट नइखे आरू दाम बा {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}, इसलें कूल बा ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} चुंबक ${p3} प्रति थाना बा {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nजेकरा सभ क जोड़ल जाय, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nउक ${total} रहल आरू उने ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} खर्च कइल, इसलें उक ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} बचल\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
