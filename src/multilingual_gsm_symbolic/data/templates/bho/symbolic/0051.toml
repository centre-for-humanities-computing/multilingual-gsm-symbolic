answer = "आर्टी अपन गेंदा के ₹2.74 से ₹3 तक ऊपर राउंड करेब, जेकरा बाद 2 के आउ वाला अंक 5 या उससे अधिक बा।\nआर्टी अपन पेटुनिया के ₹1.87 से ₹2 तक up राउंड करेब, जेकरा बाद 1 के आउ वाला अंक 5 or higher बा।\nआर्टी अपन बेगोनिया के ₹2.12 से ₹2 तक down राउंड करेब, जेकरा बाद 2 के आउ वाला अंक less than 5 बा।\nआर्टी 12 गेंदा*₹3 बेचै = ₹<<12*3=36>>36\nआर्टी 9 पेटुनिया*₹2 बेचै = ₹<<9*2=18>>18\nआर्टी 17 बेगोनिया*₹2 बेचै = ₹<<17*2=34>>34\nसब मिला के, आर्टी कमैब ₹36 + ₹18 + ₹34 = ₹<<36+18+34=88>>88\n#### 88\n"
