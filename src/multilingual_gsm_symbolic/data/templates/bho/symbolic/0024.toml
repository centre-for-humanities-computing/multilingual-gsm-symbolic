question = "पोषण जानकारी के अनुसार, एक चिप्स के पैकेट में प्रति सेविंग 250 कैलोरी होत। यदि एक 300 ग्राम का पैकेट 5 सेविंग का होत, तो तुम कितने ग्राम खा सकेल यदि तुम्हारा दैनिक कैलोरी लक्ष्य 2000 होत और तुमने पहले से ही 1800 कैलोरी खा लेल हो?"
