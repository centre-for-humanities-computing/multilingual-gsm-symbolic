question = "कारोल और जेनिफर लॉस एंजेल्स की बहनें हैं जो प्रसिद्ध व्यक्तित्व से हस्ताक्षर इकट्ठा करना पसंद करती हैं। स्कूल से गर्मी की छुट्टी के दौरान, बहनें हर दोपहर हस्ताक्षर इकट्ठा करती हैं। पाँच सप्ताह बाद, कारोल और जेनिफर अपनी ऑटोग्राफ बुक की तुलना करते हैं, यह गिनती करते हुए कि हर बहन ने कितने हस्ताक्षर इकट्ठे किए हैं। कारोल की बुक में 20 हस्ताक्षर हैं, और जेनिफर के पास 44 हैं। बहनों के पास गर्मी की छुट्टी के तीन और सप्ताह हैं, और वे तय करती हैं कि वे छुट्टी के अंत तक आपस में 100 हस्ताक्षर हासिल करना चाहती हैं। अपने लक्ष्य तक पहुँचने के लिए बहनों को कितने हस्ताक्षर इकट्ठे करने की आवश्यकता है?"
