question = "फ्रैंकी हर रोज रात अपना होमवर्क खत्म कर के टीवी देखे ले। सोमवार आर मंगलवार पर, हुन हर रात अपना पसंदीदा शो के 1-घंटा एपिसोड देखल। बुधवार पर, हुन एका 30-मिनट के शो के कुछ एपिसोड देखल। गुरुवार पर, हुन होमवर्क जल्दी खत्म कइल आर एका 1-घंटा एपिसोड आर एका 30-मिनट शो देखल। शुक्रवार पर, हुन देर तक जाग सकेल, ताकि हुन दुइ 1-घंटा एपिसोड देखल। अगर हुन कुल मिला के 7 घंटा टीवी देखल, बुधवार पर हुन कते 30-मिनट के एपिसोड देखल?"
answer = "मान लीं E बुधवार पर हुन के देखल एपिसोड के संख्या ह। सोमवार के बाद, हुन के 7 - 1 = <<7-1=6>>6 घंटा टीवी बाकी रहल। मंगलवार के बाद, हुन के 6 - 1 = <<6-1=5>>5 घंटा टीवी बाकी रहल। गुरुवार के बाद, हुन के 5 - 1 - 0.5 = 3.5 घंटा टीवी बाकी रहल। शुक्रवार के बाद, हुन के 3.5 - 5 = -1.5 घंटा टीवी बाकी रहल। हर 30-मिनट के एपिसोड 1/2 घंटा के होले। इस ले, E = -1.5/0.5 = -3 एपिसोड।\n#### -3\n"
