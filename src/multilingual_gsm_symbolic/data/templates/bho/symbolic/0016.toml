answer_annotated = "उ {d2} पर {food} के {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} बाक्स बेचल।\n{name} के द्वारा बेचल गेल {food} के कुल बाक्स संख्या {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2} बा।\n{food} बेचबा खातिर {name} कमायल {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn}।\nउ {d1} पर {fruit} पाई के {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} बाक्स बेचल।\n{name} के द्वारा बेचल गेल {fruit} पाई के कुल बाक्स संख्या {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1} बा।\nउ {fruit} पाई बेचबा खातिर {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} कमायल।\nतो, {name} दुई दिन खातिर {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} कमायल।\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
