question = "सुनी जिंजरब्रेड आ सेब पाई के एकटा फंडराइजर खातिर बेचत बा। शनिवार पर, ओ 10 बाक्स जिंजरब्रेड आ रविवार के मुकाबला 4 कम बाक्स सेब पाई बेचल। रविवार पर, ओ शनिवार के मुकाबला 5 ज्यादा बाक्स जिंजरब्रेड आ 15 बाक्स सेब पाई बेचल। अगर जिंजरब्रेड के कीमत ₹6 बा आ सेब पाई के कीमत ₹15 बा, त सुनी दुई दिन खातिर कितना कमायल?"
answer = "उ रविवार पर जिंजरब्रेड के 10 + 5 = <<10+5=15>>15 बाक्स बेचल।\nसुनी के द्वारा बेचल गेल जिंजरब्रेड के कुल बाक्स संख्या 10 + 15 = <<10+15=25>>25 बा।\nजिंजरब्रेड बेचबा खातिर सुनी कमायल 25*₹6 = ₹<<25*6=150>>150।\nउ शनिवार पर सेब पाई के 15 - 4 = <<15-4=11>>11 बाक्स बेचल।\nसुनी के द्वारा बेचल गेल सेब पाई के कुल बाक्स संख्या 15 + 11 = <<15+11=26>>26 बा।\nउ सेब पाई बेचबा खातिर 26*₹15 = ₹<<26*15=390>>390 कमायल।\nतो, सुनी दुई दिन खातिर ₹150 + ₹390 = ₹<<150+390=540>>540 कमायल।\n#### 540\n"
