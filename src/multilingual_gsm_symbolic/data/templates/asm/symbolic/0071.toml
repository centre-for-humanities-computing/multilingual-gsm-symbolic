question = "নেট তাঁর পশুপালকে ঘাস খাওয়াচ্ছে। প্রতিটি ছাগলী এর 5 কেজি প্রয়োজন, এবং প্রতিটি লামা এর প্রয়োজন 3 কেজি প্রতিটি ছাগলী এর প্রয়োজনের চেয়ে দুই গুণের চেয়ে কম। যদি 15টি ছাগলী এবং 12টি লামা থাকে, তবে নেট এর কত কেজি ঘাস প্রয়োজন?"
answer = "প্রথমে বের করুন প্রতিটি লামা এর কত ঘাস প্রয়োজন: 5 কেজি * 2 - 3 = <<5*2-3=7>>7 কেজি/লামা\nএখন বের করুন মোট কত ঘাস লামা এর প্রয়োজন: 7 কেজি/লামা * 12 লামা = <<7*12=84>>84 কেজি\nএখন বের করুন মোট কত ঘাস ছাগলী এর প্রয়োজন: 5 কেজি/ছাগলী * 15 ছাগলী = <<5*15=75>>75 কেজি\nএখন মোট বের করতে দুটি ঘাস এর পরিমাণ যোগ করুন: 84 কেজি + 75 কেজি = <<84+75=159>>159 কেজি\n#### 159\n"
