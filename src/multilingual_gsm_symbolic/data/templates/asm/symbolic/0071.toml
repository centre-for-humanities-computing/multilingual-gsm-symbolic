question_annotated = "{name,নেট} তাঁর পশুপালকে {food,ঘাস} খাওয়াচ্ছে। প্রতিটি {animal1,ছাগলী} এর {n1,5} {unit,কেজি} প্রয়োজন, এবং প্রতিটি {animal2,লামা} এর প্রয়োজন {n2,3} {unit,কেজি} প্রতিটি {animal1,ছাগলী} এর প্রয়োজনের চেয়ে দুই গুণের চেয়ে কম। যদি {k1,15}টি {animal1,ছাগলী} এবং {k2,12}টি {animal2,লামা} থাকে, তবে {name,নেট} এর কত {unit,কেজি} {food,ঘাস} প্রয়োজন?\n\n#init:\n- name = sample(names_male)\n- food = sample([\"ঘাস\", \"শস্য\", \"খাদ্য\", \"সাইলেজ\"])\n- animal1, animal2 = sample([\"ছাগলী\", \"গরু\", \"ঘোড়া\", \"গাধা\", \"লামা\", \"আলপাকা\", \"শূকর\", \"মুরগি\", \"হাঁস\"], 2)\n- unit = sample([\"কেজি\", \"কেজি\"])\n- $n1 = range(3, 15)\n- $n2 = range(1, 10)\n- $k1 = range(10, 50)\n- $k2 = range(10, 50)\n\n#conditions:\n- 2*n1 - n2 > 0\n\n#answer: k1*n1 + k2*(2*n1 - n2)\n"
answer_annotated = "প্রথমে বের করুন প্রতিটি {animal2} এর কত {food} প্রয়োজন: {n1} {unit} * 2 - {n2} = <<{n1}*2-{n2}={2*n1-n2}>>{2*n1-n2} {unit}/{animal2}\nএখন বের করুন মোট কত {food} {animal2} এর প্রয়োজন: {2*n1-n2} {unit}/{animal2} * {k2} {animal2} = <<{2*n1-n2}*{k2}={k2*(2*n1-n2)}>>{k2*(2*n1-n2)} {unit}\nএখন বের করুন মোট কত {food} {animal1} এর প্রয়োজন: {n1} {unit}/{animal1} * {k1} {animal1} = <<{n1}*{k1}={k1*n1}>>{k1*n1} {unit}\nএখন মোট বের করতে দুটি {food} এর পরিমাণ যোগ করুন: {k2*(2*n1-n2)} {unit} + {k1*n1} {unit} = <<{k2*(2*n1-n2)}+{k1*n1}={k1*n1 + k2*(2*n1 - n2)}>>{k1*n1 + k2*(2*n1 - n2)} {unit}\n#### {k1*n1 + k2*(2*n1 - n2)}\n"
