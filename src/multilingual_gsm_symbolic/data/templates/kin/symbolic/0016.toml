question = "Sunny ari kugurisha kuki ya zinziberi na ipoma igikoma kuzamurira amafaranga. Ku kuwa gatandatu, yagurishije 10 udusabo d'kuki ya zinziberi n'udusabo 4 budi d'ipoma igikoma, kurusha ku kuwa karindwi. Ku kuwa karindwi, yagurishije udusabo 5 birenzeho d'kuki ya zinziberi kurusha ku kuwa gatandatu n'udusabo 15 d'ipoma igikoma. Niba kuki ya zinziberi igiciro cyayo ari $6 naho ipoma igikoma igiciro cyayo ari $15, amafaranga angana angahe Sunny yinjije mu minsi ibiri?"
answer = "Yagurishije 10 + 5 = <<10+5=15>>15 udusabo d'kuki ya zinziberi ku kuwa karindwi.\nUmubare wose w'udusabo d'kuki ya zinziberi Sunny yagurishije ni 10 + 15 = <<10+15=25>>25.\nSunny yinjije 25*$6 = $<<25*6=150>>150 yo kugurisha kuki ya zinziberi.\nYagurishije 15 - 4 = <<15-4=11>>11 udusabo d'ipoma igikoma ku kuwa gatandatu.\nUmubare wose w'udusabo d'ipoma igikoma Sunny yagurishije ni 15 + 11 = <<15+11=26>>26.\nYinjije 26*$15 = $<<26*15=390>>390 yo kugurisha ipoma igikoma.\nBityo, Sunny yinjije $150 + $390 = $<<150+390=540>>540 mu minsi ibiri.\n#### 540\n"
