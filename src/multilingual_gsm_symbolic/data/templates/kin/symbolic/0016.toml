answer_annotated = "Yagurishije {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} udusabo d'{food} ku {d2}.\nUmubare wose w'udusabo d'{food} {name} yagurishije ni {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} yinjije {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} yo kugurisha {food}.\nYagurishije {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} udusabo d'{fruit} igikoma ku {d1}.\nUmubare wose w'udusabo d'{fruit} igikoma {name} yagurishije ni {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nYinjije {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} yo kugurisha {fruit} igikoma.\nBityo, {name} yinjije {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} mu minsi ibiri.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
