question = "Kubera amakuru y'ibiribwa, isakaro rya ibitoki rifite 250 calori ku gice. Niba isakaro rya 300 gramu rifite 5 by'ibice, ni angahe gramus ushobora kurya niba intego yawe y'ingufu z'umunsi ari 2000 kandi wamaze gukoresha 1800 calori?"
answer = "Niba intego yose y'ingufu ari 2000 kandi nakoresha 1800 calori, mfite 2000-1800 = <<2000-1800=200>>200 calori zisigaye kurya\nNiba buri gice cya ibitoki gifite 250 calori kandi mfite gusa 200 calori zisigaye kurya, nshobora kurya gusa 200/250 by'igice = 4/5 by'igice\nNanone tuzi ko isakaro rya 300 gramu rya ibitoki rifite 5 by'ibice, bityo buri gice gifite 300 gramu/5 = <<300/5=60>>60 gramus\nNiba nshobora kurya gusa 4/5 by'igice, nshobora kurya gusa 60 gramu * 4/5 = 48 gramus\n#### 48\n"
