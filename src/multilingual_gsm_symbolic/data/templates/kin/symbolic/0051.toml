question = "Artie afite igishishwa cy'indabo iri kuri Isoko ry'Abahinzi. Acuruza ubwoko butatu bwa indabo: amarigold, petunia na begonia. Akunze kugurisha amarigold ku $2.74 kuri buri igipotsi, petunia ku $1.87 kuri buri igipotsi na begonia ku $2.12 kuri buri igipotsi. Artie nta mafaranga y'isanzwe afite uyu munsi, bityo yafashe umwanzuro wo kuzamura cyangwa kumanura ibiciro bye byose kugeza ku mubare wuzuye. Niba Artie ahera 12 igipotsi bya amarigold, 9 igipotsi bya petunia na 17 igipotsi bya begonia, azabona angahe?"
