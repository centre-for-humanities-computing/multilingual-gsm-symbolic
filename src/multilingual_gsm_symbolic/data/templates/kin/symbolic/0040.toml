question = "Sally yagiye ku nyanja kw'urukino. Ababyeyi bayo bamuhaye $15 kugira ngo agure ibyo yari ashaka. Muri butike y'ibimenyetso, tafi yari ifite igiciro cyo kugabanyirizwa yavuze ngo \"Kugura 1 pawundi ku $3 kuri buri pawundi, fata 1 pawundi 1/2 igabanuka.\" Yaguye 4 pawundi. Yaguranye n'isakazo y'inkoko z'inyanja za $1.5 na 4 imanyeta buri imwe yari $0.25. Sally asigaje amafaranga angana iki?"
answer = "Sally aragura 1 pawundi ku $3 kandi afata 1 pawundi 1/2 igabanuka. Bityo 1/2 igabanuka kuri 1 pawundi ni $3*1/2 = $1.5. Ibindi 2 pawundi ntibigabanyirizwa kandi bifite agaciro ka 2*$3 = $6, bityo igiteranyo ni $3+$3/2+$6=$21/2\n4 imanyeta ku $0.25 buri imwe ni 4*0.25=$<<4*0.25=1>>1\nIyo wiyongereye ibyo yaguze byose, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nYari afite $15 kandi yakoresheje $13 bityo yari afite $15-$13 = $<<15-13=2>>2 asigaye\n#### 2\n"
