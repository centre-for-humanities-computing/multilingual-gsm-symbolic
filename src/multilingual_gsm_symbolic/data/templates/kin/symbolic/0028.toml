question = "Ibohera rifite ubushobozi bwo kwakira 1000 igitanda aho 1/5 byabyo byari byafunze. Kubera icyorezo cya coronavirus, 50 barwayi binjiye muri ibohera buri munsi. Barura umubare wose w'ibitanda igitanda bidafite abarwayi muri ibohera nyuma y'amacyumweru 2."
answer = "Niba 1/5 y'ubushobozi bwose bwa ibohera igitanda ari byafunze, bivuze ko 1/5 * 1000 = <<1000*1/5=200>>200 igitanda bafite abarwayi.\nUmubare wose w'ibitanda igitanda muri ibohera utafunze n'abarwayi bashya ni 1000 igitanda - 200 igitanda = <<1000-200=800>>800 igitanda.\nNiba 50 abantu binjiye buri munsi, umubare wose w'abarwayi muri ibohera nyuma y'icyumweru kimwe ni 50 barwayi/umunsi * 7 iminsi/icyumweru = 350 barwayi.\nNyuma y'amacyumweru 2, umubare wose w'abarwayi binjiye muri ibohera ni 350 barwayi/icyumweru * 2 amacyumweru = <<350*2=700>>700 barwayi, buri wese akoresha igitanda imwe.\nNiba habaho 800 igitanda bidafite abarwayi muri ibohera mbere y'abarwayi bashya, umubare wose ugabanuka ukagera kuri 800 igitanda - 700 igitanda = <<800-700=100>>100 igitanda bidafite abarwayi.\n#### 100\n"
