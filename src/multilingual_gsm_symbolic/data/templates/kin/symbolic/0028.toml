answer_annotated = "Niba {frac} y'ubushobozi bwose bwa {facility} {item} ari byafunze, bivuze ko {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} bafite abarwayi.\nUmubare wose w'ibitanda {item} muri {facility} utafunze n'abarwayi bashya ni {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}.\nNiba {daily} abantu binjiye buri munsi, umubare wose w'abarwayi muri {facility} nyuma y'icyumweru kimwe ni {daily} barwayi/umunsi * 7 iminsi/icyumweru = {daily*7} barwayi.\nNyuma y'amacyumweru {period}, umubare wose w'abarwayi binjiye muri {facility} ni {daily*7} barwayi/icyumweru * {period} amacyumweru = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} barwayi, buri wese akoresha {item} imwe.\nNiba habaho {total-int(total*frac)} {item} bidafite abarwayi muri {facility} mbere y'abarwayi bashya, umubare wose ugabanuka ukagera kuri {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item} bidafite abarwayi.\n#### {total - (total * frac + daily * period * 7)}\n"
