question = "ማርታ ለራሷ 3 የልጆች ልጆች የክረምት ልብስ እየተሰራች ነው። እነሱ ሶስት እህትምታት ናቸው፣ ስለዚህ ሁሉም ተመሳሳይ መጠን አላቸው። እያንዳንዳቸው ለማድረግ ጭንቅላት ሽፋን፣ ላፍ፣ ሱዌተር፣ እጅ ሽፋን፣ እና ስኮክስ ፈልጋለች። 2 የጥጥ ጥምታ ለ ጭንቅላት ሽፋን መስራት ይፈጅበታል፣ ለ ላፍ 4፣ ለ ሱዌተር 12፣ ለ ጥንድ እጅ ሽፋን 1፣ እና ለ ጥንድ ስኮክስ 2። ምን ያህል የጥጥ ጥምታ ማዘዝ ያስፈልጋታል?"
answer = "ለእያንዳንዱ ልጅ ሙሉ ልብስ 2 የጥጥ ጥምታ ለ ጭንቅላት ሽፋን + 4 የጥጥ ጥምታ ለ ላፍ + 12 የጥጥ ጥምታ ለ ሱዌተር + 1 የጥጥ ጥምታ ለ ጥንድ እጅ ሽፋን + 2 የጥጥ ጥምታ ለ ጥንድ ስኮክስ = <<2+4+12+1+2=21>>21 የጥጥ ጥምታ ይፈልጋል።\nስለዚህ ለሁሉም የልጆች ልጆቿ ልብስ ለመስራት፣ 3*21 = <<3*21=63>>63 የጥጥ ጥምታ ያስፈልጋታል።\n#### 63\n"
