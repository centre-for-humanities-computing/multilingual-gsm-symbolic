question = "ኔት የእንስሳቱን ቁርጭ ይመግባል። እያንዳንዱ በግ 5 ኪሎግራም ያስፈልገዋል፣ እና እያንዳንዱ ላማ ከእያንዳንዱ በግ የሚያስፈልገው መጠን ሁለት እጥፍ ከ3 ኪሎግራም ያነሰ ያስፈልገዋል። ካለ 15 በግs እና 12 ላማs፣ ስንት ኪሎግራም ቁርጭ ኔት ያስፈልገዋል?"
answer = "በመጀመሪያ እያንዳንዱ ላማ ስንት ቁርጭ እንደሚያስፈልገው ይወሰን፡ 5 ኪሎግራም * 2 - 3 = <<5*2-3=7>>7 ኪሎግራም/ላማ\nአሁን ለላማs አጠቃላይ ስንት ቁርጭ እንደሚያስፈልጋቸው ይወሰን፡ 7 ኪሎግራም/ላማ * 12 ላማs = <<7*12=84>>84 ኪሎግራም\nአሁን ለበግs አጠቃላይ ስንት ቁርጭ እንደሚያስፈልጋቸው ይወሰን፡ 5 ኪሎግራም/በግ * 15 በግs = <<5*15=75>>75 ኪሎግራም\nአሁን ሁለቱን የቁርጭ መጠኖች ደምሮ አጠቃላይ መጠኑን ለማግኘት፡ 84 ኪሎግራም + 75 ኪሎግራም = <<84+75=159>>159 ኪሎግራም\n#### 159\n"
