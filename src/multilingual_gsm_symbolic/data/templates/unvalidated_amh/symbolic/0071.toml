answer_annotated = "በመጀመሪያ እያንዳንዱ {animal2} ስንት {food} እንደሚያስፈልገው ይወሰን፡ {n1} {unit} * 2 - {n2} = <<{n1}*2-{n2}={2*n1-n2}>>{2*n1-n2} {unit}/{animal2}\nአሁን ለ{animal2}s አጠቃላይ ስንት {food} እንደሚያስፈልጋቸው ይወሰን፡ {2*n1-n2} {unit}/{animal2} * {k2} {animal2}s = <<{2*n1-n2}*{k2}={k2*(2*n1-n2)}>>{k2*(2*n1-n2)} {unit}\nአሁን ለ{animal1}s አጠቃላይ ስንት {food} እንደሚያስፈልጋቸው ይወሰን፡ {n1} {unit}/{animal1} * {k1} {animal1}s = <<{n1}*{k1}={k1*n1}>>{k1*n1} {unit}\nአሁን ሁለቱን የ{food} መጠኖች ደምሮ አጠቃላይ መጠኑን ለማግኘት፡ {k2*(2*n1-n2)} {unit} + {k1*n1} {unit} = <<{k2*(2*n1-n2)}+{k1*n1}={k1*n1 + k2*(2*n1 - n2)}>>{k1*n1 + k2*(2*n1 - n2)} {unit}\n#### {k1*n1 + k2*(2*n1 - n2)}\n"
