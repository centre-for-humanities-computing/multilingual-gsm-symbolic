question = "አያት በየቀኑ 3 ኪሎሜትር በምትወደው የእግር ጉዞ መንገድ ትጓዛለች፣ ይህም 2 ኪሎሜትር በዳርቻ ላይ የእግር ጉዞን እና 1 ኪሎሜትር በጎዳና ላይ የእግር ጉዞን ያካትታል። በጎዳና ላይ፣ አያት በዳርቻ ላይ ካላት ፍጥነት ሁለት እጥፍ ፍጥነት ትጓዛለች። የእግር ጉዟ 40 ደቂቃ በዳርቻ ላይ ከሆነ፣ ሙሉውን 3-ኪሎሜትር ጉዞ ለማጠናቀቅ ስንት ደቂቃ ይወስድባታል?"
