question = "ማሪያ ትገዛላለች 8 የአክሲዮን ክፍሎችን ለ ብር8 እያንዳንዱ። የአክሲዮኑ ዋጋ ይጨምራል 50% ማሪያ ያቆየችው በመጀመሪያው ዓመት፣ ከዚያም ይቀንሳል 25% በሁለተኛው ዓመት። የማሪያ ሁሉም አክሲዮኖች የመጨረሻ ዋጋ ምን ያህል ነው?"
