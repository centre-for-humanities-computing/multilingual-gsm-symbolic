question = "ጃኪ የብድራት ስራን ራሷ ማድረግ ወይም አንድን አካውንታንትን መቅጠር መምረጥ እየሞከረች ነው። ራሷ ካደረገች፣ 3 የፍሪላንስ ስራ ሰዓታትን ያነሰ ማድረግ ትችላለች፣ በተቀራጠ ገቢ ብር35/ሰዓት። አካውንታንትን ብር90 ይጭናል። አካውንታንትን ብታቅጥር ምን ያህል ተጨማሪ ገንዘብ ይኖራታል?"
