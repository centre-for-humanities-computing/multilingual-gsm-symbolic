question = "በምግብ ስብባቱ መረጃ መሰረት፣ የቺፕስ ቦርሳ በአንድ ክፍል 250 ካሎሪ አለው። አንድ 300 ግራም ቦርሳ 5 ክፍሎች ካሉት፣ ዕለታዊ የካሎሪ ዓላማህ 2000 ከሆነ እና 1800 ካሎሪዎችን ከተጠጣህ፣ ስንት ግራምs መብላት ትችላለህ?"
