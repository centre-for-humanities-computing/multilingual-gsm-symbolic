answer_annotated = "የጠቅላላ የካሎሪ ዓላማ {total} ከሆነ እና {spent} ካሎሪዎችን ከተጠጣሁ፣ ከተቀሩኝ {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} ካሎሪዎችን መብላት አለብኝ\nየእያንዳንዱ የ{food} ክፍል {cal} ካሎሪ ካለው እና {total-spent} ካሎሪዎችን ብቻ መብላት ካለብኝ፣ ከዚያም {total-spent}/{cal} ክፍል ብቻ መብላት እችላለሁ = {Fraction((total-spent)/cal)} ክፍል\nእንዲሁም {size} {unit} የ{food} ቦርሳ {n} ክፍሎች እንዳሉት እናውቃለን፣ ስለዚህ እያንዳንዱ ክፍል {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit}s\nከተቀሩኝ {Fraction((total-spent)/cal)} ክፍል ብቻ መብላት ከቻልኩ፣ ከዚያም {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit}s\n#### {size//n * (total-spent)/cal}\n"
