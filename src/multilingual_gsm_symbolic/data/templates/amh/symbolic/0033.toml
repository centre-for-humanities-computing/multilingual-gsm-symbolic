question = "ካሮል እና ጄኒፈር ከሎስ አንጀለስ የሆኑ እህቶች ሲሆኑ ከታዋቂ ሰዎች ፊርማ ለመሰብሰብ ይወዳሉ። በትምህርት ቤት ከበጋ ዕረፍት ጊዜያቸው ላይ፣ እህቶቹ እያንዳንዱን ከሰዓት በኋላ ፊርማ በመሰብሰብ ያሳልፋሉ። ከአምስት ሳምንታት በኋላ፣ ካሮል እና ጄኒፈር የፊርማ መጻፊያ መጽሐፎቻቸውን በማወዳደር እያንዳንዷ እህት ስንት ፊርማ እንደሰበሰበች ይቆጥራሉ። ካሮል በመጽሐፏ ላይ 20 ፊርማዎች አሏት፣ እና ጄኒፈር ደግሞ 44 አላት። እህቶቹ ሶስት ተጨማሪ ሳምንታት የበጋ ዕረፍት አሏቸው፣ እና በዕረፍቱ መጨረሻ ግባቸው 100 ፊርማዎች እንዲሆን ወስነዋል። ግባቸውን ለማሳካት እህቶቹ ስንት ፊርማዎችን ማሰባሰብ አለባቸው?"
answer = "ካሮል እና ጄኒፈር አሁን ድረስ 20 + 44 ፊርማዎችን ሰብስበዋል = <<20+44=64>>64 ፊርማዎች።\nግባቸው 100 ስለሆነ፣ 100 - 64 ፊርማዎችን ማሰባሰብ አለባቸው። 100 - 64 = <<100-64=36>>36 ፊርማዎች\n#### 36\n"
