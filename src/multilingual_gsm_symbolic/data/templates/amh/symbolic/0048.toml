question = "ኤሚሊ በደቂቃ 6 ሽራም መቅብል እና 30 ሽራምን በ10 ደቂቃዎች ውስጥ ማቅለጥ ይችላል። 90 ሽራምን ለመቅብል እና ለማቅለጥ ምን ያህል ጊዜ ይፈጅባታል? ኤሚሊ መቅብል እና ማቅለጥ በአንድ ጊዜ ማድረግ አይችልም።"
answer = "በመጀመሪያ ኤሚሊ ሽራምን ለመቅብል ምን ያህል ጊዜ እንደሚፈጅባት ያግኙ፡ 90 ሽራም / 6 ሽራም/ደቂቃ = <<90/6=15>>15 ደቂቃዎች\nከዚያም ሽራምን ለማብሰል ስንት ክፍሎች እንደሚያስፈልጉ ያግኙ፡ 90 ሽራም / 30 ሽራም/ክፍል = <<90/30=3>>3 ክፍሎች\nከዚያም የክፍሎች ብዛትን በአንድ ክፍል ጊዜ ማባዛት ለጠቅላላ የምግብ አብሰል ጊዜ ያግኙ፡ 3 ክፍሎች * 10 ደቂቃ/ክፍል = <<3*10=30>>30 ደቂቃዎች\nከዚያም የመቅብል ጊዜን ማከል ለኤሚሊ የሚፈጅባት አጠቃላይ ጊዜ ያግኙ፡ 30 ደቂቃዎች + 15 ደቂቃዎች = <<30+15=45>>45 ደቂቃዎች\n#### 45\n"
