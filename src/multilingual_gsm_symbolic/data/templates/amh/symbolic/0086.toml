question = "አሊሰን ለ ሮኒንግ ቡድን ቦታ ተመረጠች፣ ስለዚህ ለአትሌቲክ መሳሪያ ለመግዛት ወደ ሱቅ ገባች። ተንክ ጠፍጣፋን ለ $10 ገዛች፣ የ ሮኒንግ ቆጥቆጫ ጥንድ ከ ተንክ ጠፍጣፋ ዋጋ በ $5 የበለጠ፣ እና የ ቴኒስ ጫማ ጥንድ መጀመሪያ $48 የነበረ ሲሆን በ ግማሽ ዋጋ ተሸጠ። ለ $8 አትሌቲክ ጫማ ልብስ ጥቅል ላይ $2 የሚቀንስ ኩፖን ነበራት፣ ስትገዛውም። ለአትሌቲክ መሳሪያ ምን ያህል ወጪ አድርጋለች?"
