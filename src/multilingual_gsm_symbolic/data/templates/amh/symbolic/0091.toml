question = "በ አለን ቤት ካኖሊዎች ካሉት ደግሞ እጥፍ እጥፍ ስንዴዎች አሉ። በቤቱ ውስጥ በድምሩ 40 ካኖሊዎች አሉት። አለን በመደብሩ ላይ ተጨማሪ 60 ካኖሊዎች ገዛ እና ከ ካኖሊዎች ብዛት ያነሱ 40 ስንዴዎች ደግሞ ገዛ። በቤቱ ውስጥ ያሉትን ስንዴዎች እና ካኖሊዎች አጠቃላይ ብዛት ያግኙ?"
answer = "ስንዴ እና ካኖሊ ከመግዛቱ በፊት አለን ካኖሊ ካሉት ደግሞ እጥፍ እጥፍ ስንዴዎች ነበሩት፣ ይህም ማለት 40 ካኖሊዎች * 5 ስንዴ/ካኖሊ = <<40*5=200>>200 ስንዴዎች ነው።\nአለን በፊት የነበረው ስንዴ እና ካኖሊ አጠቃላይ ብዛት 200 ስንዴዎች + 40 ካኖሊዎች = <<200+40=240>>240 እቃዎች ነው።\nካኖሊ ከሚገዙት ያነሱ 40 ስንዴዎች ሲገዛ፣ እሱ 60 ስንዴዎች - 40 ስንዴዎች = <<60-40=20>>20 ስንዴዎች ገዛ።\nበአጠቃላይ እሱ 20 ስንዴዎች + 60 ካኖሊዎች = <<20+60=80>>80 እቃዎች ገዛ።\nከግዥው በኋላ አለን ያለው 240 እቃ + 80 እቃ = <<240+80=320>>320 አጠቃላይ ስንዴዎች እና ካኖሊዎች በድምር ነው።\n#### 320\n"
