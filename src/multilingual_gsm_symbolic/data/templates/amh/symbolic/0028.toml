answer = "ከሆስፒታል መኝታዎች አጠቃላይ አቅም 1/5 የተያዘ ከሆነ፣ ይህ ማለት 1/5 * 1000 = <<1000*1/5=200>>200 መኝታዎች በህመምተኞች እየተጠቀሙበት ነው ማለት ነው።\nበሆስፒታል ውስጥ ያሉ አዳዲስ ተቀባይነት ያልተጨመረ መኝታዎች አጠቃላይ ብዛት 1000 መኝታዎች - 200 መኝታዎች = <<1000-200=800>>800 መኝታዎች ነው።\nበየቀኑ 50 ሰዎች ከተቀበልን፣ ከአንድ ሳምንት በኋላ በሆስፒታል ውስጥ ያሉ ህመምተኞች አጠቃላይ ብዛት 50 ህመምተኞች/ቀን * 7 ቀናት/ሳምንት = 350 ህመምተኞች ነው።\nከ2 ሳምንታት በኋላ፣ ወደ ሆስፒታል የተቀበሉ ህመምተኞች አጠቃላይ ብዛት 350 ህመምተኞች/ሳምንት * 2 ሳምንታት = <<350*2=700>>700 ህመምተኞች ናቸው፣ እያንዳንዳቸው አንድ መኝታ ይጠቀማሉ።\nከአዳዲስ ተቀባይነት በፊት በሆስፒታል ውስጥ 800 ያልተያዙ መኝታዎች ከነበሩ፣ አጠቃላይ ብዛቱ ወደ 800 መኝታዎች - 700 መኝታዎች = <<800-700=100>>100 ያልተያዙ መኝታዎች ይቀንሳል።\n#### 100\n"
