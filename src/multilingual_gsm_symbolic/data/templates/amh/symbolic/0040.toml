question = "ሳሊ ለበጋ ወቅት ወደ ባህር ጠረፍ ሄደች። ወላጆቿ ምን ማለት እንደምትፈልግ ለመግዛት $15 ሰጧት። በሱቅ ሰሎሽ ሳፎሬ፣ ታፊ በሽያጭ ላይ ነበር \"1 ፓውንድ ለ $3፣ 1 ፓውንድ በ 1/2 ዋጋ\"። 4 ፓውንድ አጭፈችው። እንዲሁም ለ $1.5 የተቀላቀለ የባህር ሸክላ እና ለ እያንዳንዱ $0.25 የሆኑ 4 ማግኔቶችን አዘዘች። ሳሊ ስንት ገንዘብ ተቀራላ?"
