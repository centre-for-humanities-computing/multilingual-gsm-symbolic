question = "ሮገር ወደ ሱቅ ይሄዳል ለመግዛት ቡና። የሚገዛው መደበኛ ቡና ዋጋ ብር5 ለ ኪሎግራም ነው። አጣው ስለሆነ ውድ የሆነ ምርት መግዛት ነበረበት፤ ዋጋው 20% ይበልጣል። የሳምንቱን መጠን መግዛት ወሰነ፤ በየቀኑ 1 ኪሎግራም ቡና ይጠቀማል። ለራሱም ዶናት ለ ብር2 መግዛት ወሰነ። ሁሉም ነገር ምን ያህል ዋጋ ነው?"
