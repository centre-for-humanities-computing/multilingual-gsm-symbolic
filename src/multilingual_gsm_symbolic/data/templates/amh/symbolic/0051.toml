question = "አርቲ በየግብርና ገበያ ላይ አበባ ገበያ አለው። ሶስት ዓይነት አበባዎችን ይሸጣል፡ ማሪጎልድስ፣ ፔቲኒያስ እና ቤጎኒያስ። ብዙውን ጊዜ ማሪጎልድስን በብር2.74 በፖት፣ ፔቲኒያስን በብር1.87 በፖት እና ቤጎኒያስን በብር2.12 በፖት ይሸጣል። አርቲ ዛሬ ትርፍ የለውም፣ ስለዚህ ሁሉንም ዋጋዎቹን ወደ ቅርቡ ብር ማዞር ወሰነ። አርቲ 12 ፖትዎች ማሪጎልድስ፣ 9 ፖትዎች ፔቲኒያስ እና 17 ፖትዎች ቤጎኒያስ ካሸጠ፣ ምን ያህል ያገኛል?"
answer = "አርቲ የማሪጎልድስ ዋጋውን ከብር2.74 ወደ ብር3 ወደ ላይ ያዞራል፣ ምክንያቱም ከ2 በኋላ የሚመጣው ቁጥር 5 ወይም ከዚያ በላይ ስለሆነ።\nአርቲ የፔቲኒያስ up ከብር1.87 ወደ ብር2 ያዞራል፣ ምክንያቱም ከ1 በኋላ የሚመጣው ቁጥር 5 or higher ስለሆነ።\nአርቲ የቤጎኒያስ down ከብር2.12 ወደ ብር2 ያዞራል፣ ምክንያቱም ከ2 በኋላ የሚመጣው ቁጥር less than 5 ስለሆነ።\nአርቲ 12 ማሪጎልድስ*ብር3 = ብር<<12*3=36>>36 ይሸጣል\nአርቲ 9 ፔቲኒያስ*ብር2 = ብር<<9*2=18>>18 ይሸጣል\nአርቲ 17 ቤጎኒያስ*ብር2 = ብር<<17*2=34>>34 ይሸጣል\nበአጠቃላይ፣ አርቲ ብር36 + ብር18 + ብር34 = ብር<<36+18+34=88>>88 ያገኛል\n#### 88\n"
