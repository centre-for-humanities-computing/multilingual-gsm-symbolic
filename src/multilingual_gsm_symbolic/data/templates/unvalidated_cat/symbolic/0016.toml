question = "Sunny ven pa de gingebre i pastís de poma per a una recaptació de fons. El dissabte, va vendre 10 caixes de pa de gingebre i 4 caixes menys de pastís de poma que el diumenge. El diumenge, va vendre 5 caixes més de pa de gingebre que el dissabte i 15 caixes de pastís de poma. Si el pa de gingebre costa 6 $ i el pastís de poma costa 15 $, quant va guanyar Sunny en dos dies?"
