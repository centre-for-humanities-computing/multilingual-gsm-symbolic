question = "சல்லி விடுமுறைக்காக கடற்கரைக்குச் சென்றாள். அவரின் பெற்றோர் அவருக்கு $15 விரும்பியதை வாங்க அளித்தனர். நினைவுப் பொருட்கள் கடையில், டாஃபி விற்பனையில் இருந்தது \"1 பவுண்டுக்கு $3 விலையில் வாங்குங்கள், 1 பவுண்டு 1/2 சலுகை பெறுங்கள்\" என்று. அவள் 4 பவுண்டுகளை எடுத்தாள். மேலும் அவள் $1.5 க்கு சங்கு கலவை பை மற்றும் ஒவ்வொன்றிற்கும் $0.25 விலை கொண்ட 4 காந்தங்களை வாங்கினாள். சல்லி எவ்வளவு பணம் மீதமுள்ளாள்?"
