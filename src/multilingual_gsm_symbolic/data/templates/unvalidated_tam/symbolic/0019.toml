question = "60-வினாக்கள் கொண்ட வினாத்தாளில், 40% வினாக்கள் எளிதான உள்ளன, மற்றும் மற்றவை சமமாக சராசரி மற்றும் கடினமான வினாக்களாகப் பிரிக்கப்பட்டுள்ளன. Aries எளிதான வினாக்களில் 75% ஐ உறுதியாகப் பெற்றால், சராசரி மற்றும் கடினமான வினாக்களில் அரை சரியாகப் பெற்றால், அவர் எத்தனை புள்ளிகளை உறுதியாகப் பெறுவார்?"
answer = "சராசரி மற்றும் கடினமான வினாக்கள் வினாத்தாளின் 100% - 40% = 60% ஐக் கொண்டுள்ளன.\n60 வினாக்களில் 40/100 = <<60*40/100=24>>24 எளிதான வினாக்கள் உள்ளன.\nமொத்தம் 60 வினாக்களில் 60/100 = <<60*60/100=36>>36 சராசரி மற்றும் கடினமான வினாக்கள் உள்ளன.\nAries எளிதான வினாக்களில் 75% ஐ உறுதியாகப் பெற்றால், அதாவது அவர் 24 வினாக்களில் 75/100 = <<24*75/100=18>>18 புள்ளிகளைப் பெறுவார் என்பதாகும்.\nசராசரி மற்றும் கடினமான வினாக்களிலிருந்து, அவர் அரை பகுதியை சரியாகப் பெறுவார், அதாவது 36 வினாக்கள்*1/2 = <<36*1/2=18>>18 புள்ளிகள்.\nஎனவே, அவர் வினாத்தாளில் 18 புள்ளிகள் + 18 புள்ளிகள் = <<18+18=36>>36 புள்ளிகளைப் பெறுவார் என்பது உறுதி.\n#### 36"
