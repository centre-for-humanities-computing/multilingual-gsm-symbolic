question_annotated = "{name,Sally} va anar a la platja de vacances. Els seus pares li van donar ${total,15} per comprar el que volgués. A la botiga de souvenirs, el caramel estava en oferta per \"Compra {n1,500} grams per ${p1,3}, obté {n2,500} grams per {discount,1/2} preu.\" Va agafar {n12,2000} grams. També va comprar una bossa mixta de closques per ${p2,1.5} i {n3,4} imants que eren de ${p3,0.25} cadascun. Quanta diners li queda a {name,Sally}?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(500, 3000, 500)\n- $n2 = range(500, 3000, 500)\n- $n12 = range(1000, 6000, 500)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1 + p2 + n3*p3)\n- p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1 + p2 + n3*p3 < total\n\n#answer: total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)\n"
answer_annotated = "El caramel costa ${p1} per {n1} grams i obté {n2} grams per {discount} preu. Així {discount} del preu de {n2} grams és {n2}/{n1}*{discount}*${p1} = ${(n2/n1)*discount*p1}.\nJuntament, això costa ${(n2/n1)*discount*p1} + ${p1} = ${(n2/n1)*discount*p1 + p1}.\nEls {n12 - n1 - n2} grams restants no tenen descompte i costa ${(n12 - n1 - n2)/n1*p1}, així el preu total és ${p1} + ${n2/n1*discount*p1} + ${(n12 - n1 - n2)/n1*p1} = $<<{p1} + {n2/n1*discount*p1} + {(n12 - n1 - n2)/n1*p1} = {p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}>>{p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}\n{n3} imants a ${p3} cadascun és {n3}*${p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nQuan sumes totes les seves compres, ${p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1} + ${p2} + ${n3*p3} = $<<{p1+(n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}+{p2}+{n3*p3}={int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}>>{int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}\nTenia ${total} i va gastar ${int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}, així li queda ${total} - ${int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} = $<<{total}-{int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}={total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}>>{total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} restant\n#### {total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}\n"
