question = "Sally va anar a la platja de vacances. Els seus pares li van donar $15 per comprar el que volgués. A la botiga de souvenirs, el caramel estava en oferta per \"Compra 500 grams per $3, obté 500 grams per 1/2 preu.\" Va agafar 2000 grams. També va comprar una bossa mixta de closques per $1.5 i 4 imants que eren de $0.25 cadascun. Quanta diners li queda a Sally?"
answer = "El caramel costa $3 per 500 grams i obté 500 grams per 1/2 preu. Així 1/2 del preu de 500 grams és 500/500*1/2*$3 = $1.5.\nJuntament, això costa $1.5 + $3 = $4.5.\nEls 1000 grams restants no tenen descompte i costa $6, així el preu total és $3 + $1.5 + $6 = $<<3 + 1.5 + 6 = 10.5>>10.5\n4 imants a $0.25 cadascun és 4*$0.25=$<<4*0.25=1>>1\nQuan sumes totes les seves compres, $10.5 + $1.5 + $1 = $<<10.5+1.5+1=13>>13\nTenia $15 i va gastar $13, així li queda $15 - $13 = $<<15-13=2>>2 restant\n#### 2\n"
