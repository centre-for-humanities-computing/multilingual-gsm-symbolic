question = "Alison es va classificar per a un lloc a l'equip de córrer, així que va anar de compres per a equipament esportiu. Va comprar una samarreta per $10, unes córrer bermudes per $5 més que el que va costar la samarreta, i unes espardenyes esportives que originalment eren $48 però estaven en oferta a la meitat de preu. Tenia un cupó de $2 de descompte en el paquet de $8 de mitjons esportius que també va comprar. Quant va gastar en equipament esportiu?"
