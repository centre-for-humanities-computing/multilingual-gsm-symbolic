question = "Artie té un parador de flor al mercat de pagesos. Vende tres tipus de flors: cadells, petúnies i begònies. Normalment ven cadells per $2.74 per pot, petúnies per $1.87 per pot i begònies per $2.12 per pot. Artie no té canvi avui, així que ha decidit arrodonir tots els seus preus al dòlar més proper. Si Artie ven 12 pots de cadells, 9 pots de petúnies i 17 pots de begònies, quant guanyarà?"
answer = "Artie arrodonirà els seus cadells amunt de $2.74 a $3, ja que el nombre que segueix el 2 és 5 o més.\nArtie arrodonirà les seves petúnies amunt de $1.87 a $2, ja que el nombre que segueix el 1 és 5 o més.\nArtie arrodonirà les seves begònies avall de $2.12 a $2, ja que el nombre que segueix el 2 és menys de 5.\nArtie ven 12 cadells*$3 = $<<12*3=36>>36\nArtie ven 9 petúnies*$2 = $<<9*2=18>>18\nArtie ven 17 begònies*$2 = $<<17*2=34>>34\nEn total, Artie guanyarà $36 + $18 + $34 = $<<36+18+34=88>>88\n#### 88\n"
