question = "Dana pot córrer quatre vegades més ràpid que caminar, però pot saltar a una velocitat que és la meitat de la velocitat a la qual pot córrer. Si pot saltar a 3 quilòmetres per hora, quants quilòmetres pot recórrer en sis hores si passa un terç del temps corrent i dos terços del temps caminant?"
answer = "Si Dana pot saltar a la meitat de la velocitat a la qual pot córrer, llavors pot córrer a 3*2=<<3*2=6>>6 quilòmetres per hora.\nI com que pot córrer a una velocitat que és quatre vegades més ràpid que caminar, això vol dir que pot caminar a 6/4=1.5 quilòmetres per hora.\nSi dos terços del temps es passa caminant, llavors camina durant 6*2/3=<<6*2/3=4>>4 hores.\nSi un terç del temps es passa corrent, llavors corre durant 6-4=<<6-4=2>>2 hores.\nAixí, corre durant 2 hores a 6 quilòmetres per hora, o 2*6=<<2*6=12>>12 quilòmetres.\nCamina durant 4 hores a 1.5 quilòmetres per hora, o 4*1.5=<<4*1.5=6>>6 quilòmetres.\nAixí, en total, recorre 12+6=<<12+6=18>>18 quilòmetres.\n#### 18\n"
