question = "Allan's বাড়িতে, cannolis এর তুলনায় twice গুণ বেশি corns আছে। তার বাড়িতে মোট 40টি cannolis আছে। Allan দোকান থেকে 60টি বেশি cannolis কিনেছে এবং cannolis এর সংখ্যার চেয়ে 40টি কম corns কিনেছে। বাড়িতে Allan এর কাছে মোট কতগুলি corns এবং cannolis আছে তা বের করো?"
