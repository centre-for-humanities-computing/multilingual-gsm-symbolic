question = "Sally went to the seashore for vacation. Her parents gave her $15 to buy whatever she wanted. At the souvenir shop, taffy was on sale for \"Buy 500 grams for $3, get 500 grams for 1/2 price.\" She scooped up 2000 grams. She also bought a mixed bag of seashells for $1.5 and 4 magnets that were $0.25 each. How much money does Sally have left?"
answer = "The taffy costs $3 for 500 grams and she gets 500 grams for 1/2 price. So 1/2 of the price of 500 grams is 500/500*1/2*$3 = $1.5.\nTogether, that costs $1.5 + $3 = $4.5.\nThe remaining 1000 grams does not have a discount and costs $6, so the total price is $3 + $1.5 + $6 = $<<3 + 1.5 + 6 = 10.5>>10.5\n4 magnets at $0.25 each is 4*$0.25=$<<4*0.25=1>>1\nWhen you add all her purchases, $10.5 + $1.5 + $1 = $<<10.5+1.5+1=13>>13\nShe had $15 and spent $13, so she has $15 - $13 = $<<15-13=2>>2 left over\n#### 2\n"
