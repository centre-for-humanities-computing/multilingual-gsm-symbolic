question = "একটি hospital এর ক্ষমতা 1000 bed যার 1/5 অংশ দখলকৃত। coronavirus outbreak এর কারণে, প্রতিদিন 50 জন রোগী hospital এ ভর্তি হন। 2 সপ্তাহ পর hospital এ মোট কতগুলা খালি bed আছে তা গণনা করুন।"
answer = "যদি 1/5 অংশ hospital এর মোট bed এর ক্ষমতা দখলকৃত হয়, এর অর্থ 1/5 * 1000 = <<1000*1/5=200>>200টি bed রোগী দ্বারা ব্যবহৃত হচ্ছে।\nনতুন ভর্তি ছাড়া hospital এ মোট bed সংখ্যা 1000টি bed - 200টি bed = <<1000-200=800>>800টি bed।\nযদি প্রতিদিন 50 জন ভর্তি হয়, এক সপ্তাহ পর hospital এ মোট রোগী সংখ্যা 50 জন/দিন * 7 দিন/সপ্তাহ = 350 জন রোগী।\n2 সপ্তাহ পর, hospital এ ভর্তি মোট রোগী সংখ্যা 350 জন/সপ্তাহ * 2 সপ্তাহ = <<350*2=700>>700 জন রোগী, যারা প্রত্যেকে একটি bed ব্যবহার করে।\nযদি নতুন ভর্তির আগে hospital এ 800টি খালি bed ছিল, মোট সংখ্যা কমে 800টি bed - 700টি bed = <<800-700=100>>100টি খালি bed।\n#### 100\n"
