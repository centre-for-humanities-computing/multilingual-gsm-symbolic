answer_annotated = "যদি {frac} অংশ {facility} এর মোট {item} এর ক্ষমতা দখলকৃত হয়, এর অর্থ {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)}টি {item} রোগী দ্বারা ব্যবহৃত হচ্ছে।\nনতুন ভর্তি ছাড়া {facility} এ মোট {item} সংখ্যা {total}টি {item} - {int(total*frac)}টি {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)}টি {item}।\nযদি প্রতিদিন {daily} জন ভর্তি হয়, এক সপ্তাহ পর {facility} এ মোট রোগী সংখ্যা {daily} জন/দিন * 7 দিন/সপ্তাহ = {daily*7} জন রোগী।\n{period} সপ্তাহ পর, {facility} এ ভর্তি মোট রোগী সংখ্যা {daily*7} জন/সপ্তাহ * {period} সপ্তাহ = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} জন রোগী, যারা প্রত্যেকে একটি {item} ব্যবহার করে।\nযদি নতুন ভর্তির আগে {facility} এ {total-int(total*frac)}টি খালি {item} ছিল, মোট সংখ্যা কমে {total-int(total*frac)}টি {item} - {daily*period*7}টি {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)}টি খালি {item}।\n#### {total - (total * frac + daily * period * 7)}\n"
