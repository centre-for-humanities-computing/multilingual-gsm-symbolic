question = "Sunny o a rekisa kgobe le apole paie mo kgobokanyong ya madi. Ka Mošataga, o ne a rekisa 10 dibokose tsa kgobe le 4 dibokose tse di nnye tsa apole paie, go feta ka Sontaga. Ka Sontaga, o ne a rekisa 5 dibokose tse dintsi tsa kgobe go feta ka Mošataga le 15 dibokose tsa apole paie. Fa kgobe e lefa $6 mme apole paie e lefa $15, go kae Sunny a bonileng ka malatsi a mabedi?"
