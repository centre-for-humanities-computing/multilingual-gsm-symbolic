question = "Nemocnica má kapacitu 1000 lôžko s 1/5 obsadených. Vzhľadom na vypuknutie koronavírusu je 50 pacientov prijatých do nemocnica každý deň. Vypočítajte celkový počet neobsadených lôžko v nemocnica po 2 týždňoch."
