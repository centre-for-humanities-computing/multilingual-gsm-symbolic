"""

answer = """
Et helt par består af 500 + 500 = 1000 gram og koster 20 + 500/500*1/2*20 = 30 kr.
Der er 1 hele par og 100 gram til normalpris.
Karamellerne koster i alt 34 kr.
Magneterne koster 4*2 = <<4*2=8>>8 kr.
Hun bruger 34 + 17 + 8 = 59 kr i alt.
Hun har 75 - 59 = <<75-59=16>>16 kr tilbage.
#### 16
"""

