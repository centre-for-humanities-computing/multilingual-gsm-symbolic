question = "Sɛbɛn kɔnɔ, fɛrɛ kɔrɔ bɛ 250 kalori fɛɲɛn kɔnɔ. Soo 300 gram kɔrɔ bɛ 5 fɛɲɛn, ban gram o bɛ ka ɲɛ sɛbɛn bɛɛ kalori dɔɲɛ 2000 ka o ɲɛ 1800 kalori?"
answer = "Sɛbɛn bɛɛ kalori dɔɲɛ 2000 ka o ɲɛ 1800 kalori, o bɛ 2000-1800 = <<2000-1800=200>>200 kalori ka ɲɛ\nSoo fɛrɛ fɛɲɛn kɔnɔ bɛ 250 kalori, o bɛ 200 kalori ka ɲɛ, o bɛ 200/250 fɛɲɛn ka ɲɛ = 4/5 fɛɲɛn\nA tun bɛ ɲɛ 300 gram kɔrɔ fɛrɛ bɛ 5 fɛɲɛn, nka fɛɲɛn kɔnɔ bɛ 300 gram/5 = <<300/5=60>>60 gram\nSoo o bɛ 4/5 fɛɲɛn ka ɲɛ, o bɛ 60 gram * 4/5 = 48 gram\n#### 48\n"
