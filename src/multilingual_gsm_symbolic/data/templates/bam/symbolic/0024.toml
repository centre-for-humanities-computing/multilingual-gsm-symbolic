answer_annotated = "Sɛbɛn bɛɛ kalori dɔɲɛ {total} ka o ɲɛ {spent} kalori, o bɛ {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} kalori ka ɲɛ\nSoo {food} fɛɲɛn kɔnɔ bɛ {cal} kalori, o bɛ {total-spent} kalori ka ɲɛ, o bɛ {total-spent}/{cal} fɛɲɛn ka ɲɛ = {Fraction((total-spent)/cal)} fɛɲɛn\nA tun bɛ ɲɛ {size} {unit} kɔrɔ {food} bɛ {n} fɛɲɛn, nka fɛɲɛn kɔnɔ bɛ {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit}\nSoo o bɛ {Fraction((total-spent)/cal)} fɛɲɛn ka ɲɛ, o bɛ {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit}\n#### {size//n * (total-spent)/cal}\n"
