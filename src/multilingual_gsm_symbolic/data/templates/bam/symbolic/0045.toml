question = "Pat ye 111 mita kɛnɛya kan. Pat bɛ kɛnɛya ye ka kɛnɛ fɛɛn kɛ. Pat kɛnɛ fɛɛn kɛ 12 santimita sɔn, kɛnɛ kɔnɔ kɛnɛ fɛɛn kɔnɔ sɔrɔkɔ ye ka kɛnɛ fɛɛn kɛ 1.5 mita bɛɛ bɛɛ kɛnɛya kɔnɔ. Pat bɛɛ bɛɛ 17 kɛnɛ fɛɛn ni. Kɛnɛ fɛɛn kɛ $6 bɛɛ bɛɛ dɔgɔnɔ kɔnɔ. Ɲ ma Pat bɛɛ bɛɛ dɔgɔnɔ kɔnɔ kɛnɛ fɛɛn kɛnɛ kɔnɔ ka kɛnɛya ye ka kɛnɛ fɛɛn kɛ?"
