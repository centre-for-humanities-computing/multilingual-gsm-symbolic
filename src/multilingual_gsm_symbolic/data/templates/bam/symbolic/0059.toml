question = "M'be 10 litire orandji bɔgɔ ka ɲɛɲɛ kɔnɔnɔ tigi n'ka fɛn dɔ bɔn na 15 litire anana bɔgɔ ka ɲɛɲɛɲɛ kɔnɔnɔ tigi. Iɲɛnka bɔgɔ, n'be ɲɛɲɛɲɛɲɛ litire orandji bɔgɔ bɔ. Dɔgɔ tigi bɛɛ ka bɔ 21 litire ɲɛnɛ ɲɛnɛ?"
