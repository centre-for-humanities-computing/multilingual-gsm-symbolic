question = "Toula kɛra kɛnɛya la, a ye sɛbɛnɛw ɲɔgɔn ye sɔrɔ. A ye 3 dozin donuts sɔrɔ, ka dɔgɔ $68 dozin kɔnɔ, 2 dozin mini cupcakes sɔrɔ, ka dɔgɔ $80 dozin kɔnɔ, ka 6 dozin mini cheesecakes sɔrɔ, ka dɔgɔ $55 dozin kɔnɔ. Dɔgɔ fɛɛra ɲɔgɔn ye bɛɛ fɛɛra?"
