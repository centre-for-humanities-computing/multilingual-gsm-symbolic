answer_annotated = "Sa bɛɛ la, {name} ye {h} * {r} = {cur}<<{h}*{r}={h*r}>>{h*r} kɛra\nI sɔgɔma kɛra {d_txt} sɔgɔma kɛra bɛɛ la, sɔgɔma ye kɛra bɛɛ la {d_val}*4=<<{d_val}*4={d_val*4}>>{d_val*4} sɔgɔma.\nA ye {cur}{h*r} kɛra sa bɛɛ la, fɔnɔ ye kɛra bɛɛ la {d_val*4} * {h*r}= {cur}<<{d_val*4}*{h*r}={d_val*4*h*r}>>{d_val*4*h*r}.\nA ye {b} * 4 = {cur}<<{b}*4={b*4}>>{b*4} bonus fɔnɔ kɛra komani ye dɔn kɛra {month} kɔnɔ bɛɛ la.\n{month} fɛ, a ye {d_val*4*h*r} + {b*4} = {cur}<<{d_val*4*h*r}+{b*4}={d_val*4*h*r+b*4}>>{d_val*4*h*r+b*4} fɔnɔ kɛra.\n#### {d_val*4*h*r+b*4}\n"
