question = "Watson ye 10-sa sɔgɔma kɛra bɛɛ, ɔgɔnɔ sɔgɔma kɛra bɛɛ la. A ye $10 fɔnɔ sa bɛɛ la, a ye $300 bonus fɔnɔ kɔnɔ bɛɛ la i sɔgɔma kɛra ka dɔn. Mani fɔnɔ watson ye kɛra avirili la i sɔgɔma kɛra ka dɔn ka dɔn sɔgɔma bɛɛ la?"
answer = "Sa bɛɛ la, watson ye 10 * 10 = $<<10*10=100>>100 kɛra\nI sɔgɔma kɛra ɔgɔnɔ sɔgɔma kɛra bɛɛ la, sɔgɔma ye kɛra bɛɛ la 6*4=<<6*4=24>>24 sɔgɔma.\nA ye $100 kɛra sa bɛɛ la, fɔnɔ ye kɛra bɛɛ la 24 * 100= $<<24*100=2400>>2400.\nA ye 300 * 4 = $<<300*4=1200>>1200 bonus fɔnɔ kɛra komani ye dɔn kɛra avirili kɔnɔ bɛɛ la.\nAvirili fɛ, a ye 2400 + 1200 = $<<2400+1200=3600>>3600 fɔnɔ kɛra.\n#### 3600\n"
