question = "Juliya bɛɛ kɛnɮ la bɛɛ kɛnɛ a tɛgɛ la, ka ka bɛɛ sɔrɔw la. A kɛnɮ la, a bɛɛ kɛnɮ la fɛnɛ baɲɛ, o kɛnɮ la, a bɛɛ kɛnɮ la fɛnɛ baɲɛ. Bɛɛ kɛnɮ la, a fɛnɛ bɛɛ kɛnɮ la 5 fɛnɛ baɲɛ ka Juliya sɔrɔw la. Juliya bɛɛ kɛnɮ la ka bɛɛ, a bɛɛ kɛnɮ la ɔɔ baɲɛ ka ka bɛɛ sɔrɔw la. Bɛɛ kɛnɮ la, a bɛɛ kɛnɮ la tɛgɛ la, a bɛɛ kɛnɮ la fɛnɛ bɛɛ la 12 baɲɛ. Bɛɛ kɛnɮ la baɲɛ bɛɛ kɛnɮ la fɛnɛ bɛɛ la Juliya bɛɛ kɛnɮ la?"
