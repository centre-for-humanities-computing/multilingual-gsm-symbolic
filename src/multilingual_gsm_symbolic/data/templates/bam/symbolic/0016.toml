answer_annotated = "O ye {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} bɔkisi {food} bɔ {d2} la.\n{name} ye {food} bɔkisi ɔɔbɛɛ ye {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} ye {n1+n1+n2}*{cur}{cn} ye = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} ka {food} kɛ.\nO ye {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} bɔkisi {fruit} pie bɔ {d1} la.\n{name} ye {fruit} pie bɔkisi ɔɔbɛɛ ye {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nO ye {2*m2-m1}*{cur}{cm} ye = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} ka {fruit} pie kɛ.\nA bɛɛ, {name} ye {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} ye = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} ɔɔ sɛgɛn ma.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
