question = "Sunny tɛn n'fa kɛnɛbɛ ka apɛl pie dɔgɔtigiw ma. On Satinidi, o ye 10 bɔkisi kɛnɛbɛ bɔ, ka 4 bɔkisi apɛl pie kɛnɛ, ka Sɛgɛnidi ka. On Sɛgɛnidi, o ye 5 bɔkisi kɛnɛbɛ bɛ, ka Satinidi ka, ka 15 bɔkisi apɛl pie bɔ. Sɛgɛn kɛnɛbɛ ka $6, ka apɛl pie ka $15, Sunny ye ka bɛɛ ye ɔɔ sɛgɛn ma?"
answer = "O ye 10 + 5 = <<10+5=15>>15 bɔkisi kɛnɛbɛ bɔ Sɛgɛnidi la.\nSunny ye kɛnɛbɛ bɔkisi ɔɔbɛɛ ye 10 + 15 = <<10+15=25>>25.\nSunny ye 25*$6 ye = $<<25*6=150>>150 ka kɛnɛbɛ kɛ.\nO ye 15 - 4 = <<15-4=11>>11 bɔkisi apɛl pie bɔ Satinidi la.\nSunny ye apɛl pie bɔkisi ɔɔbɛɛ ye 15 + 11 = <<15+11=26>>26.\nO ye 26*$15 ye = $<<26*15=390>>390 ka apɛl pie kɛ.\nA bɛɛ, Sunny ye $150 + $390 ye = $<<150+390=540>>540 ɔɔ sɛgɛn ma.\n#### 540\n"
