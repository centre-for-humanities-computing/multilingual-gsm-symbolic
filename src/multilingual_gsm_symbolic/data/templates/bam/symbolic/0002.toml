question = "Jerry tɔgɔ ɲɛgɛnɛ ɲɛgɛnɛ dɔgɔtɔgɔ. Pɛrsɛntɛ la, kɛnɛ 3 ka bɛ kɛ ɲɛgɛnɛ kɛnɛ kɛ bɛlɛ kɛnɛ ɲɛgɛnɛ 2 ka bɛ kɛ la, ko bɛ kɛ kɛnɛ kɛ?"
