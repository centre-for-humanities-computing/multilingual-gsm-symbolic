question_annotated = "{facility,fɔrɔgɛ} ye {total,1000} {item,kɔnɔ} fɔrɔ, {frac,1/5} ye kɔnɔ. Sɛbɛn {event,koronabɔlɔgɛ} bɛ, {daily,50} wuladon bɛ kɔnɔ {facility,fɔrɔgɛ} jɔn kɔnɔ. Kɔnɔbɔ {period,2} sɔnɔ kɔ {facility,fɔrɔgɛ} la {item,kɔnɔ} bɔgɔ dɔgɔ.\n\n#init:\n- facility = sample([\"fɔrɔgɛ\", \"sɛbɛn\", \"kɔnɔgɔ\", \"kɔnɔbɔgɛ\"])\n- item = sample([\"kɔnɔ\", \"dɔgɔkɔnɔ\", \"kɔnɔbɔ\"])\n- event = sample([\"sɛbɛn kɔnɔ\", \"dɔgɔkɔnɔ bɔgɔ\", \"sɛbɛn bɔgɔ\", \"kɔnɔbɔ\"])\n- $total = range(500, 2000, 100)\n- $frac = sample(fractions)\n- $daily = range(20, 100, 5)\n- $period = range(2, 5)\n\n#conditions:\n- is_int(total * frac)\n- total * frac + daily * period * 7 < total\n\n#answer: total - (total * frac + daily * period * 7)\n"
answer_annotated = "Sɛbɛn {frac} ye {facility} {item} fɔrɔ la kɔnɔ, bɔ {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} ye wuladon kɔnɔ.\n{facility} la {item} dɔgɔ, kɔnɔ bɔ {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}.\nSɛbɛn {daily} bɛ kɔnɔ jɔn kɔnɔ, {facility} la wuladon dɔgɔ sɔnɔ 1 kɔ {daily} wuladon/jɔn * 7 jɔn/sɔnɔ = {daily*7} wuladon.\n{period} sɔnɔ kɔ, {facility} la wuladon kɔnɔ dɔgɔ {daily*7} wuladon/sɔnɔ * {period} sɔnɔ = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} wuladon, sɛbɛn kɔnɔ {item} ɲɛ.\nSɛbɛn {total-int(total*frac)} {item} bɔgɔ {facility} la kɔnɔ bɔ kɔ, dɔgɔ bɛ {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item} bɔgɔ.\n#### {total - (total * frac + daily * period * 7)}\n"
