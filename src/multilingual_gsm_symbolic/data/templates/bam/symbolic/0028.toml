question = "Fɔrɔgɛ ye 1000 kɔnɔ fɔrɔ, 1/5 ye kɔnɔ. Sɛbɛn koronabɔlɔgɛ bɛ, 50 wuladon bɛ kɔnɔ fɔrɔgɛ jɔn kɔnɔ. Kɔnɔbɔ 2 sɔnɔ kɔ fɔrɔgɛ la kɔnɔ bɔgɔ dɔgɔ."
answer = "Sɛbɛn 1/5 ye fɔrɔgɛ kɔnɔ fɔrɔ la kɔnɔ, bɔ 1/5 * 1000 = <<1000*1/5=200>>200 kɔnɔ ye wuladon kɔnɔ.\nFɔrɔgɛ la kɔnɔ dɔgɔ, kɔnɔ bɔ 1000 kɔnɔ - 200 kɔnɔ = <<1000-200=800>>800 kɔnɔ.\nSɛbɛn 50 bɛ kɔnɔ jɔn kɔnɔ, fɔrɔgɛ la wuladon dɔgɔ sɔnɔ 1 kɔ 50 wuladon/jɔn * 7 jɔn/sɔnɔ = 350 wuladon.\n2 sɔnɔ kɔ, fɔrɔgɛ la wuladon kɔnɔ dɔgɔ 350 wuladon/sɔnɔ * 2 sɔnɔ = <<350*2=700>>700 wuladon, sɛbɛn kɔnɔ kɔnɔ ɲɛ.\nSɛbɛn 800 kɔnɔ bɔgɔ fɔrɔgɛ la kɔnɔ bɔ kɔ, dɔgɔ bɛ 800 kɔnɔ - 700 kɔnɔ = <<800-700=100>>100 kɔnɔ bɔgɔ.\n#### 100\n"
