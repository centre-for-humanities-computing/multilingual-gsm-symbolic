question = "Jòni kɔnɔn kɛ taa 3 dɔgɔtigiya kɛlɛba. Ɲɛnɛ ɛkɛ bɛ 200 dɔgɔtigiya kɛlɛba ka fɛn dɔgɔn bɛ 60% kɛnɛ ka fɛn dɔgɔn ka bɔ ɛkɛ. I kɔnɔn kɛ 3 kɛlɛba lɔgɔ kɛ ka fɛn kɛlɛba ka sɛbɛn kɛ $0.4 kɔnɔn kɛlɛba kɛ. Ɲɛnɛ fɛn bɛ i kɛ lɔgɔ kɛ?"
