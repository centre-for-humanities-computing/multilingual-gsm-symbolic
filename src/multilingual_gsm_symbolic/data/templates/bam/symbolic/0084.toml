question = "Maria sɛgɛ 8 sɛbɛn bɛɛ ka $8 kelen-kelen. Sɛbɛn fɛnɛ dɔgɔyɛlɛ 50% kɔnɔ fɛɛ Maria ka taa, minɛ 25% fila fɛɛ kɔnɔ. Lafɛn bɛɛ bɛɛ Maria bɛɛ bɛɛ?"
