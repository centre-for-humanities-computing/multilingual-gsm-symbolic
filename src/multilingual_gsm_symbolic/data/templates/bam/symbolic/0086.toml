question = "Alison ka dɔgɔtɔn sɔrɔ kɛlɛ kɔnɔ, ka bɛ kɔnɔn ka kɛlɛbɔbɔ sɔrɔ. O ka dɔgɔtɔn sɔrɔ $10, kɛlɛ kɛlɛkɛ ɲɔgɔn ka $5 ɲɔgɔn dɔgɔtɔn sira la, ka bɛlɛbɛlɛ ɲɔgɔn o bɛ $48 kɔnɔ ka kɔnɔ sira la. O bɛ $2 ɲɔgɔn coupon la $8 bɛlɛbɛlɛ kɛlɛ kɔnɔ o bɛ sɔrɔ. O dɔgɔtɔn kɛnɛ kɛlɛbɔbɔ la?"
answer = "Kɛlɛkɛ bɛ $5 ɲɔgɔn dɔgɔtɔn la, ka $5 + $10 = $<<5+10=15>>15.\nO bɛlɛbɛlɛ bɛ kɔnɔ $48 sira la, ka $48*3/5=$144/5.\nCoupon la, bɛlɛbɛlɛ kɛlɛ bɛ $8 - $2 = $<<8-2=6>>6.\nDɔgɔtɔn, kɛlɛkɛ, bɛlɛbɛlɛ, ka bɛlɛbɛlɛ kɛlɛ ɲɔgɔn bɛ $10 + $15 + $144/5 + $6 = $<<10+15+144/5+6=299/5>>299/5.\n#### 299/5\n"
