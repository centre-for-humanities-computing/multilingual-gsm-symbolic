question = "Artie bɛ kanafɛ minɛ kanafɛ minɛ na. A bɛ kanafɛ sɔrɔ saba: kɔnɔn, kɔnɔn ka kɔnɔn. A bɛ kɔnɔn kan sɔrɔ CFA2.74 kɔrɔ la, kɔnɔn kan sɔrɔ CFA1.87 kɔrɔ la ka kɔnɔn kan sɔrɔ CFA2.12 kɔrɔ la. Artie bɛ ɲɔgɔn tɛ tuma na, a yɛrɛ bɛ sɛgɛsɛgɛ fɛn bɛɛ taa o minɛ. Sɛgɛsɛgɛ Artie sɔrɔ 12 kɔrɔ kɔnɔn, 9 kɔrɔ kɔnɔn ka 17 kɔrɔ kɔnɔn, a bɛ sɔrɔ min?"
