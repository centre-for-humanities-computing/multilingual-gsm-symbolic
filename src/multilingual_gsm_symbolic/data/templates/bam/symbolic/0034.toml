question = "Bɛnɛn Tan sɔrɔ damini o la $400,000. O kɛ sɔrɔkɛ kɛlɛw o la, o bɛ 3% la sɔrɔ ɲɛgɛn la, ka kɛ kanakɛ kɛlɛ o la, o bɛ 5% la sɔrɔ ɲɛgɛn la. Sɛbɛ o kɛ $250,000 la damini ɲɛgɛn bɛ sɔrɔ la, ɲɛgɛn bɛ Bɛnɛn Tan sɔrɔ damini o sɔrɔ la?"
