question = "Sally yɛrɛ fɛra jɛnɛ bɛ sɛbɛ la. Ba-nɛnɛ ye kɛnɛ $15 fɛnɛ, ka fɛnɛ bɛnɛnɛ ye kɛ. Dɔgɔ-kɛ-bɛ la, sɛbɛ-kɛ ye dɔgɔ-kɛ ye \"Ka 1 gɛrɛ bɛ $3 la, ka 1 gɛrɛ bɛ 1/2 dɔgɔ la.\" Ye 4 gɛrɛ kɛ. Ye jɛnɛ-bɛ dɔgɔ-kɛ bɛ $1.5 la ka 4 magnet bɛ $0.25 kɛlɛ la. Kɛnɛ bɛ Sally fɛ kɛnɛ?"
answer = "Sally ye 1 gɛrɛ bɛ $3 la, ka 1 gɛrɛ bɛ 1/2 dɔgɔ la. Nɔnɔ 1/2 1 gɛrɛ dɔgɔ la, $3*1/2 = $1.5. Kɛnɛ 2 gɛrɛ dɔgɔ-kɛ bɛ, ka 2*$3 = $6, dɔgɔ-kɛ ye $3+$3/2+$6=$21/2\n4 magnet bɛ $0.25 kɛlɛ la, ye 4*0.25=$<<4*0.25=1>>1\nFɛnɛ kelen ye, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nYe $15 kɛnɛ, ka $13 kɛ, nɔnɔ ye $15-$13 = $<<15-13=2>>2 kɛnɛ\n#### 2\n"
