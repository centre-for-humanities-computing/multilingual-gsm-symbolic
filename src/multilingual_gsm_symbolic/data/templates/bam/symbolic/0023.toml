question = "Martha ka sɛbɛ kɔnɔnɔ kɛnɛ 3 wala fɛ. Ɛn bɛ wala ɲɔgɔn ɲɛ, ɔr bɛɛ bɛ ka bɛɛ kɛnɛ. Ka sɛgɛ, kɛnɛ, pulɛtɛ, kɛnɛ, na tɛgɛ tɛgɛ fɛn kɛnɛ ɲɔgɔn ɲɛ. Ka sɛgɛ tɛgɛ, 2 kɛnɛ fɛn kɛnɛ. Kɛnɛ fɛn kɛnɛ, 4. Pulɛtɛ fɛn kɛnɛ, 12. Kɛnɛ ɲɔgɔn fɛn kɛnɛ, 1. Tɛgɛ ɲɔgɔn fɛn kɛnɛ, 2. Ka kɛnɛ bɛɛ bɛɛ fɛn kɛ?"
answer = "Ka sɛbɛ kɛnɛ bɛɛ tɛgɛ, 2 kɛnɛ fɛn kɛnɛ sɛgɛ fɛ + 4 kɛnɛ fɛn kɛnɛ kɛnɛ fɛ + 12 kɛnɛ fɛn kɛnɛ pulɛtɛ fɛ + 1 kɛnɛ fɛn kɛnɛ kɛnɛ ɲɔgɔn fɛ + 2 kɛnɛ fɛn kɛnɛ tɛgɛ ɲɔgɔn fɛ = <<2+4+12+1+2=21>>21 kɛnɛ.\nƐr, ka wala bɛɛ sɛbɛ kɛnɛ tɛgɛ, ka bɛɛ 3*21 fɛn kɛ = <<3*21=63>>63 kɛnɛ.\n#### 63\n"
