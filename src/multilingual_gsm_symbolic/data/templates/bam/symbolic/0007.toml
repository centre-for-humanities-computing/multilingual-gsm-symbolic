question = "Fàrùw bɛ dègè kɛlɛ fò sòrò. O kɛlɛw bɛ sɛgɛsɛgɛ, sɛgɛ, kɛlɛ ka sukrɛ. Nɔ sukrɛ bɛ ɛnɛ fò, o kɛlɛw bɛ ɔgɔ 1-kilogɛrɛ fàgɛ fò sòrò fò. O kɛlɛw bɛ kɛlɛ fò sòrò kɛlɛw sɛgɛ, o kɛlɛw bɛ ɛnɛɛɛ 12-kilogɛrɛ dɛgɛ. Sɛgɛsɛgɛ bɛ sòrò dègè bɛn, o kɛlɛw bɛ ɛnɛɛɛɛɛɛɛɛ ɔgɔ 75-kilogɛrɛ fàgɛ. Sɛgɛ bɛ sɛgɛsɛgɛ kɛlɛ, o kɛlɛw bɛ ɛnɛɛɛɛɛɛ 65-kilogɛrɛ dɛgɛ. Sù 2250 kilogɛrɛs bɛ fàrù kàrɛ kɛlɛ, fàrùw fò nɛgɛ nɛ kɛlɛ fò dègè kɛlɛ?"
