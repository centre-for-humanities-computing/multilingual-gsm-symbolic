question = "श्री तन ने अपना घर $400,000 में बेचा। उसने ट्रांसफर शुल्क दिए जो बिक्री मूल्य का 3% है और एक ब्रोकरेज शुल्क भी दिया जो बिक्री मूल्य का 5% है। यदि उसने $250,000 भी दिए घर के बचे हुए लोन राशि के लिए, तो श्री तन की शुद्ध राशि घर बेचने से कितनी होगी?"
