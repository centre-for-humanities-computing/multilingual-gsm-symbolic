question = "Oana Gnom kaun 12 Kilogramm Erz pro Dog mit seine bloße Händ grabn. Er kaun zweimoi so vui mit am Bronzepickel grabn und 50% mehr mit am Stahlpickel ois mit am Bronzepickel. Wia vui Kilogramm Erz kinnan 40 Gnoms mit Stahlpickels grabn in an Monat mit 30 Dog?"
