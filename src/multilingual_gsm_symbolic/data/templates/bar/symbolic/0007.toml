question = "A Bauer kafft Futter fia sei Ross. Ea kafft a Vielfalt vo Heu, Hafer, Möhrn und Zuckawürfa. Wail Zuckawürfa a seltenes Leckerl san, kafft ea nua zwoa 1-Kilogramm Kistn davo fia an gansn Stall. Ea wui nua gnua Möhrn hom, um de Ross z'fodan, wärends Gmias no frisch is, drum kafft ea via 12-Kilogramm Säck. Heu is des Hauptfudda fia sei Ross, drum kafft ea zwoaundvierzg 75-Kilogramm Pack. Hafer is a Grundnahrung, um des Heu z'ergänzn, drum kafft ea zwaanzg 65-Kilogramm Säck. Wann sei Farmtruck 2250 Kilogramm auf oamoi trogn ko, wia vui Fahrtn braucht da Bauer, um s'ganza Futter z'transpordian?"
