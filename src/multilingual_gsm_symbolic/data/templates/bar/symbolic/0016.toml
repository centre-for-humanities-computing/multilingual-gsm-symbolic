answer_annotated = "A hod {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} Schachtln {food} am {d2} verkauft.\nDe gsomte Zoi vo Schachtln {food}, de {name} verkauft hod, is {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} hod {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} fia {food} verdint.\nA hod {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} Schachtln {fruit} Kuchn am {d1} verkauft.\nDe gsomte Zoi vo Schachtln {fruit} Kuchn, de {name} verkauft hod, is {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nA hod {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} fia {fruit} Kuchn verdint.\nSo hod {name} {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} in zwoa Dog verdint.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
