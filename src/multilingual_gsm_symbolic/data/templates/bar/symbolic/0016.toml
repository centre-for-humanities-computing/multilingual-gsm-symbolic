question = "Sunny vendt lebkuchn und apfe Kuchn fia a Wohltätigkeitsaktion. Am samstog, hod a 10 Schachtln lebkuchn und 4 weniger Schachtln apfe Kuchn, ois am sunntog, verkauft. Am sunntog, hod a 5 mehr Schachtln lebkuchn ois am samstog und 15 Schachtln apfe Kuchn. Wonn da lebkuchn €6 kost und da apfe Kuchn €15, wia vui hod Sunny in zwoa Dog verdint?"
