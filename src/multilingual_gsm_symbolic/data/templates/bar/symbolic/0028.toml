question = "A krankenhaus hod a Kapazität vo 1000 betta mit 1/5 bschickt. Wegn coronavirus-ausbruch keman 50 Patiente pro Tog in de krankenhaus. Berechn de gsamte Zahl vo freien betta in da krankenhaus noch 2 Wocha."
