question = "Laut Nährwertangaben hot a Packung vo chips 250 Kalorien pro Portion. Wann a 300 gramm Packung 5 Portionen hot, wia vui gramms kinstst du essn, wann dei tägliche Kalorienziil 2000 is und du scho 1800 Kalorien gessn host?"
answer = "Wann des gsamte Kalorienziil 2000 is und i 1800 Kalorien gessn hob, dann hob i 2000-1800 = <<2000-1800=200>>200 Kalorien no zum essn\nWann jede Portion vo chips 250 Kalorien hot und i nua no 200 Kalorien zum essn hob, dann kann i nua 200/250 vo ana Portion essn = 4/5 vo ana Portion\nMir wissn aa, dass a 300 gramm Packung vo chips 5 Portionen hot, also hot jede Portion 300 gramm/5 = <<300/5=60>>60 gramms\nWann i nua 4/5 vo ana Portion essn kann, dann kann i nua 60 gramm * 4/5 = 48 gramms essn\n#### 48\n"
