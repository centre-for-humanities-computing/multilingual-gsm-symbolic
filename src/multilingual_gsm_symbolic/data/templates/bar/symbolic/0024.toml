answer_annotated = "Wann des gsamte Kalorienziil {total} is und i {spent} Kalorien gessn hob, dann hob i {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} Kalorien no zum essn\nWann jede Portion vo {food} {cal} Kalorien hot und i nua no {total-spent} Kalorien zum essn hob, dann kann i nua {total-spent}/{cal} vo ana Portion essn = {Fraction((total-spent)/cal)} vo ana Portion\nMir wissn aa, dass a {size} {unit} Packung vo {food} {n} Portionen hot, also hot jede Portion {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit}s\nWann i nua {Fraction((total-spent)/cal)} vo ana Portion essn kann, dann kann i nua {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit}s essn\n#### {size//n * (total-spent)/cal}\n"
