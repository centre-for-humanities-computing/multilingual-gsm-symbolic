question = "Sally is zua Meer zua Ferien gfahrn. Ihre Eltan ham ihr $15 gebm, um wos a wü kaufa. Im Andenknladen is Kandis im Angebot gwesn für \"Kauf 1 Pfund für $3 pro Pfund, krigst 1 Pfund 1/2 Rabatt.\" Scho hod 4 Pfund gnumma. A no hod a a Mischpackung Muscheln für $1.5 und 4 Magnete kafft, de wo $0.25 pro Stick kostn ham. Wia vui Geld hod Sally no?"
answer = "Sally kafft 1 Pfund für $3 und krigt 1 Pfund 1/2 Rabatt. Also is 1/2 vo 1 Pfund $3*1/2 = $1.5. De restlichn 2 Pfund ham koan Rabatt und kostn 2*$3 = $6, also is da Gsamtpräis $3+$3/2+$6=$21/2\n4 Magnete bei $0.25 pro Stick san 4*0.25=$<<4*0.25=1>>1\nWann ma alls zammrechn, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nScho hod $15 gebm und $13 ausgäbm, also hod a $15-$13 = $<<15-13=2>>2 iwa\n#### 2\n"
