question_annotated = "{name,Sally} is zua Meer zua Ferien gfahrn. Ihre Eltan ham ihr ${total,15} gebm, um wos a wü kaufa. Im Andenknladen is Kandis im Angebot gwesn für \"Kauf {n1,1} Pfund für ${p1,3} pro Pfund, krigst {n2,1} Pfund {discount,1/2} Rabatt.\" Scho hod {n12,4} Pfund gnumma. A no hod a a Mischpackung Muscheln für ${p2,1.5} und {n3,4} Magnete kafft, de wo ${p3,0.25} pro Stick kostn ham. Wia vui Geld hod {name,Sally} no?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)"
