question = "Frankie schaut fern, nochdass er jeda Omd sei Hausaufgaben gmacht hot. Am montag und diensdog hot er je a 1-Stund-Folg vo seine Lieblings-Sendung gschaut. Am mittwoch hot er a wengal Folg vo a 30-Minuten-Sendung gschaut. Am donnersdog hot er sei Hausaufgaben friah gmacht und a 1-Stund-Folg und a 30-Minuten-Sendung gschaut. Am freitag is er lang aufbleibm, drum hot er zwoa 1-Stund-Folg gschaut. Wann er insgsamt 7 Stund TV gschaut hot, wiasoi vü 30-Minuten-Folg hot er am mittwoch gschaut?"
