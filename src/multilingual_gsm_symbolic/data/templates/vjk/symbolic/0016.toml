question = "सन्नी एकटा फंडराइजर खातिर अदरक ब्रेड आ सिब पाई बेचैत बा। सनिवार पर, ओ 10 बक्सा अदरक ब्रेड आ रविवार सँ 4 कम बक्सा सिब पाई बेचल। रविवार पर, ओ सनिवार सँ 5 बढी बक्सा अदरक ब्रेड आ 15 बक्सा सिब पाई बेचल। अगर अदरक ब्रेड कीमत ₹6 बा आ सिब पाई कीमत ₹15 बा, त सन्नी दुइ दिन खातिर कितना कमायल?"
