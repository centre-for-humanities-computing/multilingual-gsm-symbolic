question = "एक अस्पताल की क्षमता 1000 बिस्तर अछि, जिनमें 1/5 भरल अछि। कोरोनावायरस प्रकोप के कारण, 50 मरीज प्रतिदिन अस्पताल में भर्ती कएल जाएत अछि। 2 हफ्ता बाद अस्पताल में खाली बिस्तर की कुल संख्या निकालें।"
answer = "अगर अस्पताल के बिस्तर के कुल क्षमता में 1/5 भरल अछि, तें इसका मतलब 1/5 * 1000 = <<1000*1/5=200>>200 बिस्तर पर मरीज अछि।\nनई भर्ती के बिना अस्पताल में बिस्तर के कुल संख्या 1000 बिस्तर - 200 बिस्तर = <<1000-200=800>>800 बिस्तर अछि।\nअगर 50 लोग प्रतिदिन भर्ती कएल जाएत अछि, तें अस्पताल में एक हफ्ता बाद मरीज के कुल संख्या 50 मरीज/दिन * 7 दिन/हफ्ता = 350 मरीज अछि।\n2 हफ्ता बाद, अस्पताल में भर्ती कएल गेल मरीज के कुल संख्या 350 मरीज/हफ्ता * 2 हफ्ता = <<350*2=700>>700 मरीज अछि, जे प्रत्येक एक बिस्तर प्रयोग करैत अछि।\nअगर नई भर्ती से पहिने अस्पताल में 800 खाली बिस्तर छल, तें कुल संख्या घटकर 800 बिस्तर - 700 बिस्तर = <<800-700=100>>100 खाली बिस्तर रहल।\n#### 100\n"
