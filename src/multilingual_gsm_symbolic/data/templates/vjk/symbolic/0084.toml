question = "मरिया 8 शेयर रु8 प्रति खरीदत बा। शेयर के भाव पहिलो साल 50% बढत बा, जखन मरिया के पास रहल, फिर दूसरो साल 25% घटत बा। सब मरिया के शेयर के अंतिम मूल्य कते छ?"
