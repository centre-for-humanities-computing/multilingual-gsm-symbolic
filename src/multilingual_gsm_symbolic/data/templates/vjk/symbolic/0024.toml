question = "इसकी पोषण जानकारी के अनुसार, चिप्स का एक बैग प्रति सर्विंग 250 कैलोरी होता है। यदि एक 300 ग्राम का बैग में 5 सर्विंग हैं, तो आप कितने ग्राम खा सकते हैं यदि आपका दैनिक कैलोरी लक्ष्य 2000 है और आपने पहले से ही 1800 कैलोरी खा ली हैं?"
answer = "यदि कुल कैलोरी लक्ष्य 2000 है और मैंने 1800 कैलोरी खा ली हैं तो मेरे पास खाने के लिए 2000-1800 = <<2000-1800=200>>200 कैलोरी बची हैं\nयदि चिप्स की प्रत्येक सर्विंग में 250 कैलोरी हैं और मेरे पास खाने के लिए केवल 200 कैलोरी बची हैं, तो मैं केवल एक सर्विंग का 200/250 ही खा सकता हूँ = 4/5 सर्विंग\nहम यह भी जानते हैं कि चिप्स का 300 ग्राम का बैग में 5 सर्विंग हैं, इसलिए प्रत्येक सर्विंग में 300 ग्राम/5 = <<300/5=60>>60 ग्राम होते हैं\nयदि मैं केवल 4/5 सर्विंग ही खा सकता हूँ, तो मैं केवल 60 ग्राम * 4/5 = 48 ग्राम खा सकता हूँ\n#### 48\n"
