question = "सैली छुट्टी मनाने समुद्र तट पर गई। उसके माता-पिता ने उसे $15 दिए जो चाहे खरीदने के लिए। यादगार की दुकान पर, टफ़ी की बिक्री पर थी \"Buy 1 पाउंड $3 प्रति पाउंड, get 1 पाउंड 1/2 छूट।\" उसने 4 पाउंड उठा लिए। उसने $1.5 में शंखों का मिश्रित थैला भी खरीदा और 4 चुंबक जो $0.25 प्रति थे। सैली के पास कितना पैसा बचा है?"
answer = "सैली 1 पाउंड $3 में खरीद रही है और 1 पाउंड 1/2 की छूट पा रही है। इसलिए 1 पाउंड पर 1/2 की छूट $3*1/2 = $1.5 है। बाकी 2 पाउंड पर छूट नहीं है और उसकी कीमत 2*$3 = $6 है, इसलिए कुल $3+$3/2+$6=$21/2 है।\n4 चुंबक $0.25 प्रति हैं 4*0.25=$<<4*0.25=1>>1\nजब आप सभी खरीदारी जोड़ते हैं, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nउसके पास $15 था और उसने $13 खर्च किए इसलिए उसके पास $15-$13 = $<<15-13=2>>2 बचा हुआ था\n#### 2\n"
