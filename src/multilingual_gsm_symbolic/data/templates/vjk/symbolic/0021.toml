question = "फ्रैंकी हर रात अपन होमवर्क खत्म करले बाद टीवी देखे. सोमवार आ मंगलवार पर, उनी अपन पसंदीदा शो के 1-घंटा एपिसोड देखल. बुधवार पर, उनी 30-मिनिट के शो के कुछ एपिसोड देखल. गुरुवार पर, उनी होमवर्क जल्दी खत्म केल आ 1-घंटा एपिसोड आ 30-मिनिट शो देखल. शुक्रवार पर, उनी देर तक जागल, तइसे उनी दो 1-घंटा एपिसोड देखल. अगर उनी कुल 7 घंटा टीवी देखल, त ओ बुधवार पर कितना 30-मिनिट के एपिसोड देखल?"
answer = "मान लीं E ओ एपिसोड के संख्या छी जे ओ बुधवार पर देखल.\nसोमवार के बाद, ओकरा 7 - 1 = <<7-1=6>>6 घंटा टीवी बचल.\nमंगलवार के बाद, ओकरा 6 - 1 = <<6-1=5>>5 घंटा टीवी बचल.\nगुरुवार के बाद, ओकरा 5 - 1 - 0.5 = 3.5 घंटा टीवी बचल.\nशुक्रवार के बाद, ओकरा 3.5 - 5 = -1.5 घंटा टीवी बचल.\nहर 30-मिनिट के एपिसोड 1/2 घंटा के होला.\nतइसे, E = -1.5/0.5 = -3 एपिसोड.\n#### -3\n"
