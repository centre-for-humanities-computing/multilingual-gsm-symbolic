question = "श्री तान ने अपना घर $400,000 में बेचा। उसने हस्तांतरण शुल्क का भुगतान किया जो बिक्री मूल्य का 3% है और साथ ही एक दलाली शुल्क का भी भुगतान किया जो बिक्री मूल्य का 5% है। यदि उसने घर के शेष लोन राशि के लिए $250,000 भी भुगतान किया, तो श्री तान की घर बेचने से शुद्ध प्राप्ति कितनी है?"
