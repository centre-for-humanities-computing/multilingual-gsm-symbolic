answer_annotated = "U {d2}da {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} ta {food} qutisi sotdi.\n{name} tomonidan sotilgan {food} qutilari umumiy soni {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2} ga teng.\n{name} {food} sotish uchun {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} ishladi.\nU {d1}da {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} ta {fruit} pirog qutisi sotdi.\n{name} tomonidan sotilgan {fruit} pirog qutilari umumiy soni {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1} ga teng.\nU {fruit} pirog sotish uchun {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} ishladi.\nShunday qilib, {name} ikki kun uchun {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} ishladi.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
