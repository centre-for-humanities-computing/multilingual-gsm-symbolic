question = "Sunny xayriya tadbiri uchun ingverli non va olma pirog sotmoqda. Shanbada, u 10 ta ingverli non qutisi va yakshanbaga nisbatan 4 ta kam olma pirog qutisi sotdi. Yakshanbada, u shanbaga nisbatan 5 ta ko'p ingverli non qutisi va 15 ta olma pirog qutisi sotdi. Agar ingverli non narxi $6 va olma pirog narxi $15 bo'lsa, Sunny ikki kun uchun qancha pul ishladi?"
answer = "U yakshanbada 10 + 5 = <<10+5=15>>15 ta ingverli non qutisi sotdi.\nSunny tomonidan sotilgan ingverli non qutilari umumiy soni 10 + 15 = <<10+15=25>>25 ga teng.\nSunny ingverli non sotish uchun 25*$6 = $<<25*6=150>>150 ishladi.\nU shanbada 15 - 4 = <<15-4=11>>11 ta olma pirog qutisi sotdi.\nSunny tomonidan sotilgan olma pirog qutilari umumiy soni 15 + 11 = <<15+11=26>>26 ga teng.\nU olma pirog sotish uchun 26*$15 = $<<26*15=390>>390 ishladi.\nShunday qilib, Sunny ikki kun uchun $150 + $390 = $<<150+390=540>>540 ishladi.\n#### 540\n"
