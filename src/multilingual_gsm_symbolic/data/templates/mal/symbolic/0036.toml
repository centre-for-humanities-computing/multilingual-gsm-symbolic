question = "തോള ബേക്കറി-ലേക്ക് പോയി വിവിധ തരം പാസ്ത്രികൾ വാങ്ങി. അവർ 3 ഡസൻ ഡോണട്സുകൾ വാങ്ങി, ഇതിന്റെ വില ഒരു ഡസന്റിന് $68 ആണ്, 2 ഡസൻ മിനി കപ്പ്കേക്കുകൾ വാങ്ങി, ഇതിന്റെ വില ഒരു ഡസന്റിന് $80 ആണ്, കൂടാതെ 6 ഡസൻ മിനി ചീസ്കേക്കുകൾ വാങ്ങി, ഇതിന്റെ വില ഒരു ഡസന്റിന് $55 ആണ്. ആകെ ചെലവ് എത്രയാണ്?"
answer = "ഡോണട്സുകൾ-യുടെ ആകെ തുക 3*$68 = $<<3*68=204>>204 ആയിരുന്നു.\nമിനി കപ്പ്കേക്കുകൾ-യുടെ ആകെ തുക 2*$80 = $<<2*80=160>>160 ആയിരുന്നു.\nമിനി ചീസ്കേക്കുകൾ-യുടെ ആകെ തുക 6*$55 = $<<6*55=330>>330 ആയിരുന്നു.\nഅതുകൊണ്ട് തോള പാസ്ത്രികൾ-ക്കായി അടച്ച ആകെ തുക $204 + $160 + $330 = $<<204+160+330=694>>694 ആണ്.\n#### 694\n"
