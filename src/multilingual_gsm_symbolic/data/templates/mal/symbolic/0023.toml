question = "മാർത്ത അവളുടെ 3 മരുമക്കൾക്കായി തണുപ്പുകാല വസ്ത്രങ്ങൾ തയ്യാറാക്കുന്നു. അവർ ത്രീജാതകർ ആയതുകൊണ്ട്, എല്ലാവർക്കും ഒരേ വലിപ്പമാണ്. അവർക്ക് ഓരോരുത്തർക്കും ഒരു തൊപ്പി, സ്കാർഫ്, സ്വെറ്റർ, കൈയുറ, കോലുകൾ നിർമ്മിക്കാൻ ആഗ്രഹിക്കുന്നു. ഒരു തൊപ്പി നിർമ്മിക്കാൻ 2 കമ്പിളി നൂൽ, ഒരു സ്കാർഫ്-ന് 4, ഒരു സ്വെറ്റർ-ന് 12, ഒരു ജോഡി കൈയുറ-ന് 1, ഒരു ജോഡി കോലുകൾ-ന് 2 വേണ്ടി വരുന്നു. എത്ര കമ്പിളി നൂൽ അവൾ വാങ്ങേണ്ടി വരും?"
answer = "ഓരോ കുട്ടിക്കും ഒരു പൂർണ്ണ വേഷത്തിന് 2 കമ്പിളി നൂൽ ഒരു തൊപ്പി-ന് + 4 കമ്പിളി നൂൽ ഒരു സ്കാർഫ്-ന് + 12 കമ്പിളി നൂൽ ഒരു സ്വെറ്റർ-ന് + 1 കമ്പിളി നൂൽ ഒരു ജോഡി കൈയുറ-ന് + 2 കമ്പിളി നൂൽ ഒരു ജോഡി കോലുകൾ-ന് = <<2+4+12+1+2=21>>21 കമ്പിളി നൂൽ വേണ്ടി വരും.\nഅതിനാൽ, അവളുടെ മരുമക്കൾക്ക് എല്ലാവർക്കും വേഷങ്ങൾ തയ്യാറാക്കാൻ, അവൾക്ക് 3*21 = <<3*21=63>>63 കമ്പിളി നൂൽ ആവശ്യമായി വരും.\n#### 63\n"
