question = "അമ്മച്ചി എല്ലാ ദിവസവും അവളുടെ ഇഷ്ടപ്പെട്ട നടത്ത പാതയിൽ 3 മൈൽ നടക്കുന്നു, അതിൽ 2 മൈൽ കടലത്തോരത്ത് നടക്കുന്നതും 1 മൈൽ വഴിയരികിൽ നടക്കുന്നതും ഉൾപ്പെടുന്നു. വഴിയരികിൽ, അമ്മച്ചി കടലത്തു നടക്കുന്നതിനേക്കാൾ രണ്ട് മടങ്ങ് വേഗതയിൽ നടക്കുന്നു. കടലത്തു നടക്കുന്നതിന് 40 മിനിറ്റ് സമയം ചെലവഴിക്കുന്നു എങ്കിൽ, ആകെ 3-മൈൽ നടത്തം പൂർത്തിയാക്കാൻ എത്ര മിനിറ്റ് എടുക്കും?"
answer = "കടലത്തു, അമ്മച്ചി 40 മിനിറ്റിൽ 2 മൈൽ നടക്കുന്നു, അതായത് 2/40 = 1/20 മൈൽ/മിനിറ്റ്.\nവഴിയരികിൽ, അവൾ മണൽത്തരിയിൽ നടക്കുമ്പോഴുള്ള വേഗതയുടെ രണ്ട് മടങ്ങ് വേഗതയിൽ നടക്കുന്നു, അതായത് 5*1/20 = 0.25 മൈൽ/മിനിറ്റ്.\nവഴിയരികിൽ 1 മൈൽ നടക്കാൻ എടുക്കുന്ന സമയം 1/0.25 = <<1/0.25=4>>4 മിനിറ്റ്.\nഅതുകൊണ്ട്, ആകെ അമ്മച്ചി തന്റെ ഇഷ്ട പാത നടക്കാൻ 40+4 = <<40+4=44>>44 മിനിറ്റ് എടുക്കുന്നു.\n#### 44\n"
