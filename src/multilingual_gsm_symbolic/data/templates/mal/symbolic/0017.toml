question_annotated = "{name,അമ്മച്ചി} എല്ലാ ദിവസവും അവളുടെ ഇഷ്ടപ്പെട്ട നടത്ത പാതയിൽ {n,3} {unit,മൈൽ} നടക്കുന്നു, അതിൽ {m,2} {unit,മൈൽ} കടലത്തോരത്ത് നടക്കുന്നതും {k,1} {unit,മൈൽ} വഴിയരികിൽ നടക്കുന്നതും ഉൾപ്പെടുന്നു. വഴിയരികിൽ, {name,അമ്മച്ചി} കടലത്തു നടക്കുന്നതിനേക്കാൾ {mult_txt,രണ്ട് മടങ്ങ്} വേഗതയിൽ നടക്കുന്നു. കടലത്തു നടക്കുന്നതിന് {t,40} മിനിറ്റ് സമയം ചെലവഴിക്കുന്നു എങ്കിൽ, ആകെ {n,3}-{unit, മൈൽ} നടത്തം പൂർത്തിയാക്കാൻ എത്ര മിനിറ്റ് എടുക്കും?\n\n#init:\n- name = sample(names_female)\n- unit = sample(length_lg)\n- mult_txt, mult_val = sample(multi_times)\n- $n = range(3, 60)\n- $m = range(2, 20)\n- $k = range(1, 20)\n- $t = range(40, 70)\n#conditions:\n- m + k == n\n- m < t\n- mult_val *m < t\n- divides(t, m)\n- is_int(k / (mult_val*m/t))\n#answer: t+(k/(mult_val*m/t))\n"
