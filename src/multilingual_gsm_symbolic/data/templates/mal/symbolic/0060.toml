question = "വാട്ട്സൺ ഒരു ദിവസവും 10-മണിക്കൂർ ഷിഫ്റ്റ് ചെയ്യുന്നു, ഒരു ആഴ്ചയിൽ അഞ്ച് ദിവസം. അവൻ ഒരു മണിക്കൂറിന് ₹10 സമ്പാദിക്കുന്നു, കമ്പനി നന്നായി പ്രവർത്തിക്കുകയാണെങ്കിൽ ഒരു ആഴ്ചയിൽ ₹300 ബോണസ് കൂടി ലഭിക്കുന്നു. കമ്പനി മുഴുവൻ മാസവും നന്നായി പ്രവർത്തിച്ചാൽ ഏപ്രിൽ ൽ വാട്ട്സൺ എത്ര പണം സമ്പാദിച്ചു?"
