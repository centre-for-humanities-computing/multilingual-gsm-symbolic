question = "എമിലി ഒരു മിനിറ്റിൽ 6 ചെമ്മീൻ തോടാക്കാൻ കഴിയും, 30 ചെമ്മീൻ 10 മിനിറ്റുകൾക്കുള്ളിൽ ഉലക്കാനും കഴിയും. 90 ചെമ്മീൻ തോടാനും ഉലക്കാനും അവൾക്ക് എത്ര സമയമെടുക്കും? എമിലി ഒരേസമയം തോടാനും ഉലക്കാനും കഴിയില്ല."
answer = "ആദ്യം എമിലി ചെമ്മീൻ തോടാൻ എത്ര സമയമെടുക്കും എന്ന് കണ്ടെത്തുക: 90 ചെമ്മീൻ / 6 ചെമ്മീൻ/മിനിറ്റ് = <<90/6=15>>15 മിനിറ്റ്\nഅടുത്തതായി ചെമ്മീൻ വേവിക്കാൻ അവൾക്ക് എത്ര ബാച്ചുകൾ വേണം എന്ന് കണ്ടെത്തുക: 90 ചെമ്മീൻ / 30 ചെമ്മീൻ/ബാച്ച് = <<90/30=3>>3 ബാച്ചുകൾ\nആകെ വേവിക്കാനെടുക്കുന്ന സമയം കണ്ടെത്താൻ ബാച്ചുകളുടെ എണ്ണത്തെ ബാച്ചിന് എടുക്കുന്ന സമയം കൊണ്ട് ഗുണിക്കുക: 3 ബാച്ചുകൾ * 10 മിനിറ്റ്/ബാച്ച് = <<3*10=30>>30 മിനിറ്റ്\nആകെ ചിലവാകുന്ന സമയം കണ്ടെത്താൻ തോടാനെടുക്കുന്ന സമയം കൂട്ടുക: 30 മിനിറ്റ് + 15 മിനിറ്റ് = <<30+15=45>>45 മിനിറ്റ്\n#### 45\n"
