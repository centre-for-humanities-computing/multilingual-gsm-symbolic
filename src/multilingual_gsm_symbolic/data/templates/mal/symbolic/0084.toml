question = "മരിയ ഒരു സ്റ്റോക്കിന്റെ 8 ഷെയറുകൾ ഓരോന്നിന് $8 വിലയ്ക്ക് വാങ്ങുന്നു. ആദ്യ വർഷം മരിയ അത് കൈവശം വെച്ചിരിക്കുമ്പോൾ സ്റ്റോക്ക് വില 50% വർദ്ധിക്കുന്നു, തുടർന്ന് രണ്ടാമത്തെ വർഷത്തിൽ 25% കുറയുന്നു. എല്ലാ മരിയ'ന്റെ ഷെയറുകളുടെയും അന്തിമ മൂല്യം എത്രയാണ്?"
