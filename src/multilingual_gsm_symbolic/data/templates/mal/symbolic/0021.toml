question = "ഫ്രാങ്കി ഓരോ രാത്രിയും വീട്ടുപണി പൂർത്തിയാക്കിയ ശേഷം ടിവി കാണുന്നു. തിങ്കൾ, ചൊവ്വ എന്ന ദിവസങ്ങളിൽ, അവൻ ഓരോ രാത്രിയും തന്റെ ഇഷ്ട ഷോവിന്റെ 1-മണിക്കൂർ എപ്പിസോഡ് കണ്ടു. ബുധൻ, അവൻ 30-മിനിറ്റ് ഷോവിന്റെ ചില എപ്പിസോഡുകൾ കണ്ടു. വ്യാഴം, അവൻ വീട്ടുപണി നേരത്തെ പൂർത്തിയാക്കി ഒരു 1-മണിക്കൂർ എപ്പിസോഡും ഒരു 30-മിനിറ്റ് ഷോയും കണ്ടു. വെള്ളി, അവൻ വൈകി ഉണർന്നു, അതിനാൽ അവൻ രണ്ട് 1-മണിക്കൂർ എപ്പിസോഡുകൾ കണ്ടു. ആകെ അവൻ 7 മണിക്കൂർ ടിവി കണ്ടെങ്കിൽ, ബുധൻ അവൻ എത്ര 30-മിനിറ്റ് എപ്പിസോഡുകൾ കണ്ടു?"
