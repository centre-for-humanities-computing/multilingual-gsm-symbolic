question = "ജാക്കി സ്വയം അവരുടെ നികുതി ചെയ്യാനോ അതോ ഒരു കണക്കൻ നിയമിക്കാനോ തീരുമാനിക്കാൻ ശ്രമിക്കുന്നു. അവർ സ്വയം ചെയ്താൽ, അവർക്ക് 3 മണിക്കൂർ കുറവ് ഫ്രീലാൻസ് ജോലി ചെയ്യാൻ സാധിക്കും, ₹35/മണിക്കൂർ നഷ്ടപ്പെട്ട വരുമാനം ഉണ്ടാകും. കണക്കൻ ₹90 ഈടാക്കുന്നു. കണക്കൻ നിയമിച്ചാൽ അവർക്ക് എത്ര കൂടുതൽ പണം ലഭിക്കും?"
