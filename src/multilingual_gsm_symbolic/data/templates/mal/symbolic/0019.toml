question = "60-ചോദ്യങ്ങളുള്ള ഒരു ക്വിസിൽ, 40% ചോദ്യങ്ങൾ എളുപ്പം ആണ്, മറ്റുള്ളവ സാധാരണ, കഠിനം ചോദ്യങ്ങളായി തുല്യമായി വിഭജിച്ചിരിക്കുന്നു. ഏറീസ് എളുപ്പം ചോദ്യങ്ങളിൽ 75% ഉറപ്പായി ലഭിക്കുകയും സാധാരണ, കഠിനം ചോദ്യങ്ങളിൽ പകുതി ശരിയായി ലഭിക്കുകയും ചെയ്താൽ, അവർക്ക് ഉറപ്പായി എത്ര പോയിന്റുകൾ ലഭിക്കും?"
answer = "സാധാരണ, കഠിനം ചോദ്യങ്ങൾ ക്വിസിലെ 100% - 40% = 60% ആണ്.\n60 ചോദ്യങ്ങളിൽ 40/100 = <<60*40/100=24>>24 എണ്ണം എളുപ്പം ചോദ്യങ്ങളുണ്ട്.\nആകെ 60 ചോദ്യങ്ങളിൽ 60/100 = <<60*60/100=36>>36 എണ്ണം സാധാരണ, കഠിനം ചോദ്യങ്ങളുണ്ട്.\nഏറീസ് എളുപ്പം ചോദ്യങ്ങളിൽ 75% ഉറപ്പായി ലഭിക്കുമെങ്കിൽ, അതായത് അവർക്ക് 24 ചോദ്യങ്ങളിൽ 75/100 = <<24*75/100=18>>18 പോയിന്റുകൾ ഉറപ്പാണ്.\nസാധാരണ, കഠിനം ചോദ്യങ്ങളിൽ നിന്ന്, അവർ പകുതി ശരിയായി ലഭിക്കുമെങ്കിൽ, അതായത് 36 ചോദ്യങ്ങളിൽ * 1/2 = <<36*1/2=18>>18 പോയിന്റുകൾ.\nഅതുകൊണ്ട്, അവർക്ക് ക്വിസിൽ 18 പോയിന്റുകൾ + 18 പോയിന്റുകൾ = <<18+18=36>>36 പോയിന്റുകൾ ഉറപ്പാണ്.\n#### 36\n"
