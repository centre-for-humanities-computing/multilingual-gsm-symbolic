question = "ഡീൻഡ്രേ കഴിഞ്ഞ തിങ്കളാഴ്ച 3 തൂണs പിടിച്ചു, പിടിച്ച ആദ്യത്തെ തൂണ ഭാരം 56 കിലോഗ്രാംs ആണ്, രണ്ടാമത്തെ തൂണ ഭാരം 46 കിലോഗ്രാംs ആണ്, ബാക്കി പിടിച്ച തൂണ ഭാരം 26 കിലോഗ്രാംs ആണ്. ഒരു കിലോഗ്രാം തൂണ വില $0.5 ആണെങ്കിൽ, എല്ലാ തൂണs മാർക്കറ്റിൽ വിറ്റ ശേഷം അവൻ എത്ര നേടും?"
answer = "ഡീൻഡ്രേ ആദ്യത്തെ തൂണൽ നിന്ന് 56*$0.5 = $<<56*0.5=28>>28 നേടും.\nരണ്ടാമത്തെ തൂണക്കായി അവൻ 46*$0.5 = $<<46*0.5=23>>23 നേടും.\nബാക്കിയുള്ള തൂണs 3-2 = <<3-2=1>>1 ആണ്. അവൻ ഓരോന്നിനും 26*$0.5 = $<<26*0.5=13>>13 നേടും. അതുകൊണ്ട് അവൻ നേടുന്നത് 1 * 13 = <<1*13>>=13\nഅതുകൊണ്ട്, എല്ലാ തൂണsക്കായി അവൻ നേടുന്ന ആകെ തുക $28 + $23 + $13= $<<28+23+13=64>>64 ആണ്.\n#### 64\n"
