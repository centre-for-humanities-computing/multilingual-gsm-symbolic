question = "ശ്രീ താൻ തന്റെ വീട് വിറ്റു $400,000 ക്ക്ക്. അദ്ദേഹം ട്രാൻസ്ഫർ ഫീസുകൾ നൽകി, അത് വിൽപ്പന വിലയുടെ 3% ആണ് കൂടാതെ ബ്രോക്കറേജ് ഫീസും നൽകി, അത് വിൽപ്പന വിലയുടെ 5% ആണ്. അദ്ദേഹം വീട് യുടെ ബാക്കി ലോൺ തുകയ്ക്ക് $250,000 കൂടി നൽകിയാൽ, ശ്രീ താൻ യുടെ വീട് വിൽക്കുന്നതിലൂടെയുള്ള നിവർത്തനം എത്രയാണ്?"
