question = "ജെറി ഒരു ആറ് വശമുള്ള ഡൈസ് ഉരുട്ടുന്നു. 3-ൽ കൂടുതലുള്ള സംഖ്യ ഉരുട്ടുന്നതിനേക്കാൾ, രണ്ട് സമ സംഖ്യകൾ തുടർച്ചയായി ഉരുട്ടുന്നതിന് എത്ര കൂടുതൽ സാധ്യതയുണ്ട് (ശതമാന പോയിന്റുകളിൽ പ്രകടിപ്പിച്ചാൽ)?"
answer = "ഡൈസിൽ 3-ൽ കൂടുതലുള്ള 3 സംഖ്യകളുണ്ട്, അതിനാൽ അവയിൽ ഒന്ന് ഉരുട്ടാനുള്ള സാധ്യത 3/6=50% ആണ്.\nഒരു സമ സംഖ്യ ഉരുട്ടാനുള്ള സാധ്യത 50% ആണ്, അതിനാൽ രണ്ട് തുടർച്ചയായി ഉരുട്ടാനുള്ള സാധ്യത 50% * 50% = 25% ആണ്.\nഈ രണ്ട് സാധ്യതകൾക്കിടയിലുള്ള വ്യത്യാസം 50% - 25% = 25% ആണ്.\n#### 25\n"
