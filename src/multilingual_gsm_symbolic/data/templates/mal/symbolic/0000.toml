question = "ബെന്നി ഒരു 10-അടി ശാർക്ക് കണ്ടു, അതിൽ 2 6-ഇഞ്ച് റീമോറകൾ പറ്റിപ്പിടിച്ചിരിക്കുന്നു. ശാർക്ക്യുടെ ശരീരത്തിന്റെ നീളത്തിന്റെ എത്ര ശതമാനമാണ് റീമോറകളുടെ ആകെ നീളം?"
