answer = "ഒരു ക്രോസ്‌വേഡ് പൾസ് പൂർത്തിയാക്കാൻ 10 മിനിറ്റ് എടുക്കും, അവർ 3 എണ്ണം പൂർത്തിയാക്കിയതിനാൽ മൊത്തം 10*3 = <<10*3=30>>30 മിനിറ്റ്\nഒരു സുഡോകു പൾസ് പൂർത്തിയാക്കാൻ 5 മിനിറ്റ് എടുക്കും, അവർ 8 എണ്ണം പൂർത്തിയാക്കിയതിനാൽ മൊത്തം 5*8 = <<5*8=40>>40 മിനിറ്റ്\nഅവർ ക്രോസ്‌വേഡ് പൾസ്-ൽ 30 മിനിറ്റും സുഡോകു പൾസ്-ൽ 40 മിനിറ്റും ചെലവഴിച്ചു, മൊത്തം 30+40 = <<30+40=70>>70 മിനിറ്റ്\n#### 70\n"
