instruction = '''താഴെ കൊടുത്തിരിക്കുന്ന ഗണിത പ്രശ്നം ഘട്ടം ഘട്ടമായി പരിഹരിക്കുക. നിങ്ങളുടെ അന്തിമ സംഖ്യാ ഉത്തരം (യൂണിറ്റുകൾ, കറൻസി ചിഹ്നങ്ങൾ, ശതമാന ചിഹ്നങ്ങൾ എന്നിവ ഇല്ലാതെ) \boxed{} ൽ എഴുതുക, ഉദാഹരണത്തിന്: \boxed{42}.'''
