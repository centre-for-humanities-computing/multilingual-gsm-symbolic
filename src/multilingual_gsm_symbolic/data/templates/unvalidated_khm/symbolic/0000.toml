question = "បេននី បានឃើញ 10-ជើង ត្រីឆ្លាម ជាមួយ 2 6-អ៊ីញ ត្រីរេម៉រ៉ា ជាប់នឹងវា។ រយៈទំហំភាគរយប៉ុន្មាននៃប្រវែងរាងកាយនៃ ត្រីឆ្លាម គឺជាប្រវែងសរុបនៃត្រីរេម៉រ៉ា?"
answer = "ដំបូង រកប្រវែងសរុបនៃត្រីរេម៉រ៉ាជាអ៊ីញ៖ 6 អ៊ីញ/ត្រីរេម៉រ៉ា * 2 ត្រីរេម៉រ៉ា = <<6*2=12>>12 អ៊ីញ។\nបន្ទាប់មក ចែកចំនួននោះនឹង 12 ដើម្បីបំប្លែងវាទៅជាជើង៖ 12 អ៊ីញ / 12 អ៊ីញ/ជើង = <<12/12=1>>1 ជើង។\nបន្ទាប់មក ចែកប្រវែងត្រីរេម៉រ៉ាសរុបជាជើងនឹងប្រវែងនៃ ត្រីឆ្លាម ហើយគុណនឹង 100% ដើម្បីបង្ហាញចម្លើយជាភាគរយ៖ 1 ជើង / 10 ជើង * 100% = 10%\n\n#### 10\n"
