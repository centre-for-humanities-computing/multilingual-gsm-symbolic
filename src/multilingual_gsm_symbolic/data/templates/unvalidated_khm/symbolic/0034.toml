question = "លោក តាន បានលក់ ផ្ទះ របស់គាត់ក្នុងតម្លៃ $400,000។ គាត់បានបង់ថ្លៃសេវា ការផ្ទេរ ដែលស្មើនឹង 3% នៃតម្លៃលក់ និងក៏បានបង់ថ្លៃសេវា កម្រៃជើងសារ ដែលគឺ 5% នៃតម្លៃលក់។ ប្រសិនបើគាត់ក៏បានបង់ $250,000 សម្រាប់ចំនួនបំណុលសល់នៃ ផ្ទះ នោះ តើប្រាក់ចំណូលសុទ្ធរបស់ លោក តាន ពីការលក់ ផ្ទះ គឺប៉ុន្មាន?"
answer = "លោក តាន បានបង់ $400,000*3/100 = <<400000*3/100=12000>>$12,000 សម្រាប់ថ្លៃសេវា ការផ្ទេរ។\nគាត់បានបង់ $400,000*5/100 = <<400000*5/100=20000>>$20,000 សម្រាប់ថ្លៃសេវា កម្រៃជើងសារ។\nដូចនេះ, លោក តាន បានបង់សរុប $12,000 + $20,000 + $250,000 = <<12000+20000+250000=282000>>$282,000 សម្រាប់ថ្លៃសេវា ការផ្ទេរ, កម្រៃជើងសារ, និងបំណុល។\nហេតុនេះ, ប្រាក់ចំណូលសុទ្ធរបស់ លោក តាន គឺ $400,000 - $282,000 = <<400000-282000=118000>>$118,000។\n#### 118000\n"
