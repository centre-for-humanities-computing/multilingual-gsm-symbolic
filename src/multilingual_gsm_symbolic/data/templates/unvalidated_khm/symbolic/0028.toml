answer = "ប្រសិនបើ 1/5 នៃសមត្ថភាពសរុបនៃ គ្រែ នៅ មន្ទីរពេទ្យ ត្រូវបានកាន់កាប់ មានន័យថា 1/5 * 1000 = <<1000*1/5=200>>200 គ្រែ ត្រូវបានប្រើប្រាស់ដោយអ្នកជំងឺ។\nចំនួន គ្រែ សរុបនៅក្នុង មន្ទីរពេទ្យ ដោយគ្មានការទទួលចូលថ្មីគឺ 1000 គ្រែ - 200 គ្រែ = <<1000-200=800>>800 គ្រែ។\nប្រសិនបើមានមនុស្ស 50 នាក់ត្រូវបានទទួលចូលរាល់ថ្ងៃ ចំនួនអ្នកជំងឺសរុបនៅក្នុង មន្ទីរពេទ្យ បន្ទាប់ពីមួយសប្តាហ៍គឺ 50 នាក់/ថ្ងៃ * 7 ថ្ងៃ/សប្តាហ៍ = 350 នាក់។\nបន្ទាប់ពី 2 សប្តាហ៍ ចំនួនអ្នកជំងឺសរុបដែលត្រូវបានទទួលចូលក្នុង មន្ទីរពេទ្យ គឺ 350 នាក់/សប្តាហ៍ * 2 សប្តាហ៍ = <<350*2=700>>700 នាក់ ដែលម្នាក់ៗប្រើប្រាស់ គ្រែ មួយ។\nប្រសិនបើមាន 800 គ្រែ ទំនេរនៅក្នុង មន្ទីរពេទ្យ មុនការទទួលចូលថ្មី ចំនួនសរុបត្រូវបានកាត់បន្ថយមកជា 800 គ្រែ - 700 គ្រែ = <<800-700=100>>100 គ្រែ ទំនេរ។\n#### 100\n"
