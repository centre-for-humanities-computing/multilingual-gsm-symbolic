question_annotated = "එක් {worker,ග්නෝම්} කෙනෙකුට {base,12} {unit,පවුන්ඩ්} ඛනිජ දිනකට {tool1,ඔහුගේ අත්} වලින් කැණිය හැක. ඔහුට {mult1_txt,දෙගුණයක්} තරම් කැණිය හැක {tool2,කාන්සා පික්ඇක්ස්} එකකින් සහ {mult2,50}% ක් වැඩිපුර {tool3,පොලි පික්ඇක්ස්} එකකින් {tool2,කාන්සා පික්ඇක්ස්} එකකට වඩා. {n,40} {worker,ග්නෝම්} දෙනෙක් {tool3,පොලි පික්ඇක්ස්} සමඟ {days,30} දින ඇති මාසයකදී {unit,පවුන්ඩ්} කොපමණ ඛනිජ කැණිය හැකිද?\n\n#init:\n- worker = sample([\"තක්කාල\", \"ගොබ්ලින්\", \"ග්නෝම්\", \"ට්‍රෝල්\"])\n- tool1 = sample([\"අත්\", \"මූලික ස්පූල්\", \"දැව පික්ඇක්ස්\"])\n- unit = sample([\"පවුන්ඩ්\", \"කිලෝ\"])\n- tool2 = sample([\"නිකල් පික්ඇක්ස්\", \"කාන්සා පික්ඇක්ස්\", \"රිදී පික්ඇක්ස්\"])\n- tool3 = sample([\"පොලි පික්ඇක්ස්\", \"වජ්‍ර පික්ඇක්ස්\", \"මිත්‍රිල් පික්ඇක්ස්\", \"ටයිටේනියම් පික්ඇක්ස්\"])\n- $base = range(5, 20)\n- mult1_txt, mult1_val = sample(multi_times)\n- $mult2 = range(30, 80, 5)\n- $n = range(20, 50)\n- $days = range(28, 32)\n\n#conditions:\n- is_int(mult2/100*base*mult1_val)\n- int(base * mult1_val * (1 + mult2/100) * n * days) < 15000\n\n#answer: int(base * mult1_val * (1 + mult2/100) * n * days)\n"
answer_annotated = "පළමුව {worker} කෙනෙකුට {tool2} එකකින් කොපමණ ඛනිජ කැණිය හැකිද යන්න සොයන්න: {base} {unit}/දින*{mult1_val}=<<{base}*{mult1_val}={base*mult1_val}>>{base*mult1_val} {unit}/දින\nඉන්පසු එම ප්‍රමාණය {100+mult2}% කින් ගුණ කර {tool3} එකකින් {worker} කෙනෙකුට කොපමණ කැණිය හැකිද යන්න සොයන්න: {base*mult1_val} {unit}/දින * {100+mult2}% = <<{base*mult1_val}*{100+mult2}*.01={int(base*mult1_val*(1+mult2/100))}>>{int(base*mult1_val*(1+mult2/100))} {unit}/දින\nඉන්පසු {tool3} එකකින් දිනකට එක් {worker} කෙනෙකුට කැණිය හැකි ප්‍රමාණය {worker} ගණනින් ගුණ කරන්න: {int(base*mult1_val*(1+mult2/100))} {unit}/දින/{worker} * {n} {worker} දෙනෙක් = <<{int(base*mult1_val*(1+mult2/100))}*{n}={int(base*mult1_val*(1+mult2/100)*n)}>>{int(base*mult1_val*(1+mult2/100)*n)} {unit}/දින\nඉන්පසු දෛනික ඛනිජ ප්‍රමාණය දින ගණනින් ගුණ කර මාසයකදී කැණුනු මුළු ඛනිජ ප්‍රමාණය සොයන්න: {int(base*mult1_val*(1+mult2/100)*n)} {unit}/දින * {days} දින = <<{int(base*mult1_val*(1+mult2/100)*n)}*{days}={int(base*mult1_val*(1+mult2/100)*n*days)}>>{int(base*mult1_val*(1+mult2/100)*n*days)} {unit}/දින\n#### {int(base*mult1_val*(1+mult2/100)*n*days)}\n"
