question = "එක් ග්නෝම් කෙනෙකුට 12 පවුන්ඩ් ඛනිජ දිනකට ඔහුගේ අත් වලින් කැණිය හැක. ඔහුට දෙගුණයක් තරම් කැණිය හැක කාන්සා පික්ඇක්ස් එකකින් සහ 50% ක් වැඩිපුර පොලි පික්ඇක්ස් එකකින් කාන්සා පික්ඇක්ස් එකකට වඩා. 40 ග්නෝම් දෙනෙක් පොලි පික්ඇක්ස් සමඟ 30 දින ඇති මාසයකදී පවුන්ඩ් කොපමණ ඛනිජ කැණිය හැකිද?"
answer = "පළමුව ග්නෝම් කෙනෙකුට කාන්සා පික්ඇක්ස් එකකින් කොපමණ ඛනිජ කැණිය හැකිද යන්න සොයන්න: 12 පවුන්ඩ්/දින*5=<<12*5=60>>60 පවුන්ඩ්/දින\nඉන්පසු එම ප්‍රමාණය 150% කින් ගුණ කර පොලි පික්ඇක්ස් එකකින් ග්නෝම් කෙනෙකුට කොපමණ කැණිය හැකිද යන්න සොයන්න: 60 පවුන්ඩ්/දින * 150% = <<60*150*.01=90>>90 පවුන්ඩ්/දින\nඉන්පසු පොලි පික්ඇක්ස් එකකින් දිනකට එක් ග්නෝම් කෙනෙකුට කැණිය හැකි ප්‍රමාණය ග්නෝම් ගණනින් ගුණ කරන්න: 90 පවුන්ඩ්/දින/ග්නෝම් * 40 ග්නෝම් දෙනෙක් = <<90*40=3600>>3600 පවුන්ඩ්/දින\nඉන්පසු දෛනික ඛනිජ ප්‍රමාණය දින ගණනින් ගුණ කර මාසයකදී කැණුනු මුළු ඛනිජ ප්‍රමාණය සොයන්න: 3600 පවුන්ඩ්/දින * 30 දින = <<3600*30=108000>>108,000 පවුන්ඩ්/දින\n#### 108000\n"
