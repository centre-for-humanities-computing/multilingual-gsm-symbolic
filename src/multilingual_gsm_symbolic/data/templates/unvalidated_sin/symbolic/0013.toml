question = "මැරී විශේෂයෙන්ම උනන්දුවක් දක්වන උද්භිද කෘෂිකාරියකි. ඊයේ, ඇයට ඇයට කැමති ශාක වෙළඳසැලකින් 18 නව පෝච්චි ශාක ලැබුණි. ඇයට දැනටමත් ඇයගේ විශාල ගම්බද නිවසේ ඇති 40 කවුළු ගඩෝල් වලින් එකක් එකකට 2 පෝච්චි ශාක තිබේ. දානමය හිතකරු වූ ඇය තීරණය කළේ හෙට ඇයගේ මිතුරන් සහ පවුලේ අයට කවුළු ගඩෝල් එකක් එකකින් 1 පෝච්චි ශාක ප්‍රමාණයක් ලබා දීමට බවයි. මැරී සතුව ඉතිරි වන පෝච්චි ශාක ගණන කොපමණද?"
answer = "ඊයේ, ශාක ලබා ගැනීමට පෙර, මැරී සතුව 2*40 = <<2*40=80>>80 පෝච්චි ශාක තිබුණි\nතවත් 18 ශාක ලැබීමෙන් පසු, ඇය සතුව මුළු 80 + 18 = <<80+18=98>>98 පෝච්චි ශාක තිබුණි\nහෙට, මැරීගේ ශාක ප්‍රදානය 40*1 = <<40*1=40>>40 පෝච්චි ශාක වේ.\nඑබැවින් ඇය සතුව ඉතිරි වන්නේ 98 - 40 = <<98-40=58>>58 පෝච්චි ශාකයි.\n#### 58\n"
