question = "Nate ruokkii karjaansa heinällä. Jokainen vuohi tarvitsee 5 kilogrammaa, ja jokainen llama tarvitsee 3 kilogrammaa vähemmän kuin kaksi kertaa se määrä, jonka jokainen vuohi tarvitsee. Jos siellä on 15 vuohia ja 12 llamaa, kuinka monta kilogrammaa heinää Nate tarvitsee?"
