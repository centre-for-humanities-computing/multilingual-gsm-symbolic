question = "Sairaalan kapasiteetti on 1000 vuodesta, joista 1/5 on käytössä. Koronaviruspurkauksen vuoksi 50 potilasta otetaan sairaalaan päivittäin. Laske sairaalan vapaiden vuoteiden kokonaismäärä 2 viikon kuluttua."
