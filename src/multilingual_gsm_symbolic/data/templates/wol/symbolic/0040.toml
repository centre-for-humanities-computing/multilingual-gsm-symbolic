question = "Aminata dem ci wetu géej ngir fés. Ñaayam ñu ko joxe $15 ngir sànni lu mu bëgg. Ci dukaŋu xel, taffy bi nekk ci sàtt ngir \"Sànni 1 pon ci $3 ci pon, jot 1 pon 1/2 wàññi.\" Mu jël 4 pon. Mu sànni itam benn xët wu am yëf yu bari ci géej ci $1.5 ak 4 magnet yeneen $0.25 ci benn. Ñaata la aminata am na ci des?"
answer = "Aminata dafay sànni 1 pon ci $3 te jot 1 pon 1/2 wàññi. Kon 1/2 wàññi ci 1 pon mooy $3*1/2 = $1.5. Li des ci 2 pon du am wàññi te am na 2*$3 = $6, kon yëpp mooy $3+$3/2+$6=$21/2\n4 magnet ci $0.25 ci benn mooy 4*0.25=$<<4*0.25=1>>1\nBu nga boolee yëpp lu mu sànni, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nAm na $15 te sànni $13 kon am na $15-$13 = $<<15-13=2>>2 ci des\n#### 2\n"
