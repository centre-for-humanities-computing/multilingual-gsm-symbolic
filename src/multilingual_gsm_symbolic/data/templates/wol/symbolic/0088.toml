question = "Dana mën na yéeg ñeent yoon gën a gaaw ni mu dëgër, waaye mën na yëg ci gaaw bu benn ci ñaari gën a gaaw ni mu yéeg. Su fekkee mën na yëg ci 3 mil ci waxtu, ñata mil la mën a yégg ci juroom-ñeent waxtu su fekkee mu jël benn ci ñett ci waxtu gi mu yéeg te ñaari ci ñett ci waxtu gi mu dëgër?"
answer = "Su fekkee Dana mën na yëg ci benn ci ñaari gaaw bi mu mën a yéeg, kon mën na yéeg ci 3*5/3=<<3*5/3=5>>5 mil ci waxtu.\nTe ndaxte mën na yéeg ci gaaw bu ñeent yoon gën a gaaw ni mu dëgër, loolu dafay tekki mu mën na dëgër ci 5/5=1 mil ci waxtu.\nSu fekkee ñaari ci ñett ci waxtu gi ñu jël ngir dëgër, kon mu dëgër ci 10*3/5=<<10*3/5=6>>6 waxtu.\nSu fekkee benn ci ñett ci waxtu gi ñu jël ngir yéeg, kon mu yéeg ci 10-6=<<10-6=6>>6 waxtu.\nKon, mu yéeg ci 6 waxtu ci 5 mil ci waxtu, walla 6*5=<<6*5=30>>30 mil.\nMu dëgër ci 6 waxtu ci 1 mil ci waxtu, walla 6*1=<<6*1=6>>6 mil.\nKon, ci yoon wi, mu yégg 30+6=<<30+6=36>>36 mil.\n#### 36\n"
