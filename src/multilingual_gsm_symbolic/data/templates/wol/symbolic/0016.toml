question = "Sunny dafa wër mbóy ak paam mbóy ngir ab doxalin. Ci Dimasab, mu wër 10 boite yu mbóy ak 4 boite yu gën a néew yu paam mbóy, li mu wër ci Dimasun. Ci Dimasun, mu wër 5 boite yu gën a bare yu mbóy, li mu wër ci Dimasab ak 15 boite yu paam mbóy. Su mbóy bi amee $6 te paam mbóy bi amee $15, lan la Sunny am ngir ñaari bés?"
