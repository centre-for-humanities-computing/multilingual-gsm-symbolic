answer_annotated = "Mu wër {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} boite yu {food} ci {d2}.\nLimu boite yu {food} yi {name} wër ñooy {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} am {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} ngir wër {food}.\nMu wër {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} boite yu {fruit} mbóy ci {d1}.\nLimu boite yu {fruit} mbóy yi {name} wër ñooy {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nMu am {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} ngir wër {fruit} mbóy.\nKon, {name} am {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} ngir ñaari bés.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
