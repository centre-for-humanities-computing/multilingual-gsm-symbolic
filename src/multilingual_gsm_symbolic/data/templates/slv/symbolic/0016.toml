question = "Sunny prodaja pipernik in jabolko pito za dobrodelno akcijo. V sobota, je prodal 10 škatel pipernik in 4 manj škatel jabolko pite kot v nedelja. V nedelja, je prodal 5 več škatel pipernik kot v sobota in 15 škatel jabolko pite. Če pipernik stane $6 in jabolko pita stane $15, koliko je Sunny zaslužil v dveh dneh?"
