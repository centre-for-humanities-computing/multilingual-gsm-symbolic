question = "Frankie gleda televizijo po tem, ko vsako noč konča svojo domačo nalogo. V Ponedeljek in Torek je gledal 1-urno epizodo svoje najljubše oddaje vsako noč. V Sreda je gledal nekaj epizod 30-minutne oddaje. V Četrtek je zgodaj končal domačo nalogo in gledal 1-urno epizodo ter 30-minutno oddajo. V Petek je lahko ostal buden pozno, zato je gledal dve 1-urni epizodi. Če je gledal 7 ur televizije v celoti, koliko 30-minutnih epizod je gledal v Sreda?"
