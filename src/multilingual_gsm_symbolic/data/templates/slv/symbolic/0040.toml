question_annotated = "{name,Sara} je odšla na morje na počitnice. Njeni starši so ji dali ${total,15} da kupi, kar je želela. V suvenirski trgovini je bil taffy na akciji za \"Kupi {n1,1} funt po ${p1,3} na funt, dobi {n2,1} funt {discount,1/2} popusta.\" Vzela je {n12,4} funtov. Kupila je tudi mešano vrečko školjk za ${p2,1.5} in {n3,4} magnetov, ki so bili ${p3,0.25} kos. Koliko denarja ima {name,Sara} še?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} kupuje {n1} funt za ${p1} in dobi {n2} funt {discount} popusta. Torej {discount} popusta na {n2} funt je ${p1}*{discount} = ${float(n2*discount*p1)}. Preostalih {n12-n1-n2} funtov nima popusta in stane {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}, torej skupaj je ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} magnetov po ${p3} kos je {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nKo sešteješ vse njene nakupke, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nImela je ${total} in zapravila ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} tako da je imela ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} ostalo\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
