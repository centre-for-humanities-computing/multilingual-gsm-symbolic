question = "Sara je odšla na morje na počitnice. Njeni starši so ji dali $15 da kupi, kar je želela. V suvenirski trgovini je bil taffy na akciji za \"Kupi 1 funt po $3 na funt, dobi 1 funt 1/2 popusta.\" Vzela je 4 funtov. Kupila je tudi mešano vrečko školjk za $1.5 in 4 magnetov, ki so bili $0.25 kos. Koliko denarja ima Sara še?"
answer = "Sara kupuje 1 funt za $3 in dobi 1 funt 1/2 popusta. Torej 1/2 popusta na 1 funt je $3*1/2 = $1.5. Preostalih 2 funtov nima popusta in stane 2*$3 = $6, torej skupaj je $3+$3/2+$6=$21/2\n4 magnetov po $0.25 kos je 4*0.25=$<<4*0.25=1>>1\nKo sešteješ vse njene nakupke, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nImela je $15 in zapravila $13 tako da je imela $15-$13 = $<<15-13=2>>2 ostalo\n#### 2\n"
