question = "Dana ina waawi reende laabi nayi saka o yaha, kono ina waawi dummba e yaawre nde feccere saka o reende. So o ina waawi dummba e 3 mil e wakti, no foti mil o waawi yaade e jeegom wakti so o waɗata go'o e tati e wakti o reende kadi ɗiɗi e tati e wakti o yahaade?"
answer = "So Dana ina waawi dummba e feccere yaawre nde o reende, kono o ina waawi reende e 3*5/3=<<3*5/3=5>>5 mil e wakti.\nKono sabu o ina waawi reende e yaawre nde laabi nayi saka o yaha, ɗum firti o ina waawi yaha e 5/5=1 mil e wakti.\nSo ɗiɗi e tati e wakti o waɗii yahaade, kono o yaha e 6*3/5=<<6*3/5=18/5>>18/5 wakti.\nSo go'o e tati e wakti o waɗii reende, kono o reende e 6-18/5=<<6-18/5=18/5>>18/5 wakti.\nNden, o reende e 18/5 wakti e 5 mil e wakti, walla 18/5*5=<<18/5*5=18>>18 mil.\nO yaha e 18/5 wakti e 1 mil e wakti, walla 18/5*1=<<18/5*1=18/5>>18/5 mil.\nNden, fof, o yaadi 18+18/5=<<18+18/5=21>>21 mil.\n#### 21\n"
