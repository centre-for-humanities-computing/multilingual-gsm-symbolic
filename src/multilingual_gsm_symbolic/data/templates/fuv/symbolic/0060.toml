question = "Watson waɗa shift 10-waktuuji kala ngal, jowi ngal e juma'a. O heɓi $10 fii waktuuji, o heɓi kadi $300 bonus kala juma'a so kumpanii waɗii ko ɓuri. Ko ɗaɓɓi kuuɗe Watson heɓii e Awril so kumpanii waɗii ko ɓuri e nder wattu fof?"
