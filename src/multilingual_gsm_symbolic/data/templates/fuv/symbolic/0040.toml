question_annotated = "{name,Sally} ya yahdi e baaɗo ngam jaawo. Baabaa makko en mbiyii ma ${total,15} ngam uɓɓude ko o yiɗi. E nder dukaana ƴaƴaaji, taffy ina jogii dow ƴeewndo \"Uɓɓu {n1,1} pound e ${p1,3} e pound fof, heɓ {n2,1} pound {discount,1/2} wulde.\" O ƴetti {n12,4} pound. O uɓɓi pottal ɗaɗɗi baaɗo e ${p2,1.5} e {n3,4} magnets ɗe ɗe ko ${p3,0.25} fof. Ko ɗoon heddii e {name,Sally}?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} ina uɓɓi {n1} pound e ${p1} o heɓi {n2} pound {discount} wulde. Nden {discount} wulde e {n2} pound ko ${p1}*{discount} = ${float(n2*discount*p1)}. Ɓurɗe {n12-n1-n2} pound ɗee alaa ƴeewndo e ina ɗaɓɓi {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}, ɗum waɗi ɗoon ko ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} magnets e ${p3} fof ko {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nSo a ƴetti ɗe fof ko o uɓɓi, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nO jogii ${total} o uɓɓi ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} ɗum waɗi o jogii ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} heddii\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
