question = "Sally ya yahdi e baaɗo ngam jaawo. Baabaa makko en mbiyii ma $15 ngam uɓɓude ko o yiɗi. E nder dukaana ƴaƴaaji, taffy ina jogii dow ƴeewndo \"Uɓɓu 1 pound e $3 e pound fof, heɓ 1 pound 1/2 wulde.\" O ƴetti 4 pound. O uɓɓi pottal ɗaɗɗi baaɗo e $1.5 e 4 magnets ɗe ɗe ko $0.25 fof. Ko ɗoon heddii e Sally?"
answer = "Sally ina uɓɓi 1 pound e $3 o heɓi 1 pound 1/2 wulde. Nden 1/2 wulde e 1 pound ko $3*1/2 = $1.5. Ɓurɗe 2 pound ɗee alaa ƴeewndo e ina ɗaɓɓi 2*$3 = $6, ɗum waɗi ɗoon ko $3+$3/2+$6=$21/2\n4 magnets e $0.25 fof ko 4*0.25=$<<4*0.25=1>>1\nSo a ƴetti ɗe fof ko o uɓɓi, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nO jogii $15 o uɓɓi $13 ɗum waɗi o jogii $15-$13 = $<<15-13=2>>2 heddii\n#### 2\n"
