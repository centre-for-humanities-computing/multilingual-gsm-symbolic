answer_annotated = "O reedi {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} boksii {food} e {d2}.\nLimoore boksii {food} ɗe {name} reedi ko {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} heɓi {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} ngam reende {food}.\nO reedi {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} boksii {fruit} paya e {d1}.\nLimoore boksii {fruit} paya ɗe {name} reedi ko {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nO heɓi {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} ngam reende {fruit} paya.\nSo, {name} heɓi {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} ngam ñalawma ɗiɗi.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
