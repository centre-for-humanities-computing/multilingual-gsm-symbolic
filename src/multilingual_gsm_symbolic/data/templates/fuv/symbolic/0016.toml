question = "Sunny ina reende bawol ginge e pomo paya ngam heɓde kuɗi. E Asabar, o reedi 10 boksii bawol ginge e 4 boksii pomo paya ɓura e Lahadi. E Lahadi, o reedi 5 boksii bawol ginge ɓuri e Asabar e 15 boksii pomo paya. So bawol ginge ina hokki ₦6 e pomo paya ina hokki ₦15, ko ɗum Sunny heɓi ngam ñalawma ɗiɗi?"
answer = "O reedi 10 + 5 = <<10+5=15>>15 boksii bawol ginge e Lahadi.\nLimoore boksii bawol ginge ɗe Sunny reedi ko 10 + 15 = <<10+15=25>>25.\nSunny heɓi 25*₦6 = ₦<<25*6=150>>150 ngam reende bawol ginge.\nO reedi 15 - 4 = <<15-4=11>>11 boksii pomo paya e Asabar.\nLimoore boksii pomo paya ɗe Sunny reedi ko 15 + 11 = <<15+11=26>>26.\nO heɓi 26*₦15 = ₦<<26*15=390>>390 ngam reende pomo paya.\nSo, Sunny heɓi ₦150 + ₦390 = ₦<<150+390=540>>540 ngam ñalawma ɗiɗi.\n#### 540\n"
