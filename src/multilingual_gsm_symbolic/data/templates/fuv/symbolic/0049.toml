question = "John nana mbaydi nder 3 ɓaɓɓe ceertuɗe. Gadano ɗiɗi ɗii ina woodi 200 dooɓe kala, te ko ɓaɗo ɗoon ina mawii 60% ɓurde ɗiɗi ɗii fota. O nana mbaydi 3 jeegoo e wikkendi kala, te o moƴƴira ₦0.4 e kala nana e kala dooɓe. Ko hono kadi o moƴƴa e wikkendi?"
