question = "Martha ina nanataa ɗuuɗal ɓamtaare ngam ɓiɓɓe makko 3. Ɓe ko tati-ɓiɓɓe, ɗum waɗi ɓe fof ina ɗon ɓura gootum. O yiɗi waɗde mbaadi, sarf, sweeter, mbaadi ɓerɗe, e sok ngam ɓiɗɗo kala. Ina ƴaɓa 2 ɓerɗe ɓamtaare ngam waɗde mbaadi, 4 ngam sarf, 12 ngam sweeter, 1 ngam mbaadi ɓerɗe ɗiɗi, e 2 ngam sok ɗiɗi. Ko ɗuuɗe ɓerɗe ɓamtaare o ɗaɓɓataa ɓamtaade?"
