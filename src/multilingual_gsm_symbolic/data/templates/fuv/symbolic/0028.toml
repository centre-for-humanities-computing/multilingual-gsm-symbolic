answer_annotated = "So {frac} e nder hollirde {facility} {item} ɗe reendi, ɗum firti ko {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} ɗe ɓernde ɗe ɗon huutora.\nLimoore {item} ɗe ɗon e nder {facility} tawa mbaylii ɗe keɓaama ko {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}.\nSo {daily} ɓernde ɓe keɓaama kala jemma, limoore ɓernde ɗe ɗon e nder {facility} caggal juma'a gooto ko {daily} ɓernde/jemma * 7 jemma/juma'a = {daily*7} ɓernde.\nCaggal {period} jamaanu, limoore ɓernde ɓe keɓaama e nder {facility} ko {daily*7} ɓernde/juma'a * {period} jamaanu = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} ɓernde, ɓe kala ɗon huutora {item} gooto.\nSo ɗon {total-int(total*frac)} {item} fotaaki ɗon e nder {facility} haa ɓee keɓaama, limoore ɗum ustata haa {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item} fotaaki.\n#### {total - (total * frac + daily * period * 7)}\n"
