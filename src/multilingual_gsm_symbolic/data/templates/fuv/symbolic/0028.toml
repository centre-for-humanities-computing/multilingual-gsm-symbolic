question = "Asibiti ɗon jogii hollirde 1000 leɗɗe tawa 1/5 ɗe reendi. Sabu hakkunde coronavirus, 50 ɓernde ɓe keɓaama e nder asibiti kala jemma. Hiiso limoore leɗɗe fotaaki ɗe ɗon e nder asibiti caggal 2 jamaanu."
answer = "So 1/5 e nder hollirde asibiti leɗɗe ɗe reendi, ɗum firti ko 1/5 * 1000 = <<1000*1/5=200>>200 leɗɗe ɗe ɓernde ɗe ɗon huutora.\nLimoore leɗɗe ɗe ɗon e nder asibiti tawa mbaylii ɗe keɓaama ko 1000 leɗɗe - 200 leɗɗe = <<1000-200=800>>800 leɗɗe.\nSo 50 ɓernde ɓe keɓaama kala jemma, limoore ɓernde ɗe ɗon e nder asibiti caggal juma'a gooto ko 50 ɓernde/jemma * 7 jemma/juma'a = 350 ɓernde.\nCaggal 2 jamaanu, limoore ɓernde ɓe keɓaama e nder asibiti ko 350 ɓernde/juma'a * 2 jamaanu = <<350*2=700>>700 ɓernde, ɓe kala ɗon huutora leɗɗe gooto.\nSo ɗon 800 leɗɗe fotaaki ɗon e nder asibiti haa ɓee keɓaama, limoore ɗum ustata haa 800 leɗɗe - 700 leɗɗe = <<800-700=100>>100 leɗɗe fotaaki.\n#### 100\n"
