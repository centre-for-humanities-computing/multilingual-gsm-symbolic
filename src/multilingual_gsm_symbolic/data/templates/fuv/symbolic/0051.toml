question = "Artie woodi gite leɓɓe e Sukar Mbuɗi. O ƴeeta sati tati leɓɓe ɗe: leɓɓe ɓale, leɓɓe ɓeeri e leɓɓe bambal. O ƴeeta ɗum ɗoon leɓɓe ɓale e $2.74 e kala koƴe, leɓɓe ɓeeri e $1.87 e kala koƴe e leɓɓe bambal e $2.12 e kala koƴe. Artie alaa waylu ɗoon, ɗum waɗi o yaltinay ɗoon fof haa $ ɓurɗo ɓaddeede. So Artie ƴeetii 12 koƴe leɓɓe ɓale, 9 koƴe leɓɓe ɓeeri e 17 koƴe leɓɓe bambal, no o heɓat?"
