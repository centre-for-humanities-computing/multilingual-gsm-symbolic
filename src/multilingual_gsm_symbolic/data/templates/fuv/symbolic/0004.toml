question = "Garrett ina waɗa popcorn ngam mbaɓɓe. Nde kaɓe mbaɗe ɗe ɓuuɓi, mbaɗe ɗe fuɗɗii ɓuuɓude ɓurɗe yaawde. 20 ɓuuɓii nder 30 sekond arande ɓuuɓol, caggal ɗuum tati yamre ɗoon nder 30 sekond ɗiɗaɓal. Mbaɗe ɗe ɓeydi haa nayi yamre yaawol ɓuuɓol arandel nder 30 sekond tataɓal, kono nder 30 sekond ɓaawo, ɓuuɓol ɓeydi haa hakkunde ɗiɗi yaawol ɓaawo 30 sekond. Caggal nde Garrett ittii kaɓe o e ɓuuɓal, hakkunde nayi limoore mbaɗe ɗe ɓuuɓi nder 30 sekond ɓaawo ɓuuɓii kadi sabu ɓuuɓal ɓaawo. Ko hono mbaydi popcorn Garrett haani yi'a?"
