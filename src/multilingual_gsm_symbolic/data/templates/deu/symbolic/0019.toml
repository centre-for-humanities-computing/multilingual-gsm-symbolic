question = "In einem Quiz mit 60 Fragen sind 40% der Fragen leichten und der Rest ist gleichmäßig auf mittelschweren und schweren Fragen verteilt. Wenn Aries sicher ist, 75% der leichten Fragen richtig zu beantworten und hälfte der mittelschweren und schweren Fragen korrekt zu beantworten, wie viele Punkte wird sie sicher bekommen?"
