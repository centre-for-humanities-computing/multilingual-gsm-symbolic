question = "Ein Landwirt kauft Futter für seine Pferde. Er kauft verschiedene Arten von Heus, Hafer, Möhren und Zuckerwürfel. Da Zuckerwürfel eine seltene Leckerei sind, kauft er nur zwei 1-Pfund-Kisten für den ganzen Stall. Er möchte nur genug Möhren kaufen, um die Pferde zu füttern, solange das Gemüse frisch ist, also kauft er vier 12-Pfund-Säcke. Heus ist der Hauptbestandteil der Ernährung der Pferde, also kauft er zweiundvierzig 75-Pfund-Ballen. Hafer ist ein Grundnahrungsmittel zur Ergänzung des Heus, also kauft er zwanzig 65-Pfund-Säcke. Wenn sein Hoflaster 2250 Pfund auf einmal tragen kann, wie viele Fahrten braucht der Landwirt, um das ganze Futter zu transportieren?"
