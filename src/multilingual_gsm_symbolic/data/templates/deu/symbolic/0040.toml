question = "Sally fuhr in den Urlaub an die Küste. Ihre Eltern gaben ihr $15, damit sie kaufen konnte, was sie wollte. Im Kiosk wurde Taffy angeboten mit „Kaufe 1 Pfund für $3 pro Pfund, erhalte 1 Pfund zum 1/2 Preis.“ Sie nahm 4 Pfund. Sie kaufte auch eine gemischte Tüte mit Muschelschalen für $1,5 und 4 Magnete, die $0,25 pro Stück kosteten. Wie viel Geld hat Sally übrig?"
answer = "Sally kauft 1 Pfund für $3 und erhält 1 Pfund zum 1/2 Preis. Also sind 1/2 des Preises von 1 Pfund $3*1/2 = $1,5. Der Rest von 2 Pfund hat keinen Rabatt und kostet 2*$3 = $6, also beträgt der Gesamtpreis $3+$3/2+$6=$21/2\n4 Magnete zu je $0,25 sind 4*0,25=$<<4*0,25=1>>1\nWenn man alle ihre Einkäufe zusammenzählt, $21/2+$1,5+$1 = $<<21/2+1,5+1=13>>13\nSie hatte $15 und gab $13 aus, also hat sie $15-$13 = $<<15-13=2>>2 übrig\n#### 2\n"
