question_annotated = "{name,Sally} fuhr in den Urlaub an die Küste. Ihre Eltern gaben ihr ${total,15}, damit sie kaufen konnte, was sie wollte. Im Kiosk wurde Taffy angeboten mit „Kaufe {n1,1} Pfund für ${p1,3} pro Pfund, erhalte {n2,1} Pfund zum {discount,1/2} Preis.“ Sie nahm {n12,4} Pfund. Sie kaufte auch eine gemischte Tüte mit Muschelschalen für ${p2,1.5} und {n3,4} Magnete, die ${p3,0.25} pro Stück kosteten. Wie viel Geld hat {name,Sally} übrig?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} kauft {n1} Pfund für ${p1} und erhält {n2} Pfund zum {discount} Preis. Also sind {discount} des Preises von {n2} Pfund ${p1}*{discount} = ${float(n2*discount*p1)}. Der Rest von {n12-n1-n2} Pfund hat keinen Rabatt und kostet {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}, also beträgt der Gesamtpreis ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} Magnete zu je ${p3} sind {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nWenn man alle ihre Einkäufe zusammenzählt, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nSie hatte ${total} und gab ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} aus, also hat sie ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} übrig\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
