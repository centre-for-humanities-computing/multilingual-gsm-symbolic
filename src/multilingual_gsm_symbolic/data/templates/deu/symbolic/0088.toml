question = "Dana kann viermal schneller laufen als sie gehen kann, aber sie kann mit einer Geschwindigkeit hüpfen, die hälfte so schnell ist wie die, mit der sie laufen kann. Wenn sie mit 3 km pro Stunde hüpfen kann, wie viele km kann sie in sechs Stunden zurücklegen, wenn sie ein drittel der Zeit zum Laufen und zwei drittel der Zeit zum Gehen verwendet?"
answer = "Wenn Dana mit hälfte der Geschwindigkeit hüpfen kann, mit der sie laufen kann, dann kann sie mit 3*3/2=<<3*3/2=9/2>>4,5 km pro Stunde laufen.\nUnd da sie mit einer Geschwindigkeit laufen kann, die viermal so schnell ist wie die, mit der sie gehen kann, bedeutet das, dass sie mit 9/2/4=1,125 km pro Stunde gehen kann.\nWenn zwei drittel der Zeit zum Gehen verwendet werden, dann geht sie 6*2/3=<<6*2/3=4>>4 Stunden.\nWenn ein drittel der Zeit zum Laufen verwendet wird, dann läuft sie 6-4=<<6-4=4>>4 Stunden.\nSomit läuft sie 4 Stunden mit 9/2 km pro Stunde, also 4*9/2=<<4*9/2=18>>18 km.\nSie geht 4 Stunden mit 1,125 km pro Stunde, also 4*1,125=<<4*1,125=9/2>>9/2 km.\nSomit legt sie insgesamt 18+9/2=<<18+9/2=22>>22 km zurück.\n#### 22\n"
