question = "Ein Krankenhaus hat eine Kapazität von 1000 Betten, wovon 1/5 belegt sind. Aufgrund des Coronavirus-Ausbruchs werden täglich 50 Patienten ins Krankenhaus eingeliefert. Berechne die Gesamtzahl der freien Betten im Krankenhaus nach 2 Wochen."
answer = "Wenn 1/5 der Gesamtkapazität der Krankenhaus Betten belegt ist, bedeutet dies, dass 1/5 * 1000 = <<1000*1/5=200>>200 Betten von Patienten genutzt werden.\nDie Gesamtzahl der Betten im Krankenhaus ohne neue Einlieferungen beträgt 1000 Betten - 200 Betten = <<1000-200=800>>800 Betten.\nWenn täglich 50 Personen eingeliefert werden, beträgt die Gesamtzahl der Patienten im Krankenhaus nach einer Woche 50 Patienten/Tag * 7 Tage/Woche = 350 Patienten.\nNach 2 Wochen beträgt die Gesamtzahl der ins Krankenhaus eingelieferten Patienten 350 Patienten/Woche * 2 Wochen = <<350*2=700>>700 Patienten, die jeweils Betten belegen.\nWenn vor den neuen Einlieferungen 800 freie Betten im Krankenhaus waren, verringert sich die Gesamtzahl auf 800 Betten - 700 Betten = <<800-700=100>>100 freie Betten.\n#### 100\n"
