answer = "यदि कुल कैलोरी लक्ष्य 2000 अछि आर मँ 1800 कैलोरी खपल चुकल अछि तँ मँ 2000-1800 = <<2000-1800=200>>200 कैलोरी खाने के बचा अछि\nयदि चिप्स के प्रत्येक सर्विंग में 250 कैलोरी अछि आर मँ केवल 200 कैलोरी खाने के बचा अछि, तँ मँ केवल 200/250 सर्विंग खा सकत छी = 4/5 सर्विंग\nहम जानै छी कि चिप्स के 300 ग्राम की थैली में 5 सर्विंग अछि, अतः प्रत्येक सर्विंग में 300 ग्राम/5 = <<300/5=60>>60 ग्रामs होय छी\nयदि मँ केवल 4/5 सर्विंग खा सकत छी, तँ मँ केवल 60 ग्राम * 4/5 = 48 ग्रामs खा सकत छी\n#### 48\n"
