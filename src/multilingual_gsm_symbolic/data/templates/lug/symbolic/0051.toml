question = "Artie alina esika ya muwogo ku Sika ya Abalimi. Yayita {product} gitali mitatu: empola, petunia ne begonia. Yayita {item1} ku SS2.74 ku kitanda, {item2} ku SS1.87 ku kitanda ne {item3} ku SS2.12 ku kitanda. Artie talina ssente ezisigala luno, kubanga yagamba okukwasanya emisobo gyaffe okutuuka ku ssente ezaawamu. Okuba Artie ayita 12 kitanda za empola, 9 kitanda za petunia ne 17 kitanda za begonia, gwe alina okukola?"
answer = "Artie alikwasanya empola ye okutuuka ku SS3 okuva ku SS2.74, kubwa enamba efulumira ku 2 eri 5 oba okusinga.\nArtie alikwasanya petunia up okuva ku SS1.87 ku SS2, kubwa enamba efulumira ku 1 eri 5 or higher.\nArtie alikwasanya begonia down okuva ku SS2.12 ku SS2, kubwa enamba efulumira ku 2 eri less than 5.\nArtie ayita 12 empola*SS3 = SS<<12*3=36>>36\nArtie ayita 9 petunia*SS2 = SS<<9*2=18>>18\nArtie ayita 17 begonia*SS2 = SS<<17*2=34>>34\nMu kyalo, Artie alina okukola SS36 + SS18 + SS34 = SS<<36+18+34=88>>88\n#### 88\n"
