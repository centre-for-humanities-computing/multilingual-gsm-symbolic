question = "Martha yali akola ebivvula bya buvumu eri abaana ba 3 bannyamwami. Bali bannyamubiri abasatu, bwe bityo bali banene okumanya. Ategyere okukola kibbo, ekikooto, ekisweeta, ebikotyo, ne ebikooto eri omu w'omu. Kukola kibbo kweetaaga 2 bitundu by'oluyivu, 4 eri ekikooto, 12 eri ekisweeta, 1 eri ekikotyo kya ebikotyo, n' 2 eri ekikotyo kya ebikooto. Enkya ennyingi y'oluyivu y'ayetaaga kugula?"
