question = "Sunny azaza ebikopo ne embuzi pie okukusanya ensimbi. Ku Olwamukaaga, yazaasa 10 amasaka ga ebikopo ne 4 amasaka g'ali muto okusingira Olwokusatu. Ku Olwokusatu, yazaasa 5 amasaka g' ebikopo okusingira Olwamukaaga ne 15 amasaka g' embuzi pie. Bwe ebikopo kugula $6 ne embuzi pie kugula $15, Sunny yafunira ki ku nnaku bbiri?"
