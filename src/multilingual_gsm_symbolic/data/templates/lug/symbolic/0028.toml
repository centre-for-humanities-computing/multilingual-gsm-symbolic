answer_annotated = "Bwaba {frac} y'amagezi g'okukozesa g'omu {facility} {item} ebiri mu kozesa, bino bivaako {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} ebina abagwayi babikozesa.\nOmuwendo gwonna gwa {item} mu {facility} w'aba ntiwo abajja b'obutongole ni {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}.\nBwaba {daily} abantu bajja buli lunaku, omuwendo gw'abagwayi mu {facility} emabega w'ekyuma ekimu kya {daily} abagwayi/lunaku * 7 lunaku/ekyuma = {daily*7} abagwayi.\nEmabega w'ebwiiko {period}, omuwendo gw'abagwayi abajja mu {facility} kya {daily*7} abagwayi/ekyuma * {period} ebwiiko = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} abagwayi, nga buli omu akozesa {item} emu.\nBwaba kati {total-int(total*frac)} {item} ebitali mu kozesa mu {facility} emabega w'abajja b'obutongole, omuwendo gwonna gukomeezibwa okuba {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item} ebitali mu kozesa.\n#### {total - (total * frac + daily * period * 7)}\n"
