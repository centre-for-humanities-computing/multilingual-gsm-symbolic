question = "Lubuga kina amagezi gya 1000 kitanda n'ebiri 1/5 ebikozesebwa. Kubanga olukalala lwa coronavirus, 50 abagwayi bajja mu lubuga buli lunaku. Kakasa omuwendo gwonna gwa kitanda ebitali mu kozesa mu lubuga emabega w'ebwiiko 2."
answer = "Bwaba 1/5 y'amagezi g'okukozesa g'omu lubuga kitanda ebiri mu kozesa, bino bivaako 1/5 * 1000 = <<1000*1/5=200>>200 kitanda ebina abagwayi babikozesa.\nOmuwendo gwonna gwa kitanda mu lubuga w'aba ntiwo abajja b'obutongole ni 1000 kitanda - 200 kitanda = <<1000-200=800>>800 kitanda.\nBwaba 50 abantu bajja buli lunaku, omuwendo gw'abagwayi mu lubuga emabega w'ekyuma ekimu kya 50 abagwayi/lunaku * 7 lunaku/ekyuma = 350 abagwayi.\nEmabega w'ebwiiko 2, omuwendo gw'abagwayi abajja mu lubuga kya 350 abagwayi/ekyuma * 2 ebwiiko = <<350*2=700>>700 abagwayi, nga buli omu akozesa kitanda emu.\nBwaba kati 800 kitanda ebitali mu kozesa mu lubuga emabega w'abajja b'obutongole, omuwendo gwonna gukomeezibwa okuba 800 kitanda - 700 kitanda = <<800-700=100>>100 kitanda ebitali mu kozesa.\n#### 100\n"
