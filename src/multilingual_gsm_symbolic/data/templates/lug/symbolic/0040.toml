question = "Nalongo yagenda ku ddanga okwewala. Bazadde baaweetayo $15 okugula ebyo byonna bye yagala. Ku dduka lya eby'okulabirako, taffy yali ku nsonga ya 'Gula 1 ebiro ku $3 buli ebiro, funa 1 ebiro 1/2 obutayongera.' Yakozesa 4 ebilo. Yagula n'ekibago ky'ebinyonyo by'ennyanja kya $1.5 era n'ebikozesebwa 4 ebyali $0.25 buli kimu. Ennyo ennyingi ebbalira nalongo?"
answer = "Nalongo yagula 1 ebiro ku $3 era afuna 1 ebiro 1/2 obutayongera. Bwe bityo 1/2 obutayongera ku 1 ebiro bwe $3*1/2 = $1.5. Ebyo ebyasigala 2 ebilo tebyaweebwa nsonga era bikozesa 2*$3 = $6, bwe bityo omusango gwe $3+$3/2+$6=$21/2\n4 ebikozesebwa ku $0.25 buli kimu bwe 4*0.25=$<<4*0.25=1>>1\nBwe wawongera ebikozesebwa byonna, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nYali na $15 era yakoze $13 bwe bityo yali na $15-$13 = $<<15-13=2>>2 ebyasigala\n#### 2\n"
