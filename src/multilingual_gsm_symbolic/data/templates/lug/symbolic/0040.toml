question_annotated = "{name,nalongo} yagenda ku ddanga okwewala. Bazadde baaweetayo ${total,15} okugula ebyo byonna bye yagala. Ku dduka lya eby'okulabirako, taffy yali ku nsonga ya 'Gula {n1,1} ebiro ku ${p1,3} buli ebiro, funa {n2,1} ebiro {discount,1/2} obutayongera.' Yakozesa {n12,4} ebilo. Yagula n'ekibago ky'ebinyonyo by'ennyanja kya ${p2,1.5} era n'ebikozesebwa {n3,4} ebyali ${p3,0.25} buli kimu. Ennyo ennyingi ebbalira {name,nalongo}?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
