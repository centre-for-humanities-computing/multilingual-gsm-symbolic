question = "នៅដើមនៃ ពិធីជប់លៀង, មាន 25 បុរស និង 15 ស្ត្រី។ បន្ទាប់ពី មួយម៉ោង, 1/4 នៃចំនួនមនុស្សសរុបបានចាកចេញ។ តើមាន ស្ត្រី ប៉ុន្មាននាក់នៅសល់ ប្រសិនបើ 22 បុរស នៅសល់នៅ ពិធីជប់លៀង?"
answer = "មានចំនួនសរុប 25 បុរស + 15 ស្ត្រី = <<25+15=40>>40 នាក់ដែលបានចូលរួមក្នុង ពិធីជប់លៀង។\nបន្ទាប់ពី មួយម៉ោង, 40 នាក់ * 1/4 = <<40*1/4=10>>10 នាក់បានចាកចេញពី ពិធីជប់លៀង។\nនេះមានន័យថា 40 នាក់ - 10 នាក់ = <<40-10=30>>30 នាក់នៅសល់។\nក្នុងចំណោម 30 ដែលនៅសល់, 30 នាក់ - 22 បុរស = <<30-22=8>>8 គឺជា ស្ត្រី។\n#### 8\n"
