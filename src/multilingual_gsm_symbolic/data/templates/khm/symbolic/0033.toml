question = "កាឡរ និង ជេននីផឺរ គឺជាបងប្អូនស្រីមកពី លូសអាន់ជឺលឺស ដែលចូលចិត្តប្រមូលហត្ថលេខាពី តារា។ ក្នុងអំឡុងពេល វិស្សមកាល របស់ពួកគេពីសាលា បងប្អូនស្រីទាំងពីរចំណាយពេលរៀងរាល់រសៀលក្នុងការប្រមូលហត្ថលេខា។ បន្ទាប់ពី ប្រាំ សប្តាហ៍ កាឡរ និង ជេននីផឺរ ប្រៀបធៀបសៀវភៅហត្ថលេខារបស់ពួកគេ ដើម្បីរាប់ចំនួនហត្ថលេខាដែលបងប្អូនស្រីនីមួយៗបានប្រមូល។ កាឡរ មាន 20 ហត្ថលេខានៅក្នុងសៀវភៅរបស់នាង ហើយ ជេននីផឺរ មាន 44។ បងប្អូនស្រីទាំងពីរមាន បី សប្តាហ៍ទៀតនៃ វិស្សមកាល ហើយពួកគេសម្រេចចិត្តថាចង់ឈានដល់ 100 ហត្ថលេខារវាងពួកគេនៅចុងបញ្ចប់នៃវិស្សមកាល។ តើបងប្អូនស្រីទាំងពីរត្រូវប្រមូលហត្ថលេខាប៉ុន្មានដើម្បីឈានដល់គោលដៅរបស់ពួកគេ?"
answer = "កាឡរ និង ជេននីផឺរ បានប្រមូលហត្ថលេខា 20 + 44 រួចហើយ = <<20+44=64>>64 ហត្ថលេខា។\nដោយសារគោលដៅរបស់ពួកគេគឺ 100 ពួកគេត្រូវប្រមូល 100 - 64 ហត្ថលេខា។ 100 - 64 = <<100-64=36>>36 ហត្ថលេខា\n#### 36\n"
