question = "យោងតាមព័ត៌មានជីវជាតិរបស់វា ថង់ ប៉ាតាត ឆា មាន 250 កាឡូរីក្នុងមួយម៉ាត់។ ប្រសិនបើថង់ 300 ក្រាម មាន 5 ម៉ាត់ អ្នកអាចញ៉ាំបានប៉ុន្មាន ក្រាម ប្រសិនបើគោលដៅកាឡូរីប្រចាំថ្ងៃរបស់អ្នកគឺ 2000 និងអ្នកបានញ៉ាំអស់ 1800 កាឡូរីហើយ?"
answer = "ប្រសិនបើគោលដៅកាឡូរីសរុបគឺ 2000 និងខ្ញុំបានញ៉ាំអស់ 1800 កាឡូរី នោះខ្ញុំនៅសល់ 2000-1800 = <<2000-1800=200>>200 កាឡូរីដើម្បីញ៉ាំ\nប្រសិនបើមួយម៉ាត់នៃ ប៉ាតាត ឆា មាន 250 កាឡូរី និងខ្ញុំមាន 200 កាឡូរីសល់តែប៉ុណ្ណោះដើម្បីញ៉ាំ នោះខ្ញុំអាចញ៉ាំបានតែ 200/250 នៃម៉ាត់មួយ = 4/5 នៃម៉ាត់មួយ\nយើងដឹងផងដែរថាថង់ ប៉ាតាត ឆា ទំហំ 300 ក្រាម មាន 5 ម៉ាត់ ដូច្នេះមួយម៉ាត់មាន 300 ក្រាម/5 = <<300/5=60>>60 ក្រាម\nប្រសិនបើខ្ញុំអាចញ៉ាំបានតែ 4/5 នៃម៉ាត់មួយ នោះខ្ញុំអាចញ៉ាំបានតែ 60 ក្រាម * 4/5 = 48 ក្រាម\n#### 48\n"
