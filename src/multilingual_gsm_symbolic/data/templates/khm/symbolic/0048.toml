question = "អេមី អាចប៉ះ 6 ខ្យង ក្នុងមួយនាទី និង ចំអិន 30 ខ្យង ក្នុង 10 នាទី។ តើនាងនឹងចំណាយពេលប៉ុន្មានដើម្បីប៉ះ និង ចំអិន 90 ខ្យង? អេមី មិនអាចប៉ះ និង ចំអិនក្នុងពេលតែមួយបានទេ។"
answer = "ដំបូង ស្វែងរកថាតើវាចំណាយពេលប៉ុន្មានដល់ អេមី ដើម្បីប៉ះ ខ្យង: 90 ខ្យង / 6 ខ្យង/នាទី = <<90/6=15>>15 នាទី\nបន្ទាប់មក ស្វែងរកថាតើមានប៉ុន្មានជំនាន់នៃ ខ្យង ដែលនាងត្រូវចំអិន: 90 ខ្យង / 30 ខ្យង/ជំនាន់ = <<90/30=3>>3 ជំនាន់\nបន្ទាប់មក គុណចំនួនជំនាន់នឹងពេលវេលាក្នុងមួយជំនាន់ ដើម្បីរកពេលវេលាចំអិនសរុប: 3 ជំនាន់ * 10 នាទី/ជំនាន់ = <<3*10=30>>30 នាទី\nបន្ទាប់មក បូកពេលវេលាប៉ះ ដើម្បីរកពេលវេលាសរុបដែល អេមី ចំណាយ: 30 នាទី + 15 នាទី = <<30+15=45>>45 នាទី\n#### 45\n"
