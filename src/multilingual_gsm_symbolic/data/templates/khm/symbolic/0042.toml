question = "រ៉ូជែរ ទៅហាងដើម្បីទិញ កាហ្វេ មួយចំនួន។ ម៉ាកធម្មតានៃ កាហ្វេ ដែលគាត់ទិញមានតម្លៃ ៛5 ក្នុងមួយ ផោន។ គាត់ត្រូវទិញម៉ាកដែលថ្លៃជាងដែលមានតម្លៃ 20% ច្រើនជាង ព្រោះម៉ាកដែលគាត់ចូលចិត្តអស់ស្តុក។ គាត់សម្រេចចិត្តទិញ កាហ្វេ សម្រាប់មួយសប្តាហ៍ និងគាត់ប្រើ 1 ផោន នៃ កាហ្វេ ក្នុងមួយថ្ងៃ។ គាត់ក៏សម្រេចចិត្តទិញ ដូណាត់ សម្រាប់ខ្លួនឯងក្នុងតម្លៃ ៛2។ តើអ្វីៗទាំងអស់មានតម្លៃប៉ុន្មាន?"
answer = "កាហ្វេ ដែលគាត់ទិញមានតម្លៃថ្លៃជាង 5*0.2=៛<<5*0.2=1>>1 ក្នុងមួយ ផោន ជាងម៉ាកដែលគាត់តែងតែទិញ\nដូច្នេះវាមានតម្លៃ 5+1=៛<<5+1=6>>6 ក្នុងមួយ ផោន\nគាត់ប្រើ 1*7=<<1*7=7>>7 ផោន នៃ កាហ្វេ ក្នុងមួយសប្តាហ៍\nដូច្នេះគាត់បានបង់ 6*7=៛<<6*7=42>>42 សម្រាប់ កាហ្វេ\nនេះមានន័យថាចំណាយសរុបរបស់គាត់គឺ 42+2=៛<<42+2=44>>44\n#### 44\n"
