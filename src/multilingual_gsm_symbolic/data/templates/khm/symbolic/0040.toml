question = "សាលី បានទៅលេងឆ្នេរសម្រាក។ ឪពុកម្តាយរបស់នាងបានផ្តល់ឱ្យនាង $15 ដើម្បីទិញអ្វីដែលនាងចង់បាន។ នៅហាងលក់ទំនិញអនុស្សាវរីយ៍ តាហ្វីកំពុងលក់បញ្ចុះតម្លៃថា \"ទិញ 1 ផោនក្នុងតម្លៃ $3 ក្នុងមួយផោន ទទួលបាន 1 ផោន បញ្ចុះ 1/2។\" នាងបានយក 4 ផោន។ នាងក៏បានទិញកាបូបសំបុកស្គល់សមុទ្រចម្រុះមួយក្នុងតម្លៃ $1.5 និងម៉ាញេត 4 ដែលមានតម្លៃ $0.25 គ្រាន់។ តើ សាលី មានលុយសល់ប៉ុន្មាន?"
answer = "សាលី កំពុងទិញ 1 ផោនក្នុងតម្លៃ $3 និងទទួលបាន 1 ផោន បញ្ចុះ 1/2។ ដូច្នេះ 1/2 បញ្ចុះលើ 1 ផោនគឺ $3*1/2 = $1.5។ សល់ 2 ផោនទៀតគ្មានការបញ្ចុះតម្លៃ និងមានតម្លៃ 2*$3 = $6 ដូច្នេះសរុបគឺ $3+$3/2+$6=$21/2\n4 ម៉ាញេត ក្នុងតម្លៃ $0.25 គ្រាន់គឺ 4*0.25=$<<4*0.25=1>>1\nនៅពេលបូកសរុបទិញទំនិញទាំងអស់របស់នាង $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nនាងមាន $15 និងបានចំណាយ $13 ដូច្នេះនាងមាន $15-$13 = $<<15-13=2>>2 សល់\n#### 2\n"
