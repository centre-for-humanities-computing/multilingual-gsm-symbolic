question = "អាលីសុន ត្រូវបានជ្រើសរើសឱ្យចូលក្រុម ការរត់ ដូច្នេះនាងបានទៅទិញឧបករណ៍កីឡាមួយចំនួន។ នាងបានទិញ អាវយឺត មួយក្នុងតម្លៃ $10 នូវ ខោខ្លី មួយគូសម្រាប់ ការរត់ ក្នុងតម្លៃ $5 ច្រើនជាង អាវយឺត និងនូវ ស្បែកជើងកីឡា មួយគូដែលមានតម្លៃដើម $48 ប៉ុន្តែត្រូវបានលក់ក្នុងតម្លៃ ពាក់កណ្តាល។ នាងមានប័ណ្ណកាដូសម្រាប់ $2 ចុះពីកញ្ចប់ ស្រោមជើង កីឡាតម្លៃ $8 ដែលនាងក៏បានទិញផងដែរ។ នាងបានចំណាយប៉ុន្មានលើឧបករណ៍កីឡា?"
answer = "ខោខ្លី មានតម្លៃ $5 ច្រើនជាង អាវយឺត ដូច្នេះតម្លៃរបស់វាគឺ $5 + $10 = $<<5+10=15>>15។\nស្បែកជើងកីឡា នៃនាងមានតម្លៃ ពាក់កណ្តាល នៃតម្លៃដើម $48 ដូច្នេះតម្លៃរបស់វាគឺ $48*1/2=$24។\nជាមួយប័ណ្ណកាដូរបស់នាង ស្រោមជើង មានតម្លៃ $8 - $2 = $<<8-2=6>>6។\nអាវយឺត, ខោខ្លី, ស្បែកជើងកីឡា, និង ស្រោមជើង សរុបមានតម្លៃ $10 + $15 + $24 + $6 = $<<10+15+24+6=55>>55។\n#### 55\n"
