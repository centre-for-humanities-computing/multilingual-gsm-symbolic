question = "ចាន់ កំពុងប្រមូលលុយសម្រាប់ ការទេសចរណ៍សិក្សា។ គាត់បានដាក់ពាក្យសុំជំនួយពី សាលា ដែលបានសម្រេចចិត្តគ្របដណ្តប់ ពាក់កណ្តាល នៃចំណាយនៃ ការទេសចរណ៍សិក្សា។ តើលុយប៉ុន្មានដែល ចាន់ ខ្វះ ប្រសិនបើគាត់មាន ៛50 និង ការទេសចរណ៍សិក្សា តម្លៃ ៛300?"
answer = "ចាន់របស់ សាលា បានសម្រេចចិត្តបង់ 300*1/2=៛<<300*1/2=150>>150 សម្រាប់ ការទេសចរណ៍សិក្សា របស់គាត់។\nសរុបមក ចាន់ បានបង់ 150 + 50 = ៛<<150+50=200>>200 សម្រាប់ ការទេសចរណ៍សិក្សា របស់គាត់\nដូចនេះ ចាន់ ត្រូវការ 300 - 200 = ៛<<300-200=100>>100 បន្ថែមសម្រាប់ ការទេសចរណ៍សិក្សា។\n#### 100\n"
