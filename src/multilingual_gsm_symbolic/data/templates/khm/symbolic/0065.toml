question = "ចក់គី កំពុងពិចារណាថាតើគួរធ្វើ ពន្ធរបស់នាង ដោយខ្លួនឯង ឬជួលម្នាក់ អ្នកគណនេយ្យ។ ប្រសិនបើនាងធ្វើវាដោយខ្លួនឯង នាងនឹងអាចធ្វើការបានតិចជាង 3 ម៉ោងនៃការងារ ហ្វ្រីឡង់ បាត់បង់ប្រាក់ចំណូល ៛35/ម៉ោង ដែលមិនទទួលបាន។ អ្នក អ្នកគណនេយ្យ គិតថ្លៃសេវា ៛90។ នាងនឹងមានលុយច្រើនជាងប៉ុន្មាន ប្រសិនបើនាងជួល អ្នកគណនេយ្យ។"
