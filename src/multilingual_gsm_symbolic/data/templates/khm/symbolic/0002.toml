question = "ជេរី កំពុងបោះគ្រាប់ឡុកឡាក់ 6-មុខ។ វាមានលទ្ធភាពខ្ពស់ជាងប៉ុន្មាន (បង្ហាញជាចំណុចភាគរយ) ដែលគាត់បោះបានលេខធំជាង 3 ជាងការដែលគាត់បោះបានលេខ គូ ពីរជាប់ៗគ្នា?"
answer = "មាន 3 លេខធំជាង 3 លើគ្រាប់ឡុកឡាក់ ដូច្នេះឱកាសបោះបានលេខមួយក្នុងចំណោមនោះគឺ 3/6=50%។\nឱកាសបោះបានលេខ គូ មួយគឺ 50% ដូច្នេះឱកាសបោះបានពីរជាប់ៗគ្នាគឺ 50% * 50% = 25%។\nភាពខុសគ្នារវាងប្រូបាប៊ីលីតេទាំងពីរនេះគឺ 50% - 25% = 25%។\n#### 25\n"
