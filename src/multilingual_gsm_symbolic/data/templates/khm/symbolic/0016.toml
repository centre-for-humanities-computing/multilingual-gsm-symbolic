question = "សូនី កំពុងលក់ គ្រឿងប៉េងប៉ោះ និង ផ្លែប៉ោម ប៉េន ដើម្បីរកមូលនិធិ។ នៅ សៅរ៍ គាត់បានលក់ 10 ប្រអប់នៃ គ្រឿងប៉េងប៉ោះ និង 4 ប្រអប់នៃ ផ្លែប៉ោម ប៉េន តិចជាងនៅ អាទិត្យ។ នៅ អាទិត្យ គាត់បានលក់ 5 ប្រអប់នៃ គ្រឿងប៉េងប៉ោះ ច្រើនជាងនៅ សៅរ៍ និង 15 ប្រអប់នៃ ផ្លែប៉ោម ប៉េន។ ប្រសិនបើ គ្រឿងប៉េងប៉ោះ តម្លៃ ដុល្លារ6 និង ផ្លែប៉ោម ប៉េន តម្លៃ ដុល្លារ15 នោះ សូនី បានរកបានប៉ុន្មានសម្រាប់ពីរថ្ងៃ?"
answer = "គាត់បានលក់ 10 + 5 = <<10+5=15>>15 ប្រអប់នៃ គ្រឿងប៉េងប៉ោះ នៅ អាទិត្យ។\nចំនួនប្រអប់ គ្រឿងប៉េងប៉ោះ សរុបដែល សូនី បានលក់គឺ 10 + 15 = <<10+15=25>>25។\nសូនី បានរកបាន 25*ដុល្លារ6 = ដុល្លារ<<25*6=150>>150 សម្រាប់ការលក់ គ្រឿងប៉េងប៉ោះ។\nគាត់បានលក់ 15 - 4 = <<15-4=11>>11 ប្រអប់នៃ ផ្លែប៉ោម ប៉េន នៅ សៅរ៍។\nចំនួនប្រអប់ ផ្លែប៉ោម ប៉េន សរុបដែល សូនី បានលក់គឺ 15 + 11 = <<15+11=26>>26។\nគាត់បានរកបាន 26*ដុល្លារ15 = ដុល្លារ<<26*15=390>>390 សម្រាប់ការលក់ ផ្លែប៉ោម ប៉េន។\nដូចនេះ សូនី បានរកបាន ដុល្លារ150 + ដុល្លារ390 = ដុល្លារ<<150+390=540>>540 សម្រាប់ពីរថ្ងៃ។\n#### 540\n"
