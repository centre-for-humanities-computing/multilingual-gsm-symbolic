question = "នេត កំពុងផ្តល់ចំណីដល់សត្វចិញ្ចឹមរបស់គាត់គឺ ស្មៅ។ ក្តាម មួយក្បាលត្រូវការ 5 ផោន ហើយ ល្លាម៉ា មួយក្បាលត្រូវការ 3 ផោន តិចជាងពីរដងនៃចំនួនដែល ក្តាម មួយក្បាលត្រូវការ។ ប្រសិនបើមាន 15 ក្តាម និង 12 ល្លាម៉ា តើ នេត ត្រូវការ ផោន ប៉ុន្មាននៃ ស្មៅ?"
answer = "ដំបូងស្វែងរកថា ល្លាម៉ា មួយក្បាលត្រូវការ ស្មៅ ប៉ុន្មាន: 5 ផោន * 2 - 3 = <<5*2-3=7>>7 ផោន ក្នុងមួយ ល្លាម៉ា\nបន្ទាប់មកស្វែងរកថា ល្លាម៉ា ទាំងអស់ត្រូវការ ស្មៅ ប៉ុន្មានសរុប: 7 ផោន ក្នុងមួយ ល្លាម៉ា * 12 ល្លាម៉ា = <<7*12=84>>84 ផោន\nបន្ទាប់មកស្វែងរកថា ក្តាម ទាំងអស់ត្រូវការ ស្មៅ ប៉ុន្មានសរុប: 5 ផោន ក្នុងមួយ ក្តាម * 15 ក្តាម = <<5*15=75>>75 ផោន\nបន្ទាប់មកបូកបរិមាណ ស្មៅ ទាំងពីរនេះដើម្បីរកចំនួនសរុប: 84 ផោន + 75 ផោន = <<84+75=159>>159 ផោន\n#### 159\n"
