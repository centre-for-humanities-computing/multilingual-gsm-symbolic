question = "អាតី មានកន្លែងលក់ ផ្កា នៅ ផ្សារកសិកម្ម។ គាត់លក់ ផ្កា ចំនួនបីប្រភេទ៖ ផ្កាម៉ារីកុល, ផ្កាពេតូនីយ៉ា និង ផ្កាបេហ្គូនីយ៉ា។ គាត់ជាធម្មតាលក់ ផ្កាម៉ារីកុល ក្នុងតម្លៃ $2.74 ក្នុងមួយ កំប៉ុង, ផ្កាពេតូនីយ៉ា ក្នុងតម្លៃ $1.87 ក្នុងមួយ កំប៉ុង និង ផ្កាបេហ្គូនីយ៉ា ក្នុងតម្លៃ $2.12 ក្នុងមួយ កំប៉ុង។ អាតី មិនមានលុយសម្រាប់ផ្លាស់ប្តូរនៅថ្ងៃនេះទេ ដូច្នេះគាត់បានសម្រេចចិត្តបង្គត់តម្លៃទាំងអស់របស់គាត់ទៅជាដុល្លារជិតបំផុត។ ប្រសិនបើ អាតី លក់ 12 កំប៉ុង នៃ ផ្កាម៉ារីកុល, 9 កំប៉ុង នៃ ផ្កាពេតូនីយ៉ា និង 17 កំប៉ុង នៃ ផ្កាបេហ្គូនីយ៉ា គាត់នឹងរកបានប៉ុន្មាន?"
answer = "អាតី នឹងបង្គត់ ផ្កាម៉ារីកុល របស់គាត់ឡើងពី $2.74 ទៅ $3 ព្រោះលេខដែលនៅបន្ទាប់ពី 2 គឺ 5 ឬច្រើនជាង។\nអាតី នឹងបង្គត់ ផ្កាពេតូនីយ៉ា up របស់គាត់ពី $1.87 ទៅ $2 ព្រោះលេខដែលនៅបន្ទាប់ពី 1 គឺ 5 or higher។\nអាតី នឹងបង្គត់ ផ្កាបេហ្គូនីយ៉ា down របស់គាត់ពី $2.12 ទៅ $2 ព្រោះលេខដែលនៅបន្ទាប់ពី 2 គឺ less than 5។\nអាតី លក់ 12 ផ្កាម៉ារីកុល*$3 = $<<12*3=36>>36\nអាតី លក់ 9 ផ្កាពេតូនីយ៉ា*$2 = $<<9*2=18>>18\nអាតី លក់ 17 ផ្កាបេហ្គូនីយ៉ា*$2 = $<<17*2=34>>34\nសរុបមក អាតី នឹងរកបាន $36 + $18 + $34 = $<<36+18+34=88>>88\n#### 88\n"
