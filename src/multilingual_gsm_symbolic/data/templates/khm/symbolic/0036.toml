question = "តូលា បានទៅ ហាងនំ និងបានទិញ នំផ្សេងៗ ប្រភេទផ្សេងៗជាច្រើន។ នាងបានទិញ 3 ដុលសែន ដូណាត់ ដែលមានតម្លៃ $68 ក្នុងមួយដុលសែន, 2 ដុលសែន កាប៊ែកតូចៗ ដែលមានតម្លៃ $80 ក្នុងមួយដុលសែន និង 6 ដុលសែន ឆីសកេកតូចៗ ក្នុងតម្លៃ $55 ក្នុងមួយដុលសែន។ តើថ្លៃសរុបគឺប៉ុន្មាន?"
answer = "ថ្លៃសរុបសម្រាប់ ដូណាត់ គឺ 3*$68 = $<<3*68=204>>204។\nថ្លៃសរុបសម្រាប់ កាប៊ែកតូចៗ គឺ 2*$80 = $<<2*80=160>>160។\nថ្លៃសរុបសម្រាប់ ឆីសកេកតូចៗ គឺ 6*$55 = $<<6*55=330>>330។\nដូចនេះ ចំនួនទឹកប្រាក់សរុបដែល តូលា បានបង់សម្រាប់ នំផ្សេងៗ គឺ $204 + $160 + $330 = $<<204+160+330=694>>694។\n#### 694\n"
