question = "នៅក្នុងការប្រឡង 60 សំណួរ, 40% នៃសំណួរគឺ ងាយ, ហើយសំណួរដែលនៅសល់ត្រូវបានបែងចែកស្មើៗគ្នាជាសំណួរ មធ្យម និង ពិបាក។ ប្រសិនបើ អាឡៀស ប្រាកដថាទទួលបាន 75% នៃសំណួរ ងាយ, និង ពាក់កណ្តាល នៃសំណួរ មធ្យម និង ពិបាក យ៉ាងត្រឹមត្រូវ, នាងប្រាកដនឹងទទួលបានចំណុចប៉ុន្មាន?"
answer = "សំណួរ មធ្យម និង ពិបាក ក្នុងចំណោម 100% - 40% = 60% នៃការប្រឡង។\nមានសំណួរ 60 * 40/100 = <<60*40/100=24>>24 សំណួរ ងាយ។\nមានសរុបសំណួរ 60 * 60/100 = <<60*60/100=36>>36 សំណួរ មធ្យម និង ពិបាក។\nប្រសិនបើ អាឡៀស ប្រាកដថាទទួលបាន 75% នៃសំណួរ ងាយ នោះមានន័យថា នាងប្រាកដនឹងទទួលបាន 24 សំណួរ * 75/100 = <<24*75/100=18>>18 ចំណុច។\nពីសំណួរ មធ្យម និង ពិបាក នាងប្រាកដនឹងទទួលបាន ពាក់កណ្តាល យ៉ាងត្រឹមត្រូវ ដូច្នេះគឺ 36 សំណួរ * 1/2 = <<36*1/2=18>>18 ចំណុច។\nដូច្នេះ នាងប្រាកដនឹងទទួលបាន 18 ចំណុច + 18 ចំណុច = <<18+18=36>>36 ចំណុចក្នុងការប្រឡងរបស់នាង។\n#### 36\n"
