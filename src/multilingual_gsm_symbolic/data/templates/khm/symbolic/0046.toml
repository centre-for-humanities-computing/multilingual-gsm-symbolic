question = "សាលាវិទ្យាល័យ Apple កំពុងរៀបចំពិធីបញ្ចប់ការសិក្សានៅ មជ្ឈមណ្ឌលសិល្បៈ ឆ្នាំនេះដែលមានកន្លែងសម្រាប់ 6000 នាក់។ បន្ទាប់ពីគិតគូរពី 950 កៅអីសម្រាប់សិស្សសញ្ញាបត្រ និង 300 កៅអីសម្រាប់គ្រូបង្រៀនដែលចូលរួម និស្សិតនីមួយៗនឹងទទួលបានប៉ុន្មានសន្លឹកចូលរួមដើម្បីចែកជូនមិត្តភក្តិ និងគ្រួសាររបស់ពួកគេ ប្រសិនបើសន្លឹកចូលរួមត្រូវបានបែងចែកស្មើៗគ្នា?"
answer = "បូកកៅអីសិស្សសញ្ញាបត្រ និងគ្រូបង្រៀនចូលគ្នា។ 950 + 300 = <<950+300=1250>>1250 កៅអីសម្រាប់គ្រូបង្រៀន និងសិស្សសញ្ញាបត្រ\nដកកៅអីសម្រាប់គ្រូបង្រៀន និងសិស្សសញ្ញាបត្រចេញពីចំនួនកៅអីសរុបដែលអនុញ្ញាត។ 6000 - 1250 = <<6000-1250=4750>>4750 កៅអីដែលនៅសល់។\nចែកចំនួនកៅអីដែលនៅសល់នឹងចំនួនសិស្សសញ្ញាបត្រ។ 4750/950 = <<4750/950=5>>5 សន្លឹកចូលរួម\n#### 5\n"
