question = "ម៉ារីា ទិញ 8 ភាគហ៊ុននៃភាគហ៊ុនមួយក្នុងតម្លៃ ៛8 មួយ។ តម្លៃភាគហ៊ុនកើនឡើង 50% នៅឆ្នាំដំបូងដែល ម៉ារីា កាន់កាប់វា បន្ទាប់មកថយចុះ 25% នៅឆ្នាំទីពីរ។ តម្លៃចុងក្រោយនៃភាគហ៊ុនទាំងអស់របស់ ម៉ារីា គឺជាអ្វី?"
answer = "ដំបូង រកតម្លៃសរុបដើមនៃការទិញរបស់ ម៉ារីា: 8 ភាគហ៊ុន * ៛8/ភាគហ៊ុន = ៛<<8*8=64>>64\nបន្ទាប់មក រកចំនួននៃការកើនឡើងតម្លៃដំបូង: ៛64 * 0.5 = ៛<<64*0.5=32>>32\nបូកចំនួននោះទៅនឹងតម្លៃដើមដើម្បីរកតម្លៃបន្ទាប់ពីឆ្នាំដំបូង: ៛64 + ៛32 = ៛<<64+32=96>>96\nបន្ទាប់មក គុណចំនួននោះនឹង 25% ដើម្បីរកចំនួននៃការថយចុះនៅឆ្នាំទីពីរ: ៛96 * 25% = ៛<<96*25*.01=24>>24\nបន្ទាប់មក ដកចំនួននោះចេញពីតម្លៃបន្ទាប់ពីឆ្នាំដំបូងដើម្បីរកតម្លៃចុងក្រោយ: ៛96 - ៛24 = ៛<<96-24=72>>72\n#### 72\n"
