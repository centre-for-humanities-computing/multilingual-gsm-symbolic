question = "ಮೇರಿ ಒಬ್ಬ ಉತ್ಸಾಹಿ ತೋಟಗಾರಿ. ನಿನ್ನೆ, ಅವಳು ತನ್ನ ಪ್ರಿಯ ಸಸ್ಯಗಳ ನರ್ಸರಿನಿಂದ 18 ಹೊಸ ಪಾತ್ರೆ ಸಸ್ಯಗಳನ್ನು ಸ್ವೀಕರಿಸಿದಳು. ಅವಳ ದೊಡ್ಡ ಗ್ರಾಮೀಣ ಮನೆಯ 40 ಕಿಟಕಿ ಹೊರಮೇಜುಗಳಲ್ಲಿ ಪ್ರತಿಯೊಂದರಲ್ಲೂ ಅವಳಿಗೆ ಈಗಾಗಲೇ 2 ಪಾತ್ರೆ ಸಸ್ಯಗಳಿವೆ. ಉದಾರವಾಗಿ ಭಾವಿಸಿ, ಅವಳು ನಾಳೆ ಸ್ನೇಹಿತರು ಮತ್ತು ಕುಟುಂಬಕ್ಕೆ ಪ್ರತಿಯೊಂದು ಹೊರಮೇಜಿನಿಂದ 1 ಪಾತ್ರೆ ಸಸ್ಯಗಳನ್ನು ನೀಡಲು ನಿರ್ಧರಿಸಿದ್ದಾಳೆ. ಮೇರಿ ಬಳಿ ಎಷ್ಟು ಪಾತ್ರೆ ಸಸ್ಯಗಳು ಉಳಿಯುತ್ತವೆ?"
