answer = "ಒಟ್ಟು ಸಾಮರ್ಥ್ಯದಲ್ಲಿ 1/5 ಭಾಗ ಆಸ್ಪತ್ರೆ ಹಾಸಿಗೆ ಗಳು ಆಕ್ರಮಿಸಲ್ಪಟ್ಟಿದ್ದರೆ, ಅದರರ್ಥ 1/5 * 1000 = <<1000*1/5=200>>200 ಹಾಸಿಗೆ ಗಳಲ್ಲಿ ರೋಗಿಗಳನ್ನು ಹೊಂದಿವೆ.\nಹೊಸ ದಾಖಲೆಗಳಿಲ್ಲದೆ ಆಸ್ಪತ್ರೆ ಯಲ್ಲಿರುವ ಹಾಸಿಗೆ ಗಳ ಒಟ್ಟು ಸಂಖ್ಯೆಯು 1000 ಹಾಸಿಗೆ ಗಳು - 200 ಹಾಸಿಗೆ ಗಳು = <<1000-200=800>>800 ಹಾಸಿಗೆ ಗಳು.\nಪ್ರತಿದಿನ 50 ಜನರು ದಾಖಲಾದರೆ, ಒಂದು ವಾರದ ನಂತರ ಆಸ್ಪತ್ರೆ ಯಲ್ಲಿರುವ ರೋಗಿಗಳ ಒಟ್ಟು ಸಂಖ್ಯೆಯು 50 ರೋಗಿಗಳು/ದಿನ * 7 ದಿನಗಳು/ವಾರ = 350 ರೋಗಿಗಳು.\n2 ವಾರಗಳ ನಂತರ, ಆಸ್ಪತ್ರೆ ಗೆ ದಾಖಲಾದ ರೋಗಿಗಳ ಒಟ್ಟು ಸಂಖ್ಯೆಯು 350 ರೋಗಿಗಳು/ವಾರ * 2 ವಾರಗಳು = <<350*2=700>>700 ರೋಗಿಗಳು, ಪ್ರತಿಯೊಬ್ಬರು ಒಂದು ಹಾಸಿಗೆ ಬಳಸುತ್ತಾರೆ.\nಹೊಸ ದಾಖಲೆಗಳಿಗೆ ಮುಂಚೆ ಆಸ್ಪತ್ರೆ ಯಲ್ಲಿ 800 ಖಾಲಿ ಹಾಸಿಗೆ ಗಳಿದ್ದರೆ, ಒಟ್ಟು ಸಂಖ್ಯೆಯು 800 ಹಾಸಿಗೆ ಗಳು - 700 ಹಾಸಿಗೆ ಗಳು = <<800-700=100>>100 ಖಾಲಿ ಹಾಸಿಗೆ ಗಳಿಗೆ ಕಡಿಮೆಯಾಗುತ್ತದೆ.\n#### 100\n"
