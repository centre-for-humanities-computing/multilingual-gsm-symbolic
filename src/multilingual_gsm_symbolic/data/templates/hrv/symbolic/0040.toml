question_annotated = "{name,Sally} otišla je na more na odmor. Njezini su joj roditelji dali ${total,15} da kupi što god želi. U suvenirnici je karamela bila na akciji \"Kupi {n1,1} funtu za ${p1,3} po funti, dobij {n2,1} funtu {discount,1/2} popusta.\" Sakupila je {n12,4} funti. Također je kupila mješovitu vrećicu školjki za ${p2,1.5} i {n3,4} magneta koji su bili ${p3,0.25} svaki. Koliko novca {name,Sally} ima preostalo?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} kupuje {n1} funtu za ${p1} i dobiva {n2} funtu {discount} popusta. Dakle {discount} od {n2} funti je ${p1}*{discount} = ${float(n2*discount*p1)}. Preostalih {n12-n1-n2} funti nema popust i košta {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}, pa je ukupno ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} magneta po ${p3} svaki je {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nKada zbrojiš sve njezine kupnje, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nImala je ${total} i potrošila ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}, pa je imala ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} preostalo\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
