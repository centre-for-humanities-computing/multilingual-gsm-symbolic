question = "Sally otišla je na more na odmor. Njezini su joj roditelji dali $15 da kupi što god želi. U suvenirnici je karamela bila na akciji \"Kupi 500 grama za $3, dobij 500 grama za 1/2 cijene.\" Sakupila je 2000 grama. Također je kupila mješovitu vrećicu školjki za $1.5 i 4 magneta koji su bili $0.25 svaki. Koliko novca Sally ima preostalo?"
answer = "Karamela košta $3 za 500 grama i dobiva 500 grama za 1/2 cijene. Dakle 1/2 od cijene 500 grama je 500/500*1/2*$3 = $1.5.\nZajedno to košta $1.5 + $3 = $4.5.\nPreostalih 1000 grama nema popust i košta $6, pa je ukupna cijena $3 + $1.5 + $6 = $<<3 + 1.5 + 6 = 10.5>>10.5\n4 magneta po $0.25 svaki je 4*$0.25=$<<4*0.25=1>>1\nKada zbrojiš sve njezine kupnje, $10.5 + $1.5 + $1 = $<<10.5+1.5+1=13>>13\nImala je $15 i potrošila $13, pa ima $15 - $13 = $<<15-13=2>>2 preostalo\n#### 2\n"
