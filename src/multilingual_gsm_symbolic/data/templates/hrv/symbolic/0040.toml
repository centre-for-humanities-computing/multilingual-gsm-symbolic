question = "Sally otišla je na more na odmor. Njezini su joj roditelji dali $15 da kupi što god želi. U suvenirnici je karamela bila na akciji \"Kupi 1 funtu za $3 po funti, dobij 1 funtu 1/2 popusta.\" Sakupila je 4 funti. Također je kupila mješovitu vrećicu školjki za $1.5 i 4 magneta koji su bili $0.25 svaki. Koliko novca Sally ima preostalo?"
answer = "Sally kupuje 1 funtu za $3 i dobiva 1 funtu 1/2 popusta. Dakle 1/2 od 1 funti je $3*1/2 = $1.5. Preostalih 2 funti nema popust i košta 2*$3 = $6, pa je ukupno $3+$3/2+$6=$21/2\n4 magneta po $0.25 svaki je 4*0.25=$<<4*0.25=1>>1\nKada zbrojiš sve njezine kupnje, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nImala je $15 i potrošila $13, pa je imala $15-$13 = $<<15-13=2>>2 preostalo\n#### 2\n"
