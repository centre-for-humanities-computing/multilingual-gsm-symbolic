question = "Garrett na-akpọ nri popcorn maka nri nta. Ka kpan nke mkpụrụ na-ekpo ọkụ, mkpụrụ ndị ahụ na-amalite ịkpọ ngwa ngwa. 20 na-akpọ n'ime 30 sekọnd mbụ nke nri, mgbe ahụ ugboro atọ nke ọnụọgụ ahụ n'ime 30 sekọnd ọzọ. Mkpụrụ ndị ahụ na-abawanye ruo ugboro anọ nke ọnụego mbụ nke ịkpọ n'ime 30 sekọnd ọzọ, mana n'ime 30 sekọnd ikpeazụ, ịkpọ na-ebelata ruo ọkara nke ọnụego dị ka 30 sekọnd gara aga. Mgbe Garrett ewepụrụ kpan ahụ n'ọkụ, otu ụzọ n'ụzọ anọ nke ọnụọgụ mkpụrụ ndị na-akpọ n'ime 30 sekọnd ikpeazụ nke nri na-akpọkwa site na okpomọkụ fọdụrụ. Olee ole akụkụ nri popcorn Garrett ga-eri?"
