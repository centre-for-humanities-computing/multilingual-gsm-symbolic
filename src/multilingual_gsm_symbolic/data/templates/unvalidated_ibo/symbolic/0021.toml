answer_annotated = "Ka E bụrụ ọnụ ọgụgụ ihe nkiri o leghaara na {d3}.\nMgbe {d1} gasịrị, o nwere {total} - {h1} = <<{total}-{h1}={total-h1}>>{total-h1} awa nke TV fọdụrụ.\nMgbe {d2} gasịrị, o nwere {total-h1} - {h1} = <<{total-h1}-{h1}={total-2*h1}>>{total-2*h1} awa nke TV fọdụrụ.\nMgbe {d4} gasịrị, o nwere {total-2*h1} - {h2} - {m2/60} = {total-2*h1-h2- m2/60} awa nke TV fọdụrụ.\nMgbe {d5} gasịrị, o nwere {total-2*h1-h2-m2/60} - {n2_val*h3} = {total-2*h1-h2-m2/60-n2_val*h3} awa nke TV fọdụrụ.\nIhe nkiri {m1}-nkeji ọ bụla bụ {Fraction(m1/60)} awa.\nN'ihi ya, E = {total-2*h1-h2-m2/60-n2_val*h3}/{m1/60} = {int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)} ihe nkiri.\n#### {int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)}\n"
