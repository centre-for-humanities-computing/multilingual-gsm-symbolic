question = "Frankie na-ele TV mgbe ọ mechara ọrụ ụlọ ya n'abalị ọ bụla. Na Mọnde na Tuzdee, o leghaara ihe nkiri nke 1-awa nke ihe nkiri ọ hụrụ n'anya n'abalị ọ bụla. Na Wenezdee, o leghaara ụfọdụ ihe nkiri nke ihe nkiri nkeji 30. Na Tọzdee, o mechara ọrụ ụlọ ya n'oge ma lelee ihe nkiri 1-awa na ihe nkiri nkeji 30. Na Fraịdee, o nwere ike ịnọgide n'abalị, ya mere o leghaara abụọ 1-awa ihe nkiri. Ọ bụrụ na o leghaara 7 awa nke TV n'ozuzu, olee ole n'ime ihe nkiri nkeji 30 ka o leghaara na Wenezdee?"
answer = "Ka E bụrụ ọnụ ọgụgụ ihe nkiri o leghaara na Wenezdee.\nMgbe Mọnde gasịrị, o nwere 7 - 1 = <<7-1=6>>6 awa nke TV fọdụrụ.\nMgbe Tuzdee gasịrị, o nwere 6 - 1 = <<6-1=5>>5 awa nke TV fọdụrụ.\nMgbe Tọzdee gasịrị, o nwere 5 - 1 - 0.5 = 3.5 awa nke TV fọdụrụ.\nMgbe Fraịdee gasịrị, o nwere 3.5 - 2 = 1.5 awa nke TV fọdụrụ.\nIhe nkiri 30-nkeji ọ bụla bụ 1/2 awa.\nN'ihi ya, E = 1.5/0.5 = 3 ihe nkiri.\n#### 3\n"
