question = "ସାଲି ବିଶ୍ରାମ ପାଇଁ ସମୁଦ୍ର ତୀରକୁ ଯାଇଥିଲେ। ତାଙ୍କ ପିତାମାତା ତାଙ୍କୁ $15 ଦେଲେ ଯାହା ସେ ଯାହା ଚାହିଁବେ ତାହା କିଣିପାରିବେ। ସାଉଭେନିର୍ ଦୋକାନରେ, ଟାଫି ବିକ୍ରିରେ ଥିଲା: \"1 ପାଉଣ୍ଡ $3 ପ୍ରତି ପାଉଣ୍ଡ ହାରରେ କିଣନ୍ତୁ, 1 ପାଉଣ୍ଡ 1/2 ଛାଡ୍ ପାଇବେ।\" ସେ 4 ପାଉଣ୍ଡ ନେଲେ। ସେ $1.5 ଟଙ୍କାରେ ଏକ ମିଶ୍ରିତ ସିପି ଥଳି ଏବଂ 4 ଟି ଚୁମ୍ବକ ମଧ୍ୟ କିଣିଲେ ଯାହା ପ୍ରତ୍ୟେକ $0.25 ଥିଲା। ସାଲି କେତେ ଟଙ୍କା ବାକି ରଖିଲେ?"
answer = "ସାଲି 1 ପାଉଣ୍ଡ $3 ପାଇଁ କିଣୁଛନ୍ତି ଏବଂ 1 ପାଉଣ୍ଡ 1/2 ଛାଡ୍ ପାଉଛନ୍ତି। ତେଣୁ 1 ପାଉଣ୍ଡ ରେ 1/2 ଛାଡ୍ ହେଉଛି $3*1/2 = $1.5। ବାକି 2 ପାଉଣ୍ଡ ରେ କୌଣସି ଛାଡ୍ ନାହିଁ ଏବଂ ମୂଲ୍ୟ 2*$3 = $6, ତେଣୁ ମୋଟ ହେଉଛି $3+$3/2+$6=$21/2\n4 ଚୁମ୍ବକ ପ୍ରତ୍ୟେକ $0.25 ରେ 4*0.25=$<<4*0.25=1>>1\nଯେତେବେଳେ ଆପଣ ସମସ୍ତ କିଣାକାଣି ଯୋଗ କରନ୍ତି, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nସେ $15 ଥିଲେ ଏବଂ $13 ଖର୍ଚ୍ଚ କଲେ ତେଣୁ ସେ $15-$13 = $<<15-13=2>>2 ବାକି ରଖିଲେ\n#### 2\n"
