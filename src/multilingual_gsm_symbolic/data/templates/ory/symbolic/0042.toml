question = "ରୋଜର୍ ଦୋକାନକୁ କିଛି କଫି କିଣିବାକୁ ଯାଆନ୍ତି। ସେ ଯାହା ସାଧାରଣତଃ କିଣନ୍ତି, ସେହି କଫି ବ୍ରାଣ୍ଡର ମୂଲ୍ୟ ପ୍ରତି ପାଉଣ୍ଡ $5 ହେଉଛି। ତାଙ୍କର ପ୍ରିୟ ବ୍ରାଣ୍ଡ ସରିଯାଇଥିବାରୁ, ତାଙ୍କୁ 20% ଅଧିକ ମୂଲ୍ୟର ଅଧିକ ମହଙ୍ଗା ବ୍ରାଣ୍ଡ କିଣିବାକୁ ପଡିଲା। ସେ ଗୋଟିଏ ସପ୍ତାହ ପାଇଁ କଫି କିଣିବାକୁ ସ୍ଥିର କଲେ ଏବଂ ସେ ପ୍ରତିଦିନ 1 ପାଉଣ୍ଡ କଫି ବ୍ୟବହାର କରନ୍ତି। ସେ ନିଜ ପାଇଁ ଏକ ଡୋନଟ୍ ମଧ୍ୟ $2 ରେ କିଣିବାକୁ ସ୍ଥିର କଲେ। ସମସ୍ତଙ୍କର ମୋଟ ମୂଲ୍ୟ କେତେ ହେଲା?"
