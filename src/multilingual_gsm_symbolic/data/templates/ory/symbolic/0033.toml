question = "କ୍ୟାରଲ୍ ଏବଂ ଜେନିଫର୍ ଲୋସ୍ ଆଞ୍ଜିଲସ୍ରୁ ଆସିଥିବା ଭଉଣୀମାନେ ଯିଏ ପ୍ରସିଦ୍ଧ ବ୍ୟକ୍ତିଙ୍କ ଠାରୁ ସ୍ୱାକ୍ଷର ସଂଗ୍ରହ କରିବାକୁ ପସନ୍ଦ କରନ୍ତି। ବିଦ୍ୟାଳୟରୁ ଗ୍ରୀଷ୍ମ ବିରତି ସମୟରେ, ଭଉଣୀମାନେ ପ୍ରତିଦିନ ଅପରାହ୍ନରେ ସ୍ୱାକ୍ଷର ସଂଗ୍ରହ କରନ୍ତି। ପାଞ୍ଚ ସପ୍ତାହ ପରେ, କ୍ୟାରଲ୍ ଏବଂ ଜେନିଫର୍ ତାଙ୍କର ଅଟୋଗ୍ରାଫ୍ ବୁକ୍ ତୁଳନା କରନ୍ତି, ପ୍ରତ୍ୟେକ ଭଉଣୀ କେତେ ସ୍ୱାକ୍ଷର ସଂଗ୍ରହ କରିଛନ୍ତି ତାହା ଗଣନା କରନ୍ତି। କ୍ୟାରଲ୍ଙ୍କ ବୁକ୍ରେ 20ଟି ସ୍ୱାକ୍ଷର ଅଛି, ଏବଂ ଜେନିଫର୍ଙ୍କ ପାଖରେ 44ଟି ଅଛି। ଭଉଣୀମାନଙ୍କ ପାଖରେ ତିନି ଅଧିକ ସପ୍ତାହର ଗ୍ରୀଷ୍ମ ବିରତି ଅଛି, ଏବଂ ସେମାନେ ନିଷ୍ପତ୍ତି ନେଲେ ଯେ ସେମାନେ ବିରତିର ଅନ୍ତରେ ମିଶି 100ଟି ସ୍ୱାକ୍ଷର ପାଇବାକୁ ଚାହୁଁଛନ୍ତି। ସେମାନଙ୍କ ଲକ୍ଷ୍ୟ ପୂରଣ କରିବା ପାଇଁ ଭଉଣୀମାନଙ୍କୁ କେତେ ସ୍ୱାକ୍ଷର ସଂଗ୍ରହ କରିବାକୁ ପଡିବ?"
answer = "କ୍ୟାରଲ୍ ଏବଂ ଜେନିଫର୍ ପୂର୍ବରୁ 20 + 44 ସ୍ୱାକ୍ଷର ସଂଗ୍ରହ କରିସାରିଛନ୍ତି = <<20+44=64>>64 ସ୍ୱାକ୍ଷର।\nଯେହେତୁ ସେମାନଙ୍କ ଲକ୍ଷ୍ୟ ହେଉଛି 100, ସେମାନଙ୍କୁ 100 - 64 ସ୍ୱାକ୍ଷର ସଂଗ୍ରହ କରିବାକୁ ପଡିବ। 100 - 64 = <<100-64=36>>36 ସ୍ୱାକ୍ଷର\n#### 36\n"
