question = "ଏମିଲି ଏକ ମିନିଟରେ 6 ଝିଙ୍ଗା ଛିଣ୍ଡାଇପାରେ ଏବଂ 10 ମିନିଟରେ 30 ଝିଙ୍ଗା ଭାଜିପାରେ। 90 ଝିଙ୍ଗା ଛିଣ୍ଡାଇ ଏବଂ ଭାଜିବାକୁ ତାଙ୍କୁ କେତେ ସମୟ ଲାଗିବ? ଏମିଲି ଏକାସାଙ୍ଗରେ ଛିଣ୍ଡାଇ ଏବଂ ଭାଜିପାରିବେ ନାହିଁ।"
answer = "ପ୍ରଥମେ ନିର୍ଣ୍ଣୟ କରନ୍ତୁ ଏମିଲି କୁ ଝିଙ୍ଗା ଛିଣ୍ଡାଇବାକୁ କେତେ ସମୟ ଲାଗେ: 90 ଝିଙ୍ଗା / 6 ଝିଙ୍ଗା/ମିନିଟ = <<90/6=15>>15 ମିନିଟ\nତାପରେ ନିର୍ଣ୍ଣୟ କରନ୍ତୁ ସେ ରାନ୍ଧିବା ପାଇଁ କେତେ ବ୍ୟାଚ୍ ଝିଙ୍ଗା ଆବଶ୍ୟକ: 90 ଝିଙ୍ଗା / 30 ଝିଙ୍ଗା/ବ୍ୟାଚ୍ = <<90/30=3>>3 ବ୍ୟାଚ୍\nତାପରେ ମୋଟ ରାନ୍ଧଣା ସମୟ ବାହାର କରିବା ପାଇଁ ବ୍ୟାଚ୍ ସଂଖ୍ୟାକୁ ପ୍ରତି ବ୍ୟାଚ୍ ସମୟ ଦ୍ୱାରା ଗୁଣନ କରନ୍ତୁ: 3 ବ୍ୟାଚ୍ * 10 ମିନିଟ/ବ୍ୟାଚ୍ = <<3*10=30>>30 ମିନିଟ\nତାପରେ ଛିଣ୍ଡାଇବା ସମୟ ଯୋଗ କରି ଏମିଲି ର ମୋଟ ସମୟ ନିର୍ଣ୍ଣୟ କରନ୍ତୁ: 30 ମିନିଟ + 15 ମିନିଟ = <<30+15=45>>45 ମିନିଟ\n#### 45"
