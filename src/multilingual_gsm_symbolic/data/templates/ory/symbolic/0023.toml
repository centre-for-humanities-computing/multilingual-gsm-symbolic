question = "ମାର୍ଥା ତାଙ୍କର 3 ନାତି-ନାତିନିଙ୍କ ପାଇଁ ଶୀତ ବସ୍ତ୍ର ବୁଣୁଛନ୍ତି। ସେମାନେ ତିନିଜଣ ଯମଜ, ତେଣୁ ସେମାନଙ୍କର ଆକାର ସମାନ ଅଟେ। ସେ ପ୍ରତ୍ୟେକଙ୍କ ପାଇଁ ଏକ ଟୋପି, ସ୍କାର୍ଫ, ସ୍ୱେଟର, ହାତମୁଟି, ଏବଂ ମୋଜା ପ୍ରସ୍ତୁତ କରିବାକୁ ଚାହୁଁଛନ୍ତି। ଏକ ଟୋପି ପ୍ରସ୍ତୁତ କରିବା ପାଇଁ 2 ତାର ଉଲ ଆବଶ୍ୟକ ହୁଏ, ସ୍କାର୍ଫ ପାଇଁ 4, ସ୍ୱେଟର ପାଇଁ 12, ଏକ ଜୋଡ଼ା ହାତମୁଟି ପାଇଁ 1, ଏବଂ ଏକ ଜୋଡ଼ା ମୋଜା ପାଇଁ 2। ସେ କେତେ ତାର ଉଲ କିଣିବା ଆବଶ୍ୟକ ହେବ?"
