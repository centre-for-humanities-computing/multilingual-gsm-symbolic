question = "ଏକ କୃଷକ ନିଜର ଘୋଡ଼ା ପାଇଁ ଖାଦ୍ୟ କିଣୁଛନ୍ତି। ସେ ବିଭିନ୍ନ ପ୍ରକାରର ଘାସ, ଓଟ, ଗାଜର ଏବଂ ଚିନି ଟୁକୁଡ଼ା କିଣନ୍ତି। ଯେହେତୁ ଚିନି ଟୁକୁଡ଼ା ଏକ ବିରଳ ଉପହାର, ସେ ସମଗ୍ର ଗୋଷ୍ଠଳ ପାଇଁ କେବଳ ଦୁଇ 1-ପାଉଣ୍ଡ ବକ୍ସ କିଣନ୍ତି। ସେ କେବଳ ଗାଜର ଏତେ କିଣନ୍ତି ଯେପରିକି ଘୋଡ଼ା ଗୁଡ଼ିକୁ ଶାକାହାରୀଗୁଡ଼ିକ ତାଜା ଥିବା ସମୟରେ ଖାଇବାକୁ ମିଳିପାରିବ, ତେଣୁ ସେ ଚାରି 12-ପାଉଣ୍ଡ ବ୍ୟାଗ୍ କିଣନ୍ତି। ଘାସ ହେଉଛି ତାଙ୍କର ଘୋଡ଼ା ଗୁଡ଼ିକର ମୁଖ୍ୟ ଖାଦ୍ୟ, ତେଣୁ ସେ ଚାଳିଶି ଦୁଇ 75-ପାଉଣ୍ଡ ପ୍ୟାକ୍ କିଣନ୍ତି। ଓଟ ହେଉଛି ଘାସ ପୂରକ କରିବା ପାଇଁ ଏକ ମୁଖ୍ୟ ଖାଦ୍ୟ, ତେଣୁ ସେ ବିଶ 65-ପାଉଣ୍ଡ ଥଳି କିଣନ୍ତି। ଯଦି ତାଙ୍କର କୃଷି ଟ୍ରକ୍ ଗୋଟିଏ ଥରରେ 2250 ପାଉଣ୍ଡ ବହନ କରିପାରେ, ତେବେ ସମସ୍ତ ଖାଦ୍ୟ ଢୁଳାଇବା ପାଇଁ କୃଷକଙ୍କୁ କେତେ ଟ୍ରିପ୍ ଆବଶ୍ୟକ?"
