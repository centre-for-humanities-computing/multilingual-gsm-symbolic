question = "ତୌଲା ବେକେରି ଗଲା ଏବଂ ବିଭିନ୍ନ ପ୍ରକାରର ପ୍ୟାଷ୍ଟ୍ରି କିଣିଲା। ସେ 3 ଡଜନ୍ ଡୋନଟ୍ କିଣିଲା ଯାହାର ମୂଲ୍ୟ ପ୍ରତି ଡଜନ୍ $68, 2 ଡଜନ୍ ମିନି କକେପ୍ ଯାହାର ମୂଲ୍ୟ ପ୍ରତି ଡଜନ୍ $80, ଏବଂ 6 ଡଜନ୍ ମିନି ଚିଜ୍‌କେକ୍ ପାଇଁ ପ୍ରତି ଡଜନ୍ $55। ମୋଟ ମୂଲ୍ୟ କେତେ ଥିଲା?"
