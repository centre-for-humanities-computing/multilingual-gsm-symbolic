question = "ବେନି ଏକ 10-ଫୁଟ ଶାଠ ଦେଖିଲା ଯାହା ସହିତ 2ଟି 6-ଇଞ୍ଚ ରେମୋରା ଲାଗିରହିଛି। ଶାଠର ଶରୀର ଦୈର୍ଘ୍ୟର କେତେ ପ୍ରତିଶତ ରେମୋରାଗୁଡ଼ିକର ମିଶ୍ରିତ ଦୈର୍ଘ୍ୟ ଅଟେ?"
answer = "ପ୍ରଥମେ, ଇଞ୍ଚରେ ରେମୋରାଗୁଡ଼ିକର ମିଶ୍ରିତ ଦୈର୍ଘ୍ୟ ନିର୍ଣ୍ଣୟ କରନ୍ତୁ: 6 ଇଞ୍ଚ/ରେମୋରା * 2 ରେମୋରା = <<6*2=12>>12 ଇଞ୍ଚ।\nତାପରେ ସେହି ସଂଖ୍ୟାକୁ 12 ଦ୍ୱାରା ଭାଗ କରନ୍ତୁ ଯାହାଦ୍ୱାରା ଏହା ଫୁଟରେ ପରିଣତ ହେବ: 12 ଇଞ୍ଚ / 12 ଇଞ୍ଚ/ଫୁଟ = <<12/12=1>>1 ଫୁଟ।\nତାପରେ ଫୁଟରେ ଥିବା ରେମୋରାଗୁଡ଼ିକର ମିଶ୍ରିତ ଦୈର୍ଘ୍ୟକୁ ଶାଠର ଦୈର୍ଘ୍ୟ ଦ୍ୱାରା ଭାଗ କରନ୍ତୁ ଏବଂ ଉତ୍ତରକୁ ପ୍ରତିଶତରେ ପ୍ରକାଶ କରିବା ପାଇଁ 100% ଦ୍ୱାରା ଗୁଣନ କରନ୍ତୁ: 1 ଫୁଟ / 10 ଫୁଟ * 100% = 10%\n\n#### 10\n"
