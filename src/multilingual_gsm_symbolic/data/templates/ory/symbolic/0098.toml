answer = "ପ୍ରଥମ ଦିନରେ, ମୂଳ ଦଶ ଜଣଙ୍କ ପ୍ରତ୍ୟେକ ଛଅ ଜଣଙ୍କୁ ସଂକ୍ରମିତ କରନ୍ତି, ତେଣୁ 10*6 = <<10*6=60>>60 ଅଧିକ ଲୋକ ସଂକ୍ରମିତ ହୁଅନ୍ତି।\nପ୍ରଥମ ଦିନ ପରେ 10+60 = <<10+60=70>>70 ସଂକ୍ରମିତ ଲୋକ ଅଛନ୍ତି।\nଦ୍ୱିତୀୟ ଦିନରେ, 70*6 = <<70*6=420>>420 ଅଧିକ ଲୋକ ସଂକ୍ରମିତ ହୁଅନ୍ତି।\nଦ୍ୱିତୀୟ ଦିନ ପରେ 70 + 420 = <<70+420=490>>490 ସଂକ୍ରମିତ ଲୋକ ଅଛନ୍ତି।\nତୃତୀୟ ଦିନରେ, 490*6 = 2940 ଅଧିକ ଲୋକ ସଂକ୍ରମିତ ହୁଅନ୍ତି। ତେଣୁ, ତିନି ଦିନ ପରେ 490 + 2940 = 3430 ସଂକ୍ରମିତ ଲୋକ ଅଛନ୍ତି।\n#### 3430\n"
