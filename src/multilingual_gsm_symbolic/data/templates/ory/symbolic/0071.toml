answer = "ପ୍ରଥମେ ଜାଣିବା ଯେ ପ୍ରତ୍ୟେକ ଲାମା କେତେ ଚାରା ଆବଶ୍ୟକ କରେ: 5 ପାଉଣ୍ଡ * 2 - 3 = <<5*2-3=7>>7 ପାଉଣ୍ଡ/ଲାମା\nବର୍ତ୍ତମାନ ଗଣନା କରନ୍ତୁ ଯେ ମୋଟ ଲାମାଗୁଡ଼ିକୁ କେତେ ଚାରା ଆବଶ୍ୟକ: 7 ପାଉଣ୍ଡ/ଲାମା * 12 ଲାମାଗୁଡ଼ିକ = <<7*12=84>>84 ପାଉଣ୍ଡ\nବର୍ତ୍ତମାନ ଗଣନା କରନ୍ତୁ ଯେ ମୋଟ ଛାଗଗୁଡ଼ିକୁ କେତେ ଚାରା ଆବଶ୍ୟକ: 5 ପାଉଣ୍ଡ/ଛାଗ * 15 ଛାଗଗୁଡ଼ିକ = <<5*15=75>>75 ପାଉଣ୍ଡ\nବର୍ତ୍ତମାନ ମୋଟ ପରିମାଣ ବାହାର କରିବା ପାଇଁ ଚାରାର ଦୁଇଟି ପରିମାଣ ଯୋଗ କରନ୍ତୁ: 84 ପାଉଣ୍ଡ + 75 ପାଉଣ୍ଡ = <<84+75=159>>159 ପାଉଣ୍ଡ\n#### 159\n"
