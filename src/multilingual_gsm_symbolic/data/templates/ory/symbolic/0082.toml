question = "ପାର୍ଟି ଆରମ୍ଭରେ, 25 ପୁରୁଷ ଏବଂ 15 ମହିଳା ଥିଲେ। ଗୋଟିଏ ଘଣ୍ଟା ପରେ, ମୋଟ ଲୋକଙ୍କ ସଂଖ୍ୟାର 1/4 ଚାଲିଗଲେ। ମହିଳା କେତେ ବାକି ଅଛନ୍ତି ଯଦି 22 ପୁରୁଷ ପାର୍ଟି ରେ ରହିଲେ?"
answer = "ମୋଟ 25 ପୁରୁଷ + 15 ମହିଳା = <<25+15=40>>40 ଜଣ ଲୋକ ପାର୍ଟି ରେ ଯୋଗ ଦେଇଥିଲେ।\nଗୋଟିଏ ଘଣ୍ଟା ପରେ, 40 ଜଣ ଲୋକଙ୍କ ମଧ୍ୟରୁ 1/4 ଅଂଶ = <<40*1/4=10>>10 ଜଣ ପାର୍ଟି ଛାଡ଼ି ଚାଲିଗଲେ।\nଏହାର ଅର୍ଥ ହେଲା 40 ଜଣ ଲୋକଙ୍କ ମଧ୍ୟରୁ 10 ଜଣ ବାଦ୍ ଦେଲେ = <<40-10=30>>30 ଜଣ ରହିଲେ।\nରହିଥିବା 30 ଜଣଙ୍କ ମଧ୍ୟରୁ, 30 ଜଣ - 22 ପୁରୁଷ = <<30-22=8>>8 ଜଣ ମହିଳା ଥିଲେ।\n#### 8\n"
