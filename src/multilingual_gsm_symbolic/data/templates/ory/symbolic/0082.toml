answer_annotated = "ମୋଟ {m} {group1} + {w} {group2} = <<{m}+{w}={m+w}>>{m+w} ଜଣ ଲୋକ {event} ରେ ଯୋଗ ଦେଇଥିଲେ।\n{t} ପରେ, {m+w} ଜଣ ଲୋକଙ୍କ ମଧ୍ୟରୁ {frac} ଅଂଶ = <<{m+w}*{frac}={int((m+w)*frac)}>>{int((m+w)*frac)} ଜଣ {event} ଛାଡ଼ି ଚାଲିଗଲେ।\nଏହାର ଅର୍ଥ ହେଲା {m+w} ଜଣ ଲୋକଙ୍କ ମଧ୍ୟରୁ {int((m+w)*frac)} ଜଣ ବାଦ୍ ଦେଲେ = <<{m+w}-{int((m+w)*frac)}={m+w-int((m+w)*frac)}>>{m+w-int((m+w)*frac)} ଜଣ ରହିଲେ।\nରହିଥିବା {m+w-int((m+w)*frac)} ଜଣଙ୍କ ମଧ୍ୟରୁ, {m+w-int((m+w)*frac)} ଜଣ - {m_left} {group1} = <<{m+w-int((m+w)*frac)}-{m_left}={m+w-int((m+w)*frac)-m_left}>>{m+w-int((m+w)*frac)-m_left} ଜଣ {group2} ଥିଲେ।\n#### {m+w-int((m+w)*frac)-m_left}\n"
