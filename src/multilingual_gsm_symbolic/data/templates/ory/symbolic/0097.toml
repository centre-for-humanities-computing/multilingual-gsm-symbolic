question = "ଜୁଲି ତାଙ୍କର କମ୍ ଅନୁଭବସମ୍ପନ୍ନ ସହକାରୀ ଜେୱେଲ ଅପେକ୍ଷା କ୍ୟାସ୍ ରେଜିଷ୍ଟରକୁ ସଠିକ୍ ଭାବରେ ଦୁଇଗୁଣ ଦ୍ରୁତ ଗତିରେ ଚଳାନ୍ତି। ପ୍ରତିଦିନ, ଜେୱେଲ 50 ଜଣ ଗ୍ରାହକଙ୍କୁ ପ୍ରକ୍ରିୟାକରଣ କରନ୍ତି। ଯଦି ସେମାନେ ସପ୍ତାହର ସମସ୍ତ ଦିନ କାମ କରନ୍ତି, ତେବେ ଦୁଇଜଣଙ୍କର ସାପ୍ତାହିକ ମୋତ ଉତ୍ପାଦନ କେତେ?"
