question = "ଫ୍ରାଙ୍କି ପ୍ରତି ରାତିରେ ତାଙ୍କର ଗୃହକାର୍ଯ୍ୟ ସମାପ୍ତ କରିବା ପରେ ଟିଭି ଦେଖନ୍ତି। ସୋମବାର ଏବଂ ମଙ୍ଗଳବାର ରେ, ସେ ପ୍ରତି ରାତିରେ ତାଙ୍କର ପ୍ରିୟ ଶୋର 1 ଘଣ୍ଟାର ଏକ ଏପିସୋଡ୍ ଦେଖିଥିଲେ। ବୁଧବାର ରେ, ସେ 30 ମିନିଟର ଏକ ଶୋରର କିଛି ଏପିସୋଡ୍ ଦେଖିଥିଲେ। ବୃହସ୍ପତିବାର ରେ, ସେ ଗୃହକାର୍ଯ୍ୟ ଶୀଘ୍ର ସମାପ୍ତ କରିଥିଲେ ଏବଂ 1 ଘଣ୍ଟାର ଏକ ଏପିସୋଡ୍ ଏବଂ 30 ମିନିଟର ଏକ ଶୋ ଦେଖିଥିଲେ। ଶୁକ୍ରବାର ରେ, ସେ ରାତିରେ ଦୀର୍ଘ ସମୟ ପର୍ଯ୍ୟନ୍ତ ଜାଗି ରହିପାରିଲେ, ତେଣୁ ସେ ଦୁଇଟି 1 ଘଣ୍ଟାର ଏପିସୋଡ୍ ଦେଖିଥିଲେ। ଯଦି ସେ ସମୁଦାୟ 7 ଘଣ୍ଟା ଟିଭି ଦେଖିଥିଲେ, ତେବେ ସେ ବୁଧବାର ରେ କେତେଟା 30 ମିନିଟର ଏପିସୋଡ୍ ଦେଖିଥିଲେ?"
answer = "ଧରାଯାଉ E ହେଉଛି ସେ ବୁଧବାର ରେ ଦେଖିଥିବା ଏପିସୋଡ୍ ସଂଖ୍ୟା।\nସୋମବାର ପରେ, ତାଙ୍କ ପାଖରେ 7 - 1 = <<7-1=6>>6 ଘଣ୍ଟା ଟିଭି ଦେଖିବାକୁ ବାକି ଥିଲା।\nମଙ୍ଗଳବାର ପରେ, ତାଙ୍କ ପାଖରେ 6 - 1 = <<6-1=5>>5 ଘଣ୍ଟା ଟିଭି ଦେଖିବାକୁ ବାକି ଥିଲା।\nବୃହସ୍ପତିବାର ପରେ, ତାଙ୍କ ପାଖରେ 5 - 1 - 0.5 = 3.5 ଘଣ୍ଟା ଟିଭି ଦେଖିବାକୁ ବାକି ଥିଲା।\nଶୁକ୍ରବାର ପରେ, ତାଙ୍କ ପାଖରେ 3.5 - 2 = 1.5 ଘଣ୍ଟା ଟିଭି ଦେଖିବାକୁ ବାକି ଥିଲା।\nପ୍ରତ୍ୟେକ 30-ମିନିଟର ଏପିସୋଡ୍ 1/2 ଘଣ୍ଟା ଅଟେ।\nତେଣୁ, E = 1.5/0.5 = 3 ଟି ଏପିସୋଡ୍।\n#### 3\n"
