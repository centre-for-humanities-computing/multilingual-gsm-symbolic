question = "ଆର୍ଟି କୃଷକ ବଜାରରେ ଏକ ଫୁଲ ସ୍ଟାଣ୍ଡ ରଖନ୍ତି। ସେ ଫୁଲର ତିନି ପ୍ରକାର ବିକ୍ରି କରନ୍ତି: ଗେଣ୍ଡା, ପେଟୁନିଆ ଏବଂ ବେଗୋନିଆ। ସେ ସାଧାରଣତଃ ଗେଣ୍ଡା ପ୍ରତି ପୋଟ ପାଇଁ ₹2.74, ପେଟୁନିଆ ପ୍ରତି ପୋଟ ପାଇଁ ₹1.87 ଏବଂ ବେଗୋନିଆ ପ୍ରତି ପୋଟ ପାଇଁ ₹2.12 ମୂଲ୍ୟରେ ବିକ୍ରି କରନ୍ତି। ଆର୍ଟିଙ୍ଗ ପାଖରେ ଆଜି କ୍ଷୁଦ୍ର ମୁଦ୍ରା ନାହିଁ, ତେଣୁ ସେ ସମସ୍ତ ମୂଲ୍ୟକୁ ନିକଟତମ ଟଙ୍କାରେ ଗୋଲ କରିବାକୁ ନିର୍ଣ୍ଣୟ କରିଛନ୍ତି। ଯଦି ଆର୍ଟି 12 ପୋଟ ଗେଣ୍ଡା, 9 ପୋଟ ପେଟୁନିଆ ଏବଂ 17 ପୋଟ ବେଗୋନିଆ ବିକ୍ରି କରନ୍ତି, ତେବେ ସେ କେତେ ଟଙ୍କା କମାଉଥିବେ?"
answer = "ଆର୍ଟି ଗେଣ୍ଡାର ମୂଲ୍ୟ ₹2.74 ରୁ ₹3 ପର୍ୟ୍ୟନ୍ତ ଉପରକୁ ଗୋଲ କରିବେ, କାରଣ 2 ପରେ ଆସୁଥିବା ସଂଖ୍ୟା 5 ବା ତା'ଠାରୁ ଅଧିକ ଅଟେ।\nଆର୍ଟି ପେଟୁନିଆର ମୂଲ୍ୟ ₹1.87 ରୁ ₹2 ପର୍ୟ୍ୟନ୍ତ up ଗୋଲ କରିବେ, କାରଣ 1 ପରେ ଆସୁଥିବା ସଂଖ୍ୟା 5 or higher ଅଟେ।\nଆର୍ଟି ବେଗୋନିଆର ମୂଲ୍ୟ ₹2.12 ରୁ ₹2 ପର୍ୟ୍ୟନ୍ତ down ଗୋଲ କରିବେ, କାରଣ 2 ପରେ ଆସୁଥିବା ସଂଖ୍ୟା less than 5 ଅଟେ।\nଆର୍ଟି 12 ଗେଣ୍ଡା*₹3 ବିକ୍ରି କରନ୍ତି = ₹<<12*3=36>>36\nଆର୍ଟି 9 ପେଟୁନିଆ*₹2 ବିକ୍ରି କରନ୍ତି = ₹<<9*2=18>>18\nଆର୍ଟି 17 ବେଗୋନିଆ*₹2 ବିକ୍ରି କରନ୍ତି = ₹<<17*2=34>>34\nସର୍ବମୋଟ, ଆର୍ଟି ₹36 + ₹18 + ₹34 = ₹<<36+18+34=88>>88 ଟଙ୍କା କମାଉଥିବେ।\n#### 88\n"
