question = "ସନି ଏକ ଅର୍ଥ ସଂଗ୍ରହ ପାଇଁ ଜିଙ୍ଗରବ୍ରେଡ୍ ଏବଂ ଆପଲ ପାଇ ବିକ୍ରି କରୁଛନ୍ତି। ଶନିବାର ଦିନ, ସେ 10 ଟି ଜିଙ୍ଗରବ୍ରେଡ୍ ପେଟି ଏବଂ ରବିବାର ତୁଳନାରେ 4 ଟି କମ୍ ଆପଲ ପାଇ ପେଟି ବିକ୍ରି କରିଥିଲେ। ରବିବାର ଦିନ, ସେ ଶନିବାର ତୁଳନାରେ 5 ଟି ଅଧିକ ଜିଙ୍ଗରବ୍ରେଡ୍ ପେଟି ଏବଂ 15 ଟି ଆପଲ ପାଇ ପେଟି ବିକ୍ରି କରିଥିଲେ। ଯଦି ଜିଙ୍ଗରବ୍ରେଡ୍ ର କିମ୍ମତ $6 ହୁଏ ଏବଂ ଆପଲ ପାଇ ର କିମ୍ମତ $15 ହୁଏ, ତେବେ ସନି ଦୁଇ ଦିନ ପାଇଁ କେତେ ଅର୍ଥ ଅର୍ଜନ କଲେ?"
answer = "ସେ ରବିବାର ଦିନ ଜିଙ୍ଗରବ୍ରେଡ୍ ର 10 + 5 = <<10+5=15>>15 ଟି ପେଟି ବିକ୍ରି କରିଥିଲେ।\nସନି ବିକ୍ରି କରିଥିବା ଜିଙ୍ଗରବ୍ରେଡ୍ ର ମୋଟ ପେଟି ସଂଖ୍ୟା 10 + 15 = <<10+15=25>>25 ଅଟେ।\nଜିଙ୍ଗରବ୍ରେଡ୍ ବିକ୍ରି ପାଇଁ ସନି ଅର୍ଜନ କଲେ 25*$6 = $<<25*6=150>>150।\nସେ ଶନିବାର ଦିନ ଆପଲ ପାଇ ର 15 - 4 = <<15-4=11>>11 ଟି ପେଟି ବିକ୍ରି କରିଥିଲେ।\nସନି ବିକ୍ରି କରିଥିବା ଆପଲ ପାଇ ର ମୋଟ ପେଟି ସଂଖ୍ୟା 15 + 11 = <<15+11=26>>26 ଅଟେ।\nଆପଲ ପାଇ ବିକ୍ରି ପାଇଁ ସେ ଅର୍ଜନ କଲେ 26*$15 = $<<26*15=390>>390।\nତେଣୁ, ସନି ଦୁଇ ଦିନ ପାଇଁ $150 + $390 = $<<150+390=540>>540 ଅର୍ଜନ କଲେ।\n#### 540\n"
