question = "ମାରିଆ ପ୍ରତି $8 ରେ 8 ଷ୍ଟକ୍ ସେୟାର କିଣନ୍ତି। ଷ୍ଟକ୍ ମୂଲ୍ୟ ପ୍ରଥମ ବର୍ଷ ମାରିଆ ଧରିରଖେ ସମୟରେ 50% ବଢେ, ତାପରେ ଦ୍ୱିତୀୟ ବର୍ଷରେ 25% ହ୍ରାସ ପାଏ। ମାରିଆ ର ସମସ୍ତ ସେୟାରର ଅନ୍ତିମ ମୂଲ୍ୟ କେତେ?"
answer = "ପ୍ରଥମେ ମାରିଆ ର କ୍ରୟର ପ୍ରାରମ୍ଭିକ ମୋଟ ମୂଲ୍ୟ ନିର୍ଣ୍ଣୟ କରନ୍ତୁ: 8 ସେୟାର * $8/ସେୟାର = $<<8*8=64>>64\nତାପରେ ପ୍ରଥମ ମୂଲ୍ୟ ବୃଦ୍ଧିର ପରିମାଣ ନିର୍ଣ୍ଣୟ କରନ୍ତୁ: $64 * 0.5 = $<<64*0.5=32>>32\nପ୍ରଥମ ବର୍ଷ ପରେ ମୂଲ୍ୟ ନିର୍ଣ୍ଣୟ କରିବା ପାଇଁ ସେହି ପରିମାଣକୁ ପ୍ରାରମ୍ଭିକ ମୂଲ୍ୟରେ ଯୋଗ କରନ୍ତୁ: $64 + $32 = $<<64+32=96>>96\nତାପରେ ଦ୍ୱିତୀୟ ବର୍ଷରେ ହ୍ରାସର ପରିମାଣ ନିର୍ଣ୍ଣୟ କରିବା ପାଇଁ ସେହି ପରିମାଣକୁ 25% ଦ୍ୱାରା ଗୁଣନ କରନ୍ତୁ: $96 * 25% = $<<96*25*.01=24>>24\nତାପରେ ଅନ୍ତିମ ମୂଲ୍ୟ ନିର୍ଣ୍ଣୟ କରିବା ପାଇଁ ପ୍ରଥମ ବର୍ଷ ପରେ ମୂଲ୍ୟରୁ ସେହି ପରିମାଣକୁ ବିୟୋଗ କରନ୍ତୁ: $96 - $24 = $<<96-24=72>>72\n#### 72\n"
