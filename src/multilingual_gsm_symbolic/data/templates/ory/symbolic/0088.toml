answer = "ଯଦି ଡାନା ଅଧା ବେଗରେ ଛାଁଟିପାରେ ଯେଉଁଥିରେ ସେ ଦୌଡ଼ିପାରେ, ତେବେ ସେ 3*2=<<3*2=6>>6 ମାଇଲ୍ ପ୍ରତି ଘଣ୍ଟାରେ ଦୌଡ଼ିପାରିବ।\nଏବଂ ଯେହେତୁ ସେ ଚାରି ଗୁଣ ଅଧିକ ବେଗରେ ଦୌଡ଼ିପାରେ ଯେଉଁଥିରେ ସେ ଚାଲିପାରେ, ଏହାର ଅର୍ଥ ହେଲା ସେ 6/5=1.2 ମାଇଲ୍ ପ୍ରତି ଘଣ୍ଟାରେ ଚାଲିପାରିବ।\nଯଦି ଦୁଇ ତୃତୀୟାଂଶ ସମୟ ଚାଲିବାରେ ଖର୍ଚ୍ଚ ହୁଏ, ତେବେ ସେ 6*2/3=<<6*2/3=4>>4 ଘଣ୍ଟା ଚାଲିବ।\nଯଦି ଏକ ତୃତୀୟାଂଶ ସମୟ ଦୌଡ଼ିବାରେ ଖର୍ଚ୍ଚ ହୁଏ, ତେବେ ସେ 6-4=<<6-4=18/5>>18/5 ଘଣ୍ଟା ଦୌଡ଼ିବ।\nତେଣୁ, ସେ 18/5 ଘଣ୍ଟା 6 ମାଇଲ୍ ପ୍ରତି ଘଣ୍ଟାରେ ଦୌଡ଼ିବ, ବା 18/5*6=<<18/5*6=108/5>>108/5 ମାଇଲ୍।\nସେ 4 ଘଣ୍ଟା 1.2 ମାଇଲ୍ ପ୍ରତି ଘଣ୍ଟାରେ ଚାଲିବ, ବା 4*1.2=<<4*1.2=24/5>>24/5 ମାଇଲ୍।\nତେଣୁ, ସର୍ବମୋଟ, ସେ 108/5+24/5=<<108/5+24/5=26>>26 ମାଇଲ୍ ଯାତ୍ରା କରେ।\n#### 26\n"
