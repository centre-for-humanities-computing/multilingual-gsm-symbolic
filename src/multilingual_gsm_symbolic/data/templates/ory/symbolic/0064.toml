question = "ମେରିଙ୍କ ପାଖରେ ପ୍ୟାଣ୍ଟ୍ରି ରେ 6 ଟି ସ୍ପ୍ରିଙ୍କଲ୍ସ ଜାର୍ ଅଛି। ପ୍ରତ୍ୟେକ ସ୍ପ୍ରିଙ୍କଲ୍ସ ଜାର୍ 8 ଟି କ୍ୟାପ୍‌କେକ୍ ସଜାଇପାରେ। ମେରି ତାଙ୍କର ସମସ୍ତ ସ୍ପ୍ରିଙ୍କଲ୍ସ ବ୍ୟବହାର କରିବା ପାଇଁ ଯଥେଷ୍ଟ କ୍ୟାପ୍‌କେକ୍ ଗୁଡ଼ିକୁ ବେକ୍ କରିବାକୁ ଚାହୁଁଛନ୍ତି। ଯଦି ପ୍ରତ୍ୟେକ ପ୍ୟାନ୍ ରେ 12 ଟି କ୍ୟାପ୍‌କେକ୍ ଧରାଯାଏ, ତେବେ ସେ କେତେ ପ୍ୟାନ୍ ଯୋଗ୍ୟ କ୍ୟାପ୍‌କେକ୍ ବେକ୍ କରିବା ଉଚିତ?"
answer = "ତାଙ୍କ ପାଖରେ 6 * 8 = <<6*8=48>>48 ଟି କ୍ୟାପ୍‌କେକ୍ ପାଇଁ ଯଥେଷ୍ଟ ସ୍ପ୍ରିଙ୍କଲ୍ସ ଅଛି।\nସମସ୍ତ କ୍ୟାପ୍‌କେକ୍ ବେକ୍ କରିବା ପାଇଁ ସେ 48 / 12 = <<48/12=4>>4 ଟି ପ୍ୟାନ୍ ଆବଶ୍ୟକ କରେ।\n#### 4\n"
