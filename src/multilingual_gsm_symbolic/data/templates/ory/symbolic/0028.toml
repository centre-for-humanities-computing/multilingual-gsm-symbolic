question = "ଏକ ଅସ୍ପତାଳ ରେ 1000 ଶଯ୍ୟା ର କ୍ଷମତା ଅଛି ଯାହା 1/5 ଅଧିକୃତ ଅଟେ। କରୋନା ଭୂତାଣୁ ସଂକ୍ରମଣ ଯୋଗୁଁ, ପ୍ରତିଦିନ 50 ରୋଗୀ ଅସ୍ପତାଳ ରେ ଭର୍ତ୍ତି ହୁଅନ୍ତି। 2 ସପ୍ତାହ ପରେ ଅସ୍ପତାଳ ରେ ଥିବା ମୋଟ ଅବକ୍ଷିପ୍ତ ଶଯ୍ୟାଗୁଡ଼ିକର ସଂଖ୍ୟା ଗଣନା କରନ୍ତୁ।"
answer = "ଯଦି ଅସ୍ପତାଳ ର ମୋଟ ଶଯ୍ୟା କ୍ଷମତା ର 1/5 ଅଂଶ ଅଧିକୃତ ହୋଇଥାଏ, ଏହାର ଅର୍ଥ ହେଲା 1/5 * 1000 = <<1000*1/5=200>>200 ଶଯ୍ୟାଗୁଡ଼ିକରେ ରୋଗୀମାନେ ବ୍ୟବହାର କରୁଛନ୍ତି।\nନୂତନ ଭର୍ତ୍ତି ବିନା ଅସ୍ପତାଳ ର ମୋଟ ଶଯ୍ୟାଗୁଡ଼ିକର ସଂଖ୍ୟା ହେଉଛି 1000 ଶଯ୍ୟାଗୁଡ଼ିକ - 200 ଶଯ୍ୟାଗୁଡ଼ିକ = <<1000-200=800>>800 ଶଯ୍ୟାଗୁଡ଼ିକ।\nଯଦି ପ୍ରତିଦିନ 50 ଲୋକ ଭର୍ତ୍ତି ହୁଅନ୍ତି, ତେବେ ଗୋଟିଏ ସପ୍ତାହ ପରେ ଅସ୍ପତାଳ ର ମୋଟ ରୋଗୀ ସଂଖ୍ୟା ହେଉଛି 50 ରୋଗୀ/ଦିନ * 7 ଦିନ/ସପ୍ତାହ = 350 ରୋଗୀ।\n2 ସପ୍ତାହ ପରେ, ଅସ୍ପତାଳ ରେ ଭର୍ତ୍ତି ହୋଇଥିବା ମୋଟ ରୋଗୀ ସଂଖ୍ୟା ହେଉଛି 350 ରୋଗୀ/ସପ୍ତାହ * 2 ସପ୍ତାହ = <<350*2=700>>700 ରୋଗୀ, ଯେଉଁମାନେ ପ୍ରତ୍ୟେକ ଗୋଟିଏ ଶଯ୍ୟା ବ୍ୟବହାର କରନ୍ତି।\nଯଦି ନୂତନ ଭର୍ତ୍ତି ପୂର୍ବରୁ ଅସ୍ପତାଳ ରେ 800 ଅବକ୍ଷିପ୍ତ ଶଯ୍ୟାଗୁଡ଼ିକ ଥିଲା, ସଂଖ୍ୟା ହ୍ରାସ ପାଇ 800 ଶଯ୍ୟାଗୁଡ଼ିକ - 700 ଶଯ୍ୟାଗୁଡ଼ିକ = <<800-700=100>>100 ଅବକ୍ଷିପ୍ତ ଶଯ୍ୟାଗୁଡ଼ିକ ହେଲା।\n#### 100\n"
