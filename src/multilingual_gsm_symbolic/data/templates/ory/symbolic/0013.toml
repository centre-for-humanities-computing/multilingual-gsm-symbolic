question = "ମେରି ଏକ ଜଣେ ଉତ୍ସାହିତ ବଗିଚାଦାକ୍ଷର ଅଟନ୍ତି। କାଲେ, ସେ ତାଙ୍କ ପ୍ରିୟ ଉଦ୍ଭିଦ ନର୍ସରୀରୁ 18ଟି ନୂତନ ପୋଟ୍ ଗଛ ପାଇଥିଲେ। ସେ ତାଙ୍କର ବଡ଼ ଗ୍ରାମ୍ୟ ଘରର 40ଟି ଜାଲିର ଧାରରେ ପ୍ରତ୍ୟେକ 2ଟି ପୋଟ୍ ଗଛ ପୂର୍ବରୁ ରଖିଛନ୍ତି। ଦୟାଳୁ ଭାବନାରେ, ସେ ନିଷ୍ପତ୍ତି ନେଇଛନ୍ତି ଯେ ସେ କାଲି ବନ୍ଧୁ ଏବଂ ପରିବାରକୁ ପ୍ରତ୍ୟେକ ଧାରରୁ 1ଟି ପୋଟ୍ ଗଛ ଦିଅବେ। ମେରି ପାଖରେ କେତେ ପୋଟ୍ ଗଛ ରହିବ?"
answer = "କାଲେ, ଗଛ ପାଇବା ପୂର୍ବରୁ, ମେରି ପାଖରେ 2*40 = <<2*40=80>>80ଟି ପୋଟ୍ ଗଛ ଥିଲା\nଅତିରିକ୍ତ 18ଟି ଗଛ ପାଇବା ପରେ, ତେଣୁ ସେମାନଙ୍କର ମୋଟ 80 + 18 = <<80+18=98>>98ଟି ପୋଟ୍ ଗଛ ଥିଲା\nକାଲି, ମେରିଙ୍କ ଗଛ ଦାନ 40*1 = <<40*1=40>>40ଟି ପୋଟ୍ ଗଛ ହେବ।\nତେଣୁ ସେ ପାଖରେ 98 - 40 = <<98-40=58>>58ଟି ପୋଟ୍ ଗଛ ରହିବେ।\n#### 58\n"
