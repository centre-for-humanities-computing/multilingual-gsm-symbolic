question = "ଶ୍ରୀ ଟାନ୍ ତାଙ୍କର ଘର $400,000 ପାଇଁ ବିକ୍ରି କରିଥିଲେ। ସେ ଟ୍ରାନ୍ସଫର ଶୁଳ୍କ ଦେଇଥିଲେ ଯାହା ବିକ୍ରି ମୂଲ୍ୟର 3% ଅଟେ ଏବଂ ବ୍ରୋକରେଜ ଶୁଳ୍କ ମଧ୍ୟ ଦେଇଥିଲେ ଯାହା ବିକ୍ରି ମୂଲ୍ୟର 5% ଅଟେ। ଯଦି ସେ ମଧ୍ୟ ଘର ର ବାକି ଋଣ ରାଶି ପାଇଁ $250,000 ଦେଇଥିଲେ, ଶ୍ରୀ ଟାନ୍ ର ବିକ୍ରିରୁ ମିଳୁଥିବା ନିଟ୍ ଉତ୍ପାଦନ କେତେ?"
