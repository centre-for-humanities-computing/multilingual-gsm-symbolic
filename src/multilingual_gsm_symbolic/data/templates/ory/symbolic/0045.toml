question = "ପାଟ ର ଏକ ଫୁଲ ବେଡ୍ ଅଛି ଯାହା 111 ଫୁଟ ଲମ୍ବ ଅଟେ। ପାଟ ତାଙ୍କର ଫୁଲ ବେଡ୍ ଉଦ୍ଭିଦ ଦ୍ୱାରା ପୂର୍ଣ୍ଣ କରିବାକୁ ଚାହୁଁଛନ୍ତି। ପାଟ ର ଫୁଲଗୁଡ଼ିକ 12 ଇଞ୍ଚ ପ୍ରସ୍ଥରେ ବଢନ୍ତି, ଏବଂ ଗାର୍ଡେନିଂ ନିର୍ଦ୍ଦେଶାବଳୀ କହନ୍ତି ଯେ ବେଡ୍ ଚାରିପାଖରେ ପ୍ରତି 1.5 ଫୁଟ ପ୍ରତି ଗୋଟିଏ ଫୁଲ ରୋପଣ କରାଯାଏ। ପାଟ ପାଖରେ ପୂର୍ବରୁ 17 ଟି ଫୁଲ ଅଛି। ପ୍ରତ୍ୟେକ ଫୁଲ ଉଦ୍ଭିଦର ମୂଲ୍ୟ ଦୋକାନରେ ₹6 ଅଟେ। ପାଟ ତାଙ୍କର ଫୁଲ ବେଡ୍ ପୂର୍ଣ୍ଣ କରିବା ପାଇଁ ଦୋକାନରେ କେତେ ଟଙ୍କା ଖର୍ଚ୍ଚ କରିବେ?"
answer = "ପାଟ ର ଫୁଲ ବେଡ୍ 111 ଫୁଟ / 1.5 ଫୁଟ ପ୍ରତି ଉଦ୍ଭିଦ = <<111/1.5=74>>74 ଟି ଉଦ୍ଭିଦ ଆବଶ୍ୟକ।\nପାଟ କିଣିବା ଆବଶ୍ୟକ 74 ଟି ଉଦ୍ଭିଦ - 17 ଟି ଉଦ୍ଭିଦ = <<74-17=57>>57 ଟି ଉଦ୍ଭିଦ କିଣିବା ପାଇଁ ଆବଶ୍ୟକ।\nପାଟ ଖର୍ଚ୍ଚ କରିବେ 57 ଟି ଉଦ୍ଭିଦ * ₹6 = ₹<<57*6=342>>342।\n#### 342\n"
