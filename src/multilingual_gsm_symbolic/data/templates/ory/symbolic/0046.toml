question = "ଆପଲେ ହାଇ ସ୍କୁଲ ଏହି ବର୍ଷ ସେମାନଙ୍କର ସୁନ୍ଦର କଳା କେନ୍ଦ୍ର ରେ ସ୍ନାତକୋତ୍ତର ସମାରୋହ ଆୟୋଜନ କରୁଛି ଯାହାର ସ୍ଥାନ 6000 ଜଣଙ୍କ ପାଇଁ ଅଛି। 950 ଜଣ ଛାତ୍ର ଏବଂ 300 ଜଣ ଉପାଧ୍ୟାୟଙ୍କ ପାଇଁ ଆସନ ଆକଳନ କରିବା ପରେ, ଯଦି ଟିକେଟ୍ ସମାନ ଭାବରେ ବଣ୍ଟନ କରାଯାଏ, ତେବେ ପ୍ରତ୍ୟେକ ଛାତ୍ର ନିଜ ବନ୍ଧୁ ଏବଂ ପରିବାରକୁ ଦେବା ପାଇଁ କେତେ ଟିକେଟ୍ ପାଇବେ?"
