question = "दादी रोज़ाना 3 मीलs अपनै पसंदीदा चलनै कै रास्ते पर चलत हई, जिसमैं समुद्र किनारै पर 2 मीलs चलना शामिल हई और फुटपाथ पर 1 मील(s) चलना शामिल हई। फुटपाथ पर, दादी समुद्र किनारै पर चलनै कै रफ़्तार से दुगनी रफ़्तार से चलत हई। अगर उसके चलनै का 40 मिनट समुद्र किनारै पर बिता हई, तौ पूरै 3-मील चलनै में उसे कितना समय लगेगा, मिनट में?"
