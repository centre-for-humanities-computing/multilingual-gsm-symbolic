question = "सली छुट्टी मनाने समुद्र तट पर गई। उसके माता-पिता ने उसे $15 दिए जो भी वह चाहती खरीदने के लिए। सूवनीयर दुकान पर, ताफी बिक्री पर थी \"1 पाउंड $3 प्रति पाउंड पर खरीदें, 1 पाउंड 1/2 की छूट पाएं।\" उसने 4 पाउंड उठाए। उसने $1.5 के लिए समुद्री शेलों का मिश्रित थैला भी खरीदा और 4 मैग्नेट जो $0.25 प्रति थे। सली के पास कितना पैसा बचा है?"
answer = "सली $3 के लिए 1 पाउंड खरीद रही है और 1 पाउंड 1/2 की छूट पा रही है। तो 1 पाउंड पर 1/2 की छूट $3*1/2 = $1.5 है। बाकी के 2 पाउंड पर छूट नहीं है और इसकी कीमत 2*$3 = $6 है, इसलिए कुल $3+$3/2+$6=$21/2 है\n4 मैग्नेट $0.25 प्रति हैं 4*0.25=$<<4*0.25=1>>1\nजब आप उसकी सभी खरीदारी जोड़ते हैं, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nउसके पास $15 थे और उसने $13 खर्च किए इसलिए उसके पास $15-$13 = $<<15-13=2>>2 बचे\n#### 2\n"
