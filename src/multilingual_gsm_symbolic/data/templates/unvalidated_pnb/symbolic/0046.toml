question = "ਐਪਲ ਹਾਈ ਸਕੂਲ ਇਸ ਸਾਲ ਆਪਣੇ ਫਾਈਨ ਆਰਟਸ ਸੈਂਟਰ ਵਿੱਚ ਸਮਾਪਤੀ ਸਮਾਰੋਹ ਆਯੋਜਿਤ ਕਰ ਰਿਹਾ ਹੈ ਜਿਸ ਵਿੱਚ 6000 ਲੋਕਾਂ ਦੀ ਥਾਂ ਹੈ। 950 ਵਿਦਿਆਰਥੀਆਂ ਲਈ ਕੁਰਸੀਆਂ ਅਤੇ 300 ਅਧਿਆਪਕਾਂ ਲਈ ਕੁਰਸੀਆਂ ਦੀ ਗਿਣਤੀ ਕਰਨ ਤੋਂ ਬਾਅਦ, ਜੇਕਰ ਟਿਕਟਾਂ ਬਰਾਬਰ ਵੰਡੀਆਂ ਜਾਣ ਤਾਂ ਹਰੇਕ ਵਿਦਿਆਰਥੀ ਨੂੰ ਆਪਣੇ ਦੋਸਤਾਂ ਅਤੇ ਪਰਿਵਾਰ ਨੂੰ ਦੇਣ ਲਈ ਕਿੰਨੀਆਂ ਟਿਕਟਾਂ ਮਿਲਣਗੀਆਂ?"
