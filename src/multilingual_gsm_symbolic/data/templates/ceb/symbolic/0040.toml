question = "Sally miadto sa baybayon para sa bakasyon. Iyang mga ginikanan naghatag kaniya og $15 para makapalit og bisan unsa nga gusto niya. Sa tindahan sa mga souvenir, ang taffy anaa sa sale alang sa \"Palit 1 pound sa $3 kada pound, makakuha 1 pound sa 1/2 discount.\" Gikuha niya og 4 pounds. Gipalit usab niya og usa ka bag sa mga kagatok alang sa $1.5 ug 4 magnets nga $0.25 ang matag usa. Pila ang kwarta nga naa pa ni Sally?"
