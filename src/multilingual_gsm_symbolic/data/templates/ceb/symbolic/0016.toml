question = "Sunny nagbaligya og gingerbread ug mansanas pai para sa pangayam. Sa Sabado, nakabenta siya og 10 ka kahon sa gingerbread ug 4 ka kulang nga kahon sa mansanas pai, kaysa sa Domingo. Sa Domingo, nakabenta siya og 5 ka daghan nga kahon sa gingerbread kaysa sa Sabado ug 15 ka kahon sa mansanas pai. Kung ang gingerbread nagkantidad og $6 ug ang mansanas pai nagkantidad og $15, pila ang nakakita ni Sunny sa duha ka adlaw?"
