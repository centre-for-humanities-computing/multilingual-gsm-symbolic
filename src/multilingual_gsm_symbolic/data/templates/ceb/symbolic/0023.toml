question = "Martha nagkatit og panglamig para sa iyang 3 ka apdo. Sila mga tulo ka anak nga gipanganak sabay, busa sila tanan parehas og gidak-on. Gusto niya nga magbuhat og usa ka sapot, pangabog, sweater, mittens, ug socks alang sa matag usa kanila. Kinahanglan og 2 ka skeins sa lana aron makabuo og usa ka sapot, 4 para sa usa ka pangabog, 12 para sa usa ka sweater, 1 para sa usa ka par sa mittens, ug 2 para sa usa ka par sa socks. Pila ka skeins sa lana ang kinahanglan niya paliton?"
