question = "Ang usa ka ospital adunay kapasidad nga 1000 kamas nga 1/5 naka-okupar. Dahil sa pagkalat sa coronavirus, 50 ka pasyente ang gipasulod sa ospital matag adlaw. Kalkula ang kinatibuk-ang gidaghanon sa mga dili naka-okupar nga kamas sa ospital human sa 2 ka semana."
