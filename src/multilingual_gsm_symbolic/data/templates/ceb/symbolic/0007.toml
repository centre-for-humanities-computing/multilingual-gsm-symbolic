question = "Usa ka magsasaka nagpalit og pagkaon para sa iyang kabayo. Nagpalit siya og lain-laing damgo, gats, karot ug sukar cubes. Tungod kay ang sukar cubes usa ka raryo nga ginhigugma, nagpalit siya og lang duha 1-libra nga kahon niini para sa tibuok establo. Gusto lang niya og saktong karot para pagpakaon sa kabayo samtang bag-ong gulay pa, busa nagpalit siya og upat 12-libra nga bag. Ang damgo mao ang pangunang pagkaon sa iyang kabayo, busa nagpalit siya og kwarenta ug duha 75-libra nga pak. Ang gats usa ka pangunang pagkaon aron mapadugang ang damgo, busa nagpalit siya og kaluhaan 65-libra nga sako. Kung ang iyang farm truck makadala og 2250 libras sa usa ka higayon, pila ka biyahe ang kinahanglan sa magsasaka aron mapadala ang tanan nga pagkaon?"
