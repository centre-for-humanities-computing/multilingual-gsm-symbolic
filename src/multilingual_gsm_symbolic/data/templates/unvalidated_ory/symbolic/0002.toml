question = "ଜେରୀ ଏକ ଛଅ-ପାର୍ଶ୍ୱ ଡାଇସ୍ ଗଡ଼ାଉଛି। ସେ 3 ଠାରୁ ଅଧିକ ସଂଖ୍ୟା ଗଡ଼ାଇବା ଏବଂ କ୍ରମାଗତ ଭାବରେ ଦୁଇଟି ସମ ସଂଖ୍ୟା ଗଡ଼ାଇବା ମଧ୍ୟରେ ସମ୍ଭାବନା କେତେ ଅଧିକ (ଶତକଡ଼ା ବିନ୍ଦୁରେ ପ୍ରକାଶ କରାଯାଇ)?"
answer = "ଡାଇସ୍ ଉପରେ 3 ଠାରୁ ଅଧିକ 3 ସଂଖ୍ୟା ଅଛି, ତେଣୁ ସେଥିମଧ୍ୟରୁ ଗୋଟିଏ ଗଡ଼ାଇବାର ସମ୍ଭାବନା 3/6=50%।\nଗୋଟିଏ ସମ ସଂଖ୍ୟା ଗଡ଼ାଇବାର ସମ୍ଭାବନା 50%, ତେଣୁ କ୍ରମାଗତ ଭାବରେ ଦୁଇଟି ଗଡ଼ାଇବାର ସମ୍ଭାବନା 50% * 50% = 25%।\nଏହି ଦୁଇଟି ସମ୍ଭାବନା ମଧ୍ୟରେ ପାର୍ଥକ୍ୟ ହେଉଛି 50% - 25% = 25%।\n#### 25\n"
