question = "බෝවන රෝගයක් දහය දෙනෙකුට බෝ කරයි. සෑම දිනකම, රෝගයට පත් සෑම පුද්ගලයෙකුම අන් හය දෙනෙකුට බෝ කරයි. දින තුනකට පසු කොපමණ දෙනෙකු රෝගයට පත් වී ඇත්ද?"
answer = "පළමු දිනෙහි, මුල් දහය දෙනා අන් හය දෙනෙකු බැගින් බෝ කරන බැවින්, 10*6 = <<10*6=60>>60 දෙනෙකු තවදුරටත් රෝගයට පත් වේ.\nපළමු දින අවසානයේ 10+60 = <<10+60=70>>70 දෙනෙකු රෝගයට පත් වී ඇත.\nදෙවන දිනෙහි, 70*6 = <<70*6=420>>420 දෙනෙකු තවදුරටත් රෝගයට පත් වේ.\nදෙවන දින අවසානයේ 70 + 420 = <<70+420=490>>490 දෙනෙකු රෝගයට පත් වී ඇත.\nතෙවන දිනෙහි, 490*6 = 2940 දෙනෙකු තවදුරටත් රෝගයට පත් වේ. එබැවින්, දින තුනකට පසු 490 + 2940 = 3430 දෙනෙකු රෝගයට පත් වී ඇත.\n#### 3430\n"
