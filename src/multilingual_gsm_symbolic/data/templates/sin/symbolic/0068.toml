question = "කාමර්මන් විසින් ක්රොස්වර්ඩ් පුඩල් එකක් නිම කිරීමට 10 මිනිත්තු ගත වන අතර සුඩෝකු පුඩල් එකක් නිම කිරීමට 5 මිනිත්තු ගත වේ. සතිපාත් කාලය තුළ ඇය 3 ක්රොස්වර්ඩ් පුඩල් ක් සහ 8 සුඩෝකු පුඩල් ක් විසඳා ඇත. මෙම ක්‍රීඩා සඳහා ඇය ගත කළ මුළු කාලය කොපමණද?"
answer = "ක්රොස්වර්ඩ් පුඩල් එකක් නිම කිරීමට 10 මිනිත්තු ගත වන අතර ඇය 3 ක් නිම කළාය, මුළු එකතුව 10*3 = <<10*3=30>>30 මිනිත්තු වේ\nසුඩෝකු පුඩල් එකක් නිම කිරීමට 5 මිනිත්තු ගත වන අතර ඇය 8 ක් නිම කළාය, මුළු එකතුව 5*8 = <<5*8=40>>40 මිනිත්තු වේ\nඇය ක්රොස්වර්ඩ් පුඩල් සඳහා මිනිත්තු 30 ක් සහ සුඩෝකු පුඩල් සඳහා මිනිත්තු 40 ක් වැය කළ අතර මුළු එකතුව 30+40 = <<30+40=70>>70 මිනිත්තු වේ\n#### 70\n"
