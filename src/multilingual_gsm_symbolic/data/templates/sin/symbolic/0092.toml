question = "තදීස් කුමරු 100 නාගයන් තම අභිමානී කඩුව මගින් මරා දැමීය, එහෙත් අතර් කුමරු, බෙල භාවිතා කරමින්, තදීස් කුමරු මරා දැමූ නාගයන් ගණනින් තුනෙන් හතර කොටසක් මරා දැමීය. මුසු යකඩ කලුව භාවිතා කරමින්, වෝල්ටර් කුමරු අතර් කුමරු මරා දැමූ නාගයන් ගණනින් දෙගුණයක් මරා දැමීය. නමුත් බ්‍රූස් කුමරු, තම කඩුව නිවසේ අමතක කර ගෙන, වෝල්ටර් කුමරු මරා දැමූ නාගයන් ගණනින් පස්වන කොටසක් නිය පැල භාවිතා කරමින් මරා දැමීය. බ්‍රූස් කුමරු මරා දැමූ නාගයන් ගණන කීයද?"
answer = "අතර් කුමරු තදීස් කුමරු මරා දැමූ නාගයන් ගණනින් තුනෙන් හතර කොටසක් මරා දැමීය, හෙවත් 100*3/5=<<100*3/5=60>>60 නාගයන් මරා දැමීය.\nවෝල්ටර් කුමරු අතර් කුමරු මරා දැමූ නාගයන් ගණනින් දෙගුණයක් කොටසක් මරා දැමීය, හෙවත් 5*60=<<5*60=300>>300 නාගයන් මරා දැමීය.\nබ්‍රූස් කුමරු වෝල්ටර් කුමරු මරා දැමූ නාගයන් ගණනින් පස්වන කොටසක් කොටසක් මරා දැමීය, හෙවත් 300*3/5=<<300*3/5=180>>180 නාගයන් මරා දැමීය.\n#### 180\n"
