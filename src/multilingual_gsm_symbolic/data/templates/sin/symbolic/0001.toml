question = "මුහුදු වෙරළේ සිට නගරයක් ආවරණය කිරීමට කුණාටු වලාකුළක් පැමිණේ. නගරයේ සෑම 3 මයිල් එකක් ආවරණය කිරීමට 10 මිනිත්තු ගත වේ. නගරය මුහුදු වෙරළේ සිට ප්‍රතිවිරුද්ධ අභ්‍යන්තර කෙළවර දක්වා 42 මයිල් පුළුල් නම්, කුණාටු වලාකුළ නගරය පුරාම ආවරණය කිරීමට කොපමණ මිනිත්තු ගත වේද?"
answer = "නගරය ආවරණය වන්නේ 10 මිනිත්තුවලින් යුත් 42/3 = <<42/3=14>>14 කොටස් වලිනි.\nඑබැවින්, කුණාටු වලාකුළ නගරය පුරාම ආවරණය කිරීමට 14 * 10 = <<14*10=140>>140 මිනිත්තු ගත වේ.\n#### 140"
