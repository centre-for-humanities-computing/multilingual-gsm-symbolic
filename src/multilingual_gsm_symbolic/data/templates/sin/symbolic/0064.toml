question = "මැරී ඇගේ ආහාර ගබඩාව තුළ 6 සිංදු ජාර් තිබේ. එක් සිංදු ජාර් එකකින් 8 කැප්කේක් සැරසිය හැක. මැරී ඇගේ සිංදු සම්පූර්ණයෙන්ම භාවිතා කරමින් ප්‍රමාණවත් කැප්කේක් බැකින් කිරීමට අවශ්‍ය වේ. එක් පෑන් එකක 12 කැප්කේක් තිබේ නම්, ඇය කොපමණ පෑන් වලට සමාන කැප්කේක් බැකින් කළ යුතුද?"
answer = "ඇයට සිංදු ප්‍රමාණවත් වන්නේ 6 * 8 = <<6*8=48>>48 කැප්කේක් සඳහාය.\nසියලුම කැප්කේක් බැකින් කිරීමට ඇයට අවශ්‍ය වන්නේ 48 / 12 = <<48/12=4>>4 පෑන් වලිනි.\n#### 4\n"
