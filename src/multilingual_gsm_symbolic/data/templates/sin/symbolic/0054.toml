question = "දෝක්සා සම්පූර්ණ ඇපල් එකක් 18 කැබලි වලට කපා දැමුවා. ඇය 3 කැබලි කෑවා, ඇගේ සොහොයුරිය ඇයට වඩා 2 කැබලි කෑවා, සහ ඇගේ සොහොයුරා ඇගේ සොහොයුරියට වඩා 3 කැබලි කෑවා. ඔවුන් සියල්ලන්ම ඇපල් කොපමණ කැබලි කෑවේද?"
