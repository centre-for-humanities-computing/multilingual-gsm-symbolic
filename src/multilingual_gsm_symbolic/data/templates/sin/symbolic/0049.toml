question = "ජෝන් 3 විවිධ නිවාස සංකීර්ණ වලින් අපද්‍රව්‍ය එකතු කරයි. පළමු දෙක හි එක් එක් 200 නිවාස ඇත සහ අවසාන එක අනෙක් දෙක එකතුවට වඩා 60% කින් විශාලයි. ඔහු සෑම ස්ථානයකින්ම සතියකට 3 වතාවක් අපද්‍රව්‍ය එකතු කරයි සහ එක් නිවාසයකට එක් එකතු කිරීමකට ඔහුට රු0.4 ගෙවනු ලැබේ. සතියකට ඔහු කොපමණ මුදලක් උපයයිද?"
answer = "පළමු දෙක සංකීර්ණවල 2*200=<<2*200=400>>400 නිවාස ඇත\n3 වන සංකීර්ණය අනෙක් දෙක එකතුවට වඩා 400*0.6=<<400*0.6=240>>240 නිවාස වැඩිපුර ඇත.\nඑබැවින් මුළු එකතුව, එහි 400+240=<<400+240=640>>640 නිවාස ඇත.\nඑබැවින් මුළු එකතුව, ඔහු සෑම වතාවකම 640+400=<<640+400=1040>>1040 නිවාස වෙත යයි\nඑනම් ඔහු සතියකට 1040*3=<<1040*3=3120>>3120 නිවාස ප්‍රමාණයක් පරිශීලනය කරයි\nඑබැවින් ඔහු සතියකට 3120*රු0.4=රු<<3120*0.4=1248>>1248 උපයයි\n#### 1248\n"
