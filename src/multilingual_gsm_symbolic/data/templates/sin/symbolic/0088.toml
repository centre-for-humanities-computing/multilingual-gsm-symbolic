question = "දනාට ඇවිදින්නට වඩා 4 ගුණයක් වේගයෙන් දිවිය හැකි නමුත්, ඇයට දිවන වේගයෙන් අඩක් වේගයෙන් පැනිය හැකිය. ඇයට පැයකට මයිල් 3 ක් වේගයෙන් පැනිය හැකි නම්, ඇය කාලයෙන් තුනෙන් එකක් දිවීමට සහ තුනෙන් දෙකක් ඇවිදීමට වැය කරන්නේ නම්, හය පැයක කාලයකදී ඇයට ගමන් කළ හැකි මයිල් ගණන කීයද?"
answer = "දනාට දිවන වේගයෙන් අඩක් වේගයෙන් පැනිය හැකි නම්, ඇයට පැයකට මයිල් 3*2=<<3*2=6>>6 ක් වේගයෙන් දිවිය හැකිය.\nසහ ඇයට ඇවිදින්නට වඩා 4 ගුණයක් වේගයෙන් දිවිය හැකි බැවින්, ඇයට පැයකට මයිල් 6/5=1.2 ක් වේගයෙන් ඇවිදිය හැකි බව අදහස් වේ.\nකාලයෙන් තුනෙන් දෙකක් ඇවිදීමට වැය කරන්නේ නම්, ඇය පැය 6*3/5=<<6*3/5=18/5>>18/5 ක් ඇවිදියි.\nකාලයෙන් තුනෙන් එකක් දිවීමට වැය කරන්නේ නම්, ඇය පැය 6-18/5=<<6-18/5=18/5>>18/5 ක් දිවියි.\nඑබැවින්, ඇය පැය 18/5 ක් පැයකට මයිල් 6 ක් වේගයෙන් දිවියි, එනම් මයිල් 18/5*6=<<18/5*6=108/5>>108/5 කි.\nඇය පැය 18/5 ක් පැයකට මයිල් 1.2 ක් වේගයෙන් ඇවිදියි, එනම් මයිල් 18/5*1.2=<<18/5*1.2=108/25>>108/25 කි.\nඑබැවින්, මුළුමනින්ම ඇය ගමන් කරන්නේ මයිල් 108/5+108/25=<<108/5+108/25=25>>25 කි.\n#### 25\n"
