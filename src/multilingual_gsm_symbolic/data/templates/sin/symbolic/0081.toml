question = "පාස්කු කුකුළු කුරුල්ලන් සොයා යාම කණ්ඩායම 100 කුකුළු කුරුල්ලන් සඟවා තැබුවේය. ස්මිත් ද්විත්වයින් එක් එක් 30 කුකුළු කුරුල්ලන් සොයා ගත්හ. 10 හැර අනෙක් සියලුම කුකුළු කුරුල්ලන් ඔවුන්ගේ මිතුරන් විසින් සොයා ගන්නා ලදී. මිතුරන් සොයා ගත් කුකුළු කුරුල්ලන් කීයක්ද?"
answer = "ස්මිත් ද්විත්වයින් සොයා ගත්තේ, 30 * 2 = <<30*2=60>>60 කුකුළු කුරුල්ලන් යි.\nසඟවා තිබුණු ප්‍රමාණය වූයේ 100 - 60 = <<100-60=40>>40 කුකුළු කුරුල්ලන් යි\n10 කුකුළු කුරුල්ලන් සොයා නොගත් බැවින්, මිතුරන් සොයා ගත්තේ 40 - 10 = 30 කුකුළු කුරුල්ලන් යි.\n#### 30\n"
