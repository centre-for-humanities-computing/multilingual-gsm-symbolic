question = "ජෙරි විසින් පැති 6 ඇති දාදු කැටයක් ඉසේ. 3 ට වඩා වැඩි සංඛ්‍යාවක් ලැබීමේ සම්භාවිතාව, ඉරට්ටේ සංඛ්‍යා දෙකක් පිළිවෙලින් ලැබීමේ සම්භාවිතාවට වඩා කොපමණ ප්‍රතිශත ලක්ෂ්‍ය වලින් වැඩිද?"
answer = "දාදු කැටයේ 3 ට වඩා වැඩි සංඛ්‍යා 3 ක් ඇත, එබැවින් ඒවායින් එකක් ඉසීමේ අවස්ථාව 3/6=50% වේ.\nඉරට්ටේ සංඛ්‍යාවක් එකක් ඉසීමේ අවස්ථාව 50% කි, එබැවින් පිළිවෙලින් දෙකක් ඉසීමේ අවස්ථාව 50% * 50% = 25% කි.\nමෙම සම්භාවිතා දෙක අතර වෙනස 50% - 25% = 25% වේ.\n#### 25\n"
