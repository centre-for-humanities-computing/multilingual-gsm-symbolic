question = "මායාකරුගේ කාඩ්පත් සමූහයක, 15 රතු කාඩ්පත් තිබෙන අතර, 60% කින් වැඩි කොළ කාඩ්පත් තිබේ. කහ කාඩ්පත් ගණන රතු සහ කොළ කාඩ්පත් ගණනේ එකතුවට සමාන වේ. සඳහන් වූ සියලුම වර්ණවල කාඩ්පත් කීයක් තිබේද?"
answer = "60/100 * 15 = <<60/100*15=9>>9 කින් කොළ කාඩ්පත් රතු කාඩ්පත් වලට වඩා වැඩි වේ.\nඑනම් කොළ කාඩ්පත් 15 + 9 = <<15+9=24>>24 ක් ඇත.\nකහ කාඩ්පත් ගණන 15 + 24 = <<15+24=39>>39 ක් වේ.\nඑබැවින් මුළු එකතුවේ විවිධ වර්ණවල කාඩ්පත් 39 + 39 = <<39+39=78>>78 ක් ඇත.\n#### 78\n"
