answer_annotated = "ගොවියා {n4_val}*{w4} = <<{n4_val}*{w4}={n4_val*w4}>>{n4_val*w4} {unit} {rare_treat} මිලදී ගනී.\nඔහු {n3_val}*{w3} = <<{n3_val}*{w3}={n3_val*w3}>>{n3_val*w3} {unit} {treat3} මිලදී ගනී.\nඔහු {n2_val}*{w2} = <<{n2_val}*{w2}={n2_val*w2}>>{n2_val*w2} {unit} {treat2} මිලදී ගනී.\nඔහු {n1_val}*{w1} = <<{n1_val}*{w1}={n1_val*w1}>>{n1_val*w1} {unit} {treat1} මිලදී ගනී.\nසියලුම ආහාරවල බර {n4_val*w4} + {n3_val*w3} + {n2_val*w2} + {n1_val*w1} = <<{n4_val*w4}+{n3_val*w3}+{n2_val*w2}+{n1_val*w1}={n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4}>>{n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4} {unit} වේ.\nඑබැවින්, සියලුම ආහාර ඔහුගේ ගොවිපොල ට්‍රක්කුවෙන් ප්‍රවාහනය කිරීමට ගොවියාට අවශ්‍ය ගමන් සංඛ්‍යාව {n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4} / {total} = <<{n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4}/{total}={(n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4)//total}>>{(n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4)//total} වේ.\n#### {(n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4)//total}\n"
