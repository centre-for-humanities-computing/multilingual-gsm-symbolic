question = "ගොවියෙක් තමන්ගේ අශ්වයන් සඳහා ආහාර මිලදී ගනී. ඔහු විවිධ හේ, පොල්ලු, ගැටු සහ සීනි කැට මිලදී ගනී. සීනි කැට විරල සැපයක් බැවින්, ඔහු සම්පූර්ණ අශ්වස්ථානය සඳහා ඒවායින් දෙක 1-පවුම් පෙට්ටි පමණක් මිලදී ගනී. එළවළු තාජා තිබෙන තුරුම අශ්වයන් සඳහා පෝෂණය කිරීමට ගැටු ප්‍රමාණවත් වන පරිදි ඔහුට අවශ්‍ය බැවින්, ඔහු හතර 12-පවුම් බෑග් මිලදී ගනී. හේ ඔහුගේ අශ්වයන්ගේ ප්‍රධාන ආහාර වේල බැවින්, ඔහු හතළිස් දෙක 75-පවුම් පැකට්ටු මිලදී ගනී. පොල්ලු යනු හේ අමතර කරන ප්‍රධාන ආහාරයක් බැවින්, ඔහු හිස්ස 65-පවුම් සැක මිලදී ගනී. ඔහුගේ ගොවිපොල ට්‍රක්කුවට එකවර 2250 පවුම් දරා ගත හැකි නම්, සියලුම ආහාර ප්‍රවාහනය කිරීමට ගොවියාට කොපමණ ගමන් ගත යුතුද?"
answer = "ගොවියා 2*1 = <<2*1=2>>2 පවුම් සීනි කැට මිලදී ගනී.\nඔහු 10*12 = <<10*12=120>>120 පවුම් ගැටු මිලදී ගනී.\nඔහු 21*65 = <<21*65=1365>>1365 පවුම් පොල්ලු මිලදී ගනී.\nඔහු 42*75 = <<42*75=3150>>3150 පවුම් හේ මිලදී ගනී.\nසියලුම ආහාරවල බර 2 + 120 + 1365 + 3150 = <<2+120+1365+3150=4637>>4637 පවුම් වේ.\nඑබැවින්, සියලුම ආහාර ඔහුගේ ගොවිපොල ට්‍රක්කුවෙන් ප්‍රවාහනය කිරීමට ගොවියාට අවශ්‍ය ගමන් සංඛ්‍යාව 4637 / 2250 = <<4637/2250=2>>2 වේ.\n#### 2\n"
