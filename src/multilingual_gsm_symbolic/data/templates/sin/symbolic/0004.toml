question = "ගැරට් සැපයුමක් සඳහා පොප්කෝන් පිපිරවීම කරයි. පැන් හි ඇට රත් වන විට, ඇට වැඩි වේගයකින් පිපිරීම ආරම්භ කරයි. 20 පිපිරෙන්නේ පළමු 30 තත්පරය තුළ, ඉන්පසු ඊළඟ 30 තත්පරය තුළ එම ප්‍රමාණයේ තුන ගුණයක් පිපිරෙයි. ඊළඟ 30 තත්පරය තුළ ඇට පිපිරීමේ මුල් වේගයේ සතර ගුණයකට වැඩි වේ, නමුත් අවසාන 30 තත්පරය තුළ, පිපිරීම අතීත 30 තත්පරයේ වේගයෙන් අඩක් දක්වා මන්දගාමී වේ. ගැරට් පැන් තාපයෙන් ඉවත් කළ පසු, අවසාන 30 තත්පරය තුළ පිපිරුණු ඇට ගණනෙන් සතරෙන් එකක් ද අවශේෂ තාපයෙන් පිපිරෙයි. ගැරට් කෑමට සිටින්නේ පොප්කෝන් කැබලි කොපමණ ද?"
answer = "ඉදිකිරීමේ දෙවන 30 තත්පරය තුළ, 3*20=<<3*20=60>>60 ඇට පිපිරෙයි.\nතෙවන 30 තත්පරය තුළ, 4*20=<<4*20=80>>80 ඇට පිපිරෙයි.\nඅවසාන 30 තත්පරය තුළ, 80 / 2 = <<80/2=40>>40 ඇට පිපිරෙයි.\nඉදිකිරීමෙන් පසු, අවශේෂ තාපය 40 / 4 = <<40/4=10>>10 ඇට පිපිරීමට පෙළඹවයි.\nඑබැවින්, ගැරට් සතුව කෑමට පොප්කෝන් කැබලි 20 + 60 + 80 + 40 + 10 = <<20+60+80+40+10=210>>210 ක් ඇත.\n#### 210\n"
