question_annotated = "{n, බෙනි} {x,10}-අඩි දිගැති {big_fish,ෂාක්} ක් දුටුවේය. එයට {k,2} {y,6}-අඟල් රෙමෝරා ඇලී සිටී. {big_fish,ෂාක්}ගේ ශරීර දිගෙන් කොපමණ ප්‍රතිශතයක් රෙමෝරා වල එකතු දිග වේද?\n\n#init:\n- n = sample(names)\n- big_fish = sample([\"ඩොල්ෆින්\", \"තිමුණු\", \"ෂාක්\"])\n- $x = range(10, 500, 10)\n- $k = range(2, 10)\n- $y = range(2, 100)\n\n#conditions:\n- k * y < x * 12\n- divides(k*y,12)\n- divides(x * 12, k*y)\n- divides(100, x * 12 / (k*y))\n\n#answer: int((k * y)/ (x * 12) * 100)"
answer_annotated = "පළමුව, රෙමෝරා වල එකතු දිග අඟල් වලින් සොයන්න: {y} අඟල්/රෙමෝරා * {k} රෙමෝරා = <<{y}*{k}={k*y}>>{k*y} අඟල්.\nඉන්පසු එම සංඛ්‍යාව 12 න් බෙදා අඩි වලට පරිවර්තනය කරන්න: {k*y} අඟල් / 12 අඟල්/අඩි = <<{k*y}/12={k*y//12}>>{k*y//12} අඩි.\nඉන්පසු අඩි වලින් ඇති රෙමෝරා එකතු දිග {big_fish} ගේ දිගින් බෙදා පිළිතුර ප්‍රතිශතයක් ලෙස ප්‍රකාශ කිරීම සඳහා 100% න් ගුණ කරන්න: {k*y//12} අඩි / {x} අඩි * 100% = {int(k*y/(12*x)*100)}%\n\n#### {int(k*y/(12*x)*100)}"
