question = "බෙනි 10-අඩි දිගැති ෂාක් ක් දුටුවේය. එයට 2 6-අඟල් රෙමෝරා ඇලී සිටී. ෂාක්ගේ ශරීර දිගෙන් කොපමණ ප්‍රතිශතයක් රෙමෝරා වල එකතු දිග වේද?"
answer = "පළමුව, රෙමෝරා වල එකතු දිග අඟල් වලින් සොයන්න: 6 අඟල්/රෙමෝරා * 2 රෙමෝරා = <<6*2=12>>12 අඟල්.\nඉන්පසු එම සංඛ්‍යාව 12 න් බෙදා අඩි වලට පරිවර්තනය කරන්න: 12 අඟල් / 12 අඟල්/අඩි = <<12/12=1>>1 අඩි.\nඉන්පසු අඩි වලින් ඇති රෙමෝරා එකතු දිග ෂාක් ගේ දිගින් බෙදා පිළිතුර ප්‍රතිශතයක් ලෙස ප්‍රකාශ කිරීම සඳහා 100% න් ගුණ කරන්න: 1 අඩි / 10 අඩි * 100% = 10%\n\n#### 10"
