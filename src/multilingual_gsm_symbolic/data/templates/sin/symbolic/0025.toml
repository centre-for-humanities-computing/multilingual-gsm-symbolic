question = "මිස්ටර් රෝපර්ගේ පන්තියේ 30 සිසුන් සිටින අතර, පන්තියේ 20% ක් පාපන්දු ක්‍රීඩකයින් වේ. ඉතිරි පන්තියෙන්, සිසුන්ගේ 25% ක් සහායකයින් හෝ වාද්‍ය වෘන්දයේ සාමාජිකයින් වේ. මෙම සිසුන් කණ්ඩායම් 3 ක් දුර බැහැර තරඟයකට යාම සඳහා අද ඉරුදින පිටත්ව යාමට සිදුවේ. සිසුන් කී දෙනෙක් ඉරුදින පිටත්ව යනවාද?"
answer = "20% ක් 30 සිසුන් පන්තියේ පාපන්දු ක්‍රීඩකයින් වේ එනම් 0.2*30 = <<0.2*30=6>>6 සිසුන්\n30 සිසුන් සිටින අතර 6 දෙනා පාපන්දු ක්‍රීඩකයින් බැවින් ඉතිරි වන්නේ 30-6 = <<30-6=24>>24 සිසුන්\nඉතිරි 24 සිසුන්ගෙන් 25% ක් වාද්‍ය වෘන්දයේ හෝ සහායකයින් සාමාජිකයින් වේ එනම් 0.25*24 = <<0.25*24=6>>6 සිසුන්\n6 සිසුන් පාපන්දු ක්‍රීඩකයින් වන අතර 6 දෙනා වාද්‍ය වෘන්දයේ/සහායකයින් වේ එවිට 6+6 = <<6+6=12>>12 සිසුන් ඉරුදින පිටත්ව යනු ඇත\n#### 12\n"
