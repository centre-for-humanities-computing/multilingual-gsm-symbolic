question_annotated = "{name, සොෆි} තම {family, සොහොයුරු පුතා} බලා සිටින විට, ඇය ඔහු සඳහා විවිධ ක්‍රීඩා උපකරණ ගෙන එයි. ගොඩනැගිලි ගඩොල් කූඩුවේ {x,31} ගඩොල් ඇත. මෘදු සතුන් පෙට්ටිය තුළ {y,8} මෘදු සතුන් ඇත. තට්ටු මුදු රාමුවේ {z,9} වර්ණවත් මුදු ඇත. {name, සොෆි} මෑතකදී පැපෝලි ගෝල පාට්ටයක් මිලදී ගත් අතර, එමගින් තම {family, සොහොයුරු පුතා} සඳහා ඇති මුළු ක්‍රීඩා උපකරණ සංඛ්‍යාව {total,62} දක්වා ඉහළ ගියේය. පාට්ටයේ පැපෝලි ගෝල කීයක් තිබුණේද?\n\n#init:\n- name = sample(names_female)\n- family = sample([\"සොහොයුරු පුතා\", \"ඥාතී\", \"සොහොයුරා\"])\n- $x = range(31, 75)\n- $y = range(8, 50)\n- $z = range(9, 35)\n- $total = range(60, 250)\n\n#conditions:\n- total - (x + y + z) >= 20 \n- total - (x + y + z) < 100\n\n#answer: total - (x + y + z)\n"
answer_annotated = "T යනු පාට්ටයේ ඇති පැපෝලි ගෝල සංඛ්‍යාව යැයි ගනිමු.\nගෝල පාට්ටය මිලදී ගැනීමෙන් පසු, {name} සතුව තම {family} සඳහා {x} + {y} + {z} + T = {x+y+z} + T = {total} ක්‍රීඩා උපකරණ ඇත.\nඑබැවින්, T = {total} - {x+y+z} = <<{total}-{x+y+z}={total - (x + y + z)}>>{total - (x + y + z)} පැපෝලි ගෝල පාට්ටයේ තිබුණි.\n#### {total - (x + y + z)}\n"
