question = "සොෆි තම සොහොයුරු පුතා බලා සිටින විට, ඇය ඔහු සඳහා විවිධ ක්‍රීඩා උපකරණ ගෙන එයි. ගොඩනැගිලි ගඩොල් කූඩුවේ 31 ගඩොල් ඇත. මෘදු සතුන් පෙට්ටිය තුළ 8 මෘදු සතුන් ඇත. තට්ටු මුදු රාමුවේ 9 වර්ණවත් මුදු ඇත. සොෆි මෑතකදී පැපෝලි ගෝල පාට්ටයක් මිලදී ගත් අතර, එමගින් තම සොහොයුරු පුතා සඳහා ඇති මුළු ක්‍රීඩා උපකරණ සංඛ්‍යාව 62 දක්වා ඉහළ ගියේය. පාට්ටයේ පැපෝලි ගෝල කීයක් තිබුණේද?"
answer = "T යනු පාට්ටයේ ඇති පැපෝලි ගෝල සංඛ්‍යාව යැයි ගනිමු.\nගෝල පාට්ටය මිලදී ගැනීමෙන් පසු, සොෆි සතුව තම සොහොයුරු පුතා සඳහා 31 + 8 + 9 + T = 48 + T = 62 ක්‍රීඩා උපකරණ ඇත.\nඑබැවින්, T = 62 - 48 = <<62-48=14>>14 පැපෝලි ගෝල පාට්ටයේ තිබුණි.\n#### 14\n"
