question = "කාරොල් සහ ජෙනිෆර් යනු ලොස් ඇන්ජලීස් හි සිටින සහ ප්‍රසිද්ධ පුද්ගලයින්ගෙන් අත්සන් රැස් කිරීමට ආසාවෙන් සිටින සොහොයුරියන් දෙදෙනෙකි. පාසලෙන් ගිම්හාන විවේකය සමයේදී, සොහොයුරියන් සෑම දවසකම පස්වරුවේ අත්සන් රැස් කරයි. පහ සතියකට පසු, කාරොල් සහ ජෙනිෆර් තම අත්සන් පොත් සැසඳති, එක් සොහොයුරියක සොයාගත් අත්සන් ගණන ගණන් බලා. කාරොල් සතුව 20 අත්සන් තිබේ, සහ ජෙනිෆර් සතුව 44 තිබේ. සොහොයුරියන්ට තුන තව සතියක් ගිම්හාන විවේකය තිබේ, සහ ඔවුන් විවේකය අවසානය වන විට එකතුවෙන් 100 අත්සන් රැස් කිරීමට තීරණය කරති. තමන්ගේ අරමුණට පැමිණීම සඳහා සොහොයුරියන්ට රැස් කළ යුතු අත්සන් ගණන කොපමණද?"
answer = "කාරොල් සහ ජෙනිෆර් දැනටමත් 20 + 44 අත්සන් රැස් කර ඇත = <<20+44=64>>64 අත්සන්.\nඔවුන්ගේ අරමුණ 100 බැවින්, ඔවුන්ට 100 - 64 අත්සන් රැස් කළ යුතුය. 100 - 64 = <<100-64=36>>36 අත්සන්\n#### 36\n"
