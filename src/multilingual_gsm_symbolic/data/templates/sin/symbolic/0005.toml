question = "කැටි සීනි කැප්පු සහ වතුර කෝප්ප 7:13 අනුපාතයකින් භාවිතා කරමින් කෝපි සාදයි. ඇය මුළු එකතුවක් ලෙස 120 සීනි කැප්පු සහ වතුර කෝප්ප භාවිතා කළේ නම්, ඇය භාවිතා කළ සීනි කැප්පු ගණන ගණනය කරන්න."
