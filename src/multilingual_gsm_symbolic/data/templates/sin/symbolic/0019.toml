question = "60 ප්‍රශ්න ඇති ප්‍රශ්නාවලියක, ප්‍රශ්න වලින් 40% ක් පහසු වන අතර, ඉතිරිය මධ්‍යම සහ දුෂ්කර ප්‍රශ්න ලෙස සමානව බෙදේ. අරීස් පහසු ප්‍රශ්න වලින් 75% ක් නිවැරදිව ලබා ගැනීමට සහතික නම් සහ මධ්‍යම සහ දුෂ්කර ප්‍රශ්න වලින් අඩක් නිවැරදිව ලබා ගන්නේ නම්, ඇයට නිශ්චිතව ලැබෙන ලකුණු ගණන කොපමණද?"
answer = "මධ්‍යම සහ දුෂ්කර ප්‍රශ්න ප්‍රශ්නාවලියෙන් 100% - 40% = 60% ක් සමන්විත වේ.\nප්‍රශ්න 60 * 40/100 = <<60*40/100=24>>24 ක් පහසු ප්‍රශ්න වේ.\nමුළු ප්‍රශ්න 60 * 60/100 = <<60*60/100=36>>36 ක් මධ්‍යම සහ දුෂ්කර ප්‍රශ්න වේ.\nඅරීස් පහසු ප්‍රශ්න වලින් 75% ක් ලබා ගැනීමට සහතික නම්, එයින් අදහස් වන්නේ ඇයට තම 24 ප්‍රශ්න * 75/100 = <<24*75/100=18>>18 ලකුණු ලැබෙන බවයි.\nමධ්‍යම සහ දුෂ්කර ප්‍රශ්න වලින් ඇයට නිවැරදිව අඩක් ක් ලබා ගැනීමට සහතික බැවින්, එයින් 36 ප්‍රශ්න * 1/2 = <<36*1/2=18>>18 ලකුණු ලැබේ.\nඑබැවින්, ඇයට ප්‍රශ්නාවලියේදී 18 ලකුණු + 18 ලකුණු = <<18+18=36>>36 ලකුණු ලැබෙන බවට සහතිකයි.\n#### 36\n"
