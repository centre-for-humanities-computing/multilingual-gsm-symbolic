question_annotated = "{n,60} ප්‍රශ්න ඇති ප්‍රශ්නාවලියක, ප්‍රශ්න වලින් {p1,40}% ක් {s1,පහසු} වන අතර, ඉතිරිය {s2,මධ්‍යම} සහ {s3,දුෂ්කර} ප්‍රශ්න ලෙස සමානව බෙදේ. {name,අරීස්} {s1,පහසු} ප්‍රශ්න වලින් {r1,75}% ක් නිවැරදිව ලබා ගැනීමට සහතික නම් සහ {s2,මධ්‍යම} සහ {s3,දුෂ්කර} ප්‍රශ්න වලින් {frac_txt,අඩක්} නිවැරදිව ලබා ගන්නේ නම්, ඇයට නිශ්චිතව ලැබෙන ලකුණු ගණන කොපමණද?\n\n#init:\n- s1, s2, s3 = sample([\"ඉතිහාසය\", \"භූගෝල විද්‍යාව\", \"ජීව විද්‍යාව\", \"රසායන විද්‍යාව\", \"භෞතික විද්‍යාව\", \"ආර්ථික විද්‍යාව\", \"සාහිත්‍යය\", \"ආලජෙබ්‍රා\", \"ජ්‍යාමිතිය\" ], 3)\n- name = sample(names_female)\n- frac_txt, frac_val = sample(fraction_alnum)\n- $p1 = range(5, 71, 5)\n- $r1 = range(5, 101, 5)\n- $n = range(10, 151, 10)\n\n#conditions:\n- is_int(n * (p1/100))\n- is_int(n * (p1/100) * (r1/100))\n- is_int(n*(1-(p1/100))*frac_val)\n\n#answer: ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)\n"
answer_annotated = "{s2} සහ {s3} ප්‍රශ්න ප්‍රශ්නාවලියෙන් 100% - {p1}% = {100-p1}% ක් සමන්විත වේ.\nප්‍රශ්න {n} * {p1}/100 = <<{n}*{p1}/100={int(n * (p1/100))}>>{int(n * (p1/100))} ක් {s1} ප්‍රශ්න වේ.\nමුළු ප්‍රශ්න {n} * {100-p1}/100 = <<{n}*{100-p1}/100={int(n*(1-(p1/100)))}>>{int(n*(1-(p1/100)))} ක් {s2} සහ {s3} ප්‍රශ්න වේ.\n{name} {s1} ප්‍රශ්න වලින් {r1}% ක් ලබා ගැනීමට සහතික නම්, එයින් අදහස් වන්නේ ඇයට තම {int(n * (p1/100))} ප්‍රශ්න * {r1}/100 = <<{int(n * (p1/100))}*{r1}/100={int(n * (p1/100) * (r1/100))}>>{int(n * (p1/100) * (r1/100))} ලකුණු ලැබෙන බවයි.\n{s2} සහ {s3} ප්‍රශ්න වලින් ඇයට නිවැරදිව {frac_txt} ක් ලබා ගැනීමට සහතික බැවින්, එයින් {int(n*(1-(p1/100)))} ප්‍රශ්න * {frac_val} = <<{int(n*(1-(p1/100)))}*{frac_val}={ensure_int(n*(1-(p1/100))*frac_val)}>>{ensure_int(n*(1-(p1/100))*frac_val)} ලකුණු ලැබේ.\nඑබැවින්, ඇයට ප්‍රශ්නාවලියේදී {int(n * (p1/100) * (r1/100))} ලකුණු + {ensure_int(n*(1-(p1/100))*frac_val)} ලකුණු = <<{int(n * (p1/100) * (r1/100))}+{ensure_int(n*(1-(p1/100))*frac_val)}={ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)}>>{ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)} ලකුණු ලැබෙන බවට සහතිකයි.\n#### {ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)}\n"
