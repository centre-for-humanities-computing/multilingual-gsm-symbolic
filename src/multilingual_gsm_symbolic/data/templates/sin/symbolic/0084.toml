question = "මාරියා {cur}{p} ක් වටිනා 8 කොටස් මිලදී ගනී. මාරියා ඒවා හිමි කරගෙන සිටින පළමු වසරේදී ශෙයාර් මිල 50% කින් වැඩි වේ, ඉන්පසු දෙවන වසරේදී 25% කින් අඩු වේ. මාරියා හි සියලුම කොටස් වල අවසාන අගය කුමක්ද?"
