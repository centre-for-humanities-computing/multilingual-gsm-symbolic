question = "කෝල් උයනේ ඉස්තර බිත්තර සෙවීම සඳහා 3 දොඩයි බිත්තර සඟවයි. ලැමර් 5 බිත්තර සොයා ගනී. ස්ටේසි ලැමර් සොයා ගන්නා ප්‍රමාණයට දෙගුණයක් සොයා ගනී. චාල්ලි ස්ටේසි සොයා ගන්නා ප්‍රමාණයට 2 ක් අඩුවෙන් සොයා ගනී, සහ මේයි චාල්ලි සොයා ගන්නා ප්‍රමාණයට අඩක් සොයා ගනී. උයනේ තවමත් සඟවා ඇති බිත්තර කීයක්ද?"
answer = "කෝල් 3*12 = <<3*12=36>>36 බිත්තර සඟවයි.\nලැමර් 5 බිත්තර සොයා ගනී.\nස්ටේසි 5*5 = <<5*5=25>>25 බිත්තර සොයා ගනී.\nචාල්ලි 25 - 2 = <<25-2=23>>23 බිත්තර සොයා ගනී.\nමේයි 23*1/2=<<23*1/2=23/2>>23/2 බිත්තර සොයා ගනී.\nළමුන් සොයා ගන්නේ මුළු එකතුවක් වශයෙන් 5 + 25 + 23 + 23/2 = <<5+25+23+23/2=129/2>>129/2 බිත්තරයි.\nඋයනේ තවමත් සඟවා ඇති බිත්තරවල මුළු සංඛ්‍යාව 36 - 129/2 = <<36-129/2=-57/2>>-57/2 බිත්තරයි.\n#### -57/2\n"
