question = "අර්තී සතුව කෘෂිකාර්මික වෙළඳපොළ හි පුෂ්ප ස්ථානයකි. ඔහු විකුණන්නේ පුෂ්ප වර්ග තුනකි: මැරිගෝල්ඩ්, පෙටුනියා සහ බෙගෝනියා. ඔහු සාමාන්‍යයෙන් මැරිගෝල්ඩ් පෝට් එකකට රු.2.74 බැගින්, පෙටුනියා පෝට් එකකට රු.1.87 බැගින් සහ බෙගෝනියා පෝට් එකකට රු.2.12 බැගින් විකුණයි. අර්තී සතුව අද මාරු මුදල් නොමැති නිසා, ඔහු තම මිල ගණන් සියල්ල ආසන්නතම රුපියලට වටයා ගැනීමට තීරණය කර ඇත. ඔහු මැරිගෝල්ඩ් පෝට් 12 ක්, පෙටුනියා පෝට් 9 ක් සහ බෙගෝනියා පෝට් 17 ක් විකුණන්නේ නම්, ඔහුට ලැබෙනු ඇත්තේ කොපමණද?"
answer = "අර්තී තම මැරිගෝල්ඩ් මිල රු.2.74 සිට රු.3 දක්වා ඉහළට වටයයි, මන්ද 2 ට පසුව ඇති අංකය 5 හෝ ඊට වැඩි බැවිනි.\nඅර්තී තම පෙටුනියා මිල රු.1.87 සිට රු.2 දක්වා up වටයයි, මන්ද 1 ට පසුව ඇති අංකය 5 or higher බැවිනි.\nඅර්තී තම බෙගෝනියා මිල රු.2.12 සිට රු.2 දක්වා down වටයයි, මන්ද 2 ට පසුව ඇති අංකය less than 5 බැවිනි.\nඅර්තී විකුණයි 12 මැරිගෝල්ඩ්*රු.3 = රු.<<12*3=36>>36\nඅර්තී විකුණයි 9 පෙටුනියා*රු.2 = රු.<<9*2=18>>18\nඅර්තී විකුණයි 17 බෙගෝනියා*රු.2 = රු.<<17*2=34>>34\nමුළු වශයෙන්, අර්තී ලබා ගන්නාු ඇත්තේ රු.36 + රු.18 + රු.34 = රු.<<36+18+34=88>>88\n#### 88\n"
