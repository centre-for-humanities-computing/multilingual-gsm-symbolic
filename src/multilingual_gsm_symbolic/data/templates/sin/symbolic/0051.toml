question_annotated = "{name,අර්තී} සතුව {location,කෘෂිකාර්මික වෙළඳපොළ} හි {product,පුෂ්ප} ස්ථානයකි. ඔහු විකුණන්නේ {product,පුෂ්ප} වර්ග තුනකි: {item1,මැරිගෝල්ඩ්}, {item2,පෙටුනියා} සහ {item3,බෙගෝනියා}. ඔහු සාමාන්‍යයෙන් {item1,මැරිගෝල්ඩ්} {unit,පෝට්} එකකට {cur,රු.}{p1,2.74} බැගින්, {item2,පෙටුනියා} {unit,පෝට්} එකකට {cur,රු.}{p2,1.87} බැගින් සහ {item3,බෙගෝනියා} {unit,පෝට්} එකකට {cur,රු.}{p3,2.12} බැගින් විකුණයි. {name,අර්තී} සතුව අද මාරු මුදල් නොමැති නිසා, ඔහු තම මිල ගණන් සියල්ල ආසන්නතම රුපියලට වටයා ගැනීමට තීරණය කර ඇත. ඔහු {item1,මැරිගෝල්ඩ්} {unit,පෝට්} {n1,12} ක්, {item2,පෙටුනියා} {unit,පෝට්} {n2,9} ක් සහ {item3,බෙගෝනියා} {unit,පෝට්} {n3,17} ක් විකුණන්නේ නම්, ඔහුට ලැබෙනු ඇත්තේ කොපමණද?\n\n#init:\n- name = sample(names_male)\n- product = sample([\"එළවළු\", \"පුෂ්ප\", \"බෙහෙත් මල්\", \"ශාක\"])\n- location = sample([\"ප්‍රාදේශීය මේලාව\", \"සමාජ වෙළඳපොළ\", \"සිල්ලර වෙළඳපොළ\", \"නගර කේන්ද්‍රය\"])\n- item1, item2, item3 = sample([\"ගුලාබ්\", \"දේසීය මල්\", \"ටියුලිප්\", \"ලිලි\", \"සූර්යකාන්ත\", \"ඔර්කිඩ්\"], 3)\n- unit = sample([\"ගුල\", \"කූඩය\", \"මල් ගුල\", \"ගොනු\"])\n- cur = sample(currencies_sym)\n- $p1 = arange(1.26, 3.53, 0.33)\n- $p2 = arange(2.27, 5.53, 0.26)\n- $p3 = arange(4.85, 6.53, 0.31)\n- $n1 = range(5, 21)\n- $n2 = range(15, 31)\n- $n3 = range(35, 41)\n\n\n#answer: n1*round(p1) + n2*round(p2) + n3*round(p3)\n"
