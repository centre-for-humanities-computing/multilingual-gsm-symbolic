question = "කොන්ත්‍රාත්තකයෙකු සෑම මාසයකම 4 සති සහ සෑම සතියකම 6 දින කටයුතු කරයි. ඔහුට සෑම දිනකම $50 ලැබේ නම්, ඔහු වසරක් පුරා කටයුතු කරන්නේ නම් ඔහුට ලැබෙන්නේ කොපමණද?"
answer = "කොන්ත්‍රාත්තකයෙකු කෙනා සෑම සතියකම 6 දින සහ සෑම මාසයකම 4 සති කටයුතු කරන බැවින්, ඔහු කටයුතු කරන්නේ 6 දින/සතිය * 4 සති/මාස = <<6*4=24>>24 දින/මාස වේ.\nඔහුට සෑම දිනකම $50 ලැබේ නම්, එවිට ඔහුට ලැබෙන්නේ $50/දින * 24 දින/මාස = $<<50*24=1200>>1200/මාස වේ.\nවසරක් යනු මාස 12 කි, එබැවින් වසරකට ඔහුට ලැබෙන්නේ $1200/මාස * මාස 12/වසර = $<<1200*12=14400>>14,400 වේ.\n#### 14400\n"
