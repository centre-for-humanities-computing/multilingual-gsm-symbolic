question = "ඩෙඇන්ඩ්‍රේ ඉකුත් සඳුදා දිනට 3 ටුනා අල්ලා ගත්තේය, ඔහු අල්ලාගත් පළමු ටුනා බර 56 කිලෝග්‍රෑම් වේ, ඔහු අල්ලාගත් දෙවන ටුනා බර 46 කිලෝග්‍රෑම් වේ, සහ ඔහු අල්ලාගත් ඉතිරි ටුනා බර 26 කිලෝග්‍රෑම් වේ. එක් කිලෝග්‍රෑම් ටුනා එකක් මිල $0.5 නම්, වෙළඳපොළට සියලුම ටුනා විකිණීමෙන් පසු ඔහුට කොපමණ මුදලක් ලැබේද?"
