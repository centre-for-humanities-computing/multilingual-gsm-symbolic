question = "පිරිමි කෙනෙක් දින ප්‍රති 5 සැන්ඩ්විච ගනී, ඔහුගේ බිරිඳ දින ප්‍රති 4 සැන්ඩ්විච ගනී, සහ ඔවුන්ගේ පුතා දින ප්‍රති 2 සැන්ඩ්විච ගනී. මෙම පවුල සතිය එකකදී කොපමණ සැන්ඩ්විච ගනීද?"
