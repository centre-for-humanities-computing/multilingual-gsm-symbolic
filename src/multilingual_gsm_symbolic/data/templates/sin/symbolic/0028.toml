question = "හොස්පිටලය එකක 1000 ඇඳ ක්ෂමතාවයක් ඇති අතර 1/5ක් අත්පත් කරගෙන ඇත. කොරෝනා වෛරස් වසංගතය හේතුවෙන්, දිනකට 50 රෝගීන් හොස්පිටලය වෙත ඇතුළත් කරනු ලැබේ. 2 සතියකට පසු හොස්පිටලය තුළ අත්පත් නොකළ ඇඳ සම්පූර්ණ සංඛ්‍යාව ගණනය කරන්න."
answer = "එක් හොස්පිටලය ඇඳ සම්පූර්ණ ක්ෂමතාවයෙන් 1/5ක් අත්පත් කරගෙන ඇත්නම්, එයින් අදහස් වන්නේ 1/5 * 1000 = <<1000*1/5=200>>200 ඇඳ රෝගීන් විසින් භාවිතා කරන බවයි.\nනව ඇතුළත් කිරීම් නොමැතිව හොස්පිටලය තුළ ඇති ඇඳ සම්පූර්ණ සංඛ්‍යාව 1000 ඇඳ - 200 ඇඳ = <<1000-200=800>>800 ඇඳ වේ.\nදිනකට 50 දෙනෙකු ඇතුළත් වුවහොත්, සතියකට පසු හොස්පිටලය තුළ ඇති රෝගීන් සම්පූර්ණ සංඛ්‍යාව 50 රෝගීන්/දින * 7 දින/සතිය = 350 රෝගීන් වේ.\n2 සතියකට පසු, හොස්පිටලය වෙත ඇතුළත් කරන ලද රෝගීන් සම්පූර්ණ සංඛ්‍යාව 350 රෝගීන්/සතිය * 2 සති = <<350*2=700>>700 රෝගීන් වන අතර, ඔවුන් සෑම විටම එක් ඇඳක් භාවිතා කරයි.\nනව ඇතුළත් කිරීම් වලට පෙර හොස්පිටලය තුළ 800 අත්පත් නොකළ ඇඳ තිබුණේ නම්, එම සංඛ්‍යාව 800 ඇඳ - 700 ඇඳ = <<800-700=100>>100 අත්පත් නොකළ ඇඳ දක්වා අඩු වේ.\n#### 100\n"
