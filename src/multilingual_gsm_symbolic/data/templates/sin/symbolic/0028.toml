question_annotated = "{facility,හොස්පිටලය} එකක {total,1000} {item,ඇඳ} ක්ෂමතාවයක් ඇති අතර {frac,1/5}ක් අත්පත් කරගෙන ඇත. {event,කොරෝනා වෛරස් වසංගතය} හේතුවෙන්, දිනකට {daily,50} රෝගීන් {facility,හොස්පිටලය} වෙත ඇතුළත් කරනු ලැබේ. {period,2} සතියකට පසු {facility,හොස්පිටලය} තුළ අත්පත් නොකළ {item,ඇඳ} සම්පූර්ණ සංඛ්‍යාව ගණනය කරන්න.\n\n#init:\n- facility = sample([\"හොස්පිටලය\", \"ප්‍රාථමික සෞඛ්‍ය මධ්‍යස්ථානය\", \"වෛද්‍ය මධ්‍යස්ථානය\", \"සේවා මධ්‍යස්ථානය\"])\n- item = sample([\"ඇඳ\", \"කාමරය\", \"වෛද්‍ය වාට්ටුව\"])\n- event = sample([\"උණ ආසාදන කාලය\", \"ස්වාභාවික විපත්තිය\", \"මහා අනතුරක්\", \"වසංගතය\"])\n- $total = range(500, 2000, 100)\n- $frac = sample(fractions)\n- $daily = range(20, 100, 5)\n- $period = range(2, 5)\n\n#conditions:\n- is_int(total * frac)\n- total * frac + daily * period * 7 < total\n\n#answer: total - (total * frac + daily * period * 7)\n"
answer_annotated = "එක් {facility} {item} සම්පූර්ණ ක්ෂමතාවයෙන් {frac}ක් අත්පත් කරගෙන ඇත්නම්, එයින් අදහස් වන්නේ {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} රෝගීන් විසින් භාවිතා කරන බවයි.\nනව ඇතුළත් කිරීම් නොමැතිව {facility} තුළ ඇති {item} සම්පූර්ණ සංඛ්‍යාව {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item} වේ.\nදිනකට {daily} දෙනෙකු ඇතුළත් වුවහොත්, සතියකට පසු {facility} තුළ ඇති රෝගීන් සම්පූර්ණ සංඛ්‍යාව {daily} රෝගීන්/දින * 7 දින/සතිය = {daily*7} රෝගීන් වේ.\n{period} සතියකට පසු, {facility} වෙත ඇතුළත් කරන ලද රෝගීන් සම්පූර්ණ සංඛ්‍යාව {daily*7} රෝගීන්/සතිය * {period} සති = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} රෝගීන් වන අතර, ඔවුන් සෑම විටම එක් {item}ක් භාවිතා කරයි.\nනව ඇතුළත් කිරීම් වලට පෙර {facility} තුළ {total-int(total*frac)} අත්පත් නොකළ {item} තිබුණේ නම්, එම සංඛ්‍යාව {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} අත්පත් නොකළ {item} දක්වා අඩු වේ.\n#### {total - (total * frac + daily * period * 7)}\n"
