question = "96 සිව්වන පන්තියේ සිසුන් කුඩා ගස පාසලේ සිටී. 43 දෙනා ගැහැණු ළමයින් වේ. සිකුරාදා දින, 5 සිව්වන පන්තියේ ගැහැණු ළමයින් සහ 4 සිව්වන පන්තියේ පිරිමි ළමයින් නොසිටියහ. සිකුරාදා දින කුඩා ගස පාසලේ සිව්වන පන්තියේ පිරිමි ළමයින් කී දෙනෙක් සිටියහ?"
