question = "ජෝන් බදාදා දින 4 කෙසෙල් සොයා ගනී. ඉන්පසු ඔහු බ්‍රහස්පතින්දා දින 6 කෙසෙල් සොයා ගනී. සිකුරාදා දින, ඔහු බදාදා දින සොයා ගත් කෙසෙල් ගණනේ තුන ගුණයක් සොයා ගනී. ජෝන් සතුව කෙසෙල් කීයක් තිබේද?"
answer = "බදාදා සහ බ්‍රහස්පතින්දා දින එකතු කළ විට, ජෝන් සතුව 4 කෙසෙල් + 6 කෙසෙල් = <<4+6=10>>10 කෙසෙල් තිබේ.\nසිකුරාදා දින, ඔහු 3*4 කෙසෙල් සොයා ගනී = <<3*4=12>>12 කෙසෙල් තිබේ.\nමුළු එකතුව, ජෝන් සතුව 10 කෙසෙල් + 12 කෙසෙල් = <<10+12=22>>22 කෙසෙල් තිබේ.\n#### 22"
