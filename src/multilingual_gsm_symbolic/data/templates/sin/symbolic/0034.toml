question_annotated = "{title,මහත්මයා} {name,ටැන්} තම {property,ගෙදර} ${price,400000} දී විකිණීය. ඔහු විකුණුම් මිලෙන් {fee1_percent,3}% ක් වන {fee1_name,පරිවහන} ගාස්තු ගෙවූ අතර, විකුණුම් මිලෙන් {fee2_percent,5}% ක් වන {fee2_name,මැදිහත්} ගාස්තුවක් ද ගෙවීය. ඔහු තවදුරටත් {property,ගෙදර} ශේෂ ණය මුදල සඳහා ${loan,250000} ගෙවූයේ නම්, {property,ගෙදර} විකිණීමෙන් {title,මහත්මයා} {name,ටැන්} හි ශුද්ධ ලාභය කොපමණද?\n\n#init:\n- title = sample(['මහත්මයා', 'ප්‍රොෆෙසර්', 'ඩොක්ටර්'])\n- name = sample(['ස්මිත්', 'ජොන්සන්', 'විලියම්ස්', 'බ්‍රවුන්', 'ජෝන්ස්', 'ගාස්සියා', 'මිලර්', 'ඩේවිස්', 'රොඩ්‍රිගස්', 'මාටින්ස්'])\n- property = sample(['ගෙදර', 'ඇපාට්මන්ට්', 'කොන්ඩෝ', 'විලා', 'කොටගෙය'])\n- fee1_name = sample(['පරිවහන', 'රෙජිස්ට්‍රේෂන්', 'නීතිමය'])\n- fee2_name = sample(['මැදිහත්', 'ඇජන්ට්', 'රියල්ටර්'])\n- $price = range(200000, 1000000, 10000)\n- $fee1_percent = range(1, 5)\n- $fee2_percent = range(2, 7)\n- $loan = range(100000, 700000, 10000)\n\n#conditions:\n- price > loan\n- price - (price * (fee1_percent + fee2_percent) / 100 + loan) > 1\n\n#answer: price - (price * (fee1_percent + fee2_percent) / 100 + loan)\n"
answer_annotated = "{title} {name} {fee1_name} ගාස්තු සඳහා ${price}*{fee1_percent}/100 = <<{price}*{fee1_percent}/100={price * fee1_percent // 100}>>${price * fee1_percent // 100} ගෙවීය.\nඔහු {fee2_name} ගාස්තුව සඳහා ${price}*{fee2_percent}/100 = <<{price}*{fee2_percent}/100={price * fee2_percent // 100}>>${price * fee2_percent // 100} ගෙවීය.\nඑබැවින්, {title} {name} {fee1_name}, {fee2_name} සහ ණය ගාස්තු සඳහා මුළු මුදලක් ${price * fee1_percent // 100} + ${price * fee2_percent // 100} + ${loan} = <<{price * fee1_percent // 100}+{price * fee2_percent // 100}+{loan}={price * (fee1_percent + fee2_percent) // 100 + loan}>>${price * (fee1_percent + fee2_percent) // 100 + loan} ගෙවීය.\nඑබැවින්, {title} {name} හි ශුද්ධ ලාභය වන්නේ ${price} - ${price * (fee1_percent + fee2_percent) // 100 + loan} = <<{price}-{price * (fee1_percent + fee2_percent) // 100 + loan}={price - (price * (fee1_percent + fee2_percent) // 100 + loan)}>>${price - (price * (fee1_percent + fee2_percent) // 100 + loan)}.\n#### {price - (price * (fee1_percent + fee2_percent) // 100 + loan)}\n"
