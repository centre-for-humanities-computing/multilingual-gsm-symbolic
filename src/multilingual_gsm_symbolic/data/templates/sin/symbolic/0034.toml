question = "මහත්මයා ටැන් තම ගෙදර $400,000 දී විකිණීය. ඔහු විකුණුම් මිලෙන් 3% ක් වන පරිවහන ගාස්තු ගෙවූ අතර, විකුණුම් මිලෙන් 5% ක් වන මැදිහත් ගාස්තුවක් ද ගෙවීය. ඔහු තවදුරටත් ගෙදර ශේෂ ණය මුදල සඳහා $250,000 ගෙවූයේ නම්, ගෙදර විකිණීමෙන් මහත්මයා ටැන් හි ශුද්ධ ලාභය කොපමණද?"
answer = "මහත්මයා ටැන් පරිවහන ගාස්තු සඳහා $400,000*3/100 = <<400000*3/100=12000>>$12,000 ගෙවීය.\nඔහු මැදිහත් ගාස්තුව සඳහා $400,000*5/100 = <<400000*5/100=20000>>$20,000 ගෙවීය.\nඑබැවින්, මහත්මයා ටැන් පරිවහන, මැදිහත් සහ ණය ගාස්තු සඳහා මුළු මුදලක් $12,000 + $20,000 + $250,000 = <<12000+20000+250000=282000>>$282,000 ගෙවීය.\nඑබැවින්, මහත්මයා ටැන් හි ශුද්ධ ලාභය වන්නේ $400,000 - $282,000 = <<400000-282000=118000>>$118,000.\n#### 118000\n"
