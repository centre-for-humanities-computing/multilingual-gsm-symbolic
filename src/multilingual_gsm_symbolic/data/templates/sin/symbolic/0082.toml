question = "විහිළු ආරම්භයේදී, 25 පිරිමි සහ 15 කාන්තා සිටියහ. පැයක පසු, මුළු පිරිසෙන් 1/4ක් පිටත්ව ගියහ. 22 පිරිමි විහිළු එහි පැවතුනේ නම්, කාන්තා කී දෙනෙක් ඉතිරි වී ඇත්ද?"
