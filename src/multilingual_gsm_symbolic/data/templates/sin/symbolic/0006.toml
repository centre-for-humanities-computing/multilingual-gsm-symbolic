question = "ජෝන් සතුව 10 හෙක්ටයාර් ප්‍රමාණයක අන්නාසි වගාබිමක් ඇත. හෙක්ටයාර් එකකට අන්නාසි 100 ක් පමණ ඇත. ජෝන් තම අන්නාසි 3 මාසයකට වරක් අස්වැන්න ලබා ගත හැක. වසරක් තුළ ජෝන් සතුව ඇති අන්නාසි කීයක් අස්වැන්න ලබා ගත හැකිද?"
