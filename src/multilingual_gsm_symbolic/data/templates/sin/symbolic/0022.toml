question = "Julia ඇගේ නිවසේදී රාත්‍රී භෝජන සංග්‍රහය එකක් සඳහා සූදානම් වෙමින් සිටියා, මෙහිදී ඇය සෝප් සැපයීමට අදහස් කළා. ඇයට ප්ලාස්ටික් කෝත්තා නොමැති බව ඇය දුටුවා, එබැවින් ඇය නව කෝත්තා පැකට්ටුවක් මිලදී ගත්තා. පසුව, ඇගේ සැමියා ද 5 නව කෝත්තා පැකට්ටුවක් මිලදී ගෙන ඒවා Julia වෙත ලබා දුන්නා. Julia සෝප් සාදමින් සිටියදී, ඇය ඇගේ සෝප් රස බැලීමට කෝත්තා තුන භාවිතා කළා. පසුව, ඇය ඉස්තෝප්පුව සකස් කිරීමට ගිය විට, ඇය සතුව මුළු 12 කෝත්තා තිබුණා. Julia මිලදී ගත් පැකට්ටුවේ කෝත්තා කීයක් තිබුණාද?"
answer = "Julia සහ ඇගේ සැමියා සතු මුළු කෝත්තා ගණන වූයේ 12+3=<<12+3=15>>15 කෝත්තා.\nසැමියා මිලදී ගත් පැකට්ටුවේ 5 කෝත්තා තිබූ බැවින්, Julia ගේ පැකට්ටුවේ තිබුණේ 15-5=<<15-5=10>>10 කෝත්තා.\n#### 10\n"
