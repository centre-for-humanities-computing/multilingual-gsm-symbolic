question = "නේට් තමන්ගේ සතුන්ට හේ කවයි. සෑම බැටළුකටම 5 පවුම් අවශ්‍ය වන අතර, සහ සෑම ලාමාකටම සෑම බැටළුකටම අවශ්‍ය ප්‍රමාණයෙන් දෙගුණයකට 3 පවුම් අඩු ප්‍රමාණයක් අවශ්‍ය වේ. එසේ නම් 15 බැටළු සහ 12 ලාමා සිටී නම්, නේට්ට මුළු වශයෙන්ම කොපමණ පවුම් හේ අවශ්‍ය වේද?"
answer = "පළමුව සෑම ලාමාකටම අවශ්‍ය හේ ප්‍රමාණය ගණනය කරන්න: 5 පවුම් * 2 - 3 = <<5*2-3=7>>7 පවුම්/ලාමා\nදැන් සියලු ලාමා සතුන්ට අවශ්‍ය මුළු හේ ප්‍රමාණය ගණනය කරන්න: 7 පවුම්/ලාමා * 12 ලාමා සතුන් = <<7*12=84>>84 පවුම්\nදැන් සියලු බැටළු සතුන්ට අවශ්‍ය මුළු හේ ප්‍රමාණය ගණනය කරන්න: 5 පවුම්/බැටළු * 15 බැටළු සතුන් = <<5*15=75>>75 පවුම්\nදැන් මුළු ප්‍රමාණය සොයා ගැනීමට හේ ප්‍රමාණ දෙක එකතු කරන්න: 84 පවුම් + 75 පවුම් = <<84+75=159>>159 පවුම්\n#### 159\n"
