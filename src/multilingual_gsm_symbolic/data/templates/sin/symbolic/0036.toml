question = "ටූලා බේකරිය වෙත ගොස් විවිධ වර්ගයේ පැස්ට්‍රි මිලදී ගත්තා. ඇය 3 ඩසන් ඩොනට් මිලදී ගත්තා, එය ඩසනයකට $68 ක් විය, 2 ඩසන් කුඩා කුප් කේක් මිලදී ගත්තා, එය ඩසනයකට $80 ක් විය, සහ 6 ඩසන් කුඩා චීස් කේක් මිලදී ගත්තා, එය ඩසනයකට $55 ක් විය. මුළු වියදම කොපමණද?"
answer = "ඩොනට් සඳහා මුළු ගෙවීම වූයේ 3*$68 = $<<3*68=204>>204 කි.\nකුඩා කුප් කේක් සඳහා මුළු ගෙවීම වූයේ 2*$80 = $<<2*80=160>>160 කි.\nකුඩා චීස් කේක් සඳහා මුළු ගෙවීම වූයේ 6*$55 = $<<6*55=330>>330 කි.\nඑබැවින් ටූලා විසින් පැස්ට්‍රි සඳහා ගෙවූ මුළු මුදල වූයේ $204 + $160 + $330 = $<<204+160+330=694>>694 කි.\n#### 694\n"
