question = "ජෝන් පාසල් සංචාරයක් සඳහා මුදල් එකතු කරමින් සිටී. ඔහු පාසල වෙතින් ආධාර සඳහා ඉල්ලුම් කර ඇති අතර, එය පාසල් සංචාරය වියදමින් අඩක ආවරණය කිරීමට තීරණය කර ඇත. ඔහු සතුව $50ක් සහ පාසල් සංචාරය වියදම $300ක් නම් ජෝන්ට කොපමණ මුදලක් අඩුද?"
answer = "ජෝන්ගේ පාසල තීරණය කර ඇත්තේ 300*3/5=$<<300*3/5=180>>180 ඔහුගේ පාසල් සංචාරය සඳහා ගෙවීමට. \nමුළුමනින්ම ජෝන් ආවරණය කර ඇත්තේ 180 + 50 = $<<180+50=230>>230 ඔහුගේ පාසල් සංචාරය සඳහා. \nඑබැවින්, ජෝන්ට 300 - 230 = $<<300-230=70>>70 තවමත් පාසල් සංචාරය සඳහා අවශ්‍ය වේ. \n#### 70\n"
