question = "චෙස්ටර් දිනකට 3 බිත්තර 30 දින කාලයක් සඳහා කන අතර, ඉන් පසුව එය දිනකට 5 බිත්තර වෙත 30 දින කාලයක් සඳහා වැඩි කරයි නම්, චෙස්ටර් 60 දින කාලයක් සඳහා කොපමණ දුසිම් බිත්තර අවශ්‍ය වේද?"
answer = "ඔහු මුලින්ම දිනකට 3 බිත්තර 30 දින කාලයක් සඳහා කන අතර, එමගින් මුළු එකතුව 3*30 = <<3*30=90>>90 බිත්තර වේ\nඉන් පසුව ඔහු එය දිනකට 5 බිත්තර වෙත 30 දින කාලයක් සඳහා වැඩි කරන අතර, එමගින් මුළු එකතුව 5*30 = <<5*30=150>>150 බිත්තර වේ\nසම්පූර්ණයෙන්ම ඔහු කනු ලබන්නේ 90+150 = <<90+150=240>>240 බිත්තර වේ\nබිත්තර දුසිමකට බිත්තර 12ක් අඩංගු වන අතර ඔහු 240 බිත්තර කනු ලබන අතර එය 240/12 = 20 දුසිම් බිත්තර වේ\n#### 20\n"
