question_annotated = "{name,සැලි} විවේකයට මුහුදු වෙරළට ගියා. ඇගේ මව්පියන් ඇයට ${total,15} ක් ඇයට අවශ්‍ය දේ මිලදී ගැනීමට දුන්නා. සිහිවටන සාලයේදී, ටැෆි විකිණීමේදී \"{n1,1} පවුම් ${p1,3} ක් වටිනා තත්ත්වයෙන් මිලදී ගන්න, {n2,1} පවුම් {discount,1/2} ක් සහනය ලැබේ.\" යනුවෙන් තිබුණා. ඇය {n12,4} පවුම් මිලදී ගත්තා. ඇය තවදුරටත් ${p2,1.5} කට මුහුදු කවච මිශ්‍ර බෑගයක් සහ ${p3,0.25} බැගින් වූ {n3,4} චුම්බක මිලදී ගත්තා. {name,සැලි} ළඟ ඉතිරි මුදල කොපමණද?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} {p1} ඩොලරයකට {n1} පවුම් මිලදී ගනිමින් {n2} පවුම් සඳහා {discount} ක් සහනය ලබා ගනී. එබැවින් {n2} පවුම් සඳහා {discount} ක් සහනය වීමෙන් ${p1}*{discount} = ${float(n2*discount*p1)} ක් ලැබේ. ඉතිරි {n12-n1-n2} පවුම් වලට සහනයක් නොමැති අතර එය {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1} වේ, එබැවින් මුළු මුදල ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1} වේ.\n{n3} චුම්බක ${p3} බැගින් වන අතර එය {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3} වේ.\nඇය මිලදී ගත් සියල්ල එකතු කළ විට, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} වේ.\nඇය ළඟ ${total} ක් තිබුණු අතර ඇය වැය කළේ ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} ක් බැවින් ඇය ළඟ ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} ක් ඉතිරි විය.\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
