question = "සැලි විවේකයට මුහුදු වෙරළට ගියා. ඇගේ මව්පියන් ඇයට $15 ක් ඇයට අවශ්‍ය දේ මිලදී ගැනීමට දුන්නා. සිහිවටන සාලයේදී, ටැෆි විකිණීමේදී \"1 පවුම් $3 ක් වටිනා තත්ත්වයෙන් මිලදී ගන්න, 1 පවුම් 1/2 ක් සහනය ලැබේ.\" යනුවෙන් තිබුණා. ඇය 4 පවුම් මිලදී ගත්තා. ඇය තවදුරටත් $1.5 කට මුහුදු කවච මිශ්‍ර බෑගයක් සහ $0.25 බැගින් වූ 4 චුම්බක මිලදී ගත්තා. සැලි ළඟ ඉතිරි මුදල කොපමණද?"
answer = "සැලි 3 ඩොලරයකට 1 පවුම් මිලදී ගනිමින් 1 පවුම් සඳහා 1/2 ක් සහනය ලබා ගනී. එබැවින් 1 පවුම් සඳහා 1/2 ක් සහනය වීමෙන් $3*1/2 = $1.5 ක් ලැබේ. ඉතිරි 2 පවුම් වලට සහනයක් නොමැති අතර එය 2*$3 = $6 වේ, එබැවින් මුළු මුදල $3+$3/2+$6=$21/2 වේ.\n4 චුම්බක $0.25 බැගින් වන අතර එය 4*0.25=$<<4*0.25=1>>1 වේ.\nඇය මිලදී ගත් සියල්ල එකතු කළ විට, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13 වේ.\nඇය ළඟ $15 ක් තිබුණු අතර ඇය වැය කළේ $13 ක් බැවින් ඇය ළඟ $15-$13 = $<<15-13=2>>2 ක් ඉතිරි විය.\n#### 2\n"
