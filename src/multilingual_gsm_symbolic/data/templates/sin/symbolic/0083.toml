question = "ඇඩම්ස් පවුල කුකී සාදමින් නිරතව සිටී. මේ දක්වා, ඔවුන් 7995 කුකී සාදා ඇත. ඔවුන් සතුව 2595 වර්ණවත් කුකී, 3075 ඔට්මීල් කුකී, සහ සමහර චොකලට් චිප් කුකී තිබේ. ඔවුන් චොකලට් චිප් කුකී කීයක් සාදා ඇත්ද?"
