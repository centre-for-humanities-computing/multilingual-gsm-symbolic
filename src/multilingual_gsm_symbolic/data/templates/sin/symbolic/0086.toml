question = "ඇලිසන් දුවීමේ කණ්ඩායම සඳහා ස්ථානයක් ලබා ගත් නිසා, ඇය ක්‍රීඩා උපකරණ සඳහා කඩයකට ගියා. ඇය ටැන්ක් ටොප් රු10කට මිලදී ගත්තා, ටැන්ක් ටොප් මිලට වඩා රු5කින් වැඩි මිලකට දුවීමේ කොටු යුගලක්, සහ මුලින් රු48 වූ නමුත් අඩක් මිලකට විකිණූ ටෙනිස් සපත්තු යුගලක්. ඇය මිලදී ගත් රු8ක ක්‍රීඩා පාදසර පැකට්ටුව සඳහා රු2ක වට්ටමක් ඇය සතුව තිබුණි. ඇය ක්‍රීඩා උපකරණ සඳහා කොපමණ මුදලක් වැය කළාද?"
answer = "කොටු මිල ටැන්ක් ටොප් මිලට වඩා රු5කින් වැඩි බැවින්, ඒවායේ මිල රු5 + රු10 = රු<<5+10=15>>15 වේ.\nඇයගේ ටෙනිස් සපත්තු මුල් රු48 මිලෙන් අඩක් ක් විය, එබැවින් ඒවායේ මිල රු48*1/2=රු24 වේ.\nඇයගේ වට්ටම සමඟ, පාදසර මිල රු8 - රු2 = රු<<8-2=6>>6 වේ.\nටැන්ක් ටොප්, කොටු, ටෙනිස් සපත්තු, සහ පාදසර එකතුවේ මිල රු10 + රු15 + රු24 + රු6 = රු<<10+15+24+6=55>>55 වේ.\n#### 55\n"
