question = "සන්නි පොදු අරමුදලක් සඳහා ජින්ජර්බ්‍රෙඩ් සහ ඇපල් පාන් විකිණීම කරයි. සෙනසුරාදා දින, ඔහු 10 පෙට්ටි ජින්ජර්බ්‍රෙඩ් සහ ඉරිදා ට වඩා 4 පෙට්ටි අඩු ඇපල් පාන් විකුණා. ඉරිදා දින, ඔහු සෙනසුරාදා ට වඩා 5 පෙට්ටි වැඩි ජින්ජර්බ්‍රෙඩ් සහ 15 පෙට්ටි ඇපල් පාන් විකුණා. ජින්ජර්බ්‍රෙඩ් වල මිල රු6 සහ ඇපල් පාන් වල මිල රු15 නම්, සන්නි දින දෙකකට කොපමණ මුදලක් උපයා ගත්තේද?"
answer = "ඔහු ඉරිදා දින 10 + 5 = <<10+5=15>>15 පෙට්ටි ජින්ජර්බ්‍රෙඩ් විකුණා.\nසන්නි විසින් විකුණන ලද ජින්ජර්බ්‍රෙඩ් පෙට්ටි සම්පූර්ණ සංඛ්‍යාව 10 + 15 = <<10+15=25>>25 වේ.\nසන්නි විසින් ජින්ජර්බ්‍රෙඩ් විකුණීම සඳහා 25*රු6 = රු<<25*6=150>>150 උපයා ගත්තේය.\nඔහු සෙනසුරාදා දින 15 - 4 = <<15-4=11>>11 පෙට්ටි ඇපල් පාන් විකුණා.\nසන්නි විසින් විකුණන ලද ඇපල් පාන් පෙට්ටි සම්පූර්ණ සංඛ්‍යාව 15 + 11 = <<15+11=26>>26 වේ.\nඔහු ඇපල් පාන් විකුණීම සඳහා 26*රු15 = රු<<26*15=390>>390 උපයා ගත්තේය.\nඑබැවින්, සන්නි දින දෙකකට රු150 + රු390 = රු<<150+390=540>>540 උපයා ගත්තේය.\n#### 540\n"
