answer_annotated = "ඔහු {d2} දින {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} පෙට්ටි {food} විකුණා.\n{name} විසින් විකුණන ලද {food} පෙට්ටි සම්පූර්ණ සංඛ්‍යාව {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2} වේ.\n{name} විසින් {food} විකුණීම සඳහා {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} උපයා ගත්තේය.\nඔහු {d1} දින {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} පෙට්ටි {fruit} පාන් විකුණා.\n{name} විසින් විකුණන ලද {fruit} පාන් පෙට්ටි සම්පූර්ණ සංඛ්‍යාව {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1} වේ.\nඔහු {fruit} පාන් විකුණීම සඳහා {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} උපයා ගත්තේය.\nඑබැවින්, {name} දින දෙකකට {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} උපයා ගත්තේය.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
