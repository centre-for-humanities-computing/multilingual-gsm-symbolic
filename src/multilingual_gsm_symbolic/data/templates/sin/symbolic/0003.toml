question = "50 සිසුන් සිටින පන්තියක් විවිධ කැමැත්තන් ඇත. 10 දෙනෙක් ඉවුම් පිහුම් කිරීමට කැමති වන අතර, 5 දෙනෙක් බැස්කට්බෝල් ක්‍රීඩා කිරීමට කැමති වන අතර, අනෙක් අය වීඩියෝ ක්‍රීඩා කිරීම හෝ සංගීතය සවන් දීමට කැමති වේ."
