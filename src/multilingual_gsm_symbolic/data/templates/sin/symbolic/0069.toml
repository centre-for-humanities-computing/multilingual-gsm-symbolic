question = "අඟහරුදා දින, පීටර්ට සඳුදා සහ ඉරිදා දිනවල ව්‍යායාම කළ කාලයේ මුළු එකතුවට වඩා දෙගුණයක් කාලයක් ව්‍යායාම කිරීමට අවශ්‍යයි. ඉරිදා දින ඔහු 23 මිනිත්තු ව්‍යායාම කළේය. සඳුදා දින ඔහු 16 මිනිත්තු ව්‍යායාම කළේය. ඔහුගේ අරමුණ සාක්ෂාත් කර ගැනීමට අඟහරුදා දින ඔහුට මිනිත්තු කීයක් ව්‍යායාම කළ යුතුද?"
answer = "ඉරිදා සහ සඳුදා දිනවල ඔහු මුළු මිනිත්තු 39 ක් ව්‍යායාම කළේය මන්ද 23 + 16 = <<23+16=39>>39 නිසාය\nඅඟහරුදා දින ඔහුට මිනිත්තු 195 ක් ව්‍යායාම කළ යුතුය මන්ද 39*5 = <<39*5=195>>195 නිසාය\n#### 195\n"
