question = "ෆ්‍රැංකි සෑම රාත්‍රියකම ඔහුගේ ගෙදර පාඩම් නිම කරන පසු ටීවී බලයි. සඳුදා සහ අඟහරුවාදා දිනවල, ඔහු රාත්‍රියකට ඔහුගේ කැමති කතා මාලාවේ 1-පැය කොටසක් බලා සිටියේය. බදාදා දින, ඔහු 30-මිනිත්තු කතා මාලාවේ කොටස් කිහිපයක් බලා සිටියේය. බ්‍රහස්පතින්දා දින, ඔහු ගෙදර පාඩම් ඉක්මනින් නිම කර 1-පැය කොටසක් සහ 30-මිනිත්තු කතා මාලාවක් බලා සිටියේය. සිකුරාදා දින, ඔහුට පසුරාත්‍රියට රැඳී සිටීමට ලැබුණු බැවින්, ඔහු දෙක 1-පැය කොටස් බලා සිටියේය. ඔහු මුළුමනින්ම 7 පැයක් ටීවී බැලුවේ නම්, ඔහු බදාදා දින 30-මිනිත්තු කොටස් කීයක් බලා සිටියේද?"
answer = "බදාදා දින ඔහු බලා සිටි කොටස් ගණන E යැයි ගනිමු.\nසඳුදා නිමා වූ පසු, ඔහුට ටීවී බැලීමට 7 - 1 = <<7-1=6>>6 පැයක් ඉතිරි විය.\nඅඟහරුවාදා නිමා වූ පසු, ඔහුට ටීවී බැලීමට 6 - 1 = <<6-1=5>>5 පැයක් ඉතිරි විය.\nබ්‍රහස්පතින්දා නිමා වූ පසු, ඔහුට ටීවී බැලීමට 5 - 1 - 0.5 = 3.5 පැයක් ඉතිරි විය.\nසිකුරාදා නිමා වූ පසු, ඔහුට ටීවී බැලීමට 3.5 - 2 = 1.5 පැයක් ඉතිරි විය.\nසෑම 30-මිනිත්තු කොටසක්ම 1/2 පැයකි.\nඑබැවින්, E = 1.5/0.5 = 3 කොටස්.\n#### 3\n"
