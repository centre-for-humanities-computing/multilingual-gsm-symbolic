question = "ජේම්ස් අශ්ව රියක් කුලී කරගනී 5 ප.ව. සිට 9 ප.ව. දක්වා. ඔහුට 1 පැයක් නොමිලේ ලැබේ. පළමු ගෙවිය යුතු පැය වටිනා රු15, ඉන් පසු එක් එක් ගෙවිය යුතු පැය වටිනා පළමු ගෙවිය යුතු පැයට දෙගුණයක්. ඔහු ගෙවූ මුදල කොපමණද?"
answer = "ඔහු එය ලබා ගත්තේ 9-5=<<9-5=4>>4 පැයකටයි\nඔහු ගෙවන්නේ 4-1=<<4-1=3>>3 පැය සඳහායි\nපළමු පැය වියදම් වූයේ 1*15=රු<<1*15=15>>15\nඅනෙක් 3-1=2 පැය වඩා මිල අධිකයි\nඒවා පැයකට 15*5=රු<<15*5=75>>75 විය\nඑබැවින් ඒ 2 පැය වියදම් වූයේ 2*75=රු<<2*75=150>>150\nඑබැවින් ඔහු මුළුමනින්ම 150+15=රු<<150+15=165>>165 ගෙවයි\n#### 165\n"
