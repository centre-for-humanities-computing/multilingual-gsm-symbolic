question_annotated = "{name,ආච්චි} සෑම දිනකම ඇයගේ කැමති ඇවිදීමේ පථයේ {n,3} {unit,මයිල්} ඇවිදිනවා, එයට වෙරළ තීරයේ {m,2} {unit,මයිල්} ඇවිදීම සහ මංතීරුවේ {k,1} {unit,මයිල්} ඇවිදීම ඇතුළත් වේ. මංතීරුවේදී, {name,ආච්චි} වෙරළ තීරයේ ඇවිදින වේගයට වඩා {mult_txt,දෙගුණය} වේගයකින් ඇවිදිනවා. ඇගේ ඇවිදීමෙන් වෙරළ තීරයේ ගත කරන කාලය {t,40} මිනිත්තු නම්, සම්පූර්ණ {n,3}-{unit, මයිල්} ඇවිදීම නිම කිරීමට ඇයට මිනිත්තු කීයක් ගත වේද?\n\n#init:\n- name = sample(names_female)\n- unit = sample(length_lg)\n- mult_txt, mult_val = sample(multi_times)\n- $n = range(3, 60)\n- $m = range(2, 20)\n- $k = range(1, 20)\n- $t = range(40, 70)\n#conditions:\n- m + k == n\n- m < t\n- mult_val *m < t\n- divides(t, m)\n- is_int(k / (mult_val*m/t))\n#answer: t+(k/(mult_val*m/t))\n"
answer_annotated = "වෙරළ තීරයේදී, {name} මිනිත්තු {t}කට {m} {unit} වේගයෙන් ඇවිදිනවා, එනම් {m}/{t} = {Fraction(m/t)} {unit}/මිනිත්තුවකට.\nමංතීරුවේදී, වැලි තීරයේ ඇවිදින විට ඇයගේ වේගයට වඩා {mult_txt} වේගයකින් ඇවිදිනවා, එනම් {mult_val}*{Fraction(m/t)} = {mult_val*m/t} {unit}/මිනිත්තුවකට.\nමංතීරුවේ {k} {unit} ඇවිදීමට ඇයට ගත වන කාලය {k}/{mult_val*m/t} = <<{k}/{mult_val*m/t}={k/(mult_val*m/t)}>>{k/(mult_val*m/t)} මිනිත්තු වේ.\nඑබැවින්, මුළු එකතුව ලෙස, {name} ඇයගේ කැමති මාර්ගය ඇවිදීමට {t}+{k/(mult_val*m/t)} = <<{t}+{k/(mult_val*m/t)}={t+(k/(mult_val*m/t))}>>{t+(k/(mult_val*m/t))} මිනිත්තු ගත වේ.\n#### {t+(k/(mult_val*m/t))}\n"
