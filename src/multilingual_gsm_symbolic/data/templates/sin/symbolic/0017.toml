question = "ආච්චි සෑම දිනකම ඇයගේ කැමති ඇවිදීමේ පථයේ 3 මයිල් ඇවිදිනවා, එයට වෙරළ තීරයේ 2 මයිල් ඇවිදීම සහ මංතීරුවේ 1 මයිල් ඇවිදීම ඇතුළත් වේ. මංතීරුවේදී, ආච්චි වෙරළ තීරයේ ඇවිදින වේගයට වඩා දෙගුණය වේගයකින් ඇවිදිනවා. ඇගේ ඇවිදීමෙන් වෙරළ තීරයේ ගත කරන කාලය 40 මිනිත්තු නම්, සම්පූර්ණ 3-මයිල් ඇවිදීම නිම කිරීමට ඇයට මිනිත්තු කීයක් ගත වේද?"
answer = "වෙරළ තීරයේදී, ආච්චි මිනිත්තු 40කට 2 මයිල් වේගයෙන් ඇවිදිනවා, එනම් 2/40 = 1/20 මයිල්/මිනිත්තුවකට.\nමංතීරුවේදී, වැලි තීරයේ ඇවිදින විට ඇයගේ වේගයට වඩා දෙගුණය වේගයකින් ඇවිදිනවා, එනම් 5*1/20 = 0.25 මයිල්/මිනිත්තුවකට.\nමංතීරුවේ 1 මයිල් ඇවිදීමට ඇයට ගත වන කාලය 1/0.25 = <<1/0.25=4>>4 මිනිත්තු වේ.\nඑබැවින්, මුළු එකතුව ලෙස, ආච්චි ඇයගේ කැමති මාර්ගය ඇවිදීමට 40+4 = <<40+4=44>>44 මිනිත්තු ගත වේ.\n#### 44\n"
