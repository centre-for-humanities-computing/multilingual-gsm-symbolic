question = "මයික් 5 දෙනෙකු සමඟ ලිපි හුවමාරු සහකරු විය. ඔහු ඔවුන්ගෙන් 2 දෙනෙකු සමඟ ලිපි හුවමාරු නතර කළේය. ඔවුන් සෑම දෙනාම සතියකට 2 ලිපි යවන අතර ඒවා 5 පිටු දිගකින් යුක්තය. ඔහුද එලෙසම පිළිතුරු දෙයි. ඔහුට පිටුවක් ලිවීමට 6 මිනිත්තු වැය වේ. ඔහු සතියකට ලිවීමට ගත කරන පැය ගණන කොපමණද?"
answer = "මයික් සතුව 5-2=<<5-2=3>>3 දෙනෙකු සමඟ ලිපි හුවමාරු සබඳතා ඇත.\nඑබැවින් ඔහුට සතියකට 3*2=<<3*2=6>>6 ලිපි ලැබේ.\nඑවිට ඔහු සතියකට 6*5=<<6*5=30>>30 පිටු ලියයි.\nඑබැවින් ඔහු සතියකට 30*6=<<30*6=180>>180 මිනිත්තු ලිවීමට ගත කරයි.\nඑබැවින් ඔහු සතියකට 180/60=<<180/60=3>>3 පැය ලිවීමට ගත කරයි.\n#### 3\n"
