question = "රොජර් කඩයට යයි කෝපි මිලදී ගැනීමට. ඔහු මිලදී ගන්නා සාමාන්‍ය කෝපි වර්ගයේ මිල රු.5 පවුම්කට වේ. ඔහුගේ ප්‍රියතම වර්ගය අවසන් වී ඇති බැවින්, ඔහුට 20%කින් වැඩි මිලක් ඇති වඩාත් මිල අධික වර්ගයක් මිලදී ගත යුතු විය. ඔහු සතියකට ප්‍රමාණවත් කෝපි මිලදී ගැනීමට තීරණය කරයි සහ දිනකට 1 පවුම් කෝපි භාවිතා කරයි. ඔහු තමන් සඳහා ඩොනට්ක් රු.2කට මිලදී ගැනීමටද තීරණය කළේය. සියල්ලේම මුළු වියදම කොපමණද?"
