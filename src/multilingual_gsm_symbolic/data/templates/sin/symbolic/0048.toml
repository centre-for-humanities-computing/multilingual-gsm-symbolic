answer = "පළමුව එමිලිට පොතු කැපීමට ගත වන කාලය සොයා ගන්න: 90 පොතු / 6 පොතු/මිනිත්තුව = <<90/6=15>>15 මිනිත්තු\nඉන්පසු ඇයට පිසීමට අවශ්‍ය පොතු බැච් ගණන සොයා ගන්න: 90 පොතු / 30 පොතු/බැච් = <<90/30=3>>3 බැච්\nඉන්පසු මුළු පිසීමේ කාලය සොයා ගැනීම සඳහා බැච් ගණන බැච් එකකට ගත වන කාලයෙන් ගුණ කරන්න: 3 බැච් * 10 මිනිත්තු/බැච් = <<3*10=30>>30 මිනිත්තු\nඉන්පසු එමිලි ගත කරන මුළු කාලය සොයා ගැනීම සඳහා කැපීමේ කාලය එකතු කරන්න: 30 මිනිත්තු + 15 මිනිත්තු = <<30+15=45>>45 මිනිත්තු\n#### 45\n"
