question = "ජැකි තනිවම ඇගේ බදු කරන්නේද නැතහොත් එක් ගණකාධිකාරී කෙනෙකුට කුලී දෙන්නේද යන්න තීරණය කිරීමට උත්සාහ කරයි. එය තනිවම කරන්නේ නම්, ඇයට 3 පැය අඩුවෙන් ස්වේච්ඡා වැඩ කළ හැකි වන අතර, එමගින් පැයකට රු.35 බැගින් ආදායම අහිමි වේ. ගණකාධිකාරීගේ ගාස්තු රු.90 වේ. ගණකාධිකාරී කුලී දුන්නේ නම් ඇයට වැඩි මුදලක් ලැබේද?"
