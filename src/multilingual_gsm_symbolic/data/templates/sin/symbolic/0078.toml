question = "සාමාන්‍ය ශිෂ්‍යයෙකුට දිනක පන්ති වාර 6 ක් ඇති නමුත් ජෝන්ට අමතර පන්ති 2 ක් ගත යුතුය. එක් පන්තියක දිග මිනිත්තු 40 කි. ඔහු සතියක දින 5 ක් පන්තියට යයි. ඉන්පසු ඔහු සෙනසුරාදා සහ ඉරිදා දිනවල තම සතියක මිනිත්තුවලින් 1/16 ක් අමතර ඉගෙනුම් කාලය ලෙස ගත කරයි. ඔහු සතියකට පැය කීයක් ඉගෙන ගැනීමට ගත කරයිද?"
answer = "ඔහු දිනක පන්ති 6+2=<<6+2=8>>8 ක් ගනී\nඑයින් අදහස් වන්නේ ඔහු දිනක පන්තියේ ගත කරන්නේ මිනිත්තු 40*8=<<40*8=320>>320 ක් බවයි\nඑනිසා ඔහු සතියකට මිනිත්තු 320*5=<<320*5=1600>>1600 ක් ගත කරයි\nඑයින් අදහස් වන්නේ ඔහු සෙනසුරාදා සහ ඉරිදා දිනවලට මිනිත්තු 1600*1/16=<<1600*1/16=100>>100 ක් බැගින් ගත කරන බවයි.\nඑනිසා ඔහු සතියකට මිනිත්තු 1600+100+100=<<1600+100+100=1800>>1800 ක් ගත කරයි\nඑනිසා ඔහු සතියකට පැය 1800/60=<<1800/60=30>>30 ක් ගත කරයි\n#### 30\n"
