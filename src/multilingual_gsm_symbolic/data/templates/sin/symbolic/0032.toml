question = "කුරුස් මහත්මිය සොයමින් සිටින්නේ ඇගේ $400,000 මුදල් සීමාව ඉක්මවා නොයන නිවසකි. ඇය දුටු දේපලක විකිණීම් මිල $350000කි. එමෙන්ම, මිලදී ගන්නා පාර්ශ්වය විකිණීම් මිලෙන් 5% ක් වන බ්‍රෝකර් ගාස්තුවක් සහ විකිණීම් මිලෙන් 12% ක් වන හුවමාරු ගාස්තුවක් ද ගෙවිය යුතුය. නිවස හි මුළු මිල කුරුස් මහත්මිය හි මුදල් සීමාවට වඩා කොපමණ වැඩිද?"
answer = "බ්‍රෝකර් ගාස්තුව $350,000*5/100 = $<<350000*5/100=17500>>17500කි.\nහුවමාරු ගාස්තුව $350,000*12/100 = $<<350000*12/100=42000>>42000කි.\nනිවස හි මුළු මිල $350,000 + $17,500 + $42,000 = $409500කි.\nඑබැවින්, එය කුරුස් මහත්මිය හි මුදල් සීමාවට වඩා $409,500 - $400,000 = $<<409500-400000=9500>>9500කි.\n#### 9500\n"
