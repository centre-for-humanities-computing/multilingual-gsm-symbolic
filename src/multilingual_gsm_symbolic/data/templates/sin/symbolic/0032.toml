question_annotated = "{name, කුරුස් මහත්මිය} සොයමින් සිටින්නේ ඇගේ ${budget, 400000} මුදල් සීමාව ඉක්මවා නොයන {property_type, නිවස}කි. ඇය දුටු දේපලක විකිණීම් මිල ${price, 350000}කි. එමෙන්ම, මිලදී ගන්නා පාර්ශ්වය විකිණීම් මිලෙන් {brokerage_fee, 5}% ක් වන බ්‍රෝකර් ගාස්තුවක් සහ විකිණීම් මිලෙන් {transfer_fee, 12}% ක් වන හුවමාරු ගාස්තුවක් ද ගෙවිය යුතුය. {property_type, නිවස} හි මුළු මිල {name, කුරුස් මහත්මිය} හි මුදල් සීමාවට වඩා කොපමණ වැඩිද?\n\n#init:\n- name = sample(['ස්මිත් මහත්මිය', 'ජොන්සන් මැඩම්', 'පටෙල් වෛද්‍යතුමා', 'ලී මහත්මිය'])\n- property_type = sample(['නිවස', 'ඇපාට්මන්ට්', 'කොන්ඩෝ', 'ටවුන්හවුස්'])\n- $budget = range(300000, 500000, 10000)\n- $price = range(250000, 450000, 10000)\n- $brokerage_fee = range(3, 8)\n- $transfer_fee = range(10, 15)\n\n#conditions:\n- brokerage_fee < 100\n- transfer_fee < 100\n- price < budget\n- price + price*brokerage_fee/100 + price*transfer_fee/100 > budget + 1\n- is_int(price * brokerage_fee / 100)\n- is_int(price * transfer_fee / 100)\n\n#answer: int(price + price*brokerage_fee/100 + price*transfer_fee/100 - budget)\n"
answer_annotated = "බ්‍රෝකර් ගාස්තුව ${price}*{brokerage_fee}/100 = $<<{price}*{brokerage_fee}/100={int(price*brokerage_fee/100)}>>{int(price*brokerage_fee/100)}කි.\nහුවමාරු ගාස්තුව ${price}*{transfer_fee}/100 = $<<{price}*{transfer_fee}/100={int(price*transfer_fee/100)}>>{int(price*transfer_fee/100)}කි.\n{property_type} හි මුළු මිල ${price} + ${int(price*brokerage_fee/100)} + ${int(price*transfer_fee/100)} = ${int(price + price*brokerage_fee/100 + price*transfer_fee/100)}කි.\nඑබැවින්, එය {name} හි මුදල් සීමාවට වඩා ${int(price + price*brokerage_fee/100 + price*transfer_fee/100)} - ${budget} = $<<{int(price + price*brokerage_fee/100 + price*transfer_fee/100)}-{budget}={int(price + price*brokerage_fee/100 + price*transfer_fee/100 - budget)}>>{int(price + price*brokerage_fee/100 + price*transfer_fee/100 - budget)}කි.\n#### {int(price + price*brokerage_fee/100 + price*transfer_fee/100 - budget)}\n"
