question_annotated = "{name,අලන්}ගේ නිවසේ, {food2,කැනොලි} වලට වඩා {food1,ඉරිඟු} {mult_txt,දෙගුණයක්} තිබේ. ඔහුගේ නිවසේ මුළු {n,40} {food2,කැනොලි} තිබේ. {name,අලන්} සාප්පුවෙන් {m,60} තවත් {food2,කැනොලි} මිලදී ගත්තේය සහ {food2,කැනොලි} ගණනට වඩා {k,40} අඩු {food1,ඉරිඟු} මිලදී ගත්තේය. නිවසේ ඇති {name,අලන්}ගේ {food1,ඉරිඟු} සහ {food2,කැනොලි} ගණනේ එකතුව සොයන්න?\n\n#init:\n- name = sample(names_male)\n- food1, food2 = sample([\"කැනොලි\",\"ඉරිඟු\", \"යාපා\", \"කෙසෙල්\", \"නාරං\", \"පිරි\", \"දිවි\", \"ඉඤ්ඤ\", \"පර්සිමොන්\", \"ප්ලම්\", \"කිවි\"], 2)\n- mult_txt, mult_val = sample(multi_times)\n- $n = range(20, 100)\n- $m = range(30, 100)\n- $k = range(10, 50)\n\n#conditions:\n- m > k\n\n#answer: mult_val*n + n + m + (m-k)\n"
