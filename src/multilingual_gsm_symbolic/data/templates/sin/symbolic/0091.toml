question = "අලන්ගේ නිවසේ, කැනොලි වලට වඩා ඉරිඟු දෙගුණයක් තිබේ. ඔහුගේ නිවසේ මුළු 40 කැනොලි තිබේ. අලන් සාප්පුවෙන් 60 තවත් කැනොලි මිලදී ගත්තේය සහ කැනොලි ගණනට වඩා 40 අඩු ඉරිඟු මිලදී ගත්තේය. නිවසේ ඇති අලන්ගේ ඉරිඟු සහ කැනොලි ගණනේ එකතුව සොයන්න?"
answer = "ඉරිඟු සහ කැනොලි මිලදී ගැනීමට පෙර, අලන් සතුව කැනොලි ගණනට දෙගුණයක් ඉරිඟු තිබුණි, එනම් 40 කැනොලි * 5 ඉරිඟු/කැනොලි = <<40*5=200>>200 ඉරිඟු\nඅලන් සතුව මුලින් තිබූ ඉරිඟු සහ කැනොලි හි මුළු ගණන 200 ඉරිඟු + 40 කැනොලි = <<200+40=240>>240 වස්තූන් වේ\nකැනොලි ගණනට වඩා 40 අඩු ඉරිඟු මිලදී ගත් විට, ඔහු මිලදී ගත්තේ 60 ඉරිඟු - 40 ඉරිඟු = <<60-40=20>>20 ඉරිඟු වේ\nසමස්තයක් ලෙස, ඔහු මිලදී ගත්තේ 20 ඉරිඟු + 60 කැනොලි = <<20+60=80>>80 වස්තූන් වේ\nමිලදී ගැනීම් වලින් පසු, අලන් සතුව 240 වස්තූන් + 80 වස්තූන් = <<240+80=320>>320 මුළු ඉරිඟු සහ කැනොලි එකතුවයි.\n#### 320\n"
