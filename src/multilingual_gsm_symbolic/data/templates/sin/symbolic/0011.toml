question = "පිටර් විසින් 32 ඔන්ස් ජලයෙන් විවිධ ප්‍රමාණයේ හිම කුට්ටි නිපදවීමට අවශ්‍ය වේ. ඔහුට එක් කුට්ටියකට 4 ඔන්ස් වැය වන විශාල කුට්ටි, 2 ඔන්ස් වැය වන මධ්‍යම කුට්ටි සහ 1/2 ඔන්ස් වැය වන කුඩා කුට්ටි නිපදවිය හැක. ඔහු විසින් 3 විශාල කුට්ටි, 7 මධ්‍යම කුට්ටි සහ 8 කුඩා කුට්ටි නිපදවුවහොත්, ඔහුට ඉතිරිව ඇති ඔන්ස් ජලය කොපමණ ප්‍රමාණයක් ද?"
