question = "වාත්සන් දිනකට 10-පැය වැඩ පටික් කරයි, සතියකට පහ දින. ඔහුට පැයකට $10 ලැබෙන අතර සමාගම හොඳින් කටයුතු කළහොත් සතියකට $300 බෝනස් ලැබේ. සමාගම මුළු මාසය පුරාම ඉතා හොඳින් කටයුතු කළේ නම් ඇප්‍රිල් මාසයේදී වාත්සන් කොපමණ මුදලක් උපයා ගත්තේද?"
answer = "දිනකට, වාත්සන් 10 * 10 = $<<10*10=100>>100 උපයයි\nඔහු සතියකට පහ දින වැඩ කරන්නේ නම්, මුළු මාසයටම දින ගණන 5*4=<<5*4=20>>20 දින වේ.\nඔහු දිනකට $100 උපයන බැවින්, මුළු මාසය සඳහා මුළු මුදල 20 * 100= $<<20*100=2000>>2000 වේ.\nඇප්‍රිල් මාසයේ සියලු සතිවල සමාගම හොඳින් කටයුතු කළ බැවින්, ඔහුට 300 * 4 = $<<300*4=1200>>1200 බෝනස් ලැබුණි.\nඇප්‍රිල් අවසානයේදී, ඔහු 2000 + 1200 = $<<2000+1200=3200>>3200 උපයා ගත්තේය.\n#### 3200"
