answer_annotated = "{n2} ලීටර් {fruit2} පානයෙන් {n2}*{frac2_val} = <<{n2}*{frac2_val}={n2*frac2_val}>>{n2*frac2_val} ලීටර් ජලය තිබේ.\n{spill_txt} ලීටර් {fruit1} පානයක් වැටී ගිය පසු, {fruit1} පානය {n1}-{spill_val} = <<{n1}-{spill_val}={n1-spill_val}>>{n1-spill_val} ලීටර් ඉතිරි විය.\n{n1-spill_val} ලීටර් වලින්, {n1-spill_val}*{frac1_val} = <<{n1-spill_val}*{frac1_val}={(n1-spill_val)*frac1_val}>>{(n1-spill_val)*frac1_val} ලීටර් ජලය වේ.\nඑබැවින්, {total} ලීටර් වලින් මුළු එකතුව {n2*frac2_val} + {(n1-spill_val)*frac1_val} = <<{n2*frac2_val}+{(n1-spill_val)*frac1_val}={n2*frac2_val + (n1-spill_val)*frac1_val}>>{n2*frac2_val + (n1-spill_val)*frac1_val} ලීටර් ජලය වේ.\n#### {int(n2 * frac2_val + (n1 - spill_val) * frac1_val)}\n"
