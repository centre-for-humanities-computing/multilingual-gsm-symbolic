question = "මා සතුව 10 ලීටර් දෙහි පානයක් ඇත, එය තුනෙන් දෙකක් ජලය වන අතර මම එය 15 ලීටර් අන්නාසි පානයක් සමඟ එකතු කිරීමට කැමතියි, එය පහෙන් තුනක් ජලය වේ. නමුත් මම එය පිරවන විට, දෙහි පානයේ හතර ලීටර් වැටී යයි. ඉතිරි වූ 21 ලීටර් තුළ කොපමණ ජලය තිබේද?"
answer = "15 ලීටර් අන්නාසි පානයෙන් 15*3/5 = <<15*3/5=9>>9 ලීටර් ජලය තිබේ.\nහතර ලීටර් දෙහි පානයක් වැටී ගිය පසු, දෙහි පානය 10-5 = <<10-5=5>>5 ලීටර් ඉතිරි විය.\n5 ලීටර් වලින්, 5*3/5 = <<5*3/5=3>>3 ලීටර් ජලය වේ.\nඑබැවින්, 21 ලීටර් වලින් මුළු එකතුව 9 + 3 = <<9+3=12>>12 ලීටර් ජලය වේ.\n#### 12\n"
