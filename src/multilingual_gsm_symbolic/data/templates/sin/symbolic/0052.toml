question = "ක්‍රේග් සතුව 2 රු20 බිල්පත් ඇත. ඔහු හය ජල තුවක්කු රු2 බැගින් මිලදී ගනී. ඔහු තවද 3 පැකට්ටු ජල බැලුන් රු3 බැගින් මිලදී ගනී. ඔහුට ඉතිරිව ඇති මුදල කොපමණද?"
answer = "ක්‍රේග් ආරම්භකව 2 * රු20 = රු<<2*20=40>>40 සතු වේ.\nක්‍රේග් 6*රු2 = රු<<6*2=12>>12 ජල තුවක්කු සඳහා වියදම් කරයි.\nක්‍රේග් 3 ජල බැලුන් පැකට්ටු * රු3 = රු<<3*3=9>>9 ජල බැලුන් සඳහා වියදම් කරයි.\nසම්පූර්ණයෙන් ක්‍රේග් වියදම් කර ඇත්තේ රු12 + රු9 = රු<<12+9=21>>21 වේ.\nක්‍රේග් සතුව රු40 - රු21 = රු<<40-21=19>>19 ඉතිරි වේ.\n#### 19"
