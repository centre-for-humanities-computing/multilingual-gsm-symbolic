question_annotated = "{name,එලිස්} ලිවීම ඉගෙන ගනිමින් සිටින අතර ඇය එය දන්නා තෙක්ම {alphabets_txt,අක්ෂරාවලිය} නැවත නැවත ලිවීමට තීරණය කරයි. ඇය එය සම්පූර්ණයෙන්ම {n1_txt,දෙවරක්} ලියයි, එහි {frac_txt,අඩක්} වරක් ලියයි, ඉන්පසු ඇය දැනටමත් ලිවූ සියල්ල නැවත ලියයි. මුළු වශයෙන්ම {name,එලිස්} ලිවූ අකුරු කීයක්ද?\n\n#init:\n- name = sample(names_female)\n- alphabets_txt, alphabets_val = sample([(\"අක්ෂරාවලිය\", 26), (\"හිරගානා (අකුරු 48ක් සහිතව)\", 48), (\"පාර්සි අක්ෂරාවලිය (අකුරු 32ක් සහිතව)\", 32), (\"අරාබි අබ්ජද් (අකුරු 28ක් සහිතව)\", 28)])\n- n1_txt, n1_val = sample([(\"දෙවරක්\", 2), (\"තෙවරක්\", 3), (\"සතර වරක්\", 4), (\"පස් වරක්\", 5), (\"හය වරක්\", 6), (\"හත්ත වරක්\", 7), (\"අට වරක්\", 8), (\"නව වරක්\", 9), (\"දහය වරක්\", 10), (\"එකොළහ වරක්\", 11)])\n- frac_txt, frac_val = sample(fraction_alnum)\n\n#conditions:\n- is_int(alphabets_val * frac_val)\n\n#answer: 2 * (alphabets_val * n1_val + alphabets_val * frac_val)\n"
