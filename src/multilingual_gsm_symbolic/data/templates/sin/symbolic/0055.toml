question = "එලිස් ලිවීම ඉගෙන ගනිමින් සිටින අතර ඇය එය දන්නා තෙක්ම අක්ෂරාවලිය නැවත නැවත ලිවීමට තීරණය කරයි. ඇය එය සම්පූර්ණයෙන්ම දෙවරක් ලියයි, එහි අඩක් වරක් ලියයි, ඉන්පසු ඇය දැනටමත් ලිවූ සියල්ල නැවත ලියයි. මුළු වශයෙන්ම එලිස් ලිවූ අකුරු කීයක්ද?"
answer = "එලිස් විසින් අක්ෂරාවලිය දෙවරක් ලියා ඇත. එය මුළු වශයෙන් 26*2=<<26*2=52>>52 අකුරු වේ.\nඉන්පසු ඇය අක්ෂරාවලිය හි අඩක් ලියයි. එය 26*1/2=<<26*1/2=13>>13 අකුරු වේ.\nමේ දක්වා මුළු වශයෙන් 52 + 13 = <<52+13=65>>65 අකුරු වේ.\nමෙය නැවත ලිවීම යනු ඇය ලිවූ අකුරු ගණන දෙගුණයක් බවයි, එබැවින් ඇය මුළු වශයෙන් 65 * 2 = <<65*2=130>>130 අකුරු ලිවී ඇත.\n#### 130\n"
