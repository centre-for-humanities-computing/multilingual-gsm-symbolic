question = "ඩැක්ස් කෘෂිකාර්මික භූමිය වෙත ඇපල් කිහිපයක් කැපීමට ගියේය සහ උද්භිදය තුළ කෘමීන් තරම් අඩක් කෘමීන් සොයා ගත්තේය. කෘමීන් 50 සිටියේ නම්, උද්භිදය තුළ මුළු කෘමීන් සංඛ්‍යාව ගණනය කරන්න."
