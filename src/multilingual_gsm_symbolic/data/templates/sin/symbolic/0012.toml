question = "ජේම්ස් සමහර තට්ටුවs මත බිත්තරs තබයි. එක් එක් තට්ටුව හි 24 බිත්තරs තැබිය හැක. ඔහු සතුව 64 බිත්තරs සහ 2 තට්ටුවs තිබේ නම්, ඔහුට තට්ටුව මත තැබිය නොහැකි බිත්තරs කීයක් තිබේද?"
