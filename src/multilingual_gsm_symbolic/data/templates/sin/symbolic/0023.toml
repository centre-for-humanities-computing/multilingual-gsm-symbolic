question = "මාර්තා තමාගේ 3 නිත්තා සඳහා සීත කාලීන ඇඳුම් රැඳීමට සිටී. ඔවුන් තුන් දරු බැවින්, සියල්ලන්ම එකම ප්‍රමාණයේය. ඇය ඔවුන් සෑම කෙනෙකුටම මුදු, ගෙලුම්බුව, කුලු, අත්වැසුම්, සහ පාද වැසුම් සාදා ගැනීමට අවශ්‍ය වේ. මුදු සාදා ගැනීමට 2 කොටු තන් අවශ්‍ය වේ, ගෙලුම්බුව සඳහා 4, කුලු සඳහා 12, අත්වැසුම් යුගලක් සඳහා 1, සහ පාද වැසුම් යුගලක් සඳහා 2 වේ. ඇයට මිලදී ගත යුතු කොටු තන් කීයක්ද?"
answer = "එක් දරුවෙකු සඳහා සම්පූර්ණ ඇඳුමක් සඳහා මුදු සඳහා 2 තන් + ගෙලුම්බුව සඳහා 4 තන් + කුලු සඳහා 12 තන් + අත්වැසුම් යුගලක් සඳහා 1 තන් + පාද වැසුම් යුගලක් සඳහා 2 තන් = <<2+4+12+1+2=21>>21 කොටු තන්.\nඑබැවින් තමාගේ නිත්තා සියලු දෙනාටම ඇඳුම් රැඳීමට, ඇයට අවශ්‍ය වේ 3*21 = <<3*21=63>>63 කොටු තන්.\n#### 63\n"
