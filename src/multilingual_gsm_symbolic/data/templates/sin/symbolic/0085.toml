question_annotated = "{name1,සැම්} සහ {name2,හැරී} අතරට {total,100} {unit,පාද} වැටක් තිබේ නම්, සහ {name2,හැරී}ට {name1,සැම්}ට වඩා {diff,60} {unit,පාද} වැඩි ප්‍රමාණයක් ලැබෙන පරිදි ඔවුන් එකඟ වුවහොත්, {name1,සැම්}ට ඉතිරි වන්නේ කොපමණ ද?\n\n#init:\n- name1, name2 = sample(names, 2)\n- unit = sample([\"පාද\", \"යාර\", \"මීටර\"])\n- $total = range(100, 1000, 20)\n- $diff = range(20, 200, 10)\n\n#conditions:\n- total - diff > 10\n- is_int((total - diff) / 2)\n\n#answer: (total - diff) // 2"
answer_annotated = "{name1} ලබා ගන්නා වැට ප්‍රමාණය x යැයි ගනිමු සහ {name2} ලබා ගන්නා ප්‍රමාණය y යැයි ගනිමු. අපි දන්නවා y = x + {diff}, සහ y + x = {total} බව.\nපළමු සමීකරණය දෙවන සමීකරණයට ආදේශ කිරීමෙන් අපට ලැබෙන්නේ 2x+{diff}={total} ය.\nදෙපසින්ම {diff} අඩු කිරීමෙන් අපට ලැබෙන්නේ 2x={total-diff} ය.\nඅපි එක් එක් පැත්ත දෙකෙන් බෙදූ විට, x={(total-diff)//2} ලෙස ඉතිරි වේ. මෙයින් අදහස් වන්නේ {name1} සතුව {(total-diff)//2} {unit} වැටක් ඉතිරි වේ.\n#### {(total-diff)//2}"
