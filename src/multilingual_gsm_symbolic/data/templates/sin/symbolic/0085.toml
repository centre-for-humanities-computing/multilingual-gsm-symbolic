question = "සැම් සහ හැරී අතරට 100 පාද වැටක් තිබේ නම්, සහ හැරීට සැම්ට වඩා 60 පාද වැඩි ප්‍රමාණයක් ලැබෙන පරිදි ඔවුන් එකඟ වුවහොත්, සැම්ට ඉතිරි වන්නේ කොපමණ ද?"
answer = "සැම් ලබා ගන්නා වැට ප්‍රමාණය x යැයි ගනිමු සහ හැරී ලබා ගන්නා ප්‍රමාණය y යැයි ගනිමු. අපි දන්නවා y = x + 60, සහ y + x = 100 බව.\nපළමු සමීකරණය දෙවන සමීකරණයට ආදේශ කිරීමෙන් අපට ලැබෙන්නේ 2x+60=100 ය.\nදෙපසින්ම 60 අඩු කිරීමෙන් අපට ලැබෙන්නේ 2x=40 ය.\nඅපි එක් එක් පැත්ත දෙකෙන් බෙදූ විට, x=20 ලෙස ඉතිරි වේ. මෙයින් අදහස් වන්නේ සැම් සතුව 20 පාද වැටක් ඉතිරි වේ.\n#### 20"
