question = "ඇපල් උසස් පාසල විසින් මෙම වසරේදී කලා මධ්‍යස්ථානය හි උපාධි ප්‍රදාන උත්සවය පවත්වන අතර එහි මිනිසුන් 6000 දෙනෙකුට ස්ථානයක් ඇත. උපාධිධාරීන් සඳහා 950 ආසන සහ සහභාගී වන ගුරු මණ්ඩලය සඳහා 300 ආසන සැලකූ පසු, ටිකට් සමානව බෙදා දුන්නහොත් තම මිතුරන් සහ පවුලේ අයට ලබා දීමට එක් උපාධිධාරියෙකුට ලැබෙන ටිකට් ප්‍රමාණය කීයද?"
