question_annotated = "එහි පෝෂණ තොරතුරු අනුව, {food,චිප්ස්} පැකට්ටුවක සර්විං එකකට {cal,250} කැලරි ඇත. {size,300} {unit,ග්‍රෑම්} පැකට්ටුවක {n,5} සර්විං තිබේ නම්, ඔබේ දෛනික කැලරි අරමුණ {total,2000} නම් සහ ඔබ දැනටමත් {spent,1800} කැලරි පරිභෝජනය කර ඇත්නම්, ඔබට කොපමණ {unit,ග්‍රෑම්} කන්න පුළුවන්ද?\n\n#init:\n- food = sample([\"පොප්කෝන්\", \"බ්‍රෙඩ්\",  \"කුකීස්\"])\n- unit = sample([\"ග්‍රෑම්\", \"ඔන්ස්\", \"ඔන්ස්\"])\n- $cal = range(150, 500, 25)\n- $size = range(100, 400, 25)\n- $n = range(4, 8)\n- $total = range(1900, 2500, 5)\n- $spent = range(600, 1900, 25)\n\n#conditions:\n- spent < total\n- is_int( 5 * (total - spent) / cal)\n- divides(size, n)\n- divides(size//n, (total-spent)/cal)\n\n#answer: size//n * Fraction((total-spent)/cal)"
answer_annotated = "මුළු කැලරි අරමුණ {total} නම් සහ මම {spent} කැලරි පරිභෝජනය කර ඇත්නම්, එවිට මට කෑමට ඉතිරි වී ඇත්තේ {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} කැලරි පමණි\n{food} එක් සර්විං එකකට {cal} කැලරි තිබේ සහ මට කෑමට ඉතිරි වී ඇත්තේ {total-spent} කැලරි පමණක් නම්, එවිට මට සර්විං එකක {total-spent}/{cal} කොටසක් පමණක් කන්න පුළුවන් = සර්විං එකක {Fraction((total-spent)/cal)} කොටසයි\nඅප දන්නවා මෙන්ම, {size} {unit} පැකට්ටුවක {food} {n} සර්විං ඇත, එබැවින් සර්විං එකකට {size} {unit}/{n} ඇත = <<{size}/{n}={size//n}>>{size//n} {unit} කි\nමට සර්විං එකක {Fraction((total-spent)/cal)} කොටසක් පමණක් කන්න පුළුවන් නම්, එවිට මට {size//n} {unit} * {Fraction((total-spent)/cal)} පමණක් කන්න පුළුවන් = {size//n * (total-spent)/cal} {unit} කි\n#### {size//n * (total-spent)/cal}"
