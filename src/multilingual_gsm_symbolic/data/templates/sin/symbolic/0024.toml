question = "එහි පෝෂණ තොරතුරු අනුව, චිප්ස් පැකට්ටුවක සර්විං එකකට 250 කැලරි ඇත. 300 ග්‍රෑම් පැකට්ටුවක 5 සර්විං තිබේ නම්, ඔබේ දෛනික කැලරි අරමුණ 2000 නම් සහ ඔබ දැනටමත් 1800 කැලරි පරිභෝජනය කර ඇත්නම්, ඔබට කොපමණ ග්‍රෑම් කන්න පුළුවන්ද?"
answer = "මුළු කැලරි අරමුණ 2000 නම් සහ මම 1800 කැලරි පරිභෝජනය කර ඇත්නම්, එවිට මට කෑමට ඉතිරි වී ඇත්තේ 2000-1800 = <<2000-1800=200>>200 කැලරි පමණි\nචිප්ස් එක් සර්විං එකකට 250 කැලරි තිබේ සහ මට කෑමට ඉතිරි වී ඇත්තේ 200 කැලරි පමණක් නම්, එවිට මට සර්විං එකක 200/250 කොටසක් පමණක් කන්න පුළුවන් = සර්විං එකක 4/5 කොටසයි\nඅප දන්නවා මෙන්ම, 300 ග්‍රෑම් පැකට්ටුවක චිප්ස් 5 සර්විං ඇත, එබැවින් සර්විං එකකට 300 ග්‍රෑම්/5 ඇත = <<300/5=60>>60 ග්‍රෑම් කි\nමට සර්විං එකක 4/5 කොටසක් පමණක් කන්න පුළුවන් නම්, එවිට මට 60 ග්‍රෑම් * 4/5 පමණක් කන්න පුළුවන් = 48 ග්‍රෑම් කි\n#### 48"
