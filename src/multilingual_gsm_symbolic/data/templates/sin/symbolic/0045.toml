question = "පාට් සතුව 111 පාද දිග මල් බිමක් ඇත. පාට් තම මල් බිම පැල වලින් පිරවීමට කැමතියි. පාට්ගේ මල් වල පළල 12 අඟල් වන අතර, වගා මාර්ගෝපදේශ වලට අනුව බිම දිගේ 1.5 පාද එකක් බැගින් මල් රෝපණය කළ යුතුය. පාට් දැනටමත් 17 මල් පැල සතු වේ. සෑම මල් පැලයකම මිල වෙළඳසැලේදී $6 කි. තම මල් බිම පිරවීමට පාට් වෙළඳසැලේදී කොපමණ මුදලක් වැය කරනු ඇත්ද?"
answer = "පාට්ගේ මල් බිම 111 පාද / 1.5 පාද පැලයකට = <<111/1.5=74>>74 පැල අවශ්‍ය වේ.\nපාට් මිලදී ගත යුතු පැල 74 පැල - 17 පැල = <<74-17=57>>57 පැල මිලදී ගැනීමට අවශ්‍ය වේ.\nපාට් වැය කරනු ඇත්තේ 57 පැල * $6 = $<<57*6=342>>342.\n#### 342\n"
