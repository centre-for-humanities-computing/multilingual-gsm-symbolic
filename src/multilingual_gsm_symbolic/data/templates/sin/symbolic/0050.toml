question = "බිලි හි සෘජුකෝණාස්‍රාකාර නින්ද කාමරය හි වර්ගඵලය 360 වර්ග අඩි වේ. කාමරයේ දිග 3 ගජ නම්, කාමරයේ පරිධිය අඩි වලින් කීයද?"
