question = "Mpho ya go ya lebopong la lewatle go phomola. Batsadi ba gagwe ba mo neile $15 go reka sepe a se batlang. Mo mabenkeleng a dilo tsa setlho, taffy e ne e le go rekisa ka \"Reka 1 paunde ka $3 ka paunde, gona go bona 1 paunde 1/2 fa tlase.\" E reka 4 dipaunde. Gape o ne a reka sekotlolo se se tshwanang sa ditshila tsa lewatle ka $1.5 le 4 dimagnet tse di ne di le $0.25 nngwe le nngwe. Madi a a setseng ke a makae a mpho?"
answer = "Mpho o a reka 1 paunde ka $3 le go bona 1 paunde 1/2 fa tlase. Ka jalo 1/2 fa tlase ga 1 paunde ke $3*1/2 = $1.5. Sela sa 2 dipaunde ga se na phokotsego mme e lefela 2*$3 = $6, ka jalo palogotlhe ke $3+$3/2+$6=$21/2\n4 dimagnet ka $0.25 nngwe le nngwe ke 4*0.25=$<<4*0.25=1>>1\nFa o kopanya ditshenyagalo tsotlhe tsa gagwe, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nO ne a na le $15 mme a tshola $13 ka jalo o ne a na le $15-$13 = $<<15-13=2>>2 a setseng\n#### 2\n"
