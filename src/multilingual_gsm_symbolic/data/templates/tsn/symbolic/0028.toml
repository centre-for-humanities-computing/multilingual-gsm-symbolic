question = "Bongaka e na le bokgoni jwa 1000 lebetes tse di 1/5 di tletseng. Ka ntlha ya tshwaetso ya coronavirus, 50 barwale ba tsenngwa mo bongaka ka letsatsi. Bala palo yotlhe ya lebetes tse di sa tshwerweng mo bongaka morago ga 2 dibeke."
answer = "Fa 1/5 ya bokgoni jwa bongaka lebetes e tletse, se se raya gore 1/5 * 1000 = <<1000*1/5=200>>200 lebetes di na le barwale ba di dirisang.\nPalo yotlhe ya lebetes mo bongaka ntle le go tsenngwa ga ba ba gaisang ke 1000 lebetes - 200 lebetes = <<1000-200=800>>800 lebetes.\nFa 50 batho ba tsenngwa ka letsatsi, palo yotlhe ya barwale mo bongaka morago ga beke e le nngwe ke 50 barwale/letsatsi * 7 matsatsi/beke = 350 barwale.\nMorago ga 2 dibeke, palo yotlhe ya barwale ba ba tsenngwang mo bongaka ke 350 barwale/beke * 2 dibeke = <<350*2=700>>700 barwale, ba ba dirisang lebete e le nngwe mongwe le mongwe.\nFa go ne go na le 800 lebetes tse di sa tshwerweng mo bongaka pele ga go tsenngwa ga ba ba gaisang, palo yotlhe e a fokotsega go ya go 800 lebetes - 700 lebetes = <<800-700=100>>100 lebetes tse di sa tshwerweng.\n#### 100\n"
