answer_annotated = "Fa {frac} ya bokgoni jwa {facility} {item}s e tletse, se se raya gore {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item}s di na le barwale ba di dirisang.\nPalo yotlhe ya {item}s mo {facility} ntle le go tsenngwa ga ba ba gaisang ke {total} {item}s - {int(total*frac)} {item}s = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}s.\nFa {daily} batho ba tsenngwa ka letsatsi, palo yotlhe ya barwale mo {facility} morago ga beke e le nngwe ke {daily} barwale/letsatsi * 7 matsatsi/beke = {daily*7} barwale.\nMorago ga {period} dibeke, palo yotlhe ya barwale ba ba tsenngwang mo {facility} ke {daily*7} barwale/beke * {period} dibeke = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} barwale, ba ba dirisang {item} e le nngwe mongwe le mongwe.\nFa go ne go na le {total-int(total*frac)} {item}s tse di sa tshwerweng mo {facility} pele ga go tsenngwa ga ba ba gaisang, palo yotlhe e a fokotsega go ya go {total-int(total*frac)} {item}s - {daily*period*7} {item}s = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item}s tse di sa tshwerweng.\n#### {total - (total * frac + daily * period * 7)}\n"
