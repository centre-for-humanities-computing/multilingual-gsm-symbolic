question = "Dana o ka matha makgetlo a mane go feta fa a tsamaya, mme a ka tlhoma ka lebelo le le halofo jaaka a matha. Fa a ka tlhoma ka 3 dimaele ka ura, o ka tsamaya dimaele di le kae ka supa diura fa a tsenya karolo ya boraro e le nngwe ya nako a matha le karolo ya boraro tse pedi ya nako a tsamaya?"
answer = "Fa Dana a ka tlhoma ka halofo lebelo le a ka mathang, mme a ka matha ka 3*2=<<3*2=6>>6 dimaele ka ura.\nLe ka gonne a ka matha ka lebelo le le makgetlo a mane go feta fa a tsamaya, seno se raya gore a ka tsamaya ka 6/5=1.2 dimaele ka ura.\nFa karolo ya boraro tse pedi ya nako e tsewa go tsamaya, mme a tsamaya ka 10*3/5=<<10*3/5=6>>6 diura.\nFa karolo ya boraro e le nngwe ya nako e tsewa go matha, mme a matha ka 10-6=<<10-6=6>>6 diura.\nKa jalo, a matha ka 6 diura ka 6 dimaele ka ura, kgotsa 6*6=<<6*6=36>>36 dimaele.\nA tsamaya ka 6 diura ka 1.2 dimaele ka ura, kgotsa 6*1.2=<<6*1.2=36/5>>36/5 dimaele.\nKa jalo, ka kakaretso, o tsamaya 36+36/5=<<36+36/5=43>>43 dimaele.\n#### 43\n"
