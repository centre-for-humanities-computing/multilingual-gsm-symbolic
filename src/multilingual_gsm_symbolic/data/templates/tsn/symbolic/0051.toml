question = "Artie o na le setshelo sa palesa mo Mmaraka wa Basadi. O rekisa mefuta e meraro ya palesa: dipalesa tsa marigold, dipalesa tsa petunia le dipalesa tsa begonia. O tlwaelegile go rekisa dipalesa tsa marigold ka $2.74 ka pota, dipalesa tsa petunia ka $1.87 ka pota le dipalesa tsa begonia ka $2.12 ka pota. Artie ga a na phetolo gompieno, ka jalo o tshetse go dikgokaganya theko yotlhe ya gagwe go ya ka dolara e e gaufi. Fa Artie a rekisa 12 pota tsa dipalesa tsa marigold, 9 pota tsa dipalesa tsa petunia le 17 pota tsa dipalesa tsa begonia, o tla dira bokae?"
