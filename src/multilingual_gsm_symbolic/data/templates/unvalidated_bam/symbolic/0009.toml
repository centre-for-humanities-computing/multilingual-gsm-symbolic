question = "Lase Sophie ka ɲɛgɛ ta kɛ, o dɔgɔnɔgɔn fɛn fɛn ɔ la. Dɔgɔnɔgɔn kɛnɛ kɛnɛ kɛnɛ ɔ la 31 kɛnɛ bɛ. Kɛnɛ dɔgɔnɔgɔn sɛbɛ ɔ la 8 dɔgɔnɔgɔn sɛbɛ bɛ. Dɔgɔnɔgɔn kɛnɛ kɛnɛ ɔ la 9 dɔgɔnɔgɔn kɛnɛ bɛ. Sophie fɛn kɛra dɔgɔnɔgɔn kɛnɛ kɛnɛ, o dɔgɔnɔgɔn kɛnɛ kɛnɛ ɔ la ɲɛgɛ taa 62. Taa fɛn dɔgɔnɔgɔn kɛnɛ ɔ la kɛnɛ?"
