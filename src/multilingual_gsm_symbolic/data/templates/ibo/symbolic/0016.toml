question = "Sunny na-ere nri gingerbread na apụl pie maka mmụba ego. Na Satọde, o rere 10 igbe nri gingerbread na igbe apụl pie 4 na-erughị karịa na Sọnde. Na Sọnde, o rere 5 igbe nri gingerbread karịa na Satọde na igbe apụl pie 15. Ọ bụrụ na nri gingerbread dị ọnụ $6 na apụl pie dị ọnụ $15, ego ole ka Sunny nwetara maka ụbọchị abụọ?"
answer = "O rere 10 + 5 = <<10+5=15>>15 igbe nri gingerbread na Sọnde.\nỌnụ ọgụgụ igbe nri gingerbread niile nke Sunny rere bụ 10 + 15 = <<10+15=25>>25.\nSunny nwetara 25*$6 = $<<25*6=150>>150 maka ire nri gingerbread.\nO rere 15 - 4 = <<15-4=11>>11 igbe apụl pie na Satọde.\nỌnụ ọgụgụ igbe apụl pie niile nke Sunny rere bụ 15 + 11 = <<15+11=26>>26.\nO nwetara 26*$15 = $<<26*15=390>>390 maka ire apụl pie.\nYa mere, Sunny nwetara $150 + $390 = $<<150+390=540>>540 maka ụbọchị abụọ.\n#### 540\n"
