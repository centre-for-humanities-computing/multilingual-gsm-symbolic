question = "Nwanyị Cruz na-achọ ụlọ nke agaghị agafe oke ụgwọ ya nke $400,000. O hụrụ ihe onwunwe nke nwere ọnụahịa ire nke $350,000. Ọzọkwa, onye zụrụ ya ga-akwụ ụgwọ ọrụ nke bụ 5% nke ọnụahịa ire, na ụgwọ mbufe nke bụ 12% nke ọnụahịa ire. Olee otú ọnụahịa zuru oke nke ụlọ karịa oke ụgwọ Nwanyị Cruz?"
