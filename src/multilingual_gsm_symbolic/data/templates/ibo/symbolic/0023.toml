question = "Martha na-akụ uwe oyi maka 3 ụmụ ụmụ ya. Ha bụ ụmụ atọ, ya mere ha niile nwere otu nha. O chọrọ ime okpu, akpụkpọ olu, sweater, ugbegu, na mgbu ụkwụ maka onye ọ bụla n'ime ha. Ọ na-ewe 2 eriri iji mee okpu, 4 maka akpụkpọ olu, 12 maka sweater, 1 maka ụzọ abụọ nke ugbegu, na 2 maka ụzọ abụọ nke mgbu ụkwụ. Olee ole na ole eriri ga-achọ ịzụta?"
answer = "Nchịkọta uwe zuru oke maka ụmụaka ọ bụla ga-achọ 2 eriri kwa okpu + 4 eriri kwa akpụkpọ olu + 12 eriri kwa sweater + 1 eriri kwa ụzọ abụọ nke ugbegu + 2 eriri kwa ụzọ abụọ nke mgbu ụkwụ = <<2+4+12+1+2=21>>21 eriri.\nYa mere, iji kụọ uwe maka ụmụ ụmụ ya niile, ga-achọ 3*21 = <<3*21=63>>63 eriri.\n#### 63\n"
