question = "Dabere na ozi nri ya, akpa nri nnu nwere 250 calories kwa nri. Ọ bụrụ na akpa 300 gram nwere 5 nri, ole gram ka ị nwere ike iri ọ bụrụ na ebumnuche calorie gị kwa ụbọchị bụ 2000 ma ị riri 1800 calories?"
