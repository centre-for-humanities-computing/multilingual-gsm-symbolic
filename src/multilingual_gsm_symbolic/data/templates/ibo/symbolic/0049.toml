question = "John na-anakọta ihe mkpofu site na 3 mpaghara ụlọ dị iche iche. Ndị mbụ abụọ nwere 200 ụlọ ọ bụla ma nke ikpeazụ bụ 60% karịrị ndị ọzọ abụọ jikọtara. Ọ na-anakọta ihe mkpofu 3 ugboro n'izu site na ebe ọ bụla ma ọ na-enweta $0.4 n'oge nchịkọta ọ bụla maka ụlọ ọ bụla. Olee ole ego ka o na-enweta n'izu?"
answer = "Ndị mbụ abụọ mpaghara ụlọ nwere 2*200=<<2*200=400>>400 ụlọ\nNọmba 3 nwere 400*0.6=<<400*0.6=240>>240 ụlọ karịa ndị abụọ jikọtara.\nYa mere, n'ozuzu, o nwere 400+240=<<400+240=640>>640 ụlọ.\nYa mere, n'ozuzu, ọ na-aga 640+400=<<640+400=1040>>1040 ụlọ n'oge ọ bụla\nNke a pụtara na ọ na-aga 1040*3=<<1040*3=3120>>3120 ụlọ n'izu ọ bụla\nYa mere ọ na-enweta 3120*$0.4=$<<3120*0.4=1248>>1248 n'izu ọ bụla\n#### 1248\n"
