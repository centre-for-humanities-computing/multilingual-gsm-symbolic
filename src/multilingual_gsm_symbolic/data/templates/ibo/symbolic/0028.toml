question = "Ụlọ ọgwụ nwere ikike nke 1000 ahụ ụras nke 1/5 a jiri. N'ihi mgbasa ọrịa coronavirus, 50 ndị ọrịa na-abanye n'ime ụlọ ọgwụ kwa ụbọchị. Gbakọọ ọnụ ọgụgụ zuru oke nke ahụ ụras na-adịghị ejiri n'ime ụlọ ọgwụ mgbe 2 izu gachara."
answer = "Ọ bụrụ na 1/5 nke ikike zuru oke nke ụlọ ọgwụ ahụ ụras a jiri, ọ pụtara na 1/5 * 1000 = <<1000*1/5=200>>200 ahụ ụras ndị ọrịa na-eji.\nỌnụ ọgụgụ zuru oke nke ahụ ụras dị n'ime ụlọ ọgwụ na-enweghị ndị ọrịa ọhụrụ bụ 1000 ahụ ụras - 200 ahụ ụras = <<1000-200=800>>800 ahụ ụras.\nỌ bụrụ na 50 ndị mmadụ na-abanye kwa ụbọchị, ọnụ ọgụgụ ndị ọrịa zuru oke dị n'ime ụlọ ọgwụ mgbe otu izu gachara bụ 50 ndị ọrịa/ụbọchị * 7 ụbọchị/izu = 350 ndị ọrịa.\nMgbe 2 izu gachara, ọnụ ọgụgụ ndị ọrịa niile banyere n'ime ụlọ ọgwụ bụ 350 ndị ọrịa/izu * 2 izu = <<350*2=700>>700 ndị ọrịa, ndị na-eji otu ahụ ụra n'otu n'otu.\nỌ bụrụ na e nwere 800 ahụ ụras na-adịghị ejiri n'ime ụlọ ọgwụ tupu ndị ọrịa ọhụrụ abata, ọnụ ọgụgụ ahụ na-ebelata gaa na 800 ahụ ụras - 700 ahụ ụras = <<800-700=100>>100 ahụ ụras na-adịghị ejiri.\n#### 100\n"
