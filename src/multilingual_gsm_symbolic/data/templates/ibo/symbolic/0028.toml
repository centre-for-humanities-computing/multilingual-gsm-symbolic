question_annotated = "{facility,ụlọ ọgwụ} nwere ikike nke {total,1000} {item,ahụ ụra}s nke {frac,1/5} a jiri. N'ihi {event,mgbasa ọrịa coronavirus}, {daily,50} ndị ọrịa na-abanye n'ime {facility,ụlọ ọgwụ} kwa ụbọchị. Gbakọọ ọnụ ọgụgụ zuru oke nke {item,ahụ ụra}s na-adịghị ejiri n'ime {facility,ụlọ ọgwụ} mgbe {period,2} izu gachara.\n\n#init:\n- facility = sample([\"ụlọ ọgwụ\", \"ụlọ ọgwụ nta\", \"ebe ọgwụ\", \"ebe nlekọta\"])\n- item = sample([\"ahụ ụra\", \"ụlọ\", \"akụkụ\"])\n- event = sample([\"oge ọrịa ọkụ\", \"ọdachi okike\", \"mberede buru ibu\", \"mgbasa ọrịa\"])\n- $total = range(500, 2000, 100)\n- $frac = sample(fractions)\n- $daily = range(20, 100, 5)\n- $period = range(2, 5)\n\n#conditions:\n- is_int(total * frac)\n- total * frac + daily * period * 7 < total\n\n#answer: total - (total * frac + daily * period * 7)\n"
answer_annotated = "Ọ bụrụ na {frac} nke ikike zuru oke nke {facility} {item}s a jiri, ọ pụtara na {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item}s ndị ọrịa na-eji.\nỌnụ ọgụgụ zuru oke nke {item}s dị n'ime {facility} na-enweghị ndị ọrịa ọhụrụ bụ {total} {item}s - {int(total*frac)} {item}s = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}s.\nỌ bụrụ na {daily} ndị mmadụ na-abanye kwa ụbọchị, ọnụ ọgụgụ ndị ọrịa zuru oke dị n'ime {facility} mgbe otu izu gachara bụ {daily} ndị ọrịa/ụbọchị * 7 ụbọchị/izu = {daily*7} ndị ọrịa.\nMgbe {period} izu gachara, ọnụ ọgụgụ ndị ọrịa niile banyere n'ime {facility} bụ {daily*7} ndị ọrịa/izu * {period} izu = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} ndị ọrịa, ndị na-eji otu {item} n'otu n'otu.\nỌ bụrụ na e nwere {total-int(total*frac)} {item}s na-adịghị ejiri n'ime {facility} tupu ndị ọrịa ọhụrụ abata, ọnụ ọgụgụ ahụ na-ebelata gaa na {total-int(total*frac)} {item}s - {daily*period*7} {item}s = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item}s na-adịghị ejiri.\n#### {total - (total * frac + daily * period * 7)}\n"
