question = "Deandre nwetara 3 azụ n'ụbọchị Mọnde gara aga, nke mbụ azụ o nwetara dị 56 kilogram, nke abụọ azụ o nwetara dị 46 kilogram, ma azụ fọdụrụ o nwetara dị 26 kilogram. Ọ bụrụ na kilogram nke azụ na-eri $0.5, ole ka o ga-enweta mgbe o rere azụ niile na ahịa?"
answer = "Deandre ga-enweta 56*$0.5 = $<<56*0.5=28>>28 site na nke mbụ azụ.\nO ga-enweta 46*$0.5 = $<<46*0.5=23>>23 maka nke abụọ azụ.\nNdị fọdụrụ nke azụ bụ 3-2 = <<3-2=1>>1. O ga-enweta 26*$0.5 = $<<26*0.5=13>>13 nke ọ bụla n'ime ha. Ya mere, o ga-enweta 1 * 13 = <<1*13>>=13\nYa mere, ọnụ ọgụgụ zuru oke o ga-enweta maka niile azụ bụ $28 + $23 + $13= $<<28+23+13=64>>64.\n#### 64\n"
