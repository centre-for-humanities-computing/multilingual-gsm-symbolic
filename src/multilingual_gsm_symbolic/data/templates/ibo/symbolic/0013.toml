question = "Mary bụ onye na-akụ osisi nwere mmasị siri ike. Atụrụ, o natara 18 osisi ọhụrụ ndị nọ n'ime iko site n'ụlọ ahịa osisi ọ hụrụ n'anya. O nwere naanị 2 osisi ndị nọ n'ime iko n'elu windo ọ bụla n'ime 40 elu windo n'ụlọ ukwu ya n'ime ime obodo. N'ihi na ọ bụ onye na-enye, ọ kpebiri na ọ ga-enye 1 n'ime osisi ndị nọ n'ime iko sitere n'elu windo ọ bụla nye ndị enyi na ezinụlọ ya echi. Olee ọnụ ọgụgụ osisi ndị nọ n'ime iko Mary ga-efu?"
