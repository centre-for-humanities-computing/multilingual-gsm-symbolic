question_annotated = "{name,Sally} gara n'akụkụ osimiri maka ezumike. Nne na nna ya nyere ya ${total,15} iji zụta ihe ọ chọrọ. Na ụlọ ahịa ncheta, taffy nọ na mbelata maka \"Zụta {n1,1} pound na ${p1,3} kwa pound, nweta {n2,1} pound {discount,1/2} mbelata.\" O weghaara {n12,4} pound. O zụtakwara akpa ncheta osimiri na ${p2,1.5} na {n3,4} magnet nke bụ ${p3,0.25} ọ bụla. Ole ego ka {name,Sally} nwere fọdụrụ?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} na-azụ {n1} pound maka ${p1} ma na-enweta {n2} pound {discount} mbelata. Ya mere {discount} mbelata nke {n2} pound bụ ${p1}*{discount} = ${float(n2*discount*p1)}. Ihe fọdụrụ nke {n12-n1-n2} pound enweghị mbelata ma na-akwụ {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}, ya mere nchikota bụ ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} magnet na ${p3} ọ bụla bụ {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nMgbe ị gbakwunyere ihe niile ọ zụtara, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nO nwere ${total} ma zụọ ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} ya mere o nwere ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} fọdụrụ\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
