question = "Sally gara n'akụkụ osimiri maka ezumike. Nne na nna ya nyere ya $15 iji zụta ihe ọ chọrọ. Na ụlọ ahịa ncheta, taffy nọ na mbelata maka \"Zụta 1 pound na $3 kwa pound, nweta 1 pound 1/2 mbelata.\" O weghaara 4 pound. O zụtakwara akpa ncheta osimiri na $1.5 na 4 magnet nke bụ $0.25 ọ bụla. Ole ego ka Sally nwere fọdụrụ?"
answer = "Sally na-azụ 1 pound maka $3 ma na-enweta 1 pound 1/2 mbelata. Ya mere 1/2 mbelata nke 1 pound bụ $3*1/2 = $1.5. Ihe fọdụrụ nke 2 pound enweghị mbelata ma na-akwụ 2*$3 = $6, ya mere nchikota bụ $3+$3/2+$6=$21/2\n4 magnet na $0.25 ọ bụla bụ 4*0.25=$<<4*0.25=1>>1\nMgbe ị gbakwunyere ihe niile ọ zụtara, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nO nwere $15 ma zụọ $13 ya mere o nwere $15-$13 = $<<15-13=2>>2 fọdụrụ\n#### 2\n"
