question = "Benny hụrụ 10-ụkwụ azụ̀ nwere 2 6-inchi remoras jikọtara na ya. Kedu pasent nke ogologo ahụ azụ̀ bụ ogologo nchikota nke remoras?"
answer = "Nke mbụ, chọpụta ogologo nchikota nke remoras na inchi: 6 inchi/remora * 2 remoras = <<6*2=12>>12 inchi.\nMgbe ahụ, kee ọnụọgụ ahụ site na 12 iji gbanwee ya gaa na ụkwụ: 12 inchi / 12 inchi/ụkwụ = <<12/12=1>>1 ụkwụ.\nMgbe ahụ, kee ogologo remora nchikota na ụkwụ site na ogologo azụ̀ ma mụbaa site na 100% iji gosi azịza dị ka pasent: 1 ụkwụ / 10 ụkwụ * 100% = 10%\n\n#### 10\n"
