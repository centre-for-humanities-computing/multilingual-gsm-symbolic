question_annotated = "{n, Benny} hụrụ {x,10}-ụkwụ {big_fish,azụ̀} nwere {k,2} {y,6}-inchi remoras jikọtara na ya. Kedu pasent nke ogologo ahụ {big_fish,azụ̀} bụ ogologo nchikota nke remoras?\n\n#init:\n- n = sample(names)\n- big_fish = sample([\"dolphin\", \"whale\", \"azụ̀\"])\n- $x = range(10, 500, 10)\n- $k = range(2, 10)\n- $y = range(2, 100)\n\n#conditions:\n- k * y < x * 12\n- divides(k*y,12)\n- divides(x * 12, k*y)\n- divides(100, x * 12 / (k*y))\n\n#answer: int((k * y)/ (x * 12) * 100)\n"
answer_annotated = "Nke mbụ, chọpụta ogologo nchikota nke remoras na inchi: {y} inchi/remora * {k} remoras = <<{y}*{k}={k*y}>>{k*y} inchi.\nMgbe ahụ, kee ọnụọgụ ahụ site na 12 iji gbanwee ya gaa na ụkwụ: {k*y} inchi / 12 inchi/ụkwụ = <<{k*y}/12={k*y//12}>>{k*y//12} ụkwụ.\nMgbe ahụ, kee ogologo remora nchikota na ụkwụ site na ogologo {big_fish} ma mụbaa site na 100% iji gosi azịza dị ka pasent: {k*y//12} ụkwụ / {x} ụkwụ * 100% = {int(k*y/(12*x)*100)}%\n\n#### {int(k*y/(12*x)*100)}\n"
