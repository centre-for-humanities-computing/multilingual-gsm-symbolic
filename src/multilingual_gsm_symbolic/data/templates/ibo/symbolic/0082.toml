question = "Na mmalite nke mmemme, dịrị 25 ndị nwoke na 15 ụmụ nwanyị. Mgbe otawaawa, 1/4 nke ọnụ ọgụgụ mmadụ niile hapụrụ. Olee ole ụmụ nwanyị ka dị ma ọ bụrụ na 22 ndị nwoke nọrọ na mmemme?"
