question = "M nwere 10 lita nke oroma ihe ọṅụṅụ nke bụ otu ụzọ n'ụzọ atọ mmiri, m chọrọ ịgbakwunye ya na 15 lita nke ananas ihe ọṅụṅụ nke bụ atọ n'ime ise mmiri. Mana ka m na-atụba ya, m na-efu anọ lita nke oroma ihe ọṅụṅụ ahụ. Olee otú mmiri dị n'ime 21 lita fọdụrụ?"
