question = "N'ime ule nwere ajụjụ 60, 40% nke ajụjụ ndị ahụ bụ mfe, ma ihe fọdụrụ ekewara n'otu n'otu dị ka ajụjụ nkezi na siri ike. Ọ bụrụ na Aries jiri n'aka nweta 75% nke ajụjụ mfe, na ọkara nke ajụjụ nkezi na siri ike n'ụzọ ziri ezi, ka ole isi ọ ga-enweta n'aka?"
