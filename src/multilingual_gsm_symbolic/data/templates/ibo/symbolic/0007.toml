question = "Onye ọrụ ugbo na-azụta nri maka ịnyịnya ya. O na-azụta ụdị dị iche iche nke igwe, oats, karọt na suga cubes. Ebe ọ bụ na suga cubes bụ nri pụrụ iche, ọ na-azụta naanị abụọ 1-pọnd igbe nke ha maka ụlọ anụmanụ niile. O chọrọ naanị karọt zuru oke iji rie ịnyịnya mgbe akwụkwọ nri dị ọhụrụ, ya mere ọ na-azụta anọ 12-pọnd akpa. Igwe bụ nri isi nke ịnyịnya ya, ya mere ọ na-azụta iri abụọ na abụọ 75-pọnd nkwakọ. Oats bụ nri isi iji wulite igwe, ya mere ọ na-azụta iri abụọ 65-pọnd akpa. Ọ bụrụ na ụgbọala ugbo ya nwere ike iburu 2250 pọnds n'oge, ugboro ole ka onye ọrụ ugbo ga-ewe iji buo nri niile?"
answer = "Onye ọrụ ugbo na-azụta 2*1 = <<2*1=2>>2 pọnds nke suga cubes.\nO na-azụta 4*12 = <<4*12=48>>48 pọnds nke karọt.\nO na-azụta 20*65 = <<20*65=1300>>1300 pọnds nke oats.\nO na-azụta 42*75 = <<42*75=3150>>3150 pọnds nke igwe.\nIbu nke nri niile bụ 2 + 48 + 1300 + 3150 = <<2+48+1300+3150=4500>>4500 pọnds.\nYa mere, onye ọrụ ugbo chọrọ 4500 / 2250 = <<4500/2250=2>>2 njem iji buo nri niile n'ụgbọala ugbo ya.\n#### 2\n"
