question = "Mgbe Sophie na-lekọta nwa nwanne ya nwoke, ọ na-ewepụ ụdị ihe egwuregwu dị iche iche maka ya. Akpa bloks owuwu nwere 31 bloks n'ime ya. Ebe nchekwa anụmanụ akpụkpọ anụ nwere 8 anụmanụ akpụkpọ anụ n'ime ya. Taa mgbanaka na-ekpokọta nwere 9 mgbanaka na-acha ụcha dị iche iche n'elu ya. Sophie zụtara tuba nke bọọlụ na-akpụ akpụ n'oge na-adịbeghị anya, na-eme ka ọnụọgụgụ ihe egwuregwu ya niile maka nwa nwanne ya nwoke ruo 62. Ihe ole nke bọọlụ na-akpụ akpụ dị na tuba ahụ?"
