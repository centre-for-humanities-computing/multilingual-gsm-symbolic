question = "Artie nwere ahịa okooko osisi na ahịa ndị ọrụ ugbo. Ọ na-ere ụdị okooko osisi atọ: okooko marigold, okooko petunia na okooko begonia. Ọ na-erekarị okooko marigold na $2.74 kwa igwe, okooko petunia na $1.87 kwa igwe na okooko begonia na $2.12 kwa igwe. Artie enweghị ọgbanwe taa, ya mere o kpebiri ịgbago ọnụahịa ya niile gaa na dọla kacha nso. Ọ bụrụ na Artie ere 12 igwe nke okooko marigold, 9 igwe nke okooko petunia na 17 igwe nke okooko begonia, ole ka o ga-enweta?"
answer = "Artie ga-eme ka okooko marigold ya gbagoo elu site na $2.74 ruo $3, n'ihi na ọnụọgụgụ na-esochi 2 bụ 5 ma ọ bụ karịa.\nArtie ga-eme ka okooko petunia ya gbagoo up site na $1.87 ruo $2, n'ihi na ọnụọgụgụ na-esochi 1 bụ 5 or higher.\nArtie ga-eme ka okooko begonia ya gbagoo down site na $2.12 ruo $2, n'ihi na ọnụọgụgụ na-esochi 2 bụ less than 5.\nArtie ere 12 okooko marigold*$3 = $<<12*3=36>>36\nArtie ere 9 okooko petunia*$2 = $<<9*2=18>>18\nArtie ere 17 okooko begonia*$2 = $<<17*2=34>>34\nNa nchịkọta, Artie ga-enweta $36 + $18 + $34 = $<<36+18+34=88>>88\n#### 88\n"
