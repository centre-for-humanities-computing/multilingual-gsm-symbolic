question = "Nne nna na-aga n'ụzọ 3 miles kwa ụbọchị n'ụzọ njem ọ na-achọsi ike, nke gụnyere 2 miles nke ịga n'ọdụ mmiri na 1 mile(s) nke ịga n'okporo ụzọ. N'okporo ụzọ, Nne nna na-aga n'ọsọ ugboro abụọ karịa ka o si aga n'ọdụ mmiri. Ọ bụrụ na 40 nkeji nke njem ya na-aga n'ọdụ mmiri, oge ole ka ọ na-ewe ka o rụchaa njem 3-mile ya dum, n'ime nkeji?"
