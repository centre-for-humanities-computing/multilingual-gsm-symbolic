question = "Iji mee oku site na ọfụma, ị ga-akwụ $0.25 maka nkeji ọ bụla nke oku gị. Mgbe 16 nkeji, ahịa ahụ na-ada ruo $0.2 n'otu nkeji. Olee otú oku 36-nkeji ga-akwụ?"
