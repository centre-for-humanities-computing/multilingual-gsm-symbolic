question = "瑪莎 正在為她的 3 個孫兒織冬季衣物。他們是 三胞胎，所以尺寸都相同。她想為每個孫兒做一頂 帽子、一條 圍巾、一件 毛衣、一雙 連指手套 和一雙 襪子。做一頂 帽子 需要 2 團毛線，圍巾 需要 4 團，毛衣 需要 12 團，一雙 連指手套 需要 1 團，一雙 襪子 需要 2 團。她需要買多少團毛線？"
