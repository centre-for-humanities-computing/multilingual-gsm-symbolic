question = "Sunny 正在為籌款活動售賣 薑餅 和 蘋果 派。在 星期六，他售賣了 10 盒 薑餅，比 星期日 少 4 盒 蘋果 派。在 星期日，他售賣的 薑餅 比 星期六 多 5 盒，並售賣了 15 盒 蘋果 派。如果 薑餅 售價 $6，而 蘋果 派售價 $15，Sunny 兩天共賺了多少錢？"
answer = "他在 星期日 售賣了 10 + 5 = <<10+5=15>>15 盒 薑餅。\nSunny 售賣的 薑餅 總盒數為 10 + 15 = <<10+15=25>>25。\n出售 薑餅，Sunny 賺了 25*$6 = $<<25*6=150>>150。\n他在 星期六 售賣了 15 - 4 = <<15-4=11>>11 盒 蘋果 派。\nSunny 售賣的 蘋果 派總盒數為 15 + 11 = <<15+11=26>>26。\n出售 蘋果 派，他賺了 26*$15 = $<<26*15=390>>390。\n所以，Sunny 兩天共賺了 $150 + $390 = $<<150+390=540>>540。\n#### 540\n"
