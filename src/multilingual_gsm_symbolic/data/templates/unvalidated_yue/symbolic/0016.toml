answer_annotated = "他在 {d2} 售賣了 {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} 盒 {food}。\n{name} 售賣的 {food} 總盒數為 {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}。\n出售 {food}，{name} 賺了 {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn}。\n他在 {d1} 售賣了 {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} 盒 {fruit} 派。\n{name} 售賣的 {fruit} 派總盒數為 {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}。\n出售 {fruit} 派，他賺了 {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm}。\n所以，{name} 兩天共賺了 {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm}。\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
