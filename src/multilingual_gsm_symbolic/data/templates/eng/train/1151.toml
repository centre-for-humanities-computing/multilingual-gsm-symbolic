question = """
New York is two-thirds as populated as all of New England. If New England has 2,100,000 people, calculate the combined population of both states.
"""

answer = """
New York is two-thirds as populated as all of New England, meaning there are 2/3*2,100,000 = <<2/3*2100000=1400000>>1,400,000 people living in New York.
The combined population of both states is 1,400,000+2,100,000 = <<1400000+2100000=3500000>>3,500,000
#### 3500000
"""

