question_annotated = "{n, Benny} {k,2} adet {y,6}-inçlik remorası takılı olan {x,10}-ayaklık bir {big_fish,köpekbalığı} gördü. Remoraların toplam uzunluğu, {big_fish,köpekbalığı}'nın vücut uzunluğunun yüzde kaçıdır?\n\n#init:\n- n = sample(names)\n- big_fish = sample([\"delfin\", \"balina\", \"köpekbalığı\"])\n- $x = range(10, 500, 10)\n- $k = range(2, 10)\n- $y = range(2, 100)\n\n#conditions:\n- k * y < x * 12\n- divides(k*y,12)\n- divides(x * 12, k*y)\n- divides(100, x * 12 / (k*y))\n\n#answer: int((k * y)/ (x * 12) * 100)\n"
