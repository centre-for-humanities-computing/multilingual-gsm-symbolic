question = "Bir çiftçi atlar için yem alıyor. Çeşitli saman, yulaf, havuç ve şeker küpleri alıyor. şeker küpleri nadir bir ikram olduğu için, tüm ahır için sadece iki 1-libra kutu alıyor. Sadece sebzeler tazeyken atları beslemek için yeterli havuç istiyor, bu yüzden dört 12-libra poşet alıyor. Saman atlarının ana besin kaynağı, bu yüzden kırkiki 75-libra paket alıyor. Yulaf, samanı tamamlamak için temel bir gıda, bu yüzden yirmi 65-libra çuval alıyor. Çiftlik kamyonunun bir seferde 2250 libra taşıyabilmesi durumunda, tüm yemi taşımak için çiftçinin kaç sefer yapması gerekir?"
