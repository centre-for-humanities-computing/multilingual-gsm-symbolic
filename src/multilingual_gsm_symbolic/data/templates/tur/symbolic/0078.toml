question = "Normal bir öğrenci için günde 6 ders saati vardır ancak Ahmet 2 ekstra ders almak zorundadır. Her ders 40 dakika sürer. Haftada 5 gün derse gider. Daha sonra haftalık dakikalarının 1/16'sını Cumartesi ve Pazar günlerinin her birinde ekstra öğrenme zamanı olarak harcar. Haftada öğrenmeye kaç saat harcar?"
