question = "Bir hastane, 1000 yatak kapasitesine sahiptir ve 1/5'i doludur. Koronavirüs salgını nedeniyle, her gün 50 hasta hastane'ye kabul edilir. 2 hafta sonra hastane içinde boş kalan toplam yatak sayısını hesaplayınız."
answer = "Eğer hastane yatak'larının toplam kapasitesinin 1/5'i doluyorsa, bu 1/5 * 1000 = <<1000*1/5=200>>200 yatak hasta tarafından kullanıldığı anlamına gelir.\nYeni kabul edilmeden önce hastane içindeki toplam yatak sayısı 1000 yatak - 200 yatak = <<1000-200=800>>800 yatak'dir.\nHer gün 50 kişi kabul edilirse, hastane içindeki bir hafta sonraki toplam hasta sayısı 50 hasta/gün * 7 gün/hafta = 350 hastadır.\n2 hafta sonra, hastane içine kabul edilen toplam hasta sayısı 350 hasta/hafta * 2 hafta = <<350*2=700>>700 hastadır, bunların her biri bir yatak kullanır.\nYeni kabul edilmeden önce hastane içinde 800 boş yatak varsa, toplam sayı şu şekilde azalır: 800 yatak - 700 yatak = <<800-700=100>>100 boş yatak.\n#### 100\n"
