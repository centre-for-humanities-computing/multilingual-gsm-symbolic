question_annotated = "Bir {facility,hastane}, {total,1000} {item,yatak} kapasitesine sahiptir ve {frac,1/5}'i doludur. {event,koronavirüs salgını} nedeniyle, her gün {daily,50} hasta {facility,hastane}'ye kabul edilir. {period,2} hafta sonra {facility,hastane} içinde boş kalan toplam {item,yatak} sayısını hesaplayınız.\n\n#init:\n- facility = sample([\"hastane\", \"klinik\", \"tıbbi merkez\", \"bakım tesisi\"])\n- item = sample([\"yatak\", \"oda\", \"servis\"])\n- event = sample([\"grip sezonu\", \"doğal afet\", \"büyük kaza\", \"pandemi\"])\n- $total = range(500, 2000, 100)\n- $frac = sample(fractions)\n- $daily = range(20, 100, 5)\n- $period = range(2, 5)\n\n#conditions:\n- is_int(total * frac)\n- total * frac + daily * period * 7 < total\n\n#answer: total - (total * frac + daily * period * 7)\n"
answer_annotated = "Eğer {facility} {item}'larının toplam kapasitesinin {frac}'i doluyorsa, bu {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} hasta tarafından kullanıldığı anlamına gelir.\nYeni kabul edilmeden önce {facility} içindeki toplam {item} sayısı {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}'dir.\nHer gün {daily} kişi kabul edilirse, {facility} içindeki bir hafta sonraki toplam hasta sayısı {daily} hasta/gün * 7 gün/hafta = {daily*7} hastadır.\n{period} hafta sonra, {facility} içine kabul edilen toplam hasta sayısı {daily*7} hasta/hafta * {period} hafta = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} hastadır, bunların her biri bir {item} kullanır.\nYeni kabul edilmeden önce {facility} içinde {total-int(total*frac)} boş {item} varsa, toplam sayı şu şekilde azalır: {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} boş {item}.\n#### {total - (total * frac + daily * period * 7)}\n"
