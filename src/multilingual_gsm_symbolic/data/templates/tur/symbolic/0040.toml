question = "Sally tatil için sahile gitti. Ailesi ona istediğini almak için $15 verdi. Hediyelik eşya dükkanında, taffy için indirim vardı: \"1 poundu $3 dolara al, 1 poundu 1/2 indirimle al.\" 4 pound aldı. Ayrıca 1.5 dolarlık bir karışık deniz kabuğu torbası ve 4 adet mıknatıs aldı, bunların her biri 0.25 dolardı. Sally ne kadar para arttı?"
answer = "Sally 1 poundu $3 karşılığında alıyor ve 1 poundu 1/2 indirimle alıyor. Yani 1 pound için 1/2 indirim $3*1/2 = $1.5 eder. 2 poundun geri kalanı indirimli değil ve maliyeti 2*$3 = $6, böylece toplam $3+$3/2+$6=$21/2\n4 mıknatısın her biri $0.25 ise 4*0.25=$<<4*0.25=1>>1\nTüm alışverişlerini topladığımızda, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nElinde $15 vardı ve $13 harcadı, bu yüzden elinde $15-$13 = $<<15-13=2>>2 arttı\n#### 2"
