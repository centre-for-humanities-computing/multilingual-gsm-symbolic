question = "Artie Çiftçi Pazarı'nda bir çiçek tezgahı açtı. Üç tür çiçek satar: kadife çiçeği, petunya ve begonya. Genellikle kadife çiçeği için $2.74, petunya için $1.87 ve begonya için $2.12 fiyatı ödenir, her biri saksı başına. Artie bugün bozuk parası olmadığı için tüm fiyatlarını en yakın dolara yuvarlamaya karar verdi. Eğer Artie 12 saksı kadife çiçeği, 9 saksı petunya ve 17 saksı begonya satar, ne kadar kazanır?"
