answer = "Toplam kalori hedefi 2000 ise ve 1800 kalori tükettiysem, yemek için 2000-1800 = <<2000-1800=200>>200 kalorim kalmış olur\nHer çips porsiyonu 250 kalori içeriyorsa ve yemek için sadece 200 kalorim varsa, bir porsiyonun sadece 200/250'ını yiyebilirim = 4/5 porsiyon\nçips'ün 300 gramlık bir paketinin 5 porsiyonu olduğunu da biliyoruz, dolayısıyla her porsiyon 300 gram/5 = <<300/5=60>>60 gram içerir\nSadece 4/5 porsiyon yiyebiliyorsam, o zaman sadece 60 gram * 4/5 = 48 gram yiyebilirim\n#### 48\n"
