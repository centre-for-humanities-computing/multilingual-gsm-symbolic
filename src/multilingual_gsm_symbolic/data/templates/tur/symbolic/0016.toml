question = "Sunny bir bağış toplamak için zencefilli kurabiye ve elma pastası satıyor. Cumartesi günü, 10 kutu zencefilli kurabiye ve Pazar gününe göre 4 kutu daha az elma pastası sattı. Pazar günü, Cumartesi gününe göre 5 kutu daha fazla zencefilli kurabiye ve 15 kutu elma pastası sattı. Eğer zencefilli kurabiye $6 ve elma pastası $15 ise, Sunny iki gün için ne kadar kazandı?"
answer = "Pazar günü 10 + 5 = <<10+5=15>>15 kutu zencefilli kurabiye sattı.\nSunny'in sattığı toplam zencefilli kurabiye kutusu sayısı 10 + 15 = <<10+15=25>>25'dir.\nSunny zencefilli kurabiye satışı için 25*$6 = $<<25*6=150>>150 kazandı.\nCumartesi günü 15 - 4 = <<15-4=11>>11 kutu elma pastası sattı.\nSunny'in sattığı toplam elma pastası kutusu sayısı 15 + 11 = <<15+11=26>>26'dir.\nElma pastası satışı için 26*$15 = $<<26*15=390>>390 kazandı.\nYani, Sunny iki gün için $150 + $390 = $<<150+390=540>>540 kazandı.\n#### 540\n"
