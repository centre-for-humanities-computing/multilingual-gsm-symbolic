question = "Hospitali ina uwezo wa 1000 kitanda na 1/5 zimechukuliwa. Kutokana na mlipuko wa virusi vya corona, 50 wagonjwa huingizwa ndani ya hospitali kila siku. Kokotoa idadi ya jumla ya kitanda visivyo na wagonjwa katika hospitali baada ya 2 wiki."
