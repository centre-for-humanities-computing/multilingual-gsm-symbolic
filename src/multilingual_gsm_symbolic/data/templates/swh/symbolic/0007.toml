question = "Mkulima ananunua chakula kwa ajili ya farasi zake. Ananunua aina mbalimbali za nyasi, shayiri, karoti na mchemsho wa sukari. Kwa kuwa mchemsho wa sukari ni chakula cha kipekee, ananunua tu mbili ya 1-pauni sanduku za hizo kwa ajili ya kumbi ya wanyama nzima. Anataka karoti zinazotosha kumlisha farasi wakati mboga zinaendelea kuwa mbichi, kwa hiyo ananunua nne za 12-pauni mifuko. Nyasi ndiyo chakula kuu la farasi, kwa hiyo ananunua arubaini na mbili za 75-pauni paketi. Shayiri ni chakula cha kawaida kuongeza nyasi, kwa hiyo ananunua ishirini za 65-pauni saketi. Ikiwa gari lake la shamba linaweza kubeba 2250 paunis kwa wakati mmoja, mkulima anahitaji safari ngapi kubeba chakula chote?"
