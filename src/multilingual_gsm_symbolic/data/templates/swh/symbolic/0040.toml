question_annotated = "{name,Sally} alielekea pwani kwa likizo. Wazazi wake walimpa ${total,15} kununua chochote alichotaka. Dukani la vifaa vya kukumbukira, taffi ilikuwa na bei nafuu ya \"Nunua {n1,1} pauni kwa ${p1,3} kwa pauni, pata {n2,1} pauni {discount,1/2} nafuu.\" Alichukua {n12,4} pauni. Alinunua pia mfuko mchanganyiko wa magamba ya bahari kwa ${p2,1.5} na {n3,4} sumaku ambazo zilikuwa ${p3,0.25} kila moja. Pesa ngapi {name,Sally} amebaki nazo?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
