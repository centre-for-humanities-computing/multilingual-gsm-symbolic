question = "Sally alielekea pwani kwa likizo. Wazazi wake walimpa $15 kununua chochote alichotaka. Dukani la vifaa vya kukumbukira, taffi ilikuwa na bei nafuu ya \"Nunua 1 pauni kwa $3 kwa pauni, pata 1 pauni 1/2 nafuu.\" Alichukua 4 pauni. Alinunua pia mfuko mchanganyiko wa magamba ya bahari kwa $1.5 na 4 sumaku ambazo zilikuwa $0.25 kila moja. Pesa ngapi Sally amebaki nazo?"
