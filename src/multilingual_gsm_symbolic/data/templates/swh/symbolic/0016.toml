question = "Sunny anauza biskuti za uzi na tunda la mti pai kwa ajili ya mkusanyiko wa fedha. Mnamo Jumamosi, aliuza 10 sanduku za biskuti za uzi na 4 sanduku chache za tunda la mti pai kuliko Jumapili. Mnamo Jumapili, aliuza 5 sanduku nyingi zaidi za biskuti za uzi kuliko Jumamosi na 15 sanduku za tunda la mti pai. Ikiwa bei ya biskuti za uzi ni $6 na bei ya tunda la mti pai ni $15, kiasi gani Sunny alipata kwa siku mbili?"
