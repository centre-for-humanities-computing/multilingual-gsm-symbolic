question = "கார்மென் ஒரு கிராஸ்வொர்ட் புதிர் முடிக்க 10 நிமிடங்களும், ஒரு சudoku புதிர் முடிக்க 5 நிமிடங்களும் எடுத்துக்கொள்கிறார். வார இறுதி காலத்தில் அவர் 3 கிராஸ்வொர்ட் புதிர்களையும் 8 சudoku புதிர்களையும் தீர்த்துள்ளார். இந்த விளையாட்டுகளை விளையாட அவர் எவ்வளவு நேரத்தை செலவிட்டார்?"
