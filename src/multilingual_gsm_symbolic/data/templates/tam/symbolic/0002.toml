question = "ஜெர்ரி ஒரு ஆறு பக்கங்களுடைய பாயை உருட்டுகிறார். 3-ஐ விட அதிகமான எண்ணை அவர் உருட்டுவது, அவர் தொடர்ச்சியாக இரண்டு இரட்டை எண்களை உருட்டுவதை விட (சதவீத புள்ளிகளாகக் குறிப்பிடப்பட்டுள்ளது) எவ்வளவு அதிக வாய்ப்புள்ளது?"
answer = "பாயில் 3-ஐ விட அதிகமான 49 எண்கள் உள்ளன, எனவே அவற்றில் ஒன்றை உருட்டுவதற்கான வாய்ப்பு 49/52=94% ஆகும்.\nஒரு இரட்டை எண்ணை உருட்டுவதற்கான வாய்ப்பு 50%, எனவே தொடர்ச்சியாக இரண்டை உருட்டுவதற்கான வாய்ப்பு 50% * 50% = 25%.\nஇந்த இரண்டு நிகழ்தகவுகளுக்கிடையேயான வித்தியாசம் 94% - 25% = 69%.\n#### 69\n"
