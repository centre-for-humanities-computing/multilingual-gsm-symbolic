question = "கோல் ஈஸ்டர் முட்டைத் தேடலுக்காக தோட்டத்தில் 3 டஜன் முட்டைகளை மறைத்தார். லாமர் 5 முட்டைகளைக் கண்டார். ஸ்டேசி லாமர் கண்ட எண்ணிக்கையில் இரண்டு மடங்கு கண்டார். சார்லி ஸ்டேசி விட 2 குறைவாகக் கண்டார், மற்றும் மெய் சார்லி கண்ட எண்ணிக்கையில் அரை கண்டார். தோட்டத்தில் இன்னும் எத்தனை முட்டைகள் மறைக்கப்பட்டுள்ளன?"
answer = "கோல் 3*12 = <<3*12=36>>36 முட்டைகளை மறைக்கிறார்.\nலாமர் 5 முட்டைகளைக் கண்டார்.\nஸ்டேசி 5*5 = <<5*5=25>>25 முட்டைகளைக் கண்டார்.\nசார்லி 25 - 2 = <<25-2=23>>23 முட்டைகளைக் கண்டார்.\nமெய் 23*1/2=<<23*1/2=23/2>>23/2 முட்டைகளைக் கண்டார்.\nகுழந்தைகள் மொத்தம் 5 + 25 + 23 + 23/2 = <<5+25+23+23/2=129/2>>129/2 முட்டைகளைக் கண்டனர்.\nதோட்டத்தில் இன்னும் மறைக்கப்பட்டுள்ள மொத்த முட்டைகளின் எண்ணிக்கை 36 - 129/2 = <<36-129/2=-57/2>>-57/2 முட்டைகள்.\n#### -57/2\n"
