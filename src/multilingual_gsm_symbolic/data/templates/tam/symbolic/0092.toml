question = "இளவரசர் தாதேயஸ் தனது மிகச்சக்திவாய்ந்த வாள் மூலம் 100 டிராகன்களை கொன்றார், அதேசமயம் இளவரசர் ஆர்தர் ஒரு ஈட்டி பயன்படுத்தி, இளவரசர் தாதேயஸ் கொன்ற டிராகன்களை நான்கில் மூன்று பங்கு நான்கில் மூன்று கொன்றார். ஒரு துருப்பிடித்த இரும்பு குரவாள் பயன்படுத்தி, இளவரசர் வால்டர் இளவரசர் ஆர்தர் கொன்ற டிராகன்களை விட இரண்டு மடங்கு டிராகன்களை கொன்றார். ஆனால் இளவரசர் பிரஸ், தனது வாள் வீட்டில் மறந்துவிட்டு, ஒரு நகம் சீவு கத்தி மூலம் இளவரசர் வால்டர் கொன்ற டிராகன்களை ஐந்தில் ஒன்று பங்கு ஐந்தில் ஒன்று கொன்றார். இளவரசர் பிரஸ் எத்தனை டிராகன்களை கொன்றார்?"
