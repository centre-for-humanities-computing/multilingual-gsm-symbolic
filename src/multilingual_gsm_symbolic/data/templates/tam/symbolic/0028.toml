question = "ஒரு மருத்துவமனை 1000 படுக்கைகளின் கொள்ளளவு கொண்டது, 1/5 ஆக்கிரமிக்கப்பட்டுள்ளது. கொரோனா வைரஸ் பரவல் காரணமாக, ஒரு நாளைக்கு 50 நோயாளிகள் மருத்துவமனைக்குள் சேர்க்கப்படுகிறார்கள். மருத்துவமனையில் 2 வாரங்களுக்குப் பிறகு வெற்றிடமான படுக்கைகளின் மொத்த எண்ணிக்கையைக் கணக்கிடவும்."
answer = "மருத்துவமனை படுக்கைகளின் மொத்த கொள்ளளவில் 1/5 ஆக்கிரமிக்கப்பட்டிருந்தால், அதாவது 1/5 * 1000 = <<1000*1/5=200>>200 படுக்கைகளில் நோயாளிகள் பயன்படுத்துகிறார்கள்.\nபுதிய சேர்க்கைகள் இல்லாமல் மருத்துவமனையில் உள்ள படுக்கைகளின் மொத்த எண்ணிக்கை 1000 படுக்கைகள் - 200 படுக்கைகள் = <<1000-200=800>>800 படுக்கைகள்.\nஒரு நாளைக்கு 50 பேர் சேர்க்கப்பட்டால், ஒரு வாரத்திற்குப் பிறகு மருத்துவமனையில் உள்ள நோயாளிகளின் மொத்த எண்ணிக்கை 50 நோயாளிகள்/நாள் * 7 நாட்கள்/வாரம் = 350 நோயாளிகள்.\n2 வாரங்களுக்குப் பிறகு, மருத்துவமனைக்குள் சேர்க்கப்பட்ட நோயாளிகளின் மொத்த எண்ணிக்கை 350 நோயாளிகள்/வாரம் * 2 வாரங்கள் = <<350*2=700>>700 நோயாளிகள், ஒவ்வொருவரும் ஒரு படுக்கைஐப் பயன்படுத்துகிறார்கள்.\nபுதிய சேர்க்கைகளுக்கு முன் மருத்துவமனையில் 800 வெற்றிடமான படுக்கைகள் இருந்தால், மொத்த எண்ணிக்கை 800 படுக்கைகள் - 700 படுக்கைகள் = <<800-700=100>>100 வெற்றிடமான படுக்கைகள் ஆகக் குறைகிறது.\n#### 100\n"
