question = "பத்-க்கு 111 அடி நீளமுள்ள ஒரு பூந்தோட்டம் உள்ளது. பத் தனது பூந்தோட்டத்தை செடிகளால் நிரப்ப விரும்புகிறார். பத்-தின் பூக்கள் 12 இன்ச் அகலத்தில் வளரும், மற்றும் தோட்டக்கலை வழிகாட்டுதல்கள் படுக்கையின் வழியாக ஒவ்வொரு 1.5 அடி இடைவெளியில் ஒரு பூவை நடுவதாகக் கூறுகின்றன. பத் ஏற்கனவே 17 பூக்களை வைத்திருக்கிறார். ஒவ்வொரு பூச்செடியும் கடைகளில் ₹6 விலைக்கு உள்ளது. தனது பூந்தோட்டத்தை நிரப்ப பத் கடைகளில் எவ்வளவு பணம் செலவிடுவார்?"
