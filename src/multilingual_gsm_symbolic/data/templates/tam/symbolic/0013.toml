question = "மேரி ஒரு ஆர்வமுள்ள தோட்டக்காரர். நேற்று, அவள் அவள் விருப்பமான தாவர வளர்ப்பிடத்திலிருந்து 18 புதிய பானை செடிகளைப் பெற்றாள். அவள் ஏற்கனவே அவளது பெரிய கிராமப்புற வீட்டின் 40 சாளரத் தட்டுகளில் ஒவ்வொன்றிலும் 2 பானை செடிகளைக் கொண்டுள்ளாள். தாராள மனப்பான்மையுடன், நாளை நண்பர்கள் மற்றும் குடும்பத்தினருக்கு ஒவ்வொரு தட்டிலிருந்தும் 1 பானை செடிகளை வழங்க முடிவு செய்தாள். மேரி எத்தனை பானை செடிகளை வைத்திருப்பாள்?"
answer = "நேற்று, செடிகளைப் பெறுவதற்கு முன்பு, மேரி 2*40 = <<2*40=80>>80 பானை செடிகளைக் கொண்டிருந்தாள்\nகூடுதலாக 18 செடிகளைப் பெற்ற பிறகு, எனவே அவள் மொத்தம் 80 + 18 = <<80+18=98>>98 பானை செடிகளைக் கொண்டிருந்தாள்\nநாளை, மேரி வழங்கும் செடிகள் 40*1 = <<40*1=40>>40 பானை செடிகள் இருக்கும்.\nஎனவே அவள் 98 - 40 = <<98-40=58>>58 பானை செடிகளை வைத்திருப்பாள்.\n#### 58"
