question_annotated = "அதன் ஊட்டச்சத்துத் தகவலின்படி, ஒரு {food,சிப்ஸ்} பை ஒரு பரிமாற்றத்திற்கு {cal,250} கலோரிகள் உள்ளன. ஒரு {size,300} {unit,கிராம்} பையில் {n,5} பரிமாற்றங்கள் உள்ளன என்றால், உங்கள் தினசரி கலோரி இலக்கு {total,2000} என்றும், நீங்கள் ஏற்கனவே {spent,1800} கலோரிகளை உட்கொண்டிருந்தால், நீங்கள் எத்தனை {unit,கிராம்} உண்ண முடியும்?\n\n#init:\n- food = sample([\"பாப்ப்கார்ன்\", \"ரொட்டி\",  \"குக்கீகள்\"])\n- unit = sample([\"கிராம்கள்\", \"அவுன்சுகள்\", \"oz\"])\n- $cal = range(150, 500, 25)\n- $size = range(100, 400, 25)\n- $n = range(4, 8)\n- $total = range(1900, 2500, 5)\n- $spent = range(600, 1900, 25)\n\n#conditions:\n- spent < total\n- is_int( 5 * (total - spent) / cal)\n- divides(size, n)\n- divides(size//n, (total-spent)/cal)\n\n#answer: size//n * Fraction((total-spent)/cal)\n"
