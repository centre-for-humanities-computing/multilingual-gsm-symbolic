question = "அதன் ஊட்டச்சத்துத் தகவலின்படி, ஒரு சிப்ஸ் பை ஒரு பரிமாற்றத்திற்கு 250 கலோரிகள் உள்ளன. ஒரு 300 கிராம் பையில் 5 பரிமாற்றங்கள் உள்ளன என்றால், உங்கள் தினசரி கலோரி இலக்கு 2000 என்றும், நீங்கள் ஏற்கனவே 1800 கலோரிகளை உட்கொண்டிருந்தால், நீங்கள் எத்தனை கிராம் உண்ண முடியும்?"
answer = "மொத்த கலோரி இலக்கு 2000 என்றும், நான் 1800 கலோரிகளை உட்கொண்டிருந்தால், எனக்கு 2000-1800 = <<2000-1800=200>>200 கலோரிகள் உண்ண மீதமுள்ளன\nஒவ்வொரு சிப்ஸ் பரிமாற்றத்திற்கும் 250 கலோரிகள் உள்ளன என்றும், எனக்கு 200 கலோரிகள் மட்டுமே உண்ண மீதமுள்ளன என்றால், நான் ஒரு பரிமாற்றத்தில் 200/250 மட்டுமே உண்ண முடியும் = 4/5 பரிமாற்றம்\nஒரு 300 கிராம் சிப்ஸ் பையில் 5 பரிமாற்றங்கள் உள்ளன என்பதும் நமக்குத் தெரியும், எனவே ஒவ்வொரு பரிமாற்றத்திற்கும் 300 கிராம்/5 = <<300/5=60>>60 கிராம்கள் உள்ளன\nநான் ஒரு பரிமாற்றத்தில் 4/5 மட்டுமே உண்ண முடியும் என்றால், எனக்கு 60 கிராம் * 4/5 = 48 கிராம்கள் மட்டுமே உண்ண முடியும்\n#### 48\n"
