question = "ஆர்ட்டி ஒரு மலர் விற்பனைக்கூடத்தை விவசாயிகள் சந்தையில் வைத்துள்ளார். அவர் மூன்று வகையான மலர்களை விற்கிறார்: மார்ரி கோல்ட்ஸ், பெடூனியாஸ் மற்றும் பெகோனியாஸ். அவர் பொதுவாக மார்ரி கோல்ட்ஸ்க்கு ஒரு தொட்டிக்கு $2.74 விலை நிர்ணயிக்கிறார், பெடூனியாஸ்க்கு ஒரு தொட்டிக்கு $1.87 மற்றும் பெகோனியாஸ்க்கு ஒரு தொட்டிக்கு $2.12. ஆர்ட்டிக்கு இன்று மாற்றத்தொகை இல்லை, எனவே அவர் தனது அனைத்து விலைகளையும் அருகிலுள்ள டாலருக்கு சீரமைக்க முடிவு செய்துள்ளார். ஒருவேளை ஆர்ட்டி 12 தொட்டிகள் மார்ரி கோல்ட்ஸ், 9 தொட்டிகள் பெடூனியாஸ் மற்றும் 17 தொட்டிகள் பெகோனியாஸ் விற்குமெனில், அவர் எவ்வளவு சம்பாதிப்பார்?"
answer = "ஆர்ட்டி தனது மார்ரி கோல்ட்ஸ் விலையை $2.74 இலிருந்து $3 ஆக மேலே சீரமைப்பார், 2 க்கு பிறகு வரும் எண் 5 அல்லது அதற்கு மேல் இருப்பதால்.\nஆர்ட்டி தனது பெடூனியாஸ் விலையை up $1.87 இலிருந்து $2 ஆக சீரமைப்பார், 1 க்கு பிறகு வரும் எண் 5 or higher இருப்பதால்.\nஆர்ட்டி தனது பெகோனியாஸ் விலையை down $2.12 இலிருந்து $2 ஆக சீரமைப்பார், 2 க்கு பிறகு வரும் எண் less than 5 இருப்பதால்.\nஆர்ட்டி 12 மார்ரி கோல்ட்ஸ்*$3 விற்கிறார் = $<<12*3=36>>36\nஆர்ட்டி 9 பெடூனியாஸ்*$2 விற்கிறார் = $<<9*2=18>>18\nஆர்ட்டி 17 பெகோனியாஸ்*$2 விற்கிறார் = $<<17*2=34>>34\nமொத்தமாக, ஆர்ட்டி $36 + $18 + $34 சம்பாதிப்பார் = $<<36+18+34=88>>88\n#### 88\n"
