question = "பாட்டி ஒவ்வொரு நாளும் அவரது விருப்பமான நடக்கும் பாதையில் 3 மைல் நடக்கிறாள், இதில் 2 மைல் கடற்கரையில் நடத்தல் அடங்கும் மற்றும் 1 மைல் பாதையில் நடத்தல் அடங்கும். பாதையில், பாட்டி கடற்கரையில் நடக்கும் வேகத்தை விட இரண்டு மடங்கு வேகத்தில் நடக்கிறாள். கடற்கரையில் செலவிடும் அவரது நடப்பில் 40 நிமிடங்கள் என்றால், முழு 3-மைல் நடப்பையும் முடிக்க எத்தனை நிமிடங்கள் ஆகும்?"
answer = "கடற்கரையில், பாட்டி 2 மைல்க்கு 40 நிமிடங்களுக்கு நடக்கும் வேகத்தில் உள்ளாள், அல்லது 2/40 = 1/20 மைல்க்கு ஒரு நிமிடம்.\nபாதையில், அவள் கடற்கரையில் இருக்கும்போது போல இரண்டு மடங்கு வேகத்தில் நடக்கிறாள், அல்லது 5*1/20 = 0.25 மைல்க்கு ஒரு நிமிடம்.\nபாதையில் 1 மைல் நடக்க, அவளுக்கு 1/0.25 = <<1/0.25=4>>4 நிமிடங்கள் ஆகும்.\nஎனவே, மொத்தமாக, பாட்டி அவரது விருப்பமான பாதையை நடக்க 40+4 = <<40+4=44>>44 நிமிடங்கள் ஆகும்.\n#### 44\n"
