question = "ஒரு விவசாயி தனது குதிரைகள்-க்கு உணவு வாங்குகிறார். அவர் பல்வேறு புல், ஓட்ஸ், கேரட் மற்றும் சர்க்கரை கனிகள்-ஐ வாங்குகிறார். சர்க்கரை கனிகள் ஒரு அரிதான சுவையாக இருப்பதால், அவர் முழு தொட்டிலுக்கும் இரண்டு 1-பவுண்ட் பெட்டிகளை மட்டுமே வாங்குகிறார். பச்சைக் காய்கறிகள் புதியதாக இருக்கும் வரை குதிரைகள்-க்கு போதுமான கேரட்-ஐ மட்டுமே விரும்புகிறார், எனவே அவர் நான்கு 12-பவுண்ட் பைகளை வாங்குகிறார். புல் அவரது குதிரைகள்-க்கான முதன்மை உணவாகும், எனவே அவர் நாற்பத்து இரண்டு 75-பவுண்ட் பொட்டலங்களை வாங்குகிறார். ஓட்ஸ் புல்-ஐ நிரப்ப ஒரு அடிப்படை உணவாகும், எனவே அவர் இருபது 65-பவுண்ட் பைகளை வாங்குகிறார். அவரது விவசாய டிரக் ஒரு நேரத்தில் 2250 பவுண்ட்-களை ஏற்ற முடிந்தால், அனைத்து உணவையும் கொண்டு செல்ல விவசாயிக்கு எத்தனை பயணங்கள் தேவை?"
answer = "விவசாயி 2*1 = <<2*1=2>>2 பவுண்ட்-கள் சர்க்கரை கனிகள்-ஐ வாங்குகிறார்.\nஅவர் 4*12 = <<4*12=48>>48 பவுண்ட்-கள் கேரட்-ஐ வாங்குகிறார்.\nஅவர் 20*65 = <<20*65=1300>>1300 பவுண்ட்-கள் ஓட்ஸ்-ஐ வாங்குகிறார்.\nஅவர் 42*75 = <<42*75=3150>>3150 பவுண்ட்-கள் புல்-ஐ வாங்குகிறார்.\nஅனைத்து உணவின் எடை 2 + 48 + 1300 + 3150 = <<2+48+1300+3150=4500>>4500 பவுண்ட்-கள்.\nஎனவே, அனைத்து உணவையும் தனது விவசாய டிரக்கில் கொண்டு செல்ல விவசாயிக்கு 4500 / 2250 = <<4500/2250=2>>2 பயணங்கள் தேவை.\n#### 2\n"
