question = "விருந்து தொடக்கத்தில், 25 ஆண்கள் மற்றும் 15 பெண்கள் இருந்தனர். ஒரு மணிநேரம் கழிந்த பிறகு, மொத்தம் இருந்தவர்களில் 1/4 பங்கு சென்றுவிட்டனர். 22 ஆண்கள் விருந்து இல் தங்கியிருந்தால், பெண்கள் எத்தனை பேர் மீதமுள்ளனர்?"
answer = "மொத்தம் 25 ஆண்கள் + 15 பெண்கள் = <<25+15=40>>40 பேர் விருந்து க்கு வந்தனர்.\nஒரு மணிநேரம் கழிந்த பிறகு, 40 பேரில் 1/4 பங்கு = <<40*1/4=10>>10 பேர் விருந்து இலிருந்து சென்றுவிட்டனர்.\nஇதன் மூலம் 40 பேர் - 10 பேர் = <<40-10=30>>30 பேர் மீதமுள்ளனர்.\nமீதமுள்ள 30 பேரில், 30 பேர் - 22 ஆண்கள் = <<30-22=8>>8 பெண்கள் ஆவார்கள்.\n#### 8\n"
