question = "பென்னி ஒரு 10-அடி சுறாவைக் கண்டார், அதில் 2 6-இன்ச் ரெமோரா மீன்கள் பிணைக்கப்பட்டுள்ளன. சுறாவின் உடல் நீளத்தில் ரெமோரா மீன்களின் சேர்ந்த நீளம் எத்தனை சதவீதம் ஆகும்?"
answer = "முதலில், ரெமோரா மீன்களின் சேர்ந்த நீளத்தை இன்ச்சில் கணக்கிடவும்: 6 இன்ச்/ரெமோரா * 2 ரெமோரா மீன்கள் = <<6*2=12>>12 இன்ச்.\nஅப்பிறகு, அந்த எண்ணை 12-ஆல் வகுத்து அடியாக மாற்றவும்: 12 இன்ச் / 12 இன்ச்/அடி = <<12/12=1>>1 அடி.\nஅப்பிறகு, அடிவாக்கிய ரெமோரா நீளத்தை சுறாவின் நீளத்தால் வகுத்து, விடையை சதவீதமாக வெளிப்படுத்த 100%-ஆல் பெருக்கவும்: 1 அடி / 10 அடி * 100% = 10%\n\n#### 10\n"
