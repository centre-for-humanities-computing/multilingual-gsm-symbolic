question = "ஆப்பிள் உயர்நிலைப் பள்ளி தங்கள் நுண்கலை மையம் இல் இந்த ஆண்டு பட்டமளிப்பு விழாவை நடத்துகிறது, இது 6000 மக்களுக்கு இடமளிக்கிறது. 950 பட்டதாரிகளுக்கான இருக்கைகள் மற்றும் 300 பங்கேற்கும் பேராசிரியர்களுக்கான இருக்கைகளைக் கணக்கில் எடுத்துக்கொண்ட பிறகு, டிக்கெட்டுகள் சமமாகப் பிரிக்கப்பட்டால், நண்பர்கள் மற்றும் குடும்பத்தினருக்கு வழங்க ஒவ்வொரு பட்டதாரியும் எவ்வளவு டிக்கெட்டுகளைப் பெறுவார்கள்?"
