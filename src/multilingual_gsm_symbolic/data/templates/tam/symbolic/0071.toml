question = "நேட் தனது கால்நடைகளுக்கு புல் கொடுத்துக்கொண்டிருக்கிறார். ஒவ்வொரு ஆடுக்கும் 5 பவுண்ட் தேவை, மற்றும் ஒவ்வொரு லாமாக்கும் 3 பவுண்ட் ஒவ்வொரு ஆடுக்கும் தேவையான அளவை இரட்டிப்பாக எடுத்து அதிலிருந்து குறைவு. 15 ஆடுகள் மற்றும் 12 லாமாகள் இருந்தால், நேட்க்கு எத்தனை பவுண்ட் புல் தேவை?"
