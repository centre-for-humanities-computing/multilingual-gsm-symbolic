question = "கேரால் மற்றும் ஜெனிஃபர் லாஸ் ஏஞ்சல்ஸ் நகரத்தைச் சேர்ந்த சகோதரிகள், பிரபலங்கள் கையொப்பங்களைச் சேகரிப்பதை விரும்புகிறார்கள். பள்ளியிலிருந்து கோடை விடுமுறை காலத்தில், சகோதரிகள் ஒவ்வொரு மதியமும் கையொப்பங்களைச் சேகரிக்கிறார்கள். ஐந்து வாரங்களுக்குப் பிறகு, கேரால் மற்றும் ஜெனிஃபர் தங்கள் கையொப்பப் புத்தகங்களை ஒப்பிட்டு, ஒவ்வொரு சகோதரி சேகரித்த கையொப்பங்களின் எண்ணிக்கையைக் கணக்கிடுகிறார்கள். கேரால் தனது புத்தகத்தில் 20 கையொப்பங்களைக் கொண்டுள்ளார், மற்றும் ஜெனிஃபர் 44 கையொப்பங்களைக் கொண்டுள்ளார். சகோதரிகளுக்கு மூன்று வார கோடை விடுமுறை உள்ளது, மற்றும் விடுமுறை முடியும் போது தங்கள் கையொப்பங்கள் 100 ஆகும்படி செய்ய விரும்புகிறார்கள். தங்கள் இலக்கை அடைய சகோதரிகள் எத்தனை கையொப்பங்களைச் சேகரிக்க வேண்டும்?"
answer = "கேரால் மற்றும் ஜெனிஃபர் ஏற்கனவே 20 + 44 கையொப்பங்களைச் சேகரித்துள்ளனர் = <<20+44=64>>64 கையொப்பங்கள்.\nஅவர்களின் இலக்கு 100 என்பதால், அவர்கள் 100 - 64 கையொப்பங்களைச் சேகரிக்க வேண்டும். 100 - 64 = <<100-64=36>>36 கையொப்பங்கள்\n#### 36\n"
