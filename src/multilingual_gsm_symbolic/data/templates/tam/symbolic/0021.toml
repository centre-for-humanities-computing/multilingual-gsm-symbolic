question = "Frankie தினமும் வீட்டுப்பாடம் முடித்த பிறகு டிவி பார்ப்பார். திங்கள் மற்றும் செவ்வாய் அன்று, அவர் தனது விருப்பமான நிகழ்ச்சியின் ஒரு 1-மணி அத்தியாயத்தை ஒவ்வொரு இரவிலும் பார்த்தார். புதன் அன்று, அவர் ஒரு 30-நிமிட நிகழ்ச்சியின் சில அத்தியாயங்களைப் பார்த்தார். வியாழன் அன்று, அவர் வீட்டுப்பாடத்தை முன்கூட்டியே முடித்து ஒரு 1-மணி அத்தியாயம் மற்றும் ஒரு 30-நிமிட நிகழ்ச்சியைப் பார்த்தார். வெள்ளி அன்று, அவர் தாமதமாக எழுந்திருக்க முடிந்ததால், இரண்டு 1-மணி அத்தியாயங்களைப் பார்த்தார். மொத்தமாக அவர் 7 மணிநேரம் டிவி பார்த்தால், புதன் அன்று அவர் எத்தனை 30-நிமிட அத்தியாயங்களைப் பார்த்தார்?"
