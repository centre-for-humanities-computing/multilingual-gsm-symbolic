question = "மார்தா தனது 3 பேரக்குழந்தைகளுக்கு குளிர்கால உடைகளை நெய்து கொண்டிருக்கிறார். அவர்கள் மும்மடிக்கள், எனவே அவர்கள் அனைவரும் ஒரே அளவுள்ளவர்கள். அவள் ஒவ்வொருவருக்கும் ஒரு தொப்பி, சால்வை, சுவெட்டர், மென் கையுறைகள், மற்றும் காலுறைகள் செய்ய விரும்புகிறாள். ஒரு தொப்பி செய்ய 2 கம்பளி நூல் கற்றைகள் தேவை, ஒரு சால்வைக்கு 4, ஒரு சுவெட்டர்க்கு 12, ஒரு ஜோடி மென் கையுறைகள்க்கு 1, மற்றும் ஒரு ஜோடி காலுறைகள்க்கு 2. அவள் வாங்க வேண்டிய கம்பளி நூல் கற்றைகளின் எண்ணிக்கை என்ன?"
answer = "ஒவ்வொரு குழந்தைக்கும் ஒரு முழு உடைக்கு தேவைப்படும் 2 கற்றைகள் தொப்பி ஒன்றுக்கு + 4 கற்றைகள் சால்வை ஒன்றுக்கு + 12 கற்றைகள் சுவெட்டர் ஒன்றுக்கு + 1 கற்றைகள் மென் கையுறைகள் ஒரு ஜோடிக்கு + 2 கற்றைகள் காலுறைகள் ஒரு ஜோடிக்கு = <<2+4+12+1+2=21>>21 கம்பளி நூல் கற்றைகள்.\nஎனவே, தனது அனைத்து பேரக்குழந்தைகளுக்கும் உடை நெய்ய, அவளுக்கு தேவைப்படும் 3*21 = <<3*21=63>>63 கம்பளி நூல் கற்றைகள்.\n#### 63\n"
