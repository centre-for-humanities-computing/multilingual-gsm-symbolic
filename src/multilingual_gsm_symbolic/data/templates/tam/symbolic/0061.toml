question = "பிரெண்டன் 10 மணிகள் கொண்ட ஒரு பையைக் கொண்டுள்ளார். அதைக் கொண்டு செல்லும் போது ஒரு கல் மீது தடுமாறினார் மற்றும் அவற்றில் அரை பங்கை இழந்தார். அவற்றைத் தேட ஓடினார் ஆனால் 3 மட்டுமே கிடைத்தன. வீட்டிற்குத் திரும்பியபோது, அவர் மணிகள் பற்றி மேலும் ஆய்வு செய்தார். அவர் எடுத்தவற்றில் இரண்டு மணிகள் இல்லை, மாறாக உண்மையில் மணிகள் எனவே அவற்றை நீக்கினார். இறுதியில் பிரெண்டன் எத்தனை மணிகள் வைத்திருந்தார்?"
answer = "பிரெண்டன் தனது மணிகள் களை இழந்து 10*1/2=<<10*1/2=5>>5 மணிகள் களை மட்டும் வைத்திருந்தார்.\nஅவர் தேடித் தனது இழந்த மணிகள் சிலவற்றைக் கண்டு, 5+3=<<5+3=8>>8 மணிகள் களாக மாறினார்.\nஅவர் வீட்டிற்குச் சென்று இரண்டு மணிகள் களை நீக்கினார், இது அவரை 8-2=<<8-2=6>>6 மணிகள் களாக விட்டுச் சென்றது.\n#### 6\n"
