question = "தற்போது 3 சிவப்பு பந்துகள், 11 நீலம் பந்துகள் மற்றும் 25 பச்சை பந்துகள் கடை இல் உள்ளன. சிவப்பு பந்துகளின் விலை ₹9, நீலம் பந்துகளின் விலை ₹5 மற்றும் பச்சை பந்துகளின் விலை ₹3. அனைத்து பந்துகளும் விற்கப்பட்ட பிறகு கடை எவ்வளவு பெறும்?"
