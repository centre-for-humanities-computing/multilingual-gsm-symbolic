question = "சாம் மற்றும் ஹாரி ஆகியோருக்கு இடையில் 100 அடி வேலி இருந்தால், அதைப் பகிர்ந்து கொள்ள ஹாரி சாம் ஐ விட 60 அடி அதிகம் பெறுவதாக ஒப்பந்தம் செய்தால், சாம் க்கு எவ்வளவு மீதம் இருக்கும்?"
