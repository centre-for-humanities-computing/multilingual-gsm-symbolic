question = "தானா நடக்க முடிவதை விட நான்கு மடங்கு வேகத்தில் ஓட முடியும், ஆனால் அவள் ஓடும் வேகத்தில் அரை வேகத்தில் தாவிச் செல்ல முடியும். அவள் தாவிச் செல்லும் வேகம் 3 மைல் ஒரு மணிநேரத்திற்கு என்றால், ஆறு மணிநேரத்தில் அவள் எத்தனை மைல் பயணிக்க முடியும் என்றால், அவள் மூன்றில் ஒரு பங்கு நேரம் ஓடுவதற்கும் மூன்றில் இரண்டு பங்கு நேரம் நடப்பதற்கும் செலவிட்டால்?"
answer = "ஒருவேளை தானா ஓடும் வேகத்தில் அரை வேகத்தில் தாவிச் சென்றால், அப்படியென்றால் அவள் 3*2=<<3*2=6>>6 மைல் ஒரு மணிநேரத்திற்கு ஓட முடியும்.\nமற்றும் அவள் நடக்கும் வேகத்தை விட நான்கு மடங்கு வேகத்தில் ஓட முடிவதால், இதன் பொருள் அவள் 6/5=1.2 மைல் ஒரு மணிநேரத்திற்கு நடக்க முடியும்.\nநடப்பதற்கு மூன்றில் இரண்டு பங்கு நேரம் செலவிடப்பட்டால், அப்படியென்றால் அவள் 6*2/3=<<6*2/3=4>>4 மணிநேரம் நடக்கிறாள்.\nஓடுவதற்கு மூன்றில் ஒரு பங்கு நேரம் செலவிடப்பட்டால், அப்படியென்றால் அவள் 6-4=<<6-4=2>>2 மணிநேரம் ஓடுகிறாள்.\nஎனவே, அவள் 2 மணிநேரம் 6 மைல் ஒரு மணிநேரத்திற்கு வேகத்தில் ஓடுகிறாள், அல்லது 2*6=<<2*6=12>>12 மைல்.\nஅவள் 4 மணிநேரம் 1.2 மைல் ஒரு மணிநேரத்திற்கு வேகத்தில் நடக்கிறாள், அல்லது 4*1.2=<<4*1.2=24/5>>24/5 மைல்.\nஎனவே, மொத்தத்தில், அவள் 12+24/5=<<12+24/5=16>>16 மைல் பயணம் செய்கிறாள்.\n#### 16\n"
