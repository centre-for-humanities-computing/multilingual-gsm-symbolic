question = "அலிசன் ஓட்டம் அணிக்கு இடம் பெற்றார், எனவே அவர் விளையாட்டு உபகரணங்களுக்காக வாங்கலுக்குச் சென்றார். அவர் டேங்க் டாப் ஒன்றை ₹10 விலைக்கு வாங்கினார், ஓட்டம் ஷார்ட்ஸ் ஒன்றை டேங்க் டாப் விலையை விட ₹5 அதிகமாகவும், டென்னிஸ் காலணி ஒன்றை அசல் ₹48 ஆனால் அரை விலையில் விற்பனையில் இருந்தன. அவருக்கு ₹8 விளையாட்டு காலுறை தொகுப்பில் ₹2 தள்ளுபடி கூப்பன் இருந்தது, அவர் அதையும் வாங்கினார். விளையாட்டு உபகரணங்களில் அவர் எவ்வளவு செலவு செய்தார்?"
answer = "ஷார்ட்ஸ், டேங்க் டாப் ஐ விட ₹5 அதிகம், எனவே அவற்றின் விலை ₹5 + ₹10 = ₹<<5+10=15>>15.\nஅவரது டென்னிஸ் காலணி, அசல் ₹48 விலையில் அரை ஆகும், எனவே அவற்றின் விலை ₹48*1/2=₹24.\nஅவரது கூப்பனுடன், காலுறை, ₹8 - ₹2 = ₹<<8-2=6>>6.\nடேங்க் டாப், ஷார்ட்ஸ், டென்னிஸ் காலணி, மற்றும் காலுறை சேர்ந்த விலை ₹10 + ₹15 + ₹24 + ₹6 = ₹<<10+15+24+6=55>>55.\n#### 55\n"
