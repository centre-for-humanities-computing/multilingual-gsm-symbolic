question = "ஒரு கட்டுமானத் தொழிலாளி ஒவ்வொரு மாதமும் 4 வாரங்கள் மற்றும் ஒவ்வொரு வாரமும் 6 நாட்கள் வேலை செய்கிறார். ஒரு நாளைக்கு அவருக்கு ₹50 கிடைத்தால், ஒரு ஆண்டு வேலை செய்தால் அவர் எவ்வளவு சம்பாதிக்கிறார்?"
answer = "கட்டுமானத் தொழிலாளி ஒவ்வொரு வாரமும் 6 நாட்கள் மற்றும் ஒவ்வொரு மாதமும் 4 வாரங்கள் வேலை செய்கிறார், எனவே அவர் 6 நாட்கள்/வாரம் * 4 வாரங்கள்/மாதம் = <<6*4=24>>24 நாட்கள்/மாதம் வேலை செய்கிறார்\nஒரு நாளைக்கு அவர் ₹50 சம்பாதித்தால், பின்னர் அவர் ₹50/நாள் * 24 நாட்கள்/மாதம் = ₹<<50*24=1200>>1200/மாதம் சம்பாதிக்கிறார்\nஒரு ஆண்டு என்பது 12 மாதங்களுக்குச் சமம், எனவே ஒவ்வொரு ஆண்டும் அவர் ₹1200/மாதம் * 12 மாதங்கள்/ஆண்டு = ₹<<1200*12=14400>>14,400 சம்பாதிக்கிறார்\n#### 14400\n"
