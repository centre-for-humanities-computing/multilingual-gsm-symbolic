question = "ஒரு கோமன் ஒரு நாளைக்கு 12 பவுண்ட் தாதுவை அவரது வெறும் கைகள் கொண்டு தோண்ட முடியும். ஒரு பித்தளை பிக்குகை உடன் அவர் இரண்டு மடங்கு அதிகம் தோண்ட முடியும், மேலும் ஒரு பித்தளை பிக்குகை உடன் இருப்பதை விட எஃகு பிக்குகை உடன் 50% அதிகம் தோண்ட முடியும். 40 கோமன்கள் எஃகு பிக்குகைகள் கொண்டு 30 நாட்கள் கொண்ட ஒரு மாதத்தில் எத்தனை பவுண்ட் தாதுவை தோண்ட முடியும்?"
