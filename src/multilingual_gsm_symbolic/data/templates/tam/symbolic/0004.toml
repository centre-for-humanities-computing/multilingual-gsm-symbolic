question = "காரெட் ஒரு சிற்றுண்டிக்காக பார்க்கோன் வெடிக்கிறார். பாத்திரம் விதைகள் சூடாகும் போது, விதைகள் வேகமாக வெடிக்கத் தொடங்குகின்றன. 20 முதல் 30 சமையல் வினாடிகளில் வெடிக்கின்றன, அடுத்து மூன்று மடங்கு அளவு அடுத்த 30 வினாடிகளில். விதைகள் அடுத்த 30 வினாடிகளில் ஆரம்ப வெடிப்பு விகிதத்தில் நான்கு மடங்கு அதிகரிக்கின்றன, ஆனால் இறுதி 30 வினாடிகளில், வெடிப்பு வேகம் கடந்த 30 வினாடிகளில் உள்ள விகிதத்தில் பாதியாக குறைகிறது. காரெட் பாத்திரம் சூட்டிலிருந்து அகற்றிய பிறகு, இறுதி 30 சமையல் வினாடிகளில் வெடித்த விதைகளின் எண்ணிக்கையில் கால் பங்கும் மீதமுள்ள வெப்பத்திலிருந்து வெடிக்கின்றன. காரெட் உண்ண வேண்டிய பார்க்கோன் துண்டுகள் எத்தனை?"
