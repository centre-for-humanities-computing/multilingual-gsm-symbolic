question = "சன்னி இஞ்சி கேக் மற்றும் ஆப்பிள் பை நிதி திரட்டலுக்காக விற்பனை செய்கிறார். சனிக்கிழமை அன்று, அவர் 10 பெட்டிகள் இஞ்சி கேக் மற்றும் ஞாயிற்றுக்கிழமை அன்று விட 4 குறைவான பெட்டிகள் ஆப்பிள் பை விற்பனை செய்தார். ஞாயிற்றுக்கிழமை அன்று, அவர் சனிக்கிழமை அன்று விட 5 அதிகமான பெட்டிகள் இஞ்சி கேக் மற்றும் 15 பெட்டிகள் ஆப்பிள் பை விற்பனை செய்தார். இஞ்சி கேக் விலை ₹6 மற்றும் ஆப்பிள் பை விலை ₹15 எனில், இரண்டு நாட்களில் சன்னி எவ்வளவு ஈட்டினார்?"
answer = "ஞாயிற்றுக்கிழமை அன்று இஞ்சி கேக் இன் 10 + 5 = <<10+5=15>>15 பெட்டிகளை அவர் விற்பனை செய்தார்.\nசன்னி விற்பனை செய்த இஞ்சி கேக் இன் மொத்த பெட்டிகளின் எண்ணிக்கை 10 + 15 = <<10+15=25>>25 ஆகும்.\nஇஞ்சி கேக் விற்பனைக்கு சன்னி 25*₹6 = ₹<<25*6=150>>150 ஈட்டினார்.\nசனிக்கிழமை அன்று ஆப்பிள் பை இன் 15 - 4 = <<15-4=11>>11 பெட்டிகளை அவர் விற்பனை செய்தார்.\nசன்னி விற்பனை செய்த ஆப்பிள் பை இன் மொத்த பெட்டிகளின் எண்ணிக்கை 15 + 11 = <<15+11=26>>26 ஆகும்.\nஆப்பிள் பை விற்பனைக்கு அவர் 26*₹15 = ₹<<26*15=390>>390 ஈட்டினார்.\nஎனவே, சன்னி இரண்டு நாட்களில் ₹150 + ₹390 = ₹<<150+390=540>>540 ஈட்டினார்.\n#### 540\n"
