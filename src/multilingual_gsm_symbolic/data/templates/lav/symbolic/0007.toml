question = "Saimnieks pērk barību saviem zirgi. Viņš pērk dažādu siens, auzas, burkāni un cukura gabaliņi. Tā kā cukura gabaliņi ir rets gardums, viņš pērk tikai divi 1-funts kastes no tiem visai stallim. Viņš vēlas pietiekami daudz burkāni, lai barotu zirgi, kamēr dārzeņi ir svaigi, tāpēc viņš pērk četri 12-funts maisus. Siens ir galvenā zirgi uztura sastāvdaļa, tāpēc viņš pērk četrdesmit divi 75-funts pakas. Auzas ir pamata papildinājums siens, tāpēc viņš pērk divdesmit 65-funts maisus. Ja viņa lauku kravas auto var nest 2250 funtss vienā reizē, cik reizes saimniekam jāveic, lai pārvadātu visu barību?"
