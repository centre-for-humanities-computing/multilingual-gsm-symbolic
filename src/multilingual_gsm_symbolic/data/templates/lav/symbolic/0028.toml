question = "Viena slimnīca ir ar kapacitāti 1000 gultau ar 1/5 aizņemtiem. Sakarā ar koronvīrusa uzliesmojums dēļ, 50 pacienti tiek uzņemti slimnīcaā katru dienu. Aprēķiniet kopējo neaizņemto gultau skaitu slimnīcaā pēc 2 nedēļām."
