question = "Sunny pārdod piparkūka un ābols pīrāgu labdarības ziedojumu vākšanai. Sestdiena, viņš pārdod 10 kastes piparkūka un 4 mazāk kastes ābols pīrāga, nekā svētdiena. Svētdiena, viņš pārdod 5 vairāk kastes piparkūka nekā sestdiena un 15 kastes ābols pīrāga. Ja piparkūka izmaksā $6 un ābols pīrāgs izmaksā $15, cik daudz Sunny nopelnīja divu dienu laikā?"
