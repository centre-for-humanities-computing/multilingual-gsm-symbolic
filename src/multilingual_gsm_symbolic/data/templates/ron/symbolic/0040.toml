question = "Sally s-a dus la mare pentru vacanță. Părinții ei i-au dat $15 să cumpere orice dorea. La magazinul de suveniruri, caramel era la reducere cu \"Cumpără 1 livră la $3 per livră, primești 1 livră cu 1/2 reducere.\" A luat 4 livre. A cumpărat și un sac mixt de scoici pentru $1.5 și 4 magneți care erau $0.25 fiecare. Câți bani mai are Sally?"
answer = "Sally cumpără 1 livră pentru $3 și primește 1 livră cu 1/2 reducere. Deci 1/2 reducere din 1 livră este $3*1/2 = $1.5. Restul de 2 livre nu are reducere și costă 2*$3 = $6, deci totalul este $3+$3/2+$6=$21/2\n4 magneți la $0.25 fiecare este 4*0.25=$<<4*0.25=1>>1\nCând aduni toate achizițiile ei, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nAvea $15 și a cheltuit $13 deci avea $15-$13 = $<<15-13=2>>2 rămași\n#### 2\n"
