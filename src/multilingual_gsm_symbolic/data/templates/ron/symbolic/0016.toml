question = "Sunny vinde prăjituri de ghimbir și tartă de măr pentru o colectă de fonduri. În Sâmbătă, a vândut 10 cutii de prăjituri de ghimbir și 4 cutii mai puține de tartă de măr, decât în Duminică. În Duminică, a vândut 5 cutii în plus de prăjituri de ghimbir decât în Sâmbătă și 15 cutii de tartă de măr. Dacă prăjituri de ghimbir costă $6 și tarta de măr costă $15, câți bani a câștigat Sunny în două zile?"
