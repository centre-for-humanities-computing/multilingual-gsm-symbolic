answer = "Dacă ținta totală de calorii este 2000 și am consumat 1800 calorii, atunci am 2000-1800 = <<2000-1800=200>>200 calorii rămase de mâncat\nDacă fiecare porție de cartofi prăjiți are 250 calorii și am doar 200 calorii rămase de mâncat, atunci pot mânca doar 200/250 dintr-o porție = 4/5 dintr-o porție\nȘtim și că un pachet de 300 gram de cartofi prăjiți are 5 porții, deci fiecare porție are 300 gram/5 = <<300/5=60>>60 gram\nDacă pot mânca doar 4/5 dintr-o porție, atunci pot mânca doar 60 gram * 4/5 = 48 gram\n#### 48\n"
