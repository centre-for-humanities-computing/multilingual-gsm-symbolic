question = "ئالما ئوتتۇرا مەكتىپى بۇ يىل سەنئەت مەركىزى دا مەكتەپنى پۈتتۈرۈش مۇراسىمىنى ئۆتكۈزىدۇ، بۇ يەرنىڭ سىغىمى 6000 كىشى. تەتۈرلۈك قىلغۇچىلار ئۈچۈن 950 ئورۇن ۋە قاتناشقان ئوقۇتقۇچىلار ئۈچۈن 300 ئورۇننى ھېسابقا ئالغاندىن كېيىن، ئەگەر بېلەتلەر تەكشى بۆلۈنسە، ھەر بىر تەتۈرلۈك قىلغۇچى دوستى ۋە ئائىلىسىگە بېرىش ئۈچۈن قانچە بېلەت قوبۇل قىلىدۇ؟"
