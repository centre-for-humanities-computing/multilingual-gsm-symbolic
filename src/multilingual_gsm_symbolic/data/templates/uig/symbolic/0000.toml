question = "بېنى بىر 10-فۇت بەڭكەك نى كۆردى، ئۇنىڭغا 2 دانە 6-ئىنچ رېمورا يېپىشىپ تۇراتتى. بەڭكەك نىڭ جىسىم ئۇزۇنلۇقىنىڭ قانچە پىرسەنتى رېمورا ئۇزۇنلۇقلىرىنىڭ يىغىندىسىغا تەڭ؟"
answer = "ئاۋۋال، رېمورا ئۇزۇنلۇقلىرىنىڭ ئىنچ بىلەن ئومۇمىي ئۇزۇنلۇقىنى تېپىڭ: 6 ئىنچ/رېمورا * 2 رېمورا = <<6*2=12>>12 ئىنچ.\nئاندىن شۇ ساننى 12 گە بۆلۈپ فۇتقا ئايلاندۇرۇڭ: 12 ئىنچ / 12 ئىنچ/فۇت = <<12/12=1>>1 فۇت.\nئاندىن فۇتتىكى رېمورا ئومۇمىي ئۇزۇنلۇقىنى بەڭكەك نىڭ ئۇزۇنلۇقىغا بۆلۈپ، جاۋابنى پىرسەنت شەكلىدە ئىپادىلەش ئۈچۈن 100% گە كۆپەيتىڭ: 1 فۇت / 10 فۇت * 100% = 10%\n\n#### 10\n"
