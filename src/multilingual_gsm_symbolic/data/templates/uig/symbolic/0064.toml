question = "مارىنىڭ تائامخانادا 6 دانە چۈشەك قۇتۇسى بار. ھەر بىر چۈشەك قۇتۇسى 8 دانە كۇپكېكلارنى تەملىيەلەيدۇ. مارى ئۆزىنىڭ بارلىق چۈشەكلىرىنى ئىشلىتىپ بولۇش ئۈچۈن يېتەرلىك كۇپكېكلارنى پىشۇرۇشنى خالايدۇ. ئەگەر ھەر بىر تەخسىچە 12 دانە كۇپكېكلارنى سىغىدىغان بولسا، ئۇ قانچە تەخسىچەلىك كۇپكېكلارنى پىشۇرۇشى كېرەك؟"
