question = "گارېتت ياستۇق ئۈچۈن پوپكورن تەييارلاۋاتىدۇ. تاۋانى داغىلار قىزىغاندا، دانا-دانىلار تېزراق ئېتىلىشنى باشلىدى. پىشۇرۇشنىڭ تۇنجى 30 سېكۇنتىدا 20 دانە ئېتىلدى، ئاندىن كېيىنكى 30 سېكۇنتتا شۇ مىقدارنىڭ ئۈچ ھەسسىسى ئېتىلدى. دانا-دانىلارنىڭ دەسلەپكى ئېتىلىش نىسبىتى كېيىنكى 30 سېكۇنتتا تۆت ھەسسە ئاشىدۇ، ئەمما ئاخىرقى 30 سېكۇنتتا، ئېتىلىش ئۆتكەن 30 سېكۇنتتىكى نىسبىتنىڭ يېرىمىغا كېمىيىدۇ. گارېتت تاۋانى ئوتتىن ئالغاندىن كېيىن، پىشۇرۇشنىڭ ئاخىرقى 30 سېكۇنتىدا ئېتىلگەن دانا-دانىلارنىڭ تۆتىدىن بىرى قالدۇق ئىسسىقلىقتىنمۇ ئېتىلىدۇ. گارېتت قانچە پارچە پوپكورن يېيىشى كېرەك؟"
answer = "پىشۇرۇشنىڭ ئىككىنچى 30 سېكۇنتىدا، 3*20=<<3*20=60>>60 دانە ئېتىلىدۇ.\nئۈچىنچى 30 سېكۇنتتا، 4*20=<<4*20=80>>80 دانە ئېتىلىدۇ.\nئاخىرقى 30 سېكۇنتتا، 80 / 2 = <<80/2=40>>40 دانە ئېتىلىدۇ.\nپىشۇرۇش تۈگىگەندىن كېيىن، قالدۇق ئىسسىقلىق 40 / 4 = <<40/4=10>>10 دانىنى ئېتىلىدۇ.\nشۇڭا، گارېتت نىڭ يېيىدىغان پوپكورنى 20 + 60 + 80 + 40 + 10 = <<20+60+80+40+10=210>>210 پارچە بولىدۇ.\n#### 210\n"
