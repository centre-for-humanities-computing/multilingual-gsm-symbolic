question = "بەش بايراق دىكى ئەڭ چوڭ سۇ سىيرىغىچى 300 فۇت ئۇزۇنلۇقتا، ۋە كىشىلەر 60 فۇت/مىنۇت سۈرئىتىدە سىيرىلىپ چۈشىدۇ. ئىككىنچى چوڭ سۇ سىيرىغىچى 240 فۇت ئۇزۇنلۇقتا، ئەمما تېخىمۇ تىك، شۇڭا كىشىلەر 80 فۇت/مىنۇت سۈرئىتىدە سىيرىلىپ چۈشىدۇ. ئەڭ چوڭ سىيرىغىچىغا چىقىش ئىككىنچى چوڭ سىيرىغىچىغا قارىغاندا قانچىلىك ئۇزۇن ۋاقىت تەلەپ قىلىدۇ؟"
