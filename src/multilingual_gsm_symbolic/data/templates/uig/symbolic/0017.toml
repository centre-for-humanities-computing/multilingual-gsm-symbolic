question = "بۈبۈ ھەر كۈنى ئەڭ ياقتۇرىدىغان ماڭىش يولىدا 3 مىل ماڭىدۇ، بۇنىڭ ئىچىدە 2 مىل قۇمۇلدا ماڭىش ۋە 1 مىل(s) يول يۈزىدە ماڭىش بار. يول يۈزىدە، بۈبۈ قۇمۇلدا ماڭغاندىكى سۈرئىتىنىڭ ئىككى ھەسسە ھەسسىسىدە ماڭىدۇ. ئەگەر ئۇنىڭ ماڭىشىنىڭ 40 مىنۇتى قۇمۇلدا ئۆتكەن بولسا، ئۇنىڭ پۈتۈن 3-مىل ماڭىشىنى تۈگىتىشىگە قانچىلىك ۋاقىت كېتىدۇ، مىنۇت بىلەن؟"
answer = "قۇمۇلدا، بۈبۈ نىڭ سۈرئىتى 2 مىل نى 40 مىنۇتتا، يەنى 2/40 = 1/20 مىل ھەر مىنۇتتا.\nيول يۈزىدە، ئۇ قۇمۇلدىكىدەك ئىككى ھەسسە سۈرئەتتە ماڭىدۇ، يەنى 5*1/20 = 0.25 مىل ھەر مىنۇتتا.\nيول يۈزىدە 1 مىل(s) ماڭىش ئۈچۈن، ئۇنىڭغا 1/0.25 = <<1/0.25=4>>4 مىنۇت كېتىدۇ.\nشۇڭا، جەمئىي، بۈبۈ نىڭ ئەڭ ياقتۇرىدىغان يولىنى ماڭىشىغا 40+4 = <<40+4=44>>44 مىنۇت كېتىدۇ.\n#### 44\n"
