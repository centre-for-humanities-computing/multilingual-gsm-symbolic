question = "ساني زەنجىۋىل كۆكۈچى ۋە ئالما پىيەسىنى ياردەم پائالىيىتى ئۈچۈن سېتىۋاتىدۇ. شەنبە كۈنى، ئۇ 10 قۇتا زەنجىۋىل كۆكۈچى ۋە يەكشەنبە كۈنىگە قارىغاندا 4 قۇتا ئاز ئالما پىيەسى سېتىۋەتكەن. يەكشەنبە كۈنى، ئۇ شەنبە كۈنىگە قارىغاندا 5 قۇتا كۆپ زەنجىۋىل كۆكۈچى ۋە 15 قۇتا ئالما پىيەسى سېتىۋەتكەن. ئەگەر زەنجىۋىل كۆكۈچى نىڭ باھاسى $6 ۋە ئالما پىيەسىنىڭ باھاسى $15 بولسا، ساني ئىككى كۈندە قانچە پۇل تاپتى؟"
answer = "يەكشەنبە كۈنى ئۇ زەنجىۋىل كۆكۈچى دىن 10 + 5 = <<10+5=15>>15 قۇتا سېتىۋەتكەن.\nساني نىڭ سېتىۋەتكەن زەنجىۋىل كۆكۈچى نىڭ ئومۇمىي قۇتا سانى 10 + 15 = <<10+15=25>>25.\nساني زەنجىۋىل كۆكۈچى سېتىش ئارقىلىق 25*$6 = $<<25*6=150>>150 تاپتى.\nئۇ شەنبە كۈنى ئالما پىيەسىدىن 15 - 4 = <<15-4=11>>11 قۇتا سېتىۋەتكەن.\nساني نىڭ سېتىۋەتكەن ئالما پىيەسىنىڭ ئومۇمىي قۇتا سانى 15 + 11 = <<15+11=26>>26.\nئۇ ئالما پىيەسى سېتىش ئارقىلىق 26*$15 = $<<26*15=390>>390 تاپتى.\nشۇڭا، ساني ئىككى كۈندە $150 + $390 = $<<150+390=540>>540 تاپتى.\n#### 540\n"
