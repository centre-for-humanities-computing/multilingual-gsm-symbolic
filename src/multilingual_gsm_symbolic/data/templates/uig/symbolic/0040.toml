question = "سالى تەتىل ئۈچۈن دېڭىز قىرغىقىغا باردى. ئۇنىڭ ئاتا-ئانىلىرى ئۇنىڭغا خالىغان نەرسىنى سېتىۋېلىش ئۈچۈن $15 بەردى. سۇۋېنىر دۇكىنىدا، تافىي ئالاھىدە سېتىلىۋاتاتتى: \"1 پوندنى ھەر پوندىغا $3 دوللاردىن سېتىۋېلىش، 1 پوند 1/2 چۈشۈش ئېلىش\". ئۇ 4 پوند سېتىۋالدى. ئۇ يەنە دېڭىز قۇپۇلغۇلىرىنىڭ ئارىلاش قاپىنى $1.5 غا ۋە ھەر بىرى 0.25 دوللار بولغان 4 ماغنىت سېتىۋالدى. سالى نىڭ قانچە پۇلى قالدى؟"
answer = "سالى 3 دوللارغا 1 پوند سېتىۋالماقتا ۋە 1 پوند 1/2 چۈشۈش ئالىدۇ. شۇڭا 1 پوندنىڭ 1/2 قىسمى $3*1/2 = $1.5. قالغان 2 پوندنىڭ چۈشۈش يوق ۋە 2*$3 = $6 تۇرىدۇ، شۇڭا جەمئىي $3+$3/2+$6=$21/2\n4 ماغنىت ھەر بىرى 0.25 دوللار بولسا 4*0.25=$<<4*0.25=1>>1\nئۇنىڭ بارلىق سېتىۋېلىشلىرىنى قوشقاندا، $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nئۇنىڭدا $15 بولۇپ، $13 خەجلىدى، شۇڭا ئۇنىڭدا $15-$13 = $<<15-13=2>>2 قالدى\n#### 2\n"
