question = "بىر يۇقۇملىق كېسەللىك ئون ئادەمنى يۇقۇملاندۇرىدۇ. ھەر كۈنى، ھەر بىر يۇقۇملانغان ئادەم ئالتە باشقىلارنى يۇقۇملاندۇرىدۇ. ئۈچ كۈندىن كېيىن قانچە ئادەم يۇقۇملانغان بولىدۇ؟"
answer = "بىرىنچى كۈنى، دەسلەپكى ئون ئادەم ھەر بىرى ئالتە ئادەمنى يۇقۇملاندۇرىدۇ، شۇڭا 10*6 = <<10*6=60>>60 كۆپرەك ئادەم يۇقۇملاندى.\nبىرىنچى كۈندىن كېيىن جەمئىي 10+60 = <<10+60=70>>70 يۇقۇملانغان ئادەم بار.\nئىككىنچى كۈنى، 70*6 = <<70*6=420>>420 كۆپرەك ئادەم يۇقۇملاندى.\nئىككىنچى كۈندىن كېيىن جەمئىي 70 + 420 = <<70+420=490>>490 يۇقۇملانغان ئادەم بار.\nئۈچىنچى كۈنى، 490*6 = 2940 كۆپرەك ئادەم يۇقۇملاندى. شۇڭا، ئۈچ كۈندىن كېيىن جەمئىي 490 + 2940 = 3430 يۇقۇملانغان ئادەم بار.\n#### 3430\n"
