question = "مارى بىر ھەۋەسكار باغۋەن. تۈنۈگۈن, ئۇ ئۆزى ياقتۇرىدىغان ئۆسۈملۈك سېتىش ئورنىدىن 18 دانە يېڭى قازان ئۆسۈملۈك قوبۇل قىلدى. ئۇنىڭ چوڭ يېزا ئۆيىدىكى 40 دانە تەرەزە ئوڭىنىڭ ھەر بىرىدە ئاللىبۇرۇن 2 دانە قازان ئۆسۈملۈك بار. خۇشاللىق ھېس قىلىپ، ئۇ ئەتە دوستلىرى ۋە ئائىلىسىگە ھەر بىر تەرەزە ئوڭىدىن 1 دانە قازان ئۆسۈملۈك بېرىشكە قارار قىلدى. مارى نىڭ قانچە قازان ئۆسۈملۈك قالىدۇ؟"
answer = "تۈنۈگۈن, ئۆسۈملۈكلەرنى قوبۇل قىلىشتىن بۇرۇن، مارى نىڭ 2*40 = <<2*40=80>>80 دانە قازان ئۆسۈملۈك بار ئىدى\nقوشۇمچە 18 دانە ئۆسۈملۈك قوبۇل قىلغاندىن كېيىن، ئۇنىڭ جەمئىي 80 + 18 = <<80+18=98>>98 دانە قازان ئۆسۈملۈك بولدى\nئەتە، مارى نىڭ ئۆسۈملۈك تارقىتىشى 40*1 = <<40*1=40>>40 دانە قازان ئۆسۈملۈك بولىدۇ.\nشۇڭا ئۇنىڭدا 98 - 40 = <<98-40=58>>58 دانە قازان ئۆسۈملۈك قالىدۇ.\n#### 58\n"
