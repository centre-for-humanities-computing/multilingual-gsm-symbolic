question = "فرانكى ھەر كەچ ئۆزىنىڭ ئۆي تەييارلىقىنى بىتىپ بولغاندىن كېيىن تېلېۋىزور كۆرىدۇ. دۈشەنبە ۋە سەيشەنبە كۈنلىرى، ئۇ ھەر كەچ ئۆزى ياقتۇرىدىغان كۆرسەتمىنىڭ 1-سائەتلىك بىر قىسىمىنى كۆردى. چارشەنبە كۈنى، ئۇ 30 مىنۇتلىق بىر كۆرسەتمىنىڭ بىر قانچە قىسىمىنى كۆردى. پەيشەنبە كۈنى، ئۇ ئۆي تەييارلىقىنى ئالدىن بىتىپ، 1-سائەتلىك بىر قىسىم ۋە 30 مىنۇتلىق بىر كۆرسەتمىنى كۆردى. جۈمە كۈنى، ئۇ كېچىلىككە قەدەر تۇرالايدىغان بولغاچقا، ئىككى دانە 1-سائەتلىك قىسىمنى كۆردى. ئەگەر ئۇ جەمئىي 7 سائەت تېلېۋىزور كۆرگەن بولسا، چارشەنبە كۈنى ئۇ قانچە دانە 30 مىنۇتلىق قىسىمنى كۆردى؟"
answer = "E نىڭ قىممىتىنى چارشەنبە كۈنى كۆرگەن قىسىم سانى دەيلى.\nدۈشەنبە دىن كېيىن، ئۇنىڭدا 7 - 1 = <<7-1=6>>6 سائەت تېلېۋىزور كۆرۈش ۋاقتى قالدى.\nسەيشەنبە دىن كېيىن، ئۇنىڭدا 6 - 1 = <<6-1=5>>5 سائەت تېلېۋىزور كۆرۈش ۋاقتى قالدى.\nپەيشەنبە دىن كېيىن، ئۇنىڭدا 5 - 1 - 0.5 = 3.5 سائەت تېلېۋىزور كۆرۈش ۋاقتى قالدى.\nجۈمە دىن كېيىن، ئۇنىڭدا 3.5 - 2 = 1.5 سائەت تېلېۋىزور كۆرۈش ۋاقتى قالدى.\nھەر بىر 30 مىنۇتلىق قىسىم 1/2 سائەتتۇر.\nشۇڭا، E = 1.5/0.5 = 3 قىسىم.\n#### 3\n"
