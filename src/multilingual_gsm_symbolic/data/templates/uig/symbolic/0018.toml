question = "رافائېل مەكتەپ ئۈسكۈنىلىرى سېتىۋالماقچى بولدى. ئۇ 4 دانە قەلەم نى ھەر بىرى دوللار1.5 تىن، 2 دانە دەپتەر نى ھەر بىرى دوللار4 تىن، ھەمدە بىر توپ چاپلاش قەغىزىنىڭ باھاسى دوللار20 ئىدى. رافائېل نىڭ ئومۇمىي جەمئىي قانچە پۇل خەجلىدى؟"
