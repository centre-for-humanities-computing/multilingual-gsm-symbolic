question = "ئالىسون يۈگۈرۈش تېمىسىنىڭ بىر ئورنىغا مۇۋەپپەقىيەت قازاندى، شۇڭا ئۇ بەزى سپورت ئەسۋابلىرىنى سېتىۋېلىش ئۈچۈن دۇكانغا باردى. ئۇ بىر دانە تانك تېپ نى $10 غا سېتىۋالدى، تانك تېپ نىڭ باھاسىدىن $5 كۆپ تۇرغان بىر جۈپ يۈگۈرۈش شورت نى سېتىۋالدى، ھەمدە دەسلەپتە $48 بولغان، ئەمما يېرىم باھادا سېتىلىۋاتقان بىر جۈپ تېننېس ئېتىكى نى سېتىۋالدى. ئۇ سېتىۋالغان $8 لىق سپورت پۇت ئىچىكى پاكېتى ئۈچۈن $2 لىق كۇپونغا ئىگە ئىدى. ئۇ سپورت ئەسۋابلىرىغا قانچە پۇت خەجلەدى؟"
answer = "شورت لار تانك تېپ دىن $5 گە قىممەت، شۇڭا ئۇلارنىڭ باھاسى $5 + $10 = $<<5+10=15>>15 بولدى.\nئۇنىڭ تېننېس ئېتىكى لىرى دەسلەپكى $48 باھاسىنىڭ يېرىم قىسمى ئىدى، شۇڭا ئۇلارنىڭ باھاسى $48*1/2=$24 بولدى.\nكۇپون بىلەن بىرگە، پۇت ئىچىكى لارنىڭ باھاسى $8 - $2 = $<<8-2=6>>6 بولدى.\nتانك تېپ, شورت, تېننېس ئېتىكى ۋە پۇت ئىچىكى لارنىڭ ئومۇمىي باھاسى $10 + $15 + $24 + $6 = $<<10+15+24+6=55>>55 بولدى.\n#### 55\n"
