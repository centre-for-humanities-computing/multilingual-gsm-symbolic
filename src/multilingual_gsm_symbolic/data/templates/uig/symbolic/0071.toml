question_annotated = "{name,نەيت} ئۆي ھايۋانلىرىنى {food,چۆپ} بىلەن ئوزۇقلاندۇرىدۇ. ھەر بىر {animal1,ئەگۈر}گە {n1,5} {unit,پوند} كېتىدۇ، ھەر بىر {animal2,لىلاما} بولسا ھەر بىر {animal1,ئەگۈر} كېتىدىغان مىقدارنىڭ ئىككى ھەسسىسىدىن {n2,3} {unit,پوند} ئاز كېتىدۇ. ئەگەر {k1,15} {animal1,ئەگۈر}لار ۋە {k2,12} {animal2,لىلاما}لار بولسا، {name,نەيت} قانچە {unit,پوند} {food,چۆپ} كېرەك بولىدۇ؟\n\n#init:\n- name = sample(names_male)\n- food = sample([\"چۆپ\", \"دان\", \"ئوزۇق\", \"سېلاژ\"])\n- animal1, animal2 = sample([\"ئەگۈر\", \"ئىنەك\", \"ئات\", \"ئېشەك\", \"لىلاما\", \"ئالپاكا\", \"چوشقا\", \"تۈركىيە تۆكۈنى\", \"ئۆردۈك\"], 2)\n- unit = sample([\"پوند\", \"كىلوگرام\", \"كىلو\"])\n- $n1 = range(3, 15)\n- $n2 = range(1, 10)\n- $k1 = range(10, 50)\n- $k2 = range(10, 50)\n\n#conditions:\n- 2*n1 - n2 > 0\n\n#answer: k1*n1 + k2*(2*n1 - n2)\n"
answer_annotated = "ئالدى بىلەن ھەر بىر {animal2}گە قانچىلىك {food} كېتىدىغانلىقىنى ھېسابلاپ چىقىمىز: {n1} {unit} * 2 - {n2} = <<{n1}*2-{n2}={2*n1-n2}>>{2*n1-n2} {unit}/{animal2}\nئەمدى {animal2}لارغا ئومۇمىي قانچىلىك {food} كېتىدىغانلىقىنى ھېسابلايمىز: {2*n1-n2} {unit}/{animal2} * {k2} {animal2}لار = <<{2*n1-n2}*{k2}={k2*(2*n1-n2)}>>{k2*(2*n1-n2)} {unit}\nئەمدى {animal1}لارغا ئومۇمىي قانچىلىك {food} كېتىدىغانلىقىنى ھېسابلايمىز: {n1} {unit}/{animal1} * {k1} {animal1}لار = <<{n1}*{k1}={k1*n1}>>{k1*n1} {unit}\nئەمدى ئىككى خىل {food} مىقدارىنى قوشۇپ ئومۇمىي مىقدارنى تاپىمىز: {k2*(2*n1-n2)} {unit} + {k1*n1} {unit} = <<{k2*(2*n1-n2)}+{k1*n1}={k1*n1 + k2*(2*n1 - n2)}>>{k1*n1 + k2*(2*n1 - n2)} {unit}\n#### {k1*n1 + k2*(2*n1 - n2)}\n"
