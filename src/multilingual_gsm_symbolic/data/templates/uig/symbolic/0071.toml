question = "نەيت ئۆي ھايۋانلىرىنى چۆپ بىلەن ئوزۇقلاندۇرىدۇ. ھەر بىر ئەگۈرگە 5 پوند كېتىدۇ، ھەر بىر لىلاما بولسا ھەر بىر ئەگۈر كېتىدىغان مىقدارنىڭ ئىككى ھەسسىسىدىن 3 پوند ئاز كېتىدۇ. ئەگەر 15 ئەگۈرلار ۋە 12 لىلامالار بولسا، نەيت قانچە پوند چۆپ كېرەك بولىدۇ؟"
answer = "ئالدى بىلەن ھەر بىر لىلاماگە قانچىلىك چۆپ كېتىدىغانلىقىنى ھېسابلاپ چىقىمىز: 5 پوند * 2 - 3 = <<5*2-3=7>>7 پوند/لىلاما\nئەمدى لىلامالارغا ئومۇمىي قانچىلىك چۆپ كېتىدىغانلىقىنى ھېسابلايمىز: 7 پوند/لىلاما * 12 لىلامالار = <<7*12=84>>84 پوند\nئەمدى ئەگۈرلارغا ئومۇمىي قانچىلىك چۆپ كېتىدىغانلىقىنى ھېسابلايمىز: 5 پوند/ئەگۈر * 15 ئەگۈرلار = <<5*15=75>>75 پوند\nئەمدى ئىككى خىل چۆپ مىقدارىنى قوشۇپ ئومۇمىي مىقدارنى تاپىمىز: 84 پوند + 75 پوند = <<84+75=159>>159 پوند\n#### 159\n"
