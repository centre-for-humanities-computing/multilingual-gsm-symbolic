question = "ئەپەندى تان ئۆزىنىڭ ئۆي نى $400,000 غا سېتىۋەتتى. ئۇ سېتىش باھاسىنىڭ 3% غا تەڭ كېلىدىغان ئۆتكۈزۈش ھەققىنى تۆلىدى ھەمدە سېتىش باھاسىنىڭ 5% غا تەڭ كېلىدىغان ئارىلىقچىلىق ھەققىنىمۇ تۆلىدى. ئەگەر ئۇ ئۆي نىڭ قالدۇق قەرز سوممىسى ئۈچۈن $250,000 نى تۆلىسە، ئەپەندى تان نىڭ ئۆي نى سېتىشتىن كەلگەن ساپ كىرىمى قانچىلىك بولىدۇ؟"
answer = "ئەپەندى تان ئۆتكۈزۈش ھەققى ئۈچۈن $400,000*3/100 = <<400000*3/100=12000>>$12,000 تۆلىدى.\nئۇ ئارىلىقچىلىق ھەققى ئۈچۈن $400,000*5/100 = <<400000*5/100=20000>>$20,000 تۆلىدى.\nشۇڭا، ئەپەندى تان ئۆتكۈزۈش, ئارىلىقچىلىق ۋە قەرز ھەققى ئۈچۈن ئومۇمىي جەمئىي $12,000 + $20,000 + $250,000 = <<12000+20000+250000=282000>>$282,000 تۆلىدى.\nشۇڭا، ئەپەندى تان نىڭ ساپ كىرىمى $400,000 - $282,000 = <<400000-282000=118000>>$118,000 بولىدۇ.\n#### 118000\n"
