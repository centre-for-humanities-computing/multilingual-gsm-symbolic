question = "مارتا ئۆزىنىڭ 3 نەۋرىسى ئۈچۈن قىشلىق كىيىم تېگىۋاتىدۇ. ئۇلار ئۈچ قوش تۇغما, شۇڭا ئۇلارنىڭ چوڭلۇقى ئوخشاش. ئۇ ھەر بىرى ئۈچۈن بىر تېكە, ئىسكاڭ, جىڭىز, قولىق ۋە چىگىش ياسىماقچى. بىر تېكە ياساشقا 2 جۈمەك يۇڭ كېتىدۇ, 4 بىر ئىسكاڭ ئۈچۈن, 12 بىر جىڭىز ئۈچۈن, 1 بىر جۈپ قولىق ئۈچۈن, ۋە 2 بىر جۈپ چىگىش ئۈچۈن. ئۇ قانچە جۈمەك يۇڭ سېتىۋېلىشى كېرەك؟"
answer = "ھەر بىر بالىنىڭ تولۇق كىيىمى ئۈچۈن تېكە ئۈچۈن 2 جۈمەك + ئىسكاڭ ئۈچۈن 4 جۈمەك + جىڭىز ئۈچۈن 12 جۈمەك + قولىق جۈپ ئۈچۈن 1 جۈمەك + چىگىش جۈپ ئۈچۈن 2 جۈمەك = <<2+4+12+1+2=21>>21 جۈمەك يۇڭ كېتىدۇ.\nشۇڭا ئۇنىڭ بارلىق نەۋرىلىرى ئۈچۈن كىيىم تېگىش ئۈچۈن, ئۇنىڭغا 3*21 = <<3*21=63>>63 جۈمەك يۇڭ كېتىدۇ.\n#### 63\n"
