question = "دېئاندريە ئۆتكەن دۈشەنبە كۈنى 3 دانە تۇنا تۇتتى، ئۇ تۇتقان بىرىنچى تۇنا نىڭ ئېغىرلىقى 56 كىلوگرام، ئىككىنچى تۇنا نىڭ ئېغىرلىقى 46 كىلوگرام، ۋە قالغان تۇنا نىڭ ئېغىرلىقى 26 كىلوگرام بولدى. ئەگەر بىر كىلوگرام تۇنا نىڭ باھاسى دولار0.5 بولسا، ئۇ بارلىق تۇنا لارنى بازارغا سېتىپ بولغاندىن كېيىن قانچە تاپىدۇ؟"
