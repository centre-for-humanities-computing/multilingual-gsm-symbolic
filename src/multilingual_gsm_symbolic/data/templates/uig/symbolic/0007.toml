question = "بىر دېھقان ئۆزىنىڭ ئاتلىرى ئۈچۈن يېمەك سېتىۋالماقتا. ئۇ چۆپ, ئارپا, سەۋزە ۋە شېكەر تەكشىكى نىڭ خىل-خىل تۈرلىرىنى سېتىۋالىدۇ. شېكەر تەكشىكى نۆرەتلىك بىر تەم بولغاچقا، ئۇ پۈتۈن ئاتخانا ئۈچۈن پەقەت ئىككى دانە 1-پوند لىق قۇتا سېتىۋالىدۇ. ئۇ پەقەت كۆكتاتلار يېڭى بولغان مەزگىلدە ئاتلىرىنى يېمەك بىلەن تەمىنلەش ئۈچۈن يېتەرلىك سەۋزە سېتىۋالماقچى، شۇڭا ئۇ تۆت دانە 12-پوند لىق خالتا سېتىۋالىدۇ. چۆپ ئۇنىڭ ئاتلىرىنىڭ ئاساسلىق يېمىكى بولغاچقا، ئۇ تۆت ئون ئىككى 75-پوند لىق پاكېت سېتىۋالىدۇ. ئارپا چۆپ نى تولۇقلاش ئۈچۈن ئاساسلىق يېمەك بولغاچقا، ئۇ ئىككى ئون 65-پوند لىق خالتا سېتىۋالىدۇ. ئەگەر ئۇنىڭ دېھقانچىلىق ماشىنىسى بىر قېتىمدا 2250 پوند يۈك كۆتۈرەلىسە، دېھقان بارلىق يېمەكنى يۆتكەش ئۈچۈن قانچە قېتىم ماڭىشى كېرەك؟"
answer = "دېھقان 2*1 = <<2*1=2>>2 پوند شېكەر تەكشىكى سېتىۋالماقتا.\nئۇ 4*12 = <<4*12=48>>48 پوند سەۋزە سېتىۋالماقتا.\nئۇ 21*65 = <<21*65=1365>>1365 پوند ئارپا سېتىۋالماقتا.\nئۇ 42*75 = <<42*75=3150>>3150 پوند چۆپ سېتىۋالماقتا.\nبارلىق يېمەكنىڭ ئېغىرلىقى 2 + 48 + 1365 + 3150 = <<2+48+1365+3150=4565>>4565 پوند.\nشۇڭا، دېھقان بارلىق يېمەكنى دېھقانچىلىق ماشىنىسىدا يۆتكەش ئۈچۈن 4565 / 2250 = <<4565/2250=2>>2 قېتىم كېرەك.\n#### 2\n"
