question_annotated = "{facility,خەستەخانا} نىڭ سىغىمى {total,1000} {item,كارىۋات}لار بولۇپ، {frac,1/5} ئىشلىتىلگەن. {event,كوروناۋىرۇس يۇقۇمى} سەۋەبىدىن، ھەر كۈنى {facility,خەستەخانا} غا {daily,50} كېسەل قوبۇل قىلىنىدۇ. {period,2} ھەپتىدىن كېيىن {facility,خەستەخانىدىكى} ئىشلىتىلمىگەن {item,كارىۋات}لارنىڭ ئومۇمىي سانىنى ھېسابلاڭ.\n\n#init:\n- facility = sample([\"خەستەخانا\", \"كلىنىكا\", \"تېببىي مەركەز\", \"پاراۋانلىق مەركىزى\"])\n- item = sample([\"كارىۋات\", \"ئۆي\", \"بۆلۈم\"])\n- event = sample([\"گىرىپ مەۋسۇمى\", \"تەبىئىي ھەلەكەت\", \"چوڭ ھادىسە\", \"يۇقۇم\"])\n- $total = range(500, 2000, 100)\n- $frac = sample(fractions)\n- $daily = range(20, 100, 5)\n- $period = range(2, 5)\n\n#conditions:\n- is_int(total * frac)\n- total * frac + daily * period * 7 < total\n\n#answer: total - (total * frac + daily * period * 7)\n"
answer_annotated = "ئەگەر {frac} قىسمى {facility} نىڭ ئومۇمىي سىغىمى {item}لار ئىشلىتىلگەن بولسا، بۇ دېگەنلىك {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} دانە {item}لاردا كېسەل بار دېگەنلىكتۇر.\nيېڭى قوبۇل قىلىنغانلار بولمىغان {facility} دىكى {item}لارنىڭ ئومۇمىي سانى {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item} بولىدۇ.\nئەگەر ھەر كۈنى {daily} كىشى قوبۇل قىلىنسا، بىر ھەپتىدىن كېيىن {facility} دىكى كېسەللەرنىڭ ئومۇمىي سانى {daily} كىشى/كۈن * 7 كۈن/ھەپتە = {daily*7} كېسەل بولىدۇ.\n{period} ھەپتىدىن كېيىن، {facility} غا قوبۇل قىلىنغان كېسەللەرنىڭ ئومۇمىي سانى {daily*7} كېسەل/ھەپتە * {period} ھەپتە = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} كېسەل بولۇپ، ئۇلارنىڭ ھەر بىرى بىر {item} ئىشلىتىدۇ.\nئەگەر يېڭى قوبۇل قىلىشتىن بۇرۇن {facility} دا {total-int(total*frac)} دانە ئىشلىتىلمىگەن {item} بولسا، ئومۇمىي سان {total-int(total*frac)} {item} - {daily*period*7} {item} غا چۈشىدۇ = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} ئىشلىتىلمىگەن {item}لار.\n#### {total - (total * frac + daily * period * 7)}\n"
