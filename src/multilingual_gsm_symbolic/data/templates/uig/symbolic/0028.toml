question = "خەستەخانىدىكى نىڭ سىغىمى 1000 كارىۋاتلار بولۇپ، 1/5 ئىشلىتىلگەن. كوروناۋىرۇس يۇقۇمى سەۋەبىدىن، ھەر كۈنى خەستەخانىدىكى غا 50 كېسەل قوبۇل قىلىنىدۇ. 2 ھەپتىدىن كېيىن خەستەخانىدىكى ئىشلىتىلمىگەن كارىۋاتلارنىڭ ئومۇمىي سانىنى ھېسابلاڭ."
answer = "ئەگەر 1/5 قىسمى خەستەخانىدىكى نىڭ ئومۇمىي سىغىمى كارىۋاتلار ئىشلىتىلگەن بولسا، بۇ دېگەنلىك 1/5 * 1000 = <<1000*1/5=200>>200 دانە كارىۋاتلاردا كېسەل بار دېگەنلىكتۇر.\nيېڭى قوبۇل قىلىنغانلار بولمىغان خەستەخانىدىكى دىكى كارىۋاتلارنىڭ ئومۇمىي سانى 1000 كارىۋات - 200 كارىۋات = <<1000-200=800>>800 كارىۋات بولىدۇ.\nئەگەر ھەر كۈنى 50 كىشى قوبۇل قىلىنسا، بىر ھەپتىدىن كېيىن خەستەخانىدىكى دىكى كېسەللەرنىڭ ئومۇمىي سانى 50 كىشى/كۈن * 7 كۈن/ھەپتە = 350 كېسەل بولىدۇ.\n2 ھەپتىدىن كېيىن، خەستەخانىدىكى غا قوبۇل قىلىنغان كېسەللەرنىڭ ئومۇمىي سانى 350 كېسەل/ھەپتە * 2 ھەپتە = <<350*2=700>>700 كېسەل بولۇپ، ئۇلارنىڭ ھەر بىرى بىر كارىۋات ئىشلىتىدۇ.\nئەگەر يېڭى قوبۇل قىلىشتىن بۇرۇن خەستەخانىدىكى دا 800 دانە ئىشلىتىلمىگەن كارىۋات بولسا، ئومۇمىي سان 800 كارىۋات - 700 كارىۋات غا چۈشىدۇ = <<800-700=100>>100 ئىشلىتىلمىگەن كارىۋاتلار.\n#### 100\n"
