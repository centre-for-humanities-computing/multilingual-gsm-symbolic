question_annotated = "{name, سۇپىيە} ئۆزىنىڭ {family, جىيەن} نى كۆزىتىۋاتقاندا، ئۇنىڭ ئۈچۈن ھەر خىل ئويۇنچۇقلارنى چىقىرىۋالىدۇ. قۇرۇلۇش bloklari خالتىسىدا {x,31} دانە blokki بار. يۇمشاق ھايۋان قۇتىسىدا {y,8} دانە ھايۋان بار. يىغىشچاق ھالقىلار مۇنارىدا {z,9} دانە رەڭدار ھالقا بار. {name, سۇپىيە} يېقىندا سەكرەش توپلىرى تۇبىسىنى سېتىۋالدى، بۇ ئۇنىڭ {family, جىيەن} ئۈچۈن بولغان ئويۇنچۇقلىرىنىڭ ئومۇمىي سانىنى {total,62} گە يەتكۈزدى. تۇبىدا قانچە سەكرەش توپى بار ئىدى؟\n\n#init:\n- name = sample(names_female)\n- family = sample([\"جىيەن\", \"تۇغقان\", \"ئىنىسى\"])\n- $x = range(31, 75)\n- $y = range(8, 50)\n- $z = range(9, 35)\n- $total = range(60, 250)\n\n#conditions:\n- total - (x + y + z) >= 20 \n- total - (x + y + z) < 100\n\n#answer: total - (x + y + z)"
answer_annotated = "تۇبىدىكى سەكرەش توپلىرىنىڭ سانى T بولسۇن.\nتوپلار تۇبىسىنى سېتىۋالغاندىن كېيىن، {name} نىڭ {family} ئۈچۈن ئويۇنچۇقلىرىنىڭ سانى {x} + {y} + {z} + T = {x+y+z} + T = {total} بولىدۇ.\nشۇڭا، T = {total} - {x+y+z} = <<{total}-{x+y+z}={total - (x + y + z)}>>{total - (x + y + z)} دانە سەكرەش توپى تۇبىدىن چىققان.\n#### {total - (x + y + z)}"
