question = "سۇپىيە ئۆزىنىڭ جىيەن نى كۆزىتىۋاتقاندا، ئۇنىڭ ئۈچۈن ھەر خىل ئويۇنچۇقلارنى چىقىرىۋالىدۇ. قۇرۇلۇش bloklari خالتىسىدا 31 دانە blokki بار. يۇمشاق ھايۋان قۇتىسىدا 8 دانە ھايۋان بار. يىغىشچاق ھالقىلار مۇنارىدا 9 دانە رەڭدار ھالقا بار. سۇپىيە يېقىندا سەكرەش توپلىرى تۇبىسىنى سېتىۋالدى، بۇ ئۇنىڭ جىيەن ئۈچۈن بولغان ئويۇنچۇقلىرىنىڭ ئومۇمىي سانىنى 62 گە يەتكۈزدى. تۇبىدا قانچە سەكرەش توپى بار ئىدى؟"
answer = "تۇبىدىكى سەكرەش توپلىرىنىڭ سانى T بولسۇن.\nتوپلار تۇبىسىنى سېتىۋالغاندىن كېيىن، سۇپىيە نىڭ جىيەن ئۈچۈن ئويۇنچۇقلىرىنىڭ سانى 31 + 8 + 9 + T = 48 + T = 62 بولىدۇ.\nشۇڭا، T = 62 - 48 = <<62-48=14>>14 دانە سەكرەش توپى تۇبىدىن چىققان.\n#### 14"
