question = "مەرىيا 8 دانە ئۇلۇشنى ھەر بىرى دولار8 گە سېتىۋالىدۇ. مەرىيا نىڭ ئىگىدارلىق قىلغان بىرىنچى يىلىدا ئۇلۇش باھاسى 50% ئۆسىدۇ، ئاندىن ئىككىنچى يىلى 25% تۆۋەنلەيدۇ. مەرىيا نىڭ بارلىق ئۇلۇشلىرىنىڭ ئاخىرقى قىممىتى قانچە؟"
