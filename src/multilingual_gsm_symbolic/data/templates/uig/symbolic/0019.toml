question = "60-سوئاللىق بىر سىناقتا، سوئاللارنىڭ 40%ى ئاسان، قالغانلىرى تەكشى بۆلۈنگەن ئوتتۇراھال ۋە قىيىن سوئاللاردۇر. ئەگەر ئارىس ئاسان سوئاللارنىڭ 75%ىنى ۋە ئوتتۇراھال ۋە قىيىن سوئاللارنىڭ يېرىمىنى توغرا جاۋابلىسا، ئۇ چوقۇم قانچە نومۇر ئالىدۇ؟"
answer = "ئوتتۇراھال ۋە قىيىن سوئاللار سىناقتىكى 100% - 40% = 60% نى تەشكىل قىلىدۇ.\nبارلىق 60 سوئالنىڭ 40/100ى = <<60*40/100=24>>24 ئاسان سوئال بار.\nجەمئىي 60 سوئالنىڭ 60/100ى = <<60*60/100=36>>36 ئوتتۇراھال ۋە قىيىن سوئال بار.\nئەگەر ئارىس ئاسان سوئاللارنىڭ 75%ىنى چوقۇم تاپسا، بۇ دېگەنلىك ئۇنىڭ 24 سوئالنىڭ 75/100ىنى، يەنى <<24*75/100=18>>18 نومۇر ئالغانلىقىدۇر.\nئوتتۇراھال ۋە قىيىن سوئاللاردىن ئۇ چوقۇم يېرىمىنى توغرا جاۋابلايدۇ، بۇ 36 سوئالنىڭ 1/2ى، يەنى <<36*1/2=18>>18 نومۇرغا تەڭ.\nشۇڭا، ئۇ سىناقتا جەمئىي 18 نومۇر + 18 نومۇر = <<18+18=36>>36 نومۇر ئالىدۇ.\n#### 36\n"
