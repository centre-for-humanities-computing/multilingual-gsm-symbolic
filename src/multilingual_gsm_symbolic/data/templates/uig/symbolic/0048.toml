question = "ئېمىلى بىر مىنۇتتا 6 كارىۋىت نى پەسكەش قىلالايدۇ ۋە 30 كارىۋىت نى 10 مىنۇتتا قورۇيدۇ. ئۇنىڭ 90 كارىۋىت نى پەسكەش قىلىپ ۋە قورۇشىغا قانچە ۋاقىت كېتىدۇ؟ ئېمىلى بىر ۋاقىتتا پەسكەش قىلىش ۋە قورۇشنى قىلالمايدۇ."
answer = "ئالدى بىلەن ئېمىلى نىڭ كارىۋىت نى پەسكەش قىلىشىغا قانچە ۋاقىت كېتىدىغانلىقىنى تېپىڭ: 90 كارىۋىت / 6 كارىۋىت/مىنۇت = <<90/6=15>>15 مىنۇت\nئاندىن ئۇنىڭ قانچە بۆلەك كارىۋىت پىشۇرۇشى كېرەكلىكىنى تېپىڭ: 90 كارىۋىت / 30 كارىۋىت/بۆلەك = <<90/30=3>>3 بۆلەك\nئاندىن بۆلەك سانىنى بىر بۆلەككە كېتىدىغان ۋاقىتقا كۆپەيتىپ، ئومۇمىي پىشۇرۇش ۋاقتىنى تېپىڭ: 3 بۆلەك * 10 مىنۇت/بۆلەك = <<3*10=30>>30 مىنۇت\nئاندىن ئومۇمىي ۋاقىتنى تېپىش ئۈچۈن پەسكەش ۋاقتىنى قوشۇڭ: 30 مىنۇت + 15 مىنۇت = <<30+15=45>>45 مىنۇت\n#### 45\n"
