question = "روجېر دۇكانغا بىر قەدەر قەھۋە سېتىۋېلىشقا باردى. ئۇ سېتىۋالىدىغان ئادەتتىكى قەھۋە ئىشىرىنىڭ باھاسى ھەر پوند5 تۇتىدۇ. ئۇنىڭ ياقتۇرىدىغان ئىشىرى تۈگەپ كەتكەچكە، ئۇ 20% قىممەتتەن ئارتۇق تۇرىدىغان تېخىمۇ قىممەتلىك بىر ئىشىر سېتىۋېلىشقا مەجبۇر بولدى. ئۇ بىر ھەپتىلىك قەھۋە سېتىۋېلىشقا قارار قىلدى ۋە كۈنىگە 1 پوند قەھۋە ئىشلىتىدۇ. ئۇ يەنە ئۆزىگە $2 تۇرىدىغان بىر دوۋنۇت سېتىۋېلىشقا قارار قىلدى. بارلىق نەرسىلەرنىڭ ئومۇمىي باھاسى قانچە بولدى؟"
answer = "ئۇ سېتىۋالغان قەھۋە ئادەتتىكىدىن ھەر پوندغا 5*0.2=$<<5*0.2=1>>1 تۇتىدىغان قىممەتتەن ئارتۇق ئىدى\nشۇڭا ئۇ ھەر پوندغا 5+1=$<<5+1=6>>6 تۇتىدىغان بولدى\nئۇ بىر ھەپتىدە 1*7=<<1*7=7>>7 قەھۋە پوند ئىشلىتىدۇ\nشۇڭا ئۇ قەھۋە ئۈچۈن 6*7=$<<6*7=42>>42 تۆلىدى\nبۇنىڭدىن مەلۇمكى، ئۇنىڭ ئومۇمىي ھېساباتى 42+2=$<<42+2=44>>44 بولدى\n#### 44\n"
