question_annotated = "ئۇنىڭ ئوزۇقلۇق ئۇچۇرىغا ئاساسەن، {food,چىپس} نىڭ بىر قاپىدا ھەر بىر بۆلەككە {cal,250} كالورىيە توغرا كېلىدۇ. ئەگەر {size,300} {unit,گرام} لىق بىر قاپتا {n,5} بۆلەك بولسا، كۈندىلىك كالورىيە نىشانىڭىز {total,2000} بولۇپ، ئاللىبۇرۇن {spent,1800} كالورىيە ئىستېمال قىلغان بولسىڭىز، قانچە {unit,گرام} يېيەلەيسىز؟\n\n#init:\n- food = sample([\"پوپكورن\", \"نانون\",  \"كۇكىس\"])\n- unit = sample([\"گرام\", \"ئونس\", \"ئونس\"])\n- $cal = range(150, 500, 25)\n- $size = range(100, 400, 25)\n- $n = range(4, 8)\n- $total = range(1900, 2500, 5)\n- $spent = range(600, 1900, 25)\n\n#conditions:\n- spent < total\n- is_int( 5 * (total - spent) / cal)\n- divides(size, n)\n- divides(size//n, (total-spent)/cal)\n\n#answer: size//n * Fraction((total-spent)/cal)\n"
answer_annotated = "ئەگەر ئومۇمىي كالورىيە نىشانى {total} بولسا ۋە مەن {spent} كالورىيە ئىستېمال قىلغان بولسام، ئۇنداقتا مەن يېيىشكە {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} كالورىيە قالدۇق قىلىمەن\nئەگەر ھەر بىر بۆلەك {food} نىڭ {cal} كالورىيەسى بولسا ۋە مەن پەقەت {total-spent} كالورىيە قالدۇق قىلىمەن، ئۇنداقتا مەن پەقەت بىر بۆلەكنىڭ {total-spent}/{cal} نى يېيەلەيمەن = بىر بۆلەكنىڭ {Fraction((total-spent)/cal)} نى\nبىز شۇنىمۇ بىلىمىزكى، {size} {unit} لىق {food} نىڭ بىر قاپىدا {n} بۆلەك بار، شۇڭا ھەر بىر بۆلەكتە {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit} بار\nئەگەر مەن پەقەت بىر بۆلەكنىڭ {Fraction((total-spent)/cal)} نى يېيەلەيسەم، ئۇنداقتا مەن پەقەت {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit} يېيەلەيمەن\n#### {size//n * (total-spent)/cal}\n"
