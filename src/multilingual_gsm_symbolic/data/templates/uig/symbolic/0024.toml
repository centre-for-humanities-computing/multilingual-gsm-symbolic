question = "ئۇنىڭ ئوزۇقلۇق ئۇچۇرىغا ئاساسەن، چىپس نىڭ بىر قاپىدا ھەر بىر بۆلەككە 250 كالورىيە توغرا كېلىدۇ. ئەگەر 300 گرام لىق بىر قاپتا 5 بۆلەك بولسا، كۈندىلىك كالورىيە نىشانىڭىز 2000 بولۇپ، ئاللىبۇرۇن 1800 كالورىيە ئىستېمال قىلغان بولسىڭىز، قانچە گرام يېيەلەيسىز؟"
answer = "ئەگەر ئومۇمىي كالورىيە نىشانى 2000 بولسا ۋە مەن 1800 كالورىيە ئىستېمال قىلغان بولسام، ئۇنداقتا مەن يېيىشكە 2000-1800 = <<2000-1800=200>>200 كالورىيە قالدۇق قىلىمەن\nئەگەر ھەر بىر بۆلەك چىپس نىڭ 250 كالورىيەسى بولسا ۋە مەن پەقەت 200 كالورىيە قالدۇق قىلىمەن، ئۇنداقتا مەن پەقەت بىر بۆلەكنىڭ 200/250 نى يېيەلەيمەن = بىر بۆلەكنىڭ 4/5 نى\nبىز شۇنىمۇ بىلىمىزكى، 300 گرام لىق چىپس نىڭ بىر قاپىدا 5 بۆلەك بار، شۇڭا ھەر بىر بۆلەكتە 300 گرام/5 = <<300/5=60>>60 گرام بار\nئەگەر مەن پەقەت بىر بۆلەكنىڭ 4/5 نى يېيەلەيسەم، ئۇنداقتا مەن پەقەت 60 گرام * 4/5 = 48 گرام يېيەلەيمەن\n#### 48\n"
