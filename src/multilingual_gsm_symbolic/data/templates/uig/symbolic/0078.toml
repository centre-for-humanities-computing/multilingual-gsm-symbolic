question = "نورمال ئوقۇغۇچىلار ئۈچۈن كۈندە 6 دەرس بۆلۈمى بار، ئەمما جان نىڭ 2 قوشۇمچە دەرس ئېلىشى كېرەك. ھەر بىر دەرس 40 مىنۇت داۋاملىشىدۇ. ئۇ ھەپتىدە 5 كۈن دەرسكە قاتنىشىدۇ. ئۇ كېيىن ھەپتىلىك مىنۇتلىرىنىڭ 1/16 قىسمىنى شەنبە ۋە يەكشەنبە كۈنلىرى قوشۇمچە ئۆگىنىش ۋاقتى سۈپىتىدە سەرپ قىلىدۇ. ئۇ ھەپتىدە ئۆگىنىشكە قانچە سائەت سەرپ قىلىدۇ؟"
answer = "ئۇ كۈندە 6+2=<<6+2=8>>8 دەرس ئالىدۇ\nبۇنىڭدىن كۆرۈنگىنىدەك، ئۇ كۈندە دەرسكە 40*8=<<40*8=320>>320 مىنۇت ۋاقىت سەرپ قىلىدۇ\nشۇڭا ئۇ ھەپتىدە 320*5=<<320*5=1600>>1600 مىنۇت سەرپ قىلىدۇ\nبۇنىڭدىن كۆرۈنگىنىدەك، ئۇ شەنبە ۋە يەكشەنبە كۈنلىرى ھەر بىرىدە 1600*1/16=<<1600*1/16=100>>100 مىنۇت سەرپ قىلىدۇ.\nشۇڭا ئۇ ھەپتىدە 1600+100+100=<<1600+100+100=1800>>1800 مىنۇت سەرپ قىلىدۇ\nشۇڭا ئۇ ھەپتىدە 1800/60=<<1800/60=30>>30 سائەت سەرپ قىلىدۇ\n#### 30\n"
