answer_annotated = "ئۇ كۈندە {n1}+{n2}=<<{n1}+{n2}={n1+n2}>>{n1+n2} دەرس ئالىدۇ\nبۇنىڭدىن كۆرۈنگىنىدەك، ئۇ كۈندە دەرسكە {t}*{n1+n2}=<<{t}*{n1+n2}={t*(n1+n2)}>>{t*(n1+n2)} مىنۇت ۋاقىت سەرپ قىلىدۇ\nشۇڭا ئۇ ھەپتىدە {t*(n1+n2)}*{d}=<<{t*(n1+n2)}*{d}={t*(n1+n2)*d}>>{t*(n1+n2)*d} مىنۇت سەرپ قىلىدۇ\nبۇنىڭدىن كۆرۈنگىنىدەك، ئۇ شەنبە ۋە يەكشەنبە كۈنلىرى ھەر بىرىدە {t*(n1+n2)*d}*{frac}=<<{t*(n1+n2)*d}*{frac}={int((n1 + n2) * t * d * frac)}>>{int((n1 + n2) * t * d * frac)} مىنۇت سەرپ قىلىدۇ.\nشۇڭا ئۇ ھەپتىدە {t*(n1+n2)*d}+{int((n1 + n2) * t * d * frac)}+{int((n1 + n2) * t * d * frac)}=<<{t*(n1+n2)*d}+{int((n1 + n2) * t * d * frac)}+{int((n1 + n2) * t * d * frac)}={t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)}>>{t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)} مىنۇت سەرپ قىلىدۇ\nشۇڭا ئۇ ھەپتىدە {t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)}/60=<<{t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)}/60={((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60}>>{((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60} سائەت سەرپ قىلىدۇ\n#### {((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60}\n"
