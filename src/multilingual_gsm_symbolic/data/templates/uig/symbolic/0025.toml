question = "خىزمەتكارى رېپېر نىڭ 30 ئوقۇغۇچىلىق سىنىپىدا، 20% نى فۇتبولچىلار تەشكىل قىلىدۇ. قالغان سىنىپتىن، ئوقۇغۇچىلارنىڭ 25% نى تەشۋىقچىلار ياكى مۇزىكا گۇرۇپپىسى نىڭ بىرى تەشكىل قىلىدۇ. بۇ 3 گۇرۇپپىدىكى ئوقۇغۇچىلار بۈگۈن يىراقتىكى ئويۇن غا بېرىش ئۈچۈن ئاۋۋال چىقىپ كېتىشى كېرەك. قانچە ئوقۇغۇچى ئاۋۋال چىقىپ كېتىدۇ؟"
answer = "20% نىڭ 30 ئوقۇغۇچىلىق سىنىپى فۇتبولچىلار بولغاچقا، بۇ 0.2*30 = <<0.2*30=6>>6 ئوقۇغۇچى دېگەنلىك\nجەمئىي 30 ئوقۇغۇچى بار، 6 نى فۇتبولچىلار تەشكىل قىلغانلىقى ئۈچۈن، قالغان 30-6 = <<30-6=24>>24 ئوقۇغۇچى قالىدۇ\nقالغان 24 ئوقۇغۇچىنىڭ 25% نى مۇزىكا گۇرۇپپىسى ياكى تەشۋىقچىلار تەشكىل قىلىدۇ، بۇ 0.25*24 = <<0.25*24=6>>6 ئوقۇغۇچى دېگەنلىك\n6 ئوقۇغۇچى فۇتبولچىلار ۋە 6 ئوقۇغۇچى مۇزىكا گۇرۇپپىسى/تەشۋىقچىلار نىڭ بىرى بولغاچقا، 6+6 = <<6+6=12>>12 ئوقۇغۇچى ئاۋۋال چىقىپ كېتىدۇ\n#### 12\n"
