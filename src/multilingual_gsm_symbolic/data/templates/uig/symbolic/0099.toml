question = "ئەگەر چېستېر بىر كۈندە 3 دانە تۇخۇم يېيىپ 30 كۈن داۋام قىلسا، ئاندىن بىر كۈندە يېگەن مىقدارىنى 5 دانە تۇخۇمغا ئۆستۈرۈپ 30 كۈن داۋام قىلسا، چېستېر 60 كۈن ئىچىدە قانچە دۇزەن تۇخۇمغا ئېھتىياجلىق بولىدۇ؟"
