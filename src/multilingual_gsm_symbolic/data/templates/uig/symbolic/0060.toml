question = "واتسون ھەر كۈنى 10-سائەتلىك ئىش قىلىدۇ، ھەپتىدە بەش كۈن. ئۇ سائىتىگە $10 تاپىدۇ ۋە ئەگەر شىركەت ياخشى ئىشلەسە ھەپتىدە $300 مۇكاپات ئالىدۇ. ئەگەر شىركەت پۈتۈن ئايدا ناھايىتى ياخشى ئىشلەسە، واتسون ئاپرېل دا قانچە پۇل تاپتى؟"
answer = "بىر كۈندە، واتسون 10 * 10 = $<<10*10=100>>100 تاپىدۇ\nئەگەر ئۇ ھەپتىدە بەش كۈن ئىشلەسە، پۈتۈن ئاي ئۈچۈن جەمئىي كۈن سانى 5*4=<<5*4=20>>20 كۈن بولىدۇ.\nئۇنىڭ ھەر كۈنى $100 تاپىدىغانلىقى ئۈچۈن، پۈتۈن ئاي ئۈچۈن جەمئىي مىقدار 20 * 100= $<<20*100=2000>>2000 بولىدۇ.\nئۇ ئاپرېل نىڭ ھەممە ھەپتىلىرىدە شىركەت ياخشى ئىشلىگەنلىكى ئۈچۈن يەنە 300 * 4 = $<<300*4=1200>>1200 مۇكاپات ئالدى.\nئاپرېل نىڭ ئاخىرىدا، ئۇ 2000 + 1200 = $<<2000+1200=3200>>3200 تاپتى.\n#### 3200\n"
