question = "بىرېندان نىڭ ئىچىدە 10 دانە چاپچاق بار بىر خالتىسى بار. ئۇ ئۇنى كۆتۈرۈپ ماڭغاندا تاش غا ئۇرۇلۇپ، ئۇلارنىڭ يېرىم نى چۈشۈرۈپ قويۇپتۇ. ئۇ ئۇلارنى ئىزدەپ تاپماقچى بولدى، ئەمما پەقەت 3 دانىسىنى تاپتى. ئۇ ئۆيگە قايتقاندا، چاپچاق لىرىنى تېخىمۇ ئىنچىكىلەپ تەكشۈردى. ئۇ سېلىپ ئالغانلىرىنىڭ ئىككى دانىسى چاپچاق ئەمەس، بەلكى مەرۋايىت ئىدى، شۇڭا ئۇلارنى تاشلىۋەتتى. بىرېندان نىڭ ئاخىرىدا قانچە چاپچاق قالدى؟"
