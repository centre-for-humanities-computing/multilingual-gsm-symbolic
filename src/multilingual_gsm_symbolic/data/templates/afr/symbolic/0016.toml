question = "Sunny verkoop peperkoek en appelkoek vir 'n fondsinsameling. Op Saterdag het hy 10 boksies peperkoek en 4 minder boksies appelkoek as op Sondag verkoop. Op Sondag het hy 5 meer boksies peperkoek as op Saterdag en 15 boksies appelkoek verkoop. As die peperkoek R6 kos en die appelkoek R15 kos, hoeveel het Sunny vir twee dae verdien?"
answer = "Hy het 10 + 5 = <<10+5=15>>15 boksies peperkoek op Sondag verkoop.\nDie totale aantal boksies peperkoek wat Sunny verkoop het is 10 + 15 = <<10+15=25>>25.\nSunny het 25*R6 = R<<25*6=150>>150 verdien vir die verkoop van peperkoek.\nHy het 15 - 4 = <<15-4=11>>11 boksies appelkoek op Saterdag verkoop.\nDie totale aantal boksies appelkoek wat Sunny verkoop het is 15 + 11 = <<15+11=26>>26.\nHy het 26*R15 = R<<26*15=390>>390 verdien vir die verkoop van appelkoek.\nDus, het Sunny R150 + R390 = R<<150+390=540>>540 vir twee dae verdien.\n#### 540\n"
