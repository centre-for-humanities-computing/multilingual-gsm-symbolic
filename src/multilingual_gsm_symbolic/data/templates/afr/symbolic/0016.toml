answer_annotated = "Hy het {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} boksies {food} op {d2} verkoop.\nDie totale aantal boksies {food} wat {name} verkoop het is {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} het {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} verdien vir die verkoop van {food}.\nHy het {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} boksies {fruit} op {d1} verkoop.\nDie totale aantal boksies {fruit} wat {name} verkoop het is {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nHy het {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} verdien vir die verkoop van {fruit}.\nDus, het {name} {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} vir twee dae verdien.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
