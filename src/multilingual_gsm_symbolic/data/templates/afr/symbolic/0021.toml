question = "Frankie kyk TV nadat hy sy huiswerk elke nag klaar maak. Op Maandag en Dinsdag, het hy 'n 1-uur episode van sy gunstelingprogram elke nag gesien. Op Woensdag, het hy 'n paar episodes van 'n 30-minuut program gesien. Op Donderdag, het hy sy huiswerk vroeg klaar gemaak en 'n 1-uur episode en 'n 30-minuut program gesien. Op Vrydag, kon hy laat opbly, so hy het twee 1-uur episodes gesien. As hy in totaal 7 ure TV gesien het, hoeveel 30-minuut episodes het hy op Woensdag gesien?"
