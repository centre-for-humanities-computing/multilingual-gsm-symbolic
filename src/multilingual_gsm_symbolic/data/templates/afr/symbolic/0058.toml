question = "Een gnome kan 12 kilogram erts per dag met sy blote hande myn. Hy kan twee keer soveel met 'n brons mynpik myn en 50% meer met 'n staal mynpik as met 'n brons mynpik. Hoeveel kilogram erts kan 40 gnomes met staal mynpiks in 'n maand met 30 dae myn?"
answer = "Eers uitvind hoeveel erts 'n gnome met 'n brons mynpik kan myn: 12 kilogram/dag*2=<<12*2=24>>24 kilogram/dag\nVermenigvuldig dan daardie hoeveelheid met 150% om te vind hoeveel 'n gnome met 'n staal mynpik kan myn: 24 kilogram/dag * 150% = <<24*150*.01=36>>36 kilogram/dag\nVermenigvuldig dan die hoeveelheid wat een gnome in 'n dag met 'n staal mynpik kan myn met die aantal gnomes: 36 kilogram/dag/gnome * 40 gnomes = <<36*40=1440>>1440 kilogram/dag\nVermenigvuldig dan die daaglikse hoeveelheid erts met die aantal dae om die totale erts wat in 'n maand ontgin word te vind: 1440 kilogram/dag * 30 dae = <<1440*30=43200>>43,200 kilogram/dag\n#### 43200\n"
