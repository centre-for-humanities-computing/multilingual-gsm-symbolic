question = "'n hospitaal het 'n kapasiteit van 1000 beddens met 1/5 beset. As gevolg van die koronavirusuitbraak, word 50 pasiënte elke dag in die hospitaal opgeneem. Bereken die totale aantal onbesete beddens in die hospitaal na 2 weke."
