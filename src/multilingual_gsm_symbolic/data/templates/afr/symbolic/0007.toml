question = "'n Boer koop voer vir sy perde. Hy koop 'n verskeidenheid hooi, hawer, wortels en suikerblokkies. Aangesien suikerblokkies 'n seldsame lekkerny is, koop hy slegs twee 1-pond bokse daarvan vir die hele stal. Hy wil net genoeg wortels hê om die perde te voed terwyl die groente vars is, so hy koop vier 12-pond sakke. Hooi is die hoofdieet van sy perde, so hy koop twee-en-veertig 75-pond pakkies. Hawer is 'n basis om die hooi aan te vul, so hy koop twintig 65-pond sakke. As sy plaasvragmotor 2250 pond op 'n slag kan dra, hoeveel reise moet die boer maak om al die voer te vervoer?"
