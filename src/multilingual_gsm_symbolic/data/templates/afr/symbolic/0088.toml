question = "Dana kan vier keer vinniger hardloop as wat sy kan stap, maar sy kan spring teen 'n spoed wat half so vinnig is as wat sy kan hardloop. As sy kan spring teen 3 kilometer per uur, hoeveel kilometer kan sy afleg in ses ure as sy een derde van die tyd hardloop en twee derdes van die tyd stap?"
answer = "As Dana kan spring teen half die spoed wat sy kan hardloop, dan kan sy hardloop teen 3*2=<<3*2=6>>6 kilometer per uur.\nEn aangesien sy kan hardloop teen 'n spoed wat vier keer vinniger is as wat sy kan stap, beteken dit sy kan stap teen 6/4=1.5 kilometer per uur.\nAs twee derdes van die tyd spandeer word aan stap, dan stap sy vir 6*2/3=<<6*2/3=4>>4 ure.\nAs een derde van die tyd spandeer word aan hardloop, dan hardloop sy vir 6-4=<<6-4=2>>2 ure.\nDus, hardloop sy vir 2 ure teen 6 kilometer per uur, of 2*6=<<2*6=12>>12 kilometer.\nSy stap vir 4 ure teen 1.5 kilometer per uur, of 4*1.5=<<4*1.5=6>>6 kilometer.\nDus, in totaal, reis sy 12+6=<<12+6=18>>18 kilometer.\n#### 18\n"
