question = "{name, Péter} különböző méretű jégkockákat szeretne készíteni {n,32} {unit,gram} vízből. Készíthet óriás kockákat, amelyek {w1,4} {unit,gram} vizet használnak kockánként, közepes kockákat, amelyek {w2,2} {unit,gram} vizet, és kis kockákat, amelyek {w3,1/2} {unit,gram} vizet használnak. Ha {n1,3} óriás kockát, {n2,7} közepes kockát és {n3,8} kis kockát készít, hány {unit,gram} víz marad neki?\n\n#init:\n- name = sample(names_male)\n- unit = sample([\"gram\", \"g\"])\n- $w1 = range(4, 10)\n- $w2 = range(2, 10)\n- $w3 = sample(fractions)\n- $n1 = range(3, 10)\n- $n2 = range(7, 13)\n- $n3 = sample([8, 14, 24, 15])\n- $n = range(32, 240, 4)\n\n#conditions:\n- w3 < w2 < w1\n- is_int(n3 * w3)\n- n - (n1*w1) - (n2*w2) - int(n3*w3) > 0\n\n#answer: (n - (n1*w1) - (n2*w2) - int(n3*w3))\n"
answer = "Az óriás kockák {n1*w1} {unit} vizet használtak fel, mert {n1} szorozva {w1} egyenlő <<{n1}*{w1}={n1*w1}>>{n1*w1}.\nA közepes kockák {n2*w2} {unit} vizet használtak fel, mert {n2} szorozva {w2} egyenlő <<{n2}*{w2}={n2*w2}>>{n2*w2}.\nA kis kockák {int(w3*n3)} {unit} vizet használtak fel, mert {n3} szorozva {w3} egyenlő {int(n3*w3)}.\nEz azt jelenti, hogy {name} összesen {int(n3*w3+n2*w2+n1*w1)} {unit} vizet használt fel, mert {n1*w1} plusz {n2*w2} plusz {int(w3*n3)} egyenlő {int(n3*w3+n2*w2+n1*w1)}.\n{name} {n - (n1*w1) - (n2*w2) - int(n3*w3)} {unit} vizet hagyott meg, mert {n} mínusz {int(n3*w3+n2*w2+n1*w1)} egyenlő <<{n}-{int(n3*w3+n2*w2+n1*w1)}={n - (n1*w1) - (n2*w2) - int(n3*w3)}>>{n - (n1*w1) - (n2*w2) - int(n3*w3)}.\n#### {n - (n1*w1) - (n2*w2) - int(n3*w3)}\n"
