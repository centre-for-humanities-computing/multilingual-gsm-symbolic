question = "Sally nyaralásra ment a tengerpartra. Szülei $15-t adtak neki, hogy vegyen, amit csak akar. Az emléktárgyboltban a taffy akcióban volt: \"Vegyél 1 fontot $3/font áron, kapj 1 fontot 1/2 áron.\" 4 fontot merített ki. Egy vegyes kagylócsomagot is vett $1.5-ért és 4 mágnes, amelyek mindegyike $0.25 volt. Mennyi pénze maradt Sally-nak?"
answer = "Sally 1 fontot vesz $3-ért és kap 1 fontot 1/2 áron. Tehát 1/2 az 1 font árának $3*1/2 = $1.5. A maradék 2 font nem kedvezményes és 2*$3 = $6 áron van, így az összköltség $3+$3/2+$6=$21/2\n4 mágnes $0.25 áron mindegyik, azaz 4*0.25=$<<4*0.25=1>>1\nHa összeadjuk az összes vásárlást, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\n$15 volt és $13-t költött, így $15-$13 = $<<15-13=2>>2 maradt.\n#### 2\n"
