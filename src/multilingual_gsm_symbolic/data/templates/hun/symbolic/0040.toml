question = "Sally nyaralásra ment a tengerpartra. Szülei $15-t adtak neki, hogy vegyen, amit csak akar. Az emléktárgyboltban a taffy akcióban volt: \"Vegyél 500 grammot $3-ért, kapj 500 grammot 1/2 áron.\" 2000 grammot merített ki. Egy vegyes kagylócsomagot is vett $1.5-ért és 4 mágnes, amelyek mindegyike $0.25 volt. Mennyi pénze maradt Sally-nak?"
answer = "A taffy $3 500 grammért és kap 500 grammot 1/2 áron. Tehát 1/2 az 500 gramm árának 500/500*1/2*$3 = $1.5.\nEgyütt ez $3 + $1.5 = $4.5.\nA maradék 1000 gramm nem kedvezményes és $6 áron van, így az összköltség $3 + $1.5 + $6 = $<<3 + 1.5 + 6 = 10.5>>10.5\n4 mágnes $0.25 áron mindegyik, azaz 4*$0.25=$<<4*0.25=1>>1\nHa összeadjuk az összes vásárlást, $10.5 + $1.5 + $1 = $<<10.5+1.5+1=13>>13\n$15 volt és $13-t költött, így $15 - $13 = $<<15-13=2>>2 maradt.\n#### 2\n"
