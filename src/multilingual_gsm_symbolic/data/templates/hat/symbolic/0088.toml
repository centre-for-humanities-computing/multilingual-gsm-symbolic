question = "Dana ka kouri kat fwa pi vit pase lè l ap mache, men li ka sote a yon vitès ki se mwatye nan vitès lè l ap kouri. Si li ka sote a 3 mil a lè, konbyen mil li ka vwayaje nan sis èdtan si l pase yon twazyèm nan tan an ap kouri ak de twazyèm nan tan an ap mache?"
answer = "Si Dana ka sote a mwatye nan vitès lè l ap kouri, alò lè l ap kouri li ka fè 3*2=<<3*2=6>>6 mil a lè.\nEpi depi li ka kouri a yon vitès ki se kat fwa pi vit pase lè l ap mache, sa vle di lè l ap mache li ka fè 6/4=1.5 mil a lè.\nSi de twazyèm nan tan an pase ap mache, alò l ap mache pou 6*3/5=<<6*3/5=18/5>>18/5 èdtan.\nSi yon twazyèm nan tan an pase ap kouri, alò l ap kouri pou 6-18/5=<<6-18/5=18/5>>18/5 èdtan.\nSe konsa, li kouri pou 18/5 èdtan a 6 mil a lè, oswa 18/5*6=<<18/5*6=108/5>>108/5 mil.\nLi mache pou 18/5 èdtan a 1.5 mil a lè, oswa 18/5*1.5=<<18/5*1.5=27/5>>27/5 mil.\nSe konsa, an tout, li vwayaje 108/5+27/5=<<108/5+27/5=27>>27 mil.\n#### 27"
