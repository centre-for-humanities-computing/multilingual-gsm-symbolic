question = "Sally te ale nan bord lanmè pou vakans. Paran l ba li $15 pou achte sa li te vle. Nan boutik souvenir an, tafi te gen pwomosyon pou \"Achte 1 liv a $3 pa liv, jwenn 1 liv 1/2 rabè.\" Li te ranmase 4 liv. Li te achte yon sak melanje konk pou $1.5 ak 4 aiman ki te $0.25 chak. Konbyen lajan Sally gen anbo?"
