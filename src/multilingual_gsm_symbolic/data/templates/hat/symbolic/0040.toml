question_annotated = "{name,Sally} te ale nan bord lanmè pou vakans. Paran l ba li ${total,15} pou achte sa li te vle. Nan boutik souvenir an, tafi te gen pwomosyon pou \"Achte {n1,1} liv a ${p1,3} pa liv, jwenn {n2,1} liv {discount,1/2} rabè.\" Li te ranmase {n12,4} liv. Li te achte yon sak melanje konk pou ${p2,1.5} ak {n3,4} aiman ki te ${p3,0.25} chak. Konbyen lajan {name,Sally} gen anbo?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
