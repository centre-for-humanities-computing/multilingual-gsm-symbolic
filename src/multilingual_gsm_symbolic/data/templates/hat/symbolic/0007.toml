question = "Yon kiltivatè ap achte manje pou cheval li yo. Li achte divès kalite foin, avwa, kawòt ak kare sik. Piske kare sik se yon trete ra, li achte sèlman de bwat 1-liv nan yo pou tout estab la. Li sèlman vle ase kawòt pou manje cheval yo pandan legim yo fre, konsa li achte kat sak 12-liv. Foin se rejim prensipal cheval li yo, konsa li achte katrventde pak 75-liv. Avwa se yon manje debaz pou konplete foin an, konsa li achte ven sak 65-liv. Si kamyon fèm li a ka pote 2250 liv a yon sèl fwa, konbyen vwayaj kiltivatè a bezwen pou transpòte tout manje a?"
answer = "Kiltivatè a ap achte 2*1 = <<2*1=2>>2 liv kare sik.\nLi ap achte 4*12 = <<4*12=48>>48 liv kawòt.\nLi ap achte 20*65 = <<20*65=1300>>1300 liv avwa.\nLi ap achte 42*75 = <<42*75=3150>>3150 liv foin.\nPwa tout manje a se 2 + 48 + 1300 + 3150 = <<2+48+1300+3150=4500>>4500 liv.\nKonsa, kiltivatè a bezwen 4500 / 2250 = <<4500/2250=2>>2 vwayaj pou transpòte tout manje a nan kamyon fèm li a.\n#### 2\n"
