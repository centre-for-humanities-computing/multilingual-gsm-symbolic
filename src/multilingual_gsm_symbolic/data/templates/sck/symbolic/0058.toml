question = "Ek gnome apne nange haath se din mein 12 paun dhatu nikal sakta hai. Usse kanse ke khurpe se dugguna zyada nikal sakta hai aur lohe ke khurpe se kanse ke khurpe se 50% zyada. 30 din ke mahine mein 40 gnome lohe ke khurpe se kitna paun dhatu nikal sakte hain?"
answer = "Sabse pehle dekhein ki ek gnome kanse ke khurpe se kitna dhatu nikal sakta hai: 12 paun/din*5=<<12*5=60>>60 paun/din\nPhir us rakam ko 150% se guna karein taaki pata chale ki ek gnome lohe ke khurpe se kitna nikal sakta hai: 60 paun/din * 150% = <<60*150*.01=90>>90 paun/din\nPhir ek din mein ek gnome ke lohe ke khurpe se nikalne wali rakam ko gnome ki sankhya se guna karein: 90 paun/din/gnome * 40 gnomes = <<90*40=3600>>3600 paun/din\nPhir dainik dhatu ki rakam ko dino ki sankhya se guna karein taaki mahine mein nikle hue kul dhatu pata chale: 3600 paun/din * 30 din = <<3600*30=108000>>108,000 paun/din\n#### 108000\n"
