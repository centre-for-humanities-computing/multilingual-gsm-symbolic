question = "राजकुमार थड्डियस ने 100 नाग को अपने शक्तिशाली तलवार से मारे, जबकि राजकुमार आर्थर, भाला का इस्तेमाल करके, तीन चौथाई उतने नाग मारे जितने राजकुमार थड्डियस ने। जंग लगी लोहे की कुल्हाड़ी का इस्तेमाल करके, राजकुमार वॉल्टर ने दुगना उतने नाग मारे जितने राजकुमार आर्थर ने। लेकिन राजकुमार ब्रूस, घर पर अपनी तलवार भूल के, नाखून फाइल का इस्तेमाल करके एक पाँचवाँ उतने नाग मारे जितने राजकुमार वॉल्टर ने। राजकुमार ब्रूस ने कितने नाग मारे?"
