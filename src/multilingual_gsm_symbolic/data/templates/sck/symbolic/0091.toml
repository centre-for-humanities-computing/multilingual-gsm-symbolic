question = "Allan ke ghar me, makkas ki sankhya mithais se do guna hai. Uske ghar me kul 40 mithais hain. Allan ne dukan se 60 aur mithais khareede aur mithais ki sankhya se 40 kam makkas. Pata karo ki Allan ke ghar me kul makkas aur mithais kitne hain?"
