question = "Artie ke paas kisan bazar mein ek phool ka stall hai. Woh teen tarah ke phool bechta hai: genda, petunia aur begonia. Woh aamtaur par genda ko ghada ke liye $2.74 mein bechta hai, petunia ko ghada ke liye $1.87 aur begonia ko ghada ke liye $2.12 mein. Artie ke paas aaj chhote sikke nahi hain, isliye usne faisla kiya hai ki saari keemat ko sabse kareebi rupia tak ginte. Agar Artie 12 ghada genda bechta hai, 9 ghada petunia aur 17 ghada begonia, to woh kitna kamayega?"
