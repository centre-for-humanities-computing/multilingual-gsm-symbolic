question = "Sally chutti ke liye samundar kinare gayi. Uske mata-pita ne use $15 diye taaki wo jo bhi chahti thi wo khareed sake. Souvenir dukaan par, taffy par sale thi \"1 paun $3 prati paun par khareedo, 1 paun par 1/2 chhoot paao.\" Usne 4 paun utha liye. Usne samundar ke kankar ka ek mix bag bhi $1.5 mein khareeda aur 4 magnet jo $0.25 prati the. Sally ke paas kitne paise bache?"
