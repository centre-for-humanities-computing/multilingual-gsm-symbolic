question = "अस्पताल की क्षमता 1000 बिस्तरs है जिसमें 1/5 भरे हुए हैं। कोरोनवायरस प्रकोप के कारण, 50 मरीज प्रतिदिन अस्पताल में भर्ती होते हैं। 2 हफ्ते बाद अस्पताल में कुल कितने बिस्तरs खाली रहेंगे, इसकी गणना करें।"
answer = "यदि अस्पताल के बिस्तरs की कुल क्षमता का 1/5 भरा हुआ है, तो इसका मतलब है 1/5 * 1000 = <<1000*1/5=200>>200 बिस्तरs पर मरीजों का उपयोग है।\nनए भर्ती के बिना अस्पताल में बिस्तरs की कुल संख्या 1000 बिस्तरs - 200 बिस्तरs = <<1000-200=800>>800 बिस्तरs है।\nयदि प्रतिदिन 50 लोग भर्ती होते हैं, तो एक हफ्ते बाद अस्पताल में मरीजों की कुल संख्या 50 मरीज/दिन * 7 दिन/हफ्ता = 350 मरीज है।\n2 हफ्ते बाद, अस्पताल में भर्ती किए गए मरीजों की कुल संख्या 350 मरीज/हफ्ता * 2 हफ्ता = <<350*2=700>>700 मरीज है, जो प्रत्येक एक बिस्तर का उपयोग करते हैं।\nयदि नए भर्ती से पहले अस्पताल में 800 बिस्तरs खाली थे, तो कुल संख्या घटकर 800 बिस्तरs - 700 बिस्तरs = <<800-700=100>>100 खाली बिस्तरs रहती है।\n#### 100\n"
