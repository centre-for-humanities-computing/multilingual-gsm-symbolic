question = "Sunny jingar bread aur seb pie fund jama karne ke liye bech raha hai. Shanibar ke din, usne 10 dabbi jingar bread aur 4 kam dabbi seb pie, ravivar se bikri ki. Ravivar ke din, usne shanibar se 5 zyada dabbi jingar bread aur 15 dabbi seb pie bikri ki. Agar jingar bread ka daam ₹6 hai aur seb pie ka daam ₹15 hai, toh sunny ne do din ke liye kitna kamaya?"
answer = "Usne ravivar par jingar bread ke 10 + 5 = <<10+5=15>>15 dabbi bikri ki.\nJingar bread ki kul dabbi sankhya jo sunny ne bikri ki, wo 10 + 15 = <<10+15=25>>25 hai.\nSunny ne jingar bread bikane par 25*₹6 = ₹<<25*6=150>>150 kamaye.\nUsne shanibar par seb pie ke 15 - 4 = <<15-4=11>>11 dabbi bikri ki.\nSeb pie ki kul dabbi sankhya jo sunny ne bikri ki, wo 15 + 11 = <<15+11=26>>26 hai.\nUsne seb pie bikane par 26*₹15 = ₹<<26*15=390>>390 kamaye.\nIsliye, sunny ne do din ke liye ₹150 + ₹390 = ₹<<150+390=540>>540 kamaye.\n#### 540\n"
