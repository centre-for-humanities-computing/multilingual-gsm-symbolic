answer_annotated = "Usne {d2} par {food} ke {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} dabbi bikri ki.\n{food} ki kul dabbi sankhya jo {name} ne bikri ki, wo {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2} hai.\n{name} ne {food} bikane par {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} kamaye.\nUsne {d1} par {fruit} pie ke {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} dabbi bikri ki.\n{fruit} pie ki kul dabbi sankhya jo {name} ne bikri ki, wo {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1} hai.\nUsne {fruit} pie bikane par {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} kamaye.\nIsliye, {name} ne do din ke liye {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} kamaye.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
