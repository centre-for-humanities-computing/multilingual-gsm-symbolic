question = "Salli dam olish uchun dengiz sohiliga bordi. Ota-onasi unga xohlagan narsasini sotib olish uchun $15 berdilar. Suvvenir do'konida taffi sotuvda bo'ldi: \"1 funt $3 dan, 1 funt 1/2 chegirmaga ega.\" U 4 funt olib ketdi. U shuningdek 1.5 ga aralash dengiz qobiqlarini va har biri $0.25 dan 4 ta magnit sotib oldi. Salli da qancha pul qoldi?"
answer = "Salli 1 funt $3 dan sotib olmoqda va 1 funt 1/2 chegirmaga ega. Shunday qilib, 1 funt uchun 1/2 chegirma $3*1/2 = $1.5 ga teng. Qolgan 2 funt chegirmaga ega emas va narxi 2*$3 = $6, shuning uchun umumiy summa $3+$3/2+$6=$21/2\n4 ta magnit har biri $0.25 dan 4*0.25=$<<4*0.25=1>>1\nUning barcha xaridlarini qo'shganda, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nUning $15 puli bor edi va $13 sarfladi, shuning uchun u $15-$13 = $<<15-13=2>>2 qoldi\n#### 2\n"
