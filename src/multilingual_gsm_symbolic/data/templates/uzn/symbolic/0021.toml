question = "Frankie har kuni uy vazifasini bajarib bo'lgandan so'ng televizor ko'radi. Dushanba va seshanba kunlari u har kecha o'z sevimli ko'rsatuvidan 1-soatlik epizodni ko'rdi. Chorshanba kuni u 30-minutlik ko'rsatuvning bir nechta epizodini ko'rdi. Payshanba kuni u uy vazifasini erta tugatdi va 1-soatlik epizod bilan birga 30-minutlik ko'rsatuvni ham ko'rdi. Juma kuni u kechqurun uxlashga ruxsat oldi, shuning uchun u ikkita 1-soatlik epizodni ko'rdi. Agar u jami 7 soat televizor ko'rgan bo'lsa, chorshanba kuni u nechta 30-minutlik epizodni ko'rdi?"
