question = "Ovqatlanish ma'lumotiga ko'ra, chips paketi har bir porsiya uchun 250 kaloriya ga ega. Agar 300 gramli paketi 5 porsiya bo'lsa, kunlik kaloriya maqsadingiz 2000 va siz allaqachon 1800 kaloriya iste'mol qilgan bo'lsangiz, nechta gram yeyishingiz mumkin?"
answer = "Agar umumiy kaloriya maqsadi 2000 bo'lsa va men 1800 kaloriya iste'mol qilsam, unda yeyish uchun 2000-1800 = <<2000-1800=200>>200 kaloriya qoladi\nAgar chipsning har bir porsiya 250 kaloriya bo'lsa va men faqat 200 kaloriya yeyish uchun qolganda, unda men faqat 200/250 porsiya yeyishim mumkin = 4/5 porsiya\nBundan tashqari, 300 gramli chips paketi 5 porsiya ekanligini bilamiz, shuning uchun har bir porsiya 300 gram/5 = <<300/5=60>>60 gramga teng\nAgar men faqat 4/5 porsiya yeyishim mumkin bo'lsa, unda men faqat 60 gram * 4/5 = 48 gram yeyishim mumkin\n#### 48\n"
