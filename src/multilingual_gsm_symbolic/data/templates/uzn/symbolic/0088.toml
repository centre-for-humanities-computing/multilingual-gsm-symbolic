question = "Dana yurishdan ko'ra to'rt marta tezroq yugura oladi, lekin u yugurish tezligining yarmi tezlikda sakray oladi. Agar u soatiga 3 mil tezlikda sakray olsa, olti soatda qancha mil bosib o'tadi, agar u vaqtning uchdan biri qismini yugurishga va uchdan ikki qismini yurishga sarflasa?"
answer = "Agar Dana yugurish tezligining yarmi tezlikda sakray olsa, u holda u 3*5/3=<<3*5/3=5>>5 soatiga mil tezlikda yuguradi.\nVa u yurish tezligidan to'rt marta tezroq yugura oladigan bo'lgani uchun, bu uning 5/4=1.25 soatiga mil tezlikda yura oladiganini anglatadi.\nAgar vaqtning uchdan ikki qismi yurishga sarflansa, u holda u 6*2/3=<<6*2/3=4>>4 soat yuradi.\nAgar vaqtning uchdan biri qismi yugurishga sarflansa, u holda u 6-4=<<6-4=18/5>>18/5 soat yuguradi.\nShunday qilib, u 5 soatiga mil tezlikda 18/5 soat yuguradi, ya'ni 18/5*5=<<18/5*5=18>>18 mil.\nU 1.25 soatiga mil tezlikda 4 soat yuradi, ya'ni 4*1.25=<<4*1.25=5>>5 mil.\nShunday qilib, jami, u 18+5=<<18+5=23>>23 mil bosib o'tadi.\n#### 23\n"
