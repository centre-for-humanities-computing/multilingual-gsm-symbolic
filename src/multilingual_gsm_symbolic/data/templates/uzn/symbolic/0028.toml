question = "Bir kasalxonaning sig'imi 1000 yotoqlar bo'lib, 1/5 qismi band. Koronavirus tarqalishi tufayli, har kuni 50 bemor kasalxonaga qabul qilinadi. 2 hafta o'tgach kasalxonadagi bo'sh qolgan yotoqlarning umumiy sonini hisoblang."
answer = "Agar kasalxonadagi yotoqlarning umumiy sig'imining 1/5 qismi band bo'lsa, bu 1/5 * 1000 = <<1000*1/5=200>>200 yotoqlarda bemorlar borligini anglatadi.\nYangi qabullarsiz kasalxonadagi yotoqlarning umumiy soni 1000 yotoq - 200 yotoq = <<1000-200=800>>800 yotoq.\nAgar har kuni 50 kishi qabul qilinsa, bir hafta o'tgach kasalxonadagi bemorlarning umumiy soni 50 bemor/kun * 7 kun/hafta = 350 bemor.\n2 hafta o'tgach, kasalxonaga qabul qilingan bemorlarning umumiy soni 350 bemor/hafta * 2 hafta = <<350*2=700>>700 bemor, har biri bitta yotoqdan foydalanadi.\nAgar yangi qabullardan oldin kasalxonada 800 ta bo'sh yotoq bo'lsa, umumiy son 800 yotoq - 700 yotoq = <<800-700=100>>100 bo'sh yotoqga kamayadi.\n#### 100\n"
