answer_annotated = "Agar {facility}dagi {item}larning umumiy sig'imining {frac} qismi band bo'lsa, bu {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item}larda bemorlar borligini anglatadi.\nYangi qabullarsiz {facility}dagi {item}larning umumiy soni {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}.\nAgar har kuni {daily} kishi qabul qilinsa, bir hafta o'tgach {facility}dagi bemorlarning umumiy soni {daily} bemor/kun * 7 kun/hafta = {daily*7} bemor.\n{period} hafta o'tgach, {facility}ga qabul qilingan bemorlarning umumiy soni {daily*7} bemor/hafta * {period} hafta = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} bemor, har biri bitta {item}dan foydalanadi.\nAgar yangi qabullardan oldin {facility}da {total-int(total*frac)} ta bo'sh {item} bo'lsa, umumiy son {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} bo'sh {item}ga kamayadi.\n#### {total - (total * frac + daily * period * 7)}\n"
