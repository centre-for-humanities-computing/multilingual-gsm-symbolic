question = "Nate ले आफ्नो पाल्तु जनावरहरूलाई घाँस खुवाइरहेको छ। प्रत्येक बाख्रा लाई 5 पाउन्ड चाहिन्छ, र प्रत्येक लामा लाई प्रत्येक बाख्रा ले आवश्यक पर्ने मात्राको दुई गुणा भन्दा 3 पाउन्ड कम चाहिन्छ। यदि 15 बाख्रा हरू र 12 लामा हरू छन् भने, Nate ले कति पाउन्ड घाँस चाहिन्छ?"
