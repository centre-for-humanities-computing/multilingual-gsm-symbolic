question = "कारोल र जेनिफर लस एन्जलस की बहिनी हुन् जसले सेलिब्रेटीहरू का हस्ताक्षर संकलन गर्न रुचाउँछन्। विद्यालयको गर्मी छुट्टी को समयमा, बहिनीहरूले हरेक दिउँसो हस्ताक्षर संकलन गर्छन्। पाँच हप्ता पछि, कारोल र जेनिफर ले आफ्नो अटोग्राफ बुकहरू तुलना गर्छन्, प्रत्येक बहिनीले संकलन गरेको हस्ताक्षरको संख्या गनिन्छ। कारोल को बुकमा 20 हस्ताक्षर छन्, र जेनिफर को 44 छन्। बहिनीहरूको तीन थप हप्ताको गर्मी छुट्टी बाँकी छ, र उनीहरूले छुट्टीको अन्त्यसम्म आफूहरू बीच 100 हस्ताक्षर पुर्‍याउन चाहन्छन्। उनीहरूले आफ्नो लक्ष्य पुर्‍याउन कति हस्ताक्षर संकलन गर्नुपर्छ?"
