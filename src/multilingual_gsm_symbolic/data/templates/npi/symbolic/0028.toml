question = "एउटा अस्पताल को क्षमता 1000 शय्याs छ जसमा 1/5 ओगटिएको छ। कोरोना भाइरसको प्रकोप को कारण, 50 रोगीहरूलाई प्रतिदिन अस्पताल मा भर्ना गरिन्छ। 2 हप्ता पछि अस्पताल मा खाली रहेका शय्याs को कुल संख्या गणना गर्नुहोस्।"
answer = "यदि अस्पताल को शय्याs को कुल क्षमताको 1/5 ओगटिएको छ भने, यसको अर्थ 1/5 * 1000 = <<1000*1/5=200>>200 शय्याs मा रोगीहरू छन्।\nनयाँ भर्ना बिना अस्पताल मा रहेका शय्याs को कुल संख्या 1000 शय्याs - 200 शय्याs = <<1000-200=800>>800 शय्याs हो।\nयदि 50 जनालाई प्रतिदिन भर्ना गरिन्छ भने, एक हप्ता पछि अस्पताल मा रोगीहरूको कुल संख्या 50 रोगी/दिन * 7 दिन/हप्ता = 350 रोगीहरू हुन्छन्।\n2 हप्ता पछि, अस्पताल मा भर्ना गरिएका रोगीहरूको कुल संख्या 350 रोगी/हप्ता * 2 हप्ता = <<350*2=700>>700 रोगीहरू हुन्छन्, जसले प्रत्येकले एउटा शय्या प्रयोग गर्छन्।\nनयाँ भर्ना अघि अस्पताल मा 800 खाली शय्याs थिए भने, कुल संख्या घटेर 800 शय्याs - 700 शय्याs = <<800-700=100>>100 खाली शय्याs हुन्छ।\n#### 100\n"
