question = "श्री Tan ले आफ्नो घर $400,000 मा बेच्नु भयो। उसले बिक्री मूल्यको 3% बराबर हुने हस्तान्तरण शुल्क तिर्नु भयो र बिक्री मूल्यको 5% बराबर हुने दलाली शुल्क पनि तिर्नु भयो। यदि उसले घर को बाँकी रहेको ऋण रकमको लागि $250,000 पनि तिर्न भयो भने, घर बेच्नबाट श्री Tan को शुद्ध रकम कति हुन्छ?"
