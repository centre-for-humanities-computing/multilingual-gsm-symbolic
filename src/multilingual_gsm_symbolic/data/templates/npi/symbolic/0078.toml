answer_annotated = "उहाँले दिनमा {n1}+{n2}=<<{n1}+{n2}={n1+n2}>>{n1+n2} कक्षा लिनुहुन्छ\nत्यसको अर्थ उहाँले दिनमा कक्षामा {t}*{n1+n2}=<<{t}*{n1+n2}={t*(n1+n2)}>>{t*(n1+n2)} मिनेट बिताउनुहुन्छ\nत्यसैले उहाँले हप्तामा {t*(n1+n2)}*{d}=<<{t*(n1+n2)}*{d}={t*(n1+n2)*d}>>{t*(n1+n2)*d} मिनेट बिताउनुहुन्छ\nत्यसको अर्थ उहाँले शनिबार र आइतबारमा प्रत्येक {t*(n1+n2)*d}*{frac}=<<{t*(n1+n2)*d}*{frac}={int((n1 + n2) * t * d * frac)}>>{int((n1 + n2) * t * d * frac)} मिनेट बिताउनुहुन्छ\nत्यसैले उहाँले हप्तामा {t*(n1+n2)*d}+{int((n1 + n2) * t * d * frac)}+{int((n1 + n2) * t * d * frac)}=<<{t*(n1+n2)*d}+{int((n1 + n2) * t * d * frac)}+{int((n1 + n2) * t * d * frac)}={t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)}>>{t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)} मिनेट बिताउनुहुन्छ\nत्यसैले उहाँले हप्तामा {t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)}/60=<<{t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)}/60={((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60}>>{((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60} घण्टा बिताउनुहुन्छ\n#### {((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60}\n"
