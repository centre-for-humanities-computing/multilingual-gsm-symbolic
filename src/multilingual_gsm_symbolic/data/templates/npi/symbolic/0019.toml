question = "60 वटा प्रश्न भएको क्विजमा, प्रश्नहरूको 40% sahaj हुन्छन्, र बाँकी प्रश्नहरू बराबर रूपमा औसत र कठिन प्रश्नहरूमा विभाजित हुन्छन्। यदि Aries ले sahaj प्रश्नहरूको 75% निश्चित रूपमा उत्तर दिन्छन् भने, र औसत र कठिन प्रश्नहरूको आधा सही उत्तर दिन्छन् भने, उनी निश्चित रूपमा कति अंक प्राप्त गर्नेछिन्?"
answer = "औसत र कठिन प्रश्नहरूले क्विजको 100% - 40% = 60% गठन गर्दछन्।\n60 प्रश्नहरूमा 40/100 = <<60*40/100=24>>24 वटा sahaj प्रश्नहरू छन्।\nजम्मा 60 प्रश्नहरूमा 60/100 = <<60*60/100=36>>36 वटा औसत र कठिन प्रश्नहरू छन्।\nयदि Aries ले sahaj प्रश्नहरूको 75% निश्चित रूपमा प्राप्त गर्छिन् भने, यसको अर्थ उनी आफ्नो 24 प्रश्नहरूको 75/100 = <<24*75/100=18>>18 अंक निश्चित रूपमा पाउनेछिन्।\nऔसत र कठिन प्रश्नहरूबाट, उनी निश्चित रूपमा आधा सही उत्तर दिनेछिन् त्यसैले 36 प्रश्नहरू*1/2 = <<36*1/2=18>>18 अंक हुन्छ।\nत्यसैले, उनी आफ्नो क्विजमा 18 अंक + 18 अंक = <<18+18=36>>36 अंक निश्चित रूपमा प्राप्त गर्नेछिन्।\n#### 36\n"
