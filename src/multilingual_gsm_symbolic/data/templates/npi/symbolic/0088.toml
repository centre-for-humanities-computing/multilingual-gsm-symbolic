answer = "यदि दाना ले दौडन सक्ने गतिमा आधा गतिमा स्किप गर्न सक्छिन् भने, त्यसैले उनी 3*2=<<3*2=6>>6 माइल प्रति घण्टा गतिमा दौडन सक्छिन्।\nर किनकि उनी हिड्न सक्ने गतिमा चार गुणा छिटो दौडन सक्छिन्, यसको अर्थ उनी 6/5=1.2 माइल प्रति घण्टा गतिमा हिडन सक्छिन्।\nयदि समयको दुई तेस्रो हिस्सा हिड्नमा बिताइयो भने, त्यसैले उनी 6*2/3=<<6*2/3=4>>4 घण्टा हिड्छिन्।\nयदि समयको एक तेस्रो हिस्सा दौडनमा बिताइयो भने, त्यसैले उनी 6-4=<<6-4=2>>2 घण्टा दौड्छिन्।\nयसैले, उनी 2 घण्टा 6 माइल प्रति घण्टा गतिमा दौड्छिन्, वा 2*6=<<2*6=12>>12 माइल।\nउनी 4 घण्टा 1.2 माइल प्रति घण्टा गतिमा हिड्छिन्, वा 4*1.2=<<4*1.2=24/5>>24/5 माइल।\nयसैले, जम्मा, उनी 12+24/5=<<12+24/5=16>>16 माइल यात्रा गर्छिन्।\n#### 16\n"
