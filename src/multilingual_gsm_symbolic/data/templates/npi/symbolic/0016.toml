answer = "उसले आइतवार मा जिन्जरब्रेड का 10 + 5 = <<10+5=15>>15 बक्स बिक्री गर्यो।\nसन्नी ले बिक्री गरेको जिन्जरब्रेड को कुल बक्स संख्या 10 + 15 = <<10+15=25>>25 हो।\nजिन्जरब्रेड बिक्रीका लागि सन्नी ले 25*रू6 = रू<<25*6=150>>150 कमायो।\nउसले शनिवार मा सफरचन्द पाइका 15 - 4 = <<15-4=11>>11 बक्स बिक्री गर्यो।\nसन्नी ले बिक्री गरेको सफरचन्द पाइको कुल बक्स संख्या 15 + 11 = <<15+11=26>>26 हो।\nउसले सफरचन्द पाइ बिक्रीका लागि 26*रू15 = रू<<26*15=390>>390 कमायो।\nत्यसैले, सन्नी ले दुई दिनमा रू150 + रू390 = रू<<150+390=540>>540 कमायो।\n#### 540\n"
