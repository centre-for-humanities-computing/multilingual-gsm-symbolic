question_annotated = "{name,सली} रिहायको लागि समुद्र किनारमा गयो। उनका अभिभावकले उनलाई ${total,15} जुन कुनै पनि वस्तु किन्नको लागि दिए। सुभस्मिका पसलमा, ट्याफी छुटमा उपलब्ध थियो \"{n1,1} पाउन्ड ${p1,3} प्रति पाउन्डमा किन्नुहोस्, {n2,1} पाउन्डमा {discount,1/2} को छुट पाउनुहोस्।\" उसले {n12,4} पाउन्ड लिइन्। उनले ${p2,1.5} को मिश्रित शेलको ब्याग पनि किन्यो र ${p3,0.25} प्रतिके {n3,4} चुम्बकहरू। {name,सली} को कति पैसा बाँकी छ?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} ले ${p1} मा {n1} पाउन्ड किनिरहेको छ र {n2} पाउन्डमा {discount} को छुट पाउँछ। त्यसैले {n2} पाउन्डको {discount} छुट ${p1}*{discount} = ${float(n2*discount*p1)} हुन्छ। बाँकी {n12-n1-n2} पाउन्डमा छुट छैन र यसको मूल्य {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1} हुन्छ, त्यसैले कुल ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1} हुन्छ\n{n3} चुम्बकहरू ${p3} प्रतिके {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3} हुन्छ\nजब तपाईं उनका सबै खरिदहरू जोड्नुहुन्छ, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nउनकहाँ ${total} थियो र उनले ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} खर्च गरिन्, त्यसैले उनकहाँ ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} बाँकी थियो\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
