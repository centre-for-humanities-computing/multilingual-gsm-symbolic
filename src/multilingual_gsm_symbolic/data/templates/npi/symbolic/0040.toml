question = "सली रिहायको लागि समुद्र किनारमा गयो। उनका अभिभावकले उनलाई $15 जुन कुनै पनि वस्तु किन्नको लागि दिए। सुभस्मिका पसलमा, ट्याफी छुटमा उपलब्ध थियो \"1 पाउन्ड $3 प्रति पाउन्डमा किन्नुहोस्, 1 पाउन्डमा 1/2 को छुट पाउनुहोस्।\" उसले 4 पाउन्ड लिइन्। उनले $1.5 को मिश्रित शेलको ब्याग पनि किन्यो र $0.25 प्रतिके 4 चुम्बकहरू। सली को कति पैसा बाँकी छ?"
answer = "सली ले $3 मा 1 पाउन्ड किनिरहेको छ र 1 पाउन्डमा 1/2 को छुट पाउँछ। त्यसैले 1 पाउन्डको 1/2 छुट $3*1/2 = $1.5 हुन्छ। बाँकी 2 पाउन्डमा छुट छैन र यसको मूल्य 2*$3 = $6 हुन्छ, त्यसैले कुल $3+$3/2+$6=$21/2 हुन्छ\n4 चुम्बकहरू $0.25 प्रतिके 4*0.25=$<<4*0.25=1>>1 हुन्छ\nजब तपाईं उनका सबै खरिदहरू जोड्नुहुन्छ, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nउनकहाँ $15 थियो र उनले $13 खर्च गरिन्, त्यसैले उनकहाँ $15-$13 = $<<15-13=2>>2 बाँकी थियो\n#### 2\n"
