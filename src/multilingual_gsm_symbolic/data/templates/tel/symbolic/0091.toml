question = "అలన్ ఇంటిలో, మొక్కజొన్నలు కన్నోలిల కంటే రెండు రెట్లు ఎక్కువ ఉన్నాయి. అతనికి ఇంటిలో మొత్తం 40 కన్నోలిలు ఉన్నాయి. అలన్ దుకాణంలో 60 అదనపు కన్నోలిలు కొన్నాడు మరియు కన్నోలిల సంఖ్య కంటే 40 తక్కువ మొక్కజొన్నలు. ఇంటిలో అలన్ దగ్గర ఉన్న మొక్కజొన్నలు మరియు కన్నోలిల మొత్తం సంఖ్యను కనుగొనండి?"
