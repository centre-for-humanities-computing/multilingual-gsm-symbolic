question = "తౌలా బేకరీ కి వెళ్ళింది మరియు వివిధ రకాల పాస్ట్రీలు కొనుగోలు చేసింది. ఆమె 3 డజను డోనట్లు కొనుగోలు చేసింది, దీని ధర ప్రతి డజనుకు $68, 2 డజను మిని కేక్స్ దీని ధర ప్రతి డజనుకు $80, మరియు 6 డజను మిని చీజ్ కేక్స్ ప్రతి డజనుకు $55 ధర. మొత్తం ఖర్చు ఎంత?"
