question = "ఫ్రాంకి తన హోమ్‌వర్క్ పూర్తి చేసిన తర్వాత ప్రతి రాత్రి టీవీ చూస్తాడు. సోమవారం మరియు మంగళవారం, అతను ప్రతి రాత్రి తన ఇష్టమైన షో యొక్క 1-గంటల ఎపిసోడ్‌ను చూశాడు. బుధవారం, అతను 30-నిమిషాల షో యొక్క కొన్ని ఎపిసోడ్‌లను చూశాడు. గురువారం, అతను హోమ్‌వర్క్‌ను త్వరగా పూర్తి చేసి 1-గంటల ఎపిసోడ్ మరియు 30-నిమిషాల షోను చూశాడు. శుక్రవారం, అతను నిద్రపోవడానికి ఆలస్యం చేసుకున్నాడు, కాబట్టి అతను రెండు 1-గంటల ఎపిసోడ్‌లను చూశాడు. అతను మొత్తం 7 గంటల టీవీ చూస్తే, అతను బుధవారంన ఎన్ని 30-నిమిషాల ఎపిసోడ్‌లను చూశాడు?"
answer = "బుధవారంన అతను చూసిన ఎపిసోడ్ల సంఖ్యను E అనుకుందాం.\nసోమవారం తర్వాత, అతనికి 7 - 1 = <<7-1=6>>6 గంటల టీవీ సమయం మిగిలి ఉంది.\nమంగళవారం తర్వాత, అతనికి 6 - 1 = <<6-1=5>>5 గంటల టీవీ సమయం మిగిలి ఉంది.\nగురువారం తర్వాత, అతనికి 5 - 1 - 0.5 = 3.5 గంటల టీవీ సమయం మిగిలి ఉంది.\nశుక్రవారం తర్వాత, అతనికి 3.5 - 2 = 1.5 గంటల టీవీ సమయం మిగిలి ఉంది.\nప్రతి 30-నిమిషాల ఎపిసోడ్ 1/2 గంట.\nకాబట్టి, E = 1.5/0.5 = 3 ఎపిసోడ్లు.\n#### 3\n"
