question = "జాక్కి స్వయంగా ఆమె పన్నులు చేయాలా లేక ఒక అకౌంటెంట్ ని నియమించుకోవాలా అని నిర్ణయించుకోవడానికి ప్రయత్నిస్తుంది. ఆమె స్వయంగా చేస్తే, ఆమె 3 గంటల స్వేచ్ఛా పనిని తగ్గించుకోవాల్సి ఉంటుంది, దీనివల్ల ₹35/గంట ఆదాయం నష్టపోతుంది. ఆ అకౌంటెంట్ ₹90 ఛార్జీ తీసుకుంటాడు. ఆమె అకౌంటెంట్ ని నియమించుకుంటే ఆమెకు ఎంత ఎక్కువ డబ్బు ఉంటుంది?"
