question = "క్రేగ్ దగ్గర 2 $20 నోట్లు ఉన్నాయి. అతను ఆరు నీటి పిచికారిలు $2 చొప్పున కొంటాడు. అతను 3 నీటి బుడగల ప్యాకెట్లను $3 చొప్పున కూడా కొంటాడు. అతని దగ్గర ఎంత మిగులుతుంది?"
answer = "క్రేగ్ మొదట 2 * $20 = $<<2*20=40>>40 తో ప్రారంభిస్తాడు.\nక్రేగ్ నీటి పిచికారిలపై 6*$2 = $<<6*2=12>>12 ఖర్చు చేస్తాడు.\nక్రేగ్ నీటి బుడగలపై 3 ప్యాకెట్లు * $3 = $<<3*3=9>>9 ఖర్చు చేస్తాడు.\nమొత్తం క్రేగ్ ఖర్చు చేసిన మొత్తం $12 + $9 = $<<12+9=21>>21.\nక్రేగ్ దగ్గర $40 - $21 = $<<40-21=19>>19 మిగులుతుంది.\n#### 19\n"
