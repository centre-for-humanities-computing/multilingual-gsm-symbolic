question = "మార్త తన 3 మనుమల కోసం చలి దుస్తులు నేస్తున్నారు. వారు త్రిసంతానం, కాబట్టి వారందరికీ ఒకే పరిమాణం ఉంటుంది. ఆమె వారి ప్రతి ఒక్కరికి టోపీ, స్కార్ఫ్, స్వెటర్, మిట్టెన్స్, మరియు సాక్స్ తయారు చేయాలనుకుంటుంది. టోపీ తయారు చేయడానికి 2 ఉన్ని గుట్టలు పడుతాయి, స్కార్ఫ్ కోసం 4, స్వెటర్ కోసం 12, మిట్టెన్స్ జతకు 1, మరియు సాక్స్ జతకు 2 ఉన్ని గుట్టలు పడుతాయి. ఆమె కొనాల్సిన ఉన్ని గుట్టల సంఖ్య ఎంత?"
