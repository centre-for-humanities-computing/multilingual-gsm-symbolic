question = "సల్లీ విశ్రాంతి కోసం సముద్రతీరానికి వెళ్ళింది. ఆమె తల్లిదండ్రులు ఆమెకు $15 ఎక్కడైనా కొనడానికి ఇచ్చారు. సూవెనీర్ దుకాణంలో, టాఫీ అమ్మకంలో ఉంది \"Buy 1 pound at $3 per pound, get 1 pound 1/2 off.\" ఆమె 4 పౌండ్లు తీసుకుంది. ఆమె $1.5 కు సముద్రపు షెల్స్ కలిపిన బ్యాగ్ కూడా కొన్నది మరియు ప్రతి ఒక్కటి $0.25 చొప్పున 4 మ్యాగ్నెట్లు. సల్లీకి ఎంత డబ్బు మిగిలి ఉంది?"
answer = "సల్లీ 1 పౌండ్లు $3 కు కొనుగోలు చేస్తోంది మరియు 1 పౌండ్లు 1/2 తగ్గింపు పొందుతోంది. కాబట్టి 1 పౌండ్లపై 1/2 తగ్గింపు అంటే $3*1/2 = $1.5. మిగిలిన 2 పౌండ్లకు తగ్గింపు లేదు మరియు వాటి ఖర్చు 2*$3 = $6, కాబట్టి మొత్తం $3+$3/2+$6=$21/2\n4 మ్యాగ్నెట్లు ప్రతి ఒక్కటి $0.25 చొప్పున 4*0.25=$<<4*0.25=1>>1\nఆమె కొనుగోళ్లన్నింటినీ కలిపితే, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nఆమె వద్ద $15 ఉంది మరియు ఆమె ఖర్చు చేసింది $13 కాబట్టి ఆమె వద్ద $15-$13 = $<<15-13=2>>2 మిగిలి ఉంది\n#### 2\n"
