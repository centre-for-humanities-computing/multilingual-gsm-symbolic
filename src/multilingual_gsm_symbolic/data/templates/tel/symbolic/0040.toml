question_annotated = "{name,సల్లీ} విశ్రాంతి కోసం సముద్రతీరానికి వెళ్ళింది. ఆమె తల్లిదండ్రులు ఆమెకు ${total,15} ఎక్కడైనా కొనడానికి ఇచ్చారు. సూవెనీర్ దుకాణంలో, టాఫీ అమ్మకంలో ఉంది \"Buy {n1,1} pound at ${p1,3} per pound, get {n2,1} pound {discount,1/2} off.\" ఆమె {n12,4} పౌండ్లు తీసుకుంది. ఆమె ${p2,1.5} కు సముద్రపు షెల్స్ కలిపిన బ్యాగ్ కూడా కొన్నది మరియు ప్రతి ఒక్కటి ${p3,0.25} చొప్పున {n3,4} మ్యాగ్నెట్లు. {name,సల్లీ}కి ఎంత డబ్బు మిగిలి ఉంది?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} {n1} పౌండ్లు ${p1} కు కొనుగోలు చేస్తోంది మరియు {n2} పౌండ్లు {discount} తగ్గింపు పొందుతోంది. కాబట్టి {n2} పౌండ్లపై {discount} తగ్గింపు అంటే ${p1}*{discount} = ${float(n2*discount*p1)}. మిగిలిన {n12-n1-n2} పౌండ్లకు తగ్గింపు లేదు మరియు వాటి ఖర్చు {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}, కాబట్టి మొత్తం ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} మ్యాగ్నెట్లు ప్రతి ఒక్కటి ${p3} చొప్పున {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nఆమె కొనుగోళ్లన్నింటినీ కలిపితే, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nఆమె వద్ద ${total} ఉంది మరియు ఆమె ఖర్చు చేసింది ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} కాబట్టి ఆమె వద్ద ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} మిగిలి ఉంది\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
