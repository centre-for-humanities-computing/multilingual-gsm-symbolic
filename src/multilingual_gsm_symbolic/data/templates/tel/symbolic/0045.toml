question = "పాట్ కు ఒక పూల బెడ్ ఉంది, దాని పొడవు 111 అడుగులు. పాట్ తన పూల బెడ్‌ను మొక్కలతో నింపాలనుకుంటుంది. పాట్ యొక్క పూలు 12 అంగుళాల వెడల్పు పెరుగుతాయి, మరియు తోటకూల మార్గదర్శకాలు ప్రకారం బెడ్ వెంబడి ప్రతి 1.5 అడుగులు కు ఒక పూలు నాటాలి. పాట్ ఇప్పటికే 17 పూలు కలిగి ఉంది. ప్రతి పూల మొక్క దుకాణంలో $6 ఖర్చవుతుంది. తన పూల బెడ్‌ను నింపడానికి పాట్ దుకాణంలో ఎంత డబ్బు ఖర్చు చేస్తుంది?"
