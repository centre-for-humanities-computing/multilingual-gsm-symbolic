question = "అలీసన్ పరుగు జట్టులో ఎంపికైంది, కాబట్టి ఆమె క్రీడా సామాగ్రి కొనడానికి షాపింగ్ కు వెళ్ళింది. ఆమె టాంక్ టాప్ ని ₹10 కు కొన్నారు, పరుగు షార్ట్స్ జతను టాంక్ టాప్ ధర కంటే ₹5 ఎక్కువ ధరకు, మరియు టెన్నిస్ షూస్ జతను అసలు ₹48 ఉన్నా, సగం ధరకు అమ్మకంలో ఉన్నాయి. ఆమె కొన్న ₹8 క్రీడా సాక్స్ ప్యాకెట్ పై ₹2 తగ్గింపు కోపన్ ఉంది. ఆమె క్రీడా సామాగ్రి పై ఎంత ఖర్చు చేసింది?"
