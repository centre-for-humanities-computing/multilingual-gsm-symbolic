question = "శ్రీ తాన్ తన ఇల్లు ని $400,000 కు అమ్మారు. అతను అమ్మకం ధరలో 3% మొత్తం ఉండే బదిలీ ఫీజులు చెల్లించారు మరియు అమ్మకం ధరలో 5% ఉండే బ్రోకరేజీ ఫీజు చెల్లించారు. అతను ఆ ఇల్లు యొక్క మిగిలిన రుణం కోసం $250,000 కూడా చెల్లించాడు అనుకుంటే, శ్రీ తాన్ ఇల్లు ని అమ్మడం నుండి పొందిన నికర ఆదాయం ఎంత?"
