question = "సున్ని ఒక ఫండ్‌రైజర్ కోసం జింజర్‌బ్రెడ్ మరియు ఆపిల్ పై అమ్ముతున్నాడు. శనివారంన, అతను 10 బాక్సులు జింజర్‌బ్రెడ్ మరియు ఆదివారం కంటే 4 తక్కువ బాక్సులు ఆపిల్ పై అమ్మారు. ఆదివారంన, అతను శనివారం కంటే 5 ఎక్కువ బాక్సులు జింజర్‌బ్రెడ్ మరియు 15 బాక్సులు ఆపిల్ పై అమ్మారు. ఒకవేళ జింజర్‌బ్రెడ్ వెల ₹6 మరియు ఆపిల్ పై వెల ₹15 అయితే, రెండు రోజులకు సున్ని ఎంత సంపాదించాడు?"
answer = "అతను ఆదివారంన జింజర్‌బ్రెడ్ యొక్క 10 + 5 = <<10+5=15>>15 బాక్సులు అమ్మారు.\nజింజర్‌బ్రెడ్ యొక్క మొత్తం బాక్సుల సంఖ్య సున్ని అమ్మినది 10 + 15 = <<10+15=25>>25.\nజింజర్‌బ్రెడ్ అమ్మడానికి సున్ని 25*₹6 = ₹<<25*6=150>>150 సంపాదించాడు.\nఅతను శనివారంన ఆపిల్ పై యొక్క 15 - 4 = <<15-4=11>>11 బాక్సులు అమ్మారు.\nఆపిల్ పై యొక్క మొత్తం బాక్సుల సంఖ్య సున్ని అమ్మినది 15 + 11 = <<15+11=26>>26.\nఆపిల్ పై అమ్మడానికి అతను 26*₹15 = ₹<<26*15=390>>390 సంపాదించాడు.\nకాబట్టి, సున్ని రెండు రోజులకు ₹150 + ₹390 = ₹<<150+390=540>>540 సంపాదించాడు.\n#### 540\n"
