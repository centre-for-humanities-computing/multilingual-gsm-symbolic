question = "పార్టీ యొక్క ప్రారంభంలో, 25 పురుషులు మరియు 15 స్త్రీలు ఉన్నారు. ఒక గంట తర్వాత, మొత్తం వ్యక్తుల సంఖ్యలో 1/4 మంది వెళ్ళిపోయారు. ఒకవేళ 22 పురుషులు ఆ పార్టీ వద్ద ఉండిపోతే, ఎన్ని స్త్రీలు మిగిలి ఉన్నాయి?"
answer = "పార్టీ కు హాజరైన మొత్తం 25 పురుషులు + 15 స్త్రీలు = <<25+15=40>>40 మంది ఉన్నారు.\nఒక గంట తర్వాత, 40 మంది * 1/4 = <<40*1/4=10>>10 మంది ఆ పార్టీ నుండి వెళ్ళిపోయారు.\nదీని అర్థం 40 మంది - 10 మంది = <<40-10=30>>30 మంది ఉండిపోయారు.\nఉండిపోయిన 30 మందిలో, 30 మంది - 22 పురుషులు = <<30-22=8>>8 స్త్రీలు అయ్యారు.\n#### 8\n"
