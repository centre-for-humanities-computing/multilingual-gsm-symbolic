question = "సామ్ మరియు హారీ వారి మధ్య 100 అడుగులు కంచె ఉంటే, మరియు వారు దానిని విభజించుకోవడానికి ఒప్పందం చేసుకుంటారు, ఇందులో సామ్ కంటే హారీ 60 అడుగులు ఎక్కువ పొందుతాడు అయితే, సామ్ కి ఎంత మిగులుతుంది?"
answer = "X అనేది సామ్ పొందే కంచె మొత్తం అనుకుందాం మరియు y అనేది హారీ పొందే మొత్తం అనుకుందాం. మనకు తెలుసు y = x + 60, మరియు y + x = 100.\nమొదటి సమీకరణాన్ని రెండవ సమీకరణంలో ప్రతిక్షేపిస్తే, మనకు 2x+60=100 వస్తుంది\nరెండు వైపులా నుండి 60 ను తీసివేస్తే, మనకు 2x=40 వస్తుంది\nప్రతి వైపును రెండుతో భాగిస్తే, x=20 వస్తుంది. దీని అర్థం సామ్ దగ్గర 20 అడుగులు కంచె మిగులుతుంది.\n#### 20\n"
