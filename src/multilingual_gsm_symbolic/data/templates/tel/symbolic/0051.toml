question = "ఆర్టి ఒక పూల స్టాండ్‌ను రైతుల మార్కెట్లో కలిగి ఉన్నాడు. అతను మూడు రకాల పూలs: మేరీగోల్డ్స్, పెటూనియస్ మరియు బెగానియస్ అమ్ముతాడు. అతను సాధారణంగా మేరీగోల్డ్స్ను $2.74 ప్రతి కుండా, పెటూనియస్ను $1.87 ప్రతి కుండా మరియు బెగానియస్ను $2.12 ప్రతి కుండా అమ్ముతాడు. ఆర్టికు నేడు మార్పిడి లేదు, కాబట్టి అతను తన అన్ని ధరలను సమీప డాలర్‌కు సవరించాలని నిర్ణయించుకున్నాడు. ఒకవేళ ఆర్టి 12 కుండాs మేరీగోల్డ్స్, 9 కుండాs పెటూనియస్ మరియు 17 కుండాs బెగానియస్ అమ్మినట్లయితే, అతను ఎంత సాధిస్తాడు?"
answer = "ఆర్టి తన మేరీగోల్డ్స్ను $2.74 నుండి $3కు 'up'కి సవరిస్తాడు, ఎందుకంటే 2 తర్వాత ఉన్న సంఖ్య 5 లేదా అంతకంటే ఎక్కువ.\nఆర్టి తన పెటూనియస్ను up $1.87 నుండి $2కు సవరిస్తాడు, ఎందుకంటే 1 తర్వాత ఉన్న సంఖ్య 5 or higher.\nఆర్టి తన బెగానియస్ను down $2.12 నుండి $2కు సవరిస్తాడు, ఎందుకంటే 2 తర్వాత ఉన్న సంఖ్య less than 5.\nఆర్టి 12 మేరీగోల్డ్స్*$3 = $<<12*3=36>>36 అమ్ముతాడు\nఆర్టి 9 పెటూనియస్*$2 = $<<9*2=18>>18 అమ్ముతాడు\nఆర్టి 17 బెగానియస్*$2 = $<<17*2=34>>34 అమ్ముతాడు\nమొత్తంమీద, ఆర్టి $36 + $18 + $34 = $<<36+18+34=88>>88 సాధిస్తాడు\n#### 88\n"
