question = "మేరియా ఒక స్టాక్ యొక్క 8 షేర్లను ప్రతి ఒక్కటికి $8 చొప్పున కొనుగోలు చేస్తుంది. మొదటి సంవత్సరంలో మేరియా దానిని కలిగి ఉన్నప్పుడు స్టాక్ ధర 50% పెరుగుతుంది, తర్వాత రెండవ సంవత్సరంలో 25% తగ్గుతుంది. మేరియా యొక్క అన్ని షేర్ల తుది విలువ ఎంత?"
answer = "మొదట మేరియా యొక్క కొనుగోలు యొక్క ప్రారంభ మొత్తం విలువను కనుగొనండి: 8 షేర్లు * $8/షేరు = $<<8*8=64>>64\nతర్వాత మొదటి ధర పెరుగుదల మొత్తాన్ని కనుగొనండి: $64 * 0.5 = $<<64*0.5=32>>32\nమొదటి సంవత్సరం తర్వాత విలువను కనుగొనడానికి ఆ మొత్తాన్ని ప్రారంభ విలువకు కలపండి: $64 + $32 = $<<64+32=96>>96\nతర్వాత రెండవ సంవత్సరంలో తగ్గుదల మొత్తాన్ని కనుగొనడానికి ఆ మొత్తాన్ని 25% తో గుణించండి: $96 * 25% = $<<96*25*.01=24>>24\nతుది విలువను కనుగొనడానికి మొదటి సంవత్సరం తర్వాత విలువ నుండి ఆ మొత్తాన్ని తీసివేయండి: $96 - $24 = $<<96-24=72>>72\n#### 72\n"
