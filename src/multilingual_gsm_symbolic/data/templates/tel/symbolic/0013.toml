question = "మేరీ ఒక ఉత్సాహవంతురాలైన తోటకారిణి. నిన్న, ఆమెకు ఆమె ఇష్టమైన మొక్కల పెంపకం కేంద్రం నుండి 18 కొత్త కుండీలలో ఉన్న మొక్కలు లభించాయి. ఆమె పెద్ద గ్రామీణ ఇంటిలోని 40 కిటికీ అంచుల ప్రతిదానిపై ఆమెకు ఇప్పటికే 2 కుండీలలో ఉన్న మొక్కలు ఉన్నాయి. దాతృత్వ భావంతో, రేపు స్నేహితులు మరియు కుటుంబసభ్యులకు ఆమె ప్రతి అంచు నుండి 1 కుండీలలో ఉన్న మొక్కలను ఇవ్వాలని నిర్ణయించుకుంది. మేరీ వద్ద ఎన్ని కుండీలలో ఉన్న మొక్కలు మిగులుతాయి?"
answer = "నిన్న, మొక్కలు స్వీకరించే ముందు, మేరీ దగ్గర 2*40 = <<2*40=80>>80 కుండీలలో ఉన్న మొక్కలు ఉన్నాయి\nఅదనంగా 18 మొక్కలు స్వీకరించిన తర్వాత, ఆమెకు మొత్తం 80 + 18 = <<80+18=98>>98 కుండీలలో ఉన్న మొక్కలు ఉన్నాయి\nరేపు, మేరీ ఇచ్చే మొక్కల సంఖ్య 40*1 = <<40*1=40>>40 కుండీలలో ఉన్న మొక్కలు అవుతుంది.\nఆమె దగ్గర 98 - 40 = <<98-40=58>>58 కుండీలలో ఉన్న మొక్కలు మిగులుతాయి.\n#### 58\n"
