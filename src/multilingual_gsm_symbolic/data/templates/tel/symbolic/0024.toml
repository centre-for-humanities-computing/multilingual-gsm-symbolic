question = "దాని పోషక విలువల ప్రకారం, ఒక చిప్స్ బ్యాగ్‌లో ప్రతి సర్వింగ్‌కు 250 క్యాలరీలు ఉంటాయి. ఒక 300 గ్రాము బ్యాగ్‌లో 5 సర్వింగ్‌లు ఉంటే, మీ దైనందిన క్యాలరీ లక్ష్యం 2000 మరియు మీరు ఇప్పటికే 1800 క్యాలరీలు తీసుకుంటే, మీరు ఎన్ని గ్రాముs తినగలరు?"
