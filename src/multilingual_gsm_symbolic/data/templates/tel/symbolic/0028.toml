question = "ఒక అస్పత్రి యొక్క సామర్థ్యం 1000 పడకs, వీటిలో 1/5 ఆక్రమించబడి ఉన్నాయి."
answer = "ఒకవేళ అస్పత్రి యొక్క మొత్తం సామర్థ్యంలో 1/5 పడకs ఆక్రమించబడి ఉంటే, అంటే 1/5 * 1000 = <<1000*1/5=200>>200 పడకs రోగులు వాడుతున్నారు.\nకొత్త ప్రవేశాలు లేకుండా అస్పత్రిలోని పడకs మొత్తం సంఖ్య 1000 పడకs - 200 పడకs = <<1000-200=800>>800 పడకs.\nఒకవేళ 80 మంది ప్రతి రోజు చేరినట్లయితే, ఒక వారం తర్వాత అస్పత్రిలోని రోగుల మొత్తం సంఖ్య 80 రోగులు/రోజు * 7 రోజులు/వారం = 560 రోగులు.\n5 వారాల తర్వాత, అస్పత్రిలో చేరిన రోగుల మొత్తం సంఖ్య 560 రోగులు/వారం * 5 వారాలు = <<560*5=2800>>2800 రోగులు, వీరిలో ప్రతి ఒక్కరూ ఒక పడకను వాడతారు.\nకొత్త ప్రవేశాలకు ముందు అస్పత్రిలో 800 ఖాళీ పడకs ఉంటే, మొత్తం సంఖ్య తగ్గి 800 పడకs - 2800 పడకs = <<800-2800=-2000>>-2000 ఖాళీ పడకs అవుతుంది.\n#### -2000\n"
