question_annotated = "ఒక {facility,అస్పత్రి} యొక్క సామర్థ్యం {total,1000} {item,పడక}s, వీటిలో {frac,1/5} ఆక్రమించబడి ఉన్నాయి.\n{event,కోవిడ్ మహమ్మారి} కారణంగా, ప్రతి రోజు {daily,50} రోగులు {facility,అస్పత్రి}లో చేరతారు.\n{period,2} వారాల తర్వాత {facility,అస్పత్రి}లోని ఖాళీ {item,పడక}s మొత్తం సంఖ్యను లెక్కించండి.\n\n#init:\n- facility = sample([\"అస్పత్రి\", \"క్లినిక్\", \"వైద్య కేంద్రం\", \"కేర్ సౌకర్యం\"])\n- item = sample([\"పడక\", \"గది\", \"వార్డు\"])\n- event = sample([\"ఫ్లూ సీజన్\", \"ప్రాకృతిక విపత్తు\", \"పెద్ద ప్రమాదం\", \"మహమ్మారి\"])\n- $total = range(500, 2000, 100)\n- $frac = sample(fractions)\n- $daily = range(20, 100, 5)\n- $period = range(2, 5)\n\n#conditions:\n- is_int(total * frac)\n- total * frac + daily * period * 7 < total\n\n#answer: total - (total * frac + daily * period * 7)\n"
answer_annotated = "ఒకవేళ {facility} యొక్క మొత్తం సామర్థ్యంలో {frac} {item}s ఆక్రమించబడి ఉంటే, అంటే {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item}s రోగులు వాడుతున్నారు.\nకొత్త ప్రవేశాలు లేకుండా {facility}లోని {item}s మొత్తం సంఖ్య {total} {item}s - {int(total*frac)} {item}s = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}s.\nఒకవేళ {daily} మంది ప్రతి రోజు చేరినట్లయితే, ఒక వారం తర్వాత {facility}లోని రోగుల మొత్తం సంఖ్య {daily} రోగులు/రోజు * 7 రోజులు/వారం = {daily*7} రోగులు.\n{period} వారాల తర్వాత, {facility}లో చేరిన రోగుల మొత్తం సంఖ్య {daily*7} రోగులు/వారం * {period} వారాలు = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} రోగులు, వీరిలో ప్రతి ఒక్కరూ ఒక {item}ను వాడతారు.\nకొత్త ప్రవేశాలకు ముందు {facility}లో {total-int(total*frac)} ఖాళీ {item}s ఉంటే, మొత్తం సంఖ్య తగ్గి {total-int(total*frac)} {item}s - {daily*period*7} {item}s = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} ఖాళీ {item}s అవుతుంది.\n#### {total - (total * frac + daily * period * 7)}\n"
