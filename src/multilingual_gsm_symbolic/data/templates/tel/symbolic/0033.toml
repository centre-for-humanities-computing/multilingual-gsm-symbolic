question = "కార్ల్ మరియు జెనిఫర్ లాస్ ఏంజిల్స్ నుండి వచ్చిన అక్కచెల్లెళ్లు, వీరు ప్రముఖులు నుండి సంతకాలను సేకరించడం ఇష్టపడతారు. పాఠశాల నుండి వారి వేసవి విరామం సమయంలో, అక్కచెల్లెళ్లు ప్రతి సాయంత్రం సంతకాలను సేకరించడానికి గడిపేస్తాయి. ఐదు వారాల తర్వాత, కార్ల్ మరియు జెనిఫర్ తమ ఆటోగ్రాఫ్ పుస్తకాలను పోల్చుకుంటారు, ప్రతి అక్కచెల్లెలు సేకరించిన సంతకాల సంఖ్యను లెక్కిస్తారు. కార్ల్ తన పుస్తకంలో 20 సంతకాలు కలిగి ఉంది, మరియు జెనిఫర్ దగ్గర 44 ఉన్నాయి. అక్కచెల్లెళ్లకు మూడు వారాల వేసవి విరామం ఇంకా మిగిలి ఉంది, మరియు విరామం చివరికి వారిద్దరికీ కలిపి 100 సంతకాలు చేరుకోవాలని నిర్ణయించుకున్నారు. వారి లక్ష్యాన్ని చేరుకోవడానికి అక్కచెల్లెళ్లు ఎన్ని సంతకాలు సేకరించాల్సి ఉంది?"
answer = "కార్ల్ మరియు జెనిఫర్ ఇప్పటికే 20 + 44 సంతకాలను సేకరించారు = <<20+44=64>>64 సంతకాలు.\nవారి లక్ష్యం 100 కాబట్టి, వారు 100 - 64 సంతకాలను సేకరించాల్సి ఉంది. 100 - 64 = <<100-64=36>>36 సంతకాలు\n#### 36\n"
