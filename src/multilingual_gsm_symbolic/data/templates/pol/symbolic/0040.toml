question = "Sally wybrała się nad morze na wakacje. Jej rodzice dali jej 15$ na zakup tego, czego tylko chciała. W sklepie z pamiątkami krówki były na wyprzedaży: \"Kup 500 gramów za 3$, otrzymaj 500 gramów za 1/2 ceny.\" Zasypała 2000 gramów. Kupiła również mieszany worek muszelek za 1.5$ oraz 4 magnesy po 0.25$ każdy. Ile pieniędzy zostało Sally?"
answer = "Krówki kosztują 3$ za 500 gramów, a ona otrzymuje 500 gramów za 1/2 ceny. Czyli 1/2 ceny za 500 gramów to 500/500*1/2*3$ = 1.5$.\nRazem kosztuje to 1.5$ + 3$ = 4.5$.\nPozostałe 1000 gramów nie ma zniżki i kosztuje 6$, więc całkowita cena to 3$ + 1.5$ + 6$ = $<<3 + 1.5 + 6 = 10.5>>10.5\n4 magnesy po 0.25$ każdy to 4*0.25$=$<<4*0.25=1>>1\nKiedy dodasz wszystkie zakupy, 10.5$ + 1.5$ + 1$ = $<<10.5+1.5+1=13>>13\nMiała 15$ i wydała 13$, więc zostało jej 15$ - 13$ = $<<15-13=2>>2\n#### 2\n"
