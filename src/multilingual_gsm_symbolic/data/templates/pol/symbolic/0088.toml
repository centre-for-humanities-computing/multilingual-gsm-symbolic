question = "Dana może biec cztery razy szybciej niż chodzić, ale może podskakiwać z prędkością, która jest połowa tak szybka jak bieganie. Jeśli może podskakiwać z prędkością 3 kilometrów na godzinę, ile kilometrów może przebyć w sześć godzin, jeśli spędza jedna trzecia czasu na bieganie i dwie trzecie czasu na chodzenie?"
answer = "Jeśli Dana może podskakiwać z połowa prędkości, z jaką może biec, to może biec z prędkością 3*2=<<3*2=6>>6 kilometrów na godzinę.\nA ponieważ może biec z prędkością, która jest cztery razy szybsza niż chodzenie, oznacza to, że może chodzić z prędkością 6/4=1.5 kilometrów na godzinę.\nJeśli dwie trzecie czasu jest spędzone na chodzenie, to chodzi przez 6*2/3=<<6*2/3=4>>4 godzin.\nJeśli jedna trzecia czasu jest spędzone na bieganie, to biega przez 6-4=<<6-4=2>>2 godzin.\nZatem biega przez 2 godzin z prędkością 6 kilometrów na godzinę, czyli 2*6=<<2*6=12>>12 kilometrów.\nChodzi przez 4 godzin z prędkością 1.5 kilometrów na godzinę, czyli 4*1.5=<<4*1.5=6>>6 kilometrów.\nZatem łącznie przebywa 12+6=<<12+6=18>>18 kilometrów.\n#### 18\n"
