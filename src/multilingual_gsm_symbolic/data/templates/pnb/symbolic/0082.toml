answer = "پارٹی وچ کُل 25 مرد + 15 عورتاں = <<25+15=40>>40 لوک آئے۔\nاک گھنٹے مگروں 40 لوک * 1/4 = <<40*1/4=10>>10 لوک پارٹی چھڈ گئے۔\nایہدا مطلب اے 40 لوک - 10 لوک = <<40-10=30>>30 لوک رُکے رہے۔\nرُکن والے 30 لوکاں وچوں، 30 لوک - 22 مرد = <<30-22=8>>8 عورتاں سن۔\n#### 8"
