answer_annotated = "{event} وچ کُل {m} {group1} + {w} {group2} = <<{m}+{w}={m+w}>>{m+w} لوک آئے۔\n{t} مگروں {m+w} لوک * {frac} = <<{m+w}*{frac}={int((m+w)*frac)}>>{int((m+w)*frac)} لوک {event} چھڈ گئے۔\nایہدا مطلب اے {m+w} لوک - {int((m+w)*frac)} لوک = <<{m+w}-{int((m+w)*frac)}={m+w-int((m+w)*frac)}>>{m+w-int((m+w)*frac)} لوک رُکے رہے۔\nرُکن والے {m+w-int((m+w)*frac)} لوکاں وچوں، {m+w-int((m+w)*frac)} لوک - {m_left} {group1} = <<{m+w-int((m+w)*frac)}-{m_left}={m+w-int((m+w)*frac)-m_left}>>{m+w-int((m+w)*frac)-m_left} {group2} سن۔\n#### {m+w-int((m+w)*frac)-m_left}"
