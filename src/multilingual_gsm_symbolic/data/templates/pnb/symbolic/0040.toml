question = "سدرہ چھٹیاں مناؤن سمندر کنڈے گئی۔ اوہدے ماپیاں نے اوہنوں $15 دتے پئی جو چاہوے خرید لوے۔ سوغاتاں دی دکان اُتے ٹافیاں دی سیل لگی ہوئی سی: \"1 پاؤنڈ $3 فی پاؤنڈ دے حساب نال خریدو تے 1 پاؤنڈ اُتے 1/2 چھوٹ لوو۔\" اوہنے 4 پاؤنڈ لے لئے۔ اوہنے $1.5 دا سمندری سیپیاں دا اک رلواں تھیلا تے 4 مقناطیس وی خریدے جیہڑے $0.25 فی مقناطیس سن۔ سدرہ کول کنے پیسے بچے؟"
answer = "سدرہ 1 پاؤنڈ $3 وچ خرید رہی اے تے اوہنوں 1 پاؤنڈ اُتے 1/2 چھوٹ ملدی اے۔ ایس لئی 1 پاؤنڈ اُتے 1/2 چھوٹ $3*1/2 = $1.5 بندی اے۔ باقی 2 پاؤنڈ اُتے کوئی چھوٹ نہیں تے اوہناں دی قیمت 2*$3 = $6 اے، ایس لئی کُل $3+$3/2+$6=$21/2 بندا اے\n4 مقناطیس $0.25 فی مقناطیس دے حساب نال 4*0.25=$<<4*0.25=1>>1\nاوہدیاں ساریاں خریداریاں جوڑیے تاں $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nاوہدے کول $15 سن تے اوہنے $13 خرچے، ایس لئی اوہدے کول $15-$13 = $<<15-13=2>>2 بچے\n#### 2"
id_orig = 410
id_shuffled = 40
question_annotated = "{name,سدرہ} چھٹیاں مناؤن سمندر کنڈے گئی۔ اوہدے ماپیاں نے اوہنوں ${total,15} دتے پئی جو چاہوے خرید لوے۔ سوغاتاں دی دکان اُتے ٹافیاں دی سیل لگی ہوئی سی: \"{n1,1} پاؤنڈ ${p1,3} فی پاؤنڈ دے حساب نال خریدو تے {n2,1} پاؤنڈ اُتے {discount,1/2} چھوٹ لوو۔\" اوہنے {n12,4} پاؤنڈ لے لئے۔ اوہنے ${p2,1.5} دا سمندری سیپیاں دا اک رلواں تھیلا تے {n3,4} مقناطیس وی خریدے جیہڑے ${p3,0.25} فی مقناطیس سن۔ {name,سدرہ} کول کنے پیسے بچے؟\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)"
answer_annotated = "{name} {n1} پاؤنڈ ${p1} وچ خرید رہی اے تے اوہنوں {n2} پاؤنڈ اُتے {discount} چھوٹ ملدی اے۔ ایس لئی {n2} پاؤنڈ اُتے {discount} چھوٹ ${p1}*{discount} = ${float(n2*discount*p1)} بندی اے۔ باقی {n12-n1-n2} پاؤنڈ اُتے کوئی چھوٹ نہیں تے اوہناں دی قیمت {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1} اے، ایس لئی کُل ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1} بندا اے\n{n3} مقناطیس ${p3} فی مقناطیس دے حساب نال {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nاوہدیاں ساریاں خریداریاں جوڑیے تاں ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nاوہدے کول ${total} سن تے اوہنے ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} خرچے، ایس لئی اوہدے کول ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} بچے\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}"
