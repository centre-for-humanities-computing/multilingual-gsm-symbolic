question = "فرزانہ ایہہ فیصلہ کرن دی کوشش کر رہی اے پئی اپنے ٹیکس دا کم آپ کرے یاں اک اکاؤنٹنٹ رکھے۔ جے اوہ ایہہ کم آپ کرے تاں اوہ 3 گھنٹے گھٹ فری لانس کم کر سکے گی، جیہدے نال اوہنوں $35 فی گھنٹہ دی آمدن دا نقصان ہووے گا۔ اکاؤنٹنٹ دی فیس $90 اے۔ جے اوہ اکاؤنٹنٹ رکھے تاں اوہدے کول کنے ودھ پیسے ہون گے؟"
