question = "سمیرا کول دھاگے دیاں 15 ریلاں نیں جنہاں دا رنگ ہلکا نیلا اے، 45 ریلاں جنہاں دا رنگ گُوڑھا نیلا اے، 40 ریلاں جنہاں دا رنگ ہلکا ہرا اے، تے 50 ریلاں جنہاں دا رنگ گُوڑھا ہرا اے۔ اوہدیاں ریلاں وچوں کنے فیصد ریلاں دا رنگ نیلا اے؟"
answer = "پہلاں اوہناں ریلاں دی گنتی کڈھو جنہاں دا رنگ نیلا اے: 15 ریلاں + 45 ریلاں = <<15+45=60>>60 ریلاں\nفیر ریلاں دی کُل گنتی کڈھو: 40 ریلاں + 50 ریلاں + 60 ریلاں = <<40+50+60=150>>150 ریلاں\nفیر جنہاں ریلاں دا رنگ نیلا اے اوہناں دی گنتی نوں کُل ریلاں دی گنتی نال ونڈو تے جواب نوں فیصد وچ لیاؤن لئی 100% نال ضرب دیو: 60 ریلاں / 150 ریلاں * 100% = 40%\n#### 40"
