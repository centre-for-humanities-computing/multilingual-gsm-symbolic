question_annotated = "{name,احمد} چندہ اکٹھا کرن لئی {food,جنجر بریڈ} تے {fruit,سیب} پائی ویچ رہیا اے۔ اوہنے لگاتار دو دن سامان ویچیا: پہلا دن {d1,ہفتہ} سی تے دوجا دن {d2,اتوار}۔ پہلے دن اوہنے {food,جنجر بریڈ} دے {n1,10} ڈبے ویچے، تے {fruit,سیب} پائی دے ڈبے دوجے دن نالوں {m1,4} گھٹ ویچے۔ دوجے دن اوہنے {food,جنجر بریڈ} دے ڈبے پہلے دن نالوں {n2,5} ودھ ویچے، تے {fruit,سیب} پائی دے {m2,15} ڈبے ویچے۔ جے {food,جنجر بریڈ} دے اک ڈبے دی قیمت {cur,$}{cn,6} تے {fruit,سیب} پائی دے اک ڈبے دی قیمت {cur,$}{cm,15} سی، تاں {name,احمد} نے دوہاں دناں وچ کنے پیسے کمائے؟\n\n#init:\n- name = sample(names_male)\n- fruit = sample(fruits)\n- cur = sample(currencies_sym)\n- food = sample([\"جنجر بریڈ\", \"بسکٹ\", \"براؤنیز\", \"مفن\", \"کپ کیک\"])\n- d1, d2 = sample_sequential(weekdays, 2)\n- $n1 = range(21, 30)\n- $n2 = range(11, 15)\n- $m1 = range(4, 20)\n- $m2 = range(15, 30)\n- $cn = range(7, 13)\n- $cm = range(20, 33)\n\n#conditions:\n- m1 < m2\n\n#answer: (2*n1+n2)*cn + (2*m2-m1)*cm"
answer_annotated = "دوجے دن ({d2}) اوہنے {food} دے {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} ڈبے ویچے۔\n{name} نے {food} دے کُل {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2} ڈبے ویچے۔\n{food} ویچ کے {name} نے {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} کمائے۔\nپہلے دن ({d1}) اوہنے {fruit} پائی دے {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} ڈبے ویچے۔\n{name} نے {fruit} پائی دے کُل {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1} ڈبے ویچے۔\n{fruit} پائی ویچ کے اوہنے {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} کمائے۔\nایس لئی، {name} نے دوہاں دناں وچ {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} کمائے۔\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}"
