question = "احمد چندہ اکٹھا کرن لئی جنجر بریڈ تے سیب پائی ویچ رہیا اے۔ اوہنے لگاتار دو دن سامان ویچیا: پہلا دن ہفتہ سی تے دوجا دن اتوار۔ پہلے دن اوہنے جنجر بریڈ دے 10 ڈبے ویچے، تے سیب پائی دے ڈبے دوجے دن نالوں 4 گھٹ ویچے۔ دوجے دن اوہنے جنجر بریڈ دے ڈبے پہلے دن نالوں 5 ودھ ویچے، تے سیب پائی دے 15 ڈبے ویچے۔ جے جنجر بریڈ دے اک ڈبے دی قیمت $6 تے سیب پائی دے اک ڈبے دی قیمت $15 سی، تاں احمد نے دوہاں دناں وچ کنے پیسے کمائے؟"
answer = "دوجے دن (اتوار) اوہنے جنجر بریڈ دے 10 + 5 = <<10+5=15>>15 ڈبے ویچے۔\nاحمد نے جنجر بریڈ دے کُل 10 + 15 = <<10+15=25>>25 ڈبے ویچے۔\nجنجر بریڈ ویچ کے احمد نے 25*$6 = $<<25*6=150>>150 کمائے۔\nپہلے دن (ہفتہ) اوہنے سیب پائی دے 15 - 4 = <<15-4=11>>11 ڈبے ویچے۔\nاحمد نے سیب پائی دے کُل 15 + 11 = <<15+11=26>>26 ڈبے ویچے۔\nسیب پائی ویچ کے اوہنے 26*$15 = $<<26*15=390>>390 کمائے۔\nایس لئی، احمد نے دوہاں دناں وچ $150 + $390 = $<<150+390=540>>540 کمائے۔\n#### 540"
