question = "انڈے لبھن والی ٹیم نے 100 انڈے لکائے۔ چوہدری ٹبر دے دوہاں جُڑواں بچیاں نے 30-30 انڈے لبھے۔ 10 نوں چھڈ کے باقی سارے انڈے اوہناں دے دوستاں نے لبھے۔ دوستاں نے کنے انڈے لبھے؟"
