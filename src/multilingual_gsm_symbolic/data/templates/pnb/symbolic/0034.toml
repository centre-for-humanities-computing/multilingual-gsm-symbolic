question = "جناب چوہدری نے اپنا گھر $400,000 وچ ویچیا۔ اوہنے ٹرانسفر فیس دتی جیہڑی وکری قیمت دا 3% سی تے بروکریج فیس وی دتی جیہڑی وکری قیمت دا 5% سی۔ جے اوہنے گھر دے باقی رہندے قرض دی رقم $250,000 وی ادا کیتی، تاں جناب چوہدری نوں گھر ویچن توں سارے خرچے کڈھ کے کنی رقم ہتھ آئی؟"
