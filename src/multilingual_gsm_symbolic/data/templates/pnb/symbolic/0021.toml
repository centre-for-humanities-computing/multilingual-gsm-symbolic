question = "فرحان ہر رات اپنا ہوم ورک مکاؤن مگروں ٹی وی ویکھدا اے۔ سوموار تے منگل نوں اوہنے ہر رات اپنے پسندیدہ پروگرام دی 1 گھنٹے دی اک قسط ویکھی۔ بدھ نوں اوہنے 30 منٹ والے اک پروگرام دیاں کجھ قسطاں ویکھیاں۔ جمعرات نوں اوہنے ہوم ورک چھیتی مکا لیا تے 1 گھنٹے دی اک قسط تے 30 منٹ دا اک پروگرام ویکھیا۔ جمعہ نوں اوہنوں دیر تیکر جاگن دی اجازت ملی، ایس لئی اوہنے 1 گھنٹے دیاں دو قسطاں ویکھیاں۔ جے اوہنے کُل 7 گھنٹے ٹی وی ویکھیا، تاں اوہنے بدھ نوں 30 منٹ والیاں کنیاں قسطاں ویکھیاں؟"
answer = "فرض کرو E اوہناں قسطاں دی گنتی اے جیہڑیاں اوہنے بدھ نوں ویکھیاں۔\nسوموار مگروں اوہدے کول ٹی وی دے 7 - 1 = <<7-1=6>>6 گھنٹے باقی سن۔\nمنگل مگروں اوہدے کول ٹی وی دے 6 - 1 = <<6-1=5>>5 گھنٹے باقی سن۔\nجمعرات مگروں اوہدے کول ٹی وی دے 5 - 1 - 0.5 = 3.5 گھنٹے باقی سن۔\nجمعہ مگروں اوہدے کول ٹی وی دے 3.5 - 2 = 1.5 گھنٹے باقی سن۔\n30 منٹ دی ہر قسط 1/2 گھنٹے دی اے۔\nایس لئی، E = 1.5/0.5 = 3 قسطاں۔\n#### 3"
