answer_annotated = "فرض کرو E اوہناں قسطاں دی گنتی اے جیہڑیاں اوہنے {d3} نوں ویکھیاں۔\n{d1} مگروں اوہدے کول ٹی وی دے {total} - {h1} = <<{total}-{h1}={total-h1}>>{total-h1} گھنٹے باقی سن۔\n{d2} مگروں اوہدے کول ٹی وی دے {total-h1} - {h1} = <<{total-h1}-{h1}={total-2*h1}>>{total-2*h1} گھنٹے باقی سن۔\n{d4} مگروں اوہدے کول ٹی وی دے {total-2*h1} - {h2} - {m2/60} = {total-2*h1-h2- m2/60} گھنٹے باقی سن۔\n{d5} مگروں اوہدے کول ٹی وی دے {total-2*h1-h2-m2/60} - {n2_val*h3} = {total-2*h1-h2-m2/60-n2_val*h3} گھنٹے باقی سن۔\n{m1} منٹ دی ہر قسط {Fraction(m1/60)} گھنٹے دی اے۔\nایس لئی، E = {total-2*h1-h2-m2/60-n2_val*h3}/{m1/60} = {int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)} قسطاں۔\n#### {int((total * 60 - 2* h1 * 60 - h2 * 60 - m2 - n2_val* h3 * 60)/m1)}"
