question = "ਅਲਨ ਦੇ ਘਰ ਵਿੱਚ, ਕੈਨੋਲੀ ਨਾਲੋਂ ਮਕਾਈ ਦੀ ਗਿਣਤੀ ਦੁੱਗਣਾ ਹੈ। ਉਸ ਕੋਲ ਘਰ ਵਿੱਚ ਕੁੱਲ 40 ਕੈਨੋਲੀ ਹਨ। ਅਲਨ ਨੇ ਦੁਕਾਨ ਤੋਂ 60 ਹੋਰ ਕੈਨੋਲੀ ਖਰੀਦੀਆਂ ਅਤੇ ਕੈਨੋਲੀ ਦੀ ਗਿਣਤੀ ਨਾਲੋਂ 40 ਘੱਟ ਮਕਾਈ। ਘਰ ਵਿੱਚ ਅਲਨ ਕੋਲ ਮੌਜੂਦ ਮਕਾਈ ਅਤੇ ਕੈਨੋਲੀ ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਪਤਾ ਕਰੋ?"
answer = "ਕਿਸੇ ਵੀ ਮਕਾਈ ਅਤੇ ਕੈਨੋਲੀ ਖਰੀਦਣ ਤੋਂ ਪਹਿਲਾਂ, ਅਲਨ ਕੋਲ ਕੈਨੋਲੀ ਨਾਲੋਂ ਮਕਾਈ ਦੁੱਗਣਾ ਸਨ, ਜੋ ਕਿ 40 ਕੈਨੋਲੀ * 5 ਮਕਾਈ/ਕੈਨੋਲੀ = <<40*5=200>>200 ਮਕਾਈ ਹੈ\nਅਲਨ ਕੋਲ ਪਹਿਲਾਂ ਮਕਾਈ ਅਤੇ ਕੈਨੋਲੀ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 200 ਮਕਾਈ + 40 ਕੈਨੋਲੀ = <<200+40=240>>240 ਵਸਤੂਆਂ ਹੈ\nਜਦੋਂ ਉਸਨੇ ਕੈਨੋਲੀ ਨਾਲੋਂ 40 ਮਕਾਈ ਘੱਟ ਖਰੀਦੇ, ਉਸਨੇ 60 ਮਕਾਈ - 40 ਮਕਾਈ = <<60-40=20>>20 ਮਕਾਈ ਖਰੀਦੇ\nਕੁੱਲ ਮਿਲਾ ਕੇ, ਉਸਨੇ 20 ਮਕਾਈ + 60 ਕੈਨੋਲੀ = <<20+60=80>>80 ਵਸਤੂਆਂ ਖਰੀਦੀਆਂ\nਖਰੀਦਦਾਰੀ ਤੋਂ ਬਾਅਦ, ਅਲਨ ਕੋਲ 240 ਵਸਤੂਆਂ + 80 ਵਸਤੂਆਂ = <<240+80=320>>320 ਕੁੱਲ ਮਕਾਈ ਅਤੇ ਕੈਨੋਲੀ ਮਿਲਾ ਕੇ ਹਨ।\n#### 320\n"
