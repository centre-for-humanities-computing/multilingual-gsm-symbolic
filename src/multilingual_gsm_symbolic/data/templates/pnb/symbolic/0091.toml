question = "عرفان دے گھر کینو نالوں امب دو گُنا نیں۔ اوہدے گھر کُل 40 کینو نیں۔ عرفان نے دکان توں کینو دے 60 دانے ہور خریدے تے امب دے کینو نالوں 40 دانے گھٹ خریدے۔ ہُن عرفان دے گھر امب تے کینو دی کُل گنتی کڈھو۔"
answer = "کجھ وی خریدن توں پہلاں عرفان کول کینو نالوں امب دو گُنا سن، یعنی 40 کینو*2 امب/کینو = <<40*2=80>>80 امب\nعرفان کول پہلاں امب تے کینو دی کُل گنتی 80 امب + 40 کینو = <<80+40=120>>120 چیزاں سی\nجدوں اوہنے امب دے کینو نالوں 40 دانے گھٹ خریدے، تاں اوہنے امب دے 60 - 40 = <<60-40=20>>20 دانے خریدے\nکُل ملا کے اوہنے 20 امب + 60 کینو = <<20+60=80>>80 چیزاں خریدیاں\nخریداری مگروں عرفان کول 120 چیزاں + 80 چیزاں = <<120+80=200>>200 امب تے کینو کُل ملا کے نیں۔\n#### 200"
