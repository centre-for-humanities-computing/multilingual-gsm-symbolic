question = "ایمان لکھنا سکھ رہی اے تے اوہنے فیصلہ کیتا اے پئی جدوں تیکر اوہنوں انگریزی حروفِ تہجی دے سارے حرف یاد نہ ہو جان، اوہ اوہناں نوں وار وار لکھدی رہوے گی۔ اوہ سارے حرف پورے دے پورے دو واری لکھدی اے، اک واری اوہناں دا ادھا لکھدی اے، فیر جو کجھ اوہنے ہُن تیکر لکھیا اے اوہ سارا دوبارہ لکھدی اے۔ ایمان نے کُل کنے حرف لکھے؟"
answer = "ایمان نے انگریزی حروفِ تہجی دے سارے حرف دو واری لکھے، جیہڑے کُل 26*2=<<26*2=52>>52 حرف بندے نیں۔\nفیر اوہ انگریزی حروفِ تہجی دے حرفاں دا ادھا لکھدی اے، جیہڑا 26*1/2=<<26*1/2=13>>13 حرف بندا اے۔\nہُن تیکر ایہہ کُل 52 + 13 = <<52+13=65>>65 حرف بندے نیں۔\nایہنوں دوبارہ لکھن دا مطلب اے پئی اوہدے لکھے ہوئے حرفاں دی گنتی دُگنی ہو گئی، ایس لئی اوہنے کُل 65 * 2 = <<65*2=130>>130 حرف لکھے۔\n#### 130"
