question_annotated = "{name,ایمان} لکھنا سکھ رہی اے تے اوہنے فیصلہ کیتا اے پئی جدوں تیکر اوہنوں {alphabets_txt,انگریزی حروفِ تہجی} دے سارے حرف یاد نہ ہو جان، اوہ اوہناں نوں وار وار لکھدی رہوے گی۔ اوہ سارے حرف پورے دے پورے {n1_txt,دو واری} لکھدی اے، اک واری اوہناں دا {frac_txt,ادھا} لکھدی اے، فیر جو کجھ اوہنے ہُن تیکر لکھیا اے اوہ سارا دوبارہ لکھدی اے۔ {name,ایمان} نے کُل کنے حرف لکھے؟\n\n#init:\n- name = sample(names_female)\n- alphabets_txt, alphabets_val = sample([(\"انگریزی حروفِ تہجی\", 26), (\"ہیراگانا (48 حرف)\", 48), (\"فارسی حروفِ تہجی (32 حرف)\", 32), (\"عربی ابجد (28 حرف)\", 28)])\n- n1_txt, n1_val = sample([(\"دو واری\", 2), (\"ترے واری\", 3), (\"چار واری\", 4), (\"پنج واری\", 5), (\"چھ واری\", 6), (\"ست واری\", 7), (\"اٹھ واری\", 8), (\"نو واری\", 9), (\"دس واری\", 10), (\"یاراں واری\", 11)])\n- frac_txt, frac_val = sample(fraction_alnum)\n\n#conditions:\n- is_int(alphabets_val * frac_val)\n\n#answer: 2 * (alphabets_val * n1_val + alphabets_val * frac_val)"
answer_annotated = "{name} نے {alphabets_txt} دے سارے حرف {n1_txt} لکھے، جیہڑے کُل {alphabets_val}*{n1_val}=<<{alphabets_val}*{n1_val}={alphabets_val*n1_val}>>{alphabets_val*n1_val} حرف بندے نیں۔\nفیر اوہ {alphabets_txt} دے حرفاں دا {frac_txt} لکھدی اے، جیہڑا {alphabets_val}*{frac_val}=<<{alphabets_val}*{frac_val}={int(alphabets_val*frac_val)}>>{int(alphabets_val*frac_val)} حرف بندا اے۔\nہُن تیکر ایہہ کُل {alphabets_val*n1_val} + {int(alphabets_val*frac_val)} = <<{alphabets_val*n1_val}+{int(alphabets_val*frac_val)}={alphabets_val*n1_val + int(alphabets_val*frac_val)}>>{alphabets_val*n1_val + int(alphabets_val*frac_val)} حرف بندے نیں۔\nایہنوں دوبارہ لکھن دا مطلب اے پئی اوہدے لکھے ہوئے حرفاں دی گنتی دُگنی ہو گئی، ایس لئی اوہنے کُل {alphabets_val*n1_val + int(alphabets_val*frac_val)} * 2 = <<{alphabets_val*n1_val + int(alphabets_val*frac_val)}*2={2*(alphabets_val*n1_val + int(alphabets_val*frac_val))}>>{2*(alphabets_val*n1_val + int(alphabets_val*frac_val))} حرف لکھے۔\n#### {2*(alphabets_val*n1_val + int(alphabets_val*frac_val))}"
