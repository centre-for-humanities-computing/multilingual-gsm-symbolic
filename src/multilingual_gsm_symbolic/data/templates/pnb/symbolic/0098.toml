question = "دس لوکاں نوں اک وبا دی بیماری لگ جاندی اے۔ ہر روز ہر بیمار بندہ چھ ہور لوکاں نوں بیماری لا دیندا اے۔ ترے دناں مگروں کنے لوک بیمار ہون گے؟"
