question = "شہزادہ خالد نے اپنے زبردست ہتھیار تلوار نال 100 اژدہے مارے، جدکہ شہزادہ طلال نے اک نیزے نال جنے اژدہے شہزادہ خالد نے مارے سن اوہناں دا ترے چوتھائی مارے۔ زنگ لگے لوہے دے کلہاڑے نال شہزادہ حارث نے شہزادہ طلال نالوں دو گُنا اژدہے مارے۔ پر شہزادہ عامر نے، جیہڑا اپنا ہتھیار تلوار گھر بھُل آیا سی، ناخن گھسن والی ریتی نال، جنے اژدہے شہزادہ حارث نے مارے سن اوہناں دا اک پنجواں حصہ مارے۔ شہزادہ عامر نے کنے اژدہے مارے؟"
