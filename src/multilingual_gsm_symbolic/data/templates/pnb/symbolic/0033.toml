question = "صائمہ تے رابعہ لاہور دیاں دو بھیناں نیں جنہاں نوں مشہور شخصیتاں توں آٹوگراف اکٹھے کرنا پسند اے۔ سکول دیاں گرمیاں دیاں چھٹیاں دے دوران دوویں بھیناں ہر دوپہر آٹوگراف اکٹھے کرن وچ لاندیاں نیں۔ پنج ہفتیاں مگروں صائمہ تے رابعہ اپنیاں آٹوگراف والیاں کاپیاں دا موازنہ کردیاں نیں تے گندیاں نیں پئی ہر بھین نے کنے آٹوگراف اکٹھے کیتے۔ صائمہ دی کاپی وچ 20 آٹوگراف نیں تے رابعہ کول 44 نیں۔ بھیناں کول گرمیاں دیاں چھٹیاں دے ترے ہفتے ہور باقی نیں، تے اوہ فیصلہ کردیاں نیں پئی چھٹیاں مُکن تیکر دوہاں دے ملا کے 100 آٹوگراف ہو جان۔ اپنے ہدف تیکر اپڑن لئی بھیناں نوں ہور کنے آٹوگراف اکٹھے کرنے پین گے؟"
