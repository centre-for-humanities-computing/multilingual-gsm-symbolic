question = "ਕਾਰੋਲ ਅਤੇ ਜੈਨੀਫਰ ਲੌਸ ਐਂਜਲਸ ਦੀਆਂ ਭੈਣਾਂ ਹਨ ਜੋ ਮਸ਼ਹੂਰ ਹਸਤੀਆਂ ਤੋਂ ਦਸਤਖਤ ਇਕੱਠੇ ਕਰਨਾ ਪਸੰਦ ਕਰਦੀਆਂ ਹਨ। ਸਕੂਲ ਤੋਂ ਆਪਣੇ ਗਰਮੀਆਂ ਦੀ ਛੁੱਟੀ ਦੌਰਾਨ, ਭੈਣਾਂ ਹਰ ਸ਼ਾਮ ਦਸਤਖਤ ਇਕੱਠੇ ਕਰਨ ਵਿੱਚ ਬਿਤਾਉਂਦੀਆਂ ਹਨ। ਪੰਜ ਹਫ਼ਤਿਆਂ ਬਾਅਦ, ਕਾਰੋਲ ਅਤੇ ਜੈਨੀਫਰ ਆਪਣੀਆਂ ਆਟੋਗ੍ਰਾਫ ਕਿਤਾਬਾਂ ਦੀ ਤੁਲਨਾ ਕਰਦੀਆਂ ਹਨ, ਹਰ ਭੈਣ ਦੁਆਰਾ ਇਕੱਠੇ ਕੀਤੇ ਗਏ ਦਸਤਖਤਾਂ ਦੀ ਗਿਣਤੀ ਗਿਣਦੀਆਂ ਹਨ। ਕਾਰੋਲ ਦੀ ਕਿਤਾਬ ਵਿੱਚ 20 ਦਸਤਖਤ ਹਨ, ਅਤੇ ਜੈਨੀਫਰ ਕੋਲ 44 ਹਨ। ਭੈਣਾਂ ਕੋਲ ਗਰਮੀਆਂ ਦੀ ਛੁੱਟੀ ਦੇ ਤਿੰਨ ਹੋਰ ਹਫ਼ਤੇ ਹਨ, ਅਤੇ ਉਹ ਫੈਸਲਾ ਕਰਦੀਆਂ ਹਨ ਕਿ ਉਹ ਛੁੱਟੀ ਦੇ ਅੰਤ ਤੱਕ ਆਪਣੇ ਵਿੱਚ 100 ਦਸਤਖਤ ਪਹੁੰਚਾਉਣਾ ਚਾਹੁੰਦੀਆਂ ਹਨ। ਆਪਣੇ ਟੀਚੇ ਤੱਕ ਪਹੁੰਚਣ ਲਈ ਭੈਣਾਂ ਨੂੰ ਕਿੰਨੇ ਦਸਤਖਤ ਇਕੱਠੇ ਕਰਨ ਦੀ ਲੋੜ ਹੈ?"
