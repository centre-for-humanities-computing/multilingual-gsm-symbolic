question = "آمنہ اپنے 3 پوتے پوتیاں لئی سردیاں دے کپڑے بُن رہی اے۔ اوہ ترے جُڑواں نیں، ایس لئی سارے اکو سائز دے نیں۔ اوہ اوہناں وچوں ہر اک لئی اک ٹوپی، شال، سویٹر، دستانے تے جُراباں بناؤنا چاہندی اے۔ اک ٹوپی بناؤن لئی اُن دے 2 گولے لگدے نیں، شال لئی 4، سویٹر لئی 12، دستانے دے اک جوڑے لئی 1، تے جُراباں دے اک جوڑے لئی 2۔ اوہنوں اُن دے کنے گولے خریدنے پین گے؟"
answer = "ہر بچے دا پورا سیٹ بناؤن لئی 2 گولے فی ٹوپی + 4 گولے فی شال + 12 گولے فی سویٹر + 1 گولے فی جوڑا دستانے + 2 گولے فی جوڑا جُراباں = <<2+4+12+1+2=21>>21 اُن دے گولے لگن گے۔\nایس لئی اپنے سارے پوتے پوتیاں لئی کپڑے بُنن واسطے اوہنوں 3*21 = <<3*21=63>>63 اُن دے گولے چاہیدے ہون گے۔\n#### 63"
