question = "ਮਾਰਥਾ ਆਪਣੇ 3 ਪੋਤੇ-ਪੋਤੀਆਂ ਲਈ ਸਰਦੀਆਂ ਦੇ ਕੱਪੜੇ ਬੁਣ ਰਹੀ ਹੈ। ਉਹ ਤਿਹਾਣੇ ਹਨ, ਇਸ ਲਈ ਉਹ ਸਾਰੇ ਇੱਕੋ ਆਕਾਰ ਦੇ ਹਨ। ਉਹ ਹਰੇਕ ਲਈ ਇੱਕ ਟੋਪੀ, ਗਰਦਨੀ, ਸਵੈਟਰ, ਮਿਟਨਾਂ, ਅਤੇ ਜੁਰਾਬਾਂ ਬਣਾਉਣਾ ਚਾਹੁੰਦੀ ਹੈ। ਇੱਕ ਟੋਪੀ ਬਣਾਉਣ ਲਈ 2 ਉੱਨ ਦੀਆਂ ਕੱਲੀਆਂ ਲੱਗਦੀਆਂ ਹਨ, ਗਰਦਨੀ ਲਈ 4, ਸਵੈਟਰ ਲਈ 12, ਇੱਕ ਜੋੜੇ ਮਿਟਨਾਂ ਲਈ 1, ਅਤੇ ਇੱਕ ਜੋੜੇ ਜੁਰਾਬਾਂ ਲਈ 2। ਉਹਨੂੰ ਕੁਝ ਉੱਨ ਦੀਆਂ ਕੱਲੀਆਂ ਖਰੀਦਣੀਆਂ ਪੈਣਗੀਆਂ?"
answer = "ਹਰੇਕ ਬੱਚੇ ਲਈ ਪੂਰਾ ਸੈੱਟ ਬਣਾਉਣ ਲਈ ਲੋੜ ਪਵੇਗੀ 2 ਕੱਲੀਆਂ ਪ੍ਰਤੀ ਟੋਪੀ + 4 ਕੱਲੀਆਂ ਪ੍ਰਤੀ ਗਰਦਨੀ + 12 ਕੱਲੀਆਂ ਪ੍ਰਤੀ ਸਵੈਟਰ + 1 ਕੱਲੀਆਂ ਪ੍ਰਤੀ ਜੋੜੇ ਮਿਟਨਾਂ + 2 ਕੱਲੀਆਂ ਪ੍ਰਤੀ ਜੋੜੇ ਜੁਰਾਬਾਂ = <<2+4+12+1+2=21>>21 ਉੱਨ ਦੀਆਂ ਕੱਲੀਆਂ।\nਇਸ ਲਈ ਆਪਣੇ ਸਾਰੇ ਪੋਤੇ-ਪੋਤੀਆਂ ਲਈ ਕੱਪੜੇ ਬੁਣਨ ਲਈ, ਉਹਨੂੰ ਲੋੜ ਪਵੇਗੀ 3*21 = <<3*21=63>>63 ਉੱਨ ਦੀਆਂ ਕੱਲੀਆਂ।\n#### 63\n"
