question = "مریم اک کمپنی دے 8 شیئر $8 فی شیئر دے حساب نال خریددی اے۔ مریم دے شیئر رکھن دے پہلے سال شیئر دی قیمت 50% ودھ جاندی اے، فیر دوجے سال 25% گھٹ جاندی اے۔ مریم دے سارے شیئراں دی آخری قیمت کنی اے؟"
answer = "پہلاں مریم دی خریداری دی شروع دی کُل قیمت کڈھو: 8 شیئر * $8/شیئر = $<<8*8=64>>64\nفیر پہلے وادھے دی رقم کڈھو: $64 * 0.5 = $<<64*0.5=32>>32\nپہلے سال مگروں دی قیمت کڈھن لئی ایہہ رقم شروع دی قیمت وچ جوڑو: $64 + $32 = $<<64+32=96>>96\nفیر دوجے سال دی کمی دی رقم کڈھن لئی ایس رقم نوں 25% نال ضرب دیو: $96 * 25% = $<<96*25*.01=24>>24\nفیر آخری قیمت کڈھن لئی ایہہ رقم پہلے سال مگروں دی قیمت وچوں گھٹاؤ: $96 - $24 = $<<96-24=72>>72\n#### 72"
