question = "Alison ਨੇ ਦੌੜ ਟੀਮ ਲਈ ਥਾਂ ਪ੍ਰਾਪਤ ਕੀਤੀ, ਇਸ ਲਈ ਉਸਨੇ ਕੁਝ ਖੇਡਾਂ ਦਾ ਸਾਮਾਨ ਖਰੀਦਣ ਲਈ ਖਰੀਦਦਾਰੀ ਕੀਤੀ। ਉਸਨੇ ਟੈਂਕ ਟੌਪ $10 ਵਿੱਚ ਖਰੀਦਿਆ, ਦੌੜ ਦੇ ਸ਼ਾਰਟਸ ਟੈਂਕ ਟੌਪ ਦੀ ਕੀਮਤ ਤੋਂ $5 ਜ਼ਿਆਦਾ ਵਿੱਚ, ਅਤੇ ਟੈਨਿਸ ਜੁੱਤੀ ਜੋ ਮੂਲ ਰੂਪ ਵਿੱਚ $48 ਸਨ ਪਰ ਅੱਧਾ ਕੀਮਤ 'ਤੇ ਸੈਲ 'ਤੇ ਸਨ। ਉਸਦੇ ਕੋਲ $8 ਦੇ ਖੇਡਾਂ ਦੇ ਮੋਜੇ ਦੇ ਪੈਕੇਜ 'ਤੇ $2 ਦੀ ਕਮੀ ਵਾਲਾ ਕੂਪਨ ਸੀ ਜੋ ਉਸਨੇ ਖਰੀਦੇ ਸਨ। ਉਸਨੇ ਖੇਡਾਂ ਦੇ ਸਾਮਾਨ 'ਤੇ ਕਿੰਨਾ ਖਰਚ ਕੀਤਾ?"
