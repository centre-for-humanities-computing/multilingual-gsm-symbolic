question = "ਜੈਰੀ ਇੱਕ ਛੇ-ਭੁਜਾਵਾਂ ਵਾਲਾ ਪਾਸਾ ਰੋਲ ਰਿਹਾ ਹੈ। ਇਹ ਕਿੰਨਾ ਵਧੇਰੇ ਸੰਭਾਵਿਤ ਹੈ (ਪ੍ਰਤੀਸ਼ਤ ਅੰਕਾਂ ਵਿੱਚ ਪ੍ਰਗਟ ਕੀਤਾ ਗਿਆ) ਕਿ ਉਹ 3 ਤੋਂ ਵੱਧ ਸੰਖਿਆ ਰੋਲ ਕਰਦਾ ਹੈ ਨਾਲੋਂ ਕਿ ਉਹ ਦੋ ਜਿਸਤ ਸੰਖਿਆਵਾਂ ਲਗਾਤਾਰ ਰੋਲ ਕਰਦਾ ਹੈ?"
