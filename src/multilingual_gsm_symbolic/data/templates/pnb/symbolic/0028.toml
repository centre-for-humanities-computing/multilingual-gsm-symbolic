answer_annotated = "جے {facility} دے {item} دی کُل گنجائش دا {frac} حصہ بھریا ہویا اے، تاں ایہدا مطلب اے پئی {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} اُتے مریض نیں۔\nنویں داخلیاں نوں چھڈ کے {facility} وچ خالی {item} دی کُل گنتی {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item} اے۔\nجے ہر روز {daily} لوک داخل ہوندے نیں، تاں اک ہفتے مگروں {facility} وچ مریضاں دی کُل گنتی {daily} مریض/دن * 7 دن/ہفتہ = {daily*7} مریض اے۔\n{period} ہفتیاں مگروں {facility} وچ داخل ہون والے مریضاں دی کُل گنتی {daily*7} مریض/ہفتہ * {period} ہفتے = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} مریض اے، تے ہر مریض اک {item} ورتدا اے۔\nجے نویں داخلیاں توں پہلاں {facility} وچ {total-int(total*frac)} خالی {item} سن، تاں ہُن کُل گنتی گھٹ کے {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} خالی {item} رہ جاندی اے۔\n#### {total - (total * frac + daily * period * 7)}"
