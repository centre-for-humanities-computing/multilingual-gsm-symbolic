question = "اک ہسپتال دی گنجائش 1000 بیڈ دی اے، جنہاں وچوں 1/5 بھرے ہوئے نیں۔ کورونا وائرس دی وبا دی وجہ توں ہر روز 50 مریض ہسپتال وچ داخل کیتے جاندے نیں۔ 2 ہفتیاں مگروں ہسپتال وچ خالی بیڈ دی کُل گنتی کڈھو۔"
answer = "جے ہسپتال دے بیڈ دی کُل گنجائش دا 1/5 حصہ بھریا ہویا اے، تاں ایہدا مطلب اے پئی 1/5 * 1000 = <<1000*1/5=200>>200 بیڈ اُتے مریض نیں۔\nنویں داخلیاں نوں چھڈ کے ہسپتال وچ خالی بیڈ دی کُل گنتی 1000 بیڈ - 200 بیڈ = <<1000-200=800>>800 بیڈ اے۔\nجے ہر روز 50 لوک داخل ہوندے نیں، تاں اک ہفتے مگروں ہسپتال وچ مریضاں دی کُل گنتی 50 مریض/دن * 7 دن/ہفتہ = 350 مریض اے۔\n2 ہفتیاں مگروں ہسپتال وچ داخل ہون والے مریضاں دی کُل گنتی 350 مریض/ہفتہ * 2 ہفتے = <<350*2=700>>700 مریض اے، تے ہر مریض اک بیڈ ورتدا اے۔\nجے نویں داخلیاں توں پہلاں ہسپتال وچ 800 خالی بیڈ سن، تاں ہُن کُل گنتی گھٹ کے 800 بیڈ - 700 بیڈ = <<800-700=100>>100 خالی بیڈ رہ جاندی اے۔\n#### 100"
