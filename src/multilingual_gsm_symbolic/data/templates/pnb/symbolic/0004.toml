question = "ਗੈਰਟ ਸਨੈਕ ਲਈ ਪੌਪਕਾਰਨ ਫੁਟਾਉਂਦਾ ਹੈ। ਜਿਵੇਂ ਕੜਾਹੀ ਦਾਣਿਆਂ ਨਾਲ ਗਰਮ ਹੁੰਦੀ ਹੈ, ਦਾਣੇ ਤੇਜ਼ੀ ਨਾਲ ਫੁੱਟਣੇ ਸ਼ੁਰੂ ਕਰਦੇ ਨੇ। 20 ਪਹਿਲੇ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ ਫੁੱਟਦੇ ਨੇ, ਫਿਰ ਅਗਲੇ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ ਇਹਦਾ ਤਿੰਨ ਗੁਣਾ। ਦਾਣਿਆਂ ਦੀ ਤੇਜ਼ੀ ਅਗਲੇ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ ਸ਼ੁਰੂਆਤੀ ਦਰ ਨਾਲੋਂ ਚਾਰ ਗੁਣਾ ਹੋ ਜਾਂਦੀ ਹੈ, ਪਰ ਆਖ਼ਰੀ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ, ਫੁੱਟਣਾ ਪਿਛਲੇ 30 ਸਕਿੰਟਾਂ ਦੀ ਦਰ ਦਾ ਅੱਧਾ ਹੋ ਜਾਂਦਾ ਹੈ। ਗੈਰਟ ਦੀ ਕੜਾਹੀ ਨੂੰ ਗਰਮਾਹਟ ਤੋਂ ਹਟਾਉਣ ਤੇ, ਆਖ਼ਰੀ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ ਫੁੱਟੇ ਦਾਣਿਆਂ ਦਾ ਚੌਥਾ ਹਿੱਸਾ ਵੀ ਬਚੀ ਗਰਮਾਹਟ ਤੋਂ ਫੁੱਟਦਾ ਹੈ। ਗੈਰਟ ਨੂੰ ਕਿੰਨੇ ਪੌਪਕਾਰਨ ਖਾਣੇ ਨੇ?"
