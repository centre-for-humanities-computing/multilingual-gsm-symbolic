question_annotated = "{name,رخسانہ} ہر روز اپنے پسندیدہ پیدل رستے اُتے {n,3} {unit,میل} ٹُردی اے، جیہدے وچ {m,2} {unit,میل} سمندر دے کنڈے اُتے تے {k,1} {unit,میل} فٹ پاتھ اُتے ٹُرنا شامل اے۔ فٹ پاتھ اُتے {name,رخسانہ} سمندر دے کنڈے نالوں {mult_txt,دو گُنا} رفتار نال ٹُردی اے۔ جے اوہدی سیر دے {t,40} منٹ سمندر دے کنڈے اُتے لنگھدے نیں، تاں پوری {n,3} {unit,میل} دی سیر مکان وچ اوہنوں کنے منٹ لگدے نیں؟\n\n#init:\n- name = sample(names_female)\n- unit = sample(length_lg)\n- mult_txt, mult_val = sample(multi_times)\n- $n = range(3, 60)\n- $m = range(2, 20)\n- $k = range(1, 20)\n- $t = range(40, 70)\n#conditions:\n- m + k == n\n- m < t\n- mult_val *m < t\n- divides(t, m)\n- is_int(k / (mult_val*m/t))\n#answer: t+(k/(mult_val*m/t))"
answer_annotated = "سمندر دے کنڈے اُتے {name} {t} منٹاں وچ {m} {unit} ٹُردی اے، یعنی {m}/{t} = {Fraction(m/t)} {unit} فی منٹ۔\nفٹ پاتھ اُتے اوہ ریت نالوں {mult_txt} رفتار نال ٹُردی اے، یعنی {mult_val}*{Fraction(m/t)} = {mult_val*m/t} {unit} فی منٹ۔\nفٹ پاتھ اُتے {k} {unit} ٹُرن وچ اوہنوں {k}/{mult_val*m/t} = <<{k}/{mult_val*m/t}={k/(mult_val*m/t)}>>{k/(mult_val*m/t)} منٹ لگدے نیں۔\nایس لئی، اپنا پسندیدہ رستہ پورا کرن وچ {name} نوں کُل {t}+{k/(mult_val*m/t)} = <<{t}+{k/(mult_val*m/t)}={t+(k/(mult_val*m/t))}>>{t+(k/(mult_val*m/t))} منٹ لگدے نیں۔\n#### {t+(k/(mult_val*m/t))}"
