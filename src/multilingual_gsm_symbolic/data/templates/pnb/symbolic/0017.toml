question = "ਦਾਦੀ ਹਰ ਰੋਜ਼ ਆਪਣੇ ਪਸੰਦੀਦਾ ਚਲਣ ਦੇ ਰਸਤੇ 'ਤੇ 3 ਮੀਲ ਚਲਦੀ ਹੈ, ਜਿਸ ਵਿੱਚ ਬੀਚ 'ਤੇ 2 ਮੀਲ ਚਲਣਾ ਅਤੇ ਫੁੱਟਪਾਥ 'ਤੇ 1 ਮੀਲ ਚਲਣਾ ਸ਼ਾਮਲ ਹੈ। ਫੁੱਟਪਾਥ 'ਤੇ, ਦਾਦੀ ਬੀਚ ਨਾਲੋਂ ਦੋ ਗੁਣਾ ਗਤੀ ਦੀ ਦਰ 'ਤੇ ਚਲਦੀ ਹੈ। ਜੇਕਰ ਉਸਦੇ ਚਲਣ ਵਿੱਚੋਂ 40 ਮਿੰਟ ਬੀਚ 'ਤੇ ਬਿਤਾਏ ਜਾਂਦੇ ਹਨ, ਤਾਂ ਉਸਨੂੰ ਪੂਰੇ 3-ਮੀਲ ਚਲਣ ਨੂੰ ਮਿੰਟਾਂ ਵਿੱਚ ਪੂਰਾ ਕਰਨ ਵਿੱਚ ਕਿੰਨਾ ਸਮਾਂ ਲੱਗਦਾ ਹੈ?"
