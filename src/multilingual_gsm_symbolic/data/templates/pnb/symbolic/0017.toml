question = "رخسانہ ہر روز اپنے پسندیدہ پیدل رستے اُتے 3 میل ٹُردی اے، جیہدے وچ 2 میل سمندر دے کنڈے اُتے تے 1 میل فٹ پاتھ اُتے ٹُرنا شامل اے۔ فٹ پاتھ اُتے رخسانہ سمندر دے کنڈے نالوں دو گُنا رفتار نال ٹُردی اے۔ جے اوہدی سیر دے 40 منٹ سمندر دے کنڈے اُتے لنگھدے نیں، تاں پوری 3 میل دی سیر مکان وچ اوہنوں کنے منٹ لگدے نیں؟"
answer = "سمندر دے کنڈے اُتے رخسانہ 40 منٹاں وچ 2 میل ٹُردی اے، یعنی 2/40 = 1/20 میل فی منٹ۔\nفٹ پاتھ اُتے اوہ ریت نالوں دو گُنا رفتار نال ٹُردی اے، یعنی 2*1/20 = 0.1 میل فی منٹ۔\nفٹ پاتھ اُتے 1 میل ٹُرن وچ اوہنوں 1/0.1 = <<1/0.1=10>>10 منٹ لگدے نیں۔\nایس لئی، اپنا پسندیدہ رستہ پورا کرن وچ رخسانہ نوں کُل 40+10 = <<40+10=50>>50 منٹ لگدے نیں۔\n#### 50"
