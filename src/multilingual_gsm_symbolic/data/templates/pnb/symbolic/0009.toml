question = "ਜਦੋਂ ਸੋਫੀ ਆਪਣੇ ਭਤੀਜਾ ਦੀ ਦੇਖਭਾਲ ਕਰਦੀ ਹੈ, ਤਾਂ ਉਹ ਉਸ ਲਈ ਵੱਖ-ਵੱਖ ਖਿਡੌਣੇ ਕੱਢਦੀ ਹੈ। ਬਿਲਡਿੰਗ ਬਲੌਕਸ ਵਾਲੀ ਥੈਲੀ ਵਿੱਚ 31 ਬਲੌਕਸ ਹਨ। ਭਰੇ ਜਾਨਵਰਾਂ ਵਾਲੀ ਬੱਕਸੀ ਵਿੱਚ 8 ਭਰੇ ਜਾਨਵਰ ਹਨ। ਸਟੈਕਿੰਗ ਰਿੰਗਜ਼ ਦਾ ਟਾਵਰ ਉੱਤੇ 9 ਬਹੁਰੰਗੀਆਂ ਰਿੰਗਜ਼ ਹਨ। ਸੋਫੀ ਨੇ ਹਾਲ ਹੀ ਵਿੱਚ ਬਾਉਂਸੀ ਬਾਲਾਂ ਦੀ ਇੱਕ ਟਿਊਬ ਖਰੀਦੀ, ਜਿਸ ਨਾਲ ਉਸਦੇ ਭਤੀਜਾ ਲਈ ਖਿਡੌਣਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 62 ਹੋ ਗਈ। ਟਿਊਬ ਵਿੱਚ ਕਿੰਨੇ ਬਾਉਂਸੀ ਬਾਲ ਸਨ?"
