question = "جدوں عائشہ دا بھتیجا اوہدے کول ہوندا اے، تاں اوہ اوہدے کھیڈن لئی کئی طرحاں دے کھڈونے کڈھدی اے۔ بلاکاں والے تھیلے وچ 31 بلاک نیں۔ روں والے کھڈونا جانوراں دے ڈبے وچ 8 کھڈونا جانور نیں۔ چھلے چاڑھن والے کھڈونے دے مینار اُتے 9 رنگ برنگے چھلے نیں۔ عائشہ نے ہنے جئے اُچھلن والیاں گینداں دی اک ٹیوب خریدی، جیہدے نال اوہدے کول اوس بچے لئی کُل 62 کھڈونے ہو گئے۔ ٹیوب وچ کنیاں اُچھلن والیاں گینداں سن؟"
