question = "اک کسان اپنیاں گھوڑیاں لئی چارہ خرید رہیا اے۔ اوہ وکھ وکھ چیزاں خریددا اے: توڑی، جئی، گاجراں تے کھنڈ دیاں ڈلیاں۔ کیوں جے کھنڈ دیاں ڈلیاں کدی کدائیں دتی جان والی خاص سوغات نیں، ایس لئی اوہ پورے تبیلے لئی ایہناں دے صرف دو ڈبے خریددا اے، ہر ڈبہ 1 پاؤنڈ دا۔ اوہ گاجراں صرف اینی مقدار وچ خریدنا چاہندا اے جنی سبزیاں دے تازہ رہندیاں رہندیاں گھوڑیاں نوں کھوائی جا سکے، ایس لئی اوہ چار تھیلے خریددا اے، ہر تھیلا 12 پاؤنڈ دا۔ توڑی گھوڑیاں دی مکھ خوراک اے، ایس لئی اوہ بیالی پیکٹ خریددا اے، ہر پیکٹ 75 پاؤنڈ دا۔ جئی توڑی نال دین والی اک ضروری خوراک اے، ایس لئی اوہ ویہہ بوریاں خریددا اے، ہر بوری 65 پاؤنڈ دی۔ جے اوہدا کھیتاں والا ٹرک اک واری وچ 2250 پاؤنڈ چُک سکدا اے، تاں سارا چارہ لے جان لئی کسان نوں کنے پھیرے لاؤنے پین گے؟"
