question = "Deandre ਨੇ 3 ਟੂਨਾਆਂ ਪਿਛਲੇ ਸੋਮਵਾਰ ਫੜੀਆਂ, ਪਹਿਲੇ ਟੂਨਾ ਦਾ ਜੋ ਉਸਨੇ ਫੜਿਆ ਵਜ਼ਨ 56 ਕਿਲੋਗ੍ਰਾਮ ਹੈ, ਦੂਜੇ ਟੂਨਾ ਦਾ ਜੋ ਉਸਨੇ ਫੜਿਆ ਵਜ਼ਨ 46 ਕਿਲੋਗ੍ਰਾਮ ਹੈ, ਅਤੇ ਬਾਕੀ ਦਾ ਟੂਨਾ ਜੋ ਉਸਨੇ ਫੜਿਆ ਵਜ਼ਨ 26 ਕਿਲੋਗ੍ਰਾਮ ਹੈ। ਜੇਕਰ ਇੱਕ ਕਿਲੋਗ੍ਰਾਮ ਟੂਨਾ ਦਾ ਰੁਪਏ0.5 ਹੈ, ਤਾਂ ਮਾਰਕੀਟ ਨੂੰ ਸਾਰੇ ਟੂਨਾਆਂ ਨੂੰ ਵੇਚਣ ਤੋਂ ਬਾਅਦ ਉਹ ਕਿੰਨਾ ਕਮਾਏਗਾ?"
answer = "Deandre ਪਹਿਲੇ ਟੂਨਾ ਤੋਂ 56*ਰੁਪਏ0.5 = ਰੁਪਏ<<56*0.5=28>>28 ਕਮਾਏਗਾ।\nਉਹ ਦੂਜੇ ਟੂਨਾ ਲਈ 46*ਰੁਪਏ0.5 = ਰੁਪਏ<<46*0.5=23>>23 ਕਮਾਏਗਾ।\nਬਾਕੀ ਦੀਆਂ ਟੂਨਾਆਂ 3-2 = <<3-2=1>>1 ਹਨ। ਉਹ ਹਰੇਕ ਲਈ 26*ਰੁਪਏ0.5 = ਰੁਪਏ<<26*0.5=13>>13 ਕਮਾਏਗਾ। ਇਸ ਲਈ ਉਹ 1 * 13 = <<1*13>>=13 ਕਮਾਏਗਾ\nਇਸ ਲਈ, ਕੁੱਲ ਰਕਮ ਜੋ ਉਹ ਸਾਰੀਆਂ ਟੂਨਾਆਂ ਲਈ ਕਮਾਏਗਾ ਰੁਪਏ28 + ਰੁਪਏ23 + ਰੁਪਏ13 = ਰੁਪਏ<<28+23+13=64>>64 ਹੈ।\n#### 64\n"
