question = "کامران نے لنگھے سوموار والے دن 3 ٹونا مچھیاں پھڑیاں، پہلی ٹونا مچھی دا وزن 56 کلوگرام سی، دوجی ٹونا مچھی دا وزن 46 کلوگرام سی، تے باقی ہر ٹونا مچھی دا وزن 26 کلوگرام سی۔ جے ٹونا مچھی دا اک کلوگرام $0.5 دا وکدا اے، تاں ساریاں ٹونا مچھیاں منڈی وچ ویچ کے اوہ کنے پیسے کمائے گا؟"
