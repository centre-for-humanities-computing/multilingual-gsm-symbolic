question = "کامران کجھ کافی خریدن دکان اُتے جاندا اے۔ اوہ جیہڑا کافی دا عام برانڈ خریددا اے اوہدی قیمت $5 فی کلو اے۔ اوہنوں اک ہور مہنگا برانڈ خریدنا پیا جیہدی قیمت 20% ودھ اے کیوں جے اوہدا پسندیدہ برانڈ مُک گیا سی۔ اوہ اک ہفتے لئی کافی خریدن دا فیصلہ کردا اے تے اوہ روز 1 کلو کافی ورتدا اے۔ اوہنے اپنے لئی $2 دا اک ڈونٹ وی خریدن دا فیصلہ کیتا۔ ساریاں چیزاں دی کُل قیمت کنی بنی؟"
