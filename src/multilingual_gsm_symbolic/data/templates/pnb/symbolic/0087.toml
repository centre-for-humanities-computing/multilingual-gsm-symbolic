question = "جوائے لینڈ دی سب توں وڈی واٹر سلائیڈ 300 فٹ لمی اے، تے لوک 60 فٹ/منٹ دی رفتار نال تھلے تِلکدے نیں۔ دوجی سب توں وڈی واٹر سلائیڈ 240 فٹ لمی اے، پر اوہدی ڈھلان ودھ اے، ایس لئی لوک 80 فٹ/منٹ دی رفتار نال تھلے تِلکدے نیں۔ سب توں وڈی سلائیڈ توں تِلکن نوں دوجی وڈی سلائیڈ نالوں کنا ودھ ویلا لگدا اے؟"
