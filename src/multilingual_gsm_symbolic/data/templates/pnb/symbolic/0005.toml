question = "عائشہ کھنڈ دے چمچاں تے پانی دے کپاں نوں 7:13 دی نسبت نال ورت کے کافی بناندی اے۔ جے اوہنے کھنڈ دے چمچ تے پانی دے کپ کُل ملا کے 120 ورتے، تاں حساب لا کے دسو پئی اوہنے کھنڈ دے کنے چمچ ورتے۔"
