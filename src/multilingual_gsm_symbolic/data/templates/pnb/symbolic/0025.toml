answer_annotated = "{total} طالب علماں دی جماعت دا {p1}% {group1} نیں، یعنی {p1/100}*{total} = <<{p1/100}*{total}={int(total*p1/100)}>>{int(total*p1/100)} طالب علم\nکُل {total} طالب علم نیں تے {int(total*p1/100)} {group1} نیں، ایس لئی {total}-{int(total*p1/100)} = <<{total}-{int(total*p1/100)}={total-int(total*p1/100)}>>{total-int(total*p1/100)} طالب علم باقی رہندے نیں\nباقی {total-int(total*p1/100)} طالب علماں دا {p2}% {group3} یاں {group2} نیں، یعنی {p2/100}*{total-int(total*p1/100)} = <<{p2/100}*{total-int(total*p1/100)}={int((total-int(total*p1/100))*p2/100)}>>{int((total-int(total*p1/100))*p2/100)} طالب علم\n{int(total*p1/100)} طالب علم {group1} نیں تے {int((total-int(total*p1/100))*p2/100)} {group3}/{group2} نیں، ایس لئی {int(total*p1/100)}+{int((total-int(total*p1/100))*p2/100)} = <<{int(total*p1/100)}+{int((total-int(total*p1/100))*p2/100)}={int(total*p1/100 + (total-int(total*p1/100))*p2/100)}>>{int(total*p1/100 + (total-int(total*p1/100))*p2/100)} طالب علم چھیتی جان گے\n#### {int(total*p1/100 + (total-int(total*p1/100))*p2/100)}"
