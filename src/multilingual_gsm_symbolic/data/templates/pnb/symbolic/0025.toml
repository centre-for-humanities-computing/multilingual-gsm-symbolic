question = "سر عمران دی 30 طالب علماں دی جماعت وچ، 20% طالب علم فٹبال دے کھڈاری نیں۔ باقی جماعت وچوں 25% طالب علم چیئر لیڈر یاں بینڈ دے ممبر نیں۔ ایہناں 3 گروپاں دے طالب علماں نوں اج چھیتی جانا پوے گا تاں جے اوہ دوجے شہر میچ لئی جا سکن۔ کنے طالب علم چھیتی جا رہے نیں؟"
answer = "30 طالب علماں دی جماعت دا 20% فٹبال دے کھڈاری نیں، یعنی 0.2*30 = <<0.2*30=6>>6 طالب علم\nکُل 30 طالب علم نیں تے 6 فٹبال دے کھڈاری نیں، ایس لئی 30-6 = <<30-6=24>>24 طالب علم باقی رہندے نیں\nباقی 24 طالب علماں دا 25% بینڈ دے ممبر یاں چیئر لیڈر نیں، یعنی 0.25*24 = <<0.25*24=6>>6 طالب علم\n6 طالب علم فٹبال دے کھڈاری نیں تے 6 بینڈ دے ممبر/چیئر لیڈر نیں، ایس لئی 6+6 = <<6+6=12>>12 طالب علم چھیتی جان گے\n#### 12"
