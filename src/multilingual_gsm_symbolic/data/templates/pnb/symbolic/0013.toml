question = "فاطمہ نوں باغبانی دا بہت شوق اے۔ دو دن پہلاں اوہنوں اپنی پسندیدہ نرسری توں 18 نویں گملے ملے۔ اوہدے وڈے پنڈ والے گھر دیاں 40 باریاں دے ہر چھجے اُتے پہلاں ای 2 گملے پئے نیں۔ کُھلے دل نال اوہنے فیصلہ کیتا اے پئی کل اوہ ہر چھجے توں 1 گملے اپنے دوستاں تے رشتے داراں نوں دے دیوے گی۔ فاطمہ کول کنے گملے بچن گے؟"
