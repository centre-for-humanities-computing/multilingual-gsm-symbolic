question = "ਮੇਰੀ ਇੱਕ ਜੋਸ਼ੀਲਾ ਬਾਗ਼ਬਾਨ ਹੈ। ਕੱਲ੍ਹ, ਉਸਨੂੰ ਆਪਣੇ ਪਸੰਦੀਦਾ ਪੌਦਿਆਂ ਦੀ ਨਰਸਰੀ ਤੋਂ 18 ਨਵੇਂ ਘੜੇ ਵਿੱਚ ਲਗੇ ਪੌਦੇ ਮਿਲੇ। ਉਸਦੇ ਕੋਲ ਪਹਿਲਾਂ ਹੀ 2 ਘੜੇ ਵਿੱਚ ਲਗੇ ਪੌਦੇ ਹਰੇਕ 40 ਖਿੜਕੀ ਦੀਆਂ ਥੈਲੀਆਂ 'ਤੇ ਆਪਣੇ ਵੱਡੇ ਦੇਸ਼ੀ ਘਰ ਵਿੱਚ ਹਨ। ਦਾਨਸ਼ੀਲਤਾ ਮਹਿਸੂਸ ਕਰਦੇ ਹੋਏ, ਉਸਨੇ ਫੈਸਲਾ ਕੀਤਾ ਹੈ ਕਿ ਉਹ ਕੱਲ੍ਹ ਦੋਸਤਾਂ ਅਤੇ ਪਰਿਵਾਰ ਨੂੰ ਹਰੇਕ ਥੈਲੀ ਤੋਂ 1 ਘੜੇ ਵਿੱਚ ਲਗੇ ਪੌਦੇ ਦੇਵੇਗੀ। ਮੇਰੀ ਕੋਲ ਕਿੰਨੇ ਘੜੇ ਵਿੱਚ ਲਗੇ ਪੌਦੇ ਬਚਣਗੇ?"
