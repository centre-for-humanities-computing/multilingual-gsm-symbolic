question = "ثمینہ اپنے ٹُرن نالوں چار گُنا تیز دوڑ سکدی اے، پر اوہ ٹپوسیاں مار کے اونی رفتار نال چل سکدی اے جیہڑی اوہدی دوڑن دی رفتار دا ادھا اے۔ جے اوہ 3 میل فی گھنٹہ دی رفتار نال ٹپوسیاں مار سکدی اے، تاں اوہ چھ گھنٹیاں وچ کنے میل جا سکدی اے جے اوہ ویلے دا اک تہائی دوڑن وچ تے دو تہائی ٹُرن وچ لاوے؟"
answer = "جے ثمینہ دی ٹپوسیاں مارن دی رفتار اوہدی دوڑن دی رفتار دا ادھا اے، تاں اوہ 3*2=<<3*2=6>>6 میل فی گھنٹہ دی رفتار نال دوڑ سکدی اے۔\nتے کیوں جے اوہ اپنے ٹُرن نالوں چار گُنا تیز دوڑ سکدی اے، ایہدا مطلب اے اوہ 6/4=1.5 میل فی گھنٹہ دی رفتار نال ٹُر سکدی اے۔\nجے ویلے دا دو تہائی ٹُرن وچ لگدا اے، تاں اوہ 6*2/3=<<6*2/3=4>>4 گھنٹے ٹُردی اے۔\nجے ویلے دا اک تہائی دوڑن وچ لگدا اے، تاں اوہ 6-4=<<6-4=2>>2 گھنٹے دوڑدی اے۔\nایس لئی، اوہ 2 گھنٹے 6 میل فی گھنٹہ دی رفتار نال دوڑدی اے، یعنی 2*6=<<2*6=12>>12 میل۔\nاوہ 4 گھنٹے 1.5 میل فی گھنٹہ دی رفتار نال ٹُردی اے، یعنی 4*1.5=<<4*1.5=6>>6 میل۔\nایس لئی، کُل ملا کے اوہ 12+6=<<12+6=18>>18 میل سفر کردی اے۔\n#### 18"
