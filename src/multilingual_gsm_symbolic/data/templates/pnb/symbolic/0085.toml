question = "ਜੇਕਰ ਸੈਮ ਅਤੇ ਹੈਰੀ ਦੇ ਵਿਚਕਾਰ 100 ਫੁੱਟ ਬੰਨ੍ਹ ਹੈ, ਅਤੇ ਉਹ ਇਸਨੂੰ ਵੰਡਣ 'ਤੇ ਸਹਿਮਤ ਹੁੰਦੇ ਹਨ ਕਿ ਹੈਰੀ ਨੂੰ ਸੈਮ ਤੋਂ 60 ਫੁੱਟ ਵੱਧ ਮਿਲਦਾ ਹੈ, ਤਾਂ ਸੈਮ ਲਈ ਕਿੰਨਾ ਬਚਦਾ ਹੈ?"
