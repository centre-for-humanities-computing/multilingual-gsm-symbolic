question = "فاطمہ اپنے گھر اک رات دی دعوت دی تیاری کر رہی سی، جتھے اوہ مہماناں نوں سالن کھواؤنا چاہندی سی۔ اوہنے ویکھیا پئی اوہدے کول پلاسٹک دے چمچ مُک گئے نیں، ایس لئی اوہنے اک نواں پیکٹ خریدیا جیہدے وچ چمچ سن۔ بعد وچ اوہدے خاوند نے وی اک پیکٹ خریدیا جیہدے وچ 5 نویں چمچ سن، تے اوہ فاطمہ نوں دے دتا۔ جدوں فاطمہ سالن بنا رہی سی، اوہنے سالن چکھن لئی ترے چمچ ورت لئے۔ بعد وچ جدوں اوہ میز لاؤن گئی، تاں اوہدے کول کُل 12 چمچ سن۔ فاطمہ نے جیہڑا پیکٹ خریدیا سی اوہدے وچ کنے چمچ سن؟"
