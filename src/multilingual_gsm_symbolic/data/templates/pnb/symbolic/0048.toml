question = "ثمینہ اک منٹ وچ 6 جھینگے چھیل سکدی اے تے 10 منٹاں وچ 30 جھینگے بھُن سکدی اے۔ 90 جھینگے چھیلن تے بھُنن وچ اوہنوں کنا ویلا لگے گا؟ ثمینہ اکو ویلے چھیل تے بھُن نہیں سکدی۔"
answer = "پہلاں ایہہ کڈھو پئی ثمینہ نوں جھینگے چھیلن وچ کنا ویلا لگدا اے: 90 جھینگے / 6 جھینگے/منٹ = <<90/6=15>>15 منٹ\nفیر ایہہ کڈھو پئی اوہنوں جھینگے پکاؤن لئی کنے بیچ لاؤنے پین گے: 90 جھینگے / 30 جھینگے/بیچ = <<90/30=3>>3 بیچ\nفیر کُل پکاؤن دا ویلا کڈھن لئی بیچاں دی گنتی نوں فی بیچ ویلے نال ضرب دیو: 3 بیچ * 10 منٹ/بیچ = <<3*10=30>>30 منٹ\nفیر ثمینہ دا کُل ویلا کڈھن لئی چھیلن دا ویلا جوڑو: 30 منٹ + 15 منٹ = <<30+15=45>>45 منٹ\n#### 45"
