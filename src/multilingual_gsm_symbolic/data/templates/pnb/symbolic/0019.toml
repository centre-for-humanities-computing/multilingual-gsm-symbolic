question = "60 سوالاں والے اک کوئز وچ 40% سوال تاریخ دے نیں، تے باقی سوال جیوگرافی تے فزکس وچ برابر ونڈے ہوئے نیں۔ جے عائشہ نوں پکا یقین اے پئی اوہ تاریخ دے 75% سوال، تے جیوگرافی تے فزکس دے سوالاں وچوں ادھا ٹھیک کر لوے گی، تاں اوہنوں پکے کنے نمبر ملن گے؟"
answer = "جیوگرافی تے فزکس دے سوال کوئز دا 100% - 40% = 60% نیں۔\nتاریخ دے سوال 60 سوال*40/100 = <<60*40/100=24>>24 نیں۔\nجیوگرافی تے فزکس دے کُل سوال 60 سوال*60/100 = <<60*60/100=36>>36 نیں۔\nجے عائشہ نوں تاریخ دے 75% سوالاں دا پکا یقین اے، تاں ایہدا مطلب اے پئی اوہنوں اپنے 24 سوال*75/100 = <<24*75/100=18>>18 نمبراں دا پکا یقین اے۔\nجیوگرافی تے فزکس دے سوالاں وچوں اوہنوں ادھا ٹھیک کرن دا پکا یقین اے، یعنی 36 سوال*1/2 = <<36*1/2=18>>18 نمبر۔\nایس لئی، اوہنوں اپنے کوئز وچ 18 نمبر + 18 نمبر = <<18+18=36>>36 نمبر ملن دا پکا یقین اے۔\n#### 36"
