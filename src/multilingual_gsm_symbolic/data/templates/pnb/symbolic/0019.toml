answer_annotated = "{s2} تے {s3} دے سوال کوئز دا 100% - {p1}% = {100-p1}% نیں۔\n{s1} دے سوال {n} سوال*{p1}/100 = <<{n}*{p1}/100={int(n * (p1/100))}>>{int(n * (p1/100))} نیں۔\n{s2} تے {s3} دے کُل سوال {n} سوال*{100-p1}/100 = <<{n}*{100-p1}/100={int(n*(1-(p1/100)))}>>{int(n*(1-(p1/100)))} نیں۔\nجے {name} نوں {s1} دے {r1}% سوالاں دا پکا یقین اے، تاں ایہدا مطلب اے پئی اوہنوں اپنے {int(n * (p1/100))} سوال*{r1}/100 = <<{int(n * (p1/100))}*{r1}/100={int(n * (p1/100) * (r1/100))}>>{int(n * (p1/100) * (r1/100))} نمبراں دا پکا یقین اے۔\n{s2} تے {s3} دے سوالاں وچوں اوہنوں {frac_txt} ٹھیک کرن دا پکا یقین اے، یعنی {int(n*(1-(p1/100)))} سوال*{frac_val} = <<{int(n*(1-(p1/100)))}*{frac_val}={ensure_int(n*(1-(p1/100))*frac_val)}>>{ensure_int(n*(1-(p1/100))*frac_val)} نمبر۔\nایس لئی، اوہنوں اپنے کوئز وچ {int(n * (p1/100) * (r1/100))} نمبر + {ensure_int(n*(1-(p1/100))*frac_val)} نمبر = <<{int(n * (p1/100) * (r1/100))}+{ensure_int(n*(1-(p1/100))*frac_val)}={ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)}>>{ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)} نمبر ملن دا پکا یقین اے۔\n#### {ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)}"
