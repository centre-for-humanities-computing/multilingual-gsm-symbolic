question = "نسرین دے ابو نے کہیا پئی اوہدی سالگرہ دی پارٹی لئی $90 دا بجٹ رکھیا گیا اے۔ اوہ چاہندی اے پئی اوہ تے اوہدے سارے دوست منی گالف دا اک راؤنڈ کھیڈن، ہر اک کول آرکیڈ دے ٹوکناں لئی $5 ہون، تے ہر کوئی گو کارٹ دی سواری دو واری کرے۔ منی گالف دا اک راؤنڈ $5 دا اے۔ گو کارٹ دی اک سواری $10 دی اے۔ اوہ کنے دوستاں نوں بلا سکدی اے؟"
