question = "غذائی معلومات دے مطابق، چپس دے اک پیکٹ وچ فی سرونگ 250 کیلوریاں ہوندیاں نیں۔ جے 300 گرام دے اک پیکٹ وچ 5 سرونگاں نیں، تاں تُسی کنے گرام کھا سکدے او جے تہاڈا روزانہ کیلوری دا ہدف 2000 اے تے تُسی پہلاں ای 1800 کیلوریاں کھا چکے او؟"
answer = "جے کُل کیلوری ہدف 2000 اے تے میں 1800 کیلوریاں کھا چکیا آں، تاں میرے کول کھان لئی 2000-1800 = <<2000-1800=200>>200 کیلوریاں باقی نیں\nجے چپس دی ہر سرونگ وچ 250 کیلوریاں نیں تے میرے کول کھان لئی صرف 200 کیلوریاں باقی نیں، تاں میں صرف 200/250 سرونگ کھا سکدا آں = سرونگ دا 4/5 حصہ\nسانوں ایہہ وی پتا اے پئی چپس دے 300 گرام والے پیکٹ وچ 5 سرونگاں نیں، ایس لئی ہر سرونگ وچ 300 گرام/5 = <<300/5=60>>60 گرام نیں\nجے میں صرف سرونگ دا 4/5 حصہ کھا سکدا آں، تاں میں صرف 60 گرام * 4/5 = 48 گرام کھا سکدا آں\n#### 48"
