question = "ਉਸ ਦੀ ਪੌਸ਼ਟਿਕ ਜਾਣਕਾਰੀ ਅਨੁਸਾਰ, ਇੱਕ ਚਿਪਸ ਦੀ ਬੈਗ ਵਿੱਚ ਪ੍ਰਤੀ ਸਰਵਿੰਗ 250 ਕੈਲੋਰੀਆਂ ਹੁੰਦੀਆਂ ਹਨ। ਜੇਕਰ ਇੱਕ 300 ਗ੍ਰਾਮ ਵਾਲੀ ਬੈਗ ਵਿੱਚ 5 ਸਰਵਿੰਗਾਂ ਹਨ, ਤਾਂ ਤੁਸੀਂ ਕਿੰਨੇ ਗ੍ਰਾਮ ਖਾ ਸਕਦੇ ਹੋ ਜੇਕਰ ਤੁਹਾਡਾ ਦਿਨ ਭਰ ਦਾ ਕੈਲੋਰੀ ਟੀਚਾ 2000 ਹੈ ਅਤੇ ਤੁਸੀਂ ਪਹਿਲਾਂ ਹੀ 1800 ਕੈਲੋਰੀਆਂ ਖਪਤ ਕਰ ਚੁੱਕੇ ਹੋ?"
answer = "ਜੇਕਰ ਕੁੱਲ ਕੈਲੋਰੀ ਟੀਚਾ 2000 ਹੈ ਅਤੇ ਮੈਂ 1800 ਕੈਲੋਰੀਆਂ ਖਪਤ ਕਰ ਲਈਆਂ ਹਨ, ਤਾਂ ਮੇਰੇ ਕੋਲ ਖਾਣ ਲਈ 2000-1800 = <<2000-1800=200>>200 ਕੈਲੋਰੀਆਂ ਬਾਕੀ ਹਨ\nਜੇਕਰ ਚਿਪਸ ਦੀ ਹਰ ਸਰਵਿੰਗ ਵਿੱਚ 250 ਕੈਲੋਰੀਆਂ ਹਨ ਅਤੇ ਮੇਰੇ ਕੋਲ ਖਾਣ ਲਈ ਸਿਰਫ਼ 200 ਕੈਲੋਰੀਆਂ ਬਾਕੀ ਹਨ, ਤਾਂ ਮੈਂ ਸਿਰਫ਼ 200/250 ਸਰਵਿੰਗ ਖਾ ਸਕਦਾ ਹਾਂ = 4/5 ਸਰਵਿੰਗ\nਅਸੀਂ ਇਹ ਵੀ ਜਾਣਦੇ ਹਾਂ ਕਿ ਚਿਪਸ ਦੀ 300 ਗ੍ਰਾਮ ਵਾਲੀ ਬੈਗ ਵਿੱਚ 5 ਸਰਵਿੰਗਾਂ ਹਨ, ਇਸ ਲਈ ਹਰ ਸਰਵਿੰਗ ਵਿੱਚ 300 ਗ੍ਰਾਮ/5 = <<300/5=60>>60 ਗ੍ਰਾਮ ਹੁੰਦੇ ਹਨ\nਜੇਕਰ ਮੈਂ ਸਿਰਫ਼ 4/5 ਸਰਵਿੰਗ ਖਾ ਸਕਦਾ ਹਾਂ, ਤਾਂ ਮੈਂ ਸਿਰਫ਼ 60 ਗ੍ਰਾਮ * 4/5 = 48 ਗ੍ਰਾਮ ਖਾ ਸਕਦਾ ਹਾਂ\n#### 48\n"
