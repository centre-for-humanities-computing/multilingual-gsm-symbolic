question_annotated = "غذائی معلومات دے مطابق، {food,چپس} دے اک پیکٹ وچ فی سرونگ {cal,250} کیلوریاں ہوندیاں نیں۔ جے {size,300} {unit,گرام} دے اک پیکٹ وچ {n,5} سرونگاں نیں، تاں تُسی کنے {unit,گرام} کھا سکدے او جے تہاڈا روزانہ کیلوری دا ہدف {total,2000} اے تے تُسی پہلاں ای {spent,1800} کیلوریاں کھا چکے او؟\n\n#init:\n- food = sample([\"پاپ کارن\", \"بریڈ\",  \"بسکٹ\"])\n- unit = sample([\"گرام\", \"اونس\", \"اونس\"])\n- $cal = range(150, 500, 25)\n- $size = range(100, 400, 25)\n- $n = range(4, 8)\n- $total = range(1900, 2500, 5)\n- $spent = range(600, 1900, 25)\n\n#conditions:\n- spent < total\n- is_int( 5 * (total - spent) / cal)\n- divides(size, n)\n- divides(size//n, (total-spent)/cal)\n\n#answer: size//n * Fraction((total-spent)/cal)"
answer_annotated = "جے کُل کیلوری ہدف {total} اے تے میں {spent} کیلوریاں کھا چکیا آں، تاں میرے کول کھان لئی {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} کیلوریاں باقی نیں\nجے {food} دی ہر سرونگ وچ {cal} کیلوریاں نیں تے میرے کول کھان لئی صرف {total-spent} کیلوریاں باقی نیں، تاں میں صرف {total-spent}/{cal} سرونگ کھا سکدا آں = سرونگ دا {Fraction((total-spent)/cal)} حصہ\nسانوں ایہہ وی پتا اے پئی {food} دے {size} {unit} والے پیکٹ وچ {n} سرونگاں نیں، ایس لئی ہر سرونگ وچ {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit} نیں\nجے میں صرف سرونگ دا {Fraction((total-spent)/cal)} حصہ کھا سکدا آں، تاں میں صرف {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit} کھا سکدا آں\n#### {size//n * (total-spent)/cal}"
