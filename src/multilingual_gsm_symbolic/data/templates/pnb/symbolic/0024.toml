question_annotated = "ਉਸ ਦੀ ਪੌਸ਼ਟਿਕ ਜਾਣਕਾਰੀ ਅਨੁਸਾਰ, ਇੱਕ {food,ਚਿਪਸ} ਦੀ ਬੈਗ ਵਿੱਚ ਪ੍ਰਤੀ ਸਰਵਿੰਗ {cal,250} ਕੈਲੋਰੀਆਂ ਹੁੰਦੀਆਂ ਹਨ। ਜੇਕਰ ਇੱਕ {size,300} {unit,ਗ੍ਰਾਮ} ਵਾਲੀ ਬੈਗ ਵਿੱਚ {n,5} ਸਰਵਿੰਗਾਂ ਹਨ, ਤਾਂ ਤੁਸੀਂ ਕਿੰਨੇ {unit,ਗ੍ਰਾਮ} ਖਾ ਸਕਦੇ ਹੋ ਜੇਕਰ ਤੁਹਾਡਾ ਦਿਨ ਭਰ ਦਾ ਕੈਲੋਰੀ ਟੀਚਾ {total,2000} ਹੈ ਅਤੇ ਤੁਸੀਂ ਪਹਿਲਾਂ ਹੀ {spent,1800} ਕੈਲੋਰੀਆਂ ਖਪਤ ਕਰ ਚੁੱਕੇ ਹੋ?\n\n#init:\n- food = sample([\"ਪੋਪਕਾਰਨ\", \"ਬ੍ਰੈੱਡ\",  \"ਕੁਕੀਜ਼\"])\n- unit = sample([\"ਗ੍ਰਾਮ\", \"ਔਂਸ\", \"ਔਂਸ\"])\n- $cal = range(150, 500, 25)\n- $size = range(100, 400, 25)\n- $n = range(4, 8)\n- $total = range(1900, 2500, 5)\n- $spent = range(600, 1900, 25)\n\n#conditions:\n- spent < total\n- is_int( 5 * (total - spent) / cal)\n- divides(size, n)\n- divides(size//n, (total-spent)/cal)\n\n#answer: size//n * Fraction((total-spent)/cal)\n"
answer_annotated = "ਜੇਕਰ ਕੁੱਲ ਕੈਲੋਰੀ ਟੀਚਾ {total} ਹੈ ਅਤੇ ਮੈਂ {spent} ਕੈਲੋਰੀਆਂ ਖਪਤ ਕਰ ਲਈਆਂ ਹਨ, ਤਾਂ ਮੇਰੇ ਕੋਲ ਖਾਣ ਲਈ {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} ਕੈਲੋਰੀਆਂ ਬਾਕੀ ਹਨ\nਜੇਕਰ {food} ਦੀ ਹਰ ਸਰਵਿੰਗ ਵਿੱਚ {cal} ਕੈਲੋਰੀਆਂ ਹਨ ਅਤੇ ਮੇਰੇ ਕੋਲ ਖਾਣ ਲਈ ਸਿਰਫ਼ {total-spent} ਕੈਲੋਰੀਆਂ ਬਾਕੀ ਹਨ, ਤਾਂ ਮੈਂ ਸਿਰਫ਼ {total-spent}/{cal} ਸਰਵਿੰਗ ਖਾ ਸਕਦਾ ਹਾਂ = {Fraction((total-spent)/cal)} ਸਰਵਿੰਗ\nਅਸੀਂ ਇਹ ਵੀ ਜਾਣਦੇ ਹਾਂ ਕਿ {food} ਦੀ {size} {unit} ਵਾਲੀ ਬੈਗ ਵਿੱਚ {n} ਸਰਵਿੰਗਾਂ ਹਨ, ਇਸ ਲਈ ਹਰ ਸਰਵਿੰਗ ਵਿੱਚ {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit} ਹੁੰਦੇ ਹਨ\nਜੇਕਰ ਮੈਂ ਸਿਰਫ਼ {Fraction((total-spent)/cal)} ਸਰਵਿੰਗ ਖਾ ਸਕਦਾ ਹਾਂ, ਤਾਂ ਮੈਂ ਸਿਰਫ਼ {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit} ਖਾ ਸਕਦਾ ਹਾਂ\n#### {size//n * (total-spent)/cal}\n"
