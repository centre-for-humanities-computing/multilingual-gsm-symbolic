question_annotated = "{name,منصور} اپنے ڈنگراں نوں {food,پرالی} پا رہیا اے۔ {animal1,بکریاں} وچوں ہر اک نوں {n1,5} {unit,پاؤنڈ} چاہیدے نیں، تے {animal2,مجھاں} وچوں ہر اک نوں، {animal1,بکریاں} وچوں ہر اک دی لوڑ توں دُگنے نالوں {n2,3} {unit,پاؤنڈ} گھٹ چاہیدے نیں۔ جے {k1,15} {animal1,بکریاں} تے {k2,12} {animal2,مجھاں} نیں، تاں {name,منصور} نوں کنے {unit,پاؤنڈ} {food,پرالی} دی لوڑ اے؟\n\n#init:\n- name = sample(names_male)\n- food = sample([\"پرالی\", \"کھل\", \"ونڈ\", \"سائلیج\"])\n- animal1, animal2 = sample([\"بکریاں\", \"گاواں\", \"گھوڑیاں\", \"کھوتیاں\", \"مجھاں\", \"بھیڈاں\", \"مرغیاں\", \"بطخاں\", \"کٹیاں\"], 2)\n- unit = sample([\"پاؤنڈ\", \"کلوگرام\", \"کلو\"])\n- $n1 = range(3, 15)\n- $n2 = range(1, 10)\n- $k1 = range(10, 50)\n- $k2 = range(10, 50)\n\n#conditions:\n- 2*n1 - n2 > 0\n\n#answer: k1*n1 + k2*(2*n1 - n2)"
answer_annotated = "پہلاں ایہہ کڈھو پئی {animal2} وچوں ہر اک لئی {food} دی کنی مقدار چاہیدی اے: {n1} {unit} * 2 - {n2} = <<{n1}*2-{n2}={2*n1-n2}>>{2*n1-n2} {unit}/{animal2}\nہُن ایہہ کڈھو پئی ساریاں {animal2} لئی {food} دی کُل مقدار کنی چاہیدی اے: {2*n1-n2} {unit}/{animal2} * {k2} {animal2} = <<{2*n1-n2}*{k2}={k2*(2*n1-n2)}>>{k2*(2*n1-n2)} {unit}\nہُن ایہہ کڈھو پئی ساریاں {animal1} لئی {food} دی کُل مقدار کنی چاہیدی اے: {n1} {unit}/{animal1} * {k1} {animal1} = <<{n1}*{k1}={k1*n1}>>{k1*n1} {unit}\nہُن کُل کڈھن لئی {food} دیاں دوویں مقداراں جوڑو: {k2*(2*n1-n2)} {unit} + {k1*n1} {unit} = <<{k2*(2*n1-n2)}+{k1*n1}={k1*n1 + k2*(2*n1 - n2)}>>{k1*n1 + k2*(2*n1 - n2)} {unit}\n#### {k1*n1 + k2*(2*n1 - n2)}"
