question = "منصور اپنے ڈنگراں نوں پرالی پا رہیا اے۔ بکریاں وچوں ہر اک نوں 5 پاؤنڈ چاہیدے نیں، تے مجھاں وچوں ہر اک نوں، بکریاں وچوں ہر اک دی لوڑ توں دُگنے نالوں 3 پاؤنڈ گھٹ چاہیدے نیں۔ جے 15 بکریاں تے 12 مجھاں نیں، تاں منصور نوں کنے پاؤنڈ پرالی دی لوڑ اے؟"
answer = "پہلاں ایہہ کڈھو پئی مجھاں وچوں ہر اک لئی پرالی دی کنی مقدار چاہیدی اے: 5 پاؤنڈ * 2 - 3 = <<5*2-3=7>>7 پاؤنڈ/مجھاں\nہُن ایہہ کڈھو پئی ساریاں مجھاں لئی پرالی دی کُل مقدار کنی چاہیدی اے: 7 پاؤنڈ/مجھاں * 12 مجھاں = <<7*12=84>>84 پاؤنڈ\nہُن ایہہ کڈھو پئی ساریاں بکریاں لئی پرالی دی کُل مقدار کنی چاہیدی اے: 5 پاؤنڈ/بکریاں * 15 بکریاں = <<5*15=75>>75 پاؤنڈ\nہُن کُل کڈھن لئی پرالی دیاں دوویں مقداراں جوڑو: 84 پاؤنڈ + 75 پاؤنڈ = <<84+75=159>>159 پاؤنڈ\n#### 159"
