question = "ਵਾਟਸਨ ਹਰ ਰੋਜ਼ 10-ਘੰਟੇ ਦੀ ਸ਼ਿਫਟ ਕੰਮ ਕਰਦਾ ਹੈ, ਹਫ਼ਤੇ ਵਿੱਚ ਪੰਜ ਦਿਨ। ਉਸਨੂੰ ਘੰਟੇ ਦਾ ₹10 ਮਿਲਦਾ ਹੈ ਅਤੇ ਜੇਕਰ ਕੰਪਨੀ ਚੰਗਾ ਪ੍ਰਦਰਸ਼ਨ ਕਰਦੀ ਹੈ ਤਾਂ ਹਰ ਹਫ਼ਤੇ ₹300 ਬੋਨਸ ਮਿਲਦਾ ਹੈ। ਜੇਕਰ ਪੂਰੇ ਮਹੀਨੇ ਲਈ ਕੰਪਨੀ ਨੇ ਬਹੁਤ ਚੰਗਾ ਪ੍ਰਦਰਸ਼ਨ ਕੀਤਾ ਤਾਂ ਵਾਟਸਨ ਨੇ ਅਪ੍ਰੈਲ ਵਿੱਚ ਕਿੰਨਾ ਪੈਸਾ ਕਮਾਇਆ?"
answer = "ਇੱਕ ਦਿਨ ਵਿੱਚ, ਵਾਟਸਨ ਕਮਾਉਂਦਾ ਹੈ 10 * 10 = ₹<<10*10=100>>100\nਜੇਕਰ ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ ਪੰਜ ਦਿਨ ਕੰਮ ਕਰਦਾ ਹੈ, ਤਾਂ ਪੂਰੇ ਮਹੀਨੇ ਲਈ ਕੁੱਲ ਦਿਨਾਂ ਦੀ ਗਿਣਤੀ 5*4=<<5*4=20>>20 ਦਿਨ ਹੈ।\nਕਿਉਂਕਿ ਉਸਨੂੰ ਪ੍ਰਤੀ ਦਿਨ ₹100 ਮਿਲਦੇ ਹਨ, ਇਸ ਲਈ ਪੂਰੇ ਮਹੀਨੇ ਲਈ ਕੁੱਲ ਰਕਮ 20 * 100= ₹<<20*100=2000>>2000 ਹੈ।\nਉਸਨੂੰ 300 * 4 = ₹<<300*4=1200>>1200 ਬੋਨਸ ਵੀ ਮਿਲਿਆ ਕਿਉਂਕਿ ਅਪ੍ਰੈਲ ਦੀਆਂ ਸਾਰੀਆਂ ਹਫ਼ਤਿਆਂ ਵਿੱਚ ਕੰਪਨੀ ਨੇ ਚੰਗਾ ਪ੍ਰਦਰਸ਼ਨ ਕੀਤਾ।\nਅਪ੍ਰੈਲ ਦੇ ਅੰਤ ਵਿੱਚ, ਉਸਨੇ ਕਮਾਇਆ 2000 + 1200 = ₹<<2000+1200=3200>>3200।\n#### 3200"
