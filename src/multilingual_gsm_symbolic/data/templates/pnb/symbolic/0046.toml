question = "ماڈل ہائی سکول دی گریجویشن دی تقریب ایس سال اوہدے فائن آرٹس سینٹر وچ ہو رہی اے جتھے 6000 لوکاں دی جگہ اے۔ گریجویٹ طالب علماں لئی 950 سیٹاں تے آؤن والے استاداں لئی 300 سیٹاں رکھن مگروں، جے باقی ٹکٹاں برابر ونڈیاں جان تاں ہر گریجویٹ طالب علم نوں اپنے دوستاں تے ٹبر نوں دین لئی کنیاں ٹکٹاں ملن گیاں؟"
