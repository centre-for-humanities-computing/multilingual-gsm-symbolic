question = "Ek gnome din mein 12 pound ore nikal sakta hai jab uske paas uske khali haath hote hain. Woh ek kansa kholi se doo guna zyada nikal sakta hai aur ek steel kholi se kansa kholi ke muqable 50% zyada nikal sakta hai. 30 din ke mahine mein 40 gnomes jinke paas steel kholis hain, woh kitne pound ore nikal sakte hain?"
