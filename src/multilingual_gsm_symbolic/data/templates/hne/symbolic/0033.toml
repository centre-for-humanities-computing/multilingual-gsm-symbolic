question = "कारोल और जेनिफर लॉस एंजिल्स से बहिन हैं जो प्रसिद्ध लोगों के हस्ताक्षर जमा करना पसंद करत हैं। स्कूल से अपनी गर्मी की छुट्टी के दौरान, बहिन हर शाम हस्ताक्षर जमा करत हैं। पांच हफ्ते बाद, कारोल और जेनिफर अपनी हस्ताक्षर किताबों की तुलना करत हैं, यह गिनती करत हैं कि हर बहिन ने कितने हस्ताक्षर जमा किए हैं। कारोल की किताब में 20 हस्ताक्षर हैं, और जेनिफर के पास 44 हैं। बहिन के पास तीन और हफ्ते की गर्मी की छुट्टी है, और वे यह तय करत हैं कि वे मिलाकर 100 हस्ताक्षर छुट्टी के अंत तक पहुँचना चाहत हैं। अपने लक्ष्य तक पहुँचने के लिए बहिन को कितने हस्ताक्षर जमा करने की जरूरत है?"
