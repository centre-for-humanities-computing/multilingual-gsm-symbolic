question = "नेट अपने पशुओं को खर खिला रहा है। प्रत्येक बकरी को 5 पाउंड चाहिए, और प्रत्येक लामा को 3 पाउंड कम चाहिए, जो प्रत्येक बकरी की आवश्यकता का दोगुना है। यदि 15 बकरीs और 12 लामाs हैं, तो नेट को कितने पाउंड खर चाहिए?"
