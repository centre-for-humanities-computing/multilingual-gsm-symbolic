question = "सनी जिंजरब्रेड और सेब पाई फंड जुटाने के लिए बेच रहल बा। शनिवार पर, उसने 10 बॉक्स जिंजरब्रेड बेचे और रविवार से 4 बॉक्स सेब पाई कम बेचे। रविवार पर, उसने शनिवार से 5 बॉक्स जिंजरब्रेड ज्यादा बेचे और 15 बॉक्स सेब पाई। अगर जिंजरब्रेड की कीमत $6 है और सेब पाई की कीमत $15 है, तो सनी ने दो दिन के लिए कितना कमाया?"
answer = "रविवार पर उसने जिंजरब्रेड के 10 + 5 = <<10+5=15>>15 बॉक्स बेचे।\nसनी द्वारा बेचे गए जिंजरब्रेड के बॉक्सों की कुल संख्या 10 + 15 = <<10+15=25>>25 है।\nजिंजरब्रेड बेचने के लिए सनी ने 25*$6 = $<<25*6=150>>150 कमाए।\nशनिवार पर उसने सेब पाई के 15 - 4 = <<15-4=11>>11 बॉक्स बेचे।\nसनी द्वारा बेचे गए सेब पाई के बॉक्सों की कुल संख्या 15 + 11 = <<15+11=26>>26 है।\nसेब पाई बेचने के लिए उसने 26*$15 = $<<26*15=390>>390 कमाए।\nइसलिए, सनी ने दो दिन के लिए $150 + $390 = $<<150+390=540>>540 कमाए।\n#### 540\n"
