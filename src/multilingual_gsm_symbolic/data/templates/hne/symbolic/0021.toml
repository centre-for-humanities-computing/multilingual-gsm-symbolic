question = "फ्रैंकी हर रात अपना होमवर्क पूरा करने के बाद टीवी देखता है। सोमवार और मंगलवार को, उसने हर रात अपने पसंदीदा शो का 1-घंटे का एपिसोड देखा। बुधवार को, उसने 30-मिनट के शो के कुछ एपिसोड देखे। गुरुवार को, उसने होमवर्क जल्दी पूरा किया और 1-घंटे का एपिसोड और 30-मिनट का शो देखा। शुक्रवार को, वह देर तक जाग सका, इसलिए उसने दो 1-घंटे के एपिसोड देखे। यदि उसने कुल 7 घंटे टीवी देखा, तो उसने बुधवार को कितने 30-मिनट के एपिसोड देखे?"
