question = "Martha apne 3 nati-nati ke liye sardi ke kapde bun rahi hai. Woh tehin hain, isliye sabka size ek jaisa hai. Woh unke liye ek topi, dupatta, sweater, dastana, aur mule banana chahti hai. Ek topi banane mein 2 gund roon lagti hai, 4 ek dupatta ke liye, 12 ek sweater ke liye, 1 ek jode dastana ke liye, aur 2 ek jode mule ke liye. Use kitne gund roon khareedne chahiye?"
