question = "Dana voi juosta nelikertaa nopeammin kuin hän voi kävellä, mutta hän voi hyppiä nopeudella, joka on puoli niin nopea kuin hän voi juosta. Jos hän voi hypätä 3 kilometriä tunnissa, monta kilometriä hän voi kulkea kuusi tunnissa, jos hän käyttää yksi kolmasosa ajasta juosten ja kaksi kolmasosaa ajasta kävellen?"
answer = "Jos Dana voi hypätä puoli juoksunopeudestaan, hän voi juosta 3*2=<<3*2=6>>6 kilometriä tunnissa.\nJa koska hän voi juosta nelikertaa nopeammin kuin kävellä, tämä tarkoittaa, että hän voi kävellä 6/4=1,5 kilometriä tunnissa.\nJos kaksi kolmasosaa ajasta käytetään kävelyyn, hän kävelee 6*2/3=<<6*2/3=4>>4 tuntia.\nJos yksi kolmasosa ajasta käytetään juoksemiseen, hän juoksee 6-4=<<6-4=2>>2 tuntia.\nNäin ollen hän juoksee 2 tuntia 6 kilometriä tunnissa, eli 2*6=<<2*6=12>>12 kilometriä.\nHän kävelee 4 tuntia 1,5 kilometriä tunnissa, eli 4*1,5=<<4*1,5=6>>6 kilometriä.\nNäin ollen yhteensä hän kulkee 12+6=<<12+6=18>>18 kilometriä.\n#### 18\n"
