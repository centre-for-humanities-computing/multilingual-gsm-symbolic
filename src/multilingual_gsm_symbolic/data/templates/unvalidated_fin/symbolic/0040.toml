question = "{name,Sally} meni lomaan merenrannalle. Hänen vanhempansa antoivat hänelle ${total,15} ostaa mitä hän halusi. Muistomyymälässä taffy oli tarjouksessa \"Osta {n1,500} grammaa ${p1,3} hintaan, saat {n2,500} grammaa {discount,1/2} hinnalla.\" Hän otti {n12,2000} grammaa. Hän osti myös sekalaatikon merikotiloita ${p2,1.5} ja {n3,4} magneettia, jotka olivat ${p3,0.25} kappale. Kuinka paljon rahaa {name,Sally} on jäljellä?"
answer = "Taffy maksaa ${p1} {n1} grammasta ja hän saa {n2} grammaa {discount} hinnalla. Joten {discount} {n2} gramman hinnasta on {n2}/{n1}*{discount}*${p1} = ${n2/n1*discount*p1}.\nYhteensä se maksaa ${n2/n1*discount*p1} + ${p1} = ${n2/n1*discount*p1 + p1}.\nJäljellä oleva {n12 - n1 - n2} grammaa ei ole alennuksessa ja maksaa ${n12 - n1 - n2/n1*p1}, joten kokonaishinta on ${p1} + ${n2/n1*discount*p1} + ${n12 - n1 - n2/n1*p1} = $<<{p1} + {n2/n1*discount*p1} + {(n12 - n1 - n2)/n1*p1} = {p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}>>{p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}\n{n3} magneettia ${p3} kappale on {n3}*${p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nKun lisäät kaikki ostoksensa, ${p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1} + ${p2} + ${n3*p3} = $<<{p1+(n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1}+{p2}+{n3*p3}={int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}>>{int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}\nHänellä oli ${total} ja hän käytti ${int((p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1)+p2+n3*p3)}, joten hänellä on ${total} - ${int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} = $<<{total}-{int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}={total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)}>>{total-int(p1 + (n2/n1)*discount*p1 + (n12 - n1 - n2)/n1*p1+p2+n3*p3)} jäljellä\n#### 2\n"
