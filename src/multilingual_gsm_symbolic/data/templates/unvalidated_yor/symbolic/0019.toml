question = "Nínú ìdánwò 60-ìbéèrè, 40% ti àwọn ìbéèrè jẹ́ irọrun, àti àwọn tí ó kù ni a pin ni dọgba gẹ́gẹ́ bí àwọn ìbéèrè agbedemeji àti soro. Tí Aries bá ní ìdániloju láti gba 75% ti àwọn ìbéèrè irọrun, àti ida-meji ti àwọn ìbéèrè agbedemeji àti soro dáadáa, ó máa gba iye mélòó ní ìdániloju?"
answer = "Àwọn ìbéèrè agbedemeji àti soro jẹ́ 100% - 40% = 60% ti ìdánwò náà.\nÀwọn ìbéèrè irọrun jẹ́ 60 * 40/100 = <<60*40/100=24>>24 ìbéèrè.\nLapapọ̀, àwọn ìbéèrè agbedemeji àti soro jẹ́ 60 * 60/100 = <<60*60/100=36>>36 ìbéèrè.\nTí Aries bá ní ìdániloju láti gba 75% ti àwọn ìbéèrè irọrun, èyí túmọ̀ sí pé ó ní ìdániloju nínú 24 * 75/100 = <<24*75/100=18>>18 iye.\nLáti inú àwọn ìbéèrè agbedemeji àti soro, ó ní ìdániloju láti gba ida-meji wọn dáadáa, èyí sì jẹ́ 36 * 3/5 = <<36*3/5=22>>22 iye.\nNítorí náà, ó ní ìdániloju láti gba 18 + 22 = <<18+22=40>>40 iye nínú ìdánwò rẹ̀.\n#### 40\n"
