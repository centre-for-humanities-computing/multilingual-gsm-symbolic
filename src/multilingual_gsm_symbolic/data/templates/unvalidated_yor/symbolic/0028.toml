answer_annotated = "Ti {frac} ti apapọ agbara awọn {item} ninu {facility} ba ti lo, eyi tumọ si {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} awọn {item} ni awọn alaisan n lo.\nApapọ iye awọn {item} ninu {facility} laisi awọn alaisan tuntun jẹ {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} awọn {item}.\nTi {daily} awọn eniyan ba wa wọle lojoojumọ, apapọ iye awọn alaisan ninu {facility} lẹhin ọsẹ kan jẹ {daily} alaisan/ọjọ * 7 ọjọ/ọsẹ = {daily*7} awọn alaisan.\nLẹhin {period} ọsẹ, apapọ iye awọn alaisan ti a gba wọle sinu {facility} jẹ {daily*7} awọn alaisan/ọsẹ * {period} ọsẹ = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} awọn alaisan, ti ọkọọkan wọn n lo {item} kan.\nTi awọn {item} {total-int(total*frac)} ti ko lo ba wa ninu {facility} ṣaaju awọn alaisan tuntun, apapọ iye naa dinku si {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} awọn {item} ti ko lo.\n#### {total - (total * frac + daily * period * 7)}\n"
