question = "Ile-iwosan kan ni agbara ti 1000 awọn ibusun pẹlu 1/5 ti a n lo. Nitori ajakalẹ-arun coronavirus, 50 awọn alaisan wa wọle si ile-iwosan lojoojumọ. Ṣe iṣiro apapọ iye awọn ibusun ti ko lo ninu ile-iwosan lẹhin 2 ọsẹ."
answer = "Ti 1/5 ti apapọ agbara awọn ibusun ninu ile-iwosan ba ti lo, eyi tumọ si 1/5 * 1000 = <<1000*1/5=200>>200 awọn ibusun ni awọn alaisan n lo.\nApapọ iye awọn ibusun ninu ile-iwosan laisi awọn alaisan tuntun jẹ 1000 ibusun - 200 ibusun = <<1000-200=800>>800 awọn ibusun.\nTi 50 awọn eniyan ba wa wọle lojoojumọ, apapọ iye awọn alaisan ninu ile-iwosan lẹhin ọsẹ kan jẹ 50 alaisan/ọjọ * 7 ọjọ/ọsẹ = 350 awọn alaisan.\nLẹhin 2 ọsẹ, apapọ iye awọn alaisan ti a gba wọle sinu ile-iwosan jẹ 350 awọn alaisan/ọsẹ * 2 ọsẹ = <<350*2=700>>700 awọn alaisan, ti ọkọọkan wọn n lo ibusun kan.\nTi awọn ibusun 800 ti ko lo ba wa ninu ile-iwosan ṣaaju awọn alaisan tuntun, apapọ iye naa dinku si 800 ibusun - 700 ibusun = <<800-700=100>>100 awọn ibusun ti ko lo.\n#### 100\n"
