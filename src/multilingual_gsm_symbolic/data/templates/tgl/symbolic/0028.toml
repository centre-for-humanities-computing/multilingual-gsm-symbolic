question = "May ospital na may kapasidad ng 1000 kama na may 1/5 na okupado. Dahil sa paglaganap ng coronavirus, 50 pasyente ay tinatanggap sa ospital araw-araw. Kalkulahin ang kabuuang bilang ng mga kama na hindi okupado sa ospital pagkatapos ng 2 linggo."
