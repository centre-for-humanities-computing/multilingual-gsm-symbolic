question = "Sunny ay nagbebenta ng kuki ng luya at mansanas paye para sa isang pagtitipon ng pondo. Sa sabado, ibinenta niya ang 10 kahon ng kuki ng luya at 4 mas kaunting kahon ng mansanas paye, kaysa sa linggo. Sa linggo, ibinenta niya ang 5 mas maraming kahon ng kuki ng luya kaysa sa sabado at 15 kahon ng mansanas paye. Kung ang kuki ng luya ay nagkakahalaga ng ₱6 at ang mansanas paye ay nagkakahalaga ng ₱15, magkano ang kinita ni Sunny sa loob ng dalawang araw?"
