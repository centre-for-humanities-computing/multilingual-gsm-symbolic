question = "Sally ay nagbakasyon sa baybayin. Ang kanyang mga magulang ay nagbigay sa kanya ng $15 para bumili ng anumang gusto niya. Sa souvenir shop, ang taffy ay nasa sale na para sa \"Bumili ng 1 pound sa $3 bawat pound, makakuha ng 1 pound na may 1/2 na diskwento.\" Kinuha niya ang 4 pounds. Bumili din siya ng mixed bag ng mga seashells sa presyong $1.5 at 4 magnets na $0.25 bawat isa. Magkano ang pera na natira kay Sally?"
answer = "Sally ay bumibili ng 1 pound sa $3 at nakakakuha ng 1 pound na may 1/2 na diskwento. Kaya ang 1/2 na diskwento sa 1 pound ay $3*1/2 = $1.5. Ang natitirang 2 pounds ay walang diskwento at nagkakahalagang 2*$3 = $6, kaya ang kabuuang halaga ay $3+$3/2+$6=$21/2\n4 magnets sa $0.25 bawat isa ay 4*0.25=$<<4*0.25=1>>1\nKapag pinagsama ang lahat ng kanyang mga binili, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nSiya ay mayroong $15 at nag gastos ng $13 kaya siya ay may $15-$13 = $<<15-13=2>>2 na natira\n#### 2\n"
