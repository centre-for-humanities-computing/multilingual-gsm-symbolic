question_annotated = "{name,Sally} ay nagbakasyon sa baybayin. Ang kanyang mga magulang ay nagbigay sa kanya ng ${total,15} para bumili ng anumang gusto niya. Sa souvenir shop, ang taffy ay nasa sale na para sa \"Bumili ng {n1,1} pound sa ${p1,3} bawat pound, makakuha ng {n2,1} pound na may {discount,1/2} na diskwento.\" Kinuha niya ang {n12,4} pounds. Bumili din siya ng mixed bag ng mga seashells sa presyong ${p2,1.5} at {n3,4} magnets na ${p3,0.25} bawat isa. Magkano ang pera na natira kay {name,Sally}?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} ay bumibili ng {n1} pound sa ${p1} at nakakakuha ng {n2} pound na may {discount} na diskwento. Kaya ang {discount} na diskwento sa {n2} pound ay ${p1}*{discount} = ${float(n2*discount*p1)}. Ang natitirang {n12-n1-n2} pounds ay walang diskwento at nagkakahalagang {n12-n1-n2}*${p1} = ${(n12-n1-n2)*p1}, kaya ang kabuuang halaga ay ${n1*p1}+${n2*(1-discount)*p1}+${(n12-n1-n2)*p1}=${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}\n{n3} magnets sa ${p3} bawat isa ay {n3}*{p3}=$<<{n3}*{p3}={n3*p3}>>{n3*p3}\nKapag pinagsama ang lahat ng kanyang mga binili, ${n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+${p2}+${n3*p3} = $<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\nSiya ay mayroong ${total} at nag gastos ng ${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} kaya siya ay may ${total}-${int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = $<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} na natira\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
