question = "Isang gnome ay nakakabukid ng 12 libra ng mineral bawat araw gamit ang mga kamay. Siya ay nakakabubukid ng dalawang beses nang mas marami gamit ang piko ng bronsi at 50% pa gamit ang piko ng bakal kaysa sa gamit ang piko ng bronsi. Magkano libra ng mineral ang makakabukid ng 40 gnome na may piko ng bakal sa loob ng isang buwan na may 30 araw?"
