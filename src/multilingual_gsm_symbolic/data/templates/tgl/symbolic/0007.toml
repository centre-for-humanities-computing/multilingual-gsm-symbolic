question = "Bumibili ng pangakan ang isang magsasaka para sa kanyang kabayo. Bumibili siya ng iba't ibang panghay, oats, karot at kubo ng asukal. Dahil ang kubo ng asukal ay isang bihiring pagkain, bumibili siya lamang ng dalawa 1-libra na kahon nito para sa buong stable. Gusto niya lamang sapat na karot para pakainin ang kabayo habang sariwa ang gulay, kaya bumibili siya ng apat 12-libra na bag. Ang panghay ay ang pangunahing pagkain ng kanyang kabayo, kaya bumibili siya ng apatnapu't dalawa 75-libra na pakete. Ang oats ay isang pangunahing sangkap upang tugpuan ang panghay, kaya bumibili siya ng dalawampu 65-libra na sako. Kung ang kanyang farm truck ay kaya ng dala ng 2250 libras sa isang pagkakataon, ilang biyahe ang kailangan ng magsasaka upang dalhin ang lahat ng pagkain?"
