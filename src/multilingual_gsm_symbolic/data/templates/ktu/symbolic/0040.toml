question = "Sally kenda na pwa ya mbu ya masolo. Baba na mama wa yandi kumona yandi $15 kumona kila yandi lenda. Na sopa ya maboko, tafi yalaki na maboko ya \"Kumona 1 libongo na $3 na libongo, kumona 1 libongo 1/2 kati.\" Yandi kubaka 4 libongo. Yandi kumona kisi ya makoko ya mbu na $1.5 na 4 magnet ya $0.25 moene. Makila mangi Sally koleka?"
answer = "Sally kumona 1 libongo na $3 na kumona 1 libongo 1/2 kati. Bila 1/2 kati ya 1 libongo ndi $3*1/2 = $1.5. Kasi ya 2 libongo yandi ke mona maboko, na kutila 2*$3 = $6, bila kati ndi $3+$3/2+$6=$21/2\n4 magnet na $0.25 moene ndi 4*0.25=$<<4*0.25=1>>1\nBila wena kulonga kila yandi kumona, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nYandi yalaki $15 na kutila $13 bila yandi yalaki $15-$13 = $<<15-13=2>>2 koleka\n#### 2\n"
