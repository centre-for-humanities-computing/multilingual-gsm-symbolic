question_annotated = "{name,Sally} kenda na pwa ya mbu ya masolo. Baba na mama wa yandi kumona yandi ${total,15} kumona kila yandi lenda. Na sopa ya maboko, tafi yalaki na maboko ya \"Kumona {n1,1} libongo na ${p1,3} na libongo, kumona {n2,1} libongo {discount,1/2} kati.\" Yandi kubaka {n12,4} libongo. Yandi kumona kisi ya makoko ya mbu na ${p2,1.5} na {n3,4} magnet ya ${p3,0.25} moene. Makila mangi {name,Sally} koleka?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
