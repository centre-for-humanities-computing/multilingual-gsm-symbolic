answer = "Jei Dana gali šokinėti pusės greičio, kuriuo ji gali bėgti, tai ji gali bėgti 3*5/3=<<3*5/3=5>>5 mylių per valandą greičiu.\nIr kadangi ji gali bėgti greičiu, kuris yra keturis kartus greičiau nei ji eina pėsčiomis, tai reiškia, kad ji gali eiti pėsčiomis 5/4=1.25 mylių per valandą greičiu.\nJei dvi trečdalius laiko praleidžiama eidama pėsčiomis, tai ji eina pėsčiomis 10*3/5=<<10*3/5=6>>6 valandas.\nJei vieną trečdalį laiko praleidžiama bėgant, tai ji bėga 10-6=<<10-6=6>>6 valandas.\nTaigi, ji bėga 6 valandų 5 mylių per valandą greičiu, arba 6*5=<<6*5=30>>30 mylių.\nJi eina pėsčiomis 6 valandų 1.25 mylių per valandą greičiu, arba 6*1.25=<<6*1.25=15/2>>15/2 mylių.\nTaigi, iš viso ji nuvažiuoja 30+15/2=<<30+15/2=37>>37 mylių.\n#### 37\n"
