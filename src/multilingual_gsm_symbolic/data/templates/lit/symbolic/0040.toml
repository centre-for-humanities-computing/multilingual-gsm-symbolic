question = "Sally nuvyko į pajūrį atostogų. Jos tėvai davė jai $15 pirkti viską, ko norėjo. Suvenyrų parduotuvėje tafi buvo išparduodama pagal akciją „Pirk 1 funtą už $3 už funtą, gauk 1 funtą su 1/2 nuolaida.\" Ji įsidėjo 4 funtų. Ji taip pat nusipirko maišelį su kriauklėmis už $1.5 ir 4 magnetų po $0.25 vienetui. Kiek pinigų Sally lieka?"
answer = "Sally perka 1 funtą už $3 ir gauna 1 funtą su 1/2 nuolaida. Taigi 1/2 nuolaida 1 funtui yra $3*1/2 = $1.5. Likusi 2 funtų dalis neturi nuolaidos ir kainuoja 2*$3 = $6, taigi suma yra $3+$3/2+$6=$21/2\n4 magnetų po $0.25 vienetui yra 4*0.25=$<<4*0.25=1>>1\nSudėjus visus jos pirkinius, $21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\nJi turėjo $15 ir išleido $13, taigi jai liko $15-$13 = $<<15-13=2>>2\n#### 2\n"
