question = "Sunny parduoda imbieriniai sausainiai ir obuolys pyragą labdarai. Pirmąją dieną, šeštadienis, jis pardavė 10 dėžučių imbieriniai sausainiai ir 4 mažiau dėžučių obuolys pyrago, nei sekmadienis. Antrąją dieną, sekmadienis, jis pardavė 5 daugiau dėžučių imbieriniai sausainiai nei šeštadienis ir 15 dėžučių obuolys pyrago. Jei imbieriniai sausainiai kainuoja $6 ir obuolys pyragas kainuoja $15, kiek Sunny uždirbo per dvi dienas?"
