question = "Ūkininkas perka pašarų savo žirgai. Jis perka įvairių šienui, avižos, morkos ir cukraus kubeliai. Kadangi cukraus kubeliai yra retas skanėstas, jis perka tik du 1-svaras dėžutes visai arklidei. Jis nori tik tiek morkos maitinti žirgai, kol daržovės šviežios, todėl perka keturi 12-svaras maišus. šienui yra pagrindinė jo žirgai raciono dalis, todėl jis perka keturiasdešimt du 75-svaras paketus. Avižos yra bazinis papildymas šienui, todėl jis perka dvidešimt 65-svaras maišus. Jei jo ūkio sunkvežimis gali gabenti 2250 svarasų vienu metu, kiek kartų ūkininkas turi vykti, kad pristatytų visą pašarą?"
