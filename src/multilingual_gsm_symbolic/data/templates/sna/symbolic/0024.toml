question = "Kudaidzwa nemazivo ekudya, bhegi rechipisi rine 250 makalori pa chikamu. Kana bhegi re300 gramu rine 5 zvikamu, ungadya zvakadii gramu kana chikumbiro chako chemakalori chezuva nezuva chiri 2000 uye wakadya 1800 makalori?"
answer = "Kana chikumbiro chakakwana chemakalori chiri 2000 uye ndakadya 1800 makalori ndine 2000-1800 = <<2000-1800=200>>200 makalori ari kusiya kudywa\nKana chikamu chega chechipisi chine 250 makalori uye ndine 200 makalori chete ari kusiya kudywa, ndingadya chete 200/250 yechikamu = 4/5 yechikamu\nTinoziva zvakare kuti bhegi re300 gramu rechipisi rine 5 zvikamu, saka chikamu chega chine 300 gramu/5 = <<300/5=60>>60 gramu\nKana ndingadya chete 4/5 yechikamu, ndingadya chete 60 gramu * 4/5 = 48 gramu\n#### 48\n"
