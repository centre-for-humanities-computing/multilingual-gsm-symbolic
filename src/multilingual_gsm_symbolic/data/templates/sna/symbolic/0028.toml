question = "Chipatiro chine kugona kwe 1000 bhedha, uye 1/5 dzakazadzwa. Nekuda kwe kushamukira kwekoronavirus, 50 varwere vanogamuchirwa mu chipatiro zuva nezuva. Bata huwandu hwese hwe bhedha asina kuzadzwa mu chipatiro mushure me 2 mavhiki."
