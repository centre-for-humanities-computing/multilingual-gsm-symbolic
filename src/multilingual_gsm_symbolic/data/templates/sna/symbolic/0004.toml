question = "Garrett ari kugadzira mhepe yemupunga sechinonhuwirira. Sei poto yembeu ichichavara, mbeu dzinotanga kugadza nekumhanya. 20 dzinogadza munguva yekutanga ye 30 sekondi yekugadzira, zvichitevera matatu zviwanikwa zveizvozvo munguva inotevera ye 30 sekondi. Mbeu dzinowedzera kusvika ina zviwanikwa zvemhanyo yekutanga yekugadza munguva inotevera ye 30 sekondi, asi munguva yekupedzisira ye 30 sekondi, kugadza kunodzikira kusvika hafu yemhanyo seiyi yemunguva yapfuura ye 30 sekondi. Shure kwekuti Garrett abvise poto kubva pabhoti, chikamu chimwe chevana chehuwandu hwekugadza kwekugadzira kwemunguva yekupedzisira ye 30 sekondi dzinogadza zvakare kubva pashungu dzasara. Mangani mapepa emhepe Garrett anofanira kudyira?"
