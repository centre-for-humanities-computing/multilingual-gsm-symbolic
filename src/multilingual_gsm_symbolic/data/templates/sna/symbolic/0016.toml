answer_annotated = "Akatengesa {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} mabhokisi e {food} pa {d2}.\nNhamba yese yemabhokisi e {food} ya{name} akatengesa ndiyo {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} akawana {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} nekutengesa {food}.\nAkatengesa {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} mabhokisi e {fruit} pai pa {d1}.\nNhamba yese yemabhokisi e {fruit} pai ya{name} akatengesa ndiyo {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nAkawana {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} nekutengesa {fruit} pai.\nSaka, {name} akawana {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} mazuva maviri.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
