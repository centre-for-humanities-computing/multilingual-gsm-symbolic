question = "Tariro anotengesa keke ne apuro pai kumhembera mubatsiro. Pa svondo, akatengesa 10 mabhokisi e keke ne 4 mabhokisi mashoma e apuro pai, kupfuura pa mushandirapamwe. Pa mushandirapamwe, akatengesa 5 mabhokisi mazhinji e keke kupfuura pa svondo ne 15 mabhokisi e apuro pai. Kana keke ichidhura $6 ne apuro pai ichidhura $15, mari mangani tariro akawana mazuva maviri?"
answer = "Akatengesa 10 + 5 = <<10+5=15>>15 mabhokisi e keke pa mushandirapamwe.\nNhamba yese yemabhokisi e keke yatariro akatengesa ndiyo 10 + 15 = <<10+15=25>>25.\nTariro akawana 25*$6 = $<<25*6=150>>150 nekutengesa keke.\nAkatengesa 15 - 4 = <<15-4=11>>11 mabhokisi e apuro pai pa svondo.\nNhamba yese yemabhokisi e apuro pai yatariro akatengesa ndiyo 15 + 11 = <<15+11=26>>26.\nAkawana 26*$15 = $<<26*15=390>>390 nekutengesa apuro pai.\nSaka, tariro akawana $150 + $390 = $<<150+390=540>>540 mazuva maviri.\n#### 540\n"
