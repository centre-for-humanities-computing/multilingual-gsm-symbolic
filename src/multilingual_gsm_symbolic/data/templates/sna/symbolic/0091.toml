question = "Paimba yaAllan, kune chibages kaiviri kupfuura cannolis. Anes huwandu hwese hwe 40 cannolis muimba yake. Allan akatenga 60 cannolis zvimwe panhare ne 40 chibages shoma pane huwandu hwe cannolis. Tsvaga huwandu hwese hwekubatana hwe chibages ne cannolis Allan ane muimba?"
