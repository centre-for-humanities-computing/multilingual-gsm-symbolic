question = "Ένας αγρότης αγοράζει ζωοτροφές για τα άλογά του. Αγοράζει διάφορα είδη χόρτου, βρώμης, καρότων και ζάχαρης σε κύβους. Επειδή η ζάχαρη σε κύβους είναι μια σπάνια λιχουδιά, αγοράζει μόνο δύο κουτιά 1-χιλιογράμμου για ολόκληρο το στάβλο. Θέλει μόνο αρκετά καρότα για να ταΐσει τα άλογα ενώ τα λαχανικά είναι φρέσκα, οπότε αγοράζει τέσσερις σακούλες 12-χιλιογράμμων. Το χόρτο είναι η κύρια διατροφή των αλόγων του, οπότε αγοράζει σαράντα-δύο πακέτα 75-χιλιογράμμων. Η βρώμη είναι ένα βασικό συμπλήρωμα στο χόρτο, οπότε αγοράζει είκοσι σάκους 65-χιλιογράμμων. Αν το αγροτικό του φορτηγό μπορεί να μεταφέρει 2250 χιλιόγραμμα τη φορά, πόσα ταξίδια χρειάζεται ο αγρότης για να μεταφέρει όλη τη ζωοτροφή;"
