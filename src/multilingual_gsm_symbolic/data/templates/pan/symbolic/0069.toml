question = "ਮੰਗਲਵਾਰ ਨੂੰ, ਪੀਟਰ ਸੋਮਵਾਰ ਅਤੇ ਐਤਵਾਰ ਨੂੰ ਕੀਤੀ ਕਸਰਤ ਦੇ ਦੋ ਗੁਣਾ ਦੇ ਬਰਾਬਰ ਕਸਰਤ ਕਰਨਾ ਚਾਹੁੰਦਾ ਹੈ। ਐਤਵਾਰ ਨੂੰ ਉਸਨੇ 23 ਮਿੰਟ ਕਸਰਤ ਕੀਤੀ। ਸੋਮਵਾਰ ਨੂੰ ਉਸਨੇ 16 ਮਿੰਟ ਕਸਰਤ ਕੀਤੀ। ਉਸਨੂੰ ਮੰਗਲਵਾਰ ਨੂੰ ਕਿੰਨੇ ਮਿੰਟ ਕਸਰਤ ਕਰਨੀ ਪਵੇਗੀ?"
