question = "ਹਰਜੀਤ ਦਾ ਟੀਚਾ ਹੈ ਕਿ ਮੰਗਲਵਾਰ ਨੂੰ ਉਹ ਸੋਮਵਾਰ ਅਤੇ ਐਤਵਾਰ ਨੂੰ ਮਿਲਾ ਕੇ ਕੀਤੀ ਕਸਰਤ ਤੋਂ ਦੋ ਗੁਣਾ ਸਮਾਂ ਕਸਰਤ ਕਰੇ। ਐਤਵਾਰ ਨੂੰ ਉਸਨੇ 23 ਮਿੰਟ ਕਸਰਤ ਕੀਤੀ। ਸੋਮਵਾਰ ਨੂੰ ਉਸਨੇ 16 ਮਿੰਟ ਕਸਰਤ ਕੀਤੀ। ਆਪਣਾ ਟੀਚਾ ਪੂਰਾ ਕਰਨ ਲਈ ਉਸਨੂੰ ਮੰਗਲਵਾਰ ਨੂੰ ਕਿੰਨੇ ਮਿੰਟ ਕਸਰਤ ਕਰਨੀ ਪਵੇਗੀ?"
answer = "ਐਤਵਾਰ ਅਤੇ ਸੋਮਵਾਰ ਨੂੰ ਕੀਤੀ ਕਸਰਤ 23 + 16 = <<23+16=39>>39 ਮਿੰਟ ਹੈ।\nਮੰਗਲਵਾਰ ਦਾ ਟੀਚਾ 39 * 2 = <<39*2=78>>78 ਮਿੰਟ ਹੈ।\n#### 78"
