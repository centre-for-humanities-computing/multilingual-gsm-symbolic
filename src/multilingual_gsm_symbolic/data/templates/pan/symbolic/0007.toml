question = "ਇੱਕ ਕਿਸਾਨ ਆਪਣੇ ਘੋੜਿਆਂ ਲਈ ਚਾਰਾ ਖਰੀਦ ਰਿਹਾ ਹੈ। ਉਹ ਤੂੜੀ, ਜੌਂ, ਗਾਜਰ ਅਤੇ ਸ਼ੱਕਰ ਦੇ ਟੁਕੜੇ ਦੀਆਂ ਵੱਖ-ਵੱਖ ਕਿਸਮਾਂ ਖਰੀਦਦਾ ਹੈ। ਕਿਉਂਕਿ ਸ਼ੱਕਰ ਦੇ ਟੁਕੜੇ ਸਿਰਫ਼ ਕਦੇ-ਕਦਾਈਂ ਖ਼ਾਸ ਲਾਡ ਵਜੋਂ ਦੇਣ ਲਈ ਹਨ, ਉਹ ਪੂਰੇ ਤਬੇਲੇ ਲਈ ਸਿਰਫ਼ ਦੋ 1-ਪੌਂਡ ਦੇ ਡੱਬੇ ਖਰੀਦਦਾ ਹੈ। ਉਹ ਗਾਜਰ ਦੀ ਸਿਰਫ਼ ਓਨੀ ਮਾਤਰਾ ਚਾਹੁੰਦਾ ਹੈ ਜਿੰਨੀ ਸਬਜ਼ੀਆਂ ਦੇ ਤਾਜ਼ਾ ਰਹਿਣ ਤੱਕ ਘੋੜਿਆਂ ਨੂੰ ਖੁਆਈ ਜਾ ਸਕੇ, ਇਸ ਲਈ ਉਹ ਚਾਰ 12-ਪੌਂਡ ਦੇ ਥੈਲੇ ਖਰੀਦਦਾ ਹੈ। ਤੂੜੀ ਉਸਦੇ ਘੋੜਿਆਂ ਦਾ ਮੁੱਖ ਭੋਜਨ ਹੈ, ਇਸ ਲਈ ਉਹ ਬਿਆਲੀ 75-ਪੌਂਡ ਦੇ ਪੈਕ ਖਰੀਦਦਾ ਹੈ। ਜੌਂ ਤੂੜੀ ਦੇ ਨਾਲ ਦਿੱਤੀ ਜਾਣ ਵਾਲੀ ਮੁੱਖ ਖੁਰਾਕ ਹੈ, ਇਸ ਲਈ ਉਹ ਵੀਹ 65-ਪੌਂਡ ਦੀਆਂ ਬੋਰੀਆਂ ਖਰੀਦਦਾ ਹੈ। ਜੇ ਉਸਦਾ ਖੇਤ ਵਾਲਾ ਟਰੱਕ ਇੱਕ ਵਾਰ ਵਿੱਚ 2250 ਪੌਂਡ ਲਿਜਾ ਸਕਦਾ ਹੈ, ਤਾਂ ਸਾਰਾ ਚਾਰਾ ਲਿਜਾਣ ਲਈ ਕਿਸਾਨ ਨੂੰ ਕਿੰਨੇ ਗੇੜੇ ਲਗਾਉਣੇ ਪੈਣਗੇ?"
answer = "ਕਿਸਾਨ 2*1 = <<2*1=2>>2 ਪੌਂਡ ਸ਼ੱਕਰ ਦੇ ਟੁਕੜੇ ਖਰੀਦ ਰਿਹਾ ਹੈ।\nਉਹ 4*12 = <<4*12=48>>48 ਪੌਂਡ ਗਾਜਰ ਖਰੀਦ ਰਿਹਾ ਹੈ।\nਉਹ 20*65 = <<20*65=1300>>1300 ਪੌਂਡ ਜੌਂ ਖਰੀਦ ਰਿਹਾ ਹੈ।\nਉਹ 42*75 = <<42*75=3150>>3150 ਪੌਂਡ ਤੂੜੀ ਖਰੀਦ ਰਿਹਾ ਹੈ।\nਸਾਰੇ ਚਾਰੇ ਦਾ ਭਾਰ 2 + 48 + 1300 + 3150 = <<2+48+1300+3150=4500>>4500 ਪੌਂਡ ਹੈ।\nਇਸ ਲਈ, ਕਿਸਾਨ ਨੂੰ ਆਪਣੇ ਟਰੱਕ ਵਿੱਚ ਸਾਰਾ ਚਾਰਾ ਲਿਜਾਣ ਲਈ 4500 / 2250 = <<4500/2250=2>>2 ਗੇੜੇ ਲਗਾਉਣੇ ਪੈਣਗੇ।\n#### 2"
