question_annotated = "ਇੱਕ ਕਿਸਾਨ ਆਪਣੇ {animals, ਘੋੜਿਆਂ} ਲਈ ਚਾਰਾ ਖਰੀਦ ਰਿਹਾ ਹੈ। ਉਹ {treat1, ਤੂੜੀ}, {treat2, ਜੌਂ}, {treat3, ਗਾਜਰ} ਅਤੇ {rare_treat, ਸ਼ੱਕਰ ਦੇ ਟੁਕੜੇ} ਦੀਆਂ ਵੱਖ-ਵੱਖ ਕਿਸਮਾਂ ਖਰੀਦਦਾ ਹੈ। ਕਿਉਂਕਿ {rare_treat, ਸ਼ੱਕਰ ਦੇ ਟੁਕੜੇ} ਸਿਰਫ਼ ਕਦੇ-ਕਦਾਈਂ ਖ਼ਾਸ ਲਾਡ ਵਜੋਂ ਦੇਣ ਲਈ ਹਨ, ਉਹ ਪੂਰੇ ਤਬੇਲੇ ਲਈ ਸਿਰਫ਼ {n4_txt, ਦੋ} {w4, 1}-{unit, ਪੌਂਡ} ਦੇ ਡੱਬੇ ਖਰੀਦਦਾ ਹੈ। ਉਹ {treat3, ਗਾਜਰ} ਦੀ ਸਿਰਫ਼ ਓਨੀ ਮਾਤਰਾ ਚਾਹੁੰਦਾ ਹੈ ਜਿੰਨੀ ਸਬਜ਼ੀਆਂ ਦੇ ਤਾਜ਼ਾ ਰਹਿਣ ਤੱਕ {animals, ਘੋੜਿਆਂ} ਨੂੰ ਖੁਆਈ ਜਾ ਸਕੇ, ਇਸ ਲਈ ਉਹ {n3_txt, ਚਾਰ} {w3, 12}-{unit, ਪੌਂਡ} ਦੇ ਥੈਲੇ ਖਰੀਦਦਾ ਹੈ। {treat1, ਤੂੜੀ} ਉਸਦੇ {animals, ਘੋੜਿਆਂ} ਦਾ ਮੁੱਖ ਭੋਜਨ ਹੈ, ਇਸ ਲਈ ਉਹ {n1_txt,ਬਿਆਲੀ} {w1, 75}-{unit, ਪੌਂਡ} ਦੇ ਪੈਕ ਖਰੀਦਦਾ ਹੈ। {treat2, ਜੌਂ} {treat1, ਤੂੜੀ} ਦੇ ਨਾਲ ਦਿੱਤੀ ਜਾਣ ਵਾਲੀ ਮੁੱਖ ਖੁਰਾਕ ਹੈ, ਇਸ ਲਈ ਉਹ {n2_txt, ਵੀਹ} {w2, 65}-{unit, ਪੌਂਡ} ਦੀਆਂ ਬੋਰੀਆਂ ਖਰੀਦਦਾ ਹੈ। ਜੇ ਉਸਦਾ ਖੇਤ ਵਾਲਾ ਟਰੱਕ ਇੱਕ ਵਾਰ ਵਿੱਚ {total, 2250} {unit, ਪੌਂਡ} ਲਿਜਾ ਸਕਦਾ ਹੈ, ਤਾਂ ਸਾਰਾ ਚਾਰਾ ਲਿਜਾਣ ਲਈ ਕਿਸਾਨ ਨੂੰ ਕਿੰਨੇ ਗੇੜੇ ਲਗਾਉਣੇ ਪੈਣਗੇ?\n\n#init:\n- animals = sample(['ਘੋੜਿਆਂ', 'ਬਲਦਾਂ', 'ਸੂਰਾਂ', 'ਊਠਾਂ', 'ਬੱਕਰਿਆਂ'])\n- unit = sample(weights_med)\n- treat1, treat2 = sample([\"ਤੂੜੀ\", \"ਮੱਕੀ\", \"ਜੌਂ\", \"ਸੇਬ\", \"ਕਣਕ\"], 2)\n- treat3 = sample([\"ਗਾਜਰ\", \"ਚੁਕੰਦਰ\", \"ਖੀਰੇ\"])\n- rare_treat = sample([\"ਸ਼ੱਕਰ ਦੇ ਟੁਕੜੇ\", \"ਤਰਬੂਜ਼ ਦੇ ਛਿਲਕੇ\", \"ਪੁਦੀਨੇ ਦੀਆਂ ਗੋਲੀਆਂ\"])\n- n4_txt, n4_val = range_str(2, 7, 2, numbers)\n- n3_txt, n3_val = range_str(4, 11, 2, numbers)\n- n2_txt, n2_val = range_str(15, 21, 1, numbers)\n- n1_txt, n1_val = range_str(30, 43, 2, numbers)\n- $w4 = range(1, 4)\n- $w3 = range(8, 13, 2)\n- $w2 = range(45, 70, 5)\n- $w1 = range(55, 80, 5)\n- $total = range(1500, 2300, 150)\n\n#conditions:\n- w4*n4_val < w3*n3_val < w2*n2_val < w1 * n1_val\n- divides(n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4, total)\n\n#answer: (n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4)//total"
answer_annotated = "ਕਿਸਾਨ {n4_val}*{w4} = <<{n4_val}*{w4}={n4_val*w4}>>{n4_val*w4} {unit} {rare_treat} ਖਰੀਦ ਰਿਹਾ ਹੈ।\nਉਹ {n3_val}*{w3} = <<{n3_val}*{w3}={n3_val*w3}>>{n3_val*w3} {unit} {treat3} ਖਰੀਦ ਰਿਹਾ ਹੈ।\nਉਹ {n2_val}*{w2} = <<{n2_val}*{w2}={n2_val*w2}>>{n2_val*w2} {unit} {treat2} ਖਰੀਦ ਰਿਹਾ ਹੈ।\nਉਹ {n1_val}*{w1} = <<{n1_val}*{w1}={n1_val*w1}>>{n1_val*w1} {unit} {treat1} ਖਰੀਦ ਰਿਹਾ ਹੈ।\nਸਾਰੇ ਚਾਰੇ ਦਾ ਭਾਰ {n4_val*w4} + {n3_val*w3} + {n2_val*w2} + {n1_val*w1} = <<{n4_val*w4}+{n3_val*w3}+{n2_val*w2}+{n1_val*w1}={n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4}>>{n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4} {unit} ਹੈ।\nਇਸ ਲਈ, ਕਿਸਾਨ ਨੂੰ ਆਪਣੇ ਟਰੱਕ ਵਿੱਚ ਸਾਰਾ ਚਾਰਾ ਲਿਜਾਣ ਲਈ {n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4} / {total} = <<{n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4}/{total}={(n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4)//total}>>{(n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4)//total} ਗੇੜੇ ਲਗਾਉਣੇ ਪੈਣਗੇ।\n#### {(n1_val*w1 + n2_val*w2 + n3_val*w3 + n4_val*w4)//total}"
