question = "ਗੁਰਪ੍ਰੀਤ ਨੇ ਆਂਡੇ ਲੱਭਣ ਦੀ ਖੇਡ ਲਈ ਬਾਗ਼ ਵਿੱਚ 3 ਦਰਜਨ ਆਂਡੇ ਲੁਕਾਏ। ਹਰਜੀਤ ਨੇ 5 ਆਂਡੇ ਲੱਭੇ। ਸਿਮਰਨ ਨੇ ਹਰਜੀਤ ਨਾਲੋਂ ਦੋ ਗੁਣਾ ਆਂਡੇ ਲੱਭੇ। ਮਨਦੀਪ ਨੇ ਸਿਮਰਨ ਨਾਲੋਂ 2 ਘੱਟ ਲੱਭੇ, ਅਤੇ ਕਿਰਨ ਨੇ ਓਨੇ ਆਂਡੇ ਲੱਭੇ ਜਿੰਨੇ ਮਨਦੀਪ ਦੇ ਆਂਡਿਆਂ ਦਾ ਅੱਧਾ ਹਿੱਸਾ ਬਣਦਾ ਹੈ। ਬਾਗ਼ ਵਿੱਚ ਅਜੇ ਕਿੰਨੇ ਆਂਡੇ ਲੁਕੇ ਹੋਏ ਹਨ?"
answer = "ਗੁਰਪ੍ਰੀਤ ਨੇ 3*12 = <<3*12=36>>36 ਆਂਡੇ ਲੁਕਾਏ।\nਹਰਜੀਤ ਨੇ 5 ਆਂਡੇ ਲੱਭੇ।\nਸਿਮਰਨ ਨੇ 5*2 = <<5*2=10>>10 ਆਂਡੇ ਲੱਭੇ।\nਮਨਦੀਪ ਨੇ 10 - 2 = <<10-2=8>>8 ਆਂਡੇ ਲੱਭੇ।\nਕਿਰਨ ਨੇ 8*1/2 = <<8*1/2=4>>4 ਆਂਡੇ ਲੱਭੇ।\nਬੱਚਿਆਂ ਨੇ ਕੁੱਲ 5 + 10 + 8 + 4 = <<5+10+8+4=27>>27 ਆਂਡੇ ਲੱਭੇ।\nਬਾਗ਼ ਵਿੱਚ ਅਜੇ ਲੁਕੇ ਹੋਏ ਆਂਡਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 36 - 27 = <<36-27=9>>9 ਆਂਡੇ ਹੈ।\n#### 9"
