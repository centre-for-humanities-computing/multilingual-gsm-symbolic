question = "ਡੈਨਾ ਆਪਣੇ ਚੱਲਣ ਨਾਲੋਂ ਚਾਰ ਗੁਣਾ ਤੇਜ਼ ਦੌੜ ਸਕਦੀ ਹੈ, ਪਰ ਉਹ ਛਾਲ ਮਾਰ ਸਕਦੀ ਹੈ ਇੱਕ ਰਫ਼ਤਾਰ 'ਤੇ ਜੋ ਉਸ ਦੀ ਦੌੜ ਦੀ ਰਫ਼ਤਾਰ ਦਾ ਅੱਧਾ ਹੈ। ਜੇਕਰ ਉਹ 3 ਮੀਲ ਪ੍ਰਤੀ ਘੰਟਾ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲ ਛਾਲ ਮਾਰ ਸਕਦੀ ਹੈ, ਤਾਂ ਛੇ ਘੰਟਿਆਂ ਵਿੱਚ ਉਹ ਕਿੰਨੇ ਮੀਲ ਤੈਅ ਕਰ ਸਕਦੀ ਹੈ ਜੇਕਰ ਉਹ ਇੱਕ ਤਿਹਾਈ ਸਮਾਂ ਦੌੜਨ 'ਤੇ ਅਤੇ ਦੋ ਤਿਹਾਈ ਸਮਾਂ ਚੱਲਣ 'ਤੇ ਬਿਤਾਉਂਦੀ ਹੈ?"
answer = "ਜੇਕਰ ਡੈਨਾ ਆਪਣੀ ਦੌੜ ਦੀ ਰਫ਼ਤਾਰ ਦਾ ਅੱਧਾ ਛਾਲ ਮਾਰ ਸਕਦੀ ਹੈ, ਤਾਂ ਉਹ 3*2=<<3*2=6>>6 ਮੀਲ ਪ੍ਰਤੀ ਘੰਟਾ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲ ਦੌੜ ਸਕਦੀ ਹੈ।\nਅਤੇ ਕਿਉਂਕਿ ਉਹ ਉਸ ਰਫ਼ਤਾਰ ਨਾਲ ਦੌੜ ਸਕਦੀ ਹੈ ਜੋ ਉਸ ਦੇ ਚੱਲਣ ਨਾਲੋਂ ਚਾਰ ਗੁਣਾ ਹੈ, ਇਸਦਾ ਮਤਲਬ ਹੈ ਕਿ ਉਹ 6/5=1.2 ਮੀਲ ਪ੍ਰਤੀ ਘੰਟਾ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲ ਚੱਲ ਸਕਦੀ ਹੈ।\nਜੇਕਰ ਦੋ ਤਿਹਾਈ ਸਮਾਂ ਚੱਲਣ 'ਤੇ ਬਿਤਾਇਆ ਜਾਂਦਾ ਹੈ, ਤਾਂ ਉਹ 6*3/5=<<6*3/5=18/5>>18/5 ਘੰਟੇ ਚੱਲਦੀ ਹੈ।\nਜੇਕਰ ਇੱਕ ਤਿਹਾਈ ਸਮਾਂ ਦੌੜਨ 'ਤੇ ਬਿਤਾਇਆ ਜਾਂਦਾ ਹੈ, ਤਾਂ ਉਹ 6-18/5=<<6-18/5=18/5>>18/5 ਘੰਟੇ ਦੌੜਦੀ ਹੈ।\nਇਸ ਲਈ, ਉਹ 18/5 ਘੰਟੇ 6 ਮੀਲ ਪ੍ਰਤੀ ਘੰਟਾ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲ ਦੌੜਦੀ ਹੈ, ਜਾਂ 18/5*6=<<18/5*6=108/5>>108/5 ਮੀਲ।\nਉਹ 18/5 ਘੰਟੇ 1.2 ਮੀਲ ਪ੍ਰਤੀ ਘੰਟਾ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲ ਚੱਲਦੀ ਹੈ, ਜਾਂ 18/5*1.2=<<18/5*1.2=108/25>>108/25 ਮੀਲ।\nਇਸ ਲਈ, ਕੁੱਲ ਮਿਲਾ ਕੇ, ਉਹ 108/5+108/25=<<108/5+108/25=25>>25 ਮੀਲ ਯਾਤਰਾ ਕਰਦੀ ਹੈ।\n#### 25\n"
