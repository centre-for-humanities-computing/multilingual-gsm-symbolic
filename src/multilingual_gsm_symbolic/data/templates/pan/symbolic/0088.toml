question = "ਹਰਲੀਨ ਆਪਣੇ ਤੁਰਨ ਨਾਲੋਂ ਚਾਰ ਗੁਣਾ ਤੇਜ਼ ਦੌੜ ਸਕਦੀ ਹੈ, ਪਰ ਟਪੂਸੀਆਂ ਮਾਰਦਿਆਂ ਉਸਦੀ ਰਫ਼ਤਾਰ ਉਸਦੀ ਦੌੜਨ ਦੀ ਰਫ਼ਤਾਰ ਦਾ ਅੱਧਾ ਹੀ ਹੁੰਦੀ ਹੈ। ਜੇਕਰ ਉਹ 3 ਮੀਲ ਪ੍ਰਤੀ ਘੰਟਾ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲ ਟਪੂਸੀਆਂ ਮਾਰ ਸਕਦੀ ਹੈ, ਤਾਂ ਛੇ ਘੰਟਿਆਂ ਵਿੱਚ ਉਹ ਕਿੰਨੇ ਮੀਲ ਤੈਅ ਕਰ ਸਕਦੀ ਹੈ ਜੇਕਰ ਉਹ ਇੱਕ ਤਿਹਾਈ ਸਮਾਂ ਦੌੜਨ ਵਿੱਚ ਅਤੇ ਦੋ ਤਿਹਾਈ ਸਮਾਂ ਤੁਰਨ ਵਿੱਚ ਬਿਤਾਉਂਦੀ ਹੈ?"
answer = "ਜੇਕਰ ਟਪੂਸੀਆਂ ਮਾਰਦਿਆਂ ਹਰਲੀਨ ਦੀ ਰਫ਼ਤਾਰ ਉਸਦੀ ਦੌੜਨ ਦੀ ਰਫ਼ਤਾਰ ਦਾ ਅੱਧਾ ਹੈ, ਤਾਂ ਉਹ 3*2=<<3*2=6>>6 ਮੀਲ ਪ੍ਰਤੀ ਘੰਟਾ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲ ਦੌੜ ਸਕਦੀ ਹੈ।\nਅਤੇ ਕਿਉਂਕਿ ਉਹ ਉਸ ਰਫ਼ਤਾਰ ਨਾਲ ਦੌੜ ਸਕਦੀ ਹੈ ਜੋ ਉਸ ਦੇ ਤੁਰਨ ਨਾਲੋਂ ਚਾਰ ਗੁਣਾ ਹੈ, ਇਸਦਾ ਮਤਲਬ ਹੈ ਕਿ ਉਹ 6/4=1.5 ਮੀਲ ਪ੍ਰਤੀ ਘੰਟਾ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲ ਤੁਰ ਸਕਦੀ ਹੈ।\nਜੇਕਰ ਦੋ ਤਿਹਾਈ ਸਮਾਂ ਤੁਰਨ 'ਤੇ ਬਿਤਾਇਆ ਜਾਂਦਾ ਹੈ, ਤਾਂ ਉਹ 6*2/3=<<6*2/3=4>>4 ਘੰਟੇ ਤੁਰਦੀ ਹੈ।\nਜੇਕਰ ਇੱਕ ਤਿਹਾਈ ਸਮਾਂ ਦੌੜਨ 'ਤੇ ਬਿਤਾਇਆ ਜਾਂਦਾ ਹੈ, ਤਾਂ ਉਹ 6-4=<<6-4=2>>2 ਘੰਟੇ ਦੌੜਦੀ ਹੈ।\nਇਸ ਲਈ, ਉਹ 2 ਘੰਟੇ 6 ਮੀਲ ਪ੍ਰਤੀ ਘੰਟਾ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲ ਦੌੜਦੀ ਹੈ, ਜਾਂ 2*6=<<2*6=12>>12 ਮੀਲ।\nਉਹ 4 ਘੰਟੇ 1.5 ਮੀਲ ਪ੍ਰਤੀ ਘੰਟਾ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲ ਤੁਰਦੀ ਹੈ, ਜਾਂ 4*1.5=<<4*1.5=6>>6 ਮੀਲ।\nਇਸ ਲਈ, ਕੁੱਲ ਮਿਲਾ ਕੇ, ਉਹ 12+6=<<12+6=18>>18 ਮੀਲ ਤੈਅ ਕਰਦੀ ਹੈ।\n#### 18"
