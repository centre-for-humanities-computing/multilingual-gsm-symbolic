question = "ਜੈਕੀ ਆਪਣੇ ਟੈਕਸ ਲਈ ਇੱਕ ਹਿਸਾਬਕਿਤਾਬੀ ਕੋਲ ਜਾਂਦੀ ਹੈ। ਜੇ ਉਹ 3 ਘੰਟੇ ਫ੍ਰੀਲਾਂਸ ਕਰਦੀ ਹੈ ਅਤੇ ਦਰ $35/ਘੰਟਾ ਹੈ, ਤਾਂ ਕੁੱਲ ਕਮਾਈ ਕਿੰਨੀ ਹੁੰਦੀ ਹੈ? ਜੇ ਹਿਸਾਬਕਿਤਾਬੀ ਦੀ ਫੀਸ $90 ਹੈ, ਤਾਂ ਉਸਨੂੰ ਹੱਥ ਵਿੱਚ ਕਿੰਨੀ ਵਾਧੂ ਰਕਮ ਮਿਲੇਗੀ?"
