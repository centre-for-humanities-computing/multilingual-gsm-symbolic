question = "ਸਿਮਰਨ ਇਹ ਫ਼ੈਸਲਾ ਕਰਨ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰ ਰਹੀ ਹੈ ਕਿ ਉਹ ਆਪਣਾ ਟੈਕਸ ਆਪ ਕਰੇ ਜਾਂ ਇੱਕ ਅਕਾਊਂਟੈਂਟ ਰੱਖੇ। ਜੇ ਉਹ ਇਹ ਕੰਮ ਆਪ ਕਰਦੀ ਹੈ, ਤਾਂ ਉਹ ਫ੍ਰੀਲਾਂਸ ਕੰਮ ਦੇ 3 ਘੰਟੇ ਘੱਟ ਕਰ ਸਕੇਗੀ, ਜਿਸ ਨਾਲ ਉਸਨੂੰ $35 ਪ੍ਰਤੀ ਘੰਟਾ ਦੀ ਕਮਾਈ ਦਾ ਨੁਕਸਾਨ ਹੋਵੇਗਾ। ਅਕਾਊਂਟੈਂਟ $90 ਫੀਸ ਲੈਂਦਾ ਹੈ। ਜੇ ਉਹ ਅਕਾਊਂਟੈਂਟ ਰੱਖ ਲੈਂਦੀ ਹੈ, ਤਾਂ ਉਸ ਕੋਲ ਕਿੰਨੇ ਪੈਸੇ ਵੱਧ ਹੋਣਗੇ?"
answer = "ਪਹਿਲਾਂ ਪਤਾ ਕਰੋ ਕਿ ਜੇ ਸਿਮਰਨ ਆਪਣਾ ਟੈਕਸ ਆਪ ਕਰਦੀ ਹੈ ਤਾਂ ਕੁੱਲ ਕਿੰਨੀ ਕਮਾਈ ਦਾ ਨੁਕਸਾਨ ਹੁੰਦਾ ਹੈ: $35/ਘੰਟਾ * 3 ਘੰਟੇ = $<<35*3=105>>105\nਫਿਰ ਇਹ ਪਤਾ ਕਰਨ ਲਈ ਕਿ ਸਿਮਰਨ ਕਿੰਨੇ ਪੈਸੇ ਬਚਾਉਂਦੀ ਹੈ, ਅਕਾਊਂਟੈਂਟ ਦੀ ਫੀਸ ਘਟਾਓ: $105 - $90 = $<<105-90=15>>15\n#### 15"
