question = "Jerry ਇੱਕ ਛੇ-ਪਾਸਿਆਂ ਵਾਲਾ ਪਾਸਾ ਸੁੱਟ ਰਿਹਾ ਹੈ। ਪਾਸੇ 'ਤੇ 3 ਤੋਂ ਵੱਡਾ ਅੰਕ ਆਉਣ ਦੀ ਸੰਭਾਵਨਾ, ਲਗਾਤਾਰ ਦੋ ਵਾਰ ਜਿਸਤ ਅੰਕ ਆਉਣ ਦੀ ਸੰਭਾਵਨਾ ਨਾਲੋਂ ਕਿੰਨੇ ਪ੍ਰਤੀਸ਼ਤ ਅੰਕ ਵੱਧ ਹੈ?"
answer = "ਪਾਸੇ 'ਤੇ 3 ਤੋਂ ਵੱਡੇ 3 ਅੰਕ ਹਨ, ਇਸ ਲਈ ਉਹਨਾਂ ਵਿੱਚੋਂ ਇੱਕ ਆਉਣ ਦੀ ਸੰਭਾਵਨਾ 3/6=50% ਹੈ।\nਇੱਕ ਜਿਸਤ ਅੰਕ ਆਉਣ ਦੀ ਸੰਭਾਵਨਾ 50% ਹੈ, ਇਸ ਲਈ ਲਗਾਤਾਰ ਦੋ ਵਾਰ ਜਿਸਤ ਅੰਕ ਆਉਣ ਦੀ ਸੰਭਾਵਨਾ 50% * 50% = 25% ਹੈ।\nਇਹਨਾਂ ਦੋ ਸੰਭਾਵਨਾਵਾਂ ਵਿੱਚ ਅੰਤਰ 50% - 25% = 25% ਹੈ।\n#### 25\n"
