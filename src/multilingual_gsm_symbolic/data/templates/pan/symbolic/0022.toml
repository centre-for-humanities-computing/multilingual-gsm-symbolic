question = "ਸਿਮਰਨ ਆਪਣੇ ਘਰ ਇੱਕ ਡਿਨਰ ਪਾਰਟੀ ਲਈ ਤਿਆਰੀ ਕਰ ਰਹੀ ਸੀ, ਜਿੱਥੇ ਉਹ ਮਟਨ ਕਰੀ ਪਰੋਸਣਾ ਚਾਹੁੰਦੀ ਸੀ। ਉਸਨੇ ਧਿਆਨ ਦਿੱਤਾ ਕਿ ਉਸ ਕੋਲ ਪਲਾਸਟਿਕ ਦੇ ਚਮਚ ਨਹੀਂ ਸਨ, ਇਸ ਲਈ ਉਸਨੇ ਚਮਚ ਦਾ ਇੱਕ ਨਵਾਂ ਪੈਕੇਟ ਖਰੀਦਿਆ। ਬਾਅਦ ਵਿੱਚ, ਉਸਦੇ ਪਤੀ ਨੇ ਵੀ 5 ਨਵੇਂ ਚਮਚ ਦਾ ਇੱਕ ਪੈਕੇਟ ਖਰੀਦਿਆ ਅਤੇ ਉਹ ਸਿਮਰਨ ਨੂੰ ਦੇ ਦਿੱਤੇ। ਜਦੋਂ ਸਿਮਰਨ ਮਟਨ ਕਰੀ ਬਣਾ ਰਹੀ ਸੀ, ਉਸਨੇ ਮਟਨ ਕਰੀ ਦਾ ਸਵਾਦ ਲੈਣ ਲਈ ਤਿੰਨ ਚਮਚ ਵਰਤੇ। ਬਾਅਦ ਵਿੱਚ, ਜਦੋਂ ਉਹ ਮੇਜ਼ ਸਜਾਉਣ ਗਈ, ਉਸ ਕੋਲ ਕੁੱਲ 12 ਚਮਚ ਸਨ। ਸਿਮਰਨ ਨੇ ਜੋ ਪੈਕੇਟ ਖਰੀਦਿਆ ਸੀ, ਉਸ ਵਿੱਚ ਕਿੰਨੇ ਚਮਚ ਸਨ?"
answer = "ਸਿਮਰਨ ਅਤੇ ਉਸਦੇ ਪਤੀ ਵੱਲੋਂ ਲਿਆਂਦੇ ਚਮਚ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 12+3=<<12+3=15>>15 ਚਮਚ ਸੀ।\nਕਿਉਂਕਿ ਪਤੀ ਨੇ 5 ਚਮਚ ਦਾ ਪੈਕੇਟ ਖਰੀਦਿਆ ਸੀ, ਇਸ ਲਈ ਸਿਮਰਨ ਦੇ ਪੈਕੇਟ ਵਿੱਚ 15-5=<<15-5=10>>10 ਚਮਚ ਸਨ।\n#### 10"
