question_annotated = "{name,ਸੈਲੀ} ਛੁੱਟੀਆਂ ਲਈ ਸਮੁੰਦਰ ਕੰਢੇ ਗਈ। ਉਸਦੇ ਮਾਪਿਆਂ ਨੇ ਉਸਨੂੰ ${total,15} ਦਿੱਤੇ ਤਾਂ ਜੋ ਉਹ ਜੋ ਚਾਹੇ ਖਰੀਦ ਸਕੇ। ਯਾਦਗਾਰੀ ਦੀ ਦੁਕਾਨ ਵਿੱਚ ਟੌਫੀ ਉੱਤੇ ਇੱਕ ਖਾਸ ਆਫ਼ਰ ਸੀ: 1 ਪਾਉਂਡ ${p1,3} ਪ੍ਰਤੀ ਪਾਉਂਡ ਦੇ ਹਿਸਾਬ ਨਾਲ, ਅਤੇ 1/2 ਛੂਟ ਵਾਲਾ ਹੋਰ 1 ਪਾਉਂਡ। ਉਸਨੇ {n12,4} ਪਾਉਂਡ ਲਏ। ਉਸਨੇ ਸਮੁੰਦਰੀ-ਖੋਪੜੀਆਂ ਦਾ ਇੱਕ ਬੈਗ ${p2,1.5} ਵਿੱਚ ਅਤੇ {n3,4} ਮੈਗਨੇਟ ${p3,0.25} ਹਰ ਇੱਕ ਦੇ ਹਿਸਾਬ ਨਾਲ ਵੀ ਖਰੀਦੇ। ਸੈਲੀ ਕੋਲ ਕਿੰਨੇ ਪੈਸੇ ਬਚੇ?\n\n#init:\n- name = sample(names_female)\n- cur = sample(currencies_sym)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)\n"
answer_annotated = "{name} ਪਹਿਲਾਂ 1 ਪਾਉਂਡ {cur}{p1} ਵਿੱਚ ਖਰੀਦਦੀ ਹੈ ਅਤੇ 1/2 ਛੂਟ ਵਾਲਾ 1 ਪਾਉਂਡ {cur}{p1} * 1/2 = {cur}<<{p1}*1/2={p1*1/2}>>{p1*1/2} ਵਿੱਚ ਲੈਂਦੀ ਹੈ।\nਬਾਕੀ {n12 - n1 - n2} ਪਾਉਂਡਾਂ 'ਤੇ ਕੋਈ ਛੂਟ ਨਹੀਂ ਹੈ, ਇਸ ਲਈ ਉਹਨਾਂ ਦੀ ਕੀਮਤ {n12 - n1 - n2}*{cur}{p1} = {cur}<<{n12 - n1 - n2}*{p1}={(n12 - n1 - n2)*p1}>>{(n12 - n1 - n2)*p1} ਹੈ।\nਇਸ ਲਈ ਟੌਫੀ ਦੀ ਕੁੱਲ ਕੀਮਤ {n1*p1}+{n2*(1-discount)*p1}+{(n12-n1-n2)*p1} = {cur}<<{n1*p1}+{n2*(1-discount)*p1}+{(n12-n1-n2)*p1}={n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}>>{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1} ਹੈ।\n4 ਮੈਗਨੇਟਾਂ ਦੀ ਕੀਮਤ {n3}*{p3} = <<{n3}*{p3}={n3*p3}>>{n3*p3} ਹੈ।\nਜਦੋਂ ਤੁਸੀਂ ਇਹ ਸਾਰੀਆਂ ਖਰੀਦਾਂ ਜੋੜਦੇ ਹੋ, {n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3} = {cur}<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={float(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{float(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} ਹੈ।\nਉਸ ਕੋਲ {total} ਸਨ ਅਤੇ ਉਸਨੇ {int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} ਖਰਚੇ, ਇਸ ਲਈ ਉਸ ਕੋਲ {total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = {cur}<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} ਬਚਦੇ ਹਨ।\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}\n"
