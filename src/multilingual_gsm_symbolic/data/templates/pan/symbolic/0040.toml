question = "ਸੈਲੀ ਛੁੱਟੀਆਂ ਲਈ ਸਮੁੰਦਰ ਕੰਢੇ ਗਈ। ਉਸਦੇ ਮਾਪਿਆਂ ਨੇ ਉਸਨੂੰ $15 ਦਿੱਤੇ ਤਾਂ ਜੋ ਉਹ ਜੋ ਚਾਹੇ ਖਰੀਦ ਸਕੇ। ਯਾਦਗਾਰੀ ਦੀ ਦੁਕਾਨ ਵਿੱਚ ਟੌਫੀ ਉੱਤੇ ਇੱਕ ਖਾਸ ਆਫ਼ਰ ਸੀ: 1 ਪਾਉਂਡ $3 ਪ੍ਰਤੀ ਪਾਉਂਡ ਦੇ ਹਿਸਾਬ ਨਾਲ, ਅਤੇ 1/2 ਛੂਟ ਵਾਲਾ ਹੋਰ 1 ਪਾਉਂਡ। ਉਸਨੇ 4 ਪਾਉਂਡ ਲਏ। ਉਸਨੇ ਸਮੁੰਦਰੀ-ਖੋਪੜੀਆਂ ਦਾ ਇੱਕ ਬੈਗ $1.5 ਵਿੱਚ ਅਤੇ 4 ਮੈਗਨੇਟ $0.25 ਹਰ ਇੱਕ ਦੇ ਹਿਸਾਬ ਨਾਲ ਵੀ ਖਰੀਦੇ। ਸੈਲੀ ਕੋਲ ਕਿੰਨੇ ਪੈਸੇ ਬਚੇ?"
answer = "ਸੈਲੀ ਪਹਿਲਾਂ 1 ਪਾਉਂਡ £3 ਵਿੱਚ ਖਰੀਦਦੀ ਹੈ ਅਤੇ 1/2 ਛੂਟ ਵਾਲਾ 1 ਪਾਉਂਡ £3 * 1/2 = £<<3*1/2=1.5>>1.5 ਵਿੱਚ ਲੈਂਦੀ ਹੈ।\nਬਾਕੀ -4 ਪਾਉਂਡਾਂ 'ਤੇ ਕੋਈ ਛੂਟ ਨਹੀਂ ਹੈ, ਇਸ ਲਈ ਉਹਨਾਂ ਦੀ ਕੀਮਤ -4*£3 = £<<-4*3=-12>>-12 ਹੈ।\nਇਸ ਲਈ ਟੌਫੀ ਦੀ ਕੁੱਲ ਕੀਮਤ 12+54/5+-12 = £<<12+54/5+-12=54/5>>54/5 ਹੈ।\n4 ਮੈਗਨੇਟਾਂ ਦੀ ਕੀਮਤ 4*0.25 = <<4*0.25=1>>1 ਹੈ।\nਜਦੋਂ ਤੁਸੀਂ ਇਹ ਸਾਰੀਆਂ ਖਰੀਦਾਂ ਜੋੜਦੇ ਹੋ, 54/5+1.5+1 = £<<54/5+1.5+1=13.3>>13.3 ਹੈ।\nਉਸ ਕੋਲ 15 ਸਨ ਅਤੇ ਉਸਨੇ 13 ਖਰਚੇ, ਇਸ ਲਈ ਉਸ ਕੋਲ 15-13 = £<<15-13=2>>2 ਬਚਦੇ ਹਨ।\n#### 2\n"
