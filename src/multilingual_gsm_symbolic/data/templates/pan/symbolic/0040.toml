question = "ਸਿਮਰਨ ਛੁੱਟੀਆਂ ਲਈ ਸਮੁੰਦਰ ਕੰਢੇ ਗਈ। ਉਸਦੇ ਮਾਪਿਆਂ ਨੇ ਉਸਨੂੰ ₹15 ਦਿੱਤੇ ਤਾਂ ਜੋ ਉਹ ਜੋ ਚਾਹੇ ਖਰੀਦ ਸਕੇ। ਯਾਦਗਾਰੀ ਚੀਜ਼ਾਂ ਦੀ ਦੁਕਾਨ ਵਿੱਚ ਟੌਫੀ ਉੱਤੇ ਇੱਕ ਖਾਸ ਆਫ਼ਰ ਸੀ: \"1 ਪਾਉਂਡ ₹3 ਪ੍ਰਤੀ ਪਾਉਂਡ ਦੇ ਹਿਸਾਬ ਨਾਲ ਖਰੀਦੋ, ਤੇ ਹੋਰ 1 ਪਾਉਂਡ 1/2 ਛੂਟ 'ਤੇ ਲਵੋ।\" ਉਸਨੇ 4 ਪਾਉਂਡ ਲਏ। ਉਸਨੇ ਸਿੱਪੀਆਂ ਦਾ ਇੱਕ ਮਿਲਿਆ-ਜੁਲਿਆ ਬੈਗ ₹1.5 ਵਿੱਚ ਅਤੇ 4 ਮੈਗਨੇਟ ₹0.25 ਹਰ ਇੱਕ ਦੇ ਹਿਸਾਬ ਨਾਲ ਵੀ ਖਰੀਦੇ। ਸਿਮਰਨ ਕੋਲ ਕਿੰਨੇ ਪੈਸੇ ਬਚੇ?"
answer = "ਸਿਮਰਨ ਪਹਿਲਾਂ 1 ਪਾਉਂਡ ₹3 ਪ੍ਰਤੀ ਪਾਉਂਡ ਦੇ ਹਿਸਾਬ ਨਾਲ ਖਰੀਦਦੀ ਹੈ ਅਤੇ ਹੋਰ 1 ਪਾਉਂਡ 1/2 ਛੂਟ 'ਤੇ ਲੈਂਦੀ ਹੈ। ਇਸ ਲਈ 1 ਪਾਉਂਡ 'ਤੇ 1/2 ਦੀ ਛੂਟ 1*₹3*1/2 = ₹1.5 ਬਣਦੀ ਹੈ।\nਬਾਕੀ 2 ਪਾਉਂਡਾਂ 'ਤੇ ਕੋਈ ਛੂਟ ਨਹੀਂ ਹੈ, ਇਸ ਲਈ ਉਹਨਾਂ ਦੀ ਕੀਮਤ 2*₹3 = ₹<<2*3=6>>6 ਹੈ।\nਇਸ ਲਈ ਟੌਫੀ ਦੀ ਕੁੱਲ ਕੀਮਤ ₹3+₹3/2+₹6 = ₹21/2 ਹੈ।\n4 ਮੈਗਨੇਟਾਂ ਦੀ ਕੀਮਤ 4*0.25 = ₹<<4*0.25=1>>1 ਹੈ।\nਜਦੋਂ ਤੁਸੀਂ ਇਹ ਸਾਰੀਆਂ ਖਰੀਦਾਂ ਜੋੜਦੇ ਹੋ, ₹21/2+₹1.5+₹1 = ₹<<21/2+1.5+1=13>>13 ਹੈ।\nਉਸ ਕੋਲ ₹15 ਸਨ ਅਤੇ ਉਸਨੇ ₹13 ਖਰਚੇ, ਇਸ ਲਈ ਉਸ ਕੋਲ ₹15-₹13 = ₹<<15-13=2>>2 ਬਚਦੇ ਹਨ।\n#### 2"
