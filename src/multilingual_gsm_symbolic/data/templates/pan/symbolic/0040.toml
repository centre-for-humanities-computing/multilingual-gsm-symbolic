question_annotated = "{name,ਸਿਮਰਨ} ਛੁੱਟੀਆਂ ਲਈ ਸਮੁੰਦਰ ਕੰਢੇ ਗਈ। ਉਸਦੇ ਮਾਪਿਆਂ ਨੇ ਉਸਨੂੰ ₹{total,15} ਦਿੱਤੇ ਤਾਂ ਜੋ ਉਹ ਜੋ ਚਾਹੇ ਖਰੀਦ ਸਕੇ। ਯਾਦਗਾਰੀ ਚੀਜ਼ਾਂ ਦੀ ਦੁਕਾਨ ਵਿੱਚ ਟੌਫੀ ਉੱਤੇ ਇੱਕ ਖਾਸ ਆਫ਼ਰ ਸੀ: \"{n1,1} ਪਾਉਂਡ ₹{p1,3} ਪ੍ਰਤੀ ਪਾਉਂਡ ਦੇ ਹਿਸਾਬ ਨਾਲ ਖਰੀਦੋ, ਤੇ ਹੋਰ {n2,1} ਪਾਉਂਡ {discount,1/2} ਛੂਟ 'ਤੇ ਲਵੋ।\" ਉਸਨੇ {n12,4} ਪਾਉਂਡ ਲਏ। ਉਸਨੇ ਸਿੱਪੀਆਂ ਦਾ ਇੱਕ ਮਿਲਿਆ-ਜੁਲਿਆ ਬੈਗ ₹{p2,1.5} ਵਿੱਚ ਅਤੇ {n3,4} ਮੈਗਨੇਟ ₹{p3,0.25} ਹਰ ਇੱਕ ਦੇ ਹਿਸਾਬ ਨਾਲ ਵੀ ਖਰੀਦੇ। {name,ਸਿਮਰਨ} ਕੋਲ ਕਿੰਨੇ ਪੈਸੇ ਬਚੇ?\n\n#init:\n- name = sample(names_female)\n- $total = range(10, 40, 5)\n- $n1 = range(1, 6)\n- $n2 = range(1, 6)\n- $n12 = range(2, 12)\n- $n3 = range(4, 12, 4)\n- $p1 = range(1, 10)\n- $p2 = arange(1, 3.5, 0.5)\n- $p3 = arange(0.25, 1.5, 0.25)\n- $discount = sample(fractions)\n\n#conditions:\n- n2 <= n1\n- n12 - n1 - n2 > 0\n- n12 - n1 - n2 < n1\n- is_int(n1 * p1 + n2 * (1-discount) * p1 + (n12 - n1 - n2) * p1 + p2 + n3 * p3)\n- n1*p1 + n2*(1-discount)*p1 + (n12-n1-n2)*p1 + p2 + n3*p3 < total\n\n#answer: total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)"
answer_annotated = "{name} ਪਹਿਲਾਂ {n1} ਪਾਉਂਡ ₹{p1} ਪ੍ਰਤੀ ਪਾਉਂਡ ਦੇ ਹਿਸਾਬ ਨਾਲ ਖਰੀਦਦੀ ਹੈ ਅਤੇ ਹੋਰ {n2} ਪਾਉਂਡ {discount} ਛੂਟ 'ਤੇ ਲੈਂਦੀ ਹੈ। ਇਸ ਲਈ {n2} ਪਾਉਂਡ 'ਤੇ {discount} ਦੀ ਛੂਟ {n2}*₹{p1}*{discount} = ₹{float(n2*discount*p1)} ਬਣਦੀ ਹੈ।\nਬਾਕੀ {n12-n1-n2} ਪਾਉਂਡਾਂ 'ਤੇ ਕੋਈ ਛੂਟ ਨਹੀਂ ਹੈ, ਇਸ ਲਈ ਉਹਨਾਂ ਦੀ ਕੀਮਤ {n12-n1-n2}*₹{p1} = ₹<<{n12-n1-n2}*{p1}={(n12-n1-n2)*p1}>>{(n12-n1-n2)*p1} ਹੈ।\nਇਸ ਲਈ ਟੌਫੀ ਦੀ ਕੁੱਲ ਕੀਮਤ ₹{n1*p1}+₹{n2*(1-discount)*p1}+₹{(n12-n1-n2)*p1} = ₹{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1} ਹੈ।\n{n3} ਮੈਗਨੇਟਾਂ ਦੀ ਕੀਮਤ {n3}*{p3} = ₹<<{n3}*{p3}={n3*p3}>>{n3*p3} ਹੈ।\nਜਦੋਂ ਤੁਸੀਂ ਇਹ ਸਾਰੀਆਂ ਖਰੀਦਾਂ ਜੋੜਦੇ ਹੋ, ₹{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+₹{p2}+₹{n3*p3} = ₹<<{n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1}+{p2}+{n3*p3}={int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} ਹੈ।\nਉਸ ਕੋਲ ₹{total} ਸਨ ਅਤੇ ਉਸਨੇ ₹{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} ਖਰਚੇ, ਇਸ ਲਈ ਉਸ ਕੋਲ ₹{total}-₹{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} = ₹<<{total}-{int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}={total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}>>{total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)} ਬਚਦੇ ਹਨ।\n#### {total-int(n1*p1+n2*(1-discount)*p1+(n12-n1-n2)*p1+p2+n3*p3)}"
