question = "ਮਨਦੀਪ ਕੋਲ 10 ਬੰਟੇ ਵਾਲੀ ਇੱਕ ਥੈਲੀ ਹੈ। ਥੈਲੀ ਚੁੱਕਦੇ ਹੋਏ ਉਹ ਇੱਕ ਪੱਥਰ ਨਾਲ ਠੇਡਾ ਖਾ ਗਿਆ ਅਤੇ ਉਨ੍ਹਾਂ ਦਾ ਅੱਧਾ ਹਿੱਸਾ ਡਿੱਗ ਪਿਆ। ਉਸਨੇ ਲੱਭਣ ਦੀ ਕੋਸ਼ਿਸ਼ ਕੀਤੀ ਪਰ ਸਿਰਫ਼ 3 ਹੀ ਮਿਲੇ। ਘਰ ਪਹੁੰਚ ਕੇ ਉਸਨੇ ਸਾਰੇ ਬੰਟੇ ਹੋਰ ਧਿਆਨ ਨਾਲ ਵੇਖੇ। ਚੁੱਕੇ ਹੋਇਆਂ ਵਿੱਚੋਂ ਦੋ ਬੰਟੇ ਨਹੀਂ ਸਨ, ਸਗੋਂ ਮੋਤੀ ਸਨ, ਇਸ ਲਈ ਉਸਨੇ ਉਹ ਸੁੱਟ ਦਿੱਤੇ। ਅਖ਼ੀਰ ਵਿੱਚ ਮਨਦੀਪ ਕੋਲ ਕਿੰਨੇ ਬੰਟੇ ਬਚੇ?"
