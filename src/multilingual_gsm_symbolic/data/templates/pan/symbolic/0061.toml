question = "ਬ੍ਰੈਂਡਨ ਕੋਲ 10 ਮਾਰਬਲ ਵਾਲੀ ਇੱਕ ਥੈਲੀ ਹੈ। ਥੈਲੀ ਚੁੱਕਦੇ ਹੋਏ ਉਹ ਇੱਕ ਪੱਥਰ ਨਾਲ ਠੇਡਾ ਖਾ ਗਿਆ ਅਤੇ ਉਨ੍ਹਾਂ ਵਿੱਚੋਂ ਅੱਧਾ ਡਿੱਗ ਪਏ। ਉਸਨੇ ਲੱਭਣ ਦੀ ਕੋਸ਼ਿਸ਼ ਕੀਤੀ ਪਰ ਸਿਰਫ਼ 3 ਹੀ ਮਿਲੇ। ਘਰ ਪਹੁੰਚ ਕੇ ਉਸਨੇ ਮਾਰਬਲ ਨੂੰ ਹੋਰ ਧਿਆਨ ਨਾਲ ਵੇਖਿਆ। ਚੁੱਕੇ ਹੋਇਆਂ ਵਿੱਚੋਂ ਦੋ ਮਾਰਬਲ ਨਹੀਂ ਸਨ, ਸਗੋਂ ਮੋਤੀ ਸਨ, ਇਸ ਲਈ ਉਸਨੇ ਉਹ ਸੁੱਟ ਦਿੱਤੇ। ਅਖ਼ੀਰ ਵਿੱਚ ਬ੍ਰੈਂਡਨ ਕੋਲ ਕਿੰਨੇ ਮਾਰਬਲ ਬਚੇ?"
