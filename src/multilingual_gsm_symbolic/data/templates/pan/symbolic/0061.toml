question = "ਬ੍ਰੈਂਡਨ ਦੇ ਕੋਲ ਮਾਰਬਲ ਦੀ ਇੱਕ ਥੈਲੀ ਹੈ ਜਿਸ ਵਿੱਚ 10 ਅੰਦਰ ਹਨ। ਉਹ ਇਸਨੂੰ ਲੈ ਜਾ ਰਿਹਾ ਸੀ ਜਦੋਂ ਇੱਕ ਪੱਥਰ ਤੇ ਡਿੱਗ ਪਿਆ ਅਤੇ ਉਨ੍ਹਾਂ ਵਿੱਚੋਂ ਅੱਧਾ ਡਿੱਗ ਗਏ। ਉਸਨੇ ਉਹਨਾਂ ਨੂੰ ਖੋਜਣ ਲਈ ਕੋਸ਼ਿਸ਼ ਕੀਤੀ ਪਰ ਸਿਰਫ਼ 3 ਹੀ ਲੱਭੇ। ਜਦੋਂ ਉਹ ਘਰ ਵਾਪਸ ਗਿਆ, ਤਾਂ ਉਸਨੇ ਮਾਰਬਲ ਦੀ ਹੋਰ ਜਾਂਚ ਕੀਤੀ। ਉਹਨਾਂ ਵਿੱਚੋਂ ਦੋ ਜੋ ਉਸਨੇ ਚੁੱਕੇ ਸਨ ਮਾਰਬਲ ਨਹੀਂ ਸਨ, ਬਲਕਿ ਅਸਲ ਵਿੱਚ ਮੋਤੀ ਸਨ ਇਸ ਲਈ ਉਸਨੇ ਉਹਨਾਂ ਨੂੰ ਹਟਾ ਦਿੱਤਾ। ਬ੍ਰੈਂਡਨ ਕੋਲ ਅੰਤ ਵਿੱਚ ਕਿੰਨੇ ਮਾਰਬਲ ਬਚੇ?"
answer = "ਬ੍ਰੈਂਡਨ ਦੇ ਮਾਰਬਲ ਡਿੱਗ ਗਏ ਅਤੇ ਉਸ ਕੋਲ 10*1/2=<<10*1/2=5>>5 ਮਾਰਬਲ ਬਚੇ।\nਉਸਨੇ ਖੋਜ ਕੀਤੀ ਅਤੇ ਆਪਣੇ ਗੁਆਚੇ ਹੋਏ ਮਾਰਬਲ ਵਿੱਚੋਂ ਕੁਝ ਲੱਭੇ, ਜਿਸ ਨਾਲ ਉਸਦੇ ਕੋਲ ਵਾਪਸ 5+3=<<5+3=8>>8 ਮਾਰਬਲ ਆ ਗਏ।\nਉਹ ਘਰ ਗਿਆ ਅਤੇ ਦੋ ਮੋਤੀ ਹਟਾ ਦਿੱਤੇ, ਇਸ ਨਾਲ ਉਸ ਕੋਲ 8-2=<<8-2=6>>6 ਮਾਰਬਲ ਬਚੇ।\n#### 6\n"
