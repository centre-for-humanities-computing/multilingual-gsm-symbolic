question_annotated = "{name,ਸਿਮਰਨ} {shop,ਬੇਕਰੀ} ਗਈ ਅਤੇ ਵੱਖ-ਵੱਖ ਕਿਸਮਾਂ ਦੀਆਂ {item,ਪੇਸਟਰੀਆਂ} ਖਰੀਦੀਆਂ। ਉਸਨੇ {n1,3} ਡਜ਼ਨ {item1,ਡੋਨਟ} ਖਰੀਦੇ ਜਿਨ੍ਹਾਂ ਦੀ ਕੀਮਤ ${p1,68} ਪ੍ਰਤੀ ਡਜ਼ਨ ਸੀ, {n2,2} ਡਜ਼ਨ {item2,ਮਿਨੀ ਕੱਪਕੇਕ} ਜਿਨ੍ਹਾਂ ਦੀ ਕੀਮਤ ${p2,80} ਪ੍ਰਤੀ ਡਜ਼ਨ ਸੀ, ਅਤੇ {n3,6} ਡਜ਼ਨ {item3,ਮਿਨੀ ਚੀਜ਼ਕੇਕ} ${p3,55} ਪ੍ਰਤੀ ਡਜ਼ਨ ਦੇ ਹਿਸਾਬ ਨਾਲ। ਕੁੱਲ ਖਰਚਾ ਕਿੰਨਾ ਹੋਇਆ?\n\n#init:\n- name = sample(names_female)\n- shop = sample([\"ਬੇਕਰੀ\", \"ਸਵੀਟ ਸ਼ਾਪ\", \"ਕਨਫੈਕਸ਼ਨਰੀ\", \"ਕੈਫੇ\"])\n- item = sample([\"ਪੇਸਟਰੀਆਂ\", \"ਬੇਕਰੀ ਦੀਆਂ ਚੀਜ਼ਾਂ\", \"ਮਿਠਾਈਆਂ\", \"ਖਾਣ ਵਾਲੀਆਂ ਚੀਜ਼ਾਂ\"])\n- item1 = sample([\"ਡੋਨਟ\", \"ਕ੍ਰੋਸਾਂ\", \"ਪੈਟੀਜ਼\", \"ਕਰੀਮ ਰੋਲ\"])\n- item2 = sample([\"ਮਿਨੀ ਕੱਪਕੇਕ\", \"ਮੈਕਰੋਨ\", \"ਕੂਕੀਜ਼\", \"ਟਾਰਟ\"])\n- item3 = sample([\"ਮਿਨੀ ਚੀਜ਼ਕੇਕ\", \"ਬ੍ਰਾਊਨੀ\", \"ਮਫ਼ਿਨ\", \"ਰਸਕ\"])\n- $n1 = range(1, 10)\n- $n2 = range(4, 10)\n- $n3 = range(2, 10)\n- $p1 = range(11, 21)\n- $p2 = range(73, 90)\n- $p3 = range(112, 120)\n\n#answer: n1 * p1 + n2 * p2 + n3 * p3"
