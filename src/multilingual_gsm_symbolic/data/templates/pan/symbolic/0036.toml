question = "ਤੌਲਾ ਬੇਕਰੀ ਗਈ ਅਤੇ ਵੱਖ-ਵੱਖ ਕਿਸਮਾਂ ਦੀਆਂ ਪੇਸਟਰੀਆਂ ਖਰੀਦੀਆਂ। ਉਸਨੇ 3 ਡਜ਼ਨ ਡੋਨਟਸ ਖਰੀਦੇ ਜਿਨ੍ਹਾਂ ਦੀ ਕੀਮਤ $68 ਪ੍ਰਤੀ ਡਜ਼ਨ ਸੀ, 2 ਡਜ਼ਨ ਮਿਨੀ ਕੱਪਕੇਕ ਜਿਨ੍ਹਾਂ ਦੀ ਕੀਮਤ $80 ਪ੍ਰਤੀ ਡਜ਼ਨ ਸੀ, ਅਤੇ 6 ਡਜ਼ਨ ਮਿਨੀ ਚੀਜ਼ਕੇਕ $55 ਪ੍ਰਤੀ ਡਜ਼ਨ ਲਈ। ਕੁੱਲ ਲਾਗਤ ਕਿੰਨੀ ਸੀ?"
answer = "ਡੋਨਟਸ ਲਈ ਕੁੱਲ ਰਕਮ 3*$68 = $<<3*68=204>>204 ਸੀ।\nਮਿਨੀ ਕੱਪਕੇਕ ਲਈ ਕੁੱਲ ਰਕਮ 2*$80 = $<<2*80=160>>160 ਸੀ।\nਮਿਨੀ ਚੀਜ਼ਕੇਕ ਲਈ ਕੁੱਲ ਰਕਮ 6*$55 = $<<6*55=330>>330 ਸੀ।\nਇਸ ਲਈ ਤੌਲਾ ਦੁਆਰਾ ਪੇਸਟਰੀਆਂ ਲਈ ਭਰੀ ਕੁੱਲ ਰਾਸ਼ੀ $204 + $160 + $330 = $<<204+160+330=694>>694 ਸੀ।\n#### 694\n"
