question_annotated = "{school,ਖ਼ਾਲਸਾ ਹਾਈ ਸਕੂਲ} ਦਾ ਗ੍ਰੈਜੂਏਸ਼ਨ ਸਮਾਰੋਹ ਇਸ ਸਾਲ ਉਸਦੇ {venue,ਫਾਈਨ ਆਰਟਸ ਸੈਂਟਰ} ਵਿੱਚ ਹੋ ਰਿਹਾ ਹੈ, ਜਿਸ ਵਿੱਚ {total,6000} ਲੋਕਾਂ ਦੇ ਬੈਠਣ ਦੀ ਥਾਂ ਹੈ। {graduates,950} ਵਿਦਿਆਰਥੀਆਂ ਲਈ ਕੁਰਸੀਆਂ ਅਤੇ {faculty,300} ਅਧਿਆਪਕਾਂ ਲਈ ਕੁਰਸੀਆਂ ਦੀ ਗਿਣਤੀ ਕਰਨ ਤੋਂ ਬਾਅਦ, ਜੇਕਰ ਟਿਕਟਾਂ ਬਰਾਬਰ ਵੰਡੀਆਂ ਜਾਣ ਤਾਂ ਹਰੇਕ ਵਿਦਿਆਰਥੀ ਨੂੰ ਆਪਣੇ ਦੋਸਤਾਂ ਅਤੇ ਪਰਿਵਾਰ ਨੂੰ ਦੇਣ ਲਈ ਕਿੰਨੀਆਂ ਟਿਕਟਾਂ ਮਿਲਣਗੀਆਂ?\n\n#init:\n- school = sample([\"ਗੁਰੂ ਨਾਨਕ ਪਬਲਿਕ ਸਕੂਲ\", \"ਦਸਮੇਸ਼ ਅਕੈਡਮੀ\", \"ਸਰਕਾਰੀ ਹਾਈ ਸਕੂਲ\", \"ਆਰੀਆ ਹਾਈ ਸਕੂਲ\"])\n- venue = sample([\"ਓਡੀਟੋਰੀਅਮ\", \"ਜਿਮਨੇਸ਼ੀਅਮ\", \"ਸਪੋਰਟਸ ਏਰੀਨਾ\", \"ਕਨਵੈਨਸ਼ਨ ਸੈਂਟਰ\"])\n- $total = range(3000, 10000, 100)\n- $graduates = range(100, 1500, 50)\n- $faculty = range(100, 500, 50)\n\n#conditions:\n- total > graduates + faculty\n- is_int((total - graduates - faculty) / graduates)\n\n#answer: (total - graduates - faculty) // graduates"
answer_annotated = "ਵਿਦਿਆਰਥੀਆਂ ਅਤੇ ਅਧਿਆਪਕਾਂ ਦੀਆਂ ਕੁਰਸੀਆਂ ਨੂੰ ਇਕੱਠਾ ਜੋੜੋ। {graduates} + {faculty} = <<{graduates}+{faculty}={graduates+faculty}>>{graduates+faculty} ਅਧਿਆਪਕਾਂ ਅਤੇ ਵਿਦਿਆਰਥੀਆਂ ਲਈ ਕੁਰਸੀਆਂ\nਕੁੱਲ ਉਪਲਬਧ ਕੁਰਸੀਆਂ ਵਿੱਚੋਂ ਅਧਿਆਪਕਾਂ ਅਤੇ ਵਿਦਿਆਰਥੀਆਂ ਦੀਆਂ ਕੁਰਸੀਆਂ ਘਟਾਓ। {total} - {graduates+faculty} = <<{total}-{graduates+faculty}={total-(graduates+faculty)}>>{total-(graduates+faculty)} ਬਾਕੀ ਬਚੀਆਂ ਕੁਰਸੀਆਂ।\nਬਾਕੀ ਬਚੀਆਂ ਕੁਰਸੀਆਂ ਨੂੰ ਵਿਦਿਆਰਥੀਆਂ ਦੀ ਗਿਣਤੀ ਨਾਲ ਵੰਡੋ। {total-(graduates+faculty)}/{graduates} = <<{total-(graduates+faculty)}/{graduates}={(total-(graduates+faculty))//graduates}>>{(total-(graduates+faculty))//graduates} ਟਿਕਟਾਂ\n#### {(total-(graduates+faculty))//graduates}"
