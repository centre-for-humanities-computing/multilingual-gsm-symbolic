question = "ਖ਼ਾਲਸਾ ਹਾਈ ਸਕੂਲ ਦਾ ਗ੍ਰੈਜੂਏਸ਼ਨ ਸਮਾਰੋਹ ਇਸ ਸਾਲ ਉਸਦੇ ਫਾਈਨ ਆਰਟਸ ਸੈਂਟਰ ਵਿੱਚ ਹੋ ਰਿਹਾ ਹੈ, ਜਿਸ ਵਿੱਚ 6000 ਲੋਕਾਂ ਦੇ ਬੈਠਣ ਦੀ ਥਾਂ ਹੈ। 950 ਵਿਦਿਆਰਥੀਆਂ ਲਈ ਕੁਰਸੀਆਂ ਅਤੇ 300 ਅਧਿਆਪਕਾਂ ਲਈ ਕੁਰਸੀਆਂ ਦੀ ਗਿਣਤੀ ਕਰਨ ਤੋਂ ਬਾਅਦ, ਜੇਕਰ ਟਿਕਟਾਂ ਬਰਾਬਰ ਵੰਡੀਆਂ ਜਾਣ ਤਾਂ ਹਰੇਕ ਵਿਦਿਆਰਥੀ ਨੂੰ ਆਪਣੇ ਦੋਸਤਾਂ ਅਤੇ ਪਰਿਵਾਰ ਨੂੰ ਦੇਣ ਲਈ ਕਿੰਨੀਆਂ ਟਿਕਟਾਂ ਮਿਲਣਗੀਆਂ?"
answer = "ਵਿਦਿਆਰਥੀਆਂ ਅਤੇ ਅਧਿਆਪਕਾਂ ਦੀਆਂ ਕੁਰਸੀਆਂ ਨੂੰ ਇਕੱਠਾ ਜੋੜੋ। 950 + 300 = <<950+300=1250>>1250 ਅਧਿਆਪਕਾਂ ਅਤੇ ਵਿਦਿਆਰਥੀਆਂ ਲਈ ਕੁਰਸੀਆਂ\nਕੁੱਲ ਉਪਲਬਧ ਕੁਰਸੀਆਂ ਵਿੱਚੋਂ ਅਧਿਆਪਕਾਂ ਅਤੇ ਵਿਦਿਆਰਥੀਆਂ ਦੀਆਂ ਕੁਰਸੀਆਂ ਘਟਾਓ। 6000 - 1250 = <<6000-1250=4750>>4750 ਬਾਕੀ ਬਚੀਆਂ ਕੁਰਸੀਆਂ।\nਬਾਕੀ ਬਚੀਆਂ ਕੁਰਸੀਆਂ ਨੂੰ ਵਿਦਿਆਰਥੀਆਂ ਦੀ ਗਿਣਤੀ ਨਾਲ ਵੰਡੋ। 4750/950 = <<4750/950=5>>5 ਟਿਕਟਾਂ\n#### 5"
