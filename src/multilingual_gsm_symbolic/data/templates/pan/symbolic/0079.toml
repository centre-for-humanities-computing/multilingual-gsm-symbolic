question = "ਟੈਡੀ ਨੇ ਇੱਕ 500 ਟੁਕੜਿਆਂ ਵਾਲੀ ਪਜ਼ਲ ਦਾ ਅੱਧਾ ਮੁਕਾਇਆ, ਅਤੇ ਫਿਰ ਇੱਕ ਘੰਟੇ ਦੇ ਅੰਦਰ ਹੋਰ ਇੱਕ 500 ਟੁਕੜਿਆਂ ਵਾਲੀ ਪਜ਼ਲ ਸ਼ੁਰੂ ਕੀਤੀ ਅਤੇ ਮੁਕਾਈ। ਉਸ ਘੰਟੇ ਦੌਰਾਨ ਟੈਡੀ ਨੇ ਕਿੰਨੇ ਪਜ਼ਲ ਟੁਕੜੇ ਲਗਾਏ?"
