question = "ਸਿਮਰਨ ਨੇ ਇੱਕ 500 ਟੁਕੜਿਆਂ ਵਾਲੀ ਪਜ਼ਲ ਦਾ ਅੱਧਾ ਹਿੱਸਾ ਮੁਕਾਇਆ, ਅਤੇ ਫਿਰ ਇੱਕ ਘੰਟੇ ਦੇ ਅੰਦਰ ਇੱਕ ਹੋਰ 500 ਟੁਕੜਿਆਂ ਵਾਲੀ ਪਜ਼ਲ ਸ਼ੁਰੂ ਕੀਤੀ ਅਤੇ ਮੁਕਾਈ। ਉਸ ਘੰਟੇ ਦੌਰਾਨ ਸਿਮਰਨ ਨੇ ਪਜ਼ਲ ਦੇ ਕਿੰਨੇ ਟੁਕੜੇ ਲਗਾਏ?"
