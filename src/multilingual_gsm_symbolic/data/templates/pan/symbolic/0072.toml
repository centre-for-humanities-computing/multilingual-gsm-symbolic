question = "{name} {n1} ਲੋਕਾਂ ਦਾ ਪੈਨ ਪੈਲ ਸੀ। ਉਸਨੇ ਉਹਨਾਂ ਵਿੱਚੋਂ {n2} ਨਾਲ ਪੈਨ ਪੈਲ ਬਣਨਾ ਬੰਦ ਕਰ ਦਿੱਤਾ। ਉਹਨਾਂ ਵਿੱਚੋਂ ਹਰ ਇੱਕ ਹਫ਼ਤੇ ਵਿੱਚ 2 ਚਿੱਠੀਆਂ ਭੇਜਦਾ ਹੈ, ਜੋ {p} ਪੰਨਿਆਂ ਦੀਆਂ ਹੁੰਦੀਆਂ ਹਨ। ਉਹ ਉਸੇ ਤਰ੍ਹਾਂ ਜਵਾਬ ਦਿੰਦਾ ਹੈ। ਉਹ ਹਰ {t} ਮਿੰਟਾਂ ਵਿੱਚ ਇੱਕ ਪੰਨਾ ਲਿਖ ਸਕਦਾ ਹੈ। ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ ਲਿਖਣ ਵਿੱਚ ਕਿੰਨੇ ਘੰਟੇ ਬਿਤਾਉਂਦਾ ਹੈ?"
