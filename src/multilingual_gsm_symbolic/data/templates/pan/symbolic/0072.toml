answer_annotated = "ਬਾਕੀ ਪੈਨ ਪੈਲ {n1} - {n2} = <<{n1}-{n2}={n1-n2}>>{n1-n2} ਹਨ।\nਹਫ਼ਤੇ ਵਿੱਚ ਚਿੱਠੀਆਂ {n1-n2} * {l} = <<{n1-n2}*{l}={(n1-n2)*l}>>{(n1-n2)*l} ਹਨ।\nਹਰ ਚਿੱਠੀ {p} ਪੰਨਿਆਂ ਦੀ ਹੈ, ਇਸ ਲਈ ਕੁੱਲ {((n1-n2)*l)} * {p} = <<{((n1-n2)*l)}*{p}={((n1-n2)*l*p)}>>{((n1-n2)*l*p)} ਪੰਨੇ।\nਹਰ ਪੰਨਾ {t} ਮਿੰਟ ਲੈਂਦਾ ਹੈ, ਇਸ ਲਈ {((n1-n2)*l*p)} * {t} = <<{((n1-n2)*l*p)}*{t}={((n1-n2)*l*p*t)}>>{((n1-n2)*l*p*t)} ਮਿੰਟ।\nਇਹ {((n1-n2)*l*p*t)}/60 = <<{((n1-n2)*l*p*t)}/60={float((n1-n2)*l*p*t)/60}>>{float((n1-n2)*l*p*t)/60} ਘੰਟੇ ਹਨ।\n#### {((n1-n2)*l*p*t)//60}\n"
