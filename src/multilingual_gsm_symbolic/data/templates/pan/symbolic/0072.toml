question = "ਮਾਈਕ 5 ਲੋਕਾਂ ਦਾ ਪੈਨ ਪੈਲ ਸੀ। ਉਸਨੇ ਉਹਨਾਂ ਵਿੱਚੋਂ 2 ਨਾਲ ਪੈਨ ਪੈਲ ਬਣਨਾ ਬੰਦ ਕਰ ਦਿੱਤਾ। ਉਹਨਾਂ ਵਿੱਚੋਂ ਹਰ ਇੱਕ ਹਫ਼ਤੇ ਵਿੱਚ 2 ਚਿੱਠੀਆਂ ਭੇਜਦਾ ਹੈ, ਜੋ 5 ਪੰਨਿਆਂ ਦੀਆਂ ਹੁੰਦੀਆਂ ਹਨ। ਉਹ ਉਸੇ ਤਰ੍ਹਾਂ ਜਵਾਬ ਦਿੰਦਾ ਹੈ। ਉਹ ਹਰ 6 ਮਿੰਟਾਂ ਵਿੱਚ ਇੱਕ ਪੰਨਾ ਲਿਖ ਸਕਦਾ ਹੈ। ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ ਲਿਖਣ ਵਿੱਚ ਕਿੰਨੇ ਘੰਟੇ ਬਿਤਾਉਂਦਾ ਹੈ?"
answer = "ਬਾਕੀ ਪੈਨ ਪੈਲ 5 - 2 = <<5-2=3>>3 ਹਨ।\nਹਫ਼ਤੇ ਵਿੱਚ ਚਿੱਠੀਆਂ 3 * 2 = <<3*2=6>>6 ਹਨ।\nਹਰ ਚਿੱਠੀ 5 ਪੰਨਿਆਂ ਦੀ ਹੈ, ਇਸ ਲਈ ਕੁੱਲ 6 * 5 = <<6*5=30>>30 ਪੰਨੇ।\nਹਰ ਪੰਨਾ 6 ਮਿੰਟ ਲੈਂਦਾ ਹੈ, ਇਸ ਲਈ 30 * 6 = <<30*6=180>>180 ਮਿੰਟ।\nਇਹ 180/60 = <<180/60=3>>3 ਘੰਟੇ ਹਨ।\n#### 3\n"
