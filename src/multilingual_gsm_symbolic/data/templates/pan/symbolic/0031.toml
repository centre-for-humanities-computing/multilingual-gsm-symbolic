question = "ਸਿਮਰਨ ਅਤੇ ਕਿਰਨ ਦੀ ਉਮਰ ਵਿੱਚ ਇਸ ਵੇਲੇ 16 ਸਾਲ ਦਾ ਫ਼ਰਕ ਹੈ। ਜੇ ਸਿਮਰਨ ਦੀ ਉਮਰ ਕਿਰਨ ਨਾਲੋਂ ਘੱਟ ਹੈ ਅਤੇ ਸਿਮਰਨ ਦੀ ਉਮਰ 40 ਸਾਲ ਹੈ, ਤਾਂ ਉਨ੍ਹਾਂ ਦੀ ਉਮਰ ਦੀ ਔਸਤ ਕੀ ਹੈ?"
