question_annotated = "ਇੱਕ {facility,ਹਸਪਤਾਲ} ਵਿੱਚ ਕੁੱਲ {total,1000} {item,ਬਿਸਤਰੇ} ਹਨ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ {frac,1/5} ਭਰੇ ਹੋਏ ਹਨ। {event,ਕੋਰੋਨਾਵਾਇਰਸ ਮਹਾਂਮਾਰੀ} ਕਾਰਨ, ਹਰ ਰੋਜ਼ {daily,50} ਮਰੀਜ਼ {facility,ਹਸਪਤਾਲ} ਵਿੱਚ ਦਾਖਲ ਕੀਤੇ ਜਾਂਦੇ ਹਨ। {period,2} ਹਫ਼ਤਿਆਂ ਬਾਅਦ {facility,ਹਸਪਤਾਲ} ਵਿੱਚ ਕੁੱਲ ਕਿੰਨੇ {item,ਬਿਸਤਰੇ} ਖਾਲੀ ਬਚਣਗੇ?\n\n#init:\n- facility = sample([\"ਹਸਪਤਾਲ\", \"ਕਲੀਨਿਕ\", \"ਮੈਡੀਕਲ ਸੈਂਟਰ\", \"ਸਿਹਤ ਕੇਂਦਰ\"])\n- item = sample([\"ਬਿਸਤਰੇ\", \"ਕਮਰੇ\", \"ਵਾਰਡ\"])\n- event = sample([\"ਫਲੂ ਦੇ ਮੌਸਮ\", \"ਕੁਦਰਤੀ ਆਫ਼ਤ\", \"ਵੱਡੇ ਹਾਦਸੇ\", \"ਮਹਾਂਮਾਰੀ\"])\n- $total = range(500, 2000, 100)\n- $frac = sample(fractions)\n- $daily = range(20, 100, 5)\n- $period = range(2, 5)\n\n#conditions:\n- is_int(total * frac)\n- total * frac + daily * period * 7 < total\n\n#answer: total - (total * frac + daily * period * 7)"
answer_annotated = "ਜੇਕਰ {facility} ਵਿੱਚ {total} {item} ਹਨ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ {frac} ਭਰੇ ਹੋਏ ਹਨ, ਤਾਂ {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} ਭਰੇ ਹੋਏ ਹਨ।\nਨਵੇਂ ਦਾਖਲਿਆਂ ਤੋਂ ਬਿਨਾਂ {facility} ਵਿੱਚ ਕੁੱਲ {total} - {int(total*frac)} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item} ਖਾਲੀ ਹਨ।\nਜੇਕਰ ਹਰ ਰੋਜ਼ {daily} ਲੋਕ ਦਾਖਲ ਹੁੰਦੇ ਹਨ, {facility} ਵਿੱਚ ਇੱਕ ਹਫ਼ਤੇ ਬਾਅਦ ਮਰੀਜ਼ਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ {daily} * 7 = <<{daily}*7={daily*7}>>{daily*7} ਮਰੀਜ਼ ਹੈ।\n{period} ਹਫ਼ਤਿਆਂ ਬਾਅਦ, {facility} ਵਿੱਚ ਦਾਖਲ ਮਰੀਜ਼ਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ {daily*7} * {period} = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} ਮਰੀਜ਼ ਹੈ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ ਹਰੇਕ ਇੱਕ {item} ਦੀ ਵਰਤੋਂ ਕਰਦਾ ਹੈ।\nਜੇਕਰ ਨਵੇਂ ਦਾਖਲਿਆਂ ਤੋਂ ਪਹਿਲਾਂ {facility} ਵਿੱਚ {total-int(total*frac)} ਖਾਲੀ {item} ਸਨ, ਤਾਂ ਹੁਣ ਸਿਰਫ਼ {total-int(total*frac)} - {daily*period*7} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} ਖਾਲੀ {item} ਰਹਿ ਜਾਂਦੇ ਹਨ।\n#### {total - (total * frac + daily * period * 7)}"
