question_annotated = "{facility,ਹਸਪਤਾਲ} ਦੀ ਸਮਰੱਥਾ {total,1000} {item,ਬਿਸਤਰਾਂ} ਦੀ ਹੈ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ {frac,1/5} ਭਰੇ ਹੋਏ ਹਨ। {event,ਕੋਰੋਨਾਵਾਇਰਸ ਮਹਾਂਮਾਰੀ} ਕਾਰਨ, ਹਰ ਰੋਜ਼ {daily,50} ਮਰੀਜ਼ {facility,ਹਸਪਤਾਲ} ਵਿੱਚ ਦਾਖਲ ਕੀਤੇ ਜਾਂਦੇ ਹਨ। {period,2} ਹਫ਼ਤਿਆਂ ਬਾਅਦ {facility,ਹਸਪਤਾਲ} ਵਿੱਚ ਖਾਲੀ ਬਚੇ {item,ਬਿਸਤਰਾਂ} ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਕਿੰਨੀ ਹੈ?\n\n#init:\n- facility = sample([\"ਹਸਪਤਾਲ\", \"ਕਲੀਨਿਕ\", \"ਮੈਡੀਕਲ ਸੈਂਟਰ\", \"ਕੇਅਰ ਸੁਵਿਧਾ\"])\n- item = sample([\"ਬਿਸਤਰਾਂ\", \"ਕਮਰੇ\", \"ਵਾਰਡ\"])\n- event = sample([\"ਫਲੂ ਦਾ ਮੌਸਮ\", \"ਪ੍ਰਾਕ੍ਰਿਤਿਕ ਆਫ਼ਤ\", \"ਵੱਡਾ ਹਾਦਸਾ\", \"ਮਹਾਂਮਾਰੀ\"])\n- $total = range(500, 2000, 100)\n- $frac = sample(fractions)\n- $daily = range(20, 100, 5)\n- $period = range(2, 5)\n\n#conditions:\n- is_int(total * frac)\n- total * frac + daily * period * 7 < total\n\n#answer: total - (total * frac + daily * period * 7)\n"
answer_annotated = "ਜੇਕਰ {facility} ਦੇ {item} ਦਾ {frac} ਭਰਿਆ ਹੋਇਆ ਹੈ, ਤਾਂ {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} ਭਰੇ ਹੋਏ ਹਨ।\n{facility} ਵਿੱਚ ਬਿਨਾਂ ਨਵੀਆਂ ਦਾਖਲੀਆਂ ਦੇ {item} ਦੀ ਕੁੱਲ ਗਿਣਤੀ {total} - {int(total*frac)} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item} ਹੈ।\nਜੇਕਰ ਹਰ ਰੋਜ਼ {daily} ਲੋਕ ਦਾਖਲ ਹੁੰਦੇ ਹਨ, {facility} ਵਿੱਚ ਇੱਕ ਹਫ਼ਤੇ ਬਾਅਦ ਮਰੀਜ਼ਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ {daily} * 7 = <<{daily}*7={daily*7}>>{daily*7} ਮਰੀਜ਼ ਹੈ।\n{period} ਹਫ਼ਤਿਆਂ ਬਾਅਦ, {facility} ਵਿੱਚ ਦਾਖਲ ਮਰੀਜ਼ਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ {daily*7} * {period} = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} ਮਰੀਜ਼ ਹੈ, ਜੋ ਹਰ ਇੱਕ {item} ਵਰਤਦੇ ਹਨ।\nਜੇਕਰ ਨਵੀਆਂ ਦਾਖਲੀਆਂ ਤੋਂ ਪਹਿਲਾਂ {facility} ਵਿੱਚ {total-int(total*frac)} ਖਾਲੀ {item} ਸਨ, ਕੁੱਲ ਗਿਣਤੀ ਘਟ ਕੇ {total-int(total*frac)} - {daily*period*7} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} ਖਾਲੀ {item} ਰਹਿ ਜਾਂਦੀਆਂ ਹਨ।\n#### {total - (total * frac + daily * period * 7)}\n"
