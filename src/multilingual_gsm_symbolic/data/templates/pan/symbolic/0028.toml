question = "ਹਸਪਤਾਲ ਦੀ ਸਮਰੱਥਾ 1000 ਬਿਸਤਰਾਂ ਦੀ ਹੈ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ 1/5 ਭਰੇ ਹੋਏ ਹਨ। ਕੋਰੋਨਾਵਾਇਰਸ ਮਹਾਂਮਾਰੀ ਕਾਰਨ, ਹਰ ਰੋਜ਼ 50 ਮਰੀਜ਼ ਹਸਪਤਾਲ ਵਿੱਚ ਦਾਖਲ ਕੀਤੇ ਜਾਂਦੇ ਹਨ। 2 ਹਫ਼ਤਿਆਂ ਬਾਅਦ ਹਸਪਤਾਲ ਵਿੱਚ ਖਾਲੀ ਬਚੇ ਬਿਸਤਰਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਕਿੰਨੀ ਹੈ?"
answer = "ਜੇਕਰ ਹਸਪਤਾਲ ਦੇ ਬਿਸਤਰਾਂ ਦਾ 1/5 ਭਰਿਆ ਹੋਇਆ ਹੈ, ਤਾਂ 1/5 * 1000 = <<1000*1/5=200>>200 ਬਿਸਤਰਾਂ ਭਰੇ ਹੋਏ ਹਨ।\nਹਸਪਤਾਲ ਵਿੱਚ ਬਿਨਾਂ ਨਵੀਆਂ ਦਾਖਲੀਆਂ ਦੇ ਬਿਸਤਰਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 1000 - 200 = <<1000-200=800>>800 ਬਿਸਤਰਾਂ ਹੈ।\nਜੇਕਰ ਹਰ ਰੋਜ਼ 50 ਲੋਕ ਦਾਖਲ ਹੁੰਦੇ ਹਨ, ਹਸਪਤਾਲ ਵਿੱਚ ਇੱਕ ਹਫ਼ਤੇ ਬਾਅਦ ਮਰੀਜ਼ਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 50 * 7 = <<50*7=350>>350 ਮਰੀਜ਼ ਹੈ।\n2 ਹਫ਼ਤਿਆਂ ਬਾਅਦ, ਹਸਪਤਾਲ ਵਿੱਚ ਦਾਖਲ ਮਰੀਜ਼ਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 350 * 2 = <<350*2=700>>700 ਮਰੀਜ਼ ਹੈ, ਜੋ ਹਰ ਇੱਕ ਬਿਸਤਰਾਂ ਵਰਤਦੇ ਹਨ।\nਜੇਕਰ ਨਵੀਆਂ ਦਾਖਲੀਆਂ ਤੋਂ ਪਹਿਲਾਂ ਹਸਪਤਾਲ ਵਿੱਚ 800 ਖਾਲੀ ਬਿਸਤਰਾਂ ਸਨ, ਕੁੱਲ ਗਿਣਤੀ ਘਟ ਕੇ 800 - 700 = <<800-700=100>>100 ਖਾਲੀ ਬਿਸਤਰਾਂ ਰਹਿ ਜਾਂਦੀਆਂ ਹਨ।\n#### 100\n"
