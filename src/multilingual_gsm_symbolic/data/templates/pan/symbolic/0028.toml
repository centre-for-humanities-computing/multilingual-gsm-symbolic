question = "ਹਸਪਤਾਲ ਦੀ ਸਮਰੱਥਾ 1000 ਬਿਸਤਰੇ ਦੀ ਹੈ ਜਿਸ ਵਿੱਚ 1/5 ਭਰੇ ਹੋਏ ਹਨ। ਕੋਰੋਨਾਵਾਇਰਸ ਮਹਾਂਮਾਰੀ ਕਾਰਨ, 50 ਮਰੀਜ਼ ਹਰ ਰੋਜ਼ ਹਸਪਤਾਲ ਵਿੱਚ ਦਾਖਲ ਕੀਤੇ ਜਾਂਦੇ ਹਨ। 2 ਹਫ਼ਤਿਆਂ ਬਾਅਦ ਹਸਪਤਾਲ ਵਿੱਚ ਖਾਲੀ ਬਿਸਤਰੇ ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਪਤਾ ਕਰੋ।"
answer = "ਜੇਕਰ ਹਸਪਤਾਲ ਦੇ ਬਿਸਤਰੇ ਦੀ ਕੁੱਲ ਸਮਰੱਥਾ ਦਾ 1/5 ਭਰਿਆ ਹੋਇਆ ਹੈ, ਇਸਦਾ ਮਤਲਬ ਹੈ 1/5 * 1000 = <<1000*1/5=200>>200 ਬਿਸਤਰੇ 'ਤੇ ਮਰੀਜ਼ ਹਨ।\nਹਸਪਤਾਲ ਵਿੱਚ ਬਿਨਾਂ ਨਵੀਆਂ ਦਾਖਲਤਾਂ ਦੇ ਬਿਸਤਰੇ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 1000 ਬਿਸਤਰੇ - 200 ਬਿਸਤਰੇ = <<1000-200=800>>800 ਬਿਸਤਰੇ ਹੈ।\nਜੇਕਰ ਹਰ ਰੋਜ਼ 50 ਲੋਕ ਦਾਖਲ ਹੁੰਦੇ ਹਨ, ਹਸਪਤਾਲ ਵਿੱਚ ਇੱਕ ਹਫ਼ਤੇ ਬਾਅਦ ਮਰੀਜ਼ਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 50 ਮਰੀਜ਼/ਦਿਨ * 7 ਦਿਨ/ਹਫ਼ਤੇ = 350 ਮਰੀਜ਼ ਹੈ।\n2 ਹਫ਼ਤਿਆਂ ਬਾਅਦ, ਹਸਪਤਾਲ ਵਿੱਚ ਦਾਖਲ ਮਰੀਜ਼ਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 350 ਮਰੀਜ਼/ਹਫ਼ਤੇ * 2 ਹਫ਼ਤੇ = <<350*2=700>>700 ਮਰੀਜ਼ ਹੈ, ਜੋ ਹਰੇਕ ਇੱਕ ਬਿਸਤਰੇ ਵਰਤਦੇ ਹਨ।\nਜੇਕਰ ਨਵੀਆਂ ਦਾਖਲਤਾਂ ਤੋਂ ਪਹਿਲਾਂ ਹਸਪਤਾਲ ਵਿੱਚ 800 ਖਾਲੀ ਬਿਸਤਰੇ ਸਨ, ਕੁੱਲ ਗਿਣਤੀ ਘਟ ਕੇ 800 ਬਿਸਤਰੇ - 700 ਬਿਸਤਰੇ = <<800-700=100>>100 ਖਾਲੀ ਬਿਸਤਰੇ ਰਹਿ ਜਾਂਦੀ ਹੈ।\n#### 100\n"
