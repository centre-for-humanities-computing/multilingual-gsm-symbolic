question_annotated = "{facility,ਹਸਪਤਾਲ} ਦੀ ਸਮਰੱਥਾ {total,1000} {item,ਬਿਸਤਰੇ} ਦੀ ਹੈ ਜਿਸ ਵਿੱਚ {frac,1/5} ਭਰੇ ਹੋਏ ਹਨ। {event,ਕੋਰੋਨਾਵਾਇਰਸ ਮਹਾਂਮਾਰੀ} ਕਾਰਨ, {daily,50} ਮਰੀਜ਼ ਹਰ ਰੋਜ਼ {facility,ਹਸਪਤਾਲ} ਵਿੱਚ ਦਾਖਲ ਕੀਤੇ ਜਾਂਦੇ ਹਨ। {period,2} ਹਫ਼ਤਿਆਂ ਬਾਅਦ {facility,ਹਸਪਤਾਲ} ਵਿੱਚ ਖਾਲੀ {item,ਬਿਸਤਰੇ} ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਪਤਾ ਕਰੋ।\n\n#init:\n- facility = sample([\"ਹਸਪਤਾਲ\", \"ਕਲਿਨਿਕ\", \"ਮੈਡੀਕਲ ਕੇਂਦਰ\", \"ਕੇਅਰ ਸੁਵਿਧਾ\"])\n- item = sample([\"ਬਿਸਤਰਾ\", \"ਕਮਰਾ\", \"ਵਾਰਡ\"])\n- event = sample([\"ਫਲੂ ਦਾ ਮੌਸਮ\", \"ਪ੍ਰਾਕ੍ਰਿਤਿਕ ਆਫਤ\", \"ਵੱਡਾ ਹਾਦਸਾ\", \"ਮਹਾਂਮਾਰੀ\"])\n- $total = range(500, 2000, 100)\n- $frac = sample(fractions)\n- $daily = range(20, 100, 5)\n- $period = range(2, 5)\n\n#conditions:\n- is_int(total * frac)\n- total * frac + daily * period * 7 < total\n\n#answer: total - (total * frac + daily * period * 7)\n"
answer_annotated = "ਜੇਕਰ {facility} ਦੇ {item} ਦੀ ਕੁੱਲ ਸਮਰੱਥਾ ਦਾ {frac} ਭਰਿਆ ਹੋਇਆ ਹੈ, ਇਸਦਾ ਮਤਲਬ ਹੈ {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} 'ਤੇ ਮਰੀਜ਼ ਹਨ।\n{facility} ਵਿੱਚ ਬਿਨਾਂ ਨਵੀਆਂ ਦਾਖਲਤਾਂ ਦੇ {item} ਦੀ ਕੁੱਲ ਗਿਣਤੀ {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item} ਹੈ।\nਜੇਕਰ ਹਰ ਰੋਜ਼ {daily} ਲੋਕ ਦਾਖਲ ਹੁੰਦੇ ਹਨ, {facility} ਵਿੱਚ ਇੱਕ ਹਫ਼ਤੇ ਬਾਅਦ ਮਰੀਜ਼ਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ {daily} ਮਰੀਜ਼/ਦਿਨ * 7 ਦਿਨ/ਹਫ਼ਤੇ = {daily*7} ਮਰੀਜ਼ ਹੈ।\n{period} ਹਫ਼ਤਿਆਂ ਬਾਅਦ, {facility} ਵਿੱਚ ਦਾਖਲ ਮਰੀਜ਼ਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ {daily*7} ਮਰੀਜ਼/ਹਫ਼ਤੇ * {period} ਹਫ਼ਤੇ = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} ਮਰੀਜ਼ ਹੈ, ਜੋ ਹਰੇਕ ਇੱਕ {item} ਵਰਤਦੇ ਹਨ।\nਜੇਕਰ ਨਵੀਆਂ ਦਾਖਲਤਾਂ ਤੋਂ ਪਹਿਲਾਂ {facility} ਵਿੱਚ {total-int(total*frac)} ਖਾਲੀ {item} ਸਨ, ਕੁੱਲ ਗਿਣਤੀ ਘਟ ਕੇ {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} ਖਾਲੀ {item} ਰਹਿ ਜਾਂਦੀ ਹੈ।\n#### {total - (total * frac + daily * period * 7)}\n"
