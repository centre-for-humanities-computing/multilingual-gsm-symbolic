question = "ਇੱਕ ਹਸਪਤਾਲ ਵਿੱਚ ਕੁੱਲ 1000 ਬਿਸਤਰੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ 1/5 ਭਰੇ ਹੋਏ ਹਨ। ਕੋਰੋਨਾਵਾਇਰਸ ਮਹਾਂਮਾਰੀ ਕਾਰਨ, ਹਰ ਰੋਜ਼ 50 ਮਰੀਜ਼ ਹਸਪਤਾਲ ਵਿੱਚ ਦਾਖਲ ਕੀਤੇ ਜਾਂਦੇ ਹਨ। 2 ਹਫ਼ਤਿਆਂ ਬਾਅਦ ਹਸਪਤਾਲ ਵਿੱਚ ਕੁੱਲ ਕਿੰਨੇ ਬਿਸਤਰੇ ਖਾਲੀ ਬਚਣਗੇ?"
answer = "ਜੇਕਰ ਹਸਪਤਾਲ ਵਿੱਚ 1000 ਬਿਸਤਰੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ 1/5 ਭਰੇ ਹੋਏ ਹਨ, ਤਾਂ 1/5 * 1000 = <<1000*1/5=200>>200 ਬਿਸਤਰੇ ਭਰੇ ਹੋਏ ਹਨ।\nਨਵੇਂ ਦਾਖਲਿਆਂ ਤੋਂ ਬਿਨਾਂ ਹਸਪਤਾਲ ਵਿੱਚ ਕੁੱਲ 1000 - 200 = <<1000-200=800>>800 ਬਿਸਤਰੇ ਖਾਲੀ ਹਨ।\nਜੇਕਰ ਹਰ ਰੋਜ਼ 50 ਲੋਕ ਦਾਖਲ ਹੁੰਦੇ ਹਨ, ਹਸਪਤਾਲ ਵਿੱਚ ਇੱਕ ਹਫ਼ਤੇ ਬਾਅਦ ਮਰੀਜ਼ਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 50 * 7 = <<50*7=350>>350 ਮਰੀਜ਼ ਹੈ।\n2 ਹਫ਼ਤਿਆਂ ਬਾਅਦ, ਹਸਪਤਾਲ ਵਿੱਚ ਦਾਖਲ ਮਰੀਜ਼ਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 350 * 2 = <<350*2=700>>700 ਮਰੀਜ਼ ਹੈ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ ਹਰੇਕ ਇੱਕ ਬਿਸਤਰੇ ਦੀ ਵਰਤੋਂ ਕਰਦਾ ਹੈ।\nਜੇਕਰ ਨਵੇਂ ਦਾਖਲਿਆਂ ਤੋਂ ਪਹਿਲਾਂ ਹਸਪਤਾਲ ਵਿੱਚ 800 ਖਾਲੀ ਬਿਸਤਰੇ ਸਨ, ਤਾਂ ਹੁਣ ਸਿਰਫ਼ 800 - 700 = <<800-700=100>>100 ਖਾਲੀ ਬਿਸਤਰੇ ਰਹਿ ਜਾਂਦੇ ਹਨ।\n#### 100"
