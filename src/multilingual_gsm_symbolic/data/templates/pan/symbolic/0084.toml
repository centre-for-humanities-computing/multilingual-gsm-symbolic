question_annotated = "{name,ਸਿਮਰਨ} ਇੱਕ ਸਟਾਕ ਦੇ {n,8} ਸ਼ੇਅਰ {cur,₹}{p,8} ਪ੍ਰਤੀ ਸ਼ੇਅਰ ਦੇ ਹਿਸਾਬ ਨਾਲ ਖਰੀਦਦੀ ਹੈ। ਜਿਸ ਪਹਿਲੇ ਸਾਲ {name,ਸਿਮਰਨ} ਇਸਨੂੰ ਰੱਖਦੀ ਹੈ, ਸਟਾਕ ਦੀ ਕੀਮਤ {r1,50}% ਵਧ ਜਾਂਦੀ ਹੈ, ਫਿਰ ਦੂਜੇ ਸਾਲ {r2,25}% ਘਟ ਜਾਂਦੀ ਹੈ। {name,ਸਿਮਰਨ} ਦੇ ਸਾਰੇ ਸ਼ੇਅਰਾਂ ਦਾ ਅੰਤਿਮ ਮੁੱਲ ਕੀ ਹੈ?\n\n#init:\n- name = sample(names_female)\n- cur = sample(currencies_sym)\n- $n = range(5, 20)\n- $p = range(5, 100)\n- $r1 = range(10, 100, 5)\n- $r2 = range(5, 50, 5)\n\n#conditions:\n- is_int(n * p * r1/100)\n- is_int(n * p * (1 + r1/100) * (1 - r2/100))\n\n#answer: ensure_int(n * p * (1 + r1/100) * (1 - r2/100))"
