question = "ਸਿਮਰਨ ਇੱਕ ਸਟਾਕ ਦੇ 8 ਸ਼ੇਅਰ ₹8 ਪ੍ਰਤੀ ਸ਼ੇਅਰ ਦੇ ਹਿਸਾਬ ਨਾਲ ਖਰੀਦਦੀ ਹੈ। ਜਿਸ ਪਹਿਲੇ ਸਾਲ ਸਿਮਰਨ ਇਸਨੂੰ ਰੱਖਦੀ ਹੈ, ਸਟਾਕ ਦੀ ਕੀਮਤ 50% ਵਧ ਜਾਂਦੀ ਹੈ, ਫਿਰ ਦੂਜੇ ਸਾਲ 25% ਘਟ ਜਾਂਦੀ ਹੈ। ਸਿਮਰਨ ਦੇ ਸਾਰੇ ਸ਼ੇਅਰਾਂ ਦਾ ਅੰਤਿਮ ਮੁੱਲ ਕੀ ਹੈ?"
answer = "ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਸਿਮਰਨ ਦੀ ਖਰੀਦ ਦਾ ਸ਼ੁਰੂਆਤੀ ਕੁੱਲ ਮੁੱਲ ਪਤਾ ਕਰੋ: 8 ਸ਼ੇਅਰ * ₹8/ਸ਼ੇਅਰ = ₹<<8*8=64>>64\nਫਿਰ ਕੀਮਤ ਦੇ ਪਹਿਲੇ ਵਾਧੇ ਦੀ ਰਕਮ ਪਤਾ ਕਰੋ: ₹64 * 0.5 = ₹<<64*0.5=32>>32\nਪਹਿਲੇ ਸਾਲ ਦੇ ਬਾਅਦ ਮੁੱਲ ਪਤਾ ਕਰਨ ਲਈ ਉਸ ਰਕਮ ਨੂੰ ਸ਼ੁਰੂਆਤੀ ਮੁੱਲ ਵਿੱਚ ਜੋੜੋ: ₹64 + ₹32 = ₹<<64+32=96>>96\nਫਿਰ ਦੂਜੇ ਸਾਲ ਵਿੱਚ ਕਮੀ ਦੀ ਰਕਮ ਪਤਾ ਕਰਨ ਲਈ ਉਸ ਰਕਮ ਨੂੰ 25% ਨਾਲ ਗੁਣਾ ਕਰੋ: ₹96 * 25% = ₹<<96*25*.01=24>>24\nਫਿਰ ਅੰਤਿਮ ਮੁੱਲ ਪਤਾ ਕਰਨ ਲਈ ਉਸ ਰਕਮ ਨੂੰ ਪਹਿਲੇ ਸਾਲ ਦੇ ਬਾਅਦ ਦੇ ਮੁੱਲ ਵਿੱਚੋਂ ਘਟਾਓ: ₹96 - ₹24 = ₹<<96-24=72>>72\n#### 72"
