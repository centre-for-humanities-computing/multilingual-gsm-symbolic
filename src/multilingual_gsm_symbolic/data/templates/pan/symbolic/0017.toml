question_annotated = "{name,ਦਾਦੀ} ਹਰ ਰੋਜ਼ ਆਪਣੇ ਪਸੰਦੀਦਾ ਸੈਰ ਵਾਲੇ ਰਸਤੇ 'ਤੇ {n,3} {unit,ਮੀਲ} ਤੁਰਦੀ ਹੈ, ਜਿਸ ਵਿੱਚ ਬੀਚ 'ਤੇ {m,2} {unit,ਮੀਲ} ਤੁਰਨਾ ਅਤੇ ਫੁੱਟਪਾਥ 'ਤੇ {k,1} {unit,ਮੀਲ} ਤੁਰਨਾ ਸ਼ਾਮਲ ਹੈ। ਫੁੱਟਪਾਥ 'ਤੇ {name,ਦਾਦੀ} ਬੀਚ ਨਾਲੋਂ {mult_txt,ਦੋ ਗੁਣਾ} ਰਫ਼ਤਾਰ ਨਾਲ ਤੁਰਦੀ ਹੈ। ਜੇਕਰ ਉਸਦੀ ਸੈਰ ਦੇ {t,40} ਮਿੰਟ ਬੀਚ 'ਤੇ ਲੰਘਦੇ ਹਨ, ਤਾਂ ਉਸਨੂੰ ਪੂਰੀ {n,3}-{unit, ਮੀਲ} ਦੀ ਸੈਰ ਪੂਰੀ ਕਰਨ ਵਿੱਚ ਕਿੰਨੇ ਮਿੰਟ ਲੱਗਦੇ ਹਨ?\n\n#init:\n- name = sample(names_female)\n- unit = sample(length_lg)\n- mult_txt, mult_val = sample(multi_times)\n- $n = range(3, 60)\n- $m = range(2, 20)\n- $k = range(1, 20)\n- $t = range(40, 70)\n#conditions:\n- m + k == n\n- m < t\n- mult_val *m < t\n- divides(t, m)\n- is_int(k / (mult_val*m/t))\n#answer: t+(k/(mult_val*m/t))"
answer_annotated = "ਬੀਚ 'ਤੇ, {name} {t} ਮਿੰਟਾਂ ਵਿੱਚ {m} {unit} ਦੀ ਰਫ਼ਤਾਰ ਨਾਲ ਤੁਰਦੀ ਹੈ, ਯਾਨੀ {m}/{t} = {Fraction(m/t)} {unit} ਪ੍ਰਤੀ ਮਿੰਟ।\nਫੁੱਟਪਾਥ 'ਤੇ, ਉਹ ਰੇਤ 'ਤੇ ਤੁਰਨ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲੋਂ {mult_txt} ਰਫ਼ਤਾਰ ਨਾਲ ਤੁਰਦੀ ਹੈ, ਯਾਨੀ {mult_val}*{Fraction(m/t)} = {mult_val*m/t} {unit} ਪ੍ਰਤੀ ਮਿੰਟ।\nਫੁੱਟਪਾਥ 'ਤੇ {k} {unit} ਤੁਰਨ ਲਈ, ਉਸਨੂੰ {k}/{mult_val*m/t} = <<{k}/{mult_val*m/t}={k/(mult_val*m/t)}>>{k/(mult_val*m/t)} ਮਿੰਟ ਲੱਗਦੇ ਹਨ।\nਇਸ ਲਈ, ਕੁੱਲ ਮਿਲਾ ਕੇ, {name} ਨੂੰ ਆਪਣੇ ਪਸੰਦੀਦਾ ਰਸਤੇ 'ਤੇ ਤੁਰਨ ਵਿੱਚ {t}+{k/(mult_val*m/t)} = <<{t}+{k/(mult_val*m/t)}={t+(k/(mult_val*m/t))}>>{t+(k/(mult_val*m/t))} ਮਿੰਟ ਲੱਗਦੇ ਹਨ।\n#### {t+(k/(mult_val*m/t))}"
