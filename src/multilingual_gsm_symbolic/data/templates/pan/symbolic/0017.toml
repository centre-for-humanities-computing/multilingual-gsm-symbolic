question = "ਦਾਦੀ ਹਰ ਰੋਜ਼ ਆਪਣੇ ਪਸੰਦੀਦਾ ਸੈਰ ਵਾਲੇ ਰਸਤੇ 'ਤੇ 3 ਮੀਲ ਤੁਰਦੀ ਹੈ, ਜਿਸ ਵਿੱਚ ਬੀਚ 'ਤੇ 2 ਮੀਲ ਤੁਰਨਾ ਅਤੇ ਫੁੱਟਪਾਥ 'ਤੇ 1 ਮੀਲ ਤੁਰਨਾ ਸ਼ਾਮਲ ਹੈ। ਫੁੱਟਪਾਥ 'ਤੇ ਦਾਦੀ ਬੀਚ ਨਾਲੋਂ ਦੋ ਗੁਣਾ ਰਫ਼ਤਾਰ ਨਾਲ ਤੁਰਦੀ ਹੈ। ਜੇਕਰ ਉਸਦੀ ਸੈਰ ਦੇ 40 ਮਿੰਟ ਬੀਚ 'ਤੇ ਲੰਘਦੇ ਹਨ, ਤਾਂ ਉਸਨੂੰ ਪੂਰੀ 3-ਮੀਲ ਦੀ ਸੈਰ ਪੂਰੀ ਕਰਨ ਵਿੱਚ ਕਿੰਨੇ ਮਿੰਟ ਲੱਗਦੇ ਹਨ?"
answer = "ਬੀਚ 'ਤੇ, ਦਾਦੀ 40 ਮਿੰਟਾਂ ਵਿੱਚ 2 ਮੀਲ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲ ਤੁਰਦੀ ਹੈ, ਯਾਨੀ 2/40 = 1/20 ਮੀਲ ਪ੍ਰਤੀ ਮਿੰਟ।\nਫੁੱਟਪਾਥ 'ਤੇ, ਉਹ ਰੇਤ 'ਤੇ ਤੁਰਨ ਦੀ ਰਫ਼ਤਾਰ ਨਾਲੋਂ ਦੋ ਗੁਣਾ ਰਫ਼ਤਾਰ ਨਾਲ ਤੁਰਦੀ ਹੈ, ਯਾਨੀ 2*1/20 = 0.1 ਮੀਲ ਪ੍ਰਤੀ ਮਿੰਟ।\nਫੁੱਟਪਾਥ 'ਤੇ 1 ਮੀਲ ਤੁਰਨ ਲਈ, ਉਸਨੂੰ 1/0.1 = <<1/0.1=10>>10 ਮਿੰਟ ਲੱਗਦੇ ਹਨ।\nਇਸ ਲਈ, ਕੁੱਲ ਮਿਲਾ ਕੇ, ਦਾਦੀ ਨੂੰ ਆਪਣੇ ਪਸੰਦੀਦਾ ਰਸਤੇ 'ਤੇ ਤੁਰਨ ਵਿੱਚ 40+10 = <<40+10=50>>50 ਮਿੰਟ ਲੱਗਦੇ ਹਨ।\n#### 50"
