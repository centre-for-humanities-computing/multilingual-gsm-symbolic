question = "ਮਨਦੀਪ ਕੋਲ ₹20 ਦੇ 2 ਨੋਟ ਹਨ। ਉਹ ਛੇ ਪਿਚਕਾਰੀਆਂ ਖਰੀਦਦਾ ਹੈ, ਹਰੇਕ ਦੀ ਕੀਮਤ ₹2 ਹੈ। ਉਹ ਪਾਣੀ ਦੇ ਗੁਬਾਰਿਆਂ ਦੇ 3 ਪੈਕਟ ਵੀ ਖਰੀਦਦਾ ਹੈ, ਹਰੇਕ ਦੀ ਕੀਮਤ ₹3 ਹੈ। ਉਸ ਕੋਲ ਕਿੰਨੇ ਪੈਸੇ ਬਚੇ ਹਨ?"
answer = "ਮਨਦੀਪ ਕੋਲ ਸ਼ੁਰੂ ਵਿੱਚ 2 * ₹20 = ₹<<2*20=40>>40 ਹਨ।\nਮਨਦੀਪ ਪਿਚਕਾਰੀਆਂ 'ਤੇ 6*₹2 = ₹<<6*2=12>>12 ਖਰਚ ਕਰਦਾ ਹੈ।\nਮਨਦੀਪ ਪਾਣੀ ਦੇ ਗੁਬਾਰਿਆਂ ਦੇ 3 ਪੈਕਟ * ₹3 = ₹<<3*3=9>>9 ਪਾਣੀ ਦੇ ਗੁਬਾਰਿਆਂ 'ਤੇ ਖਰਚ ਕਰਦਾ ਹੈ।\nਕੁੱਲ ਮਨਦੀਪ ਨੇ ₹12 + ₹9 = ₹<<12+9=21>>21 ਖਰਚ ਕੀਤੇ ਹਨ।\nਮਨਦੀਪ ਕੋਲ ₹40 - ₹21 = ₹<<40-21=19>>19 ਬਚੇ ਹਨ।\n#### 19"
