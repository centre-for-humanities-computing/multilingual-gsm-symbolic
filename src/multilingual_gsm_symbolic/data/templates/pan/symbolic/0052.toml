question_annotated = "{name,ਕ੍ਰੇਗ} ਕੋਲ {n,2} {cur,₹}{bill,20} ਬਿੱਲ ਹਨ। ਉਹ {m_txt,ਛੇ} {item1,ਪਾਣੀ ਦੀ ਬੰਦੂਕ}ਾਂ {cur,₹}{p1,2} ਪ੍ਰਤੀ ਖਰੀਦਦਾ ਹੈ। ਉਹ {k,3} ਪੈਕਟਾਂ ਦੇ {item2,ਪਾਣੀ ਦਾ ਗੁਬਾਰਾ}ਾਂ {cur,₹}{p2,3} ਪ੍ਰਤੀ ਖਰੀਦਦਾ ਹੈ। ਉਸ ਕੋਲ ਕਿੰਨੇ ਪੈਸੇ ਬਚੇ ਹਨ?\n\n#init:\n- name = sample(names_male)\n- $bill = sample([5, 10, 20, 50, 100])\n- item1 = sample([\"ਖਿਡੌਣੇ ਕਾਰ\", \"ਐਕਸ਼ਨ ਫਿਗਰ\", \"ਰੰਗ ਭਰਨ ਦੀ ਪੁਸਤਕ\", \"ਪਹੇਲੀ\", \"ਬੋਰਡ ਗੇਮ\"])\n- item2 = sample([\"ਸਟਿੱਕਰ\", \"ਕੈਂਡੀ ਬਾਰ\", \"ਟਰੇਡਿੰਗ ਕਾਰਡ\", \"ਪੈਂਸਿਲ\", \"ਰਬੜ\"])\n- cur = sample(currencies_sym)\n- $n = range(1, 10)\n- m_txt, m_val = range_str(2, 15, 1, numbers)\n- $k = range(2, 10)\n- $p1 = range(1, 10)\n- $p2 = range(1, 10)\n\n#conditions:\n- n * int(bill) > m_val * p1 + k * p2\n\n#answer: n * int(bill) - (m_val * p1 + k * p2)\n"
answer_annotated = "{name} ਸ਼ੁਰੂ ਵਿੱਚ {n} * {cur}{bill} = {cur}<<{n}*{int(bill)}={n*int(bill)}>>{n*int(bill)} ਰਾਸ਼ੀ ਰੱਖਦਾ ਹੈ।\n{name} {m_val}*{cur}{p1} = {cur}<<{m_val}*{p1}={m_val*p1}>>{m_val*p1} {item1}ਾਂ ਵਿੱਚ ਖਰਚ ਕਰਦਾ ਹੈ।\n{name} {k} ਪੈਕਟਾਂ ਦੇ {item2}ਾਂ ਲਈ * {cur}{p2} = {cur}<<{k}*{p2}={k*p2}>>{k*p2} {item2}ਾਂ ਵਿੱਚ ਖਰਚ ਕਰਦਾ ਹੈ।\nਕੁੱਲ {name} ਨੇ {cur}{m_val*p1} + {cur}{k*p2} = {cur}<<{m_val*p1}+{k*p2}={m_val*p1+k*p2}>>{m_val*p1+k*p2} ਖਰਚ ਕੀਤੇ ਹਨ।\n{name} ਕੋਲ {cur}{n*int(bill)} - {cur}{m_val*p1+k*p2} = {cur}<<{n*int(bill)}-{m_val*p1+k*p2}={n*int(bill)-(m_val*p1+k*p2)}>>{n*int(bill)-(m_val*p1+k*p2)} ਬਚੇ ਹਨ।\n#### {n*int(bill)-(m_val*p1+k*p2)}\n"
