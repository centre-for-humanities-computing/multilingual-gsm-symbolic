question = "ਕ੍ਰੇਗ ਕੋਲ 2 ₹20 ਬਿੱਲ ਹਨ। ਉਹ ਛੇ ਪਾਣੀ ਦੀ ਬੰਦੂਕਾਂ ₹2 ਪ੍ਰਤੀ ਖਰੀਦਦਾ ਹੈ। ਉਹ 3 ਪੈਕਟਾਂ ਦੇ ਪਾਣੀ ਦਾ ਗੁਬਾਰਾਾਂ ₹3 ਪ੍ਰਤੀ ਖਰੀਦਦਾ ਹੈ। ਉਸ ਕੋਲ ਕਿੰਨੇ ਪੈਸੇ ਬਚੇ ਹਨ?"
answer = "ਕ੍ਰੇਗ ਸ਼ੁਰੂ ਵਿੱਚ 2 * ₹20 = ₹<<2*20=40>>40 ਰਾਸ਼ੀ ਰੱਖਦਾ ਹੈ।\nਕ੍ਰੇਗ 6*₹2 = ₹<<6*2=12>>12 ਪਾਣੀ ਦੀ ਬੰਦੂਕਾਂ ਵਿੱਚ ਖਰਚ ਕਰਦਾ ਹੈ।\nਕ੍ਰੇਗ 3 ਪੈਕਟਾਂ ਦੇ ਪਾਣੀ ਦਾ ਗੁਬਾਰਾਾਂ ਲਈ * ₹3 = ₹<<3*3=9>>9 ਪਾਣੀ ਦਾ ਗੁਬਾਰਾਾਂ ਵਿੱਚ ਖਰਚ ਕਰਦਾ ਹੈ।\nਕੁੱਲ ਕ੍ਰੇਗ ਨੇ ₹12 + ₹9 = ₹<<12+9=21>>21 ਖਰਚ ਕੀਤੇ ਹਨ।\nਕ੍ਰੇਗ ਕੋਲ ₹40 - ₹21 = ₹<<40-21=19>>19 ਬਚੇ ਹਨ।\n#### 19\n"
