question = "ਪਲੇਗ ਦੀ ਲਾਗ ਦਸ ਲੋਕਾਂ ਨੂੰ ਲੱਗ ਜਾਂਦੀ ਹੈ। ਹਰ ਰੋਜ਼, ਲਾਗ ਵਾਲਾ ਹਰੇਕ ਵਿਅਕਤੀ ਛੇ ਹੋਰ ਲੋਕਾਂ ਨੂੰ ਲਾਗ ਲਾ ਦਿੰਦਾ ਹੈ। ਤਿੰਨ ਦਿਨਾਂ ਬਾਅਦ ਕਿੰਨੇ ਲੋਕਾਂ ਨੂੰ ਲਾਗ ਲੱਗੀ ਹੋਵੇਗੀ?"
answer = "ਪਹਿਲੇ ਦਿਨ, ਸ਼ੁਰੂ ਵਾਲੇ ਦਸ ਲੋਕ ਹਰੇਕ ਛੇ ਲੋਕਾਂ ਨੂੰ ਲਾਗ ਲਾਉਂਦੇ ਹਨ, ਇਸ ਲਈ 10*6 = <<10*6=60>>60 ਹੋਰ ਲੋਕਾਂ ਨੂੰ ਲਾਗ ਲੱਗਦੀ ਹੈ।\nਪਹਿਲੇ ਦਿਨ ਤੋਂ ਬਾਅਦ 10+60 = <<10+60=70>>70 ਲਾਗ ਵਾਲੇ ਲੋਕ ਹਨ।\nਦੂਜੇ ਦਿਨ, 70*6 = <<70*6=420>>420 ਹੋਰ ਲੋਕਾਂ ਨੂੰ ਲਾਗ ਲੱਗਦੀ ਹੈ।\nਦੂਜੇ ਦਿਨ ਤੋਂ ਬਾਅਦ 70 + 420 = <<70+420=490>>490 ਲਾਗ ਵਾਲੇ ਲੋਕ ਹਨ।\nਤੀਜੇ ਦਿਨ, 490*6 = 2940 ਹੋਰ ਲੋਕਾਂ ਨੂੰ ਲਾਗ ਲੱਗਦੀ ਹੈ। ਇਸ ਲਈ, ਤਿੰਨ ਦਿਨਾਂ ਬਾਅਦ 490 + 2940 = 3430 ਲਾਗ ਵਾਲੇ ਲੋਕ ਹਨ।\n#### 3430"
