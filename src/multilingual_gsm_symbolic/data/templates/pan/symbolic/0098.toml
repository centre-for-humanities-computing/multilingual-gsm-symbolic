answer_annotated = "ਪਹਿਲੇ ਦਿਨ, ਮੂਲ {n0_txt} ਲੋਕ ਹਰੇਕ {r_txt} ਲੋਕਾਂ ਨੂੰ ਸੰਕਰਮਿਤ ਕਰਦੇ ਹਨ, ਇਸ ਲਈ {n0_val}*{r_val} = <<{n0_val}*{r_val}={n0_val*r_val}>>{n0_val*r_val} ਹੋਰ ਲੋਕ ਸੰਕਰਮਿਤ ਹੁੰਦੇ ਹਨ।\nਪਹਿਲੇ ਦਿਨ ਦੇ ਬਾਅਦ {n0_val}+{n0_val*r_val} = <<{n0_val}+{n0_val*r_val}={n0_val+n0_val*r_val}>>{n0_val+n0_val*r_val} ਸੰਕਰਮਿਤ ਲੋਕ ਹਨ।\nਦੂਜੇ ਦਿਨ, {n0_val+n0_val*r_val}*{r_val} = <<{n0_val+n0_val*r_val}*{r_val}={(n0_val+n0_val*r_val)*r_val}>>{(n0_val+n0_val*r_val)*r_val} ਹੋਰ ਲੋਕ ਸੰਕਰਮਿਤ ਹੁੰਦੇ ਹਨ।\nਦੂਜੇ ਦਿਨ ਦੇ ਬਾਅਦ {n0_val+n0_val*r_val} + {(n0_val+n0_val*r_val)*r_val} = <<{n0_val+n0_val*r_val}+{(n0_val+n0_val*r_val)*r_val}={n0_val+n0_val*r_val+(n0_val+n0_val*r_val)*r_val}>>{n0_val+n0_val*r_val+(n0_val+n0_val*r_val)*r_val} ਸੰਕਰਮਿਤ ਲੋਕ ਹਨ।\nਤੀਜੇ ਦਿਨ, {n0_val+n0_val*r_val+(n0_val+n0_val*r_val)*r_val}*{r_val} = <<{(n0_val+n0_val*r_val+(n0_val+n0_val*r_val)*r_val)*r_val}>>{(n0_val+n0_val*r_val+(n0_val+n0_val*r_val)*r_val)*r_val} ਹੋਰ ਲੋਕ ਸੰਕਰਮਿਤ ਹੁੰਦੇ ਹਨ। ਇਸ ਲਈ, ਤਿੰਨ ਦਿਨਾਂ ਬਾਅਦ {n0_val+n0_val*r_val+(n0_val+n0_val*r_val)*r_val} + {(n0_val+n0_val*r_val+(n0_val+n0_val*r_val)*r_val)*r_val} = {n0_val * (r_val + 1)**3} ਸੰਕਰਮਿਤ ਲੋਕ ਹਨ।\n#### {n0_val * (r_val + 1)**3}\n"
