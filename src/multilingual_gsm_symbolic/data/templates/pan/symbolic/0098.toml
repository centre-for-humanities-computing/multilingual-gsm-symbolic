question = "ਇੱਕ ਮਹਾਮਾਰੀ 10 ਲੋਕਾਂ ਨੂੰ ਸੰਕਰਮਿਤ ਕਰਦੀ ਹੈ। ਹਰ ਰੋਜ਼, ਹਰੇਕ ਸੰਕਰਮਿਤ ਵਿਅਕਤੀ 6 ਹੋਰ ਲੋਕਾਂ ਨੂੰ ਸੰਕਰਮਿਤ ਕਰਦਾ ਹੈ। ਤਿੰਨ ਦਿਨਾਂ ਬਾਅਦ ਕਿੰਨੇ ਲੋਕ ਸੰਕਰਮਿਤ ਹੋਣਗੇ?"
answer = "ਪਹਿਲੇ ਦਿਨ, ਮੂਲ 10 ਲੋਕ ਹਰੇਕ 6 ਲੋਕਾਂ ਨੂੰ ਸੰਕਰਮਿਤ ਕਰਦੇ ਹਨ, ਇਸ ਲਈ 10*6 = <<10*6=60>>60 ਹੋਰ ਲੋਕ ਸੰਕਰਮਿਤ ਹੁੰਦੇ ਹਨ।\nਪਹਿਲੇ ਦਿਨ ਦੇ ਬਾਅਦ 10+60 = <<10+60=70>>70 ਸੰਕਰਮਿਤ ਲੋਕ ਹਨ।\nਦੂਜੇ ਦਿਨ, 70*6 = <<70*6=420>>420 ਹੋਰ ਲੋਕ ਸੰਕਰਮਿਤ ਹੁੰਦੇ ਹਨ।\nਦੂਜੇ ਦਿਨ ਦੇ ਬਾਅਦ 70 + 420 = <<70+420=490>>490 ਸੰਕਰਮਿਤ ਲੋਕ ਹਨ।\nਤੀਜੇ ਦਿਨ, 490*6 = 2940 ਹੋਰ ਲੋਕ ਸੰਕਰਮਿਤ ਹੁੰਦੇ ਹਨ। ਇਸ ਲਈ, ਤਿੰਨ ਦਿਨਾਂ ਬਾਅਦ 490 + 2940 = 3430 ਸੰਕਰਮਿਤ ਲੋਕ ਹਨ।\n#### 3430\n"
