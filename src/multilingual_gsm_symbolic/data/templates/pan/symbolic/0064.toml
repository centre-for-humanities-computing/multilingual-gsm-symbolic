question = "Mary kol 6 jar chunni de apni pantry vich ne. Har chunni de jar 8 cupcakes saja sakda hai. Mary chaundi hai ki oh apne sabhi chunni khatam karne layi kafi cupcakes banae. Agar har pan vich 12 cupcakes aaunde ne, ohnu kitne pans de barabar cupcakes banane chahidde ne?"
