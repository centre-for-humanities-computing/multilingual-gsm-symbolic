question = "ਮੈਰੀ ਦੀ ਪੈਂਟਰੀ ਵਿੱਚ 6 ਜਾਰ ਹਨ। ਹਰ ਜਾਰ ਵਿੱਚ 8 ਕੱਪਕੇਕ ਆ ਸਕਦੇ ਹਨ। ਜੇ ਹਰ ਪੈਨ ਵਿੱਚ 12 ਕੱਪਕੇਕ ਆਉਂਦੇ ਹਨ, ਤਾਂ ਸਾਰੇ ਕੱਪਕੇਕ ਬਣਾਉਣ ਲਈ ਕਿੰਨੇ ਪੈਨ ਚਾਹੀਦੇ ਹਨ?"
