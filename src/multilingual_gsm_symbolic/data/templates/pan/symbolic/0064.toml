question = "ਸਿਮਰਨ ਕੋਲ ਭੰਡਾਰ ਵਿੱਚ ਸਪ੍ਰਿੰਕਲ ਦੇ 6 ਜਾਰ ਹਨ। ਸਪ੍ਰਿੰਕਲ ਦਾ ਹਰ ਜਾਰ 8 ਕੱਪਕੇਕ ਸਜਾ ਸਕਦਾ ਹੈ। ਸਿਮਰਨ ਇੰਨੇ ਕੱਪਕੇਕ ਬਣਾਉਣੇ ਚਾਹੁੰਦੀ ਹੈ ਕਿ ਸਪ੍ਰਿੰਕਲ ਦੇ ਸਾਰੇ ਜਾਰ ਵਰਤੇ ਜਾਣ। ਜੇ ਹਰ ਪੈਨ ਵਿੱਚ 12 ਕੱਪਕੇਕ ਆਉਂਦੇ ਹਨ, ਤਾਂ ਸਾਰੇ ਕੱਪਕੇਕ ਬਣਾਉਣ ਲਈ ਕਿੰਨੇ ਪੈਨ ਚਾਹੀਦੇ ਹਨ?"
