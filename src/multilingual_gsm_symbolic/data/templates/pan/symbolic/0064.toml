question_annotated = "{name,ਮੈਰੀ} kol {n,6} jar {item,chunni} de apni {location,pantry} vich ne. Har {item,chunni} de jar {m,8} {food,cupcake}s saja sakda hai. {name,ਮੈਰੀ} chaundi hai ki oh apne sabhi {item,chunni} khatam karne layi kafi {food,cupcake}s banae. Agar har {container,pan} vich {k,12} {food,cupcake}s aaunde ne, ohnu kitne {container,pan}s de barabar {food,cupcake}s banane chahidde ne?\n\n#init:\n- name = sample(names_female)\n- item = sample([\"chunni\", \"frosting\", \"chashni\", \"chocolate chips\"])\n- food = sample([\"cupcake\", \"kuki\", \"brownie\", \"muffin\"])\n- location = sample([\"pantry\", \"almari\", \"kitchen cabinet\", \"saman rakhne di jagah\"])\n- container = sample([\"pan\", \"tray\", \"baking sheet\", \"rack\"])\n- $n = range(3, 15)\n- $m = range(6, 20)\n- $k = range(6, 24)\n\n#conditions:\n- divides(n*m, k)\n\n#answer: (n*m)//k\n"
