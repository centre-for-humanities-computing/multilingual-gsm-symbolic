question = "ਮੈਰੀ ਦੀ ਪੈਂਟਰੀ ਵਿੱਚ 6 ਜਾਰ ਹਨ। ਹਰ ਜਾਰ 8 ਕੱਪਕੇਕ ਸਜਾਉਣ ਲਈ ਕਾਫ਼ੀ ਹੈ। ਮੈਰੀ ਚਾਹੁੰਦੀ ਹੈ ਕਿ ਉਹ ਆਪਣੇ ਸਾਰੇ ਜਾਰ ਵਰਤ ਕੇ ਕੱਪਕੇਕ ਬਣਾਏ। ਜੇ ਹਰ ਪੈਨ ਵਿੱਚ 12 ਕੱਪਕੇਕ ਆਉਂਦੇ ਹਨ, ਤਾਂ ਉਸਨੂੰ ਕਿੰਨੇ ਪੈਨਾਂ ਦੇ ਬਰਾਬਰ ਕੱਪਕੇਕ ਬਣਾਉਣੇ ਚਾਹੀਦੇ ਹਨ?"
answer = "ਉਸ ਕੋਲ 6 * 8 = <<6*8=48>>48 ਕੱਪਕੇਕ ਸਜਾਉਣ ਲਈ ਕਾਫ਼ੀ ਸਮੱਗਰੀ ਹੈ।\nਸਾਰੇ ਕੱਪਕੇਕ ਬਣਾਉਣ ਲਈ ਉਸਨੂੰ 48 / 12 = <<48/12=4>>4 ਪੈਨਾਂ ਦੀ ਲੋੜ ਪਵੇਗੀ।\n#### 4"
