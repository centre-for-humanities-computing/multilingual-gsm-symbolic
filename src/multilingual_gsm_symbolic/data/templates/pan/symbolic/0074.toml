question = "ਆਦਰਸ਼ ਸਕੂਲ ਵਿੱਚ ਚੌਥੀ ਜਮਾਤ ਦੇ 96 ਵਿਦਿਆਰਥੀ ਹਨ। ਉਹਨਾਂ ਵਿੱਚੋਂ 43 ਕੁੜੀਆਂ ਹਨ। ਸ਼ੁੱਕਰਵਾਰ ਨੂੰ ਚੌਥੀ ਜਮਾਤ ਦੀਆਂ 5 ਕੁੜੀਆਂ ਅਤੇ ਚੌਥੀ ਜਮਾਤ ਦੇ 4 ਮੁੰਡੇ ਗੈਰਹਾਜ਼ਰ ਸਨ। ਸ਼ੁੱਕਰਵਾਰ ਨੂੰ ਆਦਰਸ਼ ਸਕੂਲ ਵਿੱਚ ਚੌਥੀ ਜਮਾਤ ਦੇ ਕਿੰਨੇ ਮੁੰਡੇ ਹਾਜ਼ਰ ਸਨ?"
answer = "ਚੌਥੀ ਜਮਾਤ ਦੇ 96 ਵਿਦਿਆਰਥੀਆਂ ਵਿੱਚੋਂ 43 ਕੁੜੀਆਂ ਹਨ, ਇਸ ਲਈ 96 ਵਿਦਿਆਰਥੀ - 43 ਕੁੜੀਆਂ = <<96-43=53>>53 ਮੁੰਡੇ।\nਸ਼ੁੱਕਰਵਾਰ ਨੂੰ 53 ਮੁੰਡੇ - 4 ਗੈਰਹਾਜ਼ਰ = <<53-4=49>>49 ਮੁੰਡੇ ਹਾਜ਼ਰ ਸਨ।\n#### 49"
