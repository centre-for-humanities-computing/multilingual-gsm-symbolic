question = "ਬਿਲੀ ਦੇ ਆਇਤਾਕਾਰ ਸੌਣ ਵਾਲਾ ਕਮਰਾ ਦਾ ਖੇਤਰਫਲ 360 ਚੌਰਸ ਫੁੱਟ ਹੈ। ਜੇਕਰ ਕਮਰੇ ਦੀ ਲੰਬਾਈ 3 ਯਾਰਡ ਹੈ, ਤਾਂ ਕਮਰੇ ਦਾ ਘੇਰਾ ਫੁੱਟ ਵਿੱਚ ਕੀ ਹੈ?"
