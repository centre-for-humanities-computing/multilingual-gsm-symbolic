question = "ਹਰਜੀਤ ਦੇ ਘਰ ਵਿੱਚ ਆਇਤਾਕਾਰ ਸੌਣ ਵਾਲੇ ਕਮਰੇ ਦਾ ਖੇਤਰਫਲ 360 ਚੌਰਸ ਫੁੱਟ ਹੈ। ਜੇਕਰ ਕਮਰੇ ਦੀ ਲੰਬਾਈ 3 ਗਜ਼ ਹੈ, ਤਾਂ ਕਮਰੇ ਦਾ ਘੇਰਾ ਫੁੱਟ ਵਿੱਚ ਕੀ ਹੈ?"
