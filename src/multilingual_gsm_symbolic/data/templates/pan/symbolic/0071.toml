question_annotated = "{name,ਹਰਜੀਤ} ਆਪਣੇ ਪਸ਼ੂਆਂ ਨੂੰ {food,ਸੁੱਕਾ ਘਾਹ} ਪਾ ਰਿਹਾ ਹੈ। ਹਰ {animal1,ਬੱਕਰੀ} ਨੂੰ {n1,5} {unit,ਪੌਂਡ} ਚਾਹੀਦਾ ਹੈ, ਅਤੇ ਹਰ {animal2,ਮੱਝ} ਨੂੰ ਹਰ {animal1,ਬੱਕਰੀ} ਦੀ ਲੋੜ ਦੇ ਦੁੱਗਣੇ ਤੋਂ {n2,3} {unit,ਪੌਂਡ} ਘੱਟ ਚਾਹੀਦਾ ਹੈ। ਜੇਕਰ {k1,15} {animal1,ਬੱਕਰੀ} ਅਤੇ {k2,12} {animal2,ਮੱਝ} ਹਨ, ਤਾਂ {name,ਹਰਜੀਤ} ਨੂੰ ਕੁੱਲ ਕਿੰਨੇ {unit,ਪੌਂਡ} {food,ਸੁੱਕਾ ਘਾਹ} ਚਾਹੀਦਾ ਹੈ?\n\n#init:\n- name = sample(names_male)\n- food = sample([\"ਸੁੱਕਾ ਘਾਹ\", \"ਅਨਾਜ\", \"ਚਾਰਾ\", \"ਸਾਈਲੇਜ\"])\n- animal1, animal2 = sample([\"ਬੱਕਰੀ\", \"ਗਾਂ\", \"ਘੋੜੀ\", \"ਖੱਚਰ\", \"ਮੱਝ\", \"ਭੇਡ\", \"ਸੂਰ\", \"ਟਰਕੀ\", \"ਬੱਤਖ\"], 2)\n- unit = sample([\"ਪੌਂਡ\", \"ਕਿਲੋਗ੍ਰਾਮ\", \"ਕਿਲੋ\"])\n- $n1 = range(3, 15)\n- $n2 = range(1, 10)\n- $k1 = range(10, 50)\n- $k2 = range(10, 50)\n\n#conditions:\n- 2*n1 - n2 > 0\n\n#answer: k1*n1 + k2*(2*n1 - n2)"
answer_annotated = "ਪਹਿਲਾਂ ਪਤਾ ਕਰੋ ਕਿ ਹਰ {animal2} ਨੂੰ ਕਿੰਨਾ {food} ਚਾਹੀਦਾ ਹੈ: {n1} {unit} * 2 - {n2} = <<{n1}*2-{n2}={2*n1-n2}>>{2*n1-n2} {unit} ਪ੍ਰਤੀ {animal2}\nਹੁਣ ਪਤਾ ਕਰੋ ਕਿ {animal2} ਵਾਸਤੇ ਕੁੱਲ ਕਿੰਨਾ {food} ਚਾਹੀਦਾ ਹੈ: {2*n1-n2} {unit} ਪ੍ਰਤੀ {animal2} * {k2} {animal2} = <<{2*n1-n2}*{k2}={k2*(2*n1-n2)}>>{k2*(2*n1-n2)} {unit}\nਹੁਣ ਪਤਾ ਕਰੋ ਕਿ {animal1} ਵਾਸਤੇ ਕੁੱਲ ਕਿੰਨਾ {food} ਚਾਹੀਦਾ ਹੈ: {n1} {unit} ਪ੍ਰਤੀ {animal1} * {k1} {animal1} = <<{n1}*{k1}={k1*n1}>>{k1*n1} {unit}\nਹੁਣ ਕੁੱਲ ਕੱਢਣ ਲਈ ਦੋਵੇਂ ਮਾਤਰਾਵਾਂ ਜੋੜੋ: {k2*(2*n1-n2)} {unit} + {k1*n1} {unit} = <<{k2*(2*n1-n2)}+{k1*n1}={k1*n1 + k2*(2*n1 - n2)}>>{k1*n1 + k2*(2*n1 - n2)} {unit}\n#### {k1*n1 + k2*(2*n1 - n2)}"
