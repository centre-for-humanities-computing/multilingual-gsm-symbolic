question_annotated = "{name,ਨੇਟ} ਆਪਣੇ ਪਾਲਤੂ ਜਾਨਵਰਾਂ ਨੂੰ {food,ਹੇ} ਦੇ ਰਿਹਾ ਹੈ। ਹਰੇਕ {animal1,ਬੱਕਰੀ} ਨੂੰ {n1,5} {unit,ਪੌਂਡ} ਦੀ ਲੋੜ ਹੁੰਦੀ ਹੈ, ਅਤੇ ਹਰੇਕ {animal2,ਲਾਮਾ} ਨੂੰ ਹਰੇਕ {animal1,ਬੱਕਰੀ} ਦੀ ਲੋੜ ਦੇ ਦੁੱਗਣੇ ਤੋਂ {n2,3} {unit,ਪੌਂਡ} ਘੱਟ ਦੀ ਲੋੜ ਹੁੰਦੀ ਹੈ। ਜੇਕਰ {k1,15} {animal1,ਬੱਕਰੀ}ਆਂ ਅਤੇ {k2,12} {animal2,ਲਾਮਾ}ਆਂ ਹਨ, ਤਾਂ {name,ਨੇਟ} ਨੂੰ ਕਿੰਨੇ {unit,ਪੌਂਡ} {food,ਹੇ} ਦੀ ਲੋੜ ਹੈ?\n\n#init:\n- name = sample(names_male)\n- food = sample([\"ਹੇ\", \"ਅਨਾਜ\", \"ਚਾਰਾ\", \"ਸਿਲੇਜ\"])\n- animal1, animal2 = sample([\"ਬੱਕਰੀ\", \"ਗਈ\", \"ਘੋੜਾ\", \"ਗਧਾ\", \"ਲਾਮਾ\", \"ਅਲਪਾਕਾ\", \"ਸੂਰ\", \"ਟਰਕੀ\", \"ਬੱਤਖ\"], 2)\n- unit = sample([\"ਪੌਂਡ\", \"ਕਿਲੋਗ੍ਰਾਮ\", \"ਕਿਲੋ\"])\n- $n1 = range(3, 15)\n- $n2 = range(1, 10)\n- $k1 = range(10, 50)\n- $k2 = range(10, 50)\n\n#conditions:\n- 2*n1 - n2 > 0\n\n#answer: k1*n1 + k2*(2*n1 - n2)\n"
answer_annotated = "ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਇਹ ਪਤਾ ਕਰੋ ਕਿ ਹਰੇਕ {animal2} ਨੂੰ ਕਿੰਨਾ {food} ਚਾਹੀਦਾ ਹੈ: {n1} {unit} * 2 - {n2} = <<{n1}*2-{n2}={2*n1-n2}>>{2*n1-n2} {unit}/{animal2}\nਹੁਣ ਇਹ ਪਤਾ ਕਰੋ ਕਿ {animal2}ਆਂ ਨੂੰ ਕੁੱਲ ਕਿੰਨਾ {food} ਚਾਹੀਦਾ ਹੈ: {2*n1-n2} {unit}/{animal2} * {k2} {animal2}ਆਂ = <<{2*n1-n2}*{k2}={k2*(2*n1-n2)}>>{k2*(2*n1-n2)} {unit}\nਹੁਣ ਇਹ ਪਤਾ ਕਰੋ ਕਿ {animal1}ਆਂ ਨੂੰ ਕੁੱਲ ਕਿੰਨਾ {food} ਚਾਹੀਦਾ ਹੈ: {n1} {unit}/{animal1} * {k1} {animal1}ਆਂ = <<{n1}*{k1}={k1*n1}>>{k1*n1} {unit}\nਹੁਣ ਕੁੱਲ ਪਤਾ ਕਰਨ ਲਈ {food} ਦੀਆਂ ਦੋ ਮਾਤਰਾਵਾਂ ਜੋੜੋ: {k2*(2*n1-n2)} {unit} + {k1*n1} {unit} = <<{k2*(2*n1-n2)}+{k1*n1}={k1*n1 + k2*(2*n1 - n2)}>>{k1*n1 + k2*(2*n1 - n2)} {unit}\n#### {k1*n1 + k2*(2*n1 - n2)}\n"
