question = "ਨੇਟ ਆਪਣੇ ਪਾਲਤੂ ਜਾਨਵਰਾਂ ਨੂੰ ਹੇ ਦੇ ਰਿਹਾ ਹੈ। ਹਰੇਕ ਬੱਕਰੀ ਨੂੰ 5 ਪੌਂਡ ਦੀ ਲੋੜ ਹੁੰਦੀ ਹੈ, ਅਤੇ ਹਰੇਕ ਲਾਮਾ ਨੂੰ ਹਰੇਕ ਬੱਕਰੀ ਦੀ ਲੋੜ ਦੇ ਦੁੱਗਣੇ ਤੋਂ 3 ਪੌਂਡ ਘੱਟ ਦੀ ਲੋੜ ਹੁੰਦੀ ਹੈ। ਜੇਕਰ 15 ਬੱਕਰੀਆਂ ਅਤੇ 12 ਲਾਮਾਆਂ ਹਨ, ਤਾਂ ਨੇਟ ਨੂੰ ਕਿੰਨੇ ਪੌਂਡ ਹੇ ਦੀ ਲੋੜ ਹੈ?"
answer = "ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਇਹ ਪਤਾ ਕਰੋ ਕਿ ਹਰੇਕ ਲਾਮਾ ਨੂੰ ਕਿੰਨਾ ਹੇ ਚਾਹੀਦਾ ਹੈ: 5 ਪੌਂਡ * 2 - 3 = <<5*2-3=7>>7 ਪੌਂਡ/ਲਾਮਾ\nਹੁਣ ਇਹ ਪਤਾ ਕਰੋ ਕਿ ਲਾਮਾਆਂ ਨੂੰ ਕੁੱਲ ਕਿੰਨਾ ਹੇ ਚਾਹੀਦਾ ਹੈ: 7 ਪੌਂਡ/ਲਾਮਾ * 12 ਲਾਮਾਆਂ = <<7*12=84>>84 ਪੌਂਡ\nਹੁਣ ਇਹ ਪਤਾ ਕਰੋ ਕਿ ਬੱਕਰੀਆਂ ਨੂੰ ਕੁੱਲ ਕਿੰਨਾ ਹੇ ਚਾਹੀਦਾ ਹੈ: 5 ਪੌਂਡ/ਬੱਕਰੀ * 15 ਬੱਕਰੀਆਂ = <<5*15=75>>75 ਪੌਂਡ\nਹੁਣ ਕੁੱਲ ਪਤਾ ਕਰਨ ਲਈ ਹੇ ਦੀਆਂ ਦੋ ਮਾਤਰਾਵਾਂ ਜੋੜੋ: 84 ਪੌਂਡ + 75 ਪੌਂਡ = <<84+75=159>>159 ਪੌਂਡ\n#### 159\n"
