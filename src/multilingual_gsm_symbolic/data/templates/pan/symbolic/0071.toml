question = "ਹਰਜੀਤ ਆਪਣੇ ਪਸ਼ੂਆਂ ਨੂੰ ਸੁੱਕਾ ਘਾਹ ਪਾ ਰਿਹਾ ਹੈ। ਹਰ ਬੱਕਰੀ ਨੂੰ 5 ਪੌਂਡ ਚਾਹੀਦਾ ਹੈ, ਅਤੇ ਹਰ ਮੱਝ ਨੂੰ ਹਰ ਬੱਕਰੀ ਦੀ ਲੋੜ ਦੇ ਦੁੱਗਣੇ ਤੋਂ 3 ਪੌਂਡ ਘੱਟ ਚਾਹੀਦਾ ਹੈ। ਜੇਕਰ 15 ਬੱਕਰੀ ਅਤੇ 12 ਮੱਝ ਹਨ, ਤਾਂ ਹਰਜੀਤ ਨੂੰ ਕੁੱਲ ਕਿੰਨੇ ਪੌਂਡ ਸੁੱਕਾ ਘਾਹ ਚਾਹੀਦਾ ਹੈ?"
answer = "ਪਹਿਲਾਂ ਪਤਾ ਕਰੋ ਕਿ ਹਰ ਮੱਝ ਨੂੰ ਕਿੰਨਾ ਸੁੱਕਾ ਘਾਹ ਚਾਹੀਦਾ ਹੈ: 5 ਪੌਂਡ * 2 - 3 = <<5*2-3=7>>7 ਪੌਂਡ ਪ੍ਰਤੀ ਮੱਝ\nਹੁਣ ਪਤਾ ਕਰੋ ਕਿ ਮੱਝ ਵਾਸਤੇ ਕੁੱਲ ਕਿੰਨਾ ਸੁੱਕਾ ਘਾਹ ਚਾਹੀਦਾ ਹੈ: 7 ਪੌਂਡ ਪ੍ਰਤੀ ਮੱਝ * 12 ਮੱਝ = <<7*12=84>>84 ਪੌਂਡ\nਹੁਣ ਪਤਾ ਕਰੋ ਕਿ ਬੱਕਰੀ ਵਾਸਤੇ ਕੁੱਲ ਕਿੰਨਾ ਸੁੱਕਾ ਘਾਹ ਚਾਹੀਦਾ ਹੈ: 5 ਪੌਂਡ ਪ੍ਰਤੀ ਬੱਕਰੀ * 15 ਬੱਕਰੀ = <<5*15=75>>75 ਪੌਂਡ\nਹੁਣ ਕੁੱਲ ਕੱਢਣ ਲਈ ਦੋਵੇਂ ਮਾਤਰਾਵਾਂ ਜੋੜੋ: 84 ਪੌਂਡ + 75 ਪੌਂਡ = <<84+75=159>>159 ਪੌਂਡ\n#### 159"
