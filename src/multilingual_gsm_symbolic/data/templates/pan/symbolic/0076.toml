question = "{name} ਨੇ {n} {fish} ਪਿਛਲੇ {day} ਫੜੇ। ਪਹਿਲੇ {fish} ਦਾ ਜੋ ਵਜ਼ਨ ਉਸਨੇ ਫੜਿਆ ਸੀ, ਉਹ {w1} {unit} ਹੈ, ਦੂਜੇ {fish} ਦਾ ਜੋ ਵਜ਼ਨ ਉਸਨੇ ਫੜਿਆ ਸੀ, ਉਹ {w2} {unit} ਹੈ, ਅਤੇ ਬਾਕੀ ਦਾ {fish} ਦਾ ਜੋ ਵਜ਼ਨ ਉਸਨੇ ਫੜਿਆ ਸੀ ਉਹ {w3} {unit} ਹੈ। ਜੇਕਰ ਇੱਕ {unit} {fish} ਦੀ ਕੀਮਤ {cur}{price} ਹੈ, ਤਾਂ ਮਾਰਕੀਟ ਨੂੰ ਸਾਰੇ {fish} ਵੇਚਣ ਤੋਂ ਬਾਅਦ ਉਹ ਕਿੰਨਾ ਕਮਾਏਗਾ?"
answer = "ਮਾਈਕਲ ਪਹਿਲੇ ਟਰਾਟ ਤੋਂ 64*£1.75 = £<<64*1.75=112>>112 ਕਮਾਏਗਾ।\nਉਹ ਦੂਜੇ ਟਰਾਟ ਤੋਂ 57*£1.75 = £<<57*1.75=99.75>>99.75 ਕਮਾਏਗਾ।\nਬਾਕੀ ਟਰਾਟਆਂ 6-2 = <<6-2=4>>4 ਹਨ। ਉਹ ਹਰ ਇੱਕ ਲਈ 32*£1.75 = £<<32*1.75=56>>56 ਕਮਾਏਗਾ। ਇਸ ਲਈ ਉਹ 4 * 56 = <<4*56=224>>224 ਕਮਾਏਗਾ।\nਕੁੱਲ ਰਕਮ £112 + £99.75 + £224 = £<<112+99.75+224=435.75>>435.75 ਹੈ।\n#### 435\n"
