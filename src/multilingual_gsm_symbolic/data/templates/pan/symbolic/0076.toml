question = "ਡੀਆਂਦ੍ਰੇ ਨੇ 3 ਟੂਨਾ ਪਿਛਲੇ ਸੋਮਵਾਰ ਫੜੇ। ਪਹਿਲੇ ਟੂਨਾ ਦਾ ਜੋ ਵਜ਼ਨ ਉਸਨੇ ਫੜਿਆ ਸੀ, ਉਹ 56 ਕਿਲੋਗ੍ਰਾਮ ਹੈ, ਦੂਜੇ ਟੂਨਾ ਦਾ ਜੋ ਵਜ਼ਨ ਉਸਨੇ ਫੜਿਆ ਸੀ, ਉਹ 46 ਕਿਲੋਗ੍ਰਾਮ ਹੈ, ਅਤੇ ਬਾਕੀ ਦਾ ਟੂਨਾ ਦਾ ਜੋ ਵਜ਼ਨ ਉਸਨੇ ਫੜਿਆ ਸੀ ਉਹ 26 ਕਿਲੋਗ੍ਰਾਮ ਹੈ। ਜੇਕਰ ਇੱਕ ਕਿਲੋਗ੍ਰਾਮ ਟੂਨਾ ਦੀ ਕੀਮਤ $0.5 ਹੈ, ਤਾਂ ਮਾਰਕੀਟ ਨੂੰ ਸਾਰੇ ਟੂਨਾ ਵੇਚਣ ਤੋਂ ਬਾਅਦ ਉਹ ਕਿੰਨਾ ਕਮਾਏਗਾ?"
answer = "ਡੀਆਂਦ੍ਰੇ ਪਹਿਲੇ ਟੂਨਾ ਤੋਂ 56*$0.5 = $<<56*0.5=28>>28 ਕਮਾਏਗਾ।\nਉਹ ਦੂਜੇ ਟੂਨਾ ਤੋਂ 46*$0.5 = $<<46*0.5=23>>23 ਕਮਾਏਗਾ।\nਬਾਕੀ ਟੂਨਾਆਂ 3-2 = <<3-2=1>>1 ਹਨ। ਉਹ ਹਰ ਇੱਕ ਲਈ 26*$0.5 = $<<26*0.5=13>>13 ਕਮਾਏਗਾ। ਇਸ ਲਈ ਉਹ 1 * 13 = <<1*13=13>>13 ਕਮਾਏਗਾ।\nਕੁੱਲ ਰਕਮ $28 + $23 + $13 = $<<28+23+13=64>>64 ਹੈ।\n#### 64\n"
