question = "ਗੁਰਮੀਤ ਨੇ ਪਿਛਲੇ ਸੋਮਵਾਰ ਨੂੰ 3 ਟੂਨਾ ਮੱਛੀਆਂ ਫੜੀਆਂ। ਉਸਨੇ ਜੋ ਪਹਿਲੀ ਟੂਨਾ ਮੱਛੀ ਫੜੀ, ਉਸਦਾ ਵਜ਼ਨ 56 ਕਿਲੋਗ੍ਰਾਮ ਹੈ, ਜੋ ਦੂਜੀ ਟੂਨਾ ਮੱਛੀ ਫੜੀ, ਉਸਦਾ ਵਜ਼ਨ 46 ਕਿਲੋਗ੍ਰਾਮ ਹੈ, ਅਤੇ ਬਾਕੀ ਹਰ ਟੂਨਾ ਮੱਛੀ ਦਾ ਵਜ਼ਨ 26 ਕਿਲੋਗ੍ਰਾਮ ਹੈ। ਜੇਕਰ ਇੱਕ ਕਿਲੋਗ੍ਰਾਮ ਟੂਨਾ ਮੱਛੀ ਦੀ ਕੀਮਤ $0.5 ਹੈ, ਤਾਂ ਮੰਡੀ ਵਿੱਚ ਸਾਰੀਆਂ ਟੂਨਾ ਮੱਛੀਆਂ ਵੇਚਣ ਤੋਂ ਬਾਅਦ ਉਹ ਕਿੰਨਾ ਕਮਾਏਗਾ?"
answer = "ਗੁਰਮੀਤ ਪਹਿਲੀ ਟੂਨਾ ਮੱਛੀ ਤੋਂ 56*$0.5 = $<<56*0.5=28>>28 ਕਮਾਏਗਾ।\nਉਹ ਦੂਜੀ ਟੂਨਾ ਮੱਛੀ ਤੋਂ 46*$0.5 = $<<46*0.5=23>>23 ਕਮਾਏਗਾ।\nਬਾਕੀ ਟੂਨਾ ਮੱਛੀਆਂ 3-2 = <<3-2=1>>1 ਹਨ। ਉਹ ਹਰ ਇੱਕ ਤੋਂ 26*$0.5 = $<<26*0.5=13>>13 ਕਮਾਏਗਾ। ਇਸ ਲਈ ਉਹ 1 * 13 = <<1*13=13>>13 ਕਮਾਏਗਾ।\nਇਸ ਲਈ ਸਾਰੀਆਂ ਟੂਨਾ ਮੱਛੀਆਂ ਤੋਂ ਉਹ ਕੁੱਲ $28 + $23 + $13 = $<<28+23+13=64>>64 ਕਮਾਏਗਾ।\n#### 64"
