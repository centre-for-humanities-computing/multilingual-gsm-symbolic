question_annotated = "{name} ਨੇ {n} {fish} ਪਿਛਲੇ {day} ਫੜੇ। ਪਹਿਲੇ {fish} ਦਾ ਜੋ ਵਜ਼ਨ ਉਸਨੇ ਫੜਿਆ ਸੀ, ਉਹ {w1} {unit} ਹੈ, ਦੂਜੇ {fish} ਦਾ ਜੋ ਵਜ਼ਨ ਉਸਨੇ ਫੜਿਆ ਸੀ, ਉਹ {w2} {unit} ਹੈ, ਅਤੇ ਬਾਕੀ ਦਾ {fish} ਦਾ ਜੋ ਵਜ਼ਨ ਉਸਨੇ ਫੜਿਆ ਸੀ ਉਹ {w3} {unit} ਹੈ। ਜੇਕਰ ਇੱਕ {unit} {fish} ਦੀ ਕੀਮਤ {cur}{price} ਹੈ, ਤਾਂ ਮਾਰਕੀਟ ਨੂੰ ਸਾਰੇ {fish} ਵੇਚਣ ਤੋਂ ਬਾਅਦ ਉਹ ਕਿੰਨਾ ਕਮਾਏਗਾ?\n\n#init:\n- name = sample(names_male)\n- fish = sample([\"ਟੂਨਾ\", \"ਸੈਲਮਨ\", \"ਕੋਡ\", \"ਟਰਾਟ\", \"ਸਟੀਲਹੈੱਡ\"])\n- day = sample(weekdays)\n- unit = sample([\"ਕਿਲੋਗ੍ਰਾਮ\", \"ਪੌਂਡ\", \"kg\"])\n- cur = sample(currencies_sym)\n- $n = range(3, 8)\n- $w1 = range(40, 80)\n- $w2 = range(30, 60)\n- $w3 = range(20, 40)\n- $price = arange(0.25, 2.5, 0.25)\n\n#conditions:\n- n > 2\n- is_int((w1 + w2) * price + (n-2) * w3 * price)\n\n#answer: int((w1 + w2) * price + (n-2)*w3*price)\n"
answer_annotated = "{name} ਪਹਿਲੇ {fish} ਤੋਂ {w1}*{cur}{price} = {cur}<<{w1}*{price}={w1*price}>>{w1*price} ਕਮਾਏਗਾ।\nਉਹ ਦੂਜੇ {fish} ਤੋਂ {w2}*{cur}{price} = {cur}<<{w2}*{price}={w2*price}>>{w2*price} ਕਮਾਏਗਾ।\nਬਾਕੀ {fish}ਆਂ {n}-2 = <<{n}-2={n-2}>>{n-2} ਹਨ। ਉਹ ਹਰ ਇੱਕ ਲਈ {w3}*{cur}{price} = {cur}<<{w3}*{price}={w3*price}>>{w3*price} ਕਮਾਏਗਾ। ਇਸ ਲਈ ਉਹ {n-2} * {w3*price} = <<{n-2}*{w3*price}={((n-2)*w3*price)}>>{((n-2)*w3*price)} ਕਮਾਏਗਾ।\nਕੁੱਲ ਰਕਮ {cur}{w1*price} + {cur}{w2*price} + {cur}{((n-2)*w3*price)} = {cur}<<{w1*price}+{w2*price}+{((n-2)*w3*price)}={float((w1 + w2) * price + (n-2)*w3*price)}>>{float((w1 + w2 + (n-2)*w3) * price)} ਹੈ।\n#### {int((w1 + w2 + (n-2)*w3) * price)}\n"
