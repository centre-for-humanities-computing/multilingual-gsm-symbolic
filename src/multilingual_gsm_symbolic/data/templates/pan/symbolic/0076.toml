question_annotated = "{name,ਗੁਰਮੀਤ} ਨੇ ਪਿਛਲੇ {day,ਸੋਮਵਾਰ} ਨੂੰ {n,3} {fish,ਟੂਨਾ} ਮੱਛੀਆਂ ਫੜੀਆਂ। ਉਸਨੇ ਜੋ ਪਹਿਲੀ {fish,ਟੂਨਾ} ਮੱਛੀ ਫੜੀ, ਉਸਦਾ ਵਜ਼ਨ {w1,56} {unit,ਕਿਲੋਗ੍ਰਾਮ} ਹੈ, ਜੋ ਦੂਜੀ {fish,ਟੂਨਾ} ਮੱਛੀ ਫੜੀ, ਉਸਦਾ ਵਜ਼ਨ {w2,46} {unit,ਕਿਲੋਗ੍ਰਾਮ} ਹੈ, ਅਤੇ ਬਾਕੀ ਹਰ {fish,ਟੂਨਾ} ਮੱਛੀ ਦਾ ਵਜ਼ਨ {w3,26} {unit,ਕਿਲੋਗ੍ਰਾਮ} ਹੈ। ਜੇਕਰ ਇੱਕ {unit,ਕਿਲੋਗ੍ਰਾਮ} {fish,ਟੂਨਾ} ਮੱਛੀ ਦੀ ਕੀਮਤ {cur,$}{price,0.5} ਹੈ, ਤਾਂ ਮੰਡੀ ਵਿੱਚ ਸਾਰੀਆਂ {fish,ਟੂਨਾ} ਮੱਛੀਆਂ ਵੇਚਣ ਤੋਂ ਬਾਅਦ ਉਹ ਕਿੰਨਾ ਕਮਾਏਗਾ?\n\n#init:\n- name = sample(names_male)\n- fish = sample([\"ਟੂਨਾ\",\"ਰੋਹੂ\", \"ਕਤਲਾ\", \"ਸਿੰਘਾੜਾ\", \"ਮੱਲੀ\"])\n- day = sample(weekdays)\n- unit = sample([\"ਕਿਲੋਗ੍ਰਾਮ\", \"ਪੌਂਡ\", \"ਕਿਲੋ\"])\n- cur = sample(currencies_sym)\n- $n = range(3, 8)\n- $w1 = range(40, 80)\n- $w2 = range(30, 60)\n- $w3 = range(20, 40)\n- $price = arange(0.25, 2.5, 0.25)\n\n#conditions:\n- n > 2\n- is_int((w1 + w2) * price + (n-2) * w3 * price)\n\n#answer: int((w1 + w2) * price + (n-2)*w3*price)"
answer_annotated = "{name} ਪਹਿਲੀ {fish} ਮੱਛੀ ਤੋਂ {w1}*{cur}{price} = {cur}<<{w1}*{price}={w1*price}>>{w1*price} ਕਮਾਏਗਾ।\nਉਹ ਦੂਜੀ {fish} ਮੱਛੀ ਤੋਂ {w2}*{cur}{price} = {cur}<<{w2}*{price}={w2*price}>>{w2*price} ਕਮਾਏਗਾ।\nਬਾਕੀ {fish} ਮੱਛੀਆਂ {n}-2 = <<{n}-2={n-2}>>{n-2} ਹਨ। ਉਹ ਹਰ ਇੱਕ ਤੋਂ {w3}*{cur}{price} = {cur}<<{w3}*{price}={w3*price}>>{w3*price} ਕਮਾਏਗਾ। ਇਸ ਲਈ ਉਹ {n-2} * {w3*price} = <<{n-2}*{w3*price}={((n-2)*w3*price)}>>{((n-2)*w3*price)} ਕਮਾਏਗਾ।\nਇਸ ਲਈ ਸਾਰੀਆਂ {fish} ਮੱਛੀਆਂ ਤੋਂ ਉਹ ਕੁੱਲ {cur}{w1*price} + {cur}{w2*price} + {cur}{((n-2)*w3*price)} = {cur}<<{w1*price}+{w2*price}+{((n-2)*w3*price)}={float((w1 + w2) * price + (n-2)*w3*price)}>>{float((w1 + w2 + (n-2)*w3) * price)} ਕਮਾਏਗਾ।\n#### {int((w1 + w2 + (n-2)*w3) * price)}"
