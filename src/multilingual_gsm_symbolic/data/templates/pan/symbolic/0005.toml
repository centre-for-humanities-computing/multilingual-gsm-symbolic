question = "ਕੈਟੀ ਕੌਫੀ ਬਣਾਉਂਦੀ ਹੈ, ਜਿਸ ਵਿੱਚ ਚੀਨੀ ਦੇ ਚਮਚੇ ਅਤੇ ਪਾਣੀ ਦੇ ਕੱਪਾਂ ਦਾ ਅਨੁਪਾਤ 7:13 ਹੈ। ਜੇਕਰ ਉਸਨੇ ਚੀਨੀ ਦੇ ਚਮਚੇ ਅਤੇ ਪਾਣੀ ਦੇ ਕੱਪਾਂ ਦੀ ਕੁੱਲ ਸੰਖਿਆ 120 ਵਰਤੀ, ਤਾਂ ਉਸਨੇ ਕਿੰਨੇ ਚਮਚੇ ਚੀਨੀ ਵਰਤੀ, ਇਸਦੀ ਗਣਨਾ ਕਰੋ।"
answer = "ਕੌਫੀ ਬਣਾਉਣ ਲਈ ਉਸ ਵੱਲੋਂ ਵਰਤੇ ਗਏ ਸਮੱਗਰੀ ਦਾ ਕੁੱਲ ਅਨੁਪਾਤ 7+13 = <<7+13=20>>20 ਹੈ\nਕਿਉਂਕਿ ਉਸ ਵੱਲੋਂ ਵਰਤੇ ਗਏ ਚਮਚਿਆਂ ਦੀ ਸੰਖਿਆ ਨੂੰ ਦਰਸਾਉਣ ਵਾਲਾ ਭਿੰਨ 7/20 ਹੈ, ਇਸ ਲਈ ਉਸਨੇ 7/20*120 = <<7/20*120=42>>42 ਵਰਤੇ\n#### 42\n"
