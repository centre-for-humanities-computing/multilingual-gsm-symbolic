question = "ਸਿਮਰਨ ਕੌਫੀ ਬਣਾਉਂਦੀ ਹੈ, ਜਿਸ ਵਿੱਚ ਖੰਡ ਦੇ ਚਮਚਿਆਂ ਅਤੇ ਪਾਣੀ ਦੇ ਕੱਪਾਂ ਦਾ ਅਨੁਪਾਤ 7:13 ਹੈ। ਜੇ ਉਸਨੇ ਕੁੱਲ ਮਿਲਾ ਕੇ 120 ਚਮਚੇ ਖੰਡ ਅਤੇ ਕੱਪ ਪਾਣੀ ਵਰਤੇ, ਤਾਂ ਹਿਸਾਬ ਲਗਾਓ ਕਿ ਉਸਨੇ ਖੰਡ ਦੇ ਕਿੰਨੇ ਚਮਚੇ ਵਰਤੇ।"
answer = "ਕੌਫੀ ਬਣਾਉਣ ਲਈ ਉਸ ਵੱਲੋਂ ਵਰਤੀ ਗਈ ਸਮੱਗਰੀ ਦਾ ਕੁੱਲ ਅਨੁਪਾਤ 7+13 = <<7+13=20>>20 ਹੈ\nਕਿਉਂਕਿ ਉਸ ਵੱਲੋਂ ਵਰਤੇ ਗਏ ਚਮਚਿਆਂ ਦੀ ਸੰਖਿਆ ਨੂੰ ਦਰਸਾਉਣ ਵਾਲਾ ਭਿੰਨ 7/20 ਹੈ, ਇਸ ਲਈ ਉਸਨੇ 7/20*120 = <<7/20*120=42>>42 ਵਰਤੇ\n#### 42"
