question = "ਇੱਕ ਲੋਫ਼ ਰੋਟੀ ਵਿੱਚ 24 ਟੁਕੜੇ ਹੁੰਦੇ ਹਨ। ਜੇ Abby ਇੱਕ ਦਿਨ ਵਿੱਚ 2 ਟੁਕੜੇ ਖਾ ਸਕਦੀ ਹੈ ਅਤੇ Josh ਇਸ ਤੋਂ ਦੁੱਗਣਾ ਖਾ ਸਕਦਾ ਹੈ, ਤਾਂ ਇਹ ਲੋਫ਼ ਰੋਟੀ ਕਿੰਨੇ ਦਿਨ ਚੱਲੇਗੀ?"
answer = "Josh ਇੱਕ ਦਿਨ ਵਿੱਚ 2*2=<<2*2=4>>4 ਟੁਕੜੇ ਖਾ ਸਕਦਾ ਹੈ।\nਮਿਲਾ ਕੇ, Abby ਅਤੇ Josh ਇੱਕ ਦਿਨ ਵਿੱਚ 2 + 4 = <<2+4=6>>6 ਟੁਕੜੇ ਖਾ ਸਕਦੇ ਹਨ।\nਇਸ ਲਈ, ਇੱਕ ਲੋਫ਼ ਰੋਟੀ 24/6 = <<24/6=4>>4 ਦਿਨ ਚੱਲੇਗੀ।\n#### 4"
