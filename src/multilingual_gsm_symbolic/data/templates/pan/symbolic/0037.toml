question = "ਇੱਕ ਡਬਲ ਰੋਟੀ ਵਿੱਚ 24 ਟੁਕੜੇ ਹੁੰਦੇ ਹਨ। ਜੇ ਸਿਮਰਨ ਇੱਕ ਦਿਨ ਵਿੱਚ 2 ਟੁਕੜੇ ਖਾ ਸਕਦੇ ਹਨ ਅਤੇ ਹਰਜੀਤ ਉਸ ਤੋਂ ਦੋ ਗੁਣਾ ਖਾ ਸਕਦੇ ਹਨ, ਤਾਂ ਇਹ ਡਬਲ ਰੋਟੀ ਕਿੰਨੇ ਦਿਨਾਂ ਲਈ ਕਾਫ਼ੀ ਹੈ?"
