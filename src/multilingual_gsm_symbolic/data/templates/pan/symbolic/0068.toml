question = "ਕਾਰਮਨ ਨੂੰ ਕ੍ਰਾਸਵਰਡ ਪਜ਼ਲ ਪੂਰਾ ਕਰਨ ਵਿੱਚ 10 ਮਿੰਟ ਲੱਗਦੇ ਹਨ ਅਤੇ ਸੁਡੋਕੂ ਪਜ਼ਲ ਪੂਰਾ ਕਰਨ ਵਿੱਚ 5 ਮਿੰਟ ਲੱਗਦੇ ਹਨ। ਹਫ਼ਤੇ ਅੰਤ ਦੌਰਾਨ ਉਸਨੇ 3 ਕ੍ਰਾਸਵਰਡ ਪਜ਼ਲ ਅਤੇ 8 ਸੁਡੋਕੂ ਪਜ਼ਲ ਹੱਲ ਕੀਤੇ। ਉਸਨੇ ਖੇਡਣ ਵਿੱਚ ਕੁੱਲ ਕਿੰਨਾ ਸਮਾਂ ਬਿਤਾਇਆ?"
answer = "ਕ੍ਰਾਸਵਰਡ ਪਜ਼ਲ ਪੂਰਾ ਕਰਨ ਵਿੱਚ 10 ਮਿੰਟ ਲੱਗਦੇ ਹਨ, ਅਤੇ ਉਸਨੇ 3 ਪਜ਼ਲ ਕੀਤੇ, ਇਸ ਲਈ ਕੁੱਲ 10 * 3 = <<10*3=30>>30 ਮਿੰਟ।\nਸੁਡੋਕੂ ਪਜ਼ਲ ਪੂਰਾ ਕਰਨ ਵਿੱਚ 5 ਮਿੰਟ ਲੱਗਦੇ ਹਨ, ਅਤੇ ਉਸਨੇ 8 ਪਜ਼ਲ ਕੀਤੇ, ਇਸ ਲਈ ਕੁੱਲ 5 * 8 = <<5*8=40>>40 ਮਿੰਟ।\nਉਸਨੇ ਕ੍ਰਾਸਵਰਡ ਅਤੇ ਸੁਡੋਕੂ ’ਤੇ 30 ਮਿੰਟ + 40 ਮਿੰਟ = <<30+40=70>>70 ਮਿੰਟ ਬਿਤਾਏ।\n#### 70"
