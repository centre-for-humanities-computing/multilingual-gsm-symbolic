question = "6 ਵਿਦਿਆਰਥੀ ਟੈਨਿਸ ਖੇਡ ਰਹੇ ਹਨ ਅਤੇ ਦੁੱਗਣਾ ਉਸ ਗਿਣਤੀ ਦੇ ਵੋਲੀਬਾਲ ਖੇਡ ਰਹੇ ਹਨ। 16 ਲੜਕੇ ਅਤੇ 22 ਲੜਕੀਆਂ ਸਾਕਰ ਖੇਡ ਰਹੇ ਹਨ। ਜੇਕਰ ਹਰੇਕ ਵਿਦਿਆਰਥੀ ਸਿਰਫ ਇੱਕ ਸਮੂਹ ਵਿੱਚ ਹਿੱਸਾ ਲੈਂਦਾ ਹੈ, ਤਾਂ ਕੁੱਲ ਵਿਦਿਆਰਥੀ ਕਿੰਨੇ ਹਨ?"
