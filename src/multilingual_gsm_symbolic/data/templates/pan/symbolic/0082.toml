question = "ਪਾਰਟੀ ਦੀ ਸ਼ੁਰੂਆਤ ਵਿੱਚ 25 ਮਰਦ ਅਤੇ 15 ਔਰਤਾਂ ਸਨ। ਇੱਕ ਘੰਟੇ ਬਾਅਦ, ਕੁੱਲ ਲੋਕਾਂ ਵਿੱਚੋਂ 1/4 ਪਾਰਟੀ ਛੱਡ ਗਏ। ਜੇ 22 ਮਰਦ ਪਾਰਟੀ ਵਿੱਚ ਰਹਿ ਗਏ, ਤਾਂ ਕਿੰਨੀਆਂ ਔਰਤਾਂ ਬਚੀਆਂ?"
answer = "ਪਾਰਟੀ ਵਿੱਚ ਕੁੱਲ 25 ਮਰਦ ਅਤੇ 15 ਔਰਤਾਂ = <<25+15=40>>40 ਲੋਕ ਸਨ।\nਇੱਕ ਘੰਟੇ ਬਾਅਦ, 40 ਲੋਕਾਂ ਦਾ 1/4 = <<40*1/4=10>>10 ਲੋਕ ਪਾਰਟੀ ਛੱਡ ਗਏ।\nਇਸਦਾ ਮਤਲਬ 40 ਲੋਕਾਂ ਵਿੱਚੋਂ 10 ਲੋਕ = <<40-10=30>>30 ਲੋਕ ਰਹਿ ਗਏ।\nਬਚੇ ਹੋਏ 30 ਲੋਕਾਂ ਵਿੱਚੋਂ 30 ਲੋਕ - 22 ਮਰਦ = <<30-22=8>>8 ਔਰਤਾਂ ਸਨ।\n#### 8"
