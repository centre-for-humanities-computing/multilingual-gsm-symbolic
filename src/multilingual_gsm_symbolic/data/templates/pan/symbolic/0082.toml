question_annotated = "{event,partee} di shuruat vich, {m,25} {group1,mard} te {w,15} {group2,aurat} san. {t,ek ghante} baad, kul lokan vichon {frac,1/4} chhadd gae. Je {m_left,22} {group1,mard} {event,partee} te rahi, taan kitne {group2,aurat} bachde?\n\n#ਸ਼ੁਰੂਆਤ:\n- event = sample(['partee', 'bithak', 'samelan', 'jamaat', 'mela'])\n- group1, group2 = sample([ \"shikshak\", \"doctor\", \"mohandis\", \"nars\", \"kalakar\", \"vakil\",], 2)\n- t = sample(['ek ghante', 'do ghante', 'aadha ghanta', '45 minute'])\n- $frac = sample(fractions)\n- $m = range(20, 75)\n- $w = range(10, 80)\n- $m_left = range(15, 35)\n\n#ਸ਼ਰਤਾਂ:\n- m_left < m\n- is_int((m + w) * frac)\n- (m + w) * (1-frac) > m_left\n- m + w - (m + w) * frac > m_left\n\n#ਜਵਾਬ: m + w - int((m + w) * frac) - m_left\n"
answer_annotated = "{event} vich kul {m} {group1} te {w} {group2} = <<{m}+{w}={m+w}>>{m+w} lok aaye.\n{t} baad, {m+w} lokan * {frac} = <<{m+w}*{frac}={int((m+w)*frac)}>>{int((m+w)*frac)} lok {event} chhadd gae.\nIs da matlab {m+w} lokan - {int((m+w)*frac)} lok = <<{m+w}-{int((m+w)*frac)}={m+w-int((m+w)*frac)}>>{m+w-int((m+w)*frac)} lok rahi.\nJinhan {m+w-int((m+w)*frac)} lokan rahi, {m+w-int((m+w)*frac)} lok - {m_left} {group1} = <<{m+w-int((m+w)*frac)}-{m_left}={m+w-int((m+w)*frac)-m_left}>>{m+w-int((m+w)*frac)-m_left} {group2} san.\n#### {m+w-int((m+w)*frac)-m_left}\n"
