question = "ਇੱਕ ਲੜਕਾ ਕੋਲ 5 ਪੱਤਾ ਹਨ। ਉਸਦਾ ਭਰਾ ਉਸ ਨਾਲੋਂ 3 ਘੱਟ ਪੱਤਾ ਰੱਖਦਾ ਹੈ। ਦੋਵਾਂ ਕੋਲ ਮਿਲਾ ਕੇ ਕਿੰਨੇ ਪੱਤਾ ਹਨ?"
