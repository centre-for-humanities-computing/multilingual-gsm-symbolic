question = "ਇੱਕ ਲੜਕੇ ਕੋਲ 5 ਕਾਰਡ ਹਨ। ਉਸਦੇ ਭਰਾ ਕੋਲ ਉਸ ਨਾਲੋਂ 3 ਕਾਰਡ ਘੱਟ ਹਨ। ਦੋਵਾਂ ਕੋਲ ਮਿਲਾ ਕੇ ਕਿੰਨੇ ਕਾਰਡ ਹਨ?"
answer = "ਉਸਦੇ ਭਰਾ ਕੋਲ 5 - 3 = <<5-3=2>>2 ਕਾਰਡ ਹਨ।\nਮਿਲਾ ਕੇ, ਦੋਵਾਂ ਕੋਲ 5 + 2 = <<5+2=7>>7 ਕਾਰਡ ਹਨ।\n#### 7"
