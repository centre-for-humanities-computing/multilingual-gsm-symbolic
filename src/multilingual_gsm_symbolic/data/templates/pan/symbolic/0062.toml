question = "ਇੱਕ ਸੈੱਟ ਵਿੱਚ 15 ਲਾਲ ਪੱਤੇ ਹਨ, 60% ਹਰੇ ਪੱਤੇ ਹਨ, ਅਤੇ ਪੀਲੇ ਪੱਤਿਆਂ ਦੀ ਗਿਣਤੀ ਲਾਲ ਅਤੇ ਹਰੇ ਪੱਤਿਆਂ ਦੇ ਜੋੜ ਦੇ ਬਰਾਬਰ ਹੈ। ਕੁੱਲ ਕਿੰਨੇ ਪੱਤੇ ਹਨ?"
answer = "ਪਹਿਲਾਂ ਹਰੇ ਪੱਤੇ 60/100 * 15 = <<60/100*15=9>>9 ਹਨ।\nਫਿਰ ਲਾਲ ਅਤੇ ਹਰੇ ਪੱਤਿਆਂ ਦਾ ਜੋੜ 15 + 9 = <<15+9=24>>24 ਹੈ।\nਪੀਲੇ ਪੱਤੇ ਵੀ ਇਸੇ ਦੇ ਬਰਾਬਰ ਹਨ, ਇਸ ਲਈ ਕੁੱਲ 24 + 24 = <<24+24=48>>48 ਹਨ।\n#### 48\n"
