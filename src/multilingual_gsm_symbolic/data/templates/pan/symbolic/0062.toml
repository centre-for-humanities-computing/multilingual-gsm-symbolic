question = "ਜਾਦੂਗਰ ਦੇ ਪੱਤਿਆਂ ਦੇ ਇੱਕ ਸੈੱਟ ਵਿੱਚ 15 ਲਾਲ ਪੱਤੇ ਹਨ, ਅਤੇ 60% ਵੱਧ ਹਰਾ ਪੱਤੇ ਹਨ। ਪੀਲਾ ਪੱਤਿਆਂ ਦੀ ਗਿਣਤੀ ਲਾਲ ਅਤੇ ਹਰਾ ਪੱਤਿਆਂ ਦੇ ਜੋੜ ਦੇ ਬਰਾਬਰ ਹੈ। ਦੱਸੇ ਗਏ ਸਾਰੇ ਰੰਗਾਂ ਦੇ ਕੁੱਲ ਕਿੰਨੇ ਪੱਤੇ ਹਨ?"
answer = "ਲਾਲ ਪੱਤਿਆਂ ਨਾਲੋਂ 60/100 * 15 = <<60/100*15=9>>9 ਹਰਾ ਪੱਤੇ ਵੱਧ ਹਨ।\nਇਸਦਾ ਮਤਲਬ ਹਰਾ ਪੱਤੇ 15 + 9 = <<15+9=24>>24 ਹਨ।\nਪੀਲਾ ਪੱਤੇ 15 + 24 = <<15+24=39>>39 ਬਣਦੇ ਹਨ।\nਇਸ ਲਈ ਕੁੱਲ ਮਿਲਾ ਕੇ ਵੱਖ-ਵੱਖ ਰੰਗਾਂ ਦੇ 39 + 39 = <<39+39=78>>78 ਪੱਤੇ ਹਨ।\n#### 78\n"
