question_annotated = "{item,ਜਾਦੂਗਰ} ਦੇ ਪੱਤਿਆਂ ਦੇ ਇੱਕ ਸੈੱਟ ਵਿੱਚ {n1,15} {c1,ਲਾਲ} ਪੱਤੇ ਹਨ, ਅਤੇ ਉਨ੍ਹਾਂ ਨਾਲੋਂ {p,60}% ਵੱਧ {c2,ਹਰੇ} ਪੱਤੇ ਹਨ। {c3,ਪੀਲੇ} ਪੱਤਿਆਂ ਦੀ ਗਿਣਤੀ {c1,ਲਾਲ} ਅਤੇ {c2,ਹਰੇ} ਪੱਤਿਆਂ ਦੇ ਜੋੜ ਦੇ ਬਰਾਬਰ ਹੈ। ਦੱਸੇ ਗਏ ਸਾਰੇ ਰੰਗਾਂ ਦੇ ਕੁੱਲ ਕਿੰਨੇ ਪੱਤੇ ਹਨ?\n\n#init:\n- item = sample([\"ਜਾਦੂਗਰ\", \"ਕਲਾਕਾਰ\", \"ਸ਼ੈਫ਼\", \"ਵਿਗਿਆਨੀ\", \"ਖਿਡਾਰੀ\"])\n- c1, c2, c3 = sample([\"ਲਾਲ\", \"ਨੀਲੇ\", \"ਹਰੇ\", \"ਪੀਲੇ\", \"ਬੈਂਗਣੀ\", \"ਸੰਤਰੀ\"], 3)\n- $n1 = range(15, 81)\n- $p = range(20, 90)\n\n#conditions:\n- p < 100\n- is_int(p/100 * n1)\n\n#answer: 2 * (2*n1 + (p/100 * n1))"
answer_annotated = "{c1} ਪੱਤਿਆਂ ਨਾਲੋਂ {p}/100 * {n1} = <<{p}/100*{n1}={int(p/100*n1)}>>{int(p/100*n1)} {c2} ਪੱਤੇ ਵੱਧ ਹਨ।\nਇਸਦਾ ਮਤਲਬ {c2} ਪੱਤੇ {n1} + {int(p/100*n1)} = <<{n1}+{int(p/100*n1)}={n1+int(p/100*n1)}>>{n1+int(p/100*n1)} ਹਨ।\n{c3} ਪੱਤੇ {n1} + {n1+int(p/100*n1)} = <<{n1}+{n1+int(p/100*n1)}={n1+(n1+int(p/100*n1))}>>{n1+(n1+int(p/100*n1))} ਬਣਦੇ ਹਨ।\nਇਸ ਲਈ ਕੁੱਲ ਮਿਲਾ ਕੇ ਵੱਖ-ਵੱਖ ਰੰਗਾਂ ਦੇ {n1+(n1+int(p/100*n1))} + {n1+(n1+int(p/100*n1))} = <<{n1+(n1+int(p/100*n1))}+{n1+(n1+int(p/100*n1))}={2*(n1+(n1+int(p/100*n1)))}>>{ 2*(n1+(n1+int(p/100*n1)))} ਪੱਤੇ ਹਨ।\n#### {2*(n1+(n1+int(p/100*n1)))}"
