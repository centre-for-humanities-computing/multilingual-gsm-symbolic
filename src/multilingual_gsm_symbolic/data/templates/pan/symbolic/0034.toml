question = "ਸ਼੍ਰੀ ਗਿੱਲ ਨੇ ਆਪਣਾ ਘਰ $400,000 ਵਿੱਚ ਵੇਚਿਆ। ਉਸ ਨੇ ਵਿਕਰੀ ਮੁੱਲ ਦਾ 3% ਟ੍ਰਾਂਸਫਰ ਫੀਸ ਵਜੋਂ ਭਰਿਆ ਅਤੇ ਵਿਕਰੀ ਮੁੱਲ ਦਾ 5% ਦਲਾਲੀ ਫੀਸ ਵਜੋਂ ਵੀ ਭਰਿਆ। ਜੇ ਉਸ ਨੇ ਘਰ ਦੇ ਬਾਕੀ ਕਰਜ਼ੇ ਲਈ $250,000 ਵੀ ਭਰੇ, ਤਾਂ ਘਰ ਵੇਚਣ ਤੋਂ ਸ਼੍ਰੀ ਗਿੱਲ ਕੋਲ ਸ਼ੁੱਧ ਕਿੰਨੀ ਰਕਮ ਬਚੀ?"
answer = "ਸ਼੍ਰੀ ਗਿੱਲ ਨੇ ਟ੍ਰਾਂਸਫਰ ਫੀਸ ਲਈ $400,000 * 3/100 = <<400000*3/100=12000>>$12,000 ਭਰੇ।\nਉਸਨੇ ਦਲਾਲੀ ਫੀਸ ਲਈ $400,000 * 5/100 = <<400000*5/100=20000>>$20,000 ਭਰੇ।\nਇਸ ਲਈ, ਸ਼੍ਰੀ ਗਿੱਲ ਨੇ ਟ੍ਰਾਂਸਫਰ ਫੀਸ, ਦਲਾਲੀ ਫੀਸ ਅਤੇ ਕਰਜ਼ੇ ਲਈ ਕੁੱਲ $12,000 + $20,000 + $250,000 = <<12000+20000+250000=282000>>$282,000 ਭਰੇ।\nਅੰਤ ਵਿੱਚ, ਸ਼੍ਰੀ ਗਿੱਲ ਕੋਲ $400,000 - $282,000 = <<400000-282000=118000>>$118,000 ਬਚਦੇ ਹਨ।\n#### 118000"
