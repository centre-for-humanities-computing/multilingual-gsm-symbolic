question = "ਸ਼੍ਰੀ Tan ਨੇ ਆਪਣਾ ਘਰ $400,000 ਵਿੱਚ ਵੇਚਿਆ। ਉਸਦੇ ਉੱਤੇ ਵਿਕਰੀ ਫੀਸ 3% ਹੈ ਅਤੇ ਇੱਕ ਦਲਾਲੀ ਫੀਸ ਵੀ 5% ਹੈ। ਜੇਕਰ ਉਹ ਆਪਣੇ ਘਰ ਦੇ ਬਾਕੀ ਉਧਾਰ ਲਈ $250,000 ਵੀ ਭਰਦਾ ਹੈ, ਤਾਂ ਵਿਕਰੀ ਤੋਂ ਉਸਦੇ ਕੋਲ ਕਿੰਨੀ ਸ਼ੁੱਧ ਰਕਮ ਬਚਦੀ ਹੈ?"
answer = "ਸ਼੍ਰੀ Tan ਨੇ ਵਿਕਰੀ ਫੀਸ ਲਈ $400,000 * 3/100 = <<400000*3/100=12000>>$12,000 ਭਰੇ।\nਉਸਨੇ ਦਲਾਲੀ ਫੀਸ ਲਈ $400,000 * 5/100 = <<400000*5/100=20000>>$20,000 ਭਰੇ।\nਇਸ ਲਈ, ਵਿਕਰੀ, ਦਲਾਲੀ, ਅਤੇ ਉਧਾਰ ਸਮੇਤ ਕੁੱਲ ਰਕਮ $12,000 + $20,000 + $250,000 = <<12000+20000+250000=282000>>$282,000 ਬਣਦੀ ਹੈ।\nਅੰਤ ਵਿੱਚ, ਸ਼੍ਰੀ Tan ਦੇ ਕੋਲ $400,000 - $282,000 = <<400000-282000=118000>>$118,000 ਬਚਦੇ ਹਨ।\n#### 118000\n"
