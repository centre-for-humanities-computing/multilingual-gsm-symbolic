question_annotated = "{title,ਸ਼੍ਰੀ} {name,Tan} ਨੇ ਆਪਣਾ {property,ਘਰ} ${price,400000} ਵਿੱਚ ਵੇਚਿਆ। ਉਸਦੇ ਉੱਤੇ {fee1_name,ਵਿਕਰੀ} ਫੀਸ {fee1_percent,3}% ਹੈ ਅਤੇ ਇੱਕ {fee2_name,ਦਲਾਲੀ} ਫੀਸ ਵੀ {fee2_percent,5}% ਹੈ। ਜੇਕਰ ਉਹ ਆਪਣੇ {property,ਘਰ} ਦੇ ਬਾਕੀ ਉਧਾਰ ਲਈ ${loan,250000} ਵੀ ਭਰਦਾ ਹੈ, ਤਾਂ ਵਿਕਰੀ ਤੋਂ ਉਸਦੇ ਕੋਲ ਕਿੰਨੀ ਸ਼ੁੱਧ ਰਕਮ ਬਚਦੀ ਹੈ?\n\n#init:\n- title = sample(['ਸ਼੍ਰੀ', 'ਪ੍ਰੋ.', 'ਡਾ.'])\n- name = sample(['Smith', 'Johnson', 'Williams', 'Brown', 'Jones', 'Garcia', 'Miller', 'Davis', 'Rodriguez', 'Martinez'])\n- property = sample(['ਘਰ', 'ਫਲੈਟ', 'ਕਾਂਡੋ', 'ਵਿਲਾ', 'ਕਾਟੇਜ'])\n- fee1_name = sample(['ਵਿਕਰੀ', 'ਰਜਿਸਟ੍ਰੇਸ਼ਨ', 'ਕਾਨੂੰਨੀ'])\n- fee2_name = sample(['ਦਲਾਲੀ', 'ਏਜੰਟ', 'ਰੀਅਲਟਰ'])\n- $price = range(200000, 1000000, 10000)\n- $fee1_percent = range(1, 5)\n- $fee2_percent = range(2, 7)\n- $loan = range(100000, 700000, 10000)\n\n#conditions:\n- price > loan\n- price - (price * (fee1_percent + fee2_percent) / 100 + loan) > 1\n\n#answer: price - (price * (fee1_percent + fee2_percent) / 100 + loan)\n"
answer_annotated = "{title} {name} ਨੇ {fee1_name} ਫੀਸ ਲਈ ${price} * {fee1_percent}/100 = <<{price}*{fee1_percent}/100={price * fee1_percent // 100}>>${price * fee1_percent // 100} ਭਰੇ।\nਉਸਨੇ {fee2_name} ਫੀਸ ਲਈ ${price} * {fee2_percent}/100 = <<{price}*{fee2_percent}/100={price * fee2_percent // 100}>>${price * fee2_percent // 100} ਭਰੇ।\nਇਸ ਲਈ, {fee1_name}, {fee2_name}, ਅਤੇ ਉਧਾਰ ਸਮੇਤ ਕੁੱਲ ਰਕਮ ${price * fee1_percent // 100} + ${price * fee2_percent // 100} + ${loan} = <<{price * fee1_percent // 100}+{price * fee2_percent // 100}+{loan}={price * (fee1_percent + fee2_percent) // 100 + loan}>>${price * (fee1_percent + fee2_percent) // 100 + loan} ਬਣਦੀ ਹੈ।\nਅੰਤ ਵਿੱਚ, {title} {name} ਦੇ ਕੋਲ ${price} - ${price * (fee1_percent + fee2_percent) // 100 + loan} = <<{price}-{price * (fee1_percent + fee2_percent) // 100 + loan}={price - (price * (fee1_percent + fee2_percent) // 100 + loan)}>>${price - (price * (fee1_percent + fee2_percent) // 100 + loan)} ਬਚਦੇ ਹਨ।\n#### {price - (price * (fee1_percent + fee2_percent) // 100 + loan)}\n"
