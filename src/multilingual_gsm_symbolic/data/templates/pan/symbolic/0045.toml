question = "ਪੈਟ ਦਾ ਇੱਕ ਫੁੱਲਾਂ ਦਾ ਬਿਸਤਰਾ ਹੈ ਜੋ 111 ਫੁੱਟ ਲੰਬਾ ਹੈ। ਪੈਟ ਆਪਣੇ ਫੁੱਲਾਂ ਦੇ ਬਿਸਤਰੇ ਨੂੰ ਪੌਦਿਆਂ ਨਾਲ ਭਰਨਾ ਚਾਹੁੰਦੀ ਹੈ। ਪੈਟ ਦੇ ਫੁੱਲ 12 ਇੰਚ ਚੌੜੇ ਹੁੰਦੇ ਹਨ, ਅਤੇ ਬਾਗ਼ਬਾਨੀ ਗਾਈਡਲਾਈਨਾਂ ਕਹਿੰਦੀਆਂ ਹਨ ਕਿ ਬਿਸਤਰੇ ਦੇ ਨਾਲ ਹਰ 1.5 ਫੁੱਟ ਵਿੱਚ ਇੱਕ ਫੁੱਲ ਲਗਾਇਆ ਜਾਵੇ। ਪੈਟ ਪਹਿਲਾਂ ਹੀ 17 ਫੁੱਲ ਆਪਣੇ ਕੋਲ ਰੱਖੇ ਹੋਏ ਹਨ। ਹਰੇਕ ਫੁੱਲ ਵਾਲਾ ਪੌਦਾ ਦੁਕਾਨ 'ਤੇ ਰੁ6 ਦਾ ਹੈ। ਅਪਣਾ ਫੁੱਲਾਂ ਦਾ ਬਿਸਤਰਾ ਭਰਨ ਲਈ ਪੈਟ ਦੁਕਾਨ 'ਤੇ ਕਿੰਨਾ ਪੈਸਾ ਖਰਚ ਕਰੇਗੀ?"
answer = "ਪੈਟ ਦਾ ਫੁੱਲਾਂ ਦਾ ਬਿਸਤਰਾ 111 ਫੁੱਟ / 1.5 ਫੁੱਟ ਪ੍ਰਤੀ ਪੌਦਾ = <<111/1.5=74>>74 ਪੌਦੇ ਚਾਹੀਦੇ ਹਨ।\nਪੈਟ ਨੂੰ 74 ਪੌਦੇ - 17 ਪੌਦੇ ਖਰੀਦਣੇ ਪੈਣਗੇ = <<74-17=57>>57 ਪੌਦੇ ਖਰੀਦਣ ਲਈ ਚਾਹੀਦੇ ਹਨ।\nਪੈਟ 57 ਪੌਦੇ * ਰੁ6 ਖਰਚ ਕਰੇਗੀ = ਰੁ<<57*6=342>>342।\n#### 342\n"
