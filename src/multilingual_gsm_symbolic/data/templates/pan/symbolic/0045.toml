question = "ਸਿਮਰਨ ਦੀ ਇੱਕ ਫੁੱਲਾਂ ਦੀ ਕਿਆਰੀ ਹੈ ਜੋ 111 ਫੁੱਟ ਲੰਬੀ ਹੈ। ਸਿਮਰਨ ਆਪਣੀ ਫੁੱਲਾਂ ਦੀ ਕਿਆਰੀ ਨੂੰ ਪੌਦਿਆਂ ਨਾਲ ਭਰਨਾ ਚਾਹੁੰਦੀ ਹੈ। ਸਿਮਰਨ ਦੇ ਫੁੱਲ 12 ਇੰਚ ਚੌੜੇ ਹੁੰਦੇ ਹਨ, ਅਤੇ ਬਾਗ਼ਬਾਨੀ ਦੇ ਨਿਯਮ ਕਹਿੰਦੇ ਹਨ ਕਿ ਕਿਆਰੀ ਦੇ ਨਾਲ-ਨਾਲ ਹਰ 1.5 ਫੁੱਟ 'ਤੇ ਇੱਕ ਫੁੱਲ ਲਗਾਇਆ ਜਾਵੇ। ਸਿਮਰਨ ਕੋਲ ਪਹਿਲਾਂ ਹੀ 17 ਫੁੱਲ ਹਨ। ਹਰੇਕ ਫੁੱਲ ਵਾਲਾ ਪੌਦਾ ਦੁਕਾਨ 'ਤੇ ₹6 ਦਾ ਹੈ। ਆਪਣੀ ਫੁੱਲਾਂ ਦੀ ਕਿਆਰੀ ਭਰਨ ਲਈ ਸਿਮਰਨ ਦੁਕਾਨ 'ਤੇ ਕਿੰਨੇ ਪੈਸੇ ਖਰਚ ਕਰੇਗੀ?"
answer = "ਸਿਮਰਨ ਦੀ ਫੁੱਲਾਂ ਦੀ ਕਿਆਰੀ ਲਈ 111 ਫੁੱਟ / 1.5 ਫੁੱਟ ਪ੍ਰਤੀ ਪੌਦਾ = <<111/1.5=74>>74 ਪੌਦੇ ਚਾਹੀਦੇ ਹਨ।\nਸਿਮਰਨ ਨੂੰ 74 ਪੌਦੇ - 17 ਪੌਦੇ = <<74-17=57>>57 ਪੌਦੇ ਖਰੀਦਣੇ ਪੈਣਗੇ।\nਸਿਮਰਨ 57 ਪੌਦੇ * ₹6 = ₹<<57*6=342>>342 ਖਰਚ ਕਰੇਗੀ।\n#### 342"
