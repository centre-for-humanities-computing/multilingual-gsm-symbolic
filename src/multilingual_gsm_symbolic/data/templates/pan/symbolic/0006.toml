question = "ਹਰਜੀਤ ਕੋਲ 10 ਹੈਕਟੇਅਰ ਦਾ ਅੰਬ ਦਾ ਬਾਗ਼ ਹੈ। ਹਰ ਹੈਕਟੇਅਰ ਵਿੱਚ ਅੰਬ ਦੇ 100 ਫਲ ਹੁੰਦੇ ਹਨ। ਹਰਜੀਤ ਹਰ 3 ਮਹੀਨੇ ਬਾਅਦ ਆਪਣੇ ਅੰਬ ਦੇ ਫਲ ਤੋੜ ਸਕਦਾ ਹੈ। ਇੱਕ ਸਾਲ ਵਿੱਚ ਹਰਜੀਤ ਅੰਬ ਦੇ ਕਿੰਨੇ ਫਲ ਤੋੜ ਸਕਦਾ ਹੈ?"
