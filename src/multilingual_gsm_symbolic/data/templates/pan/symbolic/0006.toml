question = "ਜੌਨ ਕੋਲ 10 ਹੈਕਟੇਅਰ ਦਾ ਅਨਾਨਾਸ ਖੇਤ ਹੈ। ਹਰ ਹੈਕਟੇਅਰ ਵਿੱਚ 100 ਅਨਾਨਾਸ ਹੁੰਦੇ ਹਨ। ਜੌਨ ਹਰ 3 ਮਹੀਨੇ ਬਾਅਦ ਆਪਣੇ ਅਨਾਨਾਸ ਕੱਟ ਸਕਦਾ ਹੈ। ਇੱਕ ਸਾਲ ਵਿੱਚ ਜੌਨ ਕਿੰਨੇ ਅਨਾਨਾਸ ਕੱਟ ਸਕਦਾ ਹੈ?"
answer = "ਜੌਨ ਕੋਲ ਆਪਣੇ ਖੇਤ ਵਿੱਚ 100*10= <<100*10=1000>>1000 ਅਨਾਨਾਸ ਹਨ।\nਜੌਨ ਹਰ ਸਾਲ 12 / 3 = <<12/3=4>>4 ਵਾਰ ਆਪਣੇ ਅਨਾਨਾਸ ਕੱਟ ਸਕਦਾ ਹੈ\nਇਸ ਲਈ ਜੌਨ ਹਰ ਸਾਲ 1000*4 = <<1000*4=4000>>4000 ਅਨਾਨਾਸ ਕੱਟ ਸਕਦਾ ਹੈ।\n#### 4000\n"
