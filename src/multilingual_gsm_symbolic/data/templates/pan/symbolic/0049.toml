question = "ਹਰਜੀਤ 3 ਵੱਖ-ਵੱਖ ਅਪਾਰਟਮੈਂਟ ਕੰਪਲੈਕਸਾਂ ਤੋਂ ਕੂੜਾ ਇਕੱਠਾ ਕਰਦਾ ਹੈ। ਪਹਿਲੇ ਦੋ ਵਿੱਚੋਂ ਹਰੇਕ ਵਿੱਚ 200 ਅਪਾਰਟਮੈਂਟ ਹਨ ਅਤੇ ਆਖਰੀ ਵਾਲਾ ਬਾਕੀ ਦੋ ਦੇ ਕੁੱਲ ਨਾਲੋਂ 60% ਵੱਡਾ ਹੈ। ਉਹ ਹਰ ਥਾਂ ਤੋਂ ਹਫ਼ਤੇ ਵਿੱਚ 3 ਵਾਰ ਕੂੜਾ ਇਕੱਠਾ ਕਰਦਾ ਹੈ ਅਤੇ ਉਸਨੂੰ ਹਰ ਅਪਾਰਟਮੈਂਟ ਤੋਂ ਹਰ ਵਾਰ ਕੂੜਾ ਚੁੱਕਣ ਦੇ ₹0.4 ਮਿਲਦੇ ਹਨ। ਉਹ ਇੱਕ ਹਫ਼ਤੇ ਵਿੱਚ ਕਿੰਨਾ ਪੈਸਾ ਕਮਾਉਂਦਾ ਹੈ?"
answer = "ਪਹਿਲੇ ਦੋ ਕੰਪਲੈਕਸਾਂ ਵਿੱਚ 2*200=<<2*200=400>>400 ਅਪਾਰਟਮੈਂਟ ਹਨ\n3 ਨੰਬਰ ਵਾਲੇ ਵਿੱਚ ਉਨ੍ਹਾਂ ਦੋ ਦੇ ਕੁੱਲ ਨਾਲੋਂ 400*0.6=<<400*0.6=240>>240 ਅਪਾਰਟਮੈਂਟ ਵੱਧ ਹਨ।\nਇਸ ਲਈ ਕੁੱਲ ਮਿਲਾ ਕੇ, ਇਸ ਵਿੱਚ 400+240=<<400+240=640>>640 ਅਪਾਰਟਮੈਂਟ ਹਨ।\nਇਸ ਲਈ ਕੁੱਲ ਮਿਲਾ ਕੇ, ਉਹ ਹਰ ਵਾਰ 640+400=<<640+400=1040>>1040 ਅਪਾਰਟਮੈਂਟਾਂ ਤੱਕ ਜਾਂਦਾ ਹੈ\nਇਸਦਾ ਮਤਲਬ ਹੈ ਉਹ ਹਰ ਹਫ਼ਤੇ 1040*3=<<1040*3=3120>>3120 ਅਪਾਰਟਮੈਂਟਾਂ ਦਾ ਦੌਰਾ ਕਰਦਾ ਹੈ\nਇਸ ਲਈ ਉਹ ਹਰ ਹਫ਼ਤੇ 3120*₹0.4=₹<<3120*0.4=1248>>1248 ਕਮਾਉਂਦਾ ਹੈ\n#### 1248"
