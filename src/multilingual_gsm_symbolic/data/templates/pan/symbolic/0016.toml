question = "ਜਸਪ੍ਰੀਤ ਚੰਦਾ ਇਕੱਠਾ ਕਰਨ ਲਈ ਪਿੰਨੀਆਂ ਅਤੇ ਸੇਬ ਦੀ ਪਾਈ ਵੇਚ ਰਿਹਾ ਹੈ। ਸ਼ਨੀਵਾਰ ਨੂੰ ਉਸ ਨੇ ਪਿੰਨੀਆਂ ਦੇ 10 ਬਕਸੇ ਵੇਚੇ ਅਤੇ ਸੇਬ ਦੀ ਪਾਈ ਦੇ ਐਤਵਾਰ ਨਾਲੋਂ 4 ਬਕਸੇ ਘੱਟ ਵੇਚੇ। ਐਤਵਾਰ ਨੂੰ ਉਸ ਨੇ ਸ਼ਨੀਵਾਰ ਨਾਲੋਂ ਪਿੰਨੀਆਂ ਦੇ 5 ਬਕਸੇ ਵੱਧ ਅਤੇ ਸੇਬ ਦੀ ਪਾਈ ਦੇ 15 ਬਕਸੇ ਵੇਚੇ। ਜੇਕਰ ਪਿੰਨੀਆਂ ਦੇ ਇੱਕ ਬਕਸੇ ਦੀ ਕੀਮਤ $6 ਹੈ ਅਤੇ ਸੇਬ ਦੀ ਪਾਈ ਦੇ ਇੱਕ ਬਕਸੇ ਦੀ ਕੀਮਤ $15 ਹੈ, ਤਾਂ ਜਸਪ੍ਰੀਤ ਨੇ ਦੋ ਦਿਨਾਂ ਵਿੱਚ ਕੁੱਲ ਕਿੰਨਾ ਕਮਾਇਆ?"
answer = "ਉਸ ਨੇ ਐਤਵਾਰ ਨੂੰ ਪਿੰਨੀਆਂ ਦੇ 10 + 5 = <<10+5=15>>15 ਬਕਸੇ ਵੇਚੇ।\nਜਸਪ੍ਰੀਤ ਵੱਲੋਂ ਵੇਚੇ ਗਏ ਪਿੰਨੀਆਂ ਦੇ ਬਕਸਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 10 + 15 = <<10+15=25>>25 ਹੈ।\nਜਸਪ੍ਰੀਤ ਨੇ ਪਿੰਨੀਆਂ ਵੇਚ ਕੇ 25*$6 = $<<25*6=150>>150 ਕਮਾਏ।\nਉਸ ਨੇ ਸ਼ਨੀਵਾਰ ਨੂੰ ਸੇਬ ਦੀ ਪਾਈ ਦੇ 15 - 4 = <<15-4=11>>11 ਬਕਸੇ ਵੇਚੇ।\nਜਸਪ੍ਰੀਤ ਵੱਲੋਂ ਵੇਚੇ ਗਏ ਸੇਬ ਦੀ ਪਾਈ ਦੇ ਬਕਸਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 15 + 11 = <<15+11=26>>26 ਹੈ।\nਉਸ ਨੇ ਸੇਬ ਦੀ ਪਾਈ ਵੇਚ ਕੇ 26*$15 = $<<26*15=390>>390 ਕਮਾਏ।\nਇਸ ਲਈ, ਜਸਪ੍ਰੀਤ ਨੇ ਦੋ ਦਿਨਾਂ ਵਿੱਚ $150 + $390 = $<<150+390=540>>540 ਕਮਾਏ।\n#### 540"
