question_annotated = "{name, ਜਸਪ੍ਰੀਤ} ਚੰਦਾ ਇਕੱਠਾ ਕਰਨ ਲਈ {food, ਪਿੰਨੀਆਂ} ਅਤੇ {fruit, ਸੇਬ} ਦੀ ਪਾਈ ਵੇਚ ਰਿਹਾ ਹੈ। {d1, ਸ਼ਨੀਵਾਰ} ਨੂੰ ਉਸ ਨੇ {food, ਪਿੰਨੀਆਂ} ਦੇ {n1, 10} ਬਕਸੇ ਵੇਚੇ ਅਤੇ {fruit, ਸੇਬ} ਦੀ ਪਾਈ ਦੇ {d2, ਐਤਵਾਰ} ਨਾਲੋਂ {m1, 4} ਬਕਸੇ ਘੱਟ ਵੇਚੇ। {d2, ਐਤਵਾਰ} ਨੂੰ ਉਸ ਨੇ {d1, ਸ਼ਨੀਵਾਰ} ਨਾਲੋਂ {food, ਪਿੰਨੀਆਂ} ਦੇ {n2, 5} ਬਕਸੇ ਵੱਧ ਅਤੇ {fruit, ਸੇਬ} ਦੀ ਪਾਈ ਦੇ {m2, 15} ਬਕਸੇ ਵੇਚੇ। ਜੇਕਰ {food, ਪਿੰਨੀਆਂ} ਦੇ ਇੱਕ ਬਕਸੇ ਦੀ ਕੀਮਤ {cur,$}{cn, 6} ਹੈ ਅਤੇ {fruit, ਸੇਬ} ਦੀ ਪਾਈ ਦੇ ਇੱਕ ਬਕਸੇ ਦੀ ਕੀਮਤ {cur,$}{cm, 15} ਹੈ, ਤਾਂ {name, ਜਸਪ੍ਰੀਤ} ਨੇ ਦੋ ਦਿਨਾਂ ਵਿੱਚ ਕੁੱਲ ਕਿੰਨਾ ਕਮਾਇਆ?\n\n#init:\n- name = sample(names_male)\n- fruit = sample(fruits)\n- cur = sample(currencies_sym)\n- food = sample([\"ਪਿੰਨੀਆਂ\", \"ਬਿਸਕੁਟ\", \"ਲੱਡੂ\", \"ਮਠਰੀਆਂ\", \"ਕੇਕ\"])\n- d1, d2 = sample_sequential(weekdays, 2)\n- $n1 = range(21, 30)\n- $n2 = range(11, 15)\n- $m1 = range(4, 20)\n- $m2 = range(15, 30)\n- $cn = range(7, 13)\n- $cm = range(20, 33)\n\n#conditions:\n- m1 < m2\n\n#answer: (2*n1+n2)*cn + (2*m2-m1)*cm"
answer_annotated = "ਉਸ ਨੇ {d2} ਨੂੰ {food} ਦੇ {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} ਬਕਸੇ ਵੇਚੇ।\n{name} ਵੱਲੋਂ ਵੇਚੇ ਗਏ {food} ਦੇ ਬਕਸਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2} ਹੈ।\n{name} ਨੇ {food} ਵੇਚ ਕੇ {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} ਕਮਾਏ।\nਉਸ ਨੇ {d1} ਨੂੰ {fruit} ਦੀ ਪਾਈ ਦੇ {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} ਬਕਸੇ ਵੇਚੇ।\n{name} ਵੱਲੋਂ ਵੇਚੇ ਗਏ {fruit} ਦੀ ਪਾਈ ਦੇ ਬਕਸਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1} ਹੈ।\nਉਸ ਨੇ {fruit} ਦੀ ਪਾਈ ਵੇਚ ਕੇ {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} ਕਮਾਏ।\nਇਸ ਲਈ, {name} ਨੇ ਦੋ ਦਿਨਾਂ ਵਿੱਚ {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} ਕਮਾਏ।\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}"
