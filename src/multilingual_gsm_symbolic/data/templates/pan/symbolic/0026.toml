question_annotated = "{name1,ਇੱਕ ਆਦਮੀ} {n1,5} {food,ਸੈਂਡਵਿਚ} ਪ੍ਰਤੀ {time_unit,ਦਿਨ} ਖਾਂਦਾ ਹੈ, {name2,ਉਸ ਦੀ ਪਤਨੀ} {n2,4} {food,ਸੈਂਡਵਿਚ} ਪ੍ਰਤੀ {time_unit,ਦਿਨ} ਖਾਂਦੀ ਹੈ, ਅਤੇ ਉਨ੍ਹਾਂ ਦਾ {relation,ਪੁੱਤਰ} {n3,2} {food,ਸੈਂਡਵਿਚ} ਪ੍ਰਤੀ {time_unit,ਦਿਨ} ਖਾਂਦਾ ਹੈ। ਇਹ ਪਰਿਵਾਰ ਇੱਕ {time_period,ਹਫ਼ਤੇ} ਵਿੱਚ ਕਿੰਨੇ {food,ਸੈਂਡਵਿਚ} ਖਾਂਦਾ ਹੈ{placeholder_txt,?}\n\n#init:\n- name1 = sample([\"ਇੱਕ ਪਿਤਾ\", \"ਇੱਕ ਦਾਦਾ\", \"ਇੱਕ ਚਾਚਾ\"])\n- name2 = sample([\"ਉਸ ਦੀ ਪਤਨੀ\", \"ਉਸ ਦੀ ਸਾਥੀ\", \"ਉਸ ਦੀ ਜੀਵਨ ਸਾਥੀ\"])\n- relation = sample([\"ਪੁੱਤਰ\", \"ਪੋਤਾ\", \"ਭਤੀਜਾ\"])\n- food = sample([\"ਪੀਜ਼ਾ\", \"ਪਰੌਂਠੇ\", \"ਸਮੋਸੇ\", \"ਪਕੌੜੇ\", \"ਬਰਗਰ\"])\n- time_unit = sample([\"ਦਿਨ\"])\n- time_period = sample([\"ਹਫ਼ਤੇ\", \"ਮਹੀਨੇ\"])\n- placeholder_txt = \"? ਮੰਨ ਲਓ ਕਿ ਇੱਕ ਮਹੀਨੇ ਵਿੱਚ 30 ਦਿਨ ਹੁੰਦੇ ਹਨ।\" if time_period == \"ਮਹੀਨੇ\" else \"?\"\n- $n1 = range(2, 9)\n- $n2 = range(2, 9)\n- $n3 = range(2, 9)\n\n#answer: (n1 + n2 + n3) * (7 if time_period == \"ਹਫ਼ਤੇ\" else 30)"
