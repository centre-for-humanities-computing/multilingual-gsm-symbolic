question = "ਇੱਕ ਆਦਮੀ 5 ਸੈਂਡਵਿਚ ਪ੍ਰਤੀ ਦਿਨ ਖਾਂਦਾ ਹੈ, ਉਸ ਦੀ ਪਤਨੀ 4 ਸੈਂਡਵਿਚ ਪ੍ਰਤੀ ਦਿਨ ਖਾਂਦੀ ਹੈ, ਅਤੇ ਉਨ੍ਹਾਂ ਦਾ ਪੁੱਤਰ 2 ਸੈਂਡਵਿਚ ਪ੍ਰਤੀ ਦਿਨ ਖਾਂਦਾ ਹੈ। ਇਸ ਪਰਿਵਾਰ ਨੇ ਇੱਕ ਹਫ਼ਤਾ ਵਿੱਚ ਕਿੰਨੇ ਸੈਂਡਵਿਚ ਖਾਧੇ?"
