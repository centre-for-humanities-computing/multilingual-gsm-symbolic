question_annotated = "{name1,ਕਾਰਲ} ਅਤੇ {name2,ਜੈਨੀਫਰ} {city,ਲਾਸ ਐਂਜਲਸ} ਦੀਆਂ ਭੈਣਾਂ ਹਨ ਜੋ {celebrity_type,ਮਸ਼ਹੂਰ ਹਸਤੀਆਂ} ਦੇ ਦਸਤਖਤ ਇਕੱਠੇ ਕਰਨਾ ਪਸੰਦ ਕਰਦੀਆਂ ਹਨ। ਸਕੂਲ ਦੀ {vacation_type,ਗਰਮੀ ਦੀ ਛੁੱਟੀ} ਦੌਰਾਨ, ਉਹ ਹਰ ਸ਼ਾਮ ਦਸਤਖਤ ਇਕੱਠੇ ਕਰਨ ਵਿੱਚ ਲੱਗੀਆਂ ਰਹੀਆਂ। {n1_txt,ਪੰਜ} ਹਫ਼ਤਿਆਂ ਬਾਅਦ, {name1,ਕਾਰਲ} ਅਤੇ {name2,ਜੈਨੀਫਰ} ਨੇ ਆਪਣੇ ਅਲਬਮਾਂ ਦੀ ਤੁਲਨਾ ਕੀਤੀ। {name1,ਕਾਰਲ} ਕੋਲ {s1,20} ਦਸਤਖਤ ਸਨ ਅਤੇ {name2,ਜੈਨੀਫਰ} ਕੋਲ {s2,44}। ਉਨ੍ਹਾਂ ਦੀ ਛੁੱਟੀ ਵਿੱਚ {n2_txt,ਤਿੰਨ} ਹਫ਼ਤੇ ਹੋਰ ਬਾਕੀ ਸਨ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਫ਼ੈਸਲਾ ਕੀਤਾ ਕਿ ਉਹ ਛੁੱਟੀ ਖ਼ਤਮ ਹੋਣ ਤੋਂ ਪਹਿਲਾਂ ਮਿਲਾ ਕੇ {goal,100} ਦਸਤਖਤਾਂ ਤੱਕ ਪਹੁੰਚਣਾ ਚਾਹੁੰਦੀਆਂ ਹਨ। ਟੀਚੇ ਤੱਕ ਪਹੁੰਚਣ ਲਈ ਉਨ੍ਹਾਂ ਨੂੰ ਹੋਰ ਕਿੰਨੇ ਦਸਤਖਤ ਇਕੱਠੇ ਕਰਨੇ ਪੈਣਗੇ?\n\n#init:\n- name1, name2 = sample(names_female, 2)\n- city = sample(cities)\n- celebrity_type = sample([\"ਫ਼ਿਲਮ ਸਿਤਾਰੇ\", \"ਖਿਡਾਰੀ\", \"ਸੰਗੀਤਕਾਰ\", \"ਰਾਜਨੀਤਿਕਕਾਰ\", \"ਲੇਖਕ\"])\n- vacation_type = sample([\"ਸਰਦੀਆਂ ਦੀ ਛੁੱਟੀ\", \"ਬਸੰਤ ਦੀ ਛੁੱਟੀ\", \"ਗਰਮੀ ਦੀ ਛੁੱਟੀ\", \"ਪਤਝੜ ਦੀ ਛੁੱਟੀ\"])\n- n1_txt, n1_val = range_str(3, 8, 1, numbers)\n- n2_txt, n2_val = range_str(2, 5, 1, numbers)\n- $s1 = range(15, 40)\n- $s2 = range(30, 60)\n- $goal = range(90, 150, 5)\n\n#conditions:\n- s1 + s2 < goal\n\n#answer: goal - (s1 + s2)\n"
