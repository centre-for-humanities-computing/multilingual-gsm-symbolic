question = "ਸਿਮਰਨ ਅਤੇ ਕਿਰਨ ਲੁਧਿਆਣਾ ਦੀਆਂ ਭੈਣਾਂ ਹਨ ਜੋ ਮਸ਼ਹੂਰ ਹਸਤੀਆਂ ਦੇ ਦਸਤਖਤ ਇਕੱਠੇ ਕਰਨਾ ਪਸੰਦ ਕਰਦੀਆਂ ਹਨ। ਸਕੂਲ ਦੀਆਂ ਗਰਮੀਆਂ ਦੀਆਂ ਛੁੱਟੀਆਂ ਦੌਰਾਨ, ਉਹ ਹਰ ਦੁਪਹਿਰ ਦਸਤਖਤ ਇਕੱਠੇ ਕਰਨ ਵਿੱਚ ਲੱਗੀਆਂ ਰਹੀਆਂ। ਪੰਜ ਹਫ਼ਤਿਆਂ ਬਾਅਦ, ਸਿਮਰਨ ਅਤੇ ਕਿਰਨ ਨੇ ਆਪਣੀਆਂ ਆਟੋਗ੍ਰਾਫ਼ ਕਾਪੀਆਂ ਦੀ ਤੁਲਨਾ ਕੀਤੀ। ਸਿਮਰਨ ਕੋਲ 20 ਦਸਤਖਤ ਸਨ ਅਤੇ ਕਿਰਨ ਕੋਲ 44। ਉਨ੍ਹਾਂ ਦੀਆਂ ਗਰਮੀਆਂ ਦੀਆਂ ਛੁੱਟੀਆਂ ਵਿੱਚ ਤਿੰਨ ਹਫ਼ਤੇ ਹੋਰ ਬਾਕੀ ਸਨ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਫ਼ੈਸਲਾ ਕੀਤਾ ਕਿ ਉਹ ਛੁੱਟੀਆਂ ਖ਼ਤਮ ਹੋਣ ਤੋਂ ਪਹਿਲਾਂ ਮਿਲਾ ਕੇ 100 ਦਸਤਖਤਾਂ ਤੱਕ ਪਹੁੰਚਣਾ ਚਾਹੁੰਦੀਆਂ ਹਨ। ਟੀਚੇ ਤੱਕ ਪਹੁੰਚਣ ਲਈ ਉਨ੍ਹਾਂ ਨੂੰ ਹੋਰ ਕਿੰਨੇ ਦਸਤਖਤ ਇਕੱਠੇ ਕਰਨੇ ਪੈਣਗੇ?"
answer = "ਸਿਮਰਨ ਅਤੇ ਕਿਰਨ ਨੇ ਪਹਿਲਾਂ ਹੀ 20 + 44 = <<20+44=64>>64 ਦਸਤਖਤ ਇਕੱਠੇ ਕਰ ਲਏ ਹਨ।\nਕਿਉਂਕਿ ਉਨ੍ਹਾਂ ਦਾ ਟੀਚਾ 100 ਹੈ, ਉਨ੍ਹਾਂ ਨੂੰ 100 - 64 = <<100-64=36>>36 ਦਸਤਖਤ ਹੋਰ ਇਕੱਠੇ ਕਰਨੇ ਪੈਣਗੇ।\n#### 36"
