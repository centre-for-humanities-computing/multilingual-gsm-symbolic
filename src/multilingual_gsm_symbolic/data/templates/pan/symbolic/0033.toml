question = "ਕਾਰਲ ਅਤੇ ਜੈਨੀਫਰ ਲਾਸ ਐਂਜਲਸ ਦੀਆਂ ਭੈਣਾਂ ਹਨ ਜੋ ਮਸ਼ਹੂਰ ਹਸਤੀਆਂ ਦੇ ਦਸਤਖਤ ਇਕੱਠੇ ਕਰਨਾ ਪਸੰਦ ਕਰਦੀਆਂ ਹਨ। ਗਰਮੀ ਦੀ ਛੁੱਟੀ ਦੌਰਾਨ, ਉਹ ਹਰ ਸ਼ਾਮ ਦਸਤਖਤ ਇਕੱਠੇ ਕਰਨ ਵਿੱਚ ਲੱਗੀਆਂ ਰਹੀਆਂ। ਪੰਜ ਹਫ਼ਤਿਆਂ ਬਾਅਦ, ਦੋਵੇਂ ਨੇ ਆਪਣੇ ਅਲਬਮਾਂ ਦੀ ਤੁਲਨਾ ਕੀਤੀ। ਕਾਰਲ ਕੋਲ 20 ਦਸਤਖਤ ਸਨ ਅਤੇ ਜੈਨੀਫਰ ਕੋਲ 44। ਉਨ੍ਹਾਂ ਦੀਆਂ ਛੁੱਟੀਆਂ ਵਿੱਚ ਤਿੰਨ ਹਫ਼ਤੇ ਹੋਰ ਬਾਕੀ ਸਨ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਫ਼ੈਸਲਾ ਕੀਤਾ ਕਿ ਉਹ ਛੁੱਟੀ ਖ਼ਤਮ ਹੋਣ ਤੋਂ ਪਹਿਲਾਂ ਮਿਲਾ ਕੇ 100 ਦਸਤਖਤਾਂ ਤੱਕ ਪਹੁੰਚਣਾ ਚਾਹੁੰਦੀਆਂ ਹਨ। ਟੀਚੇ ਤੱਕ ਪਹੁੰਚਣ ਲਈ ਉਨ੍ਹਾਂ ਨੂੰ ਹੋਰ ਕਿੰਨੇ ਦਸਤਖਤ ਇਕੱਠੇ ਕਰਨੇ ਪੈਣਗੇ?"

