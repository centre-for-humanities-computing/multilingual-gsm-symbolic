question = "ਜੇਕਰ ਗੁਰਪ੍ਰੀਤ ਅਤੇ ਹਰਜੀਤ ਕੋਲ ਮਿਲਾ ਕੇ 100 ਫੁੱਟ ਵਾੜ ਹੈ, ਅਤੇ ਉਹ ਇਸਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਵੰਡਣ 'ਤੇ ਸਹਿਮਤ ਹੁੰਦੇ ਹਨ ਕਿ ਹਰਜੀਤ ਨੂੰ ਗੁਰਪ੍ਰੀਤ ਤੋਂ 60 ਫੁੱਟ ਵੱਧ ਮਿਲੇ, ਤਾਂ ਗੁਰਪ੍ਰੀਤ ਲਈ ਕਿੰਨੀ ਬਚਦੀ ਹੈ?"
answer = "ਮੰਨ ਲਓ x ਵਾੜ ਦੀ ਉਹ ਮਾਤਰਾ ਹੈ ਜੋ ਗੁਰਪ੍ਰੀਤ ਨੂੰ ਮਿਲਦੀ ਹੈ ਅਤੇ y ਉਹ ਮਾਤਰਾ ਹੈ ਜੋ ਹਰਜੀਤ ਨੂੰ ਮਿਲਦੀ ਹੈ। ਸਾਨੂੰ ਪਤਾ ਹੈ ਕਿ y = x + 60, ਅਤੇ y + x = 100।\nਪਹਿਲੀ ਸਮੀਕਰਨ ਨੂੰ ਦੂਜੀ ਸਮੀਕਰਨ ਵਿੱਚ ਰੱਖਣ 'ਤੇ, ਸਾਨੂੰ 2x+60=100 ਮਿਲਦਾ ਹੈ\nਦੋਵਾਂ ਪਾਸਿਓਂ 60 ਘਟਾਉਣ 'ਤੇ, ਸਾਨੂੰ 2x=40 ਮਿਲਦਾ ਹੈ\nਸਾਨੂੰ ਹਰੇਕ ਪਾਸੇ ਨੂੰ ਦੋ ਨਾਲ ਵੰਡਣਾ ਪੈਂਦਾ ਹੈ, ਜਿਸ ਨਾਲ x=20 ਬਚਦਾ ਹੈ। ਇਸਦਾ ਮਤਲਬ ਹੈ ਕਿ ਗੁਰਪ੍ਰੀਤ ਕੋਲ 20 ਫੁੱਟ ਵਾੜ ਬਚਦੀ ਹੈ।\n#### 20"
id_orig = 1084
