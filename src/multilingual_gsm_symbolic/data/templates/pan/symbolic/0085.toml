question_annotated = "ਜੇਕਰ {name1,ਗੁਰਪ੍ਰੀਤ} ਅਤੇ {name2,ਹਰਜੀਤ} ਕੋਲ ਮਿਲਾ ਕੇ {total,100} {unit,ਫੁੱਟ} ਵਾੜ ਹੈ, ਅਤੇ ਉਹ ਇਸਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਵੰਡਣ 'ਤੇ ਸਹਿਮਤ ਹੁੰਦੇ ਹਨ ਕਿ {name2,ਹਰਜੀਤ} ਨੂੰ {name1,ਗੁਰਪ੍ਰੀਤ} ਤੋਂ {diff,60} {unit,ਫੁੱਟ} ਵੱਧ ਮਿਲੇ, ਤਾਂ {name1,ਗੁਰਪ੍ਰੀਤ} ਲਈ ਕਿੰਨੀ ਬਚਦੀ ਹੈ?\n\n#init:\n- name1, name2 = sample(names, 2)\n- unit = sample([\"ਫੁੱਟ\", \"ਗਜ਼\", \"ਮੀਟਰ\"])\n- $total = range(100, 1000, 20)\n- $diff = range(20, 200, 10)\n\n#conditions:\n- total - diff > 10\n- is_int((total - diff) / 2)\n\n#answer: (total - diff) // 2"
answer_annotated = "ਮੰਨ ਲਓ x ਵਾੜ ਦੀ ਉਹ ਮਾਤਰਾ ਹੈ ਜੋ {name1} ਨੂੰ ਮਿਲਦੀ ਹੈ ਅਤੇ y ਉਹ ਮਾਤਰਾ ਹੈ ਜੋ {name2} ਨੂੰ ਮਿਲਦੀ ਹੈ। ਸਾਨੂੰ ਪਤਾ ਹੈ ਕਿ y = x + {diff}, ਅਤੇ y + x = {total}।\nਪਹਿਲੀ ਸਮੀਕਰਨ ਨੂੰ ਦੂਜੀ ਸਮੀਕਰਨ ਵਿੱਚ ਰੱਖਣ 'ਤੇ, ਸਾਨੂੰ 2x+{diff}={total} ਮਿਲਦਾ ਹੈ\nਦੋਵਾਂ ਪਾਸਿਓਂ {diff} ਘਟਾਉਣ 'ਤੇ, ਸਾਨੂੰ 2x={total-diff} ਮਿਲਦਾ ਹੈ\nਸਾਨੂੰ ਹਰੇਕ ਪਾਸੇ ਨੂੰ ਦੋ ਨਾਲ ਵੰਡਣਾ ਪੈਂਦਾ ਹੈ, ਜਿਸ ਨਾਲ x={(total-diff)//2} ਬਚਦਾ ਹੈ। ਇਸਦਾ ਮਤਲਬ ਹੈ ਕਿ {name1} ਕੋਲ {(total-diff)//2} {unit} ਵਾੜ ਬਚਦੀ ਹੈ।\n#### {(total-diff)//2}"
