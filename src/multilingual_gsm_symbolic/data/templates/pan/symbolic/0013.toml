question = "ਸਿਮਰਨ ਨੂੰ ਬਾਗ਼ਬਾਨੀ ਦਾ ਬਹੁਤ ਸ਼ੌਕ ਹੈ। ਬੀਤੇ ਕੱਲ੍ਹ, ਉਸਨੂੰ ਆਪਣੀ ਪਸੰਦੀਦਾ ਨਰਸਰੀ ਤੋਂ 18 ਨਵੇਂ ਗਮਲੇ ਵਾਲੇ ਪੌਦੇ ਮਿਲੇ। ਉਸਦੇ ਵੱਡੇ ਪਿੰਡ ਵਾਲੇ ਘਰ ਦੀਆਂ 40 ਖਿੜਕੀਆਂ ਦੇ ਛੱਜਿਆਂ ਵਿੱਚੋਂ ਹਰੇਕ 'ਤੇ ਪਹਿਲਾਂ ਹੀ 2 ਗਮਲੇ ਵਾਲੇ ਪੌਦੇ ਰੱਖੇ ਹੋਏ ਹਨ। ਖੁੱਲ੍ਹੇ ਦਿਲ ਨਾਲ, ਉਸਨੇ ਫ਼ੈਸਲਾ ਕੀਤਾ ਹੈ ਕਿ ਉਹ ਕੱਲ੍ਹ ਹਰੇਕ ਛੱਜੇ ਤੋਂ 1 ਗਮਲੇ ਵਾਲੇ ਪੌਦੇ ਦੋਸਤਾਂ ਅਤੇ ਪਰਿਵਾਰ ਨੂੰ ਦੇਵੇਗੀ। ਸਿਮਰਨ ਕੋਲ ਕਿੰਨੇ ਗਮਲੇ ਵਾਲੇ ਪੌਦੇ ਬਚਣਗੇ?"
answer = "ਬੀਤੇ ਕੱਲ੍ਹ, ਪੌਦੇ ਮਿਲਣ ਤੋਂ ਪਹਿਲਾਂ, ਸਿਮਰਨ ਕੋਲ 2*40 = <<2*40=80>>80 ਗਮਲੇ ਵਾਲੇ ਪੌਦੇ ਸਨ\nਹੋਰ 18 ਪੌਦੇ ਮਿਲਣ ਤੋਂ ਬਾਅਦ, ਉਸਦੇ ਕੋਲ ਕੁੱਲ 80 + 18 = <<80+18=98>>98 ਗਮਲੇ ਵਾਲੇ ਪੌਦੇ ਹੋ ਗਏ\nਕੱਲ੍ਹ ਸਿਮਰਨ ਵੱਲੋਂ ਦਿੱਤੇ ਜਾਣ ਵਾਲੇ ਪੌਦੇ 40*1 = <<40*1=40>>40 ਗਮਲੇ ਵਾਲੇ ਪੌਦੇ ਹੋਣਗੇ।\nਇਸ ਲਈ ਉਸਦੇ ਕੋਲ 98 - 40 = <<98-40=58>>58 ਗਮਲੇ ਵਾਲੇ ਪੌਦੇ ਬਚਣਗੇ।\n#### 58"
