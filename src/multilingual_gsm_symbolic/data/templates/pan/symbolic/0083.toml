question = "ਐਡਮਜ਼ ਪਰਿਵਾਰ ਕੁਕੀਆਂ ਬਣਾਉਣ ਵਿੱਚ ਮਸ਼ਗੂਲ ਹੈ। ਹੁਣ ਤੱਕ, ਉਹਨਾਂ ਨੇ 7995 ਕੁਕੀਆਂ ਬਣਾਈਆਂ ਹਨ। ਉਹਨਾਂ ਕੋਲ 2595 ਰੇਨਬੋ ਕੁਕੀਆਂ, 3075 ਓਟਮੀਲ ਕੁਕੀਆਂ, ਅਤੇ ਕੁਝ ਚੌਕਲੇਟ ਚਿਪ ਕੁਕੀਆਂ ਹਨ। ਉਹਨਾਂ ਨੇ ਚੌਕਲੇਟ ਚਿਪ ਕੁਕੀਆਂ ਕਿੰਨੀਆਂ ਬਣਾਈਆਂ ਹਨ?"
