question = "ਸਿਮਰਨ ਲਿਖਣਾ ਸਿੱਖ ਰਹੀ ਹੈ ਅਤੇ ਇਹ ਫੈਸਲਾ ਕਰਦੀ ਹੈ ਕਿ ਜਦੋਂ ਤੱਕ ਉਹ ਇਸਨੂੰ ਸਿੱਖ ਨਹੀਂ ਲੈਂਦੀ ਉਦੋਂ ਤੱਕ ਅੰਗਰੇਜ਼ੀ ਵਰਨਮਾਲਾ ਨੂੰ ਵਾਰ-ਵਾਰ ਲਿਖਦੀ ਰਹੇਗੀ। ਉਹ ਇਸਨੂੰ ਪੂਰਾ ਦੋ ਵਾਰ ਲਿਖਦੀ ਹੈ, ਇੱਕ ਵਾਰ ਇਸਦਾ ਅੱਧਾ ਲਿਖਦੀ ਹੈ, ਫਿਰ ਉਹ ਸਭ ਕੁਝ ਦੁਬਾਰਾ ਲਿਖਦੀ ਹੈ ਜੋ ਉਸਨੇ ਪਹਿਲਾਂ ਲਿਖਿਆ ਹੈ। ਸਿਮਰਨ ਨੇ ਕੁੱਲ ਮਿਲਾ ਕੇ ਕਿੰਨੇ ਅੱਖਰ ਲਿਖੇ ਹਨ?"
answer = "ਸਿਮਰਨ ਨੇ ਅੰਗਰੇਜ਼ੀ ਵਰਨਮਾਲਾ ਨੂੰ ਦੋ ਵਾਰ ਲਿਖਿਆ ਹੈ ਜੋ ਕਿ ਕੁੱਲ 26*2=<<26*2=52>>52 ਅੱਖਰ ਹਨ।\nਫਿਰ ਉਹ ਅੰਗਰੇਜ਼ੀ ਵਰਨਮਾਲਾ ਦਾ ਅੱਧਾ ਲਿਖਦੀ ਹੈ, ਜੋ ਕਿ 26*1/2=<<26*1/2=13>>13 ਅੱਖਰ ਹਨ।\nਹੁਣ ਤੱਕ, ਇਹ ਕੁੱਲ 52 + 13 = <<52+13=65>>65 ਅੱਖਰ ਹਨ।\nਇਸਨੂੰ ਦੁਬਾਰਾ ਲਿਖਣ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਉਸਨੇ ਲਿਖੇ ਗਏ ਅੱਖਰਾਂ ਦੀ ਗਿਣਤੀ ਦੁੱਗਣੀ ਕਰ ਦਿੱਤੀ ਹੈ, ਇਸ ਲਈ ਉਸਨੇ ਕੁੱਲ ਮਿਲਾ ਕੇ 65 * 2 = <<65*2=130>>130 ਅੱਖਰ ਲਿਖੇ ਹਨ।\n#### 130"
