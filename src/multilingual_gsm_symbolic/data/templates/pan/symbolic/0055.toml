question = "ਐਲੀਸ ਲਿਖਣਾ ਸਿੱਖ ਰਹੀ ਹੈ ਅਤੇ ਇਹ ਫੈਸਲਾ ਕਰਦੀ ਹੈ ਕਿ ਜਦੋਂ ਤੱਕ ਉਹ ਇਸਨੂੰ ਨਹੀਂ ਸਿੱਖ ਲੈਂਦੀ ਤਦੋਂ ਤੱਕ ਵਰਨਮਾਲਾ ਨੂੰ ਦੁਬਾਰਾ ਲਿਖਦੀ ਰਹੇਗੀ। ਉਹ ਇਸਨੂੰ ਪੂਰਾ ਦੋ ਵਾਰ ਲਿਖਦੀ ਹੈ, ਇੱਕ ਵਾਰ ਇਸਦਾ ਅੱਧਾ ਲਿਖਦੀ ਹੈ, ਫਿਰ ਉਹ ਸਭ ਕੁਝ ਦੁਬਾਰਾ ਲਿਖਦੀ ਹੈ ਜੋ ਉਸਨੇ ਪਹਿਲਾਂ ਲਿਖਿਆ ਹੈ। ਐਲੀਸ ਨੇ ਕੁੱਲ ਮਿਲਾ ਕੇ ਕਿੰਨੇ ਅੱਖਰ ਲਿਖੇ ਹਨ?"
answer = "ਐਲੀਸ ਨੇ ਵਰਨਮਾਲਾ ਨੂੰ ਦੋ ਵਾਰ ਲਿਖਿਆ ਹੈ ਜੋ ਕਿ ਕੁੱਲ 26*2=<<26*2=52>>52 ਅੱਖਰ ਹਨ।\nਫਿਰ ਉਹ ਵਰਨਮਾਲਾ ਦਾ ਅੱਧਾ ਲਿਖਦੀ ਹੈ, ਜੋ ਕਿ 26*1/2=<<26*1/2=13>>13 ਅੱਖਰ ਹਨ।\nਇਸ ਤਰ੍ਹਾਂ, ਇਹ ਕੁੱਲ 52 + 13 = <<52+13=65>>65 ਅੱਖਰ ਹਨ।\nਇਸਨੂੰ ਦੁਬਾਰਾ ਲਿਖਣਾ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਉਸਨੇ ਲਿਖੇ ਗਏ ਅੱਖਰਾਂ ਦੀ ਗਿਣਤੀ ਦੁੱਗਣੀ ਕਰ ਦਿੱਤੀ ਹੈ, ਇਸ ਲਈ ਉਸਨੇ ਕੁੱਲ ਮਿਲਾ ਕੇ 65 * 2 = <<65*2=130>>130 ਅੱਖਰ ਲਿਖੇ ਹਨ।\n#### 130\n"
