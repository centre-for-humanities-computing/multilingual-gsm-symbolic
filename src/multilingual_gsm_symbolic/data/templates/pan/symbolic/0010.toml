question = "ਪੇਅਫੋਨ ਤੋਂ ਕਾਲ ਕਰਨ ਲਈ, ਤੁਹਾਨੂੰ ਆਪਣੀ ਕਾਲ ਦੇ ਹਰ ਮਿੰਟ ਲਈ $0.25 ਦੇਣੇ ਪੈਣਗੇ। 16 ਮਿੰਟਾਂ ਤੋਂ ਬਾਅਦ, ਇਹ ਕੀਮਤ ਘਟ ਕੇ $0.2 ਪ੍ਰਤੀ ਮਿੰਟ ਰਹਿ ਜਾਂਦੀ ਹੈ। 36-ਮਿੰਟ ਦੀ ਕਾਲ ਦੀ ਕੀਮਤ ਕਿੰਨੀ ਹੋਵੇਗੀ?"
answer = "ਪਹਿਲੇ 16 ਮਿੰਟਾਂ ਦੀ ਕੀਮਤ 16 * 0.25 = $<<16*0.25=4>>4 ਹੋਵੇਗੀ।\nਉਸ ਤੋਂ ਬਾਅਦ, ਕਾਲ ਦੇ 36 - 16 = <<36-16=20>>20 ਮਿੰਟ ਬਾਕੀ ਬਚੇ ਹਨ।\nਅਤੇ ਇਹਨਾਂ 20 ਮਿੰਟਾਂ ਦੀ ਕੀਮਤ 20 * 0.2 = $<<20*0.2=4>>4 ਹੈ।\nਇਸ ਲਈ ਕੁੱਲ ਮਿਲਾ ਕੇ, 36-ਮਿੰਟ ਦੀ ਕਾਲ ਦੀ ਕੀਮਤ 4 + 4 = $8 ਹੋਵੇਗੀ।\n#### 8"
