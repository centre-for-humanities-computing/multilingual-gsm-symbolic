answer_annotated = "ਪਹਿਲੇ {t} ਮਿੰਟਾਂ ਦੀ ਕੀਮਤ {t} * {frac1} = {currency}<<{t}*{frac1}={ensure_int(t*frac1)}>>{ensure_int(t*frac1)} ਹੋਵੇਗੀ।\nਉਸ ਤੋਂ ਬਾਅਦ, ਕਾਲ ਦੇ {total} - {t} = <<{total}-{t}={total-t}>>{total-t} ਮਿੰਟ ਬਾਕੀ ਬਚੇ ਹਨ।\nਅਤੇ ਇਹਨਾਂ {total-t} ਮਿੰਟਾਂ ਦੀ ਕੀਮਤ {total-t} * {frac2} = {currency}<<{total-t}*{frac2}={ensure_int((total-t)*frac2)}>>{ensure_int((total-t)*frac2)} ਹੈ।\nਇਸ ਲਈ ਕੁੱਲ ਮਿਲਾ ਕੇ, {total}-ਮਿੰਟ ਦੀ ਕਾਲ ਦੀ ਕੀਮਤ {ensure_int(t*frac1)} + {ensure_int((total-t)*frac2)} = {currency}{ensure_int(frac1 * t) + ensure_int(frac2*(total-t))} ਹੋਵੇਗੀ।\n#### {ensure_int((frac1 * t) + frac2*(total-t))}"
