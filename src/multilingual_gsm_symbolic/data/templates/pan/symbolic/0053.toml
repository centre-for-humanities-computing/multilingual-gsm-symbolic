question = "ਪਿਅਰਸਨ ਨੇ ਬੋਲਿੰਗ ਦੀ ਇੱਕ ਗੇਮ ਵਿੱਚ 278 ਅੰਕ ਬਣਾਏ। ਨਿਕੀਤਾ ਨੇ ਪਿਅਰਸਨ ਦੇ ਅੱਧਾ ਤੋਂ 11 ਅੰਕ ਵੱਧ ਬਣਾਏ। ਪਿਅਰਸਨ ਅਤੇ ਨਿਕੀਤਾ ਕੋਲ ਕੁੱਲ ਮਿਲਾ ਕੇ ਕਿੰਨੇ ਅੰਕ ਸਨ?"
