question = "ਇੱਕ ਮਜ਼ਦੂਰ ਹਰ ਮਹੀਨੇ 4 ਹਫ਼ਤੇ ਅਤੇ ਹਰ ਹਫ਼ਤੇ 6 ਦਿਨ ਕੰਮ ਕਰਦਾ ਹੈ। ਜੇਕਰ ਉਸਨੂੰ ਹਰ ਦਿਨ ਰੁਪਏ50 ਮਿਲਦੇ ਹਨ, ਤਾਂ ਜੇਕਰ ਉਹ ਇੱਕ ਸਾਲ ਕੰਮ ਕਰਦਾ ਹੈ ਤਾਂ ਉਹ ਕਿੰਨਾ ਕਮਾਉਂਦਾ ਹੈ?"
answer = "ਮਜ਼ਦੂਰ ਹਰ ਹਫ਼ਤੇ 6 ਦਿਨ ਕੰਮ ਕਰਦਾ ਹੈ ਅਤੇ ਹਰ ਮਹੀਨੇ 4 ਹਫ਼ਤੇ ਕੰਮ ਕਰਦਾ ਹੈ, ਇਸ ਲਈ ਉਹ 6 ਦਿਨ/ਹਫ਼ਤੇ * 4 ਹਫ਼ਤੇ/ਮਹੀਨੇ = <<6*4=24>>24 ਦਿਨ/ਮਹੀਨੇ ਕੰਮ ਕਰਦਾ ਹੈ\nਜੇਕਰ ਉਹ ਹਰ ਦਿਨ ਰੁਪਏ50 ਕਮਾਉਂਦਾ ਹੈ ਤਾਂ ਉਹ ਰੁਪਏ50/ਦਿਨ * 24 ਦਿਨ/ਮਹੀਨੇ = ਰੁਪਏ<<50*24=1200>>1200/ਮਹੀਨਾ ਕਮਾਉਂਦਾ ਹੈ\nਇੱਕ ਸਾਲ 12 ਮਹੀਨਿਆਂ ਦੇ ਬਰਾਬਰ ਹੈ ਇਸ ਲਈ ਹਰ ਸਾਲ ਉਹ ਰੁਪਏ1200/ਮਹੀਨੇ * 12 ਮਹੀਨੇ/ਸਾਲ = ਰੁਪਏ<<1200*12=14400>>14,400 ਕਮਾਉਂਦਾ ਹੈ\n#### 14400\n"
