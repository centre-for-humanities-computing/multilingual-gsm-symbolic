question = "ਇੱਕ ਮਜ਼ਦੂਰ ਹਰ ਮਹੀਨੇ 4 ਹਫ਼ਤੇ ਅਤੇ ਹਰ ਹਫ਼ਤੇ 6 ਦਿਨ ਕੰਮ ਕਰਦਾ ਹੈ। ਜੇਕਰ ਉਸਨੂੰ ਹਰ ਦਿਨ $50 ਮਿਲਦੇ ਹਨ, ਤਾਂ ਇੱਕ ਸਾਲ ਵਿੱਚ ਉਹ ਕਿੰਨਾ ਕਮਾਏਗਾ?"
answer = "ਮਜ਼ਦੂਰ ਹਰ ਹਫ਼ਤੇ 6 ਦਿਨ ਅਤੇ ਹਰ ਮਹੀਨੇ 4 ਹਫ਼ਤੇ ਕੰਮ ਕਰਦਾ ਹੈ, ਇਸ ਲਈ ਉਹ ਮਹੀਨੇ ਵਿੱਚ 6 ਦਿਨ/ਹਫ਼ਤਾ * 4 ਹਫ਼ਤੇ/ਮਹੀਨਾ = <<6*4=24>>24 ਦਿਨ ਕੰਮ ਕਰਦਾ ਹੈ।\nਜੇ ਉਹ ਹਰ ਦਿਨ $50 ਕਮਾਉਂਦਾ ਹੈ, ਤਾਂ ਮਹੀਨੇ ਵਿੱਚ ਉਹ $50/ਦਿਨ * 24 ਦਿਨ/ਮਹੀਨਾ = $<<50*24=1200>>1200 ਕਮਾਉਂਦਾ ਹੈ।\nਸਾਲ ਵਿੱਚ 12 ਮਹੀਨੇ ਹੁੰਦੇ ਹਨ, ਇਸ ਲਈ ਹਰ ਸਾਲ ਉਹ $1200/ਮਹੀਨਾ * 12 ਮਹੀਨੇ = $<<1200*12=14400>>14,400 ਕਮਾਉਂਦਾ ਹੈ।\n#### 14400"
