question = "ਜੂਲੀ ਕੈਸ਼ ਰਜਿਸਟਰ ਆਪਣੇ ਘੱਟ ਤਜਰਬੇਕਾਰ ਸਹਿਯੋਗੀ ਜੇਵਲ ਨਾਲੋਂ ਬਿਲਕੁਲ ਦੋ ਗੁਣਾ ਤੇਜ਼ੀ ਨਾਲ ਚਲਾਉਂਦੀ ਹੈ। ਰੋਜ਼ਾਨਾ, ਜੇਵਲ 50 ਗਾਹਕਾਂ ਦੀ ਸੇਵਾ ਕਰਦੀ ਹੈ। ਜੇਕਰ ਉਹ ਹਫ਼ਤੇ ਦੇ ਸਾਰੇ ਦਿਨ ਕੰਮ ਕਰਦੇ ਹਨ, ਤਾਂ ਦੋਵਾਂ ਮਿਲ ਕੇ ਇੱਕ ਹਫ਼ਤੇ ਵਿੱਚ ਕੁੱਲ ਕਿੰਨੇ ਗਾਹਕਾਂ ਦੀ ਸੇਵਾ ਕਰਨਗੇ?"
answer = "ਜਦੋਂ ਜੇਵਲ ਇੱਕ ਦਿਨ ਵਿੱਚ 50 ਗਾਹਕਾਂ ਦੀ ਸੇਵਾ ਕਰ ਰਹੀ ਹੈ, ਜੂਲੀ 50 ਗਾਹਕ/ਦਿਨ*2=<<50*2=100>>100 ਗਾਹਕ/ਦਿਨ ਸੇਵਾ ਕਰਦੀ ਹੈ।\nਇੱਕ ਦਿਨ ਵਿੱਚ, ਉਹ ਮਿਲ ਕੇ 100 ਗਾਹਕ/ਦਿਨ + 50 ਗਾਹਕ/ਦਿਨ = <<100+50=150>>150 ਗਾਹਕਾਂ ਦੀ ਸੇਵਾ ਕਰਦੀਆਂ ਹਨ।\nਦੋਵਾਂ ਦੁਆਰਾ ਇੱਕ ਹਫ਼ਤੇ ਵਿੱਚ ਸੇਵਾ ਕੀਤੇ ਗਏ ਗਾਹਕਾਂ ਦੀ ਕੁੱਲ ਸੰਖਿਆ 150 ਗਾਹਕ/ਦਿਨ * 7 ਦਿਨ/ਹਫ਼ਤਾ = <<150*7=1050>>1050 ਗਾਹਕ ਹਨ।\n#### 1050"
