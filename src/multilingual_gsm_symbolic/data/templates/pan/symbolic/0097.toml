question = "ਸਿਮਰਨ ਆਪਣੀ ਘੱਟ ਤਜਰਬੇਕਾਰ ਸਾਥਣ ਕਿਰਨ ਨਾਲੋਂ ਬਿਲਕੁਲ ਦੋ ਗੁਣਾ ਤੇਜ਼ੀ ਨਾਲ ਕੈਸ਼ ਰਜਿਸਟਰ ਚਲਾਉਂਦੀ ਹੈ। ਰੋਜ਼ਾਨਾ, ਕਿਰਨ 50 ਗਾਹਕਾਂ ਦੀ ਸੇਵਾ ਕਰਦੀ ਹੈ। ਜੇਕਰ ਉਹ ਹਫ਼ਤੇ ਦੇ ਸਾਰੇ ਦਿਨ ਕੰਮ ਕਰਦੀਆਂ ਹਨ ਤਾਂ ਦੋਵੇਂ ਮਿਲ ਕੇ ਇੱਕ ਹਫ਼ਤੇ ਵਿੱਚ ਕੁੱਲ ਕਿੰਨੇ ਗਾਹਕਾਂ ਦੀ ਸੇਵਾ ਕਰਨਗੀਆਂ?"
answer = "ਜਦੋਂ ਕਿਰਨ ਇੱਕ ਦਿਨ ਵਿੱਚ 50 ਗਾਹਕਾਂ ਦੀ ਸੇਵਾ ਕਰ ਰਹੀ ਹੈ, ਸਿਮਰਨ 50 ਗਾਹਕ/ਦਿਨ*2=<<50*2=100>>100 ਗਾਹਕ/ਦਿਨ ਸੇਵਾ ਕਰਦੀ ਹੈ।\nਇੱਕ ਦਿਨ ਵਿੱਚ, ਉਹ ਮਿਲ ਕੇ 100 ਗਾਹਕ/ਦਿਨ + 50 ਗਾਹਕ/ਦਿਨ = <<100+50=150>>150 ਗਾਹਕਾਂ ਦੀ ਸੇਵਾ ਕਰਦੀਆਂ ਹਨ।\nਦੋਵਾਂ ਵੱਲੋਂ ਇੱਕ ਹਫ਼ਤੇ ਵਿੱਚ ਸੇਵਾ ਕੀਤੇ ਗਏ ਗਾਹਕਾਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 150 ਗਾਹਕ/ਦਿਨ * 7 ਦਿਨ/ਹਫ਼ਤਾ = <<150*7=1050>>1050 ਗਾਹਕ ਹੈ।\n#### 1050"
