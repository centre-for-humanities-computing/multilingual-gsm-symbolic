question = "ਜੂਲੀ ਕੈਸ਼ ਰਜਿਸਟਰ ਬਿਲਕੁਲ ਦੋ ਗੁਣਾ ਤੇਜ਼ੀ ਨਾਲ ਚਲਾਉਂਦੀ ਹੈ ਜਿੰਨਾ ਉਸਦੇ ਘੱਟ ਤਜਰਬੇਕਾਰ ਸਹਿਯੋਗੀ ਜੇਵਲ। ਰੋਜ਼ਾਨਾ, ਜੇਵਲ 50 ਗਾਹਕਾਂ ਦੀ ਪ੍ਰਕਿਰਿਆ ਕਰਦੀ ਹੈ। ਜੇਕਰ ਉਹ ਹਫ਼ਤੇ ਦੇ ਸਾਰੇ ਦਿਨ ਕੰਮ ਕਰਦੇ ਹਨ ਤਾਂ ਦੋਵਾਂ ਲਈ ਕੁੱਲ ਹਫ਼ਤਾਵਾਰੀ ਉਤਪਾਦਨ ਕੀ ਹੈ?"
answer = "ਜਦੋਂ ਜੇਵਲ ਇੱਕ ਦਿਨ ਵਿੱਚ 50 ਆਰਡਰਾਂ ਦੀ ਪ੍ਰਕਿਰਿਆ ਕਰ ਰਹੀ ਹੈ, ਜੂਲੀ 50 ਆਰਡਰ/ਦਿਨ*5=<<50*5=250>>250 ਆਰਡਰ/ਦਿਨ ਪ੍ਰਕਿਰਿਆ ਕਰਦੀ ਹੈ।\nਇੱਕ ਦਿਨ ਵਿੱਚ, ਉਹ ਮਿਲ ਕੇ 250 ਆਰਡਰ/ਦਿਨ + 50 ਆਰਡਰ/ਦਿਨ = <<250+50=300>>300 ਆਰਡਰ ਪ੍ਰਕਿਰਿਆ ਕਰਦੀਆਂ ਹਨ।\nਦੋਵਾਂ ਦੁਆਰਾ ਇੱਕ ਹਫ਼ਤੇ ਵਿੱਚ ਪ੍ਰਕਿਰਿਆ ਕੀਤੇ ਗਏ ਆਰਡਰਾਂ ਦੀ ਕੁੱਲ ਸੰਖਿਆ 300 ਆਰਡਰ/ਦਿਨ * 7 ਦਿਨ/ਹਫ਼ਤਾ = <<300*7=2100>>2100 ਆਰਡਰ ਹੈ\n#### 2100"
