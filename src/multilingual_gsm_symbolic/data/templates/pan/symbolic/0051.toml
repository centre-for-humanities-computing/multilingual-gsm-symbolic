question = "ਆਰਟੀ ਦਾ ਫੁੱਲਾਂ ਦਾ ਸਟਾਲ ਕਿਸਾਨ ਬਾਜ਼ਾਰ ਵਿੱਚ ਹੈ। ਉਹ ਫੁੱਲਾਂ ਦੀਆਂ ਤਿੰਨ ਕਿਸਮਾਂ ਵੇਚਦਾ ਹੈ: ਗੇਂਦਾ, ਪਿਟੂਨੀਆ ਤੇ ਬੇਗੋਨੀਆ। ਉਹ ਆਮ ਤੌਰ 'ਤੇ ਗੇਂਦਾ ਨੂੰ $2.56 ਪ੍ਰਤੀ ਗੁੱਛਾ ਵੇਚਦਾ ਹੈ, ਪਿਟੂਨੀਆ ਨੂੰ $2.27 ਪ੍ਰਤੀ ਗੁੱਛਾ ਤੇ ਬੇਗੋਨੀਆ ਨੂੰ $4.85 ਪ੍ਰਤੀ ਗੁੱਛਾ। ਆਰਟੀ ਦੇ ਕੋਲ ਅੱਜ ਛੁੱਟੀ ਨਹੀਂ ਹੈ, ਇਸ ਲਈ ਉਸਨੇ ਸਾਰੀਆਂ ਕੀਮਤਾਂ ਨੂੰ ਸਭ ਤੋਂ ਨੇੜੇ ਪੂਰੇ ਡਾਲਰ ਤੱਕ ਗੋਲ ਕਰਨ ਦਾ ਫੈਸਲਾ ਕੀਤਾ ਹੈ। ਜੇਕਰ ਆਰਟੀ 12 ਗੁੱਛਾ ਦੇ ਗੇਂਦਾ, 9 ਗੁੱਛਾ ਦੇ ਪਿਟੂਨੀਆ ਤੇ 17 ਗੁੱਛਾ ਦੇ ਬੇਗੋਨੀਆ ਵੇਚਦਾ ਹੈ, ਉਹ ਕਿੰਨਾ ਕਮਾਏਗਾ?"
answer = "ਆਰਟੀ ਆਪਣੇ ਗੇਂਦਾ ਨੂੰ $2.56 ਤੋਂ $3 ਤੱਕ ਗੋਲ ਕਰੇਗਾ, ਕਿਉਂਕਿ 2 ਤੋਂ ਬਾਅਦਲਾ ਅੰਕ 5 ਜਾਂ ਉਸ ਤੋਂ ਵੱਧ ਹੈ।\nਆਰਟੀ ਆਪਣੇ ਪਿਟੂਨੀਆ ਨੂੰ $2.27 ਤੋਂ $2 ਤੱਕ ਗੋਲ ਕਰੇਗਾ, ਕਿਉਂਕਿ 2 ਤੋਂ ਬਾਅਦਲਾ ਅੰਕ 5 ਤੋਂ ਘੱਟ ਹੈ।\nਆਰਟੀ ਆਪਣੇ ਬੇਗੋਨੀਆ ਨੂੰ $4.85 ਤੋਂ $5 ਤੱਕ ਗੋਲ ਕਰੇਗਾ, ਕਿਉਂਕਿ 4 ਤੋਂ ਬਾਅਦਲਾ ਅੰਕ 5 ਤੋਂ ਘੱਟ ਹੈ।\nਆਰਟੀ 12 ਗੇਂਦਾ ਵੇਚਦਾ ਹੈ: $3 ਨਾਲ ਕੁੱਲ $<<12*3=36>>36 ਬਣਦੇ ਹਨ।\nਆਰਟੀ 9 ਪਿਟੂਨੀਆ ਵੇਚਦਾ ਹੈ: $2 ਨਾਲ ਕੁੱਲ $<<9*2=18>>18 ਬਣਦੇ ਹਨ।\nਆਰਟੀ 17 ਬੇਗੋਨੀਆ ਵੇਚਦਾ ਹੈ: $5 ਨਾਲ ਕੁੱਲ $<<17*5=85>>85 ਬਣਦੇ ਹਨ।\nਕੁੱਲ ਮਿਲਾ ਕੇ, ਆਰਟੀ $36 + $18 + $85 ਕਮਾਏਗਾ = $<<36+18+85=139>>139\n#### 139\n"
