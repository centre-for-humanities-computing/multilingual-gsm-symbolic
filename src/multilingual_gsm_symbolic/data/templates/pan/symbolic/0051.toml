question_annotated = "{name,ਆਰਟੀ} da {product,phull} da stand {location,ਕਿਸਾਨ ਬਾਜ਼ਾਰ} vich hai. Oh {product,phull} di teesri qism bechda hai: {item1,genda}, {item2,petunia} te {item3,begonia}. Oh aam taur te {item1,genda} nu {cur,$}{p1,2.74} per {unit,ghara} bechda hai, {item2,petunia} nu {cur,$}{p2,1.87} per {unit,ghara} te {item3,begonia} nu {cur,$}{p3,2.12} per {unit,ghara}. {name,ਆਰਟੀ} de kol aj chhutti nahi hai, is layi ohne apne saare daam nu sab ton nazdeek dollar te round karne da faisla kitha hai. Jekar {name,ਆਰਟੀ} {n1,12} {unit,ghara} de {item1,genda}, {n2,9} {unit,ghara} de {item2,petunia} te {n3,17} {unit,ghara} de {item3,begonia} bechda hai, oh kitna kamauga?\n\n#ਸ਼ੁਰੂਆਤ:\n- name = sample(names_male)\n- product = sample([\"sabzi\", \"phull\", \"sag\", \"paudha\"])\n- location = sample([\"stani mela\", \"samudayik bazaar\", \"sadak bazaar\", \"shehar chowk\"])\n- item1, item2, item3 = sample([\"gulab\", \"daisy\", \"tulip\", \"lili\", \"surajmukhi\", \"orchid\"], 3)\n- unit = sample([\"jhul\", \"tokri\", \"bouquet\", \"guthli\"])\n- cur = sample(currencies_sym)\n- $p1 = arange(1.26, 3.53, 0.33)\n- $p2 = arange(2.27, 5.53, 0.26)\n- $p3 = arange(4.85, 6.53, 0.31)\n- $n1 = range(5, 21)\n- $n2 = range(15, 31)\n- $n3 = range(35, 41)\n\n\n#ਜਵਾਬ: n1*round(p1) + n2*round(p2) + n3*round(p3)\n"
answer_annotated = "{name} apne {item1} nu {cur}{p1} ton {cur}{round(p1)} te upar round karega, kyunki {int(p1)} ton baad wala number 5 ya us ton vadh hai.\n{name} apne {item2} nu {'up' if round(p2) > p2 else 'down'} {cur}{p2} ton {cur}{round(p2)} te round karega, kyunki {int(p2)} ton baad wala number {'5 or higher' if round(p2) > p2 else 'less than 5'} hai.\n{name} apne {item3} nu {'up' if round(p3) > p3 else 'down'} {cur}{p3} ton {cur}{round(p3)} te round karega, kyunki {int(p3)} ton baad wala number {'5 or higher' if round(p3) > p3 else 'less than 5'} hai.\n{name} {n1} {item1} bechda hai * {cur}{round(p1)} = {cur}<<{n1}*{round(p1)}={n1*round(p1)}>>{n1*round(p1)}\n{name} {n2} {item2} bechda hai * {cur}{round(p2)} = {cur}<<{n2}*{round(p2)}={n2*round(p2)}>>{n2*round(p2)}\n{name} {n3} {item3} bechda hai * {cur}{round(p3)} = {cur}<<{n3}*{round(p3)}={n3*round(p3)}>>{n3*round(p3)}\nMilakar, {name} {cur}{n1*round(p1)} + {cur}{n2*round(p2)} + {cur}{n3*round(p3)} kamauga = {cur}<<{n1*round(p1)}+{n2*round(p2)}+{n3*round(p3)}={n1*round(p1) + n2*round(p2) + n3*round(p3)}>>{n1*round(p1) + n2*round(p2) + n3*round(p3)}\n#### {n1*round(p1) + n2*round(p2) + n3*round(p3)}\n"
