question = "ਆਰਟੀ ਦਾ ਫੁੱਲਾਂ ਦਾ ਸਟਾਲ ਕਿਸਾਨ ਬਾਜ਼ਾਰ ਵਿੱਚ ਹੈ। ਉਹ ਫੁੱਲਾਂ ਦੀਆਂ ਤਿੰਨ ਕਿਸਮਾਂ ਵੇਚਦਾ ਹੈ: ਗੇਂਦਾ, ਪਿਟੂਨੀਆ ਤੇ ਬੇਗੋਨੀਆ। ਉਹ ਆਮ ਤੌਰ 'ਤੇ ਗੇਂਦਾ ਨੂੰ $2.74 ਪ੍ਰਤੀ ਗੁੱਛਾ ਵੇਚਦਾ ਹੈ, ਪਿਟੂਨੀਆ ਨੂੰ $1.87 ਪ੍ਰਤੀ ਗੁੱਛਾ ਤੇ ਬੇਗੋਨੀਆ ਨੂੰ $2.12 ਪ੍ਰਤੀ ਗੁੱਛਾ। ਆਰਟੀ ਕੋਲ ਅੱਜ ਖੁੱਲ੍ਹੇ ਪੈਸੇ ਨਹੀਂ ਹਨ, ਇਸ ਲਈ ਉਸਨੇ ਸਾਰੀਆਂ ਕੀਮਤਾਂ ਨੂੰ ਸਭ ਤੋਂ ਨੇੜੇ ਪੂਰੇ ਡਾਲਰ ਤੱਕ ਗੋਲ ਕਰਨ ਦਾ ਫੈਸਲਾ ਕੀਤਾ ਹੈ। ਜੇਕਰ ਆਰਟੀ 12 ਗੁੱਛਾ ਦੇ ਗੇਂਦਾ, 9 ਗੁੱਛਾ ਦੇ ਪਿਟੂਨੀਆ ਤੇ 17 ਗੁੱਛਾ ਦੇ ਬੇਗੋਨੀਆ ਵੇਚਦਾ ਹੈ, ਉਹ ਕਿੰਨਾ ਕਮਾਏਗਾ?"
answer = "ਆਰਟੀ ਆਪਣੇ ਗੇਂਦਾ ਨੂੰ ਉੱਪਰ $2.74 ਤੋਂ $3 ਤੱਕ ਗੋਲ ਕਰੇਗਾ, ਕਿਉਂਕਿ 2 ਤੋਂ ਬਾਅਦਲਾ ਅੰਕ 5 ਜਾਂ ਉਸ ਤੋਂ ਵੱਧ ਹੈ।\nਆਰਟੀ ਆਪਣੇ ਪਿਟੂਨੀਆ ਨੂੰ ਉੱਪਰ $1.87 ਤੋਂ $2 ਤੱਕ ਗੋਲ ਕਰੇਗਾ, ਕਿਉਂਕਿ 1 ਤੋਂ ਬਾਅਦਲਾ ਅੰਕ 5 ਜਾਂ ਉਸ ਤੋਂ ਵੱਧ ਹੈ।\nਆਰਟੀ ਆਪਣੇ ਬੇਗੋਨੀਆ ਨੂੰ ਹੇਠਾਂ $2.12 ਤੋਂ $2 ਤੱਕ ਗੋਲ ਕਰੇਗਾ, ਕਿਉਂਕਿ 2 ਤੋਂ ਬਾਅਦਲਾ ਅੰਕ 5 ਤੋਂ ਘੱਟ ਹੈ।\nਆਰਟੀ 12 ਗੇਂਦਾ ਵੇਚਦਾ ਹੈ: $3 ਨਾਲ ਕੁੱਲ $<<12*3=36>>36 ਬਣਦੇ ਹਨ।\nਆਰਟੀ 9 ਪਿਟੂਨੀਆ ਵੇਚਦਾ ਹੈ: $2 ਨਾਲ ਕੁੱਲ $<<9*2=18>>18 ਬਣਦੇ ਹਨ।\nਆਰਟੀ 17 ਬੇਗੋਨੀਆ ਵੇਚਦਾ ਹੈ: $2 ਨਾਲ ਕੁੱਲ $<<17*2=34>>34 ਬਣਦੇ ਹਨ।\nਕੁੱਲ ਮਿਲਾ ਕੇ, ਆਰਟੀ $36 + $18 + $34 ਕਮਾਏਗਾ = $<<36+18+34=88>>88\n#### 88\n"
