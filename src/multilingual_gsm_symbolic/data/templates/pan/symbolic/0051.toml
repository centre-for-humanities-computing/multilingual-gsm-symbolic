question = "ਆਰਟੀ ਦਾ ਫੁੱਲਾਂ ਦਾ ਸਟਾਲ ਕਿਸਾਨ ਬਾਜ਼ਾਰ ਵਿੱਚ ਹੈ। ਉਹ ਫੁੱਲਾਂ ਦੀਆਂ ਤਿੰਨ ਕਿਸਮਾਂ ਵੇਚਦਾ ਹੈ: ਗੇਂਦਾ, ਪਿਟੂਨੀਆ ਅਤੇ ਬੇਗੋਨੀਆ। ਉਹ ਆਮ ਤੌਰ ’ਤੇ ਗੇਂਦਾ ਨੂੰ $2.74 ਪ੍ਰਤੀ ਗੁੱਛਾ, ਪਿਟੂਨੀਆ ਨੂੰ $1.87 ਪ੍ਰਤੀ ਗੁੱਛਾ ਅਤੇ ਬੇਗੋਨੀਆ ਨੂੰ $2.12 ਪ੍ਰਤੀ ਗੁੱਛਾ ਵੇਚਦਾ ਹੈ। ਅੱਜ ਆਰਟੀ ਦੀ ਛੁੱਟੀ ਨਹੀਂ ਹੈ, ਇਸ ਲਈ ਉਸਨੇ ਸਾਰੇ ਭਾਅ ਸਭ ਤੋਂ ਨੇੜੇ ਪੂਰੇ ਡਾਲਰ ਤੱਕ ਗੋਲ ਕਰਨ ਦਾ ਫੈਸਲਾ ਕੀਤਾ ਹੈ। ਜੇ ਉਹ 12 ਗੇਂਦੇ, 9 ਪਿਟੂਨੀਆ ਅਤੇ 17 ਬੇਗੋਨੀਆ ਵੇਚਦਾ ਹੈ, ਤਾਂ ਉਹ ਕਿੰਨਾ ਕਮਾਏਗਾ?"
answer = "ਆਰਟੀ ਗੇਂਦੇ ਦੀ ਕੀਮਤ $2.74 ਤੋਂ $3 ਕਰ ਦੇਵੇਗਾ, ਕਿਉਂਕਿ ਦਸ਼ਮਲਵ ਤੋਂ ਬਾਅਦਲਾ ਅੰਕ 5 ਤੋਂ ਵੱਧ ਹੈ।\nਆਰਟੀ ਪਿਟੂਨੀਆ ਦੀ ਕੀਮਤ $1.87 ਤੋਂ $2 ਕਰ ਦੇਵੇਗਾ, ਕਿਉਂਕਿ ਦਸ਼ਮਲਵ ਤੋਂ ਬਾਅਦਲਾ ਅੰਕ 5 ਜਾਂ ਵੱਧ ਹੈ।\nਆਰਟੀ ਬੇਗੋਨੀਆ ਦੀ ਕੀਮਤ $2.12 ਤੋਂ $2 ਕਰ ਦੇਵੇਗਾ, ਕਿਉਂਕਿ ਦਸ਼ਮਲਵ ਤੋਂ ਬਾਅਦਲਾ ਅੰਕ 5 ਤੋਂ ਘੱਟ ਹੈ।\nਆਰਟੀ 12 ਗੇਂਦੇ ਵੇਚਦਾ ਹੈ: 12 * $3 = $<<12*3=36>>36\nਆਰਟੀ 9 ਪਿਟੂਨੀਆ ਵੇਚਦਾ ਹੈ: 9 * $2 = $<<9*2=18>>18\nਆਰਟੀ 17 ਬੇਗੋਨੀਆ ਵੇਚਦਾ ਹੈ: 17 * $2 = $<<17*2=34>>34\nਕੁੱਲ ਮਿਲਾ ਕੇ, ਆਰਟੀ $36 + $18 + $34 = $<<36+18+34=88>>88 ਕਮਾਏਗਾ।\n#### 88"
