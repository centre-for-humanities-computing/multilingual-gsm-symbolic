question = "ਹਰਜੀਤ ਦਾ ਫੁੱਲਾਂ ਦਾ ਸਟਾਲ ਕਿਸਾਨ ਮੰਡੀ ਵਿੱਚ ਹੈ। ਉਹ ਫੁੱਲਾਂ ਦੀਆਂ ਤਿੰਨ ਕਿਸਮਾਂ ਵੇਚਦਾ ਹੈ: ਗੇਂਦੇ, ਪਿਟੂਨੀਆ ਤੇ ਬੇਗੋਨੀਆ। ਉਹ ਆਮ ਤੌਰ 'ਤੇ ਗੇਂਦੇ $2.74 ਪ੍ਰਤੀ ਗੁੱਛਾ, ਪਿਟੂਨੀਆ $1.87 ਪ੍ਰਤੀ ਗੁੱਛਾ ਤੇ ਬੇਗੋਨੀਆ $2.12 ਪ੍ਰਤੀ ਗੁੱਛਾ ਦੇ ਹਿਸਾਬ ਨਾਲ ਵੇਚਦਾ ਹੈ। ਹਰਜੀਤ ਕੋਲ ਅੱਜ ਖੁੱਲ੍ਹੇ ਪੈਸੇ ਨਹੀਂ ਹਨ, ਇਸ ਲਈ ਉਸਨੇ ਸਾਰੀਆਂ ਕੀਮਤਾਂ ਨੂੰ ਸਭ ਤੋਂ ਨੇੜਲੇ ਪੂਰੇ ਅੰਕ ਤੱਕ ਗੋਲ ਕਰਨ ਦਾ ਫੈਸਲਾ ਕੀਤਾ ਹੈ। ਜੇਕਰ ਹਰਜੀਤ 12 ਗੁੱਛਾ ਗੇਂਦੇ, 9 ਗੁੱਛਾ ਪਿਟੂਨੀਆ ਤੇ 17 ਗੁੱਛਾ ਬੇਗੋਨੀਆ ਵੇਚਦਾ ਹੈ, ਤਾਂ ਉਹ ਕਿੰਨਾ ਕਮਾਏਗਾ?"
answer = "ਹਰਜੀਤ ਗੇਂਦੇ ਦੀ ਕੀਮਤ $2.74 ਤੋਂ ਗੋਲ ਕਰਕੇ $3 ਕਰੇਗਾ, ਕਿਉਂਕਿ 2 ਤੋਂ ਬਾਅਦ ਵਾਲੇ ਅੰਕ ਦੇ ਹਿਸਾਬ ਨਾਲ ਇਹ $3 ਦੇ ਸਭ ਤੋਂ ਨੇੜੇ ਹੈ।\nਹਰਜੀਤ ਪਿਟੂਨੀਆ ਦੀ ਕੀਮਤ $1.87 ਤੋਂ ਵਧਾ ਕੇ $2 ਕਰੇਗਾ, ਕਿਉਂਕਿ 1 ਤੋਂ ਬਾਅਦ ਵਾਲਾ ਅੰਕ 5 ਜਾਂ ਉਸ ਤੋਂ ਵੱਧ ਹੈ।\nਹਰਜੀਤ ਬੇਗੋਨੀਆ ਦੀ ਕੀਮਤ $2.12 ਤੋਂ ਘਟਾ ਕੇ $2 ਕਰੇਗਾ, ਕਿਉਂਕਿ 2 ਤੋਂ ਬਾਅਦ ਵਾਲਾ ਅੰਕ 5 ਤੋਂ ਘੱਟ ਹੈ।\nਹਰਜੀਤ 12 ਗੇਂਦੇ ਵੇਚਦਾ ਹੈ: $3 ਨਾਲ ਕੁੱਲ $<<12*3=36>>36 ਬਣਦੇ ਹਨ।\nਹਰਜੀਤ 9 ਪਿਟੂਨੀਆ ਵੇਚਦਾ ਹੈ: $2 ਨਾਲ ਕੁੱਲ $<<9*2=18>>18 ਬਣਦੇ ਹਨ।\nਹਰਜੀਤ 17 ਬੇਗੋਨੀਆ ਵੇਚਦਾ ਹੈ: $2 ਨਾਲ ਕੁੱਲ $<<17*2=34>>34 ਬਣਦੇ ਹਨ।\nਕੁੱਲ ਮਿਲਾ ਕੇ, ਹਰਜੀਤ $36 + $18 + $34 = $<<36+18+34=88>>88 ਕਮਾਏਗਾ।\n#### 88"
