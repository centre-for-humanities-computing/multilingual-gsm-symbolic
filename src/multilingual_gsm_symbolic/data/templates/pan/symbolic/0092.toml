question_annotated = "ਰਾਜਕੁਮਾਰ {name1,ਹਰਜੀਤ} ਨੇ ਆਪਣੀ ਤਾਕਤਵਰ {weapon1,ਤਲਵਾਰ} ਨਾਲ {n1,100} {creature,ਡਰੈਗਨ} ਮਾਰੇ, ਜਦਕਿ ਰਾਜਕੁਮਾਰ {name2,ਮਨਦੀਪ} ਨੇ {weapon2,ਬਰਛੀ} ਦੀ ਵਰਤੋਂ ਕਰਦਿਆਂ ਰਾਜਕੁਮਾਰ {name1,ਹਰਜੀਤ} ਨਾਲੋਂ {frac1_txt,ਤਿੰਨ ਚੌਥਾਈ} ਜਿੰਨੇ {creature,ਡਰੈਗਨ} ਮਾਰੇ। {weapon3,ਜੰਗਾਲ ਲੱਗੀ ਲੋਹੇ ਦੀ ਕੁਹਾੜੀ} ਦੀ ਵਰਤੋਂ ਕਰਦਿਆਂ, ਰਾਜਕੁਮਾਰ {name3,ਜਸਪ੍ਰੀਤ} ਨੇ ਰਾਜਕੁਮਾਰ {name2,ਮਨਦੀਪ} ਨਾਲੋਂ {mult1_txt,ਦੋ ਗੁਣਾ} ਜਿੰਨੇ {creature,ਡਰੈਗਨ} ਮਾਰੇ। ਪਰ ਰਾਜਕੁਮਾਰ {name4,ਨਵਦੀਪ} ਨੇ, ਆਪਣੀ {weapon4,ਤਲਵਾਰ} ਘਰ ਭੁੱਲ ਆਉਣ ਕਰਕੇ, {weapon5,ਨੇਲ ਫਾਈਲ} ਦੀ ਵਰਤੋਂ ਕਰਕੇ ਰਾਜਕੁਮਾਰ {name3,ਜਸਪ੍ਰੀਤ} ਨਾਲੋਂ {frac2_txt,ਇੱਕ ਪੰਜਵਾਂ} ਜਿੰਨੇ {creature,ਡਰੈਗਨ} ਮਾਰੇ। ਰਾਜਕੁਮਾਰ {name4,ਨਵਦੀਪ} ਨੇ ਕੁੱਲ ਕਿੰਨੇ {creature,ਡਰੈਗਨ} ਮਾਰੇ ਹਨ?\n\n#init:\n- name1, name2, name3, name4 = sample(names_male, 4)\n- creature = sample([\"ਰਾਖਸ਼\", \"ਦੈਂਤ\", \"ਭੂਤ\", \"ਜਿੰਨ\", \"ਪਿਸ਼ਾਚ\"])\n- weapon1 = sample([\"ਤਲਵਾਰ\", \"ਕਿਰਪਾਨ\", \"ਜੰਗੀ ਕੁਹਾੜੀ\", \"ਤੇਗ਼\"])\n- weapon2 = sample([\"ਬਰਛੀ\", \"ਲਾਂਸ\", \"ਜੈਵਲਿਨ\", \"ਹਾਲਬਰਡ\"])\n- weapon3 = sample([\"ਜੰਗਾਲ ਲੱਗੀ ਲੋਹੇ ਦੀ ਕੁਹਾੜੀ\", \"ਲੱਕੜ ਦੀ ਸੋਟੀ\", \"ਪੱਥਰ ਦੀ ਹਥੌੜੀ\", \"ਹੱਡੀ ਦੇ ਖੰਜਰ\"])\n- weapon4 = sample([\"ਤਲਵਾਰ\", \"ਕੁਹਾੜੀ\", \"ਕਿਰਪਾਨ\", \"ਹਥੌੜੀ\"])\n- weapon5 = sample([\"ਨੇਲ ਫਾਈਲ\", \"ਮੱਖਣ ਵਾਲੀ ਛੁਰੀ\", \"ਲੱਕੜ ਦੇ ਚਮਚ\", \"ਖੰਭ\"])\n- $n1 = range(50, 501, 50)\n- frac1_txt, frac1_val = sample(fraction_alnum)\n- mult1_txt, mult1_val = sample(multi_times)\n- frac2_txt, frac2_val = sample(fraction_alnum)\n\n#conditions:\n- is_int(n1 * frac1_val)\n- is_int(n1 * frac1_val * mult1_val)\n- is_int(n1 * frac1_val * mult1_val * frac2_val)\n\n#answer: int(n1 * frac1_val * mult1_val * frac2_val)"
