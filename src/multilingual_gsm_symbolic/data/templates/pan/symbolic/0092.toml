question = "ਰਾਜਕੁਮਾਰ ਤਥਡੇਅਸ ਨੇ ਆਪਣੇ ਸ਼ਕਤੀਸ਼ਾਲੀ ਤਲਵਾਰ ਨਾਲ 100 ਡਰੈਗਨ ਮਾਰੇ, ਜਦਕਿ ਰਾਜਕੁਮਾਰ ਆਰਥਰ, ਇੱਕ ਭਾਲਾ ਦੀ ਵਰਤੋਂ ਕਰਦੇ ਹੋਏ, ਰਾਜਕੁਮਾਰ ਤਥਡੇਅਸ ਨਾਲੋਂ ਤਿੰਨ ਚੌਥਾਈ ਜਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ। ਜੰਗਾਲੀ ਲੋਹੇ ਦੀ ਕੁਹਾੜ ਦੀ ਵਰਤੋਂ ਕਰਦੇ ਹੋਏ, ਰਾਜਕੁਮਾਰ ਵਾਲਟਰ ਨੇ ਰਾਜਕੁਮਾਰ ਆਰਥਰ ਨਾਲੋਂ ਦੋ ਗੁਣਾ ਜਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ। ਪਰ ਰਾਜਕੁਮਾਰ ਬਰੂਸ ਨੇ, ਆਪਣੀ ਤਲਵਾਰ ਘਰ ਛੱਡਣ ਕਰਕੇ, ਰਾਜਕੁਮਾਰ ਵਾਲਟਰ ਨਾਲੋਂ ਪੰਜਵਾਂ ਹਿੱਸਾ ਜਿੰਨੇ ਡਰੈਗਨ ਨਾਖੂਨ ਫਾਈਲ ਦੀ ਵਰਤੋਂ ਕਰਕੇ ਮਾਰੇ। ਰਾਜਕੁਮਾਰ ਬਰੂਸ ਨੇ ਕੁੱਲ ਕਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ ਹਨ?"
answer = "ਰਾਜਕੁਮਾਰ ਆਰਥਰ ਨੇ ਰਾਜਕੁਮਾਰ ਤਥਡੇਅਸ ਨਾਲੋਂ ਤਿੰਨ ਚੌਥਾਈ ਜਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ, ਜਾਂ 100*3/4=<<100*3/4=75>>75 ਡਰੈਗਨ।\nਰਾਜਕੁਮਾਰ ਵਾਲਟਰ ਨੇ ਰਾਜਕੁਮਾਰ ਆਰਥਰ ਨਾਲੋਂ ਦੋ ਗੁਣਾ ਜਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ, ਜਾਂ 2*75=<<2*75=150>>150 ਡਰੈਗਨ।\nਰਾਜਕੁਮਾਰ ਬਰੂਸ ਨੇ ਰਾਜਕੁਮਾਰ ਵਾਲਟਰ ਨਾਲੋਂ ਪੰਜਵਾਂ ਹਿੱਸਾ ਜਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ, ਜਾਂ 150*1/5=<<150*1/5=30>>30 ਡਰੈਗਨ।\n#### 30\n"
