question = "ਰਾਜਕੁਮਾਰ ਹਰਜੀਤ ਨੇ ਆਪਣੀ ਤਾਕਤਵਰ ਤਲਵਾਰ ਨਾਲ 100 ਡਰੈਗਨ ਮਾਰੇ, ਜਦਕਿ ਰਾਜਕੁਮਾਰ ਮਨਦੀਪ ਨੇ ਬਰਛੀ ਦੀ ਵਰਤੋਂ ਕਰਦਿਆਂ ਰਾਜਕੁਮਾਰ ਹਰਜੀਤ ਨਾਲੋਂ ਤਿੰਨ ਚੌਥਾਈ ਜਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ। ਜੰਗਾਲ ਲੱਗੀ ਲੋਹੇ ਦੀ ਕੁਹਾੜੀ ਦੀ ਵਰਤੋਂ ਕਰਦਿਆਂ, ਰਾਜਕੁਮਾਰ ਜਸਪ੍ਰੀਤ ਨੇ ਰਾਜਕੁਮਾਰ ਮਨਦੀਪ ਨਾਲੋਂ ਦੋ ਗੁਣਾ ਜਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ। ਪਰ ਰਾਜਕੁਮਾਰ ਨਵਦੀਪ ਨੇ, ਆਪਣੀ ਤਲਵਾਰ ਘਰ ਭੁੱਲ ਆਉਣ ਕਰਕੇ, ਨੇਲ ਫਾਈਲ ਦੀ ਵਰਤੋਂ ਕਰਕੇ ਰਾਜਕੁਮਾਰ ਜਸਪ੍ਰੀਤ ਨਾਲੋਂ ਇੱਕ ਪੰਜਵਾਂ ਜਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ। ਰਾਜਕੁਮਾਰ ਨਵਦੀਪ ਨੇ ਕੁੱਲ ਕਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ ਹਨ?"
answer = "ਰਾਜਕੁਮਾਰ ਮਨਦੀਪ ਨੇ ਰਾਜਕੁਮਾਰ ਹਰਜੀਤ ਨਾਲੋਂ ਤਿੰਨ ਚੌਥਾਈ ਜਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ, ਜਾਂ 100*3/4=<<100*3/4=75>>75 ਡਰੈਗਨ।\nਰਾਜਕੁਮਾਰ ਜਸਪ੍ਰੀਤ ਨੇ ਰਾਜਕੁਮਾਰ ਮਨਦੀਪ ਨਾਲੋਂ ਦੋ ਗੁਣਾ ਜਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ, ਜਾਂ 2*75=<<2*75=150>>150 ਡਰੈਗਨ।\nਰਾਜਕੁਮਾਰ ਨਵਦੀਪ ਨੇ ਰਾਜਕੁਮਾਰ ਜਸਪ੍ਰੀਤ ਨਾਲੋਂ ਇੱਕ ਪੰਜਵਾਂ ਜਿੰਨੇ ਡਰੈਗਨ ਮਾਰੇ, ਜਾਂ 150*1/5=<<150*1/5=30>>30 ਡਰੈਗਨ।\n#### 30"
