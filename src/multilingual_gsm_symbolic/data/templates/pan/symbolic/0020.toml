question = "ਹਰਜੀਤ ਬੁੱਧਵਾਰ ਨੂੰ 4 ਕੇਲਾ ਤੋੜਦਾ ਹੈ। ਫਿਰ ਉਹ ਵੀਰਵਾਰ ਨੂੰ 6 ਕੇਲਾ ਤੋੜਦਾ ਹੈ। ਸ਼ੁੱਕਰਵਾਰ ਨੂੰ, ਉਹ ਬੁੱਧਵਾਰ ਨੂੰ ਤੋੜੇ ਗਏ ਕੇਲਾ ਦੀ ਗਿਣਤੀ ਤੋਂ ਤਿੰਨ ਗੁਣਾ ਤੋੜਦਾ ਹੈ। ਹਰਜੀਤ ਕੋਲ ਕੁੱਲ ਕਿੰਨੇ ਕੇਲਾ ਹਨ?"
answer = "ਬੁੱਧਵਾਰ ਅਤੇ ਵੀਰਵਾਰ ਨੂੰ ਜੋੜਨ 'ਤੇ, ਹਰਜੀਤ ਕੋਲ 4 ਕੇਲਾ + 6 ਕੇਲਾ = <<4+6=10>>10 ਕੇਲਾ ਹਨ।\nਸ਼ੁੱਕਰਵਾਰ ਨੂੰ, ਉਹ 3*4 ਕੇਲਾ ਤੋੜਦਾ ਹੈ = <<3*4=12>>12 ਕੇਲਾ।\nਕੁੱਲ ਮਿਲਾ ਕੇ, ਹਰਜੀਤ ਕੋਲ 10 ਕੇਲਾ + 12 ਕੇਲਾ = <<10+12=22>>22 ਕੇਲਾ ਹਨ।\n#### 22"
