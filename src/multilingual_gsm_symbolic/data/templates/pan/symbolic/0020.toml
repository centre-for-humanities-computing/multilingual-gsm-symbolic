question_annotated = "{name,ਹਰਜੀਤ} {d1,ਬੁੱਧਵਾਰ} ਨੂੰ {n1,4} {fruit,ਕੇਲਾ} ਤੋੜਦਾ ਹੈ। ਫਿਰ ਉਹ {d2,ਵੀਰਵਾਰ} ਨੂੰ {n2,6} {fruit,ਕੇਲਾ} ਤੋੜਦਾ ਹੈ। {d3,ਸ਼ੁੱਕਰਵਾਰ} ਨੂੰ, ਉਹ {d1,ਬੁੱਧਵਾਰ} ਨੂੰ ਤੋੜੇ ਗਏ {fruit,ਕੇਲਾ} ਦੀ ਗਿਣਤੀ ਤੋਂ {mult_txt,ਤਿੰਨ} ਗੁਣਾ ਤੋੜਦਾ ਹੈ। {name,ਹਰਜੀਤ} ਕੋਲ ਕੁੱਲ ਕਿੰਨੇ {fruit,ਕੇਲਾ} ਹਨ?\n\n#init:\n- name = sample(names_male)\n- d1, d2, d3 = sample_sequential(weekdays, 3)\n- fruit = sample(fruits)\n- $n1 = range(30, 400)\n- $n2 = range(50, 400)\n- mult_txt, mult_val = range_str(2,6,1,numbers)\n\n#answer: n1 + n2 + mult_val * n1"
