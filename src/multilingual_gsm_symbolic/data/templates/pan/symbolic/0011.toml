question = "ਪੀਟਰ ਵੱਖ-ਵੱਖ ਆਕਾਰ ਦੇ ਬਰਫ਼ ਦੇ ਕਊਬ ਬਣਾਉਣਾ ਚਾਹੁੰਦਾ ਹੈ ਜਿਨ੍ਹਾਂ ਲਈ 32 ਔਂਸ ਪਾਣੀ ਦੀ ਲੋੜ ਹੈ। ਉਹ ਵੱਡੇ ਕਊਬ ਬਣਾ ਸਕਦਾ ਹੈ ਜੋ 4 ਔਂਸ ਪ੍ਰਤੀ ਕਊਬ ਵਰਤਦੇ ਹਨ, ਮੱਧਮ ਕਊਬ ਜੋ 2 ਔਂਸ ਵਰਤਦੇ ਹਨ, ਅਤੇ ਛੋਟੇ ਕਊਬ ਜੋ 1/2 ਔਂਸ ਵਰਤਦੇ ਹਨ। ਜੇਕਰ ਉਹ 3 ਵੱਡੇ ਕਊਬ, 7 ਮੱਧਮ ਕਊਬ, ਅਤੇ 8 ਛੋਟੇ ਕਊਬ ਬਣਾਉਂਦਾ ਹੈ, ਤਾਂ ਉਸ ਕੋਲ ਕਿੰਨੇ ਔਂਸ ਪਾਣੀ ਬਚਦਾ ਹੈ?"
