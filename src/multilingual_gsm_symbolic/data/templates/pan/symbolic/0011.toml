question = "ਹਰਜੀਤ 32 ਔਂਸ ਪਾਣੀ ਨਾਲ ਵੱਖ-ਵੱਖ ਆਕਾਰ ਦੇ ਬਰਫ਼ ਦੇ ਕਿਊਬ ਬਣਾਉਣਾ ਚਾਹੁੰਦਾ ਹੈ। ਉਹ ਵੱਡੇ ਕਿਊਬ ਬਣਾ ਸਕਦਾ ਹੈ ਜੋ 4 ਔਂਸ ਪ੍ਰਤੀ ਕਿਊਬ ਵਰਤਦੇ ਹਨ, ਦਰਮਿਆਨੇ ਕਿਊਬ ਜੋ 2 ਔਂਸ ਵਰਤਦੇ ਹਨ, ਅਤੇ ਛੋਟੇ ਕਿਊਬ ਜੋ 1/2 ਔਂਸ ਵਰਤਦੇ ਹਨ। ਜੇਕਰ ਉਹ 3 ਵੱਡੇ ਕਿਊਬ, 7 ਦਰਮਿਆਨੇ ਕਿਊਬ, ਅਤੇ 8 ਛੋਟੇ ਕਿਊਬ ਬਣਾਉਂਦਾ ਹੈ, ਤਾਂ ਉਸ ਕੋਲ ਕਿੰਨੇ ਔਂਸ ਪਾਣੀ ਬਚਦਾ ਹੈ?"
answer = "ਵੱਡੇ ਕਿਊਬਾਂ ਨੇ 12 ਔਂਸ ਪਾਣੀ ਦੀ ਵਰਤੋਂ ਕੀਤੀ ਕਿਉਂਕਿ 3 ਗੁਣਾ 4 ਬਰਾਬਰ <<3*4=12>>12 ਹੁੰਦਾ ਹੈ।\nਦਰਮਿਆਨੇ ਕਿਊਬਾਂ ਨੇ 14 ਔਂਸ ਪਾਣੀ ਦੀ ਵਰਤੋਂ ਕੀਤੀ ਕਿਉਂਕਿ 7 ਗੁਣਾ 2 ਬਰਾਬਰ <<7*2=14>>14 ਹੁੰਦਾ ਹੈ।\nਛੋਟੇ ਕਿਊਬਾਂ ਨੇ 4 ਔਂਸ ਪਾਣੀ ਦੀ ਵਰਤੋਂ ਕੀਤੀ ਕਿਉਂਕਿ 8 ਗੁਣਾ 1/2 ਬਰਾਬਰ 4 ਹੁੰਦਾ ਹੈ।\nਇਸਦਾ ਮਤਲਬ ਹੈ ਕਿ ਹਰਜੀਤ ਨੇ 30 ਔਂਸ ਪਾਣੀ ਦੀ ਵਰਤੋਂ ਕੀਤੀ ਹੈ ਕਿਉਂਕਿ 12 ਅਤੇ 14 ਅਤੇ 4 ਦਾ ਜੋੜ 30 ਹੁੰਦਾ ਹੈ।\nਹਰਜੀਤ ਕੋਲ 2 ਔਂਸ ਪਾਣੀ ਬਚਿਆ ਹੈ ਕਿਉਂਕਿ 32 ਵਿੱਚੋਂ 30 ਘਟਾਉਣ 'ਤੇ <<32-30=2>>2 ਬਚਦਾ ਹੈ।\n#### 2"
