question = "ਹਰਜੀਤ ਦੁਕਾਨ ਤੋਂ ਕੌਫੀ ਖਰੀਦਣ ਜਾਂਦਾ ਹੈ। ਉਹ ਆਮ ਤੌਰ 'ਤੇ ਕੌਫੀ $5 ਪ੍ਰਤੀ ਪਾਉਂਡ ਲੈਂਦਾ ਹੈ। ਕਿਉਂਕਿ ਉਸਦਾ ਪਸੰਦੀਦਾ ਬ੍ਰਾਂਡ ਖਤਮ ਹੋ ਗਿਆ ਸੀ, ਉਸਨੂੰ ਇੱਕ ਮਹਿੰਗਾ ਬ੍ਰਾਂਡ ਖਰੀਦਣਾ ਪਿਆ ਜੋ 20% ਮਹਿੰਗਾ ਹੈ। ਉਹ ਇੱਕ ਹਫ਼ਤੇ ਲਈ ਕੌਫੀ ਖਰੀਦਦਾ ਹੈ ਅਤੇ ਹਰ ਦਿਨ 1 ਪਾਉਂਡ ਕੌਫੀ ਵਰਤਦਾ ਹੈ। ਉਸਨੇ ਆਪਣੇ ਲਈ $2 ਦਾ ਇੱਕ ਡੋਨਟ ਵੀ ਖਰੀਦਿਆ। ਕੁੱਲ ਮਿਲਾ ਕੇ ਕਿੰਨਾ ਖਰਚਾ ਹੋਇਆ?"
answer = "ਕੌਫੀ ਦੀ ਕੀਮਤ 5 * 0.2 = $<<5*0.2=1>>1 ਪ੍ਰਤੀ ਪਾਉਂਡ ਵੱਧ ਗਈ।\nਇਸ ਲਈ ਨਵੀਂ ਕੀਮਤ 5 + 1 = $<<5+1=6>>6 ਪ੍ਰਤੀ ਪਾਉਂਡ ਬਣੀ।\nਉਹ ਇੱਕ ਹਫ਼ਤੇ ਵਿੱਚ 1 * 7 = <<1*7=7>>7 ਪਾਉਂਡ ਕੌਫੀ ਵਰਤਦਾ ਹੈ।\nਇਸ ਲਈ ਉਸਨੇ ਕੌਫੀ 'ਤੇ 6 * 7 = $<<6*7=42>>42 ਖਰਚੇ।\nਇਸ ਲਈ ਉਸਦਾ ਕੁੱਲ ਬਿੱਲ 42 + 2 = $<<42+2=44>>44 ਬਣਿਆ।\n#### 44"
