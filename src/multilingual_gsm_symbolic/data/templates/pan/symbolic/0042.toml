question_annotated = "{name,ਹਰਜੀਤ} ਦੁਕਾਨ ਤੋਂ {item,ਕੌਫੀ} ਖਰੀਦਣ ਜਾਂਦਾ ਹੈ। ਉਹ ਆਮ ਤੌਰ 'ਤੇ {item,ਕੌਫੀ} {cur,$}{price,5} ਪ੍ਰਤੀ {unit,ਪਾਉਂਡ} ਲੈਂਦਾ ਹੈ। ਕਿਉਂਕਿ ਉਸਦਾ ਪਸੰਦੀਦਾ ਬ੍ਰਾਂਡ ਖਤਮ ਹੋ ਗਿਆ ਸੀ, ਉਸਨੂੰ ਇੱਕ ਮਹਿੰਗਾ ਬ੍ਰਾਂਡ ਖਰੀਦਣਾ ਪਿਆ ਜੋ {percent,20}% ਮਹਿੰਗਾ ਹੈ। ਉਹ ਇੱਕ ਹਫ਼ਤੇ ਲਈ {item,ਕੌਫੀ} ਖਰੀਦਦਾ ਹੈ ਅਤੇ ਹਰ ਦਿਨ {usage,1} {unit,ਪਾਉਂਡ} {item,ਕੌਫੀ} ਵਰਤਦਾ ਹੈ। ਉਸਨੇ ਆਪਣੇ ਲਈ {cur,$}{extra_price,2} ਦਾ ਇੱਕ {extra_item,ਡੋਨਟ} ਵੀ ਖਰੀਦਿਆ। ਕੁੱਲ ਮਿਲਾ ਕੇ ਕਿੰਨਾ ਖਰਚਾ ਹੋਇਆ?\n\n#init:\n- name = sample(names_male)\n- item = sample([\"ਕੌਫੀ\", \"ਚਾਹ\", \"ਸ਼ੱਕਰ\", \"ਆਟਾ\"])\n- cur = sample(currencies_sym)\n- unit = sample([\"ਪਾਉਂਡ\", \"ਕਿਲੋਗ੍ਰਾਮ\"])\n- extra_item = sample([\"ਸਮੋਸਾ\", \"ਬਿਸਕੁਟ\", \"ਲੱਡੂ\"])\n- $price = range(3, 25)\n- $percent = range(10, 50, 5)\n- $usage = range(1, 3)\n- $extra_price = range(1, 5)\n\n#conditions:\n- is_int(price * percent / 100)\n\n#answer: (price + price * percent / 100) * 7 * usage + extra_price"
