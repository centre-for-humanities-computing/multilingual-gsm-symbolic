question = "ਜੇਕਰ ਗੁਰਪ੍ਰੀਤ 30 ਦਿਨਾਂ ਤੱਕ ਰੋਜ਼ 3 ਅੰਡੇ ਖਾਵੇ ਅਤੇ ਫਿਰ 30 ਦਿਨਾਂ ਤੱਕ ਇਸ ਨੂੰ ਵਧਾ ਕੇ ਰੋਜ਼ 5 ਅੰਡੇ ਕਰ ਦੇਵੇ, ਤਾਂ 60 ਦਿਨਾਂ ਲਈ ਗੁਰਪ੍ਰੀਤ ਨੂੰ ਕਿੰਨੇ ਦਰਜਨ ਅੰਡੇ ਚਾਹੀਦੇ ਹੋਣਗੇ?"
answer = "ਸ਼ੁਰੂ ਵਿੱਚ 30 ਦਿਨਾਂ ਤੱਕ ਰੋਜ਼ 3 ਅੰਡੇ ਖਾਣ ਨਾਲ ਕੁੱਲ 3*30 = <<3*30=90>>90 ਅੰਡੇ ਬਣਦੇ ਹਨ\nਫਿਰ 30 ਦਿਨਾਂ ਤੱਕ ਰੋਜ਼ 5 ਅੰਡੇ ਖਾਣ ਨਾਲ ਕੁੱਲ 5*30 = <<5*30=150>>150 ਅੰਡੇ ਬਣਦੇ ਹਨ\nਕੁੱਲ ਮਿਲਾ ਕੇ 90+150 = <<90+150=240>>240 ਅੰਡੇ ਖਾਧੇ ਜਾਣਗੇ\n1 ਦਰਜਨ ਵਿੱਚ 12 ਅੰਡੇ ਹੁੰਦੇ ਹਨ ਅਤੇ 240 ਅੰਡੇ ਖਾਧੇ ਜਾਣਗੇ, ਜੋ ਕਿ 240/12 = 20 ਦਰਜਨ ਅੰਡੇ ਹਨ\n#### 20"
