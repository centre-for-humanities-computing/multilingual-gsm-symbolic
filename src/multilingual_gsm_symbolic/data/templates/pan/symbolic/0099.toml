question_annotated = "ਜੇਕਰ {name,ਗੁਰਪ੍ਰੀਤ} {d1,30} ਦਿਨਾਂ ਤੱਕ ਰੋਜ਼ {n1,3} ਅੰਡੇ ਖਾਵੇ ਅਤੇ ਫਿਰ {d2,30} ਦਿਨਾਂ ਤੱਕ ਇਸ ਨੂੰ ਵਧਾ ਕੇ ਰੋਜ਼ {n2,5} ਅੰਡੇ ਕਰ ਦੇਵੇ, ਤਾਂ {d3,60} ਦਿਨਾਂ ਲਈ {name,ਗੁਰਪ੍ਰੀਤ} ਨੂੰ ਕਿੰਨੇ ਦਰਜਨ ਅੰਡੇ ਚਾਹੀਦੇ ਹੋਣਗੇ?\n\n#init:\n- name = sample(names)\n- $n1 = range(2, 6)\n- $n2 = range(4, 8)\n- $d1 = range(20, 110, 2)\n- $d2 = range(20, 110, 2)\n- $d3 = range(50, 200, 5)\n\n#conditions:\n- d3 == d1 + d2\n- n2 > n1\n- divides(n1*d1 + n2*d2, 12)\n\n#answer: (n1*d1 + n2*d2) // 12"
