question = "ਸ੍ਰੀ ਸੰਧੂ ਦੀ ਕਲਾਸ ਵਿੱਚ 30 ਵਿਦਿਆਰਥੀ ਹਨ। ਉਨ੍ਹਾਂ ਵਿੱਚੋਂ 20% ਫੁੱਟਬਾਲ ਖਿਡਾਰੀ ਹਨ। ਬਾਕੀ ਵਿਦਿਆਰਥੀਆਂ ਵਿੱਚੋਂ 25% ਚੀਅਰਲੀਡਰ ਜਾਂ ਬੈਂਡ ਮੈਂਬਰ ਹਨ। ਵਿਦਿਆਰਥੀਆਂ ਦੇ ਇਹਨਾਂ ਤਿੰਨਾਂ ਸਮੂਹਾਂ ਨੂੰ ਅੱਜ ਦੂਜੇ ਸਕੂਲ ਵਿੱਚ ਮੈਚ ਲਈ ਜਾਣ ਵਾਸਤੇ ਜਲਦੀ ਛੁੱਟੀ ਲੈਣੀ ਪਵੇਗੀ। ਕਿੰਨੇ ਵਿਦਿਆਰਥੀ ਜਲਦੀ ਜਾ ਰਹੇ ਹਨ?"
answer = "30 ਵਿਦਿਆਰਥੀਆਂ ਵਿੱਚੋਂ 20% ਫੁੱਟਬਾਲ ਖਿਡਾਰੀ ਹਨ, ਇਸ ਲਈ 0.2*30 = <<0.2*30=6>>6 ਵਿਦਿਆਰਥੀ ਹਨ।\nਬਾਕੀ 30 - 6 = <<30-6=24>>24 ਵਿਦਿਆਰਥੀ ਹਨ।\nਬਾਕੀ ਵਿੱਚੋਂ 25% ਚੀਅਰਲੀਡਰ ਜਾਂ ਬੈਂਡ ਮੈਂਬਰ ਹਨ, ਇਸ ਲਈ 0.25*24 = <<0.25*24=6>>6 ਵਿਦਿਆਰਥੀ ਹਨ।\nਫੁੱਟਬਾਲ ਖਿਡਾਰੀ ਅਤੇ ਚੀਅਰਲੀਡਰ/ਬੈਂਡ ਮੈਂਬਰ ਨੂੰ ਮਿਲਾ ਕੇ 6 + 6 = <<6+6=12>>12 ਵਿਦਿਆਰਥੀ ਹੁੰਦੇ ਹਨ ਜੋ ਜਲਦੀ ਜਾ ਰਹੇ ਹਨ।\n#### 12"
id_orig = 982
id_shuffled = 25
question_annotated = "{teacher,ਸ੍ਰੀ ਸੰਧੂ} ਦੀ ਕਲਾਸ ਵਿੱਚ {total,30} ਵਿਦਿਆਰਥੀ ਹਨ। ਉਨ੍ਹਾਂ ਵਿੱਚੋਂ {p1,20}% {group1,ਫੁੱਟਬਾਲ ਖਿਡਾਰੀ} ਹਨ। ਬਾਕੀ ਵਿਦਿਆਰਥੀਆਂ ਵਿੱਚੋਂ {p2,25}% {group2,ਚੀਅਰਲੀਡਰ} ਜਾਂ {group3,ਬੈਂਡ ਮੈਂਬਰ} ਹਨ। ਵਿਦਿਆਰਥੀਆਂ ਦੇ ਇਹਨਾਂ ਤਿੰਨਾਂ ਸਮੂਹਾਂ ਨੂੰ ਅੱਜ ਦੂਜੇ ਸਕੂਲ ਵਿੱਚ {event,ਮੈਚ} ਲਈ ਜਾਣ ਵਾਸਤੇ ਜਲਦੀ ਛੁੱਟੀ ਲੈਣੀ ਪਵੇਗੀ। ਕਿੰਨੇ ਵਿਦਿਆਰਥੀ ਜਲਦੀ ਜਾ ਰਹੇ ਹਨ?\n\n#init:\n- teacher = sample(['ਮੈਡਮ ਗਿੱਲ', 'ਸ੍ਰੀ ਬਰਾੜ', 'ਡਾ. ਧਾਲੀਵਾਲ', 'ਸ੍ਰੀਮਤੀ ਸਿੱਧੂ'])\n- group1 = sample(['ਹਾਕੀ ਖਿਡਾਰੀ', 'ਬਾਸਕਟਬਾਲ ਖਿਡਾਰੀ', 'ਵਾਲੀਬਾਲ ਖਿਡਾਰੀ', 'ਤੈਰਾਕ'])\n- group2, group3 = sample(['ਡਾਂਸਰ', 'ਗਾਇਕ ਮੰਡਲੀ ਦੇ ਮੈਂਬਰ', 'ਬਹਿਸ ਟੀਮ ਦੇ ਮੈਂਬਰ', 'ਰੋਬੋਟਿਕਸ ਕਲੱਬ ਦੇ ਮੈਂਬਰ'], 2)\n- event = sample(['ਮੁਕਾਬਲੇ', 'ਟੂਰਨਾਮੈਂਟ', 'ਪੇਸ਼ਕਾਰੀ', 'ਖੇਡ ਮੀਟ'])\n- $total = range(20, 150)\n- $p1 = range(10, 50)\n- $p2 = range(15, 45)\n\n#conditions:\n- p1 < 100\n- p2 < 100\n- is_int(total * p1 / 100)\n- is_int((total - total * p1 / 100) * p2 / 100)\n\n#answer: int(total * p1 / 100 + (total - total * p1 / 100) * p2 / 100)"
answer_annotated = "{total} ਵਿਦਿਆਰਥੀਆਂ ਵਿੱਚੋਂ {p1}% {group1} ਹਨ, ਇਸ ਲਈ {p1/100}*{total} = <<{p1/100}*{total}={int(total*p1/100)}>>{int(total*p1/100)} ਵਿਦਿਆਰਥੀ ਹਨ।\nਬਾਕੀ {total} - {int(total*p1/100)} = <<{total}-{int(total*p1/100)}={total-int(total*p1/100)}>>{total-int(total*p1/100)} ਵਿਦਿਆਰਥੀ ਹਨ।\nਬਾਕੀ ਵਿੱਚੋਂ {p2}% {group2} ਜਾਂ {group3} ਹਨ, ਇਸ ਲਈ {p2/100}*{total-int(total*p1/100)} = <<{p2/100}*{total-int(total*p1/100)}={int((total-int(total*p1/100))*p2/100)}>>{int((total-int(total*p1/100))*p2/100)} ਵਿਦਿਆਰਥੀ ਹਨ।\n{group1} ਅਤੇ {group2}/{group3} ਨੂੰ ਮਿਲਾ ਕੇ {int(total*p1/100)} + {int((total-int(total*p1/100))*p2/100)} = <<{int(total*p1/100)}+{int((total-int(total*p1/100))*p2/100)}={int(total*p1/100 + (total-int(total*p1/100))*p2/100)}>>{int(total*p1/100 + (total-int(total*p1/100))*p2/100)} ਵਿਦਿਆਰਥੀ ਹੁੰਦੇ ਹਨ ਜੋ ਜਲਦੀ ਜਾ ਰਹੇ ਹਨ।\n#### {int(total*p1/100 + (total-int(total*p1/100))*p2/100)}"
