question = "ਸ੍ਰੀ ਰੋਪਰ ਦੀ ਕਲਾਸ ਵਿੱਚ 30 ਵਿਦਿਆਰਥੀ ਹਨ। ਉਨ੍ਹਾਂ ਵਿੱਚੋਂ 20% ਫੁੱਟਬਾਲ ਖਿਡਾਰੀ ਹਨ। ਬਾਕੀ ਵਿਦਿਆਰਥੀਆਂ ਵਿੱਚੋਂ 25% ਚੀਅਰਲੀਡਰ ਜਾਂ ਬੈਂਡ ਦਾ ਹਿੱਸਾ ਹਨ। ਇਹ ਤਿੰਨੋਂ ਸਮੂਹ ਅੱਜ ਇੱਕ ਹੋਰ ਸਕੂਲ ਦੇ ਖੇਡ ਮੁਕਾਬਲੇ ਲਈ ਜਾ ਰਹੇ ਹਨ। ਕਿੰਨੇ ਵਿਦਿਆਰਥੀ ਜਾ ਰਹੇ ਹਨ?"
answer = "20% of 30 ਵਿਦਿਆਰਥੀ ਤੈਰਾਕ ਹਨ, ਇਸ ਲਈ 30 * 20/100 = <<30*20/100=6>>6 ਵਿਦਿਆਰਥੀ ਹਨ।\nਬਾਕੀ 30 - 6 = <<30-6=24>>24 ਵਿਦਿਆਰਥੀ ਹਨ।\nਬਾਕੀ ਵਿੱਚੋਂ 25% ਰੋਬੋਟਿਕਸ ਕਲੱਬ ਮੈਂਬਰ ਜਾਂ ਕੋਰਸ ਮੈਂਬਰ ਹਨ, ਇਸ ਲਈ 24 * 25/100 = <<24*25/100=6>>6 ਵਿਦਿਆਰਥੀ ਹਨ।\nਫੁੱਟਬਾਲ ਖਿਡਾਰੀਆਂ ਅਤੇ ਰੋਬੋਟਿਕਸ ਕਲੱਬ ਮੈਂਬਰ/ਕੋਰਸ ਮੈਂਬਰ ਨੂੰ ਮਿਲਾ ਕੇ 6 + 6 = <<6+6=12>>12 ਵਿਦਿਆਰਥੀ ਹੁੰਦੇ ਹਨ ਜੋ ਜਾ ਰਹੇ ਹਨ।\n#### 12\n"
