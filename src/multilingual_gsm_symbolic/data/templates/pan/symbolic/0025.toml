question = "ਸ੍ਰੀ ਰੋਪਰ ਦੀ ਕਲਾਸ ਵਿੱਚ 30 ਵਿਦਿਆਰਥੀ ਹਨ, 20% ਕਲਾਸ ਦੇ ਫੁੱਟਬਾਲ ਖਿਡਾਰੀ ਹਨ। ਬਾਕੀ ਬਚੀ ਕਲਾਸ ਵਿੱਚੋਂ, 25% ਵਿਦਿਆਰਥੀ ਚੀਅਰ ਲੀਡਰ ਹਨ ਜਾਂ ਬੈਂਡ ਦਾ ਹਿੱਸਾ ਹਨ। ਇਹਨਾਂ 3 ਸਮੂਹਾਂ ਦੇ ਵਿਦਿਆਰਥੀਆਂ ਨੂੰ ਅੱਜ ਜਲਦੀ ਛੁੱਟਣ ਦੀ ਲੋੜ ਹੈ ਤਾਂ ਜੋ ਉਹ ਦੂਜੀ ਥਾਂ ਵਾਲੇ ਖੇਡ ਮੁਕਾਬਲਾ ਲਈ ਜਾ ਸਕਣ। ਕਿੰਨੇ ਵਿਦਿਆਰਥੀ ਜਲਦੀ ਜਾ ਰਹੇ ਹਨ?"
answer = "20% 30 ਵਿਦਿਆਰਥੀਆਂ ਦੀ ਕਲਾਸ ਫੁੱਟਬਾਲ ਖਿਡਾਰੀ ਹਨ ਇਸ ਲਈ ਇਹ ਹੈ 0.2*30 = <<0.2*30=6>>6 ਵਿਦਿਆਰਥੀ\n30 ਵਿਦਿਆਰਥੀ ਹਨ ਅਤੇ 6 ਫੁੱਟਬਾਲ ਖਿਡਾਰੀ ਹਨ ਇਸ ਲਈ ਬਚਦੇ ਹਨ 30-6 = <<30-6=24>>24 ਵਿਦਿਆਰਥੀ\nਬਾਕੀ ਬਚੇ 24 ਵਿਦਿਆਰਥੀਆਂ ਵਿੱਚੋਂ 25% ਬੈਂਡ ਜਾਂ ਚੀਅਰ ਲੀਡਰ ਦਾ ਹਿੱਸਾ ਹਨ ਇਸ ਲਈ ਇਹ ਹੈ 0.25*24 = <<0.25*24=6>>6 ਵਿਦਿਆਰਥੀ\n6 ਵਿਦਿਆਰਥੀ ਫੁੱਟਬਾਲ ਖਿਡਾਰੀ ਹਨ ਅਤੇ 6 ਬੈਂਡ/ਚੀਅਰ ਲੀਡਰ ਦਾ ਹਿੱਸਾ ਹਨ ਇਸ ਲਈ 6+6 = <<6+6=12>>12 ਵਿਦਿਆਰਥੀ ਜਲਦੀ ਜਾਣਗੇ\n#### 12\n"
