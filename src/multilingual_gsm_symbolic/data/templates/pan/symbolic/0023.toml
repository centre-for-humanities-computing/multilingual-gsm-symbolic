question = "ਸੁਨੀਤਾ ਆਪਣੇ 3 ਪੋਤੇ-ਪੋਤੀਆਂ ਲਈ ਸਰਦੀਆਂ ਦੇ ਕੱਪੜੇ ਬੁਣ ਰਹੀ ਹੈ। ਉਹ ਤਿੰਨ ਜੌੜੇ ਹਨ, ਇਸ ਲਈ ਉਹ ਸਾਰੇ ਇੱਕੋ ਆਕਾਰ ਦੇ ਹਨ। ਉਹ ਹਰੇਕ ਲਈ ਇੱਕ ਟੋਪੀ, ਮਫ਼ਲਰ, ਸਵੈਟਰ, ਮਿਟਨਾਂ, ਅਤੇ ਜੁਰਾਬਾਂ ਬਣਾਉਣਾ ਚਾਹੁੰਦੀ ਹੈ। ਇੱਕ ਟੋਪੀ ਬਣਾਉਣ ਲਈ 2 ਉੱਨ ਦੀਆਂ ਲੱਛੀਆਂ ਲੱਗਦੀਆਂ ਹਨ, ਮਫ਼ਲਰ ਲਈ 4, ਸਵੈਟਰ ਲਈ 12, ਮਿਟਨਾਂ ਦੀ ਇੱਕ ਜੋੜੀ ਲਈ 1, ਅਤੇ ਜੁਰਾਬਾਂ ਦੀ ਇੱਕ ਜੋੜੀ ਲਈ 2। ਉਸਨੂੰ ਉੱਨ ਦੀਆਂ ਕਿੰਨੀਆਂ ਲੱਛੀਆਂ ਖਰੀਦਣੀਆਂ ਪੈਣਗੀਆਂ?"
answer = "ਹਰੇਕ ਬੱਚੇ ਲਈ ਪੂਰਾ ਸੈੱਟ ਬਣਾਉਣ ਲਈ ਲੋੜ ਪਵੇਗੀ 2 ਲੱਛੀਆਂ ਪ੍ਰਤੀ ਟੋਪੀ + 4 ਲੱਛੀਆਂ ਪ੍ਰਤੀ ਮਫ਼ਲਰ + 12 ਲੱਛੀਆਂ ਪ੍ਰਤੀ ਸਵੈਟਰ + 1 ਲੱਛੀਆਂ ਪ੍ਰਤੀ ਜੋੜੀ ਮਿਟਨਾਂ + 2 ਲੱਛੀਆਂ ਪ੍ਰਤੀ ਜੋੜੀ ਜੁਰਾਬਾਂ = <<2+4+12+1+2=21>>21 ਉੱਨ ਦੀਆਂ ਲੱਛੀਆਂ।\nਇਸ ਲਈ ਆਪਣੇ ਸਾਰੇ ਪੋਤੇ-ਪੋਤੀਆਂ ਲਈ ਕੱਪੜੇ ਬੁਣਨ ਲਈ, ਉਸਨੂੰ ਲੋੜ ਪਵੇਗੀ 3*21 = <<3*21=63>>63 ਉੱਨ ਦੀਆਂ ਲੱਛੀਆਂ।\n#### 63"
id_orig = 520
id_shuffled = 23
question_annotated = "{name,ਸੁਨੀਤਾ} ਆਪਣੇ {count,3} ਪੋਤੇ-ਪੋਤੀਆਂ ਲਈ ਸਰਦੀਆਂ ਦੇ ਕੱਪੜੇ ਬੁਣ ਰਹੀ ਹੈ। ਉਹ {children,ਤਿੰਨ ਜੌੜੇ} ਹਨ, ਇਸ ਲਈ ਉਹ ਸਾਰੇ ਇੱਕੋ ਆਕਾਰ ਦੇ ਹਨ। ਉਹ ਹਰੇਕ ਲਈ ਇੱਕ {c1,ਟੋਪੀ}, {c2,ਮਫ਼ਲਰ}, {c3,ਸਵੈਟਰ}, {c4,ਮਿਟਨਾਂ}, ਅਤੇ {c5,ਜੁਰਾਬਾਂ} ਬਣਾਉਣਾ ਚਾਹੁੰਦੀ ਹੈ। ਇੱਕ {c1,ਟੋਪੀ} ਬਣਾਉਣ ਲਈ {n1,2} ਉੱਨ ਦੀਆਂ ਲੱਛੀਆਂ ਲੱਗਦੀਆਂ ਹਨ, {c2,ਮਫ਼ਲਰ} ਲਈ {n2,4}, {c3,ਸਵੈਟਰ} ਲਈ {n3,12}, {c4,ਮਿਟਨਾਂ} ਦੀ ਇੱਕ ਜੋੜੀ ਲਈ {n4,1}, ਅਤੇ {c5,ਜੁਰਾਬਾਂ} ਦੀ ਇੱਕ ਜੋੜੀ ਲਈ {n5,2}। ਉਸਨੂੰ ਉੱਨ ਦੀਆਂ ਕਿੰਨੀਆਂ ਲੱਛੀਆਂ ਖਰੀਦਣੀਆਂ ਪੈਣਗੀਆਂ?\n\n#init:\n- name = sample(names_female)\n- c1, c2, c3 = sample([\"ਸਵੈਟਰ\", \"ਸ਼ਾਲ\", \"ਟੋਪੀ\", \"ਕਾਰਡੀਗਨ\", \"ਪੋਂਚੋ\", \"ਵੈਸਟ\", \"ਬੀਨੀ\", \"ਟੂਨਿਕ\"],3)\n- c4, c5 = sample([ \"ਮਿਟਨਾਂ\", \"ਉੱਨ ਦੇ ਬੂਟ\", \"ਜੁਰਾਬਾਂ\", \"ਲੈੱਗ ਵਾਰਮਰ\", \"ਦਸਤਾਨੇ\"], 2)\n- n1, n2, n3, n4, n5 = sample(range_list(3, 19), 5)\n- children, count = sample([(\"ਜੌੜੇ\",2), (\"ਤਿੰਨ ਜੌੜੇ\",3), (\"ਚਾਰ ਜੌੜੇ\", 4), (\"ਪੰਜ ਜੌੜੇ\", 5)])\n\n#answer: count*(n1+n2+n3+n4+n5)"
answer_annotated = "ਹਰੇਕ ਬੱਚੇ ਲਈ ਪੂਰਾ ਸੈੱਟ ਬਣਾਉਣ ਲਈ ਲੋੜ ਪਵੇਗੀ {n1} ਲੱਛੀਆਂ ਪ੍ਰਤੀ {c1} + {n2} ਲੱਛੀਆਂ ਪ੍ਰਤੀ {c2} + {n3} ਲੱਛੀਆਂ ਪ੍ਰਤੀ {c3} + {n4} ਲੱਛੀਆਂ ਪ੍ਰਤੀ ਜੋੜੀ {c4} + {n5} ਲੱਛੀਆਂ ਪ੍ਰਤੀ ਜੋੜੀ {c5} = <<{n1}+{n2}+{n3}+{n4}+{n5}={n1+n2+n3+n4+n5}>>{n1+n2+n3+n4+n5} ਉੱਨ ਦੀਆਂ ਲੱਛੀਆਂ।\nਇਸ ਲਈ ਆਪਣੇ ਸਾਰੇ ਪੋਤੇ-ਪੋਤੀਆਂ ਲਈ ਕੱਪੜੇ ਬੁਣਨ ਲਈ, ਉਸਨੂੰ ਲੋੜ ਪਵੇਗੀ {count}*{n1+n2+n3+n4+n5} = <<{count}*{n1+n2+n3+n4+n5}={count*(n1+n2+n3+n4+n5)}>>{count*(n1+n2+n3+n4+n5)} ਉੱਨ ਦੀਆਂ ਲੱਛੀਆਂ।\n#### {count*(n1+n2+n3+n4+n5)}"
