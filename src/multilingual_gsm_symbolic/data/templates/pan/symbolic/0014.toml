question = "ਅਮਨ ਨੇ 100 ਫੀਸਦੀ ਚਾਰਜ ਵਾਲਾ ਫ਼ੋਨ 4 ਘੰਟੇ ਵਰਤਿਆ। ਹਰ ਘੰਟੇ 15 ਫੀਸਦੀ ਘਟਦੇ ਹਨ। ਬਚੀ ਚਾਰਜ ਕਿੰਨੀ ਹੈ?"
answer = "4 ਘੰਟਿਆਂ ਵਿੱਚ 15 ਫੀਸਦੀ x 4 = 60 ਫੀਸਦੀ ਚਾਰਜ ਘਟਿਆ।\n100 - 60 = <<100-60=40>>40 ਫੀਸਦੀ ਚਾਰਜ ਬਚੀ।\n#### 40\n"
