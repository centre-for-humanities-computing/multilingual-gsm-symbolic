question = "ਗੁਰਪ੍ਰੀਤ ਅਤੇ ਹਰਜੀਤ ਕੋਲ ਇਕੱਠੇ ਪੈਦਲ ਸਕੂਲ ਪਹੁੰਚਣ ਲਈ 30 ਮਿੰਟ ਹਨ। ਉਸ ਮੋੜ ਤੱਕ ਪਹੁੰਚਣ ਵਿੱਚ, ਜਿੱਥੇ ਲਾਇਬ੍ਰੇਰੀ ਹੈ, ਉਹਨਾਂ ਨੂੰ 6 ਮਿੰਟ ਲੱਗਦੇ ਹਨ। ਉਹਨਾਂ ਨੂੰ ਫਾਇਰ ਸਟੇਸ਼ਨ ਤੱਕ ਪਹੁੰਚਣ ਵਿੱਚ ਹੋਰ 13 ਮਿੰਟ ਲੱਗਦੇ ਹਨ। ਦੇਰ ਹੋਏ ਬਿਨਾਂ ਸਕੂਲ ਪਹੁੰਚਣ ਲਈ ਉਹਨਾਂ ਕੋਲ ਹੋਰ ਕਿੰਨਾ ਸਮਾਂ ਬਾਕੀ ਹੈ?"
