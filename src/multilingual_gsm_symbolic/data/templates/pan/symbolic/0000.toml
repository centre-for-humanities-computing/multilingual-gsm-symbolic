question_annotated = "{n, Benny} ਨੇ {x,10}-ਫੁੱਟ ਲੰਬੀ ਇੱਕ {big_fish,ਸ਼ਾਰਕ} ਦੇਖੀ, ਜਿਸ ਨਾਲ {k,2} {y,6}-ਇੰਚ ਲੰਬੇ ਰੇਮੋਰਾ ਜੁੜੇ ਹੋਏ ਸਨ। ਰੇਮੋਰਾ ਦੀ ਕੁੱਲ ਲੰਬਾਈ {big_fish,ਸ਼ਾਰਕ} ਦੇ ਸਰੀਰ ਦੀ ਲੰਬਾਈ ਦਾ ਕਿੰਨਾ ਪ੍ਰਤੀਸ਼ਤ ਹੈ?\n\n#init:\n- n = sample(names)\n- big_fish = sample([\"ਡਾਲਫਿਨ\", \"ਵੇਲ\", \"ਸ਼ਾਰਕ\"])\n- $x = range(10, 500, 10)\n- $k = range(2, 10)\n- $y = range(2, 100)\n\n#conditions:\n- k * y < x * 12\n- divides(k*y,12)\n- divides(x * 12, k*y)\n- divides(100, x * 12 / (k*y))\n\n#answer: int((k * y)/ (x * 12) * 100)\n"
answer_annotated = "ਪਹਿਲਾਂ, ਇੰਚਾਂ ਵਿੱਚ ਰੇਮੋਰਾ ਦੀ ਕੁੱਲ ਲੰਬਾਈ ਲੱਭੋ: {y} ਇੰਚ/ਰੇਮੋਰਾ * {k} ਰੇਮੋਰਾ = <<{y}*{k}={k*y}>>{k*y} ਇੰਚ।\nਫਿਰ ਇਸਨੂੰ ਫੁੱਟਾਂ ਵਿੱਚ ਬਦਲਣ ਲਈ 12 ਨਾਲ ਵੰਡੋ: {k*y} ਇੰਚ / 12 ਇੰਚ/ਫੁੱਟ = <<{k*y}/12={k*y//12}>>{k*y//12} ਫੁੱਟ।\nਫਿਰ ਕੁੱਲ ਰੇਮੋਰਾ ਲੰਬਾਈ (ਫੁੱਟਾਂ ਵਿੱਚ) ਨੂੰ {big_fish} ਦੀ ਲੰਬਾਈ ਨਾਲ ਵੰਡੋ ਅਤੇ ਪ੍ਰਤੀਸ਼ਤ ਕੱਢਣ ਲਈ 100% ਨਾਲ ਗੁਣਾ ਕਰੋ: {k*y//12} ਫੁੱਟ / {x} ਫੁੱਟ * 100% = {int(k*y/(12*x)*100)}%\n\n#### {int(k*y/(12*x)*100)}\n"
