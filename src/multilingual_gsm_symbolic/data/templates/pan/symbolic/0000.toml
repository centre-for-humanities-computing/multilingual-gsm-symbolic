question = "Benny ਨੇ 10-ਫੁੱਟ ਲੰਬੀ ਇੱਕ ਸ਼ਾਰਕ ਦੇਖੀ, ਜਿਸ ਨਾਲ 2 6-ਇੰਚ ਲੰਬੇ ਰੇਮੋਰਾ ਜੁੜੇ ਹੋਏ ਸਨ। ਰੇਮੋਰਾ ਦੀ ਕੁੱਲ ਲੰਬਾਈ ਸ਼ਾਰਕ ਦੇ ਸਰੀਰ ਦੀ ਲੰਬਾਈ ਦਾ ਕਿੰਨਾ ਪ੍ਰਤੀਸ਼ਤ ਹੈ?"
answer = "ਪਹਿਲਾਂ, ਇੰਚਾਂ ਵਿੱਚ ਰੇਮੋਰਾ ਦੀ ਕੁੱਲ ਲੰਬਾਈ ਲੱਭੋ: 6 ਇੰਚ/ਰੇਮੋਰਾ * 2 ਰੇਮੋਰਾ = <<6*2=12>>12 ਇੰਚ।\nਫਿਰ ਇਸਨੂੰ ਫੁੱਟਾਂ ਵਿੱਚ ਬਦਲਣ ਲਈ 12 ਨਾਲ ਵੰਡੋ: 12 ਇੰਚ / 12 ਇੰਚ/ਫੁੱਟ = <<12/12=1>>1 ਫੁੱਟ।\nਫਿਰ ਕੁੱਲ ਰੇਮੋਰਾ ਲੰਬਾਈ (ਫੁੱਟਾਂ ਵਿੱਚ) ਨੂੰ ਸ਼ਾਰਕ ਦੀ ਲੰਬਾਈ ਨਾਲ ਵੰਡੋ ਅਤੇ ਪ੍ਰਤੀਸ਼ਤ ਕੱਢਣ ਲਈ 100% ਨਾਲ ਗੁਣਾ ਕਰੋ: 1 ਫੁੱਟ / 10 ਫੁੱਟ * 100% = 10%\n\n#### 10\n"
id_orig = 473
