question = "ਰਾਫ਼ੇਲ ਸਕੂਲ ਦਾ ਸਮਾਨ ਖਰੀਦਣ ਗਿਆ ਸੀ। ਉਸਨੇ 4 ਕਲਮਾਂ ਖਰੀਦੀਆਂ ਜਿਨ੍ਹਾਂ ਦੀ ਕੀਮਤ ₹1.5 ਪ੍ਰਤੀ ਸੀ, 2 ਖਾਤਿਆਂ ਜਿਨ੍ਹਾਂ ਦੀ ਕੀਮਤ ₹4 ਪ੍ਰਤੀ ਸੀ, ਅਤੇ ਬਾਈਂਡ ਪੇਪਰ ਦੀ ਇੱਕ ਰਿਮ ਜਿਸ ਦੀ ਕੀਮਤ ₹20 ਸੀ। ਰਾਫ਼ੇਲ ਨੇ ਕੁੱਲ ਕੀ ਖਰਚ ਕੀਤਾ?"
