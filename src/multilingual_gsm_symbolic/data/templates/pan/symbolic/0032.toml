question = "ਸ਼੍ਰੀਮਤੀ ਸਿੱਧੂ ਇੱਕ ਘਰ ਲੱਭ ਰਹੀ ਹੈ ਜਿਸ ਦੀ ਕੀਮਤ ਉਸ ਦੇ $400,000 ਦੇ ਬਜਟ ਤੋਂ ਵੱਧ ਨਾ ਹੋਵੇ। ਉਸਨੇ ਇੱਕ ਪ੍ਰਾਪਰਟੀ ਦੇਖੀ ਜਿਸਦਾ ਵਿਕਰੀ ਮੁੱਲ $350,000 ਹੈ। ਇਸ ਤੋਂ ਇਲਾਵਾ, ਖਰੀਦਦਾਰ ਨੂੰ ਵਿਕਰੀ ਮੁੱਲ ਦਾ 5% ਬਰੋਕਰੇਜ਼ ਫੀਸ ਦੇਣੀ ਪੈਂਦੀ ਹੈ, ਅਤੇ ਵਿਕਰੀ ਮੁੱਲ ਦਾ 12% ਟ੍ਰਾਂਸਫਰ ਫੀਸ ਵੀ। ਘਰ ਦਾ ਕੁੱਲ ਮੁੱਲ ਸ਼੍ਰੀਮਤੀ ਸਿੱਧੂ ਦੇ ਬਜਟ ਤੋਂ ਕਿੰਨਾ ਵੱਧ ਹੈ?"
answer = "ਬਰੋਕਰੇਜ਼ ਫੀਸ $350,000*5/100 = $<<350000*5/100=17500>>17,500 ਹੈ।\nਟ੍ਰਾਂਸਫਰ ਫੀਸ $350,000*12/100 = $<<350000*12/100=42000>>42,000 ਹੈ।\nਘਰ ਦਾ ਕੁੱਲ ਮੁੱਲ $350,000 + $17,500 + $42,000 = $409,500 ਹੈ।\nਇਸ ਲਈ, ਇਹ $409,500 - $400,000 = $<<409500-400000=9500>>9500 ਸ਼੍ਰੀਮਤੀ ਸਿੱਧੂ ਦੇ ਬਜਟ ਤੋਂ ਵੱਧ ਹੈ।\n#### 9500"
