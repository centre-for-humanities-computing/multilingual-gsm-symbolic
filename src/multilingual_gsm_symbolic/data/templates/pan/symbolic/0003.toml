question = "50 ਵਿਦਿਆਰਥੀਆਂ ਦੀ ਇੱਕ ਕਲਾਸ ਵਿੱਚ ਵੱਖ-ਵੱਖ ਸ਼ੌਕ ਹਨ। 10 ਨੂੰ ਕੇਕ ਬੇਕ ਕਰਨਾ ਪਸੰਦ ਹੈ, 5 ਨੂੰ ਬਾਸਕਟਬਾਲ ਖੇਡਣਾ ਪਸੰਦ ਹੈ, ਅਤੇ ਬਾਕੀ ਜਾਂ ਤਾਂ ਵੀਡੀਓ ਗੇਮਾਂ ਖੇਡਣਾ ਜਾਂ ਸੰਗੀਤ ਵਜਾਉਣਾ ਪਸੰਦ ਕਰਦੇ ਹਨ। ਜੇ ਸੰਗੀਤ ਵਜਾਉਣਾ ਪਸੰਦ ਕਰਨ ਵਾਲਿਆਂ ਦੀ ਗਿਣਤੀ ਬਾਸਕਟਬਾਲ ਖੇਡਣਾ ਪਸੰਦ ਕਰਨ ਵਾਲਿਆਂ ਦੀ ਗਿਣਤੀ ਤੋਂ ਦੁੱਗਣੀ ਹੈ, ਤਾਂ ਕਿੰਨੇ ਵਿਦਿਆਰਥੀ ਵੀਡੀਓ ਗੇਮਾਂ ਖੇਡਣਾ ਪਸੰਦ ਕਰਦੇ ਹਨ?"
answer = "ਸੰਗੀਤ ਵਜਾਉਣਾ ਪਸੰਦ ਕਰਨ ਵਾਲੇ ਵਿਦਿਆਰਥੀਆਂ ਦੀ ਗਿਣਤੀ ਬਾਸਕਟਬਾਲ ਪਸੰਦ ਕਰਨ ਵਾਲਿਆਂ ਨਾਲੋਂ ਦੁੱਗਣੀ ਹੈ, ਇਸ ਲਈ 2 * 5 = <<2*5=10>>10\nਵੀਡੀਓ ਗੇਮਾਂ ਖੇਡਣਾ ਪਸੰਦ ਕਰਨ ਵਾਲਿਆਂ ਦੀ ਗਿਣਤੀ ਹੈ: 50 ਕੁੱਲ ਵਿਦਿਆਰਥੀ - 10 ਜਿਨ੍ਹਾਂ ਨੂੰ ਕੇਕ ਬੇਕ ਕਰਨਾ ਪਸੰਦ ਹੈ - 5 ਜਿਨ੍ਹਾਂ ਨੂੰ ਬਾਸਕਟਬਾਲ ਪਸੰਦ ਹੈ - 10 ਜਿਨ੍ਹਾਂ ਨੂੰ ਸੰਗੀਤ ਵਜਾਉਣਾ ਪਸੰਦ ਹੈ = <<50-10-5-10=25>>25\n#### 25\n"
