question = "ਸਮੁੰਦਰ ਵੱਲੋਂ ਆ ਰਹੀ ਧੁੰਦ ਸ਼ਹਿਰ ਉੱਤੇ ਛਾ ਰਹੀ ਹੈ। ਇਹ ਹਰ 3 ਮੀਲ ਖੇਤਰ ਨੂੰ ਢੱਕਣ ਵਿੱਚ 10 ਮਿੰਟ ਲਗਾਉਂਦੀ ਹੈ। ਜੇ ਸ਼ਹਿਰ ਸਮੁੰਦਰ ਦੇ ਕਿਨਾਰੇ ਤੋਂ ਅੰਦਰੂਨੀ ਹਿੱਸੇ ਤੱਕ 42 ਮੀਲ ਚੌੜਾ ਹੈ, ਤਾਂ ਧੁੰਦ ਨੂੰ ਪੂਰੇ ਸ਼ਹਿਰ ਉੱਤੇ ਛਾਉਣ ਵਿੱਚ ਕਿੰਨਾ ਸਮਾਂ ਲੱਗੇਗਾ?"
