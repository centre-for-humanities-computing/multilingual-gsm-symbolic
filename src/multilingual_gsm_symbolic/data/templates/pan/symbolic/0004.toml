question_annotated = "{name,ਗੁਰਪ੍ਰੀਤ} ਸਨੈਕ ਲਈ ਪੌਪਕਾਰਨ ਬਣਾ ਰਹੇ ਹਨ। ਜਿਵੇਂ-ਜਿਵੇਂ ਮੱਕੀ ਵਾਲੀ {p,ਕੜਾਹੀ} ਗਰਮ ਹੁੰਦੀ ਹੈ, ਦਾਣੇ ਤੇਜ਼ੀ ਨਾਲ ਪੌਪ ਹੋਣੇ ਸ਼ੁਰੂ ਹੋ ਜਾਂਦੇ ਹਨ। ਪਹਿਲੇ {s, 30} ਸਕਿੰਟਾਂ ਵਿੱਚ {n,20} ਦਾਣੇ ਪੌਪ ਹੁੰਦੇ ਹਨ, ਫਿਰ ਅਗਲੇ {s, 30} ਸਕਿੰਟਾਂ ਵਿੱਚ ਇਹ ਗਿਣਤੀ {k_2_txt,ਤਿੰਨ} ਗੁਣਾ ਹੋ ਜਾਂਦੀ ਹੈ। ਅਗਲੇ {s, 30} ਸਕਿੰਟਾਂ ਵਿੱਚ ਦਾਣੇ ਪੌਪ ਹੋਣ ਦੀ ਦਰ ਸ਼ੁਰੂਆਤੀ ਦਰ ਤੋਂ {k_3_txt,ਚਾਰ} ਗੁਣਾ ਹੋ ਜਾਂਦੀ ਹੈ, ਪਰ ਆਖਰੀ {s, 30} ਸਕਿੰਟਾਂ ਵਿੱਚ ਪੌਪ ਹੋਣ ਦੀ ਦਰ ਪਿਛਲੇ {s, 30} ਸਕਿੰਟਾਂ ਦੇ ਮੁਕਾਬਲੇ ਅੱਧੀ ਰਹਿ ਜਾਂਦੀ ਹੈ। {name,ਗੁਰਪ੍ਰੀਤ} ਵੱਲੋਂ {p,ਕੜਾਹੀ} ਨੂੰ ਅੱਗ ਤੋਂ ਉਤਾਰਨ ਤੋਂ ਬਾਅਦ, ਆਖਰੀ {s, 30} ਸਕਿੰਟਾਂ ਵਿੱਚ ਪੌਪ ਹੋਏ ਦਾਣਿਆਂ ਦੀ ਗਿਣਤੀ ਦਾ ਚੌਥਾ ਹਿੱਸਾ ਹੋਰ ਦਾਣੇ ਬਚੀ ਹੋਈ ਗਰਮੀ ਕਾਰਨ ਪੌਪ ਹੋ ਜਾਂਦੇ ਹਨ। {name,ਗੁਰਪ੍ਰੀਤ} ਕੋਲ ਖਾਣ ਲਈ ਪੌਪਕਾਰਨ ਦੇ ਕਿੰਨੇ ਦਾਣੇ ਹਨ?\n\n#init:\n- name = sample(names)\n- p = sample(['ਕੜਾਹੀ', 'ਪਤੀਲੀ', 'ਦੇਗਚੀ'])\n- $n = range(10, 101, 10)\n- $s = range(10, 31, 2)\n- k_2_txt, k_2_val = range_str(2, 5, 1, numbers)\n- k_3_txt, k_3_val = range_str(3, 8, 1, numbers)\n\n#conditions:\n- k_3_val > k_2_val\n- divides(k_3_val * n, 8)\n\n#answer: n + (k_2_val * n + k_3_val * n) + (k_3_val * n // 2) + (k_3_val * n // 8)"
