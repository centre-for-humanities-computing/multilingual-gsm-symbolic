question = "ਗੁਰਪ੍ਰੀਤ ਸਨੈਕ ਲਈ ਪੌਪਕਾਰਨ ਬਣਾ ਰਹੇ ਹਨ। ਜਿਵੇਂ-ਜਿਵੇਂ ਮੱਕੀ ਵਾਲੀ ਕੜਾਹੀ ਗਰਮ ਹੁੰਦੀ ਹੈ, ਦਾਣੇ ਤੇਜ਼ੀ ਨਾਲ ਪੌਪ ਹੋਣੇ ਸ਼ੁਰੂ ਹੋ ਜਾਂਦੇ ਹਨ। ਪਹਿਲੇ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ 20 ਦਾਣੇ ਪੌਪ ਹੁੰਦੇ ਹਨ, ਫਿਰ ਅਗਲੇ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ ਇਹ ਗਿਣਤੀ ਤਿੰਨ ਗੁਣਾ ਹੋ ਜਾਂਦੀ ਹੈ। ਅਗਲੇ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ ਦਾਣੇ ਪੌਪ ਹੋਣ ਦੀ ਦਰ ਸ਼ੁਰੂਆਤੀ ਦਰ ਤੋਂ ਚਾਰ ਗੁਣਾ ਹੋ ਜਾਂਦੀ ਹੈ, ਪਰ ਆਖਰੀ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ ਪੌਪ ਹੋਣ ਦੀ ਦਰ ਪਿਛਲੇ 30 ਸਕਿੰਟਾਂ ਦੇ ਮੁਕਾਬਲੇ ਅੱਧੀ ਰਹਿ ਜਾਂਦੀ ਹੈ। ਗੁਰਪ੍ਰੀਤ ਵੱਲੋਂ ਕੜਾਹੀ ਨੂੰ ਅੱਗ ਤੋਂ ਉਤਾਰਨ ਤੋਂ ਬਾਅਦ, ਆਖਰੀ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ ਪੌਪ ਹੋਏ ਦਾਣਿਆਂ ਦੀ ਗਿਣਤੀ ਦਾ ਚੌਥਾ ਹਿੱਸਾ ਹੋਰ ਦਾਣੇ ਬਚੀ ਹੋਈ ਗਰਮੀ ਕਾਰਨ ਪੌਪ ਹੋ ਜਾਂਦੇ ਹਨ। ਗੁਰਪ੍ਰੀਤ ਕੋਲ ਖਾਣ ਲਈ ਪੌਪਕਾਰਨ ਦੇ ਕਿੰਨੇ ਦਾਣੇ ਹਨ?"
answer = "ਪਕਾਉਣ ਦੇ ਦੂਜੇ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ, 3*20=<<3*20=60>>60 ਦਾਣੇ ਪੌਪ ਹੁੰਦੇ ਹਨ।\nਤੀਜੇ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ, 4*20=<<4*20=80>>80 ਦਾਣੇ ਪੌਪ ਹੁੰਦੇ ਹਨ।\nਆਖਰੀ 30 ਸਕਿੰਟਾਂ ਵਿੱਚ, 80 / 2 = <<80/2=40>>40 ਦਾਣੇ ਪੌਪ ਹੁੰਦੇ ਹਨ।\nਪਕਾਉਣ ਤੋਂ ਬਾਅਦ, ਬਚੀ ਹੋਈ ਗਰਮੀ ਨਾਲ 40 / 4 = <<40/4=10>>10 ਦਾਣੇ ਪੌਪ ਹੁੰਦੇ ਹਨ।\nਇਸ ਤਰ੍ਹਾਂ, ਗੁਰਪ੍ਰੀਤ ਕੋਲ ਖਾਣ ਲਈ 20 + 60 + 80 + 40 + 10 = <<20+60+80+40+10=210>>210 ਪੌਪਕਾਰਨ ਦੇ ਦਾਣੇ ਹਨ।\n#### 210"
