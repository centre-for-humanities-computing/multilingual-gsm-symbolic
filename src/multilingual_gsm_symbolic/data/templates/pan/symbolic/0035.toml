question = "ਜੌਨ ਇੱਕ ਸਕੂਲੀ ਟ੍ਰਿਪ ਲਈ ਪੈਸਾ ਜੋੜ ਰਿਹਾ ਹੈ। ਉਸਦੀ ਸਕੂਲ ਉਸਦੀ ਸਕੂਲੀ ਟ੍ਰਿਪ ਦੇ ਖਰਚੇ ਦਾ ਅੱਧਾ ਹਿੱਸਾ ਭਰਦੀ ਹੈ। ਜੇਕਰ ਉਸ ਕੋਲ $50 ਹਨ ਅਤੇ ਸਕੂਲੀ ਟ੍ਰਿਪ ਦੀ ਕੁੱਲ ਕੀਮਤ $300 ਹੈ, ਤਾਂ ਉਸਨੂੰ ਹੋਰ ਕਿੰਨਾ ਪੈਸਾ ਚਾਹੀਦਾ ਹੈ?"
answer = "ਜੌਨ ਦੇ ਸਕੂਲ ਨੇ ਸਕੂਲੀ ਟ੍ਰਿਪ ਦੀ ਲਾਗਤ ਦਾ ਅੱਧਾ ਹਿੱਸਾ ਭਰਨ ਦਾ ਫ਼ੈਸਲਾ ਕੀਤਾ ਹੈ, ਇਸ ਲਈ ਉਹ 300 * 1/2 = $<<300*1/2=150>>150 ਭਰਣਗੇ।\nਕੁੱਲ ਮਿਲਾ ਕੇ, ਜੌਨ ਨੇ 150 + 50 = $<<150+50=200>>200 ਭਰੇ ਹਨ ਸਕੂਲੀ ਟ੍ਰਿਪ ਲਈ।\nਇਸ ਲਈ, ਜੌਨ ਨੂੰ 300 - 200 = $<<300-200=100>>100 ਹੋਰ ਚਾਹੀਦਾ ਹੈ।\n#### 100\n"
