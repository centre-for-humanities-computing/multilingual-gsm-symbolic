question = "ਹਰਜੀਤ ਇੱਕ ਸਕੂਲੀ ਟ੍ਰਿਪ ਲਈ ਪੈਸੇ ਜੋੜ ਰਿਹਾ ਹੈ। ਉਸ ਨੇ ਸਕੂਲ ਤੋਂ ਮਦਦ ਮੰਗੀ ਹੈ, ਜਿਸ ਨੇ ਸਕੂਲੀ ਟ੍ਰਿਪ ਦੇ ਖਰਚੇ ਦਾ ਅੱਧਾ ਹਿੱਸਾ ਭਰਨ ਦਾ ਫ਼ੈਸਲਾ ਕੀਤਾ ਹੈ। ਜੇ ਉਸ ਕੋਲ $50 ਹਨ ਅਤੇ ਸਕੂਲੀ ਟ੍ਰਿਪ ਦਾ ਕੁੱਲ ਖਰਚਾ $300 ਹੈ, ਤਾਂ ਉਸਨੂੰ ਹੋਰ ਕਿੰਨੇ ਪੈਸੇ ਚਾਹੀਦੇ ਹਨ?"
answer = "ਸਕੂਲ ਨੇ ਸਕੂਲੀ ਟ੍ਰਿਪ ਲਈ 300*1/2 = $<<300*1/2=150>>150 ਭਰਨ ਦਾ ਫ਼ੈਸਲਾ ਕੀਤਾ ਹੈ।\nਕੁੱਲ ਮਿਲਾ ਕੇ, ਸਕੂਲੀ ਟ੍ਰਿਪ ਲਈ ਹਰਜੀਤ ਕੋਲ 150 + 50 = $<<150+50=200>>200 ਦਾ ਇੰਤਜ਼ਾਮ ਹੋ ਗਿਆ ਹੈ।\nਇਸ ਲਈ, ਹਰਜੀਤ ਨੂੰ ਸਕੂਲੀ ਟ੍ਰਿਪ ਲਈ 300 - 200 = $<<300-200=100>>100 ਹੋਰ ਚਾਹੀਦੇ ਹਨ।\n#### 100"
