question_annotated = "{name,ਜੌਨ} ਇੱਕ {event,ਸਕੂਲੀ ਟ੍ਰਿਪ} ਲਈ ਪੈਸਾ ਜੋੜ ਰਿਹਾ ਹੈ। ਉਸਦੀ {organization,ਸਕੂਲ} ਉਸਦੀ {event,ਸਕੂਲੀ ਟ੍ਰਿਪ} ਦੇ ਖਰਚੇ ਦਾ {fraction_txt,ਅੱਧਾ} ਹਿੱਸਾ ਭਰਦੀ ਹੈ। ਜੇਕਰ ਉਸ ਕੋਲ {cur,$}{current,50} ਹਨ ਅਤੇ {event,ਸਕੂਲੀ ਟ੍ਰਿਪ} ਦੀ ਕੁੱਲ ਕੀਮਤ {cur,$}{total,300} ਹੈ, ਤਾਂ ਉਸਨੂੰ ਹੋਰ ਕਿੰਨਾ ਪੈਸਾ ਚਾਹੀਦਾ ਹੈ?\n\n#init:\n- name = sample(names_male)\n- event = sample([\"ਸਕੂਲੀ ਟ੍ਰਿਪ\", \"ਖੇਤਰੀ ਟ੍ਰਿਪ\", \"ਖੇਡਾਂ ਦਾ ਮੁਕਾਬਲਾ\", \"ਸਮਾਗਮ\", \"ਸੰਗੀਤ ਮਹੋਤਸਵ\", \"ਵਿਗਿਆਨ ਮੇਲਾ\"])\n- cur = sample(currencies_sym)\n- organization = sample([\"ਸਕੂਲ\", \"ਸਮਾਜਿਕ ਕੇਂਦਰ\", \"ਸਥਾਨਕ ਦਾਨ ਸੰਸਥਾ\", \"ਯੁਵਾ ਕਲੱਬ\", \"ਮਾਪਿਆਂ ਦੀ ਸੰਸਥਾ\"])\n- fraction_txt, fraction_val = sample(fraction_alnum)\n- $current = range(10, 200, 5)\n- $total = range(200, 1000, 10)\n\n#conditions:\n- total > current\n- total - (total * fraction_val + current) > 0\n- is_int(total * fraction_val)\n- is_int(total - (total * fraction_val + current))\n\n#answer: total - (total * fraction_val + current)\n"
answer_annotated = "{name} ਦੇ {organization} ਨੇ {event} ਦੀ ਲਾਗਤ ਦਾ {fraction_txt} ਹਿੱਸਾ ਭਰਨ ਦਾ ਫ਼ੈਸਲਾ ਕੀਤਾ ਹੈ, ਇਸ ਲਈ ਉਹ {total} * {fraction_val} = {cur}<<{total}*{fraction_val}={total*fraction_val}>>{total*fraction_val} ਭਰਣਗੇ।\nਕੁੱਲ ਮਿਲਾ ਕੇ, {name} ਨੇ {total*fraction_val} + {current} = {cur}<<{total*fraction_val}+{current}={total*fraction_val+current}>>{total*fraction_val+current} ਭਰੇ ਹਨ {event} ਲਈ।\nਇਸ ਲਈ, {name} ਨੂੰ {total} - {total*fraction_val+current} = {cur}<<{total}-{total*fraction_val+current}={total-(total*fraction_val+current)}>>{total-(total*fraction_val+current)} ਹੋਰ ਚਾਹੀਦਾ ਹੈ।\n#### {total-(total*fraction_val+current)}\n"
