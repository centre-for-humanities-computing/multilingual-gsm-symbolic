question = "ਇੱਕ ਗਨੋਮ ਨੰਗੇ ਹੱਥਾਂ ਨਾਲ ਹਰ ਰੋਜ਼ 12 ਪੌਂਡ ਕੋਇਲਾ ਖੋਦ ਸਕਦਾ ਹੈ। ਉਹ ਪਿੱਤਲ ਦੀ ਕੁਦਾਲ ਨਾਲ ਇਸ ਤੋਂ 5 ਗੁਣਾ ਅਤੇ ਸਟੀਲ ਦੀ ਕੁਦਾਲ ਨਾਲ ਪਿੱਤਲ ਦੀ ਕੁਦਾਲ ਨਾਲੋਂ 50% ਵੱਧ ਖੋਦ ਸਕਦਾ ਹੈ। 30 ਦਿਨਾਂ ਵਾਲੇ ਮਹੀਨੇ ਵਿੱਚ, ਸਟੀਲ ਦੀਆਂ ਕੁਦਾਲਾਂ ਨਾਲ 40 ਗਨੋਮ ਕਿੰਨਾ ਪੌਂਡ ਕੋਇਲਾ ਖੋਦ ਸਕਦੇ ਹਨ?"
answer = "ਪਹਿਲਾਂ ਪਿੱਤਲ ਦੀ ਕੁਦਾਲ ਨਾਲ ਇੱਕ ਗਨੋਮ ਕਿੰਨਾ ਕੋਇਲਾ ਖੋਦਦਾ ਹੈ, ਇਹ ਕੱਢੋ: 12 ਪੌਂਡ/ਦਿਨ * 5 = <<12*5=60>>60 ਪੌਂਡ/ਦਿਨ।\nਫਿਰ ਇਸ ਮਾਤਰਾ ਨੂੰ 150% ਨਾਲ ਗੁਣਾ ਕਰੋ ਤਾਂ ਕਿ ਪਤਾ ਲੱਗੇ ਕਿ ਸਟੀਲ ਦੀ ਕੁਦਾਲ ਨਾਲ ਇੱਕ ਗਨੋਮ ਕਿੰਨਾ ਕੋਇਲਾ ਖੋਦਦਾ ਹੈ: 60 ਪੌਂਡ/ਦਿਨ * 150% = <<60*150*.01=90>>90 ਪੌਂਡ/ਦਿਨ।\nਫਿਰ ਇੱਕ ਦਿਨ ਵਿੱਚ ਇੱਕ ਗਨੋਮ ਦੀ ਸਟੀਲ ਦੀ ਕੁਦਾਲ ਨਾਲ ਨਿਕਲੀ ਮਾਤਰਾ ਨੂੰ 40 ਗਨੋਮਾਂ ਨਾਲ ਗੁਣਾ ਕਰੋ: 90 ਪੌਂਡ/ਦਿਨ/ਗਨੋਮ * 40 = <<90*40=3600>>3600 ਪੌਂਡ/ਦਿਨ।\nਫਿਰ 30 ਦਿਨਾਂ ਨਾਲ ਗੁਣਾ ਕਰੋ ਤਾਂ ਕਿ ਮਹੀਨੇ ਵਿੱਚ ਨਿਕਲੀ ਕੁੱਲ ਮਾਤਰਾ ਮਿਲੇ: 3600 ਪੌਂਡ/ਦਿਨ * 30 ਦਿਨ = <<3600*30=108000>>108,000 ਪੌਂਡ ਕੋਇਲਾ।\n#### 108000"
