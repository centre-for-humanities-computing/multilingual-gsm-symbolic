question_annotated = "ਇੱਕ {worker,ਗਨੋਮ} {tool1,ਨੰਗੇ ਹੱਥਾਂ} ਨਾਲ ਹਰ ਰੋਜ਼ {base,12} {unit,ਪੌਂਡ} ਕੋਇਲਾ ਖੋਦ ਸਕਦਾ ਹੈ। ਉਹ {tool2,ਪਿੱਤਲ ਦੀ ਕੁਦਾਲ} ਨਾਲ {mult1_txt,ਦੋ ਗੁਣਾ} ਉਤਨਾ ਕੋਇਲਾ ਖੋਦ ਸਕਦਾ ਹੈ ਅਤੇ {tool2,ਪਿੱਤਲ ਦੀ ਕੁਦਾਲ} ਨਾਲੋਂ {mult2,50}% ਵੱਧ {tool3,ਸਟੀਲ ਦੀ ਕੁਦਾਲ} ਨਾਲ ਖੋਦ ਸਕਦਾ ਹੈ। {days,30} ਦਿਨਾਂ ਵਾਲੇ ਮਹੀਨੇ ਵਿੱਚ {tool3,ਸਟੀਲ ਦੀ ਕੁਦਾਲ}ਆਂ ਨਾਲ {n,40} {worker,ਗਨੋਮ} ਕਿੰਨਾ {unit,ਪੌਂਡ} ਕੋਇਲਾ ਖੋਦ ਸਕਦੇ ਹਨ?\n\n#init:\n- worker = sample([\"ਖਾਣੀ ਮਜ਼ਦੂਰ\", \"ਗੋਬਲਿਨ\", \"ਗਨੋਮ\", \"ਟਰੋਲ\"])\n- tool1 = sample([\"ਨੰਗੇ ਹੱਥ\", \"ਬੁਨਿਆਦੀ ਫਾਵੜਾ\", \"ਲੱਕੜੀ ਦੀ ਕੁਦਾਲ\"])\n- unit = sample([\"ਪੌਂਡ\", \"ਕਿਲੋ\"])\n- tool2 = sample([\"ਨਿਕਲ ਦੀ ਕੁਦਾਲ\", \"ਪਿੱਤਲ ਦੀ ਕੁਦਾਲ\", \"ਚਾਂਦੀ ਦੀ ਕੁਦਾਲ\"])\n- tool3 = sample([\"ਸਟੀਲ ਦੀ ਕੁਦਾਲ\", \"ਹੀਰੇ ਦੀ ਕੁਦਾਲ\", \"ਮਿਥਰਿਲ ਦੀ ਕੁਦਾਲ\", \"ਟਾਈਟੇਨੀਅਮ ਦੀ ਕੁਦਾਲ\"])\n- $base = range(5, 20)\n- mult1_txt, mult1_val = sample(multi_times)\n- $mult2 = range(30, 80, 5)\n- $n = range(20, 50)\n- $days = range(28, 32)\n\n#conditions:\n- is_int(mult2/100*base*mult1_val)\n- int(base * mult1_val * (1 + mult2/100) * n * days) < 15000\n\n#answer: int(base * mult1_val * (1 + mult2/100) * n * days)\n"
answer_annotated = "ਪਹਿਲਾਂ ਇਹ ਪਤਾ ਕਰੋ ਕਿ ਇੱਕ {worker} {tool2} ਨਾਲ ਕਿੰਨਾ ਕੋਇਲਾ ਖੋਦ ਸਕਦਾ ਹੈ: {base} ਪੌਂਡ/ਦਿਨ*{mult1_val}=<<{base}*{mult1_val}={base*mult1_val}>>{base*mult1_val} {unit}/ਦਿਨ\nਫਿਰ ਇਸ ਮਾਤਰਾ ਨੂੰ {100+mult2}% ਨਾਲ ਗੁਣਾ ਕਰੋ ਤਾਂ ਕਿ ਇਹ ਪਤਾ ਲੱਗੇ ਕਿ ਇੱਕ {worker} {tool3} ਨਾਲ ਕਿੰਨਾ ਕੋਇਲਾ ਖੋਦ ਸਕਦਾ ਹੈ: {base*mult1_val} {unit}/ਦਿਨ * {100+mult2}% = <<{base*mult1_val}*{100+mult2}*.01={int(base*mult1_val*(1+mult2/100))}>>{int(base*mult1_val*(1+mult2/100))} {unit}/ਦਿਨ\nਫਿਰ ਇੱਕ ਦਿਨ ਵਿੱਚ ਇੱਕ {worker} ਦੀ {tool3} ਨਾਲ ਨਿਕਲੀ ਮਾਤਰਾ ਨੂੰ {n} {worker}s ਨਾਲ ਗੁਣਾ ਕਰੋ: {int(base*mult1_val*(1+mult2/100))} {unit}/ਦਿਨ/{worker} * {n} {worker}s = <<{int(base*mult1_val*(1+mult2/100))}*{n}={int(base*mult1_val*(1+mult2/100)*n)}>>{int(base*mult1_val*(1+mult2/100)*n)} {unit}/ਦਿਨ\nਫਿਰ ਰੋਜ਼ਾਨਾ ਦੀ ਮਾਤਰਾ ਨੂੰ {days} ਦਿਨਾਂ ਨਾਲ ਗੁਣਾ ਕਰੋ ਤਾਂ ਕਿ ਮਹੀਨੇ ਦੀ ਕੁੱਲ ਮਾਤਰਾ ਮਿਲੇ: {int(base*mult1_val*(1+mult2/100)*n)} {unit}/ਦਿਨ * {days} ਦਿਨ = <<{int(base*mult1_val*(1+mult2/100)*n)}*{days}={int(base*mult1_val*(1+mult2/100)*n*days)}>>{int(base*mult1_val*(1+mult2/100)*n*days)} {unit}/ਦਿਨ\n#### {int(base*mult1_val*(1+mult2/100)*n*days)}\n"
