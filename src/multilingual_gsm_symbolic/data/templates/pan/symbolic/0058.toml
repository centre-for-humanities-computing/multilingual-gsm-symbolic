question_annotated = "ਇੱਕ {worker,ਗਨੋਮ} {tool1,ਨੰਗੇ ਹੱਥਾਂ} ਨਾਲ ਹਰ ਰੋਜ਼ {base,12} {unit,ਪੌਂਡ} ਖਣਿਜ ਖੋਦ ਸਕਦਾ ਹੈ। ਉਹ {tool2,ਪਿੱਤਲ ਦੀ ਗੈਂਤੀ} ਨਾਲ ਇਸ ਤੋਂ {mult1_txt,ਦੋ ਗੁਣਾ} ਖੋਦ ਸਕਦਾ ਹੈ ਅਤੇ {tool3,ਸਟੀਲ ਦੀ ਗੈਂਤੀ} ਨਾਲ {tool2,ਪਿੱਤਲ ਦੀ ਗੈਂਤੀ} ਨਾਲੋਂ {mult2,50}% ਵੱਧ ਖੋਦ ਸਕਦਾ ਹੈ। {days,30} ਦਿਨਾਂ ਵਾਲੇ ਮਹੀਨੇ ਵਿੱਚ {tool3,ਸਟੀਲ ਦੀ ਗੈਂਤੀ} ਵਾਲੇ {n,40} {worker,ਗਨੋਮ} ਕਿੰਨੇ {unit,ਪੌਂਡ} ਖਣਿਜ ਖੋਦ ਸਕਦੇ ਹਨ?\n\n#init:\n- worker = sample([\"ਖਾਣ ਮਜ਼ਦੂਰ\", \"ਗੋਬਲਿਨ\", \"ਗਨੋਮ\", \"ਟਰੋਲ\"])\n- tool1 = sample([\"ਨੰਗੇ ਹੱਥਾਂ\", \"ਸਾਦੇ ਫਾਵੜੇ\", \"ਲੱਕੜ ਦੀ ਗੈਂਤੀ\"])\n- unit = sample([\"ਪੌਂਡ\", \"ਕਿਲੋ\"])\n- tool2 = sample([\"ਨਿਕਲ ਦੀ ਗੈਂਤੀ\", \"ਪਿੱਤਲ ਦੀ ਗੈਂਤੀ\", \"ਚਾਂਦੀ ਦੀ ਗੈਂਤੀ\"])\n- tool3 = sample([\"ਸਟੀਲ ਦੀ ਗੈਂਤੀ\", \"ਹੀਰੇ ਦੀ ਗੈਂਤੀ\", \"ਮਿਥਰਿਲ ਦੀ ਗੈਂਤੀ\", \"ਟਾਈਟੇਨੀਅਮ ਦੀ ਗੈਂਤੀ\"])\n- $base = range(5, 20)\n- mult1_txt, mult1_val = sample(multi_times)\n- $mult2 = range(30, 80, 5)\n- $n = range(20, 50)\n- $days = range(28, 32)\n\n#conditions:\n- is_int(mult2/100*base*mult1_val)\n- int(base * mult1_val * (1 + mult2/100) * n * days) < 15000\n\n#answer: int(base * mult1_val * (1 + mult2/100) * n * days)"
answer_annotated = "ਪਹਿਲਾਂ ਇਹ ਪਤਾ ਕਰੋ ਕਿ ਇੱਕ {worker} {tool2} ਨਾਲ ਕਿੰਨਾ ਖਣਿਜ ਖੋਦ ਸਕਦਾ ਹੈ: {base} {unit}/ਦਿਨ*{mult1_val}=<<{base}*{mult1_val}={base*mult1_val}>>{base*mult1_val} {unit}/ਦਿਨ\nਫਿਰ ਇਸ ਮਾਤਰਾ ਨੂੰ {100+mult2}% ਨਾਲ ਗੁਣਾ ਕਰੋ ਤਾਂ ਕਿ ਇਹ ਪਤਾ ਲੱਗੇ ਕਿ ਇੱਕ {worker} {tool3} ਨਾਲ ਕਿੰਨਾ ਖਣਿਜ ਖੋਦ ਸਕਦਾ ਹੈ: {base*mult1_val} {unit}/ਦਿਨ * {100+mult2}% = <<{base*mult1_val}*{100+mult2}*.01={int(base*mult1_val*(1+mult2/100))}>>{int(base*mult1_val*(1+mult2/100))} {unit}/ਦਿਨ\nਫਿਰ ਇੱਕ ਦਿਨ ਵਿੱਚ ਇੱਕ {worker} ਦੀ {tool3} ਨਾਲ ਨਿਕਲੀ ਮਾਤਰਾ ਨੂੰ {worker} ਦੀ ਗਿਣਤੀ ({n}) ਨਾਲ ਗੁਣਾ ਕਰੋ: {int(base*mult1_val*(1+mult2/100))} {unit}/ਦਿਨ/{worker} * {n} {worker} = <<{int(base*mult1_val*(1+mult2/100))}*{n}={int(base*mult1_val*(1+mult2/100)*n)}>>{int(base*mult1_val*(1+mult2/100)*n)} {unit}/ਦਿਨ\nਫਿਰ ਰੋਜ਼ਾਨਾ ਦੀ ਮਾਤਰਾ ਨੂੰ {days} ਦਿਨਾਂ ਨਾਲ ਗੁਣਾ ਕਰੋ ਤਾਂ ਕਿ ਮਹੀਨੇ ਦੀ ਕੁੱਲ ਮਾਤਰਾ ਮਿਲੇ: {int(base*mult1_val*(1+mult2/100)*n)} {unit}/ਦਿਨ * {days} ਦਿਨ = <<{int(base*mult1_val*(1+mult2/100)*n)}*{days}={int(base*mult1_val*(1+mult2/100)*n*days)}>>{int(base*mult1_val*(1+mult2/100)*n*days)} {unit}\n#### {int(base*mult1_val*(1+mult2/100)*n*days)}"
