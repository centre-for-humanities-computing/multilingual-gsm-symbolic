question = "ਇੱਕ ਗਨੋਮ ਨੰਗੇ ਹੱਥਾਂ ਨਾਲ ਹਰ ਰੋਜ਼ 12 ਪੌਂਡ ਖਣਿਜ ਖੋਦ ਸਕਦਾ ਹੈ। ਉਹ ਪਿੱਤਲ ਦੀ ਗੈਂਤੀ ਨਾਲ ਇਸ ਤੋਂ ਦੋ ਗੁਣਾ ਖੋਦ ਸਕਦਾ ਹੈ ਅਤੇ ਸਟੀਲ ਦੀ ਗੈਂਤੀ ਨਾਲ ਪਿੱਤਲ ਦੀ ਗੈਂਤੀ ਨਾਲੋਂ 50% ਵੱਧ ਖੋਦ ਸਕਦਾ ਹੈ। 30 ਦਿਨਾਂ ਵਾਲੇ ਮਹੀਨੇ ਵਿੱਚ ਸਟੀਲ ਦੀ ਗੈਂਤੀ ਵਾਲੇ 40 ਗਨੋਮ ਕਿੰਨੇ ਪੌਂਡ ਖਣਿਜ ਖੋਦ ਸਕਦੇ ਹਨ?"
answer = "ਪਹਿਲਾਂ ਇਹ ਪਤਾ ਕਰੋ ਕਿ ਇੱਕ ਗਨੋਮ ਪਿੱਤਲ ਦੀ ਗੈਂਤੀ ਨਾਲ ਕਿੰਨਾ ਖਣਿਜ ਖੋਦ ਸਕਦਾ ਹੈ: 12 ਪੌਂਡ/ਦਿਨ*2=<<12*2=24>>24 ਪੌਂਡ/ਦਿਨ\nਫਿਰ ਇਸ ਮਾਤਰਾ ਨੂੰ 150% ਨਾਲ ਗੁਣਾ ਕਰੋ ਤਾਂ ਕਿ ਇਹ ਪਤਾ ਲੱਗੇ ਕਿ ਇੱਕ ਗਨੋਮ ਸਟੀਲ ਦੀ ਗੈਂਤੀ ਨਾਲ ਕਿੰਨਾ ਖਣਿਜ ਖੋਦ ਸਕਦਾ ਹੈ: 24 ਪੌਂਡ/ਦਿਨ * 150% = <<24*150*.01=36>>36 ਪੌਂਡ/ਦਿਨ\nਫਿਰ ਇੱਕ ਦਿਨ ਵਿੱਚ ਇੱਕ ਗਨੋਮ ਦੀ ਸਟੀਲ ਦੀ ਗੈਂਤੀ ਨਾਲ ਨਿਕਲੀ ਮਾਤਰਾ ਨੂੰ ਗਨੋਮ ਦੀ ਗਿਣਤੀ (40) ਨਾਲ ਗੁਣਾ ਕਰੋ: 36 ਪੌਂਡ/ਦਿਨ/ਗਨੋਮ * 40 ਗਨੋਮ = <<36*40=1440>>1440 ਪੌਂਡ/ਦਿਨ\nਫਿਰ ਰੋਜ਼ਾਨਾ ਦੀ ਮਾਤਰਾ ਨੂੰ 30 ਦਿਨਾਂ ਨਾਲ ਗੁਣਾ ਕਰੋ ਤਾਂ ਕਿ ਮਹੀਨੇ ਦੀ ਕੁੱਲ ਮਾਤਰਾ ਮਿਲੇ: 1440 ਪੌਂਡ/ਦਿਨ * 30 ਦਿਨ = <<1440*30=43200>>43,200 ਪੌਂਡ\n#### 43200"
