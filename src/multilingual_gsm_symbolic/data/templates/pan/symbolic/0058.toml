question = "ਇੱਕ ਗਨੋਮ ਨੰਗੇ ਹੱਥਾਂ ਨਾਲ ਹਰ ਰੋਜ਼ 12 ਪੌਂਡ ਕੋਇਲਾ ਖੋਦ ਸਕਦਾ ਹੈ। ਉਹ ਪਿੱਤਲ ਦੀ ਕੁਦਾਲ ਨਾਲ ਦੋ ਗੁਣਾ ਉਤਨਾ ਕੋਇਲਾ ਖੋਦ ਸਕਦਾ ਹੈ ਅਤੇ ਪਿੱਤਲ ਦੀ ਕੁਦਾਲ ਨਾਲੋਂ 50% ਵੱਧ ਸਟੀਲ ਦੀ ਕੁਦਾਲ ਨਾਲ ਖੋਦ ਸਕਦਾ ਹੈ। 30 ਦਿਨਾਂ ਵਾਲੇ ਮਹੀਨੇ ਵਿੱਚ ਸਟੀਲ ਦੀ ਕੁਦਾਲਆਂ ਨਾਲ 40 ਗਨੋਮ ਕਿੰਨਾ ਪੌਂਡ ਕੋਇਲਾ ਖੋਦ ਸਕਦੇ ਹਨ?"
answer = "ਪਹਿਲਾਂ ਇਹ ਪਤਾ ਕਰੋ ਕਿ ਇੱਕ ਗਨੋਮ ਪਿੱਤਲ ਦੀ ਕੁਦਾਲ ਨਾਲ ਕਿੰਨਾ ਕੋਇਲਾ ਖੋਦ ਸਕਦਾ ਹੈ: 12 ਪੌਂਡ/ਦਿਨ*2=<<12*2=24>>24 ਪੌਂਡ/ਦਿਨ\nਫਿਰ ਇਸ ਮਾਤਰਾ ਨੂੰ 150% ਨਾਲ ਗੁਣਾ ਕਰੋ ਤਾਂ ਕਿ ਇਹ ਪਤਾ ਲੱਗੇ ਕਿ ਇੱਕ ਗਨੋਮ ਸਟੀਲ ਦੀ ਕੁਦਾਲ ਨਾਲ ਕਿੰਨਾ ਕੋਇਲਾ ਖੋਦ ਸਕਦਾ ਹੈ: 24 ਪੌਂਡ/ਦਿਨ * 150% = <<24*150*.01=36>>36 ਪੌਂਡ/ਦਿਨ\nਫਿਰ ਇੱਕ ਦਿਨ ਵਿੱਚ ਇੱਕ ਗਨੋਮ ਦੀ ਸਟੀਲ ਦੀ ਕੁਦਾਲ ਨਾਲ ਨਿਕਲੀ ਮਾਤਰਾ ਨੂੰ 40 ਗਨੋਮs ਨਾਲ ਗੁਣਾ ਕਰੋ: 36 ਪੌਂਡ/ਦਿਨ/ਗਨੋਮ * 40 ਗਨੋਮs = <<36*40=1440>>1440 ਪੌਂਡ/ਦਿਨ\nਫਿਰ ਰੋਜ਼ਾਨਾ ਦੀ ਮਾਤਰਾ ਨੂੰ 30 ਦਿਨਾਂ ਨਾਲ ਗੁਣਾ ਕਰੋ ਤਾਂ ਕਿ ਮਹੀਨੇ ਦੀ ਕੁੱਲ ਮਾਤਰਾ ਮਿਲੇ: 1440 ਪੌਂਡ/ਦਿਨ * 30 ਦਿਨ = <<1440*30=43200>>43,200 ਪੌਂਡ/ਦਿਨ\n#### 43200\n"
