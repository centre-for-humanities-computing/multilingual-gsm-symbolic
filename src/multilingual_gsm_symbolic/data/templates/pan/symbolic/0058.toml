question_annotated = "ek {worker,gnome} {tool1,nangay hath} naal rozana {base,12} {unit,pauond} khaan nikal sakda hai. Oh {tool2,pittl di pickaxe} naal {mult1_txt,do guna} utni khaan nikal sakda hai aur {tool2,pittl di pickaxe} naal ton {mult2,50}% vadh {tool3,steel di pickaxe} naal nikal sakda hai. {days,30} dinan wale mahine vich {tool3,steel di pickaxe}s naal {n,40} {worker,gnome}s kitne {unit,pauond} khaan nikal sakde ne?\n\n#init:\n- worker = sample([\"khanik\", \"goblin\", \"gnome\", \"troll\"])\n- tool1 = sample([\"nangay hath\", \"basic shovel\", \"lakdi di pickaxe\"])\n- unit = sample([\"pauond\", \"kgs\"])\n- tool2 = sample([\"nickel di pickaxe\", \"pittl di pickaxe\", \"chandi di pickaxe\"])\n- tool3 = sample([\"steel di pickaxe\", \"diamond di pickaxe\", \"mithril di pickaxe\", \"titanium di pickaxe\"])\n- $base = range(5, 20)\n- mult1_txt, mult1_val = sample(multi_times)\n- $mult2 = range(30, 80, 5)\n- $n = range(20, 50)\n- $days = range(28, 32)\n\n#conditions:\n- is_int(mult2/100*base*mult1_val)\n- int(base * mult1_val * (1 + mult2/100) * n * days) < 15000\n\n#answer: int(base * mult1_val * (1 + mult2/100) * n * days)\n"
answer_annotated = "Pehla eh dhoondho ki ek {worker} {tool2} naal kitni khaan nikal sakda hai: {base} pauond/din*{mult1_val}=<<{base}*{mult1_val}={base*mult1_val}>>{base*mult1_val} {unit}/din\nPhir eh matra nu {100+mult2}% naal gujna taan ki eh pata lagge ki ek {worker} {tool3} naal kitni khaan nikal sakda hai: {base*mult1_val} {unit}/din * {100+mult2}% = <<{base*mult1_val}*{100+mult2}*.01={int(base*mult1_val*(1+mult2/100))}>>{int(base*mult1_val*(1+mult2/100))} {unit}/din\nPhir ek din vich ek {worker} di {tool3} naal nikali gayi khaan nu {worker}s di ginti naal gujna: {int(base*mult1_val*(1+mult2/100))} {unit}/din/{worker} * {n} {worker}s = <<{int(base*mult1_val*(1+mult2/100))}*{n}={int(base*mult1_val*(1+mult2/100)*n)}>>{int(base*mult1_val*(1+mult2/100)*n)} {unit}/din\nPhir rozana di khaan di matra nu dinan di ginti naal gujna taan ki mahine vich nikali gayi kul khaan pata lagge: {int(base*mult1_val*(1+mult2/100)*n)} {unit}/din * {days} din = <<{int(base*mult1_val*(1+mult2/100)*n)}*{days}={int(base*mult1_val*(1+mult2/100)*n*days)}>>{int(base*mult1_val*(1+mult2/100)*n*days)} {unit}/din\n#### {int(base*mult1_val*(1+mult2/100)*n*days)}\n"
