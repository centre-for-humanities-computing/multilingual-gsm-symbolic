question = "ਸਿਮਰਨ ਕੋਲ 15 ਸਪੂਲ ਹਲਕਾ ਨੀਲਾ ਧਾਗਾ, 45 ਸਪੂਲ ਗੂੜ੍ਹਾ ਨੀਲਾ ਧਾਗਾ, 40 ਸਪੂਲ ਹਲਕਾ ਹਰਾ ਧਾਗਾ ਅਤੇ 50 ਸਪੂਲ ਗੂੜ੍ਹਾ ਹਰਾ ਧਾਗਾ ਹੈ। ਉਸਦੇ ਕਿੰਨੇ ਪ੍ਰਤੀਸ਼ਤ ਸਪੂਲਾਂ ਦਾ ਰੰਗ ਨੀਲਾ ਹੈ?"
answer = "ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਪਤਾ ਕਰੋ ਕਿ ਕਿੰਨੇ ਸਪੂਲਾਂ ਦਾ ਰੰਗ ਨੀਲਾ ਹੈ: 15 ਸਪੂਲ + 45 ਸਪੂਲ = <<15+45=60>>60 ਸਪੂਲ\nਫਿਰ ਕੁੱਲ ਸਪੂਲਾਂ ਦੀ ਗਿਣਤੀ ਪਤਾ ਕਰੋ: 40 ਸਪੂਲ + 50 ਸਪੂਲ + 60 ਸਪੂਲ = <<40+50+60=150>>150 ਸਪੂਲ\nਫਿਰ ਜਿਨ੍ਹਾਂ ਸਪੂਲਾਂ ਦਾ ਰੰਗ ਨੀਲਾ ਹੈ ਉਨ੍ਹਾਂ ਦੀ ਗਿਣਤੀ ਨੂੰ ਕੁੱਲ ਸਪੂਲਾਂ ਦੀ ਗਿਣਤੀ ਨਾਲ ਵੰਡੋ ਅਤੇ ਜਵਾਬ ਨੂੰ ਪ੍ਰਤੀਸ਼ਤ ਵਿੱਚ ਬਿਆਨ ਕਰਨ ਲਈ 100% ਨਾਲ ਗੁਣਾ ਕਰੋ: 60 ਸਪੂਲ / 150 ਸਪੂਲ * 100% = 40%\n#### 40"
