question = "ਜੇਮਸ ਭਾੜੇ 'ਤੇ ਘੋੜੇ ਵਾਲੀ ਗੱਡੀ ਲੈਂਦਾ ਹੈ 5 ਵਜੇ ਸ਼ਾਮ ਤੋਂ 9 ਵਜੇ ਸ਼ਾਮ ਤੱਕ। ਉਸਨੂੰ 1 ਘੰਟਾ ਮੁਫਤ ਮਿਲਦਾ ਹੈ। ਪਹਿਲੇ ਭੁਗਤਾਨ ਵਾਲੇ ਘੰਟੇ ਦੀ ਕੀਮਤ ₹15 ਹੈ, ਅਤੇ ਉਸ ਤੋਂ ਬਾਅਦ ਹਰੇਕ ਭੁਗਤਾਨ ਵਾਲਾ ਘੰਟਾ ਪਹਿਲੇ ਭੁਗਤਾਨ ਵਾਲੇ ਘੰਟੇ ਦੇ ਦੁੱਗਣਾ ਖਰਚੇ ਦਾ ਹੈ। ਉਸਨੇ ਕਿੰਨਾ ਭਰਿਆ?"
answer = "ਉਸਨੂੰ ਇਹ 9-5=<<9-5=4>>4 ਘੰਟੇ ਲਈ ਮਿਲਿਆ\nਉਹ 4-1=<<4-1=3>>3 ਘੰਟਿਆਂ ਲਈ ਭੁਗਤਾਨ ਕਰਦਾ ਹੈ\nਪਹਿਲਾ ਘੰਟਾ 1*15=₹<<1*15=15>>15 ਦਾ ਸੀ\nਬਾਕੀ 3-1=2 ਘੰਟੇ ਹੋਰ ਮਹਿੰਗੇ ਹਨ\nਉਹਨਾਂ ਦੀ ਕੀਮਤ 15*5=₹<<15*5=75>>75 ਪ੍ਰਤੀ ਘੰਟਾ ਹੈ\nਇਸ ਲਈ ਉਹਨਾਂ 2 ਘੰਟਿਆਂ ਦੀ ਕੀਮਤ 2*75=₹<<2*75=150>>150 ਹੈ\nਇਸ ਲਈ ਉਹ ਕੁੱਲ 150+15=₹<<150+15=165>>165 ਦਿੰਦਾ ਹੈ\n#### 165\n"
