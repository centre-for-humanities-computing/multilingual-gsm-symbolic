question = "ਹਰਜੀਤ ਸ਼ਾਮ 5 ਵਜੇ ਤੋਂ 9 ਵਜੇ ਤੱਕ ਘੋੜੇ ਵਾਲੀ ਗੱਡੀ ਕਿਰਾਏ 'ਤੇ ਲੈਂਦਾ ਹੈ। ਉਸਨੂੰ 1 ਘੰਟੇ ਦਾ ਸਮਾਂ ਮੁਫ਼ਤ ਮਿਲਦਾ ਹੈ। ਪਹਿਲੇ ਭੁਗਤਾਨ ਵਾਲੇ ਘੰਟੇ ਦਾ ਕਿਰਾਇਆ ₹15 ਹੈ, ਅਤੇ ਉਸ ਤੋਂ ਬਾਅਦ ਹਰ ਭੁਗਤਾਨ ਵਾਲੇ ਘੰਟੇ ਦਾ ਕਿਰਾਇਆ ਪਹਿਲੇ ਭੁਗਤਾਨ ਵਾਲੇ ਘੰਟੇ ਦਾ ਦੋ ਗੁਣਾ ਹੈ। ਉਸਨੇ ਕੁੱਲ ਕਿੰਨੇ ਪੈਸੇ ਦਿੱਤੇ?"
answer = "ਉਸਨੂੰ ਇਹ 9-5=<<9-5=4>>4 ਘੰਟਿਆਂ ਲਈ ਮਿਲੀ\nਉਹ 4-1=<<4-1=3>>3 ਘੰਟਿਆਂ ਲਈ ਭੁਗਤਾਨ ਕਰਦਾ ਹੈ\nਪਹਿਲਾ ਘੰਟਾ 1*15=₹<<1*15=15>>15 ਦਾ ਸੀ\nਬਾਕੀ 3-1=2 ਘੰਟੇ ਹੋਰ ਮਹਿੰਗੇ ਹਨ\nਉਹਨਾਂ ਦੀ ਕੀਮਤ 15*2=₹<<15*2=30>>30 ਪ੍ਰਤੀ ਘੰਟਾ ਹੈ\nਇਸ ਲਈ ਉਹਨਾਂ 2 ਘੰਟਿਆਂ ਦੀ ਕੀਮਤ 2*30=₹<<2*30=60>>60 ਹੈ\nਇਸ ਲਈ ਉਹ ਕੁੱਲ 60+15=₹<<60+15=75>>75 ਦਿੰਦਾ ਹੈ\n#### 75"
