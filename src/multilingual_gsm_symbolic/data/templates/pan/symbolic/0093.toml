question = "ਜਦੋਂ ਪਾਣੀ ਠੰਡਾ ਹੁੰਦਾ ਹੈ, ਰੇਅ ਇੱਕ ਮੀਲ 16 ਮਿੰਟਾਂ ਵਿੱਚ ਤੈਰਦਾ ਹੈ। ਜਦੋਂ ਪਾਣੀ ਗਰਮ ਹੁੰਦਾ ਹੈ, ਉਹ ਇੱਕ ਮੀਲ 16 ਮਿੰਟਾਂ ਦੇ ਦੁੱਗਣੇ ਸਮੇਂ ਨਾਲੋਂ 2 ਮਿੰਟ ਵੱਧ ਵਿੱਚ ਤੈਰਦਾ ਹੈ। ਰੇਅ ਨੂੰ ਗਰਮ ਦਿਨ ਨਾਲੋਂ ਠੰਡੇ ਦਿਨ 'ਤੇ 3 ਮੀਲ ਤੈਰਨ ਵਿੱਚ ਕਿੰਨਾ ਵੱਧ ਸਮਾਂ ਲੱਗਦਾ ਹੈ?"
answer = "ਠੰਡੇ ਪਾਣੀ ਵਿੱਚ ਇੱਕ ਮੀਲ = <<16=16>>16 ਮਿੰਟ।\nਗਰਮ ਪਾਣੀ ਵਿੱਚ ਇੱਕ ਮੀਲ = 2 + 2*16 = <<2+2*16=34>>34 ਮਿੰਟ।\nਠੰਡੇ ਪਾਣੀ ਵਿੱਚ 3 ਮੀਲ = 3*16 = <<3*16=48>>48 ਮਿੰਟ।\nਗਰਮ ਪਾਣੀ ਵਿੱਚ 3 ਮੀਲ = 3*34 = <<3*34=102>>102 ਮਿੰਟ।\nਰੇਅ ਨੂੰ 102-48 = <<102-48=54>>54 ਮਿੰਟ ਵੱਧ ਲੱਗਦੇ ਹਨ।\n#### 54"
