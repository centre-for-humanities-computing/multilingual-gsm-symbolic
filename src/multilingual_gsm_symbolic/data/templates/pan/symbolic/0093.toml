question = "ਜਦੋਂ ਪਾਣੀ ਠੰਡਾ ਹੁੰਦਾ ਹੈ ਤਾਂ ਗੁਰਪ੍ਰੀਤ ਨੂੰ ਇੱਕ ਮੀਲ ਤੈਰਨ ਵਿੱਚ 16 ਮਿੰਟ ਲੱਗਦੇ ਹਨ। ਜਦੋਂ ਪਾਣੀ ਗਰਮ ਹੁੰਦਾ ਹੈ ਤਾਂ ਗੁਰਪ੍ਰੀਤ ਨੂੰ ਇੱਕ ਮੀਲ ਤੈਰਨ ਵਿੱਚ ਇਸ ਤੋਂ ਦੋ ਗੁਣਾ ਸਮੇਂ ਨਾਲੋਂ 2 ਮਿੰਟ ਵੱਧ ਸਮਾਂ ਲੱਗਦਾ ਹੈ। ਗੁਰਪ੍ਰੀਤ ਨੂੰ ਠੰਡੇ ਦਿਨ ਨਾਲੋਂ ਗਰਮ ਦਿਨ 3 ਮੀਲ ਤੈਰਨ ਵਿੱਚ ਕਿੰਨਾ ਵੱਧ ਸਮਾਂ ਲੱਗਦਾ ਹੈ?"
