question = "ਜਦੋਂ ਸਿਮਰਨ ਆਪਣੇ ਭਤੀਜੇ ਦੀ ਦੇਖਭਾਲ ਕਰਦੀ ਹੈ, ਤਾਂ ਉਹ ਉਸ ਲਈ ਵੱਖ-ਵੱਖ ਖਿਡੌਣੇ ਕੱਢਦੀ ਹੈ। ਬਿਲਡਿੰਗ ਬਲਾਕਾਂ ਵਾਲੀ ਥੈਲੀ ਵਿੱਚ 31 ਬਲਾਕ ਹਨ। ਰੂੰ ਭਰੇ ਖਿਡੌਣਾ-ਜਾਨਵਰਾਂ ਵਾਲੇ ਡੱਬੇ ਵਿੱਚ 8 ਰੂੰ ਭਰੇ ਜਾਨਵਰ ਹਨ। ਸਟੈਕਿੰਗ ਰਿੰਗਾਂ ਦੇ ਟਾਵਰ ਉੱਤੇ 9 ਰੰਗ-ਬਿਰੰਗੀਆਂ ਰਿੰਗਾਂ ਹਨ। ਸਿਮਰਨ ਨੇ ਹਾਲ ਹੀ ਵਿੱਚ ਉਛਲਣ ਵਾਲੀਆਂ ਗੇਂਦਾਂ ਦੀ ਇੱਕ ਟਿਊਬ ਖਰੀਦੀ, ਜਿਸ ਨਾਲ ਉਸਦੇ ਭਤੀਜੇ ਲਈ ਖਿਡੌਣਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 62 ਹੋ ਗਈ। ਟਿਊਬ ਵਿੱਚ ਕਿੰਨੀਆਂ ਉਛਲਣ ਵਾਲੀਆਂ ਗੇਂਦਾਂ ਸਨ?"
answer = "ਮੰਨ ਲਓ T ਟਿਊਬ ਵਿੱਚ ਉਛਲਣ ਵਾਲੀਆਂ ਗੇਂਦਾਂ ਦੀ ਗਿਣਤੀ ਹੈ।\nਗੇਂਦਾਂ ਦੀ ਟਿਊਬ ਖਰੀਦਣ ਤੋਂ ਬਾਅਦ, ਸਿਮਰਨ ਕੋਲ ਆਪਣੇ ਭਤੀਜੇ ਲਈ 31 + 8 + 9 + T = 48 + T = 62 ਖਿਡੌਣੇ ਹਨ।\nਇਸ ਲਈ, T = 62 - 48 = <<62-48=14>>14 ਉਛਲਣ ਵਾਲੀਆਂ ਗੇਂਦਾਂ ਟਿਊਬ ਵਿੱਚ ਸਨ।\n#### 14"
id_orig = 930
id_shuffled = 9
question_annotated = "ਜਦੋਂ {name, ਸਿਮਰਨ} ਆਪਣੇ {family, ਭਤੀਜੇ} ਦੀ ਦੇਖਭਾਲ ਕਰਦੀ ਹੈ, ਤਾਂ ਉਹ ਉਸ ਲਈ ਵੱਖ-ਵੱਖ ਖਿਡੌਣੇ ਕੱਢਦੀ ਹੈ। ਬਿਲਡਿੰਗ ਬਲਾਕਾਂ ਵਾਲੀ ਥੈਲੀ ਵਿੱਚ {x,31} ਬਲਾਕ ਹਨ। ਰੂੰ ਭਰੇ ਖਿਡੌਣਾ-ਜਾਨਵਰਾਂ ਵਾਲੇ ਡੱਬੇ ਵਿੱਚ {y,8} ਰੂੰ ਭਰੇ ਜਾਨਵਰ ਹਨ। ਸਟੈਕਿੰਗ ਰਿੰਗਾਂ ਦੇ ਟਾਵਰ ਉੱਤੇ {z,9} ਰੰਗ-ਬਿਰੰਗੀਆਂ ਰਿੰਗਾਂ ਹਨ। {name, ਸਿਮਰਨ} ਨੇ ਹਾਲ ਹੀ ਵਿੱਚ ਉਛਲਣ ਵਾਲੀਆਂ ਗੇਂਦਾਂ ਦੀ ਇੱਕ ਟਿਊਬ ਖਰੀਦੀ, ਜਿਸ ਨਾਲ ਉਸਦੇ {family, ਭਤੀਜੇ} ਲਈ ਖਿਡੌਣਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ {total,62} ਹੋ ਗਈ। ਟਿਊਬ ਵਿੱਚ ਕਿੰਨੀਆਂ ਉਛਲਣ ਵਾਲੀਆਂ ਗੇਂਦਾਂ ਸਨ?\n\n#init:\n- name = sample(names_female)\n- family = sample([\"ਭਤੀਜੇ\", \"ਚਚੇਰੇ ਭਰਾ\", \"ਭਰਾ\"])\n- $x = range(31, 75)\n- $y = range(8, 50)\n- $z = range(9, 35)\n- $total = range(60, 250)\n\n#conditions:\n- total - (x + y + z) >= 20 \n- total - (x + y + z) < 100\n\n#answer: total - (x + y + z)"
answer_annotated = "ਮੰਨ ਲਓ T ਟਿਊਬ ਵਿੱਚ ਉਛਲਣ ਵਾਲੀਆਂ ਗੇਂਦਾਂ ਦੀ ਗਿਣਤੀ ਹੈ।\nਗੇਂਦਾਂ ਦੀ ਟਿਊਬ ਖਰੀਦਣ ਤੋਂ ਬਾਅਦ, {name} ਕੋਲ ਆਪਣੇ {family} ਲਈ {x} + {y} + {z} + T = {x+y+z} + T = {total} ਖਿਡੌਣੇ ਹਨ।\nਇਸ ਲਈ, T = {total} - {x+y+z} = <<{total}-{x+y+z}={total - (x + y + z)}>>{total - (x + y + z)} ਉਛਲਣ ਵਾਲੀਆਂ ਗੇਂਦਾਂ ਟਿਊਬ ਵਿੱਚ ਸਨ।\n#### {total - (x + y + z)}"
