question = "ਐਮਿਲੀ ਇੱਕ ਮਿੰਟ ਵਿੱਚ 6 ਝਿੰਗਾ ਛਿਲ ਸਕਦੀ ਹੈ ਅਤੇ 10 ਮਿੰਟਾਂ ਵਿੱਚ 30 ਝਿੰਗਾ ਭੁੰਨ ਸਕਦੀ ਹੈ। 90 ਝਿੰਗਾ ਨੂੰ ਛਿਲਣ ਅਤੇ ਭੁੰਨਣ ਵਿੱਚ ਉਸਨੂੰ ਕਿੰਨਾ ਸਮਾਂ ਲੱਗੇਗਾ? ਐਮਿਲੀ ਇੱਕੋ ਸਮੇਂ ਛਿਲ ਅਤੇ ਭੁੰਨ ਨਹੀਂ ਸਕਦੀ।"
answer = "ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਇਹ ਪਤਾ ਕਰੋ ਕਿ ਐਮਿਲੀ ਨੂੰ ਝਿੰਗਾ ਛਿਲਣ ਵਿੱਚ ਕਿੰਨਾ ਸਮਾਂ ਲੱਗਦਾ ਹੈ: 90 ਝਿੰਗਾ / 6 ਝਿੰਗਾ/ਮਿੰਟ = <<90/6=15>>15 ਮਿੰਟ\nਫਿਰ ਇਹ ਪਤਾ ਕਰੋ ਕਿ ਉਸਨੂੰ ਪਕਾਉਣ ਲਈ ਝਿੰਗਾ ਦੇ ਕਿੰਨੇ ਬੈਚ ਚਾਹੀਦੇ ਹਨ: 90 ਝਿੰਗਾ / 30 ਝਿੰਗਾ/ਬੈਚ = <<90/30=3>>3 ਬੈਚ\nਫਿਰ ਕੁੱਲ ਪਕਾਉਣ ਦਾ ਸਮਾਂ ਪਤਾ ਕਰਨ ਲਈ ਬੈਚਾਂ ਦੀ ਗਿਣਤੀ ਨੂੰ ਪ੍ਰਤੀ ਬੈਚ ਸਮੇਂ ਨਾਲ ਗੁਣਾ ਕਰੋ: 3 ਬੈਚ * 10 ਮਿੰਟ/ਬੈਚ = <<3*10=30>>30 ਮਿੰਟ\nਫਿਰ ਕੁੱਲ ਸਮਾਂ ਪਤਾ ਕਰਨ ਲਈ ਛਿਲਣ ਦਾ ਸਮਾਂ ਜੋੜੋ ਜੋ ਐਮਿਲੀ ਲਗਾਉਂਦੀ ਹੈ: 30 ਮਿੰਟ + 15 ਮਿੰਟ = <<30+15=45>>45 ਮਿੰਟ\n#### 45\n"
