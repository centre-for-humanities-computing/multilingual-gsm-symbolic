question_annotated = "{name,ਸਿਮਰਨ} ਇੱਕ ਮਿੰਟ ਵਿੱਚ {n1,6} {food,ਝੀਂਗੇ} ਛਿੱਲ ਸਕਦੀ ਹੈ ਅਤੇ {t,10} ਮਿੰਟਾਂ ਵਿੱਚ {n2,30} {food,ਝੀਂਗੇ} ਭੁੰਨ ਸਕਦੀ ਹੈ। {total,90} {food,ਝੀਂਗੇ} ਛਿੱਲਣ ਅਤੇ ਭੁੰਨਣ ਵਿੱਚ ਉਸਨੂੰ ਕਿੰਨਾ ਸਮਾਂ ਲੱਗੇਗਾ? {name,ਸਿਮਰਨ} ਇੱਕੋ ਸਮੇਂ ਛਿੱਲ ਅਤੇ ਭੁੰਨ ਨਹੀਂ ਸਕਦੀ।\n\n#init:\n- name = sample(names_female)\n- food = sample([\"ਝੀਂਗੇ\", \"ਪਿਆਜ਼\", \"ਗਾਜਰਾਂ\", \"ਮਸ਼ਰੂਮ\", \"ਆਲੂ\"])\n- $n1 = range(4, 15)\n- $n2 = range(20, 50, 5)\n- $t = range(5, 20)\n- $total = range(60, 200, 10)\n\n#conditions:\n- divides(total, n1)\n- divides(total, n2)\n\n#answer: total // n1 + (total // n2) * t"
answer_annotated = "ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਇਹ ਪਤਾ ਕਰੋ ਕਿ {name} ਨੂੰ {food} ਛਿੱਲਣ ਵਿੱਚ ਕਿੰਨਾ ਸਮਾਂ ਲੱਗਦਾ ਹੈ: {total} {food} / {n1} {food}/ਮਿੰਟ = <<{total}/{n1}={total//n1}>>{total//n1} ਮਿੰਟ\nਫਿਰ ਇਹ ਪਤਾ ਕਰੋ ਕਿ ਉਸਨੂੰ {food} ਪਕਾਉਣ ਲਈ ਕਿੰਨੇ ਬੈਚ ਚਾਹੀਦੇ ਹਨ: {total} {food} / {n2} {food}/ਬੈਚ = <<{total}/{n2}={total//n2}>>{total//n2} ਬੈਚ\nਫਿਰ ਕੁੱਲ ਪਕਾਉਣ ਦਾ ਸਮਾਂ ਪਤਾ ਕਰਨ ਲਈ ਬੈਚਾਂ ਦੀ ਗਿਣਤੀ ਨੂੰ ਪ੍ਰਤੀ ਬੈਚ ਸਮੇਂ ਨਾਲ ਗੁਣਾ ਕਰੋ: {total//n2} ਬੈਚ * {t} ਮਿੰਟ/ਬੈਚ = <<{total//n2}*{t}={(total//n2)*t}>>{(total//n2)*t} ਮਿੰਟ\nਫਿਰ ਕੁੱਲ ਸਮਾਂ ਪਤਾ ਕਰਨ ਲਈ ਛਿੱਲਣ ਦਾ ਸਮਾਂ ਜੋੜੋ ਜੋ {name} ਲਗਾਉਂਦੀ ਹੈ: {(total//n2)*t} ਮਿੰਟ + {total//n1} ਮਿੰਟ = <<{(total//n2)*t}+{total//n1}={(total//n2)*t + total//n1}>>{(total//n2)*t + total//n1} ਮਿੰਟ\n#### {(total//n2)*t + total//n1}"
