question = "ਕਿਰਨ ਦੇ ਕੁੱਤੇ ਦੇ 8 ਕਤੂਰੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ 3 'ਤੇ ਧੱਬੇ ਹਨ। ਨਵਦੀਪ ਦੇ ਕੁੱਤੇ ਦੇ 12 ਕਤੂਰੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ 4 'ਤੇ ਧੱਬੇ ਹਨ। ਸਾਰੇ ਕਤੂਰਿਆਂ ਵਿੱਚੋਂ ਕਿੰਨੇ ਪ੍ਰਤੀਸ਼ਤ 'ਤੇ ਧੱਬੇ ਹਨ?"
answer = "ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਕਤੂਰਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਪਤਾ ਕਰੋ: 8 ਕਤੂਰੇ + 12 ਕਤੂਰੇ = <<8+12=20>>20 ਕਤੂਰੇ\nਫਿਰ ਧੱਬਿਆਂ ਵਾਲੇ ਕਤੂਰਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਪਤਾ ਕਰੋ: 3 ਕਤੂਰੇ + 4 ਕਤੂਰੇ = <<3+4=7>>7 ਕਤੂਰੇ\nਫਿਰ ਧੱਬਿਆਂ ਵਾਲੇ ਕਤੂਰਿਆਂ ਦੀ ਗਿਣਤੀ ਨੂੰ ਕੁੱਲ ਕਤੂਰਿਆਂ ਦੀ ਗਿਣਤੀ ਨਾਲ ਭਾਗ ਦਿਓ ਅਤੇ ਪ੍ਰਤੀਸ਼ਤ ਪਤਾ ਕਰਨ ਲਈ 100% ਨਾਲ ਗੁਣਾ ਕਰੋ: 7 ਕਤੂਰੇ / 20 ਕਤੂਰੇ * 100% = 35%\n#### 35"
