question = "ਜੈਨੀਫਰ ਦਾ ਕੁੱਤਾ 8 ਕੁੱਤੇ ਦੇ ਬੱਚੇ ਰੱਖਦਾ ਹੈ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ 3 ਦੇ ਦਾਗ ਹਨ। ਬ੍ਰੈਂਡਨ ਦਾ ਕੁੱਤਾ 12 ਕੁੱਤੇ ਦੇ ਬੱਚੇ ਰੱਖਦਾ ਹੈ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ 4 ਦੇ ਦਾਗ ਹਨ। ਸਾਰੇ ਕੁੱਤੇ ਦੇ ਬੱਚਿਆਂ ਵਿੱਚੋਂ ਕਿੰਨੇ ਪ੍ਰਤੀਸ਼ਤ ਦੇ ਦਾਗ ਹਨ?"
answer = "ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਕੁੱਤੇ ਦੇ ਬੱਚਿਆਂ ਦੀ ਕੁੱਲ ਸੰਖਿਆ ਲੱਭੋ: 8 ਕੁੱਤੇ ਦੇ ਬੱਚੇ + 12 ਕੁੱਤੇ ਦੇ ਬੱਚੇ = <<8+12=20>>20 ਕੁੱਤੇ ਦੇ ਬੱਚੇ\nਫਿਰ ਦਾਗ ਵਾਲੇ ਕੁੱਤੇ ਦੇ ਬੱਚਿਆਂ ਦੀ ਕੁੱਲ ਸੰਖਿਆ ਲੱਭੋ: 3 ਕੁੱਤੇ ਦੇ ਬੱਚੇ + 4 ਕੁੱਤੇ ਦੇ ਬੱਚੇ = <<3+4=7>>7 ਕੁੱਤੇ ਦੇ ਬੱਚੇ\nਫਿਰ ਦਾਗ ਵਾਲੇ ਕੁੱਤੇ ਦੇ ਬੱਚਿਆਂ ਦੀ ਗਿਣਤੀ ਨੂੰ ਕੁੱਲ ਕੁੱਤੇ ਦੇ ਬੱਚਿਆਂ ਦੀ ਗਿਣਤੀ ਨਾਲ ਵੰਡੋ ਅਤੇ ਪ੍ਰਤੀਸ਼ਤ ਲੱਭਣ ਲਈ 100% ਨਾਲ ਗੁਣਾ ਕਰੋ: 7 ਕੁੱਤੇ ਦੇ ਬੱਚੇ / 20 ਕੁੱਤੇ ਦੇ ਬੱਚੇ * 100% = 35%\n#### 35\n"
