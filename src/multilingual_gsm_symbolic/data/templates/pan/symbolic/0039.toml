question = "ਇੱਕ ਕਲੀਨਰ ਨੂੰ 80 ਕਲਾਸਾਂ ਵਾਲੇ ਇੱਕ ਸਕੂਲ ਨੂੰ ਸਾਫ਼ ਕਰਨਾ ਪੈਂਦਾ ਹੈ। ਉਸਨੂੰ ਇਹ ਕੰਮ ਪੂਰਾ ਕਰਨ ਲਈ 5 ਦਿਨ ਮਿਲਦੇ ਹਨ। ਇਸ ਵਿੱਚ ਉਸਨੂੰ ਹਰ ਕਲਾਸਾਂ ਲਈ 15 ਮਿੰਟ ਲੱਗਦੇ ਹਨ। ਜੇਕਰ ਉਹ ਹਰ ਦਿਨ 8 ਘੰਟੇ ਕੰਮ ਕਰਦਾ ਹੈ, ਤਾਂ ਉਹ ਆਪਣਾ ਕਿੰਨਾ ਪ੍ਰਤੀਸ਼ਤ ਕੰਮ-ਸਮਾਂ ਕਲਾਸਾਂ ਸਾਫ਼ ਕਰਨ ਵਿੱਚ ਬਿਤਾਉਂਦਾ ਹੈ?"
answer = "ਉਨ੍ਹਾਂ ਨੂੰ ਰੋਜ਼ਾਨਾ 16 ਕਲਾਸਾਂ ਸਾਫ਼ ਕਰਨੀਆਂ ਪੈਂਦੀਆਂ ਹਨ, ਕਿਉਂਕਿ 80 / 5 = <<80/5=16>>16\nਉਹ ਪ੍ਰਤੀ ਦਿਨ 16*15 = <<16*15=240>>240 ਮਿੰਟ ਸਫਾਈ ਵਿੱਚ ਬਿਤਾਉਂਦਾ ਹੈ।\nਉਹ ਪ੍ਰਤੀ ਦਿਨ 8 * 60 = <<8*60=480>>480 ਮਿੰਟ ਕੰਮ ਕਰਦਾ ਹੈ।\nਇਸ ਲਈ, ਉਸਦੇ ਦਿਨ ਦਾ 1/2 ਹਿੱਸਾ ਕਲਾਸਾਂ ਸਾਫ਼ ਕਰਨ ਵਿੱਚ ਬਿਤਦਾ ਹੈ, ਕਿਉਂਕਿ 240 / 480 = <<240/480=0.5>>0.5\nਇਸਦਾ ਪ੍ਰਤੀਸ਼ਤ 0.5 * 100 = <<0.5*100=50>>50\n#### 50\n"
