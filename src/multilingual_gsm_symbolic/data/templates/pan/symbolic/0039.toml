question_annotated = "ਇੱਕ {job,ਕਲੀਨਰ} ਨੂੰ {n,80} {room,ਕਲਾਸਾਂ} ਵਾਲੇ ਇੱਕ {building,ਸਕੂਲ} ਨੂੰ ਸਾਫ਼ ਕਰਨਾ ਪੈਂਦਾ ਹੈ। ਉਸਨੂੰ ਇਹ ਕੰਮ ਪੂਰਾ ਕਰਨ ਲਈ {d,5} ਦਿਨ ਮਿਲਦੇ ਹਨ। ਇਸ ਵਿੱਚ ਉਸਨੂੰ ਹਰ {room,ਕਲਾਸ} ਲਈ {t,15} ਮਿੰਟ ਲੱਗਦੇ ਹਨ। ਜੇਕਰ ਉਹ ਹਰ ਦਿਨ {h,8} ਘੰਟੇ ਕੰਮ ਕਰਦਾ ਹੈ, ਤਾਂ ਉਹ ਆਪਣਾ ਕਿੰਨਾ ਪ੍ਰਤੀਸ਼ਤ ਕੰਮ-ਸਮਾਂ {room,ਕਲਾਸਾਂ} ਸਾਫ਼ ਕਰਨ ਵਿੱਚ ਬਿਤਾਉਂਦਾ ਹੈ?\n\n#init:\n- job = sample([\"ਕਲੀਨਰ\", \"ਜਨਿਟਰ\", \"ਰਖ-ਰਖਾਅ ਵਰਕਰ\"])\n- building = sample([\"ਸਕੂਲ\", \"ਹਸਪਤਾਲ\", \"ਯੂਨੀਵਰਸਿਟੀ\", \"ਦਫ਼ਤਰ ਬਿਲਡਿੰਗ\"])\n- room = sample([\"ਕਲਾਸਾਂ\", \"ਕਮਰੇ\"])\n- $n = range(50, 221, 5)\n- $d = range(3, 12)\n- $t = range(10, 46, 5)\n- $h = range(6, 17)\n\n#conditions:\n- divides(n, d)\n- divides(60, t)\n- (n/d) * t < h * 60\n- is_int(10 * (n/d) * t / (h * 60))\n- is_int(100 * (n/d) * t / (h * 60))\n\n#answer: int(100 * (n/d) * t / (h * 60))\n"
answer_annotated = "ਉਨ੍ਹਾਂ ਨੂੰ ਰੋਜ਼ਾਨਾ {n//d} {room} ਸਾਫ਼ ਕਰਨੀਆਂ ਪੈਂਦੀਆਂ ਹਨ, ਕਿਉਂਕਿ {n} / {d} = <<{n}/{d}={n//d}>>{n//d}\nਉਹ ਪ੍ਰਤੀ ਦਿਨ {n//d}*{t} = <<{n//d}*{t}={(n//d)*t}>>{(n//d)*t} ਮਿੰਟ ਸਫਾਈ ਵਿੱਚ ਬਿਤਾਉਂਦਾ ਹੈ।\nਉਹ ਪ੍ਰਤੀ ਦਿਨ {h} * 60 = <<{h}*60={h*60}>>{h*60} ਮਿੰਟ ਕੰਮ ਕਰਦਾ ਹੈ।\nਇਸ ਲਈ, ਉਸਦੇ ਦਿਨ ਦਾ {Fraction((n//d)*t/(h*60))} ਹਿੱਸਾ {room} ਸਾਫ਼ ਕਰਨ ਵਿੱਚ ਬਿਤਦਾ ਹੈ, ਕਿਉਂਕਿ {(n//d)*t} / {h*60} = <<{(n//d)*t}/{h*60}={((n//d)*t)/(h*60)}>>{((n//d)*t)/(h*60)}\nਇਸਦਾ ਪ੍ਰਤੀਸ਼ਤ {((n//d)*t)/(h*60)} * 100 = <<{((n//d)*t)/(h*60)}*100={int(100 * (n/d) * t / (h * 60))}>>{int(100 * (n/d) * t / (h * 60))}\n#### {int(100 * (n/d) * t / (h * 60))}\n"
