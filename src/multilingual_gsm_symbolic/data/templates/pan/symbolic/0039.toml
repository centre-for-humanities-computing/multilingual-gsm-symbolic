question = "ਇੱਕ ਕਲੀਨਰ ਨੇ ਇੱਕ ਸਕੂਲ ਦੀ ਸਫ਼ਾਈ ਕਰਨੀ ਹੈ, ਜਿਸ ਵਿੱਚ 80 ਕਲਾਸਰੂਮ ਹਨ। ਉਸ ਨੂੰ ਇਹ ਕੰਮ ਪੂਰਾ ਕਰਨ ਲਈ 5 ਦਿਨ ਮਿਲਦੇ ਹਨ। ਉਸ ਨੂੰ ਹਰ ਕਲਾਸਰੂਮ ਲਈ 15 ਮਿੰਟ ਲੱਗਦੇ ਹਨ। ਜੇ ਉਹ ਹਰ ਦਿਨ 8 ਘੰਟੇ ਕੰਮ ਕਰਦਾ ਹੈ, ਤਾਂ ਔਸਤਨ ਉਸ ਦੇ ਦਿਨ ਦਾ ਕਿੰਨੇ ਪ੍ਰਤੀਸ਼ਤ ਕਲਾਸਰੂਮ ਸਾਫ਼ ਕਰਨ ਵਿੱਚ ਲੱਗਦਾ ਹੈ?"
answer = "ਉਸ ਨੂੰ ਰੋਜ਼ਾਨਾ 16 ਕਲਾਸਰੂਮ ਸਾਫ਼ ਕਰਨੇ ਪੈਂਦੇ ਹਨ, ਕਿਉਂਕਿ 80 / 5 = <<80/5=16>>16\nਉਹ ਹਰ ਦਿਨ 240 ਮਿੰਟ ਸਫ਼ਾਈ ਵਿੱਚ ਲਾਉਂਦਾ ਹੈ, ਕਿਉਂਕਿ 16*15 = <<16*15=240>>240\nਉਹ ਹਰ ਦਿਨ 4 ਘੰਟੇ ਸਫ਼ਾਈ ਵਿੱਚ ਲਾਉਂਦਾ ਹੈ, ਕਿਉਂਕਿ 240 / 60 = <<240/60=4>>4\nਉਹ ਆਪਣੇ ਦਿਨ ਦਾ 1/2 ਹਿੱਸਾ ਕਲਾਸਰੂਮ ਸਾਫ਼ ਕਰਨ ਵਿੱਚ ਲਾਉਂਦਾ ਹੈ, ਕਿਉਂਕਿ 4 / 8 = <<4/8=0.5>>0.5\nਉਹ ਆਪਣੇ ਦਿਨ ਦਾ 50% ਕਲਾਸਰੂਮ ਸਾਫ਼ ਕਰਨ ਵਿੱਚ ਲਾਉਂਦਾ ਹੈ, ਕਿਉਂਕਿ 0.5*100 = <<0.5*100=50>>50\n#### 50"
