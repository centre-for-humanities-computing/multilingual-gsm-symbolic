question_annotated = "{name,ਡੈਕਸ} ਆਪਣੇ {place,ਖੇਤ} ਵਿੱਚ ਗਏ ਕੁਝ {fruit,ਸੇਬ} ਚੁਣਨ ਲਈ ਅਤੇ {location,ਬਾਗ਼} ਵਿੱਚ {insect2,ਚਿੱਟੀਆਂ} ਦੇ ਮੁਕਾਬਲੇ {frac_txt,ਅੱਧਾ} {insect1,ਕੀੜੇ} ਪਾਏ। ਜੇਕਰ {n,50} {insect2,ਚਿੱਟੀਆਂ} ਸਨ, ਤਾਂ {location,ਬਾਗ਼} ਵਿੱਚ ਕੀੜਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਦੀ ਗਣਨਾ ਕਰੋ।\n\n#init:\n- name = sample(names)\n- place = sample([\"ਬਾਗ਼ੀਚਾ\", \"ਪਿਛਲਾ ਖੇਤ\", \"ਗ੍ਰੀਨਹਾਊਸ\", \"ਜ਼ਮੀਨ\"])\n- fruit = sample([\"ਸਟ੍ਰਾਬੇਰੀਆਂ\", \"ਚੈਰੀਆਂ\", \"ਬਲੂਬੇਰੀਆਂ\", \"ਰੈਸਪਬੇਰੀਆਂ\"])\n- location = sample([\"ਬਾਗ਼\", \"ਖੇਤ\", \"ਟੁਕੜਾ\", \"ਪੈਚ\"])\n- insect1, insect2 = sample([\"ਬੀਟਲ\", \"ਲੇਡੀ ਬੱਗ\", \"ਘਾਹ ਖਾਣ ਵਾਲੇ\", \"ਕੈਟਰਪਿਲਰ\", \"ਮੱਖੀਆਂ\", \"ਭੰਬਰੇ\"], 2)\n- frac_txt, frac_val = sample(fraction_alnum)\n- $n = range(20, 201)\n\n#conditions:\n- is_int(n * frac_val)\n\n#answer: n + int(n * frac_val)\n"
answer_annotated = "ਜੇਕਰ {n} {insect2} ਸਨ, ਤਾਂ {location} ਵਿੱਚ {insect1} ਦੀ ਕੁੱਲ ਗਿਣਤੀ {frac_val}*{n} = {int(n * frac_val)} {insect1} ਹੈ\n{location} ਵਿੱਚ ਕੀੜਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ {int(n * frac_val)} {insect1} + {n} {insect2} = <<{int(n * frac_val)}+{n}={n + int(n * frac_val)}>>{n + int(n * frac_val)} ਹੈ\n#### {n + int(n * frac_val)}\n"
