question = "ਕਿਰਨ ਕੁਝ ਸੇਬ ਤੋੜਨ ਲਈ ਆਪਣੇ ਖੇਤ ਵਿੱਚ ਗਏ ਅਤੇ ਉਹਨਾਂ ਨੇ ਦੇਖਿਆ ਕਿ ਬਾਗ਼ ਵਿੱਚ ਮੱਖੀਆਂ ਦੀ ਗਿਣਤੀ ਕੀੜੀਆਂ ਦੀ ਗਿਣਤੀ ਦਾ ਅੱਧਾ ਹਿੱਸਾ ਸੀ। ਜੇਕਰ 50 ਕੀੜੀਆਂ ਸਨ, ਤਾਂ ਬਾਗ਼ ਵਿੱਚ ਕੀੜੇ-ਮਕੌੜਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਕੱਢੋ।"
answer = "ਜੇਕਰ 50 ਕੀੜੀਆਂ ਸਨ, ਤਾਂ ਬਾਗ਼ ਵਿੱਚ ਮੱਖੀਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 1/2*50 = 25 ਮੱਖੀਆਂ ਹੈ\nਬਾਗ਼ ਵਿੱਚ ਕੀੜੇ-ਮਕੌੜਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 25 ਮੱਖੀਆਂ + 50 ਕੀੜੀਆਂ = <<25+50=75>>75 ਹੈ\n#### 75"
