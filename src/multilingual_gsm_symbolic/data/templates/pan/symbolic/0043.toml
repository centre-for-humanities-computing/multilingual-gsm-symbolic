question = "ਡੈਕਸ ਆਪਣੇ ਖੇਤ ਵਿੱਚ ਗਏ ਕੁਝ ਸੇਬ ਚੁਣਨ ਲਈ ਅਤੇ ਬਾਗ਼ ਵਿੱਚ ਚਿੱਟੀਆਂ ਦੇ ਮੁਕਾਬਲੇ ਅੱਧਾ ਕੀੜੇ ਪਾਏ। ਜੇਕਰ 50 ਚਿੱਟੀਆਂ ਸਨ, ਤਾਂ ਬਾਗ਼ ਵਿੱਚ ਕੀੜਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਦੀ ਗਣਨਾ ਕਰੋ।"
answer = "ਜੇਕਰ 50 ਚਿੱਟੀਆਂ ਸਨ, ਤਾਂ ਬਾਗ਼ ਵਿੱਚ ਕੀੜੇ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 1/2*50 = 25 ਕੀੜੇ ਹੈ\nਬਾਗ਼ ਵਿੱਚ ਕੀੜਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 25 ਕੀੜੇ + 50 ਚਿੱਟੀਆਂ = <<25+50=75>>75 ਹੈ\n#### 75\n"
