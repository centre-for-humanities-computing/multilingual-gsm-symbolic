question_annotated = "{name,ਕਿਰਨ} ਕੁਝ {fruit,ਸੇਬ} ਤੋੜਨ ਲਈ ਆਪਣੇ {place,ਖੇਤ} ਵਿੱਚ ਗਏ ਅਤੇ ਉਹਨਾਂ ਨੇ ਦੇਖਿਆ ਕਿ {location,ਬਾਗ਼} ਵਿੱਚ {insect1,ਮੱਖੀਆਂ} ਦੀ ਗਿਣਤੀ {insect2,ਕੀੜੀਆਂ} ਦੀ ਗਿਣਤੀ ਦਾ {frac_txt,ਅੱਧਾ} ਹਿੱਸਾ ਸੀ। ਜੇਕਰ {n,50} {insect2,ਕੀੜੀਆਂ} ਸਨ, ਤਾਂ {location,ਬਾਗ਼} ਵਿੱਚ ਕੀੜੇ-ਮਕੌੜਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਕੱਢੋ।\n\n#init:\n- name = sample(names)\n- place = sample([\"ਬਗੀਚੇ\", \"ਪਿਛਵਾੜੇ\", \"ਗ੍ਰੀਨਹਾਊਸ\", \"ਫਾਰਮ\"])\n- fruit = sample([\"ਅਮਰੂਦ\", \"ਅੰਬ\", \"ਸੰਤਰੇ\", \"ਲੀਚੀਆਂ\"])\n- location = sample([\"ਬਾਗ਼\", \"ਖੇਤ\", \"ਪਲਾਟ\", \"ਕਿਆਰੀ\"])\n- insect1, insect2 = sample([\"ਸੁੰਡੀਆਂ\", \"ਟਿੱਡੀਆਂ\", \"ਮਧੂ-ਮੱਖੀਆਂ\", \"ਭਰਿੰਡਾਂ\", \"ਤਿਤਲੀਆਂ\", \"ਮੱਕੜੀਆਂ\"], 2)\n- frac_txt, frac_val = sample(fraction_alnum)\n- $n = range(20, 201)\n\n#conditions:\n- is_int(n * frac_val)\n\n#answer: n + int(n * frac_val)"
answer_annotated = "ਜੇਕਰ {n} {insect2} ਸਨ, ਤਾਂ {location} ਵਿੱਚ {insect1} ਦੀ ਕੁੱਲ ਗਿਣਤੀ {frac_val}*{n} = {int(n * frac_val)} {insect1} ਹੈ\n{location} ਵਿੱਚ ਕੀੜੇ-ਮਕੌੜਿਆਂ ਦੀ ਕੁੱਲ ਗਿਣਤੀ {int(n * frac_val)} {insect1} + {n} {insect2} = <<{int(n * frac_val)}+{n}={n + int(n * frac_val)}>>{n + int(n * frac_val)} ਹੈ\n#### {n + int(n * frac_val)}"
