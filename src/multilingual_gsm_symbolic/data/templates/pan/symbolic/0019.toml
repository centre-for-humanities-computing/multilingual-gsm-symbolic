question = "60-ਸਵਾਲਾਂ ਵਾਲੀ ਪ੍ਰੀਖਿਆ ਵਿੱਚ, 40% ਸਵਾਲ ਸਰਲ ਹਨ, ਅਤੇ ਬਾਕੀ ਮੱਧਮ ਅਤੇ ਮੁਸ਼ਕਲ ਸਵਾਲਾਂ ਵਿੱਚ ਬਰਾਬਰ ਵੰਡੇ ਹੋਏ ਹਨ। ਜੇਕਰ ਜਸਲੀਨ ਨੂੰ ਪੱਕਾ ਯਕੀਨ ਹੈ ਕਿ ਉਹ ਸਰਲ ਸਵਾਲਾਂ ਵਿੱਚੋਂ 75% ਅਤੇ ਮੱਧਮ ਅਤੇ ਮੁਸ਼ਕਲ ਸਵਾਲਾਂ ਦਾ ਅੱਧਾ ਹਿੱਸਾ ਸਹੀ ਕਰ ਲਵੇਗੀ, ਤਾਂ ਉਸਨੂੰ ਪੱਕੇ ਤੌਰ 'ਤੇ ਕਿੰਨੇ ਅੰਕ ਮਿਲਣਗੇ?"
answer = "ਮੱਧਮ ਅਤੇ ਮੁਸ਼ਕਲ ਸਵਾਲ ਪ੍ਰੀਖਿਆ ਦਾ 100% - 40% = 60% ਬਣਾਉਂਦੇ ਹਨ।\n60 ਸਵਾਲਾਂ ਵਿੱਚੋਂ 40/100 = <<60*40/100=24>>24 ਸਰਲ ਸਵਾਲ ਹਨ।\nਕੁੱਲ 60 ਸਵਾਲਾਂ ਵਿੱਚੋਂ 60/100 = <<60*60/100=36>>36 ਮੱਧਮ ਅਤੇ ਮੁਸ਼ਕਲ ਸਵਾਲ ਹਨ।\nਜੇਕਰ ਜਸਲੀਨ ਨੂੰ ਸਰਲ ਸਵਾਲਾਂ ਵਿੱਚੋਂ 75% ਪੱਕੇ ਤੌਰ 'ਤੇ ਮਿਲਦੇ ਹਨ, ਤਾਂ ਇਸਦਾ ਮਤਲਬ ਹੈ ਕਿ ਉਸਨੂੰ ਆਪਣੇ 24 ਸਵਾਲਾਂ ਵਿੱਚੋਂ 75/100 = <<24*75/100=18>>18 ਅੰਕ ਪੱਕੇ ਹਨ।\nਮੱਧਮ ਅਤੇ ਮੁਸ਼ਕਲ ਸਵਾਲਾਂ ਵਿੱਚੋਂ ਉਹ ਅੱਧਾ ਹਿੱਸਾ ਸਹੀ ਕਰ ਲਵੇਗੀ, ਇਸ ਲਈ ਇਹ 36 ਸਵਾਲ*1/2 = <<36*1/2=18>>18 ਅੰਕ ਬਣਦੇ ਹਨ।\nਇਸ ਲਈ, ਉਸਨੂੰ ਆਪਣੀ ਪ੍ਰੀਖਿਆ ਵਿੱਚ 18 ਅੰਕ + 18 ਅੰਕ = <<18+18=36>>36 ਅੰਕ ਪੱਕੇ ਤੌਰ 'ਤੇ ਮਿਲਣਗੇ।\n#### 36"
