question_annotated = "{n,60}-ਸਵਾਲਾਂ ਵਾਲੀ ਪ੍ਰੀਖਿਆ ਵਿੱਚ, {p1,40}% ਸਵਾਲ {s1,ਸਰਲ} ਹਨ, ਅਤੇ ਬਾਕੀ {s2,ਮੱਧਮ} ਅਤੇ {s3,ਮੁਸ਼ਕਲ} ਸਵਾਲਾਂ ਵਿੱਚ ਬਰਾਬਰ ਵੰਡੇ ਹੋਏ ਹਨ। ਜੇਕਰ {name,ਜਸਲੀਨ} ਨੂੰ ਪੱਕਾ ਯਕੀਨ ਹੈ ਕਿ ਉਹ {s1,ਸਰਲ} ਸਵਾਲਾਂ ਵਿੱਚੋਂ {r1,75}% ਅਤੇ {s2,ਮੱਧਮ} ਅਤੇ {s3,ਮੁਸ਼ਕਲ} ਸਵਾਲਾਂ ਦਾ {frac_txt,ਅੱਧਾ} ਹਿੱਸਾ ਸਹੀ ਕਰ ਲਵੇਗੀ, ਤਾਂ ਉਸਨੂੰ ਪੱਕੇ ਤੌਰ 'ਤੇ ਕਿੰਨੇ ਅੰਕ ਮਿਲਣਗੇ?\n\n#init:\n- s1, s2, s3 = sample([\"ਇਤਿਹਾਸ\", \"ਭੂਗੋਲ\", \"ਜੀਵ ਵਿਗਿਆਨ\", \"ਰਸਾਇਣ ਵਿਗਿਆਨ\", \"ਭੌਤਿਕ ਵਿਗਿਆਨ\", \"ਅਰਥ ਸ਼ਾਸਤਰ\", \"ਸਾਹਿਤ\", \"ਬੀਜਗਣਿਤ\", \"ਰੇਖਾ ਗਣਿਤ\" ], 3)\n- name = sample(names_female)\n- frac_txt, frac_val = sample(fraction_alnum)\n- $p1 = range(5, 71, 5)\n- $r1 = range(5, 101, 5)\n- $n = range(10, 151, 10)\n\n#conditions:\n- is_int(n * (p1/100))\n- is_int(n * (p1/100) * (r1/100))\n- is_int(n*(1-(p1/100))*frac_val)\n\n#answer: ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)"
answer_annotated = "{s2} ਅਤੇ {s3} ਸਵਾਲ ਪ੍ਰੀਖਿਆ ਦਾ 100% - {p1}% = {100-p1}% ਬਣਾਉਂਦੇ ਹਨ।\n{n} ਸਵਾਲਾਂ ਵਿੱਚੋਂ {p1}/100 = <<{n}*{p1}/100={ensure_int(n * (p1/100))}>>{ensure_int(n * (p1/100))} {s1} ਸਵਾਲ ਹਨ।\nਕੁੱਲ {n} ਸਵਾਲਾਂ ਵਿੱਚੋਂ {100-p1}/100 = <<{n}*{100-p1}/100={ensure_int(n*(1-(p1/100)))}>>{ensure_int(n*(1-(p1/100)))} {s2} ਅਤੇ {s3} ਸਵਾਲ ਹਨ।\nਜੇਕਰ {name} ਨੂੰ {s1} ਸਵਾਲਾਂ ਵਿੱਚੋਂ {r1}% ਪੱਕੇ ਤੌਰ 'ਤੇ ਮਿਲਦੇ ਹਨ, ਤਾਂ ਇਸਦਾ ਮਤਲਬ ਹੈ ਕਿ ਉਸਨੂੰ ਆਪਣੇ {ensure_int(n * (p1/100))} ਸਵਾਲਾਂ ਵਿੱਚੋਂ {r1}/100 = <<{ensure_int(n * (p1/100))}*{r1}/100={ensure_int(n * (p1/100) * (r1/100))}>>{ensure_int(n * (p1/100) * (r1/100))} ਅੰਕ ਪੱਕੇ ਹਨ।\n{s2} ਅਤੇ {s3} ਸਵਾਲਾਂ ਵਿੱਚੋਂ ਉਹ {frac_txt} ਹਿੱਸਾ ਸਹੀ ਕਰ ਲਵੇਗੀ, ਇਸ ਲਈ ਇਹ {ensure_int(n*(1-(p1/100)))} ਸਵਾਲ*{frac_val} = <<{ensure_int(n*(1-(p1/100)))}*{frac_val}={ensure_int(n*(1-(p1/100))*frac_val)}>>{ensure_int(n*(1-(p1/100))*frac_val)} ਅੰਕ ਬਣਦੇ ਹਨ।\nਇਸ ਲਈ, ਉਸਨੂੰ ਆਪਣੀ ਪ੍ਰੀਖਿਆ ਵਿੱਚ {ensure_int(n * (p1/100) * (r1/100))} ਅੰਕ + {ensure_int(n*(1-(p1/100))*frac_val)} ਅੰਕ = <<{ensure_int(n * (p1/100) * (r1/100))}+{ensure_int(n*(1-(p1/100))*frac_val)}={ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)}>>{ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)} ਅੰਕ ਪੱਕੇ ਤੌਰ 'ਤੇ ਮਿਲਣਗੇ।\n#### {ensure_int(n * (p1/100) * (r1/100)) + ensure_int(n*(1-(p1/100))*frac_val)}"
