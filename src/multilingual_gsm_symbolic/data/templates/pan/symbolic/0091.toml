question = "ਹਰਜੀਤ ਦੇ ਘਰ ਵਿੱਚ, ਅਮਰੂਦ ਨਾਲੋਂ ਸੇਬ ਦੀ ਗਿਣਤੀ ਦੋ ਗੁਣਾ ਹੈ। ਉਸ ਕੋਲ ਘਰ ਵਿੱਚ ਕੁੱਲ 40 ਅਮਰੂਦ ਹਨ। ਹਰਜੀਤ ਨੇ ਦੁਕਾਨ ਤੋਂ 60 ਹੋਰ ਅਮਰੂਦ ਅਤੇ ਅਮਰੂਦ ਦੀ ਗਿਣਤੀ ਨਾਲੋਂ 40 ਘੱਟ ਸੇਬ ਖਰੀਦੇ। ਘਰ ਵਿੱਚ ਹਰਜੀਤ ਕੋਲ ਮੌਜੂਦ ਸੇਬ ਅਤੇ ਅਮਰੂਦ ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਪਤਾ ਕਰੋ?"
answer = "ਕਿਸੇ ਵੀ ਸੇਬ ਅਤੇ ਅਮਰੂਦ ਖਰੀਦਣ ਤੋਂ ਪਹਿਲਾਂ, ਹਰਜੀਤ ਕੋਲ ਅਮਰੂਦ ਨਾਲੋਂ ਸੇਬ ਦੋ ਗੁਣਾ ਸਨ, ਜੋ ਕਿ 40 ਅਮਰੂਦ * 2 ਸੇਬ/ਅਮਰੂਦ = <<40*2=80>>80 ਸੇਬ ਹਨ\nਹਰਜੀਤ ਕੋਲ ਪਹਿਲਾਂ ਸੇਬ ਅਤੇ ਅਮਰੂਦ ਦੀ ਕੁੱਲ ਗਿਣਤੀ 80 ਸੇਬ + 40 ਅਮਰੂਦ = <<80+40=120>>120 ਚੀਜ਼ਾਂ ਹਨ\nਜਦੋਂ ਉਸਨੇ ਅਮਰੂਦ ਨਾਲੋਂ 40 ਸੇਬ ਘੱਟ ਖਰੀਦੇ, ਉਸਨੇ 60 ਸੇਬ - 40 ਸੇਬ = <<60-40=20>>20 ਸੇਬ ਖਰੀਦੇ\nਕੁੱਲ ਮਿਲਾ ਕੇ, ਉਸਨੇ 20 ਸੇਬ + 60 ਅਮਰੂਦ = <<20+60=80>>80 ਚੀਜ਼ਾਂ ਖਰੀਦੀਆਂ\nਖਰੀਦਦਾਰੀ ਤੋਂ ਬਾਅਦ, ਹਰਜੀਤ ਕੋਲ 120 ਚੀਜ਼ਾਂ + 80 ਚੀਜ਼ਾਂ = <<120+80=200>>200 ਕੁੱਲ ਸੇਬ ਅਤੇ ਅਮਰੂਦ ਮਿਲਾ ਕੇ ਹਨ।\n#### 200"
