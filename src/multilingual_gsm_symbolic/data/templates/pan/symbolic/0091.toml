question_annotated = "{name,ਹਰਜੀਤ} ਦੇ ਘਰ ਵਿੱਚ, {food2,ਅਮਰੂਦ} ਨਾਲੋਂ {food1,ਸੇਬ} ਦੀ ਗਿਣਤੀ {mult_txt,ਦੋ ਗੁਣਾ} ਹੈ। ਉਸ ਕੋਲ ਘਰ ਵਿੱਚ ਕੁੱਲ {n,40} {food2,ਅਮਰੂਦ} ਹਨ। {name,ਹਰਜੀਤ} ਨੇ ਦੁਕਾਨ ਤੋਂ {m,60} ਹੋਰ {food2,ਅਮਰੂਦ} ਅਤੇ {food2,ਅਮਰੂਦ} ਦੀ ਗਿਣਤੀ ਨਾਲੋਂ {k,40} ਘੱਟ {food1,ਸੇਬ} ਖਰੀਦੇ। ਘਰ ਵਿੱਚ {name,ਹਰਜੀਤ} ਕੋਲ ਮੌਜੂਦ {food1,ਸੇਬ} ਅਤੇ {food2,ਅਮਰੂਦ} ਦੀ ਕੁੱਲ ਗਿਣਤੀ ਪਤਾ ਕਰੋ?\n\n#init:\n- name = sample(names_male)\n- food1, food2 = sample([\"ਲੱਡੂ\",\"ਸੇਬ\", \"ਅਮਰੂਦ\", \"ਅੰਬ\", \"ਅੰਗੂਰ\", \"ਅੰਜੀਰ\", \"ਆੜੂ\", \"ਅਨਾਰ\", \"ਨਾਰੀਅਲ\", \"ਅਖਰੋਟ\", \"ਬੇਰ\"], 2)\n- mult_txt, mult_val = sample(multi_times)\n- $n = range(20, 100)\n- $m = range(30, 100)\n- $k = range(10, 50)\n\n#conditions:\n- m > k\n\n#answer: mult_val*n + n + m + (m-k)"
answer_annotated = "ਕਿਸੇ ਵੀ {food1} ਅਤੇ {food2} ਖਰੀਦਣ ਤੋਂ ਪਹਿਲਾਂ, {name} ਕੋਲ {food2} ਨਾਲੋਂ {food1} {mult_txt} ਸਨ, ਜੋ ਕਿ {n} {food2} * {mult_val} {food1}/{food2} = <<{n}*{mult_val}={n*mult_val}>>{n*mult_val} {food1} ਹਨ\n{name} ਕੋਲ ਪਹਿਲਾਂ {food1} ਅਤੇ {food2} ਦੀ ਕੁੱਲ ਗਿਣਤੀ {n*mult_val} {food1} + {n} {food2} = <<{n*mult_val}+{n}={n*mult_val+n}>>{n*mult_val+n} ਚੀਜ਼ਾਂ ਹਨ\nਜਦੋਂ ਉਸਨੇ {food2} ਨਾਲੋਂ {k} {food1} ਘੱਟ ਖਰੀਦੇ, ਉਸਨੇ {m} {food1} - {k} {food1} = <<{m}-{k}={m-k}>>{m-k} {food1} ਖਰੀਦੇ\nਕੁੱਲ ਮਿਲਾ ਕੇ, ਉਸਨੇ {m-k} {food1} + {m} {food2} = <<{m-k}+{m}={2*m-k}>>{2*m-k} ਚੀਜ਼ਾਂ ਖਰੀਦੀਆਂ\nਖਰੀਦਦਾਰੀ ਤੋਂ ਬਾਅਦ, {name} ਕੋਲ {n*mult_val+n} ਚੀਜ਼ਾਂ + {2*m-k} ਚੀਜ਼ਾਂ = <<{n*mult_val+n}+{2*m-k}={n*mult_val+n+2*m-k}>>{n*mult_val+n+2*m-k} ਕੁੱਲ {food1} ਅਤੇ {food2} ਮਿਲਾ ਕੇ ਹਨ।\n#### {n*mult_val+n+2*m-k}"
