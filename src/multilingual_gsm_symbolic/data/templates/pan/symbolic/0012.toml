question = "ਮਨਦੀਪ ਕੁਝ ਟਰੇ ਲੈ ਕੇ ਉਹਨਾਂ ਉੱਤੇ ਅੰਡੇ ਰੱਖਦਾ ਹੈ। ਹਰ ਟਰੇ ਵਿੱਚ 24 ਅੰਡੇ ਆ ਸਕਦੇ ਹਨ। ਜੇਕਰ ਉਸ ਕੋਲ 64 ਅੰਡੇ ਅਤੇ 2 ਟਰੇ ਹਨ, ਤਾਂ ਉਹ ਕਿੰਨੇ ਅੰਡੇ ਟਰੇ ਉੱਤੇ ਨਹੀਂ ਰੱਖ ਸਕੇਗਾ?"
