question = "ਕੋਮੈਟ ਹੈਲੀ ਹਰ 75 ਸਾਲਾਂ ਵਿੱਚ ਸੂਰਜ ਦਾ ਚੱਕਰ ਲਗਾਉਂਦੀ ਹੈ। ਬਿਲ ਦਾ ਪਿਤਾ ਨੇ ਕੋਮੈਟ ਨੂੰ ਦੇਖਿਆ ਸੀ ਜਦੋਂ ਉਹ 30 ਸਾਲ ਦਾ ਸੀ। ਬਿਲ ਨੇ ਕੋਮੈਟ ਨੂੰ ਦੂਜੀ ਵਾਰ ਤਦ ਦੇਖਿਆ ਜਦੋਂ ਉਹ ਉਸਦੇ ਪਿਤਾ ਦੀ ਉਮਰ ਦਾ ਤਿੰਨ ਗੁਣਾ ਸੀ ਜਦੋਂ ਉਸਨੇ ਕੋਮੈਟ ਨੂੰ ਦੇਖਿਆ ਸੀ। ਜਦੋਂ ਬਿਲ ਨੇ ਕੋਮੈਟ ਨੂੰ ਪਹਿਲੀ ਵਾਰ ਦੇਖਿਆ ਸੀ ਤਾਂ ਉਹ ਕਿੰਨੇ ਸਾਲ ਦਾ ਸੀ?"
