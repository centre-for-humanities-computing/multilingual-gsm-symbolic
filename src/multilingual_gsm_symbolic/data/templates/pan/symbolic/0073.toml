question = "ਕੋਮੈਟ ਹੈਲੀ ਹਰ 75 ਸਾਲਾਂ ਵਿੱਚ ਸੂਰਜ ਦਾ ਚੱਕਰ ਲਗਾਉਂਦੀ ਹੈ। ਬਿਲ ਦੇ ਪਿਤਾ ਨੇ ਕੋਮੈਟ ਨੂੰ ਤਦ ਦੇਖਿਆ ਸੀ ਜਦੋਂ ਉਹ 30 ਸਾਲ ਦੇ ਸਨ। ਬਿਲ ਨੇ ਕੋਮੈਟ ਨੂੰ ਦੂਜੀ ਵਾਰ ਤਦ ਦੇਖਿਆ ਜਦੋਂ ਉਹ ਆਪਣੇ ਪਿਤਾ ਦੀ ਉਮਰ ਦੇ ਤਿੰਨ ਗੁਣਾ ਦੇ ਬਰਾਬਰ ਸਨ। ਜਦੋਂ ਬਿਲ ਨੇ ਕੋਮੈਟ ਨੂੰ ਪਹਿਲੀ ਵਾਰ ਦੇਖਿਆ ਸੀ, ਉਹ ਕਿੰਨੇ ਸਾਲ ਦੇ ਸਨ?"
answer = "ਬਿਲ ਨੇ ਕੋਮੈਟ ਨੂੰ ਦੂਜੀ ਵਾਰ ਤਦ ਦੇਖਿਆ ਜਦੋਂ ਉਹ 30 * 3 = <<30*3=90>>90 ਸਾਲ ਦੇ ਸਨ।\nਕੋਮੈਟ ਹੈਲੀ ਹਰ 75 ਸਾਲਾਂ ਵਿੱਚ ਦਿਖਾਈ ਦਿੰਦੀ ਹੈ, ਇਸ ਲਈ ਪਹਿਲੀ ਵਾਰ ਦੀ ਉਮਰ 90 - 75 = <<90-75=15>>15 ਸੀ।\n#### 15\n"
