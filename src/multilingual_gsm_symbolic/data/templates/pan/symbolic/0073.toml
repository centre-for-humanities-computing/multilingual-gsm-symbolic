question = "ਹੈਲੀ ਪੂਛਲ ਤਾਰਾ ਹਰ 75 ਸਾਲਾਂ ਵਿੱਚ ਸੂਰਜ ਦਾ ਚੱਕਰ ਲਗਾਉਂਦਾ ਹੈ। ਹਰਜੀਤ ਦੇ ਪਿਤਾ ਜੀ ਨੇ ਪੂਛਲ ਤਾਰਾ ਉਦੋਂ ਦੇਖਿਆ ਸੀ ਜਦੋਂ ਉਹ 30 ਸਾਲ ਦੇ ਸਨ। ਹਰਜੀਤ ਨੇ ਪੂਛਲ ਤਾਰਾ ਦੂਜੀ ਵਾਰ ਉਦੋਂ ਦੇਖਿਆ ਜਦੋਂ ਉਸਦੀ ਉਮਰ ਉਸ ਉਮਰ ਤੋਂ ਤਿੰਨ ਗੁਣਾ ਸੀ ਜਿਸ ਉਮਰ ਵਿੱਚ ਉਸਦੇ ਪਿਤਾ ਜੀ ਨੇ ਪੂਛਲ ਤਾਰਾ ਦੇਖਿਆ ਸੀ। ਜਦੋਂ ਹਰਜੀਤ ਨੇ ਪੂਛਲ ਤਾਰਾ ਪਹਿਲੀ ਵਾਰ ਦੇਖਿਆ ਸੀ, ਉਦੋਂ ਉਹ ਕਿੰਨੇ ਸਾਲ ਦਾ ਸੀ?"
answer = "ਹਰਜੀਤ ਨੇ ਪੂਛਲ ਤਾਰਾ ਦੂਜੀ ਵਾਰ ਉਦੋਂ ਦੇਖਿਆ ਜਦੋਂ ਉਹ 30 ਸਾਲ * 3 = <<30*3=90>>90 ਸਾਲ ਦਾ ਸੀ।\nਹੈਲੀ ਪੂਛਲ ਤਾਰਾ ਹਰ 75 ਸਾਲਾਂ ਵਿੱਚ ਦਿਖਾਈ ਦਿੰਦਾ ਹੈ, ਇਸ ਲਈ ਹਰਜੀਤ ਨੇ ਪੂਛਲ ਤਾਰਾ ਪਹਿਲੀ ਵਾਰ ਉਦੋਂ ਦੇਖਿਆ ਜਦੋਂ ਉਹ 90 ਸਾਲ - 75 ਸਾਲ = <<90-75=15>>15 ਸਾਲ ਦਾ ਸੀ।\n#### 15"
