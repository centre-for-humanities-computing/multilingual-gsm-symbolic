question = "100 ਲੋਕ ਗੂਗਲ ਵਿੱਚ ਨੌਕਰੀ ਲਈ ਅਰਜ਼ੀ ਦਿੰਦੇ ਹਨ। ਅਰਜ਼ੀ ਦੇਣ ਵਾਲਿਆਂ ਵਿੱਚੋਂ, ਸਿਰਫ਼ 30% ਨੂੰ ਇੰਟਰਵਿਊ ਮਿਲਦੇ ਹਨ। ਜਿਨ੍ਹਾਂ ਨੂੰ ਇੰਟਰਵਿਊ ਮਿਲਦੇ ਹਨ, ਉਨ੍ਹਾਂ ਵਿੱਚੋਂ 20% ਨੂੰ ਨੌਕਰੀ ਦੀ ਪੇਸ਼ਕਸ਼ ਮਿਲਦੀ ਹੈ। ਜਿਨ੍ਹਾਂ ਨੂੰ ਨੌਕਰੀ ਦੀ ਪੇਸ਼ਕਸ਼ ਮਿਲਦੀ ਹੈ, ਉਨ੍ਹਾਂ ਵਿੱਚੋਂ ਇੱਕ ਤੀਜਾ ਲੋਕ ਪਦਵੀ ਸਵੀਕਾਰ ਕਰਦੇ ਹਨ। ਕਿੰਨੇ ਲੋਕ ਪਦਵੀ ਸਵੀਕਾਰ ਕਰਦੇ ਹਨ?"
