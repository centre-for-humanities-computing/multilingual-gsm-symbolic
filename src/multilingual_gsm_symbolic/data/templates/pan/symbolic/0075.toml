question = "ਇਸ ਵੇਲੇ 3 ਲਾਲ ਗੇਂਦਾਂ, 11 ਨੀਲਾ ਗੇਂਦਾਂ ਅਤੇ 25 ਹਰਾ ਗੇਂਦਾਂ ਦੁਕਾਨ ਵਿੱਚ ਹਨ। ਲਾਲ ਗੇਂਦਾਂ ਦੀ ਕੀਮਤ $9 ਹੈ, ਨੀਲਾ ਗੇਂਦਾਂ ਦੀ ਕੀਮਤ $5 ਹੈ ਅਤੇ ਹਰਾ ਗੇਂਦਾਂ ਦੀ ਕੀਮਤ $3 ਹੈ। ਜਦੋਂ ਸਾਰੀਆਂ ਗੇਂਦਾਂ ਵੇਚੀਆਂ ਜਾਣਗੀਆਂ, ਤਾਂ ਦੁਕਾਨ ਨੂੰ ਕਿੰਨੀ ਰਕਮ ਮਿਲੇਗੀ?"
