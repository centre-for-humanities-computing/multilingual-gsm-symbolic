question = "ਇਸ ਵੇਲੇ 3 ਲਾਲ ਗੇਂਦਾਂ, 11 ਨੀਲੀਆਂ ਗੇਂਦਾਂ ਅਤੇ 25 ਹਰੀਆਂ ਗੇਂਦਾਂ ਦੁਕਾਨ ਵਿੱਚ ਹਨ। ਲਾਲ ਗੇਂਦਾਂ ਦੀ ਕੀਮਤ $9 ਪ੍ਰਤੀ ਗੇਂਦ ਹੈ, ਨੀਲੀਆਂ ਗੇਂਦਾਂ ਦੀ ਕੀਮਤ $5 ਪ੍ਰਤੀ ਗੇਂਦ ਹੈ ਅਤੇ ਹਰੀਆਂ ਗੇਂਦਾਂ ਦੀ ਕੀਮਤ $3 ਪ੍ਰਤੀ ਗੇਂਦ ਹੈ। ਜਦੋਂ ਸਾਰੀਆਂ ਗੇਂਦਾਂ ਵੇਚੀਆਂ ਜਾਣਗੀਆਂ, ਤਾਂ ਦੁਕਾਨ ਨੂੰ ਕਿੰਨੀ ਰਕਮ ਮਿਲੇਗੀ?"
answer = "ਲਾਲ ਗੇਂਦਾਂ ਤੋਂ 3 * $9 = $<<3*9=27>>27।\nਨੀਲੀਆਂ ਗੇਂਦਾਂ ਤੋਂ 11 * $5 = $<<11*5=55>>55।\nਹਰੀਆਂ ਗੇਂਦਾਂ ਤੋਂ 25 * $3 = $<<25*3=75>>75।\nਕੁੱਲ $27 + $55 + $75 = $<<27+55+75=157>>157।\n#### 157"
