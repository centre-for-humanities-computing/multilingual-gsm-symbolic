answer_annotated = "ਉਹ ਦਿਨ ਵਿੱਚ {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} ਕਲਾਸਾਂ ਲੈਂਦਾ ਹੈ।\nਇਹਦਾ ਮਤਲਬ ਉਹ ਦਿਨ ਵਿੱਚ ਕਲਾਸਾਂ 'ਤੇ {t} * {n1+n2} = <<{t}*{n1+n2}={t*(n1+n2)}>>{t*(n1+n2)} ਮਿੰਟ ਲਗਾਉਂਦਾ ਹੈ।\nਫਿਰ ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ {t*(n1+n2)} * {d} = <<{t*(n1+n2)}*{d}={t*(n1+n2)*d}>>{t*(n1+n2)*d} ਮਿੰਟ ਲਗਾਉਂਦਾ ਹੈ।\nਇਹਦਾ ਮਤਲਬ ਉਹ ਹਰੇਕ ਸ਼ਨੀਵਾਰ ਅਤੇ ਐਤਵਾਰ ਨੂੰ {t*(n1+n2)*d} * {frac} = <<{t*(n1+n2)*d}*{frac}={int((n1 + n2) * t * d * frac)}>>{int((n1 + n2) * t * d * frac)} ਮਿੰਟ ਲਗਾਉਂਦਾ ਹੈ।\nਫਿਰ ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ {t*(n1+n2)*d} + {int((n1 + n2) * t * d * frac)} + {int((n1 + n2) * t * d * frac)} = <<{t*(n1+n2)*d}+{int((n1 + n2) * t * d * frac)}+{int((n1 + n2) * t * d * frac)}={t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)}>>{t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)} ਮਿੰਟ।\nਫਿਰ ਉਹ {t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)}/60 = <<{t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)}/60={((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60}>>{((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60} ਘੰਟੇ।\n#### {((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60}\n"
