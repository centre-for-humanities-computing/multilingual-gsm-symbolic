question_annotated = "ایک عام طالب علم دے لئی دن چ {n1,6} پیریڈ ہوندے ہن پر {name,ਜੌਨ} نوں {n2,2} اضافی کلاساں لینیاں پیندیاں ہن۔ ہر کلاس {t,40} منٹ دی ہندی اے۔ اوہ ہفتے چ {d,5} دن کلاس وچ جاندا اے۔ پھر اوہ ہر شنبہ اتے اتوار نوں اپنی ہفتہ وار منٹاں دا {frac,1/16} اضافی پڑھائی دے طور تے لگدا اے۔ اوہ ہفتے چ پڑھائی چ کتنے گھنٹے لگدا اے؟\n\n#ਸ਼ੁਰੂਆਤ:\n- name = sample(names_male)\n- $n1 = range(5, 10)\n- $n2 = range(1, 5)\n- $t = range(30, 61, 5)\n- $d = range(4, 7)\n- $frac = sample(fractions)\n\n#ਸ਼ਰਤਾਂ:\n- is_int((n1 + n2) * t * d * frac)\n- is_int(((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) / 60)\n\n#ਜਵਾਬ: ((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60"
answer_annotated = "اوہ دن چ {n1}+{n2}=<<{n1}+{n2}={n1+n2}>>{n1+n2} کلاساں لیندا اے\nایہہ مطلب اے اوہ دن چ کلاس چ {t}*{n1+n2}=<<{t}*{n1+n2}={t*(n1+n2)}>>{t*(n1+n2)} منٹ لگدا اے\nتے اوہ ہفتے چ {t*(n1+n2)}*{d}=<<{t*(n1+n2)}*{d}={t*(n1+n2)*d}>>{t*(n1+n2)*d} منٹ لگدا اے\nایہہ مطلب اے اوہ ہر شنبہ اتے اتوار نوں {t*(n1+n2)*d}*{frac}=<<{t*(n1+n2)*d}*{frac}={int((n1 + n2) * t * d * frac)}>>{int((n1 + n2) * t * d * frac)} منٹ لگدا اے۔\nتے اوہ ہفتے چ {t*(n1+n2)*d}+{int((n1 + n2) * t * d * frac)}+{int((n1 + n2) * t * d * frac)}=<<{t*(n1+n2)*d}+{int((n1 + n2) * t * d * frac)}+{int((n1 + n2) * t * d * frac)}={t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)}>>{t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)} منٹ لگدا اے\nتے اوہ ہفتے چ {t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)}/60=<<{t*(n1+n2)*d + 2*int((n1 + n2) * t * d * frac)}/60={((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60}>>{((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60} گھنٹے لگدا اے\n#### {((n1 + n2) * t * d + 2 * (n1 + n2) * t * d * frac) // 60}"
creation = "ਹੱਥੋਂ ਤਿਆਰ ਕੀਤਾ ਪੰਜਾਬੀ ਅਨੁਵਾਦ; ਗਣਨਾਤਮਕ ਤੌਰ ’ਤੇ ਤਸਦੀਕਸ਼ੁਦਾ; ਦੋ ਮੂਲ ਬੋਲਣ ਵਾਲਿਆਂ ਵੱਲੋਂ ਤਸਦੀਕ ਕੀਤਾ"
