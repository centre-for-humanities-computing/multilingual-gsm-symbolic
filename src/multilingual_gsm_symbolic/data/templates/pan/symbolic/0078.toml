question = "ਇੱਕ ਆਮ ਵਿਦਿਆਰਥੀ ਲਈ ਦਿਨ ਵਿੱਚ 6 ਪੀਰੀਅਡ ਹੁੰਦੇ ਹਨ, ਪਰ ਜੌਨ ਨੂੰ 2 ਵਾਧੂ ਕਲਾਸਾਂ ਲੈਣੀਆਂ ਪੈਂਦੀਆਂ ਹਨ। ਹਰ ਕਲਾਸ 40 ਮਿੰਟ ਦੀ ਹੁੰਦੀ ਹੈ। ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ 5 ਦਿਨ ਕਲਾਸ ਵਿੱਚ ਜਾਂਦਾ ਹੈ। ਫਿਰ ਉਹ ਹਰ ਸ਼ਨੀਵਾਰ ਅਤੇ ਐਤਵਾਰ ਨੂੰ ਆਪਣੀ ਹਫ਼ਤਾਵਾਰੀ ਮਿੰਟਾਂ ਦਾ 1/16 ਵਾਧੂ ਪੜ੍ਹਾਈ ਲਈ ਲਗਾਉਂਦਾ ਹੈ। ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ ਪੜ੍ਹਾਈ ’ਤੇ ਕਿੰਨੇ ਘੰਟੇ ਲਗਾਉਂਦਾ ਹੈ?"
answer = "ਉਹ ਦਿਨ ਵਿੱਚ 6+2=<<6+2=8>>8 ਕਲਾਸਾਂ ਲੈਂਦਾ ਹੈ।\nਇਸਦਾ ਮਤਲਬ ਹੈ ਕਿ ਉਹ ਦਿਨ ਵਿੱਚ ਕਲਾਸਾਂ ਵਿੱਚ 40*8=<<40*8=320>>320 ਮਿੰਟ ਲਗਾਉਂਦਾ ਹੈ।\nਫਿਰ ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ 320*5=<<320*5=1600>>1600 ਮਿੰਟ ਲਗਾਉਂਦਾ ਹੈ।\nਇਸਦਾ ਮਤਲਬ ਹੈ ਕਿ ਉਹ ਹਰ ਸ਼ਨੀਵਾਰ ਅਤੇ ਐਤਵਾਰ ਨੂੰ 1600*1/16=<<1600*1/16=100>>100 ਮਿੰਟ ਵਾਧੂ ਪੜ੍ਹਾਈ ਲਈ ਲਗਾਉਂਦਾ ਹੈ।\nਫਿਰ ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ 1600+100+100=<<1600+100+100=1800>>1800 ਮਿੰਟ ਲਗਾਉਂਦਾ ਹੈ।\nਫਿਰ ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ 1800/60=<<1800/60=30>>30 ਘੰਟੇ ਲਗਾਉਂਦਾ ਹੈ।\n#### 30"
