question = "ਇੱਕ ਆਮ ਵਿਦਿਆਰਥੀ ਲਈ ਦਿਨ ਵਿੱਚ {n1} ਪੀਰੀਅਡ ਹੁੰਦੇ ਹਨ, ਪਰ {name} ਨੂੰ {n2} ਵਾਧੂ ਕਲਾਸਾਂ ਲੈਣੀਆਂ ਪੈਂਦੀਆਂ ਹਨ। ਹਰ ਕਲਾਸ {t} ਮਿੰਟ ਦੀ ਹੁੰਦੀ ਹੈ। ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ 5 ਦਿਨ ਕਲਾਸ ਵਿੱਚ ਜਾਂਦਾ ਹੈ। ਫਿਰ ਉਹ ਹਰੇਕ ਸ਼ਨੀਵਾਰ ਅਤੇ ਐਤਵਾਰ ਨੂੰ ਆਪਣੀ ਹਫ਼ਤਾਵਾਰੀ ਮਿੰਟਾਂ ਦਾ {frac} ਵਾਧੂ ਪੜ੍ਹਾਈ ਲਈ ਲਗਾਉਂਦਾ ਹੈ। ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ ਪੜ੍ਹਾਈ 'ਤੇ ਕਿੰਨੇ ਘੰਟੇ ਲਗਾਉਂਦਾ ਹੈ?"
answer = "ਉਹ ਦਿਨ ਵਿੱਚ 8 + 4 = <<8+4=12>>12 ਕਲਾਸਾਂ ਲੈਂਦਾ ਹੈ।\nਇਹਦਾ ਮਤਲਬ ਉਹ ਦਿਨ ਵਿੱਚ ਕਲਾਸਾਂ 'ਤੇ 60 * 12 = <<60*12=720>>720 ਮਿੰਟ ਲਗਾਉਂਦਾ ਹੈ।\nਫਿਰ ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ 720 * 5 = <<720*5=3600>>3600 ਮਿੰਟ ਲਗਾਉਂਦਾ ਹੈ।\nਇਹਦਾ ਮਤਲਬ ਉਹ ਹਰੇਕ ਸ਼ਨੀਵਾਰ ਅਤੇ ਐਤਵਾਰ ਨੂੰ 3600 * 1/10 = <<3600*1/10=360>>360 ਮਿੰਟ ਲਗਾਉਂਦਾ ਹੈ।\nਫਿਰ ਉਹ ਹਫ਼ਤੇ ਵਿੱਚ 3600 + 360 + 360 = <<3600+360+360=4320>>4320 ਮਿੰਟ।\nਫਿਰ ਉਹ 4320/60 = <<4320/60=72>>72 ਘੰਟੇ।\n#### 72\n"
