question = "ਸਿਮਰਨ ਨੇ ਇੱਕ ਸਾਬਤ ਸੇਬ ਨੂੰ 18 ਟੁਕੜਿਆਂ ਵਿੱਚ ਕੱਟਿਆ। ਉਸਨੇ 3 ਟੁਕੜੇ ਖਾਧੇ, ਭੈਣ ਨੇ ਉਸ ਨਾਲੋਂ 2 ਵੱਧ ਖਾਧੇ, ਅਤੇ ਭਰਾ ਨੇ ਭੈਣ ਨਾਲੋਂ 3 ਵੱਧ ਖਾਧੇ। ਉਹਨਾਂ ਸਾਰਿਆਂ ਨੇ ਸੇਬ ਦੇ ਕੁੱਲ ਕਿੰਨੇ ਟੁਕੜੇ ਖਾਧੇ?"
