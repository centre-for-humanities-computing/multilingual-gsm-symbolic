question_annotated = "{name,ਸਿਮਰਨ} ਨੂੰ {sport,ਦੌੜ} ਦੀ ਟੀਮ ਵਿੱਚ ਥਾਂ ਮਿਲ ਗਈ, ਇਸ ਲਈ ਉਹ ਕੁਝ ਖੇਡਾਂ ਦਾ ਸਾਮਾਨ ਖਰੀਦਣ ਗਈ। ਉਸਨੇ ਇਹ ਚੀਜ਼ਾਂ ਖਰੀਦੀਆਂ: {item1,ਟੈਂਕ ਟੌਪ} {cur,$}{p1,10} ਵਿੱਚ, {sport,ਦੌੜ} ਲਈ {item2,ਸ਼ਾਰਟਸ} {item1,ਟੈਂਕ ਟੌਪ} ਦੀ ਕੀਮਤ ਤੋਂ {cur,$}{p2,5} ਵੱਧ ਵਿੱਚ, ਅਤੇ {item3,ਟੈਨਿਸ ਬੂਟ}, ਜਿਨ੍ਹਾਂ ਦੀ ਅਸਲ ਕੀਮਤ {cur,$}{p3,48} ਸੀ ਪਰ ਸੇਲ ਵਿੱਚ ਉਸਦਾ {frac_txt,ਅੱਧਾ} ਹਿੱਸਾ ਹੀ ਲੱਗਦਾ ਸੀ। ਉਸਦੇ ਕੋਲ {cur,$}{d,2} ਦੀ ਛੋਟ ਵਾਲਾ ਕੂਪਨ ਵੀ ਸੀ, ਜੋ ਉਸਨੇ {cur,$}{p4,8} ਦੇ ਸਪੋਰਟਸ {item4,ਜੁਰਾਬਾਂ} ਦੇ ਪੈਕਟ 'ਤੇ ਲਾਇਆ, ਜੋ ਉਸਨੇ ਨਾਲ ਹੀ ਖਰੀਦਿਆ। ਉਸਨੇ ਖੇਡਾਂ ਦੇ ਸਾਮਾਨ 'ਤੇ ਕੁੱਲ ਕਿੰਨਾ ਖਰਚ ਕੀਤਾ?\n\n#init:\n- name = sample(names_female)\n- sport = sample([\"ਤੈਰਾਕੀ\", \"ਸਾਈਕਲਿੰਗ\", \"ਬਾਸਕਟਬਾਲ\", \"ਫੁੱਟਬਾਲ\", \"ਵਾਲੀਬਾਲ\"])\n- item1 = sample([\"ਟੀ-ਸ਼ਰਟ\", \"ਜਰਸੀ\", \"ਸਪੋਰਟਸ ਬਰਾ\"])\n- item2 = sample([\"ਸ਼ਾਰਟਸ\", \"ਲੈਗਿੰਗਜ਼\", \"ਸਵੈਟਪੈਂਟ\"])\n- item3 = sample([\"ਸਨੀਕਰਜ਼\", \"ਕਲੀਟਸ\", \"ਸਪੋਰਟਸ ਬੂਟ\"])\n- item4 = sample([\"ਜੁਰਾਬਾਂ\", \"ਹੈਡਬੈਂਡ\", \"ਰਿਸਟਬੈਂਡ\"])\n- cur = sample(currencies_sym)\n- frac_txt, frac_val = sample(fraction_alnum)\n- $p1 = range(8, 25)\n- $p2 = range(3, 15)\n- $p3 = range(30, 80, 2)\n- $p4 = range(5, 15)\n- $d = range(1, 5)\n\n#conditions:\n- is_int(p3*frac_val)\n- p3 % 2 == 0\n- p4 > d\n\n#answer: p1 + (p1 + p2) + (p3 * frac_val) + (p4 - d)"
