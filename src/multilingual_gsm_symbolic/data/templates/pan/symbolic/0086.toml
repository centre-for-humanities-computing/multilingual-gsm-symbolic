question = "ਸਿਮਰਨ ਨੂੰ ਦੌੜ ਦੀ ਟੀਮ ਵਿੱਚ ਥਾਂ ਮਿਲ ਗਈ, ਇਸ ਲਈ ਉਹ ਕੁਝ ਖੇਡਾਂ ਦਾ ਸਾਮਾਨ ਖਰੀਦਣ ਗਈ। ਉਸਨੇ ਇਹ ਚੀਜ਼ਾਂ ਖਰੀਦੀਆਂ: ਟੈਂਕ ਟੌਪ $10 ਵਿੱਚ, ਦੌੜ ਲਈ ਸ਼ਾਰਟਸ ਟੈਂਕ ਟੌਪ ਦੀ ਕੀਮਤ ਤੋਂ $5 ਵੱਧ ਵਿੱਚ, ਅਤੇ ਟੈਨਿਸ ਬੂਟ, ਜਿਨ੍ਹਾਂ ਦੀ ਅਸਲ ਕੀਮਤ $48 ਸੀ ਪਰ ਸੇਲ ਵਿੱਚ ਉਸਦਾ ਅੱਧਾ ਹਿੱਸਾ ਹੀ ਲੱਗਦਾ ਸੀ। ਉਸਦੇ ਕੋਲ $2 ਦੀ ਛੋਟ ਵਾਲਾ ਕੂਪਨ ਵੀ ਸੀ, ਜੋ ਉਸਨੇ $8 ਦੇ ਸਪੋਰਟਸ ਜੁਰਾਬਾਂ ਦੇ ਪੈਕਟ 'ਤੇ ਲਾਇਆ, ਜੋ ਉਸਨੇ ਨਾਲ ਹੀ ਖਰੀਦਿਆ। ਉਸਨੇ ਖੇਡਾਂ ਦੇ ਸਾਮਾਨ 'ਤੇ ਕੁੱਲ ਕਿੰਨਾ ਖਰਚ ਕੀਤਾ?"
answer = "ਸ਼ਾਰਟਸ ਦੀ ਕੀਮਤ ਟੈਂਕ ਟੌਪ ਤੋਂ $5 ਵੱਧ ਸੀ, ਇਸ ਲਈ ਉਹਨਾਂ ਦੀ ਕੀਮਤ $5 + $10 = $<<5+10=15>>15 ਸੀ।\nਉਸਦੇ ਟੈਨਿਸ ਬੂਟ ਦੀ ਕੀਮਤ ਅਸਲ ਕੀਮਤ $48 ਦਾ ਅੱਧਾ ਹਿੱਸਾ ਸੀ, ਇਸ ਲਈ ਉਹਨਾਂ ਦੀ ਕੀਮਤ $48*1/2=$24 ਸੀ।\nਉਸਦੇ ਕੂਪਨ ਨਾਲ, ਜੁਰਾਬਾਂ ਦੀ ਕੀਮਤ $8 - $2 = $<<8-2=6>>6 ਰਹਿ ਗਈ।\nਟੈਂਕ ਟੌਪ, ਸ਼ਾਰਟਸ, ਟੈਨਿਸ ਬੂਟ ਅਤੇ ਜੁਰਾਬਾਂ ਦੀ ਕੁੱਲ ਕੀਮਤ $10 + $15 + $24 + $6 = $<<10+15+24+6=55>>55 ਸੀ।\n#### 55"
