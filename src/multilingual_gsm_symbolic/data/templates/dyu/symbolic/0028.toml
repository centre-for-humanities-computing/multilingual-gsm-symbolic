question = "Hopital bɛɛ 1000 bɛɛ kɔnɔ ma 1/5 bɛɛ kɔnɔ. N'ko kɔlɔn kɛlɛ bɛɛ, 50 kɔlɔnɛ bɛɛ kɔnɔ n'ko hopital sɔnɔ sɔnɔ. Sɔrɔ bɛɛ bɛɛ sɛgɛ n'ko hopital 2 kan kɔ."
answer = "N'ko 1/5 bɛɛ hopital bɛɛ kɔnɔ kɔnɔ, n'ko 1/5 * 1000 = <<1000*1/5=200>>200 bɛɛ bɛɛ kɔlɔnɛ bɛɛ.\nHopital bɛɛ sɛgɛ bɛɛ kɔnɔ fɛɛn bɛɛ 1000 bɛɛ - 200 bɛɛ = <<1000-200=800>>800 bɛɛ.\nN'ko 50 bara bɛɛ kɔnɔ sɔnɔ sɔnɔ, hopital kɔlɔnɛ sɛgɛ bɛɛ kan 1 kɔ bɛɛ 50 kɔlɔnɛ/sɔnɔ * 7 sɔnɔ/kan = 350 kɔlɔnɛ.\n2 kan kɔ, hopital kɔnɔ kɔlɔnɛ sɛgɛ bɛɛ 350 kɔlɔnɛ/kan * 2 kan = <<350*2=700>>700 kɔlɔnɛ, bɛɛ bɛɛ 1 bɛɛ.\nN'ko 800 bɛɛ bɛɛ bɛɛ n'ko hopital fɛɛn kɔnɔ fɛɛn, sɛgɛ bɛɛ bɛɛ 800 bɛɛ - 700 bɛɛ = <<800-700=100>>100 bɛɛ bɛɛ.\n#### 100\n"
