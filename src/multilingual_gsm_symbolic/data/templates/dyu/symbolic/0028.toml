question_annotated = "{facility,hopital} bɛɛ {total,1000} {item,bɛɛ} kɔnɔ ma {frac,1/5} bɛɛ kɔnɔ. N'ko {event,kɔlɔn kɛlɛ} bɛɛ, {daily,50} kɔlɔnɛ bɛɛ kɔnɔ n'ko {facility,hopital} sɔnɔ sɔnɔ. Sɔrɔ {item,bɛɛ} bɛɛ sɛgɛ n'ko {facility,hopital} {period,2} kan kɔ.\n\n#init:\n- facility = sample([\"hopital\", \"sanitè\", \"sanitè kɔnɔ\", \"kɔnɔ fɛɛn\"])\n- item = sample([\"bɛɛ\", \"kɔnɔ\", \"fɛɛn\"])\n- event = sample([\"kɔlɔn sɔnɔ\", \"dugu fɛɛn\", \"fɛɛn kɛlɛ\", \"kɔlɔn kɛlɛ\"])\n- $total = range(500, 2000, 100)\n- $frac = sample(fractions)\n- $daily = range(20, 100, 5)\n- $period = range(2, 5)\n\n#conditions:\n- is_int(total * frac)\n- total * frac + daily * period * 7 < total\n\n#answer: total - (total * frac + daily * period * 7)\n"
answer_annotated = "N'ko {frac} bɛɛ {facility} {item} kɔnɔ kɔnɔ, n'ko {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} bɛɛ kɔlɔnɛ bɛɛ.\n{facility} {item} sɛgɛ bɛɛ kɔnɔ fɛɛn bɛɛ {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}.\nN'ko {daily} bara bɛɛ kɔnɔ sɔnɔ sɔnɔ, {facility} kɔlɔnɛ sɛgɛ bɛɛ kan 1 kɔ bɛɛ {daily} kɔlɔnɛ/sɔnɔ * 7 sɔnɔ/kan = {daily*7} kɔlɔnɛ.\n{period} kan kɔ, {facility} kɔnɔ kɔlɔnɛ sɛgɛ bɛɛ {daily*7} kɔlɔnɛ/kan * {period} kan = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} kɔlɔnɛ, bɛɛ {item} 1 bɛɛ.\nN'ko {total-int(total*frac)} {item} bɛɛ bɛɛ n'ko {facility} fɛɛn kɔnɔ fɛɛn, sɛgɛ bɛɛ bɛɛ {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item} bɛɛ.\n#### {total - (total * frac + daily * period * 7)}\n"
