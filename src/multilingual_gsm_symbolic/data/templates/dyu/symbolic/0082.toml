question = "Lafɛnɛ kɛnɛ ka, 25 man ka 15 woman bɛra."
answer = "Nɛgɛsɛbɛ kɛnɛ 25 man + 15 woman = <<25+15=40>>40 nɛgɛsɛbɛ kɛnɛ ka.\nBɛɛ kɛnɛ 45 miniti, 40 nɛgɛsɛbɛ * 1/10 = <<40*1/10=4>>4 nɛgɛsɛbɛ kɛnɛ ka.\nNɛgɛsɛbɛ kɛnɛ 40 nɛgɛsɛbɛ - 4 nɛgɛsɛbɛ = <<40-4=36>>36 nɛgɛsɛbɛ bɛra.\nKɛnɛ 36 bɛra, 36 nɛgɛsɛbɛ - 27 man = <<36-27=9>>9 bɛra woman.\n#### 9\n"
