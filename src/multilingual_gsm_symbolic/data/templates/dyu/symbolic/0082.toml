answer_annotated = "Nɛgɛsɛbɛ kɛnɛ {m} {group1} + {w} {group2} = <<{m}+{w}={m+w}>>{m+w} nɛgɛsɛbɛ kɛnɛ {event}.\nBɛɛ kɛnɛ {t}, {m+w} nɛgɛsɛbɛ * {frac} = <<{m+w}*{frac}={int((m+w)*frac)}>>{int((m+w)*frac)} nɛgɛsɛbɛ kɛnɛ {event}.\nNɛgɛsɛbɛ kɛnɛ {m+w} nɛgɛsɛbɛ - {int((m+w)*frac)} nɛgɛsɛbɛ = <<{m+w}-{int((m+w)*frac)}={m+w-int((m+w)*frac)}>>{m+w-int((m+w)*frac)} nɛgɛsɛbɛ bɛra.\nKɛnɛ {m+w-int((m+w)*frac)} bɛra, {m+w-int((m+w)*frac)} nɛgɛsɛbɛ - {m_left} {group1} = <<{m+w-int((m+w)*frac)}-{m_left}={m+w-int((m+w)*frac)-m_left}>>{m+w-int((m+w)*frac)-m_left} bɛra {group2}.\n#### {m+w-int((m+w)*frac)-m_left}\n"
