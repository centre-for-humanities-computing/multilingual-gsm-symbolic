question = "Martha bɛ dɔn kɛnɛ kɛ 3 balaw la. Bɛ balaw saba, ka bɛra ɲɛnɛn kɛ. Ka bɛra kɛ dɔn, kɛnɛ, kɛnɛ dɔn, kɛnɛ kɔnɔ, na kɛnɛ bɛ la bɛra ɲɛnɛn. Wulu kɛlɛ 2 bɛra kɛ dɔn, 4 kɛnɛ, 12 kɛnɛ dɔn, 1 la kɛnɛ kɔnɔ kɛlɛ ɲɛ, na 2 la kɛnɛ bɛ kɛlɛ ɲɛ. Wulu kɛlɛ ko fɛ ka bɛra sɔrɔ?"
answer = "Dɔn kɛnɛ bɛra tɛ dɔgɔtɔ la 2 wulu kɛlɛ la dɔn + 4 wulu kɛlɛ la kɛnɛ + 12 wulu kɛlɛ la kɛnɛ dɔn + 1 wulu kɛlɛ la kɛnɛ kɔnɔ kɛlɛ ɲɛ + 2 wulu kɛlɛ la kɛnɛ bɛ kɛlɛ ɲɛ = <<2+4+12+1+2=21>>21 wulu kɛlɛ.\nKa bɛra kɛ dɔn kɛnɛw bɛra balaw la, ka bɛra tɛ 3*21 = <<3*21=63>>63 wulu kɛlɛ.\n#### 63\n"
