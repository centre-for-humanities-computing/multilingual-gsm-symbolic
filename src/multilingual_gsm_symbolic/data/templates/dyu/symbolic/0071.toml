question = "Nate bɛ kɛlɛ ɲɛgɛn fɔnɔnɔn. Bɛɛ ɲɛgɛn bɛ 5 liba fɔnɔnɔn, bɛɛ llama bɛ 3 liba dɔgɔnɔnɔ sɛgɛsɛgɛ ɲɛgɛn bɛ fɔnɔnɔ. Sɛgɛsɛgɛ 15 ɲɛgɛns wala 12 llamas bɛ ɛrɛ, bɛ Nate fɔnɔnɔ liba ɲɛgɛn bɛɛ?"
answer = "Tɔgɔ bɛ ɲɛgɛn bɛɛ ka llama fɔnɔnɔn: 5 liba * 2 - 3 = <<5*2-3=7>>7 liba/llama\nBɛɛ bɛ ɲɛgɛn bɛɛ ka llamas fɔnɔnɔn: 7 liba/llama * 12 llamas = <<7*12=84>>84 liba\nBɛɛ bɛ ɲɛgɛn bɛɛ ka ɲɛgɛns fɔnɔnɔn: 5 liba/ɲɛgɛn * 15 ɲɛgɛns = <<5*15=75>>75 liba\nBɛɛ bɛ ɲɛgɛn bɛɛ sɛgɛsɛgɛ bɛɛ wala: 84 liba + 75 liba = <<84+75=159>>159 liba\n#### 159\n"
