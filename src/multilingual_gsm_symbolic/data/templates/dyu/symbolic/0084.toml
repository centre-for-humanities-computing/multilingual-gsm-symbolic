question = "Maria kɛnɛ 8 stock share don $8 kɛɲɛn. Stock tɔgɔ bɛɛ 50% kɛnɛ kɛɲɛn Maria tɔgɔ, sɔgɔma tɔgɔ yɛlɛ 25% kɛnɛ sɔgɔma. Maria share fɛn dɔgɔ la fɛn bɛɛ?"
