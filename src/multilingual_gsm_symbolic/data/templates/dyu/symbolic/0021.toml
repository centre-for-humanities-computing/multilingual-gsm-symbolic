question = "Frankie i kɛrɛnɛ sɔrɔ bɛra telebisi yɛrɛ. Lɛndi ka Talata fɛ, o ye 1-ora episodu kɛlɛ kɛlɛ fɛ i kɛrɛnɛ fɛ. Araba fɛ, o ye episodu dɔgɔ 30-miniti sɛbɛnɛ fɛ. Alɔsɛrɛ fɛ, o ye kɛrɛnɛ sɔrɔ kɛrɛnɛ ka 1-ora episodu ka 30-miniti sɛbɛnɛ yɛrɛ. Juma fɛ, o ye kɛrɛnɛ fɛ kɛ, nɔnɔ o ye ɲɛ 1-ora episodu yɛrɛ. O ye telebisi 7 ora bɛra, Araba fɛ, ɲɛnɛ 30-miniti episodu o ye yɛrɛ?"
