question_annotated = "{name, Sunny} na {food,bɔgɔnɔ} ka {fruit,tɔgɔ} tɔgɔ kɛra fɛn dɔ la. On {d1,zanɔn}, o kɛra {n1,10} bɔksɛ {food,bɔgɔnɔ} ka {m1,4} tɛ {fruit,tɔgɔ} tɔgɔ bɔksɛ, ko {d2,kasɛn} la. On {d2,kasɛn}, o kɛra {n2,5} bɔksɛ {food,bɔgɔnɔ} kɛra ko {d1,zanɔn} la, ka {m2,15} bɔksɛ {fruit,tɔgɔ} tɔgɔ. Sɛbɛn {food,bɔgɔnɔ} tɛ {cur,$}{cn,6}, ka {fruit,tɔgɔ} tɔgɔ tɛ {cur,$}{cm,15}, {name,Sunny} bɛra fɛn dɔ la kɛra bɛra fɛn dɔ la fɛn dɔ la?\n\n#init:\n- name = sample(names_male)\n- fruit = sample(fruits)\n- cur = sample(currencies_sym)\n- food = sample([\"bɔgɔnɔ\", \"kɛnɛnɛ\", \"bɔgɔnɔ dɔgɔ\", \"mufini\", \"kɛnɛnɛ dɔgɔ\"])\n- d1, d2 = sample_sequential(weekdays, 2)\n- $n1 = range(21, 30)\n- $n2 = range(11, 15)\n- $m1 = range(4, 20)\n- $m2 = range(15, 30)\n- $cn = range(7, 13)\n- $cm = range(20, 33)\n\n#conditions:\n- m1 < m2\n\n#answer: (2*n1+n2)*cn + (2*m2-m1)*cm\n"
answer_annotated = "O kɛra {n1} + {n2} = <<{n1}+{n2}={n1+n2}>>{n1+n2} bɔksɛ {food} on {d2} la.\n{name} kɛra {food} bɔksɛ bɛra {n1} + {n1+n2} = <<{n1}+{n1+n2}={2*n1+n2}>>{n1+n1+n2}.\n{name} kɛra {n1+n1+n2}*{cur}{cn} = {cur}<<{n1+n1+n2}*{cn}={(n1+n1+n2)*cn}>>{(n1+n1+n2)*cn} {food} la.\nO kɛra {m2} - {m1} = <<{m2}-{m1}={m2-m1}>>{m2-m1} bɔksɛ {fruit} tɔgɔ on {d1} la.\n{name} kɛra {fruit} tɔgɔ bɔksɛ bɛra {m2} + {m2-m1} = <<{m2}+{m2-m1}={2*m2-m1}>>{2*m2-m1}.\nO kɛra {2*m2-m1}*{cur}{cm} = {cur}<<{2*m2-m1}*{cm}={(2*m2-m1)*cm}>>{(2*m2-m1)*cm} {fruit} tɔgɔ la.\nBɛ, {name} kɛra {cur}{(n1+n1+n2)*cn} + {cur}{(2*m2-m1)*cm} = {cur}<<{(n1+n1+n2)*cn}+{(2*m2-m1)*cm}={(2*n1+n2)*cn + (2*m2-m1)*cm}>>{(2*n1+n2)*cn + (2*m2-m1)*cm} fɛn dɔ la.\n#### {(2*n1+n2)*cn + (2*m2-m1)*cm}\n"
