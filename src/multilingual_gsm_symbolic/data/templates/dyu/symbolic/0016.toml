question = "Sunny na bɔgɔnɔ ka tɔgɔ tɔgɔ kɛra fɛn dɔ la. On zanɔn, o kɛra 10 bɔksɛ bɔgɔnɔ ka 4 tɛ tɔgɔ tɔgɔ bɔksɛ, ko kasɛn la. On kasɛn, o kɛra 5 bɔksɛ bɔgɔnɔ kɛra ko zanɔn la, ka 15 bɔksɛ tɔgɔ tɔgɔ. Sɛbɛn bɔgɔnɔ tɛ $6, ka tɔgɔ tɔgɔ tɛ $15, Sunny bɛra fɛn dɔ la kɛra bɛra fɛn dɔ la fɛn dɔ la?"
answer = "O kɛra 10 + 5 = <<10+5=15>>15 bɔksɛ bɔgɔnɔ on kasɛn la.\nSunny kɛra bɔgɔnɔ bɔksɛ bɛra 10 + 15 = <<10+15=25>>25.\nSunny kɛra 25*$6 = $<<25*6=150>>150 bɔgɔnɔ la.\nO kɛra 15 - 4 = <<15-4=11>>11 bɔksɛ tɔgɔ tɔgɔ on zanɔn la.\nSunny kɛra tɔgɔ tɔgɔ bɔksɛ bɛra 15 + 11 = <<15+11=26>>26.\nO kɛra 26*$15 = $<<26*15=390>>390 tɔgɔ tɔgɔ la.\nBɛ, Sunny kɛra $150 + $390 = $<<150+390=540>>540 fɛn dɔ la.\n#### 540\n"
