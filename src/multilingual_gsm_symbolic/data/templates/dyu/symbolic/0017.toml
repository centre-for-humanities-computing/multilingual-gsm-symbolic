question = "Dama yɛrɛ 3 mɛls kɛlɛw bɛɛ sɔrɔ la, o bɛɛ sɛgɛ la 2 mɛls kɛlɛw ka, sɔrɔ la 1 mɛl(s) kɛlɛw. Sɔrɔ la, Dama yɛrɛ kabɔɲɛ kɛlɛ sɛgɛ la yɛrɛ kɛlɛ. Sɛgɛ la, 40 minit kɛlɛw bɛ, o bɛɛ dɔn la, o bɛɛ 3-mɛl kɛlɛw bɛɛ dɔn la, minit la?"
