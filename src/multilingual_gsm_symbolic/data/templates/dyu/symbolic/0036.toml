question = "Toula yɛlɛ kɛnɛkɛla fɛ ka kɛnɛ dɔgɔla bɛɛ dɔgɔ. A dɔgɔ 3 kɛnɛ donuts dɔgɔ $ 68 kɛnɛ fɛ, 2 kɛnɛ mini cupcakes dɔgɔ $ 80 kɛnɛ fɛ, ka 6 kɛnɛ mini cheesecakes dɔgɔ $ 55 kɛnɛ fɛ. Dɔgɔ bɛɛ bɛ fɛ min?"
