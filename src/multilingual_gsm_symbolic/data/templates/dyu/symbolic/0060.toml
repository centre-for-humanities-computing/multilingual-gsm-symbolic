question = "Watson ka 10 ɲɛgɛnɛ kɛ sini bɛ, ɲɛgɛnɛ 5 na bɛ sɔrɔ. O sɔrɔra $10 ɲɛgɛnɛ bɛ, o sɔrɔra $300 bonus bɛ bɛ sɔrɔ kɛlɛkɛla ka fɛra. Kɛlɛ ka bɛ Watson sɔrɔra Aviri la kɛlɛkɛla ka fɛra sini bɛ kɔnɔ?"
answer = "Sini bɛ la, Watson ka 10 * 10 = $<<10*10=100>>100 sɔrɔ\nSini bɛ kɛra ɲɛgɛnɛ 5 na bɛ sɔrɔ, sini yeke kɔnɔ bɛ 6*4=<<6*4=24>>24 sini.\nSini bɛ sɔrɔra $100 sini bɛ la, kɛlɛ yeke kɔnɔ bɛ 24 * 100= $<<24*100=2400>>2400.\nO sɔrɔra 300 * 4 = $<<300*4=1200>>1200 bonus kɛlɛkɛla ka fɛra sɔrɔ bɛ Aviri la.\nAviri bɛ kɛra, o sɔrɔra 2400 + 1200 = $<<2400+1200=3600>>3600.\n#### 3600\n"
