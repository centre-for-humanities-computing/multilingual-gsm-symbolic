question = "Ɔgɔnɔ kɛnɛwɛrɛ bɛ kɛnɛ 12 kɛlɛ kɛnɛ saba la ka sani fè la. A bɛ kɛnɛ ɔgɔnɔ ka bɔ ka brɔnz kɛnɛbɛ la, ka 50% bɔ ka steel kɛnɛbɛ la ka brɔnz kɛnɛbɛ la. Hali kɛlɛ kɛnɛ 40 kɛnɛwɛrɛɛnɛ bɛ kɛnɛ ka steel kɛnɛbɛɛnɛ la ka 30 saba la?"
answer = "Bɔgɔ, ka hali kɛnɛwɛrɛ bɛ kɛnɛ ka brɔnz kɛnɛbɛ la: 12 kɛlɛ/day*5=<<12*5=60>>60 kɛlɛ/day\nKa bɔ, ka 150% bɔ ka hali kɛnɛwɛrɛ bɛ kɛnɛ ka steel kɛnɛbɛ la: 60 kɛlɛ/day * 150% = <<60*150*.01=90>>90 kɛlɛ/day\nKa bɔ, ka nɛgɛsɛ kɛnɛwɛrɛ bɛ kɛnɛ saba la ka steel kɛnɛbɛ la, ka nɛgɛsɛ kɛnɛwɛrɛɛnɛ la: 90 kɛlɛ/day/kɛnɛwɛrɛ * 40 kɛnɛwɛrɛɛnɛ = <<90*40=3600>>3600 kɛlɛ/day\nKa bɔ, ka saba bɛ kɛnɛ la ka 30 saba la, ka hali kɛnɛ kɔnɔ la: 3600 kɛlɛ/day * 30 saba = <<3600*30=108000>>108,000 kɛlɛ/day\n#### 108000\n"
