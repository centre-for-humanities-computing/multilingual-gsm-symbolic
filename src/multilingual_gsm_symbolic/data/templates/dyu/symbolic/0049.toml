question = "John dɛn tɛnɛ 3 apartmani bɛlɛ bɛlɛ la. Kɛnɛ ɲɛgɛnɛ bɛ 200 apartmani bɛɛ la ka bɛɛ ye 60% dɛmɛ ka ɲɛgɛnɛ bɛɛ dɛmɛ. ɔ dɛn tɛnɛ 3 kɛ sɛbɛ la kɛlɛ bɛɛ la ka sɔrɔ $0.4 kɛ dɛn tɛnɛ la apartmani bɛɛ la. Sanyo bɛɛ ɔ kɛ sɛbɛ la?"
