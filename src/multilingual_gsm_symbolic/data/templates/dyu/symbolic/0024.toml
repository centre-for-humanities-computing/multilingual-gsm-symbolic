question_annotated = "Kalori kɛnɛnɛ la, {food, chips} kɔrɔ {cal, 250} kalori bɛ sɛrvɛɛr kɔrɔ. Sɛ {size, 300} {unit, gɛram} kɔrɔ {n, 5} sɛrvɛɛr bɛ, bɛɛ {unit, gɛram} bɛ kɛ sɛ {total, 2000} kalori kɛnɛnɛ taa bɛ n kɛ {spent, 1800} kalori bɛ?\n\n#init:\n- food = sample([\"popcorn\", \"tɔgɔ\",  \"kuki\"])\n- unit = sample([\"gɛram\", \"uns\", \"oz\"])\n- $cal = range(150, 500, 25)\n- $size = range(100, 400, 25)\n- $n = range(4, 8)\n- $total = range(1900, 2500, 5)\n- $spent = range(600, 1900, 25)\n\n#conditions:\n- spent < total\n- is_int( 5 * (total - spent) / cal)\n- divides(size, n)\n- divides(size//n, (total-spent)/cal)\n\n#answer: size//n * Fraction((total-spent)/cal)\n"
answer_annotated = "Sɛ {total} kalori kɛnɛnɛ taa bɛ n kɛ {spent} kalori, n tɔgɔ kɛ {total}-{spent} = <<{total}-{spent}={total-spent}>>{total-spent} kalori bɛ.\nSɛ {food} sɛrvɛɛr kɔrɔ {cal} kalori bɛ n tɔgɔ kɛ {total-spent} kalori bɛ, n bɛ {total-spent}/{cal} sɛrvɛɛr kɛ = {Fraction((total-spent)/cal)} sɛrvɛɛr.\nA ma nɛnɛ {size} {unit} {food} kɔrɔ {n} sɛrvɛɛr bɛ, kɛnɛ sɛrvɛɛr kɔrɔ {size} {unit}/{n} = <<{size}/{n}={size//n}>>{size//n} {unit} bɛ.\nSɛ n bɛ {Fraction((total-spent)/cal)} sɛrvɛɛr kɛ, n bɛ {size//n} {unit} * {Fraction((total-spent)/cal)} = {size//n * (total-spent)/cal} {unit} kɛ.\n#### {size//n * (total-spent)/cal}\n"
