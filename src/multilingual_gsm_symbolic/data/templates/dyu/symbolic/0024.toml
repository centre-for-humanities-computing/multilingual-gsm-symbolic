question = "Kalori kɛnɛnɛ la, chips kɔrɔ 250 kalori bɛ sɛrvɛɛr kɔrɔ. Sɛ 300 gɛram kɔrɔ 5 sɛrvɛɛr bɛ, bɛɛ gɛram bɛ kɛ sɛ 2000 kalori kɛnɛnɛ taa bɛ n kɛ 1800 kalori bɛ?"
answer = "Sɛ 2000 kalori kɛnɛnɛ taa bɛ n kɛ 1800 kalori, n tɔgɔ kɛ 2000-1800 = <<2000-1800=200>>200 kalori bɛ.\nSɛ chips sɛrvɛɛr kɔrɔ 250 kalori bɛ n tɔgɔ kɛ 200 kalori bɛ, n bɛ 200/250 sɛrvɛɛr kɛ = 4/5 sɛrvɛɛr.\nA ma nɛnɛ 300 gɛram chips kɔrɔ 5 sɛrvɛɛr bɛ, kɛnɛ sɛrvɛɛr kɔrɔ 300 gɛram/5 = <<300/5=60>>60 gɛram bɛ.\nSɛ n bɛ 4/5 sɛrvɛɛr kɛ, n bɛ 60 gɛram * 4/5 = 48 gɛram kɛ.\n#### 48\n"
