question = "Dɔgɔtɔ kàr bɛɛ, 15 kɔnɔn kàr bɛ, ama 60% kɔlɔn kàr bɛra. Sɛbɛn kàr bɛɛ suman kɔnɔn kàr ni kɔlɔn kàr. Ko nɛ kàr bɛɛ?"
answer = "Bɛ 60/100 * 15 = <<60/100*15=9>>9 kɔlɔn kàr bɛra kɔnɔn kàr.\nN bɛra 15 + 9 = <<15+9=24>>24 kɔlɔn kàr bɛ.\nSɛbɛn kàr bɛɛ suman 15 + 24 = <<15+24=39>>39 kàr.\nN bɛra, bɛɛ bɛ 39 + 39 = <<39+39=78>>78 kàr kɔnɔn.\n#### 78\n"
