question = "Alison kɛnɛ ka ɲɛ kɛnɛ kɔnɔ, nɛnɛ o kɛnɛ kɛ kɛnɛ fɛn fɛ. O kɛnɛ t-shirt ka $10, kɛnɛ shorts kɔnɔ ka $5 sɔrɔ t-shirt kɛnɛ, nɛnɛ bɛgɛ kɛnɛ kɔnɔ o bɛ kɛnɛ $48 nɛnɛ o bɛ ɲɛma kɛnɛ. O bɛ $2 kɛnɛ coupon fɛ $8 kɛnɛ kɔnɔ kɔnɔ o o kɛnɛ. O bɛ ɲɛnɛn ɲɛnɛn kɛnɛ fɛn fɛ?"
