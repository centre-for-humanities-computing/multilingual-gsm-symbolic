question = "Garrett dɔ popcorn kɛlɛ dɔgɔ la. Jamanu pota kɛlɛ sɔrɔ la, kɛlɛ bɛ ɲɛmɔgɔ kɛ. 20 dɔ ɲɛmɔgɔ kɛ 30 segɛ la kɛla la, kɛla 30 segɛ la, ɔɔrɔ la ɲɛma. Kɛlɛ bɛ kɛ ɛɛnɛ la ɲɛma kɛla 30 segɛ la, kɛla 30 segɛ la, kɛlɛ bɛ ɲɛmɔgɔ kɛ baɲi la kɛla 30 segɛ la. Kɛla Garrett taa pota sɔrɔ la, ɲɛnɲɛn kɛlɛ kɛla 30 segɛ la sɔrɔ la, kɛlɛ bɛ ɲɛmɔgɔ kɛ. Garrett dɔ popcorn kɛlɛ bɛ ɲɛmɔgɔ kɛ?"
