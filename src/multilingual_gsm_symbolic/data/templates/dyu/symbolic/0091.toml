question = "N Allan dugu fɛ, ma bɛ kɔnɔli la dege. A ye 40 kɔnɔli dɛmɛra a dugu fɛ. Allan tɛnɛra 60 kɔnɔli dɛmɛra fɛn kɔnɔ fɛ, kɛra 40 ma kɛlɛla kɔnɔli nɛgɛsɛn ye. Sɛgɛsɛgɛ ma ye kɔnɔli ye nɛgɛsɛn Allan ye a dugu fɛ?"
