question = "Sebuah hospital mempunyai kapasiti 1000 katil dengan 1/5 diduduki. Disebabkan oleh wabak coronavirus, 50 pesakit dimasukkan ke dalam hospital setiap hari. Kira jumlah keseluruhan katil yang tidak diduduki dalam hospital selepas 2 minggu."
