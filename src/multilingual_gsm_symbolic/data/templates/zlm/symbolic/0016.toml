question = "Sunny sedang menjual kek halia dan pai epal untuk kutipan dana. Pada Sabtu, dia menjual 10 kotak kek halia dan 4 kotak kurang pai epal daripada pada Ahad. Pada Ahad, dia menjual 5 kotak lebih kek halia daripada pada Sabtu dan 15 kotak pai epal. Jika kek halia itu berharga $6 dan pai epal berharga $15, berapa banyak Sunny memperoleh dalam dua hari?"
answer = "Dia menjual 10 + 5 = <<10+5=15>>15 kotak kek halia pada Ahad.\nJumlah kotak kek halia yang Sunny jual ialah 10 + 15 = <<10+15=25>>25.\nSunny memperoleh 25*$6 = $<<25*6=150>>150 untuk menjual kek halia.\nDia menjual 15 - 4 = <<15-4=11>>11 kotak pai epal pada Sabtu.\nJumlah kotak pai epal yang Sunny jual ialah 15 + 11 = <<15+11=26>>26.\nDia memperoleh 26*$15 = $<<26*15=390>>390 untuk menjual pai epal.\nJadi, Sunny memperoleh $150 + $390 = $<<150+390=540>>540 untuk dua hari.\n#### 540\n"
