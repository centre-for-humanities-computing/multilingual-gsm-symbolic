question = "Menurut maklumat pemakanannya, satu bungkusan kerepek mengandungi 250 kalori setiap sajian. Jika satu bungkusan 300 gram mempunyai 5 sajian, berapa gram yang boleh anda makan jika sasaran kalori harian anda ialah 2000 dan anda telah mengambil 1800 kalori?"
answer = "Jika sasaran kalori keseluruhan ialah 2000 dan saya telah mengambil 1800 kalori, maka saya mempunyai 2000-1800 = <<2000-1800=200>>200 kalori baki untuk dimakan\nJika setiap sajian kerepek mempunyai 250 kalori dan saya hanya mempunyai 200 kalori baki untuk dimakan, maka saya hanya boleh makan 200/250 daripada satu sajian = 4/5 daripada satu sajian\nKita juga tahu bahawa satu bungkusan 300 gram kerepek mempunyai 5 sajian, maka setiap sajian mempunyai 300 gram/5 = <<300/5=60>>60 gram\nJika saya hanya boleh makan 4/5 daripada satu sajian, maka saya hanya boleh makan 60 gram * 4/5 = 48 gram\n#### 48\n"
