question = "Seorang petani sedang membeli makanan untuk kuda. Dia membeli pelbagai jerami, oat, lobak merah dan kiub gula. Oleh kerana kiub gula adalah makanan istimewa yang jarang, dia hanya membeli dua kotak 1-paun untuk seluruh kandang. Dia hanya mahu cukup lobak merah untuk memberi makan kuda selagi sayur-sayuran segar, jadi dia membeli empat beg 12-paun. Jerami adalah makanan utama kuda, jadi dia membeli empat puluh dua pakej 75-paun. Oat adalah makanan asas untuk melengkapkan jerami, jadi dia membeli dua puluh karung 65-paun. Jika trak ladangnya boleh membawa 2250 paun pada satu masa, berapa kali perjalanan yang perlu dibuat oleh petani untuk mengangkut semua makanan?"
