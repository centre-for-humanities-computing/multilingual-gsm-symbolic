question = "Dana boleh berlari empat kali lebih laju daripada dia boleh berjalan, tetapi dia boleh melompat pada kadar kelajuan yang separuh secepat dia boleh berlari. Jika dia boleh melompat pada 3 batu sejam, berapa batu boleh dia tempuh dalam enam jam jika dia memperuntukkan sepertiga daripada masa untuk berlari dan dua pertiga daripada masa untuk berjalan?"
answer = "Jika Dana boleh melompat pada separuh kelajuan yang boleh dia berlari, maka dia boleh berlari pada 3*2=<<3*2=6>>6 batu sejam.\nDan kerana dia boleh berlari pada kelajuan yang empat kali lebih laju daripada dia boleh berjalan, ini bermaksud dia boleh berjalan pada 6/4=1.5 batu sejam.\nJika dua pertiga daripada masa diperuntukkan untuk berjalan, maka dia berjalan selama 6*2/3=<<6*2/3=4>>4 jam.\nJika sepertiga daripada masa diperuntukkan untuk berlari, maka dia berlari selama 6-4=<<6-4=2>>2 jam.\nOleh itu, dia berlari selama 2 jam pada 6 batu sejam, atau 2*6=<<2*6=12>>12 batu.\nDia berjalan selama 4 jam pada 1.5 batu sejam, atau 4*1.5=<<4*1.5=6>>6 batu.\nOleh itu, secara keseluruhan, dia menempuh 12+6=<<12+6=18>>18 batu.\n#### 18\n"
