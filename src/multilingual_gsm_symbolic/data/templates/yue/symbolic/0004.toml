question = "加倫 正在爆粟米做小食。當 鍋 中的粟米加熱時，粟米開始爆得更頻密。20 粒在烹調的前 30 秒內爆開，然後在接下來的 30 秒內是那個數量的 三 倍。在接下來的 30 秒內，粟米爆開速度增加到初始速度的 四 倍，但在最後 30 秒內，爆開速度減慢至過去 30 秒內速度的一半。當 加倫 把 鍋 從火上拿開後，最後 30 秒內爆開的粟米數量的四分之一也會因餘熱而爆開。加倫 要吃的粟米有多少粒？"
answer = "在烹調的第二個 30 秒內，有 3*20=<<3*20=60>>60 粒粟米爆開。\n在第三個 30 秒內，有 4*20=<<4*20=80>>80 粒粟米爆開。\n在最後 30 秒內，80 / 2 = <<80/2=40>>40 粒粟米爆開。\n烹調後，餘熱使 40 / 4 = <<40/4=10>>10 粒粟米爆開。\n因此，加倫 要吃的粟米共有 20 + 60 + 80 + 40 + 10 = <<20+60+80+40+10=210>>210 粒。\n#### 210\n"
