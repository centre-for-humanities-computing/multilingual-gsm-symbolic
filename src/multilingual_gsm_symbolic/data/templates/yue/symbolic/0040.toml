question = "莎莉 去海邊度假。她父母給了 $15 讓她買任何她想要的東西。在紀念品店，太妃糖有優惠：「買 1 磅，每磅 $3，再獲 1 磅 1/2 折扣。」她裝了 4 磅。她還買了一袋混合貝殼，價 $1.5，以及 4 個磁鐵，每個 $0.25。莎莉 還剩多少錢？"
answer = "莎莉 買 1 磅，每磅 $3，並獲 1 磅 1/2 折扣。所以 1 磅的 1/2 折扣是 $3*1/2 = $1.5。其餘 2 磅沒有折扣，價格為 2*$3 = $6，所以總價是 $3+$3/2+$6=$21/2\n4 個磁鐵，每個 $0.25，共 4*0.25=$<<4*0.25=1>>1\n把所有購買項目加起來，$21/2+$1.5+$1 = $<<21/2+1.5+1=13>>13\n她有 $15，花了 $13，所以她剩下 $15-$13 = $<<15-13=2>>2 剩餘\n#### 2\n"
