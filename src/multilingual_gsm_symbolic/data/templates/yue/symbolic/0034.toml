question = "先生 Tan 以 $400,000 的價格賣出了他的 屋。他支付了佔售價 3% 的 轉讓 費用，亦支付了佔售價 5% 的 佣金 費用。如果他亦支付了 $250,000 作為該 屋 的餘下貸款金額，先生 Tan 出售 屋 的淨收益是多少？"
