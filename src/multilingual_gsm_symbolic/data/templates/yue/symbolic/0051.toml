question = "阿蒂 在 農夫市集 有一個 花 攤位。他出售三種 花：萬壽菊、矮牽牛 和 秋海棠。他通常賣 萬壽菊 每 盆 $2.74，矮牽牛 每 盆 $1.87，秋海棠 每 盆 $2.12。阿蒂 今天沒有零錢，所以他決定將所有價格四捨五入到最接近的元。如果 阿蒂 出售 12 盆 萬壽菊、9 盆 矮牽牛 和 17 盆 秋海棠，他會賺多少錢？"
