question = "Allan 嘅屋企，粟米 嘅數量係 乳酪卷 嘅 兩倍 倍。佢屋企總共有 40 個 乳酪卷。Allan 喺店度買咗 60 個 乳酪卷，同埋買咗嘅 粟米 比 乳酪卷 少 40 個。求 Allan 屋企總共有幾多個 粟米 同 乳酪卷？"
answer = "喺買任何 粟米 同 乳酪卷 之前，Allan 有嘅 粟米 係 乳酪卷 嘅 兩倍 倍，即係 40 個 乳酪卷 乘 5 粟米/乳酪卷 = <<40*5=200>>200 個 粟米\nAllan 之前有嘅 粟米 同 乳酪卷 總數係 200 個 粟米 加 40 個 乳酪卷 = <<200+40=240>>240 個嘢\n當佢買咗嘅 粟米 比 乳酪卷 少 40 個時，佢買咗 60 個 粟米 減 40 個 粟米 = <<60-40=20>>20 個 粟米\n總共，佢買咗 20 個 粟米 加 60 個 乳酪卷 = <<20+60=80>>80 個嘢\n買完之後，Allan 有 240 個嘢 加 80 個嘢 = <<240+80=320>>320 總共嘅 粟米 同 乳酪卷。\n#### 320\n"
