question = "Frankie 每晚完成功課後都會睇電視。喺 星期一 同 星期二，佢每晚睇咗一集 1 小時嘅佢最鍾意嘅節目。喺 星期三，佢睇咗幾集 30 分鐘嘅節目。喺 星期四，佢早啲完成功課，然後睇咗一集 1 小時嘅節目同 30 分鐘嘅節目。喺 星期五，佢可以瞓晏啲，所以佢睇咗 兩 集 1 小時嘅節目。如果佢總共睇咗 7 小時電視，佢喺 星期三 睇咗幾多集 30 分鐘嘅節目？"
