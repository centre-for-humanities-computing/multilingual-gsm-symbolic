question = "Moko azali kokóta bikoko mpe tata ya mapu mpo na mbongo ya misala. Na lomposo, akóta 10 bikopo ya bikoko mpe 4 bikopo ya tata ya mapu na nsima ya lingonga. Na lingonga, akóta 5 bikopo mingi ya bikoko na lomposo mpe 15 bikopo ya tata ya mapu. Soki bikoko ezali kokoleka $6 mpe tata ya mapu ezali kokoleka $15, moko akobima na mbongo mingi nini mpo na mikolo mibale?"
