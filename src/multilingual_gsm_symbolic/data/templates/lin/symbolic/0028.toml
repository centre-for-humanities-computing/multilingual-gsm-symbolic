question_annotated = "{facility,hôpital} eza na kapasité ya {total,1000} {item,litó} na {frac,1/5} eza mpepɛ. Na mboka ya {event,epandémie ya coronavirus}, {daily,50} bapɛtɛ bazua mabɛnda na {facility,hôpital} na mokɔlɔ mosusu. Kobɔngisa bɔngɔ ya {item,litó} oyo ezali mpepɛ te na {facility,hôpital} na {period,2} mpɛsɔ.\n\n#init:\n- facility = sample([\"hôpital\", \"klinikí\", \"sentre ya lisangá\", \"moungó ya malamu\"])\n- item = sample([\"litó\", \"mbúlu\", \"sala\"])\n- event = sample([\"mbúla ya flú\", \"masɔ́kɔ\", \"mabúla\", \"epandémie\"])\n- $total = range(500, 2000, 100)\n- $frac = sample(fractions)\n- $daily = range(20, 100, 5)\n- $period = range(2, 5)\n\n#conditions:\n- is_int(total * frac)\n- total * frac + daily * period * 7 < total\n\n#answer: total - (total * frac + daily * period * 7)\n"
answer_annotated = "Soki {frac} ya kapasité ya {facility} {item} eza mpepɛ, ezali koloba {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} ezali na bapɛtɛ.\nBɔngɔ ya {item} na {facility} toli mabɛda moko te ezali {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}.\nSoki {daily} bato bazua mabɛnda na mokɔlɔ mosusu, bɔngɔ ya bapɛtɛ na {facility} na mpɛsɔ moko ezali {daily} bapɛtɔ/mokɔlɔ * 7 mokɔlɔ/mpɛsɔ = {daily*7} bapɛtɛ.\nNa {period} mpɛsɔ, bɔngɔ ya bapɛtɛ oyo bazua mabɛnda na {facility} ezali {daily*7} bapɛtɔ/mpɛsɔ * {period} mpɛsɔ = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} bapɛtɛ, oyo moko moko ezali na {item} moko.\nSoki ezalaki {total-int(total*frac)} {item} oyo ezali mpepɛ te na {facility} liboso ya mabɛda moko, bɔngɔ ekomɛna {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item} oyo ezali mpepɛ te.\n#### {total - (total * frac + daily * period * 7)}\n"
