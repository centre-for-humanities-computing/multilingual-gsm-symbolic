question = "Hôpital eza na kapasité ya 1000 litó na 1/5 eza mpepɛ. Na mboka ya epandémie ya coronavirus, 50 bapɛtɛ bazua mabɛnda na hôpital na mokɔlɔ mosusu. Kobɔngisa bɔngɔ ya litó oyo ezali mpepɛ te na hôpital na 2 mpɛsɔ."
answer = "Soki 1/5 ya kapasité ya hôpital litó eza mpepɛ, ezali koloba 1/5 * 1000 = <<1000*1/5=200>>200 litó ezali na bapɛtɛ.\nBɔngɔ ya litó na hôpital toli mabɛda moko te ezali 1000 litó - 200 litó = <<1000-200=800>>800 litó.\nSoki 50 bato bazua mabɛnda na mokɔlɔ mosusu, bɔngɔ ya bapɛtɛ na hôpital na mpɛsɔ moko ezali 50 bapɛtɔ/mokɔlɔ * 7 mokɔlɔ/mpɛsɔ = 350 bapɛtɛ.\nNa 2 mpɛsɔ, bɔngɔ ya bapɛtɛ oyo bazua mabɛnda na hôpital ezali 350 bapɛtɔ/mpɛsɔ * 2 mpɛsɔ = <<350*2=700>>700 bapɛtɛ, oyo moko moko ezali na litó moko.\nSoki ezalaki 800 litó oyo ezali mpepɛ te na hôpital liboso ya mabɛda moko, bɔngɔ ekomɛna 800 litó - 700 litó = <<800-700=100>>100 litó oyo ezali mpepɛ te.\n#### 100\n"
