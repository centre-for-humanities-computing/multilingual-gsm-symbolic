question = "Moko aye na stand ya limbe na Mokeli ya limbe. Asaleli mitano ya limbe: limbe ya mpasi, limbe ya petunia mpe limbe ya begonia. Azali kosalisa limbe ya mpasi na $2.74 na konete, limbe ya petunia na $1.87 na konete mpe limbe ya begonia na $2.12 na konete. Moko azali na monyoko te lelo, mpe abongolaki misala ya ye na dollar ya pene. Soki Moko asaleli 12 konete ya limbe ya mpasi, 9 konete ya limbe ya petunia mpe 17 konete ya limbe ya begonia, azali kosala ngai?"
