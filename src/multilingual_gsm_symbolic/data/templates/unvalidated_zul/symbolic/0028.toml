question = "Ibhedlela linomthamo we-1000 ibhedi ngokuthi 1/5 agcwele. Ngenxa ye-bhubhane le-coronavirus, 50 zezigulane zafakwa ku-ibhedlela nsuku zonke. Bala inani eliphelele le-ibhedi ezingagcwele ku-ibhedlela ngemuva kwe-2 amasonto."
answer = "Uma 1/5 yomthamo ophelele we-ibhedlela we-ibhedi egcwele, lokhu kusho ukuthi 1/5 * 1000 = <<1000*1/5=200>>200 ibhedi zisetshenziswa yizigulane.\nInani eliphelele le-ibhedi ku-ibhedlela ngaphandle kokufakwa okusha kungu 1000 ibhedi - 200 ibhedi = <<1000-200=800>>800 ibhedi.\nUma abantu abangu-50 befakwa nsuku zonke, inani eliphelele lezimpulane ku-ibhedlela ngemuva kwesonto elilodwa lingu 50 izigulane/ngosuku * 7 izinsuku/isonto = 350 izigulane.\nNgemuva kwe-2 amasonto, inani eliphelele lezimpulane ezifakiwe ku-ibhedlela lingu 350 izigulane/isonto * 2 amasonto = <<350*2=700>>700 izigulane, lapho ngamunye esebenzisa ibhedi eyodwa.\nUma bekukhona 800 ibhedi ezingagcwele ku-ibhedlela ngaphambi kokufakwa okusha, inani eliphelele liyancipha libe 800 ibhedi - 700 ibhedi = <<800-700=100>>100 ibhedi ezingagcwele.\n#### 100\n"
