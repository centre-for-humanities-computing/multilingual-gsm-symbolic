answer_annotated = "Uma {frac} yomthamo ophelele we-{facility} we-{item} egcwele, lokhu kusho ukuthi {frac} * {total} = <<{total}*{frac}={int(total*frac)}>>{int(total*frac)} {item} zisetshenziswa yizigulane.\nInani eliphelele le-{item} ku-{facility} ngaphandle kokufakwa okusha kungu {total} {item} - {int(total*frac)} {item} = <<{total}-{int(total*frac)}={total-int(total*frac)}>>{total-int(total*frac)} {item}.\nUma abantu abangu-{daily} befakwa nsuku zonke, inani eliphelele lezimpulane ku-{facility} ngemuva kwesonto elilodwa lingu {daily} izigulane/ngosuku * 7 izinsuku/isonto = {daily*7} izigulane.\nNgemuva kwe-{period} amasonto, inani eliphelele lezimpulane ezifakiwe ku-{facility} lingu {daily*7} izigulane/isonto * {period} amasonto = <<{daily*7}*{period}={daily*period*7}>>{daily*period*7} izigulane, lapho ngamunye esebenzisa {item} eyodwa.\nUma bekukhona {total-int(total*frac)} {item} ezingagcwele ku-{facility} ngaphambi kokufakwa okusha, inani eliphelele liyancipha libe {total-int(total*frac)} {item} - {daily*period*7} {item} = <<{total-int(total*frac)}-{daily*period*7}={total - (total * frac + daily * period * 7)}>>{total - (total * frac + daily * period * 7)} {item} ezingagcwele.\n#### {total - (total * frac + daily * period * 7)}\n"
