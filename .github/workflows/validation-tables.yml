name: Validation tables

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate tables
        run: |
          python src/scripts/update_readme_table.py
          python paper/update_language_table.py
      - name: Check tables are up to date
        run: |
          if ! git diff --exit-code -- README.md paper/language_validation.tex; then
            echo "::error::Validation tables are out of date. Run 'python src/scripts/update_readme_table.py && python paper/update_language_table.py' and commit the result."
            exit 1
          fi
