# This workflow builds the Hugging Face dataset from the generated files in dataset/ of a release and pushes it to
# https://huggingface.co/datasets/danish-foundation-models/multilingual-gsm-symbolic, tagged with the release version.
# Only the marked parts of the dataset card are updated (see src/scripts/build_hf_dataset.py).
#
# It runs as part of the release workflow, and can be run manually to (re)publish an existing release.
#
# It requires a Hugging Face token with write access to the dataset stored as the `HF_TOKEN` secret.

name: Publish dataset

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HF_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency: publish-dataset
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # hatch-vcs reads the package version from the tag

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build and push to Hugging Face
        run: uv run src/scripts/build_hf_dataset.py push --out build/hf_dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
